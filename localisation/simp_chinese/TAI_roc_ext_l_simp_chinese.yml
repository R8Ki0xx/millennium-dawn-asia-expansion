l_simp_chinese:
 TAI_x_g1:0 "选举委员会常设化"
 TAI_x_g1_desc:0 "首届全国大选之后，临时的选务机构终于变成了依法设置、预算独立的常设委员会：选民登记、选区划分、开票监督，都有了固定的人和固定的程序。"
 TAI_x_g2a:0 "政治献金法与竞选经费公开"
 TAI_x_g2a_desc:0 "企业与个人对政党和候选人的捐款设定上限，并要求在网上逐笔公开。第一个被曝光的大额捐款人，是一位多年的老朋友。"
 TAI_x_g2b:0 "公职人员财产申报"
 TAI_x_g2b_desc:0 "部长、法官与民意代表每年申报财产，并交由独立机构核查。申报表第一次公布的那天，新闻编辑室里整夜没有人下班。"
 TAI_x_g2c:0 "政党补助与党内民主"
 TAI_x_g2c_desc:0 "政党按得票获得公费补助，条件是党内候选人必须经过党员投票产生。几个老牌政党第一次发现，党主席的位子也要靠选票。"
 TAI_x_g3a:0 "独立选区划分委员会"
 TAI_x_g3a_desc:0 "选区的划分不再由执政党说了算，而是由学者、法官与公民代表组成的委员会，按人口与地理公开划定。"
 TAI_x_g3b:0 "廉政署"
 TAI_x_g3b_desc:0 "一个直接对议会负责、拥有调查与起诉权的廉政机关。头三年里，它办的案子比此前三十年的总和还多。"
 TAI_x_g3c:0 "青年参政与学生议会"
 TAI_x_g3c_desc:0 "投票年龄降至十八岁，大学里设立学生议会，青年可以带薪请假竞选公职。第一批二十几岁的议员，让议场里的平均年龄一下子降了十岁。"
 TAI_x_g4:0 "选举争议法庭与公开透明"
 TAI_x_g4_desc:0 "选举结果的争议由专门的法庭在三十日内裁决，选票的影像与计票表一律公开。落选者第一次在认输的演说里说：“我相信这个结果。”"
 TAI_x_g5a:0 "内阁可解散国会"
 TAI_x_g5a_desc:0 "内阁在失去国会信任时可以提请解散国会、重新改选，使政局僵持时有一条回到选民手上的出口。完成这项国策之后，各党立刻要求举行一次新的大选。"
 TAI_x_g5b:0 "固定任期与宪法保障"
 TAI_x_g5b_desc:0 "国会与政府的任期写进宪法，除非修宪不得缩短。政局的节奏从此由日历而不是由谈判桌决定。"
 TAI_x_g6:0 "地方自治法全面修订"
 TAI_x_g6_desc:0 "省、市、县的职权与财政来源重新划分。市长们第一次在中央面前不是申请者，而是谈判者。"
 TAI_x_g7:0 "国是会议常态化"
 TAI_x_g7_desc:0 "每两年一次的国是会议，由各党、各省、工会、企业与公民团体共同参加，成为连接选举与选举之间的第二条通道。"
 TAI_x_s1:0 "人口普查与统计现代化"
 TAI_x_s1_desc:0 "一个国家的问题，要先量得出来。统计局重新抽样、重新定义失业与贫困，数字难看了许多，政策也终于有了依据。"
 TAI_x_s2a:0 "告别计划生育"
 TAI_x_s2a_desc:0 "实行了几十年的生育限制被正式废止。户口册上许多没有名字的孩子，终于登记了下来。"
 TAI_x_s2b:0 "全民长期照护制度"
 TAI_x_s2b_desc:0 "失能与高龄者的照护纳入公共保险，由社区、医院与家庭共同承担。许多人第一次不必在工作与照顾父母之间二选一。"
 TAI_x_s2c:0 "租屋市场整顿与住房补助"
 TAI_x_s2c_desc:0 "租约有了标准契约，房东不能无故涨租，低收入家庭得到租金补助。城市里的合租床位，第一次开始变得便宜。"
 TAI_x_s3a:0 "生育津贴与公共托育"
 TAI_x_s3a_desc:0 "每个新生儿都有津贴，社区托育所按收入分级收费。年轻夫妇的账本上，“孩子”不再是最大的一笔赤字。"
 TAI_x_s3b:0 "银发经济与延迟退休弹性制"
 TAI_x_s3b_desc:0 "退休年龄改为弹性制：愿意继续工作的人可以领更多，需要休息的人可以早退。老年人成了一个值得认真对待的消费市场。"
 TAI_x_s3c:0 "青年首购住宅计划"
 TAI_x_s3c_desc:0 "政府提供低息贷款与共有产权，三十岁以下的首购者可以以一半的头期款买下第一套房。工地上的塔吊又多了一批。"
 TAI_x_s4:0 "家庭友善的社会"
 TAI_x_s4_desc:0 "托育、长照、住房与退休制度互相衔接，一个家庭从孩子出生到老人终老，都有可以依靠的制度。"
 TAI_x_s5a:0 "食品药品安全署"
 TAI_x_s5a_desc:0 "食品与药品的审批、抽检与召回由一个独立的机构负责，处罚金额与企业营业额挂钩。几个大品牌第一次认真地读完了检验报告。"
 TAI_x_s5b:0 "中产阶级税负调整"
 TAI_x_s5b_desc:0 "家庭抚养、教育与医疗支出可以抵税，累进税率的级距重新划分。中产阶级第一次觉得，国家是站在自己这一边的。"
 TAI_x_s6:0 "灾害防救与应急管理体系"
 TAI_x_s6_desc:0 "防灾署、气象署与地方消防整合为统一的应急体系，每个社区都有避难所与演练日。下一次台风来的时候，人们知道该往哪里走。"
 TAI_x_s7:0 "全民终身学习"
 TAI_x_s7_desc:0 "每个公民都有终身学习账户，可以用来支付进修、转职培训与第二专长。四十岁的工人重新回到教室，已经不再是新闻。"
 TAI_x_m1:0 "国防二法与文人领军"
 TAI_x_m1_desc:0 "国防组织法与国防部组织法明确规定：国防部长由文人担任，军令与军政分立，军队向国会而不是向任何个人负责。"
 TAI_x_m2a:0 "兵役制度改革"
 TAI_x_m2a_desc:0 "役期、役种与补贴全面检讨，征募的规则不再是一纸命令，而是一套征求公民意见的制度。"
 TAI_x_m2b:0 "军事检察与军法改革"
 TAI_x_m2b_desc:0 "军人犯罪的审判一律移交普通法院，军事检察只处理战时与纯军事的案件。军营里终于有了申诉的信箱。"
 TAI_x_m2c:0 "退伍军人事务部"
 TAI_x_m2c_desc:0 "退役军人的医疗、就业、住房与抚恤统一由一个部门负责。老兵们不必再一个窗口一个窗口地排队。"
 TAI_x_m3a:0 "志愿役为主的兵制"
 TAI_x_m3a_desc:0 "以志愿役为核心，辅以短期义务役与完善的后备制度。军队小了一些，但每个人都知道自己为什么站在那里。"
 TAI_x_m3b:0 "军事司法独立"
 TAI_x_m3b_desc:0 "军事法官由司法体系任命，终身任职，不受指挥官干预。几起老案被翻出来重审，将军们的表情很复杂。"
 TAI_x_m3c:0 "荣民医院与再就业辅导"
 TAI_x_m3c_desc:0 "荣民医院全面升级，退伍军人可优先接受职业训练与公职考试加分。退伍，不再意味着重新开始。"
 TAI_x_m4:0 "国防预算透明化"
 TAI_x_m4_desc:0 "国防预算按项目逐年向国会报告，机密部分由小组委员会审议。采购案里的惯例，第一次有了需要解释的理由。"
 TAI_x_m5a:0 "国防科学院"
 TAI_x_m5a_desc:0 "整合散落在各军种与研究所里的研发力量，成立一所对外有限度开放的国防科学院。研究人员终于不必在三个单位之间挂名。"
 TAI_x_m5b:0 "国家情报整合中心"
 TAI_x_m5b_desc:0 "各情报机关的资料汇入同一个中心，由国会情报委员会监督。互相藏着情报的惯例，终于被打破了。"
 TAI_x_m6:0 "全民防卫动员体系"
 TAI_x_m6_desc:0 "动员不再只是军方的事：交通、医疗、通信与民间企业按预案演练，每年举行一次全国性的联合演习。"
 TAI_x_m7:0 "联合作战指挥部"
 TAI_x_m7_desc:0 "陆海空与后勤、情报、网络力量编入同一个指挥体系，战时由一名联合指挥官统一调度。军种之间的壁垒，被一张共同的作战地图取代。"
 TAI_x_c1:0 "中央研究院重建"
 TAI_x_c1_desc:0 "中央研究院在南京与台北两地同时运作，院士会议第一次由两岸学者共同召开。基础研究有了一个称得上“国家队”的地方。"
 TAI_x_c2a:0 "国家实验室网络"
 TAI_x_c2a_desc:0 "把分散在高校与研究所里的大型设备整合为向全国开放的实验室网络，预约系统的第一周就被订满。"
 TAI_x_c2b:0 "基础科学基金"
 TAI_x_c2b_desc:0 "一笔不问成果、只问好奇心的长期基金。第一年资助的申请里，有三分之一是评审们看不懂的题目。"
 TAI_x_c2c:0 "产学研合作园区"
 TAI_x_c2c_desc:0 "高校、研究所与企业共用园区，专利归属与收益分享有了标准合同。教授们开始带着公司章程去开会。"
 TAI_x_c3a:0 "量子与新材料"
 TAI_x_c3a_desc:0 "量子通信、超导与石墨烯被列入国家重点计划，实验室的墙上贴着时间表，而不是口号。"
 TAI_x_c3b:0 "人工智能国家战略"
 TAI_x_c3b_desc:0 "语言、视觉与决策系统的研究，由国家算力平台统一供给。伦理委员会第一次开会就吵了三个小时。"
 TAI_x_c3c:0 "生物技术与医药走廊"
 TAI_x_c3c_desc:0 "从南京到新竹，一条生技与医药的产业走廊形成：疫苗、基因检测与精准医疗，各有各的实验场。"
 TAI_x_c4:0 "创新型国家"
 TAI_x_c4_desc:0 "研发占国民收入的比例首次超过三个百分点，专利的数量不再被当作政绩，而是被当作成本来审视。"
 TAI_x_c5:0 "世界级研究型大学"
 TAI_x_c5_desc:0 "十所大学获得长期的专项经费与学术自主权，教授的聘任与升等由同行评议而不是由行政主管决定。国际排名榜上，终于出现了几个熟悉的名字。"
 TAI_x_u1:0 "文化部与文化基本法"
 TAI_x_u1_desc:0 "文化事务第一次有了自己的部会与基本法：保障创作自由，也保障文化遗产与语言的多样性。"
 TAI_x_u2a:0 "华语影视振兴"
 TAI_x_u2a_desc:0 "两岸的电影、电视与网络剧集合拍成为常态，审查被分级制取代。华语片第一次不靠补贴，就在全世界的院线里卖出了票。"
 TAI_x_u2b:0 "公共广电集团"
 TAI_x_u2b_desc:0 "公共电视与广播不隶属于任何政党或政府部门，董事由议会各党派共同推荐。夜间新闻里，第一次出现了对执政党的整段批评。"
 TAI_x_u3a:0 "古籍与文物数位保存"
 TAI_x_u3a_desc:0 "两岸故宫的藏品、方志与档案全部数位化，并向全世界免费开放。一位日本的学者在网上读到了她找了二十年的一份手稿。"
 TAI_x_u3b:0 "文学与出版奖助"
 TAI_x_u3b_desc:0 "设立不看销量的文学与出版奖助，保障小型书店与独立出版社的生存。城里的书店，开始亮灯到半夜。"
 TAI_x_u4:0 "文化外交与华语圈"
 TAI_x_u4_desc:0 "孔子的《论语》与金庸的小说，同时出现在世界各地的书架上。华语不再只是一门语言，而是一个想象力的共同体。"
 TAI_x_d1:0 "朝鲜半岛政策"
 TAI_x_d1_desc:0 "半岛的安定关系到东北的安全：政策不再只是“抵制”或“放任”，而是一套有层次的接触、威慑与合作。"
 TAI_x_d2a:0 "对朝接触与粮食援助"
 TAI_x_d2a_desc:0 "以粮食与医药换取边境的安定与对话渠道。援助物资的每一个包装上，都印着收货的地点与数量。"
 TAI_x_d2b:0 "中韩自由贸易协定"
 TAI_x_d2b_desc:0 "关税、投资规则与服务业准入大幅放宽。首尔的汽车与南京的电子，终于出现在同一个货柜里。"
 TAI_x_d3a:0 "半岛无核化倡议"
 TAI_x_d3a_desc:0 "提出分阶段、可核查、互相保证的无核化路径，邀请联合国与有关国家共同参与。谈判桌上，第一次多了一把椅子。"
 TAI_x_d3b:0 "青年交流与文化往来"
 TAI_x_d3b_desc:0 "学分互认、交换学生与联合制作的综艺节目，把一代人变成了彼此的熟人。热门的外语选修课，从英语变成了韩语和汉语。"
 TAI_x_d4:0 "东北亚和平机制"
 TAI_x_d4_desc:0 "中、日、韩与有关各方建立常设的安全对话与危机热线，设立联合的灾害与海上搜救机制。这个机制从未解决过什么大问题，却让许多小问题没有变大。"
 TAI_x_o1:0 "大洋洲伙伴关系"
 TAI_x_o1_desc:0 "澳洲、新西兰与太平洋岛国，是通向南太平洋的门廊。外交部第一次为这个方向单独成立了司。"
 TAI_x_o2a:0 "澳新自由贸易协定"
 TAI_x_o2a_desc:0 "矿产、农产品与教育服务的关税逐步归零。澳洲的铁矿砂与南京的钢铁厂之间，多了一份五年期的长约。"
 TAI_x_o2b:0 "太平洋海底光缆与渔业合作"
 TAI_x_o2b_desc:0 "新的海底光缆连接岛国，渔业协定设立共同的资源管理与观察员制度。岛国的渔民第一次在上岸时，有了自己的冷链。"
 TAI_x_o3:0 "太平洋岛国论坛"
 TAI_x_o3_desc:0 "正式参加太平洋岛国论坛的对话，成为区域气候、海洋与发展议题的伙伴。岛国的代表团里，出现了会说中文的外交官。"
 TAI_x_elec_commission:0 "常设选举委员会"
 TAI_x_elec_commission_desc:0 "选举由一个有固定预算的机构来办，各党对程序的争吵少了。"
 TAI_x_integrity_agency:0 "廉政署"
 TAI_x_integrity_agency_desc:0 "一个人人都有可能被查的地方，办事的规矩就清楚了。"
 TAI_x_clean_elections:0 "公开透明的选举"
 TAI_x_clean_elections_desc:0 "选票与计票表公开，落选者也愿意接受结果。"
 TAI_x_dissolution:0 "内阁解散权"
 TAI_x_dissolution_desc:0 "政局僵持时可以回到选民手上，也让政府更容易陷入选举的节奏。"
 TAI_x_fixed_terms:0 "固定任期"
 TAI_x_fixed_terms_desc:0 "任期由宪法保障，政局的节奏变得可预期。"
 TAI_x_consultative:0 "国是会议"
 TAI_x_consultative_desc:0 "选举之间多了一条各方坐下来谈话的渠道。"
 TAI_x_pop_policy_shift:0 "生育政策转向"
 TAI_x_pop_policy_shift_desc:0 "社会开始鼓励生育，而不是限制生育。"
 TAI_x_long_term_care:0 "长期照护"
 TAI_x_long_term_care_desc:0 "照护的成本由全社会分担，也占去了一部分民生产能。"
 TAI_x_family_friendly:0 "家庭友善的社会"
 TAI_x_family_friendly_desc:0 "一个人从出生到终老，都有可以依靠的制度。"
 TAI_x_disaster_ready:0 "防灾型社会"
 TAI_x_disaster_ready_desc:0 "灾后重建的速度快了，人们对政府也更放心。"
 TAI_x_lifelong:0 "终身学习"
 TAI_x_lifelong_desc:0 "劳动力不断更新技能，转型的阵痛少了一些。"
 TAI_x_civ_control:0 "文人领军"
 TAI_x_civ_control_desc:0 "军队向国会负责，政变不再是一个可能的选项。"
 TAI_x_volunteer_army:0 "志愿役为主的军队"
 TAI_x_volunteer_army_desc:0 "士兵训练得更久、更专业，但数量不如过去。"
 TAI_x_def_budget:0 "透明的国防预算"
 TAI_x_def_budget_desc:0 "采购有了理由，浪费少了。"
 TAI_x_intel_center:0 "情报整合"
 TAI_x_intel_center_desc:0 "情报机关不再各自为政。"
 TAI_x_total_defense:0 "全民防卫"
 TAI_x_total_defense_desc:0 "社会各个部门都知道战时该做什么。"
 TAI_x_joint_command:0 "联合作战指挥"
 TAI_x_joint_command_desc:0 "各军种共用一张作战地图。"
 TAI_x_academia:0 "新中央研究院"
 TAI_x_academia_desc:0 "基础研究有了稳定的家。"
 TAI_x_biotech:0 "生技医药走廊"
 TAI_x_biotech_desc:0 "疫苗、基因检测与精准医疗在一条走廊里生长。"
 TAI_x_innovation_nation:0 "创新型国家"
 TAI_x_innovation_nation_desc:0 "创新成了经济增长的第一动力。"
 TAI_x_film:0 "华语影视"
 TAI_x_film_desc:0 "电影与剧集成了软实力的一部分。"
 TAI_x_soft_power:0 "华语圈"
 TAI_x_soft_power_desc:0 "文化让别人愿意先听你说。"
 TAI_x_ne_asia_peace:0 "东北亚和平机制"
 TAI_x_ne_asia_peace_desc:0 "常设的对话让误判少了许多。"
