 SYR_dec_terror_amnesty:0 "招安温和派武装"
 SYR_dec_terror_amnesty_desc:0 "向愿意放下武器的地方武装提供赦免与重建资金，把他们和圣战者切割开。\n当前恐怖主义指数：§R[?global.SYR_terror_index|0]§!。"
 SYR_dec_terror_border:0 "封锁边境走廊"
 SYR_dec_terror_border_desc:0 "封死外籍圣战者与武器流入的边境走廊。需要大量兵力长期值守。\n当前恐怖主义指数：§R[?global.SYR_terror_index|0]§!。"
 SYR_dec_terror_crackdown:0 "清剿极端据点"
 SYR_dec_terror_crackdown_desc:0 "集中兵力清剿圣战者的据点与补给线。代价是平民与地方武装的不满。\n当前恐怖主义指数：§R[?global.SYR_terror_index|0]§!。"
 SYR_dec_terror_recruit:0 "扩大圣战招募"
 SYR_dec_terror_recruit_desc:0 "向各地的圣战网络与外籍战士发出号召。兵员会增加，但极端化也会加深，让 ISIS 离爆发更近。\n当前恐怖主义指数：§R[?global.SYR_terror_index|0]§!。"
