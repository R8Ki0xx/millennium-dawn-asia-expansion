 SYR_t_tick75:0 "75"
 SYR_t_title:0 "极端化指数　§R[?global.SYR_terror_index|0]§! / 100"
 SYR_terror.1.a:0 "强硬清剿，不留余地"
 SYR_terror.1.b:0 "谈判招安，分化瓦解"
 SYR_terror.1.c:0 "眼下顾不上，暂不理会"
 SYR_terror.1.d:0 "内战打破了叙利亚的权力平衡，政府控制不到的地区越来越多。圣战者在无人管辖的乡村建立了训练营，向当地人发放救济与武器，并从邻国招募外籍战士。\n\n情报部门警告，如果再放任下去，这些零散的武装会合流成一股真正的力量。当前恐怖主义指数：§R[?global.SYR_terror_index|0]§!/100。"
 SYR_terror.1.t:0 "极端组织坐大"
 SYR_terror.2.a:0 "集中力量全面围剿"
 SYR_terror.2.b:0 "封锁边境，切断补给"
 SYR_terror.2.c:0 "把他们留给对手去对付"
 SYR_terror.2.d:0 "来自四面八方的外籍战士正经边境涌入叙利亚与伊拉克的交界地带，他们带来资金、武器和极端主义的宣传手册。当地几支武装已经宣誓效忠同一个领袖。\n\n这已经不是普通的叛乱了。当前恐怖主义指数：§R[?global.SYR_terror_index|0]§!/100，再不遏制，他们很快就会宣布建国。"
 SYR_terror.2.t:0 "圣战者越境"
 SYR_terror.3.a:0 "又一个危险的对手"
 SYR_terror.3.d:0 "一支极端武装突然占领了叙利亚东部与伊拉克西部的大片地区，宣布成立“伊斯兰国”。内战的混乱与长期积累的极端化，终于让这股势力冲破了压制。\n\n邻国与大国纷纷发表声明谴责，地区局势随之剧变。"
 SYR_terror.3.t:0 "伊斯兰国宣布成立"
 SYR_terror.4.a:0 "内战进入新阶段"
 SYR_terror.4.d_fsa:0 "老阿萨死后的权力斗争终于失控。以叛变军官与流亡政客为核心的反对派在大马士革周边聚集，打出了“自由叙利亚军”的旗号，要求结束阿萨家族的统治。\n\n政府宣布这是外国势力煽动的叛乱，但很多士兵正在悄悄交出武器。"
 SYR_terror.4.d_nus:0 "被政府压制的萨拉菲网络没有就范。在伊德利卜一带，一支信奉萨拉菲圣战主义的武装宣布成立“努斯拉阵线”，向政权宣战。\n\n他们不接受任何世俗政治方案，也拒绝与其他反对派合作。"
 SYR_terror.4.t_fsa:0 "叛军以“自由叙利亚军”之名起事"
 SYR_terror.4.t_nus:0 "萨拉菲武装以“努斯拉阵线”之名起事"
 SYR_terror.5.a:0 "战场更加复杂了"
 SYR_terror.5.d:0 "内战头几个月，叙利亚的叛军以各自的旗号作战，大批军官与地方领袖趁乱出走。如今在大马士革周边与伊德利卜一带，两支新的武装相继宣布成立：以叛变军官为主的“自由叙利亚军”，和奉行萨拉菲主义的“努斯拉阵线”。\n\n它们既与政府为敌，也与最早起事的叛军争夺地盘。战场从此不再是两方对阵。"
 SYR_terror.5.t:0 "多方混战：新的武装冒了出来"
 SYR_terror.6.a:0 "派系格局已经形成"
 SYR_terror.6.d_fsa:0 "努斯拉阵线的强硬路线让许多地方指挥官难以接受。一批叛变军官与流亡政客在大马士革周边聚集，宣布成立“自由叙利亚军”，主张结束内战后举行自由选举。\n\n它既反对政府，也拒绝承认努斯拉阵线的权威。"
 SYR_terror.6.d_nus:0 "自由叙利亚军内部的分歧终于公开。一批不满温和路线的战士带着武器离开，在伊德利卜一带宣布成立萨拉菲圣战武装“努斯拉阵线”。\n\n它拒绝服从自由叙利亚军的指挥，并开始自行招募外籍战士。"
 SYR_terror.6.t_fsa:0 "温和派脱出：自由叙利亚军成立"
 SYR_terror.6.t_nus:0 "极端派脱出：努斯拉阵线成立"
 SYR_terror_category:0 "内战与反恐"
 SYR_terror_category_desc:0 "内战拖得越久、国家越分裂，极端组织就越容易坐大。指数达到 §R100§! 时，伊斯兰国（ISIS）将在叙利亚东部与伊拉克西部爆发。上面的面板显示指数、本月变动明细与各势力对叙利亚的控制。"
