 SYR_t_stage_line:0 "阶段：[SYR_t_stage_name]　—　[SYR_t_stage_desc]"
 SYR_t_stagedesc_0:0 "内战刚刚开始，极端组织还只是边缘力量。"
 SYR_t_stagedesc_1:0 "无人管辖的乡村里出现了训练营与外籍战士。"
 SYR_t_stagedesc_2:0 "各地武装开始合流，指数再涨就会出大事。"
 SYR_t_stagedesc_3:0 "一场宣布“建国”的攻势随时可能发动。"
 SYR_t_stagedesc_4:0 "极端武装已占领大片领土并宣布建国。"
 SYR_t_stagedesc_5:0 "恐怖主义指数回落，但极端主义的土壤还在。"
