l_simp_chinese:
 SYR2_air_defence_reform_idea:0 "防空部队改组"
 SYR2_air_defence_reform_idea_desc:0 "防空部队从空军里独立出来，拥有自己的雷达网和指挥链。雷达站不再只是首都的摆设。"
 SYR2_arab_union_idea:0 "阿拉伯联盟的重生"
 SYR2_arab_union_idea_desc:0 "“阿拉伯联合共和国”的旗帜再次升起：统一的外交、统一的军队与统一的货币。理想主义者热泪盈眶，官僚们则开始头疼合并后的预算。"
 SYR2_capital_defence_idea:0 "首都防务"
 SYR2_capital_defence_idea_desc:0 "环绕大马士革的第二道防线已经成形：加固的据点、地下指挥所和与共和国卫队联动的机动预备队。"
 SYR2_cement_industry_idea:0 "水泥与建材工业"
 SYR2_cement_industry_idea_desc:0 "新的水泥窑和预制件工厂让重建不必再等进口。建筑业成为就业最多、见效最快的行业。"
 SYR2_commercial_bank_idea:0 "叙利亚商业银行改制"
 SYR2_commercial_bank_idea_desc:0 "国有的叙利亚商业银行引入商业化的信贷审批和外部审计。呆账被曝光，但新的贷款终于流向了真正能还款的企业。"
 SYR2_construction_reform_idea:0 "建筑行业改革"
 SYR2_construction_reform_idea_desc:0 "统一的建筑规范、透明的招标和对承包商资质的审查，压缩了层层转包的利润，工程的质量和速度都有了起色。"
 SYR2_defence_ministry_idea:0 "国防部改革"
 SYR2_defence_ministry_idea_desc:0 "国防部不再只是将军们的社交俱乐部：采购、训练与后勤各有一名文官次长，每笔预算都要附带说明。"
 SYR2_energy_ministry_idea:0 "统一的能源部"
 SYR2_energy_ministry_idea_desc:0 "电力、石油、天然气原本分属四个部门，互相推诿。统一的能源部有了唯一的预算和唯一的责任人，停电的账终于可以算清楚。"
 SYR2_gas_company_idea:0 "叙利亚天然气公司"
 SYR2_gas_company_idea_desc:0 "国家天然气公司接管了分散的气田与处理厂，统一采购、统一定价，也终于有了与外国承包商谈判的底气。"
 SYR2_golan_fortress_idea:0 "戈兰要塞带"
 SYR2_golan_fortress_idea_desc:0 "从赫尔蒙山脚到雅尔穆克河谷，混凝土碉堡、反坦克壕与观察哨连成一线。守住这条线，是叙利亚军队从未放弃的使命。"
 SYR2_green_syria_idea:0 "“绿色叙利亚”计划"
 SYR2_green_syria_idea_desc:0 "从帕尔米拉的沙漠到幼发拉底河谷，光伏板一排排地立起来。能源独立不再只是口号，也成了出口欧洲电力的筹码。"
 SYR2_gulf_capital_idea:0 "海湾资本"
 SYR2_gulf_capital_idea_desc:0 "卡塔尔与阿联酋的控股公司在大马士革设立总部，投资于酒店、物流与房地产。"
 SYR2_islamic_bank_idea:0 "首家伊斯兰银行"
 SYR2_islamic_bank_idea_desc:0 "不收利息、按利润分成的银行吸引了海湾的资金，也吸引了此前不愿把钱放进国有银行的虔诚储户。"
 SYR2_israeli_intel_idea:0 "与摩萨德的联络"
 SYR2_israeli_intel_idea_desc:0 "反恐情报的交换让两国的安全部门第一次坐在同一张桌子旁。有人称之为现实主义，也有人称之为背叛。"
 SYR2_minorities_legion_idea:0 "亚述军团"
 SYR2_minorities_legion_idea_desc:0 "以基督徒与亚述人为主的地方部队承担边境巡逻与村镇防务，成为政府在东北部的“自己人”。"
 SYR2_nuclear_deterrent_idea:0 "叙利亚核威慑"
 SYR2_nuclear_deterrent_idea_desc:0 "核计划的成功让大马士革在谈判桌上多了一张谁也无法忽视的牌，也让整个地区的情报机构都把目光转向了这个国家。"
 SYR2_pal_camps_idea:0 "巴勒斯坦训练营"
 SYR2_pal_camps_idea_desc:0 "大马士革郊外的训练营接收来自各个派别的青年。叙利亚军官从这里得到实战经验，也得到一笔难以向外界解释的账目。"
 SYR2_pipeline_idea:0 "跨境输气管线"
 SYR2_pipeline_idea_desc:0 "管线穿过的不只是沙漠，还有政治：每一个阀门都有人盯着。收入稳定，但谁关阀门，谁就握着叙利亚的钱袋。"
 SYR2_quds_brigade_idea:0 "圣城旅"
 SYR2_quds_brigade_idea_desc:0 "由巴勒斯坦难民子弟组成的叙利亚特种旅。他们对家乡的执念，是最好的士气来源，也是最危险的政治变量。"
 SYR2_riot_police_idea:0 "防暴警察的新装备"
 SYR2_riot_police_idea_desc:0 "头盔、盾牌与催泪弹让街头治安更有秩序，也让镇压变得更加有效。"
 SYR2_securities_exchange_idea:0 "大马士革证券交易所"
 SYR2_securities_exchange_idea_desc:0 "开市钟声敲响后，几十家公司的股票第一次公开挂牌。交易额不大，但“上市”这个词，让私营企业主第一次觉得自己的财产不再只是政治关系的一部分。"
 SYR2_shia_militias_idea:0 "什叶派民兵"
 SYR2_shia_militias_idea_desc:0 "来自伊拉克、黎巴嫩与阿富汗的志愿者在叙利亚的各条战线上作战，工资与武器由德黑兰提供。"
 SYR2_special_forces_idea:0 "新建特种部队"
 SYR2_special_forces_idea_desc:0 "从共和国卫队与空降兵里挑出的最好的军官，在霍姆斯组成了一支独立的特种部队，直接听命于总参谋部。"
 SYR2_uae_specialists1_idea:0 "高级培训计划"
 SYR2_uae_specialists1_idea_desc:0 "培训计划升级为联合军官学院，每年一批军官被送往海湾和欧洲深造。"
 SYR2_uae_specialists_idea:0 "阿联酋的外籍专家"
 SYR2_uae_specialists_idea_desc:0 "阿联酋雇来的前西方军官与工程师，在大马士革郊外的培训基地里传授现代军队的管理方法。"
 SYR_PLA_support:0 "支持巴解军"
 SYR_PLA_support_desc:0 "巴勒斯坦解放军是叙利亚军队的一部分，也是叙利亚影响巴勒斯坦政治的工具。扩编与换装的命令从国防部发出，附带的条件写在另一份文件里。"
 SYR_al_douri_support:0 "支持杜里派系"
 SYR_al_douri_support_desc:0 "前复兴党的旧人在大马士革得到了庇护。叙利亚用金钱与武器，换取这些人对巴格达政治的影响力。"
 SYR_approach_bahrain:0 "接近巴林"
 SYR_approach_bahrain_desc:0 "巴林是海湾国家里最愿意与叙利亚做生意的小国。金融中心的银行家邀请叙利亚同行去麦纳麦考察。"
 SYR_approach_pakistan:0 "接近巴基斯坦"
 SYR_approach_pakistan_desc:0 "伊斯兰堡与大马士革签订了军官培训与反恐合作的协议。巴基斯坦把叙利亚看成通向阿拉伯世界的另一扇门。"
 SYR_approach_uae:0 "接近阿联酋"
 SYR_approach_uae_desc:0 "阿布扎比愿意在没有政治条件的前提下与叙利亚合作。一场友好访问之后，双方互设了商务代表处。"
 SYR_army_bunker:0 "加固首都"
 SYR_army_bunker_desc:0 "历史告诉叙利亚的统治者：谁守住了大马士革，谁就守住了国家。总参谋部批准了围绕首都的纵深防御方案。"
 SYR_army_minobr:0 "国防部改革"
 SYR_army_minobr_desc:0 "各军种的改革都已落地，最后要整顿的是国防部自己：采购、训练、后勤三条线由文官次长分管，预算每季度向总统府汇报。"
 SYR_army_pvo:0 "改组防空部队"
 SYR_army_pvo_desc:0 "过去的防空营散布在各军区，装备型号杂乱，没有统一的指挥系统。改组后，它们成为一个独立的军种，并拥有自己的研究与采购预算。"
 SYR_army_special_forces:0 "组建特种部队"
 SYR_army_special_forces_desc:0 "常规部队擅长大规模战斗，却不擅长深夜里的一次突袭。总参谋部决定把军官学院里最出色的毕业生集中起来，组建一支直属的特种部队。"
 SYR_ask_israel:0 "求助以色列的专业知识"
 SYR_ask_israel_desc:0 "这是一个无人敢公开说出口的选项：以色列拥有这一地区最成熟的核与军民两用技术。秘密接触在日内瓦的一家酒店里进行，双方都对“私下”二字格外小心。"
 SYR_ask_kdpr:0 "寻求朝鲜援助"
 SYR_ask_kdpr_desc:0 "平壤曾经愿意帮助任何有硬通货的客户。一批“建筑承包商”和“水利工程师”飞抵大马士革，没有人愿意问他们到底要建什么。"
 SYR_ask_pakistan:0 "巴基斯坦的核专家"
 SYR_ask_pakistan_desc:0 "伊斯兰堡的科学家有过从零造出核武器的经历，也对伊斯兰世界的兄弟之邦格外慷慨。几位退休的工程师受邀到霍姆斯担任“顾问”。"
 SYR_blockade_hezbollah:0 "封锁真主党"
 SYR_blockade_hezbollah_desc:0 "黎巴嫩边境的走私通道被关闭，来自德黑兰的补给无法再经叙利亚运到真主党手里。贝卡谷地的商人抱怨说，边境关闭连正常的贸易也一起断了。"
 SYR_boost_nuclear_research:0 "加强核研究"
 SYR_boost_nuclear_research_desc:0 "国家实验室得到了新的离心实验设备和稳定的电力供应。研究所的负责人说，他们离“能做的和不该做的”之间的界线越来越近。"
 SYR_bowels_desert:0 "沙漠的腹地"
 SYR_bowels_desert_desc:0 "从代尔祖尔到帕尔米拉，叙利亚的地下沉睡着国家最大的财富。勘探队带着新的地震数据重回沙漠，石油部为外国承包商准备了一份比以往都宽松的合同模板。"
 SYR_build_nuclear:0 "叙利亚核计划"
 SYR_build_nuclear_syr:0 "叙利亚核威慑"
 SYR_build_nuclear_syr_desc:0 "这一步没有回头路。一旦消息传出，所有邻国的国防部都会开紧急会议，情报机构的卫星会重新调整轨道。叙利亚得到了它一直想要的安全保证，也得到了一堆它从未想过的麻烦。"
 SYR_build_pvos:0 "综合防空网"
 SYR_build_pvos_desc:0 "核设施与研究所需要受到保护。防空部队在霍姆斯和大马士革周围建起了雷达站和防空阵地，并与军方共享数据链。"
 SYR_business_with_uae:0 "与阿联酋做生意"
 SYR_business_with_uae_desc:0 "迪拜的港口与物流公司把叙利亚列入了新的贸易线路图。双方在大马士革设立了联合商会。"
 SYR_buy_military_hardware:0 "购买军事装备"
 SYR_buy_military_hardware_desc:0 "伊朗的军工企业提供火炮、导弹与无人机，价格低得出奇，条件是长期使用伊朗的零配件。"
 SYR_cbs:0 "改革叙利亚商业银行"
 SYR_cbs_desc:0 "叙利亚商业银行是国家最大的银行，也是最大的呆账制造者。改革方案要求它公开资产负债表，引入外部审计，并把贷款决定权从政治任命的行长手里收回。"
 SYR_cooperation_with_yemen:0 "与也门合作"
 SYR_cooperation_with_yemen_desc:0 "也门代表团访问大马士革，两国签订了人员往来、渔业与反海盗合作的备忘录。"
 SYR_covert_airforce_cooperation:0 "埃及境内的秘密飞行训练"
 SYR_covert_airforce_cooperation_desc:0 "叙利亚的年轻飞行员被派往埃及的空军基地，学习新型战机的操作。训练名单被锁进保险柜，没有任何新闻稿提到它。"
 SYR_cultural_centers_initiative:0 "文化中心计划"
 SYR_cultural_centers_initiative_desc:0 "在阿勒颇、霍姆斯和拉塔基亚建起公共图书馆、剧场和青年中心。这是对一代人的一份提醒：在战争的间隙，这个国家还有书可读、有戏可看。"
 SYR_disband_palest_militias:0 "解散巴勒斯坦民兵"
 SYR_disband_palest_militias_desc:0 "难民营里的武装派别被要求交出武器，换取居留权与重建援助。民兵的头领们拒绝出席会议，街头的青年则在墙上涂满了愤怒的标语。"
 SYR_eastern_debt_negotiations:0 "寻求东方的金融支持"
 SYR_eastern_debt_negotiations_desc:0 "如果西方的条件太苛刻，东方的资金就是另一种选择。莫斯科、德黑兰、北京和海湾的银行家们都表示愿意以较少的政治条件提供贷款，只不过——他们的条件写在另一张纸上。"
 SYR_empower_energy_ministry:0 "授权能源部"
 SYR_empower_energy_ministry_desc:0 "把发电、输电、油气和可再生能源的权限集中到一个部门，这是技术官僚们多年的心愿。部长拿到了跨部门协调的实权，也要为每一次停电向总统直接负责。"
 SYR_establish_military_isr:0 "刀剑与橄榄枝"
 SYR_establish_military_isr_desc:0 "在边境联合委员会的基础上，两国军队建立了定期的热线与联合演练：既是互信，也是互相的“眼睛”。"
 SYR_expand_cement_industry:0 "扩建水泥工业"
 SYR_expand_cement_industry_desc:0 "阿德拉与塔尔图斯的水泥厂已经满负荷运转，仍然满足不了重建的需求。新的窑线、更干净的燃料和对建材价格的监管，让水泥不再成为暴利行业。"
 SYR_foreign_specialists:0 "外国专家"
 SYR_foreign_specialists_desc:0 "阿联酋雇来的外国教官与工程师抵达叙利亚。他们不会出现在任何官方名单里，但军官们都知道谁真正在教他们。"
 SYR_fortify_golan_heights:0 "加固戈兰高地"
 SYR_fortify_golan_heights_desc:0 "在无法收复的土地上，最好的办法是让对手也付出代价。工兵团受命在库奈特拉前线构筑纵深防御，雷区、碉堡与反坦克阵地依地形层层展开。"
 SYR_found_sgc:0 "成立叙利亚天然气公司"
 SYR_found_sgc_desc:0 "天然气一直是石油的附庸，随采随烧，在火炬塔里白白烧掉。新成立的国家天然气公司要把伴生气收集起来，供给电厂和化肥厂。"
 SYR_fund_shia_militias:0 "资助什叶派民兵"
 SYR_fund_shia_militias_desc:0 "德黑兰提供资金、装备和教官，叙利亚提供基地与通行权。一批批来自伊拉克与黎巴嫩的志愿者进入叙利亚，兵营里的口音越来越杂。"
 SYR_green_syria:0 "“绿色叙利亚”计划"
 SYR_green_syria_desc:0 "光伏、风电与节能工程一并写进了国家发展纲要。欧洲的能源公司对向北输电的前景很感兴趣，条件是叙利亚的电网要达到欧盟标准。"
 SYR_hat_tr_foreign_education:0 "高级培训计划"
 SYR_hat_tr_foreign_education_desc:0 "外籍专家的短期培训升级为长期的联合培养：优秀的军官与工程师被送往海湾和欧洲深造，回国后担任骨干。"
 SYR_humanitarian_links_to_gaza:0 "通往加沙的人道通道"
 SYR_humanitarian_links_to_gaza_desc:0 "粮食、药品和发电机经叙利亚与埃及送往加沙。援助的名义是人道，意义却是政治——这是对封锁最直接的回答。"
 SYR_integrate_the_union:0 "融入联盟"
 SYR_integrate_the_union_desc:0 "联合共和国不再只是旗帜与口号：统一的议会、统一的军队、统一的货币，三条主线同时推进。这一天，被一代人描述成“回家”。"
 SYR_intervene_in_yemen:0 "干预也门"
 SYR_intervene_in_yemen_desc:0 "在海湾盟友的请求下，叙利亚向也门派出了军事顾问与少量特遣队。这既是对盟友的回报，也是让军队在真实战场上练兵的机会。"
 SYR_invest_shair_gas_field:0 "投资谢尔气田"
 SYR_invest_shair_gas_field_desc:0 "谢尔气田位于霍姆斯东面的沙漠中，是全国最重要的天然气来源之一。扩建处理厂和输气管线的预算批下来了，承包商需要在前线重新稳定下来之前尽快完工。"
 SYR_invite_egyptian_investors:0 "邀请埃及投资者"
 SYR_invite_egyptian_investors_desc:0 "埃及的建筑与食品企业收到了免税期与土地使用的优惠邀请。第一批商人带着样品和合同来到大马士革。"
 SYR_invite_mossad:0 "邀请摩萨德"
 SYR_invite_mossad_desc:0 "在反恐的旗帜下，一个以色列的情报联络组悄悄进驻大马士革。它的办公室离总统府只有几百米，这个事实本身就足以改变整个地区的力量格局。"
 SYR_invite_scientists:0 "外国科学家计划"
 SYR_invite_scientists_desc:0 "优厚的薪水、全家的居留权，再加上不被打扰的实验室——一份面向全球核物理学家的招聘启事悄悄发了出去。应聘者的来历，没有人会细问。"
 SYR_iran_riot_gear:0 "伊朗防暴装备"
 SYR_iran_riot_gear_desc:0 "德黑兰有二十年压制街头抗议的经验与成套的设备。盾牌、警棍和扩音车被运到叙利亚内政部的仓库。"
 SYR_iran_syria_bank:0 "伊叙联合银行"
 SYR_iran_syria_bank_desc:0 "伊朗与叙利亚在大马士革设立联合银行，为双边贸易提供结算与信贷，借此绕开部分金融制裁。"
 SYR_iran_syria_pipeline:0 "伊朗-叙利亚管线"
 SYR_iran_syria_pipeline_desc:0 "从南帕尔斯气田出发，经伊拉克中部通往地中海的输气管线终于破土动工。它既是能源通道，也是德黑兰与大马士革之间最长的纽带。"
 SYR_iranian_investments:0 "伊朗投资"
 SYR_iranian_investments_desc:0 "伊朗的承包商接下了大马士革的发电站和港口扩建工程。付款条件之一，是长期的原油与磷酸盐供货合同。"
 SYR_iranian_specialists:0 "伊朗专家"
 SYR_iranian_specialists_desc:0 "伊斯兰革命卫队的顾问和工程师住进了叙利亚的军营与工厂。他们带来了经验，也带来了自己的指挥链。"
 SYR_join_israeli_agreements:0 "加入亚伯拉罕协议"
 SYR_join_israeli_agreements_desc:0 "在华盛顿的草坪上，叙利亚的代表与以色列的代表握了手。这是中东近半个世纪的外交冰河期里，最令人意外的一次解冻。"
 SYR_kings_highway:0 "复兴国王大道"
 SYR_kings_highway_desc:0 "古老的国王大道从大马士革通往亚喀巴，贯穿了三千年的商队史。新的公路计划沿线改造路面、桥梁和边境口岸，让它成为叙利亚南部的商贸走廊。"
 SYR_little_hagia_sophia:0 "小圣索菲亚"
 SYR_little_hagia_sophia_desc:0 "把一座被土耳其人改作清真寺的古教堂列入联合国教科文组织的修复名单，是叙利亚向东正教世界发出的一份温和的信号。"
 SYR_liwa_al_quds:0 "圣城旅"
 SYR_liwa_al_quds_desc:0 "阿勒颇难民营的巴勒斯坦青年被编入叙利亚军队，组成了一支以“圣城”命名的旅。他们的使命是保卫叙利亚，也是等待有朝一日回到故乡。"
 SYR_military_coop_with_armenia:0 "与亚美尼亚的军事合作"
 SYR_military_coop_with_armenia_desc:0 "埃里温与大马士革共享对邻国的忧虑。联合演习、情报共享和军官交流计划，让两国的参谋们熟悉起了对方的口音。"
 SYR_negotiate_golan_buy:0 "谈判购回戈兰"
 SYR_negotiate_golan_buy_desc:0 "没有人敢公开说出口的方案：用钱和安全保证换回土地。海湾与西方的中间人带着一份“长期租赁加主权回归”的草案穿梭于两国之间。"
 SYR_nuclear_program:0 "核能计划"
 SYR_nuclear_program_desc:0 "原子能委员会在迪尔哈吉尔的研究堆旁边，悄悄起草了一份扩大核能研究的路线图。官方说法是发电，没人能保证它只有这一种用途。"
 SYR_overhaul_national_grid:0 "整修国家电网"
 SYR_overhaul_national_grid_desc:0 "战争与老化让国家电网变成了一张补丁摞补丁的网：变电站缺零件，高压线靠旧钢缆撑着，大马士革每天要停电好几次。能源部拿出一份全面的整修清单——先修变压器，再换主干线，最后才谈扩容。"
 SYR_palestinian_training_camps:0 "巴勒斯坦训练营"
 SYR_palestinian_training_camps_desc:0 "叙利亚境内的难民营旁，几处旧军营被改成了训练营。巴勒斯坦青年、也包括叙利亚的志愿者在这里学习游击战与城市作战。"
 SYR_please_rojava:0 "安抚罗贾瓦"
 SYR_please_rojava_desc:0 "大马士革承认了东北部库尔德人的语言与教育权利，并同意把部分地方税收留给当地自治机构。条件是旗帜仍是同一面。"
 SYR_prepare_materials:0 "铀矿开采与加工"
 SYR_prepare_materials_desc:0 "沙漠中的磷酸盐矿含有微量的铀。冶金所建起了一座小型选冶厂，样品被送往实验室检测——数据没有对外公布。"
 SYR_qatar_syria_pipeline:0 "卡塔尔-黎凡特管线"
 SYR_qatar_syria_pipeline_desc:0 "一条从卡塔尔穿过沙特与约旦、通向叙利亚地中海沿岸的输气管线，被反复写进地区合作的草案里。现在资金终于落实。"
 SYR_reform_construction_sector:0 "改革建筑行业"
 SYR_reform_construction_sector_desc:0 "建筑业是叙利亚腐败最集中的行业之一：层层转包、虚报工程量、偷工减料。住建部公布了新的建筑规范、招标规则和黑名单。"
 SYR_regional_alliance:0 "地区联盟"
 SYR_regional_alliance_desc:0 "两个复兴党的故国互相承诺：不再结盟反对对方，并在石油、水与边境问题上建立统一的立场。"
 SYR_restore_historical_sites:0 "修复历史古迹"
 SYR_restore_historical_sites_desc:0 "帕尔米拉、大马士革古城、阿勒颇的城堡和骑士堡——这个国家有一半的历史都刻在石头上。文物局得到了专项预算与国际专家的援助。"
 SYR_restore_political_ties:0 "恢复与埃及的政治关系"
 SYR_restore_political_ties_desc:0 "开罗与大马士革之间的大使馆重新挂起了国旗。曾经联合过的两个共和国，又坐到了同一张谈判桌前。"
 SYR_siib:0 "首家伊斯兰银行"
 SYR_siib_desc:0 "第一家按伊斯兰教法经营的银行获得了牌照，股东中有海湾的投资人。分行开到了大马士革的老城区，虔诚的商人终于有了一个不违背信仰的储蓄去处。"
 SYR_smuggle_oil_through_iraq:0 "伊拉克石油的走私通道"
 SYR_smuggle_oil_through_iraq_desc:0 "伊拉克的原油装在油罐车里，经过一座没人检查的边境口岸，运到巴尼亚斯的炼油厂。这笔生意没有账本，只有一些默契。"
 SYR_stock_exchange:0 "叙利亚证券交易所"
 SYR_stock_exchange_desc:0 "大马士革证券交易所的筹备已经拖了很多年。这一次，财政部拿出了完整的上市规则和投资者保护条款，第一批上市公司名单也已确定。"
 SYR_strategic_iran_supply:0 "伊朗战略补给"
 SYR_strategic_iran_supply_desc:0 "一条由德黑兰出资的空中与陆路补给线，把弹药、油料与备件源源不断地运到叙利亚。国防部的仓库第一次有了“安全库存”。"
 SYR_streamline_energy_sector:0 "精简能源行业"
 SYR_streamline_energy_sector_desc:0 "补贴式的低电价让能源企业年年亏损，维修费永远排不上队。新政策把电价与成本挂钩，削减过剩的中间机构，同时给低收入家庭发放用电补助。"
 SYR_strongarm_minorities:0 "强压少数族群"
 SYR_strongarm_minorities_desc:0 "政府组建了以亚述人和基督徒为主的地方军团，负责东北边境的村镇防务，也负责盯着其他武装派别。"
 SYR_supply_pij:0 "援助伊斯兰圣战运动"
 SYR_supply_pij_desc:0 "大马士革长期收留着伊斯兰圣战运动的办公室。现在，总参谋部批准向它输送资金、弹药与训练名额——这条线索足以让西方的外交官彻夜开会。"
 SYR_support_sunnis:0 "争取逊尼派世界"
 SYR_support_sunnis_desc:0 "官方媒体不再把逊尼派社群只当“问题”，而是邀请他们的学者与商人进入政府咨询机构。沙特与卡塔尔的使者感觉到了风向的变化。"
 SYR_suppress_kurds:0 "压制库尔德人"
 SYR_suppress_kurds_desc:0 "国家安全局宣布取缔在边境地区活动的库尔德武装，与土耳其的边境协议因此重新提上日程。"
 SYR_syria_isr_trade_pact:0 "与以色列的贸易协定"
 SYR_syria_isr_trade_pact_desc:0 "从海法到拉塔基亚的货运线路开通，水果、软件与建材通过第三国转口。最初，两国的报纸都不敢刊登这条新闻。"
 SYR_syrian_qatari_holding_company:0 "叙利亚-卡塔尔控股公司"
 SYR_syrian_qatari_holding_company_desc:0 "多哈的主权基金与大马士革的企业家合办了一家控股公司，投资于酒店、通信与农产品加工。"
 SYR_talk_to_gulf_states:0 "与海湾国家对话"
 SYR_talk_to_gulf_states_desc:0 "外交部长带着代表团巡访海湾各国，希望把战争年代断掉的贸易线、资金流与合作协议重新接起来。"
 SYR_treasures_levantine_sea:0 "黎凡特海的宝藏"
 SYR_treasures_levantine_sea_desc:0 "东地中海海底的天然气田让整个地区的外交官们坐立不安。叙利亚宣布了自己的专属经济区，并邀请外国能源企业联合勘探——哪怕邻国还在为海上划界争吵不休。"
 SYR_turkoman_militias:0 "土库曼民兵"
 SYR_turkoman_militias_desc:0 "北部的土库曼人村庄组织了自己的民兵。大马士革与安卡拉都想把它们拉到自己一边，而它们自己的盘算是：谁出得起价钱。"
 SYR_uae_economic_cooperation:0 "与阿联酋的经济合作"
 SYR_uae_economic_cooperation_desc:0 "阿联酋的自贸区模式被搬到了拉塔基亚港：免税、一站式审批、外籍人员的居留许可。"
 SYR_uae_weapons:0 "通过阿联酋采购"
 SYR_uae_weapons_desc:0 "经由阿联酋的转口公司，叙利亚买到了在公开市场上买不到的装备与零部件。每一张订单都经过三个国家的中间商。"
 SYR_western_debt_negotiations:0 "与西方债权国谈判"
 SYR_western_debt_negotiations_desc:0 "在巴黎和布鲁塞尔的会议室里，叙利亚代表团带着一份详尽的偿债方案来谈重组：延长期限、降低利率，换取对市场准入与法治改革的承诺。"
