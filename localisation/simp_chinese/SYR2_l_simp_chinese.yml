l_simp_chinese:
 SYR2_air_defence_reform_idea:0 "防空部队改组"
 SYR2_air_defence_reform_idea_desc:0 "防空部队从空军里独立出来，拥有自己的雷达网和指挥链。雷达站不再只是首都的摆设。"
 SYR2_al_qaeda1_idea:0 "扎瓦希里的亲临"
 SYR2_al_qaeda1_idea_desc:0 "这位组织的头号理论家亲自抵达叙利亚。年轻的战士把他当作活着的传奇，西方的卫星则开始把每一条山路都拍下来。"
 SYR2_al_qaeda_idea:0 "基地组织网络"
 SYR2_al_qaeda_idea_desc:0 "老兵、资金与秘密的补给线从阿富汗、伊拉克与也门汇集到叙利亚。它们带来了经验，也带来了整个世界的敌意。"
 SYR2_arab_union_idea:0 "阿拉伯联盟的重生"
 SYR2_arab_union_idea_desc:0 "“阿拉伯联合共和国”的旗帜再次升起：统一的外交、统一的军队与统一的货币。理想主义者热泪盈眶，官僚们则开始头疼合并后的预算。"
 SYR2_capital_defence_idea:0 "首都防务"
 SYR2_capital_defence_idea_desc:0 "环绕大马士革的第二道防线已经成形：加固的据点、地下指挥所和与共和国卫队联动的机动预备队。"
 SYR2_cement_industry_idea:0 "水泥与建材工业"
 SYR2_cement_industry_idea_desc:0 "新的水泥窑和预制件工厂让重建不必再等进口。建筑业成为就业最多、见效最快的行业。"
 SYR2_charity_idea:0 "宗教捐赠与慈善"
 SYR2_charity_idea_desc:0 "清真寺基金会与慈善组织被纳入统一的管理框架：施粥、助学、孤儿院与诊所，让运动在街区里有了血肉。"
 SYR2_commercial_bank_idea:0 "叙利亚商业银行改制"
 SYR2_commercial_bank_idea_desc:0 "国有的叙利亚商业银行引入商业化的信贷审批和外部审计。呆账被曝光，但新的贷款终于流向了真正能还款的企业。"
 SYR2_construction_reform_idea:0 "建筑行业改革"
 SYR2_construction_reform_idea_desc:0 "统一的建筑规范、透明的招标和对承包商资质的审查，压缩了层层转包的利润，工程的质量和速度都有了起色。"
 SYR2_defence_ministry_idea:0 "国防部改革"
 SYR2_defence_ministry_idea_desc:0 "国防部不再只是将军们的社交俱乐部：采购、训练与后勤各有一名文官次长，每笔预算都要附带说明。"
 SYR2_energy_ministry_idea:0 "统一的能源部"
 SYR2_energy_ministry_idea_desc:0 "电力、石油、天然气原本分属四个部门，互相推诿。统一的能源部有了唯一的预算和唯一的责任人，停电的账终于可以算清楚。"
 SYR2_european_education_idea:0 "欧洲教育援助"
 SYR2_european_education_idea_desc:0 "奖学金、联合办学与师资培训从巴黎、伦敦与柏林来到大马士革。这代人的大学生，会比上一代更熟悉外面的世界。"
 SYR2_gas_company_idea:0 "叙利亚天然气公司"
 SYR2_gas_company_idea_desc:0 "国家天然气公司接管了分散的气田与处理厂，统一采购、统一定价，也终于有了与外国承包商谈判的底气。"
 SYR2_golan_fortress_idea:0 "戈兰要塞带"
 SYR2_golan_fortress_idea_desc:0 "从赫尔蒙山脚到雅尔穆克河谷，混凝土碉堡、反坦克壕与观察哨连成一线。守住这条线，是叙利亚军队从未放弃的使命。"
 SYR2_green_syria_idea:0 "“绿色叙利亚”计划"
 SYR2_green_syria_idea_desc:0 "从帕尔米拉的沙漠到幼发拉底河谷，光伏板一排排地立起来。能源独立不再只是口号，也成了出口欧洲电力的筹码。"
 SYR2_guardians_idea:0 "革命卫士"
 SYR2_guardians_idea_desc:0 "一支宣誓效忠宪法的志愿卫队守在首都的关键位置，防备旧政权的残余与新的强人。"
 SYR2_gulf_capital_idea:0 "海湾资本"
 SYR2_gulf_capital_idea_desc:0 "卡塔尔与阿联酋的控股公司在大马士革设立总部，投资于酒店、物流与房地产。"
 SYR2_int_jihadists_idea:0 "国际圣战者"
 SYR2_int_jihadists_idea_desc:0 "成批的外国战士越过土耳其与伊拉克的边境涌入，战线上多了许多不会说阿拉伯语的突击队，政府则多了许多没人负责的麻烦。"
 SYR2_islamic_bank_idea:0 "首家伊斯兰银行"
 SYR2_islamic_bank_idea_desc:0 "不收利息、按利润分成的银行吸引了海湾的资金，也吸引了此前不愿把钱放进国有银行的虔诚储户。"
 SYR2_islamic_democracy_idea:0 "伊斯兰民主"
 SYR2_islamic_democracy_idea_desc:0 "安卡拉的榜样让人们相信：虔诚的政党也可以通过选票赢得多数，并与商人、军队和外国投资者坐在同一张桌子旁。"
 SYR2_israeli_intel_idea:0 "与摩萨德的联络"
 SYR2_israeli_intel_idea_desc:0 "反恐情报的交换让两国的安全部门第一次坐在同一张桌子旁。有人称之为现实主义，也有人称之为背叛。"
 SYR2_kurdish_appeasement_idea:0 "对库尔德人的怀柔"
 SYR2_kurdish_appeasement_idea_desc:0 "学校、诊所与小额贷款进入东北部的库尔德村庄。中央的目的很清楚：用福利换取沉默，在不放权的前提下把人心拉回来。"
 SYR2_maher_economy_idea:0 "精英的生意"
 SYR2_maher_economy_idea_desc:0 "国家的合同被分给少数几个家族，他们在大马士革的餐厅里谈生意，用忠诚换取垄断。财政表面上漂亮，街头的怨言也在悄悄累积。"
 SYR2_minorities_legion_idea:0 "亚述军团"
 SYR2_minorities_legion_idea_desc:0 "以基督徒与亚述人为主的地方部队承担边境巡逻与村镇防务，成为政府在东北部的“自己人”。"
 SYR2_mushriq_idea:0 "清剿异端"
 SYR2_mushriq_idea_desc:0 "宗教警察接到命令：凡不肯悔过的人，都要被追查到底。城里的少数教派连夜收拾行李，边境的难民营又多了一批新人。"
 SYR2_npf_police_idea:0 "镇压机器"
 SYR2_npf_police_idea_desc:0 "警察、情报与党的干部被重新编成一张细密的网。街角的小店老板都知道，谁在听、谁在记。"
 SYR2_nuclear_deterrent_idea:0 "叙利亚核威慑"
 SYR2_nuclear_deterrent_idea_desc:0 "核计划的成功让大马士革在谈判桌上多了一张谁也无法忽视的牌，也让整个地区的情报机构都把目光转向了这个国家。"
 SYR2_pal_camps_idea:0 "巴勒斯坦训练营"
 SYR2_pal_camps_idea_desc:0 "大马士革郊外的训练营接收来自各个派别的青年。叙利亚军官从这里得到实战经验，也得到一笔难以向外界解释的账目。"
 SYR2_pan_islamism_idea:0 "泛伊斯兰主义"
 SYR2_pan_islamism_idea_desc:0 "殖民者划下的边界不是真主的旨意。清真寺与宗教学校在各国之间串联成一张网，让叙利亚的声音传到更远的地方，也让邻国的情报部门彻夜难眠。"
 SYR2_particle_liberal_idea:0 "局部自由化的经济"
 SYR2_particle_liberal_idea_desc:0 "中小企业重获自由，战略性行业仍留在国家手中。这不是休克疗法，而是一剂慢药。"
 SYR2_pipeline_idea:0 "跨境输气管线"
 SYR2_pipeline_idea_desc:0 "管线穿过的不只是沙漠，还有政治：每一个阀门都有人盯着。收入稳定，但谁关阀门，谁就握着叙利亚的钱袋。"
 SYR2_purge_traitors_idea:0 "清洗叛徒"
 SYR2_purge_traitors_idea_desc:0 "深夜的敲门声、消失的名字、被擦掉的合影。新秩序用安静的方式处理“不忠者”。"
 SYR2_quds_brigade_idea:0 "圣城旅"
 SYR2_quds_brigade_idea_desc:0 "由巴勒斯坦难民子弟组成的叙利亚特种旅。他们对家乡的执念，是最好的士气来源，也是最危险的政治变量。"
 SYR2_qutb_idea:0 "库特卜的先锋队"
 SYR2_qutb_idea_desc:0 "一小群信徒把“现代蒙昧”当作敌人，把自己当作新社会的先锋。他们的纪律与狂热是真实的，他们能够与谁共存却是个问题。"
 SYR2_righteous_jihad_idea:0 "正义的圣战"
 SYR2_righteous_jihad_idea_desc:0 "来自远方的志愿者被编入各个旅，与本地战士并肩作战。他们的信念是最好的士气，他们的口音则时刻提醒人们：这场战争不止属于叙利亚。"
 SYR2_riot_police_idea:0 "防暴警察的新装备"
 SYR2_riot_police_idea_desc:0 "头盔、盾牌与催泪弹让街头治安更有秩序，也让镇压变得更加有效。"
 SYR2_saudi_friend_idea:0 "利雅得的友谊"
 SYR2_saudi_friend_idea_desc:0 "沙特的资金、保守派的政治支持与石油美元的投资，一并流进叙利亚的账本。作为回报，大马士革在许多问题上选择不再发表意见。"
 SYR2_secular_syria_idea:0 "世俗的叙利亚"
 SYR2_secular_syria_idea_desc:0 "宗教是良心的事，国家是法律的事。学者、作家与工程师被请进咨询委员会，讨论一个与教条保持距离的国家应当是什么样子。"
 SYR2_securities_exchange_idea:0 "大马士革证券交易所"
 SYR2_securities_exchange_idea_desc:0 "开市钟声敲响后，几十家公司的股票第一次公开挂牌。交易额不大，但“上市”这个词，让私营企业主第一次觉得自己的财产不再只是政治关系的一部分。"
 SYR2_shia_militias_idea:0 "什叶派民兵"
 SYR2_shia_militias_idea_desc:0 "来自伊拉克、黎巴嫩与阿富汗的志愿者在叙利亚的各条战线上作战，工资与武器由德黑兰提供。"
 SYR2_special_forces_idea:0 "新建特种部队"
 SYR2_special_forces_idea_desc:0 "从共和国卫队与空降兵里挑出的最好的军官，在霍姆斯组成了一支独立的特种部队，直接听命于总参谋部。"
 SYR2_ssnp_economy_idea:0 "民族经济"
 SYR2_ssnp_economy_idea_desc:0 "国家优先于个人：重要的工厂、港口与油田被置于民族利益之下，利润用于国防与基础建设，而不是少数人的口袋。"
 SYR2_ssnp_idea:0 "社会民族党的回归"
 SYR2_ssnp_idea_desc:0 "被禁了几十年的叙利亚社会民族党重新走上街头，旗帜上的旋风标志出现在军营、学校与政府大楼里，成为这个政权最忠诚的突击力量。"
 SYR2_ssnp_propaganda_idea:0 "“叙利亚雄狮”的宣传"
 SYR2_ssnp_propaganda_idea_desc:0 "土耳其总统称他的作风近于“野蛮”，他则光荣地接受了这个称呼：雄狮不在乎羊群的议论。电视、海报与课本一起讲述这头狮子的故事。"
 SYR2_state_feminism_idea:0 "国家女性主义"
 SYR2_state_feminism_idea_desc:0 "教科书被改写，国家媒体接到明确的指示：才华没有性别。这场自上而下的运动起初没有人相信，后来却有越来越多的女孩走进了大学。"
 SYR2_syrian_democracy_idea:0 "新叙利亚民主"
 SYR2_syrian_democracy_idea_desc:0 "选举、报纸与法院被一件件擦亮，向世界展示一个“前所未有的阿拉伯民主”。台前很亮，台后的灯还没有全部点上。"
 SYR2_trader_support_idea:0 "商人的信任"
 SYR2_trader_support_idea_desc:0 "大马士革与阿勒颇的巴扎重新开门：内部关税下调，市场的治安得到保证。商人们愿意先观望，再慢慢把钱放回国内。"
 SYR2_uae_specialists1_idea:0 "高级培训计划"
 SYR2_uae_specialists1_idea_desc:0 "培训计划升级为联合军官学院，每年一批军官被送往海湾和欧洲深造。"
 SYR2_uae_specialists_idea:0 "阿联酋的外籍专家"
 SYR2_uae_specialists_idea_desc:0 "阿联酋雇来的前西方军官与工程师，在大马士革郊外的培训基地里传授现代军队的管理方法。"
 SYR_A_New_Idealogical_Image:0 "全新的意识形态形象"
 SYR_A_New_Idealogical_Image_desc:0 "世界只看见了刀剑，我们要让它看见笔。一个新的叙利亚：正义即教法，仁慈即律令。向愿意了解的人敞开学校、法庭与市场，让他们看看我们建设了什么。"
 SYR_Affordable_Social_Care:0 "可负担的社会关怀"
 SYR_Affordable_Social_Care_desc:0 "女性执政意味着关心弱者。布什拉扩大社会机构网络，让医疗更易获得，并为大家庭提供补助。"
 SYR_Al_Nursa_Front:0 "努斯拉阵线"
 SYR_Al_Nursa_Front_desc:0 "努斯拉阵线纪律严明、战斗力强，是这场武装斗争的先锋。它的战术经验和意识形态热情，是推翻旧政权最锋利的工具，也是日后最难收回的刀。"
 SYR_Al_Qaeda_Dilemma:0 "基地组织的难题"
 SYR_Al_Qaeda_Dilemma_desc:0 "一同作战的圣战者要求自己的位置，他们的手段严酷，忠诚绝对。收留他们，要承受世界的谴责；拒绝他们，联盟就会破裂。这个选择将决定我们是谁。"
 SYR_Al_Qaeda_Network:0 "基地组织网络"
 SYR_Al_Qaeda_Network_desc:0 "接入全球范围的基地组织网络，意味着获得老兵、秘密资金，以及几十年来在伊斯兰世界打非对称战的经验。代价是，所有人都会把我们看成它的一部分。"
 SYR_Alawi_Dominance:0 "阿拉维派的主导地位"
 SYR_Alawi_Dominance_desc:0 "阿拉维派必须主导并带领社会民族党走向新的、改革后的意识形态立场。核心岗位上的人选一律由可靠者担任。"
 SYR_All_for_the_Nation:0 "一切为了民族"
 SYR_All_for_the_Nation_desc:0 "我们必须让经济服务于全体人民的需要，而不是个人的需要。"
 SYR_Appease_the_Kurds:0 "安抚库尔德人"
 SYR_Appease_the_Kurds_desc:0 "叙利亚通过社会福利项目安抚库尔德人口，旨在预防冲突，在保持中央控制的前提下把库尔德人整合进国家结构。"
 SYR_Bring_SSNP:0 "请回社会民族党"
 SYR_Bring_SSNP_desc:0 "叙利亚社会民族党是叙利亚最具民族色彩、最忠诚的政治力量，渴望让叙利亚真正强大。它的政治目标，与马希尔的抱负完全一致。"
 SYR_Bring_more_International_Jihadists:0 "招募更多国际圣战者"
 SYR_Bring_more_International_Jihadists_desc:0 "哈里发国在地区内已有威望，但它并不孤单。继续接纳世界各地赶来的圣战者，就能壮大队伍、传播主张。"
 SYR_Call_to_Qatar:0 "求助卡塔尔"
 SYR_Call_to_Qatar_desc:0 "多哈有足以改变战局的资金与媒体影响力。一份正式的请求，换来的是投资、外交上的合法性，以及一些让人不安的条件。"
 SYR_Conservative_Femenism:0 "保守派女权主义"
 SYR_Conservative_Femenism_desc:0 "布什拉提出一条叙利亚式的妇女解放道路：不与传统决裂，不搞咄咄逼人的西方激进主义，但要有真正的权利与机会。女人既可以是炉灶的守护者，也可以是部长。"
 SYR_Contraband_Imports:0 "走私进口"
 SYR_Contraband_Imports_desc:0 "马希尔将利用个人关系网走私货物进出叙利亚，维持经济的战略自主。不过这会惹恼民众，因为这些收益不会落到他们手里。"
 SYR_Cover_Up_the_Hama_Incident:0 "掩盖哈马事件"
 SYR_Cover_Up_the_Hama_Incident_desc:0 "哈马事件必须埋在官方的沉默和严格的叙事纪律之下。控制了叙事，政权就能避开丑闻，维护“秩序”的神话。"
 SYR_Crackdown_of_Freedom:0 "镇压自由"
 SYR_Crackdown_of_Freedom_desc:0 "我们必须让一切反对派和小打小闹的民主运动明白：他们在这个国家里已经没有发言权。叙利亚将强大而主权在握！"
 SYR_Crush_Gender_Prejudices:0 "粉碎性别偏见"
 SYR_Crush_Gender_Prejudices_desc:0 "在一个“女人掌权”昨天还不可想象的社会里，布什拉从最基础的事情开始：教育与宣传。教材被改写，国家媒体接到明确的指示：才华没有性别。"
 SYR_Distance_from_Salafits:0 "与萨拉菲保持距离"
 SYR_Distance_from_Salafits_desc:0 "激进分子在战场上有效，但极端的意识形态会疏远温和的民众和潜在的国际伙伴。我们必须公开划清政治目标与教派议程的界线。"
 SYR_Egyptian_Experience:0 "埃及的经验"
 SYR_Egyptian_Experience_desc:0 "里法特看到自己与埃及领导人的相似之处：他们都是在不稳定的地区里为权力而挣扎的西方式专制者。研究埃及政权的方法，能让他的统治更稳。"
 SYR_Embrace_Secular_Thought:0 "拥抱世俗思想"
 SYR_Embrace_Secular_Thought_desc:0 "宗教是良心的事，国家是法律的事。布什拉宣布深化世俗原则，把政治与教条分开，并邀请知识分子对话。"
 SYR_Ensure_Saudi_Ties:0 "确保沙特的关系"
 SYR_Ensure_Saudi_Ties_desc:0 "利雅得是资金、影响力与保守派后援的来源，不能忽视。与沙特阿拉伯达成默契，可以巩固政权的地位、稳定经济。"
 SYR_Ensure_Women_Representation:0 "保证妇女的代表权"
 SYR_Ensure_Women_Representation_desc:0 "言辞必须有行动来支撑。议会、公务员体系与法院实行女性配额。布什拉的声音，现在有了一千个回响。"
 SYR_Establish_Local_Electoral_Councils:0 "设立地方选举委员会"
 SYR_Establish_Local_Electoral_Councils_desc:0 "建立地方选举委员会网络有双重目的：既让人民看到民主参与的表象，又通过联网的治理体系加强国家的控制。"
 SYR_Establish_Militiry_Political_Autonomy:0 "确立军队的政治自治"
 SYR_Establish_Militiry_Political_Autonomy_desc:0 "武装力量获得政治与财政上的自治，成为一个独立的权力分支。军方有权自行制定国家安全战略，并控制相当一部分国家资源。"
 SYR_Exclusive_British_Partnership_with_Syria:0 "与英国的独家伙伴关系"
 SYR_Exclusive_British_Partnership_with_Syria_desc:0 "里法特向伦敦派出外交代表团，提出独家伙伴关系：叙利亚向英国开放港口、提供有利可图的投资，并在东地中海展开战略合作。"
 SYR_Form_Hayat_Tashir_al_Sharm:0 "组建沙姆解放组织"
 SYR_Form_Hayat_Tashir_al_Sharm_desc:0 "沙姆解放组织的旗帜在大马士革上空升起。经验丰富的革命者接过缰绳；战士、学者，以及哈马之后幸存下来的人们，统一在同一面旗帜下。"
 SYR_Implement_Hudud:0 "推行哈杜德刑罚"
 SYR_Implement_Hudud_desc:0 "哈杜德是伊斯兰国家使用的刑罚体系。在全国推行，意味着法律与教法完全一致，也意味着国际社会将重新评估我们。"
 SYR_Integrate_Jihadists:0 "收编圣战者"
 SYR_Integrate_Jihadists_desc:0 "从远方赶来为叙利亚流血的战士，不会被丢弃。我们将把他们纳入体制：不是作为客人，而是作为兄弟。他们的热忱将成为我们的力量。"
 SYR_Intelligence_Links:0 "情报系统的联络"
 SYR_Intelligence_Links_desc:0 "作为哈菲兹的女儿，布什拉从小就懂得情报的价值。她建立起与穆哈巴拉特的私人渠道，把秘密部门从恐惧的工具变成监督改革的工具。"
 SYR_Invite_Ayman_al_Zawahiri:0 "邀请扎瓦希里"
 SYR_Invite_Ayman_al_Zawahiri_desc:0 "组织的头号理论家被请到叙利亚。他的到来是一面旗帜，也是一块靶子，从此每一次行动都会被算到他的账上。"
 SYR_Islamic_Demorcracy:0 "土耳其式伊斯兰主义"
 SYR_Islamic_Demorcracy_desc:0 "我们将借鉴土耳其共和国建立之后的伊斯兰运动。这会让我们的运动看起来温和一些，也可能吸引土耳其的保守派商人。"
 SYR_Islamic_Umbrella:0 "伊斯兰大伞"
 SYR_Islamic_Umbrella_desc:0 "为伊斯兰而战的人并不都认同同一条路：萨拉菲、传统派、穆斯林兄弟会，各自握着真理的一角。我们把他们聚到同一把伞下，让这个阵线强大到足以执政。"
 SYR_Judical_Fair_Reform:0 "司法公正改革"
 SYR_Judical_Fair_Reform_desc:0 "独立的司法是进步的基础。布什拉着手清洗腐败的法官，任命有原则的法学家，让他们依法裁判，而不是靠电话。"
 SYR_Listen_to_Sami_al_Oraydi:0 "倾听萨米·乌赖迪"
 SYR_Listen_to_Sami_al_Oraydi_desc:0 "乌赖迪是哈里发国理论界的重要人物，主张毫不妥协。听从他的指引，意味着此后每一次谈判都要先经过他那一关。"
 SYR_Nationalwide_Charity:0 "全国性的宗教捐赠"
 SYR_Nationalwide_Charity_desc:0 "我们的运动一向与慈善组织与基金会联系在一起。如今地位更显要，就要把它们制度化，帮助缓解经济的重担。"
 SYR_New_Cultural_Policy:0 "新文化政策"
 SYR_New_Cultural_Policy_desc:0 "我们要在叙利亚创造一种新的文化：清除一切伊斯兰影响，恢复很久以前被遗忘的文化。"
 SYR_Oil_Concentrarion:0 "集中发展石油产业"
 SYR_Oil_Concentrarion_desc:0 "我们必须集中精力发展石油的开采与炼化，确保能源独立。这可能会损害其他经济部门，但这是保障未来所必需的。"
 SYR_Only_Path_in_Rabaniya:0 "唯一的道路：神治"
 SYR_Only_Path_in_Rabaniya_desc:0 "“神治”的概念认为一切权威都来自神圣的治理。沿着这条路，我们按照造物主的至高主权来重塑社会，使每一条法律、每一个行动都与之对齐。"
 SYR_Our_Path_to_Caliphate:0 "通往哈里发国之路"
 SYR_Our_Path_to_Caliphate_desc:0 "通向哈里发国的路是清晰的：我们将追随先知与圣门弟子的足迹，把真主的言辞传播到整个世界。"
 SYR_PLA_support:0 "支持巴解军"
 SYR_PLA_support_desc:0 "巴勒斯坦解放军是叙利亚军队的一部分，也是叙利亚影响巴勒斯坦政治的工具。扩编与换装的命令从国防部发出，附带的条件写在另一份文件里。"
 SYR_Pan_Islamists_Efforts:0 "泛伊斯兰主义的努力"
 SYR_Pan_Islamists_Efforts_desc:0 "被强加的边界是人为的产物。我们要把精力放在团结整个乌玛上，超越国家的分隔，建立一条对抗外部侵略的统一战线。"
 SYR_Pardon_All_Relatives:0 "赦免所有亲属"
 SYR_Pardon_All_Relatives_desc:0 "多年的流亡与家族内斗终于画上句号。里法特向所有被流放或被迫害的阿萨德家族成员伸出和解之手，宣布全面赦免。"
 SYR_Partical_Economic_Liberalization:0 "局部经济自由化"
 SYR_Partical_Economic_Liberalization_desc:0 "布什拉明白：国家无法管好每一家店铺。中小企业获得自由，战略部门仍由国家掌握。这不是休克疗法，而是治疗。"
 SYR_Personal_Deals:0 "私人交易"
 SYR_Personal_Deals_desc:0 "马希尔将关注精英与寡头的需要，只要他还在位，就保证国家强大而繁荣。"
 SYR_Promote_the_Minorities:0 "扶持少数群体"
 SYR_Promote_the_Minorities_desc:0 "阿拉维派、基督徒、亚述人与德鲁兹人为这个国家流过血，而所谓的“多数”却在背后祈祷我们倒台。在马希尔的叙利亚，所有忠诚的少数群体都将得到提升。"
 SYR_Radicalize_the_Ulema:0 "让乌理玛激进化"
 SYR_Radicalize_the_Ulema_desc:0 "乌理玛是哈里发国意识形态的传播者。让他们的立场更激进，就能让这套教义更快地渗入每一个街区。花费不小，后果也不小。"
 SYR_Reestablish_Western_Ties:0 "恢复与西方的关系"
 SYR_Reestablish_Western_Ties_desc:0 "孤立与冲突之后，叙利亚需要恢复与西方列强的外交和经济联系。里法特作为一位“西方式的专制者”，深知合作的重要。"
 SYR_Remain_Independent:0 "保持独立"
 SYR_Remain_Independent_desc:0 "叙利亚不应沦为外国的卫星国。我们要在复杂的地缘格局里周旋，在互相竞争的利益之间保持平衡，让命运留在自己手里。"
 SYR_Restore_Latakia_Network:0 "恢复拉塔基亚网络"
 SYR_Restore_Latakia_Network_desc:0 "拉塔基亚是叙利亚的主要海港，将成为一项雄心勃勃的计划的中心：翻新港口设施、扩建仓储综合体，重建贸易网络。"
 SYR_Social_Militarism:0 "社会军国主义"
 SYR_Social_Militarism_desc:0 "社会军国主义必须成为叙利亚政府的意识形态与经济战略。军队与社会之间的墙被拆掉，兵营成了国家的课堂。"
 SYR_State_Propoganda:0 "叙利亚雄狮"
 SYR_State_Propoganda_desc:0 "土耳其总统称马希尔的作风近于“野蛮”。马希尔将骄傲地背负这个称号：雄狮从不在乎羊群的意见。这将成为我们新的宣传基调。"
 SYR_Steps_to_Democratization:0 "民主化的步骤"
 SYR_Steps_to_Democratization_desc:0 "民主化要小心地、分步骤地推进，不能威胁到政权的核心权威。这个过程旨在展示改革的姿态，同时让国家牢牢掌握在可信的人手里。"
 SYR_Stomp_Out_Islamists:0 "铲除伊斯兰主义者"
 SYR_Stomp_Out_Islamists_desc:0 "他们躲在宣礼塔后面，称之为信仰；他们把武器藏在礼拜毯下，称之为抵抗。马希尔不会与狂热者谈判，他要把他们一座清真寺、一个村庄地挖出来，直到没有一个人留下。"
 SYR_Support_Opposition_in_Iraq:0 "支持伊拉克的反对派"
 SYR_Support_Opposition_in_Iraq_desc:0 "通过秘密行动与资金援助，叙利亚将加强伊拉克反对派的力量，削弱巴格达政府，同时扩大自己的影响。"
 SYR_Support_the_Traders:0 "扶持商人阶层"
 SYR_Support_the_Traders_desc:0 "大马士革与阿勒颇的商人是经济的命脉。为他们提供安全，下调内部关税，市场就能稳定，国库就有稳定的进项。"
 SYR_Syrian_Legacy:0 "叙利亚的遗产"
 SYR_Syrian_Legacy_desc:0 "叙利亚真正的身份不在阿拉伯人的征服里，而在曾在这片土地上繁荣的古老文明中。我们要铸造一种新的叙利亚民族主义，扎根于亚述、巴比伦与美索不达米亚的辉煌遗产。"
 SYR_Syrian_Muslim_Brotherhood:0 "穆斯林兄弟会"
 SYR_Syrian_Muslim_Brotherhood_desc:0 "伊斯兰主义反对派联盟在选举中胜出。多年流亡的老兵与地下网络的骨干，终于被委以重任：把叙利亚带向一个保守的伊斯兰共和国。"
 SYR_Syrian_Seculirization:0 "国家的世俗化"
 SYR_Syrian_Seculirization_desc:0 "国家世俗化旨在把宗教与政治及公共生活分开。世俗教育、西方价值与科学方法成为政权的新意识形态，把宗教机构从权力中心边缘化。"
 SYR_Syrian_Trade_Hub_Project:0 "叙利亚贸易枢纽计划"
 SYR_Syrian_Trade_Hub_Project_desc:0 "建设一座综合性的贸易中心，把叙利亚变成区域商业的要冲。港口开发、现代化的物流设施与商业设施，让叙利亚有机会主导区域贸易流动。"
 SYR_Teachings_of_Qutb:0 "库特卜的教导"
 SYR_Teachings_of_Qutb_desc:0 "赛义德·库特卜的著作是对现代蒙昧的警钟。接受他的主张，就是为同一切人造暴政的全面斗争准备先锋队。"
 SYR_Turkish_Normalization_Negotation:0 "与土耳其的正常化谈判"
 SYR_Turkish_Normalization_Negotation_desc:0 "与安卡拉的旧日紧张，被小心翼翼的讨价还价与务实的妥协取代。与土耳其关系正常化，可以稳定边境、减轻压力，为地区稳定打开大门。"
 SYR_al_douri_support:0 "支持杜里派系"
 SYR_al_douri_support_desc:0 "前复兴党的旧人在大马士革得到了庇护。叙利亚用金钱与武器，换取这些人对巴格达政治的影响力。"
 SYR_appease_the_west:0 "安抚西方"
 SYR_appease_the_west_desc:0 "为了生存，我们有时必须隐藏意图。我们要让列强相信，我们的稳定好过混乱；战略性的让步和温和的措辞不是软弱，而是巩固权力的工具。"
 SYR_approach_bahrain:0 "接近巴林"
 SYR_approach_bahrain_desc:0 "巴林是海湾国家里最愿意与叙利亚做生意的小国。金融中心的银行家邀请叙利亚同行去麦纳麦考察。"
 SYR_approach_pakistan:0 "接近巴基斯坦"
 SYR_approach_pakistan_desc:0 "伊斯兰堡与大马士革签订了军官培训与反恐合作的协议。巴基斯坦把叙利亚看成通向阿拉伯世界的另一扇门。"
 SYR_approach_uae:0 "接近阿联酋"
 SYR_approach_uae_desc:0 "阿布扎比愿意在没有政治条件的前提下与叙利亚合作。一场友好访问之后，双方互设了商务代表处。"
 SYR_army_bunker:0 "加固首都"
 SYR_army_bunker_desc:0 "历史告诉叙利亚的统治者：谁守住了大马士革，谁就守住了国家。总参谋部批准了围绕首都的纵深防御方案。"
 SYR_army_minobr:0 "国防部改革"
 SYR_army_minobr_desc:0 "各军种的改革都已落地，最后要整顿的是国防部自己：采购、训练、后勤三条线由文官次长分管，预算每季度向总统府汇报。"
 SYR_army_pvo:0 "改组防空部队"
 SYR_army_pvo_desc:0 "过去的防空营散布在各军区，装备型号杂乱，没有统一的指挥系统。改组后，它们成为一个独立的军种，并拥有自己的研究与采购预算。"
 SYR_army_special_forces:0 "组建特种部队"
 SYR_army_special_forces_desc:0 "常规部队擅长大规模战斗，却不擅长深夜里的一次突袭。总参谋部决定把军官学院里最出色的毕业生集中起来，组建一支直属的特种部队。"
 SYR_ask_israel:0 "求助以色列的专业知识"
 SYR_ask_israel_desc:0 "这是一个无人敢公开说出口的选项：以色列拥有这一地区最成熟的核与军民两用技术。秘密接触在日内瓦的一家酒店里进行，双方都对“私下”二字格外小心。"
 SYR_ask_kdpr:0 "寻求朝鲜援助"
 SYR_ask_kdpr_desc:0 "平壤曾经愿意帮助任何有硬通货的客户。一批“建筑承包商”和“水利工程师”飞抵大马士革，没有人愿意问他们到底要建什么。"
 SYR_ask_pakistan:0 "巴基斯坦的核专家"
 SYR_ask_pakistan_desc:0 "伊斯兰堡的科学家有过从零造出核武器的经历，也对伊斯兰世界的兄弟之邦格外慷慨。几位退休的工程师受邀到霍姆斯担任“顾问”。"
 SYR_blockade_hezbollah:0 "封锁真主党"
 SYR_blockade_hezbollah_desc:0 "黎巴嫩边境的走私通道被关闭，来自德黑兰的补给无法再经叙利亚运到真主党手里。贝卡谷地的商人抱怨说，边境关闭连正常的贸易也一起断了。"
 SYR_boost_nuclear_research:0 "加强核研究"
 SYR_boost_nuclear_research_desc:0 "国家实验室得到了新的离心实验设备和稳定的电力供应。研究所的负责人说，他们离“能做的和不该做的”之间的界线越来越近。"
 SYR_bowels_desert:0 "沙漠的腹地"
 SYR_bowels_desert_desc:0 "从代尔祖尔到帕尔米拉，叙利亚的地下沉睡着国家最大的财富。勘探队带着新的地震数据重回沙漠，石油部为外国承包商准备了一份比以往都宽松的合同模板。"
 SYR_build_nuclear:0 "叙利亚核计划"
 SYR_build_nuclear_syr:0 "叙利亚核威慑"
 SYR_build_nuclear_syr_desc:0 "这一步没有回头路。一旦消息传出，所有邻国的国防部都会开紧急会议，情报机构的卫星会重新调整轨道。叙利亚得到了它一直想要的安全保证，也得到了一堆它从未想过的麻烦。"
 SYR_build_pvos:0 "综合防空网"
 SYR_build_pvos_desc:0 "核设施与研究所需要受到保护。防空部队在霍姆斯和大马士革周围建起了雷达站和防空阵地，并与军方共享数据链。"
 SYR_business_with_uae:0 "与阿联酋做生意"
 SYR_business_with_uae_desc:0 "迪拜的港口与物流公司把叙利亚列入了新的贸易线路图。双方在大马士革设立了联合商会。"
 SYR_buy_military_hardware:0 "购买军事装备"
 SYR_buy_military_hardware_desc:0 "伊朗的军工企业提供火炮、导弹与无人机，价格低得出奇，条件是长期使用伊朗的零配件。"
 SYR_cbs:0 "改革叙利亚商业银行"
 SYR_cbs_desc:0 "叙利亚商业银行是国家最大的银行，也是最大的呆账制造者。改革方案要求它公开资产负债表，引入外部审计，并把贷款决定权从政治任命的行长手里收回。"
 SYR_cooperation_with_israel:0 "与以色列合作"
 SYR_cooperation_with_israel_desc:0 "痛苦的历史不会一夜消失，但现实的需要可以逼出奇怪的对话。通过秘密渠道与谨慎的让步，也许能把旧日的敌人变成务实的伙伴。"
 SYR_cooperation_with_yemen:0 "与也门合作"
 SYR_cooperation_with_yemen_desc:0 "也门代表团访问大马士革，两国签订了人员往来、渔业与反海盗合作的备忘录。"
 SYR_covert_airforce_cooperation:0 "埃及境内的秘密飞行训练"
 SYR_covert_airforce_cooperation_desc:0 "叙利亚的年轻飞行员被派往埃及的空军基地，学习新型战机的操作。训练名单被锁进保险柜，没有任何新闻稿提到它。"
 SYR_cultural_centers_initiative:0 "文化中心计划"
 SYR_cultural_centers_initiative_desc:0 "在阿勒颇、霍姆斯和拉塔基亚建起公共图书馆、剧场和青年中心。这是对一代人的一份提醒：在战争的间隙，这个国家还有书可读、有戏可看。"
 SYR_direct_intervention:0 "外国直接介入"
 SYR_direct_intervention_desc:0 "反对派已经发现，仅靠演讲无法继续下去。外国的军人、飞机与保证，也许是让革命撑到和平到来的唯一办法。"
 SYR_disband_palest_militias:0 "解散巴勒斯坦民兵"
 SYR_disband_palest_militias_desc:0 "难民营里的武装派别被要求交出武器，换取居留权与重建援助。民兵的头领们拒绝出席会议，街头的青年则在墙上涂满了愤怒的标语。"
 SYR_eastern_debt_negotiations:0 "寻求东方的金融支持"
 SYR_eastern_debt_negotiations_desc:0 "如果西方的条件太苛刻，东方的资金就是另一种选择。莫斯科、德黑兰、北京和海湾的银行家们都表示愿意以较少的政治条件提供贷款，只不过——他们的条件写在另一张纸上。"
 SYR_empower_energy_ministry:0 "授权能源部"
 SYR_empower_energy_ministry_desc:0 "把发电、输电、油气和可再生能源的权限集中到一个部门，这是技术官僚们多年的心愿。部长拿到了跨部门协调的实权，也要为每一次停电向总统直接负责。"
 SYR_establish_military_isr:0 "刀剑与橄榄枝"
 SYR_establish_military_isr_desc:0 "在边境联合委员会的基础上，两国军队建立了定期的热线与联合演练：既是互信，也是互相的“眼睛”。"
 SYR_european_education_support:0 "欧洲教育援助"
 SYR_european_education_support_desc:0 "现代的叙利亚需要现代的头脑。引入欧洲的教育援助、奖学金与制度指导，就能培养出一代更看重未来、而不是废墟的人。"
 SYR_expand_cement_industry:0 "扩建水泥工业"
 SYR_expand_cement_industry_desc:0 "阿德拉与塔尔图斯的水泥厂已经满负荷运转，仍然满足不了重建的需求。新的窑线、更干净的燃料和对建材价格的监管，让水泥不再成为暴利行业。"
 SYR_federalization:0 "联邦化"
 SYR_federalization_desc:0 "叙利亚的未来也许取决于分享权力，而不是垄断权力。联邦结构可以缓解地方紧张，强化区域责任，让每个群体在共和国里都有切身利益。"
 SYR_foreign_specialists:0 "外国专家"
 SYR_foreign_specialists_desc:0 "阿联酋雇来的外国教官与工程师抵达叙利亚。他们不会出现在任何官方名单里，但军官们都知道谁真正在教他们。"
 SYR_fortify_golan_heights:0 "加固戈兰高地"
 SYR_fortify_golan_heights_desc:0 "在无法收复的土地上，最好的办法是让对手也付出代价。工兵团受命在库奈特拉前线构筑纵深防御，雷区、碉堡与反坦克阵地依地形层层展开。"
 SYR_found_sgc:0 "成立叙利亚天然气公司"
 SYR_found_sgc_desc:0 "天然气一直是石油的附庸，随采随烧，在火炬塔里白白烧掉。新成立的国家天然气公司要把伴生气收集起来，供给电厂和化肥厂。"
 SYR_fund_shia_militias:0 "资助什叶派民兵"
 SYR_fund_shia_militias_desc:0 "德黑兰提供资金、装备和教官，叙利亚提供基地与通行权。一批批来自伊拉克与黎巴嫩的志愿者进入叙利亚，兵营里的口音越来越杂。"
 SYR_green_syria:0 "“绿色叙利亚”计划"
 SYR_green_syria_desc:0 "光伏、风电与节能工程一并写进了国家发展纲要。欧洲的能源公司对向北输电的前景很感兴趣，条件是叙利亚的电网要达到欧盟标准。"
 SYR_guardians_of_revolution:0 "革命卫士"
 SYR_guardians_of_revolution_desc:0 "每一场革命都需要守护者，让它不被旧习惯、旧精英与旧独裁者吞掉。这些卫士将守在新秩序的门口，直到共和国强大到能保护自己。"
 SYR_hat_tr_foreign_education:0 "高级培训计划"
 SYR_hat_tr_foreign_education_desc:0 "外籍专家的短期培训升级为长期的联合培养：优秀的军官与工程师被送往海湾和欧洲深造，回国后担任骨干。"
 SYR_humanitarian_links_to_gaza:0 "通往加沙的人道通道"
 SYR_humanitarian_links_to_gaza_desc:0 "粮食、药品和发电机经叙利亚与埃及送往加沙。援助的名义是人道，意义却是政治——这是对封锁最直接的回答。"
 SYR_ideological_purity:0 "意识形态的纯洁"
 SYR_ideological_purity_desc:0 "我们要保持思想的纯洁，这能吸引更多追随者，也能巩固我们在地区内的地位。代价是，一切妥协都变得更加困难。"
 SYR_integrate_the_union:0 "融入联盟"
 SYR_integrate_the_union_desc:0 "联合共和国不再只是旗帜与口号：统一的议会、统一的军队、统一的货币，三条主线同时推进。这一天，被一代人描述成“回家”。"
 SYR_intervene_in_yemen:0 "干预也门"
 SYR_intervene_in_yemen_desc:0 "在海湾盟友的请求下，叙利亚向也门派出了军事顾问与少量特遣队。这既是对盟友的回报，也是让军队在真实战场上练兵的机会。"
 SYR_invest_shair_gas_field:0 "投资谢尔气田"
 SYR_invest_shair_gas_field_desc:0 "谢尔气田位于霍姆斯东面的沙漠中，是全国最重要的天然气来源之一。扩建处理厂和输气管线的预算批下来了，承包商需要在前线重新稳定下来之前尽快完工。"
 SYR_invite_egyptian_investors:0 "邀请埃及投资者"
 SYR_invite_egyptian_investors_desc:0 "埃及的建筑与食品企业收到了免税期与土地使用的优惠邀请。第一批商人带着样品和合同来到大马士革。"
 SYR_invite_mossad:0 "邀请摩萨德"
 SYR_invite_mossad_desc:0 "在反恐的旗帜下，一个以色列的情报联络组悄悄进驻大马士革。它的办公室离总统府只有几百米，这个事实本身就足以改变整个地区的力量格局。"
 SYR_invite_scientists:0 "外国科学家计划"
 SYR_invite_scientists_desc:0 "优厚的薪水、全家的居留权，再加上不被打扰的实验室——一份面向全球核物理学家的招聘启事悄悄发了出去。应聘者的来历，没有人会细问。"
 SYR_iran_riot_gear:0 "伊朗防暴装备"
 SYR_iran_riot_gear_desc:0 "德黑兰有二十年压制街头抗议的经验与成套的设备。盾牌、警棍和扩音车被运到叙利亚内政部的仓库。"
 SYR_iran_syria_bank:0 "伊叙联合银行"
 SYR_iran_syria_bank_desc:0 "伊朗与叙利亚在大马士革设立联合银行，为双边贸易提供结算与信贷，借此绕开部分金融制裁。"
 SYR_iran_syria_pipeline:0 "伊朗-叙利亚管线"
 SYR_iran_syria_pipeline_desc:0 "从南帕尔斯气田出发，经伊拉克中部通往地中海的输气管线终于破土动工。它既是能源通道，也是德黑兰与大马士革之间最长的纽带。"
 SYR_iranian_investments:0 "伊朗投资"
 SYR_iranian_investments_desc:0 "伊朗的承包商接下了大马士革的发电站和港口扩建工程。付款条件之一，是长期的原油与磷酸盐供货合同。"
 SYR_iranian_specialists:0 "伊朗专家"
 SYR_iranian_specialists_desc:0 "伊斯兰革命卫队的顾问和工程师住进了叙利亚的军营与工厂。他们带来了经验，也带来了自己的指挥链。"
 SYR_isis_negotiate:0 "与“伊斯兰国”谈判"
 SYR_isis_negotiate_desc:0 "“伊斯兰国”是地区内的强大势力，我们应当与它谈判，确保它站在我们这一边，并开出对双方都有利的条件。"
 SYR_issuing_jihad_orders:0 "发布圣战令"
 SYR_issuing_jihad_orders_desc:0 "向军队下达圣战令，让每一名士兵都明白：他们为哈里发国的事业而战。军心因此提振，国家也因此更难回头。"
 SYR_join_israeli_agreements:0 "加入亚伯拉罕协议"
 SYR_join_israeli_agreements_desc:0 "在华盛顿的草坪上，叙利亚的代表与以色列的代表握了手。这是中东近半个世纪的外交冰河期里，最令人意外的一次解冻。"
 SYR_kings_highway:0 "复兴国王大道"
 SYR_kings_highway_desc:0 "古老的国王大道从大马士革通往亚喀巴，贯穿了三千年的商队史。新的公路计划沿线改造路面、桥梁和边境口岸，让它成为叙利亚南部的商贸走廊。"
 SYR_kurds_agreement:0 "库尔德人协议"
 SYR_kurds_agreement_desc:0 "库尔德问题不能只靠武力解决。一份承认他们权利与抱负的约束性协议，或许就是统一而稳定的叙利亚所需要付出的代价。"
 SYR_little_hagia_sophia:0 "小圣索菲亚"
 SYR_little_hagia_sophia_desc:0 "把一座被土耳其人改作清真寺的古教堂列入联合国教科文组织的修复名单，是叙利亚向东正教世界发出的一份温和的信号。"
 SYR_liwa_al_quds:0 "圣城旅"
 SYR_liwa_al_quds_desc:0 "阿勒颇难民营的巴勒斯坦青年被编入叙利亚军队，组成了一支以“圣城”命名的旅。他们的使命是保卫叙利亚，也是等待有朝一日回到故乡。"
 SYR_military_coop_with_armenia:0 "与亚美尼亚的军事合作"
 SYR_military_coop_with_armenia_desc:0 "埃里温与大马士革共享对邻国的忧虑。联合演习、情报共享和军官交流计划，让两国的参谋们熟悉起了对方的口音。"
 SYR_mushriq_chase:0 "追缉多神教徒"
 SYR_mushriq_chase_desc:0 "宗教警察接到命令，对一切被认定为“以物配主”的人展开追缉。城里的少数教派连夜出逃，边境的难民营里又多了许多面孔。"
 SYR_negotiate_golan_buy:0 "谈判购回戈兰"
 SYR_negotiate_golan_buy_desc:0 "没有人敢公开说出口的方案：用钱和安全保证换回土地。海湾与西方的中间人带着一份“长期租赁加主权回归”的草案穿梭于两国之间。"
 SYR_negotiations_comission:0 "谈判委员会"
 SYR_negotiations_comission_desc:0 "胜利不只在战场上取得。我们成立委员会，与仍在犹豫的人对话，向愿意放下武器的人开出条件，也与远处观望的大国谈判。"
 SYR_nuclear_program:0 "核能计划"
 SYR_nuclear_program_desc:0 "原子能委员会在迪尔哈吉尔的研究堆旁边，悄悄起草了一份扩大核能研究的路线图。官方说法是发电，没人能保证它只有这一种用途。"
 SYR_overhaul_national_grid:0 "整修国家电网"
 SYR_overhaul_national_grid_desc:0 "战争与老化让国家电网变成了一张补丁摞补丁的网：变电站缺零件，高压线靠旧钢缆撑着，大马士革每天要停电好几次。能源部拿出一份全面的整修清单——先修变压器，再换主干线，最后才谈扩容。"
 SYR_palestinian_training_camps:0 "巴勒斯坦训练营"
 SYR_palestinian_training_camps_desc:0 "叙利亚境内的难民营旁，几处旧军营被改成了训练营。巴勒斯坦青年、也包括叙利亚的志愿者在这里学习游击战与城市作战。"
 SYR_please_rojava:0 "安抚罗贾瓦"
 SYR_please_rojava_desc:0 "大马士革承认了东北部库尔德人的语言与教育权利，并同意把部分地方税收留给当地自治机构。条件是旗帜仍是同一面。"
 SYR_prepare_materials:0 "铀矿开采与加工"
 SYR_prepare_materials_desc:0 "沙漠中的磷酸盐矿含有微量的铀。冶金所建起了一座小型选冶厂，样品被送往实验室检测——数据没有对外公布。"
 SYR_qatar_syria_pipeline:0 "卡塔尔-黎凡特管线"
 SYR_qatar_syria_pipeline_desc:0 "一条从卡塔尔穿过沙特与约旦、通向叙利亚地中海沿岸的输气管线，被反复写进地区合作的草案里。现在资金终于落实。"
 SYR_reform_construction_sector:0 "改革建筑行业"
 SYR_reform_construction_sector_desc:0 "建筑业是叙利亚腐败最集中的行业之一：层层转包、虚报工程量、偷工减料。住建部公布了新的建筑规范、招标规则和黑名单。"
 SYR_regional_alliance:0 "地区联盟"
 SYR_regional_alliance_desc:0 "两个复兴党的故国互相承诺：不再结盟反对对方，并在石油、水与边境问题上建立统一的立场。"
 SYR_repression:0 "建立镇压机器"
 SYR_repression_desc:0 "警察、情报机关与党的干部被重新编成一张细密的网。街头的反对声音被一点点地安静下来，而阵线的权力则变得无处不在。"
 SYR_restore_historical_sites:0 "修复历史古迹"
 SYR_restore_historical_sites_desc:0 "帕尔米拉、大马士革古城、阿勒颇的城堡和骑士堡——这个国家有一半的历史都刻在石头上。文物局得到了专项预算与国际专家的援助。"
 SYR_restore_political_ties:0 "恢复与埃及的政治关系"
 SYR_restore_political_ties_desc:0 "开罗与大马士革之间的大使馆重新挂起了国旗。曾经联合过的两个共和国，又坐到了同一张谈判桌前。"
 SYR_shiniest_democracy:0 "最闪亮的民主"
 SYR_shiniest_democracy_desc:0 "改革不再是口号，而是一场演出，叙利亚要换上最漂亮的面孔。把机构擦亮，把胜利宣扬出去，让世界看到一个地区前所未有的民主。"
 SYR_siib:0 "首家伊斯兰银行"
 SYR_siib_desc:0 "第一家按伊斯兰教法经营的银行获得了牌照，股东中有海湾的投资人。分行开到了大马士革的老城区，虔诚的商人终于有了一个不违背信仰的储蓄去处。"
 SYR_smuggle_oil_through_iraq:0 "伊拉克石油的走私通道"
 SYR_smuggle_oil_through_iraq_desc:0 "伊拉克的原油装在油罐车里，经过一座没人检查的边境口岸，运到巴尼亚斯的炼油厂。这笔生意没有账本，只有一些默契。"
 SYR_stock_exchange:0 "叙利亚证券交易所"
 SYR_stock_exchange_desc:0 "大马士革证券交易所的筹备已经拖了很多年。这一次，财政部拿出了完整的上市规则和投资者保护条款，第一批上市公司名单也已确定。"
 SYR_strategic_iran_supply:0 "伊朗战略补给"
 SYR_strategic_iran_supply_desc:0 "一条由德黑兰出资的空中与陆路补给线，把弹药、油料与备件源源不断地运到叙利亚。国防部的仓库第一次有了“安全库存”。"
 SYR_streamline_energy_sector:0 "精简能源行业"
 SYR_streamline_energy_sector_desc:0 "补贴式的低电价让能源企业年年亏损，维修费永远排不上队。新政策把电价与成本挂钩，削减过剩的中间机构，同时给低收入家庭发放用电补助。"
 SYR_strongarm_minorities:0 "强压少数族群"
 SYR_strongarm_minorities_desc:0 "政府组建了以亚述人和基督徒为主的地方军团，负责东北边境的村镇防务，也负责盯着其他武装派别。"
 SYR_supply_pij:0 "援助伊斯兰圣战运动"
 SYR_supply_pij_desc:0 "大马士革长期收留着伊斯兰圣战运动的办公室。现在，总参谋部批准向它输送资金、弹药与训练名额——这条线索足以让西方的外交官彻夜开会。"
 SYR_support_of_druzes:0 "支持德鲁兹人"
 SYR_support_of_druzes_desc:0 "南部的德鲁兹社区长期生活在恐惧与忠诚之间。只要保证他们在新秩序里的位置，就能证明这个叙利亚不会建立在排斥少数者之上。"
 SYR_support_sunnis:0 "争取逊尼派世界"
 SYR_support_sunnis_desc:0 "官方媒体不再把逊尼派社群只当“问题”，而是邀请他们的学者与商人进入政府咨询机构。沙特与卡塔尔的使者感觉到了风向的变化。"
 SYR_suppress_islamists:0 "压制伊斯兰主义者"
 SYR_suppress_islamists_desc:0 "反对派必须决定：自由到哪里为止，狂热从哪里开始。为了让共和国活下去，不能放任极端分子从内部劫持民主事业。"
 SYR_suppress_kurds:0 "压制库尔德人"
 SYR_suppress_kurds_desc:0 "国家安全局宣布取缔在边境地区活动的库尔德武装，与土耳其的边境协议因此重新提上日程。"
 SYR_suppress_traitors:0 "清除叛徒"
 SYR_suppress_traitors_desc:0 "并非每个与我们同行的人都是忠诚的。间谍、线人，以及为了安全出卖革命的人，都会被找出来。"
 SYR_syria_isr_trade_pact:0 "与以色列的贸易协定"
 SYR_syria_isr_trade_pact_desc:0 "从海法到拉塔基亚的货运线路开通，水果、软件与建材通过第三国转口。最初，两国的报纸都不敢刊登这条新闻。"
 SYR_syrian_qatari_holding_company:0 "叙利亚-卡塔尔控股公司"
 SYR_syrian_qatari_holding_company_desc:0 "多哈的主权基金与大马士革的企业家合办了一家控股公司，投资于酒店、通信与农产品加工。"
 SYR_talk_to_gulf_states:0 "与海湾国家对话"
 SYR_talk_to_gulf_states_desc:0 "外交部长带着代表团巡访海湾各国，希望把战争年代断掉的贸易线、资金流与合作协议重新接起来。"
 SYR_to_sham_and_beyond:0 "向沙姆与更远之处进军"
 SYR_to_sham_and_beyond_desc:0 "我们要把军队开向沙姆乃至更远的地方，把我们的主张传播到世界各地。从这一刻起，没有国家会把我们当作普通的邻居。"
 SYR_treasures_levantine_sea:0 "黎凡特海的宝藏"
 SYR_treasures_levantine_sea_desc:0 "东地中海海底的天然气田让整个地区的外交官们坐立不安。叙利亚宣布了自己的专属经济区，并邀请外国能源企业联合勘探——哪怕邻国还在为海上划界争吵不休。"
 SYR_turkish_backing:0 "土耳其的防务保护"
 SYR_turkish_backing_desc:0 "安卡拉把叙利亚的稳定视为自己边境安全的关键。把两国关系正式化，就能换来现代装备、后勤支援，以及对敌人的有力威慑。"
 SYR_turkoman_militias:0 "土库曼民兵"
 SYR_turkoman_militias_desc:0 "北部的土库曼人村庄组织了自己的民兵。大马士革与安卡拉都想把它们拉到自己一边，而它们自己的盘算是：谁出得起价钱。"
 SYR_uae_economic_cooperation:0 "与阿联酋的经济合作"
 SYR_uae_economic_cooperation_desc:0 "阿联酋的自贸区模式被搬到了拉塔基亚港：免税、一站式审批、外籍人员的居留许可。"
 SYR_uae_weapons:0 "通过阿联酋采购"
 SYR_uae_weapons_desc:0 "经由阿联酋的转口公司，叙利亚买到了在公开市场上买不到的装备与零部件。每一张订单都经过三个国家的中间商。"
 SYR_us_support:0 "美国的支持"
 SYR_us_support_desc:0 "我们将请求华盛顿为新的文官政府提供外交承认、政治杠杆与谨慎的影响力。如果美国人愿意投资我们的未来，叙利亚或许能成为一个伙伴。"
 SYR_western_debt_negotiations:0 "与西方债权国谈判"
 SYR_western_debt_negotiations_desc:0 "在巴黎和布鲁塞尔的会议室里，叙利亚代表团带着一份详尽的偿债方案来谈重组：延长期限、降低利率，换取对市场准入与法治改革的承诺。"
