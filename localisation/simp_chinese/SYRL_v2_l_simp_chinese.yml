l_simp_chinese:
 SYRL.1.a:0 "向军官团保证：军队不动"
 SYRL.1.b:0 "不要停，继续往前"
 SYRL.1.d:0 "总统在党的地区领导机构会议上读完那份“回到初心”的报告，会场里安静了很久。年长的书记低头翻着手里的文件，年轻的干部在桌下互相递眼色。散会后，有人走上来握手，也有人没有握。\n\n阿拉维派军官团的几位将军私下表示：只要不动军队，他们愿意看一看。总统身边的顾问提醒他，这一步走得越快，要面对的就是越多的暗流。"
 SYRL.1.t:0 "党的反应：他想把党还给党员"
 SYRL.10.a:0 "邀请所有人，包括温和的伊斯兰人士"
 SYRL.10.b:0 "只邀请世俗派反对派"
 SYRL.10.d:0 "开幕式上，一位被软禁了八年的作家对着话筒说：“今天我第一次用不着压低声音。”会场里有笑声，也有人抹眼泪。\n\n筹备委员会请示总统：名单上有几位温和的伊斯兰人士，要不要邀请？"
 SYRL.10.t:0 "全国对话"
 SYRL.11.a:0 "对所有武装一律停火"
 SYRL.11.b:0 "只与温和派谈，继续打击极端派"
 SYRL.11.d:0 "总统在电视上宣读停火方案，没有使用“叛乱分子”这个词，而是说“我们的同胞”。几小时后，反对派的前线指挥官通过中间人传来回复：愿意谈，但要求国际监督。\n\n军队的强硬派反对，认为这是软弱；外交部则认为，这是内战中第一次有人先放下武器。"
 SYRL.11.t:0 "左翼停火"
 SYRL.12.a:0 "宪章生效"
 SYRL.12.d:0 "宪章签署仪式上，各教派和各政党的代表依次在文本上签字。有人是用左手签的，有人在签名旁画了十字，有人按了指印。\n\n宪章的第一条写道：“国家的主权属于人民，任何人、任何家族、任何教派、任何政党不得据为己有。”"
 SYRL.12.t:0 "国家宪章"
 SYRL.13.a:0 "叙利亚，新的开始"
 SYRL.13.d:0 "总统在议会宣读新的国家纲领。[SYRL_f_pol] [SYRL_f_eco] [SYRL_f_for]\n\n国家领导委员会、任期限制、独立的军队、可质询的议会、各教派平等的公民国家——五十年来，复兴党第一次不需要借助恐惧来证明自己的合法性。叙利亚的历史翻开了新的一页，前提是这一页没有被人撕掉。"
 SYRL.13.t:0 "新复兴共和国"
 SYRL.14.a:0 "强硬回应：资源属于人民"
 SYRL.14.b:0 "缓和一步：承诺保护合法投资"
 SYRL.14.d:0 "国有化法令公布的当天，几家外国石油公司撤走了钻井队，海湾国家的大使被召回，华尔街的分析师预测“叙利亚风险溢价”将升高。国内的石油工人们则在井场上放起了鞭炮。\n\n外交部提出两种应对：强硬回应，或者缓和一步，承诺保护外国投资者的合法权益。"
 SYRL.14.t:0 "石油与水资源国有：海湾与西方的反应"
 SYRL.15.a:0 "支持各派的政治与武装斗争"
 SYRL.15.b:0 "以难民权利与外交为主"
 SYRL.15.d:0 "大马士革会议在各派的争吵中开幕：有人要求武装斗争，有人主张外交谈判，有人干脆拒绝出席。总统在开幕词里只说了一句话：“我们的责任，是给难民法律上的尊严，而不是给他们新的墓碑。”"
 SYRL.15.t:0 "巴勒斯坦事业"
 SYRL.16.a:0 "邀请教士参与课程审订"
 SYRL.16.b:0 "坚持：不让步"
 SYRL.16.d:0 "大马士革的几座大清真寺在周五布道里同时批评新课程，说它“在孩子的心中种下怀疑”。教育部长给每一位布道者送去了教材，并邀请他们参加课程审订会。\n\n总统被告知：一些省份的家长们担心，一场信仰与世俗之间的对抗，可能就要来了。"
 SYRL.16.t:0 "世俗义务教育：教士的反应"
 SYRL.2.a:0 "全部没收，一分不留"
 SYRL.2.b:0 "达成和解：退还一部分，家族让出控制权"
 SYRL.2.d:0 "法庭上的判决念到第三页时，旁听席上有人轻轻吸了一口气：电信公司被没收，免税店特许权被撤销，几十亿美元的资产被冻结。判决书上的名字，是总统的表亲。\n\n街头出现了自发的游行，人们举着总统的照片；与此同时，有几位退役军官和商人乘夜班飞机离开了大马士革。财政部长说，这笔钱足以支付两年的教师工资。"
 SYRL.2.t:0 "家族财阀的清算"
 SYRL.3.a:0 "逮捕他，清洗共和国卫队的军官"
 SYRL.3.b:0 "谈判：让他流亡，给他体面"
 SYRL.3.c:0 "让卫队自己选：叙利亚陷入内战"
 SYRL.3.d:0 "凌晨四点，国防部长打来电话：共和国卫队的几个旅正在向大马士革集结，马赫·阿萨德要求与总统“当面谈谈”。他的要求很简单——停止清算，恢复家族对军队的指挥权。\n\n总统府的卫队有四百人，卫戍区的步兵旅态度不明。这不是一次普通的政变，而是对“回到初心”整条路线的投票。"
 SYRL.3.t:0 "最后通牒：共和国卫队"
 SYRL.4.a:0 "给他们荣誉与职位，换取合作"
 SYRL.4.b:0 "收回特权，一视同仁"
 SYRL.4.d:0 "欢送会上，老国防部长举起酒杯，说了三个字：“保重吧。”没有人鼓掌。他的办公室第二天就空了，桌上放着一只军用手表和一张便条：“给年轻人用。”\n\n元老们的沉默比任何抗议都更让人不安。他们在军队、安全部门与地方党组织里仍有数不清的门生故旧。"
 SYRL.4.t:0 "元老的沉默"
 SYRL.5.a:0 "站在技术官僚一边：技术治国"
 SYRL.5.b:0 "站在左翼一边：回到社会主义"
 SYRL.5.c:0 "折中：各退一步"
 SYRL.5.d:0 "第一天，元老们发言强调“稳定高于一切”；第二天，官僚们拿出了五年的经济数据，要求“用专家治国”；第三天，左翼代表们走上讲台，高喊“社会主义不是口号”。代表们鼓掌的声音，一次比一次更不一致。\n\n总统走下主席台，站在会场中间。党的未来，要由他的表态来定调。"
 SYRL.5.t:0 "党代表大会：三派之争"
 SYRL.6.a:0 "接受：任期七年，连任一次"
 SYRL.6.b:0 "延后到下一届才生效"
 SYRL.6.d:0 "投票站前排起了长队。电视台直播了计票：赞成率超过八成，投票率之高是三十年来罕见的。议会里有几位元老投了弃权票，但没有人公开反对。\n\n外国使馆发来了祝贺，国内的评论员则在问：下一个被限制的，会是什么？"
 SYRL.6.t:0 "任期限制公投"
 SYRL.7.a:0 "给他们更多时间与补偿"
 SYRL.7.b:0 "最后期限：逾期撤职"
 SYRL.7.d:0 "国防部的命令是：共和国卫队并入统一指挥。卫队司令的回复是一份“技术性说明”，意思是装备和人员需要时间交接。三周过去了，一个旅也没有动。\n\n军官们在等一个信号：总统是认真的，还是只是在试探？"
 SYRL.7.t:0 "共和国卫队的抗命"
 SYRL.8.a:0 "启动与伊拉克的联合委员会"
 SYRL.8.b:0 "只谈经济：关税与货币联盟"
 SYRL.8.d:0 "巴格达回复了邀请，开罗与的黎波里也派出了观察员。大马士革的老人们记得 1958 年的欢呼，年轻人则更关心签证与关税。\n\n外交部提出了两套方案：与伊拉克启动联合委员会，探讨政治层面的统一；或者先从经济入手，只谈关税与货币联盟。"
 SYRL.8.t:0 "阿拉伯团结的回响"
 SYRL.9.a:0 "全面入籍，并承认库尔德语教学"
 SYRL.9.b:0 "先入籍，语言问题分阶段处理"
 SYRL.9.d:0 "在哈塞克的一座广场上，几千名库尔德人排队领取新的身份证。一位七十岁的老人拿着泛黄的 1962 年证件说：“我们等了四十年。”\n\n安卡拉发表了声明，称这是“在边境制造新的麻烦”。北部边境的部队被告知：保持克制。"
 SYRL.9.t:0 "库尔德人入籍"
 SYRL_arab_socialism_desc:0 "阿拉伯社会主义不是照搬莫斯科，也不是照搬开罗。党的理论家重新整理了阿弗拉克与比塔尔的文章：社会主义是为了让每个阿拉伯人有尊严地生活，国家要保护劳动者，而不是自己变成新的地主。从这里开始，党的经济政策有了一条与苏联式计划不同的底线。"
 SYRL_arab_socialism_idea:0 "阿拉伯社会主义"
 SYRL_arab_socialism_idea_desc:0 "国家保护劳动者，但不取代劳动者。"
 SYRL_arab_unity_desc:0 "1958 年的叙埃合并只维持了三年，但那种“阿拉伯人可以站在一起”的感觉留在了几代人的心里。这条路线主张分阶段统一：先是关税与货币联盟，再是联合防务，最后才是政治整合。巴格达、的黎波里和开罗都收到了大马士革的邀请。"
 SYRL_arab_unity_idea:0 "分阶段的阿拉伯统一"
 SYRL_arab_unity_idea_desc:0 "关税、货币、防务、政治，一步一步来。"
 SYRL_army_prof_idea:0 "职业化军队"
 SYRL_army_prof_idea_desc:0 "晋升看考试与战功，不看出身与家族。"
 SYRL_baath_congress_desc:0 "十年来第一次，党代表大会的代表不是由上级指定，而是由基层党员差额选举产生。会场里有三种声音：捍卫“稳定第一”的元老，主张“技术治国”的官僚，要求“回到社会主义”的左翼。总统坐在主席台上，知道这次会议将决定党的未来十年。"
 SYRL_baath_ideals_3:0 "复兴党的新生"
 SYRL_baath_ideals_3_desc:0 "党不再属于任何家族，统一、自由、社会主义重新成为可以检验的承诺。"
 SYRL_banks_idea:0 "国有银行体系"
 SYRL_banks_idea_desc:0 "农业、住房、小企业三类专项银行。"
 SYRL_charter_idea:0 "国家宪章"
 SYRL_charter_idea_desc:0 "没有任何教派或政党可以单独修改。"
 SYRL_civil_state_desc:0 "“公民国家”写进了宪法序言：所有公民无论教派、民族与性别，在法律面前一律平等；国家不再以任何教派的名义说话。这并不意味着宗教被边缘化，而是意味着宗教不再被用作权力的筹码。"
 SYRL_collective_idea:0 "国家领导委员会"
 SYRL_collective_idea_desc:0 "重大决定须经多数通过，决策更慢，也更少极端。"
 SYRL_collective_leadership_desc:0 "总统宣布成立“国家领导委员会”：总统、总理、议长、党的总书记、军队与安全部门首长共同议事，重大决定须多数通过。这在叙利亚是前所未有的——总统自愿把一部分权力放进一个会议桌里，换来的是决策更慢，也更不容易走极端。"
 SYRL_council_power_desc:0 "人民议会终于有了预算审议权、质询权和对总理的信任投票权。第一次，部长们要在电视直播下回答议员的提问。议会不再是“橡皮图章”，但也远不是西方式的议会——它在两者之间摸索着自己的位置。"
 SYRL_depoliticize_army_desc:0 "军队曾是复兴党的党员、家族的卫士，也是政权最后的保险。总统下令：现役军官不得担任党内职务，共和国卫队并入国防部统一指挥，晋升以考试和战功为准。军官们第一次要为“谁来保卫这个国家”写下答案。"
 SYRL_end_dynasty_desc:0 "“家族政治”是复兴党最难启齿的话题。总统颁布命令：总统的亲属不得担任军队、安全部门与国有企业的要职，现任者两年内全部交接。这是一场针对自己人的整肃，也是整条路线的信用保证——如果连家族都不肯动，“回到初心”就只是一句口号。"
 SYRL_euphrates_basin_desc:0 "塔布卡大坝建成之后，幼发拉底河流域一直没有得到系统开发。新的流域管理局统筹水利、灌溉、电站和移民安置，让拉卡、代尔祖尔与哈塞克的粮棉区连成一片。这是叙利亚东部最大的民生工程，也是东西部差距缩小的第一步。"
 SYRL_five_year_plan_desc:0 "计划委员会拿出了新的五年计划：目标不是钢产量，而是就业、粮食、水电与出口加工区。农村合作社路线下，重点是农机、仓储与加工；国家工业路线下，重点是石化、纺织与军工配套。每个省都分到了自己的指标，也分到了自己的责任。"
 SYRL_fork_eco_in:0 "国有工业重新站了起来。"
 SYRL_fork_eco_pe:0 "农村合作社扎下了根。"
 SYRL_fork_for_ar:0 "阿拉伯团结的大门打开了。"
 SYRL_fork_for_na:0 "不结盟成了叙利亚外交的底色。"
 SYRL_fork_none:0 ""
 SYRL_fork_pol_pl:0 "党仍是第一大党，却要在选票上赢得多数。"
 SYRL_fork_pol_pr:0 "党只有一个，却是一个愿意被自己人质询的党。"
 SYRL_free_unions_desc:0 "工会与农民联合会从“党的传送带”变成了会员自己的组织：干部由会员选举，集体谈判合法，罢工有了法律程序。国企经理们学会了与工会代表坐下来谈判，而不是打电话给安全部门。"
 SYRL_housing_idea:0 "公共住房"
 SYRL_housing_idea_desc:0 "租金不超过家庭收入的四分之一。"
 SYRL_internal_democracy_desc:0 "这条路线相信：党不必靠别的政党来制衡，而要靠党内的民主来自我纠错。各级书记由党员差额选举，中央委员会公布预算，批评与自我批评重新成为制度。这是“一党改革”路线：只有一个党，但必须是一个愿意被自己人质询的党。"
 SYRL_iraq_reconcile_desc:0 "叙利亚与伊拉克的复兴党分裂于 1966 年，此后互相指责了几十年——一个说对方是“叛徒”，另一个说对方是“暴君”。这一次，大马士革主动派出代表团：党的分歧留给党去谈，两国的边界、水资源与管道，不应再成为政治的人质。"
 SYRL_kurdish_citizenship_desc:0 "1962 年哈塞克的特别人口普查剥夺了数十万库尔德人的国籍，他们没有身份证，不能上大学，不能买房，不能出国。如今，政府宣布恢复他们的公民身份，并承认库尔德语为教学语言之一。边境对面的安卡拉对此极不高兴。"
 SYRL_land_reform_desc:0 "1958 年的土改让几十万农民第一次拥有了土地，但后来的承包与特权又把土地一点点集中起来。这一次，政府以合作社为载体，把大地主闲置的土地转交给无地农民，并保证灌溉与种子。工业化暂缓一步，农村先稳住——这是“农村合作社”路线。"
 SYRL_left_ceasefire_desc:0 "内战还在进行，但总统决定先伸出手：无条件停火、国际监督下的人道走廊、对所有未犯下严重罪行的叛军战士的赦免。这个方案同时让反对派与政权内部的强硬派感到不安，但它给了战场外的人一个看得见的出口。"
 SYRL_makhlouf_trial_desc:0 "大马士革最大的几家企业——电信、免税店、石油服务——都登记在总统的表亲名下。检察官奉命翻开账本：逃税、垄断、强占土地。审判在大马士革宫殿旁的法院进行，旁听席上坐满了记者。民众欢呼，另一些人则在深夜里打电话。"
 SYRL_media_reform_desc:0 "全国媒体改革成立独立的媒体监管委员会，国营电视台的董事会由议会选举。私营电台与网络媒体获得合法执照，条件只有一条：对诽谤负责。信息不再从宫殿流向民众，而是在两者之间流动。"
 SYRL_merit_cadres_desc:0 "党校重新开课，干部选拔不再看出身，而看考试、业绩和群众评议。一批工程师、经济学家和年轻军官被提拔到省级岗位。老党员抱怨“规矩变了”，年轻人则第一次觉得入党是一条真正的上升通道。"
 SYRL_minorities_council_desc:0 "“宗教与族裔平等委员会”由逊尼派、阿拉维派、基督徒、德鲁兹、伊斯玛仪派、库尔德与亚美尼亚人的代表组成，每一项涉及少数群体的立法都要先过委员会这一关。“少数”这个词，在叙利亚第一次不意味着“被保护者”。"
 SYRL_national_charter_desc:0 "“国家宪章”由全国对话产生的起草委员会撰写，没有任何一个教派或政党可以单独修改。宪章规定了公民的基本权利、国家的基本制度和权力的基本边界。文本很长，但最打动人的是序言里的一句话：“叙利亚属于所有生活在这里的人。”"
 SYRL_national_dialogue_desc:0 "总统在议会大厦召开“全国对话”，邀请党内外的各路人物：被软禁的作家、流亡归来的律师、清真寺的教长、教会的主教、库尔德与德鲁兹的代表。会场很吵，但没有人拂袖而去——这已经是十几年来最好的结果。"
 SYRL_nationalize_banks_desc:0 "银行与保险业由国家控股，设立农业、住房与小企业三类专项银行。私人银行家不再决定谁能借到钱，而是国家决定把钱借给谁。资本外逃的警报响了几个月，但随后存款回流，因为人们发现国家银行的利率更稳定。"
 SYRL_new_republic_desc:0 "总统在议会宣读新的国家纲领：复兴党属于人民，而不属于哪一个家族。国家领导委员会、任期限制、独立的军队、可质询的议会、各教派平等的公民国家……五十年来，复兴党第一次不需要借助恐惧来证明自己的合法性。叙利亚的历史翻开了新的一页——前提是这一页没有被撕掉。"
 SYRL_nonaligned_desc:0 "大马士革在冷战中站过队，在冷战后吃过亏。新的外交原则很简单：不加入任何军事集团，不与任何大国签署排他性协议，对所有愿意做生意的国家敞开大门。不结盟不是中立的借口，而是让叙利亚在大国之间保持最大议价空间的办法。"
 SYRL_nonaligned_idea:0 "不结盟外交"
 SYRL_nonaligned_idea_desc:0 "对所有愿意做生意的国家敞开大门。"
 SYRL_npf_pluralism_desc:0 "民族进步阵线长期只是复兴党的陪衬。现在，阵线内的共产党、纳赛尔派与社会主义联盟获得独立的党章、报刊和提名权，议会的复兴党席位不再有固定名额。这是“多党竞争”路线：复兴党仍是第一大党，但必须学会在选票上赢得多数。"
 SYRL_oil_idea:0 "资源国有"
 SYRL_oil_idea_desc:0 "石油、天然气与水权属于全民。"
 SYRL_oil_water_desc:0 "石油、天然气和跨境河流的水权被宣布为全民所有，任何外国公司的开采合同都必须经议会批准，收益的三分之一进入全国地区平衡基金。海湾国家与西方石油公司的反应并不愉快，但国内的反应是欢呼。"
 SYRL_palestine_cause_desc:0 "复兴党的第一句话是“统一”，而统一的最大伤口在巴勒斯坦。党重新把巴勒斯坦问题放回外交的中心：不是为了战争，而是为了让难民获得法律地位，让解放组织各派在大马士革坐在同一张桌子上。"
 SYRL_party_democracy_idea:0 "党内民主"
 SYRL_party_democracy_idea_desc:0 "党自己监督自己：差额选举、公开预算、批评与自我批评。"
 SYRL_pension_system_desc:0 "全民养老金覆盖了过去没有任何保障的农民、个体户与家庭妇女。基金由国家、雇主与个人共同出资，由独立的委员会管理，禁止挪作他用。第一批领到养老金的老人，用手在领款窗口前合十：他们这一辈子没有想到过。"
 SYRL_people_army_desc:0 "“人民军队”不是一句口号：新的兵役法缩短服役期、提高津贴，退役军人享有教育与住房优先权，军官的晋升由独立的评审委员会负责。军队不再是家族的私兵，也不再是党的工具，而是国家的军队。"
 SYRL_people_army_idea:0 "人民军队"
 SYRL_people_army_idea_desc:0 "缩短服役、提高津贴、退伍军人优先。"
 SYRL_press_dialogue_desc:0 "官方报纸可以刊登对政策的批评，电视台可以邀请反对派学者做节目，禁止出版的书籍重新摆上大马士革的书店。审查机构没有被取消，但“红线”从几百条减到了几条。社会第一次发现，公开讨论并不会让国家崩溃。"
 SYRL_press_idea:0 "公开讨论"
 SYRL_press_idea_desc:0 "批评政策不再是罪名。"
 SYRL_price_commission_desc:0 "物价委员会每月公布基本食品与燃料的指导价，市场监察员有权突击检查囤积与哄抬。通胀被压在可控范围，代价是部分商品的短缺。委员会主席说：“宁可让人排队买到面包，也不要让人看着面包买不起。”"
 SYRL_price_idea:0 "物价委员会"
 SYRL_price_idea_desc:0 "宁可排队买面包，也不要买不起面包。"
 SYRL_progressive_tax_desc:0 "累进税制取代了过去的“熟人征税”：收入越高、资产越多，税率越高；偷税漏税者的名字会在报纸上公布。商人协会抗议了一阵，但国家第一次拥有了一个与石油收入无关的稳定财源。"
 SYRL_public_housing_desc:0 "大马士革和阿勒颇郊外的贫民区正被拆除重建。新的公共住房区配有学校、诊所、公共汽车与市场，租金不超过家庭收入的四分之一。承包的国企被要求公开招标，工人也分到了第一批房子。"
 SYRL_public_sector_desc:0 "国有工厂是叙利亚工业的骨架，但几十年的低效与走私让它们风雨飘摇。新的国有企业法规定：厂长对业绩负责，利润留成用于技改，亏损企业限期整顿或重组。国家不再只是“老板”，而要成为合格的工业家——这是“国家工业”路线。"
 SYRL_rebuild_people_desc:0 "战后重建不再由总统府的承包商垄断，而是由“人民重建委员会”统筹：每个城区选出居民代表，决定先修学校还是先修医院。重建的速度比想象的慢，但每一座新建的建筑背后，都有人签过字。"
 SYRL_retire_old_guard_desc:0 "哈菲兹时代留下的元老们——副总统、国防部长、总参谋长——在位已近三十年。总统给他们安排了体面的退休：荣誉头衔、国家勋章、一栋面向卡西云山的别墅。有人感激，有人读懂了其中的意思。党内外都在问：元老之后，谁说了算？"
 SYRL_return_roots_desc:0 "继位后的头几个月，年轻的总统一份一份翻阅党的档案：1947 年的建党纲领，1963 年的三月革命，1966 年的“新复兴党”……“统一、自由、社会主义”先是革命口号，后来成了墙上的装饰，最后成了家族权力的遮羞布。他决定回到起点，让党重新成为一个有思想、有纪律、不属于任何家族的组织。这一步，既得利益者不会看不见。"
 SYRL_rural_electrification_desc:0 "最后几千个没有电的村庄通了电，打井与滴灌系统覆盖了干旱的东部。电线杆立起来的地方，学校和诊所也立了起来。农民说：“以前我们靠天吃饭，现在靠政府吃饭。”——总统把这句话看成是对政策的最大批评，也是最大的激励。"
 SYRL_secular_edu_idea:0 "世俗义务教育"
 SYRL_secular_edu_idea_desc:0 "懂得提问的学生。"
 SYRL_secular_education_desc:0 "课程改革把宗教课与公民课分开，教科书里增加了叙利亚多元历史的内容，各地增设理工与师范学院。总统在开学典礼上说：“我们要培养的是懂得提问的学生。”部分教士认为这是在削弱信仰，教育部长不得不开始与他们谈判。"
 SYRL_self_reliance_desc:0 "“自力更生计划”不是闭关锁国，而是在粮食、药品、能源与基础工业这四个领域，确保叙利亚在最糟糕的情况下也能自己活下去。国家对战略行业给予税收与信贷优惠，并要求关键设备有国产化率。"
 SYRL_solidarity_desc:0 "非洲与拉美的新兴国家在联合国大会上数次支持叙利亚的提案，大马士革则向它们开放大学奖学金与医疗援助。这是一种外交上的互惠：弱者联合起来，声音就不再是少数的声音。"
 SYRL_south_idea:0 "南南合作"
 SYRL_south_idea_desc:0 "发展中国家之间的贸易仍然开着。"
 SYRL_south_south_desc:0 "叙利亚的贸易代表团飞往印度、巴西、南非与印度尼西亚，签署了药品、农机与纺织品的合作协议。“南南合作”不是意识形态，而是务实：发达国家的市场被门槛封住的时候，发展中国家之间的贸易仍然开着。"
 SYRL_tax_idea:0 "累进税制"
 SYRL_tax_idea_desc:0 "收入越高、资产越多，税率越高。"
 SYRL_term_limits_desc:0 "宪法修正案规定：总统任期七年，连任不得超过一次。条文只有一行，却改变了叙利亚政治的底色——它向国内外宣告，这个国家不再是“终身制”。修正案将交由人民议会和全民公投通过，反对者的声音比预想的更小，也更危险。"
 SYRL_total_defense_desc:0 "全民防御学说强调：小国不能靠一支大军取胜，而要靠全民的组织、预备役的动员、民防与要塞化的地形。国防部发布了新的预备役法，每个县都有自己的防御计划。军费没有增加，但每一分钱都花得更精确。"
 SYRL_total_defense_idea:0 "全民防御"
 SYRL_total_defense_idea_desc:0 "预备役、民防与要塞化的地形。"
 SYRL_welfare_state_desc:0 "免费医疗从省会延伸到每一个乡镇，义务教育延长到九年，大学学费全免。财政压力不小——这笔钱来自国企利润与新的累进税。但对一个刚刚走出恐惧的社会来说，“国家为我做了什么”比“国家要求我做什么”更能赢得人心。"
 SYRL_women_equality_desc:0 "修改家庭法：成年女性无需监护人同意即可签订合同与旅行，离婚与监护权的规定向男女平等靠拢，禁止所谓“荣誉犯罪”的减刑。保守的神职人员强烈反对，但职场里的女性教师、医生与工程师支持这一步。"
 SYRL_women_idea:0 "妇女平等"
 SYRL_women_idea_desc:0 "更多女性进入职场与学校。"
 SYRL_workers_coops_desc:0 "工人代表进入工厂管理委员会，农民合作社获得自己的银行账户与采购权。党的干部起初不习惯“被工人质询”，但当产量上升、旷工下降之后，反对声音小了很多。“社会主义”这个词，第一次在车间里有了具体的含义。"
