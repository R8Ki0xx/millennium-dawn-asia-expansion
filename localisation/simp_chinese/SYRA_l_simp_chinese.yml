l_simp_chinese:
 SYRA.1.a:0 "公平竞选：所有政党同样的广播时间与经费"
 SYRA.1.b:0 "保住复兴党的优势：地方组织与国家媒体全力动员"
 SYRA.1.d:0 "战争结束后的第一次大选定在下个月。街头挂满了各党的标语：复兴党的老标语旁边，是新成立的政党的鲜红与翠绿海报。选举委员会主任来到总统府，请示竞选的规则：是让所有政党在同一起跑线上竞争，还是让复兴党保留党报、电视台与地方组织的“天然优势”？"
 SYRA.1.t:0 "大选前夜"
 SYRA.3.a:0 "读懂选票里的警告：开放反腐与任期限制"
 SYRA.3.b:0 "把胜利解释为人民的授权：按原计划推进"
 SYRA.3.d:0 "计票结束，复兴党以明显优势赢得议会多数。庆祝的人群涌向大马士革的七月广场，但党的秘书长在内部讲话中冷静得多：很多选票是出于对战争的恐惧而投的，而不是出于对党的热爱。"
 SYRA.3.t:0 "复兴党赢得多数"
 SYRA.4.a:0 "体面交接：承认结果，党转入在野"
 SYRA.4.b:0 "讨价还价：以军队与情报系统保留否决权为条件交权"
 SYRA.4.c:0 "拒绝下台：宣布选举无效，共和国卫队进驻首都"
 SYRA.4.d:0 "计票结果传来：复兴党没有保住议会多数，新的执政党已经产生。深夜，总统府里的灯一直亮着。军队的将领、情报系统的负责人和党的元老分别要求面见总统——他们都想知道，复兴党会不会交出权力。"
 SYRA.4.t:0 "复兴党落选"
 SYRA.5.a:0 "继续"
 SYRA.5.d_bargain:0 "权力在深夜的闭门会议上完成了交接。条款不对外公布，但议员们都知道：国防部与情报系统的任命，新政府必须得到前政权的同意。民主在这里是有条件的。"
 SYRA.5.d_peaceful:0 "总统在电视直播中向新总理交出了总统府的钥匙。镜头里，两位老对手握了手；广场上，有人哭，有人笑。这是叙利亚近六十年来第一次通过选票完成权力的更替。"
 SYRA.5.t:0 "权力的交接"
 SYRA.6.a:0 "继续"
 SYRA.6.d_dem:0 "民主派政府的头一年过得磕磕绊绊：新闻自由让每一个丑闻都登上头版，议会里的辩论长得让人疲惫。但没有人再需要在深夜被敲门。"
 SYRA.6.d_fas:0 "宗教政党政府的头一年，清真寺的扩音器成了新的政府公告栏。世俗派的抗议被警察驱散，海湾的援助款项却比预期更早到账。"
 SYRA.6.d_left:0 "新的左翼政府继承了复兴党留下的国家机器，也继承了它的债务。它承诺比前任更廉洁、更开放，但选民的耐心不会太久。"
 SYRA.6.d_nat:0 "民族主义政府的头一年充满了游行、阅兵和关于“历史疆界”的演讲。军队的预算大幅增加，邻国的外交官则开始频繁地互相通电话。"
 SYRA.6.d_neu:0 "联合政府的头一年是在无数次谈判中度过的。每一项法案都要三个党同意，进展缓慢，却没有任何一个派别觉得自己被抛在了外面。"
 SYRA.6.t:0 "新执政党的第一年"
 SYRA_TT_elections:0 "§Y开放大选§!：立即启动选举，此后每 4 年一次"
 SYRA_baath_renewal:0 "复兴党的再授权"
 SYRA_baath_renewal_desc:0 "选民再次把多数票投给了复兴党。党内的老人说这是“人民的选择”，年轻干部却更清楚，这是一份附带条件的授权：任期限制、公开账目、对腐败零容忍。党必须兑现这些承诺，否则下一次选票就不会这么慷慨。"
 SYRA_baath_renewal_idea:0 "复兴党的再授权"
 SYRA_baath_renewal_idea_desc:0 "选民再次把多数票投给复兴党，但附带条件：任期限制、公开账目、对腐败零容忍。党必须兑现这些承诺。"
 SYRA_baath_steps_down:0 "复兴党体面下台"
 SYRA_baath_steps_down_desc:0 "选票已经说话。复兴党在宪法的框架内交出权力：中央委员会发表声明，承认选举结果，并要求各级党组织配合移交。党不会消失，但它从此要学会做一个反对党——对一个执政近六十年的组织来说，这比赢得战争更难。"
 SYRA_coalition_government:0 "联合政府"
 SYRA_coalition_government_desc:0 "没有一个政党拿到绝对多数。技术官僚、温和左翼与世俗的中间派达成了联合施政纲领：内阁席位按得票比例分配，总理由议会多数选出。联合政府不够果断，但至少没有哪个派别能独占国家。"
 SYRA_coalition_idea:0 "联合政府"
 SYRA_coalition_idea_desc:0 "内阁席位按得票比例分配，没有哪个派别能独占国家，也没有哪个派别能独自决定。"
 SYRA_democratic_idea:0 "民主过渡"
 SYRA_democratic_idea_desc:0 "新宪法、独立的司法与自由的新闻，让叙利亚走上了一条漫长而不确定的民主之路。"
 SYRA_democratic_transition:0 "民主过渡"
 SYRA_democratic_transition_desc:0 "新政府由民主派组成。第一批法案是起草新宪法、释放政治犯、改组情报机构，并设立“真相与和解委员会”。过渡的道路很长：旧制度的官员仍然握着大量要害岗位，街头的期待比任何政府能兑现的都高。"
 SYRA_islamist_idea:0 "宗教政党执政"
 SYRA_islamist_idea_desc:0 "清真寺的网络成为政府最可靠的基层组织，但世俗国家的盟友们开始疏远。"
 SYRA_islamist_turn:0 "宗教政党执政"
 SYRA_islamist_turn_desc:0 "宗教政党成为议会第一大党。新政府宣布以伊斯兰教法作为立法的主要来源，并承诺“把清真寺的声音带进政府”。世俗派与少数教派忧心忡忡，海湾的资金与土耳其的目光，也同时落在了这个国家身上。"
 SYRA_nationalist_idea:0 "民族主义复兴"
 SYRA_nationalist_idea_desc:0 "“大叙利亚”的旗帜重新升起，军队的重建成为国家的头等大事。"
 SYRA_nationalist_turn:0 "民族主义转向"
 SYRA_nationalist_turn_desc:0 "叙利亚社会民族党等民族主义力量在选举中大胜。新政府高举“大叙利亚”的旗帜，主张重建军队、重新审视与邻国的边界。在议会大厦前的游行队伍里，旋风标志第一次堂而皇之地出现在镜头中。"
 SYRA_old_guard_veto_idea:0 "军方与情报系统的否决权"
 SYRA_old_guard_veto_idea_desc:0 "复兴党交权的条件：军队与情报系统在国防、外交与安全事务上保留否决权。新政府每一项重大决定都要先过这一关。"
 SYRA_open_elections:0 "开放大选"
 SYRA_open_elections_desc:0 "战争结束了，废墟上的叙利亚需要一种新的合法性。总统府宣布：宪法规定的选举将如期举行，各政党不设事先审查，国际观察员可以入境。对一个习惯了“百分之九十九”的政权来说，这是一次真正的赌博——选票会说什么，没有人能事先知道。"
 SYRL_TT_elections_allowed:0 "§Y允许民主选举§!：一年后举行第一次大选，此后每 4 年一次"
