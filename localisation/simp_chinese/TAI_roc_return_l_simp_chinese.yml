 ### 决议
 TAI_mainland_work_category: "光复大陆工作"
 TAI_dec_voice_of_free_china: "自由中国之声"
 TAI_dec_voice_of_free_china_desc: "以短波电台与卫星电视向大陆播送新闻与民主思想。「自由中国之声」与「光华之声」曾在冷战时期向大陆广播；如今它们以卫星电视与网络直播的方式，突破防火长城，传递大陆官方媒体不报道的消息。"
 TAI_dec_infiltrate_cadres: "渗透地方党政干部"
 TAI_dec_infiltrate_cadres_desc: "收买、策反对现状不满的地方官员，在体制内部埋下钉子。被排挤的干部、被查处官员的亲属与对中央不满的地方实力派，都是情报人员接触的对象；这些人在关键时刻可能倒戈。"
 TAI_dec_fund_dissidents: "资助海外民运组织"
 TAI_dec_fund_dissidents_desc: "为流亡海外的民运人士与组织提供资金。从纽约、洛杉矶到柏林，流亡的民运组织长期缺乏经费、彼此不和；台北的资助让他们能够出版刊物、举办活动，并与大陆的维权人士保持联系。"
 TAI_dec_cyber_psyops: "网络心战"
 TAI_dec_cyber_psyops_desc: "突破防火长城，在大陆网络上传播对官方不利的信息。官员的贪腐、被删除的新闻与真实的历史，经由翻墙软件与匿名账号在大陆网民之间流传；当局的审查追不上信息扩散的速度。"
 TAI_dec_letter_to_compatriots: "告大陆同胞书"
 TAI_dec_letter_to_compatriots_desc: "向大陆军民广播：国军此来，只为解救同胞，不为报复。告大陆同胞书承诺：放下武器的官兵一律优待，一般党员与基层干部不予追究，人民的财产受到保障。这让许多人不再为中共拼命。"
 TAI_dec_pla_defection: "策动解放军部队起义"
 TAI_dec_pla_defection_desc: "通过前线喊话与秘密联络，争取更多解放军部队阵前起义。起义的部队保留编制与番号，官兵的军阶与待遇不变；每一支起义的部队，都让对岸的军心更加动摇。"
 TAI_dec_request_us_intervention: "请求美军参战"
 TAI_dec_request_us_intervention_desc: "既然华盛顿默许了我们的行动，现在是请他们兑现承诺的时候了。"

 ### 国家精神
 TAI_silicon_island_idea: "科技岛"
 TAI_silicon_island_idea_desc: "以半导体与资讯产业为核心的经济发展战略。新竹、台中与台南的科学园区构成一条贯穿西部的「硅谷走廊」，政府以租税优惠与人才培育扶植高科技产业；台湾正在从代工之岛转型为科技之岛。"
 TAI_silicon_shield_idea: "硅盾"
 TAI_silicon_shield_idea_desc: "全世界都离不开台湾的芯片，这就是最好的国防。台积电的先进制程占全球九成以上，美国、日本与欧洲都把台海的稳定视为自身的利益；任何对台湾的军事行动，都会让全球经济付出难以承受的代价。"
 TAI_ten_new_constructions_idea: "新十大建设"
 TAI_ten_new_constructions_idea_desc: "新一轮大型公共工程正在全岛展开：高铁、捷运、港口与污水下水道同时动工。工程带动了建材与营造业的景气，也为下一个十年的发展打下基础；全岛的工地日夜不停。"
 TAI_financial_reform_idea: "二次金改"
 TAI_financial_reform_idea_desc: "整并后的金融控股集团更具区域竞争力。国泰、富邦与中信等金控集团的规模扩大，开始在东南亚与大陆设立分行；银行业的呆账比率下降，税收与金融稳定都随之改善。"
 TAI_three_links_idea: "两岸三通"
 TAI_three_links_idea_desc: "通邮、通商、通航，两岸经济日益紧密。每周数百个直航班次往返两岸，台商与陆客的往来大幅增加；台湾的产业得以利用大陆的市场与产能，但对大陆的经济依赖也越来越深。"
 TAI_go_south_idea: "南向政策"
 TAI_go_south_idea_desc: "台湾资本与产业正向东南亚分散布局。越南的电子厂、印尼的纺织厂与泰国的汽车零件厂里都有台商的身影；南向政策让台湾的经济不再只依赖一个市场，与东南亚各国的关系也更加紧密。"
 TAI_roc_orthodoxy: "中华民国法统"
 TAI_roc_orthodoxy_desc: "台湾是中华民国的复兴基地，而不是终点。《中华民国宪法》仍以全中国为其适用范围，国民大会与立法院的法统可以追溯到 1947 年的大选；政府的每一项政策，都以终将光复大陆为前提。"
 TAI_roc_orthodoxy_2: "国家统一纲领"
 TAI_roc_orthodoxy_2_desc: "建立民主、自由、均富的统一中国，是中华民国不变的国策。《国家统一纲领》重新成为政府施政的最高指导原则：近程交流互惠、中程互信合作、远程协商统一。若对岸拒绝民主化，中华民国保留一切手段。"
 TAI_taiwan_identity: "台湾主体意识"
 TAI_taiwan_identity_desc: "这片土地上的人民才是国家的主人。民调显示，认同自己是「台湾人」的比例逐年上升，年轻世代尤其如此；这种认同凝聚了社会的团结，也让台湾人更愿意为守护民主与生活方式而战。"
 TAI_porcupine_idea: "豪猪战略"
 TAI_porcupine_idea_desc: "让任何入侵者都付出无法承受的代价。国军以大量的机动飞弹、无人机、水雷与便携式武器，构成一张让敌人难以下手的防御网；在台湾本岛作战时，每一座城市、每一座山头都是要塞。"
 TAI_formosa_resilience_idea: "韧性台湾"
 TAI_formosa_resilience_idea_desc: "公民社会与民防体系让台湾在风暴中屹立不倒。社区的防灾组织、医院的应变计划、企业的备援机制与民众的防卫训练，构成一张覆盖全社会的安全网；无论是地震、疫情还是战争，台湾都准备好了。"
 TAI_pragmatic_diplomacy_idea: "务实外交"
 TAI_pragmatic_diplomacy_idea_desc: "名称与形式可以弹性，被看见才是重点。外交官们以经贸、文化与人道援助为名义，在没有邦交的国家里经营实质关系；台湾的国际能见度与各国对它的好感，在这种务实的外交中逐步累积。"
 TAI_international_space_idea: "国际空间"
 TAI_international_space_idea_desc: "中华民国以各种形式参与国际组织与国际事务：观察员、特殊名称或经贸实体。外交官们在每一个可能的场合争取发声，各国对台湾的好感与贸易往来也随之增加。"
 TAI_han_kuang_idea: "汉光精神"
 TAI_han_kuang_idea_desc: "实兵、实弹、不预设剧本的演习锻炼出真正的战力。每年的汉光演习都在暴露问题、修正问题，部队的组织度与实战经验在一次次的检验中稳步提升。"
 TAI_reserve_mobilization_idea: "后备动员体系"
 TAI_reserve_mobilization_idea_desc: "全民皆兵，后备军人随时可以归建。完善的教召制度让两百多万后备军人保持基本的战技，动员令一下，他们能在三天之内回到所属部队。"
 TAI_whampoa_spirit_idea: "黄埔精神"
 TAI_whampoa_spirit_idea_desc: "亲爱精诚。黄埔的校训代代相传，从北伐、抗战到守卫台海，国军的军官们以这四个字自勉；它塑造了国军的士气与领导者的风骨。"
 TAI_joint_operations_idea: "三军联合作战"
 TAI_joint_operations_idea_desc: "陆海空三军在统一指挥下协同作战。联合作战指挥中心以数据链连接各军种，陆军的攻势有海空军的掩护，两栖登陆的规模与效率都大幅提升。"
 TAI_counteroffensive_preparation: "反攻准备"
 TAI_counteroffensive_preparation_desc: "国光作业室正夜以继日地拟定反攻计划。1961 年蒋中正设立的国光作业室曾拟定了数十份反攻方案，如今这些计划被重新翻出、更新，登陆部队的准备时间大幅缩短。"
 TAI_counteroffensive: "反攻大陆"
 TAI_counteroffensive_desc: "光复大陆国土，解救大陆同胞！反攻的号角已经吹响，三军将士士气高昂，全国上下团结在这场战争的背后。登陆作战是国军最熟悉的战法，每一个滩头都将被夺下。"
 TAI_landing_operations: "东南登陆作战"
 TAI_landing_operations_desc: "三军全力支援在闽浙粤沿海的登陆作战。海军的登陆舰艇日夜往返海峡，空军为滩头提供掩护，后续部队与补给源源不断地送上岸；这是国军历史上规模最大的两栖作战。"
 TAI_us_backing: "美方默许"
 TAI_us_backing_desc: "华盛顿对我们的计划睁一只眼闭一只眼，并在幕后提供援助：卫星情报、技术支援与外交上的掩护。美国不会公开介入，但它也不会站在北京那一边。"
 TAI_mainland_integration_1: "大陆整合：百废待举"
 TAI_mainland_integration_1_desc: "十三亿人口、截然不同的社会制度与半个世纪的隔阂。新政府的权威尚未深入基层。"
 TAI_mainland_integration_2: "大陆整合：逐步恢复"
 TAI_mainland_integration_2_desc: "各省政府已经重建，但地方上的抵触仍然存在：部分干部消极怠工，地下的中共组织仍在活动，各地需要驻军维持秩序。整合工作进展缓慢，政府的施政效率与威信都受到影响。"
 TAI_mainland_integration_3: "大陆整合：大局已定"
 TAI_mainland_integration_3_desc: "整合工作已近尾声，只剩零星的阻力。各省的行政机器运转正常，民众逐渐接受了新的政府；剩下的抵抗多半来自偏远的山区与少数顽固分子。"
 TAI_military_government: "军政时期"
 TAI_military_government_desc: "以军事力量恢复秩序、肃清残余，是建国程序的第一步。国父在《建国大纲》中设计了军政、训政与宪政三个阶段；军政时期的戒严与军管，让抵抗迅速瓦解，但政治的活力也受到压抑。"
 TAI_political_tutelage: "训政时期"
 TAI_political_tutelage_desc: "由政府训导人民行使四权，以县为单位推行地方自治。训政时期的公民训练与县级选举，让民众逐步熟悉民主的运作；社会秩序稳定，地方建设也开始加速。"
 TAI_constitutional_government: "宪政时期"
 TAI_constitutional_government_desc: "中华民国宪法在全中国施行，主权在民。国民大会、五院与地方自治全面运作，人民以选票决定政府；宪政的稳定带来了政治的活力、科研的繁荣与民主的深化。"
 TAI_army_reorganization: "整编解放军"
 TAI_army_reorganization_desc: "数百万原解放军官兵正被整编为国军。番号更换、军官甄别与政治教育同时进行，部队的组织一度混乱；但这些官兵大多受过训练，整编完成后将是国军庞大的兵源。"
 TAI_national_reconciliation_idea: "民族和解"
 TAI_national_reconciliation_idea_desc: "相逢一笑泯恩仇。不追究一般党员与基层干部，让大多数人放下戒心、接受新政府；抵抗运动失去了群众基础，各地的秩序迅速恢复。"
 TAI_mainland_justice_idea: "转型正义"
 TAI_mainland_justice_idea_desc: "历史的伤口必须被正视，责任必须被追究。转型正义的审判与档案公开，让受害者得到了交代，也让共产主义的号召力大为削弱；但被清算者的家属与旧干部，对新政府心怀不满。"
 TAI_whampoa_reborn: "百年黄埔"
 TAI_whampoa_reborn_desc: "黄埔军校重返长洲岛，再续百年传承。新一代的军官在这里接受训练，学习战术、战史与宪法；黄埔的传统与现代的军事教育结合，培养出一批又一批优秀的指挥官。"
 TAI_economic_integration_idea: "两岸经济整合"
 TAI_economic_integration_idea_desc: "台湾的资本与技术，结合大陆的市场与劳动力。两岸经济的整合让工厂的建设速度与生产效率同步提升，产业链在海峡两岸重新布局；中国经济进入了新一轮的高速增长。"
 TAI_land_reform_idea: "耕者有其田"
 TAI_land_reform_idea_desc: "数亿农民拥有了属于自己的土地，农村吸纳了大量劳动力。土地确权让农民愿意投资改良田地，农业的生产力大幅提高；乡村的稳定，是整个国家稳定的基础。"
 TAI_privatization_idea: "国企民营化"
 TAI_privatization_idea_desc: "国有企业正在大规模转为民营。市场化让企业的效率与利润迅速提升，国库的税收也随之增加；但数以百万计的国企职工面临裁员，社会上的不安情绪正在累积。"
 TAI_regulated_capital_idea: "节制资本"
 TAI_regulated_capital_idea_desc: "私人不能操纵国民之生计。关键产业由国家掌握，民营企业在其他领域自由发展；这种混合经济既保证了社会的稳定，也让国家的工业能力稳步提升。"
 TAI_national_reconstruction_idea: "建国方略"
 TAI_national_reconstruction_idea_desc: "心理建设、物质建设、社会建设全面展开。国父的《建国方略》成为国家发展的蓝图，工业、科研与社会福利同步推进；一个现代化的中国正在快速成形。"
 TAI_begonia_restored: "秋海棠叶"
 TAI_begonia_restored_desc: "那片形如秋海棠叶的版图，终于重新完整。从帕米尔到乌苏里江、从漠北到南沙，失去的土地一一回归；全国上下沉浸在民族的骄傲之中，政府的威望达到了顶峰。"
 TAI_world_for_all_idea: "天下为公"
 TAI_world_for_all_idea_desc: "大道之行也，天下为公。一个民有、民治、民享的中华民国已在全中国实现：政治清明、经济繁荣、社会安定，世界各国对这个新生的民主大国心悦诚服。"

