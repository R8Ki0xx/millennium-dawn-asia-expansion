 TAI_na_session_fail: "§R否决§!"
 TAI_na_gui_title: "中华民国第 [?TAI_na_term|0] 届国民大会"
 TAI_na_gui_session: "第 [?TAI_na_session|0] 次常会 · 执政：[ROOT.GetRulingParty]"
 TAI_na_gui_countdown: "距下次常会还有 §Y[?TAI_na_days_left|0]§! 天    距国大代表改选还有 §Y[?TAI_na_sessions_left|0]§! 次常会"
