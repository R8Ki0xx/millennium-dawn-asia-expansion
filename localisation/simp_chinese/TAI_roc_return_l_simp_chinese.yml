 TAI_integrate_ccp_reformers: "整合中共改革派"
 TAI_integrate_ccp_reformers_desc: "中共下台之后，党内不少开明派官员并未随残余势力退走。广东的汪洋、上海的陈良宇愿意加入中国国民党，前中共中央总书记胡锦涛则接受民革的邀请。吸纳他们，既能安定大陆的官僚体系，也能分化中共残余。"
 ### v3.16 支持度修复与渗透决议
 TAI_dec_underground_network: "发展地下组织网络"
 TAI_dec_underground_network_desc: "在各省市建立彼此独立的地下小组，联络对中共不满的工人、学生与基层干部，等待时机。"
 TAI_dec_subvert_garrisons: "策反地方驻军"
 TAI_dec_subvert_garrisons_desc: "通过旧部、同乡与黄埔校友的关系，策反解放军地方驻军与武警部队的中级军官。"
 TAI_unrest_50_tt: "大陆局势动荡度至少为 §Y50§!"
 TAI_unrest_60_tt: "大陆局势动荡度至少为 §Y60§!"
 TAI_mainland_work_category_desc: "国安局、陆委会与国民党大陆工作会在大陆展开的政治、心理与情报工作。各项工作完成后需冷却一段时间才能再次进行（冷却期间暂时不显示）。\n\n当前§Y大陆局势动荡度§!：§Y[?TAI_mainland_unrest|0]§!/100\n - ≥50：可§R反攻大陆§!，并开放「发展地下组织网络」\n - ≥60：开放「策反地方驻军」\n - ≥70：可提出§G和平统一§!\n - ≥80：可§R点燃大陆起义§!\n§L中共稳定度高于 70% 时，动荡度每月 -1。§!"
 ### v3.19 十八项完善
 TAI_roc_nsb_name: "国家安全局"
 roc_return.160.t: "中华民国政府的整顿"
 roc_return.160.d: "行政院宣布一系列整顿措施：除毛派地下组织与极右翼的复兴社外，各政党一律合法登记；中国共产党以合法在野党身份重新活动，得到约三成五选民的支持；中央银行宣布以人民币为法定货币；国防部接管了大陆的核武库，沿用原有的核武器政策；「一九四九年的遗留」随着光复成为历史。"
 roc_return.160.a: "宪政之下，各安其位。"
 TAI_na_gui_cpc: "中国共产党  [?TAI_na_cpc|0]席  [?TAI_na_cpc_pct|0]%[TAI_na_mark_cpc]"
 TAI_na_gui_cpc_pct: "[?TAI_na_cpc_pct|0]%"
 TAI_na_lobby_delegates: "拉拢国大代表"
 TAI_na_lobby_delegates_desc: "国民党中央组织部出面，以地方党部职位与建设经费拉拢无党籍及在野党的国大代表。国民大会的席次除了每届改选外，也会随各党支持度与代表倒戈而逐月变动。"
 TAI_na_lobby_delegates_tt: "执政党在国民大会§G+60～150§! 席（先拉拢无党籍，不够再从最大的在野党挖角）"
 TAI_dbf_cure_black_gold: "扫黑肃贪专案"
 TAI_dbf_cure_black_gold_desc: "调查局与检察署联手侦办派系、黑道与财团的勾结案件，起诉一批地方民代与议长。\n\n§Y黑金政治§!当前严重度 §R[?TAI_dbf_black_gold_sev|0]§!/100，每月自然恢复 §G[?TAI_dbf_black_gold_rate|1]§!。"
 TAI_dbf_cure_black_gold_tt: "国家精神§Y黑金政治§!的严重度 §G−15§!"
 TAI_dbf_black_gold_desc: "当前严重度：§R[?TAI_dbf_black_gold_sev|0]§!/100（修正效果随严重度连续变化，降到 0 时消失）\n每月自然恢复 §G[?TAI_dbf_black_gold_rate|1]§!（基础 0.5；稳定度高于 60%、执政联盟在立法院过半时各再加 0.5）。\n也可以通过国策、事件削弱：台湾时期可用「国军整备」中的「查察贿选」决议，光复后可用「收拾河山」决议。"
 TAI_dbf_black_gold_reduce_tt: "国家精神§Y黑金政治§!的严重度 §G−33§!（降到 0 时消失）"
 TAI_dbf_cure_isolation: "元首出访"
 TAI_dbf_cure_isolation_desc: "总统率团出访友邦与大国，签署一系列双边协定，重建中华民国的国际空间。\n\n§Y外交孤立§!当前严重度 §R[?TAI_dbf_isolation_sev|0]§!/100，每月自然恢复 §G[?TAI_dbf_isolation_rate|1]§!。"
 TAI_dbf_cure_isolation_tt: "国家精神§Y外交孤立§!的严重度 §G−15§!，花费 §Y2§! 十亿资金"
 TAI_dbf_isolation_desc: "当前严重度：§R[?TAI_dbf_isolation_sev|0]§!/100（修正效果随严重度连续变化，降到 0 时消失）\n每月自然恢复 §G[?TAI_dbf_isolation_rate|1]§!（基础 0.5；拥有联合国常任理事国席位或身处阵营时各再加 0.5）。\n也可以通过国策、事件削弱：台湾时期主要靠务实外交线的国策，光复后可用「收拾河山」决议。"
 TAI_dbf_isolation_reduce_tt: "国家精神§Y外交孤立§!的严重度 §G−33§!（降到 0 时消失）"
 TAI_dbf_cure_conscription: "募兵加给"
 TAI_dbf_cure_conscription_desc: "提高志愿役薪俸与退伍福利，补足部队员额。\n\n§Y募兵制转型阵痛§!当前严重度 §R[?TAI_dbf_conscription_sev|0]§!/100，每月自然恢复 §G[?TAI_dbf_conscription_rate|1]§!。"
 TAI_dbf_cure_conscription_tt: "国家精神§Y募兵制转型阵痛§!的严重度 §G−15§!，花费 §Y3§! 十亿资金"
 TAI_dbf_conscription_desc: "当前严重度：§R[?TAI_dbf_conscription_sev|0]§!/100（修正效果随严重度连续变化，降到 0 时消失）\n每月自然恢复 §G[?TAI_dbf_conscription_rate|1]§!（基础 0.5；战争支持度高于 50%时各再加 0.5）。\n也可以通过国策、事件削弱：台湾时期可用「国军整备」中的「年度汉光演习」决议，光复后可用「收拾河山」决议。"
