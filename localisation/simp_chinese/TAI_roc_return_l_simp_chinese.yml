 roc_asia.80.a: "议会新一届开幕"
 roc_asia.80.t: "人民议会选举"
 roc_asia.80.d: "选民走进投票站，在战后第一次相对开放的选举中投下自己的一票：复兴党 §Y[?SYR_pc_baath|0]§! 席，国民进步阵线盟党 §Y[?SYR_pc_npf|0]§! 席，独立人士 §Y[?SYR_pc_ind|0]§! 席，世俗反对派 §Y[?SYR_pc_sec|0]§! 席，伊斯兰主义反对派 §Y[?SYR_pc_isl|0]§! 席。新的人民议会将在大马士革开幕。\n\n[SYR_pc_system_text]"
 roc_asia.81.a: "这是改革的开始"
 roc_asia.81.t: "紧急状态结束"
 roc_asia.81.d: "实施了四十八年的紧急状态法被正式废止，政府宣布公民享有和平集会的权利。街头的人群欢呼雀跃，有人在大马士革的广场上举起了写着「自由」的标语；但也有人说，真正的紧急状态——特务、检查站与午夜的敲门声——一天都没有离开。"
 roc_asia.82.a: "等待审批"
 roc_asia.82.t: "新政党的诞生"
 roc_asia.82.d: "《政党法》生效后，数十个新的政党提出了登记申请。其中一部分是安全部门扶植的「独立」替身，另一些是真正的反对派，由流亡归来的知识分子与地方名流组成。它们能否留在法律框架内，取决于政权的态度，也取决于它们自己的克制。"
 roc_asia.83.a: "通过"
 roc_asia.83.t: "新宪法公投"
 roc_asia.83.d: "宪法公投：官方说投票率为 57%，赞成者占 89%。第 8 条被删除，复兴党不再是宪法规定的领导党；然而总统的权力、安全机构的权力与议会的构成，一点没有改变。"
 roc_asia.84.a: "投票通过"
 roc_asia.84.t: "34 岁的总统"
 roc_asia.84.d: "Hafez al-Assad 去世后数小时，人民议会召开紧急会议：宪法规定总统年龄不得低于 40 岁，议员们不到十分钟就把它改成了 34 岁——恰好是 Bashar al-Assad 的年龄。随后议会提名他为唯一的总统候选人。"
 roc_asia.85.a: "确认连任"
 roc_asia.85.t: "2007 年总统公投"
 roc_asia.85.d: "人民议会提名 Bashar al-Assad 为唯一候选人，公投中的赞成率为 97.6%。投票站里只有「是」与「否」两个选项，许多人在情报人员的注视下公开投票。街头张贴的海报上写着：「Bashar，叙利亚的希望」。连任的结果，没有人感到意外。"
 roc_asia.86.a: "宣布结果"
 roc_asia.86.t: "2014 年总统选举"
 roc_asia.86.d: "新宪法下的第一次总统选举有三名候选人，这是半个世纪以来第一次有人与 Assad 同台竞争，官方公布的得票率为 88.7%。在反对派控制区与难民营中，选举无法进行；西方国家称之为一场闹剧，政权则宣称人民再次作出了选择。"
 ### v3.29 叙利亚左翼规则
 SYRL_AI_BEHAVIOR: "叙利亚 AI 路线（左翼复兴党）"
 RULE_OPTION_SYRL_LEFT_BAATH: "左翼复兴党"
 RULE_OPTION_SYRL_LEFT_BAATH_DESC: "叙利亚 AI 走巴沙尔的「复兴党初心」路线：拒绝家族政治，回到复兴党最初的理想（统一、自由、社会主义）。需要与「叙利亚 AI 行为」选「史实」或「无路线」搭配，不要同时选其他路线。"
 RULE_OPTION_SYRL_NO_PATH: "不指定"
 RULE_OPTION_SYRL_NO_PATH_DESC: "不额外指定左翼路线，叙利亚 AI 按「叙利亚 AI 行为」的设置行动。"
 ### v3.33 台湾时代政治线与巴基斯坦国策
 TAIP_ext_mainland_ties: "两岸经贸往来"
 TAIP_ext_us_support: "台海现状的支持"
 TAIP_ext_strait_tension: "台海紧张"
 TAIP_ext_pfp_middle: "亲民党的中间路线"
 TAIP_status_quo_idea: "新的常态：维持现状"
 TAIP_status_quo_idea_desc: "不统、不独、不武：台北与北京都不愿打破现状，国际社会也乐见其成。这一份默契靠的是各方的克制。"
 TAIP_three_links_idea: "三通与陆客"
 TAIP_three_links_idea_desc: "直航、陆客与陆资让两岸的经济联系比任何时候都紧密，也让台湾对大陆市场有了依赖。"
 TAIP_sunflower_idea: "公民运动的遗产"
 TAIP_sunflower_idea_desc: "太阳花运动之后，公民团体、青年与新政党成为台湾政治里不可忽视的力量。"
 TAIP_mask_idea: "口罩外交与防疫体制"
 TAIP_mask_idea_desc: "疫情期间，口罩国家队、实名制与「台湾可以帮忙」成为外交的新名片。台湾以出色的防疫表现与对各国的口罩捐赠，赢得了国际的肯定；医疗与生技的研发也因此加速。"
 TAIP_chip_idea: "护国神山"
 TAIP_chip_idea_desc: "晶圆代工占全球先进制程的绝大部分：这是台湾最大的经济筹码，也是最大的风险。"
 TAIP_energy_idea: "能源转型之争"
 TAIP_energy_idea_desc: "「非核家园」与供电安全之间的拉扯，让每一次跳电都成为政治议题。核电厂逐一除役，燃煤与燃气的比重上升，空污与缺电的争议让政府疲于应付；但能源议题也让各党更积极地动员支持者。"
 roc_asia.90.a: "欢迎新的开始"
 roc_asia.90.t: "「不统不独不武」"
 roc_asia.90.d: "就职典礼上，新总统重申「不统、不独、不武」：只要台湾人民认可，就不会改变现状。他承诺恢复两岸协商、开放直航与陆客来台。台北的股市应声上涨，北京的反应则是克制地欢迎；两岸关系进入了一段难得的缓和期。"
 roc_asia.91.a: "倾听街头的声音"
 roc_asia.91.b: "坚持议事程序"
 roc_asia.91.t: "三月的议场"
 roc_asia.91.d: "深夜，立法院的议场里挤满了学生，他们反对服务贸易协定的黑箱审查，占领了主席台。街头挤满了声援的民众，行政院也一度被占领，警方在凌晨强力清场。电视上整夜都是「你听见了吗」的口号，这场运动将改变台湾政治的走向。"
 roc_asia.92.a: "就职"
 roc_asia.92.t: "第三次轮替"
 roc_asia.92.d: "开票之夜，在野党总部爆出欢呼，执政党主席宣布为败选负责辞职。新总统在胜选演说中提到「维持现状」四个字，不止一次；她承诺尊重 1992 年两岸会谈的历史事实，但不接受北京的政治前提。北京的回应冷淡而谨慎。"
 TAI_ext_pak_china: "巴中全天候战略伙伴"
 TAI_ext_pak_us: "巴美关系回暖"
 TAI_ext_pak_india: "克什米尔与巴印敌对"
 TAI_ext_pak_roc: "巴基斯坦与中华民国的务实关系"
 TAI_ext_pak_imf: "IMF 的紧缩条件"
 TAI_ext_pak_gulf: "海湾的资金与援助"
 TAI_ext_pak_militancy: "边境的恐怖袭击"
 PAKX_hybrid_idea: "混合政体"
 PAKX_hybrid_idea_desc: "文官政府在台前，军方在幕后：选举照常举行，而国家的重大决定由谁做，人人心里有数。"
 PAKX_democracy_idea: "选举民主"
 PAKX_democracy_idea_desc: "多党竞争、独立媒体与律师界的抗争，让巴基斯坦的政治充满冲突，也充满希望。"
 PAKX_army_rule_idea: "军方主导"
 PAKX_army_rule_idea_desc: "将军们在幕后决定国家的方向：稳定是他们的承诺，代价是议会的失效。军方主导下的巴基斯坦秩序井然，国防动员能力强；但西方国家对军人干政保持距离，贸易与援助受到影响。"
 PAKX_deterrence_idea: "最低限度可信威慑"
 PAKX_deterrence_idea_desc: "核武器是巴基斯坦与印度之间的平衡点，也是国家最昂贵的安全保障。核威慑让新德里不敢发动全面战争，军队的信心与士气也因此提升。"
 PAKX_navy_idea: "中国造的潜艇"
 PAKX_navy_idea_desc: "「海龙」级潜艇与新的护卫舰，让巴基斯坦海军第一次具备了远海的威慑力。"
 PAKX_cpec_idea: "中巴经济走廊"
 PAKX_cpec_idea_desc: "瓜达尔港、高速公路与能源项目连接着新疆与阿拉伯海，也让巴基斯坦背上了沉重的债务。"
 PAKX_imf_idea: "IMF 的救助方案"
 PAKX_imf_idea_desc: "每一次援助都附带着紧缩条件：税收、补贴与汇率，都要按照国际货币基金组织的时间表行事。"
 PAKX_textile_idea: "棉纺王国"
 PAKX_textile_idea_desc: "棉花、纺织与服装是巴基斯坦最重要的出口，几百万工人的生计系于一台台织机。"
 PAKX_counterterror_idea: "反恐的代价"
 PAKX_counterterror_idea_desc: "每一次袭击之后，边境地区的军事行动与人权争议都会重新上演。反恐战争让民众支持军方，但清剿行动造成的平民伤亡与流离失所，也让部落地区的怨气越积越深。"
 PAKX_flood_idea: "洪水之后的重建"
 PAKX_flood_idea_desc: "2022 年的洪水淹没了全国三分之一的土地，数百万人离开家园，也让「气候韧性」第一次成为国家议题。重建工作以更高的标准修建堤防与房屋，社会在灾后展现出惊人的团结。"
 PAKX_sco_idea: "上合组织的平衡"
 PAKX_sco_idea_desc: "同时与中俄、中亚和伊朗合作，既是机会，也是在大国之间走钢丝。上合组织为巴基斯坦打开了中亚的市场与能源通道，但也让它在美国与中俄之间的平衡更加微妙。"
 PAKX_roc_idea: "务实的台巴交流"
 PAKX_roc_idea_desc: "没有正式邦交的台北与伊斯兰堡，靠贸易、教育与民间往来，编织着一张务实的网。"
 PAKX_digital_idea: "年轻人的数字经济"
 PAKX_digital_idea_desc: "自由职业者与 IT 外包让数字经济成为新的增长点，也让年轻人第一次有了选择。"
 PAKX_tb_armor: "装甲技术"
 PAKX_tb_it: "IT 外包技术"
 PAKX_tb_edu: "教育与技能培训"
 roc_asia.100.a: "文官的面子也要留着。"
 roc_asia.100.b: "把权力集中在将军手里。"
 roc_asia.100.t: "混合政体的定型"
 roc_asia.100.d: "宪法里没有写的那一半：文官与军方的分工，在每一次危机中都被重新谈判，也逐渐成了惯例。总理负责经济与民生，陆军参谋长掌握安全与外交，两者每周在国家安全委员会碰面。这种安排谈不上理想，却让国家避免了又一次政变。"
 roc_asia.101.a: "秩序压倒一切。"
 roc_asia.101.b: "尽快还政于民。"
 roc_asia.101.t: "军方的回归"
 roc_asia.101.d: "将军们以「维持秩序」的名义接管了国家。宵禁、新闻审查与军事法庭成为日常，政党领袖被软禁或流亡海外。街头的商人说，至少停电与绑架少了；律师与记者则开始在暗中组织抗议。军方必须决定，这一次要统治多久。"
 roc_asia.102.a: "尊重选票。"
 roc_asia.102.b: "观察军方的态度。"
 roc_asia.102.t: "首次完整的政党轮替"
 roc_asia.102.d: "选举结束，在野党赢得了多数席位，执政党承认败选。这是巴基斯坦建国以来第一次完整的政党轮替：没有政变、没有法院干预，也没有总统解散议会。首都街头的人群在欢呼，军营里一片沉默，所有人都在观察将军们的态度。"
 roc_asia.103.a: "威慑就是和平。"
 roc_asia.103.b: "呼吁军备控制。"
 roc_asia.103.t: "核威慑的完成"
 roc_asia.103.d: "在一次成功的潜射巡航导弹试射之后，国防部宣布「最低限度可信威慑」已经建立：陆基、空基与海基的核力量构成了完整的第二次打击能力。新德里的回应很快传来，印度宣布将加快自己的导弹计划，南亚的军备竞赛又上了一个台阶。"
 roc_asia.104.a: "把机遇变成繁荣。"
 roc_asia.104.b: "警惕债务的陷阱。"
 roc_asia.104.t: "走廊经济的成型"
 roc_asia.104.d: "瓜达尔港的第一艘大型货轮靠泊，中巴经济走廊的高速公路全线通车，新的电厂缓解了困扰多年的停电问题。但走廊的贷款利率不低，俾路支人抱怨分不到好处，西方智库警告「债务陷阱」。债务与机遇，画在同一张图纸上。"
 roc_asia.105.a: "感谢友谊。"
 roc_asia.105.b: "平衡各方。"
 roc_asia.105.t: "全天候战略伙伴"
 roc_asia.105.d: "巴中两国领导人发表联合声明，宣布「全天候战略合作伙伴关系」进入新阶段：双方签署了数十份合作协议，涵盖能源、基建、国防与航天。巴基斯坦的第一位航天员将搭乘中国的飞船进入太空，两国的友谊被形容为「铁杆」。"
 roc_asia.106.a: "动员国际援助。"
 roc_asia.106.b: "以国家力量重建。"
 roc_asia.106.t: "2022 年的洪水"
 roc_asia.106.d: "季风带来的暴雨与冰川融水引发了史无前例的洪水，淹没了全国三分之一的土地。信德省变成了一片汪洋，数百万人流离失所，农田、道路与学校被冲毁，经济损失超过三百亿美元。国际援助的规模前所未有，但重建需要数年的时间。"
 roc_asia.107.a: "让规划落地。"
 roc_asia.107.b: "先看看效果。"
 roc_asia.107.t: "共同发展的巴基斯坦"
 roc_asia.107.d: "国家的新规划把教育、医疗与就业放在了首位，取代了过去以国防与大型工程为重心的预算。政府承诺：每一个孩子都能上学、每一个村庄都有诊所、每一个年轻人都有工作的机会。这份规划能否落实，将决定巴基斯坦的未来。"
 TAIP_root: "「维持现状」的政党线"
 TAIP_root_desc: "不反攻之后，台湾的政治就是一条没有终点的线：每一次选举、每一次轮替，都是对「现状」的重新解释。"
 TAIP_e1: "2000 年：第一次政党轮替"
 TAIP_e1_desc: "五十年来第一次由在野党执政。2000 年 3 月 18 日，陈水扁以 39% 的得票率当选总统，国民党在台湾的五十五年执政画下句点；政权和平交接的那一刻，台湾的政治第一次不再只有一种答案。"
 TAIP_e1_dpp: "民进党版：新中间路线"
 TAIP_e1_dpp_desc: "执政的民进党提出「新中间路线」，既要安抚北京，也要回应本土的期待。「四不一没有」写进了就职演说。"
 TAIP_e1_kmt: "国民党版：在野的桥"
 TAIP_e1_kmt_desc: "国民党失去执政后，连战在 2005 年访问大陆，与胡锦涛举行「连胡会」，重启中断六十年的国共党际往来。在野的国民党，成了两岸之间的一座桥；绿营批评这是「联共制台」，蓝营则说这是为两岸和平铺路。"
 TAIP_e1_pfp: "亲民党版（架空）：第三势力"
 TAIP_e1_pfp_desc: "架空：2000 年大选后，宋楚瑜领导的亲民党成为国会的关键少数，以「第三势力」组成联合政府，主张在统独之间寻找第三条路。"
 TAIP_e2: "2008 年：再次轮替"
 TAIP_e2_desc: "国民党重返执政。马英九以 58% 的得票率当选总统，「不统、不独、不武」成为新政府的口号，两岸的官方对话重新开始：海基会与海协会恢复协商，两岸直航、陆客来台与 ECFA 相继实现。"
 TAIP_e2_dpp: "民进党版：在野与街头"
 TAIP_e2_dpp_desc: "在野的民进党反对《服贸协议》的黑箱审议，支持学生占领议场。议场里的抗争，成了台湾政治的另一种样子。"
 TAIP_e2_kmt: "国民党版：大三通与 ECFA"
 TAIP_e2_kmt_desc: "直航、直邮与直接通商全面恢复，陆客自由行带来了每年数百万人次的游客。ECFA 的早收清单让近千项产品降低关税。"
 TAIP_e2_pfp: "亲民党版（架空）：连宋联合"
 TAIP_e2_pfp_desc: "架空：国民党与亲民党组成联合政府，「连宋」从选举联盟变成了执政联盟。党际合作的代价是内阁里的一半席位。"
 TAIP_e3: "2016 年：第三次轮替"
 TAIP_e3_desc: "2014 年的太阳花学运与九合一选举之后，民进党在 2016 年再次执政，蔡英文成为台湾第一位女总统，民进党也第一次在立法院取得过半。新政府宣布：维持现状，不挑衅，也不屈服。"
 TAIP_e3_dpp: "民进党版：新南向与防疫外交"
 TAIP_e3_dpp_desc: "新南向政策把贸易与投资引向东南亚、南亚与澳纽。口罩国家队与「台湾可以帮忙」，成了外交的新名片。"
 TAIP_e3_kmt: "国民党版：九二共识之争"
 TAIP_e3_kmt_desc: "新政府拒绝接受「九二共识」的表述，北京中止了两岸官方沟通。在野的国民党主张恢复对话，不断在立法院表态。"
 TAIP_e3_pfp: "亲民党版（架空）：第三条路"
 TAIP_e3_pfp_desc: "架空：亲民党在第三次轮替后成为国会的仲裁者。「中间路线」让两大党都要向它让步，议程由它来定义。"
 TAIP_e4: "2024 年：新常态"
 TAIP_e4_desc: "三次轮替之后，台湾的政治习惯了「维持现状」的节奏：不是不作为，而是每一次选择都要小心地做。2024 年的大选中，三党鼎立，选民在主权、经济与世代议题之间权衡；民主已经成为台湾人生活的一部分。"
 TAIP_e4_dpp: "民进党版：芯片与国防"
 TAIP_e4_dpp_desc: "晶圆代工占全球先进制程的绝大部分。政府出台税收优惠与人才措施，国防预算逐年提高，自制潜艇下水。"
 TAIP_e4_kmt: "国民党版：两岸经贸的恢复"
 TAIP_e4_kmt_desc: "在野的国民党争取恢复两岸经贸谈判，服务业开放与观光的节奏重新打开，但每一步都要经过立法院的审查。"
 TAIP_e4_pfp: "亲民党版（架空）：能源折中"
 TAIP_e4_pfp_desc: "架空：亲民党主导的国会以「非核家园」与供电安全之间的折中为议题，把能源转型的方案写进了预算。"
 TAIP_end: "「新常态」"
 TAIP_end_desc: "二十多年，三次政党轮替：台湾的政治一再证明，「维持现状」不是不作为，而是需要不断地、小心地做出选择。"
 PAKX_p_root: "巴基斯坦的政治前途"
 PAKX_p_root_desc: "独立七十多年，巴基斯坦的政治在文官政府、军方与宗教政党之间摇摆。选举不断，但谁真正做决定，始终是最大的问号。"
 PAKX_p_hyb: "混合政体"
 PAKX_p_hyb_desc: "文官政府在台前，军方在幕后。选举照常举行，内阁照常组成，但重大的外交与安全决定，尤其是对印度、阿富汗与核武器的政策，总要先问拉瓦尔品第的将军们的意见。巴基斯坦人把这叫作「同一页纸」。"
 PAKX_p_pm: "文官政府的执政"
 PAKX_p_pm_desc: "总理是名义上的最高行政长官，但议会的席位分布，总是在穆斯林联盟、人民党与正义运动等几个大党之间做交易。每一届政府都在联盟伙伴、反对派与军方之间走钢丝，能做满五年任期的总理寥寥无几。"
 PAKX_p_judiciary: "最高法院的裁决"
 PAKX_p_judiciary_desc: "法院与选举委员会的裁决，常常比选票更能决定谁能执政。最高法院可以以「不诚实」为由取消总理的资格，也可以在军方接管后为其背书。法官们在这个国家里，既是宪法的守护者，也是政治的玩家。"
 PAKX_p_sec_council: "国家安全委员会"
 PAKX_p_sec_council_desc: "文官与军方共同设立的国家安全委员会，把安全事务从议会的辩论中拿走。总理主持会议，三军首长与情报首脑列席：名义上是文官领导，实际上是让将军们的意见有了正式的发声渠道，军方对此相当满意。"
 PAKX_p_patronage: "政治恩庇与大家族"
 PAKX_p_patronage_desc: "地方大家族与政党之间的交换：选票、职位与工程合同，构成了政治的日常。旁遮普的地主、信德的部落长老，掌握着成片选区的选票，谁能给他们修路、派工作，谁就能赢得议席。小商人们也懂得，靠拢执政党生意才好做。"
 PAKX_p_clergy: "宗教政党与选票"
 PAKX_p_clergy_desc: "宗教政党的动员能力在选举中不容小觑：清真寺网络、宗教学校与街头抗议，能在一夜之间让首都瘫痪。两大党都要为它留出一块地方，亵渎法之类的议题无人敢碰，社会的宽容空间也因此一再收窄。"
 PAKX_p_hyb_final: "混合政体的定型"
 PAKX_p_hyb_final_desc: "宪法里没有写的那一半：文官与军方的分工，在每一次危机中都被重新谈判，也逐渐成了惯例。文官管经济与民生，军方管安全与外交，双方都不完全满意，但都接受了这个不成文的契约。巴基斯坦找到了一种不太好看的稳定。"
 PAKX_p_dem: "选举民主的转型"
 PAKX_p_dem_desc: "政党之间的竞争越来越公开，选举委员会宣布：下一次大选将接受国际观察员的监督。年轻一代通过手机与社交媒体了解政治，他们不再满足于军方挑选的候选人，要求一场真正自由、公正的选举。"
 PAKX_p_media: "独立媒体与律师的抗争"
 PAKX_p_media_desc: "独立媒体与律师界的抗争，让「言论」与「司法」成为民主的两道防线。2007 年的律师运动曾迫使穆沙拉夫让步；如今记者们顶着失踪与起诉的风险报道真相，律师公会则一次次走上街头，捍卫法院的独立。"
 PAKX_p_elections: "选举委员会的改革"
 PAKX_p_elections_desc: "选举委员会独立运作，选票计数全程透明，选民名册定期更新，电子计票系统的结果当场公布。过去每一次大选后，落败的一方都会指控舞弊；这一次，改革者希望让结果本身就足以服人。"
 PAKX_p_18th: "第十八条修正案：省的自治"
 PAKX_p_18th_desc: "第十八条宪法修正案让地方省份获得更多的财政与教育权力，中央与省的权限第一次写进了宪法的条文。旁遮普、信德、开伯尔-普什图赫瓦与俾路支斯坦各自掌握了更多的预算，联邦的权力因此受到了真正的约束。"
 PAKX_p_elections_2: "大选的民调与虚假信息"
 PAKX_p_elections_2_desc: "大选期间，社交媒体上的虚假信息与民调，成了政党之间新的战场。各党都养着自己的网络水军，深度伪造的影片与伪造的民调在 WhatsApp 群组里疯传。选举委员会疲于辟谣，选民越来越分不清什么是真的。"
 PAKX_p_civil_mil: "文官控制军队"
 PAKX_p_civil_mil_desc: "国防部长由文官担任，军方的人事任命必须经过议会的审议。这是许多人的梦想，也是军方的底线。"
 PAKX_p_provinces: "省级政府与中央的分权"
 PAKX_p_provinces_desc: "省政府的预算与警察权被逐步下放，中央的权力因此变得更依赖于协商。伊斯兰堡要推动任何全国性的政策，都必须先与四个省的首席部长坐下来谈。效率也许下降了，但边远省份的怨气少了许多。"
 PAKX_p_opposition: "反对派的街头运动"
 PAKX_p_opposition_desc: "在野党与律师界组织的街头集会与「长征」，让政府不得不在选举前作出让步。数十万人从拉合尔步行到伊斯兰堡，在议会门前静坐数周。这种抗争方式既是民主的表现，也让国家一次次陷入瘫痪。"
 PAKX_p_dem_final: "首次完整的政党轮替"
 PAKX_p_dem_final_desc: "选举结束，在野党赢得了多数席位，执政党承认败选，权力和平交接。这是巴基斯坦建国以来第一次完整的政党轮替，没有政变，没有法院干预。首都街头的人群在欢呼，军营里一片沉默。"
 PAKX_p_army: "军方的回归"
 PAKX_p_army_desc: "将军们以「维持秩序」的名义接管了国家。电视台播放着陆军参谋长的讲话，议会暂停，宪法条文被搁置，军方成了国家的最终裁判。这已不是第一次：阿尤布·汗、齐亚·哈克与穆沙拉夫都走过同一条路。"
 PAKX_p_corps: "军团指挥部"
 PAKX_p_corps_desc: "各军团的指挥部统一调度，宪法的守护者成了军队的指挥官。九个军团的司令官组成事实上的最高权力机构，每月在拉瓦尔品第的总部开会，决定从反恐行动到粮食价格的一切事务。"
 PAKX_p_ordinance: "宪法条款的临时搁置"
 PAKX_p_ordinance_desc: "「紧急状态」之下，宪法中的部分条款被暂停执行，政府改以总统令治国，集会与新闻受到限制。这一次，人们说，只是暂时的。但在这个国家，「暂时」往往意味着好几年。"
 PAKX_p_intel: "情报机构的主导"
 PAKX_p_intel_desc: "三军情报局掌握了国内的监控与政治人物的档案，它的每一份报告都能左右内阁的命运。哪位政客该被起诉、哪家电视台该被停播、哪位记者该被「请去喝茶」，都在情报机构的一念之间。"
 PAKX_p_judge_sub: "法官的重新任命"
 PAKX_p_judge_sub_desc: "高等法院的法官被要求依据临时宪法令重新宣誓，拒绝的人被免职，忠于军方的人选取代了一批独立的法官。法院不再挑战政府的合法性，但律师界的不满在暗中积累。"
 PAKX_p_army_final: "军方与国家融为一体"
 PAKX_p_army_final_desc: "国家与军队融为一体：军方的基金会经营着银行、化肥厂与房地产，退役将军出任各部会与国营企业的首长。有人称之为稳定，也有人称之为军管。历史会给出自己的答案。"
 PAKX_m_root: "国防的根本"
 PAKX_m_root_desc: "印度的威胁、阿富汗的边境与国内的反恐，让军队永远是国家的第一要务。巴基斯坦建国以来与印度打了四场战争，克什米尔的控制线上炮火不断。国防预算占去了财政的一大块，但没有哪个政府敢轻易削减。"
 PAKX_m_army: "陆军的装甲化"
 PAKX_m_army_desc: "装甲师与机械化步兵的现代化，让陆军在边境与平原上都有了机动的能力。国产的「哈立德」主战坦克陆续列装，旁遮普平原上的装甲集群是对印度「冷启动」战略的直接回应。"
 PAKX_m_nuke: "最低限度可信威慑"
 PAKX_m_nuke_desc: "核武器是国家最后的保障。1998 年查盖山的核试验之后，「最低限度可信威慑」的原则决定了每一枚导弹的数量：足以让新德里不敢轻举妄动，但不至于拖垮国家的财政。"
 PAKX_m_navy: "海军的潜艇计划"
 PAKX_m_navy_desc: "海军向中国采购新的潜艇与护卫舰，卡拉奇与瓜达尔两大军港同步扩建，印度洋上的存在感因此大增。海军的目标很明确：在战时保住阿拉伯海的航道，不让印度海军封锁卡拉奇。"
 PAKX_m_air: "JF-17 雷电机群"
 PAKX_m_air_desc: "与中国合作研制的 JF-17「雷电」战机进入了空军的主力序列，在卡姆拉的航空综合体组装生产。它成本低、可靠性高，是出口的明星，也让巴基斯坦空军不再完全依赖美国的 F-16 与其零件供应。"
 PAKX_m_isi: "情报机构 ISI"
 PAKX_m_isi_desc: "三军情报局在阿富汗与克什米尔的问题上，有着远超其他机构的影响力。它曾经培养过阿富汗的圣战者，也被指控与塔利班藕断丝连。外国情报机构既离不开它，也从不完全信任它。"
 PAKX_m_border: "阿富汗边境与反恐"
 PAKX_m_border_desc: "杜兰线两侧的部落地带，是武装分子的庇护所。巴基斯坦塔利班从这里发动袭击，阿富汗的局势又让边境永无宁日。边境的每一次交火，都要求军队重新部署，反恐行动的代价是稳定与民心。"
 PAKX_m_missile: "短程导弹"
 PAKX_m_missile_desc: "「阿卜达利」与「纳斯尔」系列的短程导弹让印度的前线部队始终处于威胁之下。可携带战术核弹头的「纳斯尔」专门针对印度的装甲突击，让新德里的「冷启动」计划变得代价高昂。"
 PAKX_m_sub: "中国造的潜艇"
 PAKX_m_sub_desc: "以中国 039 型为蓝本的「汉戈尔」级潜艇在卡拉奇下水，巴基斯坦海军第一次拥有了远海作战的能力。配备不依赖空气推进系统的潜艇可以在水下潜伏数周，在战时威胁印度的航母编队。"
 PAKX_m_jf17: "雷电机群的部署"
 PAKX_m_jf17_desc: "雷电机群在卡拉奇与拉合尔之间的空军基地轮流驻防，与预警机、地面雷达连成一张完整的防空网。飞行员们在与印度空军的历次对峙中积累了实战经验，2019 年的空战更让这支部队士气高涨。"
 PAKX_m_ct: "反恐作战"
 PAKX_m_ct_desc: "在西北部的山区，「利剑行动」与「消灭行动」等一场又一场的清剿让军队付出了沉重的代价，也收获了一些安全。北瓦济里斯坦的武装据点被拔除，但游击队化整为零，随时可能卷土重来。"
 PAKX_m_industry: "国防工业：巴基斯坦重工"
 PAKX_m_industry_desc: "军工企业在塔克西拉与卡姆拉的工厂，生产弹药、装甲车辆与导弹的部件。巴基斯坦重工从组装中国坦克起步，如今已能自行生产「哈立德」坦克的大部分零件，甚至开始向中东与非洲出口。"
 PAKX_m_coast: "海岸防务与瓜达尔"
 PAKX_m_coast_desc: "瓜达尔港的海岸防务由海军接手，保护着中国的投资与进出口航线。俾路支分离分子屡次袭击港口与外籍工程师，海军陆战队与岸防导弹部队的进驻，让北京与伊斯兰堡都松了一口气。"
 PAKX_m_airdef: "防空与预警网络"
 PAKX_m_airdef_desc: "雷达与防空导弹组成的预警网络，覆盖了全国的重要城市与核设施。新引进的远程防空系统部署在首都周边，让任何一次「外科手术式打击」都必须付出代价。"
 PAKX_m_drone: "无人机与电子战"
 PAKX_m_drone_desc: "无人机与电子战装备进入了边境部队：国产的「沙赫帕尔」无人机可以在山区上空连续盘旋十几个小时。行动的成本低、风险小，但误伤平民的事件也让部落地区的怨气越积越深，争议随之而来。"
 PAKX_m_drill: "全国防御演习"
 PAKX_m_drill_desc: "「全民防御」的演习在全国各地举行，预备役与民兵第一次与正规军在同一张作战图上训练。旁遮普的平原、信德的沙漠与北部的山地都模拟了印度的进攻，各省政府也演练了战时的物资调配。"
 PAKX_m_alliance: "与中国的联合训练"
 PAKX_m_alliance_desc: "「雄鹰」联合空军演习与陆军的联合反恐训练，让两国军队在战术与后勤上有了实际的磨合。中国的军事顾问常驻巴基斯坦，两国的装备体系也越来越兼容。新德里对此保持着高度警惕。"
 PAKX_m_naval_base: "卡拉奇的海军基地"
 PAKX_m_naval_base_desc: "卡拉奇港的海军基地扩建，新的船坞可以维修大型的护卫舰与潜艇。造船厂开始自行建造巡逻舰，海军的后勤不再完全依赖外国船厂，战时也能就地修复受损的舰艇。"
 PAKX_m_cyber: "网络战与电子情报"
 PAKX_m_cyber_desc: "军方的网络战部门负责监控边境与国内的通信，也负责对抗印度的网络攻击。两国的黑客在网络上的交锋从未停止，政府网站被篡改、电网被渗透，都已是家常便饭。"
 PAKX_m_reserve: "预备役与征兵制度"
 PAKX_m_reserve_desc: "预备役的训练周期延长，征兵的覆盖范围扩大到了更多的省份。过去陆军的兵源大多来自旁遮普，如今信德与俾路支的青年也被积极吸纳，军队希望借此成为真正的全国性机构。"
 PAKX_m_final: "核威慑的完成"
 PAKX_m_final_desc: "在一次成功的导弹试射之后，国防部宣布「最低限度可信威慑」已经建立：陆基、空基与海基的核力量构成了完整的三位一体。巴基斯坦终于拥有了第二次打击能力。印度的回应很快传来。"
 PAKX_m_sat: "卫星与太空计划"
 PAKX_m_sat_desc: "军方的遥感卫星与导弹预警计划启动，边境的侦察与监视能力第一次不再完全依赖外国的情报。"
 PAKX_m_coastguard: "海岸警卫队的扩充"
 PAKX_m_coastguard_desc: "海岸警卫队的巡逻船与直升机增加，走私与非法捕鱼的案件逐年减少。从卡拉奇到瓜达尔的漫长海岸线上，毒品、燃油与人口走私曾是地方势力的财源，如今他们的生意越来越难做。"
 PAKX_e_root: "经济：债务、出口与走廊"
 PAKX_e_root_desc: "巴基斯坦的经济靠棉纺、侨汇与外援撑着。外汇储备常常只够支付几个月的进口，卢比一贬再贬，一场债务危机，就足以让整个国家的选择变得狭窄。每一届政府上台的第一件事，都是找钱。"
 PAKX_e_imf: "与 IMF 签订救助协议"
 PAKX_e_imf_desc: "国际货币基金组织的救助贷款到账，这已经是巴基斯坦的第二十几份救助协议。但每一笔款项都附带着税收与补贴的改革条件：电价上涨、燃油补贴取消，街头的抗议也随之而来。"
 PAKX_e_self: "自主改革与国企整合"
 PAKX_e_self_desc: "拒绝接受国际援助条件，政府自行推动国企整合与税收改革：亏损的国营航空、钢铁厂与电力公司被合并重组。这条路保住了政策的自主，但付出的代价是更高的利率与更紧的银根。"
 PAKX_e_tax: "税收改革"
 PAKX_e_tax_desc: "把增值税与所得税的覆盖面扩大到更多的行业，农业收入与零售商第一次被纳入税网。全国两亿多人口中，申报所得税的人还不到百分之二，收不上来的税款仍是最大的问题。"
 PAKX_e_debt: "债务重组谈判"
 PAKX_e_debt_desc: "与中国、海湾与西方的债权人谈判，把部分债务延长到了更远的期限。沙特的存款展期、中国的贷款再融资与巴黎俱乐部的减免，让国家暂时避开了违约，但利息负担依然沉重。"
 PAKX_e_power: "能源补贴与进口天然气"
 PAKX_e_power_desc: "电力公司长年亏损，「循环债务」越滚越大，政府靠补贴与进口液化天然气维持供电。夏天的轮流停电动辄十几个小时，每一次停电都是政治的新闻。新的电厂与输电线路正在加紧兴建。"
 PAKX_e_textile: "纺织与服装出口"
 PAKX_e_textile_desc: "棉纺与服装是巴基斯坦最重要的出口产业，占出口总额的一半以上。费萨拉巴德被称为「巴基斯坦的曼彻斯特」，几百万工人的生计系于一台台织机，欧盟的关税优惠是他们最重要的市场保障。"
 PAKX_e_telecom: "电信与移动网络"
 PAKX_e_telecom_desc: "私营电信公司的竞争让手机的费用大幅降低，移动网络覆盖了大部分的农村。偏远村庄的农民用手机查看市场价格、接收汇款，移动支付让从未开过银行账户的人也进入了金融体系。"
 PAKX_e_remit: "海外劳工汇款"
 PAKX_e_remit_desc: "数百万在海湾与西方工作的巴基斯坦人，每年寄回三百亿美元的侨汇，占了外汇收入的很大一部分。迪拜的建筑工人与伦敦的出租车司机，用他们的血汗撑起了家乡的消费与外汇储备。"
 PAKX_e_cpec: "中巴经济走廊的启动"
 PAKX_e_cpec_desc: "从喀什到瓜达尔的经济走廊正式启动。道路、电力与港口项目纷纷开工，债务与机遇，在同一张图纸上。"
 PAKX_e_agri: "棉花与灌溉"
 PAKX_e_agri_desc: "棉花产量受到水资源与病虫害的制约，灌溉渠道的修缮成了农业改革的第一步。印度河流域拥有世界上最大的连续灌溉系统之一，但英国人留下的渠道年久失修，渗漏与盐碱化正在吞噬良田。"
 PAKX_e_mining: "矿产与钢铁"
 PAKX_e_mining_desc: "俾路支与旁遮普的矿产资源需要更多的投资：雷科迪克的铜金矿、塔尔的褐煤田都是世界级的储量。卡拉奇的国营钢铁厂却常年停产亏损，产能远远跟不上建设的需求。"
 PAKX_e_gwadar: "瓜达尔港的扩建"
 PAKX_e_gwadar_desc: "中国援建的瓜达尔深水港扩建完成，第一批货轮靠泊，港口与经济特区的规划开始落地。这座曾经的小渔村，被寄望成为中国西部通往阿拉伯海的门户，但当地的俾路支居民抱怨自己连淡水都用不上。"
 PAKX_e_motorway: "高速公路与铁路"
 PAKX_e_motorway_desc: "白沙瓦到卡拉奇的高速公路与铁路网逐步连通，货运的时间缩短了一半。走廊项目中的一号铁路干线改造，让英国殖民时代的老铁路第一次真正实现了现代化。"
 PAKX_e_it: "IT 外包与年轻人才"
 PAKX_e_it_desc: "自由职业者与 IT 外包公司在卡拉奇与拉合尔快速增长，数字经济成为年轻人的新选择。巴基斯坦的自由职业者人数位居世界前列，他们为硅谷与伦敦的公司写程序，赚取的外汇不比纺织厂少。"
 PAKX_e_tourism: "北部旅游与观光"
 PAKX_e_tourism_desc: "在吉尔吉特与斯瓦特山谷，喀喇昆仑的雪峰与古老的丝路小镇吸引了国内外的游客，旅游业带来了新的收入。但道路、酒店与安全保障的建设仍然滞后，塔利班曾在斯瓦特留下的阴影也还没散去。"
 PAKX_e_airport: "机场与物流枢纽"
 PAKX_e_airport_desc: "伊斯兰堡与卡拉奇的国际机场扩建，货运枢纽与自由贸易区的规划同时推进。政府希望把巴基斯坦打造成连接中亚、中东与南亚的物流中心，让阿富汗与中亚的货物经由巴基斯坦出海。"
 PAKX_e_banking: "国有银行的改革"
 PAKX_e_banking_desc: "国有银行的不良贷款被逐步剥离，新的监管机构开始检查银行的资本充足率。过去这些银行是政客们的提款机，贷款给关系户、坏账由国库买单；如今国家银行要求它们按商业规则经营。"
 PAKX_e_stock: "证券市场的开放"
 PAKX_e_stock_desc: "巴基斯坦证券交易所向外国投资者开放，资本市场的规则第一次接近国际标准。卡拉奇、拉合尔与伊斯兰堡三家交易所合并之后，交易量稳步上升，国企的部分股份也开始在市场上出售。"
 PAKX_e_final: "走廊经济的成型"
 PAKX_e_final_desc: "瓜达尔港的第一艘大型货轮靠泊，中巴经济走廊的高速公路通车。巴基斯坦的经济，第一次有了一条清楚的主轴。"
 PAKX_f_root: "南亚的大国博弈"
 PAKX_f_root_desc: "夹在印度、阿富汗、伊朗与中国之间，巴基斯坦的外交靠的是「与所有大国都保持一定距离」的平衡术。冷战时它是美国的盟友，又是中美建交的牵线人；如今它要在北京、华盛顿与利雅得之间继续走钢丝。"
 PAKX_f_china: "对华全天候战略伙伴"
 PAKX_f_china_desc: "两国的友谊被形容为「比山高、比海深、比蜜甜」，并被写进了「全天候战略合作伙伴」的表述。从喀喇昆仑公路到核电站，中国一直是最可靠的朋友，在外交上也从不让巴基斯坦孤立无援。"
 PAKX_f_india: "对印关系与克什米尔"
 PAKX_f_india_desc: "克什米尔的主权争端从未解决，自 1947 年分治以来，两国已为此打了三场战争。孟买恐袭、普尔瓦马自杀式爆炸与随后的空袭，每一次边境的交火，都让两国的外交陷入僵局。"
 PAKX_f_us: "对美关系的修复"
 PAKX_f_us_desc: "阿富汗撤军之后，美巴关系经历了一段冷淡期，华盛顿指责伊斯兰堡两面下注，伊斯兰堡则抱怨被用完即弃。新的合作从反恐与经贸开始，双方都在试探对方还剩下多少信任。"
 PAKX_f_gulf: "海湾的资金与朝觐之路"
 PAKX_f_gulf_desc: "海湾国家的投资与援助，是巴基斯坦外汇的重要来源；巴基斯坦的军人则长期为沙特训练部队、守卫圣地。每年数百万前往麦加的朝觐者与在海湾工作的劳工，也是两地之间割不断的纽带。"
 PAKX_f_cpec: "中巴经济走廊的外交保障"
 PAKX_f_cpec_desc: "外交部门负责为中巴经济走廊的项目争取国际支持，并处理沿线地区的安全与舆论问题。印度反对走廊穿越吉尔吉特-巴尔蒂斯坦，西方质疑其债务风险，俾路支武装则把中国工程师当作袭击目标。"
 PAKX_f_weapons: "中国武器装备的采购"
 PAKX_f_weapons_desc: "从中国购买的战机、潜艇与导弹，是巴基斯坦军队最重要的装备来源。美国的军售时断时续，还常附带制裁的风险；中国的装备价格低、交货快，也不附带政治条件，自然成了首选。"
 PAKX_f_sco: "上海合作组织"
 PAKX_f_sco_desc: "2017 年正式加入的上海合作组织，为巴基斯坦提供了与中亚、俄罗斯和伊朗对话的平台。在这个场合，巴印两国的领导人也不得不同处一室，偶尔还能在会场的走廊里交换几句话。"
 PAKX_f_china_final: "全天候伙伴的成型"
 PAKX_f_china_final_desc: "巴中两国领导人发表联合声明，宣布「全天候战略合作伙伴关系」进入新阶段：走廊的第二期项目、联合研发的新型战机与双边货币互换协议同时签署。巴基斯坦在大国之间的平衡，明显向东倾斜了。"
 PAKX_f_aid: "美国援助与反恐合作"
 PAKX_f_aid_desc: "美国的援助与情报分享，让反恐行动得以延续，但每一笔援助都附带着人权与打击恐怖组织的条件。国会每年审议援助时都会质问：为什么本·拉登能在阿伯塔巴德的军校旁住上好几年？"
 PAKX_f_drone: "无人机打击与主权"
 PAKX_f_drone_desc: "美国的无人机打击行动在部落地区引发了强烈的抗议。每一次打击都可能击毙恐怖分子，也可能炸死参加婚礼的平民。议会通过决议谴责美国侵犯主权，但情报机构私下仍在提供目标信息。主权与安全的争论，从未停止。"
 PAKX_f_afghan: "阿富汗撤军之后"
 PAKX_f_afghan_desc: "北约撤军之后，阿富汗的局势再度紧张。塔利班重新掌权，巴基斯坦曾以为这会带来一个友好的西邻，结果却是巴基斯坦塔利班的袭击越来越多。边境既是难民的出口，也是安全的前线。"
 PAKX_f_us_final: "美巴关系的重新定位"
 PAKX_f_us_final_desc: "两国在反恐、经贸与教育方面达成了新的协议：美国开放更多的纺织品配额，富布莱特奖学金扩大名额，双方的军事交流也恢复了。华盛顿与伊斯兰堡，又找到了一条共同的路。"
 PAKX_f_kashmir: "克什米尔的对峙"
 PAKX_f_kashmir_desc: "实际控制线两侧的炮击与巡逻，让每一次谈判都在火药味中开始。2019 年印度取消查谟和克什米尔的特殊地位之后，两国关系降到了冰点，边境村庄的居民又一次躲进了防空洞。"
 PAKX_f_indus: "印度河水条约"
 PAKX_f_indus_desc: "1960 年签订的印度河水条约，熬过了三场战争，是两国之间少数的合作之一。但印度在上游兴建的水坝工程让下游的农民忧心忡忡：一旦新德里决定扣住河水，旁遮普的田地就会干涸。"
 PAKX_f_peace: "对印和谈的尝试"
 PAKX_f_peace_desc: "两国的外交官在第三国秘密会面，谈判的议题从贸易、签证一直延伸到克什米尔的未来。双方的强硬派都在国内施压，任何让步都可能被骂成卖国。谈判的桌子摆好了，但椅子还没有坐满。"
 PAKX_f_gulf_money: "海湾的资金与援助"
 PAKX_f_gulf_money_desc: "沙特与阿联酋的投资与贷款，为能源与基础设施项目提供了关键的资金。利雅得的递延石油付款与阿布扎比的央行存款，每每在外汇储备见底时救急，代价是巴基斯坦在海湾的纷争中很难置身事外。"
 PAKX_f_turkey_iran: "土耳其与伊朗：伊斯兰世界的第三条路"
 PAKX_f_turkey_iran_desc: "与土耳其、伊朗的三边合作，让巴基斯坦在伊斯兰世界里找到了一个不依附任何一方的位置。安卡拉提供军舰与无人机，德黑兰提供天然气与边境贸易，伊斯兰堡则希望自己不必在沙特与伊朗之间选边站。"
 PAKX_f_saudi: "沙特的能源合作"
 PAKX_f_saudi_desc: "沙特的原油供应与朝觐安排，是两国之间最实际的合作。能源价格的每一次波动，都会传到巴基斯坦的电费账单上。"
 PAKX_f_roc: "与中华民国的务实关系"
 PAKX_f_roc_desc: "没有正式邦交的台北与伊斯兰堡，在贸易、教育与民间往来上找到了务实的空间。台湾的纺织机械与半导体零件进入了巴基斯坦的工厂，巴基斯坦的留学生开始出现在新竹与台南的研究所里。"
 PAKX_f_roc_trade: "台巴的贸易与投资"
 PAKX_f_roc_trade_desc: "纺织、医药与农产品的贸易逐年增长：台湾的纺织机械与化纤原料运往费萨拉巴德，巴基斯坦的芒果、外科器械与棉纱运往高雄。台北与伊斯兰堡之间的商会、学术交流与直航航班，也一年比一年多。"
 PAKX_f_mediation: "大国之间的平衡"
 PAKX_f_mediation_desc: "中美之间的竞争，印度与中国之间的对峙：巴基斯坦找到了一个可以居中的位置，并靠它换取了更多的回旋余地。"
 PAKX_f_final: "全方位的外交"
 PAKX_f_final_desc: "与大国友好、与邻国相处、在区域机构中发声：巴基斯坦的外交，终于不必在一个答案之间做选择。北京、华盛顿、利雅得与安卡拉都把伊斯兰堡视为可以打交道的伙伴，这个曾被称为「最危险国家」的国度，赢得了久违的尊重。"
 PAKX_i_root: "民生与安全：国家的第二战场"
 PAKX_i_root_desc: "边境的武装、城市的犯罪与农村的贫困，决定着巴基斯坦能不能真正地稳定下来。对大多数巴基斯坦人来说，比克什米尔更迫切的，是停电、物价、孩子的学校和夜里能不能安全回家。这是国家的第二战场。"
 PAKX_i_baloch: "俾路支的分离运动"
 PAKX_i_baloch_desc: "俾路支省是全国面积最大、人口最少、也最贫穷的省份，分离运动长年不断。苏伊气田的天然气供应全国，当地人却用不上；瓜达尔的港口热火朝天，当地渔民却被挡在门外。天然气田与港口的安全，是政府最担心的问题。"
 PAKX_i_ttp: "巴基斯坦塔利班与开伯尔-普什图"
 PAKX_i_ttp_desc: "西北部的武装组织不断发动袭击，学校、市场与清真寺都成了目标。政府的回应既是军事的，也是政治的。"
 PAKX_i_madrasa: "宗教学校与极端主义"
 PAKX_i_madrasa_desc: "数以千计的宗教学校为贫困家庭的孩子提供食宿，也成了极端思想的温床。改革的呼声越来越高。"
 PAKX_i_counter: "反恐与情报合作"
 PAKX_i_counter_desc: "情报机构与警察之间的合作逐步改善，过去各管一摊、互不通气的局面开始改变。跨省的追踪与信息共享开始运作，国家反恐局建立了统一的嫌犯数据库，从白沙瓦到卡拉奇的线索第一次能在几小时内串联起来。"
 PAKX_i_nap: "国家行动计划"
 PAKX_i_nap_desc: "2014 年白沙瓦军校惨案之后，一份涵盖反恐、宗教学校登记、打击仇恨言论与难民安置的国家行动计划出台，并被写进了政府的年度预算。军方、文官与各省政府第一次就国内安全达成了一致。"
 PAKX_i_police: "警察改革"
 PAKX_i_police_desc: "地方警察的培训与薪资改革，让普通人第一次愿意在街头向警察求助。过去警察局是腐败与刑讯的代名词，派出所长由地方议员指派；如今警务委员会负责人事，女警与社区警务站也走进了街区。"
 PAKX_i_security_final: "城市与边境的安全"
 PAKX_i_security_final_desc: "卡拉奇与拉合尔的「安全城市」监控网络，加上阿富汗边境两千多公里的围栏，让安全感有所回升，爆炸与绑架案件明显减少。但大规模监控与强迫失踪的案件，让人权团体提出了尖锐的批评。"
 PAKX_i_refugees: "阿富汗难民的安置"
 PAKX_i_refugees_desc: "数百万阿富汗难民在巴基斯坦生活了几十年，他们的孩子在白沙瓦出生、长大，从未见过阿富汗。安置与遣返之间，政府一直在摇摆：给他们身份，财政吃不消；强行遣返，又会招来国际谴责。"
 PAKX_i_edu: "教育与女童入学"
 PAKX_i_edu_desc: "「每一个孩子都要上学」：全国仍有两千多万儿童失学，其中大多数是女孩。马拉拉在斯瓦特遭枪击的故事震惊了世界，女童的入学率也因此成了衡量国家进步的一把尺子。政府在农村新建女子学校，并为入学家庭发放补贴。"
 PAKX_i_health: "全民医保"
 PAKX_i_health_desc: "「健康卡」计划让贫困家庭可以在公立与私立医院免费住院，公立医院的覆盖率与医保的报销比例逐年提高。但药品短缺与医护人员的流失依旧严重：许多医生与护士毕业后就前往海湾与英国工作。"
 PAKX_i_flood: "2022 年的洪灾与重建"
 PAKX_i_flood_desc: "季风洪水淹没了全国三分之一的土地。国际援助的规模前所未有，重建的第一步是把河堤重新修好。"
 PAKX_i_urban: "城市化与卡拉奇"
 PAKX_i_urban_desc: "每年数十万人口从农村涌入卡拉奇，这座城市的人口已超过两千万。住房与供水的压力，让城市的边缘区与非正式聚落不断扩张，「卡奇阿巴迪」里的居民没有地契，也没有自来水。政府开始规划新的工业区与安居工程。"
 PAKX_i_media: "媒体与言论自由"
 PAKX_i_media_desc: "新闻媒体在政治与安全议题上的自我审查，让许多真相只能在社交媒体上流传。电视台被断讯、记者被跟踪，是业内公开的秘密。政府宣布放宽媒体管制，但军方的「红线」依然存在，没有人知道它到底画在哪里。"
 PAKX_i_climate: "气候适应与冰川融化"
 PAKX_i_climate_desc: "北部冰川的融化与季风的不稳定，让水资源的规划成了一道难题。巴基斯坦的温室气体排放不到全球的百分之一，却是受气候变化冲击最严重的国家之一：一边是冰湖溃决的洪水，一边是信德的热浪与干旱。"
 PAKX_i_youth: "青年与就业"
 PAKX_i_youth_desc: "巴基斯坦六成以上的人口不满三十岁，每年有数百万年轻人进入劳动力市场，就业机会却赶不上人口增长的速度。政府推出青年创业贷款与职业培训计划，希望把「人口红利」变成增长，而不是变成街头的怒火。"
 PAKX_i_census: "人口普查与生育率"
 PAKX_i_census_desc: "新一轮人口普查显示全国人口已超过两亿四千万，但生育率正在下降，城市家庭的孩子越来越少。各省为了议席与财政分配，对普查结果争吵不休。政府开始讨论家庭政策与养老金的长期安排。"
 PAKX_i_water2: "卡拉奇的供水"
 PAKX_i_water2_desc: "卡拉奇的供水长期依赖地下水与远程输水管道。新的水厂项目让供水的时间第一次超过了每天十二小时。"
 PAKX_i_ngo: "慈善与非政府组织"
 PAKX_i_ngo_desc: "埃迪慈善基金会的救护车与免费厨房，比政府更早出现在每一个灾区。慈善团体与非政府组织在灾区与贫困社区开展服务，政府过去对外国资助的组织疑心重重，如今开始让它们在法律框架内登记与运作。"
 PAKX_i_social_final: "共同发展的巴基斯坦"
 PAKX_i_social_final_desc: "国家的新规划把教育、医疗与就业放在了首位。政府承诺：每一个孩子都能上学，每一个家庭都能看病。"
 PAKX_i_final: "国家的内部和解"
 PAKX_i_final_desc: "安全与民生，不再是两件分开的事。学校、医院与就业让极端组织招不到新人，警察与法院让普通人愿意相信国家。巴基斯坦的内政，第一次有了一条看得见的主线，国家开始真正地与自己的人民和解。"
