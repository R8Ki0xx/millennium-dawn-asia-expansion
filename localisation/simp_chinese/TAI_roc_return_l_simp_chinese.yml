 roc_asia.1.a: "公投通过，新宪法生效。"
 roc_asia.1.b: "公投虽以微弱差距通过，反对阵营仍不服气。"
 roc_asia.1.t: "修宪公投结果"
 roc_asia.1.d: "修宪案交付全民公投，投票率超过六成。光化门广场前的大屏幕实时播放开票结果，支持与反对的双方各自聚集在广场的两侧。无论结果如何，这都是韩国宪政史上具有里程碑意义的一天：1987 年之后，国民第一次亲手改写了国家的根本大法。"
 TAI_ext_phi_us_ally: "美菲同盟的巩固"
 TAI_ext_phi_china_pivot: "菲律宾的对华友好"
 TAI_ext_phi_us_cool: "菲律宾的疏离"
 PHIP_clean_government_idea: "廉洁政府"
 PHIP_clean_government_idea_desc: "「没有贪腐，就没有贫穷。」行政部门的透明度与问责制度得到改善：政府采购公开招标，官员的财产接受审查，弊案的调查不再看政治立场。"
 PHIP_strongman_idea: "强人治国"
 PHIP_strongman_idea_desc: "强势的总统以铁腕推进治安与基建，反对者批评其侵蚀了民主制度。犯罪率下降、工程加速，民调支持率居高不下；但法外处决与对媒体的打压，也在国际上引发了强烈批评。"
 PHIP_coalition_idea: "朝野大联合"
 PHIP_coalition_idea_desc: "传统政治家族与商界达成默契，政局出现罕见的平稳。国会里的法案在各派系的讨价还价中顺利通过，政府的施政少了许多阻力；但改革的步伐也因此放慢。"
 PHIP_social_democracy_idea: "进步联盟的社会契约"
 PHIP_social_democracy_idea_desc: "土地改革、劳工权利与普惠医疗，构成新政府的施政核心。农民分到了土地、工人有了工会、穷人看得起病，社会的不满情绪明显减少，民生用品的供应也更加充足。"
 PHIP_national_consensus_idea: "新的国家共识"
 PHIP_national_consensus_idea_desc: "各政党就基本政治规则达成共识，国家终于走出了持续数十年的政治动荡。"
 PHIP_npa_low_tt: "新人民军的强度已降到 §Y30§! 以下"
 roc_asia.20.a: "继续推动改革。"
 roc_asia.20.t: "改革的任期"
 roc_asia.20.d: "改革派的第一个任期结束，选民对廉洁政府的满意度很高：前总统因贪腐入狱，政府采购公开透明，经济持续增长。但仍有许多承诺没有兑现，反政治王朝法在国会中遭到搁置，农村的贫困也没有明显改善。改革还需要继续。"
 roc_asia.21.a: "历史自有公论。"
 roc_asia.21.t: "强人时代的谢幕"
 roc_asia.21.d: "强人总统在任期届满后离开了总统府，他的继任者承诺「延续政策」。马尼拉的街头治安确实好转，大型基建工程也一一完工；但禁毒战争的死者家属仍在等待正义，国际刑事法院的调查也悬而未决。他的功过，将由历史评说。"
 roc_asia.22.a: "稳定压倒一切。"
 roc_asia.22.t: "平稳的任期"
 roc_asia.22.d: "联合政府的第一个任期平稳结束，传统家族的格局基本未变：马尼拉的豪门、宿务的商人与棉兰老的地方首领各安其位。经济稳步增长，外资对菲律宾的政局感到放心；但批评者说，这种稳定的代价是改革的停滞。"
 roc_asia.23.a: "让改革继续深入。"
 roc_asia.23.t: "进步联盟的第一个任期"
 roc_asia.23.d: "进步联盟完成了任期内的主要立法：土地改革法、劳工权利法与全民医保法相继通过。批评者说改革太慢、财政负担太重，支持者说国家已经改变了方向。下一届选举将决定，菲律宾的左翼能否在权力中心站稳脚跟。"
 roc_asia.24.a: "开启国家建设的新篇章。"
 roc_asia.24.t: "政治线落幕"
 roc_asia.24.d: "菲律宾的政治格局终于稳定下来：各政党就基本的规则达成共识，叛乱的阴影逐渐散去，政权的交接也成为常态。国家的注意力，转向经济、军事与外交这些更长远的议题；EDSA 革命的承诺，在一代人之后终于有了着落。"
 TAI_ext_vie_us_partner: "越美全面伙伴关系"
 TAI_ext_vie_china_coop: "越中全面战略合作"
 TAI_ext_vie_russia: "越俄传统友谊"
 TAI_ext_vie_india: "越印战略合作"
 TAI_ext_vie_japan: "越日深度战略伙伴"
 TAI_ext_vie_korea: "越韩经济纽带"
 TAI_ext_vie_scs_tension: "南海岛礁军事化"
 TAI_ext_vie_roc: "越南与中华民国的务实关系"
 VIEX_doi_moi_2_idea: "革新开放 2.0"
 VIEX_doi_moi_2_idea_desc: "以市场化改革、国企重组与更开放的投资环境为核心的第二轮革新。民营经济获得了更大的空间，外资大举进入，税收与研发能力同步提升；越南的经济进入了新一轮的高速增长。"
 VIEX_party_discipline_idea: "整党整风"
 VIEX_party_discipline_idea_desc: "党内整顿与思想教育让纪律重新收紧，社会的开放度却随之下降。干部们小心谨慎、不敢逾矩，政局稳定；但企业家与外资对过度的管制感到担忧，经济的活力有所减弱。"
 VIEX_multiparty_idea: "多党民主"
 VIEX_multiparty_idea_desc: "独立候选人、独立媒体与多党竞争带来更多活力，也带来更多争吵。西方国家对越南的民主转型给予高度评价，贸易与投资随之增加；但新生的民主政治仍在学习如何处理分歧。"
 VIEX_red_junta_idea: "军人治国"
 VIEX_red_junta_idea_desc: "人民军接管了国家，纪律与效率取代了辩论。军方的统治让社会秩序井然，国防动员的能力大幅提升；但西方国家对军人政权保持距离，贸易往来受到影响。"
 VIEX_blazing_furnace_idea: "熔炉反腐"
 VIEX_blazing_furnace_idea_desc: "「没有禁区、没有例外」的反腐风暴，一批高官落马，官场风气大变。贪腐的减少让政府的威信提升，但官员们因担心被追究而不敢拍板，许多工程的审批因此延宕。"
 VIEX_fdi_hub_idea: "全球制造业枢纽"
 VIEX_fdi_hub_idea_desc: "三星、英特尔与一大批外资工厂让越南成为全球供应链的重要一环。工业区的建设速度一年快过一年，外资带来了技术与就业，越南制造的产品行销全世界。"
 VIEX_mekong_granary_idea: "湄公河粮仓"
 VIEX_mekong_granary_idea_desc: "稻米、水产与热带作物构成稳定的农业出口，也是农村稳定的基础。湄公河三角洲的农民收入稳步增长，农产品出口为国家带来了可观的外汇与税收。"
 VIEX_digital_vietnam_idea: "数字越南"
 VIEX_digital_vietnam_idea_desc: "本土科技企业与庞大的年轻互联网用户群，推动数字经济快速增长。Viettel、FPT 与新一代的创业公司在人工智能、云端与电子商务领域大展拳脚，研发与税收同步增长。"
 VIEX_north_south_artery_idea: "南北大动脉"
 VIEX_north_south_artery_idea_desc: "高速公路、高铁与深水港把南北两大经济中心紧密连接。物流的成本大幅下降，沿线的城市与工业区迅速发展，基础建设的速度也随着经验的积累而加快。"
 VIEX_total_defense_idea: "全民国防"
 VIEX_total_defense_idea_desc: "「四不」国防政策下的全民国防体系：常备军、预备役与民兵相互配合。越南能在短时间内动员大量的兵力，部队的组织与士气都保持在较高的水平。"
 VIEX_maritime_militia_idea: "海上民兵"
 VIEX_maritime_militia_idea_desc: "渔民与海岸警卫队的联合体系，既护渔又巡海，是南海维权的前线力量。数以千计的渔船配备了卫星通信，与海警、海军协同行动，让越南在南海的存在感大幅提升。"
 VIEX_bamboo_diplomacy_idea: "竹子外交"
 VIEX_bamboo_diplomacy_idea_desc: "「根深、干硬、枝柔」——与所有大国都保持友好，也不依附任何一方。越南同时是美、中、俄、日、印的伙伴，在大国之间左右逢源，贸易与投资源源不断。"
 VIEX_asian_tiger_idea: "亚洲新虎"
 VIEX_asian_tiger_idea_desc: "越南成为东南亚增长最快的经济体之一。制造业、服务业与数字经济全面开花，人民的收入快速增长，政府的税收与社会的稳定都达到了新的高度。"
 VIEX_climate_resilience_idea: "气候韧性"
 VIEX_climate_resilience_idea_desc: "面对海平面上升与湄公河三角洲盐碱化，越南建立了全国性的气候适应体系。"
