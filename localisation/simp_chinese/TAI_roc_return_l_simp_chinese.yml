 TAI_gov_ly_minority: "§R少数政府§!，有倒阁风险"
 TAI_gov_ly_status_tt: "执政联盟在立法院过半为§G多数支持§!。\n不过半则为§R少数政府§!：政治点数 -10%，稳定度 -3%；阁揆提名有 45% 几率被否决，每月有小几率被提倒阁案。\n少数政府时可用决议「解散立法院」提前改选。"
