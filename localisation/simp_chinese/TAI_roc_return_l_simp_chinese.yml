 TAI_five_yuan_modifier: "五院施政"
 TAI_five_yuan_modifier_desc: "行政、立法、司法、考试、监察五院院长的人选，共同决定了政府的施政效果：政治点数、稳定度、研究速度与建设速度都会随院长的组合而变化。可在「中华民国政府 · 五院」决议中更换院长人选。"
 TAI_gov_vote_pass_tt: "执政联盟在立法院过半，同意案§G必定通过§!。"
 TAI_gov_vote_risky_tt: "执政联盟在立法院§R未过半§!，同意案有 §R45%§! 的几率被否决。"
 TAI_gov.1.t: "提名行政院长"
 TAI_gov.1.d: "现任行政院长§Y[TAI_gov_premier_name]§!（[TAI_gov_premier_party]）。依宪法，行政院长由总统提名，经立法院同意任命。总统府正在考虑新的阁揆人选：不同的人选代表不同的政治路线，也会带来不同的施政重点。在少数政府时，提名人选还必须获得足够的立委支持，否则可能被立法院否决。"
 TAI_gov.1.keep: "维持现任行政院长。"
 TAI_gov.2.t: "立法院否决阁揆提名"
 TAI_gov.2.d: "立法院以些微差距否决了总统提名的行政院长人选。在野党在议场外举行记者会，宣称这是「民意的胜利」；执政党则指责在野党为反对而反对，让政府陷入空转。总统府必须决定：另提一位在野党能够接受的人选，还是解散立法院、诉诸民意。"
 TAI_gov.2.a: "另提人选。"
 TAI_gov.2.b: "解散立法院，诉诸民意！"
 TAI_gov.3.t: "立法委员选举"
 TAI_gov.3.d: "第 [?TAI_ly_term|0] 届立法委员选举结果揭晓：中国国民党 [?TAI_ly_kmt|0] 席、中国民主党 [?TAI_ly_dp|0] 席、民革 [?TAI_ly_sd|0] 席、亲民党 [?TAI_ly_pfp|0] 席、中国共产党 [?TAI_ly_cpc|0] 席、无党籍及其他 [?TAI_ly_other|0] 席。执政联盟共 [?TAI_ly_gov|0] 席。各党总部里有人欢呼、有人落泪，新的国会将决定未来几年的施政方向。"
 TAI_gov.3.a: "新一届立法院就职。"
 TAI_gov.4.t: "倒阁案"
 TAI_gov.4.d: "在野党在立法院提出对行政院长§Y[TAI_gov_premier_name]§!的不信任案，并以多数通过。这是宪政史上少见的倒阁事件，股市应声下跌，媒体连夜加开特别节目。依宪法，行政院长须总辞，或呈请总统解散立法院、让选民来做最后的裁决。"
 TAI_gov.4.a: "行政院长率内阁总辞。"
 TAI_gov.4.b: "呈请总统解散立法院，重新改选。"
 TAI_gov_nominate_premier: "提名行政院长"
 TAI_gov_nominate_premier_desc: "由总统提名新的行政院长，须经立法院同意。行政院长是政府的首长，负责内阁的组成与施政；在少数政府时，提名人选往往需要与在野党协商才能过关。"
 TAI_gov_dissolve_ly: "解散立法院"
 TAI_gov_dissolve_ly_desc: "少数政府时，可呈请总统解散立法院，提前改选。这是打破朝野僵局的最后手段：如果选民支持执政党，新的国会将让政府施政顺畅；如果选输，政府的处境只会更加艰难。"
 TAI_gov_lobby_legislators: "游说立法委员"
 TAI_gov_lobby_legislators_desc: "党鞭与行政院政务委员逐一拜会无党籍及在野党立委，以地方建设经费与委员会席位换取支持。"
 TAI_gov_lobby_legislators_tt: "执政党在立法院§G+2～6§! 席（先拉拢无党籍，不够再从最大的在野党挖角）"
 TAI_gov_political_deal: "政治交易"
 TAI_gov_political_deal_desc: "与在野党派系进行台面下的交易：部会首长职位、特别预算与选区划分，换取一批立委改投执政党。"
 TAI_gov_political_deal_tt: "执政党在立法院§G+6～12§! 席（先拉拢无党籍，不够再从最大的在野党挖角）"
