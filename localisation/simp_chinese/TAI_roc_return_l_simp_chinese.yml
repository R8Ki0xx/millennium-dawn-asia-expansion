 TAI_gov.8.t: "提名监察院长"
 TAI_gov.8.d: "现任监察院长§Y[TAI_gov_control_name]§!。总统可依宪法提名新的监察院长，经监察院或立法院同意后任命。监察院拥有弹劾、纠举与审计之权，是政府清廉的守门人，院长的魄力决定了打击贪腐的力度。"
 TAI_gov.8.keep: "留任现任监察院长。"
 TAI_gov_nominate_legis: "提名立法院长"
 TAI_gov_nominate_legis_desc: "更换立法院长。立法院长主持议事、协调朝野，是国会运作的关键人物；不同的院长人选会带来不同的施政加成，也会影响执政党在国会中的影响力。"
 TAI_gov_nominate_judicial: "提名司法院长"
 TAI_gov_nominate_judicial_desc: "更换司法院长。司法院长兼任大法官会议的主席，负责宪法解释与司法行政；院长的人选关系到司法独立的形象，不同的人选会带来不同的施政加成。"
 TAI_gov_nominate_exam: "提名考试院长"
 TAI_gov_nominate_exam_desc: "更换考试院长。考试院负责公务员的考选、铨叙与保训，是五权宪法中独具特色的一院；不同的院长人选会带来不同的施政加成，影响文官体系的专业与效率。"
 TAI_gov_nominate_control: "提名监察院长"
 TAI_gov_nominate_control_desc: "更换监察院长。监察院拥有弹劾、纠举与审计的权力，是政府清廉的守门人；不同的院长人选会带来不同的施政加成，也决定了打击贪腐的力度。"
 TAI_five_yuan_category: "中华民国政府 · 五院"
 TAI_five_yuan_category_desc: "§L依五权宪法，中华民国政府分设行政、立法、司法、考试、监察五院。行政院长须经立法院同意；立法院不过半时为少数政府。总统不得兼任行政院长。§!"
 TAI_gov_gui_president: "执政党 §Y[ROOT.GetRulingParty]§! · 第 [?TAI_ly_term|0] 届立法院"
 TAI_gov_gui_pres_name: "§Y[ROOT.GetLeader]§!"
 TAI_gov.9.t: "总统不得兼任行政院长"
 TAI_gov.9.d: "依宪法，总统不得兼任行政院长。新任总统§Y[ROOT.GetLeader]§!原为行政院长，须去职；行政院暂由§Y[TAI_gov_premier_name]§!接任，以维持内阁的正常运作。总统府可另行提名行政院长人选，也可维持目前的安排，让政府平稳过渡。"
 TAI_gov.9.a: "另行提名行政院长人选。"
 TAI_gov.9.b: "维持目前的人选。"
