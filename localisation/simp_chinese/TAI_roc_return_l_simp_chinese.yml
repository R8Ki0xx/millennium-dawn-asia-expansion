 TAI_dbf_category: "收拾河山"
 TAI_dbf_category_desc: "光复初期遗留的种种积弊，需要时间与施政慢慢化解。各项国家精神的严重度每月自然下降，稳定度、立法院多数等条件会加快恢复；也可以花费政治点数与资金主动治理。\n\n§L只显示仍存在的项目：§!\n - §Y黑金政治§!：[?TAI_dbf_black_gold_sev|0]/100\n - §Y外交孤立§!：[?TAI_dbf_isolation_sev|0]/100\n - §Y募兵制转型阵痛§!：[?TAI_dbf_conscription_sev|0]/100\n - §Y两岸军力失衡§!：[?TAI_dbf_imbalance_sev|0]/100\n - §Y民心未附§!：[?TAI_dbf_hearts_sev|0]/100\n - §Y解放军残部§!：[?TAI_dbf_pla_remnants_sev|0]/100\n - §Y经济转轨阵痛§!：[?TAI_dbf_transition_sev|0]/100\n - §Y地方割据§!：[?TAI_dbf_warlordism_sev|0]/100\n - §Y接收腐败§!：[?TAI_dbf_carpetbag_sev|0]/100"
 TAI_dbf_mission_pla: "三年肃清解放军残部"
 TAI_dbf_mission_pla_desc: "国防部承诺在三年内完成对前解放军的整编与清剿。逾期未完成，民众对政府的信心将受到打击。"
 TAI_dbf_mission_black_gold: "两年整肃黑金"
 TAI_dbf_mission_black_gold_desc: "行政院长在立法院许下「两年内让黑金退出政坛」的承诺。检调单位全面出击，查办贿选、围标与黑道议员；如果能在期限内兑现承诺，政府的威信将大为提升。"
 roc_md.6.t: "海南撞机"
 roc_md.6.d: "2001年4月1日，一架美国海军EP-3侦察机在南海与一架前来识别的国军战机擦撞，美机紧急迫降海南岛陵水机场，国军飞行员跳伞获救。美方要求立即归还机组与飞机；国内的民族主义者则认为，即使是盟友，也不能在中国的领空予取予求。"
 roc_md.6.a: "盟邦之谊——立即送返机组。"
 roc_md.6.b: "主权至上——要求美方致歉。"
 roc_md.1.t: "非典型肺炎"
 roc_md.1.d: "一种不明原因的非典型肺炎在广东蔓延，并随着春运的人潮扩散到北平、香港与台北。医院里的医护人员相继倒下，民众抢购口罩与板蓝根。行政院卫生署必须决定如何应对这场突如其来的疫情：公开透明，还是封锁消息以免引起恐慌。"
 roc_md.1.a: "公开疫情，与世界卫生组织合作。"
 roc_md.1.b: "封锁消息，避免恐慌。"
 roc_md.2.t: "汶川大地震"
 roc_md.2.d: "四川汶川发生里氏 8.0 级大地震，数以万计的同胞罹难，许多学校在地震中倒塌，数千名学生被埋在废墟之下。国军与全国各地的志愿者连夜赶赴灾区，台湾的慈济与红十字会也派出了救难队。这是对新政府救灾能力的第一次重大考验。"
 roc_md.2.a: "国军全力投入救灾！"
 roc_md.2.b: "由地方政府主导救灾。"
 roc_md.3.t: "北京奥运会"
 roc_md.3.d: "中共时期取得的 2008 年奥运主办权，如今由中华民国政府接手。鸟巢与水立方即将竣工，国际奥委会对新政府能否如期办好奥运心存疑虑。这是光复后的中国第一次以全新的面貌面对世界：一场盛大的开幕式，还是一切从简？"
 roc_md.3.a: "让世界看见新的中国！"
 roc_md.3.b: "一切从简。"
 roc_md.51.t: "全国人口普查"
 roc_md.51.d: "行政院主计处完成了光复后的第一次全国人口普查：中华民国的人口超过十四亿，其中近半数仍住在农村，六十五岁以上的老人已占总人口的一成以上。数据揭示了城乡差距、人口老化与性别失衡的严峻现实，政府的施政必须以此为基础。"
 roc_md.51.a: "以数字为施政的基础。"
 roc_return.171.a: "盛大阅兵！"
 roc_return.171.b: "简朴庆祝，把钱留给民生。"
 roc_return.171.t: "双十国庆"
 roc_return.171.d: "光复后的第一个双十节，南京的中山东路上旌旗招展，各地的民众涌入首都观礼。国防部提议举行盛大的阅兵，展示整编后国军的军容与新式装备；也有立委认为，大陆各省民生凋敝之际，不宜如此铺张，应把钱留给民生。"
 roc_return.172.a: "「革命尚未成功，同志仍须努力。」"
 roc_return.172.t: "中山陵谒陵"
 roc_return.172.d: "总统率五院院长登上紫金山，沿着三百九十二级台阶走到国父灵前，献花致敬。他在祭文中告慰国父：「中国统一」的遗愿终于实现，三民主义已在全中国落地生根。陵寝外，数万名民众静静地站立，许多人眼含泪水。"
 roc_return.173.a: "定都南京，回到宪法的原点。"
 roc_return.173.b: "还都北京，经营北方。"
 roc_return.173.t: "国都之争"
 roc_return.173.d: "南京是宪法上的首都，北京则是六百年的帝都与北方的政治中心。立法院为国都问题吵得不可开交：南方的代表主张回到宪法的原点，北方的代表则认为定都北京才能镇住华北与东北。媒体上的辩论持续了数月，至今没有定论。"
 roc_return.174.a: "完璧归赵，文物北返。"
 roc_return.174.b: "两岸故宫，各自典藏。"
 roc_return.174.t: "故宫文物北返"
 roc_return.174.d: "1948 年随国民政府渡海的故宫文物，是否应当运回北京紫禁城？六十多万件国宝在台北外双溪保存了七十多年，台北故宫已经成为世界级的博物馆。台北的学者与北京的文物界各执一词，两岸的民众也在网络上争论不休。"
 roc_return.175.a: "耕者有其田——土地私有化。"
 roc_return.175.b: "维持集体所有，只发承包证。"
 roc_return.175.t: "土地确权"
 roc_return.175.d: "中共时期的农村土地名义上归「集体」所有，农民只有承包经营权，地方干部常常以开发为名征地卖地。内政部提出土地确权方案：把土地所有权正式登记到农民名下。这将是继台湾「耕者有其田」之后，规模最大的一次土地改革。"
 roc_return.176.a: "快速私有化，让市场决定。"
 roc_return.176.b: "渐进改制，先安置职工。"
 roc_return.176.t: "国企私有化风潮"
 roc_return.176.d: "数以万计的国营企业等待改制。财团与台商跃跃欲试，准备以低价收购优质资产；工人们则担心饭碗不保，东北的工厂门口已经出现了静坐的下岗职工。1990 年代国企改革造成的下岗潮记忆犹新，政府必须在效率与公平之间作出选择。"
 roc_return.177.a: "成立退辅会，妥善安置。"
 roc_return.177.b: "发放遣散费了事。"
 roc_return.177.t: "退伍官兵安置"
 roc_return.177.d: "数百万前解放军官兵等待安置，他们大多来自农村，除了打仗没有其他技能。他们若找不到出路，就会成为山区残部的兵源，甚至落草为寇。1949 年后台湾的荣民安置经验告诉我们：退伍军人的出路，关系到整个社会的安定。"
 roc_return.178.a: "恢复正体字。"
 roc_return.178.b: "繁简并行，「识正书简」。"
 roc_return.178.t: "繁简字之争"
 roc_return.178.d: "教育部考虑在大陆恢复正体字教学。支持者说这是恢复中华文化的根本，让大陆的孩子能读懂古籍与先人的书信；反对者说这会让十几亿人一夜之间变成「文盲」，印刷、出版与电脑系统也都要全部更新。"
 roc_return.179.a: "全面开放新闻自由。"
 roc_return.179.b: "渐进开放，先管住出版许可。"
 roc_return.179.t: "报禁解除"
 roc_return.179.d: "新闻局宣布：大陆各省的报刊登记一律开放。一夜之间，数百种新报纸在街头出现，从严肃的政论杂志到八卦小报应有尽有，报摊前排起了长队。新闻自由带来了活力，也带来了谣言与混乱，政府必须决定开放的步伐。"
 roc_return.180.a: "平反六四，政府正式道歉。"
 roc_return.180.b: "暂不处理，以免撕裂社会。"
 roc_return.180.t: "六四平反"
 roc_return.180.d: "天安门母亲群体再次上书总统府，要求政府为 1989 年的死难者平反、公布真相、追究责任。丁子霖等人为此奔走了三十多年，许多母亲没能等到这一天。中南海档案的公开，让当年的真相第一次可能大白于天下。"
 roc_return.181.a: "保留为历史遗迹，开放参观。"
 roc_return.181.b: "拆除，遗体迁葬湖南韶山。"
 roc_return.181.t: "毛泽东纪念堂的去留"
 roc_return.181.d: "天安门广场上的毛主席纪念堂何去何从？中国共产党的支持者誓言守护，每天仍有数千人排队瞻仰遗容；许多大跃进与文革受害者的家属则要求拆除，认为它是对死难者的侮辱。政府的决定，将在两边都引起强烈的反应。"
 roc_return.182.a: "落实宪法，开放宗教自由。"
 roc_return.182.b: "有限开放，宗教团体须登记。"
 roc_return.182.t: "宗教自由"
 roc_return.182.d: "天主教的地下教会、新教的家庭教会，以及藏传佛教与伊斯兰教的信众，都在等待政府兑现宪法保障的信仰自由。数十年来，他们的教堂被拆、神职人员被捕；如今梵蒂冈也表示愿意与南京建立正式的外交关系。"
 roc_return.183.a: "黄埔复校！"
 roc_return.183.t: "黄埔军校复校"
 roc_return.183.d: "国防部提议在广州长洲岛的黄埔原址恢复陆军军官学校，让「亲爱精诚」的校训回到它的发源地。旧址上的校门、校本部与孙中山故居都保存完好，凤山的陆军官校师生期待着在一百年前的地方重新开学。"
 roc_return.184.a: "鼓励台商西进。"
 roc_return.184.b: "设限，保住台湾的产业。"
 roc_return.184.t: "台商西进"
 roc_return.184.d: "光复之后，台湾的企业家蜂拥前往大陆设厂，看中了那里的市场、土地与人力。台湾省议会担心产业空洞化，台湾的年轻人也开始到上海与深圳找工作；大陆各省则张开双臂欢迎，竞相开出优惠条件。"
 TAI_us_friendship: "盟邦之谊"
 HKG_ROC.conservatism: "£TAI_conservatism 中国国民党香港总支部"
 EA_labor_market_modifier_desc: "大量农村人口、隐性就业与户籍限制下的流动人口并未真正进入城市劳动力市场。本修正只适用于中国大陆与台湾，每周根据失业率自动校准：失业率高于§Y30%§!时，把部分剩余劳动力移出统计（目标约 28%）；低于§Y22%§!时再逐步归还。同时等比例提高自给农业吸纳的人口，使农业产出不受影响。\n当前劳动力规模修正：§Y[?EA_hidden_labor_var|%1]§!"
 TAI_sov_new_neighbours: "中俄新睦邻"
 TAI_sov_new_neighbours_desc: "新的中国政府宣布继承《中俄睦邻友好合作条约》的全部义务。南京与莫斯科都清楚：彼此是对方最长的邻居，谁也搬不走。"
 TAI_sov_border_demarcation: "边界最终勘定"
 TAI_sov_border_demarcation_desc: "中华民国政府承认 2004 年《补充协定》划定的边界，正式放弃对外东北的领土主张，换取俄方在黑瞎子岛与界河航行上的让步。"
 TAI_sov_siberian_pipeline: "西伯利亚油气管线"
 TAI_sov_siberian_pipeline_desc: "「西伯利亚力量」管线向南延伸至大庆，俄国的石油与天然气源源不断地输入东北的工业基地。对南京而言，这是摆脱海上石油通道风险的保险；对莫斯科而言，这是欧洲之外最稳定的买家。"
 TAI_sov_yuan_ruble: "元卢布结算"
 TAI_sov_yuan_ruble_desc: "两国央行签署本币互换协议，双边贸易以新法币与卢布直接结算，绕开美元。这让华盛顿有些不快，但边境上的木材商、能源公司与哈尔滨的外贸商行都省下了一大笔汇兑成本。"
 TAI_sov_far_east_development: "远东开发合作"
 TAI_sov_far_east_development_desc: "东北的资本与劳工、俄国远东的土地与资源——两国共建跨境经济合作区。黑河与布拉戈维申斯克之间的大桥终于通车，绥芬河的货栈堆满了木材与大豆，冷清多年的边城又有了人气。"
 TAI_sov_joint_exercises: "联合军演"
 TAI_sov_joint_exercises_desc: "国军与俄军在内蒙古草原举行代号「和平使命」的联合演习——这在冷战时期的任何人看来都不可思议。"
 TAI_sov_northern_sea_route: "北极航道"
 TAI_sov_northern_sea_route_desc: "中俄合作开发北方海航道，上海到鹿特丹的航程缩短了三分之一，还能绕开马六甲与苏伊士两个咽喉。国营航运公司订造了第一批破冰货轮，海军也开始研究极地航行。"
 TAI_sov_space_cooperation: "航天合作"
 TAI_sov_space_cooperation_desc: "两国共建月球科研站，联合开发重型运载火箭。俄国有半个世纪的载人航天经验，我们有资金与电子工业：拜科努尔与酒泉之间的合作，将让两国都不必孤身面对美国的航天优势。"
 TAI_sov_strategic_partnership: "全面战略协作伙伴"
 TAI_sov_strategic_partnership_desc: "「中俄关系处于历史最好时期。」——这句话，如今由一位国民党籍的总统说出口。国父曾与苏俄联合，后来的领导人又与之反目；南京这一次选择务实：在不损害主权的前提下，与北方的邻居成为全面的战略伙伴。"
 TAI_sov_aigun_revisited: "重提《瑷珲条约》"
 TAI_sov_aigun_revisited_desc: "中华民国从未承认《瑷珲条约》与《北京条约》割让的领土，中共在 2001 年签订的睦邻条约，在南京看来并无效力。立法院以压倒性多数通过决议，要求重新检讨中俄边界。莫斯科的回应异常冷淡。"
 TAI_sov_outer_manchuria_claim: "宣称外东北"
 TAI_sov_outer_manchuria_claim_desc: "海参崴本名崴子，伯力、海兰泡都曾是中国的土地，江东六十四屯的血案至今仍写在课本里。教科书里的秋海棠叶，要补回被咬掉的那一角：政府正式宣布，外东北是中华民国固有的疆域。"
 TAI_sov_tannu_uriankhai: "宣称唐努乌梁海"
 TAI_sov_tannu_uriankhai_desc: "唐努乌梁海在 1944 年被苏联并吞，中华民国政府从未承认，它在民国的地图上一直被画在国界之内。如今南京重申这一立场：图瓦的归属，必须在两国的谈判桌上重新讨论。"
 TAI_sov_northern_buildup: "北疆整军"
 TAI_sov_northern_buildup_desc: "国军在黑龙江、吉林增设军区，修建通往边境的战备公路，把一批兵工厂迁往哈尔滨与长春。北疆的冬天长达半年，部队必须学会在零下三十度作战，后勤也要能撑过整个冬季。"
 TAI_sov_recover_lost_lands: "收复失地"
 TAI_sov_recover_lost_lands_desc: "一百五十年的屈辱，要在我们这一代人手里了结。外交途径已经用尽，莫斯科不愿意谈。国军的装甲部队已在边境集结，只等南京的一声令下。这将是一场豪赌，赢了，秋海棠就能恢复原貌。"
 TAI_sov_partner: "中俄新睦邻"
 TAI_sov_strategic: "全面战略协作"
 TAI_sov_revanchism: "中华民国的领土要求"
 TAI_joint_sov_root_tt: "光复后：中华民国已完成国策「新中国外交」，且与俄罗斯不在战争中"
 TAI_joint_roc_or_sov_tt: "由中华民国或俄罗斯发起（双方同步完成）"
 TAI_sov_space_tt: "中俄航天合作"
 TAI_fr_xj_fund: "南疆开发基金"
 TAI_fr_xj_fund_desc: "在喀什、和田设立开发区，修建水利与公路，让南疆的农民分享光复后的经济成长。\n\n§Y新疆§!一体化进度：§G[?TAI_fr_xj|0]§!/100（本决议 §G+6§!）"
 TAI_fr_xj_talks: "维吾尔自治协商会议"
 TAI_fr_xj_talks_desc: "邀请维吾尔族的宗教领袖、知识分子与海外团体回国协商《新疆自治法》。\n\n§Y新疆§!一体化进度：§G[?TAI_fr_xj|0]§!/100（本决议 §G+8§!）"
 TAI_fr_xj_corps: "兵团改制"
 TAI_fr_xj_corps_desc: "新疆生产建设兵团去军事化，改制为地方国营企业，兵团土地逐步归还当地农牧民。\n\n§Y新疆§!一体化进度：§G[?TAI_fr_xj|0]§!/100（本决议 §G+5§!）"
 TAI_fr_tb_dialogue: "与达赖喇嘛对话"
 TAI_fr_tb_dialogue_desc: "总统府派出特使赴达兰萨拉，商谈达赖喇嘛返回拉萨的条件与「高度自治」的具体安排。\n\n§Y西藏§!一体化进度：§G[?TAI_fr_tb|0]§!/100（本决议 §G+10§!）"
 TAI_fr_tb_religion: "藏区宗教自由"
 TAI_fr_tb_religion_desc: "废除中共时期对寺院的「爱国主义教育」与僧尼人数限制，恢复寺院的自主管理。\n\n§Y西藏§!一体化进度：§G[?TAI_fr_tb|0]§!/100（本决议 §G+6§!）"
 TAI_fr_tb_railway: "青藏建设"
 TAI_fr_tb_railway_desc: "续建青藏铁路与川藏公路，同时设立藏区生态保护基金。\n\n§Y西藏§!一体化进度：§G[?TAI_fr_tb|0]§!/100（本决议 §G+5§!）"
 TAI_fr_im_league: "恢复盟旗制度"
 TAI_fr_im_league_desc: "在保留省县的同时恢复蒙古族的盟旗自治，由各旗推选札萨克参与地方议会。\n\n§Y内蒙古§!一体化进度：§G[?TAI_fr_im|0]§!/100（本决议 §G+8§!）"
 TAI_fr_im_grassland: "草原生态补偿"
 TAI_fr_im_grassland_desc: "对退牧还草的牧民发放补偿金，遏止草原沙化。\n\n§Y内蒙古§!一体化进度：§G[?TAI_fr_im|0]§!/100（本决议 §G+6§!）"
 TAI_fr_im_hulunbuir: "呼伦贝尔开发"
 TAI_fr_im_hulunbuir_desc: "开发满洲里与呼伦贝尔的口岸与矿区，吸引蒙古族青年就业。\n\n§Y内蒙古§!一体化进度：§G[?TAI_fr_im|0]§!/100（本决议 §G+5§!）"
 TAI_fr_xj_add_tt: "§Y新疆§!一体化进度 §G+[?fr_d|0]§!（当前 [?TAI_fr_xj|0]/100）"
 TAI_fr_tb_add_tt: "§Y西藏§!一体化进度 §G+[?fr_d|0]§!（当前 [?TAI_fr_tb|0]/100）"
 TAI_fr_im_add_tt: "§Y内蒙古§!一体化进度 §G+[?fr_d|0]§!（当前 [?TAI_fr_im|0]/100）"
 roc_return.161.t: "新疆一体化"
 roc_return.161.d: "《新疆自治法》实施满一年，维吾尔、哈萨克与汉族代表共同组成的自治区议会顺利运作，清真寺重新开放，再教育营已全部关闭。喀什的巴扎重新热闹起来，天山南北终于迎来了久违的平静。"
 roc_return.161.a: "五族共和，天下为公。"
 roc_return.164.t: "南疆的骚乱"
 roc_return.164.d: "喀什的一场清真寺修缮纠纷演变成街头冲突，愤怒的人群高喊口号，要求「真正的自治」，并冲击了当地的警察局。中共时期的伤痕仍未愈合，许多维吾尔人对任何来自北京或南京的政府都心存戒心。政府必须谨慎应对。"
 roc_return.164.a: "派警察恢复秩序。"
 roc_return.164.b: "派协商代表团前往喀什。"
 roc_return.162.t: "雪域和解"
 roc_return.162.d: "达赖喇嘛在布达拉宫主持了回归后的第一场法会，数十万藏人从各地赶来朝拜。西藏高度自治的各项安排已经落实：寺院自主管理、藏语教育恢复、流亡藏人陆续返乡。雪域高原成为中华民国不可分割、也心悦诚服的一部分。"
 roc_return.162.a: "五族共和，天下为公。"
 roc_return.165.t: "拉萨的抗议"
 roc_return.165.d: "数百名僧侣在大昭寺前静坐，要求政府兑现对达赖喇嘛的承诺：加快自治的协商、释放仍被关押的僧尼。游客与警察围在广场四周，藏区各地的寺院正密切注视着南京的反应。处理不当，就可能重演 2008 年的悲剧。"
 roc_return.165.a: "依法驱散，维持秩序。"
 roc_return.165.b: "接见请愿代表，承诺加快协商。"
 roc_return.163.t: "草原新生"
 roc_return.163.d: "盟旗自治与省县制度并行运作，过度放牧与开矿造成的沙化逐步得到遏制，草原生态开始恢复。蒙古语学校重新开学，那达慕大会上赛马与摔跤的欢呼声此起彼伏；内蒙古的蒙古族与汉族同胞，共同建设着这片辽阔的北疆。"
 roc_return.163.a: "五族共和，天下为公。"
 roc_return.166.t: "草原上的抗议"
 roc_return.166.d: "一位牧民在阻止矿场卡车碾压草场时被撞身亡，影片在网络上迅速流传。锡林郭勒的蒙古族学生走上街头，要求严惩肇事者、关闭污染草原的矿场。2011 年的类似事件曾引发大规模抗议，政府必须决定如何回应。"
 roc_return.166.a: "戒严，严惩滋事者。"
 roc_return.166.b: "停工调查，赔偿牧民。"
 TAI_frontier_category: "五族共和 · 边疆一体化"
 TAI_frontier_category_desc: "「五族共和」是中华民国立国的原则。新疆、西藏与内蒙古在中共治下积怨已深，必须以自治、发展与宗教自由争取各族同胞。\n\n各地一体化进度：\n - §Y新疆§!：§G[?TAI_fr_xj|0]§!/100\n - §Y西藏§!：§G[?TAI_fr_tb|0]§!/100\n - §Y内蒙古§!：§G[?TAI_fr_im|0]§!/100\n\n§L进度越低，当地的驻军需求、抵抗与工厂损失越高；稳定度高于 50% 时每月自然 +0.3，满 100 时完成一体化。§!"
 TAI_frontier_xj_modifier: "新疆：一体化未竟"
 TAI_frontier_xj_modifier_desc: "新疆的一体化工作尚未完成：维吾尔族与哈萨克族对新政府仍有戒心，驻军需求、抵抗与服从度都受到影响。可通过「五族共和 · 边疆一体化」决议、相关国策与事件推进一体化，完成后此修正消失。"
 TAI_frontier_tb_modifier: "西藏：一体化未竟"
 TAI_frontier_tb_modifier_desc: "西藏的一体化工作尚未完成：藏人在等待自治承诺的兑现，寺院与民众对新政府仍在观望，驻军需求、抵抗与服从度都受到影响。可通过「五族共和 · 边疆一体化」决议、相关国策与事件推进一体化，完成后此修正消失。"
 TAI_frontier_im_modifier: "内蒙古：一体化未竟"
 TAI_frontier_im_modifier_desc: "内蒙古的一体化工作尚未完成：草原的生态与蒙古族的文化权利仍是敏感的议题，驻军需求、抵抗与服从度都受到影响。可通过「五族共和 · 边疆一体化」决议、相关国策与事件推进一体化，完成后此修正消失。"
 ### v3.20 韩国、菲律宾与越南的国策
 TAI_ext_kor_nuclear_alarm: "韩国核武装的疑虑"
 TAI_ext_kor_roc_ties: "韩国与中华民国的友好关系"
 TAI_ext_kor_thaad: "萨德部署的不满"
 TAI_ext_kor_umbrella: "核共享的盟友"
 KORX_demographic_policy: "人口对策"
 KORX_demographic_policy_desc: "人口对策委员会协调了生育补贴、公共托育与住房供给，生育率的下滑开始放缓。"
 KORX_independent_deterrent_idea: "自主核威慑"
 KORX_independent_deterrent_idea_desc: "韩国宣布退出《不扩散条约》并发展自主核威慑，国民士气高涨，却承受着巨大的国际压力。"
 KORX_nuclear_sharing_idea: "核共享"
 KORX_nuclear_sharing_idea_desc: "美国在韩国部署战术核武器，韩美共同规划核作战，联合防卫体系更加紧密。"
 KORX_k_defense_idea: "K-国防出口体系"
 KORX_k_defense_idea_desc: "从 K9 自走炮到 FA-50 轻型战机，韩国国防出口形成了稳定的订单与产业链。国防工业的规模经济让本国军队的装备也更便宜、交货更快，出口收入则带动了研发与税收。"
 KORX_new_republic_idea: "第七共和国"
 KORX_new_republic_idea_desc: "新宪法确立了权力制衡与总统任期的新规则，政治体制进入新的阶段。「帝王式总统」成为历史，国会与地方政府拥有更多的权力；政局更加稳定，施政也更有效率。"
 KORX_green_shipbuilding_idea: "绿色造船"
 KORX_green_shipbuilding_idea_desc: "LNG 船、氨动力船与智能船舶订单让韩国船厂接单到数年之后。巨济与蔚山的船坞全速运转，高附加值的船舶为国家带来了可观的外汇与税收。"
 KORX_hallyu_idea: "韩流文化立国"
 KORX_hallyu_idea_desc: "韩流内容与旅游业成为国家新的增长点，软实力带来了贸易与观光收入。"
 KORX_tb_latency: "核燃料循环技术"
