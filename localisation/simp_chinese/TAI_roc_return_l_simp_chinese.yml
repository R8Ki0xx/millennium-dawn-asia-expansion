 TAI_dec_hkg_integrate: "香港：逐步整合"
 TAI_dec_mac_integrate: "澳门：逐步整合"
 TAI_dec_hkg_reclaim: "香港：直接收回"
 TAI_dec_mac_reclaim: "澳门：直接收回"
 TAI_dec_hkg_sovereignty_desc: "要求香港承认中华民国为宗主国，成为中华民国的特别行政区。"
 TAI_dec_mac_sovereignty_desc: "要求澳门承认中华民国为宗主国，成为中华民国的特别行政区。"
 TAI_dec_hkg_autonomy_desc: "保留香港的自由港、普通法与独立关税区地位，由国民党香港总支部主政。"
 TAI_dec_mac_autonomy_desc: "保留澳门的博彩业与自由经济，澳门继续高度自治。澳门的博彩税收与旅游收入将源源不断地流入国库，澳门市民也对新政府抱有好感，这是一个双赢的选择。"
 TAI_dec_hkg_integrate_desc: "用一年时间统一法律、货币与行政体系，期满后香港并入中华民国本土。"
 TAI_dec_mac_integrate_desc: "用一年时间统一法律、货币与行政体系，期满后澳门并入中华民国本土。"
 TAI_dec_hkg_reclaim_desc: "立即撤销特区地位、直接收回香港。这样做能一劳永逸地解决香港问题，但也违背了对港人的承诺；英美两国必定强烈抗议，国际资本也可能因此撤离香港。"
 TAI_dec_mac_reclaim_desc: "立即撤销特区地位、直接收回澳门。澳门的规模远小于香港，直接收回的阻力也较小；但英美两国必定强烈抗议，葡萄牙也会对此表示遗憾。"
 TAI_nato_standards_idea: "北约标准化"
 TAI_nato_standards_idea_desc: "国军已全面采用北约标准。弹药口径、通信协定与作战准则与盟军统一，训练时间缩短，部队的组织与经验积累也更加高效；国军随时可以与盟军并肩作战。"
 TAI_alliance_leader_idea: "同盟盟主"
 TAI_alliance_leader_idea_desc: "中华民国领导着亚太民主同盟。作为同盟的盟主，南京在区域事务中拥有最大的话语权，成员国之间的贸易优惠也让中国的经济受益良多。"
 TAI_asian_order_idea: "亚洲新秩序"
 TAI_asian_order_idea_desc: "以南京为中心的亚洲新秩序已经形成。亚洲各国在安全、经济与科技上紧密合作，区域的和平与繁荣有了制度的保障；中国的政治威望与科研实力都达到了新的高度。"
 TAI_hkg_sar_dividend_idea: "香港特区红利"
 TAI_hkg_sar_dividend_idea_desc: "香港的金融与贸易为国家带来丰厚收益。香港的资本市场为大陆的建设募集资金，香港的转口贸易让中国的产品行销全世界，特区的繁荣也提升了政府的威信。"
 TAI_mac_sar_dividend_idea: "澳门特区红利"
 TAI_mac_sar_dividend_idea_desc: "澳门的博彩税收充实国库。澳门每年的博彩收入超过拉斯维加斯，特区政府上缴的税款与盈余为中央提供了一笔稳定的收入，也提升了政府的威信。"
 TAI_hkg_roc_sar_idea: "中华民国香港特别行政区"
 TAI_hkg_roc_sar_idea_desc: "香港实行高度自治，由国民党香港总支部主政。普通法、自由港与独立的司法得以保留，市民对新政权的信任逐步建立；特区的稳定让中央可以专心处理大陆的事务。"
 TAI_mac_roc_sar_idea: "中华民国澳门特别行政区"
 TAI_mac_roc_sar_idea_desc: "澳门实行高度自治。博彩业与自由经济得以保留，葡萄牙的法律传统与中华文化在这座小城和谐共存；特区的稳定与繁荣为澳门带来了可观的税收。"
 TAI_sar_integration_idea: "整合阵痛"
 TAI_sar_integration_idea_desc: "法律、货币与行政体系的整合引发社会不安。直接收回之后，普通法被废止、港币与国币合并、公务员体系重组，许多市民与企业对未来感到忧虑；资金外流与移民潮再度出现。"
 TAI_sar_crackdown: "强行收回特区"
 roc_return.95.t: "亚太民主同盟的邀请"
 roc_return.95.d: "中华民国政府正式邀请我国加入由南京领导的亚太民主同盟。南京承诺共同防卫、贸易优惠与科技合作，并保证尊重各成员国的主权与内政。加入同盟能带来安全与繁荣，但也意味着与这个新兴大国绑在一起，失去一部分外交上的回旋余地。"
 roc_return.95.a: "我们愿意加入。"
 roc_return.95.b: "我们将保持中立。"
 roc_return.96.t: "共同加入北约"
 roc_return.96.d: "已加入北约的中华民国邀请我国一同成为北大西洋公约组织的成员，共同建立亚太地区的集体防卫。北约第五条的保护将延伸到西太平洋，但加入同盟也意味着承担共同防卫的义务；北京与莫斯科对此表示强烈不满。"
 roc_return.96.a: "加入北约。"
 roc_return.96.b: "暂不考虑。"
 roc_return.97.t: "南京的要求"
 roc_return.97.d: "中华民国政府要求[Root.GetName]承认其为宗主国，成为中华民国的特别行政区，并承诺维持现有的社会制度与生活方式：法律、货币与自由经济都将保留，高度自治没有期限。接受，可以避免冲突；拒绝，则可能面对南京的强硬回应。"
 roc_return.97.a: "接受中华民国的主权。"
 roc_return.97.b: "拒绝。"
 roc_return.98.t: "[From.GetName]拒绝了我们的要求"
 roc_return.98.d: "[From.GetName]拒绝承认中华民国的主权，坚持维持现有的地位。当地的政治人物宣称，他们不愿意从一个政权的统治下转到另一个政权。我们可以暂时搁置这个问题，等待时机；也可以诉诸武力，但国际社会的反应将十分强烈。"
 roc_return.98.a: "暂时搁置。"
 roc_return.98.b: "不惜一战。"
 HKG_ROC.conservatism_desc: "保守主义 - 中国国民党香港总支部\n\n光复后由南京直接领导的国民党在港组织，主张「一国两制、三民主义」，以维护香港的繁荣稳定与自由经济为己任。"
 TAI_bloc_question: "阵营抉择"
 TAI_bloc_question_desc: "光复后的中华民国已是举足轻重的大国。我们是与西方民主国家并肩、加入北大西洋公约组织，还是由南京领导一个属于亚洲的阵营？"
 TAI_west_alignment: "与西方同行"
 TAI_west_alignment_desc: "自由民主是中华民国的立国之本。我们将与美国、欧洲和日本站在同一阵线，共同维护以规则为基础的国际秩序。冷战时期的反共盟友，如今以民主大国的身份重返西方阵营，这是二十一世纪最重大的阵营转换。"
 TAI_nato_partnership: "北约伙伴关系"
 TAI_nato_partnership_desc: "在正式入约之前，先以「主要非北约盟友」身份参与北约的科技与情报合作。日本、韩国与澳大利亚都拥有这一身份；国军军官开始参加北约的联合演习与参谋课程，两岸的武器体系也开始向北约标准靠拢。"
 TAI_nato_standards: "北约标准化"
 TAI_nato_standards_desc: "按照北约标准重编部队、统一弹药口径与通信协定，国军将能与盟军无缝协同作战。接收自解放军的俄式与国产装备逐步淘汰，五点五六与七点六二毫米北约弹取代旧口径；这是一场耗资巨大但不可避免的转型。"
 TAI_join_nato: "和北约同行"
 TAI_join_nato_desc: "中华民国正式成为北大西洋公约组织的一员。从此，南京与华盛顿、伦敦、巴黎共同承担集体防卫的义务。"
 TAI_asia_pacific_nato: "亚太北约"
 TAI_asia_pacific_nato_desc: "北约的集体防卫不应止步于大西洋。中华民国将邀请日本、韩国与菲律宾一同加入，把北约的第五条延伸到西太平洋；这是对俄罗斯与朝鲜最有力的威慑，也让华盛顿在亚洲有了最强大的伙伴。"
 TAI_asian_concert: "亚洲协和"
 TAI_asian_concert_desc: "亚洲的事务应由亚洲人自己决定。中华民国将以经济与外交影响力团结周边国家：韩国、蒙古、越南与东南亚各国。这不是重建朝贡体系，而是十九世纪欧洲协调的亚洲版本，大国与小国在平等的基础上协商区域事务。"
 TAI_found_alliance: "创建亚太民主同盟"
 TAI_found_alliance_desc: "以南京为核心，成立一个保障亚太地区和平、民主与繁荣的同盟。同盟的总部设在南京，成员国承诺集体防卫、民主制度与自由贸易；它既不依附美国，也不敌视美国，而是亚洲人自己的安全架构。"
 TAI_invite_neighbors: "邀请邻国入盟"
 TAI_invite_neighbors_desc: "向韩国、新加坡、菲律宾、蒙古与越南发出正式邀请。每个国家都有自己的顾虑：首尔担心与美国的同盟，河内担心与北京的旧怨，乌兰巴托担心被吞并。外交部长们在各国首都之间穿梭，逐一化解疑虑。"
 TAI_alliance_army: "同盟联军"
 TAI_alliance_army_desc: "同盟成员定期举行联合演习，建立统一的指挥体系与情报共享网络。在南海、黄海与东海举行的年度联合演习，让各国军队熟悉彼此的装备与战术；同盟联军司令部设在南京，由各国轮流派出司令官。"
 TAI_asian_order: "亚洲新秩序"
 TAI_asian_order_desc: "亚太民主同盟已成为与北约、上合并立的世界一极。从首尔到雅加达，同盟成员的经济总量占世界的三分之一；亚洲第一次拥有了自己的集体安全组织，不必再仰仗任何域外大国的保护。"
 ### v3.10 国民大会与派系平衡
 TAI_roc_faction_balance: "派系平衡"
 TAI_roc_old_guard: "台湾旧部"
 TAI_roc_newcomers: "大陆新进"
 TAI_roc_old_guard_desc: "随政府从台湾来的国民党老班底、军方将领与技术官僚。他们掌握党务、军队与财经要害。"
 TAI_roc_newcomers_desc: "光复后吸纳的大陆地方人士、起义将领与新入党的知识分子。他们熟悉地方，却与南京若即若离。"
 TAI_roc_bop_shared_rule: "派系共治"
 TAI_roc_bop_old_guard_rule: "旧部主政"
 TAI_roc_bop_taipei_clique: "台北帮专权"
 TAI_roc_bop_mainland_rise: "大陆人士崛起"
 TAI_roc_bop_local_strongmen: "地方派系坐大"
 TAI_roc_bop_category: "派系平衡"
 TAI_roc_bop_category_desc: "台湾旧部与大陆新进之间的权力平衡，决定了政府施政的风格与地方的服从。"
 TAI_dec_bop_promote_old_guard: "提拔台籍旧部"
 TAI_dec_bop_promote_old_guard_desc: "让跟随政府多年的老干部出任要职。这些从台湾来的老部下忠诚可靠、熟悉政府的运作，但大陆的新人会觉得自己被排挤在权力之外；老派的势力也会因此更加强大。"
 TAI_dec_bop_recruit_mainlanders: "延揽大陆贤达"
 TAI_dec_bop_recruit_mainlanders_desc: "吸纳大陆各省有声望的地方人士入阁入党：大学校长、企业家、地方名流与开明的前中共官员。他们能让大陆民众对新政府产生认同，削弱游击队的号召力。"
 TAI_dec_bop_mediation: "派系协调会议"
 TAI_dec_bop_mediation_desc: "召集两派大老，在总统府协调人事与资源分配。台籍旧部与大陆新人的矛盾若不及时处理，就会演变为公开的派系斗争；总统亲自出面，让双方各退一步。"
 roc_return.120.t: "台北帮专权"
 roc_return.120.d: "党政军要职几乎全被台湾来的旧部把持，大陆各省人士怨声载道，「新的接收大员」的讽刺不胫而走。网络上流传着一张名单：各部会首长与省主席中，大陆出身的人寥寥无几。大陆籍的立委在国会里拍桌抗议，要求政府分享权力。"
 roc_return.120.a: "稳定压倒一切。"
 roc_return.120.b: "必须让大陆人士分享权力。"
 roc_return.121.t: "地方派系坐大"
 roc_return.121.d: "各省的地方实力派借着中央倚重，自行任命官员、截留税收，有的甚至建立了自己的武装。南京的政令开始出不了省界，历史上的军阀割据似乎又在重演。中央必须决定：暂时默许以换取稳定，还是调派旧部收拾局面。"
 roc_return.121.a: "暂时默许。"
 roc_return.121.b: "调派旧部收拾局面。"
 TAI_na_session_mission_desc: "国民大会每年召开一次常会。倒计时结束时自动开会：听取施政报告、审议议案；每届第六次常会后改选国大代表。"
 TAI_dec_na_extraordinary: "召开临时会议"
 TAI_dec_na_extraordinary_desc: "提前召集国民大会临时会议，立即审议施政报告与议案（本年度常会倒计时重新开始）。"
 TAI_na_extraordinary_tt: "立即召开一次国民大会会议：施政报告表决，并审议两项议案。常会倒计时重新开始。"
 TAI_dec_na_campaign: "全力助选"
 TAI_dec_na_campaign_desc: "国大代表改选在即，执政党全力投入选战：党主席走遍各省助选，党部动员基层组织，媒体广告铺天盖地。这场选举将决定执政党能否在国民大会中保住多数。"
 TAI_dec_na_ally_kmt: "与国民党组成执政联盟"
 TAI_dec_na_ally_kmt_desc: "国民党团加入执政联盟，要求维持政局稳定。国民党在国民大会中拥有可观的席次，它的加入能让执政联盟在关键表决中稳操胜券；作为交换，国民党要求在内阁与人事上获得相应的安排。"
 TAI_dec_na_ally_pfp: "与亲民党组成执政联盟"
 TAI_dec_na_ally_pfp_desc: "亲民党团加入执政联盟。亲民党由宋楚瑜创立，在部分省份拥有稳固的地方基础；它的席次虽然不多，却常常是关键表决中举足轻重的少数。"
 TAI_dec_na_break_alliances: "解散执政联盟"
 TAI_dec_na_break_alliances_desc: "结束与其他党团的合作，由执政党单独执政。这样做可以摆脱盟友的掣肘，但也意味着在国民大会的关键表决中失去稳定的多数，政局将因此一度动荡。"
 TAI_na_largest_party_tt: "国民大会中§Y席次最多的政党§!组成新政府。"
 TAI_na_mark_none: ""
 TAI_na_president_direct: "总统选举：§Y由全体国民直接选举§!（已完成修宪）"
 TAI_na_president_indirect: "总统选举：§Y由国民大会选举§!（每届第一次常会）"
