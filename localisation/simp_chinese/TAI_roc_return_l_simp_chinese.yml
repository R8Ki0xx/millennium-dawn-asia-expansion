 SYR_pc_quota_on: "农工配额：宪法规定农民与工人至少占一半席位（现有 §Y[?SYR_pc_wp|0]§! 席）· 15 个省级选区"
 SYR_pc_quota_gone: "农工配额：2012 年新宪法已废除 · 15 个省级选区"
 SYR_pc_gui_term_info: "刻度灯：§R1/3§! 阻挡线 · §Y1/2§! 过半数 · §G2/3§! 修宪门槛"
