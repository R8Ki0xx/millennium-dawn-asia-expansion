 TAI_hk_macau_category: "港澳问题"
 TAI_hk_macau_category_desc: "香港与澳门在中共治下实行「一国两制」。光复之后，我们将决定这两颗东方明珠的前途：维持高度自治、逐步整合，或是直接收回。"
 TAI_dec_hkg_sovereignty: "接管香港宗主权"
 TAI_dec_mac_sovereignty: "接管澳门宗主权"
 TAI_dec_hkg_autonomy: "香港：维持高度自治"
