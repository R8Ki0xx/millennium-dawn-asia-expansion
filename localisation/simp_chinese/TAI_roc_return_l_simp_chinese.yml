 ### v3.15 五院政府、中共改革派与图标
 ROC_ldr_wang_yang: "汪洋"
 ROC_ldr_chen_liangyu: "陈良宇"
 ROC_ldr_hu_jintao: "胡锦涛"
 TAI_integrate_ccp_reformers_tt: "§Y汪洋§!、§Y陈良宇§!加入§Y中国国民党§!，§Y胡锦涛§!加入§Y民革§!：\n他们成为各自政党的领导人候选人，也进入五院的行政院长人选名单。"
 roc_return.150.t: "中共改革派的归来"
 roc_return.150.d: "南京，总统府。三位昔日的中共高官在记者面前与中华民国总统握手。汪洋与陈良宇宣布加入中国国民党，胡锦涛则接受民革的邀请，出任中央常务委员。\n\n「这不是投降，」汪洋对记者说，「这是让中国走上正轨。」中共残余的电台则斥之为「叛徒」。"
 roc_return.150.a: "天下为公，和平统一。"
