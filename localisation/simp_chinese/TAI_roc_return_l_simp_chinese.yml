 TAI_semiconductor_fund_idea: "国家半导体基金"
 TAI_semiconductor_fund_idea_desc: "国家半导体基金长期投资晶圆、设备与材料。基金以耐心资本支持那些需要十年以上才能回收的项目，让国内的半导体设备与材料厂商逐步成长；中国的芯片产业不再受制于人。"
 TAI_internet_economy_idea: "互联网经济"
 TAI_internet_economy_idea_desc: "自由竞争的互联网产业成为经济增长的新引擎。电子商务、移动支付与云端服务改变了每一个人的生活，新的创业公司如雨后春笋般出现；数字经济带动了建设与研发的加速。"
 TAI_digital_fabi_idea: "数字国币"
 TAI_digital_fabi_idea_desc: "数字国币让税收与支付更透明、更有效率。电子化的支付减少了逃漏税与现金交易的成本，央行也能更精准地执行货币政策；同时，严格的隐私保护让民众放心使用。"
 TAI_financial_center_idea: "中华证券交易所"
 TAI_financial_center_idea_desc: "上海与台北合并的证券交易所是亚洲最大的资本市场。企业在这里募集资金、投资者在这里买卖股票，资本市场的繁荣为国家带来了丰厚的税收与经济的稳定。"
 TAI_energy_independence_idea: "能源自主"
 TAI_energy_independence_idea_desc: "国造核电与多元能源保障了工业的运转。核电、风光与进口能源互为备援，即使国际油价暴涨或航道被封锁，工厂也能维持生产；稳定的电力让工业效率持续提升。"
 TAI_rare_earth_idea: "稀土战略"
 TAI_rare_earth_idea_desc: "掌握稀土就掌握了高科技产业的命脉。整合后的稀土产业以总量控制与环保标准管理开采，资源的产出更加稳定；电动车、风机与战机所需的稀土永磁，全部能在国内生产。"
 TAI_auto_industry_idea: "汽车工业"
 TAI_auto_industry_idea_desc: "民营车企的崛起带动了整个制造业。汽车产业链上的钢铁、玻璃、电子与电池厂商随之扩张，工业区的建设速度加快；国产汽车的普及也让民众的生活更加便利。"
 TAI_grain_security_idea: "粮食安全"
 TAI_grain_security_idea_desc: "国家种子库与高产水稻让十四亿人不再挨饿。粮食储备充足、育种技术自主，中国不再担心国际粮价的波动与外国的禁运；吃饱饭的人民，是国家稳定最坚实的基础。"
 TAI_economic_zones_idea: "第二代经济特区"
 TAI_economic_zones_idea_desc: "内陆的经济特区复制了沿海的成功经验。成都、重庆、西安与郑州的工业区吸引了大批外资与沿海的产业转移，内陆城市的建设速度追上了沿海；贸易伙伴也看到了中国内陆的潜力。"
 TAI_space_power_idea: "航天强国"
 TAI_space_power_idea_desc: "中华民国的太空站在轨道上运行。航天员在太空中进行科学实验，卫星为通信、导航与气象提供服务；航天的成就带动了尖端科技的研发，也让民众对国家充满自豪。"
 TAI_new_army_idea: "新式国军"
 TAI_new_army_idea_desc: "完成换装的国军是亚洲最强大的陆军之一。统一的国造装备、数字化的指挥系统与职业化的士兵，让国军的组织、攻击与防御能力都大幅提升。"
 TAI_two_ocean_navy_idea: "两洋舰队"
 TAI_two_ocean_navy_idea_desc: "中华民国海军同时活跃于太平洋与印度洋。远洋舰队的作战半径延伸到波斯湾与非洲之角，舰艇的火力与造船厂的产能都达到了世界一流的水平。"
 TAI_air_power_idea: "战区空军"
 TAI_air_power_idea_desc: "各战区的空军指挥部统一指挥航空兵力。战机、预警机与无人机在同一张作战图上协同，空中优势与对地支援的效率大幅提升，飞行员的经验也在一次次的任务中快速累积。"
 TAI_tibet_autonomy_idea: "西藏自治"
 TAI_tibet_autonomy_idea_desc: "达赖喇嘛回到了拉萨，西藏在中华民国宪法下高度自治。寺院自主管理、藏语教育恢复，藏人的宗教与文化得到尊重；西藏问题不再是国际社会批评中国的焦点。"
 TAI_plateau_fund_idea: "高原发展基金"
 TAI_plateau_fund_idea_desc: "专门的基金推动青藏高原的建设。公路、铁路与机场深入高原的每一个角落，学校与医院也建到了牧区；高原的交通与基础设施建设速度大幅提升。"
 TAI_xinjiang_harmony_idea: "新疆双语教育"
 TAI_xinjiang_harmony_idea_desc: "维吾尔语与国语并重，新疆各族和睦相处。双语教育让维吾尔族的孩子既能保留自己的语言与文化，也能在全国的市场上找到工作；民族之间的隔阂逐渐消融。"
 TAI_greater_bay_idea: "粤港澳大湾区"
 TAI_greater_bay_idea_desc: "香港、澳门与广东九市共同组成世界级的湾区经济。香港的金融、深圳的科技与广州的制造互补，湾区的经济规模与东京湾区、纽约湾区并驾齐驱，带来了丰厚的税收。"
 TAI_five_races_unity_idea: "五族共荣"
 TAI_five_races_unity_idea_desc: "各民族在中华民国之下共享繁荣。边疆的经济追上了内地，少数民族的权利得到保障，各族人民对国家的认同空前团结；这是五族共和理想最完整的实现。"
 landmark_nanjing_presidential_palace: "南京总统府"
 landmark_nanjing_presidential_palace_desc: "南京总统府历经两江总督署、太平天国天王府，一九一二年孙中山先生在此就任临时大总统。此后这里是国民政府与中华民国总统府的所在地。"
 landmark_nanjing_presidential_palace_plural: "南京总统府"
 landmark_nanjing_presidential_palace_prc: "南京总统府"
 landmark_nanjing_presidential_palace_prc_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_prc_plural: "南京总统府"
 landmark_nanjing_presidential_palace_gen: "南京总统府"
 landmark_nanjing_presidential_palace_gen_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_gen_plural: "南京总统府"
 roc_return.140.t: "总统府重升青天白日旗"
 roc_return.140.d: "五十多年后，青天白日满地红旗再次在南京长江路二九二号的门楼上升起。仪仗队行礼之后，中华民国总统步入总统府，在当年孙中山先生就任临时大总统的大堂里宣读文告：「中华民国回来了。」"
 roc_return.140.a: "还我河山。"
 roc_return.140.b: "中国的历史翻开了新的一页。"
 TAI_tsmc_nanjing: "台积电南京厂"
 TAI_tsmc_nanjing_desc: "台积电在南京浦口设立十二吋晶圆厂，半导体产业正式「西进」。过去台湾政府严格限制先进制程赴大陆投资，「护国神山」必须留在岛上；统一之后，这道限制不复存在，台积电开始在大陆大规模扩产。"
 TAI_smic_tsmc_merger: "中芯与台积电合流"
 TAI_smic_tsmc_merger_desc: "中芯国际由台积电接手整编，两岸的晶圆代工合而为一。中芯的创办人张汝京本是台湾出身的工程师，台积电与中芯曾因商业机密打过多年官司；如今两家公司的工程师坐在同一间无尘室里，技术与人才完全打通。"
 TAI_zhangjiang_hsinchu: "张江—新竹双核心"
 TAI_zhangjiang_hsinchu_desc: "上海张江与新竹科学园区结为双核心，人才与资本自由往来。新竹有晶圆制造与 IC 设计的完整生态，张江有庞大的市场与工程师队伍；两地之间开通每小时一班的直达航班，工程师早上在新竹开会、下午就能到张江上班。"
 TAI_semiconductor_fund: "国家半导体基金"
 TAI_semiconductor_fund_desc: "由国库与民间共同出资的国家半导体基金，长期投资晶圆、设备与材料。中共时代的「大基金」曾因贪腐丑闻导致多位高管落马，新基金由专业经理人管理、接受国会监督，投资不再看关系而是看技术。"
 TAI_mainland_ic_design: "IC 设计产业"
 TAI_mainland_ic_design_desc: "扶持无晶圆厂的芯片设计公司，从手机处理器到服务器芯片全面布局。联发科、瑞昱与海思的设计团队互相交流，大陆的高校每年培养数万名芯片工程师；中国的 IC 设计产业规模仅次于美国。"
 TAI_advanced_nodes: "先进制程"
 TAI_advanced_nodes_desc: "七纳米、五纳米、三纳米……摩尔定律的下一站，由中国人来定义。台积电的先进制程技术与大陆的庞大产能结合，二纳米与埃米级制程的研发在新竹与南京同步进行；全世界最先进的芯片，都出自中国的工厂。"
 TAI_domestic_lithography: "光刻自主"
 TAI_domestic_lithography_desc: "集合中科院与工研院的力量，打破极紫外光刻机的垄断。荷兰 ASML 是世界上唯一能生产 EUV 光刻机的公司，过去因美国的出口管制拒绝向中国出售；统一后的中国虽然解除了禁令，仍决心掌握这项最关键的技术。"
 TAI_memory_independence: "存储芯片自主"
 TAI_memory_independence_desc: "记忆体芯片全面国产，不再受制于人。长江存储的 3D NAND 与长鑫存储的 DRAM，加上台湾南亚科与华邦电的技术，中国的存储芯片产能足以挑战三星与 SK 海力士的双寡头地位。"
 TAI_shenzhou: "载人航天"
 TAI_shenzhou_desc: "中华民国的航天员搭乘国产飞船进入太空。神舟飞船的乘组里，第一次出现了来自台湾的航天员；在太空中俯瞰地球时，她说：从这里看，海峡只是一条细细的蓝线。"
 TAI_space_station: "太空站"
 TAI_space_station_desc: "在近地轨道建立中华民国自己的太空站。天宫空间站在新的旗帜下继续运行，并向全世界开放：欧洲、日本与发展中国家的科学家都可以在这里进行实验，它将成为国际空间站退役后人类在轨道上的主要据点。"
 TAI_beidou: "北斗卫星导航"
 TAI_beidou_desc: "建设独立自主的卫星导航系统，军民两用。北斗系统由三十多颗卫星组成，精度与 GPS 相当；在战时，它让国军不必依赖美国的导航系统，在平时，它服务着数十亿部手机与汽车。"
 TAI_commercial_launch: "商业发射"
 TAI_commercial_launch_desc: "开放民营火箭公司，以低廉的价格承揽全球卫星发射。蓝箭、星际荣耀与台湾的晋陞太空等民营企业纷纷研发可回收火箭，商业发射的价格大幅下降；中国成为与 SpaceX 竞争的主要力量。"
 TAI_mars_probe: "火星探测"
 TAI_mars_probe_desc: "探测器飞越五千万公里，在火星乌托邦平原着陆。火星车在红色的土地上行驶、采样，传回第一张由中华民国探测器拍摄的火星全景照；下一个目标是采样返回，再下一个，是载人登陆。"
 TAI_telecom_restructuring: "电信重组"
 TAI_telecom_restructuring_desc: "将中国电信、中国移动、中国联通与中华电信重组为三家互相竞争的电信公司。过去的国营电信垄断让资费居高不下，新的竞争格局让手机与宽带的价格大幅降低，服务品质也明显提升。"
 TAI_mobile_networks: "3G 到 5G"
 TAI_mobile_networks_desc: "一代接一代的移动网络，让偏远山村也连上了世界。从 3G、4G 到 5G，基站覆盖了青藏高原与南海诸岛；贵州山区的孩子用平板电脑上网课，新疆的牧民用手机卖羊肉。"
 TAI_internet_giants: "互联网三巨头"
 TAI_internet_giants_desc: "拆除防火长城之后，大陆的互联网企业在自由竞争中迅速崛起。阿里巴巴、腾讯与字节跳动不再受到政治审查的束缚，也必须面对谷歌与脸书的直接竞争；最终胜出的，是真正能满足用户的产品。"
 TAI_online_games: "网络游戏产业"
 TAI_online_games_desc: "从网咖到手机，网络游戏成为年轻一代的娱乐与出口产业。中共时代的游戏版号审批与未成年人限玩令被废除，台湾的游戏公司与大陆的开发团队合作，打造出风靡全球的作品。"
 TAI_mobile_payment: "移动支付"
 TAI_mobile_payment_desc: "扫码支付普及城乡，现金几乎从日常生活中消失。从菜市场到寺庙的功德箱都贴着二维码；新政府立法保护支付数据的隐私，禁止政府未经法院许可调取个人的交易记录。"
 TAI_ecommerce: "电子商务"
 TAI_ecommerce_desc: "网购与物流网络串连全国，小商家也能把货卖到世界各地。淘宝村里的农民把土特产卖到欧美，台湾的文创小店在大陆开设网店；快递员成了城市里最常见的身影，一天之内就能把包裹送到几乎任何地方。"
 TAI_digital_fabi: "数字国币"
 TAI_digital_fabi_desc: "中央银行发行数字国币，与传统法币并行流通。与中共时代的数字人民币不同，数字国币的设计以隐私保护为原则，央行无法追踪小额交易；它降低了支付成本，也让国币在跨境贸易中更具竞争力。"
 TAI_big_four_ipo: "四大行上市"
 TAI_big_four_ipo_desc: "工农中建四大国有银行完成股份制改造，在上海与台北同步上市。上市募集的资金用于核销坏账、补充资本，外国战略投资者入股带来了现代的风险管理；四大行从政策工具变成了真正的商业银行。"
 TAI_exchange_merger: "沪台证交所合并"
 TAI_exchange_merger_desc: "上海证券交易所与台湾证券交易所合并为中华证券交易所，总部设在上海陆家嘴。合并后的交易所市值跻身世界前三，台积电与阿里巴巴同在一个市场挂牌；上海重新成为亚洲的金融中心，正如它在 1930 年代那样。"
 TAI_sovereign_fund: "中华投资公司"
 TAI_sovereign_fund_desc: "以外汇储备成立主权财富基金，投资海外的能源、矿产与科技。中华投资公司接管了中投公司与台湾的国安基金，管理资产超过万亿美元；它以挪威主权基金为榜样，公开投资组合，不做政治性的收购。"
 TAI_shadow_banking: "整顿影子银行"
 TAI_shadow_banking_desc: "清理地方融资平台与理财产品，化解系统性金融风险。中共时代的影子银行规模一度超过六十万亿元，恒大与碧桂园的倒闭曾引发连锁反应；新政府以存款保险、破产重整与严格的监管，逐步拆除这颗定时炸弹。"
 TAI_star_market: "科创板"
 TAI_star_market_desc: "为高科技企业开设专门的上市板块，让创业者更容易募得资金。科创板采用注册制，不再要求连续盈利，芯片、生物医药与人工智能企业可以在研发阶段就上市；台湾的创投业者也纷纷到大陆寻找下一个独角兽。"
 TAI_fabi_internationalization: "国币国际化"
 TAI_fabi_internationalization_desc: "国币成为国际储备货币，与美元、欧元、日圆并列。国际货币基金组织调整特别提款权货币篮，国币的权重仅次于美元与欧元；原油、铁矿石与大豆的国际贸易开始以国币计价，中国企业不再受汇率波动的困扰。"
 TAI_west_east_gas_2: "西气东输二线"
 TAI_west_east_gas_2_desc: "第二条横贯东西的天然气管道，把新疆与中亚的天然气送到珠江三角洲与香港。管道全长近九千公里，穿越十几个省份；珠三角的工厂与电厂改烧天然气，华南的空气质量明显改善。"
 TAI_oil_majors_abroad: "三桶油出海"
 TAI_oil_majors_abroad_desc: "中国石油、中国石化与中国海油走向世界，收购海外油田。在中共时代，它们的海外投资常常带有政治色彩，在委内瑞拉与苏丹蒙受巨额损失；如今三桶油按照商业原则选择项目，与西方石油巨头平等竞争。"
 TAI_baosteel_ipo: "宝钢上市"
 TAI_baosteel_ipo_desc: "宝山钢铁完成民营化改造，成为世界级的钢铁企业。宝钢当年由日本新日铁协助建设，是改革开放的象征；如今它与台湾的中钢结成策略联盟，在高端汽车钢板与造船钢材上与日韩钢厂一较高下。"
 TAI_steel_consolidation: "钢铁整合"
 TAI_steel_consolidation_desc: "淘汰小钢厂，整并为几家具有国际竞争力的钢铁集团。中国的粗钢产量占世界一半以上，但数百家小钢厂产能过剩、污染严重；整合之后，钢铁业的利润率回升，河北的天空也重新变蓝。"
 TAI_domestic_nuclear: "国造核电"
 TAI_domestic_nuclear_desc: "以台湾的核四经验结合大陆的技术，自主设计第三代核电机组。核四厂在台湾因政治争议封存多年，留下了一批经验丰富的工程师；他们与华龙一号的设计团队合作，打造出安全标准更高的国造核电。"
 TAI_renewable_bases: "风光基地"
 TAI_renewable_bases_desc: "在戈壁沙漠与东南沿海兴建大型太阳能与离岸风电基地。甘肃与内蒙古的光伏电站一望无际，台湾海峡的离岸风场是世界上风力最好的海域之一；特高压输电线把西部的绿电送到东部的城市。"
 TAI_rare_earth_strategy: "稀土战略"
 TAI_rare_earth_strategy_desc: "整合包头与赣南的稀土产业，掌握高科技产业的关键原料。中国的稀土产量占世界七成以上，过去的滥采与走私让资源与环境付出了巨大代价；新政府以总量控制、环保标准与出口管理，把资源优势转化为战略筹码。"
 TAI_changchun_auto: "长春汽车城"
 TAI_changchun_auto_desc: "扩建一汽长春基地，东北重新成为中国的汽车工业重镇。第一汽车制造厂在 1956 年生产出第一辆解放牌卡车，红旗轿车曾是领导人的座驾；如今一汽要从国企的保护伞下走出来，在市场上与合资品牌竞争。"
 TAI_private_automakers: "民营车企崛起"
 TAI_private_automakers_desc: "吉利、比亚迪、长城……民营汽车厂在市场竞争中脱颖而出。吉利收购了沃尔沃，比亚迪成为全球最大的电动车制造商；没有了国企的特权与地方保护，民营车企获得了公平竞争的环境。"
 TAI_yulon_faw: "裕隆与一汽合作"
 TAI_yulon_faw_desc: "台湾的裕隆汽车与一汽合资，结合台湾的设计与大陆的产能。裕隆的创办人严庆龄曾立志打造「国人自己的汽车」，纳智捷品牌却始终受限于台湾的小市场；与一汽的合作让这个梦想有了实现的规模，生产线也能转产军用车辆。"
 TAI_overseas_acquisition: "海外并购"
 TAI_overseas_acquisition_desc: "中国车企收购欧洲的老牌汽车公司，取得技术与品牌。继沃尔沃与路特斯之后，更多陷入困境的欧洲车厂成为中国企业的收购目标；民主的中国让欧洲政府不再以国家安全为由阻挡交易。"
 TAI_new_energy_vehicles: "新能源车"
 TAI_new_energy_vehicles_desc: "电动车与电池产业成为新的国家战略产业。宁德时代与比亚迪的电池供应全世界，台湾的电机与车用芯片补上了最后一块拼图；中国的新能源车销量占全球的六成，燃油车逐渐退出城市的街道。"
 TAI_auto_exports: "汽车出口"
 TAI_auto_exports_desc: "中国成为世界最大的汽车出口国，每年出口数百万辆汽车到欧洲、东南亚、中东与拉丁美洲。上海港与广州港的滚装船码头停满了等待出口的新车，「中国车」不再是廉价的代名词。"
 TAI_abolish_agri_tax: "废除农业税"
 TAI_abolish_agri_tax_desc: "延续两千年的「皇粮国税」正式走入历史。农民不再缴纳农业税与各种摊派，地方政府改以财政转移支付维持运作；这是对数亿农民的减负，也是新政府赢得农村民心的关键一步。"
 TAI_hybrid_rice: "超级杂交水稻"
 TAI_hybrid_rice_desc: "推广高产的超级杂交水稻，亩产突破一千公斤。袁隆平的杂交水稻让中国养活了世界五分之一的人口；新政府继续支持他的研究团队，并把耐旱、耐盐碱的新品种推广到东南亚与非洲。"
 TAI_grain_for_green: "退耕还林"
 TAI_grain_for_green_desc: "将陡坡耕地退还为森林与草原，遏止水土流失。1998 年长江大洪水之后，中共开始推行退耕还林；新政府延续这一政策，并以生态补偿让农民愿意参与。黄土高原的山坡重新变绿，黄河的泥沙也逐年减少。"
 TAI_distant_fishing: "远洋渔业"
 TAI_distant_fishing_desc: "发展远洋渔船队，向太平洋与印度洋要「蓝色粮仓」。台湾的远洋渔业规模长年位居世界前列，高雄前镇渔港的鲔鱼船遍布三大洋；如今大陆与台湾的船队整合，并以严格的配额与监管回应国际对过度捕捞的批评。"
 TAI_seed_security: "种子安全"
 TAI_seed_security_desc: "建立国家种子库，掌握育种的核心技术。中国的玉米、大豆与蔬菜种子大量依赖进口，跨国种业公司掌握着关键品种；国家种子库保存了上百万份种质资源，台湾的种苗改良经验也被用于培育新品种。"
 TAI_water_security: "国家水安全"
 TAI_water_security_desc: "整治黄河与淮河，兴建水库与灌溉网，保障北方的用水。华北平原的地下水超采形成了世界最大的地下水漏斗区，北平与天津的人均水资源不足以色列；节水农业、污水回用与跨流域调水，三管齐下。"
 TAI_rise_of_central_china: "中部崛起"
 TAI_rise_of_central_china_desc: "湖北、湖南、河南、江西、安徽与山西六省联合发展。中部地区夹在繁荣的沿海与受扶持的西部之间，长期被称为「中部塌陷」；新政府以交通枢纽、产业转移与人才回流，让中部成为下一个增长极。"
 TAI_pudong_finance: "浦东金融中心"
 TAI_pudong_finance_desc: "把上海浦东打造成与香港、东京并列的国际金融中心。陆家嘴的摩天大楼里，国际投行、资产管理公司与保险公司纷纷设立亚洲总部；资本自由流动与独立的司法，让上海终于具备了国际金融中心的软件。"
 TAI_ne_russia_corridor: "东北—俄罗斯走廊"
 TAI_ne_russia_corridor_desc: "以哈尔滨为枢纽，打通通往俄罗斯远东的铁路与公路。哈尔滨曾是中东铁路的枢纽，被称为「东方小巴黎」；如今新的跨境铁路与公路大桥把东北与海参崴、伯力连在一起，木材、粮食与能源在边境上源源不断地流动。"
 TAI_prd_electronics: "珠三角电子业"
 TAI_prd_electronics_desc: "东莞与深圳成为全球电子产品的生产基地：鸿海、华为与大疆的工厂在这里生产全世界的手机、电脑与无人机。台商在东莞经营了三十多年，如今他们的经验与大陆的工程师结合，让珠三角从「代工」走向「创新」。"
 TAI_second_gen_sez: "第二代经济特区"
 TAI_second_gen_sez_desc: "在内陆设立新一代经济特区，复制沿海的成功经验。成都、重庆、西安与郑州成为新的特区，享有与深圳当年相同的税收优惠与政策自主；内陆的工资只有沿海的一半，大批工厂沿着长江与陇海线向西迁移。"
 TAI_new_mbt: "新式主战坦克"
 TAI_new_mbt_desc: "以 99 式的底盘结合 M1A2 的火控，研制国军新一代主战坦克。台湾的 M1A2T 与大陆的 99A 曾经被设计来彼此对抗，如今两个研发团队坐在同一间会议室里，取长补短；新坦克被命名为「中正」，以纪念国军的传统。"
 TAI_wheeled_family: "轮式装甲车家族"
 TAI_wheeled_family_desc: "「云豹」与 08 式合流，发展统一的八轮装甲车族。台湾的云豹装甲车与大陆的 08 式各有长处，合流之后发展出步兵战车、指挥车、救护车与自走迫击炮等多种型号，统一的底盘大大简化了后勤。"
 TAI_attack_helicopters: "攻击直升机"
 TAI_attack_helicopters_desc: "以阿帕契与直-10 组建陆航攻击直升机旅。台湾的 AH-64E 阿帕契与大陆的直-10 混编成军，飞行员互相学习战术；攻击直升机旅能在数小时内飞抵数百公里外的战场，是陆军最锋利的拳头。"
 TAI_tactical_drones: "战术无人机"
 TAI_tactical_drones_desc: "每个营都配备侦察与攻击无人机。乌克兰战场证明，廉价的无人机可以摧毁昂贵的坦克；国军为每个步兵营配备第一人称视角攻击无人机与侦察无人机，台湾的民间无人机产业也被纳入国防供应链。"
 TAI_rifle_merger: "国造步枪合流"
 TAI_rifle_merger_desc: "以 T91 与 95 式的经验研制统一的国军制式步枪。两种步枪的口径与结构完全不同，士兵们的习惯也各不相同；新步枪采用北约制式口径与传统的枪托设计，第一批配发给五大战区的精锐部队。"
 TAI_soldier_systems: "单兵作战系统"
 TAI_soldier_systems_desc: "夜视、通讯与防弹装备全面换装。每名步兵配备数字化通讯终端、热成像夜视仪与新一代防弹衣，班长可以在平板上看到整个连的位置；现代战场上，士兵本身就是一个信息节点。"
 TAI_atgm: "反坦克导弹"
 TAI_atgm_desc: "红箭与标枪两条技术路线的整合。台湾采购的美制标枪导弹采用「射后不理」的顶部攻击，大陆的红箭-12 也已具备类似能力；两个团队合作研发新一代反坦克导弹，让步兵在面对任何装甲部队时都有一战之力。"
 TAI_sp_artillery: "自走炮"
 TAI_sp_artillery_desc: "以 PLZ-05 为基础发展新一代自走榴弹炮，射程超过五十公里，能在一分钟内发射数发炮弹并迅速转移阵地。台湾的 M109A6 与大陆的自走炮部队合编，炮兵将在未来的战场上发挥决定性的作用。"
 TAI_thunderbolt_mlrs: "雷霆火箭炮"
 TAI_thunderbolt_mlrs_desc: "「雷霆二〇〇〇」与 PHL-03 合流，组建远程火箭炮旅。雷霆二〇〇〇是台湾自研的多管火箭系统，PHL-03 是大陆的远程火箭炮；合流后的新系统射程达到三百公里，能以精确制导火箭摧毁纵深目标。"
 TAI_air_defense_merger: "天弓与红旗合流"
 TAI_air_defense_merger_desc: "天弓与红旗两大防空导弹系统整合为统一的国土防空网。台湾的天弓三型与大陆的红旗-9 曾经互为对手，如今它们的雷达与指挥系统连成一体，从近程到远程、从低空到高空，构成多层的防空体系。"
 TAI_new_national_army: "新式国军"
 TAI_new_national_army_desc: "陆军完成换装，一支现代化、信息化的新国军正式成形。从坦克、装甲车、火炮到单兵装备，全部采用统一的国造标准；两岸合编的部队在新装备上完成训练，士兵们已经分不清彼此原来来自哪一边。"
 TAI_kidd_054a: "纪德与 054A 合流"
 TAI_kidd_054a_desc: "以纪德舰的作战经验与 054A 的生产线，量产新一代护卫舰。台湾海军的基德级驱逐舰拥有丰富的防空作战经验，054A 护卫舰则是大陆造船厂的成熟产品；新的护卫舰结合两者之长，大量补充远洋舰队。"
 TAI_varyag_refit: "改装瓦良格号"
 TAI_varyag_refit_desc: "将停泊在大连的瓦良格号改装为中华民国的第一艘航空母舰。这艘苏联未完工的航母在 1998 年被以「海上赌场」名义购入，历经多年改装才成为辽宁号；如今它在青天白日旗下重新服役，成为海军航空兵的训练舰。"
 TAI_domestic_carrier: "国造航母"
 TAI_domestic_carrier_desc: "江南造船厂开工建造第一艘国造航空母舰。江南造船厂是中国最古老的造船厂之一，1865 年由李鸿章创办于上海；一百六十年后，它将建造中华民国的第一艘国造航母，为海军走向深蓝奠定基础。"
 TAI_emals: "电磁弹射"
 TAI_emals_desc: "新一代航母采用电磁弹射器，舰载机可以满载起飞。与滑跃甲板相比，电磁弹射能让战机携带更多的燃油与武器，也能弹射预警机；全世界只有美国与中国掌握这项技术。"
 TAI_submarine_merger: "潜舰国造合流"
 TAI_submarine_merger_desc: "海鲲号与 039 型的研发团队合并，统一发展常规动力潜艇。台湾的国造潜艇计划历经重重困难才完成首艘，大陆的 039 型已有数十艘服役；合流之后，新一代不依赖空气推进潜艇将以更低的成本大量建造。"
 TAI_nuclear_submarines: "核潜艇"
 TAI_nuclear_submarines_desc: "建造新一代攻击核潜艇与战略导弹核潜艇。095 型攻击核潜艇与 096 型战略核潜艇的噪音水平大幅降低，能在西太平洋与印度洋长期隐蔽巡航；核潜艇是海军皇冠上的明珠，也是国家威慑力量的支柱。"
 TAI_amphibious_assault_ship: "两栖攻击舰"
 TAI_amphibious_assault_ship_desc: "建造全通甲板的两栖攻击舰，搭载直升机与陆战队。075 型两栖攻击舰可以搭载近三十架直升机与一个陆战营，具备远程投送与人道救援能力；在南太平洋的风灾与地震救援中，它们将是最先抵达的援军。"
 TAI_two_ocean_navy: "两洋舰队"
 TAI_two_ocean_navy_desc: "太平洋舰队与印度洋舰队，中华民国海军走向深蓝。太平洋舰队以舟山与左营为基地，印度洋舰队以三亚为基地、在吉布提与瓜达尔设有补给站；中国海军第一次同时在两大洋保持常态存在。"
 TAI_idf_j10_merger: "经国号与歼-10 合流"
 TAI_idf_j10_merger_desc: "经国号与歼-10 的研发团队合并，发展新一代国造战机。经国号是台湾在美国协助下研制的轻型战机，歼-10 则是成都飞机公司的心血；两个团队合作研发的新战机，兼具两者的优点与更先进的航电。"
 TAI_stealth_phase2: "隐形战机二期"
 TAI_stealth_phase2_desc: "以歼-20 为基础，发展可上舰的隐形战机。电磁弹射航母需要新一代舰载隐形战机，歼-35 与歼-20 的技术被整合进新的设计；海军航空兵将拥有与美国 F-35C 相当的作战能力。"
 TAI_awacs: "预警机"
 TAI_awacs_desc: "空警-2000 与 E-2K 组成空中预警网。台湾的 E-2K 鹰眼预警机与大陆的空警系列预警机合编，统一的数据链让任何一架预警机都能指挥所有的战机；在现代空战中，看得更远的一方往往就是胜利的一方。"
 TAI_transport_tanker: "运输与加油机"
 TAI_transport_tanker_desc: "运-20 投产，空军首次具备战略投送与空中加油能力。运-20 能在一天之内把一个装甲营空运到新疆或西藏，加油型则让战机的作战半径延伸到第二岛链之外；过去台湾空军只有 C-130，如今的投送能力已不可同日而语。"
 TAI_domestic_engines: "国产航空发动机"
 TAI_domestic_engines_desc: "突破涡扇发动机的瓶颈，战机不再「心脏病」。航空发动机是工业皇冠上的明珠，大陆的战机长期依赖俄制发动机，国产的涡扇-10 与涡扇-15 历经多年才达到可靠的水平；台湾的精密加工技术，补上了最后的短板。"
 TAI_long_range_drones: "远程察打无人机"
 TAI_long_range_drones_desc: "翼龙与腾云无人机组成远程侦察与打击机队。腾云是台湾中科院研制的中空长航时无人机，翼龙则已出口到中东与非洲多国；合编之后的机队能在南海与印度洋上空连续巡逻三十多个小时。"
 TAI_precision_munitions: "精确导弹"
 TAI_precision_munitions_desc: "长剑巡航导弹与雄风导弹的整合，打击千里之外的目标。雄风二E 是台湾自研的对地巡航导弹，长剑-10 是大陆的主力巡航导弹；整合后的弹药体系配合北斗导航，误差不超过数米。"
 TAI_theater_air_command: "战区空军"
 TAI_theater_air_command_desc: "各战区设立空军指挥部，统一指挥辖区内的航空兵力。过去空军、海军航空兵与陆航各自为政，如今战区空军司令部统一调度所有的战机、预警机与无人机，联合作战的效率大幅提升。"
 TAI_bomber_upgrade: "战略轰炸机升级"
 TAI_bomber_upgrade_desc: "轰-20 隐形战略轰炸机首飞。这款飞翼布局的轰炸机航程超过八千公里，能携带核弹与常规精确弹药；它让中华民国成为继美国之后第二个拥有隐形战略轰炸机的国家，太平洋两岸的战略平衡为之改变。"
 TAI_dalai_lama_return: "达赖喇嘛返藏"
 TAI_dalai_lama_return_desc: "邀请流亡六十多年的达赖喇嘛回到拉萨。1959 年他从布达拉宫出走印度，此后再也没有回过西藏；当这位年迈的宗教领袖重新踏上拉萨的土地时，数十万藏人跪在路边迎接。转世问题与自治框架，将是双方接下来要谈的事。"
 TAI_tibet_real_autonomy: "真正自治框架"
 TAI_tibet_real_autonomy_desc: "在中华民国宪法之下，给予西藏高度自治。这是达赖喇嘛多年来主张的「中间道路」：不求独立，但求真正的自治。西藏自治政府负责教育、宗教、文化与环境保护，国防与外交仍由中央掌管。"
 TAI_qinghai_tibet_railway: "青藏铁路"
 TAI_qinghai_tibet_railway_desc: "世界海拔最高的铁路通车到拉萨，最高点唐古拉山口海拔五千多米。这条铁路曾被批评为加速汉化与资源掠夺的工具；新政府规定铁路沿线的工作优先雇用藏人，旅游收益也要回馈当地社区。"
 TAI_buddhist_heritage: "佛教文化保护区"
 TAI_buddhist_heritage_desc: "修复文革中毁损的寺院，保护藏传佛教的文化遗产。甘丹寺、桑耶寺与色拉寺在文革中遭到严重破坏，大批经书与佛像被毁；新政府拨款修复，并恢复寺院自主选拔僧侣与活佛认定的传统。"
 TAI_plateau_fund: "高原发展基金"
 TAI_plateau_fund_desc: "设立专门的基金，发展青藏高原的交通、教育与观光。高原上的牧民子弟上学要走几天的路，许多乡村没有医生；高原发展基金为每个乡镇建学校与卫生所，并以生态旅游代替破坏性的矿业开发。"
 TAI_himalayan_gateway: "喜马拉雅门户"
 TAI_himalayan_gateway_desc: "以拉萨为门户，打通通往尼泊尔与南亚的贸易通道。吉隆口岸与樟木口岸重新开放，规划中的中尼铁路将从日喀则通往加德满都；西藏不再是封闭的边疆，而是连接中国与南亚的桥梁。"
 TAI_xinjiang_autonomy_law: "新疆自治条例"
 TAI_xinjiang_autonomy_law_desc: "制定新疆自治条例，保障各民族的语言、宗教与文化。维吾尔族、哈萨克族与回族在自治区议会中按人口比例拥有席位，地方首长由选举产生；这是对过去数十年高压统治的根本修正。"
 TAI_religious_freedom_xj: "宗教自由保障"
 TAI_religious_freedom_xj_desc: "关闭再教育营，释放被拘押者，恢复清真寺的正常宗教活动。被拆除的清真寺圆顶重新竖起，斋月期间不再禁止公务员与学生封斋；联合国人权专员受邀前往新疆调查，土耳其与伊斯兰世界对南京的态度明显改善。"
 TAI_kashgar_sez: "喀什经济特区"
 TAI_kashgar_sez_desc: "把喀什打造成面向中亚与南亚的经济特区。喀什是古丝绸之路上的重镇，老城的街巷保留着千年的风貌；新的特区以红其拉甫与吐尔尕特口岸连接巴基斯坦与吉尔吉斯，让南疆的维吾尔人在家乡就能找到工作。"
 TAI_bilingual_education: "双语教育"
 TAI_bilingual_education_desc: "推行维吾尔语与国语并重的双语教育。过去的「双语教育」实际上是逐步取消维吾尔语教学，许多孩子在寄宿学校里被禁止说母语；新政策让学生在学习国语的同时，以母语学习文学、历史与宗教文化。"
 TAI_tarim_oil: "塔里木油田"
 TAI_tarim_oil_desc: "开发塔里木盆地的石油与天然气。塔克拉玛干沙漠下埋藏着中国最大的油气资源之一，但过去的开发收益大多流向东部与国企；新政府规定，资源税的一半留在新疆，用于当地的教育、医疗与基础建设。"
 TAI_central_asia_gateway: "中亚门户"
 TAI_central_asia_gateway_desc: "新疆不再是边陲，而是中国通往中亚与欧洲的门户。乌鲁木齐成为欧亚大陆桥的枢纽，霍尔果斯口岸的货运量年年翻番；当地各民族在开放与繁荣中，第一次真正分享了国家发展的成果。"
 TAI_mongolian_education: "蒙文教育"
 TAI_mongolian_education_desc: "恢复蒙文学校与蒙古文化，尊重盟旗的传统。2020 年内蒙古以国语取代蒙语教学，引发了大规模的抗议；新政府恢复蒙语授课，蒙古文报刊与广播重新开办，那达慕大会成为国家级的节庆。"
 TAI_steppe_economy: "草原经济"
 TAI_steppe_economy_desc: "以畜牧、乳业与观光振兴草原经济。过去的「生态移民」把牧民赶进城镇，草原却因过度开矿而沙化；新政策让牧民重返草原，以合作社经营乳业与特色畜产品，并发展草原生态旅游。"
 TAI_rare_earth_coal: "稀土与煤炭"
 TAI_rare_earth_coal_desc: "开发鄂尔多斯的煤炭与白云鄂博的稀土。白云鄂博是世界最大的稀土矿，鄂尔多斯曾因煤炭暴富又因鬼城闻名；新政府要求矿业公司承担生态修复责任，并把资源收益的一部分分配给当地的蒙古族牧民。"
 TAI_mongol_federation: "蒙古联邦构想"
 TAI_mongol_federation_desc: "内外蒙古同属蒙古民族。中华民国愿以联邦的形式与蒙古国共享未来：蒙古国保留自己的议会、军队与国际地位，在国防与经济上与中华民国结成联邦。乌兰巴托对此半信半疑，但经济上的诱惑难以拒绝。"
 TAI_greater_bay_area: "大湾区"
 TAI_greater_bay_area_desc: "香港、澳门与广东九市组成粤港澳大湾区，人口超过八千万，经济规模与韩国相当。在一国两制的框架下，三地的人员、资金与货物流动更加便利；香港的金融、澳门的旅游与深圳的科技，形成世界级的城市群。"
 TAI_hzm_bridge: "港珠澳大桥"
 TAI_hzm_bridge_desc: "五十五公里长的跨海大桥连接香港、珠海与澳门，是世界上最长的跨海桥隧工程。大桥通车后，从香港到珠海的车程从四小时缩短为四十分钟；新政府放宽通行配额，让大桥真正发挥连通三地的作用。"
 TAI_macau_diversification: "澳门博彩多元化"
 TAI_macau_diversification_desc: "协助澳门摆脱对博彩业的依赖，发展会展、观光与金融。博彩业占澳门财政收入的八成，疫情期间赌场停业让澳门经济一度崩溃；新政府在横琴设立合作区，为澳门的中医药、会展与特色金融提供发展空间。"
 TAI_lusophone_gateway: "葡语国家门户"
 TAI_lusophone_gateway_desc: "以澳门为平台，拓展与巴西、葡萄牙、安哥拉等葡语国家的经贸往来。澳门有四百多年的葡萄牙殖民历史，保留着葡语法律与文化的传统；中葡论坛设在澳门，让中国企业以此为跳板进入葡语世界的两亿多人口市场。"
 TAI_five_races_prosperity: "五族共荣"
 TAI_five_races_prosperity_desc: "汉、满、蒙、回、藏与各民族，在中华民国之下共享繁荣。边疆地区的人均收入第一次追上了全国平均水平，少数民族的语言与文化得到保护，宗教自由得到保障；五族共和的理想，从一面旗帜变成了现实。"
 ### v3.11 光复后的政党与候选人
 ROC.Western_Autocracy: "£TAI_conservatism (HFH) 中国国民党黄复兴党部"
 ROC.Western_Autocracy_desc: "亲西方威权 - 中国国民党黄复兴党部\n\n国民党内由退伍军人与眷村子弟组成的特种党部，纪律严明、立场强硬，主张以强有力的政府巩固光复成果，并坚定站在美国一边。"
 ROC.Western_Autocracy_icon: "£TAI_conservatism"
 ROC.conservatism: "£TAI_conservatism (KMT) 中国国民党"
 ROC.conservatism_desc: "保守主义 - 中国国民党\n\n孙中山创立的百年老党。带领政府光复大陆后，国民党是全国第一大党，主张三民主义、五权宪法与稳健的市场经济。"
 ROC.conservatism_icon: "£TAI_conservatism"
 ROC.liberalism: "£CHI_liberal (CDP) 中国民主党"
 ROC.liberalism_desc: "自由民主主义 - 中国民主党\n\n1998年由王有才、秦永敏、徐文立等大陆民运人士创立，旋即遭中共取缔，骨干或入狱、或流亡海外。光复之后，中国民主党终于在大陆公开活动，以多党竞争的宪政民主、自由选举与人权保障为号召，成为大陆选民中最大的自由派政党。"
 ROC.liberalism_icon: "£CHI_liberal"
 ROC.socialism: "£CHI_left_wing_radical (RCCK) 中国国民党革命委员会（国民党左派）"
 ROC.socialism_desc: "社会民主主义 - 中国国民党革命委员会（国民党左派）\n\n源自国民党内的左翼——廖仲恺、宋庆龄与「三大政策」的传统。光复后，民革摆脱了过去依附中共的历史，以「国民党左派」自居：坚持三民主义中的民生主义，主张土地改革、劳工保障与扶助农工，在大陆的工人与农民中拥有深厚基础。"
 ROC.socialism_icon: "£CHI_left_wing_radical"
 ROC.communist_state: "£CHI_communism (CPC) 中国共产党"
 ROC.communist_state_desc: "共产主义 - 中国共产党\n\n失去政权的中国共产党。在宪政体制下，它以合法在野党的身份存在，但始终被怀疑与北方的残余势力藕断丝连。"
 ROC.communist_state_icon: "£CHI_communism"
 ROC.anarchist_communism: "£TAI_anarchist_communism (CPWDP) 中国农工民主党"
 ROC.anarchist_communism_desc: "左翼社会主义 - 中国农工民主党\n\n前身是邓演达1930年创立的「中华革命党」（第三党），以农民与工人的利益为号召，主张「平民革命」与土地改革。光复后，农工党摆脱了统战附庸的身份，在大陆的医卫界与国企工人中重新发展，是国会里最左翼的合法政党。"
 ROC.anarchist_communism_icon: "£TAI_anarchist_communism"
 ROC.Conservative: "£TAI_Conservative (NP) 新党"
 ROC.Conservative_desc: "新兴保守主义 - 新党\n\n从国民党分裂出来的统派政党，以反贪腐与中华民族主义为号召，在都市知识分子中颇有影响。"
 ROC.Conservative_icon: "£TAI_Conservative"
 ROC.Autocracy: "£CHI_pro_emerging_autocrat (CDL) 中国民主同盟"
 ROC.Autocracy_desc: "新兴威权 - 中国民主同盟\n\n抗战时期成立的知识分子政党，光复后重新独立运作，主张由精英与专家主导的「贤能政治」。"
 ROC.Autocracy_icon: "£CHI_pro_emerging_autocrat"
 ROC.Neutral_Autocracy: "£TAI_conservatism (SPA) 三民主义大同盟"
 ROC.Neutral_Autocracy_desc: "不结盟威权 - 三民主义大同盟\n\n党国体制的怀旧者组成的团体，主张恢复训政时期的「以党治国」。"
 ROC.Neutral_Autocracy_icon: "£TAI_conservatism"
 ROC.Neutral_conservatism: "£TAI_Neutral_conservatism (PFP) 亲民党"
 ROC.Neutral_conservatism_desc: "不结盟保守主义 - 亲民党\n\n宋楚瑜创立的政党，以「亲民」与地方建设为号召，在基层与外省族群中拥有稳固支持。"
 ROC.Neutral_conservatism_icon: "£TAI_Neutral_conservatism"
 ROC.oligarchism: "£generic_oligarchism_small (CNDCA) 中华民国工商建国会"
 ROC.oligarchism_desc: "寡头主义 - 中华民国工商建国会\n\n由沿海资本家与台商组成的政治团体，主张开放市场、减税与有利于大企业的产业政策。"
 ROC.oligarchism_icon: "£generic_oligarchism_small"
 ROC.Neutral_Libertarian: "£CHI_neutral_social_democrat (CAPD) 中国民主促进会"
 ROC.Neutral_Libertarian_desc: "知识分子自由派 - 中国民主促进会\n\n1945年由马叙伦、周建人等文教界人士在上海创立，成员多为教师、学者与出版人。光复后，民进不再是「花瓶党」，以教育自由、学术独立与文化开放为号召，在大陆的知识分子中拥有广泛支持。"
 ROC.Neutral_Libertarian_icon: "£CHI_neutral_social_democrat"
 ROC.Neutral_green: "£TAI_Neutral_green (CGP) 中国绿党"
 ROC.Neutral_green_desc: "绿色政治 - 中国绿党\n\n由大陆的环保组织与「自然之友」等民间团体发展而来的政党，关注水源、空气污染与三峡等大型工程的生态代价。光复后快速工业化带来的污染，让中国绿党迅速壮大。"
 ROC.Neutral_green_icon: "£TAI_Neutral_green"
 ROC.neutral_Social: "£CHI_social_democrat (CSDP) 中国社会民主党"
 ROC.neutral_Social_desc: "不结盟社会民主主义 - 中国社会民主党\n\n由海外民运人士与大陆知识分子组成的社会民主党，主张北欧式的福利国家。"
 ROC.neutral_Social_icon: "£CHI_social_democrat"
 ROC.Neutral_Communism: "£CHI_neutral_communism (MCPC) 中国毛泽东主义共产党"
 ROC.Neutral_Communism_desc: "毛主义 - 中国毛泽东主义共产党\n\n不承认宪政体制的毛派地下组织，与北方的武装残余势力关系密切。"
 ROC.Neutral_Communism_icon: "£CHI_neutral_communism"
 ROC.Nat_Populism: "£TAI_Nat_Populism (YCP) 中国青年党"
 ROC.Nat_Populism_desc: "民族民粹主义 - 中国青年党\n\n创立于1923年的「国家主义派」老党。光复后，青年党以「国家至上、民族至上」与反建制的民粹口号东山再起，吸引了大批对既有政党失望的选民。"
 ROC.Nat_Populism_icon: "£TAI_Nat_Populism"
 ROC.Nat_Fascism: "£TAI_Nat_Fascism (NBS) 中华民族复兴社"
 ROC.Nat_Fascism_desc: "法西斯主义 - 中华民族复兴社\n\n以三十年代「复兴社（蓝衣社）」为榜样的极右翼团体，鼓吹领袖独裁、军事化社会与对残余势力的彻底清洗。"
 ROC.Nat_Fascism_icon: "£TAI_Nat_Fascism"
 ROC.Nat_Autocracy: "£TAI_Nat_Autocracy (ROCAF) 中华民国国军"
 ROC.Nat_Autocracy_desc: "军人威权 - 中华民国国军\n\n国军将领中不满文人政府的一派，主张在「戡乱」完成之前由军方主导国家。"
 ROC.Nat_Autocracy_icon: "£TAI_Nat_Autocracy"
 ROC.Monarchist: "£CHI_monarchism (Aisin-Gioro) 爱新觉罗宗室"
 ROC.Monarchist_desc: "君主主义 - 爱新觉罗宗室\n\n前清宗室后裔与少数君宪派人士，主张恢复「中华帝国」作为虚君立宪的国家象征。"
 ROC.Monarchist_icon: "£CHI_monarchism"
