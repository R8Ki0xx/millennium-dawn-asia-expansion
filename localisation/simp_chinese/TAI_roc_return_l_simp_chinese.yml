 TAI_nko_junta_leader: "李永吉"
 ROC_CHI.socialism: "£CHI_social_democrat (CSDP) - 中国社会民主党"
 ROC_CHI.socialism_icon: "£CHI_social_democrat"
 ROC_CHI.socialism_desc: "（社会民主主义） - 中国社会民主党\n\n光复之后，大陆的独立工会、知识分子与部分中共改革派共同组建了中国社会民主党。该党继承孙中山“民生主义”的理想，主张福利国家、劳工权益与节制资本。"
 PRC_rump_leader: "习近平"
 PRC_rump_leader_desc: "北京陷落之后，习近平以中央军委主席的身份率中共中央残余成员撤往内陆，统领残余的解放军继续抵抗。"
 roc_return.30.t: "首届全国大选"
 roc_return.30.d: "全国各地的投票所前排起了长龙，从黑龙江的林区到海南的渔村，十四亿人中的数亿选民第一次手持选票。这是中国历史上第一次由全体国民以普选方式选出国家领导人与国会，国际观察团称之为人类史上规模最大的民主选举。\n\n开票结果出炉——"
 roc_return.30.a: "中国国民党胜选！"
 roc_return.30.b: "中国民主党胜选！"
 roc_return.30.c: "中国社会民主党胜选！"
 roc_return.30.e: "没有政党过半，组成大联合政府。"
 roc_return.31.t: "政权和平交接"
 roc_return.31.d: "第二次全国大选结束后，败选的执政党在总统府前与胜选者握手，交出国玺与印信，完成了和平的政权交接。在这片五千年来政权更替多以战争收场的土地上，这样的场景前所未见；政治学家说，中国的民主已经真正巩固。"
 roc_return.31.a: "这就是民主。"
 roc_return.40.t: "青天白日满地红"
 roc_return.40.d: "南京、上海、广州、北京……从城市到乡村，青天白日满地红旗出现在每一座政府机关前。有人在街头痛哭，有人默默观望，有人仍然心怀疑虑。\n\n中华民国的法统，在离开大陆半个多世纪之后，回到了它诞生的土地。"
 roc_return.40.a: "中华民国万岁！"
 roc_return.40.b: "先安定人心，再谈庆祝。"
 roc_return.41.t: "解放军残部拒绝投降"
 roc_return.41.d: "在西南与西北的山区，部分解放军部队拒绝接受新政府的整编命令，据险顽抗。他们的指挥官多是死硬的中共党员，有的担心被清算，有的仍相信革命终将胜利；这些部队控制着几个县城与交通要道，成为新政府的心腹之患。"
 roc_return.41.a: "武力清剿。"
 roc_return.41.b: "招抚为上，许以优待。"
 roc_return.42.t: "抢购潮与通货膨胀"
 roc_return.42.d: "对新货币的不信任，引发了各大城市的抢购潮。超市的货架被一扫而空，民众排队提领存款，黑市上的美元汇率一日数变；物价飞涨，民怨沸腾。1948 年金圆券的教训历历在目，政府必须尽快稳住人心。"
 roc_return.42.a: "动用国库平抑物价。"
 roc_return.42.b: "让市场自行调整。"
 roc_return.43.t: "中南海的交接"
 roc_return.43.d: "中南海的大门打开了。新政府的接收人员在这里清点档案、文物与机要文件：历次政治运动的决策记录、六四当夜的命令、高层领导的财产清单。许多尘封数十年的秘密，即将公诸于世；如何处理这些档案，将影响国家的和解与稳定。"
 roc_return.43.a: "公开档案，还原历史。"
 roc_return.43.b: "暂时封存，以免激化矛盾。"
 roc_return.44.t: "十三亿人的期待"
 roc_return.44.d: "大陆同胞对新政府怀有极高的期待：更好的生活、更多的自由、更公正的社会。下岗工人希望恢复工作，农民希望拥有土地，年轻人希望买得起房子。新政府能否满足这些期待，将决定民国的未来；期望越高，失望的风险也越大。"
 roc_return.44.a: "加大民生投入。"
 roc_return.44.b: "循序渐进，量力而行。"
 roc_return.46.t: "戒严令"
 roc_return.46.d: "为恢复秩序，新政府在全国实施戒严。宪兵与警察接管各地治安，夜间实施宵禁，集会与游行一律禁止。对于经历过台湾三十八年戒严的人来说，这一幕似曾相识；政府承诺，这只是军政时期的暂时措施，秩序恢复后就会解除。"
 roc_return.46.a: "这只是暂时的。"
 roc_return.47.t: "训政开始"
 roc_return.47.d: "军政时期结束，训政时期开始。戒严令解除，宪兵撤回营区，政府在各县开办公民训练班，教导人民行使选举、罢免、创制与复决四权。第一批完成训练的县份将举行县长选举，中国的民主之路正式起步。"
 roc_return.47.a: "向宪政迈进。"
 roc_return.48.t: "中华民国宪法全面施行"
 roc_return.48.d: "1947 年制定的中华民国宪法，终于在全中国范围内全面施行。这部由张君劢起草、在南京国民大会通过的宪法，曾在台湾以临时条款冻结了四十多年；如今它的每一个条文都在大陆生效，十四亿国民第一次真正成为国家的主人。"
 roc_return.48.a: "主权在民。"
 roc_return.49.t: "北京陷落"
 roc_return.49.d: "北京已经陷落，国民党军占领了大半个中国。中共中央的残余成员带着档案与部分部队撤往内陆与东北，宣布在新的首都继续抵抗。党的报纸在地下印刷，号召全体党员与人民军队「坚持到底」。革命尚未成功……"
 roc_return.49.a: "革命尚未成功……"
 roc_return.50.t: "反攻令下达"
 roc_return.50.d: "总统在总统府发表全国广播：「国军将士们，反攻大陆的时刻到了！」七十多年来挂在嘴边的口号，今天终于变成了命令。\n\n金门、马祖与澎湖的炮兵阵地同时开火，登陆船团驶出了高雄与基隆港，空军的战机呼啸着飞越海峡。台湾海峡上空，硝烟弥漫。"
 roc_return.50.a: "光复大陆，解救同胞！"
 roc_return.51.t: "台海战争爆发"
 roc_return.51.d: "中华民国今日对中华人民共和国宣战，宣布「反攻大陆」。台湾海峡上空炮火连天，金门与厦门之间的海面上舰艇往来穿梭，全球股市应声大跌，台积电的股价一日暴跌两成。各国政府纷纷呼吁双方克制，联合国安理会召开紧急会议。"
 roc_return.51.a: "这是第二次国共内战吗？"
 roc_return.52.t: "国民党军来犯"
 roc_return.52.d: "台湾当局悍然对我宣战！国民党军的飞机与舰艇正向东南沿海逼近，金门的炮兵阵地向厦门开火。中央军委下令东部战区进入一级战备，福建与浙江的民兵紧急动员。这是 1958 年以来，海峡两岸第一次爆发全面的战争。"
 roc_return.52.a: "全民皆兵，打退来犯之敌！"
 roc_return.52.b: "稳住内部，避免恐慌。"
 roc_return.53.t: "滩头阵地"
 roc_return.53.d: "国军在东南沿海成功建立滩头阵地。海军陆战队在付出惨重伤亡之后占领了海滩与港口，后续部队与物资源源不断地登陆。当地的民众站在路边观望，有人悄悄递上茶水；滩头稳固了，下一步是向内陆推进。"
 roc_return.53.a: "向内陆推进！"
 roc_return.55.t: "北伐誓师"
 roc_return.55.d: "国军在南京举行北伐誓师大会。紫金山下，数万名将士整齐列队，总统亲授军旗。将士们在中山陵前宣誓：不光复北平，誓不还师。九十多年前，国民革命军在广州誓师北伐；今天，历史在南京再一次上演。"
 roc_return.55.a: "北伐！"
 roc_return.56.t: "国军光复北平"
 roc_return.56.d: "国军今日进入北平。天安门城楼上，青天白日满地红旗迎风飘扬，城楼正中的画像换成了国父孙中山的遗像。长安街两旁挤满了围观的市民，有人欢呼，有人沉默。中华民国已经控制了中国大陆的绝大部分地区，内战的结局已无悬念。"
 roc_return.56.a: "历史翻开了新的一页。"
 roc_return.60.t: "东南各省爆发起义"
 roc_return.60.d: "福建、浙江、广东、江西等省爆发大规模起义：工人罢工、学生上街，部分驻军倒戈。起义者在福州宣布成立「中华民国大陆临时政府」，升起了青天白日满地红旗，并呼吁台湾出兵支援。北京必须决定如何应对这场危机。"
 roc_return.60.a: "坚决镇压叛乱！"
 roc_return.60.b: "先稳住局势，再图后计。"
 roc_return.61.t: "中国内战爆发"
 roc_return.61.d: "中国东南沿海爆发大规模起义，起义政府宣布效忠中华民国。台湾海峡对岸的国民政府随即宣布出兵。这场中断了半个多世纪的内战，再度爆发了。"
 roc_return.61.a: "历史在重演。"
 roc_return.70.t: "平壤政变"
 roc_return.70.d: "凌晨四时，忠于新政府的朝鲜人民军部队包围了锦绣山太阳宫与劳动党中央大楼。中午，朝鲜中央电视台宣布：原领导人“因健康原因”辞去一切职务，新政府请求中华民国提供“必要的保护与援助”。\n\n朝鲜，从此是我们的了。"
 roc_return.70.a: "唇齿相依，这一次由我们来定义。"
 roc_return.71.t: "平壤政变"
 roc_return.71.d: "朝鲜中央电视台今日宣布，朝鲜最高领导人已辞去一切职务。新成立的过渡政府随即与中华民国签署了保护条约。分析人士普遍认为，南京的情报部门是这场政变的幕后推手。"
 roc_return.71.a: "金氏王朝就这样结束了？"
 roc_return.72.t: "中华民国提议新条约"
 roc_return.72.d: "南京提出以一份新的互不侵犯条约，取代 1961 年的《中朝友好合作互助条约》。新条约不再包含军事同盟条款，中国的无偿援助也将改为正常贸易。平壤的领导层意识到，北京的保护伞已经不复存在，他们必须决定是否接受这份现实的安排。"
 roc_return.72.a: "接受新条约。"
 roc_return.72.b: "拒绝，我们不需要南京的施舍。"
 roc_return.73.t: "平壤签约"
 roc_return.73.d: "朝鲜接受了新的互不侵犯条约，双方代表在丹东签署了文件。鸭绿江两岸，从今以后只有贸易，没有同盟；中朝友谊大桥上的货车往来如织，新义州的工厂也开始接单。一个稳定的邻居，对两国都是好事。"
 roc_return.73.a: "一个稳定的邻居。"
 roc_return.74.t: "中韩联军越过三八线"
 roc_return.74.d: "中华民国与大韩民国联合宣布对朝鲜开战。中韩联军从三八线与鸭绿江两个方向同时推进。七十年前的朝鲜战争中，中国军队站在三八线的另一边。"
 roc_return.74.a: "历史又转了一个弯。"
 roc_return.75.t: "朝鲜半岛统一"
 roc_return.75.d: "平壤解放，朝鲜半岛在大韩民国的旗帜下重新统一。离散了七十年的家庭在板门店重逢，非军事区的铁丝网被一段段拆除。中华民国国军将继续驻守半岛，保障新生的统一韩国；东北亚的格局，从此彻底改变。"
 roc_return.75.a: "分裂了七十年的民族，终于团圆。"
 roc_return.76.t: "中华民国国军进驻"
 roc_return.76.d: "第一批中华民国国军部队抵达汉城，与韩国国军共同守卫三八线。这是 1950 年以来，第一支由中国派来「保卫」韩国的部队；七十年前，中国的志愿军从北方南下，如今青天白日旗的部队站在了另一边。汉城的市民在街头挥舞两国国旗欢迎。"
 roc_return.76.a: "欢迎盟友。"
 roc_return.62.t: "大陆陷入内战"
 roc_return.62.d: "中国大陆爆发内战，中共政权陷入分裂：起义的省份宣布独立，部分军区拒绝服从中央的命令。这是国民政府数十年来等待的机会——还是一个危险的陷阱？贸然出兵，可能让大陆的民众团结在中共的旗帜下；按兵不动，则可能错失良机。"
 roc_return.62.a: "国军即刻渡海干预！"
 roc_return.62.b: "静观其变。"

