 PRC_northeast_base_idea: "东北根据地"
 PRC_northeast_base_idea_desc: "白山黑水之间的革命根据地。东北的重工业与资源成为革命战争的后盾，工厂日夜生产枪炮与弹药；根据地的群众组织严密，政权稳固。"
