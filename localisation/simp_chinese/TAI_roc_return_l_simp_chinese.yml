 roc_return.100.t: "国民大会常会开幕"
 roc_return.100.d: "第 [?TAI_na_term|0] 届国民大会第 [?TAI_na_session|0] 次常会在南京国民大会堂开幕。总统向大会提出施政报告，回顾一年来的政绩，也接受代表们的质询；在野党的代表在台下举牌抗议。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。施政报告的表决结果：[TAI_na_session_result]。"
 roc_return.100.a: "施政报告获得通过。"
 roc_return.100.b: "施政报告遭到否决。"
 roc_return.101.t: "国大代表改选"
 roc_return.101.a: "新一届国民大会即将集会。"
 roc_return.102.t: "国民大会选举总统"
 roc_return.102.d: "依据宪法，总统由国民大会选举产生。新一届国民大会集会，投票选出下一任中华民国总统。会场外聚集了支持各方候选人的民众，会场内的代表们在最后时刻仍在协商与拉票；这一票，将决定国家未来六年的方向。执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。"
 roc_return.102.a: "执政党候选人当选连任。"
 roc_return.102.b: "在野党联合推出的候选人当选。"
 roc_return.90.c: "动员党团，否决罢免案。"
 roc_return.110.t: "议案：年度总预算案"
 roc_return.110.d: "行政院向国民大会提出新年度的中央政府总预算。光复后百废待举，每一笔钱都牵动各方利益：国防、教育、社会福利与大陆重建都在争夺有限的财源，地方代表则要求为家乡多争取一些建设经费。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.110.a: "依多数通过。"
 roc_return.110.b: "与在野党政治协商（让步通过）。"
 roc_return.110.c: "撤回议案。"
 roc_return.111.t: "议案：国防特别预算"
 roc_return.111.d: "国防部要求追加特别预算，用于三军整编与换装：整编前解放军部队、采购新式装备、改善官兵待遇。在野党批评国防开支过高、排挤了民生建设，国防部长则在质询台上强调，统一后的国防不能有任何空窗。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.111.a: "依多数通过。"
 roc_return.111.b: "与在野党政治协商（让步通过）。"
 roc_return.111.c: "撤回议案。"
 roc_return.112.t: "议案：教育经费保障条例"
 roc_return.112.d: "宪法第一百六十四条规定，教育经费不得低于中央预算总额的百分之十五。大陆各省的学校急需重建，农村的教师薪资长期被拖欠，新的课本也需要重新编印；教育界的代表在国大会场外静坐，要求政府兑现宪法的承诺。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.112.a: "依多数通过。"
 roc_return.112.b: "与在野党政治协商（让步通过）。"
 roc_return.112.c: "撤回议案。"
 roc_return.113.t: "议案：地方自治通则"
 roc_return.113.d: "《地方自治通则》赋予各省县自治权限，同时把地方实力派纳入法制轨道：省长与县长由选举产生，地方财政有了法定的来源。支持者说这是化解割据的良方，反对者担心这会让地方诸侯更加坐大。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.113.a: "依多数通过。"
 roc_return.113.b: "与在野党政治协商（让步通过）。"
 roc_return.113.c: "撤回议案。"
 roc_return.114.t: "议案：废止动员戡乱时期临时条款"
 roc_return.114.d: "《动员戡乱时期临时条款》在 1948 年通过，冻结了宪法的诸多条文，在台湾一直实施到 1991 年。废止它，意味着宪政全面恢复、总统的紧急权力受到约束，但也会束缚政府对残余势力的手脚。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.114.a: "依多数通过。"
 roc_return.114.b: "与在野党政治协商（让步通过）。"
 roc_return.114.c: "撤回议案。"
 roc_return.115.t: "议案：大陆重建特别条例"
 roc_return.115.d: "以特别条例统筹大陆各省的基础建设、国企改制与币制转换，并设立专门的重建基金与监督委员会。这是光复后规模最大的一项立法，牵涉数以万亿计的资金；在野党要求加强监督，以免重蹈「接收大员」的覆辙。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.115.a: "依多数通过。"
 roc_return.115.b: "与在野党政治协商（让步通过）。"
 roc_return.115.c: "撤回议案。"
 roc_return.116.t: "议案：边疆民族自治法"
 roc_return.116.d: "依「五族共和」精神，保障边疆各民族的自治权利与宗教文化：西藏、新疆与内蒙古的自治政府拥有教育、语言与宗教事务的自主权。藏族、维吾尔族与蒙古族的代表在大会上发言，这是他们第一次在国家的议会里为自己的民族发声。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.116.a: "依多数通过。"
 roc_return.116.b: "与在野党政治协商（让步通过）。"
 roc_return.116.c: "撤回议案。"
 roc_return.117.t: "议案：司法改革法案"
 roc_return.117.d: "整顿接收时期的贪腐与积案，建立独立的司法体系：设立特别法庭审理接收弊案，增聘法官与检察官清理积压的案件，并改革法官的任用与考核制度。司法界的代表说，没有独立的法院，就没有真正的宪政。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.117.a: "依多数通过。"
 roc_return.117.b: "与在野党政治协商（让步通过）。"
 roc_return.117.c: "撤回议案。"
 TAI_hk_macau_focus_tt: "港澳问题决议已在光复时开放；本国策提供额外的政治点数与稳定度。"
 ### v3.13 国民大会版式与外交扩充
 TAI_national_assembly_category: "国民大会"
 TAI_na_session_mission: "中华民国第[?TAI_na_term|0]届国民大会第[?TAI_na_session_next|0]次常会"
 TAI_na_gui_gov: "执政联盟 [?TAI_na_gov|0]/3000席 [?TAI_na_support_pct|0]%"
