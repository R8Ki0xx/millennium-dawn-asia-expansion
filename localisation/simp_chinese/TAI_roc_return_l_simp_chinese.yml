 ### 事件
 roc_return.1.t: "泛蓝联盟组阁"
 roc_return.1.d: "国民党、亲民党与新党在立法院结成多数联盟，并在一连串的政治角力之后取得了组阁权。泛蓝阵营在 2000 年的分裂中失去了总统大位，如今重新团结起来。新的行政团队誓言恢复中华民国法统、推动国家统一，两岸关系将迎来新的变化。"
 roc_return.1.a: "中华民国万岁！"
 roc_return.2.t: "台北的秘密使者"
 roc_return.2.d: "中华民国派出的秘密使者带来了一个惊人的请求：台北正在考虑在适当时机“光复大陆”，希望华盛顿至少保持默许，最好能在幕后提供支持。\n\n支持这个计划可能把我们拖入与北京的正面冲突；拒绝则可能让台北孤注一掷，或彻底放弃。"
 roc_return.2.a: "我们会……睁一只眼闭一只眼。"
 roc_return.2.b: "绝对不行，维持现状。"
 roc_return.3.t: "华盛顿的默许"
 roc_return.3.d: "密使从华盛顿带回了好消息：美方虽然不会公开表态，但不会阻止我们，并愿意在情报与后勤上提供协助。国务院的官员私下表示，如果大陆爆发动乱，美国乐见一个民主的中国。有了华盛顿的默许，反攻大陆不再只是空谈。"
 roc_return.3.a: "有了美国，我们就有底气。"
 roc_return.4.t: "华盛顿的反对"
 roc_return.4.d: "美方明确表示反对任何改变台海现状的军事行动，并警告台北不要轻举妄动：如果国军主动挑起战争，美国将不会提供任何协助，甚至可能暂停军售。华盛顿的反对让反攻计划蒙上了阴影，但也让一些人下定决心：我们只能靠自己。"
 roc_return.4.a: "我们只能靠自己了。"
 roc_return.5.t: "台北的统一方案"
 roc_return.5.d: "中华民国政府正式向我们提出了一份统一方案：在中华民国宪法的架构下，两岸合并为一个民主的中国，现政府和平移交权力，并保证不对一般党员与官员进行清算。\n\n若在过去，这样的提议只会被当作笑话。但时局已经变了。"
 roc_return.5.a: "为了中国的未来，我们接受。"
 roc_return.5.b: "荒谬！台湾是中国不可分割的一部分。"
 roc_return.6.t: "北京接受统一！"
 roc_return.6.d: "令全世界震惊的消息：北京接受了我们的统一方案！在内外交困之下，中共中央决定以和平的方式交出政权，换取党员的人身安全与合法的政治地位。权力移交将在未来几个月内完成，青天白日满地红旗即将在天安门城楼上升起。"
 roc_return.6.a: "中华民国万岁！中国万岁！"
 roc_return.7.t: "北京拒绝统一"
 roc_return.7.d: "北京断然拒绝了我们的统一方案，并在声明中重申「绝不承诺放弃使用武力」。东部战区随即在台湾海峡举行实弹演习，导弹落在台湾外海。和平的大门暂时关上了，两岸关系重新回到了剑拔弩张的状态。"
 roc_return.7.a: "那就只能兵戎相见。"
 roc_return.9.t: "国军光复南京"
 roc_return.9.d: "中华民国国军今日进入南京城。在中山陵前，国军将士向国父灵寝致敬，青天白日满地红旗再度飘扬在这座民国故都的上空。总统府门前聚集了数十万民众，许多老人泪流满面；距离 1949 年 4 月国民政府撤离南京，已经过去了七十多年。"
 roc_return.9.a: "历史的轮回。"
 roc_return.10.t: "中华民国的统一提议"
 roc_return.10.d: "南京政府向我们发来照会，指出中华民国从未承认 1946 年的外蒙古独立公投，并提议蒙古以高度自治地区的身份回归中华民国：保留议会、语言与文化，并获得大量的经济援助。乌兰巴托的街头议论纷纷，国家的前途就在这一念之间。"
 roc_return.10.a: "我们接受。"
 roc_return.10.b: "蒙古是一个独立国家！"
 roc_return.11.t: "乌兰巴托拒绝回归"
 roc_return.11.d: "蒙古政府拒绝了我们的提议，并宣布进入战备状态。大呼拉尔以全票通过决议，重申蒙古是一个独立的主权国家；乌兰巴托的广场上，数万名民众举着国旗高呼「独立」。和平的道路已经走到尽头，剩下的只有武力。"
 roc_return.11.a: "他们会后悔的。"
 roc_return.12.t: "外蒙古回归"
 roc_return.12.d: "蒙古政府接受了我们的提议，外蒙古将作为自治地区回归中华民国。乌兰巴托的议会大厦前，蒙古国旗与青天白日满地红旗并排升起；自 1921 年以来，漠北第一次重新成为中华民国的一部分，秋海棠叶补上了最大的一块缺口。"
 roc_return.12.a: "漠北重归版图。"
 roc_return.13.t: "回归中华民国？"
 roc_return.13.d: "中华人民共和国已不复存在，南京的中华民国政府向我们发出邀请：回归中华民国，并在新宪法下继续享有高度自治。我们的法律、货币与生活方式都将得到保障，期限是永久。市民们必须决定，是接受这份承诺，还是走自己的道路。"
 roc_return.13.a: "我们接受。"
 roc_return.13.b: "我们选择自己的道路。"
 roc_return.14.t: "中华民国光复神州"
 roc_return.14.d: "从金陵到燕京，中华民国的旗帜终于飘扬在整个中国大陆。半个多世纪以来，这被许多人视为不可能实现的梦想。然而，十三亿人口、截然不同的社会制度与漫长的隔阂，正等待着新政府去面对。"
 roc_return.14.a: "一个新时代开始了。"
 roc_return.15.t: "中华民国重返联合国"
 roc_return.15.d: "联合国大会今日通过决议，承认中华民国政府为中国在联合国的唯一合法代表。时隔数十年，中华民国重新坐回了安理会常任理事国的席位。当青天白日满地红旗在纽约联合国总部升起时，许多外交官起立鼓掌；1971 年退出联合国的屈辱，终于成为历史。"
 roc_return.15.a: "历史翻开了新的一页。"
 roc_return.16.t: "秋海棠叶"
 roc_return.16.d: "随着外蒙古与边疆各地的回归，中华民国宪法所规定的「固有疆域」在实际上得到了恢复。那片形如秋海棠叶的版图，重新出现在世界地图上。各国的地图出版社连夜修改地图，而在台湾长大的几代人终于发现，课本上的地图并不是幻想。"
 roc_return.16.a: "山河一统。"
 roc_return.17.t: "台北请求美军参战"
 roc_return.17.d: "中华民国正与中华人民共和国交战，台北正式请求我们兑现默许的承诺，直接出兵参战。国会的鹰派要求支援民主的盟友，五角大楼则警告与核大国开战的风险；总统必须在美国的信誉与美军士兵的生命之间作出选择。"
 roc_return.17.a: "美国与盟友站在一起。"
 roc_return.17.b: "我们不会为台北打仗。"
 roc_return.18.t: "美国参战！"
 roc_return.18.d: "华盛顿宣布对北京宣战，美军第七舰队已开进台湾海峡，关岛与冲绳的战机进入一级战备。这是 1950 年以来，美军第一次与中国军队正面交战；有了美国的参战，国军的反攻将获得强大的海空支援，胜利在望。"
 roc_return.18.a: "胜利在望！"
 roc_return.19.t: "美国拒绝参战"
 roc_return.19.d: "美方表示可以继续提供情报与物资，但不会直接出兵。白宫的发言人说，美国支持台湾的自卫，但不会让美军士兵卷入一场中国人之间的内战。这让国军失去了最强大的外援，但至少美国的武器与情报仍会源源不断地送来。"
 roc_return.19.a: "可以理解。"
 roc_return.20.t: "港澳回归"
 roc_return.20.d: "[From.GetName]接受了我们的邀请，正式回归中华民国。特区的旗帜与青天白日满地红旗并排升起，市民们在街头庆祝。高度自治的承诺将以宪法的形式写下，没有期限；这是对一国两制最好的回答。"
 roc_return.20.a: "欢迎回家。"
 roc_return.21.t: "[From.GetName]拒绝回归"
 roc_return.21.d: "[From.GetName]拒绝了我们的邀请，坚持走自己的道路。当地的政治人物宣称，他们不愿意从一个政权的统治下转到另一个政权；国际社会呼吁双方以对话解决分歧。南京必须决定：尊重他们的选择，还是以其他方式解决问题。"
 roc_return.21.a: "尊重他们的选择。"
 roc_return.21.b: "这不是他们能决定的。"

 ### v2/v3
 TAI_economic_miracle_idea: "第二次经济奇迹"
 TAI_economic_miracle_idea_desc: "台湾经济再一次起飞。科技产业的成功让工厂的产能与研发能力同步提升，出口屡创新高；继 1960 年代之后，台湾再一次成为世界经济的奇迹。"
 TAI_mature_democracy_idea: "民主深化"
 TAI_mature_democracy_idea_desc: "民主制度在台湾深深扎根。政党轮替成为常态，选举结果受到各方尊重，公民社会活跃；成熟的民主让政府的施政更具正当性，社会也更加稳定。"
 TAI_pan_blue_unity_idea: "泛蓝整合"
 TAI_pan_blue_unity_idea_desc: "国亲两党携手合作。连战与宋楚瑜捐弃前嫌，泛蓝阵营在立法院与地方选举中统一提名、统一行动；团结的在野力量让政府的施政更有底气。"
 TAI_culture_renaissance_idea: "中华文化复兴"
 TAI_culture_renaissance_idea_desc: "台湾是中华文化的守护者。正体字、故宫国宝与传统节庆，让台湾成为海内外华人心目中中华文化的正统所在；这份文化自信，也凝聚了社会的向心力。"
 TAI_war_economy_idea: "战时经济体制"
 TAI_war_economy_idea_desc: "民间产业全面支援国防。电子厂生产飞弹的导引系统，纺织厂缝制军服，汽车厂改装军用车辆；兵工厂的产能大幅提升，但民生消费品的供应也因此吃紧。"
 TAI_mobilization_idea: "全面动员"
 TAI_mobilization_idea_desc: "后备军人全面归建。两百多万后备军人回到部队，国军的兵力在数天内倍增；全社会进入战时状态，民气高昂，但大量的劳动力离开工厂，生产效率受到影响。"
 TAI_northern_expedition_idea: "北伐"
 TAI_northern_expedition_idea_desc: "国军再度挥师北伐！1926 年的北伐军以惊人的速度横扫长江流域；如今的北伐军继承了这份传统，以装甲与空中力量快速推进，目标直指北平。"
 TAI_mobile_defense_idea: "机动防卫"
 TAI_mobile_defense_idea_desc: "滩岸决胜、纵深防御。国军以机动部队守卫海岸，在敌军登陆的最初时刻发动反击；即使滩头失守，纵深的防线也能让敌军步步付出代价。"
 TAI_defense_autonomy_idea: "国防自主"
 TAI_defense_autonomy_idea_desc: "关键武器自主研发与生产。国防工业不再依赖外国的零件与授权，兵工厂的生产效率与产能稳步提升；即使外国实施禁运，国军的补给也不会中断。"
 TAI_wto_member_idea: "WTO 成员"
 TAI_wto_member_idea_desc: "以台澎金马个别关税领域的身份加入世贸组织。台湾的产品以更低的关税进入世界市场，与各国的贸易往来更加频繁；进口的消费品也让民众的生活更加便利。"
 TAI_de_facto_alliance_idea: "事实同盟"
 TAI_de_facto_alliance_idea_desc: "没有条约之名，却有同盟之实。美国的技术转移、军事训练与情报分享，让国军的研发与战力稳步提升；民众相信，台湾在危急时刻不会孤立无援。"
 TAI_balanced_powers_idea: "均权制度"
 TAI_balanced_powers_idea_desc: "中央与地方均权。全国一致的事务归中央、因地制宜的事务归地方，各省有了自己的施政空间；地方的积极性被调动起来，割据的风险却也被制度所约束。"
 TAI_five_yuan_idea: "五院体制"
 TAI_five_yuan_idea_desc: "五权分立、相互制衡。行政、立法、司法、考试与监察五院各司其职，考试院确保公务员的专业，监察院弹劾失职的官员；这套独特的宪政设计让政府更加清廉与高效。"
 TAI_open_society_idea: "开放社会"
 TAI_open_society_idea_desc: "言论与新闻自由。报禁解除、审查废止，各种思想在媒体与网络上自由竞争；开放的社会激发了创新与研究，但突如其来的众声喧哗，也让社会一度陷入不安。"
 TAI_cultural_renaissance_idea: "中华文化复兴"
 TAI_cultural_renaissance_idea_desc: "古迹、庙宇与传统节庆正在复兴。修复后的孔庙与宗祠重新成为社区的中心，清明、端午与中秋的习俗重回日常生活；文化的复兴让民众找回了失落的认同，社会更加安定。"
 TAI_free_movement_idea: "自由迁徙"
 TAI_free_movement_idea_desc: "农民可以自由进城工作与生活。废除户籍之后，农民工的子女可以在城市上学、就医，城市的建设速度与人口都快速增长；社会公平感的提升，也让整个国家更加稳定。"
 TAI_national_identity_idea: "中华民族认同"
 TAI_national_identity_idea_desc: "我们都是中华民国国民。无论来自台湾还是大陆、属于哪一个民族，共同的宪法与民主制度把所有人凝聚在一起；抵抗新政府的声音越来越少，国家的向心力日益增强。"
 TAI_five_races_idea: "五族共和"
 TAI_five_races_idea_desc: "中华民国是各民族共同的国家。少数民族的语言、宗教与文化受到宪法的保护，各族人民在议会中拥有自己的代表；边疆的抵抗运动逐渐平息，各地对新政府的认同不断提高。"
 TAI_world_factory_idea: "世界工厂"
 TAI_world_factory_idea_desc: "全球最大的制造业国家。统一后的中国拥有世界最完整的产业链，从芯片、汽车到造船无所不包；工厂的产能与效率达到了前所未有的高度，「中国制造」行销全世界。"
 TAI_tax_reform_idea: "统一税制"
 TAI_tax_reform_idea_desc: "两岸税制统一、税基扩大。新的税制以所得税与营业税为主体，简化了繁琐的税目，打击了逃漏税；国库的收入稳步增加，地方政府也不必再靠卖地维生。"
 TAI_strong_currency_idea: "强势国币"
 TAI_strong_currency_idea_desc: "国币是亚洲最重要的储备货币之一。币值稳定让国际投资者与贸易伙伴信心十足，进口商品更加便宜，政府的税收也因经济的繁荣而增加。"
 TAI_infrastructure_boom_idea: "实业计划"
 TAI_infrastructure_boom_idea_desc: "全国性的基础建设热潮。国父《实业计划》中的铁路、港口与水利工程一一动工，全国各地的工地日夜施工；交通与能源网络的完善，为经济的腾飞打下了坚实的基础。"
 TAI_social_security_idea: "全民健保与劳保"
 TAI_social_security_idea_desc: "人人看得起病，老有所养。全民健保与劳工保险覆盖全国，看病与养老不再是压在普通家庭身上的大山；社会的安全感提升，人口也稳定增长。"
 TAI_theater_command_idea: "五大战区"
 TAI_theater_command_idea_desc: "战区主战、军种主建。五大战区负责作战指挥，各军种负责部队的建设与训练；新的体制让作战计划的制定更加迅速，部队的组织也更加严整。"
 TAI_professional_army_idea: "职业化国军"
 TAI_professional_army_idea_desc: "精锐的职业军队。募兵制让士兵把从军当作一份职业，长期服役的士官积累了丰富的经验；新兵的训练时间缩短，部队的组织度与实战经验却稳步提升。"
 TAI_combined_arms_idea: "合成化作战"
 TAI_combined_arms_idea_desc: "合成营、合成旅。步兵、装甲、炮兵与工兵在同一个营里协同作战，营长可以直接呼叫火力支援；国军在进攻与防御时都能发挥出合成部队的威力。"
 TAI_nuclear_deterrent_idea: "核威慑"
 TAI_nuclear_deterrent_idea_desc: "统一中国安全的最后保障。保留下来的核武库以「不首先使用」为原则，只用于报复性的打击；它让任何潜在的敌人都不敢轻举妄动，民众也因此对国防充满信心。"
 TAI_nuclear_free_idea: "无核中国"
 TAI_nuclear_free_idea_desc: "世界上第一个主动放弃核武的大国。国际原子能机构的检查人员证实，所有的核弹头都已销毁；这一决定赢得了全世界的尊重，各国对中华民国的好感与日俱增。"
 TAI_air_dominance_idea: "东亚制空权"
 TAI_air_dominance_idea_desc: "东亚上空由中华民国空军主宰。隐形战机、预警机与空中加油机组成完整的空战体系，飞行员的训练与实战经验冠于亚洲；任何对手想要争夺制空权，都必须付出惨重的代价。"
 TAI_world_class_military_idea: "世界一流国军"
 TAI_world_class_military_idea_desc: "现代化、职业化、国家化的国民革命军。陆军的组织、海军的远洋能力与空军的科技水平都已跻身世界一流；这支军队效忠宪法、保卫国家，是统一中国最坚实的后盾。"
 TAI_trade_superpower_idea: "贸易大国"
 TAI_trade_superpower_idea_desc: "全球最大的贸易国。中国的进出口占世界贸易的六分之一，各国都希望与这个庞大的市场做生意；贸易伙伴的好感让外交更加顺利，工业的建设也因外资的涌入而加速。"
 TAI_sino_american_alliance_idea: "中美同盟"
 TAI_sino_american_alliance_idea_desc: "两个民主大国携手维护太平洋的和平。美国的技术转移、联合军演与情报分享，让国军的科研与战力稳步提升；民众相信，有美国作为盟友，统一的中国在世界上不会孤立。"
 TAI_independent_diplomacy_idea: "独立自主"
 TAI_independent_diplomacy_idea_desc: "中国人的事，由中国人自己决定。不结盟、不依附任何大国，中华民国在国际事务中保持独立的判断；这种自主的姿态赢得了国内民众的支持，政府的施政也更有底气。"
 TAI_asia_leader_idea: "亚洲领袖"
 TAI_asia_leader_idea_desc: "亚洲的事务由亚洲人主导。中华民国以经济、文化与外交的影响力团结亚洲各国，在区域组织中扮演领导者的角色；周边国家对中国的好感与贸易往来都与日俱增。"
 TAI_world_power_idea: "世界强国"
 TAI_world_power_idea_desc: "统一、民主、繁荣的世界强国。中华民国在联合国、经济与科技领域都举足轻重，国内政治稳定、民心团结；全世界都承认，中国已经重新站上了世界舞台的中央。"
 TAI_kmt_government_idea: "国民党政府"
 TAI_kmt_government_idea_desc: "中国国民党执政。百年老店凭借光复的声望与完整的组织，在全国推行三民主义的施政；政府稳定、决策有力，民众对国防与统一的信心也随之提升。"
 TAI_kmt_era_idea: "三民主义治国"
 TAI_kmt_era_idea_desc: "中国国民党的百年理想终于在全中国实现。民族独立、民权伸张、民生富足：三民主义不再只是课本里的口号，而是治理一个十四亿人口大国的实际纲领。"
 TAI_dp_government_idea: "中国民主党政府"
 TAI_dp_government_idea_desc: "自由派执政。中国民主党政府推动人权、法治与开放社会，学术与言论的自由激发了社会的创造力；民主的价值在全国深入人心。"
 TAI_dp_free_market_idea: "自由市场"
 TAI_dp_free_market_idea_desc: "价格与资源由市场决定。取消管制与审批之后，企业的效率快速提升，民营经济蓬勃发展；消费品的供应更加充足，物价也更加合理。"
 TAI_dp_antitrust_idea: "反垄断"
 TAI_dp_antitrust_idea_desc: "公平竞争的市场秩序。拆分垄断性的国企与财团之后，中小企业获得了与大企业竞争的机会，市场更加有活力；消费者与劳动者都从竞争中获益。"
 TAI_liberal_china_idea: "自由中国"
 TAI_liberal_china_idea_desc: "自由、民主、法治的中国。雷震与殷海光梦想的那个中国终于实现：言论自由、司法独立、市场开放，世界上的自由民主国家都把中国视为志同道合的伙伴。"
 TAI_sd_government_idea: "社会民主党政府"
 TAI_sd_government_idea_desc: "社会民主派执政。中国社会民主党在市场经济与社会公正之间寻求平衡，工会、劳工与农民成为政府最坚定的支持者；社会更加安定，施政也更有群众基础。"
 TAI_sd_welfare_idea: "福利国家"
 TAI_sd_welfare_idea_desc: "从摇篮到坟墓的社会安全网。育儿、教育、医疗、失业与养老都有国家的保障，年轻夫妇更愿意生养孩子；但庞大的福利开支，也让政府的财政负担日益沉重。"
 TAI_social_china_idea: "社会公正的中国"
 TAI_social_china_idea_desc: "民生主义与社会民主主义的结合。贫富差距明显缩小，每一个国民都能分享经济发展的成果；社会安定、人口增长，中国成为一个既富裕又公平的国家。"
 TAI_coalition_government_idea: "大联合政府"
 TAI_coalition_government_idea_desc: "各大政党联合执政。没有任何一党能够独断专行，重大决策都需要各党协商；政局因此更加稳定，但决策的过程也变得缓慢，政府的行动力受到限制。"
 TAI_grand_compromise_idea: "历史性的大和解"
 TAI_grand_compromise_idea_desc: "蓝与绿、台与陆、左与右的共识。历史性的和解让政党之间不再互相敌视，国会的辩论理性而务实；整个国家前所未有地团结，政府施政也得到了广泛的支持。"
 TAI_nko_reform_idea: "朝鲜改革开放"
 TAI_nko_reform_idea_desc: "在中华民国的帮助下，朝鲜开始了渐进的改革开放。农民可以在自留地上种植、在市场上出售粮食，出口加工区里的工厂开始接单；平壤的政权在改革中逐渐稳定下来。"
 TAI_korea_peace_idea: "半岛和平"
 TAI_korea_peace_idea_desc: "朝鲜半岛的和平机制由中华民国担保。停战协定被和平条约取代，非军事区逐步裁撤；半岛的和平让东北亚的贸易更加繁荣，南京在国际上的威望也大为提升。"
 TAI_nko_transition_idea: "过渡政府"
 TAI_nko_transition_idea_desc: "政变之后，新政府仍在巩固权力。金氏家族的残余势力与忠于旧政权的部队仍在暗中活动，平壤的局势依然紧张；新政府的威信与施政能力都有待建立。"
 TAI_nko_rebuild_idea: "重建北韩"
 TAI_nko_rebuild_idea_desc: "中华民国的援助正在重建北韩的粮食、电力与道路。运粮船与工程队源源不断地抵达，工厂与水电站重新运转；饥荒的阴影逐渐散去，人口也开始恢复增长。"
 TAI_roc_forces_korea_idea: "驻韩国军"
 TAI_roc_forces_korea_idea_desc: "中华民国国军驻守朝鲜半岛。驻韩部队与韩国国军共同训练、共同巡逻，在三八线上积累了宝贵的经验；这支部队也是两国同盟最直接的象征。"
 TAI_roc_forces_in_korea_idea: "中华民国驻韩部队"
 TAI_roc_forces_in_korea_idea_desc: "中华民国国军与韩国国军共同守卫三八线。驻军加强了半岛的防御，任何来自北方的攻击都将同时面对两国的军队；这份承诺也让国内民众对国家的国际地位感到自豪。"
 TAI_nuclear_concern: "中国核武威胁"
