 TAI_dec_han_kuang_drill: "年度汉光演习"
 TAI_dec_han_kuang_drill_desc: "三军联合实兵演习，检验防卫作战计划。年度汉光演习模拟解放军的全面进犯，国军在演习中发现问题、修正计划，部队的实战经验与两岸的军力平衡都因此改善。"
 TAI_dec_us_arms_package: "对美军购专案"
 TAI_dec_us_arms_package_desc: "向美方采购一批新式武器装备：战机零件、防空飞弹与精准弹药。每一笔军售都要经过美国国会的审查，交货往往需要数年；但它们能有效缩小两岸的军力差距。"
 TAI_dec_call_reservists: "召集后备军人"
 TAI_dec_call_reservists_desc: "教召后备军人，充实部队员额。后备军人放下工作回到营区，接受为期两周的训练；部队的员额与战备得到补充，但民众的工作与生活也受到一定的影响。"
 TAI_dec_anti_vote_buying: "查察贿选"
 TAI_dec_anti_vote_buying_desc: "检调单位全面查察贿选与黑道介入选举。法务部调查局与地检署在选前布下天罗地网，查获的贿选案件一律从重量刑；黑金政治的空间被压缩，但地方派系的反弹也让政局短暂动荡。"
 TAI_dec_mop_up_remnants: "清剿解放军残部"
 TAI_dec_mop_up_remnants_desc: "对拒绝整编的解放军残部发动清剿作战。这些部队盘踞在偏远的山区与边境，抢劫物资、袭击车队；清剿行动让部队获得了实战经验，但长期的作战也消磨着民众对战争的耐心。"
 TAI_dec_relief_program: "发放救济物资"
 TAI_dec_relief_program_desc: "向光复区发放粮食、药品与救济金，争取民心。战乱与政权更迭让许多家庭陷入困境，及时的救济能让民众感受到新政府的善意；这笔开支不小，但民心比任何东西都珍贵。"
 TAI_dec_purge_carpetbaggers: "整肃接收大员"
 TAI_dec_purge_carpetbaggers_desc: "严查接收过程中的贪污与侵占，以儆效尤。1945 年的「五子登科」让国民政府在大陆失去了民心；这一次，监察院与调查局联手查办，贪污的接收官员一律撤职查办，公开审判。"
 TAI_dec_local_autonomy_pilot: "地方自治试点"
 TAI_dec_local_autonomy_pilot_desc: "在部分省份试行县市长民选，以自治化解割据。地方实力派如果能通过选举获得正当性，就不必以武力对抗中央；但选举也可能让他们的地位更加稳固，短期内难免引起动荡。"
 TAI_dec_price_stabilization: "平抑物价"
 TAI_dec_price_stabilization_desc: "动用外汇存底与战略储备平抑物价。币制改革与经济转轨让物价剧烈波动，粮食与燃油的价格一日数变；政府抛售储备、管制囤积，避免重蹈 1948 年金圆券的覆辙。"
 TAI_dec_joint_exercise: "三军联合大演习"
 TAI_dec_joint_exercise_desc: "在华北平原与东海举行三军联合大演习。来自台湾与大陆的部队第一次在同一场演习中协同作战，参谋本部检验新的指挥体系；这场演习也是向周边国家展示统一后国军实力的一次机会。"
 TAI_military_readiness_category: "国军整备"
 TAI_military_readiness_category_desc: "整军备战，消除国军的结构性弱点。台湾时期的国军面临两岸军力失衡、兵役制度转型与黑金政治渗透等问题；这些决议以演习、军购、教召与查察贿选，逐步改善国军的战备。"
 TAI_reconstruction_category: "光复区治理"
 TAI_reconstruction_category_desc: "光复之后的大陆百废待举：清剿残部、安定民心、整肃吏治。政府必须同时处理解放军残部、物价飞涨、接收腐败与地方割据，每一个问题都可能动摇新政权的根基。"
 Juche: "主体思想"
 Juche_desc: "主体思想：朝鲜劳动党的官方意识形态，以领袖为核心的世袭共产主义体制。"

