 TAI_na_mark_ally: " §Y(结盟)§!"
 TAI_sun_yatsen_institute_idea: "中山学院"
 TAI_sun_yatsen_institute_idea_desc: "遍布全球的中山学院推广中文与中华文化。学院以开放的学术环境与正体字教学著称，吸引了各国的学生与学者；中华民国的软实力在全世界稳步提升。"
 TAI_un_reform_idea: "联合国改革"
 TAI_un_reform_idea_desc: "中华民国在联合国的影响力与日俱增。安理会改革的方案由南京主导，亚洲与发展中国家的代表性大幅提升；各国在重大国际议题上都希望听到中华民国的意见。"
 TAI_space_partner_idea: "太空伙伴"
 TAI_space_partner_idea_desc: "与美国合作的太空与尖端科技计划。中华民国的科学家参与国际空间站与登月计划，与美国的研究机构共享数据与技术；太空合作带动了材料、电子与计算机等领域的研发进展。"
 TAI_trans_pacific_idea: "跨太平洋伙伴"
 TAI_trans_pacific_idea_desc: "高标准的环太平洋自由贸易区。关税的降低与规则的统一，让中国的产品更容易进入美洲与大洋洲的市场；贸易伙伴的好感提升，外资的流入也加快了工业的建设。"
 TAI_g8_member_idea: "九国集团成员"
 TAI_g8_member_idea_desc: "中华民国是世界主要工业国俱乐部的一员。在九国集团的峰会上，南京与华盛顿、东京、柏林共商世界经济的走向；国际地位的提升让政府施政更有底气，贸易伙伴也更加信任中国。"
 TAI_energy_security_idea: "能源安全"
 TAI_energy_security_idea_desc: "多元的能源进口渠道保障了工业的运转。中亚的管道、西伯利亚的油气与中东的油轮，让中国不再依赖单一的能源来源；即使某条航道被封锁，工厂也不会停工。"
 TAI_cjk_fta_idea: "中日韩自由贸易区"
 TAI_cjk_fta_idea_desc: "东亚三大经济体的自由贸易区。中日韩三国的产业链深度整合，半导体、汽车与机械的零部件在三国之间自由流动；东亚的经济合作进入了新的阶段。"
 TAI_south_south_idea: "南南合作"
 TAI_south_south_idea_desc: "中华民国是发展中国家的领头羊。南南合作基金为非洲、拉美与南亚的发展中国家提供援助与贷款，赢得了第三世界的友谊；中国在国际上的道义号召力日益增强。"
 TAI_global_chinese_network_idea: "全球华商网络"
 TAI_global_chinese_network_idea_desc: "遍布全球的华人商会为国家带来资金与人脉。从新加坡、吉隆坡到旧金山与温哥华，华商网络把海外的资本与市场机会带回祖国；侨资企业成为税收的重要来源。"
 TAI_maritime_china_idea: "海洋中国"
 TAI_maritime_china_idea_desc: "中国的未来在海洋。港口、航运与造船成为国家战略产业，中国的商船队与造船能力冠于全球；海军的航速与机动能力也因造船业的发展而大幅提升。"
 TAI_blue_water_idea: "蓝水外交"
 TAI_blue_water_idea_desc: "航母编队是中华民国最有力的外交名片。舰队频繁出访世界各地的港口，海军官兵在一次次的远航中积累经验；为了维持这支舰队，造船厂的产能也大幅扩张。"
 TAI_south_asia_partner_idea: "南亚伙伴"
 TAI_south_asia_partner_idea_desc: "与南亚各国的自由贸易。孟加拉的成衣、巴基斯坦的棉纱与斯里兰卡的茶叶进入中国市场，中国的机械与电子产品也大量销往南亚；双方的贸易往来日益密切。"
 TAI_study_abroad_idea: "留学归国潮"
 TAI_study_abroad_idea_desc: "学成归国的留学生投身国家建设。在欧美名校学成的年轻人带回了先进的知识与管理经验，在大学、企业与政府中担任要职；人才的回流让国家的科研与施政都更上一层楼。"
 TAI_olympic_glory_idea: "奥运光环"
 TAI_olympic_glory_idea_desc: "南京奥运会让全世界重新认识了中国。开幕式上，青天白日满地红旗在紫金山下升起，中华民国的运动员在主场赢得了一枚又一枚金牌；民族的自豪感与团结前所未有。"
 TAI_diplo_partner: "外交伙伴"
 TAI_diplo_rival: "外交摩擦"
 roc_return.130.t: "南京申奥成功"
 roc_return.130.d: "国际奥委会主席宣布：夏季奥林匹克运动会的主办城市是——中华民国南京！紫金山下一片欢腾，新街口的人群彻夜狂欢。这是中华民国第一次主办奥运会；1932 年刘长春孤身赴洛杉矶参赛的往事，在这一刻被许多人重新提起。"
 roc_return.130.a: "让世界见证中国的重生！"
 roc_return.131.t: "九国集团"
 roc_return.131.d: "八国集团领袖峰会一致同意邀请中华民国加入，八国集团从此成为九国集团。在峰会的合影中，中华民国总统站在了中央的位置；这是中国第一次以民主国家的身份，与西方主要工业国平起平坐。"
 roc_return.131.a: "中国重回世界舞台的中心。"
 roc_return.132.t: "中印边界谈判"
 roc_return.132.d: "中印两国代表在新德里展开边界谈判。印方愿以麦克马洪线为基础，换取中方承诺不在藏南问题上动武，并开放边境贸易与朝圣通道。国内的民族主义者强烈反对放弃藏南，但与印度的和平，或许比几块山地更有价值。"
 roc_return.132.a: "签署边界协定。"
 roc_return.132.b: "谈判破裂。"
 roc_return.133.t: "上海世博会开幕"
 roc_return.133.d: "黄浦江两岸，两百多个国家与国际组织的展馆争奇斗艳。中国馆的「东方之冠」高高耸立，台湾馆与大陆各省的展馆比邻而立。半年间将有七千万人次入园参观，世界第一次在这里看到统一后的中国。"
 roc_return.133.a: "城市，让生活更美好。"
 TAI_host_apec: "主办亚太经合组织峰会"
 TAI_host_apec_desc: "在上海主办亚太经合组织领袖峰会，向世界展示光复后的新中国。二十一位领导人穿着中式唐装合影，外滩的灯光彻夜不熄；这是中华民国第一次以完整的主权身份出席 APEC，过去台湾只能派遣「领袖代表」。"
 TAI_olympic_bid: "申办奥运"
 TAI_olympic_bid_desc: "南京申办夏季奥林匹克运动会，让全世界见证中华民国的重生。1932 年，刘长春代表中华民国孤身参加洛杉矶奥运；台湾的选手长年只能以「中华台北」的名义出赛。如今，青天白日旗将在自己的主场升起。"
 TAI_world_expo: "上海世博会"
 TAI_world_expo_desc: "「城市，让生活更美好」——上海世界博览会将吸引七千万人次参观。黄浦江两岸的展馆展示着两岸统一后的科技与文化成就；台湾馆与大陆各省的展馆比邻而立，参观者在同一天里就能走遍整个中国。"
 TAI_sun_yatsen_institutes: "中山学院"
 TAI_sun_yatsen_institutes_desc: "在全球设立「中山学院」，推广中文、中华文化与三民主义，取代饱受争议的孔子学院。中山学院以正体字与简体字并教，聘用独立的学者，不受政府的政治审查；它要让世界认识一个自由的中国文化。"
 TAI_overseas_chinese_return: "侨务回归"
 TAI_overseas_chinese_return_desc: "号召五千万海外华人回国投资、定居与参与建设。辛亥革命时，华侨是「革命之母」，出钱出力；如今侨委会推出双重国籍、投资优惠与人才计划，硅谷的工程师与伦敦的金融家纷纷回国。"
 TAI_study_abroad: "留学生计划"
 TAI_study_abroad_desc: "公费选派大陆青年赴欧美名校深造，学成归国服务。清末的庚款留学生造就了胡适、竺可桢与赵元任那一代学者；如今新的留学计划每年选派数万名学生，培养民主中国所需的法律、经济与科学人才。"
 TAI_global_media: "国际媒体"
 TAI_global_media_desc: "成立全球中文与英文电视网，让世界听见南京的声音。它不是政府的宣传喉舌，而是以 BBC 为榜样的公共媒体，由独立的董事会管理；世界各地的观众第一次看到一个可以批评自己政府的中国电视台。"
 TAI_un_reform: "联合国改革"
 TAI_un_reform_desc: "推动安理会改革，争取由中华民国主导亚洲的常任理事国席位分配。日本、印度都在争取常任理事国席位，过去中共一再阻挠；如今南京以支持改革换取主导权，让联合国更能代表二十一世纪的世界。"
 TAI_mutual_defense_treaty: "中美共同防御条约"
 TAI_mutual_defense_treaty_desc: "将《台湾关系法》升格为正式的中美共同防御条约。1954 年的条约在 1979 年被卡特政府单方面废止，台湾此后只能依靠模糊的承诺；新条约以明文规定双方在遭受攻击时互相援助，美国参议院以压倒性多数批准。"
 TAI_us_military_advisors: "美军顾问团"
 TAI_us_military_advisors_desc: "美军顾问团重返中国，协助国军整编与训练。1951 年至 1979 年，美军顾问团曾在台湾协助国军现代化；如今顾问团的规模扩大十倍，进驻南京、北平与广州，帮助整编前解放军部队、推行北约式的训练与后勤。"
 TAI_space_cooperation: "太空与科技合作"
 TAI_space_cooperation_desc: "与美国航天总署合作，参与国际空间站与阿尔忒弥斯登月计划。美国国会曾以「沃尔夫条款」禁止 NASA 与中国合作；随着中共下台，这道禁令被废除，中华民国的航天员与美国、日本、欧洲的同行一起前往月球。"
 TAI_join_g8: "加入八国集团"
 TAI_join_g8_desc: "八国集团扩大为九国集团，中华民国成为世界主要工业国俱乐部的一员。这是中国第一次以民主国家的身份与西方大国平起平坐，商讨世界经济与安全的议题；峰会的东道主宣布：没有中国的 G8 已经不能代表世界。"
 TAI_eu_investment_agreement: "中欧投资协定"
 TAI_eu_investment_agreement_desc: "与欧洲联盟签署全面投资协定，欧洲资本大举进入中国。2020 年中欧投资协定因人权问题被欧洲议会冻结；如今障碍不复存在，德国车企、法国航空与北欧的绿色能源公司纷纷在中国设厂。"
 TAI_lift_arms_embargo: "解除欧盟武器禁运"
 TAI_lift_arms_embargo_desc: "一九八九年针对中共的武器禁运理应随着中共下台而解除。六四之后，欧盟禁止向中国出售武器长达三十多年；如今法国的阵风战机、德国的潜艇技术与意大利的直升机，都向中华民国敞开了大门。"
 TAI_trans_pacific: "跨太平洋伙伴协定"
 TAI_trans_pacific_desc: "与环太平洋各国组成高标准的自由贸易区：中华民国正式加入 CPTPP，并推动美国重返。劳工、环保与知识产权的高标准，过去是中共无法接受的门槛，如今却成为民主中国的优势。"
 TAI_central_asia_five: "中亚五国"
 TAI_central_asia_five_desc: "与哈萨克斯坦、吉尔吉斯、塔吉克、乌兹别克与土库曼建立全面伙伴关系。中亚五国是古丝绸之路的必经之地，也是俄罗斯的传统势力范围；南京以投资、市场与尊重主权的态度，赢得了它们的信任。"
 TAI_energy_pipelines: "中亚能源管道"
 TAI_energy_pipelines_desc: "铺设从里海到上海的石油与天然气管道。土库曼的天然气、哈萨克的石油经由中亚管道直达东部沿海，这条能源动脉绕开了海上咽喉，也让中亚国家减少了对俄罗斯管道的依赖。"
 TAI_xinjiang_border_treaty: "西北边界条约"
 TAI_xinjiang_border_treaty_desc: "与中亚邻国一劳永逸地划定西北边界，换取对边疆分离运动的共同打击。新政府承认中共时代签订的边界条约，以换取邻国不再庇护跨境的武装分子；边境口岸重新开放，边民贸易恢复了往日的热闹。"
 TAI_mongolia_corridor: "中蒙经济走廊"
 TAI_mongolia_corridor_desc: "以铁路与矿业开发串连蒙古高原。从二连浩特到乌兰巴托的铁路改为标准轨，塔温陶勒盖的煤矿与奥尤陶勒盖的铜矿通过新铁路南运；蒙古的经济越来越离不开南方的邻居。"
 TAI_arctic_route: "北极航道"
 TAI_arctic_route_desc: "与俄罗斯合作开发北冰洋航道，开辟通往欧洲的新海路。随着北极海冰融化，北方海航道每年的通航期越来越长；上海到汉堡的航程可以缩短近一万公里，国营航运公司订造了第一批冰级货轮。"
 TAI_eurasian_bridge: "欧亚大陆桥"
 TAI_eurasian_bridge_desc: "从连云港到鹿特丹的铁路大动脉全线贯通。中欧班列每天发出数十列，满载电子产品、汽车零件与服装，十几天就能抵达欧洲；这条新丝绸之路，让内陆城市也成为国际贸易的前沿。"
 TAI_war_reparations: "历史问题与战争赔偿"
 TAI_war_reparations_desc: "1952 年的《中日和约》中，中华民国为了换取日本的外交承认，放弃了对日战争赔偿；1972 年中共也做了同样的事。抗战中数千万人伤亡、无数财产被毁，受害者与遗属从未得到赔偿，如今需要重新面对这段历史。"
 TAI_cjk_fta: "中日韩自由贸易区"
 TAI_cjk_fta_desc: "东亚三大经济体携手，建立世界第三大自由贸易区。中日韩自贸协定谈判从 2012 年开始，因政治分歧拖延了十多年；历史问题有了交代之后，三国在半导体、汽车与农产品的关税上达成了一揽子协议。"
 TAI_ryukyu_question: "琉球问题"
 TAI_ryukyu_question_desc: "琉球的地位从未经中国同意而决定。琉球王国曾是明清两代的藩属，1879 年被日本吞并为冲绳县；1972 年美国把琉球的施政权交给日本时，中华民国曾表示反对。如今南京在国际上重提琉球问题，东京为之震怒。"
 TAI_east_china_sea_gas: "东海油气共同开发"
 TAI_east_china_sea_gas_desc: "与日本在东海中间线两侧共同开发油气田。春晓油气田的争议曾让两国关系紧张多年，2008 年的共同开发共识始终没有落实；中日和解之后，两国石油公司组成合资企业，东海从争端之海变成了合作之海。"
 TAI_korea_relations: "中韩关系"
 TAI_korea_relations_desc: "与大韩民国重建传统友谊，携手推动半岛和平。1992 年韩国与中华民国断交，台北的韩国大使馆降旗，至今仍是许多老一辈外交官的伤心事；如今两国在南京与汉城重新互派大使，经贸、文化与安全合作全面展开。"
 TAI_ne_asia_security: "东北亚安全对话"
 TAI_ne_asia_security_desc: "召集中、日、韩、美、俄五方，建立东北亚常设安全机制。过去的六方会谈因朝鲜核问题而破裂，如今南京以东道主身份重启多边对话：朝鲜的核武、琉球与钓鱼台的争议、北极航道的开发，都在这张谈判桌上。"
 TAI_africa_infrastructure: "非洲基础建设"
 TAI_africa_infrastructure_desc: "为非洲友邦修建铁路、港口与电网。中共时代的「一带一路」在非洲留下了不少债务与争议，新政府改以透明的招标、当地雇工与可持续的贷款条件为原则；蒙内铁路与亚吉铁路的运营也被重新谈判。"
 TAI_latin_america_allies: "拉美友邦"
 TAI_latin_america_allies_desc: "巩固与中美洲及南美洲的传统邦交，拓展巴西、阿根廷与墨西哥的经贸关系。巴拉圭、危地马拉与伯利兹等国曾是台北最忠实的友邦；如今它们与中华民国的关系不再是金援外交，而是平等的伙伴关系。"
 TAI_middle_east_energy: "中东能源外交"
 TAI_middle_east_energy_desc: "与沙特阿拉伯与海湾国家签署长期石油供应协定。中国每年进口的原油有一半来自中东，霍尔木兹海峡的安全关系到整个国家的经济；中华民国在沙特与伊朗之间保持平衡，不选边站。"
 TAI_pacific_islands: "太平洋岛国"
 TAI_pacific_islands_desc: "这些岛国曾是台湾最忠实的邦交国，光复后更要回报。帕劳、马绍尔群岛与图瓦卢在北京的金钱攻势下仍坚持与台北建交，所罗门群岛与基里巴斯则在 2019 年转向北京；如今中华民国为整个太平洋岛国提供气候适应与渔业援助。"
 TAI_caribbean: "加勒比合作"
 TAI_caribbean_desc: "与加勒比各国合作，同时向古巴伸出橄榄枝。圣基茨和尼维斯、圣卢西亚与圣文森特曾是台北在加勒比的友邦；哈瓦那则是中共的老朋友，南京希望以经济援助与医疗合作，让古巴走上改革开放之路。"
 TAI_south_south_fund: "南南合作基金"
 TAI_south_south_fund_desc: "设立百亿美元的南南合作基金，援助发展中国家。基金由国际合作发展基金会管理，重点支持农业、医疗、教育与气候适应，并接受独立审计；中华民国要证明，民主国家的援助比专制国家的贷款更值得信赖。"
 TAI_global_chinese_chamber: "全球华商网络"
 TAI_global_chinese_chamber_desc: "串连东南亚、北美与欧洲的华人商会，形成全球华商网络。世界华商大会每两年召开一次，汇集了数以万计的华人企业家；新的网络以南京为枢纽，让海外华人的资本、技术与人脉成为祖国发展的助力。"
 TAI_taiping_island: "太平岛扩建"
 TAI_taiping_island_desc: "扩建南沙太平岛的机场与港口，使之成为南海的前进基地。太平岛是南沙群岛中最大的天然岛屿，有淡水、有植被，中华民国海军自 1956 年起常驻于此；新的跑道可以起降战斗机，港口可以停泊驱逐舰。"
 TAI_spratly_garrison: "南沙驻军"
 TAI_spratly_garrison_desc: "海军陆战队进驻南沙群岛各主要岛礁：太平岛、美济礁、永暑礁与渚碧礁。中共在 2010 年代填海造岛建成的基地，如今与太平岛共同构成南海的防御网络；驻岛官兵轮换期从半年缩短为三个月。"
 TAI_maritime_silk_road: "海洋中国"
 TAI_maritime_silk_road_desc: "中国的未来在海洋。以港口、航运与造船为纽带，连接东亚、南亚、非洲与欧洲。郑和七下西洋之后，中国曾经背对海洋数百年；如今中华民国的商船队是世界第一，海洋中国的时代正式来临。"
 TAI_scs_joint_development: "南海共同开发"
 TAI_scs_joint_development_desc: "「主权在我、搁置争议、共同开发」，与东盟各国共同开发南海资源。2015 年马英九提出的「南海和平倡议」被重新提起：与越南、菲律宾与马来西亚组成联合开发区，渔业、油气与海洋科研的收益共享。"
 TAI_scs_hardline: "南海强硬维权"
 TAI_scs_hardline_desc: "十一段线内的每一寸海域都是中国的领土。中华民国宣布在南海建立防空识别区，海警驱逐越南与菲律宾的渔船，舰队在仁爱礁与黄岩岛周围巡逻；邻国强烈抗议，美国表示关切，南海的紧张局势再度升温。"
 TAI_far_seas_escort: "远洋护航"
 TAI_far_seas_escort_desc: "派遣舰队赴亚丁湾护航，保护中国商船。索马里海盗曾劫持多艘中国货轮，台湾的渔船也曾被扣押数年；如今中华民国海军的护航编队常驻亚丁湾，并在吉布提设立保障基地。"
 TAI_malacca_security: "马六甲安全"
 TAI_malacca_security_desc: "与新加坡、马来西亚、印尼合作维护马六甲海峡的航运安全。中国八成的进口石油经过这条狭窄的海峡，「马六甲困境」一直是国防规划者的噩梦；与沿岸国家的合作，比任何军事部署都更能保障航道的安全。"
 TAI_blue_water_diplomacy: "蓝水外交"
 TAI_blue_water_diplomacy_desc: "以航母编队的友好访问展示国力，海军成为外交的利器。航母编队访问悉尼、孟买、开普敦与里约热内卢，舰上举办的招待会与开放参观吸引了数十万当地民众；海军的形象，就是国家的形象。"
 TAI_south_asia_policy: "南亚政策"
 TAI_south_asia_policy_desc: "喜马拉雅山的另一侧，是世界上人口最多的地区之一：印度、巴基斯坦、孟加拉与斯里兰卡共有近二十亿人。中印两国的关系将决定亚洲的未来；南京必须在边界争议与经济合作之间找到平衡。"
 TAI_india_border_talks: "中印边界谈判"
 TAI_india_border_talks_desc: "以麦克马洪线为基础谈判，换取与印度的长期和平。这意味着放弃藏南的主权主张，国内的民族主义者必然激烈反对；但与印度和解，能让中国把资源投向更重要的地方，也能让两个文明古国携手主导亚洲。"
 TAI_india_confrontation: "中印对抗"
 TAI_india_confrontation_desc: "民国从未承认麦克马洪线，藏南是中国的领土。2020 年加勒万河谷的冲突中，双方士兵以棍棒与石块搏斗；如今国军在西藏增兵、修建边境公路，新德里也调动山地打击军。喜马拉雅山上，两个大国再次对峙。"
 TAI_pakistan_friendship: "中巴传统友谊"
 TAI_pakistan_friendship_desc: "与巴基斯坦延续「比山高、比海深」的情谊。巴基斯坦曾是中共最亲密的盟友，伊斯兰堡起初对南京心存疑虑；中华民国承诺延续中巴经济走廊与军事合作，让这份友谊跨越了政权的更迭。"
 TAI_bangladesh_ports: "孟加拉港口"
 TAI_bangladesh_ports_desc: "援建吉大港，为西南各省打开出海口。云南与四川远离海洋，货物要经过数千公里的陆路才能出海；经由缅甸与孟加拉的通道，西南的产品可以直接进入孟加拉湾与印度洋。"
 TAI_himalayan_states: "尼泊尔与不丹"
 TAI_himalayan_states_desc: "与喜马拉雅山区的王国建立友好关系，稳定西藏边境。尼泊尔夹在中印之间，不丹与中国至今没有建交，洞朗的对峙让三国关系紧张；中华民国以尊重主权与经济援助，赢得这些山地小国的友谊。"
 TAI_sri_lanka: "斯里兰卡港"
 TAI_sri_lanka_desc: "在汉班托塔建设深水港，保障印度洋航线。中共时代的贷款让斯里兰卡陷入债务危机，被迫把港口租给中国九十九年；新政府重新谈判租约、减免部分债务，让汉班托塔成为互利而非掠夺的样板。"
 TAI_south_asia_fta: "南亚自由贸易区"
 TAI_south_asia_fta_desc: "与南亚各国建立自由贸易区，打开近二十亿人口的市场。南亚是世界上经济增长最快的地区之一，却也是区域整合最落后的地区；中华民国的投资与市场，让南亚各国第一次有了共同发展的动力。"
 ### v3.14 国大面板、国策补全与南京总统府
