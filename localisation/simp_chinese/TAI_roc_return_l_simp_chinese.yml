 roc_return.81.t: "中共暴动"
 roc_return.81.d: "东北与华北多地同时爆发武装暴动。中共残余势力宣布「中华人民共和国并未灭亡」，号召全国人民推翻国民政府。下岗工人、前解放军官兵与地下党员攻占了警察局与军火库，沈阳、长春与哈尔滨相继失守。第三次国共内战，已经爆发。"
 roc_return.81.a: "戡乱救国！"
 roc_return.82.t: "第三次国共内战爆发"
 roc_return.82.d: "中国东北爆发大规模武装暴动，中共残余势力宣布重建中华人民共和国政府。国民政府宣布全国进入戡乱时期。这场跨越了一个世纪的内战，第三次爆发了。"
 roc_return.82.a: "中国人的内战，仍未结束。"
 roc_return.83.t: "东北起义"
 roc_return.83.d: "在东北的工业城市与山区，成千上万的工人、下岗职工与前解放军官兵响应党中央的号召，拿起了武器。鞍山的钢铁厂改为生产枪炮，长白山的密林里重新出现了游击队的营地；东北又一次成为革命的根据地。"
 roc_return.83.a: "革命尚未成功，同志仍须努力！"
 roc_return.85.t: "人民共和国的胜利"
 roc_return.85.d: "国民政府已经投降。天安门城楼上，五星红旗再次升起，长安街上挤满了游行的人群与解放军的坦克。\n\n国民党残部退往台湾，台湾海峡又一次成为两岸的分界线。中华人民共和国，又回来了；历史仿佛在原地绕了一个圈。"
 roc_return.85.a: "中国人民从此站起来了！"
 roc_return.86.t: "中华人民共和国重建"
 roc_return.86.d: "中国共产党在第三次国共内战中取得胜利，重建了中华人民共和国。国民政府再次退守台湾，海峡两岸回到了分治的状态。各国政府纷纷重新评估对华政策，许多在光复期间支持国民政府的人士被迫流亡海外。"
 roc_return.86.a: "历史又转回了原点。"
 roc_return.87.t: "国府再次迁台"
 roc_return.87.d: "大陆又一次失守了。国民政府与国军残部撤回台湾，基隆与高雄的码头上挤满了撤退的官兵与难民，就像 1949 年那样。在台北，总统发表讲话：「我们还会回来的。」但这一次，还有多少人相信这句话？"
 roc_return.87.a: "反攻大陆，永不放弃。"
 roc_return.88.t: "戡乱成功"
 roc_return.88.d: "国军彻底击败了中共残余武装，最后一批游击队在长白山与大兴安岭的密林中投降。东北与华北重新回到中华民国的控制之下，铁路恢复通车，工厂重新开工。动员戡乱时期终于结束，国家可以专心于重建与宪政。"
 roc_return.88.a: "中华民国万岁！"

 ### v3.5 assembly
 TAI_national_assembly_modifier: "国民大会"
 TAI_national_assembly_modifier_desc: "国民大会对政府的支持程度。"
 TAI_dec_na_session: "召开国民大会常会"
 TAI_dec_na_session_desc: "政府向国民大会提出年度施政报告。"
 TAI_dec_na_lobby: "拉拢地方代表"
 TAI_dec_na_lobby_desc: "以地方建设与人事安排换取无党籍代表的支持。国民大会中有不少无党籍的地方代表，他们关心的是家乡的道路、学校与人事；执政党以这些承诺换取他们在关键表决中的支持。"
 TAI_dec_amend_direct_election: "修宪：总统直选"
 TAI_dec_amend_direct_election_desc: "总统、副总统改由全体国民直接选举。1994 年的修宪让台湾在 1996 年举行了第一次总统直选；如今这项改革要推广到全中国，让十四亿国民亲手选出自己的元首。"
 TAI_dec_amend_local_autonomy: "修宪：地方自治入宪"
 TAI_dec_amend_local_autonomy_desc: "省、县自治入宪，以制度化解地方割据。省长与县长由人民选举、省议会拥有立法权，地方的事务由地方自己决定；地方实力派有了合法的舞台，就不必再以武力对抗中央。"
 TAI_dec_amend_five_yuan: "修宪：五院制改革"
 TAI_dec_amend_five_yuan_desc: "厘清五院职权，强化行政院与立法院的分工。过去的宪政体制被批评为「双首长制」与「五权混乱」，行政院长对谁负责常有争议；修宪后的五院各司其职，政府的运作更加顺畅。"
 TAI_dec_amend_virtualize: "修宪：国民大会虚级化"
 TAI_dec_amend_virtualize_desc: "国民大会改为任务型机关，修宪权交还全民公投。国民大会只在修宪、领土变更等重大议题时才召开，平时不再运作；这让政治更加精简，也让人民直接掌握修宪的最终决定权。"
 TAI_na_support_50_tt: "国民大会执政联盟支持率至少 §Y50%§!"
 TAI_na_support_66_tt: "国民大会执政联盟支持率至少 §Y66.7%§!（修宪门槛）"
 TAI_na_session_pass_tt: "§G施政报告获得通过§!"
 TAI_na_session_fail_tt: "§R施政报告被国民大会否决§!"
 TAI_na_bonus_tt: "执政联盟席次"
 TAI_na_virtualize_tt: "国民大会对政府的影响§Y减半§!"
 TAI_na_reelect_tt: "§Y国民大会代表§!按当前政党支持度重新选出"
 TAI_na_recall_a_tt: "执政党下台，由§Y国民大会最大党§!组阁"
 TAI_na_recall_b_tt: "解散国民大会，代表按当前政党支持度§Y重新改选§!"
 TAI_amend_direct_election_idea: "总统直选"
 TAI_amend_direct_election_idea_desc: "总统由全体国民直接选出。直选让总统拥有最强的民意基础，政治人物必须直接面对选民；民主的精神在全国深入人心，政府的施政也更具正当性。"
 TAI_amend_five_yuan_idea: "五院制改革"
 TAI_amend_five_yuan_idea_desc: "五院职权分明，运作顺畅。修宪厘清了行政院与立法院的关系，考试院与监察院也精简了组织、强化了职能；政府的施政不再因为五院之间的争执而空转。"
 roc_return.90.t: "罢免危机"
 roc_return.90.d: "国民大会已连续三个月拒绝支持政府，预算、法案与人事任命全部卡在会场。在野各党联合提出罢免案，总统府前抗议人潮聚集，媒体称之为光复以来最严重的宪政危机。政府必须在动员否决、内阁总辞与解散国大之间作出抉择。"
 roc_return.90.a: "内阁总辞，交由国大最大党组阁。"
 roc_return.90.b: "解散国民大会，诉诸民意。"
 ### v3.8 开局界面与 AI 行为
 TAI_MILLENNIUM_DAWN_DESC: "中华民国于1912年建立，是亚洲第一个民主共和国。1949年国共内战失利后，国民政府迁至台湾，在台澎金马延续法统。半个世纪以来，台湾创造了举世瞩目的经济奇迹并完成民主转型，跻身“亚洲四小龙”，半导体产业更是执世界牛耳。\n\n2000年的总统大选近在眼前，国民党的长期执政面临挑战；海峡对岸的导弹依旧瞄准台湾，华盛顿的承诺则若即若离。站在新千年的十字路口，中华民国是安守台湾、维持现状，还是重拾“光复神州”的遗志？"
 TAI_AI_BEHAVIOR: "@TAI 中华民国（台湾）"
 RULE_OPTION_TAI_HISTORICAL: "史实：维持现状"
 RULE_OPTION_TAI_HISTORICAL_DESC: "中华民国走史实路线：台湾优先、维持现状、深化两岸经贸往来，§R不会§!反攻大陆。"
 RULE_OPTION_TAI_RETURN: "武力光复"
 RULE_OPTION_TAI_RETURN_DESC: "中华民国坚持法统，重启国光计划，在时机成熟时§Y反攻大陆§!。"
 RULE_OPTION_TAI_PEACEFUL: "和平统一"
 RULE_OPTION_TAI_PEACEFUL_DESC: "中华民国坚持法统，但以§Y两岸和平统一谈判§!为目标，不主动发动战争。"
 RULE_OPTION_TAI_NO_PATH_DESC: "AI 自由选择国策。若开局勾选了§Y“AI 使用史实国策”§!，则中华民国走史实路线（维持现状）。"
