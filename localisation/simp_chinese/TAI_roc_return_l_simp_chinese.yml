 roc_asia.40.a: "让改革继续深入。"
 roc_asia.40.b: "放慢步伐，防止风险。"
 roc_asia.40.t: "党代会：革新开放 2.0"
 roc_asia.40.d: "党代会通过了第二轮革新的纲领。一批国企被股份化，一批民营企业走进了国家战略的核心，外资的准入门槛进一步降低。代表们在会场里激烈辩论：改革派要求加快步伐，保守派担心失去对经济的控制。最终的决定，将影响越南未来十年的走向。"
 roc_asia.41.a: "纪律是胜利的保证。"
 roc_asia.41.b: "不要让纪律抑制了活力。"
 roc_asia.41.t: "党的领导全面加强"
 roc_asia.41.d: "整党整风达到高潮。党员人数与党支部数量创下新高，每一家企业、每一所学校都设立了党组织，社会秩序前所未有地稳定。但年轻人对没完没了的政治学习感到厌倦，外资企业也抱怨党组织干预了经营。纪律与活力之间，党必须找到平衡。"
 roc_asia.42.a: "尊重选举的结果。"
 roc_asia.42.b: "担忧政局的碎片化。"
 roc_asia.42.t: "越南的首次多党选举"
 roc_asia.42.d: "来自多个政党与独立人士的候选人参加了选举，投票率高达八成。西贡与河内的街头张贴着各式各样的竞选海报，电视上的政见辩论吸引了数千万观众。国会第一次拥有了真正的反对派，越南的民主政治迈出了第一步。"
 roc_asia.43.a: "秩序压倒一切。"
 roc_asia.43.b: "逐步还政于民。"
 roc_asia.43.t: "军人治国的第一年"
 roc_asia.43.d: "军管会宣布取得「重大成就」：治安改善，工程完工，贪腐的官员被送上军事法庭。但国际社会的批评也日益尖锐，西方国家冻结了部分援助，外资开始观望。将军们必须决定：继续以铁腕治国，还是逐步还政于民。"
 roc_asia.44.a: "这是几代人努力的结果。"
 roc_asia.44.t: "亚洲新虎"
 roc_asia.44.d: "国际货币基金组织的报告称：越南已成为全球增长最快的经济体之一，人均收入进入中高收入行列。胡志明市的天际线上，摩天大楼一座接一座地拔地而起；三十多年前，这个国家还在饥荒与战争的阴影之中。"
 roc_asia.45.a: "坚守阵地，不退让。"
 roc_asia.45.b: "通过东盟寻求降温。"
 roc_asia.45.t: "南沙对峙"
 roc_asia.45.d: "越南在南沙岛礁部署导弹与雷达后，中国海警船与越南海警船在争议水域对峙，双方的渔船也被卷入其中。卫星照片显示，周边海域聚集了数十艘船只，国际舆论高度关注。河内必须决定：坚守阵地，还是通过东盟寻求降温。"
 roc_asia.46.a: "投入抗旱应急资金。"
 roc_asia.46.b: "转向耐盐作物与水产养殖。"
 roc_asia.46.t: "三角洲的盐碱化"
 roc_asia.46.d: "一场史无前例的干旱让咸水倒灌湄公河三角洲数百公里，稻田受灾严重，数十万农户的收成化为乌有。上游水坝的蓄水与海平面的上升，让这场灾难雪上加霜。政府紧急启动应急计划，但长远的出路在于改变三角洲的农业结构。"
 KORX_security_review: "国防白皮书 · 安保总检讨"
 KORX_security_review_desc: "朝鲜的核危机与导弹试射一次比一次频繁，美中战略竞争又让汉城夹在两大国之间左右为难。国家安全会议决定对韩国的安保战略做一次总检讨，新版国防白皮书将回答一个根本问题：韩国到底能依靠谁？"
 KORX_nuclear_debate: "核武论战"
 KORX_nuclear_debate_desc: "「要不要拥有自己的核武器」成为全国辩论的焦点。民调显示过半民众支持核武装，美国与中国都在密切关注。"
 KORX_missile_forces: "导弹战略司令部"
 KORX_missile_forces_desc: "把分散在各军种的导弹部队整合为统一的战略司令部，统一规划玄武系列导弹的发展与部署。韩美导弹指南的射程与弹头限制已经解除，韩国终于可以按自己的需要发展远程打击能力。"
 KORX_nuclear_sharing: "核共享"
 KORX_nuclear_sharing_desc: "效仿北约的核共享安排：美国战术核武器重新部署在韩国，韩美联合规划与演练核作战，韩国空军的战机获得投掷核弹的资格。这让韩国在不违反 NPT 的前提下，第一次对核武器的使用有了发言权。"
 KORX_independent_deterrent: "自主核威慑"
 KORX_independent_deterrent_desc: "核武器是国家安全的最终保证。民调显示七成以上的国民支持拥核，国会终于通过决议，授权政府启动自主的核武器开发计划。朴正熙时代被美国叫停的计划重新上马，代价是国际制裁与同盟关系的动摇。"
 KORX_nonnuclear_pledge: "无核承诺"
 KORX_nonnuclear_pledge_desc: "政府重申 1991 年的《朝鲜半岛无核化共同宣言》，并以无核国家的身份寻求国际社会的安全保证。汉城相信，在道义上站在高处，比拥有核武器更能争取华盛顿与国际社会的支持。"
 KORX_nuclear_latency: "后处理与核潜伏能力"
 KORX_nuclear_latency_desc: "谈判修改《韩美原子能协定》，取得核燃料后处理与浓缩的权利，把「核潜伏能力」握在手中。日本早已拥有这项权利；韩国希望在必要时，也能在几个月之内跨过门槛。"
 KORX_npt_exit: "宣布退出 NPT"
 KORX_npt_exit_desc: "依据条约第十条，韩国正式通知联合国安理会：国家最高利益已受到威胁，将在三个月后退出《不扩散核武器条约》。"
 KORX_peaceful_atom: "和平利用核能"
 KORX_peaceful_atom_desc: "以 NPT 缔约国的身份，发展民用核电与核燃料国产化，不碰红线。韩国自主设计的 APR-1400 反应堆已出口到阿联酋，韩国电力公司正在竞标欧洲与中东的新项目，核能是韩国的另一张出口名片。"
 KORX_hyunmoo: "玄武弹道导弹系列"
 KORX_hyunmoo_desc: "玄武-2 到玄武-5，射程与弹头重量不断提高——弹头重达数吨的「怪物导弹」可以贯穿地下数十米的工事，让对朝鲜的常规威慑上了一个台阶。平壤的地下指挥部，第一次处在韩国常规武器的射程之内。"
 KORX_kamd: "韩国型防空导弹网（KAMD）"
 KORX_kamd_desc: "以 L-SAM、天弓-2 与爱国者构成多层防空网，保卫首都圈免受朝鲜导弹与火炮攻击。首尔距离非军事区只有五十公里，北方的长程火炮与火箭炮随时可能把它变成「火海」，防空网是两千五百万人的护盾。"
 KORX_thaad_deploy: "接受萨德部署"
 KORX_thaad_deploy_desc: "美军萨德系统在星州部署完毕。中国的经济报复接踵而至：乐天超市被迫撤出大陆，韩流明星被封杀，中国游客团锐减。但萨德的雷达与拦截弹，让首都圈与美军基地的防空能力大大提高。"
 KORX_thaad_refuse: "拒绝萨德 · 三不"
 KORX_thaad_refuse_desc: "「不加入美国的导弹防御体系、不部署萨德、不结成韩美日军事同盟。」——这样与中国的经济往来不会受损。"
 KORX_us_forces_deal: "驻韩美军分担金协定"
 KORX_us_forces_deal_desc: "与华盛顿重新谈判「特别措施协定」。美方要求韩国大幅增加驻韩美军的分担金，甚至威胁撤军；汉城则坚持同盟不是买卖。分担金的金额，成为同盟中的政治焦点，也考验着两国领导人的耐心。"
 KORX_deterrence_final: "韩国型三轴体系"
 KORX_deterrence_final_desc: "「杀伤链、韩国型防空与导弹防御、大量惩罚报复」三位一体，构成韩国自己的威慑体系：先发制人摧毁导弹、在空中拦截漏网之鱼、再对平壤的领导层施以毁灭性的报复。韩国不再只是美国保护伞下的被保护者。"
 KORX_demographic_commission: "人口危机对策委员会"
 KORX_demographic_commission_desc: "总和生育率跌破 1.0，成为全世界最低的国家；学校关门、乡村空心化，产房一间接一间地停业。低生育与高龄社会委员会升格，总统亲自担任委员长，协调各部会的对策。这关系到大韩民国能否存续。"
 KORX_birth_incentives: "生育补贴与育儿津贴"
 KORX_birth_incentives_desc: "每个新生儿发放一次性补贴，育儿津贴提高到孩子满八岁，多子女家庭在住房与升学上享有优先，把「生孩子」变成国家支持的事业。批评者说，光靠发钱解决不了根本问题。"
 KORX_housing_supply: "首都圈住宅供给"
 KORX_housing_supply_desc: "首尔的公寓均价已是普通年轻人年收入的二十倍，房价高企是年轻人不婚不育的主因。政府宣布扩大首都圈的住宅供给，放宽重建限制，并为新婚夫妇提供低息贷款与公共租赁住房。"
 KORX_pension_reform: "国民年金改革"
 KORX_pension_reform_desc: "国民年金基金预计在本世纪中叶枯竭，而现在缴费的年轻人到时可能一分钱也领不到。政府抛出改革方案，「多缴少领」与「延后领取」的选项都写在纸上，引发了世代之间的激烈争论，老年团体与青年团体在国会门外对峙。"
 KORX_childcare_system: "公立托育体系"
 KORX_childcare_system_desc: "建立覆盖全国的公立托育中心与课后照护，让上班的父母没有后顾之忧。过去公立托儿所的名额要排队几年，私立的又贵又不放心；如今每个社区都有一间国家认证的托育中心，晚上八点前都有人看护。"
 KORX_work_hours: "缩短工时与弹性工作"
 KORX_work_hours_desc: "把每周最长工时压缩到 52 小时以内，并推广弹性工作与父母都可申请的育儿假。韩国的工时长期名列经合组织前茅，「下班后还要喝酒应酬」的职场文化让年轻人望而却步。财阀团体强烈反对，认为这会削弱竞争力。"
 KORX_jeonse_reform: "全税房制度改革"
 KORX_jeonse_reform_desc: "以「全税」预付高额保证金租房的传统制度，让租客与房东都承担了巨大风险。政府推出新的租赁保障。"
 KORX_new_towns: "新城开发"
 KORX_new_towns_desc: "在首都圈外围开发第三期新城，配套首都圈快线（GTX）地铁与产业园区，疏解首尔的人口压力。从新城到江南的通勤时间缩短到半小时，年轻家庭终于有机会买得起一套属于自己的房子。"
 KORX_pension_raise: "提高缴费率与领取年龄"
 KORX_pension_raise_desc: "提高缴费率、延后领取年龄，换取年金基金的长期稳定——但这对年轻与老年两代人都不是好消息：年轻人要多缴更多年，临近退休的人要多等几年。保守派称之为负责任的改革，进步派批评这是把负担转嫁给普通人。"
 KORX_basic_pension: "基础年金全面发放"
 KORX_basic_pension_desc: "向全体老年人发放基础年金，缓解老年贫困——韩国的老年贫困率居经合组织之首，许多在产业化时代把一生献给工厂与子女的老人，晚年只能靠捡纸箱度日。这笔钱让他们至少能体面地活下去。"
 KORX_immigration_policy: "多文化社会与外劳签证"
 KORX_immigration_policy_desc: "放宽 E-9 外劳签证与永久居留，推动「多文化」融合政策，补足劳动力缺口。农村的渔船、工厂与养老院早已离不开越南、菲律宾与尼泊尔的劳工；如今政府让他们有机会留下来，成为真正的邻居。"
 KORX_regional_balance: "地方均衡发展与世宗"
 KORX_regional_balance_desc: "把更多中央机关迁往世宗，扶植釜山、光州等地方核心城市，打破「首尔共和国」的局面。全国一半的人口与绝大多数大企业总部挤在首都圈，地方城市却在人口流失中逐渐凋零。"
 KORX_elderly_care: "长期护理保险"
 KORX_elderly_care_desc: "扩充老年长期护理保险，培训护理人员，应对「超高龄社会」的到来。到 2025 年，韩国每五人中就有一位超过六十五岁；居家护理、日间照护与疗养院的需求成倍增长，护理行业成为新的就业来源。"
 KORX_demographic_final: "新的社会契约"
 KORX_demographic_final_desc: "住房、育儿、养老与劳动——一整套相互衔接的制度，让年轻一代重新相信未来。出生率的下滑终于放缓，婚礼礼堂又开始排期。没有人知道这能否扭转趋势，但大韩民国至少为自己的存续找到了方向。"
 KORX_constitutional_convention: "修宪咨询委员会"
 KORX_constitutional_convention_desc: "1987 年民主化运动后制定的宪法已经运行三十多年，单任五年的总统制让每一届政府都在后期沦为「跛脚鸭」。国会设立由朝野两党与民间代表共同组成的修宪咨询委员会，讨论权力结构、地方自治与基本权利的修改。"
 KORX_four_year_two_terms: "四年连任制"
 KORX_four_year_two_terms_desc: "改为总统可以连任一次、每届四年，并与国会选举同时举行，让执政者对选民负责。总统若想连任，就必须在第一个任期内拿出成绩，而不是在任期最后一年陷入亲信腐败的丑闻。"
 KORX_parliamentary_system: "议会内阁制"
 KORX_parliamentary_system_desc: "总统退居象征性的国家元首，由国会多数党组阁，结束「帝王式总统」的时代。从李承晚到朴槿惠，权力过度集中于青瓦台的悲剧一再上演；内阁制让权力分散在国会与内阁之间，政党之间不得不学会合作。"
 KORX_prosecution_reform: "检察厅改革"
 KORX_prosecution_reform_desc: "剥夺检察厅的大部分侦查权，设立独立的重大犯罪调查机关与高级公职人员犯罪调查处——权力的制衡，从检察开始。韩国的检察官既能侦查又能起诉，历来被视为政治斗争的工具，前总统与财阀会长都曾在他们手下低头。"
 KORX_nis_civilian_control: "国家情报院文官统制"
 KORX_nis_civilian_control_desc: "国家情报院的国内政治部门被彻底撤销，情报官员不得介入选举与政治。从中央情报部到安企部，这个机构曾绑架金大中、在 2012 年大选中操纵网络舆论；如今它只能专注于对外与对北情报，国会的情报委员会负责监督。"
 KORX_local_autonomy: "地方自治深化"
 KORX_local_autonomy_desc: "扩大地方政府的财政与立法权，推行济州式的「特别自治」，让地方议会真正成为权力的一环。地方税的比重提高，道知事可以自行制定产业与教育政策，地方选举不再只是中央政局的晴雨表。"
 KORX_electoral_reform: "选举制度改革"
 KORX_electoral_reform_desc: "推动联立型比例代表制，让正义党等小党也能按得票率进入国会，打破两大党的垄断。但大党们很快找到了漏洞：成立「卫星政党」来吞掉比例席位。真正的改革，还需要更严密的法律。"
 KORX_impeachment_rules: "弹劾与宪法裁判所"
 KORX_impeachment_rules_desc: "明确总统弹劾的程序与宪法裁判所的权限，避免政治危机演变为宪政危机。卢武铉与朴槿惠的弹劾案让全国陷入数月的对立与烛光集会；新的条文规定了审理期限、举证标准与职务代行的范围，让下一次危机有章可循。"
 KORX_constitutional_referendum: "修宪公投"
 KORX_constitutional_referendum_desc: "国会以三分之二多数通过修宪案，交付全体国民公投。这是 1987 年以来的第一次修宪公投，电视辩论、街头宣传与网络论战铺天盖地，年轻选民的投票率创下新高。结果将决定大韩民国下一个三十年的样子。"
 KORX_new_republic: "第七共和国"
 KORX_new_republic_desc: "修宪案以多数赞成通过。新宪法生效，大韩民国迈入第七共和国。光化门广场上，曾经举着烛光要求总统下台的人们，这一次举着新宪法的小册子庆祝。权力被关进了笼子，至少在纸面上是如此。"
 KORX_industrial_strategy: "K 产业战略"
 KORX_industrial_strategy_desc: "继半导体与汽车之后，国防、核能、电池、生物与文化成为下一代的出口产业。产业通商资源部拟定十年路线图，以税收优惠、政策金融与人才培养，扶植这些产业在全球市场上与中、日、美正面竞争。"
 KORX_defense_exports: "K-国防出口"
 KORX_defense_exports_desc: "政府成立「防卫产业出口支援团」，由总统府、国防部与产业部联合办公，统一对外洽谈，并提供融资与技术转移的一揽子方案，把国防工业变成国家的出口主力。韩国武器交货快、价格合理，正好填补了欧洲军工的产能缺口。"
 KORX_k9_k2_export: "K9 与 K2 出口"
 KORX_k9_k2_export_desc: "波兰、土耳其、澳大利亚与中东国家陆续下单，K9 自走炮与 K2 主战坦克成为明星产品。波兰一口气订购了上千辆，并在本国建立组装线；昌原的工厂开足马力三班倒，韩华与现代 Rotem 的股价一路走高。"
 KORX_fa50_kf21_export: "FA-50 与 KF-21 出口"
 KORX_fa50_kf21_export_desc: "轻型战机 FA-50 在东南亚与东欧大受欢迎，菲律宾、马来西亚与波兰相继采购；与印尼合作研制的 KF-21「猎鹰」则向第 4.5 代战斗机市场进军。泗川的韩国航空宇宙产业，正在成为亚洲最重要的战机制造商之一。"
 KORX_defense_complex: "韩国国防出口体系"
 KORX_defense_complex_desc: "整合陆、海、空与导弹的出口体系，并设立国防出口融资机构，为买方提供长期低息贷款。韩国的军火商不再单打独斗，而是以「国家队」的身份参与竞标，从潜艇、护卫舰到防空导弹，都能打包出售。"
 KORX_apr1400_export: "APR1400 核电出口"
 KORX_apr1400_export_desc: "以阿联酋巴拉卡核电站为起点，向东欧与中东推销韩国的核电站。巴拉卡的四台机组按期、按预算建成，在核电业界几乎是奇迹；捷克、波兰与沙特都在考虑采购韩国的 APR1400。"
 KORX_smr_program: "小型模块堆（SMR）"
 KORX_smr_program_desc: "小型模块堆体积小、成本低、安全性高，是核能的下一站。韩国原子力研究院的 SMART 堆与斗山重工的制造能力结合，目标是在 2030 年代把模块化反应堆像造船一样批量生产，出口到电网薄弱的发展中国家。"
 KORX_battery_alliance: "电池与新能源"
 KORX_battery_alliance_desc: "LG 新能源、SK On 与三星 SDI 三大电池厂联手拿下全球订单，在美国与欧洲建起一座座超级工厂，电动车产业链在韩国成型。政府为电池材料与回收技术提供研发补贴，力求在与中国电池巨头的竞争中保住领先。"
 KORX_ev_ecosystem: "电动车生态系"
 KORX_ev_ecosystem_desc: "现代与起亚的电动车平台，加上全国的快速充电网与电池回收体系，构成完整的电动车生态系。蔚山的工厂改建为电动车专用产线，韩国品牌的电动车在欧美市场屡获年度大奖。"
 KORX_bio_cluster: "生物医药集群"
 KORX_bio_cluster_desc: "在仁川松岛打造生物医药集群，三星生物制剂、Celltrion 成为世界级的生物仿制药企业。松岛的生物药产能位居世界前列，跨国药厂纷纷把代工订单交给这里，大学与研究所的人才也随之聚集。"
 KORX_bio_export: "疫苗与药品出口"
 KORX_bio_export_desc: "以疫苗代工与药品出口，把韩国推向全球医药供应链的中游。新冠疫情期间，韩国药厂为全球代工生产了数亿剂疫苗，「K-防疫」也成了国家品牌；如今政府要把这份经验变成长期的出口产业。"
 KORX_lng_shipbuilding: "LNG 船与绿色造船"
 KORX_lng_shipbuilding_desc: "韩国船厂拿下全球八成的 LNG 运输船订单，同时领先研发氨与氢动力的绿色船舶。巨济与蔚山的船坞排满了未来数年的订单，现代重工、三星重工与韩华海洋三家船厂，在高附加值船舶上把中国对手甩在身后。"
 KORX_offshore_wind: "海上风电与氢能"
 KORX_offshore_wind_desc: "在全罗南道新安郡外海建设海上风电基地，并以氢能为重点布局未来能源。韩国几乎没有化石能源，过去九成以上的能源依赖进口；风电与绿氢，既是减碳的手段，也是能源自主的出路。"
 KORX_hallyu_strategy: "韩流立国"
 KORX_hallyu_strategy_desc: "从 K-pop、电视剧到电影，「韩流」成为国家战略，政府设立内容产业振兴院。BTS 登上公告牌榜首，《鱿鱼游戏》成为网飞史上最多人观看的剧集；韩国的文化影响力，第一次超过了它的经济体量。"
 KORX_kcontent_fund: "K-内容基金与全球平台"
 KORX_kcontent_fund_desc: "政府与民间共同出资，支持内容出海与全球发行平台，培育下一个《寄生虫》。基金重点扶植中小制作公司与网络漫画、游戏等新兴领域，并在东南亚、拉美设立韩流文化中心，把一时的热潮变成长久的产业。"
 KORX_new_space: "太空产业"
 KORX_new_space_desc: "以 NURI 运载火箭与 KPS 定位系统为核心，民间太空企业开始进入发射市场。韩国是第七个能自行发射一吨级卫星的国家，宇宙航空厅成立后，韩华航天等民间企业接过了火箭制造与发射服务的接力棒。"
 KORX_industry_final: "K-产业全面开花"
 KORX_industry_final_desc: "国防、核能、电池、造船与文化——一整套相互支撑的出口产业，成为韩国新的国家名片。经济不再只靠三星的芯片与现代的汽车，即使半导体景气下滑，其他产业也能撑住出口。韩国从「追赶者」变成了「领跑者」。"
 KORX_roc_representation: "与中华民国互设代表处"
 KORX_roc_representation_desc: "光复后的中华民国与韩国有着特殊的历史渊源——大韩民国临时政府曾在中国流亡二十七年。两国互设代表处。"
 KORX_roc_provisional_gov: "大韩民国临时政府纪念"
 KORX_roc_provisional_gov_desc: "1919 年至 1945 年间，大韩民国临时政府在上海与重庆度过了流亡的岁月，蒋中正的国民政府曾给予庇护与资金。中华民国政府同意修复马当路的旧址并设立纪念馆，两国的历史记忆在这里重新相连。"
 KORX_roc_maritime_security: "海上安保合作"
 KORX_roc_maritime_security_desc: "韩国与中华民国就黄海、东海与台湾海峡的航行自由与搜救合作建立热线。两国海军与海警定期举行联合搜救演习，并交换渔船越界与走私的情报，黄海上的渔业纠纷因此大为减少。"
 KORX_roc_dprk_consult: "对朝鲜政策磋商"
 KORX_roc_dprk_consult_desc: "首尔与南京就朝鲜半岛的和平、无核化与朝鲜的未来定期举行磋商。过去北京是平壤的保护者，如今南京的态度决定了朝鲜还能撑多久；两国的外交与情报首长每季度会面，交换对平壤局势的评估。"
 KORX_roc_fta: "韩国—中华民国自由贸易协定"
 KORX_roc_fta_desc: "取消两国之间的绝大多数关税，并共同制定供应链规则，对半导体、电池与稀土尤其重要。光复后的大陆是巨大的市场，韩国企业抢先进入；中华民国的稀土与原材料，也让韩国的高科技产业摆脱了单一来源的风险。"
 KORX_roc_tech_alliance: "半导体与显示器技术同盟"
 KORX_roc_tech_alliance_desc: "韩国的存储芯片与面板、中华民国的晶圆代工与光电，在供应链上互补。三星与台积电过去是竞争对手，如今在先进封装与设备国产化上找到了合作空间，两国联手，让东亚的半导体产业不必再受制于人。"
 PHIP_post_edsa: "后 EDSA 时代"
 PHIP_post_edsa_desc: "1986 年的人民力量革命推翻了马科斯，2001 年的 EDSA 二世又赶走了埃斯特拉达。菲律宾的政治似乎永远在街头与宫廷之间摇摆——新的政府必须选择一条路。"
 PHIP_a_straight_path: "改革之路"
 PHIP_a_straight_path_desc: "「你是我的老板」——贝尼尼奥·阿基诺三世以反贪腐与法治为旗帜，把自由党推上了执政的位置。他是民主英雄尼诺伊与科丽·阿基诺的儿子，「正道」（Daang Matuwid）是他向选民许下的承诺。"
 PHIP_a_clean_gov: "廉洁政府"
 PHIP_a_clean_gov_desc: "依照「正道」纲领，严办贪腐，公开政府采购，并对失职官员追究责任。前总统阿罗约因选举舞弊被捕，最高法院首席大法官科罗纳因隐匿财产遭弹劾下台；菲律宾在透明国际清廉指数上的排名明显上升。"
 PHIP_a_oslo_talks: "奥斯陆和平谈判"
 PHIP_a_oslo_talks_desc: "在挪威的斡旋下，与民族民主阵线在奥斯陆展开和平谈判，以土地改革与社会经济议程换取停火。新人民军自 1969 年起就在吕宋与棉兰老的山区打游击，这是亚洲持续最久的共产党叛乱之一。"
 PHIP_a_anti_dynasty: "反政治王朝法"
 PHIP_a_anti_dynasty_desc: "推动《反政治王朝法》，禁止近亲同时担任公职，打破少数家族垄断政治的局面。菲律宾七成以上的国会议员出身政治世家，父亲当省长、儿子当议员、妻子当市长是常态；1987 年宪法早已要求立法，却拖了三十年。"
 PHIP_a_bangsamoro: "邦萨摩洛基本法"
 PHIP_a_bangsamoro_desc: "通过《邦萨摩洛基本法》，建立拥有较大自治权的穆斯林棉兰老自治区。与摩洛伊斯兰解放阵线的和平协议，结束了棉兰老南部长达数十年的分离战争，前游击队员换上了议员与公务员的身份。"
 PHIP_a_us_alliance: "重申美菲同盟 · 海牙仲裁"
 PHIP_a_us_alliance_desc: "2013 年依据《联合国海洋法公约》提起南海仲裁案，同时与美国签订《加强防务合作协议》，重新确认 1951 年的共同防御条约。2016 年海牙仲裁庭裁定「九段线」没有法律依据，菲律宾在法律上赢得了一场大胜。"
 PHIP_a_end_insurgency: "与共产党签署最终和约"
 PHIP_a_end_insurgency_desc: "双方签署《全面和平协议》，新人民军解除武装，共产党进入合法政治。数十年的叛乱就此结束：游击区的农民分到了土地，前游击队员接受职业培训，吕宋山区的村庄第一次不必在两支军队之间求生。"
 PHIP_a_final: "自由民主的巩固"
 PHIP_a_final_desc: "宪政、法治与选举逐步稳定，改革派的第一个任期以平稳的政权交接告终。菲律宾经济在这六年里年均增长六个百分点以上，被称为「亚洲的新虎」；EDSA 革命的民主承诺，终于有了一些实质的内容。"
 PHIP_b_strongman: "强人崛起"
 PHIP_b_strongman_desc: "「改变就要来了。」一位来自棉兰老的铁腕市长以禁毒与治安的承诺赢得大选，菲律宾迎来了强人时代。"
 PHIP_b_drug_war: "禁毒战争"
 PHIP_b_drug_war_desc: "警察对毒品犯罪展开零容忍的扫荡，数以千计的嫌疑人在「抵抗逮捕」中被击毙，大批吸毒者主动自首。街头治安确有改善，民调支持率居高不下，人权团体与国际刑事法院却指控大量法外处决。"
 PHIP_b_crush_npa: "围剿新人民军"
 PHIP_b_crush_npa_desc: "停止和谈，调动正规军与警察对新人民军的游击区展开大规模清剿，并设立「终结地方共产武装冲突国家特别工作组」。被怀疑同情共产党的社运人士、律师与记者被「贴红标签」，其中一些人遭到暗杀。"
 PHIP_b_federalism: "联邦制修宪"
 PHIP_b_federalism_desc: "修宪改为联邦制，赋予棉兰老与各大区更大的自治权，打破马尼拉对财政与权力的垄断。批评者指出，修宪草案同时延长了总统的执政权限，联邦制可能只是让地方豪强更加坐大。"
 PHIP_b_build_build_build: "建、建、建"
 PHIP_b_build_build_build_desc: "史无前例的「建、建、建」基建计划：高速公路、铁路、机场与桥梁，投资额达到 GDP 的百分之五以上。马尼拉地铁、克拉克新城与南北通勤铁路相继开工，落后的基础设施焕然一新，但不少项目因资金问题延宕。"
 PHIP_b_terror_designation: "宣布共产党为恐怖组织"
 PHIP_b_terror_designation_desc: "议会通过《反恐法》，宣布共产党与新人民军为恐怖组织，叛乱的合法性被彻底剥夺，资金与支持网络被冻结。新人民军的兵力大幅萎缩，许多游击队员投降；但人权团体担心，「恐怖分子」的定义过于宽泛，可能被用来打压异见。"
 PHIP_b_independent_foreign: "独立外交政策"
 PHIP_b_independent_foreign_desc: "「不再做美国的小兄弟」——与北京缓和关系，搁置仲裁案，换取两百多亿美元的贸易与投资承诺。总统宣布与美国「分手」，一度要求美军撤出；但承诺的投资大多没有兑现，中国海警在南海的行动也并未收敛。"
 PHIP_b_final: "强人的遗产"
 PHIP_b_final_desc: "无论功过，强人时代在宪法允许的任期内结束。他离任时的民调支持率仍是历任总统中最高的之一，但禁毒战争的遗留问题、国际刑事法院的调查与政治家族的重新洗牌，将长久地影响菲律宾的政治。"
 PHIP_c_coalition: "朝野大联合"
 PHIP_c_coalition_desc: "传统政治家族、商界与天主教会达成默契，组成跨党派的执政联盟，以「稳定」为最高目标。马尼拉的豪门与棉兰老的地方首领各取所需，国会通过的每一项法案都是讨价还价的结果；改革缓慢，但没有人被排除在外。"
 PHIP_c_economy_first: "经济发展优先"
 PHIP_c_economy_first_desc: "先发展经济，再谈政治改革：降低企业税负，改善投资环境，扩大基础设施。马卡蒂的商人们乐见其成，经济特区与出口加工区不断扩大；左翼批评说，增长的果实依旧集中在少数家族的手中。"
 PHIP_c_peace_dev_teams: "和平与发展工作队"
 PHIP_c_peace_dev_teams_desc: "军队与地方政府联合组建工作队，把道路、学校与诊所送到叛乱区，瓦解叛军的民众基础。在萨马与内格罗斯的山村里，第一次有政府官员带着资金而不是枪炮到来，新人民军的招募越来越困难。"
 PHIP_c_bpo_remittances: "外包产业与侨汇"
 PHIP_c_bpo_remittances_desc: "以业务流程外包与海外劳工的侨汇作为国家增长的两大引擎，保护海外劳工权益。一百多万菲律宾人在马尼拉与宿务的呼叫中心上夜班，一千万海外劳工每年寄回三百多亿美元；政府在中东各国设立劳工保护办公室。"
 PHIP_c_amnesty: "大赦与招安"
 PHIP_c_amnesty_desc: "对愿意放下武器的叛军给予大赦、土地与职业培训，并吸收部分人员加入地方民兵。新人民军与摩洛武装的前战士领到了身份证、银行账户与一小块地；一些人从此成了保卫自己村庄的公民武装地理单位成员。"
 PHIP_c_end_insurgency: "叛乱的终结"
 PHIP_c_end_insurgency_desc: "各地叛军陆续投降，军方宣布共产党的武装斗争已经走向尾声：新人民军的游击阵线从数十个缩减到个位数。流亡荷兰的共产党创始人西松年事已高，革命的一代正在凋零。"
 PHIP_c_balanced_diplomacy: "平衡外交"
 PHIP_c_balanced_diplomacy_desc: "在中美之间走钢丝：美国保留军事合作与轮驻基地，中国获得基建与投资机会，南海问题以「共同开发」搁置。马尼拉希望两边都不得罪，但黄岩岛与仁爱礁上的对峙，随时可能逼它选边站。"
 PHIP_c_final: "稳定与繁荣"
 PHIP_c_final_desc: "联合政府任期平稳，经济增长，在野党的批评声只停留在国会里。政治家族之间的平衡得以维持，外国投资者对菲律宾的稳定给予好评；但改革者叹息，这六年里什么都没有真正改变。"
 PHIP_d_people_power: "进步联盟"
 PHIP_d_people_power_desc: "以社会民主派为核心的进步联盟，在工人、农民与青年学生的支持下赢得选举。这是菲律宾第一次由不属于传统政治家族的力量执政，EDSA 革命的口号「人民的力量」，第一次变成了选票。"
 PHIP_d_land_reform: "全面土地改革"
 PHIP_d_land_reform_desc: "大地主的土地被重新分配给佃农。1988 年的土地改革法留下了太多漏洞，路易西塔庄园等大庄园至今未分；新的改革以强制征收与合理补偿，正面处理了叛乱的根源之一。"
 PHIP_d_legalize_left: "民族民主阵线合法化"
 PHIP_d_legalize_left_desc: "废除《反颠覆法》，允许左翼政党与团体合法活动，把阶级斗争引入议会政治。民族民主阵线的干部走出地下，以政党名单制进入国会；他们必须在选票与枪杆子之间做出最终的选择。"
 PHIP_d_labour_rights: "劳工权利法"
 PHIP_d_labour_rights_desc: "承诺全国统一的最低工资、合同工转正与工会组织权，终结「五个月合同」的惯例，改善数百万工人的处境。财团强烈反对，警告这会赶走外资；但工会的支持率达到了历史最高点。"
 PHIP_d_universal_health: "全民医保"
 PHIP_d_universal_health_desc: "建立全民健康保险与基层卫生所网络，每个村镇都有卫生站与护士。菲律宾培养了全世界最多的护士，却留不住她们；新的医疗体系提高了公立医护人员的待遇，希望让她们留在祖国。"
 PHIP_d_ceasefire: "全面停火协议"
 PHIP_d_ceasefire_desc: "政府与共产党签署无限期停火协议，新人民军逐步转型为合法的政治团体与农民合作社。山区的游击队员第一次走下山来参加选举，半个世纪的亚洲最长叛乱之一，终于以谈判而非剿灭的方式结束。"
 PHIP_d_non_aligned: "不结盟与基地问题"
 PHIP_d_non_aligned_desc: "重新检讨《访问部队协定》，以外交多元化的立场处理中美关系，争取东盟的支持。1991 年参议院拒绝延长美军基地租约的记忆被重新提起，进步联盟主张菲律宾不应成为大国对抗的前线。"
 PHIP_d_final: "社会民主的试验"
 PHIP_d_final_desc: "进步联盟的第一个任期结束，菲律宾的左翼从街头走到了权力的中心。土地改革、劳工权利与全民医保改变了数百万人的生活，但财政赤字与外资撤离的压力，让下一届选举充满了变数。"
 PHIP_new_consensus: "新的国家共识"
 PHIP_new_consensus_desc: "各政党就基本的政治规则达成共识：选举的结果必须被尊重，军队必须保持中立，武装叛乱不再是政治的选项。菲律宾的政治线至此落幕——接下来，是漫长的国家建设。"
 VIEX_p_root: "越南的政治前途"
 VIEX_p_root_desc: "革新开放三十年，越南是亚洲增长最快的国家之一，却也面对腐败、国企低效与民主化压力。党必须决定：越南向何处去。"
 VIEX_dm_start: "革新开放 2.0"
 VIEX_dm_start_desc: "继 1986 年的「革新」之后，党宣布推动更深层的市场化改革：「社会主义定向的市场经济」，要有更多的市场，也要有更清晰的社会主义。"
 VIEX_dm_term_limit: "党内民主与任期限制"
 VIEX_dm_term_limit_desc: "总书记的任期与年龄受到限制，「两届任期、六十五岁」的规定被写进党章，党内集体领导制度得到加强。阮富仲连任三届的先例不再重演，中央委员会对人选有了更大的发言权。"
 VIEX_dm_furnace: "熔炉反腐"
 VIEX_dm_furnace_desc: "「反腐败没有禁区、没有例外」——「熔炉」点燃之后，从政治局委员、部长到国企高管，一批人被送进了法庭，越南航空、越进银行与新冠检测试剂案都牵出了高层。但也有人担心，反腐成了权力斗争的工具。"
 VIEX_dm_state_core: "国进：国企做强做优"
 VIEX_dm_state_core_desc: "集中力量，把国企整合成少数几家有国际竞争力的「国家队」：越南油气、越南电力、越南国家银行与 Viettel 将在各自的领域称雄。党内保守派称之为社会主义的骨架，民营企业家则担心市场被挤压。"
 VIEX_dm_private_core: "民进：民营经济是重要动力"
 VIEX_dm_private_core_desc: "民营经济被正式承认为「国民经济的重要动力」，放宽准入、保护产权、简化审批。Vingroup、Masan 与 FPT 等民营集团已经证明了自己，新的决议让成千上万的中小企业也看到了做大的希望。"
 VIEX_dm_civil_space: "社会组织与公民社会"
 VIEX_dm_civil_space_desc: "允许环保、慈善与行业社团的注册与运作——「社会主义法治国家」的第一步。河内与西贡的年轻人组织起植树、救灾与保护动物的团体，政府第一次把它们当作合作伙伴，而不是潜在的威胁。"
 VIEX_dm_final: "社会主义定向的市场经济"
 VIEX_dm_final_desc: "革新的第二阶段成型：既不是资本主义，也不是计划经济，而是越南的「第三条道路」。党保持领导地位，市场决定资源配置，社会组织在法律框架内活动；越南正在成为东南亚增长最快、也最有自信的经济体。"
 VIEX_hl_start: "整党整风"
 VIEX_hl_start_desc: "「一些党员干部的政治思想、道德、生活作风蜕化变质」——党中央发动新一轮的整党运动。各级党组织开展批评与自我批评，「自我演变」与「自我转化」被定为头号危险，一批被认为思想动摇的干部被调离岗位。"
 VIEX_hl_ideology: "思想教育"
 VIEX_hl_ideology_desc: "在学校、机关与媒体中恢复马列主义与胡志明思想的教育。大学生必修的政治课时数增加，干部晋升前要通过理论考试，电视台黄金时段播放革命历史剧。党希望年轻一代记住，独立与统一是用血换来的。"
 VIEX_hl_party_media: "党管媒体与网络"
 VIEX_hl_party_media_desc: "把互联网与社交媒体纳入党的管理，打击「反动言论」。2018 年的网络安全法要求外国平台在越南存储数据、删除违规内容，「第 47 部队」在网络上与异见者展开舆论战。Facebook 上的批评声音越来越少。"
 VIEX_hl_police: "强化公安力量"
 VIEX_hl_police_desc: "扩充公安部队，设立专门的网络安全与反间谍部门，公安部长进入政治局的核心。越南的公安系统一向比军队更受党的信任，如今它的预算、人员与权力都进一步扩张，成为维护政权最重要的支柱。"
 VIEX_hl_state_plan: "重启中央计划"
 VIEX_hl_state_plan_desc: "在关键行业恢复五年计划与行政指令，限制私人资本的活动空间。能源、电信、银行与土地的分配重新由国家决定，房地产与私人集团的扩张被刹车。保守派说，这是防止寡头政治的必要之举。"
 VIEX_hl_final: "党的领导全面加强"
 VIEX_hl_final_desc: "「党领导一切」成为全国上下的基本原则。社会秩序井然，抗议与批评几乎绝迹，外国投资者也乐于看到政局稳定；但年轻人的创业热情与媒体的活力明显降温，社会不再有往日的活力。"
 VIEX_dem_start: "多党转型"
 VIEX_dem_start_desc: "总书记宣布：党愿意与其他政治力量通过谈判实现和平的政治转型，让选民决定国家的未来。这是东欧 1989 年之后，共产党第一次在亚洲主动放弃一党专政。越侨社群欢欣鼓舞，北京则深感不安。"
 VIEX_dem_association: "放宽结社与出版"
 VIEX_dem_association_desc: "废除对结社与出版的限制，允许独立报刊与民间政党注册。西贡的报摊上第一次出现了不经审查的报纸，流亡海外的作家可以回国出书；但突如其来的自由也让社会陷入激烈的争论，稳定受到冲击。"
 VIEX_dem_independent_candidates: "允许独立候选人"
 VIEX_dem_independent_candidates_desc: "修改选举法，允许非党员作为独立候选人参选国会与地方议会，不再需要祖国阵线的事先审查。律师、企业家与网络名人纷纷报名参选，越南的选举第一次有了真正的悬念。"
 VIEX_dem_judiciary: "司法独立"
 VIEX_dem_judiciary_desc: "法院不再向党的政法委员会汇报，法官的任命与晋升独立于行政部门，终身任职取代五年一任。过去法院判决之前要先请示党委；如今，法官只需要对法律负责。"
 VIEX_dem_electoral_law: "多党选举法"
 VIEX_dem_electoral_law_desc: "通过新的选举法：多党竞争、秘密投票、国际观察员，国会进行改选。选区重新划分，竞选资金需要公开，各党可以在国家电视台上平等地发表政见。越南共产党将第一次与其他政党在选票上一较高下。"
 VIEX_dem_final: "首次多党选举"
 VIEX_dem_final_desc: "越南历史上第一次多党选举，投票率超过九成，选民在投票站前排起长队。无论谁赢，这都是国家政治的转折点：独立、统一与革新之后，越南人第一次自己选择了治理国家的人。"
 VIEX_mj_start: "军队的角色"
 VIEX_mj_start_desc: "人民军是党的军队，也是民族独立的象征：它打败了法国、美国，也在 1979 年顶住了中国的进攻。在党陷入分裂与危机的时刻，军队站了出来，以「保卫祖国与人民」的名义接管了国家的最高权力。"
 VIEX_mj_security_council: "国防与安全委员会"
 VIEX_mj_security_council_desc: "设立凌驾于政府之上的国防安全委员会，由军方领袖主持，总理与各部部长列席。委员会决定国防、外交与重大经济事务，政府只负责执行；越南从党领导军队，变成了军队领导国家。"
 VIEX_mj_army_business: "军队企业"
 VIEX_mj_army_business_desc: "把 Viettel、军队银行、西贡新港等军办企业纳入国家产业政策的核心。Viettel 已是越南最大的电信公司，业务遍及亚非拉十几个国家；军队企业的利润，成为军费与将领们的重要来源。"
 VIEX_mj_order: "维持秩序"
 VIEX_mj_order_desc: "以军管会的方式维持秩序，限制集会，宵禁与巡逻成为日常。街头的抗议被迅速驱散，网络上的批评者被约谈；城市恢复了平静，但人们说话前开始先看看四周。"
 VIEX_mj_rebuild: "军队主导的经济"
 VIEX_mj_rebuild_desc: "军队企业与国企联手主导建设，机场、港口与高速公路以军事化的效率推进，工期大幅缩短。效率提高了，腐败也随之增加：没有人敢审计将军们的账目。"
 VIEX_mj_final: "军民融合的国家"
 VIEX_mj_final_desc: "国家与军队融为一体：将军们担任省委书记与国企董事长，军队企业控制着电信、建筑与港口。有人称之为稳定，有人称之为军管。越南走上了一条与缅甸、泰国相似的道路。"
 VIEX_e_root: "革新开放的下一步"
 VIEX_e_root_desc: "三十年革新让越南从最贫穷的国家之一，成长为中等收入国家。下一步要靠什么？答案是：制造、能源、基础设施与数字经济。"
 VIEX_e_agri: "湄公河三角洲农业现代化"
 VIEX_e_agri_desc: "推广良种、机械化与灌溉，把湄公河三角洲变成稳定的粮仓。三角洲出产全国一半以上的稻米，但海平面上升与上游水坝让盐水倒灌越来越严重；新的水利工程与耐盐品种，是保住这片土地的关键。"
 VIEX_e_rice: "稻米出口与品牌"
 VIEX_e_rice_desc: "以 ST25 等优质品种打造越南大米品牌，抢占高端市场。ST25 曾获评「世界最佳大米」，越南不再满足于做最便宜的大米出口国，而要让「越南米」像泰国香米一样，成为超市货架上的金字招牌。"
 VIEX_e_cash_crops: "咖啡、橡胶与胡椒"
 VIEX_e_cash_crops_desc: "西原的咖啡、橡胶与胡椒是越南的传统出口产品：越南是世界第二大咖啡生产国、最大的胡椒出口国。过去这些作物大多以原料形式出口，加工、烘焙与品牌升级能大幅提高附加值，让农民赚得更多。"
 VIEX_e_aquaculture: "水产养殖与加工"
 VIEX_e_aquaculture_desc: "巴沙鱼与虾的养殖加工产业，在三角洲形成了完整的出口产业链，从鱼苗、饲料到冷冻加工一应俱全。越南的巴沙鱼片出现在全世界的超市里，虾类出口也名列前茅；但美国的反倾销税始终是悬在头上的一把剑。"
 VIEX_e_fdi: "外资制造业"
 VIEX_e_fdi_desc: "用低成本劳动力、自贸协定与稳定的政局吸引外国制造商把工厂搬到越南。「中国加一」的风潮让苹果、三星、富士康与耐克的供应商纷纷南下，北部与南部的工业区一座接一座地建起来。"
 VIEX_e_samsung: "三星与韩国资本"
 VIEX_e_samsung_desc: "三星在北宁与太原的手机工厂，让越南成为全球最大的手机出口国之一：全世界一半的 Galaxy 手机在这里组装。三星一家企业就贡献了越南近两成的出口额，韩国资本也随之成为越南最大的外资来源。"
 VIEX_e_intel: "英特尔与半导体封测"
 VIEX_e_intel_desc: "英特尔在胡志明市高科技园区的封装测试厂，是英特尔在全球最大的封测基地之一，也是越南进入半导体产业链的第一步。政府随即推出半导体人才计划，目标是十年内培养五万名芯片工程师。"
 VIEX_e_textiles: "纺织成衣与 CPTPP"
 VIEX_e_textiles_desc: "加入 CPTPP 与欧越自贸协定后，越南的纺织品与鞋类以零关税进入主要市场。数百万工人在平阳与同奈的成衣厂里缝制着耐克、阿迪达斯与优衣库的产品，工会则开始为他们争取更高的工资与更短的工时。"
 VIEX_e_electronics: "电子产业集群"
 VIEX_e_electronics_desc: "手机、电脑与家电的配套供应商逐渐在越南形成完整的产业集群：电路板、电池、外壳与摄像头模组都能就地采购。越南企业开始从组装走向零部件制造，「越南制造」不再只意味着廉价劳动力。"
 VIEX_e_energy: "能源与资源"
 VIEX_e_energy_desc: "电力需求年增长十个百分点，2023 年夏天北部的大停电让工厂停工、外资震惊。越南必须同时发展传统能源与新能源：煤电保障基础负荷，水电与风光补充，输电网则要把南部过剩的太阳能送到北方。"
 VIEX_e_petrovietnam: "越南油气集团"
 VIEX_e_petrovietnam_desc: "以越南油气集团为核心，开发南海大陆架与越俄合资的白虎油田。越苏石油公司自 1980 年代起就在这里开采，石油收入一度占国家财政的三成，也让越南在南海问题上有了实实在在的利益。"
 VIEX_e_offshore: "近海油气"
 VIEX_e_offshore_desc: "在近海大陆架钻探油气，同时与周边国家的权利主张保持克制。2014 年中国「海洋石油 981」钻井平台进入西沙海域，引发越南全国的反华示威；如今河内选择在自己的专属经济区内悄悄作业，避免正面冲突。"
 VIEX_e_hydro_coal: "水电与煤电"
 VIEX_e_hydro_coal_desc: "和平、山罗等大型水电站与广宁的燃煤电厂提供廉价电力，支撑起工业化的高速增长。但也带来环境代价：水库淹没了少数民族的村寨，北部城市的空气质量一年比一年糟。"
 VIEX_e_renewable: "风电与太阳能"
 VIEX_e_renewable_desc: "宁顺与薄辽的光伏与风电成为全球增长最快的新能源之一：短短两年，越南的太阳能装机就从几乎为零跃升到东南亚第一。电网跟不上建设的速度，大批电站被迫限电，输电网改造成了当务之急。"
 VIEX_e_nuclear_ninhthuan: "宁顺核电重启"
 VIEX_e_nuclear_ninhthuan_desc: "2016 年因资金与安全疑虑被搁置的宁顺核电项目重新启动，由俄罗斯与日本竞争承建。越南需要稳定的低碳电力，核电是绕不开的选项；但福岛的阴影与巨额的投资，让国会的辩论异常激烈。"
 VIEX_e_shipbuilding: "造船与海洋工业"
 VIEX_e_shipbuilding_desc: "以海防与广宁为中心，发展船舶制造、海洋工程与港口机械。越南船舶工业集团曾在 2010 年濒临破产，如今在荷兰达门与韩国现代的合作下重新起步，开始为海军与海警建造巡逻舰。"
 VIEX_e_infra: "南北大动脉"
 VIEX_e_infra_desc: "一条纵贯南北的高速公路与铁路，把河内与胡志明市两大中心连成一体。越南国土狭长，南北相距一千六百多公里，至今仍靠法国殖民时代修建的单线米轨铁路运输；南北大动脉是国家统一后最大的基建工程。"
 VIEX_e_highway: "南北高速公路"
 VIEX_e_highway_desc: "分段建设、分段通车，终点是全线贯通的南北高速公路。从谅山到金瓯，两千多公里的路段由数十家承包商同时施工，每通车一段，沿线的工业区与城镇就迎来一波投资热潮。"
 VIEX_e_hsr: "南北高铁"
 VIEX_e_hsr_desc: "以日本新干线技术为蓝本规划的南北高铁，设计时速三百五十公里，河内到胡志明市只需五个多小时。但六百多亿美元的造价几乎相当于国家一年的财政收入，资金与技术仍是挑战，日本的贷款是关键。"
 VIEX_e_metro: "河内与胡志明市地铁"
 VIEX_e_metro_desc: "两大城市的地铁线路陆续开通，缓解交通拥堵：河内的吉灵—河东线由中国承建，胡志明市的滨城—仙泉线由日本援建，都比计划晚了好几年。数以百万计的摩托车骑手，终于有了另一种出行选择。"
 VIEX_e_ports: "深水港与物流"
 VIEX_e_ports_desc: "海防的拉赫县港与巴地头顿的盖梅港可以停靠世界最大的集装箱船，越南的货物不必再经新加坡与香港转运，让越南成为东南亚的海运枢纽之一。港口周边的物流园区与保税区也随之兴起。"
 VIEX_e_digital: "数字经济"
 VIEX_e_digital_desc: "5G、云计算与电子商务，让数字经济成为国民经济的新支柱。越南有一亿人口、平均年龄只有三十多岁，几乎人手一部智能手机；Shopee 与 Tiki 的订单量年年翻番，政府提出到 2030 年数字经济占 GDP 三成的目标。"
 VIEX_e_viettel_fpt: "Viettel 与 FPT"
 VIEX_e_viettel_fpt_desc: "军办的 Viettel 与民营的 FPT，是越南科技产业的两张名片。Viettel 自主研发了 5G 设备，是少数能做到这一点的发展中国家企业；FPT 的软件外包业务遍及日本与美国，为越南培养了数万名工程师。"
 VIEX_e_vinfast: "VinFast 与电动车"
 VIEX_e_vinfast_desc: "Vingroup 旗下的本土品牌 VinFast 进军全球电动车市场，在北卡罗来纳设厂，并在纳斯达克上市。外界对它的产品质量与持续亏损议论纷纷，但越南人第一次看到自己的汽车品牌开上了美国的街头。"
 VIEX_e_tourism: "旅游业"
 VIEX_e_tourism_desc: "下龙湾、岘港与会安古城吸引着千百万游客，旅游业成为服务业的支柱。韩国与中国的游客挤满了岘港的海滩，欧美背包客在河内老城与湄公河上流连；政府放宽签证，并大力推广富国岛等新的度假胜地。"
 VIEX_e_banking: "银行改革与坏账处理"
 VIEX_e_banking_desc: "剥离国有银行的坏账，引入外资战略投资者，推行巴塞尔协议。2012 年的银行危机暴露了交叉持股与关联贷款的问题，越南资产管理公司接手了大批不良资产；改革后的银行体系才能撑得起下一轮增长。"
 VIEX_e_soe_reform: "国企股份化"
 VIEX_e_soe_reform_desc: "推动国有企业的股份化与上市，减少国家持股比例。越南乳业、西贡啤酒等国企的股份被出售给外国投资者，国库获得了一大笔收入；但党内保守派担心，「家底」正在被一点点卖掉。"
 VIEX_e_cptpp: "CPTPP 与欧越自贸协定"
 VIEX_e_cptpp_desc: "越南是少数同时与美、欧、日以外的主要经济体签订高标准自贸协定的发展中国家：CPTPP、欧越自贸协定与 RCEP 让越南同时打开了太平洋两岸与欧洲的市场。代价是要接受劳工、环保与知识产权的严格条款。"
 VIEX_e_final: "亚洲新虎"
 VIEX_e_final_desc: "制造、能源、基础设施与数字经济——四根支柱让越南跻身亚洲新虎之列。从 1986 年人均不到一百美元的穷国，到今天的中等收入国家，越南用不到四十年走完了这段路。下一个目标，是 2045 年建国一百周年时成为高收入国家。"
 VIEX_m_root: "人民军的现代化"
 VIEX_m_root_desc: "「不结盟、不依附、不对抗、不使用武力」——越南的「四不」国防政策下，人民军正在从庞大的步兵军队，转型为精干的现代化军队。"
 VIEX_m_slim_army: "精兵简政"
 VIEX_m_slim_army_desc: "压缩常备军规模，提高军官素质，把节省的经费投入装备更新。越南人民军仍有近五十万人，许多部队的装备停留在 1980 年代；精简之后，军队要从人力密集型转向技术密集型。"
 VIEX_m_conscription: "兵役法修订"
 VIEX_m_conscription_desc: "修订兵役法，缩短服役期，提高志愿兵的比例与待遇。城市的年轻人想方设法逃避兵役，农村子弟则把参军视为出路；新的兵役法让服役更公平，也让退伍军人有了职业培训与就业优先。"
 VIEX_m_reserve: "预备役动员"
 VIEX_m_reserve_desc: "建立覆盖全国的预备役体系，并定期举行动员演习。在「全民国防」的传统下，每个乡社都有自卫民兵，每家工厂都有自卫队；一旦战事爆发，越南能在几天内动员数百万人。"
 VIEX_m_border_defense: "北部边境与山地防御"
 VIEX_m_border_defense_desc: "在北部山区修筑防御工事与山地作战训练基地。1979 年的边境战争与随后十年的老山、者阴山之战，让越南深知北方边境的分量；谅山、高平与河江的山地，就是国家的第一道屏障。"
 VIEX_m_navy: "海军现代化"
 VIEX_m_navy_desc: "海军从近海警戒转向有限的远海防御，核心是潜艇、护卫舰与反舰导弹。1988 年赤瓜礁海战的惨痛教训让越南明白，没有一支像样的海军，就守不住南沙的岛礁。"
 VIEX_m_kilo: "基洛级潜艇（河内级）"
 VIEX_m_kilo_desc: "从俄罗斯购买的六艘基洛级潜艇，以河内、胡志明市、海防等城市命名，构成越南海军的核心威慑。这些安静的潜艇配备俱乐部反舰与对陆巡航导弹，让任何试图封锁越南海岸的舰队都必须三思。"
 VIEX_m_frigates: "护卫舰与导弹艇"
 VIEX_m_frigates_desc: "引进俄制猎豹级护卫舰与国产导弹艇，扩大近海防御能力。猎豹级在俄罗斯的造船厂与越南的巴森造船厂分批建造，国产的 TT400 巡逻舰也陆续下水，越南海军的水面舰队逐步成形。"
 VIEX_m_antiship: "岸基反舰导弹"
 VIEX_m_antiship_desc: "布拉莫斯与国产反舰导弹，让越南有能力在家门口拒止任何入侵舰队。部署在岸边的移动导弹发射车可以覆盖数百公里的海域，从北部湾到南沙，越南沿海成了一道看不见的导弹墙。"
 VIEX_m_marines: "海军陆战队与岛礁驻防"
 VIEX_m_marines_desc: "扩编海军陆战队，在南沙岛礁驻军，并加强岛礁的补给与防空。越南控制着南沙最多的岛礁，驻岛官兵常年与台风、缺水为伍；新修的码头、雨水收集系统与防空阵地，让他们守得更久、更安心。"
 VIEX_m_militia: "海上民兵与海警"
 VIEX_m_militia_desc: "渔民、海警与海军组成的海上防线，是南海维权的前线。政府为远洋渔船提供燃油补贴与卫星通信设备，渔民同时也是海上民兵；在与中国海警的对峙中，他们常常首当其冲。"
 VIEX_m_air: "空军与防空"
 VIEX_m_air_desc: "现代化的空军以苏-30 战斗机与 S-300 防空导弹为核心，逐步淘汰服役半个世纪的米格-21。越南空军曾在越战中与美军周旋，如今它要面对的，是一个拥有第五代战机的北方邻国。"
 VIEX_m_su30: "苏-30MK2"
 VIEX_m_su30_desc: "从俄罗斯引进的苏-30MK2 多用途战斗机，是越南空军的主力，航程足以覆盖南沙群岛。三十多架苏-30 组成的机群，是东南亚最强的空中力量之一，飞行员们定期在南海上空进行远程巡逻训练。"
 VIEX_m_s300: "S-300 防空系统"
 VIEX_m_s300_desc: "从俄罗斯引进的 S-300 远程防空导弹，守卫河内与胡志明市。越南的防空部队有着辉煌的历史：1972 年的「空中奠边府」击落了大批 B-52；如今这套系统，延续着这份传统。"
 VIEX_m_airbase: "机场与防空洞化"
 VIEX_m_airbase_desc: "改造军用机场，修建加固掩体与备用跑道，提高空军的战场生存能力。在敌方导弹的第一波打击下，停在露天的战机将不堪一击；分散部署与地下机库，确保空军在开战后仍能起飞。"
 VIEX_m_cyber: "网络部队"
 VIEX_m_cyber_desc: "第 86 网络战联合司令部，负责保卫国家网络与舆论环境，也负责对外的网络行动。外国安全公司指认的「海莲花」黑客组织，被认为与越南政府有关；网络已成为继陆海空之后的第四个战场。"
 VIEX_m_military_industry: "Viettel 军工"
 VIEX_m_military_industry_desc: "以 Viettel 为核心，开发国产雷达、通信设备与无人机。Viettel 的高科技工业总公司已能生产对海监视雷达、电子战设备与中程无人机，越南的国防工业正在摆脱对俄罗斯零件的全面依赖。"
 VIEX_m_final: "全民国防的体系"
 VIEX_m_final_desc: "常备军、预备役、民兵与海警四位一体，形成了越南自己的防御体系。越南的国防白皮书坚持「四不」原则：不结盟、不与一国对抗另一国、不允许外国设立军事基地、不在国际关系中使用或威胁使用武力。"
 VIEX_d_root: "竹子外交"
 VIEX_d_root_desc: "「根深、干硬、枝柔」——与所有大国保持友好，也不依附任何一方。越南的外交要在中、美、俄、日、印之间找到自己的位置。"
 VIEX_d_china: "对华关系"
 VIEX_d_china_desc: "中国既是最大的邻国，也是最大的贸易伙伴，两党还有着「同志加兄弟」的历史渊源。但一千年的北属时期、1979 年的战争与南海的争端，让越南人对北方始终怀有戒心。如何处理南海问题，决定了两国关系的基调。"
 VIEX_d_china_coop: "全面战略合作伙伴"
 VIEX_d_china_coop_desc: "把越中关系提升到「全面战略合作伙伴」，加强经贸与党际往来，以友好协商搁置南海争议。两国领导人互访频繁，边境口岸的货车排起长龙，越南的农产品源源不断地运往北方市场。"
 VIEX_d_china_arb: "国际仲裁与法律斗争"
 VIEX_d_china_arb_desc: "以《联合国海洋法公约》为依据，向国际仲裁机构提起诉讼，在国际法的框架内维护海洋权益。2016 年菲律宾诉中国案的裁决，否定了「九段线」的法律效力；越南决定援引这一先例，在法律战场上为自己争取主动。"
 VIEX_d_china_militarize: "岛礁军事化"
 VIEX_d_china_militarize_desc: "加固南沙岛礁，扩建人工岛，部署导弹与雷达，必要时以武力维护领土主权。越南在南沙的填海面积迅速增加，仅次于中国；北京视之为挑衅，两国海军在海上的对峙越来越频繁。"
 VIEX_d_scs_code: "《南海行为准则》谈判"
 VIEX_d_scs_code_desc: "推动东盟与中国达成有约束力的《南海行为准则》，把争端纳入规则的框架。谈判从 2002 年的《南海各方行为宣言》开始拖了二十多年，越南希望趁轮值主席国之机，推动各方在法律约束力与适用范围上作出让步。"
 VIEX_d_china_border: "北部湾划界与边境贸易"
 VIEX_d_china_border_desc: "2000 年签订的北部湾划界协定与 2009 年完成的陆地边界勘定，为边境贸易与口岸建设扫清了障碍。友谊关、芒街与老街的口岸日夜通关，边境经济合作区让两国的边民都富了起来。"
 VIEX_d_usa: "对美关系"
 VIEX_d_usa_desc: "从 1995 年建交、2013 年「全面伙伴关系」到 2023 年「全面战略伙伴关系」，越美关系一年好过一年。昔日的敌人如今是最大的出口市场，越南的民调显示，对美国有好感的民众比例甚至高过美国的盟友。"
 VIEX_d_usa_partner: "全面伙伴关系"
 VIEX_d_usa_partner_desc: "把越美关系提升为全面伙伴关系，扩大贸易、教育与战争遗留问题合作：美军协助清理橙剂污染与未爆弹，越南协助寻找美军失踪人员遗骸。富布赖特大学在胡志明市开学，越南留学生成为在美人数最多的群体之一。"
 VIEX_d_arms_embargo: "解除武器禁运"
 VIEX_d_arms_embargo_desc: "2016 年，美国解除对越南的杀伤性武器禁运，打开了两国军事合作的大门。越南海警接收了美国退役的汉密尔顿级巡逻舰，美国航母首次停靠岘港，这是越战结束以来的第一次。"
 VIEX_d_cam_ranh: "金兰湾合作"
 VIEX_d_cam_ranh_desc: "允许外国军舰按照「三不」原则访问金兰湾——但不建立任何军事基地。这座曾经是美军与苏联海军基地的天然良港，如今对所有国家开放维修与补给服务，越南借此在大国之间保持平衡，也赚取了外汇。"
 VIEX_d_russia: "对俄关系"
 VIEX_d_russia_desc: "俄罗斯是越南最重要的军火供应国，越南军队八成以上的装备来自苏联与俄罗斯；两国也是传统的友谊伙伴，许多越南领导人曾在莫斯科留学。乌克兰战争之后，河内在西方的压力与莫斯科的旧情之间小心周旋。"
 VIEX_d_rus_arms: "俄制军火"
 VIEX_d_rus_arms_desc: "继续采购俄制潜艇、战机与防空系统，保持装备体系的延续。全面转向西方装备的代价太高，训练、后勤与弹药都要从头再来；但对俄罗斯的制裁让零件交货越来越难，越南开始寻找替代来源。"
 VIEX_d_rus_energy: "越俄油气合作"
 VIEX_d_rus_energy_desc: "越俄油气合资公司「越苏石油」在近海与西伯利亚继续合作勘探：越南企业参与开发俄罗斯北极的油气田，俄罗斯企业则留在越南的南海区块。能源合作让莫斯科在南海问题上也有了自己的利益。"
 VIEX_d_india: "对印关系"
 VIEX_d_india_desc: "印度的「东向行动」政策与越南的「向西」不谋而合。两国在 1979 年都曾与中国兵戎相见，对北方邻国有着相似的戒心；新德里视越南为进入南海的支点，河内则视印度为平衡大国的重要砝码。"
 VIEX_d_india_navy: "印度海军合作"
 VIEX_d_india_navy_desc: "印度向越南提供海军训练、国防信贷与布拉莫斯导弹，并协助培训潜艇艇员与苏-30 飞行员。印度国营石油公司也在越南的南海区块进行勘探，两国的军事合作让北京颇为不满。"
 VIEX_d_japan: "对日关系：深度战略伙伴"
 VIEX_d_japan_desc: "日本是越南最大的官方发展援助来源，也是基础设施建设的最大贷款国：日新大桥、新山一机场航站楼与胡志明市地铁都出自日本援助。两国关系升格为「全面战略伙伴」，日本也为越南海警提供巡逻船。"
 VIEX_d_korea: "对韩关系"
 VIEX_d_korea_desc: "韩国是越南最大的外国投资来源之一，数十万越南人在韩国生活与工作，越南新娘与韩越家庭也越来越多。朴恒绪执教的越南国家足球队，让两国民众之间的好感达到了前所未有的高度。"
 VIEX_d_laos_cambodia: "老挝与柬埔寨的特殊关系"
 VIEX_d_laos_cambodia_desc: "越南与老挝、柬埔寨在抗法、抗美的革命中结下深厚情谊，1979 年越军推翻了红色高棉政权，三国保持着特殊的关系。但中国的投资正在迅速涌入万象与金边，越南必须努力维持自己在印度支那的影响力。"
 VIEX_d_asean: "东盟中心地位"
 VIEX_d_asean_desc: "以东盟为外交的基石，推动区域合作、自由贸易与南海行为准则。越南 1995 年加入东盟时，还是一个刚走出孤立的穷国；如今它是东盟里最积极的成员之一，在南海问题上推动东盟发出团结的声音。"
 VIEX_d_mekong: "湄公河合作与水资源"
 VIEX_d_mekong_desc: "与湄公河沿岸国家建立水资源管理机制，限制上游大坝对三角洲的影响。中国与老挝在上游修建的数十座水坝截留了泥沙与水量，三角洲的土地正在下沉、海水不断倒灌；越南需要一个有约束力的流域协议。"
 VIEX_d_roc: "与中华民国的务实关系"
 VIEX_d_roc_desc: "光复后的中华民国在南海拥有太平岛，对东南亚也有历史渊源。越南愿以务实的方式发展经贸与民间往来。"
 VIEX_d_roc_trade: "台商与投资"
 VIEX_d_roc_trade_desc: "延续台商在越南的投资，扩大两国间的高端制造业合作。台湾是越南最早的外资来源之一，同奈与平阳的工业区里遍布台资工厂；如今鸿海、和硕与台积电的供应商纷纷南下，台商成了越南「中国加一」战略的主力。"
 VIEX_d_final: "全方位多样化"
 VIEX_d_final_desc: "与所有大国友好、与所有邻国相处、在所有区域机构中发声——这就是竹子外交的成果：根基牢固、枝干柔韧，随风而动却不折断。越南同时成为美、中、俄、日、印、韩的「全面战略伙伴」，在大国之间游刃有余。"
 VIEX_s_root: "民生与社会发展"
 VIEX_s_root_desc: "经济增长之外，教育、医疗、环境与社会公平，决定着越南能不能真正成为一个现代国家。高速增长让城市迅速富裕，但贫富差距、空气污染与城乡落差也随之扩大；越南必须在「未富先老」之前完成社会的转型。"
 VIEX_s_education: "教育改革"
 VIEX_s_education_desc: "改革大学入学考试，加强职业教育与英语教学，培养制造业与数字经济所需的人才。越南学生在国际学生评估中的成绩名列前茅，但大学教育与企业需求严重脱节；新的改革让学校与工厂、科技公司直接合作。"
 VIEX_s_health: "全民医保"
 VIEX_s_health_desc: "扩大医疗保险的覆盖率，建设县级与省级医院网络。河内的白梅与胡志明市的朝雷等大医院人满为患，两三个病人共用一张病床是常态；分级诊疗与基层医院的建设，让农村的病人不必再长途跋涉进城看病。"
 VIEX_s_climate: "气候适应与湄公河三角洲"
 VIEX_s_climate_desc: "海平面上升与盐碱化威胁着三角洲的稻田：到本世纪末，三角洲可能有三分之一的土地被海水淹没。政府启动了「三角洲适应计划」，不再一味与水对抗，而是让部分稻田改为虾稻轮作，顺应自然而非征服自然。"
 VIEX_s_urban: "城镇化与住房"
 VIEX_s_urban_desc: "每年数十万人口从农村涌入城市，河内与胡志明市的房价已是普通工人年收入的数十倍。政府推出百万套社会住房与卫星城计划，为工业区的工人与年轻家庭提供负担得起的住所。"
 VIEX_s_minorities: "民族团结与西原"
 VIEX_s_minorities_desc: "尊重 54 个民族的语言与文化，改善西原与北部山区的基础设施与教育。2001 年与 2004 年西原少数民族的抗议，暴露了土地被占与宗教受限的积怨；新的政策把公路、学校与双语教育送进山区村寨。"
 VIEX_s_demography: "人口老龄化与生育政策"
 VIEX_s_demography_desc: "越南的生育率已降到更替水平以下，老龄化的速度比预期更快：越南只用二十年就从「年轻国家」变成「老龄化社会」，而法国用了一百多年。政府取消了实行多年的「两孩」限制，并开始讨论养老金改革。"
 VIEX_s_youth: "青年与创业"
 VIEX_s_youth_desc: "推出「创业国家」计划，为青年人提供创业基金与孵化器。越南的独角兽企业 VNG、MoMo 与 Sky Mavis 证明了年轻人的潜力，政府希望把胡志明市打造成东南亚的硅谷，吸引海外越侨回国创业。"
 VIEX_s_final: "共同富裕的越南"
 VIEX_s_final_desc: "到 2045 年——越南独立百年之际——建成高收入国家，是党的庄严承诺。繁荣不能只属于城市与沿海，也要属于湄公河的农民与西原的少数民族。共同富裕的越南，才能真正实现胡志明「民富国强」的理想。"
 ### v3.21 反攻提速、志愿军、两岸内战与政治线改版
 TAI_kmt_defense_tech: "国防自主研发"
 TAI_kmt_science_park_tech: "科学园区"
 TAI_dp_startup_tech: "创业型国家"
 TAI_dp_regional_university_tech: "地方大学体系"
 TAI_sd_university_tech: "公立大学扩招"
 TAI_sd_circular_tech: "循环经济"
 TAI_escalate_intervention: "形势升级·整编义军"
 TAI_escalate_intervention_desc: "志愿军的名义已经遮不住台海对岸的炮声。台北决定撕下伪装：召回志愿军，整编大陆起义军，正式向北京宣战。"
 TAI_escalate_condition_tt: "起义已爆发 §Y60§! 天以上"
 TAI_armed_intervention_tt: "§R国军以起义军盟友的身份直接对中国作战§!（不吞并起义军）。"
 TAI_escalate_tt: "§Y召回志愿军，向中国宣战，并吞并起义军§!。"
 TAI_uprising_tt: "§Y中国§!东南沿海各省将爆发§R民主起义§!。起义政府保持独立，我们先以§Y志愿军§!的名义介入；形势升级后才会整编起义军、正式宣战。"
 TAI_volunteer_target_tt: "大陆起义军是正在进行的民主起义"
 roc_return.8.t: "大陆起义爆发！"
 roc_return.8.d: "在我们多年的经营之下，东南沿海各省的军民终于揭竿而起，宣布成立“中华民国大陆临时政府”，并请求台北接应。\n\n国军此时若公开渡海，等于向北京宣战。参谋本部建议：先以“志愿军”的名义派出官兵和武器，待局势明朗再决定是否升级。"
 roc_return.8.a: "组织志愿军，并军援义军"
 roc_return.8.b: "只提供军援，暂不派兵"
 roc_return.8.c: "直接出兵：以国军名义武力干预"
 roc_return.190.a: "升级介入：整编义军，正式宣战"
 roc_return.190.b: "继续以志愿军的名义支援"
 roc_return.190.t: "是否升级介入？"
 roc_return.190.d: "起义已经持续了一段时间，大陆的战局陷入胶着。义军在北京的反扑下能否撑住，志愿军的名义还能装多久？国际社会早已看穿台北的介入，美国则私下表示不愿看到战争扩大。是时候作出抉择了：升级介入，还是继续以志愿军的名义支援。"
 roc_return.191.a: "让这场失败成为下一次的火种"
 roc_return.191.t: "起义军溃败"
 roc_return.191.d: "北京的部队扑灭了东南各省的起义，起义军的领导人或被捕、或流亡海外。志愿军的名字被写进了通缉名单，但我们并没有输掉整场战争：消息传来，大陆民间的怨气比起义前更深，下一次的火种已经埋下。"
 roc_return.192.a: "欣然接受，统一国家"
 roc_return.192.b: "保持两个政府并立"
 roc_return.192.t: "起义军夺取了政权"
 roc_return.192.d: "「中华民国大陆临时政府」击败了北京的守军，控制了全国大部分地区，中共中央的残余撤往东北。临时政府派来使者：愿意接受台北的领导，实现国家的统一。七十多年的分裂，终于有了结束的可能；但也有人主张维持两个政府并立。"
 TAI_dec_more_volunteers: "增派志愿军"
 TAI_dec_more_volunteers_desc: "以「志愿军」名义再派出一批官兵，加入大陆起义军的行列。这些退伍军人与后备军人经由金门与海路秘密渡海，为起义军带去了作战经验与装备。"
 TAI_dec_armed_intervention: "武力干预"
 TAI_dec_armed_intervention_desc: "不再以「志愿军」自居：国军以起义军盟友的身份直接投入战斗，但暂不整编义军，也不吞并。"
 TAI_dec_arm_rebels: "军援义军"
 TAI_dec_arm_rebels_desc: "把库房里的步枪、火炮和反坦克、防空武器运往大陆起义军手里。"
 TAI_relocate_capital_beijing: "迁都北平"
 TAI_relocate_capital_beijing_desc: "北平是元明清三朝故都，华北的政治与军事重心。把首都从南京迁到北平，更靠近北方的防线与东北的资源。与「定都南京」二选一；之后仍可通过决议迁回南京。"
 TAI_beijing_capital_idea: "建都北平"
 TAI_beijing_capital_idea_desc: "国民政府迁都北平，北方的行政与动员效率提高，南方的地方派系则抱怨被冷落。"
 TAI_dec_move_capital_nanjing: "迁回南京"
 TAI_dec_move_capital_nanjing_desc: "把首都迁回南京。南京是国父选定的首都，中山陵、总统府与五院的旧址都在这里；迁回南京，象征着中华民国法统的延续，也让政府离长三角的经济中心更近。"
 TAI_gov_kmt_tt: "§Y中国国民党§!曾经执政，或正在联合执政"
 TAI_gov_dp_tt: "§Y中国民主党§!曾经执政，或正在联合执政"
 TAI_gov_sd_tt: "§Y中国社会民主党§!曾经执政，或正在联合执政"
 TAI_kmt_mainland_branches: "大陆党部重建"
 TAI_kmt_mainland_branches_desc: "在各省重建国民党党部，吸纳地方士绅与退役军官，让党的触角重新伸进县乡。1949 年撤离大陆后，国民党在大陆没有任何组织；如今党部在各地重新挂牌，从前的中共基层干部也有不少人申请入党。"
 TAI_kmt_youth_corps: "青年团与学生组织"
 TAI_kmt_youth_corps_desc: "重建三民主义青年团，在大专院校里发展学生党员，培养新一代干部。1938 年成立的三青团曾是国民党的青年组织；新的青年团举办夏令营、志工服务与政策辩论，希望让大陆的年轻人认同三民主义。"
 TAI_kmt_cadre_academy: "革命实践研究院"
 TAI_kmt_cadre_academy_desc: "恢复党务干部的训练机构，把「建国方略」讲给每一位新党员。阳明山的革命实践研究院曾是国民党培训干部的摇篮；如今它在南京设立分院，课程涵盖三民主义、宪政民主与地方治理，学员中有不少是新入党的大陆干部。"
 TAI_kmt_factional_balance: "派系平衡"
 TAI_kmt_factional_balance_desc: "来台老党员、本土派与大陆新党员之间要讲平衡，党的人事不能让某一派独占。中常会的席位按比例分配给三大派系，党主席的选举采取党员直选；国民党要证明，它能够容纳来自海峡两岸的不同声音。"
 TAI_kmt_garrison_reform: "驻军整编"
 TAI_kmt_garrison_reform_desc: "统一驻军番号与指挥系统，国军在大陆各省的防区与国防部的序列重新对齐。光复初期，各地驻军的番号与指挥关系十分混乱，有的部队听命于地方，有的直属中央；整编之后，每支部队都清楚自己的防区与上级。"
 TAI_kmt_border_fortress: "边疆要塞"
 TAI_kmt_border_fortress_desc: "在东北、西北与西南边疆修建永久工事与军用机场，守住国门。北方的俄罗斯、西方的中亚与南方的印度，都是潜在的威胁；国民党政府认为，统一来之不易，国防不能有任何松懈。"
 TAI_kmt_unification_forum: "两岸论坛"
 TAI_kmt_unification_forum_desc: "邀请两岸的学者、企业家与地方官员定期会面，让「一个中国」不再停留在口号上。国共论坛曾是两岸交流的平台，如今它以新的形式召开：台湾与大陆各省的代表讨论教育、医疗与产业的整合，统一不只是政治，更是生活。"
 TAI_kmt_defense_self_reliance: "国防自主"
 TAI_kmt_defense_self_reliance_desc: "一整套自主研发的武器系统逐步取代进口，军工产业不再受制于人。台湾的中科院曾在美国的封锁下研制出天弓、雄风与经国号；如今两岸的国防工业合为一体，从坦克到战机都能自行设计与生产。"
 TAI_kmt_central_bank_independence: "央行独立"
 TAI_kmt_central_bank_independence_desc: "中央银行摆脱政治干预，币值稳定成为政府的第一信用。台湾的央行以独立与稳健闻名，彭淮南总裁连续多年获评「A 级央行总裁」；国民党政府把这一传统带到大陆，让国币成为值得信赖的货币。"
 TAI_kmt_industrial_parks: "工业园区"
 TAI_kmt_industrial_parks_desc: "沿海与内陆同时规划新的工业园区，引进台商与外资。台湾的加工出口区曾是经济起飞的引擎，如今在大陆各地复制：园区内一站式办理审批、税收优惠与基础设施齐备，吸引电子、机械与纺织产业进驻。"
 TAI_kmt_science_parks: "科学园区"
 TAI_kmt_science_parks_desc: "把新竹的经验复制到大陆：科学园区、人才与风险投资一起来。新竹科学园区由李国鼎与孙运璿推动成立，造就了台湾的半导体奇迹；如今南京、武汉与成都都设立了科学园区，与当地的大学紧密合作。"
 TAI_kmt_export_drive: "出口导向"
 TAI_kmt_export_drive_desc: "以出口带动增长，让「中国制造」换上「中华民国制造」的新标签。台湾在 1960 年代以出口导向的策略创造了经济奇迹；如今统一的中国以同样的思路，在品质、品牌与技术上全面升级，赢回国际市场的信任。"
 TAI_dp_bar_association: "律师公会"
 TAI_dp_bar_association_desc: "允许律师自行组织公会，为被告辩护不再是危险的事。2015 年的「七〇九大抓捕」中，数百名维权律师被拘押、被吊销执照；新政府恢复他们的执业资格，独立的律师公会负责律师的自律与惩戒，不再受司法行政部门的控制。"
 TAI_dp_petition_office: "申诉专线"
 TAI_dp_petition_office_desc: "每个县设立直通中央的申诉窗口，冤案不必再靠「拦轿告状」。中共时代的上访者被截访、被关进「黑监狱」；新的申诉专线由监察院直接受理，每一件申诉都有案号、有回复、有期限。"
 TAI_dp_victims_compensation: "受害者补偿"
 TAI_dp_victims_compensation_desc: "对历次政治运动的受害者及其家属给予补偿，让历史的伤口得到处理。台湾曾为二二八与白色恐怖的受害者设立补偿基金；如今这一做法扩大到大陆：右派、文革受害者、六四遇难者家属与被强拆的民众都能申请补偿。"
 TAI_dp_ombudsman: "国家人权委员会"
 TAI_dp_ombudsman_desc: "成立独立运作的国家人权委员会，向国会而不是向政府负责。委员会可以调查任何政府机关的侵权行为、到监狱与看守所突击检查，并每年向国会提交人权报告；这是中国第一个真正独立的人权机构。"
 TAI_dp_sme_support: "中小企业扶持"
 TAI_dp_sme_support_desc: "给小微企业减税、降低融资门槛，让民间活力成为经济的主力。中小企业贡献了中国一半以上的税收与八成的就业，却长期借不到银行贷款；民主党政府设立中小企业信用保证基金，并简化开业与报税的手续。"
 TAI_dp_stock_exchange: "证券市场"
 TAI_dp_stock_exchange_desc: "建立一个依法运作、信息公开的证券市场，让民间资本找到出口。中共时代的 A 股市场被称为「政策市」，暴涨暴跌、内幕交易层出不穷；新的证券法严惩财务造假，中小投资者的权益受到保护。"
 TAI_dp_free_trade_zones: "自由贸易港"
 TAI_dp_free_trade_zones_desc: "在沿海开设数座自由贸易港，实行最宽松的通关与税收制度。海南、厦门与天津成为新的自由港，货物进出免关税、资金自由流动、外国人免签入境；民主党希望以香港与新加坡为榜样，打造中国的全球贸易门户。"
 TAI_dp_startup_nation: "创业型国家"
 TAI_dp_startup_nation_desc: "政府退到幕后，由创业者、大学与天使投资人合作推动新经济。以色列与硅谷的经验被引进：政府只提供基础研究的资金与宽松的法规，其余交给市场。中关村、深圳与新竹的创业者开始挑战传统的大企业。"
 TAI_dp_governors_election: "省长直选"
 TAI_dp_governors_election_desc: "省长由省民直接选举，中央与地方的关系不再靠任命。1994 年台湾举行首次省长直选，宋楚瑜当选；如今大陆三十多个省份同时举行省长选举，候选人要面对选民，而不是讨好中央。"
 TAI_dp_fiscal_federalism: "财政联邦制"
 TAI_dp_fiscal_federalism_desc: "税收在中央与省之间按法律分配，地方有了自己的钱袋。1994 年的分税制让中央拿走了大部分税收，地方只好靠卖地维生；新的财政联邦制以宪法明确各级政府的税源与支出责任，省议会决定本省的预算。"
 TAI_dp_regional_universities: "地方大学"
 TAI_dp_regional_universities_desc: "每个省办一所一流的地方大学，让人才不再都往北京上海挤。过去的重点大学集中在少数几个城市，中西部的学生要考进名校难上加难；新政府以加州大学系统为榜样，在每个省建立高水平的州立式大学。"
 TAI_dp_regional_charters: "省宪章"
 TAI_dp_regional_charters_desc: "各省可以制定自己的宪章，只要不违反中央宪法的基本原则。1920 年代湖南曾制定中国第一部省宪，联省自治的梦想被北伐打断；一百年后，各省重新拥有自己的宪章，广东、四川与浙江率先完成制宪。"
 TAI_sd_minimum_wage: "最低工资"
 TAI_sd_minimum_wage_desc: "全国实行最低工资，让沿海与内陆的劳动者都有一条底线。过去的最低工资由各地自行决定，内陆的标准往往只有沿海的一半；社民党政府设立全国统一的最低工资下限，每年根据物价与生产力调整。"
 TAI_sd_collective_bargaining: "集体谈判"
 TAI_sd_collective_bargaining_desc: "工会可以代表劳动者与雇主谈判，罢工权受到法律保护。中共时代的宪法曾在 1982 年删除了罢工自由的条款；社民党政府把它重新写回法律，并设立劳资争议仲裁机构，让谈判取代对抗。"
 TAI_sd_unemployment_insurance: "失业保险"
 TAI_sd_unemployment_insurance_desc: "建立覆盖全国的失业保险与再培训体系。国企改制与产业升级让数千万工人面临失业，过去的下岗工人只能领到微薄的生活费；新的制度保障失业者一年的基本收入，并提供免费的职业再培训。"
 TAI_sd_worker_representatives: "劳资共决"
 TAI_sd_worker_representatives_desc: "大企业的董事会里必须有劳工代表，决策不再只由老板说了算。德国的劳资共决制度被引进：员工超过两千人的企业，监事会半数席位由员工选出。工厂的关停、裁员与搬迁，必须先与员工代表协商。"
 TAI_sd_rural_clinics: "乡村诊所"
 TAI_sd_rural_clinics_desc: "每个乡镇设一座公立诊所，把医生派到最偏远的村子。中共时代的赤脚医生早已消失，农村的医疗资源严重不足；社民党政府以优厚的待遇与免还学贷吸引年轻医生下乡，并为每座诊所配备远程会诊设备。"
 TAI_sd_public_universities: "公立大学扩招"
 TAI_sd_public_universities_desc: "扩大公立大学的招生，学费由国家负担大部分。社民党认为，高等教育是公共财，不应成为富裕家庭的特权；每年新增的数十万个大学名额优先分配给农村与内陆的学生，助学金覆盖了生活费用。"
 TAI_sd_vocational_schools: "职业学校"
 TAI_sd_vocational_schools_desc: "每个工业区配一所职业学校，毕业生直接被企业接收。德国与瑞士的学徒制被引进：学生一半时间在学校、一半时间在工厂，毕业时已经掌握一门手艺。这让技术工人不再被视为「考不上大学的人」。"
 TAI_sd_health_for_all: "全民医疗"
 TAI_sd_health_for_all_desc: "看病不再是一场赌博：全民医疗保险覆盖所有人，大病不再拖垮一个家庭。过去许多农村家庭因病返贫，一场手术就能耗尽一生的积蓄；社民党政府设立重大疾病的自付上限，并大幅提高基层医院的报销比例。"
 TAI_sd_carbon_pricing: "碳定价"
 TAI_sd_carbon_pricing_desc: "对碳排放定价，用收入补贴低收入家庭。全国碳交易市场覆盖电力、钢铁与水泥等高排放行业，碳税的收入以「气候红利」的形式返还给每一位国民；社民党要证明，环保与社会公正可以同时实现。"
 TAI_sd_renewables_grid: "可再生电网"
 TAI_sd_renewables_grid_desc: "新建跨省特高压电网，把西部的风电和光电送到东部。西部的沙漠与草原有充足的阳光与风力，东部的城市则需要大量的电力；特高压输电线路横跨数千公里，把绿色电力输送到长三角与珠三角。"
 TAI_sd_urban_greening: "城市绿化"
 TAI_sd_urban_greening_desc: "城市里增加公园与绿道，空气和水质成为官员考核的指标。过去地方官员的政绩只看 GDP，如今 PM2.5 浓度、河流水质与人均绿地面积都写进了考核表；北平的雾霾天数在五年内减少了一半。"
 TAI_sd_circular_economy: "循环经济"
 TAI_sd_circular_economy_desc: "工厂的废料成为另一家工厂的原料，「减量、再用、回收」成为国策。台湾的垃圾分类与资源回收率居世界前列，如今这套制度推广到大陆；工业园区内的企业互相利用彼此的废热、废水与废料，污染与成本同时下降。"
 TAI_gc_roundtable: "圆桌会议"
 TAI_gc_roundtable_desc: "各党领袖围坐一桌，重大议题先谈再提案。波兰 1989 年的圆桌会议让团结工会与统一工人党和平交接政权；联合政府效仿这一模式，每月召开党魁圆桌会议，把争议化解在国会辩论之前。"
 TAI_gc_constitution_convention: "制宪会议"
 TAI_gc_constitution_convention_desc: "召集各党与社会团体代表，检讨宪法在大陆实施的得失。中华民国宪法制定于 1946 年，许多条文需要因应今天的情况调整；制宪会议讨论国民大会的存废、五院的权限与地方自治的范围。"
 TAI_gc_citizens_assembly: "公民议会"
 TAI_gc_citizens_assembly_desc: "随机抽选公民参与立法咨询，让政治不再只有政客。爱尔兰的公民大会曾以审议民主的方式解决了堕胎与同婚等争议议题；联合政府抽选一百名不同背景的公民，就延迟退休、生育政策与能源转型提出建议。"
 TAI_gc_referendum_law: "公民投票法"
 TAI_gc_referendum_law_desc: "重大议题经由公民投票决定，门槛与程序写进法律。台湾的公投法历经多次修订，曾因门槛过高被称为「鸟笼公投」；新的公民投票法设定合理的连署与投票门槛，防止公投被滥用，也不让它形同虚设。"
 TAI_gc_cross_party_cabinet: "跨党派内阁"
 TAI_gc_cross_party_cabinet_desc: "各部会首长由各党按席次推荐，内阁真正成为国家的内阁。行政院长由最大党出任，副院长与各部会首长依比例分配；每一项政策都必须经过各党部长的共同讨论，内阁会议成为国家最重要的协商平台。"
 TAI_gc_shadow_ministers: "影子内阁"
 TAI_gc_shadow_ministers_desc: "在野党也可以组成影子内阁，对每一个部会进行监督。英国的影子内阁制度被引进：不参加联合政府的政党为每个部会指派发言人，在国会中质询对口的部长，并提出替代的政策方案。"
 TAI_gc_unity_budget: "国是预算"
 TAI_gc_unity_budget_desc: "预算案由各党共同编制，政党不能再拿预算当筹码。过去立法院的预算审查常常变成政党斗争的战场，冻结、删减与杯葛屡见不鲜；国是预算由联合政府各党共同拟定，国会只需审议执行的细节。"
 TAI_gc_opposition_rights: "在野党权利"
 TAI_gc_opposition_rights_desc: "在野党享有质询、调查与提案的完整权利，议事规则不再向执政党倾斜。国会设立由在野党主导的调查委员会，可以传唤官员作证、调阅政府文件；在野党也获得固定的提案时间，少数的声音不再被多数淹没。"
 TAI_gc_truth_commission: "真相委员会"
 TAI_gc_truth_commission_desc: "成立真相委员会，调查近百年的历史冤案，不追究个人，但还原事实。从清党、二二八、白色恐怖到反右、文革与六四，国共两党都有需要面对的过去；委员会的报告第一次同时检讨两党的历史责任。"
 TAI_gc_joint_textbooks: "两岸共编教材"
 TAI_gc_joint_textbooks_desc: "两岸历史学者共同编写教科书，让下一代读同一部历史。台湾与大陆的历史课本对抗战、内战与 1949 年后的叙述截然不同，同一场战役在两边有不同的英雄；共编的教材呈现多元的观点，让学生学会自己判断。"
 TAI_gc_memorials: "纪念馆与公墓"
 TAI_gc_memorials_desc: "为内战中的阵亡者建立共同的纪念馆，不论属于哪一方。西班牙的「烈士谷」争议了几十年，美国南北战争的阵亡者最终葬在同一片土地上；国共内战中数百万的死者，无论穿的是哪一方的军服，都是中国人。"
 TAI_gc_forgive_and_remember: "宽恕与记忆"
 TAI_gc_forgive_and_remember_desc: "「宽恕但不忘记」写进国家的教育大纲。每年的和解纪念日，各党领袖一同在纪念馆献花；年轻一代学习历史的伤痛，但不再背负上一代的仇恨。中国终于可以面对自己的过去，然后向前走。"
 TAI_cpc_government: "中国共产党参政"
 TAI_cpc_government_desc: "合法在野的中国共产党，在新的政治格局里找到自己的位置：不再是革命党，而是参政党。它在下岗工人、退休干部与东北老工业区中仍有大批支持者，在首届全国大选中赢得了可观的议席，并加入了执政联盟。"
 TAI_cpc_party_congress: "召开党代会"
 TAI_cpc_party_congress_desc: "合法在野的中国共产党召开全国代表大会，选举新的中央委员会。这是第一次在没有「党领导一切」的前提下召开的党代会：代表们公开辩论、差额选举，许多老一辈的领导人在选举中落败，年轻的改革派走上前台。"
 TAI_cpc_legal_status: "合法地位"
 TAI_cpc_legal_status_desc: "宪法法院确认共产党享有结社自由，党产、党报与党校的法律地位得到界定。法院裁定：只要放弃暴力革命与一党专政的主张，共产党就与其他政党享有同样的权利。德国的社民党与东欧的前共产党，都走过类似的道路。"
 TAI_cpc_reform_wing: "改革派崛起"
 TAI_cpc_reform_wing_desc: "党内的改革派主张接受议会政治，走社会民主主义或民主社会主义道路。他们以赵紫阳与胡耀邦为精神导师，主张与国民政府合作、放弃阶级斗争；保守派则批评他们背叛了革命。党内的路线之争公开化了。"
 TAI_cpc_workers_unions: "工会与农协"
 TAI_cpc_workers_unions_desc: "共产党把力量放在工会、农协与职工代表大会里，用组织说话。在国企改制的浪潮中，党的基层组织为下岗工人争取补偿与再就业，在农村为农民争取土地权益；共产党重新回到了它最初的群众基础。"
 TAI_cpc_patriots: "爱国主义转向"
 TAI_cpc_patriots_desc: "党的宣传转向爱国主义与民族复兴，与国民政府在民族大义上并肩。在钓鱼台、南海与外东北的问题上，共产党的立场比国民党还要强硬；这让它赢得了民族主义选民的支持，也让国民政府在对外交涉中多了一份底气。"
 TAI_cpc_market_socialism: "市场社会主义"
 TAI_cpc_market_socialism_desc: "承认市场的作用，把公有制放在关系国计民生的关键行业里。改革派的经济纲领被称为「市场社会主义」：能源、铁路与银行保持国营，其余行业交给市场；这与国父「节制资本」的主张，其实相去不远。"
 TAI_cpc_new_democracy: "新民主主义"
 TAI_cpc_new_democracy_desc: "重提「新民主主义」：多种经济成分并存，多个政党共同参政。1940 年毛泽东在《新民主主义论》中承诺的联合政府与多党合作，在 1949 年后被一党专政取代；如今共产党宣布回到这个承诺，接受多党民主。"
 TAI_cpc_era: "红旗与青天白日"
 TAI_cpc_era_desc: "红旗与青天白日满地红，在同一片天空下并肩飘扬：中国共产党在多党制下完成了自己的转型。一个世纪前，国共两党曾两度合作、两度内战；如今它们在同一个国会里辩论，在同一部宪法下竞争选票。"
 TAI_cpc_cadre_discipline: "干部纪律"
 TAI_cpc_cadre_discipline_desc: "以党的纪律约束干部，严禁贪污、特权与封建作风。中共执政时期的腐败是它失去民心的重要原因；在野的共产党痛定思痛，要求每一位党员申报财产，任何涉及贪腐的党员一律开除党籍。"
 TAI_cpc_party_school: "党校改革"
 TAI_cpc_party_school_desc: "党校不再只讲教条，开设经济学、法学与公共管理课程。中央党校邀请自由派的经济学家与台湾的法学教授授课，学员们第一次读到哈耶克与罗尔斯；党校要培养的是懂得民主政治的干部，而不是只会背诵文件的官僚。"
 TAI_cpc_anticorruption: "反腐传统"
 TAI_cpc_anticorruption_desc: "发扬延安时期的反腐传统，让清廉成为党的名片。延安时期的共产党以艰苦朴素赢得了民心，黄克功案中毛泽东批准枪毙了一位老红军；在野的共产党要找回这份精神，以清廉的形象与国民党竞争。"
 TAI_cpc_inner_democracy: "党内民主"
 TAI_cpc_inner_democracy_desc: "党的各级领导人由党员投票选举，党内不再只有一种声音。总书记的选举第一次有两位以上的候选人，各派系公开竞选、发表政见；党员们发现，原来党内民主比他们想象的更热闹。"
 TAI_cpc_land_reform_memory: "老区与土地改革"
 TAI_cpc_land_reform_memory_desc: "在革命老区继续推进土地的合理使用，保障农民的基本权利。井冈山、延安与大别山的老区是共产党的发源地，那里的农民仍对党怀有感情；共产党在这些地区推动农民合作与土地流转，防止土地被资本兼并。"
 TAI_cpc_trade_union_law: "工会法"
 TAI_cpc_trade_union_law_desc: "推动《工会法》修订，让劳动者有真正代表自己的组织。中共执政时期的工会只是党的传声筒，如今在野的共产党反而成为独立工会最积极的推动者；修订后的工会法保障工人自由组织、自由选举工会领导的权利。"
 TAI_cpc_village_cooperatives: "乡村合作社"
 TAI_cpc_village_cooperatives_desc: "发展农民自愿结合的合作社，让小农户能够共享规模经济。与人民公社不同，新的合作社完全出于自愿，农民可以随时退出；合作社统一采购农资、销售农产品，并经营加工厂与乡村旅游，让小农在市场中有了议价能力。"
 TAI_cpc_social_safety: "基本社会保障"
 TAI_cpc_social_safety_desc: "以国家财政托底：养老、医疗、住房，每个人都应该得到最基本的保障。共产党在国会中推动全民基本收入与公共住房法案，与社民党结成议题联盟；它要证明，社会主义的理想在民主制度下依然有生命力。"
 TAI_cpc_peaceful_rise: "和平崛起主张"
 TAI_cpc_peaceful_rise_desc: "共产党主张以和平方式实现民族复兴，反对任何外来势力干涉中国内政。在外交上，它批评国民党政府过度亲美，主张独立自主的外交与不结盟的立场，在部分选民中颇有市场。"
 TAI_cpc_overseas_ties: "海外左翼联系"
 TAI_cpc_overseas_ties_desc: "与各国左翼政党、工会和知识分子保持联系，为国际合作打开渠道。越南共产党、古巴共产党与欧洲的社会党、左翼党都与中国共产党保持往来；这些联系让在野的共产党在国际舞台上仍有一席之地。"
 TAI_cpc_one_china_consensus: "一个中国共识"
 TAI_cpc_one_china_consensus_desc: "在「一个中国」这一点上，国共两党并无分歧：中国必须是统一的中国。无论是 1992 年的共识还是七十年的对峙，两党都坚持中国只有一个；如今这份共识成为两党在国会中合作的基础，任何分裂国家的主张都会遭到两党的共同反对。"
 TAI_cpc_national_rejuvenation: "民族复兴"
 TAI_cpc_national_rejuvenation_desc: "把国家富强、民族复兴当成各党共同的奋斗目标。孙中山提出「振兴中华」，中共也以「民族复兴」为口号；在统一的民主中国里，这个目标不再属于任何一个政党，而是属于全体国民。"
 TAI_gov_cpc_tt: "§Y中国共产党§!曾经执政，或正在联合执政"
 TAI_cpc_government_idea: "共产党参政"
 TAI_cpc_government_idea_desc: "合法的中国共产党成为国会中的重要力量，工农组织与知识界的声音更容易被听见。"
 TAI_cpc_era_idea: "红旗与青天白日"
 TAI_cpc_era_idea_desc: "共产党完成了向多党制下的参政党的转型，国民政府与共产党在国家统一与民族复兴上拥有共同的语言。"
 TAI_party_alternation_idea: "政党轮替"
 TAI_party_alternation_idea_desc: "执政党交接已经成为政治常态，各党都在宪法的框架内竞争与合作。选举的输家接受结果、等待下一次机会，民主的游戏规则深入人心；政局稳定，政府的正当性也不容置疑。"
 TAI_two_party_lines_tt: "至少有§Y两条§!政党线已经完成最后的国策（国民党、民主党、社民党、大联合政府、共产党）"
 CSW_cross_strait_war: "两岸内战"
 CSW_cross_strait_war_desc: "大陆爆发内战，起义的省份宣布脱离北京，海峡两岸都被卷了进来。对中共而言，这是自 1949 年以来最严重的统治危机；对国民党而言，这是七十年来最好的机会。双方都需要给这场战争一个答案。"
 CSW_ccp_martial_law: "戒严与维稳"
 CSW_ccp_martial_law_desc: "在受影响的各省实施戒严：武警进驻大中城市，宵禁、断网与检查站同时到位。首要任务是稳住北京、上海与广州的秩序，把动乱限制在局部，不让一个省的起义变成全国的崩溃。"
 CSW_ccp_mobilize_pla: "动员解放军"
 CSW_ccp_mobilize_pla_desc: "各大战区进入一级战备，预备役部队动员，军队开始整顿被内战打乱的指挥体系。部分部队临阵倒戈，让中央军委对基层部队的忠诚心存疑虑，政治委员被大批派往一线。"
 CSW_ccp_purge_traitors: "清洗叛徒"
 CSW_ccp_purge_traitors_desc: "追查为起义军与台湾通风报信的人，清洗党内与军中的「二心」之人。中纪委与国安部门联合办案，一夜之间数百名干部被带走。恐惧能换来服从，但也会让更多人投向对岸。"
 CSW_ccp_blockade_rebels: "封锁起义军"
 CSW_ccp_blockade_rebels_desc: "切断起义军的补给线与粮食运输：铁路停运，长江航运封锁，银行冻结叛乱省份的账户。我们要让他们的政权在经济上先垮掉，让城市里的民众明白，跟着叛军只会挨饿。"
 CSW_ccp_seek_russia: "求援于俄朝"
 CSW_ccp_seek_russia_desc: "向俄罗斯与朝鲜请求政治与物资支持：燃油、弹药与卫星情报，换取它们在联合国安理会与国际舆论上的声援。代价是未来的边境让步与能源合同，但眼下保住政权才是第一位的。"
 CSW_ccp_strait_deterrence: "海峡威慑"
 CSW_ccp_strait_deterrence_desc: "东部战区在台湾海峡举行大规模演习，导弹落在基隆与高雄外海，向台北发出明确的警告：如果国军敢于登陆大陆，台湾本岛将首先承受代价。这是一场心理战，赌的是台北不敢跨出那一步。"
 CSW_ccp_total_war: "总体战"
 CSW_ccp_total_war_desc: "全国转入战时体制：工厂开足马力为前线生产，粮食凭证配给，民用运输让位于军运，一切为了平定内乱。这是自抗美援朝以来最彻底的总动员，经济将付出沉重代价。"
 CSW_ccp_restore_order: "平定内乱"
 CSW_ccp_restore_order_desc: "起义被平定，叛乱的省份重回中央控制：党和国家又一次挺过了考验。官方媒体宣布「平暴取得决定性胜利」，但废墟中的城市、逃往海外的难民与国际制裁，都提醒着人们这场胜利的代价。"
 CSW_tai_volunteer_corps: "组建志愿军团"
 CSW_tai_volunteer_corps_desc: "以退役军人和预备役为班底，组建「中华民国志愿军团」，以志愿者名义赴大陆参战。这个名字是对 1950 年的刻意回应：当年中共以志愿军之名入朝，今天我们以同样的方式回到大陆。"
 CSW_tai_arm_rebels: "军火支援"
 CSW_tai_arm_rebels_desc: "把库存的武器、弹药与火炮经海路与第三国运往大陆起义军。陆军仓库里那些准备淘汰的 M60 与 155 毫米榴弹炮，在义军手里仍是宝贵的家当。运输要隐秘，但谁都知道货是从哪里来的。"
 CSW_tai_armed_intervention: "武力干预"
 CSW_tai_armed_intervention_desc: "不再以志愿军自居：国军以起义军盟友的身份直接投入战斗，海空军为义军提供掩护。但我们暂不整编义军，也不吞并其政权，以免在国际上落下「侵略」的口实，也避免与地方势力过早摊牌。"
 CSW_tai_recognize: "承认临时政府"
 CSW_tai_recognize_desc: "正式承认「中华民国大陆临时政府」，并派顾问协助其建立行政体系：户政、税务、警察与法院。一个能运转的地方政府，比任何宣传都更能证明三民主义可以在大陆落地。"
 CSW_tai_intel_ops: "情报渗透"
 CSW_tai_intel_ops_desc: "军情局在大陆的网络全面启动：策反、破坏与情报收集一起进行。潜伏多年的联络人被唤醒，中共的铁路调度表、部队番号与干部名册开始源源不断地送到台北。"
 CSW_tai_us_backing: "争取美国默许"
 CSW_tai_us_backing_desc: "向华盛顿说明：这是一场民主起义，不是台湾挑起的战争；台北需要的是默许，不是介入。美国在台协会的会议室里，我们的特使一遍遍保证不会把美军拖下水，只求第七舰队别挡在海峡中间。"
 CSW_tai_psychological_war: "心战广播"
 CSW_tai_psychological_war_desc: "加大对大陆的广播与网络宣传，瓦解对方的军心与民心。光华电台恢复对大陆的全天广播，翻墙软件与投诚指南在网上流传，空飘气球再次越过海峡。我们要让每一个解放军士兵都知道：放下武器，就有出路。"
 CSW_tai_logistics_bridge: "海上桥梁"
 CSW_tai_logistics_bridge_desc: "组织民间商船与海军运输舰，建立一条从高雄到福建的海上补给线。长荣与阳明的货轮被临时征用，金门与马祖成了中转站，弹药、药品与粮食每晚都在夜色中跨过海峡。"
 CSW_tai_join_the_war: "统一指挥"
 CSW_tai_join_the_war_desc: "台北与大陆起义军建立统一的战时指挥部，国军与义军并肩作战。黄埔的校友与当年的解放军军官同坐一张作战桌，前嫌不再重要，重要的是在冬天到来之前打到长江边。"
 CSW_intl_lobby: "国际游说"
 CSW_intl_lobby_desc: "各方都在争夺国际舆论：谁在维护统一，谁在制造分裂？北京指责台北策动叛乱，台北则把这场战争描绘成大陆人民争取自由的起义。各国使馆、国际媒体与联合国的走廊，都成了另一条战线。"
 CSW_humanitarian_corridor: "人道走廊"
 CSW_humanitarian_corridor_desc: "为战区的平民开辟人道走廊，让红十字会进入受灾的城市。数以百万计的难民困在交战区，疫病与饥饿比炮火更致命。无论谁最终获胜，都不想背负屠戮同胞的骂名。"
 CSW_ceasefire_talks: "停火谈判"
 CSW_ceasefire_talks_desc: "在第三国斡旋下，两岸代表在新加坡坐下来谈停火的可能。三十年前的辜汪会谈也在这里举行，那时谈的是文书验证与挂号信，如今谈的是战俘交换与停火线。"
 CSW_new_order: "战后新秩序"
 CSW_new_order_desc: "战争结束了，国家将以怎样的面貌重新开始？无论谁获胜，重建秩序都是下一件事：清点伤亡、安置难民、恢复交通与生产，并决定那些曾经站错队的人该如何处置。和平比战争更难经营。"
 CSW_total_war_idea: "总体战"
 CSW_total_war_idea_desc: "全国转入战时体制：工厂开足马力，粮食凭证配给，一切为了平定内乱。全面的动员让兵源与战争支持度大幅增加，但民生用品短缺、物价飞涨，社会的不满正在累积。"
 CSW_ccp_request_aid: "中共求援"
 CSW_tai_lobby_us: "台北游说"
 ROC_order_blue_sky_white_sun: "青天白日勋章"
 ROC_order_blue_sky_white_sun_desc: "中华民国最高军事勋章，颁授给在保卫国家、克敌制胜中建立殊勋的军官。"
 ROC_order_precious_tripod: "宝鼎勋章"
 ROC_order_precious_tripod_desc: "以国之重器「宝鼎」为名，颁授给对国防建设有特殊贡献的三军将士。"
 ROC_order_cloud_and_banner: "云麾勋章"
 ROC_order_cloud_and_banner_desc: "颁授给作战有功、指挥卓越的陆海空军官兵。"
 ROC_medal_loyalty_and_valor: "忠勇勋章"
 ROC_medal_loyalty_and_valor_desc: "颁授给作战忠勇、奋不顾身的官兵。"
 ROC_order_independence_freedom: "独立自由勋章"
 ROC_order_independence_freedom_desc: "颁授给在民主与自由的旗帜下，守卫国家独立的官兵。"
 ROC_order_liberation: "解放勋章"
 ROC_order_liberation_desc: "颁授给在解放战争与光复国土中立下战功的官兵。"
 ### v3.22 叙利亚内战与各方扩展
 SYRX_siege_strategy_idea: "围城与饥饿"
 SYRX_siege_strategy_idea_desc: "以围困、断粮与轰炸迫使叛军控制区投降，政权保住了城市，却付出了人道与外交上的代价。"
 SYRX_reconciliation_idea: "地方和解"
 SYRX_reconciliation_idea_desc: "通过地方停火与撤离协议，把战斗人员与家属送往伊德利卜，换取城区与郊区的平静。"
 SYRX_ndf_idea: "国防军与民兵体系"
 SYRX_ndf_idea_desc: "国防军（NDF）把各地的亲政府民兵整合进统一的指挥系统，兵源与忠诚由此得到保障。"
 SYRX_axis_idea: "抵抗轴心"
 SYRX_axis_idea_desc: "伊朗革命卫队、真主党与什叶派民兵进入叙利亚，成为政权战场上的突击力量。"
 SYRX_russia_idea: "俄罗斯空天军"
 SYRX_russia_idea_desc: "赫梅明基地与塔尔图斯港的俄军为地面部队提供空中打击、侦察与外交保护。"
 SYRX_chem_deal_idea: "销毁化学武器"
 SYRX_chem_deal_idea_desc: "政权加入《禁止化学武器公约》，在俄罗斯的斡旋下交出了化学武器库存，换回了外交缓冲。美国取消了空袭计划，大马士革也因此获得了喘息的空间。"
 SYRX_war_economy_idea: "战争经济"
 SYRX_war_economy_idea_desc: "粮食、燃料与外汇全部服务于战争：配给制、黑市与军阀利益并存。兵工厂与修理厂日夜运转，但民生用品严重短缺，普通家庭在通货膨胀中挣扎求生。"
 SYRF_council_idea: "全国委员会"
 SYRF_council_idea_desc: "流亡的反对派在伊斯坦布尔组成全国委员会，作为对外的政治代表。委员会为反对派争取国际承认与援助，让各国政府有了一个可以对话的对象。"
 SYRF_local_councils_idea: "地方革命委员会"
 SYRF_local_councils_idea_desc: "解放区里的地方委员会接手了学校、面包房与法庭，成为新秩序的雏形。由居民选出的委员会让民众第一次参与地方事务，解放区的秩序与民心都因此更加稳固。"
 SYRF_turkey_idea: "土耳其的庇护"
 SYRF_turkey_idea_desc: "土耳其提供后方基地、难民营与军事训练，反对派对安卡拉的依赖也越来越深。"
 SYRF_sna_idea: "叙利亚国民军"
 SYRF_sna_idea_desc: "土耳其扶植下的联军整编为叙利亚国民军，成为北部解放区的正规武装。"
 SYRN_salvation_gov_idea: "救国政府"
 SYRN_salvation_gov_idea_desc: "伊德利卜的救国政府设立了各部、法院、警察与税务，成为一个事实上的政权。"
 SYRN_command_idea: "统一指挥"
 SYRN_command_idea_desc: "各派系被整编进统一的作战指挥，精锐突击部队成为战场上的主力。统一的指挥让攻势更加协调，部队的组织与攻击力都大幅提升。"
 SYRN_crossings_idea: "边境口岸"
 SYRN_crossings_idea_desc: "巴布哈瓦口岸的过境税与贸易收入，让伊德利卜的财政比许多国家更稳固。"
 SYR_ext_fsa_aid: "支持叙利亚反对派"
 SYR_ext_assad_crimes: "叙利亚政权的暴行"
 SYR_ext_russia_ally: "俄叙军事同盟"
 SYR_ext_iran_ally: "伊叙「抵抗轴心」"
 SYR_ext_turkey_ally: "土耳其支持反对派"
 SYR_ext_isis_hate: "对「伊斯兰国」的憎恶"
 SYRX_tb_armor: "装甲车辆重建"
 SYRF_tb_atgm: "反坦克导弹"
 SYRX_tb_aa: "防空系统修复"
 SYRL_baath_ideals_idea: "复兴党初心"
 SYRL_baath_ideals_idea_desc: "统一、自由、社会主义——1947 年建党时的三句口号，被几十年的家族政治掏空。现在，总统要把它们找回来。"
 SYRL_no_dynasty_idea: "去家族化"
 SYRL_no_dynasty_idea_desc: "亲属不再担任要职：财产要申报，合同要招标，军队与情报机构归国家，而不归任何一个姓氏。"
 SYRL_merit_idea: "干部考核"
 SYRL_merit_idea_desc: "提拔靠考试、业绩与群众评议，而不是出身与亲属关系。新一代的干部专业、清廉，政府的施政效率与决策品质都明显改善，研究机构也吸引了更多的人才。"
 SYRL_land_idea: "新土地改革"
 SYRL_land_idea_desc: "把荒废的国有土地租给无地农民，成立农业合作社，重新把农村拉回复兴党这一边。"
 SYRL_plan_idea: "计划与公共部门"
 SYRL_plan_idea_desc: "重新启动国家计划委员会，把能源、水泥、化肥与纺织重新交回国家。国营工厂以优先保障重建与民生为目标，工业产能稳步恢复，物价也更加稳定。"
 SYRL_coop_idea: "合作社与职工参与"
 SYRL_coop_idea_desc: "工人代表进入企业管理委员会，农民合作社直接把粮食卖给国家。生产者第一次分享了企业的决策与利润，劳资冲突减少，民生用品的生产也更加充足。"
 SYRL_welfare_idea: "全民医疗与教育"
 SYRL_welfare_idea_desc: "免费的医院与大学是复兴党留下的最宝贵遗产之一。战后重建的医疗与教育体系重新向所有人开放，民心逐渐安定，大学也重新培养出一代科学家与工程师。"
 SYRL_npf_idea: "真正的民族进步阵线"
 SYRL_npf_idea_desc: "共产党、阿拉伯社会主义联盟、统一社会党与复兴党在同一张桌子上协商，而不是由复兴党一家决定。"
 SYRL_union_idea: "独立工会与农民联合会"
 SYRL_union_idea_desc: "工会与农民联合会不再只是传声筒，工资与收购价可以通过谈判决定。劳动者的收入提高、怨气减少，社会更加稳定，民生用品的生产也更有保障。"
 SYRL_civil_idea: "公民国家"
 SYRL_civil_idea_desc: "宪法写明：人人在法律面前平等，不分教派与族裔。阿拉维、逊尼、基督徒与库尔德人，都是叙利亚公民。"
 SYR_ext_left_baath: "复兴党的阿拉伯团结"
 SYRB_security_state_idea: "安全国家"
 SYRB_security_state_idea_desc: "情报机构的权力比任何时候都大：稳定被摆在了一切之前，反对者与改革者都在名单上。"
 SYRB_social_market_idea: "社会市场经济"
 SYRB_social_market_idea_desc: "2005 年复兴党十大确立「社会市场经济」：银行、保险与大学向私人资本开放，国家不再包办一切。"
 SYRB_tb_medical: "医药与科研投资"
 roc_asia.70.a: "没收并公开招标"
 roc_asia.70.b: "留一部分，换取沉默"
 roc_asia.70.t: "财阀的资产"
 roc_asia.70.d: "检察官打开了家族名下公司的账本：电信牌照、石油分成、免税店与房地产，数十亿美元的财富藏在离岸公司与亲信的名下。总统下令：全部没收，收入交国库，合同公开招标。亲属们愤怒地离开了首都，有人扬言要「让总统付出代价」。"
 roc_asia.71.a: "通过改革纲领"
 roc_asia.71.b: "保留部分旧规矩"
 roc_asia.71.t: "复兴党第十一次代表大会"
 roc_asia.71.d: "会场里争论到深夜：老一辈要保持党的「领导地位」，年轻代表要求地方党部直选，还有人当场念起了阿弗拉克当年的建党宣言。最后，总统走上讲台：「党是人民的，不是某个人的。」掌声响起，改革纲领以多数票通过。"
 roc_asia.72.a: "采纳会议建议"
 roc_asia.72.b: "只采纳一部分"
 roc_asia.72.t: "全国对话大会"
 roc_asia.72.d: "大马士革的会议大厅里，坐着复兴党代表、共产党、纳赛尔主义者、基督徒主教、逊尼学者与库尔德人。这是半个世纪以来第一次，不同立场的叙利亚人坐在同一间屋子里平等地对话。会议吵了三天，也达成了一些共识：停火、大赦与新宪法。"
 roc_asia.73.a: "通过"
 roc_asia.73.t: "新复兴共和国"
 roc_asia.73.d: "总统走进议会，向全体代表宣读新的国家纲领。第一条写着：「国家属于全体叙利亚公民」。第二条写着：「任何人的亲属都不得继承公职」。代表们起立鼓掌，有人流下了眼泪：经过十多年的战争，叙利亚终于找到了一条新的道路。"
 roc_asia.60.a: "接受销毁协议"
 roc_asia.60.b: "否认一切指控"
 roc_asia.60.t: "东古塔的毒气"
 roc_asia.60.d: "凌晨，东古塔的居民被毒气窒息而死，上千人丧生，其中许多是熟睡中的孩子。网络上流传的影像震惊了全世界。华盛顿说，这已经越过了「红线」，美国的战舰在地中海就位。莫斯科提出了折中方案：政权交出化学武器，换取打击的取消。"
 roc_asia.61.a: "欢迎俄罗斯的到来"
 roc_asia.61.b: "保持审慎"
 roc_asia.61.t: "俄罗斯战机抵达赫梅明"
 roc_asia.61.d: "清晨，第一批苏-24 与苏-34 战机降落在拉塔基亚的赫梅明空军基地。莫斯科宣布：应叙利亚合法政府的请求，俄罗斯空天军将对恐怖组织实施空袭。这是冷战结束以来，俄罗斯第一次在前苏联范围之外进行大规模军事行动。"
 roc_asia.62.a: "签署备忘录"
 roc_asia.62.t: "阿斯塔纳的降级区"
 roc_asia.62.d: "俄、伊、土三国代表在阿斯塔纳签署降级区备忘录：前线冻结在目前的位置，空袭暂停，人道通道开放。伊德利卜、霍姆斯北部、东古塔与南部被划为四个降级区。这为叙利亚带来了喘息的机会，但没有人知道它能维持多久。"
 roc_asia.63.a: "继续转型"
 roc_asia.63.b: "保持强硬"
 roc_asia.63.t: "解放组织的转型"
 roc_asia.63.d: "al-Julani 穿着西装出现在电视镜头前，接受西方记者的专访：解放组织是叙利亚的武装，不是国际圣战的前哨，它关心的只有叙利亚人民的未来。伊德利卜的街头出现了新的政治海报，外界在怀疑与观望之间，等待它用行动证明自己。"
 roc_asia.64.a: "并肩作战"
 roc_asia.64.b: "保持独立指挥"
 roc_asia.64.t: "土耳其军队越境"
 roc_asia.64.d: "土耳其坦克越过边境，从杰拉布卢斯南下，自由叙利亚军的旗帜与土耳其国旗并排飘扬。行动的目标是肃清伊斯兰国，也是阻止库尔德武装连成一片。在这场「幼发拉底之盾」里，谁是主角？反对派与安卡拉的关系将从此改变。"
 roc_asia.69.a: "好消息"
 roc_asia.69.t: "化学武器库存清空"
 roc_asia.69.d: "禁止化学武器组织的检查人员报告：叙利亚境内申报的化学武器库存已全部销毁，最后一批化学剂在地中海的美国船只上被中和。西方的军事威胁暂时消除了，但人权组织怀疑，政权仍然隐藏着未申报的库存。"
 SYRB_iran_pact_idea: "与伊朗的战略协议"
 SYRB_iran_pact_idea_desc: "防务合作协议、互免签证与联合工业项目：伊朗成为大马士革最重要的盟友，也带来了与海湾国家的新隔阂。"
 SYRB_turkey_idea: "叙土蜜月"
 SYRB_turkey_idea_desc: "免签、自贸区与联合内阁会议：叙利亚与土耳其的边境贸易在几年内翻了几番。"
 SYRB_drought_idea: "干旱与农村危机"
 SYRB_drought_idea_desc: "2006 年至 2010 年的干旱毁掉了东北部的农业，数十万农民涌向德拉与大马士革的郊区。"
 SYRL_pension_idea: "全民养老金与社会保险"
 SYRL_pension_idea_desc: "覆盖农民与个体劳动者的统一养老金，是复兴党左翼最看重的福利承诺。"
 SYRL_self_reliance_idea: "自力更生计划"
 SYRL_self_reliance_idea_desc: "用国内的钢铁、水泥、纺织与化肥替代进口：制裁越重，越要自己动手。自力更生让工业产能逐步恢复，也让民众在困难中团结在一起。"
 SYRL_media_idea: "公共媒体与舆论监督"
 SYRL_media_idea_desc: "公共广播改成由议会监督的独立机构，私营报纸也获得出版许可。舆论监督让官员不敢胡作非为，政府的施政更受民众信任，社会也更加稳定。"
 SYRB_tb_edu: "高等教育与创业"
 roc_asia.74.a: "接受现实"
 roc_asia.74.b: "强调与黎巴嫩的特殊关系"
 roc_asia.74.t: "最后一辆军车"
 roc_asia.74.d: "2005 年 4 月，最后一批叙军车辆驶过马斯纳口岸。二十九年的驻军就此结束，黎巴嫩街头欢呼雀跃，烈士广场上挤满了挥舞国旗的人群。大马士革的官方电视台说：这是「兄弟之间的重新部署」。政权在黎巴嫩的影响力，从此改由真主党代为维持。"
 roc_asia.75.a: "承认问题，推出改革"
 roc_asia.75.b: "严厉处置"
 roc_asia.75.t: "手机里的标语"
 roc_asia.75.d: "突尼斯的小贩点燃了自己，埃及的穆巴拉克在十八天内倒台。德拉的孩子们在学校的墙上涂写：「轮到你了，医生」，随后被情报部门抓走、遭受酷刑。抗议从德拉蔓延到全国。总统府说，这一切都是外国势力策划的阴谋。"
 SYRL_tb_edu: "义务教育"
 roc_asia.76.a: "通过宪章"
 roc_asia.76.t: "起草宪章"
 roc_asia.76.d: "全国对话大会的最后一天，代表们逐条表决新的国家宪章。第一条通过时，会场里响起了一阵掌声；第三十七条（总统任期）通过时，会场里安静了很久。"
 ISIX_caliphate_idea: "哈里发国"
 ISIX_caliphate_idea_desc: "al-Baghdadi登上摩苏尔大清真寺的讲坛，宣布哈里发国成立：全世界的穆斯林都有义务效忠。"
 ISIX_hisbah_idea: "宗教警察"
 ISIX_hisbah_idea_desc: "希斯巴巡逻队在每个街区执行沙里亚法：服饰、礼拜、烟酒。居民敢怒不敢言。"
 ISIX_oil_idea: "走私石油"
 ISIX_oil_idea_desc: "油罐车队从迪尔祖尔的油田出发，经土耳其边境的走私网络流向地下市场。"
 ISIX_media_idea: "宣传机器"
 ISIX_media_idea_desc: "《达比克》杂志、高清处决视频与社交媒体，把一个组织变成了全球的恐惧符号。"
 ISIX_foreign_fighters_idea: "外籍战斗人员"
 ISIX_foreign_fighters_idea_desc: "数万名来自欧洲、中亚与北非的外籍人员经由土耳其边境涌入，补充了兵员。但他们与当地居民语言不通、文化不同，冲突时有发生；各国随后加强了边境管控与反极端化工作。"
 ISIX_tunnels_idea: "地道与纵深防御"
 ISIX_tunnels_idea_desc: "地道、狙击手、自杀车与地雷，把每一座城市变成一座堡垒。防守方能在巷战中不断补充兵力，进攻方每前进一条街都要付出惨重代价，而被困的平民承受了最大的苦难。"
 ISIX_underground_idea: "转入地下"
 ISIX_underground_idea_desc: "失去领土之后，组织转为游击与恐怖活动，等待下一个机会。它已无力发动大规模的攻势，但分散的小组更难被彻底消灭，各国的反恐行动仍需长期持续。"
 ROJX_democratic_confederalism_idea: "民主联邦主义"
 ROJX_democratic_confederalism_idea_desc: "性别平等、地方议会与多民族共治：罗贾瓦的社会契约在战火中试验着一种新的政治。"
 ROJX_women_idea: "共同主席制与女性武装"
 ROJX_women_idea_desc: "每个机构都有一位男性与一位女性共同主席，女子保卫部队成为战场上的象征。"
 ROJX_ypg_idea: "人民保卫部队"
 ROJX_ypg_idea_desc: "YPG 与 YPJ 的战士在科巴尼、拉卡与迪尔祖尔的战斗中成长为一支纪律严明的武装。"
 ROJX_coalition_idea: "国际联军的空中支援"
 ROJX_coalition_idea_desc: "美国领导的联军为地面攻势提供空袭、侦察与特种部队顾问。联军的空中力量让自治区的部队在进攻中占尽优势，但对华盛顿的依赖也限制了自治政府的政治自主。"
 ROJX_oil_idea: "东部油田"
 ROJX_oil_idea_desc: "自治政府控制了东部的油田与水电站，成为财政最重要的来源。石油与电力的收入支付了战士与公务员的薪水，也让自治区在禁运与封锁中撑了下来。"
 ROJX_camps_idea: "战俘营与难民营"
 ROJX_camps_idea_desc: "数万名伊斯兰国家属与战俘关押在营地里，自治政府承担着没有国际援助的安全与人道责任。"
 ROJX_turkey_pressure_idea: "土耳其的压力"
 ROJX_turkey_pressure_idea_desc: "安卡拉视自治区为恐怖组织的延伸，边境的炮击与越境行动从未停止。持续的威胁让民众惶惶不安，却也让自治区的部队在防御作战中积累了丰富的经验。"
 SYR_ext_isis_war: "对「伊斯兰国」的敌意"
 SYR_ext_ypg_aid: "支持叙利亚民主力量"
 SYR_ext_tur_pkk: "土耳其对 PKK 的敌意"
 ISIX_tb_captured: "缴获的重武器"
 ISIX_tb_drone: "无人机与诡雷"
 roc_asia.65.a: "宣布哈里发国"
 roc_asia.65.t: "哈里发降临摩苏尔"
 roc_asia.65.d: "al-Baghdadi 登上摩苏尔努里大清真寺的讲坛，宣布建立所谓的「哈里发国」，并要求全世界的穆斯林效忠。这是自 1924 年奥斯曼哈里发被废除以来第一次有人自称哈里发。全世界的伊斯兰学者与宗教机构几乎一致地谴责了这一宣言。"
 roc_asia.66.a: "这是转折点"
 roc_asia.66.t: "科巴尼的春天"
 roc_asia.66.d: "战斗持续了四个多月，科巴尼的守军在联军空袭与伊拉克库尔德自由斗士的增援下，终于将伊斯兰国逐出了这座城市。城市的大半已成废墟，但守军在废墟上升起了旗帜。伊斯兰国第一次在一场大规模的战斗中失败，它的神话开始动摇。"
 roc_asia.67.a: "保卫剩余的地区"
 roc_asia.67.t: "阿夫林的陷落"
 roc_asia.67.d: "土耳其军队与叙利亚国民军攻入阿夫林市。经过两个月的抵抗，守军被迫撤离，数十万居民逃离家园，城中的雕像与库尔德文化的标志被推倒。库尔德人指责世界无动于衷：他们曾为全世界与伊斯兰国作战，如今却被盟友抛弃。"
 roc_asia.68.a: "等待时机"
 roc_asia.68.t: "隐入地下"
 roc_asia.68.d: "最后的据点陷落。数千名武装人员散入叙利亚与伊拉克交界的沙漠与城镇，他们带走了武器，也带走了仇恨。所谓的「哈里发国」在地图上消失了，但它的残余组织仍在暗处等待，各国的反恐部队知道，这场战争还远没有结束。"
 SYRX_crisis_cell: "危机管理小组"
 SYRX_crisis_cell_desc: "「叛乱」从德拉蔓延到全国。总统府设立危机管理小组：国防、情报与内政部门首脑每天开会，统一协调镇压与平息。"
 SYRX_defend_damascus: "保卫大马士革"
 SYRX_defend_damascus_desc: "反对派占领了首都外围的杜马与东古塔，迫击炮弹落进了总统府的院子，2012 年的爆炸案更炸死了国防部长与总统的妹夫。无论如何，大马士革都必须守住：首都一旦失陷，政权就不复存在。"
 SYRX_fourth_division: "第四装甲师与共和国卫队"
 SYRX_fourth_division_desc: "Maher al-Assad 的第四装甲师与共和国卫队是政权最可靠的拳头，几乎全部由忠诚的阿拉维派军官指挥，部署在卡松山与首都周围的制高点上。其他部队可以叛逃，这两支部队绝不能出问题。"
 SYRX_checkpoints: "检查站网络"
 SYRX_checkpoints_desc: "大马士革的每一个路口都设有检查站与情报员，身份证、手机与行李都要被翻查，反对派的渗透被压缩到最低限度。四个情报机构各自为政，但在维持首都秩序这一点上，它们效率惊人。"
 SYRX_siege_tactic: "围城战术"
 SYRX_siege_tactic_desc: "围困、断粮、轰炸，直到叛军控制区的居民别无选择。这套办法在霍姆斯、东古塔与阿勒颇一再重复，最后以「和解协议」与绿色大巴撤离收场。政权因此收复了大片土地，也背上了战争罪的指控。"
 SYRX_reconciliation: "地方和解协议"
 SYRX_reconciliation_desc: "与叛军达成「和解」：武装人员及家属携带轻武器撤往伊德利卜，城区交还政府。这是代价较小的收复方式。"
 SYRX_reform_army: "整编军队"
 SYRX_reform_army_desc: "叛逃、伤亡与逃兵让叙利亚阿拉伯军萎缩了一半，不少旅只剩下番号。必须重新整编、合并番号、改组指挥，把仍然可靠的部队集中起来，组成机动的突击力量。"
 SYRX_ndf: "国防军（NDF）"
 SYRX_ndf_desc: "把各地的亲政府民兵——沙比哈、人民委员会、复兴营——整合成国防军，由政权直接发饷发枪，伊朗顾问负责训练。国防军解决了兵力不足的问题，但地方指挥官借机敛财、各自为政，也埋下了战后军阀化的隐患。"
 SYRX_tiger_forces: "老虎部队"
 SYRX_tiger_forces_desc: "由情报部队的精锐组成的「老虎部队」，从空军情报局的 Suheil al-Hassan 上校手中接过任务：哪里最难，就去哪里。这支部队获得俄罗斯的直接支援与最好的装备，在阿勒颇、哈马与帕尔米拉屡屡担任突击先锋。"
 SYRX_airpower: "空军与桶装炸弹"
 SYRX_airpower_desc: "空军是政权对叛军最大的优势。直升机与战机日夜出动，从空中投下的桶装炸弹简陋却致命，市场、医院与面包店都难以幸免。这也引来了国际社会最猛烈的谴责与制裁。"
 SYRX_conscription: "紧急征召"
 SYRX_conscription_desc: "兵役期限延长，预备役全面动员，检查站上的士兵随时把适龄男子拉去入伍。适龄男子要么入伍，要么外逃：数以十万计的年轻人逃往黎巴嫩、土耳其与欧洲，成为战争最大的难民潮的一部分。"
 SYRX_armor_rebuild: "装甲兵重建"
 SYRX_armor_rebuild_desc: "从俄罗斯与伊朗取得 T-72、T-90 与零配件，把受损的装甲师重新修好。俄罗斯顾问进驻各地的修理厂，教叙军如何保养与使用新装备；被打残的装甲部队，终于又能组织起像样的攻势。"
 SYRX_foreign_backers: "争取盟友"
 SYRX_foreign_backers_desc: "孤立无援的政权需要朋友：伊朗要的是连接黎巴嫩真主党的「抵抗轴心」，俄罗斯要的是塔尔图斯的地中海基地与大国地位。两国的利益并不完全一致，但都不能让大马士革倒下。"
 SYRX_iran_axis: "伊朗与真主党"
 SYRX_iran_axis_desc: "伊朗革命卫队的圣城旅与黎巴嫩真主党的人员进入叙利亚，伊拉克与阿富汗的什叶派民兵也赶来参战。Qasem Soleimani 亲自坐镇指挥，古赛尔与卡拉蒙山区的胜利让政权缓过了气。"
 SYRX_russia_intervention: "俄罗斯空天军介入"
 SYRX_russia_intervention_desc: "2015 年 9 月，俄罗斯空天军进驻拉塔基亚的赫梅明空军基地，苏-24 与苏-34 开始对反对派阵地进行密集轰炸，里海舰队也发射了巡航导弹。政权的颓势在几周内被扭转。"
 SYRX_joint_command: "联合作战指挥部"
 SYRX_joint_command_desc: "大马士革、德黑兰与莫斯科的军官在同一间作战室里工作，俄军负责空中与情报，伊朗负责民兵，叙军负责地面推进。三方在战术上常有分歧，却成功把战线从一个城市推向下一个城市。"
 SYRX_chemical_line: "化学武器与「红线」"
 SYRX_chemical_line_desc: "2013 年 8 月，东古塔的沙林毒气让国际舆论哗然，数百人在睡梦中死去。华盛顿说：这是红线。美军的战舰已在地中海就位，政权面临一个难以回避的抉择：交出化学武器，还是承受空袭。"
 SYRX_chem_deal: "销毁化学武器"
 SYRX_chem_deal_desc: "在莫斯科的斡旋下，政权同意加入《禁止化学武器公约》，把库存交给国际社会销毁。打击被取消，政权换来了喘息。"
 SYRX_chem_deny: "否认与反击"
 SYRX_chem_deny_desc: "政权否认一切指控，指责反对派自导自演。西方的制裁与谴责接踵而至，也让盟友付出了更多外交代价。"
 SYRX_new_constitution: "2012 年新宪法"
 SYRX_new_constitution_desc: "2012 年的宪法修订取消了第八条中复兴党「领导国家与社会」的条款，并规定了多党选举与总统任期限制。政权以此回应「阿拉伯之春」的改革要求，反对派则说这只是换了封面，权力仍在同一个家族手中。"
 SYRX_reconciliation_ministry: "民族和解部与大赦"
 SYRX_reconciliation_ministry_desc: "设立民族和解部，颁布大赦令，承诺放下武器的人可以回家。在部分城镇，地方和解确实让战斗停了下来；但批评者说，大赦令的受益者从来不包括真正的反对派，许多回乡的人在检查站上就失踪了。"
 SYRX_presidential_election: "2014 年总统选举"
 SYRX_presidential_election_desc: "2014 年 6 月，在战火中举行的总统选举只在政府控制区投票，政权宣布「人民再次选择了 Assad」，得票率接近九成。反对派与西方拒绝承认，称之为「血腥的闹剧」，但政权已经有了继续执政的法律外衣。"
 SYRX_astana_process: "阿斯塔纳进程与降级区"
 SYRX_astana_process_desc: "在俄罗斯、伊朗与土耳其的主持下，叙利亚被划分为四个「降级区」：战火暂时平息，战线冻结在新的位置。"
 SYRX_aleppo_reconquest: "收复阿勒颇"
 SYRX_aleppo_reconquest_desc: "经过四年的分裂与数月的围城，阿勒颇东区在 2016 年底回到政府手中，最后一批武装人员与平民乘坐绿色大巴撤往伊德利卜。叙利亚最大的城市重新统一，这是内战的转折点。"
 SYRX_palmyra_desert: "沙漠战役与帕尔米拉"
 SYRX_palmyra_desert_desc: "把伊斯兰国从帕尔米拉与中部沙漠中驱逐出去，打通通往幼发拉底河的道路。古城的神庙已被炸毁，考古学家哈立德·阿萨德被斩首；收复帕尔米拉，既有战略意义，也是一场宣传上的胜利。"
 SYRX_idlib_question: "伊德利卜问题"
 SYRX_idlib_question_desc: "数十万人与各路武装被挤进伊德利卜。进攻意味着巨大的人道灾难，不进攻则让这块飞地长期存在。"
 SYRX_euphrates_front: "幼发拉底河东岸"
 SYRX_euphrates_front_desc: "迪尔祖尔与东部油田在谁手中，决定了战后叙利亚的财政：政权、库尔德人与美军都盯着这一带。被伊斯兰国围困三年的迪尔祖尔守军终于获救，但幼发拉底河东岸的油田大多已落入美国支持的叙利亚民主力量手中。"
 SYRX_war_economy: "战争经济"
 SYRX_war_economy_desc: "关税、配给与黑市交错并存：政权在战争中重新分配了国家的财富。检查站收取过路费，与政权关系密切的商人垄断了燃油与小麦的进口，第四师掌控着走私线路。战争让一批新贵暴富，也让普通人陷入赤贫。"
 SYRX_whole_syria: "统一的叙利亚"
 SYRX_whole_syria_desc: "政权宣称：国土上的每一寸，都要重新回到大马士革的管辖之下。伊德利卜的叛军、东北部的库尔德自治区、北部的土耳其占领区，都在这句话的范围之内。但没有俄罗斯与伊朗的支持，这只能是一句口号。"
 SYRF_council: "叙利亚全国委员会"
 SYRF_council_desc: "2011 年秋，流亡反对派在伊斯坦布尔组成叙利亚全国委员会，宣布代表「叙利亚人民」。委员会里有穆斯林兄弟会、世俗派知识分子与库尔德代表，但他们大多多年未踏上叙利亚的土地，与街头的抗议者联系有限。"
 SYRF_national_coalition: "全国联盟"
 SYRF_national_coalition_desc: "2012 年 11 月，全国委员会与其他派别在多哈合并为「叙利亚革命与反对派全国联盟」，得到美国、欧盟与海湾国家等数十国的承认，被视为叙利亚人民的合法代表。阿拉伯联盟甚至一度把叙利亚的席位交给了它。"
 SYRF_geneva: "日内瓦谈判"
 SYRF_geneva_desc: "联合国主持的日内瓦会谈：政权与反对派坐在同一张桌子前，谁也不肯让步。反对派要求 Assad 下台作为谈判的前提，政权则只愿意谈「反恐」。几轮会谈下来，唯一的成果是双方都出席了。"
 SYRF_interim_government: "临时政府"
 SYRF_interim_government_desc: "联盟任命的临时政府在解放区开展行政：警察、医院、法院与学校。部长们大多在加济安泰普办公，资金依赖外国捐助，但在阿勒颇乡村与伊德利卜的部分城镇，人们第一次领到了不由复兴党签发的证件。"
 SYRF_friends_of_syria: "叙利亚人民之友"
 SYRF_friends_of_syria_desc: "西方与海湾国家组成「叙利亚人民之友」，承诺提供政治与物资支持。在突尼斯、伊斯坦布尔与巴黎的会议上，上百个国家的代表发表声明、承诺援助；但真正送到前线的，往往远少于会场上许下的数字。"
 SYRF_military_council: "最高军事委员会"
 SYRF_military_council_desc: "各地叛变军官与武装团体合编为最高军事委员会，由 Salim Idris 将军统领。委员会试图把数百个各自为政的营与旅纳入统一的指挥，并作为外国军援的唯一接收渠道，但地方指挥官们并不总是听令。"
 SYRF_defections: "军队倒戈"
 SYRF_defections_desc: "士兵与军官成批叛逃，带着武器加入自由叙利亚军。从上校 Riad al-Asaad 宣布成立自由军开始，每一段叛逃者在镜头前出示证件的视频，都在动摇政权军队的士气，也为反对派补充了受过训练的兵员。"
 SYRF_local_councils: "地方革命委员会"
 SYRF_local_councils_desc: "解放区里的地方委员会接手了面包房、水电与学校。这些由律师、教师与工程师组成的委员会，是叙利亚几十年来第一次真正由居民自己选出的地方政府，也是革命最珍贵的遗产之一。"
 SYRF_brigades: "旅级编制"
 SYRF_brigades_desc: "把零散的营与小股武装按地域合编为旅，终于有了相对完整的指挥结构。旅部负责统一调配弹药、伤员后送与轮换，各营不再只为保卫自己的村镇而战，自由军第一次能组织起跨地区的战役。"
 SYRF_foreign_support: "外国援助"
 SYRF_foreign_support_desc: "没有外国援助，自由叙利亚军撑不了几个月。问题在于：从谁那里接受，又得付出什么。土耳其要的是对库尔德人的强硬，海湾国家要的是意识形态上的影响，美国要的是不让武器流入极端派手中。每一份援助都有附加条件。"
 SYRF_turkey_haven: "土耳其庇护"
 SYRF_turkey_haven_desc: "土耳其开放边境、设立难民营与训练基地，成为反对派最重要的后方。哈塔伊与加济安泰普成了反对派的指挥部、医院与补给站，数百万难民越境避难；代价是安卡拉对反对派的政治方向有了决定性的话语权。"
 SYRF_gulf_money: "海湾资金"
 SYRF_gulf_money_desc: "卡塔尔、沙特与科威特的资金源源不断，同时也把各个派系的意识形态带了进来。不同的捐助者扶植不同的派系，资金多的旅越打越大，世俗派的部队却常常因为缺钱而被迫解散或转投他人。"
 SYRF_train_equip: "美国训练与装备"
 SYRF_train_equip_desc: "中情局的「木材梧桐」计划为经过审查的旅提供陶式反坦克导弹与训练，条件是不能落入极端派手中。在哈马与伊德利卜的平原上，陶式导弹击毁了大批政权坦克，被戏称为「Assad 坦克的终结者」。"
 SYRF_extremist_question: "极端派的挑战"
 SYRF_extremist_question_desc: "资金与武器越来越多地流入萨拉菲派武装，努斯拉阵线在前线上的表现远胜自由军。是联合、是对抗，还是装作没看见？这个选择将决定西方会不会继续支持革命，也决定革命最终会变成什么样子。"
 SYRF_ally_nusra: "与努斯拉并肩作战"
 SYRF_ally_nusra_desc: "在前线上，努斯拉阵线是最能打的部队，它的突击队往往在自由军止步的地方打开缺口。联合作战，意味着也接受它的方式：解放区里出现了宗教法庭与黑旗，西方的援助随之冻结。"
 SYRF_isolate_extremists: "与极端派划清界限"
 SYRF_isolate_extremists_desc: "宣布与基地组织与「伊斯兰国」划清界限，换取西方的持续援助。部分营队被迫离开与努斯拉共同控制的城镇，前线兵力因此下降；但反对派保住了国际社会对「温和反对派」的承认。"
 SYRF_euphrates_shield: "「幼发拉底之盾」"
 SYRF_euphrates_shield_desc: "2016 年 8 月，土耳其军队与自由叙利亚军一道越过边境，从杰拉布卢斯出发，肃清北部的伊斯兰国与阻止库尔德武装连成一片。行动夺回了达比克与巴卜，也让反对派在北部有了一块受土耳其保护的稳定地区。"
 SYRF_national_army: "叙利亚国民军"
 SYRF_national_army_desc: "土耳其支持的各路武装整编为叙利亚国民军，在北部地区形成统一的指挥系统，并接受临时政府国防部的名义领导。国民军的军饷与装备都来自安卡拉，纪律却参差不齐，劫掠与派系冲突时有所闻。"
 SYRF_liberated_aleppo_damascus: "攻入大马士革"
 SYRF_liberated_aleppo_damascus_desc: "自由叙利亚军从北线与南线同时发动攻势，目标是首都。北路军沿 M5 公路南下，南方阵线从德拉北上，首都周边的潜伏部队准备里应外合。这是革命最大胆的一步，成败在此一举。"
 SYRF_transition_plan: "过渡治理方案"
 SYRF_transition_plan_desc: "起草过渡期宪章：由过渡委员会接管权力，军队与安全机构改组，选举在两年内举行。为了避免重蹈伊拉克「去复兴党化」的覆辙，宪章规定基层公务员与未涉罪行的军官都可以留任。"
 SYRF_free_syria_victory: "自由的叙利亚"
 SYRF_free_syria_victory_desc: "政权倒下了。自由叙利亚军与全国联盟走进大马士革，倭马亚清真寺前的人群挥舞着三星旗，开始建设一个新的国家。但战争留下了五十万死者、数百万难民与一个满目疮痍的国家，重建比革命更难。"
 SYRN_emergence: "胜利阵线"
 SYRN_emergence_desc: "2012 年初，「支援阵线」（努斯拉）发表声明，在叙利亚境内对政权军警发动袭击。它由伊拉克的伊斯兰国派出的骨干组建，很快以严明的纪律与惨烈的自杀式袭击在各路武装中脱颖而出。美国随即把它列为恐怖组织。"
 SYRN_build_ranks: "精锐与突击队"
 SYRN_build_ranks_desc: "以外籍战斗人员与在伊拉克打过仗的老兵为班底，建立能够执行突击与阵地战的精锐部队。新兵要经过宗教课程与军事训练两道关卡，组织严密、保密性强，与松散的自由军形成了鲜明的对比。"
 SYRN_inghimasi: "突击与攻坚"
 SYRN_inghimasi_desc: "攻坚部队开着装甲改装的自杀车冲撞阵地打开缺口，步兵紧随其后。在伊德利卜与阿勒颇的攻势中，这种战术屡屡打穿政权的防线。伤亡极大，战果也极大，平民同样付出了沉重代价。"
 SYRN_wage_war: "消耗战"
 SYRN_wage_war_desc: "在乡村与山区不断伏击政权军队的补给线，用持续的消耗拖垮对手。拉塔基亚山区与哈马北部的公路成了政权车队的噩梦，政府军不得不把大量兵力用于护送与守点。"
 SYRN_sharia_courts: "沙里亚法庭"
 SYRN_sharia_courts_desc: "在占领区设立沙里亚法庭，处理民事与刑事案件。迅速的审判与廉价的公道，让一部分居民接受了它。"
 SYRN_dawa_offices: "宣教办公室"
 SYRN_dawa_offices_desc: "宣教办公室负责施粥、办学、办医院，也负责招募新人。在饱受战火的城镇，能按时分发面包与煤气罐的组织就能赢得人心；宣教活动把武装组织变成了一个提供服务的地方政权。"
 SYRN_qaeda_oath: "向基地组织效忠"
 SYRN_qaeda_oath_desc: "2013 年 4 月，伊拉克的 al-Baghdadi 宣布努斯拉并入「伊拉克和沙姆伊斯兰国」。努斯拉领导人 al-Julani 拒绝并入，转而向基地组织领导人 al-Zawahiri 宣誓效忠。圣战阵营从此分裂，双方很快兵戎相见。"
 SYRN_break_qaeda: "与基地组织切割"
 SYRN_break_qaeda_desc: "2016 年 7 月，al-Julani 首次在镜头前露面，宣布与基地组织切断关系，更名为「沙姆征服阵线」，以争取更广泛的支持。批评者认为这只是换了名字，但这个决定为它日后与土耳其、与其他派系打交道铺平了道路。"
 SYRN_absorb_factions: "吞并其他派系"
 SYRN_absorb_factions_desc: "用武力与谈判，把伊德利卜的其他武装一个个并进自己旗下：不服从的被缴械，愿意合作的被收编。自由军的「哈兹姆运动」与「叙利亚革命者阵线」在它的攻击下相继瓦解，伊德利卜的权力越来越集中。"
 SYRN_fight_isis: "对抗「伊斯兰国」"
 SYRN_fight_isis_desc: "与伊斯兰国的冲突从相互指责升级为全面战争：双方在拉卡、代尔祖尔与阿勒颇北部反复争夺。努斯拉成为抵抗伊斯兰国的力量之一，西方情报机构也开始重新评估它的威胁。"
 SYRN_hts_formation: "沙姆解放组织（HTS）"
 SYRN_hts_formation_desc: "2017 年初，沙姆征服阵线联合努尔丁·赞吉运动等数个派系，成立「沙姆解放组织」。它成为伊德利卜最强大的武装力量，也是叙利亚西北部事实上的统治者，国际社会对它的定性仍是恐怖组织。"
 SYRN_take_idlib: "控制伊德利卜"
 SYRN_take_idlib_desc: "2015 年「征服军」攻下伊德利卜城后，伊德利卜省逐步落入解放组织手中。这里聚集了从全国各地撤来的反对派武装与数百万流离失所的平民，将成为它的统治中心，也是叙利亚内战最后的反对派堡垒。"
 SYRN_salvation_government: "救国政府"
 SYRN_salvation_government_desc: "设立救国政府，下设各部、法院、警察与税务，成为伊德利卜的事实政权。它发放身份证与车牌，管理学校与面包房，用技术官僚的面孔来淡化武装组织的色彩，试图证明自己能够治理。"
 SYRN_border_crossings: "边境口岸"
 SYRN_border_crossings_desc: "控制土叙边境上的巴布哈瓦口岸，向过往货物与燃油征税，换取每月数百万美元的财政收入。联合国的人道物资也经由这里进入伊德利卜，口岸是整个地区的生命线，也是解放组织最重要的钱袋子。"
 SYRN_turkey_pragmatism: "与土耳其的默契"
 SYRN_turkey_pragmatism_desc: "土耳其依据阿斯塔纳协议在伊德利卜设有观察点，解放组织与安卡拉之间保持着微妙的默契：土耳其需要它维持秩序、阻止难民潮，它需要土耳其挡住俄罗斯与政权的攻势。双方都不愿公开承认这层关系。"
 SYRN_moderate_image: "「温和」形象"
 SYRN_moderate_image_desc: "放下激进口号，向西方与邻国示好，自称是叙利亚人民的武装，而非国际圣战的一部分。al-Julani 换上西装接受西方媒体采访，外籍战斗人员被边缘化，宗教警察的权力也被收紧。"
 SYRN_battle_for_damascus: "南下大马士革"
 SYRN_battle_for_damascus_desc: "解放组织选择最冒险的一步：自伊德利卜向南发动攻势，争夺中央的权力。政权的军队早已疲惫不堪，俄罗斯与伊朗自顾不暇；如果阿勒颇与哈马能在几天内拿下，通往大马士革的道路就会突然打开。"
 SYRN_syria_for_syrians: "叙利亚人的叙利亚"
 SYRN_syria_for_syrians_desc: "解放组织宣布解散旗号，转型为全国性的政治力量，提出建立一个容纳各教派与民族的「新叙利亚」。世界在怀疑与观望之间注视着它：曾经的圣战组织，能否真的变成一个国家的执政者？"
 SYRX_sanctions: "凯撒法案与经济崩溃"
 SYRX_sanctions_desc: "2020 年的《凯撒法案》切断了重建资金，里拉一夜之间贬值，面包与汽油要排队才能买到。政权的敌人不再只在战场上。"
 SYRX_captagon: "卡塔贡与灰色经济"
 SYRX_captagon_desc: "叙利亚成了全世界最大的兴奋剂生产国之一，出口收入养活了半个政权。邻国开始称它为「毒品国家」。"
 SYRX_arab_league_return: "重返阿拉伯联盟"
 SYRX_arab_league_return_desc: "2023 年，叙利亚时隔十二年回到阿盟的座位上。土耳其—叙利亚大地震后，海湾国家的援助与外交接触接踵而至；利雅得与阿布扎比押注：孤立没有用，不如做交易，用重建资金换取对伊朗影响力与毒品走私的限制。"
 SYRX_israeli_strikes: "以色列空袭与防空"
 SYRX_israeli_strikes_desc: "以色列战机反复空袭大马士革周边、霍姆斯与伊朗的武器运输线，目标是阻止真主党获得精确导弹。政权的老式防空系统疲于应付，俄罗斯提供的 S-300 也没能改变局面，叙利亚的领空几乎任人进出。"
 SYRX_reconstruction_plan: "重建蓝图"
 SYRX_reconstruction_plan_desc: "被炸毁的城区、被烧毁的田地、断电的工厂：重建需要的钱比政权拥有的多十倍。谁愿意出钱，谁就能拿到合同。"
 SYRX_refugee_return: "难民回国计划"
 SYRX_refugee_return_desc: "六百万叙利亚人逃往国外，另有六百万在国内流离失所。政权号召他们回家，承诺大赦与重建；但人们记得离开的原因：兵役、检查站、被没收的房产与失踪的亲人。回国的人数，远远低于宣传的数字。"
 SYRF_southern_front: "南方阵线"
 SYRF_southern_front_desc: "德拉与库奈特拉的叛乱武装与约旦、美国在安曼的军事行动中心保持着联络，以相对温和的世俗面貌示人。德拉是 2011 年抗议的发源地，南方阵线一度是反对派中最有组织、最受西方信任的力量。"
 SYRF_sdf_talks: "与库尔德武装的谈判"
 SYRF_sdf_talks_desc: "叙利亚北部的库尔德人手握武装与油田，还有美国的空中支援。联合、对抗，还是保持距离？土耳其视人民保护部队为恐怖组织，反对派的许多派系也不信任库尔德人的自治要求，但没有他们，北方的版图就不完整。"
 SYRN_sochi: "索契协议与观察点"
 SYRN_sochi_desc: "2018 年，俄罗斯与土耳其达成协议：划定缓冲区，土军在伊德利卜设立观察点。解放组织夹在两大国之间求生存。"
 SYRN_delisting: "摘掉「恐怖组织」标签"
 SYRN_delisting_desc: "解放组织派人游说西方：我们只关心叙利亚，从未在境外发动袭击。要摘掉标签，首先得证明自己不是基地组织的分支：打击境内的基地组织残部、交出外籍极端分子、保障少数教派的安全。"
 SYRB_consolidate: "权力的巩固"
 SYRB_consolidate_desc: "继位三年之后，总统终于把权力握在了自己手里：老一辈已经退场，家族与军队站在他身后。现在，他要决定用这份权力做什么。"
 SYRB_security_state: "安全国家"
 SYRB_security_state_desc: "大马士革之春结束了：2001 年的政治沙龙被关闭，签署公开信的知识分子与议员被带走。年轻的总统上台时曾让人们期待改革，但情报部门说，稳定比自由更重要，而复兴党的元老们同意这一点。"
 SYRB_open_economy: "经济开放"
 SYRB_open_economy_desc: "总统是在伦敦受训的眼科医生，也是叙利亚计算机学会的会长。他相信：只要经济开放、引进互联网与手机，政治自然会跟上。年轻的技术官僚被提拔进内阁，大马士革出现了第一批私人银行与网吧。"
 SYRB_baath_benefits: "复兴党的福利"
 SYRB_baath_benefits_desc: "党员子女优先入学、优先分房、优先就业——复兴党是国家，国家就是复兴党。全国数百万党员通过党的网络获得工作与福利，入党与其说是信仰的选择，不如说是生活的必需。"
 SYRB_personal_cult: "个人崇拜"
 SYRB_personal_cult_desc: "街头出现了新总统的画像：从戴墨镜的父亲，到穿西装的儿子，宣传部门为他塑造「年轻的希望」与「现代化领袖」的新形象。学校、政府大楼与出租车的后窗上，都贴着同一张笑脸。"
 SYRB_old_guard_balance: "与元老平衡"
 SYRB_old_guard_balance_desc: "父亲留下的元老——Khaddam、Shihabi、Zuabi——仍握着情报与军队的关键位置。要么拉拢，要么逐步替换：总统一边以反腐与退休为名清理元老，一边把自己的亲信与家族成员安插到要害部门。"
 SYRB_cosmetic_reforms: "表面的改革"
 SYRB_cosmetic_reforms_desc: "2005 年的复兴党代会通过了一份「更新与现代化」纲领：新的党章、新的口号、允许成立新的政党的承诺，权力结构保持原样。外国记者被允许参观，西方外交官写下谨慎乐观的电报，但什么也没有真正改变。"
 SYRB_mb_talks: "与穆斯林兄弟会的默契"
 SYRB_mb_talks_desc: "1982 年哈马屠杀之后，穆斯林兄弟会被当作头号敌人，成员可判死刑。现在，政权愿意让流亡的老一辈回国，换取他们放弃政治活动、保持沉默。这是一场脆弱的和解，双方都不信任对方。"
 SYRB_social_market: "社会市场经济"
 SYRB_social_market_desc: "放开私人银行、保险与大学，下调关税，向外资打开大门。官员们说：现在轮到资本家当「新阶级」了。大马士革的商场与酒店拔地而起，但获益最多的是总统的表亲 Rami Makhlouf 们，乡村与东部的农民却在干旱中陷入贫困。"
 SYRB_anticorruption: "反腐运动"
 SYRB_anticorruption_desc: "总统在电视上宣布要整顿腐败：几位部长下台，海关与税务局的一批官员被起诉，报纸连篇累牍地报道。但被点名的亲属一个都不在名单上，大马士革的商人们心照不宣：反腐反的是别人的腐。"
 SYRB_free_media: "私营媒体与互联网"
 SYRB_free_media_desc: "第一批私营报纸、卫星电视与网吧出现了，《雄狮》讽刺周刊一度让大马士革人争相传阅。审查并没有消失，只是变得更微妙：可以批评官僚作风，不可以批评总统一家；可以谈经济改革，不可以谈政治改革。"
 SYRB_electoral_reform: "选举改革"
 SYRB_electoral_reform_desc: "议会选举引入了更多独立候选人，地方理事会也有了更多的权力，可以自行管理部分预算。复兴党仍然通过「民族进步阵线」保证多数，但选民第一次可以在几位候选人之间作出真正的选择。"
 SYRB_medical_investments: "医疗与科研投资"
 SYRB_medical_investments_desc: "新的医院、药厂与大学实验室，是这位眼科医生出身的总统最愿意夸耀的成就之一。叙利亚的仿制药一度供应了九成的国内需求，并出口到整个阿拉伯世界；大马士革大学的医学院也重新吸引了海外的学者。"
 SYRB_before_the_storm: "风暴前夜"
 SYRB_before_the_storm_desc: "2010 年，叙利亚有了私人银行、手机与卫星电视，也有了干旱、失业与第一批抗议的标语。邻国的街头已经点燃了火。"
 SYRL_return_roots: "回到复兴党的初心"
 SYRL_return_roots_desc: "继位之后，年轻的总统发现：他继承的不只是一个国家，还有一整套围着家族转的权力网。「统一、自由、社会主义」——这三个词，难道只是挂在墙上的口号？"
 SYRL_end_dynasty: "终结家族政治"
 SYRL_end_dynasty_desc: "「国家不是谁的家产。」总统宣布：亲属不得担任部长、军队与情报首脑，姓氏不再是升迁的条件。这是复兴党创始人 Michel Aflaq 与 Salah al-Din al-Bitar 的初心，也是对四十年家族统治最直接的否定。"
 SYRL_makhlouf_trial: "清算家族财阀"
 SYRL_makhlouf_trial_desc: "追查 Rami Makhlouf 等亲属掌控的电信、石油与免税店垄断，没收非法所得，把合同拿出来公开招标。据估计，Makhlouf 一度控制了叙利亚六成的经济；他的倒台让国库进账，也让无数小商人第一次有机会参与竞争。"
 SYRL_retire_old_guard: "元老退休制"
 SYRL_retire_old_guard_desc: "请 Khaddam、Shihabi 与军队、党内的老一辈体面退休，让位给更年轻、也更有专业背景的干部。元老们保留荣誉职务与待遇，但不再插手人事与情报；这比清洗更温和，也更少树敌。"
 SYRL_merit_cadres: "任人唯贤"
 SYRL_merit_cadres_desc: "设立国家干部学院，用公开考试、任期考核与财产申报取代「关系」与「瓦斯塔」。阿勒颇、霍姆斯与代尔祖尔的年轻人第一次觉得，即使不认识大人物，也能凭本事进入国家机关。"
 SYRL_collective_leadership: "国家领导委员会"
 SYRL_collective_leadership_desc: "成立由党、军队与政府代表共同组成的国家领导委员会，重大决策不再由一个人说了算。委员会每周开会，以多数票决定战争、预算与人事；总统仍是第一人，但不再是唯一的人。"
 SYRL_term_limits: "总统任期限制"
 SYRL_term_limits_desc: "宪法规定：总统连任不得超过两届，每届七年，任满必须交出权力。这条规定，在中东的共和国里几乎没人兑现过：从开罗到大马士革，「终身总统」与父死子继才是常态。叙利亚要做第一个。"
 SYRL_depoliticize_army: "军队去家族化"
 SYRL_depoliticize_army_desc: "共和国卫队与第四装甲师并入国防部统一指挥，军官任命交由独立的人事委员会决定，不再看教派与籍贯。阿拉维派军官的比例逐步下降，军队开始真正成为全体叙利亚人的军队。"
 SYRL_arab_socialism: "阿拉伯社会主义的复兴"
 SYRL_arab_socialism_desc: "把社会主义的承诺重新写进经济政策：土地、工厂与银行，是为多数人服务，而不是为少数人致富。「统一、自由、社会主义」的口号在过去二十年里只剩下前两个字的空壳，如今左翼要把第三个字找回来。"
 SYRL_land_reform: "新土地改革"
 SYRL_land_reform_desc: "把荒废的国有土地租给无地农民，成立农业合作社，重新把农村拉回来。2006 年至 2010 年的大旱让上百万农民流入城市边缘，这也是起义的远因之一；新的土地改革提供种子、贷款与灌溉，让他们回到田里。"
 SYRL_public_sector: "重振公共部门"
 SYRL_public_sector_desc: "重新启动国家计划委员会，让能源、水泥、化肥、纺织回到国家手中。这些工厂在「社会市场经济」时代被低价卖给了权贵，如今以国有企业的身份重新开工，优先保障战后重建与民生的需要。"
 SYRL_five_year_plan: "新五年计划"
 SYRL_five_year_plan_desc: "在民众的参与下，制定新一期五年计划：优先保证粮食、电力与居民住宅。各省的人民委员会提交本地需求，计划委员会汇总成全国方案；这是叙利亚第一份由下而上制定的经济计划。"
 SYRL_euphrates_basin: "幼发拉底河流域开发"
 SYRL_euphrates_basin_desc: "塔布卡水坝是复兴党时代最大的工程，阿萨德湖为整个北部提供电力与灌溉。新一轮灌溉、水电与农业加工项目将沿着河谷展开，被战争撕裂的拉卡与代尔祖尔，将以河流为纽带重新连起来。"
 SYRL_workers_coops: "合作社与职工参与"
 SYRL_workers_coops_desc: "工人代表进入企业管理委员会，参与决定工资、班次与利润分配；农民合作社直接把粮食卖给国家，不再经过层层中间商。这是左翼对「社会主义」的新解释：不是官僚的国家，而是生产者的国家。"
 SYRL_welfare_state: "全民医疗与教育"
 SYRL_welfare_state_desc: "免费的医院与大学，是复兴党留下的最宝贵的遗产之一。要把它们修好，也要把它们送到最偏远的村庄。"
 SYRL_baath_congress: "复兴党代表大会"
 SYRL_baath_congress_desc: "召开一次真正开放辩论的党代会：党的纲领、地区领导机构与书记处全部重新选举。代表们在会场上公开争吵，有人为家族统治辩护，有人要求清算二十年来的错误，电视台全程直播。"
 SYRL_npf_pluralism: "真正的民族进步阵线"
 SYRL_npf_pluralism_desc: "让民族进步阵线中的其他党派——共产党、阿拉伯社会主义联盟、统一社会党——拥有自己的纲领、报刊与议席。"
 SYRL_internal_democracy: "党内民主"
 SYRL_internal_democracy_desc: "地方党部的书记由党员直接投票选举，不再由上级任命。许多靠关系上位的书记在选举中落马，取而代之的是在社区里口碑好的教师、医生与工会干部。复兴党开始重新学习如何赢得人心。"
 SYRL_council_power: "人民议会的实权"
 SYRL_council_power_desc: "预算、立法与质询权回到人民议会手中，议员有权质询部长，甚至可以提出不信任案。内阁需要向议会负责，部长们第一次要在镜头前回答议员关于停电、物价与腐败的尖锐问题。"
 SYRL_free_unions: "独立工会与农民联合会"
 SYRL_free_unions_desc: "工会与农民联合会可以自行选举领导、自行谈判工资与收购价，不再是复兴党的传声筒。阿勒颇的纺织工人与霍姆斯的炼油工人第一次以集体谈判的方式争取到了加薪。"
 SYRL_press_dialogue: "舆论监督"
 SYRL_press_dialogue_desc: "报纸可以批评部长，电视可以直播议会辩论。2001 年大马士革之春的记忆被重新翻出来，当年被关进监狱的知识分子获释后，有人成了专栏作家，有人当选了议员。言论的边界一步步向外推。"
 SYRL_civil_state: "公民国家"
 SYRL_civil_state_desc: "宪法写明：人人在法律面前平等，不分教派与族裔。阿拉维、逊尼、基督徒与库尔德人，都是叙利亚公民。"
 SYRL_palestine_cause: "巴勒斯坦事业"
 SYRL_palestine_cause_desc: "在巴勒斯坦问题上重申复兴党的立场：不承认以色列对戈兰高地与巴勒斯坦土地的占领，支持难民回归，不做交易。耶尔穆克难民营的重建被列为优先项目，左翼希望以此重新赢得阿拉伯世界的道义支持。"
 SYRL_arab_unity: "统一：阿拉伯团结"
 SYRL_arab_unity_desc: "复兴党的第一个口号是「统一」。重提阿拉伯共同市场、联合防务与人员自由流动的设想：从 1958 年短命的阿拉伯联合共和国到今天，阿拉伯统一始终是一个美丽的梦，但大马士革愿意再试一次。"
 SYRL_nonaligned: "不结盟与多元外交"
 SYRL_nonaligned_desc: "同时与莫斯科、北京、德黑兰、安卡拉与欧洲保持往来，不依附任何一个阵营。复兴党左翼记得纳赛尔与铁托的不结盟运动：小国要在大国之间生存，就不能把命运交给任何一个保护者。"
 SYRL_iraq_reconcile: "弥合与伊拉克复兴党的裂痕"
 SYRL_iraq_reconcile_desc: "1966 年复兴党分裂之后，大马士革与巴格达的两个复兴党互相攻击了几十年，叙利亚甚至在海湾战争中站在了美国一边。如今萨达姆早已不在，伊拉克的复兴党残部与叙利亚左翼有了共同的语言。是时候坐下来谈了。"
 SYRL_national_dialogue: "全国对话"
 SYRL_national_dialogue_desc: "邀请各党派、各宗教与各地方的代表，在同一间大厅里讨论国家的未来：库尔德人、德鲁兹人、基督徒与逊尼派部落长老都有席位。没有人被排除在外，但也没有人能独占话语权。"
 SYRL_people_army: "人民军队"
 SYRL_people_army_desc: "以义务兵役与全民防御为基础，建立一支忠于宪法而不是忠于个人的军队。各教派、各省份的青年按比例服役，军官晋升以军校成绩与战场表现为准，政治委员的职责改为宪法教育。"
 SYRL_left_ceasefire: "左翼停火方案"
 SYRL_left_ceasefire_desc: "向反对派中的世俗派与左翼提出停火与权力分享方案：自治议会、选举与大赦，条件是放下武器。许多当年在 2011 年上街的年轻人，要的本来就不是伊斯兰国家，而是一个不腐败、不专制的共和国。"
 SYRL_rebuild_people: "人民重建委员会"
 SYRL_rebuild_people_desc: "用被毁的社区为单位，成立由居民选出的重建委员会，把钱和决定权一起交出去。霍姆斯老城与阿勒颇东区的居民自己决定先修学校还是先修水管，承包商必须向委员会公开账目。"
 SYRL_new_republic: "新复兴共和国"
 SYRL_new_republic_desc: "总统在议会宣读新的国家纲领：复兴党属于人民，而不属于哪一个家族。统一、自由、社会主义——这一次，要真的做。"
 SYRB_iraq_war: "伊拉克战争与难民潮"
 SYRB_iraq_war_desc: "2003 年美军入侵邻国。大马士革反对战争，却也接纳了上百万伊拉克难民；边境的另一边，叛乱分子借道叙利亚进出。"
 SYRB_lebanon_exit: "撤出黎巴嫩"
 SYRB_lebanon_exit_desc: "2005 年 2 月，前总理哈里里在贝鲁特遇刺，矛头直指大马士革。「雪松革命」的百万人集会让街头要求叙军撤出的呼声震耳欲聋，在国际压力下，二十九年的驻军在几周内全部撤回。"
 SYRB_hezbollah_war: "2006 年战争与真主党"
 SYRB_hezbollah_war_desc: "以黎冲突之后，叙利亚把武器与外交支持都给了真主党。抵抗轴心在阿拉伯街头得到了从未有过的声望。"
 SYRB_kibar: "阿尔-基巴尔事件"
 SYRB_kibar_desc: "2007 年，以色列战机炸毁了代尔祖尔的一处神秘设施。叙利亚拒绝回应，也拒绝国际原子能机构的调查。"
 SYRB_iran_pact: "与伊朗的战略协议"
 SYRB_iran_pact_desc: "防务合作、联合工业与互免签证。伊朗不只是盟友，更是叙利亚经济的重要出资人：德黑兰提供优惠贷款与原油，在叙利亚组装汽车、修建电厂。两国的联盟从 1980 年两伊战争时就已开始，如今更加牢固。"
 SYRB_turkey_honeymoon: "叙土蜜月"
 SYRB_turkey_honeymoon_desc: "安卡拉与大马士革取消签证、联合召开内阁会议，边境的贸易与旅游一时红火。1998 年两国还在为库尔德工人党的领袖剑拔弩张，如今埃尔多安与总统携家人一起度假，阿勒颇挤满了土耳其游客。"
 SYRB_med_union: "地中海联盟与欧盟联系协议"
 SYRB_med_union_desc: "巴黎、布鲁塞尔与大马士革重新开始谈判：叙利亚能否加入欧盟的联系国协议？总统在爱丽舍宫受到隆重接待。"
 SYRB_russia_arms: "与俄罗斯的军购"
 SYRB_russia_arms_desc: "总统访问莫斯科，俄方勾销了苏联时代留下的近百亿美元军购债务，也卖回了防空导弹与反坦克武器。作为交换，俄罗斯海军在塔尔图斯的补给站得以保留与扩建，这是俄国在地中海唯一的落脚点。"
 SYRB_intel_overhaul: "情报机构重组"
 SYRB_intel_overhaul_desc: "各个情报机构被整合进以总统府为中心的体系：空军情报局、军事情报局、政治安全局各自监视对方。"
 SYRB_loyal_army: "军队忠诚体系"
 SYRB_loyal_army_desc: "共和国卫队与第四装甲师的军官多出自同一教派与同一家族；晋升的第一条标准是忠诚，第二条才是能力。这套体系让政权免于政变，但也让军队在面对真正的战争时，暴露出训练不足与腐败的弱点。"
 SYRB_net_control: "互联网管制"
 SYRB_net_control_desc: "网吧要登记、博客要实名、社交网站要封锁。2007 年起，Facebook 与 YouTube 在叙利亚成了「违禁品」，年轻人只能用代理服务器翻墙。叙利亚电子军在网络上监视与攻击批评者，情报部门的触角伸进了每一台电脑。"
 SYRB_sectarian_balance: "教派平衡"
 SYRB_sectarian_balance_desc: "阿拉维、逊尼、基督徒与德鲁兹：政权的稳定有赖于让每个社群都相信，没有政权，自己会更糟。逊尼派商人获得生意，少数派获得保护，阿拉维派获得军职。这种平衡看似稳固，一旦被打破就会变成教派战争。"
 SYRB_private_banks: "私营银行与证券交易所"
 SYRB_private_banks_desc: "2004 年起，第一批私营银行开张；2009 年大马士革证券交易所成立，有钱人排着队开户。黎巴嫩与海湾的银行纷纷来叙利亚设立分行，四十年来被国有银行垄断的金融业，终于有了竞争。"
 SYRB_private_universities: "私立大学与科研"
 SYRB_private_universities_desc: "私立大学、技术学院与创业孵化器在大马士革郊外相继出现，年轻人开始用英语写简历，梦想去迪拜或柏林工作。中产阶级的孩子第一次可以不必挤进拥挤的公立大学，但学费只有少数家庭负担得起。"
 SYRB_telecom: "私营移动运营商"
 SYRB_telecom_desc: "两家私营运营商拿到牌照：Syriatel 与 MTN。手机很快取代了固定电话，也成了政权的新金矿：Syriatel 属于总统的表亲 Rami Makhlouf，每一通电话都有一部分利润流进了家族的口袋。"
 SYRB_old_city_tourism: "老城区修复与旅游业"
 SYRB_old_city_tourism_desc: "大马士革老城、阿勒颇古堡与帕尔米拉遗址吸引了数以百万计的欧洲与海湾游客，旅游收入一度占国内生产总值的 12%。老城的大宅被改建成精品酒店，倭马亚清真寺前挤满了旅行团，那是叙利亚最好的年代。"
 SYRB_drought: "干旱与农村危机"
 SYRB_drought_desc: "连续四年的干旱让东北的农田变成沙尘，农民涌向城市边缘的棚户区。官方的农业数字却依旧漂亮。"
 SYRB_youth_unemployment: "青年失业与城镇化"
 SYRB_youth_unemployment_desc: "一半的叙利亚人不满 25 岁；大学毕业生在咖啡馆里刷新闻。第一批要求改革的标语，开始在手机里转发。"
 SYRL_women_equality: "妇女平等与家庭法改革"
 SYRL_women_equality_desc: "废除「荣誉犯罪」的减刑条款，提高法定结婚年龄，女性在继承与监护权上享有同等的权利。宗教界有人激烈反对，但战争中无数女性独自撑起了家庭，她们的地位已经不可能回到从前。"
 SYRL_secular_education: "世俗义务教育"
 SYRL_secular_education_desc: "全国统一的十二年义务教育与统一教材，把宗教课与公民课分开。战争期间，各个控制区都编了自己的课本，孩子们学的是互相仇恨的历史；统一的教育，是让下一代重新成为同一个国家公民的第一步。"
 SYRL_minorities_council: "宗教与族裔平等委员会"
 SYRL_minorities_council_desc: "由逊尼、阿拉维、基督徒、德鲁兹、伊斯玛仪、库尔德、亚美尼亚与亚述人代表共同组成的委员会，审议所有涉及教派与族群的法律。"
 SYRL_kurdish_citizenship: "库尔德人入籍"
 SYRL_kurdish_citizenship_desc: "1962 年的人口普查让数十万库尔德人成了「无国籍者」。新的国籍法恢复了他们的公民权，也承认库尔德语的教学与出版。"
 SYRL_nationalize_banks: "银行与保险国有化"
 SYRL_nationalize_banks_desc: "把私营银行与保险公司重新收归国有，信贷的方向由国家计划委员会决定，优先流向农业、重建与中小企业。私人储户的存款受到国家担保，但外国银行纷纷撤出，资本外逃的压力随之而来。"
 SYRL_price_commission: "物价委员会"
 SYRL_price_commission_desc: "主食、燃料与药品的价格由物价委员会公布，商人不能擅自涨价，违者吊销执照。战争期间面包与煤气的价格翻了十几倍，黑市商人大发横财；物价委员会是左翼向普通家庭兑现的第一个承诺。"
 SYRL_public_housing: "公共住房计划"
 SYRL_public_housing_desc: "在大城市郊外兴建以出租为主的公共住房，年轻夫妻与外来务工者优先。战争摧毁了全国三分之一的住房，数百万人住在帐篷、未完工的楼房与亲戚家里；公共住房让他们有了安顿下来的地方。"
 SYRL_rural_electrification: "农村电气化与水利"
 SYRL_rural_electrification_desc: "把电力与灌溉渠送到最后一个村庄，农民不用再靠昂贵的柴油泵浇地。战争中被炸毁的变电站与水渠逐一修复，太阳能水泵在哈塞克与德拉的田野上推广，农村的夜晚重新亮了起来。"
 SYRL_progressive_tax: "累进税制"
 SYRL_progressive_tax_desc: "大企业与高收入者按更高的税率缴税，战争暴发户的财产要接受审计，农民与小商户的免税额则大幅提高。过去叙利亚的税负主要落在工薪阶层身上，如今左翼要让富人为重建出更多的力。"
 SYRL_pension_system: "全民养老金"
 SYRL_pension_system_desc: "统一的养老金与社会保险覆盖农民、个体户与家庭主妇，不再只限于公务员与国企职工。战争夺走了许多家庭的顶梁柱，留下大批孤寡老人；全民养老金让他们不必再依靠施舍过活。"
 SYRL_oil_water: "石油与水资源国有"
 SYRL_oil_water_desc: "石油、天然气、水资源与矿产收入归全民所有，收入的三成用于农村与教育基金，账目每年向人民议会公开。过去油田的收益流向谁，从来是国家机密；如今左翼要让每一个叙利亚人都看得到这笔钱。"
 SYRL_national_charter: "国家宪章"
 SYRL_national_charter_desc: "由全国对话大会起草的新宪章：国家属于全体公民、政权来自选举、军队服从宪法、总统不得连任超过两届。"
 SYRL_media_reform: "全国媒体改革"
 SYRL_media_reform_desc: "公共广播成为独立机构，由议会监督而非新闻部指挥；私营报纸与电台可以申请牌照，审批标准公开透明。战争年代各方的电视台都在宣传仇恨，如今的新闻法明确禁止煽动教派对立。"
 SYRL_total_defense: "全民防御学说"
 SYRL_total_defense_desc: "以全民动员与山地防御取代对抗性的军备竞赛：民兵、预备役与国防工业统一指挥。叙利亚不可能在空军与坦克数量上赢过邻国，但一支能在每一座山头、每一条街道抵抗的国民军，足以让任何入侵者望而却步。"
 SYRL_south_south: "南南合作"
 SYRL_south_south_desc: "与委内瑞拉、古巴、中国与印度建立能源、农业与医疗的合作协议：古巴派来医生，印度提供药品与仿制技术，中国承建电厂。这些国家不以人权或政权更迭为条件，正是被西方制裁的叙利亚最需要的伙伴。"
 SYRL_solidarity: "非洲与拉美团结"
 SYRL_solidarity_desc: "在联合国与不结盟运动中与非洲及拉美国家同进同退。叙利亚代表在大会上支持南非对以色列的诉讼、支持古巴解除封锁的决议，换来的是在安理会表决时多几张同情票，以及与第三世界重新建立的友谊。"
 SYRL_self_reliance: "自力更生计划"
 SYRL_self_reliance_desc: "制裁加重时的回应：用国产钢铁、水泥、纺织与化肥替代进口，重建霍姆斯与哈马的老国营工厂。产品粗糙、效率不高，但当外国船只不再靠岸时，至少叙利亚人还能自己生产需要的东西。"
 ISIX_declaration: "宣布哈里发国"
 ISIX_declaration_desc: "2014 年 6 月，「伊拉克与沙姆伊斯兰国」改称「伊斯兰国」，al-Baghdadi 被拥立为哈里发。边界被「推平」，一个横跨两国的国家出现在地图上。"
 ISIX_bayah: "效忠宣誓"
 ISIX_bayah_desc: "各地武装、部落与外国分支被迫或主动宣誓效忠，哈里发的名字出现在从西非到呼罗珊的旗帜上。拒绝效忠的部落遭到屠杀，例如 2014 年的谢塔特部落惨案；效忠并不是信仰的选择，而是生存的代价。"
 ISIX_diwans: "各部（迪万）"
 ISIX_diwans_desc: "设立财政、司法、教育、战争与情报各部（迪万），以及按「省」划分的行政区，大量前伊拉克复兴党官员被吸纳进行政体系。这个组织试图证明自己不只是武装团体，而是一个「国家」，但它的统治建立在恐惧之上。"
 ISIX_hisbah: "宗教警察"
 ISIX_hisbah_desc: "希斯巴巡逻队与沙里亚法庭，是统治占领区的两根支柱：吸烟、听音乐、衣着不合规定都会遭到鞭打，公开处决在广场上进行。占领区的居民生活在无处不在的监视与恐惧之中。"
 ISIX_zakat: "天课与人头税"
 ISIX_zakat_desc: "穆斯林被强征天课，基督徒等少数群体被迫缴纳人头税或被驱逐，商贩缴纳「保护费」，这个组织由此建立了一套掠夺性的税务系统。摩苏尔的基督徒在几天之内被迫离开了他们生活了近两千年的家园。"
 ISIX_schools: "哈里发的学校"
 ISIX_schools_desc: "学校的课程被改为宗教灌输与军事训练，数学课本里的例题是子弹与炸弹，孩子被称为「哈里发的幼狮」，被训练成童兵。这是占领区最黑暗的一页，被毁掉的是整整一代人的童年。"
 ISIX_media: "宣传机器"
 ISIX_media_desc: "《达比克》杂志、阿马克通讯社与成千上万的社交媒体账号，把战场上的影像变成全世界的恐惧，并在网络上引诱外国青年加入。各大科技平台随后大规模封禁相关账号，各国情报机构也把网络宣传列为首要打击对象。"
 ISIX_military_council: "军事委员会"
 ISIX_military_council_desc: "前伊拉克军官与复兴党人组成军事委员会，掌握实际指挥权。2003 年美国解散伊拉克军队，让数十万受过训练的军人失业，其中一部分人在布卡营的监狱里与极端分子结识，最终成了这个组织的军事骨干。"
 ISIX_blitz: "闪击推进"
 ISIX_blitz_desc: "数百辆皮卡载着步兵，从沙漠中扑向城市。伊拉克军队的腐败与士气低落让许多部队在敌人抵达之前就已经溃散，留下大批美制装备。这种闪电般的推进震惊了世界，也让各国意识到威胁的严重。"
 ISIX_inghimasi: "突击队与自杀车"
 ISIX_inghimasi_desc: "装甲改装的自杀车炸开缺口，突击队冲入，再由大部队跟进。这种战术在摩苏尔与拉马迪造成了极大的伤亡，伊拉克与库尔德部队不得不以推土机、反坦克导弹与空中支援来逐一应对。"
 ISIX_heavy_weapons: "缴获的重武器"
 ISIX_heavy_weapons_desc: "从摩苏尔的军营与叙利亚的军械库中缴获的坦克、火炮与防空武器，包括大批美制悍马与 M1 坦克。缴获的装备让这个组织一度拥有接近正规军的火力，但缺乏维修与零件，很快就在联军空袭下损耗殆尽。"
 ISIX_mosul: "攻陷摩苏尔"
 ISIX_mosul_desc: "2014 年 6 月，数百名武装人员攻陷伊拉克第二大城市，三万人的伊拉克军队几乎没有抵抗。几周后，巴格达迪在努里清真寺宣布建立「哈里发国」。摩苏尔的百万居民将在占领下度过三年。"
 ISIX_raqqa: "以拉卡为首都"
 ISIX_raqqa_desc: "拉卡成为这个组织的「首都」：行政、宣传与外籍成员的训练都集中于此。天堂广场成了公开处决的刑场，城中居民称之为「地狱广场」。拉卡也因此成为联军打击的首要目标。"
 ISIX_kobani: "科巴尼围城"
 ISIX_kobani_desc: "2014 年秋，数千名武装人员围攻库尔德人的边境小城科巴尼，土耳其边境上的电视镜头把战况直播给全世界。库尔德人民保护部队在联军空袭的支援下死守数月，这是这个组织第一次遭遇决定性的失败。"
 ISIX_drones_ied: "无人机与简易爆炸装置"
 ISIX_drones_ied_desc: "商用无人机投下手榴弹，一片片废墟里布满了诡雷与简易爆炸装置。摩苏尔战役中，这种低成本的战术让进攻部队步步维艰；战后排雷人员花了数年时间，才让居民安全地回到自己的家。"
 ISIX_tunnels: "地道与纵深防御"
 ISIX_tunnels_desc: "把每一座城市变成要塞：地道、狙击手、地雷与人体盾牌。平民被禁止离开，成为阻挡空袭的人质。摩苏尔老城与拉卡的巷战持续了数月，城市在战斗中几乎被夷为平地，平民付出了最惨重的代价。"
 ISIX_oil_smuggling: "石油走私"
 ISIX_oil_smuggling_desc: "代尔祖尔的油田日产数万桶原油，经简陋的炼油作坊与走私网络运往土耳其与伊拉克，一度每天带来数百万美元的收入。联军随后发动「浪潮行动」，专门轰炸油田与运油卡车，切断这个组织的财源。"
 ISIX_antiquities: "文物与绑架"
 ISIX_antiquities_desc: "帕尔米拉与尼姆鲁德的文物被盗掘、走私到黑市，无法搬走的则被炸毁；外国人质成为勒索赎金的来源，也成为宣传中的牺牲品。联合国教科文组织称之为「文化清洗」，各国随后加强了对中东文物交易的管制。"
 ISIX_dams_grain: "大坝与粮仓"
 ISIX_dams_grain_desc: "幼发拉底河上的塔布卡大坝提供电力，周围的平原提供粮食。控制水，就控制了人：这个组织曾以切断下游供水相威胁。大坝年久失修，一度险些溃决，危及下游数百万人的生命。"
 ISIX_war_chest: "战争基金"
 ISIX_war_chest_desc: "石油、税收、勒索与劫掠的收入汇集成一笔可观的战争基金，用来发工资、买武器、收买部落。但这笔钱建立在对占领区的掠夺之上，随着领土的丧失与联军对金融网络的打击，财源迅速枯竭。"
 ISIX_foreign_fighters: "外籍战斗人员"
 ISIX_foreign_fighters_desc: "数万名志愿者来自欧洲、中亚与北非：他们是哈里发国最忠诚的突击力量，也是最难管理的一群人。"
 ISIX_wilayat: "海外「省份」"
 ISIX_wilayat_desc: "尼日利亚的博科圣地、埃及西奈、利比亚与阿富汗的部分武装宣布成为这个组织的「省份」。所谓的全球扩张，实际上是各地原有的极端团体换上新的旗号，借用它的名声招募与筹款。"
 ISIX_terror_attacks: "境外袭击"
 ISIX_terror_attacks_desc: "巴黎、布鲁塞尔、伊斯坦布尔：恐怖袭击夺去了数百名无辜平民的生命，也把这场战争延伸到了世界各地。2015 年巴黎巴塔克兰剧院的惨案之后，法国宣布进入紧急状态，国际联军下定决心彻底摧毁这个组织。"
 ISIX_lone_wolves: "独狼与网络圣战"
 ISIX_lone_wolves_desc: "通过网络煽动远方的支持者，让他们在自己所在的城市发动袭击：尼斯的卡车、柏林的圣诞市场。各国随即加强了网络监控与反极端化项目，社区、学校与家庭成为预防激进化的第一道防线。"
 ISIX_sinai_libya: "西奈与利比亚"
 ISIX_sinai_libya_desc: "在埃及西奈与利比亚的苏尔特，这个组织设立了新的据点。2015 年俄罗斯客机在西奈上空被炸毁，两百多人遇难；利比亚的苏尔特则在 2016 年被利比亚政府军在美国空中支援下收复。"
 ISIX_khorasan: "呼罗珊省"
 ISIX_khorasan_desc: "把触角伸向阿富汗与中亚：「呼罗珊省」在阿富汗东部的楠格哈尔立足，与塔利班互相厮杀，并在喀布尔机场、莫斯科音乐厅等地制造了血腥的袭击。它成为这个组织在中东以外最危险的分支。"
 ISIX_coalition_war: "与国际联军的战争"
 ISIX_coalition_war_desc: "八十多国组成的联军开始空袭，伊拉克军队、库尔德自由斗士与叙利亚民主力量在地面推进：补给线被切断，领土一块块丢失。这个组织面对它最大的考验，所谓的「国家」开始迅速崩解。"
 ISIX_last_stand: "最后的据点"
 ISIX_last_stand_desc: "被围在幼发拉底河谷的最后几个村镇里，剩下的武装人员选择战斗到底。2019 年 3 月，巴古兹被叙利亚民主力量攻克，所谓的「哈里发国」在领土上彻底覆灭，数万名家属被关进了霍尔难民营。"
 ISIX_underground: "转入地下"
 ISIX_underground_desc: "宣布放弃领土，分散为数百个小组，转入游击与恐怖袭击的阶段。他们藏身于伊拉克与叙利亚交界的沙漠与山区，伏击检查站、暗杀地方官员，各国的反恐部队仍需要长期清剿。"
 ISIX_embers: "哈里发的余烬"
 ISIX_embers_desc: "残余的武装保存下来，等待着下一个动荡与下一个失败的国家。霍尔营中被灌输仇恨的孩子、监狱里的数千名成员，都是潜在的隐患。如何处理这些余烬，是国际社会尚未解决的难题。"
 ROJX_autonomy: "民主自治"
 ROJX_autonomy_desc: "2012 年，叙利亚政府军从北部库尔德地区撤出。库尔德人宣布民主自治：一场既不属于政权、也不属于反对派的「第三条道路」。"
 ROJX_social_contract: "社会契约宪章"
 ROJX_social_contract_desc: "2014 年制定《罗贾瓦社会契约》：三个自治区、多民族共治、性别平等、民选议会。这份宪章受 Abdullah Öcalan「民主邦联主义」思想的启发，试图在中东建立一种既非民族国家、也非宗教政权的新型社会。"
 ROJX_cantons: "三个自治区"
 ROJX_cantons_desc: "杰兹拉、科巴尼与阿夫林三个区各设行政机构，彼此之间隔着伊斯兰国与反对派的控制区，只能靠电话维系。每个区都有自己的议会、法院与安全部队，物资只能靠走私与土耳其边境的偷运。"
 ROJX_councils: "人民议会"
 ROJX_councils_desc: "从街道、村庄到区级的人民议会，成为自治区的基层政权。居民在社区公社里讨论水电、面包与学校，重大决定要层层协商。这套直接民主的制度效率不高，却让许多人第一次参与了公共事务。"
 ROJX_women_cochair: "共同主席制"
 ROJX_women_cochair_desc: "任何机构都设男女共同主席，从村庄议会到自治政府皆然；女子保卫部队是战场上的象征，也让世界看到另一个库尔德。在一个女性长期被排除在公共生活之外的地区，这是一场静悄悄的革命。"
 ROJX_ecology: "社会生态"
 ROJX_ecology_desc: "推广合作社、可再生能源与生态农业，试图建设一个与战争经济不同的社会。哈塞克的麦田与橄榄园由合作社经营，妇女合作社生产面包与衣物；但在禁运与战火之下，理想与现实之间的距离依然遥远。"
 ROJX_multi_ethnic: "多民族共治"
 ROJX_multi_ethnic_desc: "阿拉伯人、亚述人、土库曼人与切尔克斯人在议会与军队里拥有自己的位置，阿拉伯语、库尔德语与叙利亚语同为官方语言。随着自治区扩展到拉卡与代尔祖尔，阿拉伯人已占人口的多数，多民族共治不再是口号，而是生存的必要。"
 ROJX_ypg_ypj: "人民保卫部队"
 ROJX_ypg_ypj_desc: "人民保卫部队（YPG）与女子保卫部队（YPJ）是自治区唯一的武装力量。2012 年政府军撤出北部后，它们接管了库尔德城镇；装备简陋，却纪律严明、士气高昂，后来成为对抗伊斯兰国最有效的地面部队。"
 ROJX_asayish: "安全部队（阿萨伊什）"
 ROJX_asayish_desc: "内部安全部队（阿萨伊什）负责治安、反恐与情报，在伊斯兰国的潜伏网络面前守护着城镇的安全。但它也被人权组织指控压制异见、拘押库尔德民族委员会等对立政党的成员。"
 ROJX_ypj_swords: "女子保卫部队"
 ROJX_ypj_swords_desc: "这些女战士的形象出现在全世界的杂志封面上，也让极端分子闻风丧胆：据说他们相信死在女人手里就进不了天堂。在科巴尼与拉卡的战斗中，YPJ 的指挥官与狙击手冲在最前线，许多人再也没有回来。"
 ROJX_kobani: "科巴尼保卫战"
 ROJX_kobani_desc: "2014 年秋天，伊斯兰国围攻科巴尼，城市的大半落入敌手。守军靠着美国空投的武器、伊拉克库尔德自由斗士的增援与世界的目光，硬是撑过了冬天。科巴尼的胜利改变了战争的走向。"
 ROJX_sdf: "叙利亚民主力量（SDF）"
 ROJX_sdf_desc: "2015 年，以 YPG 为核心，联合沙玛尔部落的萨纳迪德军、亚述人与基督教民兵，成立叙利亚民主力量。这个新名字让美国可以更方便地支援它，也让阿拉伯人更容易加入，但土耳其并不买账。"
 ROJX_tal_abyad: "提勒阿卜耶德与曼比季"
 ROJX_tal_abyad_desc: "攻下提勒阿卜耶德与曼比季，把北方的边境口岸与幼发拉底河西岸的城镇连在一起，切断了伊斯兰国与土耳其边境之间的通道。但越过幼发拉底河，也越过了安卡拉划下的红线。"
 ROJX_raqqa_campaign: "拉卡战役"
 ROJX_raqqa_campaign_desc: "「愤怒的幼发拉底」行动：在联军空袭与特种部队支援下，SDF 经过四个月的巷战夺取了伊斯兰国的「首都」拉卡。城市的八成被摧毁，但天堂广场上的刑场终于被拆除，拉卡的居民开始回家。"
 ROJX_deir_ezzor: "东部战役"
 ROJX_deir_ezzor_desc: "沿着幼发拉底河向南，直至代尔祖尔与巴古兹：自治区控制了叙利亚最大的油田，包括奥马尔油田与康菲科气田。石油收入养活了自治政府，但也让大马士革、莫斯科与德黑兰对这片土地虎视眈眈。"
 ROJX_us_coalition: "国际联军"
 ROJX_us_coalition_desc: "美军特种部队与联军空中力量成为 SDF 最重要的盟友，数千名美军顾问驻扎在哈塞克与科巴尼。这让自治区获得了生存的保障，也让它承担了与土耳其的外交摩擦：安卡拉视 YPG 为库尔德工人党的叙利亚分支。"
 ROJX_russia_channel: "与莫斯科的沟通"
 ROJX_russia_channel_desc: "俄罗斯在叙利亚北部设立了联络点，在土耳其与自治区之间斡旋。自治区试图在美国与俄罗斯之间保留回旋的空间：华盛顿随时可能撤军，届时能阻止土耳其入侵的，也许只有莫斯科与大马士革。"
 ROJX_damascus_talks: "与大马士革谈判"
 ROJX_damascus_talks_desc: "自治区与政权在地方安全、油田分配与自治权利上反复谈判，却始终无法达成一致。大马士革要求 SDF 并入叙利亚军队、交出油田，自治区则坚持保留自己的武装与制度；在俄罗斯的赫梅明基地里，谈判一次又一次无果而终。"
 ROJX_kurdish_ties: "与伊拉克库尔德的关系"
 ROJX_kurdish_ties_desc: "Barzani 的库尔德斯坦地区政府与罗贾瓦之间既是兄弟也是对手：关口、政党与武装，样样都有分歧。埃尔比勒与安卡拉关系密切，时常关闭法什哈布尔口岸；罗贾瓦则与 Barzani 的对手 Talabani 一派走得更近。"
 ROJX_turkey_threat: "土耳其的威胁"
 ROJX_turkey_threat_desc: "安卡拉把自治区视为 PKK 的延伸。边境炮击、无人机袭击与越境行动让这里长期处于威胁之下：土耳其的「旗手」无人机专门猎杀自治区的指挥官，边境上的隔离墙一天天加高。自治区必须时刻准备下一次入侵。"
 ROJX_olive_branch: "阿夫林保卫战"
 ROJX_olive_branch_desc: "2018 年初，土耳其军队与叙利亚国民军发动「橄榄枝行动」进攻阿夫林。美国没有出手，俄罗斯让出了领空，守军在两个月后被迫撤离，十几万居民流离失所。自治区损失了一个区，却保住了其余的部分。"
 ROJX_peace_spring: "和平之泉"
 ROJX_peace_spring_desc: "2019 年美军撤出之后，土耳其的攻势沿边境推进。库尔德人只能向大马士革求援，让政府军进入边境城镇。"
 ROJX_oil_fields: "东部油田"
 ROJX_oil_fields_desc: "东部油田的收入与农业税，是自治政府最大的收入。石油被运往简陋的炼油厂，或通过商人卖给大马士革与伊拉克库尔德地区；这笔钱支付了数万名战士与公务员的薪水，也让自治政府得以在禁运中生存。"
 ROJX_wheat: "小麦与棉花"
 ROJX_wheat_desc: "杰兹拉是叙利亚的粮仓，哈塞克与卡米什利的平原出产全国大部分的小麦与棉花。保住农业，就保住了自治区的民生；但土耳其上游截流幼发拉底河与哈布尔河，干旱与水荒正在威胁这片土地。"
 ROJX_reconstruction: "拉卡重建"
 ROJX_reconstruction_desc: "从废墟里清理地雷与尸骸、重建医院、学校与供水，在拉卡人的帮助下重建这座城市。拉卡民政委员会由当地的阿拉伯部落长老与技术人员组成，国际援助少得可怜，大部分工作只能靠居民自己动手。"
 ROJX_camps: "战俘营与难民营"
 ROJX_camps_desc: "数万名伊斯兰国家属与战俘滞留在霍尔营与各地监狱，其中大半是儿童。自治政府要求国际社会接收本国公民，但几乎没有国家愿意；营地里的极端思想与越狱事件，成了悬在整个地区头上的定时炸弹。"
 ROJX_federal_syria: "联邦制的叙利亚"
 ROJX_federal_syria_desc: "提出「去中心化的联邦制」：叙利亚应当是由各地区自治共同组成的联邦，而不是由大马士革一手掌控的中央集权国家。这个方案既回应了库尔德人的诉求，也试图赢得德鲁兹人、阿拉伯部落与反对派的支持。"
 ROJX_integration: "回到叙利亚"
 ROJX_integration_desc: "与大马士革达成自治协议：自治区保留武装与行政，但承认叙利亚的主权，叙利亚国旗重新升起在卡米什利的政府大楼上。这是现实的选择：没有大马士革，自治区无法抵挡土耳其；没有自治，库尔德人也不会放下枪。"
 ROJX_independence: "库尔德斯坦的梦"
 ROJX_independence_desc: "宣布独立：一个跨越叙利亚、伊拉克、土耳其与伊朗的库尔德民族国家，是几代人的理想。1920 年的《色佛尔条约》曾承诺库尔德人自决，三年后就被推翻。这一次，库尔德人决定不再等待列强的恩赐，但四个邻国都不会坐视。"
 SYR_dec_pc_woo_baath: "拉拢独立议员（入复兴党团）"
 SYR_dec_pc_woo_baath_desc: "总统府与情报系统出面，说服 6 名独立议员加入复兴党团：商人、部落首领（shuyukh）与地方头面人物，没有人愿意与政权为敌。"
 SYR_dec_pc_woo_npf: "拉拢独立议员（入国进阵）"
 SYR_dec_pc_woo_npf_desc: "劝说 4 名独立议员加入国民进步阵线的盟党——它们是政权议会里最听话的「花瓶」。"
 SYR_dec_pc_lift_emergency: "废止紧急状态法"
 SYR_dec_pc_lift_emergency_desc: "自 1963 年起实行的紧急状态法，一直是政权维持统治的法律基础。2011 年 4 月，在大规模抗议的压力下，总统签署法令予以废止。"
 SYR_dec_pc_party_law: "颁布《政党法》"
 SYR_dec_pc_party_law_desc: "2011 年 8 月，人民议会通过《政党法》：允许在法律框架内组建新的政党，但禁止基于宗教、部族与地域的组织。"
 SYR_dec_pc_constitution: "2012 年新宪法"
 SYR_dec_pc_constitution_desc: "宪法第 8 条——复兴党是国家与社会的领导党——被取消，总统任期七年、可连任一次，并规定多党制。公投在 2012 年 2 月举行。修宪需要人民议会三分之二多数同意。"
 SYR_dec_pc_counter_terror: "《反恐法》"
 SYR_dec_pc_counter_terror_desc: "2012 年议会通过《反恐法》与相关的特别法庭，把对反对派的起诉和审判纳入反恐的框架。政权获得了更大的权力，也招来更强烈的国际谴责。"
 SYR_dec_pc_law10: "第 10 号法（房地产法）"
 SYR_dec_pc_law10_desc: "2018 年的第 10 号法授权设立重建区，业主必须在限期内提交产权证明，否则土地收归国有。批评者说，它让数百万流离失所的人失去了回家的权利。"
 SYR_dec_pc_dissolve: "解散人民议会，提前大选"
 SYR_dec_pc_dissolve_desc: "宪法授权总统解散议会。在需要新面孔、或者需要一个重新洗牌的议会时，总统府会这样做。"
 SYR_dec_pc_eid_amnesty: "开斋节 / 宰牲节大赦"
 SYR_dec_pc_eid_amnesty_desc: "总统在宗教节日颁布大赦令是叙利亚的传统：释放一部分囚犯，减免刑期，也给议会与社会一个缓和的信号。"
 SYR_people_council_category: "人民议会"
 SYR_people_council_modifier: "人民议会"
 SYR_people_council_modifier_desc: "叙利亚人民议会对政治点数与稳定度的修正：议会支持度高于一半时有利，政权体制下按「橡皮图章」打折。"
 SYR_people_council_category_desc: "§L叙利亚人民议会共 250 席，每届四年。宪法规定议会立法、批准预算与条约，并可对总统的法令表示同意；总统可以解散议会。§!"
