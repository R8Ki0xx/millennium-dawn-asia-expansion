l_simp_chinese:
 CHI_demo_reform_root:0 "政治体制改革的再启"
 CHI_demo_reform_root_desc:0 "邓小平南巡之后，改革的重心一直放在经济上。经济增速放缓、社会矛盾不断积累，党内外都开始讨论：政治体制要不要改？改到哪一步为止？"
 CHI_demo_a1:0 "中央政治体制改革小组"
 CHI_demo_a1_desc:0 "由政治局常委牵头，组织各部门研究党政分开的方案。改革派认为，党不应该直接管理每一个政府部门。"
 CHI_demo_a2:0 "人大差额选举"
 CHI_demo_a2_desc:0 "基层人大代表的选举先实行差额，候选人多于应选名额。第一次差额选举的结果，让不少人看到了选票的分量。"
 CHI_demo_a3:0 "允许民主党派独立竞选"
 CHI_demo_a3_desc:0 "各民主党派可以独立推荐候选人，党派竞争从幕后走到台前。保守派警告，这是一条回不了头的路。"
 CHI_demo_a4:0 "修宪确立多党制"
 CHI_demo_a4_desc:0 "修宪草案把「中国共产党领导」改写为「依法执政」，并允许多个政党合法存在。草案在全国人大上的争论持续了整整一个会期。"
 CHI_demo_a5:0 "第一次全国大选"
 CHI_demo_a5_desc:0 "全国性的选举终于要举行。各党派的候选名单已经公布，选票将在全国各省同时开票。"
 CHI_demo_b1:0 "维权运动与独立工会"
 CHI_demo_b1_desc:0 "城市里的工人与退休教师组织起来，要求补发欠薪、保障集体谈判的权利。"
 CHI_demo_b2:0 "地方自治试点"
 CHI_demo_b2_desc:0 "几个省份率先试点村民与社区自治，选举产生的居委会与村委会开始拥有真正的权力。"
 CHI_demo_b3:0 "全国性抗议"
 CHI_demo_b3_desc:0 "各地的抗议汇成了一场全国性的运动。街头的人群提出了一份清单：选举、新闻自由与独立司法。"
 CHI_demo_b4:0 "圆桌会议"
 CHI_demo_b4_desc:0 "政府与各界代表坐到了同一张桌子旁，讨论改革的时间表。"
 CHI_demo_b5:0 "过渡期的首次选举"
 CHI_demo_b5_desc:0 "一部经过数月讨论的过渡宪法得到了通过，全国将进行第一次过渡期的选举。"
 CHI_demo_c1:0 "两岸民主对话"
 CHI_demo_c1_desc:0 "两岸的学者、立法委员与民间团体在香港与厦门会面，讨论一种双方都能接受的政治架构。"
 CHI_demo_c2:0 "一国良制提案"
 CHI_demo_c2_desc:0 "提案认为，统一不应是一方吞并另一方，而是建立一套双方共享主权与选举权的制度。台湾方面的反应十分复杂。"
 CHI_demo_c3:0 "联合制宪委员会"
 CHI_demo_c3_desc:0 "两岸各派出同等数量的代表，共同起草联邦宪法的草案。"
 CHI_demo_c4:0 "公投"
 CHI_demo_c4_desc:0 "新宪法草案将在两岸同时交付公投。赞成与反对的声音，在各自的社会里都十分激烈。"
 CHI_demo_c5:0 "中华联邦的第一次选举"
 CHI_demo_c5_desc:0 "公投通过之后，联邦将举行第一次全国选举。"
 chi_demo.1.t:0 "政治体制改革的完成"
 chi_demo.1.d:0 "改革的第一个完整周期已经走完。宪法条文、选举法与政党法都已生效。接下来，全国需要一次真正的选举。"
 chi_demo.1.a:0 "准备第一次大选"
 chi_demo.2.t:0 "全国性的抗议"
 chi_demo.2.d:0 "示威者在多个城市的广场上已经坐了两个星期。公安部门请示：是否清场？开明派则主张先见一见他们的代表。"
 chi_demo.2.a:0 "依法清场，恢复秩序。这条路会关上圆桌会议的大门。"
 chi_demo.2.b:0 "派出代表，开始对话。"
 chi_demo.3.t:0 "公投的结果"
 chi_demo.3.d:0 "两岸的公投同时开票。结果在两岸的报纸上都占据了头版，各方都在争论这是不是一个真正的民意。"
 chi_demo.3.a:0 "公投通过，联邦宪法生效。"
 chi_demo.3.b:0 "公投未获通过，回到谈判桌。"
 chi_demo.4.t:0 "党内的反扑"
 chi_demo.4.d:0 "独立竞选的消息一出，党内的保守派立刻召开了一场闭门会议。他们要求暂停改革，并追问：谁批准了这条路？"
 chi_demo.4.a:0 "让步，保留党的领导的条款。"
 chi_demo.4.b:0 "强硬反击，推动党内整肃。"
 chi_demo.5.t:0 "修宪草案的表决"
 chi_demo.5.d:0 "全国人大的会场里，修宪草案进入最后一轮表决。保守派代表联名要求推迟，改革派代表则在走廊里一个个争取摇摆的票。一位老代表说，这是他经历过的最长的一个会期。"
 chi_demo.5.a:0 "按原定日程表决，以微弱多数通过。"
 chi_demo.5.b:0 "推迟表决，换取保守派的支持。"
 chi_demo.6.t:0 "台北的回应"
 chi_demo.6.d:0 "「一国良制」的提案传到台北，立法院里立刻吵成一片。有人称它是三十年来最有诚意的方案，也有人质疑「良制」只是换了说法的收编。总统府发言人表示会审慎研究。"
 chi_demo.6.a:0 "公开欢迎，并邀请对方的代表来北京会谈。"
 chi_demo.6.b:0 "保持克制，让民间渠道先接触。"
 chi_demo.7.t:0 "圆桌会议的条件"
 chi_demo.7.d:0 "圆桌会议开幕前夕，各方代表递交了各自的条件。独立工会要求合法登记与罢工权，学生团体要求释放被拘押的同伴，政府内部则争论哪些议题可以上桌。"
 chi_demo.7.a:0 "接受独立工会的合法地位。"
 chi_demo.7.b:0 "只谈选举时间表，其他议题延后。"
 chi_demo.8.t:0 "来自北京的联邦提案"
 chi_demo.8.d:0 "联邦宪法已经在大陆生效，北京向台北正式发出邀请：台湾以平等的省级单位加入中华联邦，保留自己的选举、军队编制与社会制度，并在联邦议会中拥有固定席次。

这是两岸七十多年来第一次，双方都认为对方的提案不只是策略。"
 chi_demo.8.a:0 "接受，台湾加入中华联邦。"
 chi_demo.8.b:0 "婉拒，保持现有地位。"
 chi_demo.9.t:0 "改革小组的报告"
 chi_demo.9.d:0 "改革小组提交了第一份报告：把党的决策权与政府的执行权分开，需要同时修改二十多部法规。报告写得很坦率，也点出了几个部门的名字。"
 chi_demo.9.a:0 "公开报告摘要，争取社会支持。"
 chi_demo.9.b:0 "只在党内传阅，先统一思想。"
 chi_demo.10.t:0 "差额选举的结果"
 chi_demo.10.d:0 "第一次差额选举的结果让所有人都吃了一惊：几个县里，党组织推荐的候选人落选了。有人把它称作民意的第一次回声，也有人要求重新计票。"
 chi_demo.10.a:0 "承认结果，让落选者让位。"
 chi_demo.10.b:0 "要求重新计票。"
 chi_demo.11.t:0 "工人罢工潮"
 chi_demo.11.d:0 "独立工会成立之后，几家大型国企的工人同时罢工，要求补发欠薪。工厂门口的横幅写着：「我们要的不是推翻谁，只是应得的工资。」"
 chi_demo.11.a:0 "同意补发欠薪，开始谈判。"
 chi_demo.11.b:0 "拒绝谈判，要求复工。"
 chi_demo.12.t:0 "自治试点的成绩"
 chi_demo.12.d:0 "第一批自治试点的成绩单出来了：选出来的社区委员会在垃圾处理、学校修缮上比从前高效，但也有几个村被地方宗族把持。试点的评价，好坏参半。"
 chi_demo.12.a:0 "扩大试点范围。"
 chi_demo.12.b:0 "再观察一年。"
 chi_demo.13.t:0 "对话的第一轮"
 chi_demo.13.d:0 "两岸的第一轮民主对话在香港落幕。双方都没有谈拢，但也没有任何一方拂袖而去。会后，台北的与会代表对记者说：「我们至少知道了彼此在想什么。」"
 chi_demo.13.a:0 "公布会谈纪要。"
 chi_demo.13.b:0 "保密，减少外界的压力。"
 chi_demo.14.t:0 "制宪委员会的僵局"
 chi_demo.14.d:0 "联合制宪委员会卡在了主权条款上：北京一方主张「联邦主权」，台北一方主张「成员单位主权」。会议室里，翻译已经连续三天没有找到双方都能接受的措辞。"
 chi_demo.14.a:0 "在主权条款上让步，换取进度。"
 chi_demo.14.b:0 "坚持原有立场。"
 CHI_demo_transition_idea:0 "过渡期的阵痛"
 CHI_demo_transition_idea_desc:0 "改革的第一个周期里，旧的秩序与新的规则并行。政策执行时常出现摩擦，各地的执行力也参差不齐。"
 CHI_demo_crackdown_idea:0 "广场之后的寂静"
 CHI_demo_crackdown_idea_desc:0 "广场被清空之后，街头安静了下来，但人们的沉默里带着不满。圆桌会议的大门暂时关上了。"
 CHI_demo_backlash_idea:0 "党内整肃"
 CHI_demo_backlash_idea_desc:0 "党内的整肃让许多干部心惊胆战。效率提高了，但人人自危，改革的支持者也少了一批。"
 VEL_CHI_AI_DEMO:0 "@CHI 中国民主化路线（AI）"
 RULE_OPTION_VEL_DEMO_NEVER:0 "从不"
 RULE_OPTION_VEL_DEMO_NEVER_DESC:0 "中国（AI）不会主动走民主化路线。玩家仍可自己选择。"
 RULE_OPTION_VEL_DEMO_LOW:0 "偶尔"
 RULE_OPTION_VEL_DEMO_LOW_DESC:0 "中国（AI）有一定概率启动政治体制改革，并在三条路线中随机选择一条。"
 RULE_OPTION_VEL_DEMO_HIGH:0 "积极"
 RULE_OPTION_VEL_DEMO_HIGH_DESC:0 "中国（AI）会优先启动政治体制改革，并在三条路线中随机选择一条。"
