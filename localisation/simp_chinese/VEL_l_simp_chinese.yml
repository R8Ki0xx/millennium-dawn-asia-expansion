 VEL_CHI.1.a:0 "打开选举中心，开始竞选。"
 VEL_CHI.1.d:0 "选举日定在六十天之后。中央选举委员会公布了各省的选区划分和席次：人口多的省份席位多，西藏、青海这样的地区也至少保有一席。\n\n各党的竞选总部陆续挂牌。国民党主打经济与国家统一，民主党强调地方自治与转型正义，社民党以劳工和福利为招牌，共产党则试图在东北老工业区和湖南重新聚集人心。打开“选举中心”，可以查看各省的民调、选民构成，并在选定的省份举办集会。"
 VEL_CHI.1.t:0 "立法院选举进入竞选期"
 VEL_CHI.2.a:0 "主打经济与市场改革。"
 VEL_CHI.2.b:0 "主打福利与劳工。"
 VEL_CHI.2.c:0 "主打国家统一与国防。"
 VEL_CHI.2.d:0 "竞选进入白热化阶段。电视辩论中，各党领袖围绕物价、两岸关系和地方财政互相攻击，主持人追问政府在过去三年里到底兑现了多少承诺。幕僚们认为，这一场辩论之后，选民的关注点会固定下来：现在是时候确定我们要主打的议题了。"
 VEL_CHI.2.t:0 "竞选辩论"
 VEL_CHI.3.a:0 "等待开票。"
 VEL_CHI.3.d:0 "天刚亮，全国各地的投票所外已经排起了长队。从哈尔滨到海口，从上海到喀什，选民在同一天走进投票间，选出新一届立法委员。\n\n票箱在傍晚封存，各省的开票结果将自东向西陆续公布。打开“选举中心”，可以看着地图一块块着色。"
 VEL_CHI.3.t:0 "投票日"
 VEL_CHI.5.a:0 "接受人民的决定。"
 VEL_CHI.5.d:0 "全部省份的票箱都已开完。新一届立法院的席次如下：\n\n国民党 §Y[?VEL_CHI_ds_1|0]§! 席（得票 [?VEL_CHI_pct_1|1]%）\n民主党 §Y[?VEL_CHI_ds_2|0]§! 席（得票 [?VEL_CHI_pct_2|1]%）\n社民党 §Y[?VEL_CHI_ds_3|0]§! 席（得票 [?VEL_CHI_pct_3|1]%）\n共产党 §Y[?VEL_CHI_ds_4|0]§! 席（得票 [?VEL_CHI_pct_4|1]%）\n其他 §Y[?VEL_CHI_ds_5|0]§! 席（得票 [?VEL_CHI_pct_5|1]%）\n新兴政党合计 §Y[?VEL_CHI_ds_x|0]§! 席（[?VEL_CHI_pct_x|1]%）\n\n在“选举中心”可以按省份回看每一块的结果。"
 VEL_CHI.5.t:0 "立法院选举结果"
