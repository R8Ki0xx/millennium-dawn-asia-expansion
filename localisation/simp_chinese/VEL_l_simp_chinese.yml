 VEL_CHI_view_1:0 "民调（不含随机）"
 VEL_CHI_view_2:0 "开票结果"
 VEL_USA.1.a:0 "开始大选年。"
 VEL_USA.1.d:0 "新的大选年到来。两党的全国委员会公布了初选日程，各州的选举官员开始印制选票，华盛顿的政治顾问们把去年的民调摊在桌面上，画出了红州、蓝州与摇摆州的分界线。\n\n接下来的几个月里，两党要先选出各自的总统候选人，然后进入正式竞选。「选举中心」已经开放：可以查看各州的选民构成和民调，在竞选期里选定州举办集会。"
 VEL_USA.1.t:0 "大选年开始"
 VEL_USA.2.a:0 "资深参议员（建制派）：三十年的议会资历，熟悉每一条预算条款，企业界与军方都信得过他。批评者说他缺乏新意。"
 VEL_USA.2.b:0 "民粹主义企业家：从未担任公职的亿万富翁，把边境、关税和「被遗忘的工人」挂在嘴边，集会场场爆满。"
 VEL_USA.2.c:0 "温和派州长：连任两届的州长，预算平衡、跨党派口碑不错，但党内保守派对他的社会立场不满。"
 VEL_USA.2.d:0 "共和党的初选一路打到了六月。三位竞争者在各州的辩论台上争夺党内选民：一位是资深的建制派参议员，一位是锋芒毕露的民粹企业家，还有一位以务实著称的温和派州长。党内元老们私下已经倾向于某一位，但最后的决定权在代表大会。\n\n谁来代表共和党，将决定它在选民眼里的立场。"
 VEL_USA.2.t:0 "共和党初选"
 VEL_USA.3.a:0 "进步派参议员：主张全民医保、绿色新政和大学免学费，年轻选民和工会的新宠，被对手称作「激进」。"
 VEL_USA.3.b:0 "中间派副总统：现政府的副手，稳健、可预期，擅长在医保与财政之间找折中，能见度高，但缺少激情。"
 VEL_USA.3.c:0 "南方州长：来自红州的民主党州长，信仰虔诚，在黑人教会和农村社区里很有人缘，但进步派不信任他。"
 VEL_USA.3.d:0 "民主党内同样硬仗不断。进步派参议员在青年与工会选民中势头强劲，中间派副总统靠着现任政府的资源稳扎稳打，一位来自红州的州长则在教会和农村社区里一点点积累支持。\n\n代表大会前夕，三方都在为「谁更能击败对手」争论不休。"
 VEL_USA.3.t:0 "民主党初选"
 VEL_USA.4.a:0 "主打经济与税收。"
 VEL_USA.4.b:0 "主打医疗与社保。"
 VEL_USA.4.c:0 "主打移民与边境。"
 VEL_USA.4.d:0 "主打外交与反恐。"
 VEL_USA.4.t:0 "总统候选人电视辩论"
 VEL_USA.5.a:0 "等待开票。"
 VEL_USA.5.d:0 "十一月的第一个星期二。东海岸的投票所在清晨六点开门，西海岸最后一批选民在夜里八点才投完票。电视台的屏幕上，一张全国地图正等着被红色和蓝色逐州填满，二百七十张选举人票是胜选的门槛。\n\n打开「选举中心」，看票一州一州地开出来。"
 VEL_USA.5.t:0 "选举日"
 VEL_USA.7.a:0 "接受人民的选择。"
 VEL_USA.7.d:0 "所有州的票都已开完。选举人票结果：\n\n共和党 §Y[?VEL_USA_ds_1|0]§! 票（普选 [?VEL_USA_pct_1|1]%）\n民主党 §Y[?VEL_USA_ds_2|0]§! 票（普选 [?VEL_USA_pct_2|1]%）\n第三党与其他 §Y[?VEL_USA_ds_3|0]§! 票（普选 [?VEL_USA_pct_3|1]%）\n\n获胜者将在一月宣誓就职。"
 VEL_USA.7.t:0 "总统选举结果"
 VEL_USA.8.a:0 "接受选民的裁决。"
 VEL_USA.8.d:0 "总统就职两年之后，国会的期中选举到来了。通胀、医保和边境问题让选民的情绪十分复杂，历史经验也不乐观：总统所在的党在期中选举中通常会失去席位。\n\n选票开出之后，国会两院的力量对比有了变化。"
 VEL_USA.8.t:0 "期中选举"
