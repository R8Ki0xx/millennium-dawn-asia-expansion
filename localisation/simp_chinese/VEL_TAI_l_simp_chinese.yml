l_simp_chinese:
 VEL_TAI.1.a:0 "打开选举中心，开始竞选。"
 VEL_TAI.1.d:0 "选举日定在六十天之后。中央选举委员会公布了各县市的选区与席次：人口多的新北、高雄与台北席次最多，澎湖、金门与连江也各保有一席。\n\n各党的竞选总部陆续挂牌。国民党主打经济与两岸交流，民进党强调主权与转型正义，民众党打着「第三条路」的旗号，亲民党盯着中南部的基层，劳工党则在工会与青年之间寻找声音。打开「选举中心」，可以查看各县市的民调与选民构成，并在选定的县市举办造势大会。"
 VEL_TAI.1.t:0 "立法委员选举进入竞选期"
 VEL_TAI.2.a:0 "主打经济与产业。"
 VEL_TAI.2.b:0 "主打福利与劳工。"
 VEL_TAI.2.c:0 "主打两岸与统独。"
 VEL_TAI.2.d:0 "主打转型正义与认同。"
 VEL_TAI.2.e:0 "主打廉政与政治改革。"
 VEL_TAI.2.t:0 "竞选辩论"
 VEL_TAI.3.a:0 "等待开票。"
 VEL_TAI.3.d:0 "天刚亮，全岛各地的投票所外已经排起了长队。从基隆到屏东，从花莲到澎湖，选民在同一天走进投票间，选出新一届立法委员。\n\n票箱在傍晚封存，各县市的开票结果将自东向西陆续公布。打开选举中心，可以看着地图一块一块被填满。"
 VEL_TAI.3.t:0 "投票日"
 VEL_TAI.5.a:0 "接受人民的决定。"
 VEL_TAI.5.d:0 "全部县市的票箱都已开完。新一届立法院的席次如下：\n\n国民党 §Y[?VEL_TAI_ds_1|0]§! 席（得票 [?VEL_TAI_pct_1|1]%）\n民进党 §Y[?VEL_TAI_ds_2|0]§! 席（得票 [?VEL_TAI_pct_2|1]%）\n民众党 §Y[?VEL_TAI_ds_3|0]§! 席（得票 [?VEL_TAI_pct_3|1]%）\n劳工党 §Y[?VEL_TAI_ds_4|0]§! 席（得票 [?VEL_TAI_pct_4|1]%）\n亲民党 §Y[?VEL_TAI_ds_5|0]§! 席（得票 [?VEL_TAI_pct_5|1]%）\n\n得票与席次最多的政党，将由它的党魁出任总统并组阁。在「选举中心」可以按县市回看每一块的结果。"
 VEL_TAI.5.t:0 "立法委员选举结果"
