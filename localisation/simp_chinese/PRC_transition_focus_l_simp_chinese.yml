l_simp_chinese:
 PRC_after_beijing: "北京陷落之后"
 PRC_after_beijing_desc: "中南海已经易手，但党还在，军队还在。只要东北和华北的群众还在，我们就没有失败。"
 PRC_rebuild_central_committee: "重建中央"
 PRC_rebuild_central_committee_desc: "在新的首都召开中央全会，重建党中央的领导核心。"
 PRC_rectification: "党内整风"
 PRC_rectification_desc: "清除动摇分子，统一全党思想。延安的经验，今天仍然有效。"
 PRC_united_front: "统一战线"
 PRC_united_front_desc: "团结一切可以团结的力量：对国民党新政府不满的工人、农民、下岗职工与地方实力派。"
 PRC_underground_party: "地下党"
 PRC_underground_party_desc: "在国统区重建地下党组织，发动群众，渗透军队与政府。"
 PRC_peoples_democratic_dictatorship: "人民民主专政"
 PRC_peoples_democratic_dictatorship_desc: "工人阶级领导的、以工农联盟为基础的人民民主专政，是新中国的国体。"
 PRC_reorganize_remnants: "整编残军"
 PRC_reorganize_remnants_desc: "把撤退下来的部队整编为新的野战军。"
 PRC_northeast_resistance: "东北抗联精神"
 PRC_northeast_resistance_desc: "白山黑水之间，杨靖宇与赵尚志的传统从未断绝。"
 PRC_peoples_war: "人民战争"
 PRC_peoples_war_desc: "兵民是胜利之本。把敌人淹没在人民战争的汪洋大海之中。"
 PRC_guerrilla_tactics: "游击战术"
 PRC_guerrilla_tactics_desc: "敌进我退，敌驻我扰，敌疲我打，敌退我追。"
 PRC_base_areas: "建设根据地"
 PRC_base_areas_desc: "在东北的工业基地上建设巩固的革命根据地。"
 PRC_third_civil_war: "第三次国共内战"
 PRC_third_civil_war_desc: "时机已到。中共中央号召全国人民起来推翻国民党反动政府。"
 PRC_march_south: "进军关内"
 PRC_march_south_desc: "挥师入关，解放华北。"
 PRC_liberate_nanjing: "解放南京"
 PRC_liberate_nanjing_desc: "钟山风雨起苍黄，百万雄师过大江。"
 PRC_seek_moscow_aid: "求援莫斯科"
 PRC_seek_moscow_aid_desc: "向克里姆林宫请求武器与资金援助。"
 PRC_nko_comrades: "朝鲜同志"
 PRC_nko_comrades_desc: "鸭绿江对岸的朝鲜同志，曾经与我们并肩作战。"
 PRC_international_communism: "国际共运"
 PRC_international_communism_desc: "古巴、越南、老挝与全世界的同志们，请支援中国革命！"
 PRC_new_china: "新中国"
 PRC_new_china_desc: "中华人民共和国还没有灭亡。当红旗重新插上天安门城楼，新中国将再次诞生。"
