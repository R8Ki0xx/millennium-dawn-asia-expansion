l_simp_chinese:
 PRC_after_beijing: "北京陷落之后"
 PRC_after_beijing_desc: "中南海已经易手，青天白日旗插上了天安门城楼。但党还在，军队还在，数千万党员还在。只要东北和华北的群众还在，我们就没有失败。1927 年、1934 年，党都曾濒临覆灭，最后都走了出来。"
 PRC_rebuild_central_committee: "重建中央"
 PRC_rebuild_central_committee_desc: "在新的首都召开中央全会，重建党中央的领导核心。幸存的中央委员与各省党委书记从四面八方赶来，有人在途中被捕，有人投向了对岸；与会者知道，这次会议的意义不亚于当年的遵义会议。"
 PRC_rectification: "党内整风"
 PRC_rectification_desc: "清除动摇分子，统一全党思想。北京陷落后，不少党员烧掉了党员证、在新政府里找了差事；整风运动要求每个人交代自己在危机中的表现。延安的经验，今天仍然有效。"
 PRC_united_front: "统一战线"
 PRC_united_front_desc: "团结一切可以团结的力量：对国民党新政府不满的工人、农民、下岗职工与地方实力派。光复后的国企改制让数百万工人失去了铁饭碗，土地确权让一些农民担心失去土地；这些人都是统战的对象。"
 PRC_underground_party: "地下党"
 PRC_underground_party_desc: "在国统区重建地下党组织，发动群众，渗透军队与政府。单线联系、秘密交通站与暗号，那些在《红岩》里读到的东西，如今又成了党员们的日常。每一个被渗透的工厂与兵营，都是未来起义的火种。"
 PRC_peoples_democratic_dictatorship: "人民民主专政"
 PRC_peoples_democratic_dictatorship_desc: "工人阶级领导的、以工农联盟为基础的人民民主专政，是新中国的国体。在根据地里，人民代表会议重新召开，土地与工厂回到集体手中。党要向群众证明，它比南京的政府更能代表普通人的利益。"
 PRC_reorganize_remnants: "整编残军"
 PRC_reorganize_remnants_desc: "把撤退下来的部队整编为新的野战军。北部战区与中部战区的残部、武警与民兵混编在一起，番号重新编排，政委重新任命。装备与补给都严重不足，但这些部队是党最后的本钱。"
 PRC_northeast_resistance: "东北抗联精神"
 PRC_northeast_resistance_desc: "白山黑水之间，杨靖宇与赵尚志的传统从未断绝。当年东北抗日联军在冰天雪地里与日军周旋了十四年；如今长白山与小兴安岭的密林，再一次成为党的游击队的藏身之所。"
 PRC_peoples_war: "人民战争"
 PRC_peoples_war_desc: "兵民是胜利之本。把敌人淹没在人民战争的汪洋大海之中：每个村庄都是堡垒，每个农民都是哨兵。国军有美式装备与空中优势，但它无法占领每一座山头、每一个村落。"
 PRC_guerrilla_tactics: "游击战术"
 PRC_guerrilla_tactics_desc: "敌进我退，敌驻我扰，敌疲我打，敌退我追。十六字诀是党的军队起家的法宝，如今再一次派上用场：避开国军的装甲与空袭，袭击它的补给线、检查站与后方的光复区政府。"
 PRC_base_areas: "建设根据地"
 PRC_base_areas_desc: "在东北的工业基地上建设巩固的革命根据地。鞍山的钢铁、大庆的石油与哈尔滨的机械厂，曾是共和国工业的长子；如今它们要为革命战争提供枪炮与弹药。"
 PRC_third_civil_war: "第三次国共内战"
 PRC_third_civil_war_desc: "时机已到。中共中央号召全国人民起来推翻国民党反动政府：各地的地下党同时发动起义，工厂罢工、铁路瘫痪，游击队攻打县城。第三次国共内战，就此打响。"
 PRC_march_south: "进军关内"
 PRC_march_south_desc: "挥师入关，解放华北。七十多年前，东北野战军从这里南下，平津战役决定了中国的命运；如今历史似乎要再演一次。山海关外的部队整装待发，目标是北平与天津。"
 PRC_liberate_nanjing: "解放南京"
 PRC_liberate_nanjing_desc: "钟山风雨起苍黄，百万雄师过大江。1949 年 4 月，解放军渡过长江、攻占南京总统府；七十多年后，党的军队要再一次打到长江边，把国民党政府赶出它的首都。"
 PRC_seek_moscow_aid: "求援莫斯科"
 PRC_seek_moscow_aid_desc: "向克里姆林宫请求武器与资金援助。莫斯科的态度暧昧：它乐于看到一个分裂的中国，却不愿为一个可能失败的政权得罪南京与华盛顿。援助会来，但代价是边境、能源与港口上的让步。"
 PRC_nko_comrades: "朝鲜同志"
 PRC_nko_comrades_desc: "鸭绿江对岸的朝鲜同志，曾经与我们并肩作战。七十年前志愿军入朝，如今轮到平壤报答：允许我们的部队在朝鲜境内休整，开放新义州的补给通道。金氏政权也明白，没有北京，它自己也难以长存。"
 PRC_international_communism: "国际共运"
 PRC_international_communism_desc: "古巴、越南、老挝与全世界的同志们，请支援中国革命！但这些国家早已不是 1960 年代的革命兄弟：河内与南京有着大笔的生意，哈瓦那自顾不暇。国际共运能提供的，更多是声援而不是枪炮。"
 PRC_new_china: "新中国"
 PRC_new_china_desc: "中华人民共和国还没有灭亡。当红旗重新插上天安门城楼，新中国将再次诞生。对于在根据地里坚持下来的党员与战士们来说，这是他们唯一的信念，也是他们愿意付出一切的目标。"
