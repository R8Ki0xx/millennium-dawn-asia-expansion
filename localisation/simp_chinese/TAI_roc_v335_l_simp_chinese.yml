l_simp_chinese:
 roc_v335.1.t:0 "竹科用水之争"
 roc_v335.1.d:0 "新竹科学园区的晶圆厂一座接一座落成，用水与用电量成倍增长。去年枯水期，农民的水田被迫休耕，却眼看着园区的水车照常进出。农会代表与厂商在经济部门前对峙，立法委员要求政府先保民生再保产业；园区协会则警告，只要停一天产线，订单就会流向海外。政府必须在农业与科技之间划出一条界线。"
 roc_v335.1.a:0 "优先保障园区用水，补偿农民休耕。"
 roc_v335.1.b:0 "先保农业用水，要求园区自建回收水厂。"
 roc_v335.2.t:0 "两岸经济合作架构协议"
 roc_v335.2.d:0 "谈判桌上，海峡两岸的代表就关税减让清单反复拉锯。出口导向的电子与机械业者希望协议越快签越好，传统农渔业与中小企业却担心被廉价商品淹没。在野党在立法院发动议事杯葛，街头出现了「反服贸」的游行队伍。政府可以按原定日程签署，也可以把协议拆成逐项审查，换取更广泛的社会共识。"
 roc_v335.2.a:0 "按原定日程签署，让出口业者先受益。"
 roc_v335.2.b:0 "拆成逐项审查，延后签署。"
 roc_v335.3.t:0 "核四的最后一道门"
 roc_v335.3.d:0 "龙门核能电厂已经建设了二十多年，预算一再追加，工程团队换了几批人。反核团体在厂区外静坐，台电则说如果现在停工，之前投入的数千亿元就全部成为沉没成本，而且夏季将出现限电。总统在民意与能源安全之间犹豫：是继续完成安全检查后商转，还是把它封存，转向天然气与再生能源？"
 roc_v335.3.a:0 "通过安检后商转，确保供电。"
 roc_v335.3.b:0 "封存核四，加快天然气与再生能源。"
 roc_v335.4.t:0 "石化业的烟囱"
 roc_v335.4.d:0 "石化工业区的烟囱日夜排放，附近渔民说近海的牡蛎已经卖不出去。业者强调石化原料是电子、纺织与塑料产业的上游，一旦减产，下游整条供应链都会受影响。环保团体要求立刻总量管制，并公开监测数据；县政府则担心工厂外移后税收与就业一起流失。"
 roc_v335.4.a:0 "实施排放总量管制，要求业者加装脱硫设备。"
 roc_v335.4.b:0 "维持产量，以回馈金安抚地方。"
 roc_v335.5.t:0 "金融改革的第二波"
 roc_v335.5.d:0 "公股银行的坏账尚未清完，民营金控却急着并购扩张。金融监督管理机关提出新的整并方案：让经营不善的小型银行并入大型金控，并设立存款保险的最高保额。大型金控欢迎这项政策，地方信用合作社却警告，被并购意味着基层金融服务消失，农渔村将更难贷款。"
 roc_v335.5.a:0 "推动整并，建立大而稳的金融体系。"
 roc_v335.5.b:0 "保留信用合作社，设立转型辅导基金。"
 roc_v335.6.t:0 "高铁的财务缺口"
 roc_v335.6.d:0 "高速铁路已经通车，但载客量不如预期，民间投资的财团一年亏损数百亿，银行团开始催讨贷款。财团向政府申请延长特许年限，并要求注资；在野党则指责这是「官商勾结」的又一个例子。若是放任公司倒闭，整个西部走廊的交通与沿线开发都将陷入混乱。"
 roc_v335.6.a:0 "收购多数股权，由政府接手营运。"
 roc_v335.6.b:0 "延长特许年限，要求票价保持不变。"
 roc_v335.7.t:0 "义务役与募兵之争"
 roc_v335.7.d:0 "国防部提出了将义务役期缩短、转为以志愿役为主的兵役制度。年轻人欢迎缩短役期，但参谋本部担心新兵素质不稳，战时的后备动员也会因此削弱。军中老将主张延长训练时间与强化后备部队；学者则提醒，志愿役的薪资与住宿福利若不够，兵源只会更少。"
 roc_v335.7.a:0 "提高志愿役薪资，逐步转向募兵。"
 roc_v335.7.b:0 "维持义务役，强化后备动员训练。"
 roc_v335.8.t:0 "汉光演习的漏洞"
 roc_v335.8.d:0 "年度汉光演习的检讨会上，观察员列出了一连串问题：后备部队集结迟缓，民间运输车辆无法及时征用，通信系统在模拟电磁干扰下全面失灵。国防部想低调处理，但在野党在立法院公开了其中一份报告，媒体立刻以头版刊登。军方必须决定是公开检讨，还是内部处理。"
 roc_v335.8.a:0 "公开检讨，成立专案小组彻查。"
 roc_v335.8.b:0 "内部处理，避免动摇士气。"
 roc_v335.9.t:0 "潜舰国造的预算"
 roc_v335.9.d:0 "国造潜舰计划进入了第二阶段，造船公司提出的预算比原估高出了近三成。立法院里，一派主张全额通过，视为重建海军威慑力的象征；另一派则要求先完成试航，再决定后续拨款。海军的工程师私下透露，若继续拖延，关键技术人员将被外商挖角。"
 roc_v335.9.a:0 "全额通过预算，不让工程中断。"
 roc_v335.9.b:0 "分阶段拨款，先完成试航再说。"
 roc_v335.10.t:0 "军购特别预算"
 roc_v335.10.d:0 "美方答应出售升级零件，但要求在一定期限内付清款项。行政部门提出了特别预算案，在野党却在立法院里反复搁置，质疑价格是否合理。美国在台协会私下表示，若预算再拖，下一批军售可能被延后；空军则提醒，老旧战机的妥善率已经跌到了危险的程度。"
 roc_v335.10.a:0 "动用预备金先行付款，再补送审查。"
 roc_v335.10.b:0 "与在野党协商，附带监督条款后通过。"
 roc_v335.11.t:0 "无人机的民间队伍"
 roc_v335.11.d:0 "一群在竹科工作的工程师自行组装了数百架小型无人机，并在演训中展示了令军方吃惊的侦察效果。国防部是否应该把民间厂商纳入供应链？支持者认为这是以低成本取得不对称优势的捷径；军方的采购部门则担心标准不一、资安不足，一旦被渗透，后果难以想象。"
 roc_v335.11.a:0 "开放民间厂商，设立共同标准与审查机制。"
 roc_v335.11.b:0 "仍由国营机构主导，民间只供应零组件。"
 roc_v335.12.t:0 "陆战队的训练事故"
 roc_v335.12.d:0 "陆战队在高强度两栖训练中发生了严重意外，数名士兵受伤。家属在国防部前举着照片要求说明，媒体追问训练强度是否已经超过了安全的限度。陆战队司令坚持高标准是保命的关键，立委则提出必须引入第三方监察。"
 roc_v335.12.a:0 "引入第三方监察，调整训练规范。"
 roc_v335.12.b:0 "维持训练强度，加强医疗与保险。"
 roc_v335.13.t:0 "邦交国的新要求"
 roc_v335.13.d:0 "一个中美洲邦交国的新总统在访问台北时，要求台湾追加援助：兴建港口、提供农业贷款，并资助竞选期间承诺的社会住宅。内部有人认为这是外交的必要成本；也有人批评这是「撒钱」，且对方随时可能转向大陆。"
 roc_v335.13.a:0 "答应追加援助，换取明确的外交承诺。"
 roc_v335.13.b:0 "维持原有援助，只提供技术合作。"
 roc_v335.14.t:0 "世界卫生大会的门口"
 roc_v335.14.d:0 "今年世界卫生大会再次没有邀请台湾代表入场。外交部的医疗团队带着防疫资料在会场外举行记者会，并获得了多国卫生官员的私下回应。官员们建议：是继续以「卫生合作」的名义争取观察员席位，还是以民间医疗援助拉近与各国的关系，避免正面碰撞？"
 roc_v335.14.a:0 "继续争取观察员席位，动员友邦发言。"
 roc_v335.14.b:0 "以医疗援助拉近关系，避免正面冲突。"
 roc_v335.15.t:0 "华盛顿的账单"
 roc_v335.15.d:0 "美国国防部的一位代表私下告诉我方，若希望持续购得先进装备，台湾就必须提高国防预算占比，并把采购规划提前公开。军方高层认为这是长期合作的关键，财政部门则警告：国防预算连年上升，会挤压社会福利与教育。"
 roc_v335.15.a:0 "提高国防预算占比，换取优先供应。"
 roc_v335.15.b:0 "维持预算，改以自主研发补足缺口。"
 roc_v335.16.t:0 "渔权谈判"
 roc_v335.16.d:0 "台湾与日本就周边海域的作业规则开始新一轮谈判。渔民希望扩大作业海域，外交部担心强硬立场会影响双方在安全议题上的合作，而日本方面的谈判代表也面临地方渔业团体的压力。谈判的结果会成为未来台日关系的重要样板。"
 roc_v335.16.a:0 "让步部分渔区，换取安全合作承诺。"
 roc_v335.16.b:0 "坚持渔民权益，延后签署。"
 roc_v335.17.t:0 "国企改制的争吵"
 roc_v335.17.d:0 "接收下来的大型国营企业冗员严重、设备老旧，却养活着数百万职工。改制方案一出，工人代表聚集在厂门口，担心「改制就是裁员」；财经官员则认为只有引进民间资本与现代管理，企业才有活路。不同部会各执一词，总统府需要定出改制的节奏。"
 roc_v335.17.a:0 "快速改制，引进民间资本与专业经理人。"
 roc_v335.17.b:0 "分阶段改制，同步建立失业救济与转职训练。"
 roc_v335.18.t:0 "新法币的兑换比率"
 roc_v335.18.d:0 "新法币即将发行，但旧币对新币的兑换比率成了最大的争议。比率定得高，持有现金的民众会觉得受益，物价却可能上涨；比率定得低，则会抑制通胀，却让储户觉得资产被剥夺。中央银行的经济学家与地方银行行长在会议室里吵到深夜。"
 roc_v335.18.a:0 "以较宽松的比率兑换，换取民心。"
 roc_v335.18.b:0 "以较紧的比率兑换，优先稳定物价。"
 roc_v335.19.t:0 "东北老工业区"
 roc_v335.19.d:0 "沈阳的重型机械厂、鞍山的钢铁基地、大庆的油田，都曾经是国家的骄傲，如今却设备老化、年轻人持续南下。省政府提出了振兴方案：是对老企业进行大规模技改，还是引进外资与新产业，让旧厂区改造成工业园区？工人们的态度也同样分歧。"
 roc_v335.19.a:0 "对老企业大规模技改，保留基础工业。"
 roc_v335.19.b:0 "引进外资，改造成新兴产业园区。"
 roc_v335.20.t:0 "西部的水与路"
 roc_v335.20.d:0 "西北的发展规划遇到了现实问题：修一条铁路要先解决沙漠地带的水源，引一条输水管则需要先有公路能运建材。参与规划的工程师建议，先修公路与小型水库，让地方有基础，再投入大型铁路；但地方官员迫切希望能尽快看到「大工程」。"
 roc_v335.20.a:0 "先修公路与水库，打好基础。"
 roc_v335.20.b:0 "直接启动铁路干线，同步推动沿线开发。"
 roc_v335.21.t:0 "土地改革的最后一块田"
 roc_v335.21.d:0 "耕者有其田的政策在各省顺利推行，但在几个人口稠密的省份，地主与佃农之间的纠纷仍然很多。地方官员发现，土地登记不清、水利设施归属不明，使得不少农民拿到的土地反而成为了负担。乡间的老人们说，改革的方向是对的，但要有人把细节做完。"
 roc_v335.21.a:0 "派遣土地调查队，逐村确认地籍。"
 roc_v335.21.b:0 "设置仲裁委员会，由地方士绅协助调解。"
 roc_v335.22.t:0 "台商回乡"
 roc_v335.22.d:0 "当年到大陆设厂的台商大量回到家乡，他们带回了资金与技术，也带着对旧体制的怨言。一群东莞的电子厂主表示，只要政府承诺保障产权与税务待遇，他们愿意把整条供应链搬到内地更深处；不过本地的业者却担心被抢走订单。"
 roc_v335.22.a:0 "给予税赋优惠，欢迎台商带动内地产业。"
 roc_v335.22.b:0 "一视同仁，不设特殊待遇。"
 roc_v335.23.t:0 "央行的独立性"
 roc_v335.23.d:0 "在统一货币政策的过程中，中央银行要求取得更大的自主权，以免政治干预利率与发钞。财政部担心这会限制政府在经济衰退时的弹性，立法院里的委员也认为央行总裁不应该不受任何监督。"
 roc_v335.23.a:0 "保障央行独立，任期不受政治影响。"
 roc_v335.23.b:0 "央行向行政院报告，保留政治监督。"
 roc_v335.24.t:0 "户口制度的消失"
 roc_v335.24.d:0 "取消户籍限制后，数百万农民工涌向沿海大城市。城市的学校与医院一下子挤满了人，市政府抱怨经费不足；同时，农村的老人与孩子们则等着汇款回来。内政部的专家说，流动本身并不是问题，问题在于公共服务是否能跟上。"
 roc_v335.24.a:0 "增加城市公共服务补贴，吸收新居民。"
 roc_v335.24.b:0 "鼓励回乡创业，引导人口分流。"
 roc_v335.25.t:0 "西气东输的工程"
 roc_v335.25.d:0 "管线工程队沿着戈壁一路挖到东部沿海，沿线的村庄第一次通上天然气。工程提前完工，让预算出现了结余，而东部城市要求以较低价格取得气源，西部省份则主张部分收益应留在当地。能源部门需要决定如何分配这笔红利。"
 roc_v335.25.a:0 "让利东部，降低工业用气价格。"
 roc_v335.25.b:0 "留一部分收益给西部，设立地方发展基金。"
 roc_v335.26.t:0 "地方债务的清算"
 roc_v335.26.d:0 "审计报告披露，部分省市的融资平台债务已经远超偿债能力，其中不少项目是为了政绩而兴建的「面子工程」。财政部提出了债务清理方案：是由中央承接部分债务，换取地方预算受监督，还是让地方自行处理，必要时让融资平台破产？"
 roc_v335.26.a:0 "中央承接部分债务，换取地方预算受监督。"
 roc_v335.26.b:0 "让地方自行处理，必要时让平台破产。"
 roc_v335.27.t:0 "军官的甄审"
 roc_v335.27.d:0 "甄审委员会面对的是数十万份军官档案：来自旧解放军的将领，有的有战功，有的牵涉旧党军的政治教育。如果审查太严，会让整个军队感到恐惧；若审查太松，则担心旧体制的忠诚者仍然盘踞在关键岗位。"
 roc_v335.27.a:0 "严格甄审，并重新任命关键指挥官。"
 roc_v335.27.b:0 "宽松审查，以保留战斗力为先。"
 roc_v335.28.t:0 "黄埔军校的重开"
 roc_v335.28.d:0 "黄埔军校在广州重新开学，第一批学员中有来自台湾的军官，也有曾在旧解放军服役的年轻人。校务委员会面对的第一个问题就是教材：是采用战前黄埔传统的教材，还是以现代联合作战为核心？老校友们在典礼上哭了，年轻的教官们却想要改革。"
 roc_v335.28.a:0 "保留黄埔传统，强化精神教育与军纪。"
 roc_v335.28.b:0 "以联合作战为核心，全面更新教材。"
 roc_v335.29.t:0 "复员军人的去处"
 roc_v335.29.d:0 "军队整编之后，数十万名军人需要复员。一些人回到家乡种田，更多人却在城市里找不到工作。退伍军人聚集在市政府前，要求安置与抚恤。陆军部的统计显示，若这些人长期失业，社会治安会受到严重影响。"
 roc_v335.29.a:0 "设立退伍军人安置基金与职业训练营。"
 roc_v335.29.b:0 "将部分复员军人编入屯垦与基建部队。"
 roc_v335.30.t:0 "战区司令的人选"
 roc_v335.30.d:0 "新战区的编制已经确定，但是谁来担任各战区司令却争论不休。台湾来的将领认为这是接收的成果，旧军出身的将领则要求体现多数。总统在两份名单之间犹豫不决，因为任何一份都会让另一方感到被排斥。"
 roc_v335.30.a:0 "任命台湾来的将领，确保指挥链忠诚。"
 roc_v335.30.b:0 "混合任命，每个战区由两方将领搭配。"
 roc_v335.31.t:0 "海军的整合"
 roc_v335.31.d:0 "台湾海军与旧解放军海军的装备大不相同，一边是欧美系舰艇，另一边是苏系与国产的混合。海军部的工程师指出，维修零件与训练教材都需要统一，但统一意味着要放弃一方的体系。"
 roc_v335.31.a:0 "以国产标准统一，并逐步汰换旧舰。"
 roc_v335.31.b:0 "保留两套体系并行，各舰队自行维护。"
 roc_v335.32.t:0 "核武库的清点"
 roc_v335.32.d:0 "清点接收的战略武器时，技术小组交上了一份令人不安的报告：部分弹头的维护纪录不完整，保管人员也存在流失。军方高层主张保存嚇阻能力，国际社会则期盼新政府能展现不扩散的诚意。"
 roc_v335.32.a:0 "宣布保留有限的核嚇阻力。"
 roc_v335.32.b:0 "接受国际核查，逐步裁减核武。"
 roc_v335.33.t:0 "空军基地的整合"
 roc_v335.33.d:0 "空军整合时发现两边的基地布局存在严重重复：沿海一带有太多机场，而内陆几乎没有备援跑道。空军部提出了裁并与新建并行的方案，地方政府担心基地搬走后经济萧条，纷纷游说。"
 roc_v335.33.a:0 "裁并沿海基地，新建内陆备援机场。"
 roc_v335.33.b:0 "保留现有基地，改建为军民合用机场。"
 roc_v335.34.t:0 "军工体系的改造"
 roc_v335.34.d:0 "接收的军工厂有些技术先进、有些却相当落后，同时还背负着大量未清偿的债务。国防工业部提出两种方案：保留国营体系、集中资源攻关；或者开放民间参与，以竞标方式取得订单。"
 roc_v335.34.a:0 "保留国营体系，集中资源攻关。"
 roc_v335.34.b:0 "开放民间竞标，引入市场竞争。"
 roc_v335.35.t:0 "党内派系的平衡"
 roc_v335.35.d:0 "国民党内的各派系对「谁来管党」争得面红耳赤：台湾来的本土派、大陆旧部、地方的桩脚各自要求在中常会里占到更多席次。党主席想要的是团结，却发现每一次折衷，都会让某一派觉得被牺牲。"
 roc_v335.35.a:0 "按派系比例分配席次，以稳定党内。"
 roc_v335.35.b:0 "以能力与考核为准，重组中常会。"
 roc_v335.36.t:0 "党军关系的重整"
 roc_v335.36.d:0 "改革派希望让军队真正国家化，不再受政党指挥，而军中的老党员则认为国民党创建了军队，不应割裂。每一次党代表大会前，军队的代表都会成为各方拉拢的对象。"
 roc_v335.36.a:0 "军队国家化，退出党部活动。"
 roc_v335.36.b:0 "保留军中党部，仅限政治教育功能。"
 roc_v335.37.t:0 "第一次省长选举"
 roc_v335.37.d:0 "民主党争取了多年的省长直选，终于要举办了。各省的候选人纷纷出现：有地方富商，有学界人士，也有曾经的党内同志。中央政府担心某些省份可能出现强势的地方势力，使中央的权威受到挑战。"
 roc_v335.37.a:0 "全面开放直选，让各省自行决定。"
 roc_v335.37.b:0 "设定资格审查，避免地方势力坐大。"
 roc_v335.38.t:0 "财政联邦的分账"
 roc_v335.38.d:0 "财政联邦制度要求明确划分中央与省的税源。富裕的沿海省份希望留下大部分税收，内陆省份则要求更多补助。民主党内部也出现了分歧：有人主张多留给地方，有人担心中央财政失去调节能力。"
 roc_v335.38.a:0 "多留给地方，中央保留转移支付机制。"
 roc_v335.38.b:0 "中央保留主要税源，再按人口补助。"
 roc_v335.39.t:0 "最低工资的第一档"
 roc_v335.39.d:0 "社民党的最低工资法案在国会引起了激烈辩论。工会希望定得越高越好；中小企业主则表示，一旦工资暴涨，他们只能减少雇员或搬迁。劳动部的统计官员也承认，不同省份的生活成本差距极大。"
 roc_v335.39.a:0 "定出较高的全国统一标准。"
 roc_v335.39.b:0 "分省定标，由地方劳资协商。"
 roc_v335.40.t:0 "碳价的代价"
 roc_v335.40.d:0 "政府宣布了第一阶段的碳价方案，重工业与发电业者发出了严重警告：成本上升会让产品失去竞争力。环保团体则指出，若价格定得太低，就起不到任何作用。财政部倾向于把收入用来补贴低收入家庭。"
 roc_v335.40.a:0 "以较高的碳价起步，税收补贴低收入家庭。"
 roc_v335.40.b:0 "以较低的碳价起步，给产业缓冲期。"
 roc_v335.41.t:0 "跨党内阁的名单"
 roc_v335.41.d:0 "组阁谈判进入了最后一刻。国民党要求保留财政与国防，民主党想要内政与司法，社民党则坚持劳动与教育。三党代表在议会的小会议室里谈到深夜，每个人都清楚，名单一旦公布，就再也不可能收回。"
 roc_v335.41.a:0 "按议席比例分配，成立稳定的联合政府。"
 roc_v335.41.b:0 "由总统指定几位无党籍专业人士入阁。"
 roc_v335.42.t:0 "真相调查委员会"
 roc_v335.42.d:0 "真相委员会的听证会一场接一场举行，受害者家属、退休军官与旧党干部轮流在镜头前陈述。每一个故事都在撕开旧伤，也在逼迫社会面对过去。有人要求追究责任，有人说宽恕才是出路。"
 roc_v335.42.a:0 "公开全部听证记录，依个案追究。"
 roc_v335.42.b:0 "采取和解模式，换取证词与道歉。"
 roc_v335.43.t:0 "合法政党的资格"
 roc_v335.43.d:0 "共产党正式取得合法政党地位后，第一次面临选举局注册的问题。有人提出要求党章中放弃「无产阶级专政」的字样，党内保守派则担心这会让党失去灵魂。选举局内部也有意见，因为一旦批准，其他政党也会要求同样的待遇。"
 roc_v335.43.a:0 "修改党章，换取全国性政党资格。"
 roc_v335.43.b:0 "保留原章程，仅以地方性政党登记。"
 roc_v335.44.t:0 "市场社会主义的实验"
 roc_v335.44.d:0 "共产党主政的省份开始试点「市场社会主义」：国企与合作社同时竞争，工人拥有部分股权。有人称赞这是中间路线，也有人认为是两边都不讨好。财政部门的统计显示，试点省份的生产力有所提升，但差距也在扩大。"
 roc_v335.44.a:0 "扩大试点范围，推广到更多省份。"
 roc_v335.44.b:0 "维持小规模，持续观察。"
 roc_v335.45.t:0 "边界勘定的最后几公里"
 roc_v335.45.d:0 "中俄边界勘定小组在黑龙江上的几个小岛问题上陷入僵局。地图上的线只差一条，但每一条线背后都有渔民、边防军与沿江村庄的利益。莫斯科的代表暗示，若能在这些岛屿上让步，边境经济合作可以大幅扩大。"
 roc_v335.45.a:0 "接受折衷方案，换取边境合作。"
 roc_v335.45.b:0 "坚持原有主张，不作让步。"
 roc_v335.46.t:0 "西伯利亚管线的价格"
 roc_v335.46.d:0 "管线的价格谈判已经拖了一个冬天。俄方要求按国际行情定价，我们则希望得到长期折扣。双方都承认彼此需要对方，但没人想先让步。能源部的谈判代表手上拿着一份来自中亚的备选方案，随时可以拿出来当筹码。"
 roc_v335.46.a:0 "接受较高价格，换取长期稳定供气。"
 roc_v335.46.b:0 "亮出中亚备案，迫使对方降价。"
 roc_v335.47.t:0 "北极航线的第一支船队"
 roc_v335.47.d:0 "第一支载满货物的商船队驶入了北极航线，船公司表示这条航道能比苏伊士运河缩短近三分之一航程。俄方要求收取破冰与通行费，我方船东则希望获得优先通行权。环保团体担心北极的生态脆弱，不应为了航运过度开发。"
 roc_v335.47.a:0 "支付通行费，换取优先使用权。"
 roc_v335.47.b:0 "与俄方共同投资破冰船队，分担成本。"
 roc_v335.48.t:0 "脱北者的秘密通道"
 roc_v335.48.d:0 "我们的情报人员在鸭绿江北岸建立了一条脱北者通道。这条线既是情报来源，也是人道救援的路径，但如果被平壤发现，将引发外交风暴。军情局长建议扩大规模，国安会则要求暂停，以免北京与首尔之间的信任受损。"
 roc_v335.48.a:0 "扩大通道，取得更多平壤内部情报。"
 roc_v335.48.b:0 "暂停行动，等待更有利的时机。"
 roc_v335.49.t:0 "联合司令部的语言"
 roc_v335.49.d:0 "中韩联合司令部成立后，最先遇到的并不是战术问题，而是语言和标准：参谋文书用中文还是韩文，英文是否作为通用语，军阶对照、通信频道和后勤标准又由谁订定？两国军官在会议室里为了一个词争论了整整一个下午。"
 roc_v335.49.a:0 "以英文作为通用语，采用北约标准。"
 roc_v335.49.b:0 "采用双语文书，并以中方标准为主。"
 roc_v335.50.t:0 "鸭绿江经济带"
 roc_v335.50.d:0 "鸭绿江两岸的开发区开始设厂，丹东的货车一辆接一辆驶过新桥。朝鲜的官员希望外资只局限于特区之内，我方的商人则要求能够自由雇用劳工，并在朝鲜境内设立仓储。双方的谈判人员知道，这个经济带的成败，将决定边境的未来十年。"
 roc_v335.50.a:0 "同意特区限制，换取稳定的投资环境。"
 roc_v335.50.b:0 "坚持自由雇工与仓储，延缓开发。"
 TAI_v335_fab_water_plan:0 "园区用水保障"
 TAI_v335_fab_water_plan_desc:0 "政府优先保障科学园区的用水与供电，晶圆厂的扩产与研发因此不受枯水期影响，代价是农业用水吃紧，地方的不满正在积累。"
 TAI_v335_ecfa_dividend:0 "经合协议红利"
 TAI_v335_ecfa_dividend_desc:0 "协议签署后，出口业者的订单明显增加，工厂开工率提升；但传统产业与小农的不安情绪仍然存在，街头的抗议也没有完全平息。"
 TAI_v335_energy_transition:0 "能源转型"
 TAI_v335_energy_transition_desc:0 "核四封存后，政府加快了天然气接收站与再生能源的建设。短期内电价上升，但民众对能源政策的信任度有所恢复。"
 TAI_v335_volunteer_force:0 "志愿役新制"
 TAI_v335_volunteer_force_desc:0 "提高薪资与住宿福利后，志愿役士兵比例上升，训练时间缩短而素质更稳定；国防开支也随之增加。"
 TAI_v335_drone_swarm:0 "无人机蜂群"
 TAI_v335_drone_swarm_desc:0 "民间无人机厂商加入供应链后，军方得以低成本取得大量侦察与攻击平台，部队的战术灵活度提升。"
 TAI_v335_homegrown_arms:0 "自主国防"
 TAI_v335_homegrown_arms_desc:0 "以自主研发取代部分进口后，国防科研机构与民营企业合作更紧密，生产线也逐步形成自己的体系。"
 TAI_v335_soe_dividend:0 "国企改制红利"
 TAI_v335_soe_dividend_desc:0 "快速改制后，原本臃肿的国企引入了民间资本与职业经理人，效率明显提升，裁员与重组带来的阵痛仍在持续。"
 TAI_v335_northeast_revival:0 "东北振兴"
 TAI_v335_northeast_revival_desc:0 "老工业基地的大规模技改让厂房与设备重新焕发生机，工人看见了希望，南下的人潮也开始趋缓。"
 TAI_v335_taishang_dividend:0 "台商回流"
 TAI_v335_taishang_dividend_desc:0 "回乡的台商带来了资金、技术与供应链，内地的电子与机械产业升级加快，本地业者则需要面对更激烈的竞争。"
 TAI_v335_veteran_integration:0 "旧部融合"
 TAI_v335_veteran_integration_desc:0 "旧军官兵被陆续纳入新军的体系，经验丰富的老兵成为新兵的教官，军队内部的隔阂开始消解。"
 TAI_v335_pipeline_dividend:0 "管线红利"
 TAI_v335_pipeline_dividend_desc:0 "稳定的天然气与航道合作降低了工业的能源成本，沿线的工厂与港口都因此受益，同时我们也更依赖这条供应线。"
 TAI_v335_labor_pact:0 "劳资新约"
 TAI_v335_labor_pact_desc:0 "全国统一的最低工资让劳工的生活更有保障，罢工减少，但企业的人事成本上升。"
 TAI_v335_coalition_honeymoon:0 "联合政府的蜜月"
 TAI_v335_coalition_honeymoon_desc:0 "三党联合内阁刚刚成立，各部会都愿意合作，政策推进格外顺利。但谁都清楚，这样的气氛不会维持太久。"
