 VPX_SYR_desc:0 "人民议会 250 席。按惯例，复兴党领导的全国进步阵线掌握三分之二左右的席位，其余留给独立人士；实权在总统与安全机构手中。政治开放后格局会随之改变。现任议会与决议面板里的人民议会是同一届：解散、任期届满或大选都在这张地图上开票；民调只反映支持率。"
