l_simp_chinese:
 HKG_roc_new_era: "民国特区新纪元"
 HKG_roc_new_era_desc: "米字旗降下二十年后，五星红旗也降下了。青天白日旗在添马舰升起，香港成为中华民国的特别行政区。自由港、普通法与资本主义生活方式维持不变。"
 HKG_roc_kmt_branch: "国民党香港总支部"
 HKG_roc_kmt_branch_desc: "调景岭的老兵与他们的子孙终于等到这一天。1997 年后被迫低调的国民党香港总支部重新挂牌，每年双十节在新界升起的青天白日旗，如今光明正大地飘扬在中环。它成为特区的执政党。"
 HKG_roc_basic_law_revision: "基本法修订"
 HKG_roc_basic_law_revision_desc: "以《中华民国宪法》取代旧的宪制依据，重新修订香港特区基本法。条文中的「中华人民共和国」被逐一替换，但普通法、独立司法与资本主义制度的章节原封不动：南京向香港保证，变的只是国号，不是生活方式。"
 HKG_roc_executive_led: "行政主导"
 HKG_roc_executive_led_desc: "特首由总统任命、对南京负责，行政机关主导施政，立法会只负责审议与监督。支持者说，这是港英时代总督制延续下来的高效传统；批评者说，换了一面旗，香港人仍然选不了自己的领导人。"
 HKG_roc_universal_suffrage: "双普选"
 HKG_roc_universal_suffrage_desc: "行政长官与立法会全部议席由香港市民普选产生——这是中华民国给香港的承诺。2014 年雨伞运动的街头，人们要的就是这一张选票；如今南京兑现了北京始终不肯兑现的诺言，泛民主派的支持度应声上涨。"
 HKG_roc_icac: "廉政公署新章"
 HKG_roc_icac_desc: "廉政公署扩大职权，清查前朝留下的利益输送：中资企业的特权合约、亲北京人士的土地批文、回归后的人事安插。四十多年前，廉署靠一句「香港不再容忍贪污」赢得市民信任，如今它要再一次证明自己。"
 HKG_roc_legco: "香港议会"
 HKG_roc_legco_desc: "改组后的立法会成为香港真正的议会，功能组别逐步取消，议员可以自由提出法案。它与南京的立法院建立对口联系，香港的议员第一次有机会到国会殿堂旁听，学习怎么监督一个政府。"
 HKG_roc_finance_hub: "国际金融中心"
 HKG_roc_finance_hub_desc: "中环依旧是亚洲的华尔街，如今更是整个中华民国的融资窗口。光复后的大陆百废待兴，国营企业改制、基础建设与重建公债都需要资金，而联交所是最好的募资平台。国际投行纷纷把亚洲总部留在香港。"
 HKG_roc_free_port: "自由港"
 HKG_roc_free_port_desc: "维持零关税的自由港地位，香港继续作为独立关税区参与世贸组织。资金、货物与资讯自由进出，是香港一百多年来立足的根本。南京明白，一个被关进国家关税墙里的香港，就不再是香港了。"
 HKG_roc_keep_peg: "港币联系汇率"
 HKG_roc_keep_peg_desc: "港币继续与美元挂钩，市场信心是香港的生命线。1983 年以来，联系汇率熬过了亚洲金融风暴与金融海啸，金管局的外汇储备足以应对任何狙击。政权更迭之际，不动汇率就是给市场最好的定心丸。"
 HKG_roc_ntd_peg: "与国币挂钩"
 HKG_roc_ntd_peg_desc: "港币改与中华民国国币挂钩，香港的资金将更紧密地服务于国家建设。这是一场冒险：国币的信用尚待建立，市场担心港币会被拖下水。但南京需要香港的储备与流动性来撑起大陆的重建，代价也许值得。"
 HKG_roc_greater_bay: "粤港经济圈"
 HKG_roc_greater_bay_desc: "打通深圳河两岸，香港的资本与广东的工厂重新连成一片。罗湖与落马洲的关口改为快速通关，跨境铁路加开班次，港商重新把订单下到东莞与深圳。曾经的「前店后厂」模式，在新的制度下重新焕发生机。"
 HKG_roc_tech_park: "科学园"
 HKG_roc_tech_park_desc: "在沙田与将军澳兴建科学园，吸引两岸三地的科技人才。港大、科大与中大的实验室提供研究，新竹与深圳的厂商提供制造，香港的资本提供资金。南京希望香港不只是金融中心，也能成为创新的源头。"
 HKG_roc_shipping: "国际航运中心"
 HKG_roc_shipping_desc: "葵涌货柜码头扩建，新的泊位与自动化吊机同时上马，香港力争重回世界第一大港。光复后的珠三角工厂重新开工，内地货物经香港转口的需求大增，维多利亚港再一次千帆并举。"
 HKG_roc_public_housing: "公屋计划"
 HKG_roc_public_housing_desc: "「居者有其屋」：大规模兴建公屋，缩短动辄五六年的轮候时间。劏房与笼屋是香港最难看的伤疤，也是社会怨气的来源。政府在新界拓展土地，以台湾国宅与新加坡组屋的经验，让年轻人重新看到置业的希望。"
 HKG_roc_healthcare: "医疗改革"
 HKG_roc_healthcare_desc: "公立医院扩编，急症室轮候时间大幅缩短，与南京的全民健保接轨。持香港身份证的居民在大陆与台湾就医也能获得保障，私家医院的专科医生则被鼓励到公立体系兼职。"
 HKG_roc_education: "教育与中华文化"
 HKG_roc_education_desc: "繁体字、中华文化与三民主义进入课堂，香港是中华文化的橱窗。新的公民课本讲孙中山在香港求学、辛亥革命在这里策划的历史，也讲普通法与言论自由。比起北京的「国民教育」，家长们对这一套接受得多。"
 HKG_roc_police: "治安与警队"
 HKG_roc_police_desc: "重整皇家警察留下的警队传统：专业、中立与依法执法，同时重建 2019 年后跌到谷底的警民关系。警队成立独立的投诉调查机制，反黑组则与台湾的刑事局合作，打击跨境的三合会与走私集团。"
 HKG_roc_garrison: "特区驻军"
 HKG_roc_garrison_desc: "国军香港驻军进驻石岗与昂船洲，接收解放军撤出后留下的营区。驻军人数不多，象征意义大于军事意义：它向香港市民与外国投资者表明，特区的安全由南京负责，而不是由街头的任何一方负责。"
 HKG_roc_talent_exchange: "两地人才交流"
 HKG_roc_talent_exchange_desc: "香港的律师、会计师与工程师北上，为大陆的法治与企业改制出力；大陆的学生南下求学，在港大与科大接受国际化的教育。专业资格互认的协议签署后，两地的人才第一次真正地自由流动起来。"
 HKG_roc_return_motherland: "回归祖国怀抱"
 HKG_roc_return_motherland_desc: "特区的历史使命已经完成。香港将撤销特区地位，正式并入中华民国本土（香港将不再作为独立的国家存在）。"
 HKG_roc_hk_people_rule: "港人治港"
 HKG_roc_hk_people_rule_desc: "香港由香港人治理，高度自治永久不变。北京在 1997 年作出的承诺，五十年未到就已名存实亡；南京把这句话写进宪法增修条文，不设期限。这不只是对香港的承诺，也是做给大陆各省看的样板。"
 HKG_roc_pearl: "东方之珠"
 HKG_roc_pearl_desc: "无论世界如何变化，香港永远是东方之珠。经过殖民、回归、动荡与光复，这座城市一次次证明了自己的韧性。维多利亚港的灯火重新亮起，太平山顶的游客又多了起来，香港人终于可以安心地说：这里是我们的家。"
 HKG_roc_kmt_branch_idea: "国民党香港总支部"
 HKG_roc_kmt_branch_idea_desc: "国民党在香港重新扎根。调景岭的老兵、新界的原居民与中环的商界，组成了国民党香港总支部的支持基础；党部协调特区政府与南京的关系，让香港的声音能直达中央。"
 HKG_roc_exec_led_idea: "行政主导"
 HKG_roc_exec_led_idea_desc: "特首对南京负责，施政效率高。行政主导的体制延续了港英时代的传统，政策可以迅速推行，不必在立法会里拖延；但批评者提醒，效率不能取代民主的问责。"
 HKG_roc_suffrage_idea: "双普选"
 HKG_roc_suffrage_idea_desc: "香港市民一人一票选出特首与议会。双普选落实后，香港的政治生态焕然一新，民意第一次能直接决定政府的组成；政府的施政必须向选民负责，决策的速度也因此放慢。"
 HKG_roc_icac_idea: "廉政公署"
 HKG_roc_icac_idea_desc: "香港依旧是亚洲最廉洁的城市之一。廉政公署独立于政府之外，有权调查任何官员与商人；一宗宗的贪污案被起诉，市民对政府的信任逐步恢复。"
 HKG_roc_finance_hub_idea: "国际金融中心"
 HKG_roc_finance_hub_idea_desc: "中环的资金流向整个中华民国。联交所为大陆的国企改制与基础建设募集了巨额资金，国际银行在香港设立亚洲总部；香港是连接中国与世界的金融桥梁。"
 HKG_roc_free_port_idea: "自由港"
 HKG_roc_free_port_idea_desc: "零关税的自由港。货物、资金与信息自由进出，香港以独立关税区的身份参与世贸组织；各国的商人选择香港作为进入中国市场的门户，贸易伙伴对香港的好感也随之上升。"
 HKG_roc_tech_idea: "科学园"
 HKG_roc_tech_idea_desc: "两岸三地的科技人才汇聚香港。沙田与将军澳的科学园里，港大与科大的研究团队与新竹、深圳的企业合作；香港不再只是金融中心，也成为了亚洲的创新与研发基地。"
 HKG_roc_housing_idea: "居者有其屋"
 HKG_roc_housing_idea_desc: "公屋轮候时间大幅缩短。新界的新市镇与大规模的公屋计划，让劏房与笼屋逐渐成为历史；年轻家庭终于有了安居的地方，生育率也开始回升。"
 HKG_roc_selfrule_idea: "港人治港"
 HKG_roc_selfrule_idea_desc: "高度自治，永久不变。宪法增修条文保障香港的普通法、独立司法与生活方式，没有五十年的期限；香港市民对未来重新充满信心，移民潮停止了，离开的人也开始回流。"
