l_simp_chinese:
 HKG_roc_new_era: "民国特区新纪元"
 HKG_roc_new_era_desc: "米字旗降下二十年后，五星红旗也降下了。青天白日旗在添马舰升起，香港成为中华民国的特别行政区。自由港、普通法与资本主义生活方式维持不变。"
 HKG_roc_kmt_branch: "国民党香港总支部"
 HKG_roc_kmt_branch_desc: "调景岭的老兵与他们的子孙终于等到这一天。国民党香港总支部成为特区的执政党。"
 HKG_roc_basic_law_revision: "基本法修订"
 HKG_roc_basic_law_revision_desc: "以《中华民国宪法》取代旧的宪制依据，重新修订香港特区基本法。"
 HKG_roc_executive_led: "行政主导"
 HKG_roc_executive_led_desc: "特首由总统任命、对南京负责，行政机关主导施政。"
 HKG_roc_universal_suffrage: "双普选"
 HKG_roc_universal_suffrage_desc: "行政长官与立法会全部议席由香港市民普选产生——这是中华民国给香港的承诺。"
 HKG_roc_icac: "廉政公署新章"
 HKG_roc_icac_desc: "廉政公署扩大职权，清查前朝留下的利益输送。"
 HKG_roc_legco: "香港议会"
 HKG_roc_legco_desc: "改组后的立法会成为香港的议会，与南京的立法院建立对口联系。"
 HKG_roc_finance_hub: "国际金融中心"
 HKG_roc_finance_hub_desc: "中环依旧是亚洲的华尔街，如今更是整个中华民国的融资窗口。"
 HKG_roc_free_port: "自由港"
 HKG_roc_free_port_desc: "维持零关税的自由港地位，香港继续作为独立关税区参与世贸组织。"
 HKG_roc_keep_peg: "港币联系汇率"
 HKG_roc_keep_peg_desc: "港币继续与美元挂钩，市场信心是香港的生命线。"
 HKG_roc_ntd_peg: "与国币挂钩"
 HKG_roc_ntd_peg_desc: "港币改与中华民国国币挂钩，香港的资金将更紧密地服务于国家建设。"
 HKG_roc_greater_bay: "粤港经济圈"
 HKG_roc_greater_bay_desc: "打通深圳河两岸，香港的资本与广东的工厂重新连成一片。"
 HKG_roc_tech_park: "科学园"
 HKG_roc_tech_park_desc: "在沙田与将军澳兴建科学园，吸引两岸三地的科技人才。"
 HKG_roc_shipping: "国际航运中心"
 HKG_roc_shipping_desc: "葵涌货柜码头扩建，香港重回世界第一大港。"
 HKG_roc_public_housing: "公屋计划"
 HKG_roc_public_housing_desc: "「居者有其屋」：大规模兴建公屋，缩短轮候时间。"
 HKG_roc_healthcare: "医疗改革"
 HKG_roc_healthcare_desc: "公立医院扩编，与南京的全民健保接轨。"
 HKG_roc_education: "教育与中华文化"
 HKG_roc_education_desc: "繁体字、中华文化与三民主义进入课堂，香港是中华文化的橱窗。"
 HKG_roc_police: "治安与警队"
 HKG_roc_police_desc: "重整皇家警察留下的警队传统，打击三合会。"
 HKG_roc_garrison: "特区驻军"
 HKG_roc_garrison_desc: "国军香港驻军进驻石岗与昂船洲。"
 HKG_roc_talent_exchange: "两地人才交流"
 HKG_roc_talent_exchange_desc: "香港的律师、会计师与工程师北上，大陆的学生南下求学。"
 HKG_roc_return_motherland: "回归祖国怀抱"
 HKG_roc_return_motherland_desc: "特区的历史使命已经完成。香港将撤销特区地位，正式并入中华民国本土（香港将不再作为独立的国家存在）。"
 HKG_roc_hk_people_rule: "港人治港"
 HKG_roc_hk_people_rule_desc: "香港由香港人治理，高度自治永久不变。"
 HKG_roc_pearl: "东方之珠"
 HKG_roc_pearl_desc: "无论世界如何变化，香港永远是东方之珠。"
 HKG_roc_kmt_branch_idea: "国民党香港总支部"
 HKG_roc_kmt_branch_idea_desc: "国民党在香港重新扎根。"
 HKG_roc_exec_led_idea: "行政主导"
 HKG_roc_exec_led_idea_desc: "特首对南京负责，施政效率高。"
 HKG_roc_suffrage_idea: "双普选"
 HKG_roc_suffrage_idea_desc: "香港市民一人一票选出特首与议会。"
 HKG_roc_icac_idea: "廉政公署"
 HKG_roc_icac_idea_desc: "香港依旧是亚洲最廉洁的城市之一。"
 HKG_roc_finance_hub_idea: "国际金融中心"
 HKG_roc_finance_hub_idea_desc: "中环的资金流向整个中华民国。"
 HKG_roc_free_port_idea: "自由港"
 HKG_roc_free_port_idea_desc: "零关税的自由港。"
 HKG_roc_tech_idea: "科学园"
 HKG_roc_tech_idea_desc: "两岸三地的科技人才汇聚香港。"
 HKG_roc_housing_idea: "居者有其屋"
 HKG_roc_housing_idea_desc: "公屋轮候时间大幅缩短。"
 HKG_roc_selfrule_idea: "港人治港"
 HKG_roc_selfrule_idea_desc: "高度自治，永久不变。"
