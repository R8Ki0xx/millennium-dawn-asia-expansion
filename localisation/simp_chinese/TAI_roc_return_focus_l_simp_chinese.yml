 TAI_civil_society_mainland: "民间社会复苏"
 TAI_civil_society_mainland_desc: "工会、商会、宗教团体与 NGO 重新出现在大陆。"
 TAI_cultural_renaissance: "中华文化复兴"
 TAI_cultural_renaissance_desc: "恢复被文革破坏的古迹、庙宇与传统节庆。"
 TAI_abolish_hukou: "废除户籍制度"
 TAI_abolish_hukou_desc: "城乡二元户籍制度是对农民的歧视，必须废除。"
