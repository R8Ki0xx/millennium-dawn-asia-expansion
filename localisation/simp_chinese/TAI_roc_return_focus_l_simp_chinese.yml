 TAI_sd_government_desc: "由改革派前中共党员、工会领袖与知识分子组成的中国社会民主党赢得了大选。"
 TAI_sd_free_unions: "独立工会"
 TAI_sd_free_unions_desc: "工人终于可以组织真正属于自己的工会。"
 TAI_sd_welfare_state: "福利国家"
