l_simp_chinese:
 TAI_silicon_island: "科技岛计划"
 TAI_silicon_island_desc: "新世纪的竞争是科技的竞争。以半导体、资讯与通讯产业为核心，把台湾打造为全球科技供应链中不可替代的一环。"
 TAI_hsinchu_expansion: "新竹科学园区扩建"
 TAI_hsinchu_expansion_desc: "竹科是台湾高科技产业的摇篮。扩建园区、增设南科与中科，吸引海内外人才回流。"
 TAI_ten_new_constructions: "新十大建设"
 TAI_ten_new_constructions_desc: "效法七十年代的十大建设，推动新一轮的公共工程：港口、捷运、污水处理与偏乡道路。"
 TAI_sacred_mountain: "护国神山"
 TAI_sacred_mountain_desc: "晶圆代工已经成为台湾最坚实的护盾。全力支持先进制程研发。"
 TAI_broadband_island: "e化台湾"
 TAI_broadband_island_desc: "建设全岛宽频网络，让台湾成为亚洲最“上网”的社会。"
 TAI_panel_industry: "面板双虎"
 TAI_panel_industry_desc: "友达与奇美让台湾成为全球液晶面板的重镇。"
 TAI_foundry_alliance: "晶圆双雄"
 TAI_foundry_alliance_desc: "台积电与联电两强并立，掌握全球过半的晶圆代工产能。"
 TAI_e_government: "电子化政府"
 TAI_e_government_desc: "户政、地政、税务全面上网，政府效能大幅提升。"
 TAI_pc_kingdom: "代工王国"
 TAI_pc_kingdom_desc: "鸿海、广达、仁宝……全世界的电脑与手机，有一半出自台商之手。"
 TAI_ic_design: "IC 设计产业"
 TAI_ic_design_desc: "联发科等 IC 设计公司崛起，台湾不只代工，也开始设计芯片。"
 TAI_mobile_taiwan: "行动台湾"
 TAI_mobile_taiwan_desc: "无线宽频与智慧型手机的时代来临，宏达电领先全球。"
 TAI_biotech: "生技起飞"
 TAI_biotech_desc: "以半导体的成功经验，扶植生物科技与医疗器材产业。"
 TAI_digital_content: "数位内容产业"
 TAI_digital_content_desc: "游戏、动画与数位娱乐，是年轻世代的新经济。"
 TAI_silicon_shield: "硅盾"
 TAI_silicon_shield_desc: "全世界都离不开台湾的芯片，这就是我们最好的国防。"
 TAI_high_speed_rail: "台湾高铁"
 TAI_high_speed_rail_desc: "台北到高雄九十分钟。高速铁路将重塑西部走廊。"
 TAI_fourth_nuclear_plant: "核四续建"
 TAI_fourth_nuclear_plant_desc: "能源自主关乎国家安全，我们决定完成龙门核电厂。"
 TAI_mrt_networks: "都会捷运"
 TAI_mrt_networks_desc: "台北、高雄、台中、桃园的捷运网络全面开工。"
 TAI_port_expansion: "高雄自由贸易港"
 TAI_port_expansion_desc: "设立自由贸易港区，让高雄港重返世界前列。"
 TAI_petrochemical: "六轻扩建"
 TAI_petrochemical_desc: "麦寮六轻是亚洲最大的石化工业区之一。"
 TAI_renewables: "再生能源发展"
 TAI_renewables_desc: "离岸风电与太阳能，为能源转型做准备。"
 TAI_second_financial_reform: "二次金改"
 TAI_second_financial_reform_desc: "整并过多过小的本土银行，培育具区域竞争力的金融控股集团。"
 TAI_tourism_doubling: "观光倍增计划"
 TAI_tourism_doubling_desc: "开放更多观光客，让夜市、温泉与玉山成为世界级的观光资源。"
 TAI_three_links: "两岸三通"
 TAI_three_links_desc: "通邮、通商、通航。以经济纽带牵动大陆的转变。"
 TAI_go_south_policy: "南向政策"
 TAI_go_south_policy_desc: "分散对大陆市场的依赖，把资本与产业引向东南亚。"
 TAI_quality_agriculture: "精致农业"
 TAI_quality_agriculture_desc: "高价值的水果、茶叶与兰花，让台湾农业走向世界。"
 TAI_cross_strait_ecfa: "两岸经济合作协议"
 TAI_cross_strait_ecfa_desc: "降低关税、开放服务业，让台湾抢占大陆市场先机。"
 TAI_asean_fta: "台星台纽经贸协定"
 TAI_asean_fta_desc: "与新加坡、纽西兰等国签署经济伙伴协定，突破区域整合的边缘化。"
 TAI_health_insurance_reform: "健保永续改革"
 TAI_health_insurance_reform_desc: "二代健保让全民健康保险制度可以永续经营。"
 TAI_asia_pacific_hub: "亚太营运中心"
 TAI_asia_pacific_hub_desc: "让台湾成为跨国企业在亚太地区的总部、金融与物流枢纽。"
 TAI_second_economic_miracle: "第二次经济奇迹"
 TAI_second_economic_miracle_desc: "从加工出口到科技岛，台湾再一次创造了经济奇迹。"
 TAI_new_millennium_roc: "千禧年的中华民国"
 TAI_new_millennium_roc_desc: "公元两千年，民国八十九年。半个世纪前，国民政府播迁来台；半个世纪后，台澎金马的两千两百万人站在新世纪的门槛上。中华民国往何处去？"
 TAI_cross_strait_crossroads: "两岸的十字路口"
 TAI_cross_strait_crossroads_desc: "“一个中国”的内涵、统一与独立、维持现状——每一位政治人物都必须回答这个问题。"
 TAI_judicial_reform: "司法改革"
 TAI_judicial_reform_desc: "推动司法独立与审判透明，重建人民对法院的信任。"
 TAI_constitutional_orthodoxy: "中华民国法统"
 TAI_constitutional_orthodoxy_desc: "中华民国宪法所规定的固有疆域从未改变。台湾是中华民国的复兴基地，而不是终点。泛蓝阵营整合，誓言恢复中华民国在全中国的法统。"
 TAI_taiwan_first: "台湾优先"
 TAI_taiwan_first_desc: "无论国号为何，这片土地上的人民才是主人。泛绿阵营主张以台湾为主体，维持现状、守护民主。"
 TAI_legislative_reform: "国会改革"
 TAI_legislative_reform_desc: "立法院效率低落、乱象丛生。推动国会改革已是朝野共识。"
 TAI_legislative_halving: "立委减半"
 TAI_legislative_halving_desc: "立法委员席次由 225 席减为 113 席，并改行单一选区两票制。"
 TAI_seventh_amendment: "第七次修宪"
 TAI_seventh_amendment_desc: "废除国民大会，确立公民复决修宪程序。"
 TAI_sunshine_laws: "阳光法案"
 TAI_sunshine_laws_desc: "公职人员财产申报、政治献金法与游说法，让政治在阳光下运作。"
 TAI_mature_democracy: "民主深化"
 TAI_mature_democracy_desc: "政党轮替成为常态，民主制度在台湾深深扎根。"
 TAI_three_principles_revival: "三民主义复兴"
 TAI_three_principles_revival_desc: "民族、民权、民生。国父的遗教是我们向大陆同胞展示另一条道路的旗帜。"
 TAI_lien_soong_alliance: "连宋合作"
 TAI_lien_soong_alliance_desc: "国民党与亲民党捐弃前嫌，泛蓝整合为一。"
 TAI_purge_black_gold: "肃清黑金政治"
 TAI_purge_black_gold_desc: "地方派系与黑道势力盘根错节。不刮骨疗毒，就不配谈复兴。"
 TAI_kmt_party_reform: "国民党党务改造"
 TAI_kmt_party_reform_desc: "年轻化、本土化与现代化——国民党必须再造。"
 TAI_strengthen_unification_council: "强化国家统一委员会"
 TAI_strengthen_unification_council_desc: "让冷冻多年的国统会重新运转，统合对大陆的政策研究与心战工作。"
 TAI_five_yuan_reform: "五院体制强化"
 TAI_five_yuan_reform_desc: "恢复五权宪法的制衡精神，提升政府效能。"
 TAI_party_assets_trust: "党产信托"
 TAI_party_assets_trust_desc: "将国民党党产交付信托，化解“世界最富有政党”的污名。"
 TAI_chinese_culture_renaissance: "中华文化复兴运动"
 TAI_chinese_culture_renaissance_desc: "台湾保存了正体字与传统文化，是中华文化真正的守护者。"
 TAI_national_security_law: "国家安全法制"
 TAI_national_security_law_desc: "修订国安法与反渗透法，严防中共统战渗透。"
 TAI_guidelines_for_unification: "国家统一纲领"
 TAI_guidelines_for_unification_desc: "以民主、自由、均富的中国为目标，分阶段完成统一。若对岸拒绝，中华民国保留一切手段。"
 TAI_status_quo: "维持现状"
 TAI_status_quo_desc: "不统、不独、不武。在两强之间走钢索，是这座岛屿最务实的生存之道。"
 TAI_transitional_justice: "转型正义"
 TAI_transitional_justice_desc: "直面白色恐怖与二二八的历史伤痕，开放档案、平反冤案。"
 TAI_referendum_act: "公民投票法"
 TAI_referendum_act_desc: "让人民直接决定重大公共议题。"
 TAI_porcupine_strategy: "豪猪战略"
 TAI_porcupine_strategy_desc: "我们不求打赢一场入侵战争，只求让入侵者付出无法承受的代价。"
 TAI_values_diplomacy: "价值外交"
 TAI_values_diplomacy_desc: "以民主、人权与自由市场的共同价值，与理念相近的国家深化关系。"
 TAI_civil_society: "公民社会"
 TAI_civil_society_desc: "社运、NGO 与独立媒体，是台湾民主最坚实的基础。"
 TAI_whole_society_defense: "全社会防卫韧性"
 TAI_whole_society_defense_desc: "民防、医疗、通讯与能源，平时就要为战时做准备。"
 TAI_indigenous_rights: "原住民族自治"
 TAI_indigenous_rights_desc: "以《原住民族基本法》保障原住民族的土地与文化权利。"
 TAI_formosa_resilience: "韧性台湾"
 TAI_formosa_resilience_desc: "让台湾在任何风暴中屹立不倒。"
 TAI_national_glory_plan: "国光计划复启"
 TAI_national_glory_plan_desc: "1961 年，蒋中正秘密成立“国光作业室”，筹划反攻大陆。四十年后，这份尘封的计划被重新摊开在总统府的桌上。"
 TAI_mainland_work_conference: "大陆工作会议"
 TAI_mainland_work_conference_desc: "统合国安局、陆委会、国防部与国民党大陆工作会的力量，对大陆展开政治、心理与情报工作。"
 TAI_intelligence_war: "情报战"
 TAI_intelligence_war_desc: "军情局与国安局在大陆重建情报网，掌握对岸的军政动态。"
 TAI_amphibious_corps: "两栖登陆兵团"
 TAI_amphibious_corps_desc: "要跨越台湾海峡，就必须有一支能在敌前登陆的兵团。"
 TAI_secure_us_acquiescence: "争取美方默许"
 TAI_secure_us_acquiescence_desc: "没有华盛顿的点头，反攻大陆只能是空谈。派遣密使赴美，试探美方的底线。"
 TAI_war_economy: "战时经济体制"
 TAI_war_economy_desc: "国防预算倍增，民间工厂转产军需。"
 TAI_mainland_democracy_support: "支援大陆民主运动"
 TAI_mainland_democracy_support_desc: "八九年的血没有白流。资助流亡海外的民运人士，把自由的种子撒回大陆。"
 TAI_overseas_mobilization: "号召海外华人"
 TAI_overseas_mobilization_desc: "从旧金山到吉隆坡，号召海外侨胞出钱出力，支持中华民国的复兴大业。"
 TAI_special_forces_raids: "敌后特种作战"
 TAI_special_forces_raids_desc: "海龙蛙兵与特战部队将渗透大陆沿海，破坏交通与指挥中枢。"
 TAI_kinmen_matsu_bastion: "金马前进基地"
 TAI_kinmen_matsu_bastion_desc: "金门与马祖距大陆不过数公里，是反攻的跳板。整建港口、机场与坑道。"
 TAI_air_sea_superiority: "制空制海"
 TAI_air_sea_superiority_desc: "登陆作战的前提是夺取海峡的制空权与制海权。"
 TAI_strategic_stockpile: "战略物资储备"
 TAI_strategic_stockpile_desc: "储备足以支撑半年作战的油料、弹药与粮食。"
 TAI_peaceful_unification_talks: "两岸和平统一谈判"
 TAI_peaceful_unification_talks_desc: "若对岸已走上民主之路，或是政权摇摇欲坠，那么统一未必需要流血。向北京提出在中华民国宪法架构下和平统一的方案。"
 TAI_ignite_mainland_uprising: "点燃大陆起义"
 TAI_ignite_mainland_uprising_desc: "当人民的忍耐到了极限，只需要一颗火星。策动东南各省的军民起义，建立“中华民国大陆临时政府”；国军先以志愿军的名义接应，待局势明朗再整编出兵。"
 TAI_return_to_mainland: "反攻大陆"
 TAI_return_to_mainland_desc: "“光复大陆国土，解救大陆同胞。”半个多世纪的誓言，今天要兑现了。"
 TAI_strait_blockade: "封锁海峡"
 TAI_strait_blockade_desc: "以潜舰与水雷封锁对岸的东南沿海港口。"
 TAI_general_mobilization: "全面动员"
 TAI_general_mobilization_desc: "颁布动员令，后备军人全面归建。"
 TAI_psychological_offensive: "心理攻势"
 TAI_psychological_offensive_desc: "空飘传单、广播喊话与网络心战，瓦解对岸军民的斗志。"
 TAI_southeast_landings: "登陆东南沿海"
 TAI_southeast_landings_desc: "闽浙粤沿海是国军最熟悉的战场。三军协同，建立滩头阵地。"
 TAI_pla_uprising: "阵前起义"
 TAI_pla_uprising_desc: "许多解放军官兵的祖辈曾是国军。向他们喊话：“国军弟兄们，回家吧！”"
 TAI_airborne_assault: "空降突击"
 TAI_airborne_assault_desc: "空降特战部队夺取敌后机场与交通要冲。"
 TAI_liberate_fujian: "光复福建"
 TAI_liberate_fujian_desc: "国军在闽江口登陆，福州城头升起青天白日满地红旗。"
 TAI_liberate_shanghai: "光复上海"
 TAI_liberate_shanghai_desc: "远东第一大都会回到了中华民国的怀抱。"
 TAI_liberate_guangdong: "光复广东"
 TAI_liberate_guangdong_desc: "广州——国民革命的策源地，再度光复。"
 TAI_retake_nanjing: "光复南京"
 TAI_retake_nanjing_desc: "中山陵前，青天白日满地红旗再度飘扬。首都光复了！"
 TAI_liberate_wuhan: "光复武汉"
 TAI_liberate_wuhan_desc: "九省通衢的武汉落入国军之手，长江航道全线贯通。"
 TAI_northern_expedition: "北伐"
 TAI_northern_expedition_desc: "继承先总统蒋公遗志，国军再度挥师北伐！"
 TAI_liberate_southwest: "光复西南"
 TAI_liberate_southwest_desc: "四川、重庆与云贵高原相继光复，抗战时期的陪都重回国民政府。"
 TAI_liberate_beiping: "光复北平"
 TAI_liberate_beiping_desc: "国军开进北平城，故宫与天安门重新悬挂中华民国国旗。"
 TAI_mainland_restored: "光复神州"
 TAI_mainland_restored_desc: "从金陵到燕京，中华民国的法统终于回到了它诞生的土地。可是，十三亿同胞、半个世纪的隔阂与一个完全不同的社会，正等待着新政府去面对。\n\n§Y完成后将切换为光复后的全新国策树。§!"
 TAI_armed_forces_modernization: "国军现代化"
 TAI_armed_forces_modernization_desc: "精实案之后，国军需要的不只是裁员，而是一支能打赢现代战争的部队。"
 TAI_army_reform: "陆军精实"
 TAI_army_reform_desc: "裁减冗员、精简层级，把资源集中到战斗部队。"
 TAI_navy_modernization: "海军现代化"
 TAI_navy_modernization_desc: "老旧的阳字号驱逐舰必须退役，海军需要新一代的主力舰艇。"
 TAI_air_force_modernization: "空军现代化"
 TAI_air_force_modernization_desc: "幻象、F-16 与经国号——三代机的整合运用。"
 TAI_han_kuang_exercise: "汉光演习"
 TAI_han_kuang_exercise_desc: "实兵、实弹、不预设剧本，检验三军真实战力。"
 TAI_conscription_reform: "兵役制度改革"
 TAI_conscription_reform_desc: "缩短役期、强化训练、扩大后备动员体系。"
 TAI_marine_corps_expansion: "扩编海军陆战队"
 TAI_marine_corps_expansion_desc: "陆战队是国军唯一具备两栖突击能力的部队。扩编它，既为守土，也为将来。"
 TAI_armor_modernization: "装甲换装"
 TAI_armor_modernization_desc: "以 M1A2 与云豹八轮甲车取代老旧的 M48 与 M113。"
 TAI_army_aviation: "陆航旅"
 TAI_army_aviation_desc: "阿帕契与黑鹰直升机，让陆军拥有立体机动能力。"
 TAI_whampoa_spirit: "黄埔精神"
 TAI_whampoa_spirit_desc: "亲爱精诚。陆军军官学校的校训，是国军百年不变的魂。"
 TAI_special_forces: "特战部队"
 TAI_special_forces_desc: "空降特战、海龙蛙兵与宪兵夜鹰，国军最锋利的刀刃。"
 TAI_mobile_defense_doctrine: "机动防卫准则"
 TAI_mobile_defense_doctrine_desc: "滩岸决胜、纵深防御，以机动打击歼敌于水际。"
 TAI_hsiung_feng_missiles: "雄风飞弹"
 TAI_hsiung_feng_missiles_desc: "雄风系列反舰与对地巡航飞弹，是遏阻敌军渡海的利剑。"
 TAI_kidd_destroyers: "纪德舰"
 TAI_kidd_destroyers_desc: "从美国购入四艘纪德级驱逐舰，大幅提升防空能力。"
 TAI_indigenous_submarine: "潜舰国造"
 TAI_indigenous_submarine_desc: "外购无门，那就自己造。海鲲号的龙骨将在高雄铺下。"
 TAI_stealth_corvettes: "沱江级巡逻舰"
 TAI_stealth_corvettes_desc: "高速、匿踪、重火力的“航母杀手”。"
 TAI_coast_guard_administration: "海岸巡防署"
 TAI_coast_guard_administration_desc: "统合海巡力量，守护台海与南海的海疆。"
