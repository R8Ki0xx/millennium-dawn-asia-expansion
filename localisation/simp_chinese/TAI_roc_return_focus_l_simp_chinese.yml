 TAI_joint_operations: "三军联合作战"
 TAI_joint_operations_desc: "打破军种本位，建立联合作战指挥机制。"
 TAI_iron_bastion: "固若金汤"
 TAI_iron_bastion_desc: "从金门、马祖到台澎本岛，层层设防。"
