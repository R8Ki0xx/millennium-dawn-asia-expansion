l_simp_chinese:
 TAI_silicon_island: "科技岛计划"
 TAI_silicon_island_desc: "新世纪的竞争是科技的竞争。以半导体、资讯与通讯产业为核心，把台湾打造为全球科技供应链中不可替代的一环。"
 TAI_hsinchu_expansion: "新竹科学园区扩建"
 TAI_hsinchu_expansion_desc: "竹科是台湾高科技产业的摇篮。1980 年由李国鼎与徐贤修推动成立，如今园区内聚集了台积电、联发科等数百家企业；扩建园区、增设南科与中科，并以优惠条件吸引海外的工程师与博士回流。"
 TAI_ten_new_constructions: "新十大建设"
 TAI_ten_new_constructions_desc: "效法七十年代的十大建设，推动新一轮的公共工程：港口、捷运、污水处理与偏乡道路。当年蒋经国说「今天不做，明天就会后悔」；如今台湾的基础建设老化，新的投资将为下一阶段的发展打下基础。"
 TAI_sacred_mountain: "护国神山"
 TAI_sacred_mountain_desc: "晶圆代工已经成为台湾最坚实的护盾。台积电生产全世界九成以上的先进芯片，被称为「护国神山」：任何对台湾的军事行动，都会让全球经济陷入停摆。政府全力支持先进制程的研发，让这座山永远比别人高。"
 TAI_broadband_island: "e化台湾"
 TAI_broadband_island_desc: "建设全岛宽频网络，让台湾成为亚洲最「上网」的社会。「e 化台湾」计划把光纤铺到每一个乡镇，公共场所提供免费无线网络；台湾的网络普及率与网络速度跃居世界前列，电子商务与数位服务蓬勃发展。"
 TAI_panel_industry: "面板双虎"
 TAI_panel_industry_desc: "友达与奇美让台湾成为全球液晶面板的重镇，「两兆双星」计划把面板与半导体并列为国家的明星产业。台南与台中的面板厂日夜运转，台湾的显示器占据了全球市场的四成，但韩国与大陆的竞争正在逼近。"
 TAI_foundry_alliance: "晶圆双雄"
 TAI_foundry_alliance_desc: "台积电与联电两强并立，掌握全球过半的晶圆代工产能。张忠谋创立台积电时开创了「纯代工」的商业模式，曹兴诚的联电紧随其后；两家公司在竞争中共同成长，让台湾成为全世界芯片设计公司最依赖的制造基地。"
 TAI_e_government: "电子化政府"
 TAI_e_government_desc: "户政、地政、税务全面上网，政府效能大幅提升。民众在家就能申请户籍誊本、缴纳税款与查询土地登记，报税时间从几个小时缩短为几分钟；台湾的电子化政府在国际评比中名列前茅。"
 TAI_pc_kingdom: "代工王国"
 TAI_pc_kingdom_desc: "鸿海、广达、仁宝……全世界的电脑与手机，有一半出自台商之手。笔记本电脑的代工占全球九成以上，苹果的手机由鸿海在郑州与深圳组装；台湾以「代工王国」的身份，成为全球电子产业链中不可或缺的一环。"
 TAI_ic_design: "IC 设计产业"
 TAI_ic_design_desc: "联发科等 IC 设计公司崛起，台湾不只代工，也开始设计芯片。联发科的手机芯片让中低价智慧型手机普及全球，瑞昱、联咏与群联各擅胜场；台湾的 IC 设计产业规模仅次于美国，位居世界第二。"
 TAI_mobile_taiwan: "行动台湾"
 TAI_mobile_taiwan_desc: "无线宽频与智慧型手机的时代来临，宏达电领先全球。2008 年，宏达电推出世界上第一支安卓手机，一度是全球市值最高的手机品牌之一；「行动台湾」计划让 WiMAX 与 4G 网络覆盖全岛。"
 TAI_biotech: "生技起飞"
 TAI_biotech_desc: "以半导体的成功经验，扶植生物科技与医疗器材产业。南港生技园区与竹北生医园区相继成立，台湾的医疗器材出口与新药研发逐渐有了国际竞争力；政府希望生技成为继半导体之后的下一座「护国神山」。"
 TAI_digital_content: "数位内容产业"
 TAI_digital_content_desc: "游戏、动画与数位娱乐，是年轻世代的新经济。台湾的游戏公司开发了《仙剑奇侠传》与《轩辕剑》等经典作品，并在线上游戏的营运上领先亚洲；政府设立数位内容产业园区，培养下一代的创作者。"
 TAI_silicon_shield: "硅盾"
 TAI_silicon_shield_desc: "全世界都离不开台湾的芯片，这就是我们最好的国防。从苹果、英伟达到美国的军工企业，都依赖台积电的先进制程；任何对台湾的封锁或攻击，都会让全球经济陷入瘫痪。这面「硅盾」，比任何飞弹都更能保护台湾。"
 TAI_high_speed_rail: "台湾高铁"
 TAI_high_speed_rail_desc: "台北到高雄九十分钟。台湾高铁以 BOT 方式兴建，采用日本新干线的技术，2007 年正式通车；它把西部走廊的城市连成一日生活圈，台南、嘉义与台中都成了台北的通勤城市。"
 TAI_fourth_nuclear_plant: "核四续建"
 TAI_fourth_nuclear_plant_desc: "能源自主关乎国家安全，我们决定完成龙门核电厂。核四在 2000 年曾被陈水扁政府宣布停建，引发政治风暴；台湾九成以上的能源依赖进口，一旦被封锁，存煤与天然气撑不过几周。反核团体走上街头，但政府决心续建。"
 TAI_mrt_networks: "都会捷运"
 TAI_mrt_networks_desc: "台北、高雄、台中、桃园的捷运网络全面开工。台北捷运自 1996 年通车以来已成为城市的骨干，高雄捷运在 2008 年开通；桃园机场捷运与台中捷运相继兴建，台湾的主要都会区都有了自己的轨道交通。"
 TAI_port_expansion: "高雄自由贸易港"
 TAI_port_expansion_desc: "设立自由贸易港区，让高雄港重返世界前列。高雄港曾是世界第三大货柜港，后来被上海、深圳与釜山超越；自由贸易港区让货物在港内加工、转运而免征关税，洲际货柜中心的扩建也让超大型货柜船得以靠泊。"
 TAI_petrochemical: "六轻扩建"
 TAI_petrochemical_desc: "麦寮六轻是亚洲最大的石化工业区之一，由王永庆的台塑集团兴建。扩建后的六轻提供台湾大部分的乙烯与石化原料，支撑起下游的塑胶与纺织产业；但空气污染与渔民的抗议，始终伴随着它的每一次扩建。"
 TAI_renewables: "再生能源发展"
 TAI_renewables_desc: "离岸风电与太阳能，为能源转型做准备。台湾海峡是世界上风况最好的海域之一，彰化外海的风场吸引了丹麦沃旭等国际大厂；屋顶太阳能与渔电共生计划在南部迅速推广，台湾开始走向能源多元化。"
 TAI_second_financial_reform: "二次金改"
 TAI_second_financial_reform_desc: "整并过多过小的本土银行，培育具区域竞争力的金融控股集团。台湾有近五十家本土银行，「银行过多」导致恶性竞争与呆账堆积；二次金改以减半为目标推动合并，但其间的利益输送疑云也让舆论哗然。"
 TAI_tourism_doubling: "观光倍增计划"
 TAI_tourism_doubling_desc: "开放更多观光客，让夜市、温泉与玉山成为世界级的观光资源。观光客倍增计划的目标是五年内来台旅客翻倍：士林夜市、北投温泉、太鲁阁峡谷与阿里山的日出，吸引着日本、韩国与东南亚的游客。"
 TAI_three_links: "两岸三通"
 TAI_three_links_desc: "通邮、通商、通航。1949 年以来，两岸之间的人员与货物都要绕道香港或第三地，台商往返一趟要耗费一整天；三通实现后，两岸直航只需一个多小时。台北希望以经济纽带牵动大陆的转变，让自由的种子在对岸生根。"
 TAI_go_south_policy: "南向政策"
 TAI_go_south_policy_desc: "分散对大陆市场的依赖，把资本与产业引向东南亚。李登辉在 1990 年代提出「南向政策」，「戒急用忍」限制对大陆的投资；台商在越南、泰国与印尼设厂，台湾的经济不必把所有鸡蛋放在同一个篮子里。"
 TAI_quality_agriculture: "精致农业"
 TAI_quality_agriculture_desc: "高价值的水果、茶叶与兰花，让台湾农业走向世界。阿里山的高山茶、屏东的莲雾与台南的蝴蝶兰都是国际市场上的抢手货；精致农业让台湾的小农在加入世贸组织之后，不必与进口的大宗农产品硬碰硬。"
 TAI_cross_strait_ecfa: "两岸经济合作协议"
 TAI_cross_strait_ecfa_desc: "两岸经济合作架构协议降低关税、开放服务业，让台湾抢占大陆市场先机。2010 年签署的 ECFA 早收清单让石化、机械与农产品享受零关税；支持者说这是台湾经济的生命线，反对者担心台湾会被大陆「以经促统」。"
 TAI_asean_fta: "台星台纽经贸协定"
 TAI_asean_fta_desc: "与新加坡、纽西兰等国签署经济伙伴协定，突破区域整合的边缘化。在北京的压力下，台湾长期被排除在东亚的自贸网络之外；2013 年与纽西兰、新加坡相继签署协定，是台湾突破经贸孤立的重要一步。"
 TAI_health_insurance_reform: "健保永续改革"
 TAI_health_insurance_reform_desc: "二代健保让全民健康保险制度可以永续经营。健保开办以来深受民众喜爱，但财务连年亏损；二代健保把股利、利息与租金收入纳入补充保费的计算，让高收入者多负担一点，保住这个台湾人最骄傲的制度。"
 TAI_asia_pacific_hub: "亚太营运中心"
 TAI_asia_pacific_hub_desc: "让台湾成为跨国企业在亚太地区的总部、金融与物流枢纽。1990 年代的亚太营运中心计划因两岸关系而受挫；如今台湾以完善的法治、优秀的人才与地理位置，吸引跨国企业在台北设立区域总部。"
 TAI_second_economic_miracle: "第二次经济奇迹"
 TAI_second_economic_miracle_desc: "从加工出口到科技岛，台湾再一次创造了经济奇迹。1960 年代的「台湾钱淹脚目」靠的是纺织与加工出口，如今靠的是芯片、电子与创新；人均 GDP 超越日本与韩国，台湾成为亚洲最富裕的社会之一。"
 TAI_new_millennium_roc: "千禧年的中华民国"
 TAI_new_millennium_roc_desc: "公元两千年，民国八十九年。半个世纪前，国民政府播迁来台；半个世纪后，台澎金马的两千两百万人站在新世纪的门槛上。中华民国往何处去？"
 TAI_cross_strait_crossroads: "两岸的十字路口"
 TAI_cross_strait_crossroads_desc: "「一个中国」的内涵、统一与独立、维持现状——每一位政治人物都必须回答这个问题。2000 年的政党轮替让台湾的国家认同问题浮上台面，蓝绿两大阵营对两岸关系有着截然不同的答案。台湾站在了历史的十字路口。"
 TAI_judicial_reform: "司法改革"
 TAI_judicial_reform_desc: "推动司法独立与审判透明，重建人民对法院的信任。「恐龙法官」与「司法黄牛」让法院的公信力跌到谷底；司法改革推动法官评鉴、审判公开与国民参与审判，并严办与黑道勾结的司法人员。"
 TAI_constitutional_orthodoxy: "中华民国法统"
 TAI_constitutional_orthodoxy_desc: "中华民国宪法所规定的固有疆域从未改变。台湾是中华民国的复兴基地，而不是终点。泛蓝阵营整合，誓言恢复中华民国在全中国的法统。"
 TAI_taiwan_first: "台湾优先"
 TAI_taiwan_first_desc: "无论国号为何，这片土地上的人民才是主人。泛绿阵营主张以台湾为主体，维持现状、守护民主：台湾的前途应由两千三百万台湾人民共同决定。这条路线在年轻世代中获得了越来越多的支持。"
 TAI_legislative_reform: "国会改革"
 TAI_legislative_reform_desc: "立法院效率低落、乱象丛生：委员在议场上大打出手、法案在委员会里一拖数年。推动国会改革已是朝野共识，林义雄发起的「国会减半」运动获得了大批民众的连署支持。"
 TAI_legislative_halving: "立委减半"
 TAI_legislative_halving_desc: "立法委员席次由 225 席减为 113 席，并改行单一选区两票制。席次减半让每位立委的代表性与责任更加明确，单一选区则让小党难以生存，台湾的政党体系逐渐走向两党制。"
 TAI_seventh_amendment: "第七次修宪"
 TAI_seventh_amendment_desc: "2005 年的第七次修宪废除国民大会，确立公民复决修宪程序：此后的任何修宪案，都必须经过全体选民过半数的同意。国民大会从此走入历史，但在中华民国的法统里，它的地位仍是争议的焦点。"
 TAI_sunshine_laws: "阳光法案"
 TAI_sunshine_laws_desc: "公职人员财产申报、政治献金法与游说法，让政治在阳光下运作。过去的金权政治与黑金挂勾让选举成为金钱的游戏；新的法律要求每一笔政治献金都要公开，游说者必须登记，违者将面临刑事处罚。"
 TAI_mature_democracy: "民主深化"
 TAI_mature_democracy_desc: "政党轮替成为常态，民主制度在台湾深深扎根。从 1996 年第一次总统直选、2000 年第一次政党轮替到 2008 年第二次政党轮替，台湾证明了华人社会同样可以实行民主；这是亚洲民主化最成功的故事之一。"
 TAI_three_principles_revival: "三民主义复兴"
 TAI_three_principles_revival_desc: "民族、民权、民生。国父的遗教是我们向大陆同胞展示另一条道路的旗帜：在台湾，三民主义以民主选举、土地改革与经济奇迹的方式实现了；对岸的同胞应该知道，中国人可以有不同的选择。"
 TAI_lien_soong_alliance: "连宋合作"
 TAI_lien_soong_alliance_desc: "国民党与亲民党捐弃前嫌，泛蓝整合为一。2000 年的总统大选中，连战与宋楚瑜分裂参选，让陈水扁以不到四成的得票率当选；四年后，两人联手搭档竞选，泛蓝阵营终于重新团结在一起。"
 TAI_purge_black_gold: "肃清黑金政治"
 TAI_purge_black_gold_desc: "地方派系与黑道势力盘根错节：黑道背景的议员占据地方议会，工程围标与绑桩买票屡见不鲜。不刮骨疗毒，就不配谈复兴；「扫黑」行动把一批黑道议员送进监狱，国民党也必须切割与地方派系的利益关系。"
 TAI_kmt_party_reform: "国民党党务改造"
 TAI_kmt_party_reform_desc: "年轻化、本土化与现代化——国民党必须再造。2000 年败选之后，国民党痛定思痛：党主席改由党员直选，中常委的平均年龄大幅下降，本省籍的年轻党员走上领导岗位；百年老店要学会在民主政治中竞争。"
 TAI_strengthen_unification_council: "强化国家统一委员会"
 TAI_strengthen_unification_council_desc: "让冷冻多年的国统会重新运转，统合对大陆的政策研究与心战工作。国家统一委员会成立于 1990 年，2006 年被陈水扁政府「终止运作」；重新启动的国统会不只研究统一的条件，也负责对大陆的广播、网络宣传与人员交流。"
 TAI_five_yuan_reform: "五院体制强化"
 TAI_five_yuan_reform_desc: "恢复五权宪法的制衡精神，提升政府效能。考试院与监察院长年被批评为「冗官」，立法院与行政院的对立让政府空转；改革后的五院各司其职，监察院恢复对贪腐官员的弹劾，考试院确保公务员的专业与中立。"
 TAI_party_assets_trust: "党产信托"
 TAI_party_assets_trust_desc: "将国民党党产交付信托，化解「世界最富有政党」的污名。国民党在威权时期累积了数百亿元的党产，包括电视台、报社与大批不动产；交付信托之后，党产的收益不再用于选举，国民党终于可以与其他政党在公平的基础上竞争。"
 TAI_chinese_culture_renaissance: "中华文化复兴运动"
 TAI_chinese_culture_renaissance_desc: "台湾保存了正体字与传统文化，是中华文化真正的守护者。1966 年，当大陆陷入文化大革命的浩劫时，台湾发起中华文化复兴运动；今天，故宫的国宝、正体字与传统节庆，都是台湾向世界展示中华文化的名片。"
 TAI_national_security_law: "国家安全法制"
 TAI_national_security_law_desc: "修订国安法与反渗透法，严防中共统战渗透。中共透过宫庙、村里长、退役将领与网红对台湾进行统战渗透，假讯息在社群媒体上大量流传；新的法律禁止接受境外敌对势力的指示与资助从事政治活动。"
 TAI_guidelines_for_unification: "国家统一纲领"
 TAI_guidelines_for_unification_desc: "以民主、自由、均富的中国为目标，分阶段完成统一。1991 年的《国家统一纲领》设定了近程、中程与远程三个阶段；如今国民党政府重申这份纲领，并加上一句：若对岸拒绝民主化，中华民国保留一切手段。"
 TAI_status_quo: "维持现状"
 TAI_status_quo_desc: "不统、不独、不武。在两强之间走钢索，是这座岛屿最务实的生存之道。民调显示，大多数台湾人既不想被统一，也不想冒战争的风险宣布独立；维持现状不是没有立场，而是最符合民意的立场。"
 TAI_transitional_justice: "转型正义"
 TAI_transitional_justice_desc: "直面白色恐怖与二二八的历史伤痕，开放档案、平反冤案。1947 年的二二八事件与随后近四十年的戒严，造成数以万计的人被杀害、被监禁；促进转型正义委员会开放政治档案，撤销冤案的有罪判决，让受难者的家属终于得到一个交代。"
 TAI_referendum_act: "公民投票法"
 TAI_referendum_act_desc: "让人民直接决定重大公共议题。2003 年《公民投票法》通过，台湾人第一次可以就核能、同婚与两岸协议等议题直接表达意见；北京警告这是「以公投搞台独」，华盛顿也表示关切。"
 TAI_porcupine_strategy: "豪猪战略"
 TAI_porcupine_strategy_desc: "我们不求打赢一场入侵战争，只求让入侵者付出无法承受的代价。国防部转向不对称作战：机动的反舰飞弹、大量的无人机与便携式防空飞弹，取代昂贵却容易被摧毁的大型舰艇；台湾要像豪猪一样，让任何想吞下它的掠食者难以下口。"
 TAI_values_diplomacy: "价值外交"
 TAI_values_diplomacy_desc: "以民主、人权与自由市场的共同价值，与理念相近的国家深化关系。在邦交国日渐减少的情况下，台湾转而深耕与美国、日本与欧洲的实质关系；欧洲议会的议员团、美国的国会议员与日本的政治人物纷纷访台。"
 TAI_civil_society: "公民社会"
 TAI_civil_society_desc: "社运、NGO 与独立媒体，是台湾民主最坚实的基础。从野百合学运、太阳花运动到环保与劳工运动，台湾的公民社会一再证明自己的活力；慈济、红十字会与无数的志工团体，在每一次灾难中都比政府更早抵达现场。"
 TAI_whole_society_defense: "全社会防卫韧性"
 TAI_whole_society_defense_desc: "民防、医疗、通讯与能源，平时就要为战时做准备。乌克兰的战争让台湾人意识到，全民的韧性与军队同样重要：民间的防卫训练、医院的战时动员计划、卫星通讯与储备能源，都被纳入全社会防卫韧性的体系。"
 TAI_indigenous_rights: "原住民族自治"
 TAI_indigenous_rights_desc: "以《原住民族基本法》保障原住民族的土地与文化权利。台湾有十六个官方认定的原住民族，他们是这座岛屿最早的主人；政府承认传统领域、推动族语教育，总统也代表政府向原住民族正式道歉。"
 TAI_formosa_resilience: "韧性台湾"
 TAI_formosa_resilience_desc: "让台湾在任何风暴中屹立不倒。地震、台风、疫情与战争的威胁，让这座岛屿学会了在危机中生存：九二一大地震后的重建、SARS 与新冠疫情的防疫，都证明了台湾社会的韧性。福尔摩沙，美丽而坚强。"
 TAI_national_glory_plan: "国光计划复启"
 TAI_national_glory_plan_desc: "1961 年，蒋中正秘密成立“国光作业室”，筹划反攻大陆。四十年后，这份尘封的计划被重新摊开在总统府的桌上。"
 TAI_mainland_work_conference: "大陆工作会议"
 TAI_mainland_work_conference_desc: "统合国安局、陆委会、国防部与国民党大陆工作会的力量，对大陆展开政治、心理与情报工作。过去各部门各行其是，互不通气；大陆工作会议由总统亲自主持，每月检讨对岸的局势，并协调对大陆的各项秘密行动。"
 TAI_intelligence_war: "情报战"
 TAI_intelligence_war_desc: "军情局与国安局在大陆重建情报网，掌握对岸的军政动态。1950 年代以后，国军在大陆的情报网多次遭到破获，许多情报员牺牲或被捕；如今新一代的情报员以台商、学者与游客的身份进入大陆，重新织起这张网。"
 TAI_amphibious_corps: "两栖登陆兵团"
 TAI_amphibious_corps_desc: "要跨越台湾海峡，就必须有一支能在敌前登陆的兵团。一百三十公里宽的海峡曾是阻挡解放军的天堑，如今也是国军必须跨越的障碍；两栖登陆兵团配备新式登陆舰、气垫船与两栖突击车，在澎湖与屏东的海滩上反复演练。"
 TAI_secure_us_acquiescence: "争取美方默许"
 TAI_secure_us_acquiescence_desc: "没有华盛顿的点头，反攻大陆只能是空谈。1950 年代，艾森豪威尔政府以共同防御条约「拴住」蒋介石，不许国军擅自反攻；如今台北派遣密使赴美，试探美方的底线：美国是否愿意默许，或至少不加阻拦？"
 TAI_war_economy: "战时经济体制"
 TAI_war_economy_desc: "国防预算倍增，民间工厂转产军需。台湾的电子业为飞弹提供导引系统，纺织厂为国军缝制军服，造船厂日夜赶工建造登陆舰；经济部设立军需动员办公室，确保一旦开战，台湾能够独力支撑数月的作战。"
 TAI_mainland_democracy_support: "支援大陆民主运动"
 TAI_mainland_democracy_support_desc: "八九年的血没有白流。资助流亡海外的民运人士，把自由的种子撒回大陆。王丹、吾尔开希与一批维权律师在台北设立办公室，透过网络与卫星电视向大陆广播；对岸的年轻人开始翻墙阅读被禁止的历史。"
 TAI_overseas_mobilization: "号召海外华人"
 TAI_overseas_mobilization_desc: "从旧金山到吉隆坡，号召海外侨胞出钱出力，支持中华民国的复兴大业。辛亥革命时，华侨是国父最重要的支持者，「华侨为革命之母」；如今侨委会在世界各地的中华会馆举办说明会，募集资金与志愿者。"
 TAI_special_forces_raids: "敌后特种作战"
 TAI_special_forces_raids_desc: "海龙蛙兵与特战部队将渗透大陆沿海，破坏交通与指挥中枢。1950 至 60 年代，国军曾多次对大陆沿海实施突击，东山岛之役是规模最大的一次；新的特战行动更加隐秘，目标是雷达站、通信枢纽与导弹阵地。"
 TAI_kinmen_matsu_bastion: "金马前进基地"
 TAI_kinmen_matsu_bastion_desc: "金门与马祖距大陆不过数公里，是反攻的跳板。1958 年的八二三炮战中，金门守军在四十四天里承受了近五十万发炮弹仍屹立不倒；如今整建港口、机场与坑道，让这两座前哨重新成为反攻的桥头堡。"
 TAI_air_sea_superiority: "制空制海"
 TAI_air_sea_superiority_desc: "登陆作战的前提是夺取海峡的制空权与制海权。解放军的空军与海军数量远超国军，但台湾有更好的训练、更先进的预警与美制装备；国军必须在开战的最初几天就摧毁对岸的沿海机场与雷达，否则登陆舰队将寸步难行。"
 TAI_strategic_stockpile: "战略物资储备"
 TAI_strategic_stockpile_desc: "储备足以支撑半年作战的油料、弹药与粮食。台湾的能源与粮食大量依赖进口，一旦海上交通被切断，就可能在数周内陷入困境；新建的地下油库与粮仓分散在中央山脉的坑道中，确保战时的补给不会断绝。"
 TAI_peaceful_unification_talks: "两岸和平统一谈判"
 TAI_peaceful_unification_talks_desc: "若对岸已走上民主之路，或是政权摇摇欲坠，那么统一未必需要流血。向北京提出在中华民国宪法架构下和平统一的方案。"
 TAI_ignite_mainland_uprising: "点燃大陆起义"
 TAI_ignite_mainland_uprising_desc: "当人民的忍耐到了极限，只需要一颗火星。策动东南各省的军民起义，建立“中华民国大陆临时政府”；国军先以志愿军的名义接应，待局势明朗再整编出兵。"
 TAI_return_to_mainland: "反攻大陆"
 TAI_return_to_mainland_desc: "「光复大陆国土，解救大陆同胞。」半个多世纪的誓言，今天要兑现了。总统在总统府前宣读告全国军民同胞书，三军部队在左营、基隆与金门集结；从蒋中正的国光计划到今天，几代国军的梦想，终于要变成现实。"
 TAI_strait_blockade: "封锁海峡"
 TAI_strait_blockade_desc: "以潜舰与水雷封锁对岸的东南沿海港口。厦门、福州与宁波的港口被封锁之后，大陆东南沿海的经济将陷入停顿；国军的潜舰虽然数量不多，但配合布雷艇与岸置飞弹，足以让对岸的商船不敢出港。"
 TAI_general_mobilization: "全面动员"
 TAI_general_mobilization_desc: "颁布动员令，后备军人全面归建。台湾有两百多万名后备军人，平时散布在各行各业；动员令一下，他们在七十二小时内向所属部队报到，领取武器与装备。整个社会进入战时状态，学校停课、工厂转产。"
 TAI_psychological_offensive: "心理攻势"
 TAI_psychological_offensive_desc: "空飘传单、广播喊话与网络心战，瓦解对岸军民的斗志。光华电台恢复对大陆的全天候广播，金门的大喇叭重新对着厦门喊话；网络上流传着六四的影像、中共高层的财产与「国军弟兄回家吧」的呼吁。"
 TAI_southeast_landings: "登陆东南沿海"
 TAI_southeast_landings_desc: "闽浙粤沿海是国军最熟悉的战场。三军协同，建立滩头阵地：海军陆战队在湄洲湾与平潭登陆，空降部队夺取晋江机场，后续部队源源不断地跨海而来。登陆作战的成败，取决于最初的七十二小时。"
 TAI_pla_uprising: "阵前起义"
 TAI_pla_uprising_desc: "许多解放军官兵的祖辈曾是国军。向他们喊话：「国军弟兄们，回家吧！」1949 年，成建制的国军部队在大陆起义；如今历史倒转过来，福建与浙江的部分解放军部队开始与国军接触，有的整团整营地放下武器。"
 TAI_airborne_assault: "空降突击"
 TAI_airborne_assault_desc: "空降特战部队夺取敌后机场与交通要冲。直升机载着特战部队深入敌后，在解放军反应过来之前占领桥梁、隧道与机场；这些据点让国军的主力部队能够快速推进，也切断了对岸的增援路线。"
 TAI_liberate_fujian: "光复福建"
 TAI_liberate_fujian_desc: "国军在闽江口登陆，福州城头升起青天白日满地红旗。福建与台湾一水之隔，台湾人大多祖籍闽南，说着同样的方言；当国军开进福州时，许多老人认出了这面旗帜，那是他们童年时见过的国旗。"
 TAI_liberate_shanghai: "光复上海"
 TAI_liberate_shanghai_desc: "远东第一大都会回到了中华民国的怀抱。1949 年 5 月，汤恩伯的部队从上海撤退，这座城市从此告别了青天白日旗；七十多年后，外滩的海关大楼重新挂上了国旗，黄浦江上的轮船鸣笛致意。"
 TAI_liberate_guangdong: "光复广东"
 TAI_liberate_guangdong_desc: "广州——国民革命的策源地，再度光复。1911 年的黄花岗起义、1924 年的黄埔建军、1926 年的北伐誓师，都发生在这里；如今国军重返广州，第一件事就是到黄花岗七十二烈士墓前献花。"
 TAI_retake_nanjing: "光复南京"
 TAI_retake_nanjing_desc: "中山陵前，青天白日满地红旗再度飘扬。首都光复了！1949 年 4 月，解放军攻占总统府，扯下了国旗；七十多年后，国军仪队在总统府门前重新升旗，在台湾与海外守着电视的人们泪流满面。"
 TAI_liberate_wuhan: "光复武汉"
 TAI_liberate_wuhan_desc: "九省通衢的武汉落入国军之手，长江航道全线贯通。武昌起义的枪声在这里推翻了帝制，抗战时期武汉会战曾让日军付出沉重代价；控制了武汉，国军就掌握了华中的交通命脉，南北的解放军被一分为二。"
 TAI_northern_expedition: "北伐"
 TAI_northern_expedition_desc: "继承先总统蒋公遗志，国军再度挥师北伐！1926 年，国民革命军从广州誓师北伐，两年之内统一全国；如今新的北伐军从南京出发，沿津浦铁路北上，目标是北平。这是国民党历史上第二次北伐。"
 TAI_liberate_southwest: "光复西南"
 TAI_liberate_southwest_desc: "四川、重庆与云贵高原相继光复，抗战时期的陪都重回国民政府。1949 年 12 月，国民政府从成都撤往台北，这是它在大陆的最后一站；如今国军重返西南，重庆的抗战胜利纪功碑前挤满了欢迎的人群。"
 TAI_liberate_beiping: "光复北平"
 TAI_liberate_beiping_desc: "国军开进北平城，故宫与天安门重新悬挂中华民国国旗。七十多年来，天安门城楼上挂的是另一个人的画像；如今那幅画像被取下，换上了国父孙中山的遗像。北平——这座城市的名字，也将恢复为民国时期的称呼。"
 TAI_mainland_restored: "光复神州"
 TAI_mainland_restored_desc: "从金陵到燕京，中华民国的法统终于回到了它诞生的土地。可是，十三亿同胞、半个世纪的隔阂与一个完全不同的社会，正等待着新政府去面对。\n\n§Y完成后将切换为光复后的全新国策树。§!"
 TAI_armed_forces_modernization: "国军现代化"
 TAI_armed_forces_modernization_desc: "精实案之后，国军需要的不只是裁员，而是一支能打赢现代战争的部队。1990 年代的精实案把兵力从四十多万裁减到三十多万，但许多部队的装备与训练仍停留在冷战时期；国军现代化要从准则、装备与人才全面着手。"
 TAI_army_reform: "陆军精实"
 TAI_army_reform_desc: "裁减冗员、精简层级，把资源集中到战斗部队。陆军的后勤与行政单位过于庞大，许多军官从未带过兵；精实后的陆军以联兵旅为基本单位，指挥层级从五级减为三级，作战部队的比例大幅提升。"
 TAI_navy_modernization: "海军现代化"
 TAI_navy_modernization_desc: "老旧的阳字号驱逐舰必须退役，海军需要新一代的主力舰艇。阳字号是二战时期的美国驱逐舰，服役已超过半个世纪；海军以成功级巡防舰、康定级巡防舰与即将购入的纪德舰为骨干，重建水面舰队。"
 TAI_air_force_modernization: "空军现代化"
 TAI_air_force_modernization_desc: "幻象、F-16 与经国号——三代机的整合运用。1990 年代，台湾同时引进法国的幻象 2000 与美国的 F-16，加上自制的经国号，空军拥有三百多架第三代战机；但三种机型的后勤与训练各不相同，整合运用是空军最大的挑战。"
 TAI_han_kuang_exercise: "汉光演习"
 TAI_han_kuang_exercise_desc: "实兵、实弹、不预设剧本，检验三军真实战力。汉光演习自 1984 年起每年举行，过去常被批评为「表演」；改革后的汉光演习由美军观察员参与评估，模拟解放军的突袭，让部队在真实的压力下暴露问题。"
 TAI_conscription_reform: "兵役制度改革"
 TAI_conscription_reform_desc: "缩短役期、强化训练、扩大后备动员体系。年轻人抱怨当兵是「浪费生命」，部队里充斥着扫地与站哨的杂务；新的兵役制度把重点放在实战训练上，退伍后的后备军人每年回营教召，保持战力。"
 TAI_marine_corps_expansion: "扩编海军陆战队"
 TAI_marine_corps_expansion_desc: "陆战队是国军唯一具备两栖突击能力的部队。扩编它，既为守土，也为将来：陆战队员以「永远忠诚」为信条，在澎湖与东沙岛驻防，也在屏东的海滩上演练两栖登陆。总有一天，他们会成为反攻的先锋。"
 TAI_armor_modernization: "装甲换装"
 TAI_armor_modernization_desc: "以 M1A2 与云豹八轮甲车取代老旧的 M48 与 M113。陆军的 M48 坦克与 M113 装甲车是越战时期的装备，早已不堪使用；美国出售的 M1A2T 与国造的云豹甲车，让国军的装甲部队在火力与防护上跨越了几个世代。"
 TAI_army_aviation: "陆航旅"
 TAI_army_aviation_desc: "阿帕契与黑鹰直升机，让陆军拥有立体机动能力。陆军航空特战指挥部引进三十架 AH-64E 阿帕契与数十架 UH-60M 黑鹰，攻击直升机可以在滩头阵地上空猎杀敌方的登陆舰艇，黑鹰则能快速投送兵力。"
 TAI_whampoa_spirit: "黄埔精神"
 TAI_whampoa_spirit_desc: "亲爱精诚。陆军军官学校的校训，是国军百年不变的魂。1924 年创办于广州长洲岛的黄埔军校，培养了北伐与抗战的一代名将；迁台后的陆军官校在凤山继续这份传统，每一届毕业生都要在校门前宣誓。"
 TAI_special_forces: "特战部队"
 TAI_special_forces_desc: "空降特战、海龙蛙兵与宪兵夜鹰，国军最锋利的刀刃。高空特勤中队能从万尺高空跳伞渗透敌后，海龙蛙兵擅长水下爆破与两栖侦察，夜鹰负责首都的反恐任务；这些部队人数不多，却是国军最精锐的力量。"
 TAI_mobile_defense_doctrine: "机动防卫准则"
 TAI_mobile_defense_doctrine_desc: "滩岸决胜、纵深防御，以机动打击歼敌于水际。国军的防卫作战构想分为「战力防护、滨海决胜、滩岸歼敌」三个阶段：先保存实力，再在海上与滩头消灭登陆的敌军，让任何入侵者都无法在台湾站稳脚跟。"
 TAI_hsiung_feng_missiles: "雄风飞弹"
 TAI_hsiung_feng_missiles_desc: "雄风系列反舰与对地巡航飞弹，是遏阻敌军渡海的利剑。雄风三型是世界上最早的超音速反舰飞弹之一，有「航母杀手」之称；雄风二E 对地巡航飞弹则能打击对岸的机场与港口，让解放军的集结区无所遁形。"
 TAI_kidd_destroyers: "纪德舰"
 TAI_kidd_destroyers_desc: "从美国购入四艘纪德级驱逐舰，大幅提升防空能力。纪德级原本是为伊朗国王建造的，伊朗革命后转由美国海军使用；2005 年以基隆级的名义加入中华民国海军，成为舰队中最大、防空能力最强的军舰。"
 TAI_indigenous_submarine: "潜舰国造"
 TAI_indigenous_submarine_desc: "外购无门，那就自己造。海鲲号的龙骨将在高雄铺下。台湾只有四艘潜艇，其中两艘更是二战时期的老舰；美国、荷兰与德国在北京的压力下都拒绝出售潜艇，台湾决心以国造方式打造八艘柴电潜艇。"
 TAI_stealth_corvettes: "沱江级巡逻舰"
 TAI_stealth_corvettes_desc: "高速、匿踪、重火力的「航母杀手」。沱江级是双体船型的巡逻舰，航速超过四十节，配备雄风二型与雄风三型飞弹；数十艘沱江级在台湾海峡分散部署，足以让任何接近的敌方舰队付出惨重代价。"
 TAI_coast_guard_administration: "海岸巡防署"
 TAI_coast_guard_administration_desc: "统合海巡力量，守护台海与南海的海疆。2000 年成立的海岸巡防署整合了海关、警察与军方的海上力量，负责查缉走私、取缔越界渔船与救援；东沙岛与太平岛的守备，也由海巡署负责。"
 TAI_sea_control_doctrine: "制海作战"
 TAI_sea_control_doctrine_desc: "以潜舰、飞弹快艇与岸置飞弹构成多层次的制海体系。面对数量庞大的解放军海军，国军不追求舰队决战，而是在海峡中布下层层陷阱：潜舰在外海伏击，快艇在近海突袭，岸置飞弹守住最后一道防线。"
 TAI_idf_upgrade: "经国号战机升级"
 TAI_idf_upgrade_desc: "为 F-CK-1 换装新航电与新飞弹，并启动下一代国造战机的研发。经国号是台湾在美国协助下自制的战机，1990 年代服役；升级后的雄鹰型配备天剑二型飞弹与新的雷达，汉翔公司也开始研发下一代的高级教练机与战机。"
 TAI_f16_upgrade: "F-16V 性能提升"
 TAI_f16_upgrade_desc: "为一百四十余架 F-16 换装 AESA 雷达，升级为 F-16V 毒蛇型。新的雷达能同时追踪数十个目标，并能侦测到解放军的隐形战机；台湾的 F-16 机队成为亚洲最先进的 F-16 机队之一。"
 TAI_tien_kung_air_defense: "天弓防空网"
 TAI_tien_kung_air_defense_desc: "以天弓三型为骨干，构建覆盖全岛的多层防空网。天弓是中科院自行研制的远程防空飞弹，与美制爱国者飞弹互补；全岛的防空阵地分散在山区与城市，任何来袭的战机与弹道飞弹都将面对层层拦截。"
 TAI_air_base_hardening: "机场强化"
 TAI_air_base_hardening_desc: "疏散掩体、跑道快速修复与佳山基地，让空军在第一击后仍能作战。花莲的佳山基地建在山腹之中，能容纳两百架战机；各基地的跑道修复部队能在数小时内修好被炸毁的跑道，确保空军在遭受导弹攻击后仍能起飞。"
 TAI_drone_program: "无人机计划"
 TAI_drone_program_desc: "中科院的腾云无人机与各式小型无人机，是不对称作战的新利器。台湾有完整的电子与制造产业链，能以低成本大量生产无人机；在海峡战争中，成千上万架无人机可以对登陆舰队发动饱和攻击。"
 TAI_air_superiority_doctrine: "空优作战"
 TAI_air_superiority_doctrine_desc: "海峡上空的制空权，决定一切。没有制空权，海军无法出港，陆军无法机动，登陆与反登陆都无从谈起；国军空军以预警、防空与战机三者协同，确保在海峡上空不落下风。"
 TAI_long_range_strike: "远程精准打击"
 TAI_long_range_strike_desc: "雄升飞弹与云峰飞弹，具备打击对岸纵深目标的能力。云峰是中科院研制的超音速中程飞弹，射程足以覆盖北京；雄升则是对地巡航飞弹。这些武器让台湾第一次拥有了「境外决战」的能力，也让对岸的指挥中心不再安全。"
 TAI_joint_operations: "三军联合作战"
 TAI_joint_operations_desc: "打破军种本位，建立联合作战指挥机制。过去陆、海、空军各自为政，演习时连通信频道都不相通；新的联合作战指挥中心统一调度三军，以数据链连接每一艘军舰、每一架战机与每一座飞弹阵地。"
 TAI_iron_bastion: "固若金汤"
 TAI_iron_bastion_desc: "从金门、马祖到台澎本岛，层层设防。金门的坑道、澎湖的海防阵地与台湾本岛的滩岸工事构成一道纵深的防线；每一处可能的登陆海滩都布下了障碍物、地雷与火力点，入侵者每前进一步都要付出代价。"
 TAI_defense_autonomy: "国防自主"
 TAI_defense_autonomy_desc: "关键武器不能受制于人，国防产业必须自立。美国的军售时常因政治因素延宕，交货期一拖数年；国防自主政策以中科院、汉翔与台船为核心，让飞弹、战机与潜舰都能在台湾自行设计与生产。"
 TAI_cyber_command: "资通电军"
 TAI_cyber_command_desc: "成立资通电军指挥部，防御并反制对岸的网络攻击。台湾每天遭受数百万次的网络攻击，政府机关、银行与电力系统都是目标；资通电军负责保卫关键基础设施，并在必要时对敌方发动网络反击。"
 TAI_csist_expansion: "中科院扩编"
 TAI_csist_expansion_desc: "国家中山科学研究院是国防科技的核心。扩编它，投入更多研发经费：中科院研制了天弓、雄风、天剑与经国号的引擎，是台湾国防自主的基石；新的研究所专注于无人机、飞弹与人工智能。"
 TAI_pragmatic_diplomacy: "务实外交"
 TAI_pragmatic_diplomacy_desc: "只要能让中华民国被国际社会看见，名称与形式可以弹性。从「中华台北」到「台澎金马个别关税领域」，台湾以各种名义参与国际组织；邦交国虽然不多，但台湾在世界各地设有一百多个代表处，实质关系从未中断。"
 TAI_us_arms_sales: "对美军购"
 TAI_us_arms_sales_desc: "依据《台湾关系法》，争取美方出售更先进的防御性武器。F-16、爱国者飞弹、阿帕契直升机与鱼叉飞弹，都是台湾从美国购得的主力装备；每一笔军售都要经过国会的审查，也都会招来北京的强烈抗议。"
 TAI_japan_partnership: "台日伙伴关系"
 TAI_japan_partnership_desc: "日本是台湾最重要的邻国之一，经贸、科技与安全上的合作大有可为。两地人民的好感度长年位居前列，三一一大地震时台湾捐款超过两百亿日圆；日本的半导体材料与设备，更是台湾芯片产业不可或缺的伙伴。"
 TAI_secure_allies: "巩固邦交"
 TAI_secure_allies_desc: "中美洲、加勒比海与太平洋的友邦是中华民国国际地位的支柱。北京以金援与投资挖走一个又一个邦交国，每一次断交都是台湾外交的重挫；外交部以医疗团、农技团与奖学金，巩固剩下的十几个友邦。"
 TAI_taiwan_relations_act: "台湾关系法"
 TAI_taiwan_relations_act_desc: "美国国会是台湾最坚定的朋友。1979 年断交之后，国会通过《台湾关系法》，承诺向台湾提供防御性武器，并把任何以非和平方式决定台湾前途的行为视为对西太平洋和平的威胁；四十多年来，国会议员两党一致地支持台湾。"
 TAI_us_trade_talks: "台美贸易暨投资架构"
 TAI_us_trade_talks_desc: "推动台美经贸协定，扩大科技与投资合作。美国是台湾的第二大贸易伙伴，台积电在亚利桑那设厂、半导体供应链重组，都让两国的经济关系更加紧密；台美贸易暨投资架构协定是迈向自由贸易协定的第一步。"
 TAI_japan_tech: "台日科技合作"
 TAI_japan_tech_desc: "半导体材料、设备与精密机械，台日产业高度互补。台积电在熊本设厂，日本的东京威力科创与信越化学供应台湾晶圆厂所需的设备与矽晶圆；台日两国在供应链上的互信，是对抗地缘政治风险最好的保险。"
 TAI_central_america_aid: "中美洲援助计划"
 TAI_central_america_aid_desc: "医疗团、农技团与奖学金，巩固与中美洲友邦的情谊。台湾的行动医疗团在危地马拉与洪都拉斯的山区义诊，农技团教当地农民种植水稻与蔬菜；数以千计的中美洲学生拿着台湾的奖学金到台北读书。"
 TAI_pacific_allies: "太平洋友邦"
 TAI_pacific_allies_desc: "马绍尔、吐瓦鲁、诺鲁、帛琉与所罗门——南太平洋的伙伴。这些岛国人口稀少，却在联合国大会上各有一票；台湾为它们提供医疗、渔业与气候变迁的援助，帛琉总统更公开表示：「台湾是我们最可靠的朋友。」"
 TAI_us_military_exchange: "台美军事交流"
 TAI_us_military_exchange_desc: "军官互访、联合训练与情报分享。美军顾问团在 1979 年撤离，但两国的军事交流从未真正中断：台湾的军官在美国的军事院校进修，F-16 飞行员在亚利桑那受训，美军的观察员也会出现在汉光演习的现场。"
 TAI_overseas_chinese_affairs: "侨务工作"
 TAI_overseas_chinese_affairs_desc: "海外华侨是「革命之母」。凝聚他们对中华民国的向心力：侨委会在世界各地设立华侨文教中心，开办中文学校与文化活动；许多老侨仍保存着青天白日旗与国父的遗像，他们的子女也来台湾就读大学。"
 TAI_europe_relations: "台欧关系"
 TAI_europe_relations_desc: "与欧洲议会与各国国会建立友好联系。欧洲各国虽然与北京建交，但欧洲议会与各国国会的议员对台湾的民主抱有好感；立陶宛允许设立「台湾代表处」，捷克参议院议长率团访台，台欧关系在价值的基础上不断升温。"
 TAI_africa_allies: "非洲友邦"
 TAI_africa_allies_desc: "巩固与史瓦帝尼等非洲友邦的关系。非洲曾有十几个国家与中华民国建交，如今只剩下史瓦帝尼一国；台湾为它们提供医疗、农业与职业训练的援助，史瓦帝尼国王更是多次访台，称台湾为「真正的朋友」。"
 TAI_wto_accession: "加入 WTO"
 TAI_wto_accession_desc: "以「台澎金马个别关税领域」名义加入世界贸易组织。台湾在 1990 年申请加入关贸总协定，经过十二年的谈判，终于在 2002 年与大陆先后加入 WTO；这是台湾少数以平等成员身份参与的国际组织之一。"
 TAI_international_space: "拓展国际空间"
 TAI_international_space_desc: "以观察员或特殊名义参与世界卫生大会、国际民航组织等国际组织。SARS 疫情期间，台湾因被排除在世卫组织之外而付出惨痛代价；外交部联合友邦与理念相近的国家，一年又一年地在国际组织的门外敲门。"
 TAI_who_bid: "参与世界卫生组织"
 TAI_who_bid_desc: "防疫无国界。争取以观察员身份出席世界卫生大会。2003 年 SARS 爆发时，世卫组织的专家迟迟无法进入台湾；2009 年至 2016 年间，台湾曾以「中华台北」名义出席世卫大会。新冠疫情期间台湾的防疫表现，让更多国家支持它的参与。"
 TAI_de_facto_alliance: "事实同盟"
 TAI_de_facto_alliance_desc: "没有条约之名，却有同盟之实。美国的「战略模糊」让北京无法确定美军是否会介入台海冲突；台美之间的军售、军事交流与情报分享，已经让两国的关系成为一个事实上的同盟。"
 TAI_global_partner: "全球伙伴"
 TAI_global_partner_desc: "中华民国是国际社会负责任的一员。在疫情期间捐赠口罩、在灾难中派遣救难队、在国际发展中提供援助：「台湾能帮忙」不再只是口号。虽然邦交国不多，但台湾以实际行动赢得了世界的尊重。"
 TAI_new_republic_era: "民国新纪元"
 TAI_new_republic_era_desc: "中华民国的旗帜重新飘扬在全中国。七十多年前，国民政府从这片土地上撤退；如今，青天白日满地红旗又一次插上了南京、北平与广州的城楼。百废待举，一切从头开始：十四亿同胞在等着看，这个政府能不能做得比上一个更好。"
 TAI_return_capital_nanjing: "定都南京"
 TAI_return_capital_nanjing_desc: "国民政府定都南京！中山陵前，总统宣誓就职，紫金山上礼炮齐鸣。南京是国父选定的首都，也是 1949 年总统府降旗的地方；回到这里，就是向全国宣告中华民国的法统从未中断。首都默认设在南京。与「迁都北平」二选一。"
 TAI_military_government_period: "军政时期"
 TAI_military_government_period_desc: "依国父《建国大纲》，建国程序分为军政、训政、宪政三个时期。光复之初，一切以恢复秩序、肃清残余为先。"
 TAI_social_stabilization: "安定民生"
 TAI_social_stabilization_desc: "粮食、薪资、退休金——先让老百姓的日子过下去。政权更迭之际，最怕的是粮店空了、工资发不出来、退休老人领不到钱。政府动用外汇储备与台湾的库存粮食，保证各地的物资供应，并承诺原有的养老金照常发放。"
 TAI_frontier_policy: "边疆政策"
 TAI_frontier_policy_desc: "蒙、藏、回疆是中华民国宪法所保障的民族自治地区。新政府需要一套既维护统一、又尊重各族的边疆政策。"
 TAI_restore_provinces: "重建省级政府"
 TAI_restore_provinces_desc: "恢复各省省政府，任命各省主席。中共时代的省委书记与省长或被撤换、或被留用，新任省主席多是台湾派来的干部与大陆本地的开明人士。各省的行政机器必须尽快运转起来，否则地方就会陷入真空。"
 TAI_east_china_admin: "华东行政区"
 TAI_east_china_admin_desc: "江浙沪鲁闽皖赣，中华民国最富庶的核心地带，也是国民政府当年的根本之地。上海的金融、苏南的制造与浙江的民营经济，将成为重建全国的发动机；台商在这里经营了三十年，人脉与产业都是现成的。"
 TAI_south_china_admin: "华南行政区"
 TAI_south_china_admin_desc: "两广与海南，面向南洋的门户。广州是国民革命的发源地，黄埔军校与中山大学都在这里创立；珠三角的世界工厂与香港、澳门一水之隔，南洋的华侨资本也最先从这里回流。"
 TAI_central_china_admin: "华中行政区"
 TAI_central_china_admin_desc: "豫鄂湘三省是中国的粮仓与交通枢纽：京广铁路与长江在武汉交汇，「湖广熟、天下足」。辛亥革命的第一枪在武昌打响，华中的安定，关系到整个国家南北东西的贯通。"
 TAI_north_china_admin: "华北行政区"
 TAI_north_china_admin_desc: "平津冀晋与察绥，重设河北、察哈尔、绥远诸省。华北是中共统治最久、根基最深的地方，也是光复后治安最复杂的地区；北平的大学、天津的港口与山西的煤矿，都需要新政府投入最多的心力。"
 TAI_northeast_admin: "东北行政区"
 TAI_northeast_admin_desc: "恢复东北九省建制，振兴老工业基地。辽宁、安东、辽北、吉林、松江、合江、黑龙江、嫩江、兴安，这是抗战胜利后国民政府划定的九省。老工业基地的下岗潮与人口外流，是光复后最棘手的经济难题之一。"
 TAI_northwest_admin: "西北行政区"
 TAI_northwest_admin_desc: "陕甘宁青新，丝绸之路的起点。西安的古都、兰州的石化、青海的盐湖与新疆的油气，都是国家的宝藏；但这里地广人稀、民族多元，治理必须兼顾发展与边疆的安定。"
 TAI_southwest_admin: "西南行政区"
 TAI_southwest_admin_desc: "川渝滇黔与西康，抗战时期的大后方。重庆曾是国民政府的陪都，西南联大在昆明弦歌不辍；如今这片山川要从三线建设的遗产中走出来，成为连接东南亚与南亚的通道。"
 TAI_county_reorganization: "县市调整"
 TAI_county_reorganization_desc: "撤销地级市，恢复「省—县」两级制，精简行政层级。中共时代的「市管县」体制让地级市截留了大量资源，县城日渐凋敝；恢复县为地方自治的基本单位，是推行国父地方自治理念的前提。"
 TAI_hainan_province: "海南建省"
 TAI_hainan_province_desc: "海南岛单独设省，开发为国际自由贸易岛。海南与台湾相似：都是热带岛屿、都有成为开放门户的潜力。新政府引进台湾加工出口区的经验，让三亚与海口成为面向东南亚的金融、旅游与物流中心，并在榆林港驻泊海军。"
 TAI_balanced_powers: "均权制度"
 TAI_balanced_powers_desc: "中央与地方均权：凡事务有全国一致之性质者划归中央，有因地制宜之性质者划归地方，不偏于中央集权或地方分权。这是《中华民国宪法》第十章的精神，也是防止地方割据与中央专断的制度保障。"
 TAI_martial_order: "恢复秩序"
 TAI_martial_order_desc: "宪兵与警察接管各地治安，解除民兵与地方武装的武装，收缴散落在民间的武器弹药。光复初期，许多城市出现了趁乱抢劫与报复私刑，恢复秩序是新政府站稳脚跟的第一步。"
 TAI_purge_remnants: "肃清残余"
 TAI_purge_remnants_desc: "拒绝接受新政府的顽固势力必须被清除：武装抵抗的部队、策划暴动的地下组织与拒不交出档案的情报系统。但每一次清剿都可能制造新的仇恨，国军必须把打击面控制在最小。"
 TAI_ccp_question: "中共问题"
 TAI_ccp_question_desc: "九千万中共党员何去何从？这是新政府面临的最大难题。他们之中有贪官与打手，也有普通的教师、工人与基层干部；全部清算会让国家陷入内战，全部宽恕又对不起历次运动的受害者。新政府必须作出选择。"
 TAI_national_reconciliation: "民族和解"
 TAI_national_reconciliation_desc: "「相逢一笑泯恩仇。」不追究一般党员与基层干部，以宽恕换取十四亿人的团结。效仿南非的真相与和解委员会，让加害者说出真相、换取赦免；只要愿意效忠宪法，过去的身份不再是升迁的障碍。"
 TAI_mainland_transitional_justice: "清算与转型正义"
 TAI_mainland_transitional_justice_desc: "历次政治运动的受害者需要一个交代：反右、大饥荒、文革与六四。依法追究重大人权侵害的责任人，开放档案，为冤案平反，解散中共的组织体系。正义迟到了几十年，但不能缺席。"
 TAI_party_asset_settlement: "清理中共党产"
 TAI_party_asset_settlement_desc: "庞大的党产、党营事业与「小金库」收归国库，用于地方重建与安置。从党校、党报大楼到各级党委的房产与账户，中共积累的资产数以万亿计；台湾当年处理国民党党产的经验，如今被用在了更大的规模上。"
 TAI_political_amnesty: "特赦政治犯"
 TAI_political_amnesty_desc: "释放所有因言论、信仰与结社入狱的政治犯：维权律师、地下教会的牧师、法轮功学员、新疆与西藏的知识分子。监狱的大门打开时，许多人已在里面度过了十几年；他们的证词，将成为转型正义最重要的材料。"
 TAI_political_tutelage_period: "训政时期"
 TAI_political_tutelage_period_desc: "由政府训导人民行使选举、罢免、创制、复决四权，以县为单位逐步推行地方自治。这是国父《建国大纲》规定的三阶段中的第二阶段；台湾用了四十年才走完训政，大陆希望能走得快一些。"
 TAI_four_rights_training: "四权训练"
 TAI_four_rights_training_desc: "在各县开办公民训练班，教导人民行使选举、罢免、创制、复决四权。从未投过一张真正选票的大陆民众，要学会如何辨别候选人、如何监督官员、如何提出公民动议；志愿者中有许多是来自台湾的大学生。"
 TAI_local_self_government: "县级自治"
 TAI_local_self_government_desc: "一县之人民受四权训练完毕，得选举县官，以执行一县之政事。第一批完成自治的县份在江浙与广东出现，县长由选民直选产生；当选的县长中，有台商、有教师，也有前中共的基层干部。"
 TAI_control_yuan_anticorruption: "监察院肃贪"
 TAI_control_yuan_anticorruption_desc: "监察院与廉政公署联手，严惩接收过程中的贪腐。1945 年抗战胜利后的「劫收」，让国民政府在大陆失尽民心；这一次，任何利用接收中饱私囊的官员都将被弹劾、起诉，历史的错误绝不能重演。"
 TAI_national_assembly: "召开国民大会"
 TAI_national_assembly_desc: "全国各省代表齐聚南京，修订宪法增修条文，为宪政时期做好准备。上一次国民大会在大陆召开还是 1948 年；如今代表们要讨论的，是如何让一部为四亿五千万人制定的宪法，适用于今天的十四亿人。"
 TAI_provincial_assemblies: "省议会选举"
 TAI_provincial_assemblies_desc: "各省省议会由人民直接选举产生，省议员第一次可以质询省主席、审查省预算。各地的竞选活动热闹非凡，许多候选人照搬台湾的选举文化：宣传车、造势晚会与扫街拜票。"
 TAI_constitutional_period: "宪政时期"
 TAI_constitutional_period_desc: "全国过半数省份达到完全自治，即开宪政时期。中华民国宪法全面施行，军政与训政的过渡措施逐一废止；这是国父建国三阶段的最后一步，也是七十多年来几代人梦寐以求的时刻。"
 TAI_first_national_election: "首届全国大选"
 TAI_first_national_election_desc: "十四亿选民第一次用选票决定国家的领导人。从黑龙江的林区到海南的渔村，投票站前排起了长队；国际观察团称之为人类历史上规模最大的一次民主选举。无论结果如何，中国人已经证明，民主不是西方的专利。"
 TAI_five_yuan_nationwide: "五院体制全国化"
 TAI_five_yuan_nationwide_desc: "行政、立法、司法、考试、监察五院在全国正常运作。国父融合西方三权分立与中国传统考试、监察制度而设计的五权宪法，终于在它诞生的土地上完整实施；各省的考试院分院开始举办第一届全国公务员考试。"
 TAI_world_for_all: "天下为公"
 TAI_world_for_all_desc: "「大道之行也，天下为公。」一个民有、民治、民享的中华民国，终于在全中国实现。中山陵的石碑上刻着这四个字，一百年来，它是无数人为之奋斗、牺牲的理想；今天，它不再只是一句口号。"
 TAI_party_politics: "政党政治"
 TAI_party_politics_desc: "国民大会选举结束，各政党开始在全国范围内组织、竞争与合作。中华民国进入真正的政党政治时代。"
 TAI_kmt_government: "国民党执政"
 TAI_kmt_government_desc: "百年老店赢得了首届全国大选。中国国民党凭借光复的声望、完整的组织与台湾的执政经验，在大陆的选民中赢得了多数；它将以三民主义治理全中国，也要证明自己不再是当年那个腐败的党国。"
 TAI_kmt_party_state_separation: "党政分离"
 TAI_kmt_party_state_separation_desc: "党产归公、党职与公职分离，国民党不再是「党国」。军队、警察与学校中的党部被撤销，党员身份不再是任官的条件；国民党要以一个普通民主政党的身份，在选举中与其他政党公平竞争。"
 TAI_kmt_fiscal_prudence: "稳健财政"
 TAI_kmt_fiscal_prudence_desc: "量入为出，绝不让通货膨胀重演民国三十八年的悲剧。1948 年的金圆券改革失败，物价一日数涨，国民政府在大陆的统治因此崩溃；如今的财政部长把那一年的物价表挂在办公室里，提醒自己与同僚。"
 TAI_kmt_strong_defense: "国防优先"
 TAI_kmt_strong_defense_desc: "国家统一来之不易，必须有强大的国防来守护。北方的俄罗斯、东方的日本与南海的争端，都在考验这个新生的民主中国；国民党政府提高国防预算，扩建大陆的兵工厂与军港。"
 TAI_kmt_one_family: "两岸一家亲"
 TAI_kmt_one_family_desc: "台湾与大陆的同胞本是一家人，弥合半个世纪的隔阂是执政党的首要任务。两岸的婚姻、通商、求学与迁徙完全放开，台湾人在大陆投票、大陆人到台湾定居都不再需要繁琐的手续；「本省」与「外省」的界线也在慢慢淡去。"
 TAI_kmt_pro_business: "亲商政策"
 TAI_kmt_pro_business_desc: "减税、松绑、招商，让民间资本放手发展。中共时代对民营企业的种种限制被一一取消，台商、港商与海外华商纷纷加码投资；国民党政府相信，经济自由是政治自由的基础。"
 TAI_kmt_four_social_bonds: "礼义廉耻"
 TAI_kmt_four_social_bonds_desc: "恢复传统伦理道德，重建社会的道德秩序。礼义廉耻，国之四维；文化大革命摧毁了传统，市场经济又冲击了信任。国民党政府在学校恢复传统文化教育，修复各地的孔庙与祠堂，推动新生活运动的现代版本。"
 TAI_kmt_greater_china_economy: "大中华经济圈"
 TAI_kmt_greater_china_economy_desc: "整合两岸三地与南洋华人的资本，打造世界最大的经济圈。新加坡、马来西亚与印尼的华商网络曾是辛亥革命的金主，如今他们把资金与人脉带回祖国；从台北、香港到吉隆坡，一个横跨南海的华人经济圈正在成形。"
 TAI_kmt_era: "百年老店的新生"
 TAI_kmt_era_desc: "从兴中会、同盟会到统一中国，中国国民党走过了一百多年：它领导了辛亥革命与北伐，扛起了八年抗战，也曾在大陆败退、在台湾转型。如今它以一个民主政党的身份重新执政全中国，百年老店迎来了新生。"
 TAI_dp_government: "中国民主党执政"
 TAI_dp_government_desc: "1998 年在大陆遭到镇压的中国民主党，如今在全国大选中胜出。王有才、徐文立等创党人曾被判处重刑、流亡海外，他们的继承者却赢得了选民的信任。自由派的时代来临了。"
 TAI_dp_bill_of_rights: "人权法案"
 TAI_dp_bill_of_rights_desc: "言论、集会、结社、宗教与迁徙自由，全部写入法律并由法院保障，任何政府机关都不得以「维稳」为名限制公民的基本权利。国家安全法与「寻衅滋事罪」被废除，人民第一次可以起诉政府侵犯人权。"
 TAI_dp_free_market: "自由市场"
 TAI_dp_free_market_desc: "取消价格管制与行政审批，让市场决定资源配置。中共时代开一家公司要盖上百个章，民主党政府把审批改为登记制；信贷、土地与能源的价格交给市场，国家只负责监管与维护公平竞争。"
 TAI_dp_provincial_autonomy: "联省自治"
 TAI_dp_provincial_autonomy_desc: "扩大各省的立法与财政自主权，走向分权的民主中国。1920 年代的「联省自治」运动曾主张各省自订省宪、再组成联邦；民主党认为，一个十四亿人的大国，只有分权才能真正民主。"
 TAI_dp_judicial_independence: "司法独立"
 TAI_dp_judicial_independence_desc: "法官终身职、违宪审查与陪审制度。政法委被彻底撤销，法院不再接受任何党派的指令；陪审团制度先在重大刑事案件中试行，普通公民第一次参与审判，司法的公信力开始重建。"
 TAI_dp_open_society: "开放社会"
 TAI_dp_open_society_desc: "开放外国媒体、学者与投资者自由进出，取消签证限制与外资审查。海外的大学在大陆开设分校，外国记者可以自由采访；开放带来了新的思想与资本，也带来了冲击与不安。"
 TAI_dp_antitrust: "反垄断法"
 TAI_dp_antitrust_desc: "拆分垄断性的国企与财团，保障公平竞争。中石油、中国移动与几大国有银行被分拆重组，私人互联网巨头的平台垄断也被纳入审查；民主党相信，市场的敌人不只是计划经济，还有垄断资本。"
 TAI_dp_join_free_world: "融入自由世界"
 TAI_dp_join_free_world_desc: "加入西方民主国家的经济与安全体系：申请加入经合组织与 CPTPP，与美、日、澳建立安全对话。冷战结束三十年后，中国第一次以自由民主国家的身份站在西方世界的一边，全世界的地缘政治格局为之改写。"
 TAI_dp_liberal_china: "自由中国"
 TAI_dp_liberal_china_desc: "雷震与殷海光的理想，终于在全中国实现。1950 年代的《自由中国》杂志主张反对党与言论自由，雷震因此入狱十年；六十多年后，他们所梦想的那个自由、民主、法治的中国，不再只是纸上的文章。"
 TAI_sd_government: "社会民主党执政"
 TAI_sd_government_desc: "由改革派前中共党员、工会领袖与知识分子组成的中国社会民主党赢得了大选。它继承了八十年代赵紫阳一派改革者的理想，主张市场经济与社会公正并重；在下岗工人与农民工中，它的支持度远超其他政党。"
 TAI_sd_free_unions: "独立工会"
 TAI_sd_free_unions_desc: "工人终于可以组织真正属于自己的工会。中共时代的全国总工会只是党的附属机构，罢工者往往被抓；如今富士康与比亚迪的工人选出了自己的工会代表，集体谈判让工资与工时第一次由劳资双方协商决定。"
 TAI_sd_welfare_state: "福利国家"
 TAI_sd_welfare_state_desc: "以北欧为榜样，建立从摇篮到坟墓的社会安全网：失业保险、医疗保险、育儿津贴与住房补助一应俱全。社民党相信，国父的民生主义本来就是一种社会主义；代价是更高的税率与更沉重的财政负担。"
 TAI_sd_people_dividend: "国资全民分红"
 TAI_sd_people_dividend_desc: "国有企业的利润，以红利形式发放给每一位国民。阿拉斯加的永久基金与挪威的主权基金启发了这个构想：国企本来就是全民的财产，过去它们的利润被权贵瓜分，如今要实实在在地回到人民手中。"
 TAI_sd_free_education: "免费教育"
 TAI_sd_free_education_desc: "从幼儿园到大学，全部免费，并为农村学生提供住宿与伙食补贴。教育曾是压在普通家庭身上的三座大山之一，许多农村孩子考上了大学却付不起学费；社民党认为，教育平等是社会流动的起点。"
 TAI_sd_national_pension: "国民年金"
 TAI_sd_national_pension_desc: "所有国民，无论城乡，老有所养。过去城市公务员的退休金是农民的几十倍，许多农村老人每月只能领到一两百元；统一的国民年金让每一位老人都能领到足以维持体面生活的养老金。"
 TAI_sd_progressive_tax: "累进税制"
 TAI_sd_progressive_tax_desc: "富人多缴税，财富重新分配。中国的基尼系数长期居高不下，前百分之一的人掌握着三分之一的财富；社民党开征房产税、遗产税与资本利得税，用来支付福利国家的开销。"
 TAI_sd_green_growth: "绿色发展"
 TAI_sd_green_growth_desc: "治理雾霾、恢复江河，让中国重见蓝天。华北的燃煤电厂与钢铁厂逐步关停或改造，长江与黄河的污染企业被勒令整改；风电、光伏与电动车成为新的增长引擎，环保不再是发展的对立面。"
 TAI_sd_social_china: "社会公正的中国"
 TAI_sd_social_china_desc: "民生主义与社会民主主义，在这里找到了共同的答案。国父说「民生主义就是社会主义，又名共产主义，即是大同主义」；一百年后，一个既有市场效率、又有社会保障的中国，证明了这条路可以走通。"
 TAI_grand_coalition: "大联合政府"
 TAI_grand_coalition_desc: "没有任何政党获得过半数。国民党、民主党、社民党与台湾的政党在国会里各占一席之地，谁也无法单独组阁。为了国家的稳定，各大政党组成大联合政府，把选战中的恩怨暂时放在一边。"
 TAI_gc_coalition_agreement: "联合执政协议"
 TAI_gc_coalition_agreement_desc: "各党派签署联合执政协议，确立施政纲领的最大公约数。厚达两百页的协议列明了经济、外交、社会政策的每一项共识，以及发生分歧时的协商机制；德国的联合政府协议成了谈判代表们的参考范本。"
 TAI_gc_cabinet_sharing: "内阁分配"
 TAI_gc_cabinet_sharing_desc: "按得票比例分配内阁部会：国民党掌国防与外交，民主党掌财经，社民党掌劳动与社福。各部会首长分属不同政党，内阁会议上的争论从未停止，但每个政党都对施政负有一份责任。"
 TAI_gc_constitutional_court: "宪法法庭"
 TAI_gc_constitutional_court_desc: "设立宪法法庭，作为政治争议的最终仲裁者。联合政府内部的争执、中央与地方的权限纠纷、选举结果的争议，都交由大法官依宪法裁决；各党承诺无条件服从判决，这是联合执政得以维持的基石。"
 TAI_gc_national_unity: "举国一致"
 TAI_gc_national_unity_desc: "在重大问题上，朝野团结一致：国防、外交与主权问题由各党领袖组成的国家安全会议共同决定，不在选战中拿来做文章。对外，中国只有一个声音；对内，各党仍可在其他议题上激烈辩论。"
 TAI_gc_pragmatic_reform: "务实改革"
 TAI_gc_pragmatic_reform_desc: "不问左右，只问是否有效。联合政府放弃意识形态之争，用试点与数据来决定政策：一项改革先在几个省份试行，评估成效后再推向全国。邓小平「摸着石头过河」的方法，在民主体制下找到了新的用法。"
 TAI_gc_consensus_democracy: "协商民主"
 TAI_gc_consensus_democracy_desc: "在国会中建立跨党派协商机制：重大法案在提交表决前，必须经过各党代表组成的协商委员会审议。瑞士与荷兰的协商民主经验被引进，政治节奏虽然慢了，但通过的法律更少争议、更能长久。"
 TAI_gc_steady_progress: "安定中求进步"
 TAI_gc_steady_progress_desc: "稳定与发展兼顾。联合政府不追求激进的改革，也不放任问题积累：财政保持平衡，经济稳步增长，社会改革循序渐进。批评者说它缺乏远见，支持者说，经历了百年动荡的中国，最需要的就是安定。"
 TAI_gc_grand_compromise: "历史性的大和解"
 TAI_gc_grand_compromise_desc: "蓝与绿、台与陆、左与右，在一个屋檐下找到了共识。曾经在立法院里大打出手的政党，如今在同一个内阁里共事；曾经隔海对峙的两岸人民，如今在同一部宪法下生活。这是一次历史性的大和解。"
 TAI_democratic_consolidation: "民主巩固"
 TAI_democratic_consolidation_desc: "无论哪个政党执政，宪法与选举制度都已在全中国深深扎根。政治学家说，当输掉选举的一方愿意接受结果、等待下一次机会时，民主才算真正巩固；中国已经跨过了这道门槛，民主成为「唯一的游戏规则」。"
 TAI_peaceful_transfer: "政权和平交接"
 TAI_peaceful_transfer_desc: "第二次全国大选后，执政党与在野党和平交接政权。卸任的总统在总统府前与继任者握手，交出国玺与印信；对于一个五千年来政权更替多以战争收场的国家，这一刻的意义无可比拟。这是一个民主国家成熟的标志。"
 TAI_education_reform: "教育改革"
 TAI_education_reform_desc: "废除政治课与思想品德课，恢复通识与公民教育。历史教科书重新编写，大跃进、文革与六四第一次被如实写进课本；学生们学习宪法、人权与公民责任，而不是背诵某个领导人的语录。"
 TAI_press_freedom: "新闻自由"
 TAI_press_freedom_desc: "开放报禁、废除新闻审查，宣传部与网信办被撤销。1988 年台湾解除报禁时，报纸一夜之间从三十一家增加到数百家；如今大陆的报摊上也出现了数不清的新刊物，记者们第一次可以不经审查地报道真相。"
 TAI_religious_freedom: "宗教自由"
 TAI_religious_freedom_desc: "佛寺、道观、教堂与清真寺，都应自由地开放。被强拆的十字架重新竖起，地下教会走到地上，被关闭的清真寺与寺院重新迎来信众；宗教事务局不再干预宗教团体的人事与教义，政府与宗教各守其分。"
 TAI_traditional_characters: "正简并行"
 TAI_traditional_characters_desc: "恢复正体字教育，同时保留简化字的通行。中小学同时教授两种字体，官方文书以正体字为准，日常书写不加限制；「识正书简」让两岸的文字重新连通，也让年轻一代能够读懂古籍与先人的家书。"
 TAI_dismantle_firewall: "拆除防火长城"
 TAI_dismantle_firewall_desc: "网络不再有墙。防火长城的服务器被关闭，谷歌、维基百科与 YouTube 第一次在大陆可以自由访问；数亿网民涌入一个他们从未见过的互联网世界，信息的洪流冲刷着几十年的封闭。"
 TAI_civil_society_mainland: "民间社会复苏"
 TAI_civil_society_mainland_desc: "工会、商会、宗教团体与 NGO 重新出现在大陆。环保组织监督工厂排污，律师协会为弱势者提供法律援助，同乡会与校友会重新活跃起来；一个由公民自己组织起来的社会，是民主最坚实的土壤。"
 TAI_cultural_renaissance: "中华文化复兴"
 TAI_cultural_renaissance_desc: "恢复被文革破坏的古迹、庙宇与传统节庆。曲阜的孔庙、各地的宗祠与城隍庙得到修缮，清明、端午与中秋的传统习俗重新受到重视；故宫的文物与台北故宫的珍藏，第一次在南京与北平联合展出。"
 TAI_abolish_hukou: "废除户籍制度"
 TAI_abolish_hukou_desc: "城乡二元户籍制度是对农民的歧视，必须废除。两亿多农民工在城市里打工几十年，孩子却不能在城里上学、看病也不能报销；废除户籍后，所有国民享有同样的迁徙自由与公共服务，城市化将迎来新的浪潮。"
 TAI_national_identity: "中华民族认同"
 TAI_national_identity_desc: "无论来自台湾还是大陆，我们都是中华民国国民。七十多年的分隔，让两岸的人们说着同样的语言、却有着不同的记忆；新政府希望以宪法与民主为共同的基础，打造一种不以出身而以价值来定义的国民认同。"
 TAI_tibet_autonomy: "西藏自治"
 TAI_tibet_autonomy_desc: "以宪法第一百二十条「西藏自治制度，应予以保障」为本，给予西藏高度自治。流亡印度六十多年的藏人行政中央开始与南京谈判，寺院恢复自主管理，藏语教育重新进入学校；达赖喇嘛归国的可能，第一次被认真讨论。"
 TAI_xinjiang_question: "新疆问题"
 TAI_xinjiang_question_desc: "维吾尔、哈萨克与汉人共同生活在这片土地上。新政府将废除再教育营，释放被关押的数十万人，并推行地方自治；但多年的高压留下了深刻的伤痕，分离主义与汉人移民的不安，都考验着南京的智慧。"
 TAI_inner_mongolia_leagues: "内蒙盟旗制度"
 TAI_inner_mongolia_leagues_desc: "恢复蒙古盟旗自治，重设察哈尔、绥远与热河三省。民国初年的盟旗制度尊重蒙古王公与牧民的传统，蒙古语教育在 2020 年曾被大幅削减，如今重新恢复；草原上的牧民不必再被迫定居。"
 TAI_hk_macau_return: "港澳回归"
 TAI_hk_macau_return_desc: "香港与澳门在“一国两制”下归属中华人民共和国，如今一国已经不在。邀请两地回归中华民国，并保障其高度自治。"
 TAI_five_races_republic: "五族共和"
 TAI_five_races_republic_desc: "汉满蒙回藏，五族共和。中华民国是各民族共同的国家：1912 年的五色旗象征着五大民族的平等联合，如今这个理念被扩展到五十多个民族。少数民族在国会中享有保障名额，语言、宗教与习俗受到宪法保护。"
 TAI_economic_reconstruction: "经济重建"
 TAI_economic_reconstruction_desc: "台湾的资本与经验，加上大陆的规模与潜力。光复之初，股市暴跌、资金外逃、地方债务爆雷，许多工厂因为政权更迭而停工；新政府的第一要务，是让工厂重新开工、银行重新放贷、商店重新开门。"
 TAI_cross_strait_integration: "两岸经济整合"
 TAI_cross_strait_integration_desc: "这将是二十一世纪最大的经济整合：两个经济体合二为一，关税、货币与法规全面统一。台湾的半导体、精密机械与服务业，将与大陆的制造能力与庞大市场结合；德国统一的经验与教训，被经济部反复研究。"
 TAI_new_fabi: "币制改革"
 TAI_new_fabi_desc: "新台币与人民币并行带来混乱。成立新的中央银行，以固定比率发行统一的国币，名为「法币」以承续民国的币制传统。兑换比率的设定极其敏感：定高了，大陆储户吃亏；定低了，台湾的财富被稀释。"
 TAI_land_to_the_tiller: "耕者有其田"
 TAI_land_to_the_tiller_desc: "台湾当年的三七五减租与耕者有其田，是战后经济奇迹的起点。确权到户、减租扶农，数亿农民将第一次拥有自己土地的完整产权，可以买卖、抵押与传给子孙；地方政府再也不能随意征地卖地。"
 TAI_taishang_return: "台商回流"
 TAI_taishang_return_desc: "在大陆打拼多年的台商，如今是建设家乡的主力。昆山、东莞与厦门的台资工厂扩大投资，台商协会的会长们出任各地的经济顾问；他们熟悉大陆的风土人情，也懂得国际市场，是两岸整合最好的桥梁。"
 TAI_soe_question: "国企何去何从"
 TAI_soe_question_desc: "十几万家国有企业，养活着上亿人，也拖累着整个经济。它们垄断着能源、电信、金融与交通，却普遍效率低下、负债累累；民营化可以提高效率，但会让数千万职工失业，维持现状又会拖垮财政。新政府必须作出抉择。"
 TAI_soe_privatization: "国企民营化"
 TAI_soe_privatization_desc: "拍卖、上市、引入战略投资者，把竞争性行业的国企全面推向市场。台湾当年中钢、中华电信的民营化经验被大规模复制，国库获得巨额收入；但如何防止国有资产被权贵贱价收购，是改革成败的关键。"
 TAI_regulate_capital: "节制资本"
 TAI_regulate_capital_desc: "「私人不能操纵国民之生计。」这是国父节制资本的本意。关键产业仍由国家掌握，以防私人垄断与外资控制；国营事业要向国会公开账目、接受审计，不再是官员与权贵的私产。"
 TAI_sell_state_banks: "国有银行民营化"
 TAI_sell_state_banks_desc: "工商、建设、农业与中国银行四大国有银行公开上市，打破金融垄断。过去这些银行按照党的指令向国企与地方政府放贷，坏账堆积如山；上市之后，它们必须向股东负责，贷款要看风险而不是看关系。"
 TAI_private_enterprise_law: "民营企业保障法"
 TAI_private_enterprise_law_desc: "保障私有财产与公平竞争，民营经济是国家经济的主体。中共时代的民营企业家时刻担心被「国进民退」、被抓、被没收；新法明文规定私产神圣不可侵犯，政府征收必须依法补偿，企业家终于可以安心地做长远打算。"
 TAI_strategic_state_industry: "战略产业国营"
 TAI_strategic_state_industry_desc: "钢铁、能源、电信与军工维持国营，作为国家安全的底线。这些产业关系国防与民生，不能交给追求短期利润的私人资本；但国营不等于垄断，它们要与民营企业在市场上竞争，并接受专业经理人的管理。"
 TAI_yangtze_tech_corridor: "长三角—新竹科技走廊"
 TAI_yangtze_tech_corridor_desc: "把新竹的晶圆厂与上海、苏州、无锡的电子产业链串成一条世界级的科技走廊。台积电在南京与上海扩建先进制程，中芯国际被整合进统一的产业体系；从设计、制造到封测，完整的半导体生态就在长江口落地。"
 TAI_pearl_river_manufacturing: "珠三角制造业"
 TAI_pearl_river_manufacturing_desc: "世界的电子产品，有一半在这里组装：深圳的华强北、东莞的鸿海与惠州的电池厂，是全球供应链的心脏。政权更迭之后，订单曾一度外流到越南与印度；新政府以法治与开放赢回了外国品牌的信任。"
 TAI_bohai_industry: "环渤海工业带"
 TAI_bohai_industry_desc: "京津冀与辽东半岛的重工业基地：天津的化工与造船、唐山的钢铁、大连的重型机械。这一带是中共计划经济最集中的地区，产能过剩与污染严重；改造后的环渤海工业带将向高端装备与新材料转型。"
 TAI_world_factory: "世界工厂"
 TAI_world_factory_desc: "统一后的中国是全球最大的制造业国家，制造业产值超过美国、日本与德国的总和。台湾的技术、大陆的规模与民主制度带来的信任结合在一起，「中国制造」不再意味着廉价与仿冒，而是品质与创新。"
 TAI_national_tech_program: "国家科技计划"
 TAI_national_tech_program_desc: "整合两岸的大学与研究院，投入巨资于基础科学。中央研究院与中国科学院合并为新的国家科学院，清华、北大与台大、成大建立联合实验室；新政府承诺把研发投入提高到 GDP 的百分之三以上。"
 TAI_space_program: "中华民国航天计划"
 TAI_space_program_desc: "接收酒泉、西昌与文昌发射中心，国家太空中心与航天科技集团合并。台湾的福卫系列卫星与大陆的长征火箭结合，中华民国一夜之间成为世界航天大国；载人航天与空间站计划将在青天白日旗下继续进行。"
 TAI_digital_china: "数位中国"
 TAI_digital_china_desc: "云端、人工智能与 5G 网络，构成数位中国的基础。拆除防火墙之后，大陆的互联网企业与世界接轨，台湾的芯片设计与大陆的海量数据结合，让中国在人工智能领域与美国并驾齐驱，而且是在法治与隐私保护之下。"
 TAI_moon_mission: "登月计划"
 TAI_moon_mission_desc: "让青天白日满地红旗插上月球。嫦娥计划的工程师们继续他们的工作，只是飞船上的国旗换了；当中华民国的航天员踏上月面时，台北与北平的街头同时欢呼，两岸的孩子们一起抬头仰望。"
 TAI_central_bank_unification: "统一中央银行"
 TAI_central_bank_unification_desc: "中华民国中央银行与中国人民银行合并为统一的中央银行，总部设在上海外滩。新央行依法独立于行政院，以维持币值稳定为首要目标，不再为地方政府与国企的扩张印钞。"
 TAI_capital_market_merger: "股市整合"
 TAI_capital_market_merger_desc: "台北、上海与深圳证券交易所整合为统一市场，上市规则、信息披露与交易制度全面接轨国际标准。统一后的中华证券交易所市值跻身世界前三，大陆的散户第一次在一个不受行政干预的市场里投资。"
 TAI_tax_reform: "统一税制"
 TAI_tax_reform_desc: "统一两岸税制，简化税目、扩大税基。中共时代的税收依赖间接税与土地出让金，地方政府靠卖地维生；新税制以所得税与营业税为主，并重新划分中央与地方的财源，让地方不必再靠拆迁过日子。"
 TAI_foreign_investment: "引进外资"
 TAI_foreign_investment_desc: "统一、民主、法治的中国，是外国投资者眼中最好的市场。外资不再需要与国企合资、不再被迫转让技术，知识产权受到独立法院的保护；苹果、特斯拉与欧洲车企纷纷宣布扩大在华投资。"
 TAI_local_debt_cleanup: "清理地方债务"
 TAI_local_debt_cleanup_desc: "地方融资平台的天量债务必须清算：总额据估计超过六十万亿元，许多城市的「鬼城」与烂尾楼就是这些债务的见证。中央政府接管部分债务，其余进行重组与核销，并立法禁止地方政府再以隐性方式举债。"
 TAI_strong_currency: "强势国币"
 TAI_strong_currency_desc: "国币成为亚洲最重要的储备货币之一。资本账户完全开放、央行独立运作、法院保护债权人，统一后的中国货币第一次获得了国际市场的信任；东南亚的央行开始把国币纳入外汇储备。"
 TAI_industrial_plan: "实业计划"
 TAI_industrial_plan_desc: "孙中山在《实业计划》中构想的十万英里铁路、三大港口与长江整治，一百年后终于可以付诸实行。国父在 1919 年就预见了三峡大坝与东方大港，如今新政府以他的蓝图为纲，展开前所未有的基础建设。"
 TAI_national_rail_network: "全国铁路网"
 TAI_national_rail_network_desc: "八纵八横的高铁网贯通全国，台湾高铁与大陆高铁的标准统一，台北到北平的直达列车只需不到十小时（经由海峡隧道的规划正在评估）。铁路把两岸与各省紧紧连在一起，人与货物的流动从未如此顺畅。"
 TAI_great_eastern_port: "东方大港"
 TAI_great_eastern_port_desc: "上海、宁波、广州与天津——世界级的港口群。国父在《实业计划》中提出建设北方、东方与南方三大港，如今洋山深水港与宁波舟山港早已是世界第一，高雄与基隆也被纳入统一的港口体系。"
 TAI_three_gorges: "三峡与长江整治"
 TAI_three_gorges_desc: "整治长江航道，完善三峡水利枢纽。三峡大坝带来了电力与航运，也带来了移民、泥沙与地质灾害的问题；新政府成立独立的评估委员会，在发电与生态之间寻找平衡，并疏浚长江中下游的航道。"
 TAI_south_north_water: "南水北调"
 TAI_south_north_water_desc: "让长江之水滋润华北平原。南水北调的东线与中线把汉江与长江的水送往北平与天津，西线工程却因生态争议而迟迟未动；新政府公开工程资料、听取沿线居民的意见，再决定是否继续。"
 TAI_national_ten_constructions: "全国十大建设"
 TAI_national_ten_constructions_desc: "当年的十大建设让台湾起飞：中山高速公路、桃园机场、中钢与核电厂，奠定了经济奇迹的基础。如今要把它放大到全中国：十项跨世纪的国家工程同时动工，为下一个三十年的增长打下根基。"
 TAI_develop_northwest: "开发大西北"
 TAI_develop_northwest_desc: "修筑西北铁路系统，开发河西走廊与新疆。国父曾规划「西北铁路系统」连接兰州、迪化与喀什；如今这些铁路要通往中亚与欧洲，让沿海的繁荣延伸到内陆，也让边疆各族人民分享发展的成果。"
 TAI_revitalize_northeast: "振兴东北"
 TAI_revitalize_northeast_desc: "老工业基地的重生。东北曾是共和国的工业摇篮，如今人口外流、国企凋零；新政府以国企改制、对俄对日韩开放与农业现代化三管齐下，让沈阳、长春与哈尔滨重新找回活力。"
 TAI_west_east_gas: "西气东输"
 TAI_west_east_gas_desc: "塔里木盆地的天然气经由四千多公里的管线，输往长三角与珠三角。西气东输让东部城市减少了燃煤，也让新疆获得了资源收益；新政府规定，管线收入的一定比例必须留在产地，用于当地的教育与医疗。"
 TAI_nuclear_power_expansion: "核电扩张"
 TAI_nuclear_power_expansion_desc: "沿海核电站群，为世界工厂提供电力。台湾曾因反核运动关闭核电厂，大陆则以惊人的速度建设核电；统一后的政府在核安与能源需求之间取得平衡，引进最新的第三代反应堆，并建立独立的核安管制机构。"
 TAI_rural_revival: "乡村复兴"
 TAI_rural_revival_desc: "仿照当年的「中国农村复兴联合委员会」，成立新农复会。1948 年在南京成立的农复会后来在台湾推动了土地改革与农业现代化，蒋梦麟与晏阳初的理念造就了台湾的农村奇迹；如今新农复会要把这份经验带回大陆。"
 TAI_farmers_associations: "农会体系"
 TAI_farmers_associations_desc: "在全国推广台湾的农会制度：供销、信用与推广三位一体。农会帮农民采购种子与肥料、销售农产品、提供低息贷款与技术指导，是台湾农民最重要的组织；大陆的农民第一次有了一个真正为自己服务的团体。"
 TAI_labor_standards: "劳动基准法"
 TAI_labor_standards_desc: "八小时工作制、基本工资与职业安全，保障数亿劳工的权益。「996」与无偿加班成为违法行为，矿难与工伤事故的责任人将被追究刑责；劳动检查员走进工厂与工地，不再只是走过场。"
 TAI_irrigation: "水利建设"
 TAI_irrigation_desc: "整修全国的灌溉渠道与水库。大跃进时期仓促修建的数万座水库多已老化，许多成了危库；新政府投入巨资加固水坝、疏浚渠道，并推广台湾的节水灌溉技术，让华北的地下水不再继续下降。"
 TAI_mechanized_farming: "农业机械化"
 TAI_mechanized_farming_desc: "以农机取代人力，释放农村劳动力。土地确权之后，农民可以自由流转与合并土地，大型农场与合作社开始采购拖拉机与收割机；数以亿计的农村青年因此可以离开田地，进入城市的工厂与学校。"
 TAI_labor_insurance: "劳工保险"
 TAI_labor_insurance_desc: "全国劳工纳入劳保，享有职灾、老年与失业给付。台湾的劳工保险自 1950 年开办，是社会安全制度的基石；如今两亿农民工第一次与城市职工享有同样的保障，工伤不再意味着一家人的赤贫。"
 TAI_food_security: "粮食安全"
 TAI_food_security_desc: "十四亿人的饭碗，必须端在自己手里。中国每年进口上亿吨大豆与粮食，粮食安全是国家安全的基础；新政府保护十八亿亩耕地红线，建立国家粮食储备，并与巴西、俄罗斯签订长期供应协议。"
 TAI_national_health_insurance: "全民健保"
 TAI_national_health_insurance_desc: "把台湾的全民健保推广到全中国，人人看得起病。台湾健保以低廉的保费与极高的满意度闻名世界；在大陆，「看病难、看病贵」曾让无数家庭因病返贫。单一保险人制度让十四亿人都能拿着同一张健保卡就医。"
 TAI_new_urbanization: "新型城镇化"
 TAI_new_urbanization_desc: "数亿农民进城，城市需要为他们准备住房、学校与工作。废除户籍之后，第二轮城市化浪潮席卷全国；新政府规划以中小城市为主的城镇化路线，避免大城市的过度膨胀，让县城也能吸引年轻人留下。"
 TAI_public_housing: "国民住宅"
 TAI_public_housing_desc: "兴建千万户国民住宅，让每个家庭都有安居之所。大陆的房价曾让年轻人望而却步，「房奴」一词道尽了一代人的辛酸；国民住宅以成本价出售或低租金出租，优先照顾新婚夫妇、农民工与低收入家庭。"
 TAI_common_prosperity: "均富社会"
 TAI_common_prosperity_desc: "民生主义的理想：平均地权、节制资本，使人人富足。国父主张以照价征税、涨价归公来防止土地投机，以节制资本防止贫富悬殊；一百年后，均富社会不再是空洞的口号，而是有数据可查的现实。"
 TAI_national_reconstruction: "建国方略"
 TAI_national_reconstruction_desc: "心理建设、物质建设、社会建设——国父的《建国方略》终于在统一的中国全面实现。《孙文学说》、《实业计划》与《民权初步》描绘的那个现代中国，历经北伐、抗战、内战与分裂，终于在一百年后成为现实。"
 TAI_national_army_reborn: "国军新生"
 TAI_national_army_reborn_desc: "两百多万解放军与二十万国军，将合编为一支新的国民革命军。七十多年来兵戎相见的两支军队，如今要穿上同样的军服、在同一面旗帜下宣誓效忠宪法；这比任何一场战役都要艰难。"
 TAI_reorganize_pla: "整编解放军"
 TAI_reorganize_pla_desc: "保留编制、甄别军官、改换番号，将解放军整编为国军。军队的政治委员制度被废除，党委改为宪法教育组；士兵们大多来自农村，他们关心的是军饷能否照发、退伍后能否安置，新政府必须给出满意的答案。"
 TAI_defense_ministry_reform: "国防部改组"
 TAI_defense_ministry_reform_desc: "中央军委并入国防部，军队国家化，文人领军。军队不再效忠于任何政党，而是效忠于宪法与国家；国防部长由文人出任，向立法院负责，军方高层的任命需要国会同意。这是民主国家军政关系的基本原则。"
 TAI_navy_unification: "海军合编"
 TAI_navy_unification_desc: "解放军海军与中华民国海军合编，舰队规模一跃成为世界前三。航空母舰、055 型驱逐舰与基德级、成功级同在一面军旗下航行；左营与青岛的海军官校合并，两岸的海军军官终于可以同在一艘军舰上服役。"
 TAI_air_force_unification: "空军合编"
 TAI_air_force_unification_desc: "两岸空军合编，统一指挥与训练体系。歼-20 与 F-16V、经国号同在一个空军序列中，飞行员要学习彼此的战术与语言；冈山空军官校与长春航空大学建立交流，新一代飞行员将不再分彼此。"
 TAI_screen_officers: "甄别军官"
 TAI_screen_officers_desc: "效忠宪法者留任，拒绝者退伍。每一位校级以上军官都要接受甄别：是否参与过六四镇压、是否涉及贪腐、是否愿意宣誓效忠中华民国宪法。数千名将校被劝退，但大多数中下级军官选择留下。"
 TAI_redesignate_units: "改换番号"
 TAI_redesignate_units_desc: "集团军改称军，恢复国军的光荣番号：第七十四军、新一军、新六军……这些在抗战中浴血奋战的番号，重新出现在国军的序列中。许多老兵的后代如今在这些部队服役，历史在他们身上重新连接。"
 TAI_whampoa_reopened: "重建黄埔军校"
 TAI_whampoa_reopened_desc: "陆军军官学校重返广州长洲岛。1924 年，国父与苏联顾问在这里创办黄埔军校，蒋中正任校长，周恩来任政治部主任；一百年后，凤山的陆军官校在故址重建校区。「亲爱精诚」的校训，再续新章。"
 TAI_theater_commands: "五大战区"
 TAI_theater_commands_desc: "以东部、南部、西部、北部与中部五大战区，取代旧有的军区体制，实行军政、军令分离：国防部管建军，参谋本部管作战。各战区针对不同方向的威胁——日本、南海、印度、俄罗斯与内陆的游击势力——制定作战计划。"
 TAI_professional_army: "职业化陆军"
 TAI_professional_army_desc: "义务役改为募兵为主，打造精锐的职业军队。台湾在 2010 年代完成募兵制转型，经验与教训都已摆在眼前；新的陆军规模更小、训练更精、待遇更好，士兵签下的是一份职业合约，而不是被迫服役。"
 TAI_military_academies: "军校体系"
 TAI_military_academies_desc: "陆官、海官、空官、国防大学与各兵科学校的全国网络。台湾的军校体系与大陆的国防科技大学、各兵种学院合并重组，课程统一、学制统一；未来的将领将在同一所学校里学习宪法、战史与现代作战。"
 TAI_armored_corps: "装甲兵团"
 TAI_armored_corps_desc: "以国产新型主战坦克组建装甲兵团。接收的数千辆 99 式与 96 式坦克，与台湾的 M1A2T 混编整训；新的装甲兵团配备数字化指挥系统，能在华北平原与东北原野上实施大纵深机动作战。"
 TAI_mechanized_infantry: "机械化步兵"
 TAI_mechanized_infantry_desc: "所有步兵师完成机械化与摩托化，步兵战车与轮式装甲车取代卡车与双脚。在幅员辽阔的大陆上，机动能力就是战斗力：一支能在一天内推进数百公里的部队，才能应对从东北到西南的任何危机。"
 TAI_artillery_corps: "炮兵与火箭炮"
 TAI_artillery_corps_desc: "远程火箭炮与自走炮，提供压倒性的火力。PHL-03 与雷霆-2000 火箭炮、PLZ-05 与 M109 自走炮编成统一的炮兵体系，配合无人机侦察，能在发现目标后数分钟内覆盖数十公里外的阵地。"
 TAI_army_aviation_mainland: "陆航部队"
 TAI_army_aviation_mainland_desc: "每个军都配属一个陆航旅，阿帕奇、黑鹰与直-10、直-20 编入同一个陆航序列。直升机让陆军可以跨越山地与河流快速投送部队，在西南的高原与西北的沙漠中，这是不可或缺的能力。"
 TAI_special_operations_command: "特种作战司令部"
 TAI_special_operations_command_desc: "整合两岸的特种部队，组建统一的特战司令部。海龙蛙兵、高空特勤队与大陆各战区的特种作战旅合编，承担反恐、敌后侦察与人质营救等任务；他们是国军中最精锐、也最神秘的一群人。"
 TAI_demobilization: "裁军与复员安置"
 TAI_demobilization_desc: "裁减冗员，妥善安置复员官兵。数十万官兵将脱下军装，他们需要工作、住房与尊严，否则就可能成为社会动荡的源头；新政府设立退辅会，提供职业训练、创业贷款与优先就业，许多人被安排进公安、消防与国营事业。"
 TAI_combined_arms: "合成化作战"
 TAI_combined_arms_desc: "合成营、合成旅——现代陆战的基本单位。步兵、装甲、炮兵、工兵与防空在同一个营里协同作战，营长可以直接呼叫火力与空中支援；国军彻底告别以师为单位的旧体制，成为一支真正的现代化陆军。"
 TAI_strategic_rocket_force: "接管战略火箭部队"
 TAI_strategic_rocket_force_desc: "前火箭军的导弹阵地与指挥体系必须牢牢掌握在中央手中。数千枚弹道导弹与数百枚核弹头分散在全国各地的山洞与基地里，任何一枚失控都是全世界的噩梦；美国与俄罗斯都派出专家，密切关注交接过程。"
 TAI_nuclear_question: "核武问题"
 TAI_nuclear_question_desc: "中华民国从未拥有核武——直到今天。1970 年代台湾曾秘密研发核武，在美国的压力下被迫放弃；如今南京一夜之间接管了数百枚核弹头。保留它们，就成为第五个合法拥核大国；放弃它们，就能赢得全世界的尊重。"
 TAI_keep_deterrent: "保留核威慑"
 TAI_keep_deterrent_desc: "核武是统一中国安全的最后保障。北方的俄罗斯、南方的印度与东方的朝鲜都拥有核武，放弃威慑无异于自缚手脚；南京宣布坚持「不首先使用」政策，但华盛顿、东京与新德里仍然忧心忡忡。"
 TAI_denuclearize: "无核宣言"
 TAI_denuclearize_desc: "中华民国宣布销毁全部核武，成为世界上第一个主动放弃核武的大国。南非与乌克兰曾经这样做过，但它们都不是大国；国际原子能机构的检查人员进驻酒泉与罗布泊，全世界的报纸头版都是同一个标题。"
 TAI_cyber_space_force: "网络空间部队"
 TAI_cyber_space_force_desc: "网络是第五战场。接收前战略支援部队的网络部门，与台湾资通电军合编为网络空间部队；它负责保卫国家的电网、金融与通信，也负责侦测与反制来自国外的网络攻击。"
 TAI_aerospace_force: "航天部队"
 TAI_aerospace_force_desc: "卫星、反卫星与太空侦察。北斗导航系统与侦察卫星群是国军的眼睛与耳朵；航天部队负责保护这些卫星，并在必要时让敌人的卫星失明。太空，将是下一个大国竞争的舞台。"
 TAI_fleet_reorganization: "舰队重编"
 TAI_fleet_reorganization_desc: "北海、东海与南海三大舰队，加上台湾舰队，重新编组为四个舰队，分别驻泊青岛、舟山、湛江与左营。台湾舰队熟悉西太平洋与巴士海峡，将成为远洋作战的先锋；各舰队的指挥官由两岸军官轮流担任。"
 TAI_naval_shipyards: "江南造船"
 TAI_naval_shipyards_desc: "江南造船厂与大连造船厂是海军扩张的基础：辽宁号在大连改装、福建号在江南下水。台湾的台船与中信造船也加入国防造船体系，海军的舰艇建造能力将居世界首位。"
 TAI_blue_water_navy: "远洋海军"
 TAI_blue_water_navy_desc: "中华民国海军终于可以走向深蓝。七十多年来，国军海军的任务只是守住台湾海峡；如今它要保护横跨印度洋、波斯湾与南太平洋的海上贸易航线，在吉布提、瓜达尔与亚丁湾都能看到青天白日的军旗。"
 TAI_submarine_force: "潜艇部队"
 TAI_submarine_force_desc: "核动力攻击潜艇与战略核潜艇。台湾的海鲲号自制潜艇与接收的 093、094 型核潜艇编成统一的潜艇部队；在西太平洋的深海里，潜艇是最隐蔽也最致命的武器。"
 TAI_carrier_program: "航母计划"
 TAI_carrier_program_desc: "辽宁号只是开始。山东号与福建号之后，新一代核动力航母已经在江南造船厂的船坞里铺设龙骨；中华民国海军计划拥有六艘航母，让海军航空兵的战机出现在每一片大洋的上空。"
 TAI_destroyer_squadrons: "驱逐舰队"
 TAI_destroyer_squadrons_desc: "新一代防空驱逐舰批量服役：以 055 型为基础改进的大型驱逐舰，配备台湾自研的海剑二防空飞弹与雄风反舰飞弹。它们是航母编队的盾牌，也是海上作战的主力。"
 TAI_marine_corps_mainland: "海军陆战队扩编"
 TAI_marine_corps_mainland_desc: "两个陆战师扩编为六个，具备全球投送能力。中华民国海军陆战队的「永远忠诚」传统与大陆陆战旅的两栖经验结合，配合两栖攻击舰，陆战队能在任何海岸线上发动登陆作战。"
 TAI_carrier_strike_group: "航母战斗群"
 TAI_carrier_strike_group_desc: "以航母为核心的远洋战斗群，巡弋三大洋。一个战斗群包括一艘航母、四艘驱逐舰、两艘护卫舰、一艘核潜艇与补给舰；中华民国成为继美国之后，第二个能在全球同时部署多个航母战斗群的国家。"
 TAI_air_academy: "空军官校"
 TAI_air_academy_desc: "冈山空军官校与长春飞行学院合并，统一飞行员的培训体系。冈山的飞行教官以美式训练方法闻名，长春则有完整的歼击机训练基地；新一代飞行员在两地轮训，学习彼此的长处。"
 TAI_stealth_fighters: "隐形战机"
 TAI_stealth_fighters_desc: "第五代隐形战机量产。歼-20 与歼-35 的生产线在成都与沈阳全速运转，台湾的汉翔公司负责航电与雷达的升级；中华民国空军的隐形战机数量，将在十年内仅次于美国。"
 TAI_air_defense_network: "全国防空网"
 TAI_air_defense_network_desc: "覆盖全国的雷达与防空飞弹网。台湾的天弓系统与大陆的红旗系统整合进统一的指挥网络，从南海到黑龙江，任何闯入中华民国领空的飞机与导弹，都将在几分钟内被发现与拦截。"
 TAI_strategic_bombers: "战略轰炸机"
 TAI_strategic_bombers_desc: "远程战略轰炸机，具备洲际打击能力。轰-6 的时代即将结束，新一代隐形轰炸机轰-20 在西安首飞；它让中华民国空军第一次具备了跨越太平洋的远程打击能力，也让周边国家重新计算力量的平衡。"
 TAI_air_superiority_mainland: "制空权"
 TAI_air_superiority_mainland_desc: "东亚上空，由中华民国空军主宰。隐形战机、预警机与空中加油机组成完整的空战体系，飞行员的训练时数达到北约标准；从日本海到马六甲海峡，没有哪一国的空军能在这片天空中与之匹敌。"
 TAI_uav_program: "无人机部队"
 TAI_uav_program_desc: "察打一体无人机与蜂群无人机。翼龙与彩虹系列无人机已出口到世界各地，台湾的腾云无人机也加入序列；新一代蜂群技术让上百架小型无人机协同作战，乌克兰战争的经验被国军认真研究。"
 TAI_defense_industry_mainland: "国防工业整合"
 TAI_defense_industry_mainland_desc: "航空工业、兵器工业与船舶工业集团重组为国家国防工业集团，台湾的中科院与汉翔公司一并纳入。国防工业不再是各自为政的独立王国，而要接受国会的预算审查与审计。"
 TAI_world_class_military: "世界一流国军"
 TAI_world_class_military_desc: "一支现代化、职业化、国家化的国民革命军。它不效忠于任何政党或个人，只效忠于中华民国宪法与全体国民；它的装备与训练比肩世界一流，它的使命是保卫国家、而不是镇压人民。"
 TAI_new_china_diplomacy: "新中国外交"
 TAI_new_china_diplomacy_desc: "统一后的中华民国，如何与世界相处？它继承了中华人民共和国的联合国席位、核武与庞大的经济，也继承了与美国、日本、俄罗斯与印度之间的种种纠葛。新的外交部必须决定，这个国家要成为什么样的大国。"
 TAI_rejoin_united_nations: "重返联合国"
 TAI_rejoin_united_nations_desc: "1971 年，联合国大会通过第 2758 号决议，中华民国退出联合国。如今，代表全中国的只有一个政府：青天白日旗重新升起在纽约联合国总部的旗杆上，中华民国代表再次坐上安理会常任理事国的席位。"
 TAI_great_power_diplomacy: "大国外交"
 TAI_great_power_diplomacy_desc: "一个统一的、民主的中国，将成为国际秩序中举足轻重的一极。它的人口占世界五分之一，经济规模与美国相当；华盛顿、莫斯科、东京与布鲁塞尔都在重新评估，如何与这个新的大国打交道。"
 TAI_inherent_territory: "固有疆域"
 TAI_inherent_territory_desc: "中华民国宪法第四条：「中华民国领土，依其固有之疆域，非经国民大会之决议，不得变更之。」外蒙古、外东北、唐努乌梁海与南海诸岛，都在这条宪法的范围之内；如何在法统与现实之间取舍，是新政府的难题。"
 TAI_security_council_power: "安理会大国责任"
 TAI_security_council_power_desc: "作为常任理事国，中华民国将在国际事务中承担更大的责任：它要在叙利亚、朝鲜、乌克兰与南海问题上表明立场，它的否决权将影响全世界的和平与战争。南京第一次必须以全球大国的视野思考问题。"
 TAI_global_recognition: "全面建交"
 TAI_global_recognition_desc: "与世界各国全面建立外交关系。半个多世纪以来，中华民国的邦交国最少时只剩十几个，外交官们在各国以「台北经济文化办事处」的名义工作；如今一百九十多个国家的大使在南京递交国书，外交孤立彻底结束。"
 TAI_un_peacekeeping: "维和部队"
 TAI_un_peacekeeping_desc: "派遣维和部队前往世界各地：南苏丹、马里、黎巴嫩与刚果。蓝盔部队让国军积累了海外行动的经验，也让世界看到一个负责任的中国；维和部队的医疗队与工兵连在当地赢得了口碑。"
 TAI_reward_old_allies: "回报老友邦"
 TAI_reward_old_allies_desc: "那些在最艰难时刻仍与中华民国站在一起的友邦，值得我们的回报：巴拉圭、危地马拉、伊斯瓦蒂尼、帕劳与图瓦卢等国，曾顶着北京的压力坚持与台北的邦交。南京为它们提供援助、贷款与奖学金，兑现「患难见真情」。"
 TAI_trade_superpower: "贸易大国"
 TAI_trade_superpower_desc: "统一后的中国是全球最大的贸易国：进出口总额占世界的六分之一，台湾的高科技出口与大陆的制造业出口合为一体。中华民国以世贸组织创始会员国的身份，推动更开放、更公平的多边贸易体制。"
 TAI_shape_world_order: "国际秩序的塑造者"
 TAI_shape_world_order_desc: "从规则的接受者，变成规则的制定者。在联合国、世贸组织、国际货币基金与气候谈判中，中华民国的声音举足轻重；它不追求称霸，而是要让国际秩序更能代表亚洲与发展中国家的利益。"
 TAI_america_policy: "对美政策"
 TAI_america_policy_desc: "美国是中华民国最长久的盟友：从抗战时的飞虎队、1954 年的共同防御条约到《台湾关系法》，华盛顿始终站在台北身后。但一个统一的中国，也可能是美国在世界上最大的竞争者。南京必须决定，与华盛顿保持怎样的距离。"
 TAI_russia_policy: "对俄政策"
 TAI_russia_policy_desc: "北方的邻居既是能源伙伴，也占据着我们的固有领土。俄罗斯的石油与天然气对中国的经济至关重要，四千多公里的边界需要和平；但外东北与唐努乌梁海的问题，始终是中华民国宪法与民族记忆中的一道伤口。"
 TAI_japan_policy: "对日政策"
 TAI_japan_policy_desc: "历史的伤痕与现实的利益交织在一起。八年抗战的记忆、南京大屠杀与钓鱼台的争议，与日本是第二大贸易伙伴、技术与投资的重要来源这一事实并存；台湾与日本深厚的民间友谊，或许能成为两国和解的桥梁。"
 TAI_sino_american_alliance: "中美同盟"
 TAI_sino_american_alliance_desc: "两个民主大国携手，维护太平洋的和平。1979 年美国与中华民国断交、废除共同防御条约；四十多年后，两国重新签订同盟条约，美国第七舰队可以停靠上海与高雄。这是冷战结束以来最重大的地缘政治变化。"
 TAI_independent_diplomacy: "独立自主外交"
 TAI_independent_diplomacy_desc: "中国人的事，由中国人自己决定。统一后的中华民国不再需要依附任何大国的保护，它要在美国、俄罗斯、欧洲与第三世界之间保持平衡；与华盛顿友好，但不结盟，这是戴高乐式的独立自主。"
 TAI_sino_russian_friendship: "中俄睦邻"
 TAI_sino_russian_friendship_desc: "搁置争议，共同开发西伯利亚的能源。中俄边界已在 2008 年完成勘定，重开领土问题只会带来战争；南京选择务实，与莫斯科签订新的睦邻条约，换取稳定的能源供应与北方边境的安宁。"
 TAI_outer_manchuria_question: "外东北问题"
 TAI_outer_manchuria_question_desc: "《瑷珲条约》与《北京条约》割去的一百多万平方公里土地，中华民国从未承认。民国时期的地图上，海参崴、伯力与库页岛都标在国界之内；国会以压倒性多数通过决议，重申对外东北的主权主张。"
 TAI_sino_japanese_reconciliation: "中日和解"
 TAI_sino_japanese_reconciliation_desc: "以德国与法国为榜样，中日两国走向历史和解。共同编写历史教材、设立青年交流基金、日本首相在南京大屠杀纪念馆献花；1972 年中日建交时搁置的问题，如今在两个民主国家之间获得了真正的解决。"
 TAI_defend_diaoyutai: "保钓"
 TAI_defend_diaoyutai_desc: "钓鱼台列屿是中华民国宜兰县头城镇的一部分。1970 年代的保钓运动曾让无数海外留学生走上街头；如今统一的中国有能力、也有决心收回这些岛屿。东京警告说，这将触发《美日安保条约》。"
 TAI_pacific_security_pact: "太平洋安全条约"
 TAI_pacific_security_pact_desc: "中、美、日、韩、澳与菲律宾共同维护西太平洋的和平，组成一个类似北约的集体安全组织。冷战时期的东南亚条约组织早已解散，如今一个更强大的太平洋同盟正在成形，而中国从被围堵的对象，变成了它的支柱。"
 TAI_lead_asia: "亚洲领袖"
 TAI_lead_asia_desc: "亚洲的事务，应由亚洲人主导。孙中山 1924 年在神户发表「大亚洲主义」演讲，期望亚洲国家以王道而非霸道相处；一百年后，统一的中华民国以经济与文化的影响力，而不是武力，成为亚洲的领袖。"
 TAI_siberian_energy: "西伯利亚能源合作"
 TAI_siberian_energy_desc: "中俄输油、输气管线全线贯通：东线管道从西伯利亚直达长三角，远东原油管道向大庆与天津供油。稳定的陆上能源供应，让中国不必再担心马六甲海峡被封锁；俄罗斯则找到了欧洲以外最大的买家。"
 TAI_reclaim_outer_manchuria: "收复外东北"
 TAI_reclaim_outer_manchuria_desc: "江东六十四屯的血债，海参崴的旧名——是时候讨回来了。1900 年，沙俄军队在黑龙江畔屠杀了数千名中国居民；外交的道路已经走到尽头，国军的装甲部队在边境集结，一场与核大国的战争一触即发。"
 TAI_east_asian_community: "东亚共同体"
 TAI_east_asian_community_desc: "中日韩自由贸易区与东亚共同体：效仿欧洲共同体的道路，从经济整合走向政治合作。三国的经济总量超过欧盟，供应链早已紧密相连；历史和解之后，东亚第一次有了建立共同体的政治基础。"
 TAI_korean_peninsula: "中朝友好条约"
 TAI_korean_peninsula_desc: "1961 年北京与平壤签订的《中朝友好合作互助条约》，是中共留下的外交遗产。对中国的经济援助，平壤早已习以为常。\n中华民国政府必须作出决定：与平壤妥协、与平壤决裂，还是与汉城站在一起。"
 TAI_nko_compromise: "与平壤妥协"
 TAI_nko_compromise_desc: "唇亡齿寒的道理，对中华民国同样适用。朝鲜一旦崩溃，数以百万计的难民将涌过鸭绿江，东北的重建将毁于一旦。一个稳定、可以谈判的北方邻国，好过一个崩溃的难民源头。我们愿意与平壤坐下来，只要它不再把核武器对准南京。"
 TAI_nko_break: "与平壤决裂"
 TAI_nko_break_desc: "金氏政权是中共的盟友，不是中华民国的盟友。半个多世纪以来，平壤靠北京的粮食与石油苟延残喘，如今供养它的政权已经倒台。北京能做到的，南京也能做到——只是方向相反：我们将断绝对金氏家族的一切默许，转而寻找人民军中愿意改变的人。"
 TAI_rok_alliance: "中韩同盟"
 TAI_rok_alliance_desc: "大韩民国是中华民国的老朋友：大韩民国临时政府曾在上海与重庆得到国民政府的庇护，两国直到 1992 年才断交。如今南京重新回到大陆，两个民主国家将重修旧好，携手结束半岛的分裂。"
 TAI_new_sino_korean_treaty: "新中朝条约"
 TAI_new_sino_korean_treaty_desc: "1961 年的《中朝友好合作互助条约》是中共留下的遗产，自动军事介入的条款让南京如坐针毡。新的条约以互不侵犯取代军事同盟，以正常贸易取代无偿援助：中华民国不再为平壤的冒险买单，但也不会主动颠覆它。"
 TAI_yalu_economic_belt: "鸭绿江经济带"
 TAI_yalu_economic_belt_desc: "丹东与新义州之间的贸易，从走私变成了生意。我们在鸭绿江沿岸开放互市、修建口岸设施，让朝鲜的矿产与劳动力合法地进入东北市场，也让辽宁的边境城市重新热闹起来。"
 TAI_nko_reform_opening: "推动朝鲜改革开放"
 TAI_nko_reform_opening_desc: "以中华民国自己的经验引导平壤走上改革之路：三七五减租与耕者有其田，让农民吃饱饭；加工出口区，让工厂有订单；渐进的政治开放，让政权不至于一夜崩溃。台湾走过的路，朝鲜也能走。"
 TAI_korea_peace_regime: "半岛和平机制"
 TAI_korea_peace_regime_desc: "以和平条约取代 1953 年的停战协定。南京、汉城、平壤、华盛顿与东京共同为半岛的和平背书：非军事区逐步裁撤，离散家属可以团聚，朝鲜的核计划接受国际查核。七十年的战争状态，终于可以画上句号。"
 TAI_nko_infiltration: "渗透朝鲜人民军"
 TAI_nko_infiltration_desc: "朝鲜人民军中，并不是每一位将领都对金氏家族死心塌地。饥荒年代的记忆、一轮又一轮的清洗，让不少军官暗中盘算后路。我们的联络人会带着美元、承诺与安全保证，去敲开这些人的门。"
 TAI_nko_defector_network: "脱北者网络"
 TAI_nko_defector_network_desc: "数以万计的脱北者经由东北越境，过去他们被中共遣返，如今国军的情报人员在延边与丹东等着他们。他们熟悉朝鲜的街道、军营与人际关系，是最好的情报来源，也是未来新政权的骨干。"
 TAI_nko_pro_china_faction: "扶植亲华派"
 TAI_nko_pro_china_faction_desc: "金正男长年旅居澳门，在平壤的元老与军方中仍有一批支持者。他喜欢迪士尼，也公开批评过世袭，会是一位比他弟弟更好打交道的领导人。我们要做的，是在合适的时候把他送回该去的地方。"
 TAI_pyongyang_coup: "平壤政变"
 TAI_pyongyang_coup_desc: "时机已到。忠于我们的部队将包围锦绣山太阳宫与劳动党中央大楼，切断平壤的广播与通信，宣布成立新政府，并请求中华民国保护。成败只在一夜之间，失败的人不会有第二次机会。"
 TAI_nko_reconstruction: "重建北韩"
 TAI_nko_reconstruction_desc: "粮食、电力与道路——新政府需要的，中华民国都能提供。第一批运粮船已经驶入南浦港，台电的工程师正在检修年久失修的电网。只要人民吃得饱、夜里有灯，新政府就能站稳脚跟。"
 TAI_rok_joint_command: "中韩联合司令部"
 TAI_rok_joint_command_desc: "两国参谋本部在汉城合署办公，建立统一的作战计划与通信体系，统一指挥半岛上的盟军。国军军官开始学习韩语，韩国军官则第一次踏进南京的陆军指挥参谋大学。"
 TAI_rok_intel_sharing: "中韩情报共享"
 TAI_rok_intel_sharing_desc: "国军在大陆接收的情报网，与韩国国情院经营多年的北方情报网连成一体。东北边境的监听站、脱北者的口供与韩方的卫星图像汇总到同一张桌上，平壤的一举一动都将无所遁形。"
 TAI_roc_forces_korea: "驻韩国军"
 TAI_roc_forces_korea_desc: "中华民国国军进驻大韩民国，与韩国国军共同守卫三八线。七十年前，志愿军从这里南下；如今，青天白日旗的部队站在了半岛的另一侧。这既是对盟友的承诺，也是对平壤的警告。"
 TAI_korea_northern_campaign: "联军北进"
 TAI_korea_northern_campaign_desc: "中韩联军越过三八线。1950 年的冬天，联合国军在长津湖与清川江被中共的人海推回；这一次，鸭绿江对岸再也没有援军，没有人会把我们推回去。半岛的统一就在眼前。"
 TAI_korea_reunified: "半岛统一"
 TAI_korea_reunified_desc: "平壤解放，朝鲜半岛在大韩民国的旗帜下重新统一。中华民国国军将继续驻守，保障新生的统一韩国。"
 TAI_asean_partnership: "中国—东盟伙伴关系"
 TAI_asean_partnership_desc: "南洋华侨的故乡，与东南亚各国共建繁荣。东南亚有三千多万华人，他们的祖先大多来自闽粤；中华民国在南海问题上以谈判取代对峙，与东盟签订行为准则，共同开发南海资源。"
 TAI_europe_partnership: "中欧伙伴关系"
 TAI_europe_partnership_desc: "与欧洲在贸易、科技与气候议题上全面合作。民主的中国让欧洲不再需要在价值与利益之间两难：欧盟与南京签订全面战略伙伴协议，伽利略与北斗导航系统兼容，两大经济体共同推动全球的碳中和目标。"
 TAI_africa_development: "援助非洲"
 TAI_africa_development_desc: "医疗队、农耕队与基础建设，与非洲共同发展。台湾的农耕队曾在非洲各国推广水稻种植，被当地人称为「绿色大使」；新的援助不附带债务陷阱，而是以透明的合同与本地就业为原则。"
 TAI_world_power: "世界强国"
 TAI_world_power_desc: "中华民国——一个统一、民主、繁荣的世界强国。从鸦片战争的屈辱、军阀混战的分裂、抗战的浴血与内战的离散中走来，中国人终于建立了一个让自己骄傲、也让世界尊重的国家。国父「振兴中华」的遗愿，至此实现。"
 TAI_outer_mongolia_question: "外蒙古问题"
 TAI_outer_mongolia_question_desc: "1946 年的外蒙古独立公投是在苏联驻军下举行的，中华民国虽一度承认，却在 1953 年废止了《中苏友好同盟条约》、撤回承认。以和平方式向乌兰巴托提出回归方案：高度自治、经济援助与蒙古族的文化保障。"
 TAI_south_china_sea_policy: "南海政策"
 TAI_south_china_sea_policy_desc: "南海诸岛自古为中国领土，太平岛驻军已经守护了半个多世纪。1946 年，中华民国海军的太平舰与中业舰接收了南沙与西沙群岛；统一之后，大陆在南沙修建的人工岛与太平岛一同纳入中华民国的管辖。"
 TAI_southwest_borders: "西南边界"
 TAI_southwest_borders_desc: "藏南、江心坡与帕米尔——英国殖民者留下的边界问题。中华民国从未签署任何承认这些边界的条约，1962 年中印战争之后，藏南依然在印度手中；新政府必须在法统与对印关系之间权衡。"
 TAI_reclaim_outer_mongolia: "收复外蒙"
 TAI_reclaim_outer_mongolia_desc: "和平的提议已遭拒绝，那就只能以武力解决。乌兰巴托拒绝了自治方案，蒙古人民党与民主党罕见地站在了一起；国军的部队从张家口与包头出发，跨越戈壁。这将是一场让全世界侧目的战争。"
 TAI_tannu_uriankhai: "唐努乌梁海"
 TAI_tannu_uriankhai_desc: "清代乌里雅苏台将军辖下的唐努乌梁海，1921 年在苏俄扶植下成立「图瓦人民共和国」，1944 年为苏联吞并。中华民国的地图上，它一直被画在国界之内；这片土地，我们没有忘记。"
 TAI_eleven_dash_line: "十一段线"
 TAI_eleven_dash_line_desc: "中华民国于 1947 年由内政部方域司划定的十一段线，是我们在南海主张的依据。后来的中共把它改为九段线，删去了北部湾的两段；如今南京恢复原本的十一段线，并重申对南沙、西沙与中沙群岛的主权。"
 TAI_south_tibet: "藏南问题"
 TAI_south_tibet_desc: "麦克马洪线是 1914 年西姆拉会议上英国与西藏代表私下划定的，从未得到中国任何一届政府的承认。藏南的达旺是六世达赖喇嘛的故乡；印度称之为阿鲁纳恰尔邦，并在那里驻有重兵。"
 TAI_kachin_and_pamir: "江心坡与帕米尔"
 TAI_kachin_and_pamir_desc: "滇缅未定界的江心坡，以及清末被英俄瓜分的帕米尔高原。民国时期的地图把江心坡与帕米尔都标为待定界；中共在 1960 年代与缅甸、阿富汗签订边界条约放弃了这些主张，中华民国却从未承认这些条约。"
 TAI_begonia_leaf: "秋海棠叶"
 TAI_begonia_leaf_desc: "从帕米尔到乌苏里江，从漠北到南沙，那片形如秋海棠叶的版图，是几代中国人心中的祖国。在台湾长大的孩子，课本上的地图就是这片秋海棠叶；如今它不再只是地图，而是中华民国实际管辖的疆域。"
