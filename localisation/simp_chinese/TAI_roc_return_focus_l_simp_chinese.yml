 TAI_sd_green_growth: "绿色发展"
 TAI_sd_green_growth_desc: "治理雾霾、恢复江河，让中国重见蓝天。"
 TAI_sd_social_china: "社会公正的中国"
 TAI_sd_social_china_desc: "民生主义与社会民主主义，在这里找到了共同的答案。"
 TAI_grand_coalition: "大联合政府"
 TAI_grand_coalition_desc: "没有任何政党获得过半数。为了国家的稳定，各大政党组成大联合政府。"
 TAI_gc_coalition_agreement: "联合执政协议"
 TAI_gc_coalition_agreement_desc: "各党派签署联合执政协议，确立施政纲领的最大公约数。"
 TAI_gc_cabinet_sharing: "内阁分配"
 TAI_gc_cabinet_sharing_desc: "按得票比例分配内阁部会。"
 TAI_gc_constitutional_court: "宪法法庭"
 TAI_gc_constitutional_court_desc: "设立宪法法庭，作为政治争议的最终仲裁者。"
 TAI_gc_national_unity: "举国一致"
 TAI_gc_national_unity_desc: "在重大问题上，朝野团结一致。"
 TAI_gc_pragmatic_reform: "务实改革"
 TAI_gc_pragmatic_reform_desc: "不问左右，只问是否有效。"
 TAI_gc_consensus_democracy: "协商民主"
 TAI_gc_consensus_democracy_desc: "在国会中建立跨党派协商机制。"
 TAI_gc_steady_progress: "安定中求进步"
 TAI_gc_steady_progress_desc: "稳定与发展兼顾。"
