 TAI_yalu_economic_belt_desc: "丹东与新义州之间的贸易，从走私变成了生意。"
 TAI_nko_reform_opening: "推动朝鲜改革开放"
 TAI_nko_reform_opening_desc: "以中华民国自己的经验——土地改革、出口加工区与渐进的政治开放——引导平壤走上改革之路。"
 TAI_korea_peace_regime: "半岛和平机制"
 TAI_korea_peace_regime_desc: "以和平条约取代 1953 年的停战协定。南京、汉城、平壤、华盛顿与东京，共同为半岛的和平背书。"
 TAI_nko_infiltration: "渗透朝鲜人民军"
 TAI_nko_infiltration_desc: "朝鲜人民军中，并不是每一位将领都对金氏家族死心塌地。"
 TAI_nko_defector_network: "脱北者网络"
 TAI_nko_defector_network_desc: "数以万计的脱北者经由东北越境。他们是最好的情报来源，也是未来政权的骨干。"
 TAI_nko_pro_china_faction: "扶植亲华派"
 TAI_nko_pro_china_faction_desc: "金正男长年旅居澳门，在平壤仍有一批支持者。他会是一位比他弟弟更好打交道的领导人。"
 TAI_pyongyang_coup: "平壤政变"
 TAI_pyongyang_coup_desc: "时机已到。忠于我们的部队将包围锦绣山太阳宫，宣布成立新政府，并请求中华民国保护。"
 TAI_nko_reconstruction: "重建北韩"
 TAI_nko_reconstruction_desc: "粮食、电力与道路——新政府需要的，中华民国都能提供。"
 TAI_rok_joint_command: "中韩联合司令部"
 TAI_rok_joint_command_desc: "两国参谋本部合署办公，统一指挥半岛上的盟军。"
 TAI_rok_intel_sharing: "中韩情报共享"
 TAI_rok_intel_sharing_desc: "国军的大陆情报网，与韩国国情院的北方情报网连成一体。"
 TAI_roc_forces_korea: "驻韩国军"
 TAI_roc_forces_korea_desc: "中华民国国军进驻大韩民国，与韩国国军共同守卫三八线。"
 TAI_korea_northern_campaign: "联军北进"
 TAI_korea_northern_campaign_desc: "中韩联军越过三八线。这一次，没有人会把我们推回去。"
 TAI_korea_reunified: "半岛统一"
 TAI_korea_reunified_desc: "平壤解放，朝鲜半岛在大韩民国的旗帜下重新统一。中华民国国军将继续驻守，保障新生的统一韩国。"
 TAI_asean_partnership: "中国—东盟伙伴关系"
 TAI_asean_partnership_desc: "南洋华侨的故乡，与东南亚各国共建繁荣。"
 TAI_europe_partnership: "中欧伙伴关系"
 TAI_europe_partnership_desc: "与欧洲在贸易、科技与气候议题上全面合作。"
 TAI_africa_development: "援助非洲"
 TAI_africa_development_desc: "医疗队、农耕队与基础建设，与非洲共同发展。"
 TAI_world_power: "世界强国"
 TAI_world_power_desc: "中华民国——一个统一、民主、繁荣的世界强国。"
 TAI_outer_mongolia_question: "外蒙古问题"
 TAI_outer_mongolia_question_desc: "1946 年的外蒙古独立公投，中华民国从未真正承认。以和平方式向乌兰巴托提出回归方案。"
 TAI_south_china_sea_policy: "南海政策"
 TAI_south_china_sea_policy_desc: "南海诸岛自古为中国领土，太平岛驻军已经守护了半个多世纪。"
 TAI_southwest_borders: "西南边界"
 TAI_southwest_borders_desc: "藏南、江心坡与帕米尔——英国殖民者留下的边界问题。"
 TAI_reclaim_outer_mongolia: "收复外蒙"
 TAI_reclaim_outer_mongolia_desc: "和平的提议已遭拒绝，那就只能以武力解决。"
 TAI_tannu_uriankhai: "唐努乌梁海"
 TAI_tannu_uriankhai_desc: "清代乌里雅苏台将军辖下的唐努乌梁海，1944 年为苏联吞并。这片土地，我们没有忘记。"
 TAI_eleven_dash_line: "十一段线"
 TAI_eleven_dash_line_desc: "中华民国于 1947 年划定的十一段线，是我们在南海主张的依据。"
 TAI_south_tibet: "藏南问题"
 TAI_south_tibet_desc: "麦克马洪线从未得到中国任何一届政府的承认。"
 TAI_kachin_and_pamir: "江心坡与帕米尔"
 TAI_kachin_and_pamir_desc: "滇缅未定界的江心坡，以及清末被英俄瓜分的帕米尔高原。"
 TAI_begonia_leaf: "秋海棠叶"
 TAI_begonia_leaf_desc: "从帕米尔到乌苏里江，从漠北到南沙，那片形如秋海棠叶的版图，是几代中国人心中的祖国。"
