l_simp_chinese:
 TAI_n_k0:0 "两岸关系的制度化"
 TAI_n_k0_desc:0 "「不统、不独、不武」不能只是一句口号。国安会、陆委会与外交、国防部门第一次被放进同一套决策流程，每一项两岸政策都要有预案、有责任人，也有退路。"
 TAI_n_k1a:0 "两岸热线与危机沟通机制"
 TAI_n_k1a_desc:0 "军方与海巡之间设立不经过媒体的专线，任何海空意外都能在一小时内有人接电话。热线的号码被写在一张塑封的卡片上，放进每一位值班官的口袋里。"
 TAI_n_k1b:0 "陆资与对陆投资审查"
 TAI_n_k1b_desc:0 "关键产业的陆资并购与对陆投资，由跨部会小组按产业别与金额逐案审查。审查的标准公开，申请人也终于知道自己为什么被退件。"
 TAI_n_k1c:0 "反渗透法与认知作战防制"
 TAI_n_k1c_desc:0 "境外势力透过资金、媒体与社群平台影响选举与舆论的手法被明文列管。第一批被起诉的案件里，有的人从头到尾以为自己只是在「做生意」。"
 TAI_n_k2a:0 "金马小三通与民间交流"
 TAI_n_k2a_desc:0 "金门与马祖的渡轮、水电与观光，让两岸的普通人在最近的海峡口岸互相认识。这里的商店，同时收新台币与人民币。"
 TAI_n_k2b:0 "两岸经贸的风险分散"
 TAI_n_k2b_desc:0 "对单一市场的依赖被明列为国安风险：厂商获得补助，把一部分订单与产线迁往东南亚、印度与墨西哥。不是脱钩，而是不把所有的鸡蛋放在同一个篮子里。"
 TAI_n_k2c:0 "国家安全法制现代化"
 TAI_n_k2c_desc:0 "国家机密保护法、经济间谍与关键基础设施的防护被一并修订。立法院的审议拖了十二个月，却也吵出了一套各方都肯承认的界线。"
 TAI_n_k3:0 "国家安全战略报告"
 TAI_n_k3_desc:0 "行政部门首次向国会提出四年一度的国家安全战略报告，写明威胁评估、优先事项与预算。各党的质询，第一次是围着同一份文件展开的。"
 TAI_n_k4l:0 "对话优先：重启协商机制"
 TAI_n_k4l_desc:0 "在不预设政治前提的原则下，邀请对岸恢复事务性协商：渔业、食品安全、观光与司法互助，一件一件谈。每签成一份协议，海峡上空的气氛就松动一分。"
 TAI_n_k4r:0 "威慑优先：提高冲突成本"
 TAI_n_k4r_desc:0 "政府宣示：任何武力的使用都将付出难以承受的代价。国防预算、民防与对外沟通同步升级，对岸的评估报告里，「速胜」两个字被画上了问号。"
 TAI_n_k5:0 "台海中线与灰色地带因应"
 TAI_n_k5_desc:0 "海巡署、空军与情报单位建立联合监控，对每一次越线、每一艘不明船只都留下证据与影像。灰色地带的冲突，被一条条记录在案，变成了国际社会看得见的事实。"
 TAI_n_k6:0 "两岸协议监督与公民共识"
 TAI_n_k6_desc:0 "任何两岸政治性协议，都要经过国会特别多数与公民投票的双重检验。蓝与绿第一次同意：重大决定，不能只靠一小群人在会议室里做。"
 TAI_n_f0:0 "不对称作战总纲"
 TAI_n_f0_desc:0 "国防总检讨确定：不与对手比数量，只比让对手付出的代价。小而分散、造价低廉、容易补给的装备，取代了军种争着要的「大平台」。"
 TAI_n_f1a:0 "岸基反舰飞弹量产"
 TAI_n_f1a_desc:0 "机动发射车、隐蔽的掩体与可以在公路上快速移动的发射阵地，让一枚飞弹的威胁，等于一整个舰队的威胁。生产线第一次排满了三班。"
 TAI_n_f1b:0 "无人机国家队"
 TAI_n_f1b_desc:0 "数十家中小企业组成联盟，量产侦察、自杀式与海上无人载具。大疆之外，一个信得过的供应链被建立了起来。"
 TAI_n_f1c:0 "全民防卫动员署"
 TAI_n_f1c_desc:0 "后备动员、民防与灾害防救整合到同一个机关。动员令发出之后，哪里需要多少人、哪条路可以走，都在一张共享的地图上。"
 TAI_n_f2a:0 "防空飞弹与反无人机网"
 TAI_n_f2a_desc:0 "天弓与爱国者构成的高空防线，加上肩射式飞弹与电子干扰器组成的低空防线。城市上空的天空被分成了好几层，每一层都有自己的守卫。"
 TAI_n_f2b:0 "国防科技自主链"
 TAI_n_f2b_desc:0 "关键零组件从国外供应商转为本地与友邦双来源。每一个「不能断」的零件，都被列进一张永远在更新的清单。"
 TAI_n_f2c:0 "后备部队编成改革"
 TAI_n_f2c_desc:0 "后备役不再是一个只在名册里存在的单位，而是按区域、按任务、按装备编组，每年固定集训。动员令一旦下达，后备役人员知道自己该去的营区。"
 TAI_n_f3:0 "战力保存与关键设施硬化"
 TAI_n_f3_desc:0 "机场、港口、指挥所与电力、通讯枢纽被加固、分散与备援。真正的打击不是第一天打得有多狠，而是第十天还能继续运作。"
 TAI_n_f4l:0 "离岛防务重整"
 TAI_n_f4l_desc:0 "金门、马祖、澎湖、东沙与太平岛的守备部队以「迟滞与消耗」为任务，补给站、坑道与港澳设施得到整修。离岛成了第一道、也是最需要被看见的警戒线。"
 TAI_n_f4r:0 "本岛纵深防御"
 TAI_n_f4r_desc:0 "兵力与装备集中于本岛的滩岸、机场与都会区，以纵深与机动换取时间。每一个乡镇的防卫计划，都先在沙盘上推演过一遍。"
 TAI_n_f5:0 "国防预算法定化"
 TAI_n_f5_desc:0 "国防经费占国内生产总值的比例，以法律规定一个下限，并建立由国会监督的采购公开机制。预算的数字不再是每年一次的政治交易。"
 TAI_n_f6:0 "联合防卫作战指挥部"
 TAI_n_f6_desc:0 "陆海空、后备、海巡与民防，在同一个作战指挥体系下受令。演习里第一次出现了「一张图、一个声音」，每一位指挥官都知道自己的左邻右舍是谁。"
 TAI_n_m0:0 "宪政改革委员会"
 TAI_n_m0_desc:0 "宪法的条文是二十年前的妥协。跨党派与公民代表组成的委员会，开始逐条检讨：总统与国会的关系、选制、人权的位阶。"
 TAI_n_m1a:0 "婚姻平权"
 TAI_n_m1a_desc:0 "大法官宣告现行民法违宪之后，立法院通过专法，同性伴侣可以合法登记结婚。登记的第一天，户政事务所前排满了带着花的人。"
 TAI_n_m1b:0 "年金改革"
 TAI_n_m1b_desc:0 "军公教、劳保与国保各自为政的退休制度被整合，替代率与缴费年限重新核算。没有人满意，但基金破产的倒数计时终于被拉长。"
 TAI_n_m1c:0 "国民参审与司法透明"
 TAI_n_m1c_desc:0 "重大刑案由法官与国民共同审理，判决书用白话文书写并在网上公开。许多人第一次读到一份读得懂的判决书。"
 TAI_n_m2a:0 "少子化对策与公共托育"
 TAI_n_m2a_desc:0 "生育津贴、育婴假与公共托育的名额同时增加。出生人数的曲线没有立刻回升，但年轻夫妇的账本上，「养小孩」第一次不再是赤字。"
 TAI_n_m2b:0 "长期照顾体系"
 TAI_n_m2b_desc:0 "社区的日间照护、居家服务与机构床位被连成一张网。全民健保是台湾的骄傲，长照则是它还没写完的下半章。"
 TAI_n_m2c:0 "居住正义"
 TAI_n_m2c_desc:0 "社会住宅、租金补贴与囤房税一起推出。台北的年轻人，终于有了一个除了「搬到新北」之外的选项。"
 TAI_n_m3:0 "多元族群与语言平等"
 TAI_n_m3_desc:0 "国语、闽南语、客语、原住民族语与新住民的语言，都被写进《国家语言发展法》。公车上的广播，从三种语言增加到了五种。"
 TAI_n_m4l:0 "双语国家与十二年国教"
 TAI_n_m4l_desc:0 "中小学开设英语沉浸式课程，大学推动全英授课。出国留学的学生不再是少数，回国的人带着一整个世界的视野。"
 TAI_n_m4r:0 "数位治理与数位发展部"
 TAI_n_m4r_desc:0 "身份证、报税、健保与选举公告，通通在一个入口办理。公民科技社群与政府共同维护一个开放原始码的平台。"
 TAI_n_m5:0 "地方创生与区域均衡"
 TAI_n_m5_desc:0 "中央与地方分享税收，偏乡的学校、诊所与小企业获得稳定的补助。东部与离岛，第一次不是「被支援的地方」，而是「有自己计划的地方」。"
 TAI_n_m6:0 "成熟而多元的民主"
 TAI_n_m6_desc:0 "选举会输会赢，政策会辩论，少数的权利也被写进了每一条法律。台湾的民主不再只是一种制度，而是一种每天都在发生的日常。"
 TAI_n_e0:0 "经济安全战略"
 TAI_n_e0_desc:0 "半导体、能源、粮食与关键矿物，被一并纳入经济安全清单。政府与企业第一次坐下来，把「什么不能断」一条条写在白板上。"
 TAI_n_e1a:0 "供应链重组与友岸外包"
 TAI_n_e1a_desc:0 "台商把一部分产线移到越南、印度与墨西哥，核心研发与先进制程仍留在岛内。供应链的地图，被重新画了一遍。"
 TAI_n_e1b:0 "能源安全与结构转型"
 TAI_n_e1b_desc:0 "液化天然气接收站、离岸风电与太阳能同时扩张，核能的未来交给公民讨论与公投。电力的数字，每个月都被公开讨论。"
 TAI_n_e1c:0 "水资源与产业用地"
 TAI_n_e1c_desc:0 "再生水厂、海水淡化与水库联通被写进长期预算。科学园区在评估新厂址时，第一个问题不再是税率，而是水。"
 TAI_n_e2a:0 "台美二十一世纪贸易倡议"
 TAI_n_e2a_desc:0 "在贸易便捷化、反腐败、中小企业与数位贸易等议题上，台美达成第一批协议。一份文件，写着两个不能彼此承认的伙伴。"
 TAI_n_e2b:0 "申请加入跨太平洋伙伴协定"
 TAI_n_e2b_desc:0 "台湾提出入会申请，并逐条检讨国内法规是否达到高标准。每一个会员国的回复，都被媒体当作一次小型的外交民调。"
 TAI_n_e2c:0 "台日经济伙伴"
 TAI_n_e2c_desc:0 "台日在半导体设备、观光与防灾上深化合作，两国企业组成研究与投资联盟。灾后的捐款与救援，是两国人民最直接的情谊。"
 TAI_n_e3:0 "先进制程的国家保护"
 TAI_n_e3_desc:0 "最先进的制程技术被列为国家核心关键技术，出口与海外设厂设上审查门槛。护国神山，也有了一个正式的护城河。"
 TAI_n_e4l:0 "五加二创新产业"
 TAI_n_e4l_desc:0 "亚洲硅谷、生技医药、绿能科技、智慧机械、国防航太，加上新农业与循环经济，成为重点产业。政策不再追着最热的题目跑，而是围着自己的优势布局。"
 TAI_n_e4r:0 "新创基金与中小企业"
 TAI_n_e4r_desc:0 "国家发展基金与创投共同投入种子轮，保证每一个值得一试的构想都有一次机会。新创社群的聚会，从一间咖啡厅挤进了三间。"
 TAI_n_e5:0 "区域研发与产业聚落"
 TAI_n_e5_desc:0 "新竹、台南、高雄与台中的研究机构与企业，形成分工明确的产业聚落。一座城市不必学所有的事，但每一座城市都要有一件做到最好的事。"
 TAI_n_e6:0 "韧性经济体"
 TAI_n_e6_desc:0 "遇到地震、台风、疫情或封锁，经济都有备用的方案。这座岛屿不再靠一两样出口活着，而是靠一整个会自己修复的网络。"
 TAI_n_i0:0 "国际参与总纲"
 TAI_n_i0_desc:0 "外交不再是「保邦交」一件事，而是一套有目标、有预算、有分工的整体。外交部、经贸办事处与民间团体，被放进同一个年度计划。"
 TAI_n_i1a:0 "欧台关系"
 TAI_n_i1a_desc:0 "欧洲议会通过友台决议，捷克、立陶宛与德国的议员代表团相继访台。欧洲对台湾的印象，从一个遥远的地名变成了一间具体的半导体工厂。"
 TAI_n_i1b:0 "台日海洋与安全对话"
 TAI_n_i1b_desc:0 "海巡、渔业与灾害救援的对话机制被制度化。两国的渔船在同一片海域作业，终于有了一份共同遵守的规矩。"
 TAI_n_i1c:0 "对美关系制度化"
 TAI_n_i1c_desc:0 "国会议员、行政部门官员与智库的往来，固定为每年一次的台美对话。美国国会里的友台连线，让「台湾关系法」不只是一份旧文件。"
 TAI_n_i2a:0 "中南美与加勒比友邦"
 TAI_n_i2a_desc:0 "农业、医疗团与奖学金，把一个远在地球另一端的小国，变成了许多邻居眼里的好朋友。邦交的数字起伏之间，台湾第一次学会了不靠金钱。"
 TAI_n_i2b:0 "太平洋岛国与东南亚伙伴"
 TAI_n_i2b_desc:0 "新南向的教育、医疗与产业合作，延伸到太平洋诸岛与东南亚的各个角落。侨生、移工与新住民，成了这些关系里最活跃的一环。"
 TAI_n_i2c:0 "国际组织的实质参与"
 TAI_n_i2c_desc:0 "世界卫生大会、国际民航组织与国际刑警组织的观察员席位，被重新提上议程。就算被挡在会议室外，台湾的专家仍然在场边与世界各国交换名片。"
 TAI_n_i3:0 "台湾可以帮忙"
 TAI_n_i3_desc:0 "口罩、疫苗、医疗团与灾后重建。「台湾可以帮忙，台湾正在帮忙」不再只是一句口号，而是一支一年里去过三十个国家的团队。"
 TAI_n_i4l:0 "数位外交与民间交流"
 TAI_n_i4l_desc:0 "社群平台上，驻外代表处与民间团体用多种语言讲述台湾的日常。每一份「台湾制造」的外销报告，附上了一张看得见的脸孔。"
 TAI_n_i4r:0 "民主国家联盟的参与"
 TAI_n_i4r_desc:0 "台湾受邀参加民主国家的论坛与对话，并分享选举、公民科技与抗疫的经验。受邀的资格，是民主本身。"
 TAI_n_i5:0 "软实力与国际能见度"
 TAI_n_i5_desc:0 "电影、音乐、饮食与设计，让世界第一次不是从新闻，而是从日常生活里认识台湾。珍珠奶茶与国家主权，被放在同一张桌子上谈论。"
 TAI_n_i6:0 "实质外交网络"
 TAI_n_i6_desc:0 "没有邦交的国家与有邦交的国家，在台湾眼里是同一张网上的不同节点。一个被正式承认的国家的数量固然重要，但被真心需要的程度，才是外交最后的成绩单。"
 TAI_n_b0:0 "安定与繁荣的执政纲领"
 TAI_n_b0_desc:0 "国民党重返执政，选票上写着两个字：安定。新政府的白皮书只有三章：经济、两岸、国际空间，每一章都附着时间表与负责的部长。"
 TAI_n_b1a:0 "内需振兴与出口并重"
 TAI_n_b1a_desc:0 "消费券、基础建设与出口退税同时推出。商店街的招牌一夜之间亮了起来，工厂的出货单也重新排满了三个月。"
 TAI_n_b1b:0 "两岸交流常态化"
 TAI_n_b1b_desc:0 "陆客、陆生与直航班次逐步扩大，海基会与海协会恢复定期会谈。机场的接机口，第一次有了两套语言的广播。"
 TAI_n_b1c:0 "财政纪律与赋税改革"
 TAI_n_b1c_desc:0 "公共债务设置上限，税基扩大、税率下调。财政部长的口头禅是：「今天省下的每一块钱，都是明天的底气。」"
 TAI_n_b2a:0 "中小企业与青年创业"
 TAI_n_b2a_desc:0 "低利贷款与「第一桶金」计划让二十几岁的创业者拿到了第一笔资金。夜市旁的共享办公室，一座接着一座开张。"
 TAI_n_b2b:0 "对陆经贸架构谈判"
 TAI_n_b2b_desc:0 "服务业与货品的开放清单逐项谈判，农渔产品设有保护条款。每一场谈判都有立法院与产业界的代表列席。"
 TAI_n_b2c:0 "公共债务与年金平衡"
 TAI_n_b2c_desc:0 "年金基金的精算报告每年公布，调整的幅度由跨党派小组审定。第一次，所有的政党都看过同一份数字。"
 TAI_n_b3:0 "国民党的青年化与现代化"
 TAI_n_b3_desc:0 "党内的候选人遴选、预算与党产被公开，青年党员第一次成为区域党部的主任。老党校的走廊里，第一次出现了社群媒体的海报。"
 TAI_n_b4l:0 "和平协议的探索"
 TAI_n_b4l_desc:0 "政府邀请双方学者与前官员组成非官方小组，探讨建立军事互信与和平框架的可能性。结论还不明朗，但桌子已经摆好了。"
 TAI_n_b4r:0 "有限交流下的安全底线"
 TAI_n_b4r_desc:0 "交流可以扩大，但关键基础设施、敏感科技与军事机密设有明确的红线。每一次对话之后，国安会议都会发布一份只有两页的评估。"
 TAI_n_b5:0 "区域经济整合的参与"
 TAI_n_b5_desc:0 "以双边协议与产业合作，绕开台湾被排除在大型区域协定之外的困境。台湾的名字，开始出现在越来越多东南亚工业园的招牌上。"
 TAI_n_b6:0 "安定繁荣的台湾"
 TAI_n_b6_desc:0 "出口强劲、物价平稳、失业率下降。街头的人们没有欢呼，只是在选举过后的早晨，照常上班。这大概就是安定最好的样子。"
 TAI_n_g0:0 "转型与自主的执政纲领"
 TAI_n_g0_desc:0 "民进党的执政纲领以「国家要转型，社会要和解」为题：能源、司法、教育、国防与外交，五大项目各有一份路线图。"
 TAI_n_g1a:0 "转型正义的延续"
 TAI_n_g1a_desc:0 "促进转型正义委员会公布不当党产的清册，档案馆里的卷宗被一页页数位化。有人说这是清算，有人说这是还债。"
 TAI_n_g1b:0 "能源转型与非核家园"
 TAI_n_g1b_desc:0 "离岸风电与太阳光电大举扩张，核电厂依序停机，天然气接收站赶着在冬天之前完工。电力公司的调度室里，第一次需要同时盯着风速和气温。"
 TAI_n_g1c:0 "前瞻基础建设计划"
 TAI_n_g1c_desc:0 "轨道、水环境、数位与城乡建设一起编入长期特别预算。中南部的工地，第一次比北部的工地更多。"
 TAI_n_g2a:0 "国防自主与潜舰国造"
 TAI_n_g2a_desc:0 "船厂、研究院与民间企业联手建造自己的潜舰与舰艇。下水典礼那天，船坞里的焊接火花，比烟火更让人动容。"
 TAI_n_g2b:0 "新南向政策"
 TAI_n_g2b_desc:0 "贸易、投资、人才与教育，一起指向东南亚、南亚与大洋洲。印尼语和越南语，成了大学里最热门的第二外语。"
 TAI_n_g2c:0 "劳动与社会福利的扩大"
 TAI_n_g2c_desc:0 "基本工资、劳动检查与托育补助同时提高。工会的代表第一次被邀请到行政院的预算会议上。"
 TAI_n_g3:0 "公民参与的制度化"
 TAI_n_g3_desc:0 "参与式预算、公民审议与线上提案平台，让一个社区里的小问题，也有机会走进行政部门的议程。公民科技社群与官员，在同一间会议室里写程序。"
 TAI_n_g4l:0 "主权象征的提升"
 TAI_n_g4l_desc:0 "国号、护照、对外名称与官方文件的写法被重新讨论，一部分团体要求更明确的主权宣示。街头的游行，同时有绿色的旗帜与对岸的警告。"
 TAI_n_g4r:0 "「中华民国台湾」的务实架构"
 TAI_n_g4r_desc:0 "以现行宪政体制为基础，对外强调民主、自由与现状。「我们不需要宣布独立，因为我们已经是一个主权国家」，成了国安文件里最常被引用的一句话。"
 TAI_n_g5:0 "民主国家联盟的深度参与"
 TAI_n_g5_desc:0 "台湾与民主国家共同举办选举观察、网络安全与供应链的合作演练。受邀的资格，是这个国家每四年都认真投一次票。"
 TAI_n_g6:0 "台湾共识"
 TAI_n_g6_desc:0 "民调里，「维持现状」与「守护民主」的比例创下新高。不论蓝绿，大多数人同意：这个社会的前途，由这个社会自己决定。"
 TAI_n_p0:0 "中间路线的执政纲领"
 TAI_n_p0_desc:0 "两大阵营都没有过半，第三势力成了组阁的关键。「不蓝不绿、务实改革」的纲领，被印成一本口袋书，放进每一位部长的外套。"
 TAI_n_p1a:0 "跨党派内阁"
 TAI_n_p1a_desc:0 "部长的名单来自四个政党与三位无党籍人士。内阁会议上的座位表，是用抽签决定的。"
 TAI_n_p1b:0 "国会议事改革"
 TAI_n_p1b_desc:0 "委员会的议事全程公开，政党协商的规则被写进议事规则。法案不再被「卡」在某个程序里过夜。"
 TAI_n_p1c:0 "务实的产业与科技政策"
 TAI_n_p1c_desc:0 "不押注某一个产业，而是为每一个有潜力的产业准备同样的工具：资金、人才与法规的沙盒。政府的工作，是把路铺平，而不是替人开车。"
 TAI_n_p2a:0 "政党协商机制"
 TAI_n_p2a_desc:0 "重大法案先交由各党团协商，协商的纪录向公众公开。立法院的走廊上，第一次可以看到不同党派的立委一起吃便当。"
 TAI_n_p2b:0 "两岸和平框架的第三条路"
 TAI_n_p2b_desc:0 "以「宪法」「现状」「民意」三个关键词，提出有别于蓝绿的两岸方案：不预设终点，但承诺不单方面改变现状。"
 TAI_n_p2c:0 "能源的折中方案"
 TAI_n_p2c_desc:0 "既不急着关闭核电，也不急着新建；在供电安全与减碳之间，用十年的时间表慢慢调整。折中的方案，让两个阵营都同样地不满意。"
 TAI_n_p3:0 "政党重组与第三势力的扩大"
 TAI_n_p3_desc:0 "关键少数的议席让一个小党拥有了不成比例的影响力，也让选民开始认真考虑「不投给两大党」这个选项。"
 TAI_n_p4l:0 "地方派系与基层治理"
 TAI_n_p4l_desc:0 "乡镇长、农会与水利会的网络，被纳入透明的预算与监督制度。基层的人情仍然重要，但它必须写进纪录。"
 TAI_n_p4r:0 "选制改革：联立式比例代表"
 TAI_n_p4r_desc:0 "政党得票与席次的距离缩小，小党终于有了稳定的立足点。选举日夜里，计票的数字少了很多「赢者全拿」的戏剧性。"
 TAI_n_p5:0 "务实的对外关系"
 TAI_n_p5_desc:0 "与美日欧的关系在专业部门之间推进，政治人物的曝光度反而降低。每一份贸易协议的文本，都在国会官网上能被一个中学生读到。"
 TAI_n_p6:0 "第三条路的成绩单"
 TAI_n_p6_desc:0 "有人说这是「最像一个国家的政府」，也有人说它没有灵魂。无论如何，这个政府证明了：在两大阵营之外，仍然有一种稳定的执政方式。"
 TAI_n_z0:0 "民主的第二个二十年"
 TAI_n_z0_desc:0 "二十年的选举之后，政党轮替不再是一场震荡，而是一种节奏。下一个问题是：民主要如何保持年轻？"
 TAI_n_z1a:0 "选举制度的再检讨"
 TAI_n_z1a_desc:0 "投票年龄、选区划分与候选人资格，在公民议会上逐项讨论。每一次修法，都先在一千名抽签选出的公民面前被拆开重看。"
 TAI_n_z1b:0 "宪政体制的定稿"
 TAI_n_z1b_desc:0 "总统与国会的关系、监察与考试的去留、人权的位阶，经过多年的修宪争论，终于有了一份各党都肯签字的版本。"
 TAI_n_z1c:0 "世代正义与社会契约"
 TAI_n_z1c_desc:0 "房价、年金、少子化与劳动条件，被放在同一份「世代契约」里讨论。年轻人第一次在预算审议上被当作一方，而不是一个标题。"
 TAI_n_strait_framework:0 "两岸政策的制度化"
 TAI_n_strait_framework_desc:0 "两岸政策有了程序，减少了因人而异的摇摆。"
 TAI_n_derisk:0 "经贸风险分散"
 TAI_n_derisk_desc:0 "出口的目的地更多，但一部分产能被用在转移上。"
 TAI_n_dialogue_first:0 "对话优先"
 TAI_n_dialogue_first_desc:0 "谈判与交流让局势更平静，但也让一部分人觉得不够强硬。"
 TAI_n_deterrence_first:0 "威慑优先"
 TAI_n_deterrence_first_desc:0 "社会明白冲突的代价，军队也更有信心。"
 TAI_n_greyzone:0 "灰色地带因应"
 TAI_n_greyzone_desc:0 "每一次越线都被记录，也让每一次试探更难得逞。"
 TAI_n_strait_consensus:0 "两岸共识机制"
 TAI_n_strait_consensus_desc:0 "重大决定经过国会与公民的双重检验，社会比较放心。"
 TAI_n_asym_doctrine:0 "不对称作战"
 TAI_n_asym_doctrine_desc:0 "小而分散的部队与装备更难被一击摧毁。"
 TAI_n_coastal_missiles:0 "岸基反舰飞弹"
 TAI_n_coastal_missiles_desc:0 "登陆舰队在抵达滩头之前，就要付出代价。"
 TAI_n_drone_team:0 "无人机国家队"
 TAI_n_drone_team_desc:0 "低成本的无人系统改变了战场的算术。"
 TAI_n_reserve_reform:0 "后备战力"
 TAI_n_reserve_reform_desc:0 "后备役人员平时就知道战时该去哪里。"
 TAI_n_hardened_infra:0 "关键设施硬化"
 TAI_n_hardened_infra_desc:0 "机场、港口与电力枢纽更难被一次性瘫痪。"
 TAI_n_joint_defense:0 "联合防卫指挥"
 TAI_n_joint_defense_desc:0 "各军种与民防共用一张作战地图。"
 TAI_n_lay_judges:0 "国民参审"
 TAI_n_lay_judges_desc:0 "人民看得见、也参与得上司法的过程。"
 TAI_n_childcare:0 "公共托育"
 TAI_n_childcare_desc:0 "年轻家庭愿意多养一个孩子。"
 TAI_n_plural_society:0 "多元族群的社会"
 TAI_n_plural_society_desc:0 "每一种语言都有自己的位子。"
 TAI_n_bilingual:0 "双语国家"
 TAI_n_bilingual_desc:0 "学生与世界的距离近了一点。"
 TAI_n_digital_gov:0 "数位治理"
 TAI_n_digital_gov_desc:0 "政务办理更快，也更透明。"
 TAI_n_mature_democracy:0 "成熟的多元民主"
 TAI_n_mature_democracy_desc:0 "输赢是常态，规则被各方接受。"
 TAI_n_econ_security:0 "经济安全"
 TAI_n_econ_security_desc:0 "关键物资有备案，企业也更敢投资。"
 TAI_n_friend_shoring:0 "友岸外包"
 TAI_n_friend_shoring_desc:0 "供应链更分散，也更能抵御意外。"
 TAI_n_energy_mix:0 "多元的能源结构"
 TAI_n_energy_mix_desc:0 "天然气、风电与太阳能，各自分担一部分。"
 TAI_n_chip_guard:0 "先进制程的护城河"
 TAI_n_chip_guard_desc:0 "技术领先被当作国家资产来保护。"
 TAI_n_five_plus_two:0 "五加二创新产业"
 TAI_n_five_plus_two_desc:0 "产业政策围绕自身的优势布局。"
 TAI_n_startup_fund:0 "新创基金"
 TAI_n_startup_fund_desc:0 "一部分资金被用来冒险。"
 TAI_n_resilient_economy:0 "韧性经济体"
 TAI_n_resilient_economy_desc:0 "经济遇到冲击，也能很快站起来。"
 TAI_n_intl_framework:0 "国际参与总纲"
 TAI_n_intl_framework_desc:0 "外交有了整体的计划。"
 TAI_n_intl_orgs:0 "国际组织参与"
 TAI_n_intl_orgs_desc:0 "即使在场边，也能被世界听见。"
 TAI_n_can_help:0 "台湾可以帮忙"
 TAI_n_can_help_desc:0 "一支乐于伸出援手的团队，换来了更多的朋友。"
 TAI_n_substantive_network:0 "实质外交网络"
 TAI_n_substantive_network_desc:0 "不是靠邦交的数字，而是靠真实的往来。"
 TAI_n_blue_mandate:0 "安定繁荣的纲领"
 TAI_n_blue_mandate_desc:0 "政策的重点放在可预期与稳定。"
 TAI_n_fiscal_discipline:0 "财政纪律"
 TAI_n_fiscal_discipline_desc:0 "预算有上限，也让投资人更放心。"
 TAI_n_limited_exchange:0 "有限交流"
 TAI_n_limited_exchange_desc:0 "交流在红线之内，安全与往来并存。"
 TAI_n_regional_integration:0 "区域经济整合"
 TAI_n_regional_integration_desc:0 "在大型协定之外，用双边与产业合作补位。"
 TAI_n_blue_prosperity:0 "安定繁荣"
 TAI_n_blue_prosperity_desc:0 "平稳的日子，是最好的政绩。"
 TAI_n_green_mandate:0 "转型与自主的纲领"
 TAI_n_green_mandate_desc:0 "政策带着改革的味道，也带着争议。"
 TAI_n_green_energy:0 "能源转型"
 TAI_n_green_energy_desc:0 "风电与太阳光电扩张，电力的结构正在换血。"
 TAI_n_forward_infra:0 "前瞻基础建设"
 TAI_n_forward_infra_desc:0 "长期的特别预算，把工地带到了更多的地方。"
 TAI_n_civic_participation:0 "公民参与"
 TAI_n_civic_participation_desc:0 "更多的声音走进决策的程序。"
 TAI_n_roc_taiwan_framework:0 "「中华民国台湾」架构"
 TAI_n_roc_taiwan_framework_desc:0 "不宣布独立，也不接受对现状的改变。"
 TAI_n_green_consensus:0 "台湾共识"
 TAI_n_green_consensus_desc:0 "社会对「现状」与「民主」有了共同的语言。"
 TAI_n_third_mandate:0 "中间路线的纲领"
 TAI_n_third_mandate_desc:0 "任何政策，都要先过两个阵营的门槛。"
 TAI_n_parliamentary_reform:0 "国会议事改革"
 TAI_n_parliamentary_reform_desc:0 "议事规则清楚了，法案走得更顺。"
 TAI_n_energy_compromise:0 "能源折中"
 TAI_n_energy_compromise_desc:0 "两边都不满意，但电没有断。"
 TAI_n_electoral_reform:0 "联立式选制"
 TAI_n_electoral_reform_desc:0 "票数与席次更接近，小党更有空间。"
 TAI_n_third_force_result:0 "第三条路"
 TAI_n_third_force_result_desc:0 "证明了在两大阵营之外，仍有稳定的治理。"
 TAI_n_second_twenty:0 "民主的第二个二十年"
 TAI_n_second_twenty_desc:0 "轮替成了节奏，而不是震荡。"
