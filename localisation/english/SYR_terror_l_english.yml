 SYR_t_title:0 "Radicalization index   §R[?global.SYR_terror_index|0]§! / 100"
 SYR_terror.1.a:0 "Crush them without mercy"
 SYR_terror.1.b:0 "Negotiate and divide them"
 SYR_terror.1.c:0 "We have no time for this now"
 SYR_terror.1.d:0 "The civil war has broken Syria's balance of power, and more and more territory lies beyond the government's reach. Jihadists have set up training camps in ungoverned countryside, handing out relief and weapons to locals and recruiting foreign fighters from neighboring countries.\n\nIntelligence officers warn that if this goes on, these scattered groups will merge into a real force. Current terrorism index: §R[?global.SYR_terror_index|0]§!/100."
 SYR_terror.1.t:0 "Extremists Gain Ground"
 SYR_terror.2.a:0 "Concentrate forces for a full sweep"
 SYR_terror.2.b:0 "Seal the border and cut supplies"
 SYR_terror.2.c:0 "Leave them to our rivals"
 SYR_terror.2.d:0 "Foreign fighters are pouring across the border into the zone where Syria meets Iraq, bringing money, weapons and extremist propaganda. Several local militias have already sworn allegiance to the same leader.\n\nThis is no ordinary insurgency any more. Current terrorism index: §R[?global.SYR_terror_index|0]§!/100. Unless they are stopped, they will soon proclaim a state."
 SYR_terror.2.t:0 "Jihadists Cross the Border"
 SYR_terror.3.a:0 "Another dangerous enemy"
 SYR_terror.3.d:0 "An extremist force has suddenly seized large areas of eastern Syria and western Iraq and proclaimed an \"Islamic State.\" The chaos of civil war and years of radicalization have let it break through.\n\nNeighbors and great powers issue condemnations, and the regional situation changes overnight."
 SYR_terror.3.t:0 "The Islamic State Is Proclaimed"
 SYR_terror.4.a:0 "The war enters a new phase"
 SYR_terror.4.d_fsa:0 "The succession struggle after Hafez al-Assad's death has finally spun out of control. An opposition built around defected officers and exiled politicians gathers around Damascus under the banner of the \"Free Syrian Army\", demanding an end to the Assad family's rule.\n\nThe government calls it a foreign-instigated rebellion, but many soldiers are quietly handing in their weapons."
 SYR_terror.4.d_nus:0 "The Salafist networks the government tried to suppress have not submitted. Around Idlib, a Salafi-jihadist force proclaims the \"Al-Nusra Front\" and declares war on the regime.\n\nThey accept no secular political solution and refuse to cooperate with other opposition groups."
 SYR_terror.4.t_fsa:0 "Rebels rise as the \"Free Syrian Army\""
 SYR_terror.4.t_nus:0 "Salafist fighters rise as the \"Al-Nusra Front\""
 SYR_terror.5.a:0 "The battlefield grows more complex"
 SYR_terror.5.d:0 "In the first months of the civil war the rebels fought under their own banners while officers and local leaders slipped away in the chaos. Now, around Damascus and in the Idlib area, two new armed groups have declared themselves: the \"Free Syrian Army\", led by defected officers, and the Salafist \"Al-Nusra Front\".\n\nThey are enemies of the government and also compete for ground with the original rebels. The war is no longer fought between two sides."
 SYR_terror.5.t:0 "A Multi-Sided War: New Armed Groups Appear"
 SYR_terror.6.a:0 "The factions have taken shape"
 SYR_terror.6.d_fsa:0 "Many local commanders cannot accept the Al-Nusra Front's hard line. Defected officers and exiled politicians gather around Damascus and proclaim the \"Free Syrian Army\", calling for free elections once the war is over.\n\nIt opposes the government and also refuses to recognize the Al-Nusra Front's authority."
 SYR_terror.6.d_nus:0 "The divisions inside the Free Syrian Army have finally come into the open. Fighters dissatisfied with the moderate line leave with their weapons and, around Idlib, proclaim the Salafi-jihadist \"Al-Nusra Front\".\n\nIt refuses to take orders from the Free Syrian Army and begins recruiting foreign fighters of its own."
 SYR_terror.6.t_fsa:0 "Moderates Break Away: The Free Syrian Army Is Founded"
 SYR_terror.6.t_nus:0 "Extremists Break Away: The Al-Nusra Front Is Founded"
 SYR_terror_category:0 "Civil War and Counter-Terrorism"
 SYR_terror_category_desc:0 "The longer the civil war drags on and the more the country fractures, the easier it is for extremists to take root. At §R100§! the Islamic State (ISIS) erupts in eastern Syria and western Iraq. The panel above shows the index, this month's breakdown and who controls Syria."
 SYR_terror_tt_factions:0 "New factions appear on the battlefield"
