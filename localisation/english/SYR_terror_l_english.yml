 SYR_dec_terror_amnesty:0 "Amnesty for Moderate Militias"
 SYR_dec_terror_amnesty_desc:0 "Offer pardons and reconstruction funds to local armed groups willing to lay down their weapons, cutting them off from the jihadists.\nCurrent terrorism index: §R[?global.SYR_terror_index|0]§!."
 SYR_dec_terror_border:0 "Seal the Border Corridors"
 SYR_dec_terror_border_desc:0 "Close the corridors through which foreign fighters and weapons flow in. This ties down large numbers of troops for a long time.\nCurrent terrorism index: §R[?global.SYR_terror_index|0]§!."
 SYR_dec_terror_crackdown:0 "Crush Extremist Strongholds"
 SYR_dec_terror_crackdown_desc:0 "Concentrate forces against the jihadists' bases and supply lines. The price is resentment among civilians and local militias.\nCurrent terrorism index: §R[?global.SYR_terror_index|0]§!."
 SYR_dec_terror_recruit:0 "Expand Jihadist Recruitment"
 SYR_dec_terror_recruit_desc:0 "Call on jihadist networks and foreign fighters everywhere. Manpower will grow, but so will radicalization, bringing ISIS closer to eruption.\nCurrent terrorism index: §R[?global.SYR_terror_index|0]§!."
