 SYR_t_stagedesc_0:0 "The civil war has just begun and extremists are still on the fringe."
 SYR_t_stagedesc_1:0 "Training camps and foreign fighters appear in ungoverned countryside."
 SYR_t_stagedesc_2:0 "Armed groups are merging; a little more and something big will happen."
 SYR_t_stagedesc_3:0 "An offensive proclaiming a \"state\" could be launched at any time."
