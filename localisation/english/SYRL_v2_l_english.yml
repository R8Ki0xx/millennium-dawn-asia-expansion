l_english:
 SYRL.1.a:0 "Assure the officer corps that the army will not be touched"
 SYRL.1.b:0 "Do not stop; keep going"
 SYRL.1.d:0 "The President finishes reading the \"back to the roots\" report at a meeting of the party's regional leadership, and the room is silent for a long time. Older secretaries study the papers in their hands while younger cadres exchange glances under the table. Afterwards some come up to shake his hand and some do not.\n\nSeveral generals of the officer corps say privately that so long as the army is left alone, they are willing to watch and see. His advisers warn that the faster he moves, the more undercurrents he will face."
 SYRL.1.t:0 "The Party's Reaction: He Wants to Give the Party Back"
 SYRL.10.a:0 "Invite everyone, including moderate Islamists"
 SYRL.10.b:0 "Invite only the secular opposition"
 SYRL.10.d:0 "At the opening ceremony a writer who spent eight years under house arrest says into the microphone, \"Today, for the first time, I do not have to lower my voice.\" There is laughter in the hall, and some wipe away tears.\n\nThe preparatory committee asks the President: there are several moderate Islamists on the list, should they be invited?"
 SYRL.10.t:0 "The National Dialogue"
 SYRL.11.a:0 "A ceasefire with all armed groups"
 SYRL.11.b:0 "Talk only to the moderates and keep fighting the extremists"
 SYRL.11.d:0 "The President reads the ceasefire plan on television without using the word \"rebels\"; he says \"our compatriots\" instead. A few hours later the opposition's front-line commander replies through intermediaries: willing to talk, but demanding international monitoring.\n\nArmy hardliners object, calling it weakness; the foreign ministry says it is the first time in the civil war that someone has laid down arms first."
 SYRL.11.t:0 "The Left-Wing Ceasefire"
 SYRL.12.a:0 "The charter takes effect"
 SYRL.12.d:0 "At the signing ceremony of the charter, representatives of each sect and party sign the text in turn. Some sign with their left hand, some draw a cross beside their signature, and some leave a thumbprint.\n\nArticle one reads: \"The sovereignty of the state belongs to the people, and no person, family, sect or party may appropriate it.\""
 SYRL.12.t:0 "The National Charter"
 SYRL.13.a:0 "Syria, a new beginning"
 SYRL.13.d:0 "The President reads the new national program to the Assembly. [SYRL_f_pol] [SYRL_f_eco] [SYRL_f_for]\n\nA national leadership council, term limits, an independent army, a questionable parliament and a civil state with equal sects: for the first time in fifty years the Ba'ath does not need fear to prove its legitimacy. A new page in Syrian history is opening, provided nobody tears it out."
 SYRL.13.t:0 "The New Ba'athist Republic"
 SYRL.14.a:0 "Respond firmly: the resources belong to the people"
 SYRL.14.b:0 "Step back: promise to protect legitimate investment"
 SYRL.14.d:0 "On the day the nationalization decree is published, several foreign oil firms pull out their drilling crews, Gulf ambassadors are recalled, and Wall Street analysts predict a higher \"Syria risk premium\". At home, oil workers set off firecrackers on the well sites.\n\nThe foreign ministry offers two responses: a firm reply, or a step back by promising to protect foreign investors' legitimate rights."
 SYRL.14.t:0 "Nationalized Oil and Water: Reactions from the Gulf and the West"
 SYRL.15.a:0 "Support the political and armed struggle of the factions"
 SYRL.15.b:0 "Focus on refugee rights and diplomacy"
 SYRL.15.d:0 "The Damascus conference opens amid wrangling among the factions: some demand armed struggle, some favour diplomatic negotiation, some refuse to attend at all. In his opening address the President says only one sentence: \"Our duty is to give refugees legal dignity, not new gravestones.\""
 SYRL.15.t:0 "The Palestinian Cause"
 SYRL.16.a:0 "Invite the clerics to take part in curriculum review"
 SYRL.16.b:0 "Hold firm: no concessions"
 SYRL.16.d:0 "Several of Damascus's great mosques criticize the new curriculum in Friday sermons, saying it \"plants doubt in children's hearts\". The education minister sends the textbooks to every preacher and invites them to curriculum review meetings.\n\nThe President is told that parents in some provinces fear a confrontation between faith and secularism may be coming."
 SYRL.16.t:0 "Secular Compulsory Education: The Clerics React"
 SYRL.2.a:0 "Confiscate everything"
 SYRL.2.b:0 "Settle: return part of it, the family gives up control"
 SYRL.2.d:0 "When the verdict reaches its third page someone in the gallery draws a quiet breath: the telecoms company confiscated, the duty-free concessions revoked, billions of dollars in assets frozen. The name on the verdict is the President's cousin.\n\nSpontaneous marches appear in the streets, people carrying the President's portrait; meanwhile several retired officers and businessmen leave Damascus on night flights. The finance minister says the money is enough to pay teachers for two years."
 SYRL.2.t:0 "The Reckoning with the Family Magnates"
 SYRL.3.a:0 "Arrest him and purge the Guard's officers"
 SYRL.3.b:0 "Negotiate: let him go into exile with dignity"
 SYRL.3.c:0 "Let the Guard choose: Syria slides into civil war"
 SYRL.3.d:0 "At four in the morning the defense minister calls: several brigades of the Republican Guard are massing toward Damascus, and Maher al-Assad demands to \"talk face to face\" with the President. His demand is simple: end the reckoning and restore the family's command of the army.\n\nThe presidential guard has four hundred men and the garrison infantry brigade's attitude is unclear. This is no ordinary coup but a vote on the whole \"back to the roots\" line."
 SYRL.3.t:0 "Ultimatum: The Republican Guard"
 SYRL.4.a:0 "Give them honours and posts in exchange for cooperation"
 SYRL.4.b:0 "Withdraw their privileges and treat everyone alike"
 SYRL.4.d:0 "At the farewell dinner the old defense minister raises his glass and says three words: \"Take care.\" Nobody applauds. His office is empty the next day, with a military wristwatch on the desk and a note: \"For the young ones.\"\n\nThe silence of the elders unsettles more than any protest could. They still have countless protégés and old comrades in the army, the security services and the local party organizations."
 SYRL.4.t:0 "The Silence of the Elders"
 SYRL.5.a:0 "Side with the technocrats: rule by experts"
 SYRL.5.b:0 "Side with the left: back to socialism"
 SYRL.5.c:0 "Compromise: everyone gives ground"
 SYRL.5.d:0 "On day one the elders speak, stressing that \"stability comes above all\". On day two the bureaucrats produce five years of economic data and demand \"rule by experts\". On day three left-wing delegates step up to the podium shouting \"socialism is not a slogan\". The applause grows less and less unanimous.\n\nThe President comes down from the rostrum and stands in the middle of the hall. The party's future will be set by what he says."
 SYRL.5.t:0 "Party Congress: A Three-Way Struggle"
 SYRL.6.a:0 "Accept: seven years, renewable once"
 SYRL.6.b:0 "Postpone: it takes effect only from the next term"
 SYRL.6.d:0 "Long queues form at the polling stations. Television broadcasts the count live: more than eighty percent in favour, a turnout rarely seen in thirty years. A few elders abstain in the assembly but nobody opposes openly.\n\nForeign embassies send congratulations, while domestic commentators ask: what will be the next thing to be limited?"
 SYRL.6.t:0 "The Term-Limits Referendum"
 SYRL.7.a:0 "Give them more time and compensation"
 SYRL.7.b:0 "Set a deadline: dismissal if they miss it"
 SYRL.7.d:0 "The Ministry of Defense orders that the Republican Guard be placed under unified command. The Guard commander replies with a \"technical memorandum\" saying equipment and personnel need time to be handed over. Three weeks pass and not one brigade has moved.\n\nThe officers are waiting for a signal: is the President serious, or only testing?"
 SYRL.7.t:0 "The Republican Guard Refuses Orders"
 SYRL.8.a:0 "Launch a joint committee with Iraq"
 SYRL.8.b:0 "Economic only: a customs and currency union"
 SYRL.8.d:0 "Baghdad answers the invitation, and Cairo and Tripoli send observers. Old people in Damascus remember the cheering of 1958; the young care more about visas and tariffs.\n\nThe foreign ministry proposes two plans: a joint committee with Iraq to explore political unification, or starting with the economy and talking only of a customs and currency union."
 SYRL.8.t:0 "The Echo of Arab Unity"
 SYRL.9.a:0 "Full citizenship and recognition of Kurdish-language teaching"
 SYRL.9.b:0 "Citizenship first, the language question in stages"
 SYRL.9.d:0 "In a square in Hasakah thousands of Kurds queue for new identity cards. A seventy-year-old man holding a yellowed 1962 document says, \"We have waited forty years.\"\n\nAnkara issues a statement calling it \"creating new trouble on the border\". Troops on the northern border are told to show restraint."
 SYRL.9.t:0 "Kurdish Citizenship"
 SYRL_arab_socialism_desc:0 "Arab socialism is neither a copy of Moscow nor of Cairo. Party theorists reassemble the writings of Aflaq and Bitar: socialism exists so that every Arab can live with dignity, and the state must protect labour rather than become the new landlord. From here, party economic policy gets a floor that differs from Soviet-style planning."
 SYRL_arab_socialism_idea:0 "Arab Socialism"
 SYRL_arab_socialism_idea_desc:0 "The state protects labour but does not replace it."
 SYRL_arab_unity_desc:0 "The 1958 union with Egypt lasted only three years, but the feeling that \"Arabs can stand together\" stayed in the hearts of generations. This line advocates staged unity: first customs and currency union, then joint defence, and only last political integration. Baghdad, Tripoli and Cairo all receive an invitation from Damascus."
 SYRL_arab_unity_idea:0 "Staged Arab Unity"
 SYRL_arab_unity_idea_desc:0 "Customs, currency, defence, politics, one step at a time."
 SYRL_army_prof_idea:0 "Professional Army"
 SYRL_army_prof_idea_desc:0 "Promotion is by examinations and battle records, not background or family."
 SYRL_baath_congress_desc:0 "For the first time in a decade, delegates to the party congress are not appointed from above but elected by the rank and file with more candidates than seats. Three voices fill the hall: elders who defend \"stability first\", bureaucrats who advocate \"rule by experts\", and the left demanding a \"return to socialism\". The President sits on the rostrum knowing this meeting will decide the party's next ten years."
 SYRL_baath_ideals_3:0 "The Ba'ath Reborn"
 SYRL_baath_ideals_3_desc:0 "The party belongs to no family, and unity, freedom and socialism are again promises that can be tested."
 SYRL_banks_idea:0 "State Banking System"
 SYRL_banks_idea_desc:0 "Agricultural, housing and small-business banks."
 SYRL_charter_idea:0 "National Charter"
 SYRL_charter_idea_desc:0 "No sect or party may amend it alone."
 SYRL_civil_state_desc:0 "The \"civil state\" is written into the constitution's preamble: all citizens, regardless of sect, ethnicity or gender, are equal before the law, and the state no longer speaks in the name of any sect. This does not marginalize religion; it means religion is no longer used as a bargaining chip of power."
 SYRL_collective_idea:0 "National Leadership Council"
 SYRL_collective_idea_desc:0 "Major decisions need a majority: slower, and less prone to extremes."
 SYRL_collective_leadership_desc:0 "The President announces a \"National Leadership Council\": the President, the prime minister, the speaker, the party's secretary-general and the heads of the army and security services sit together, and major decisions need a majority. It is unprecedented in Syria: the President voluntarily puts part of his power around a table, and the price is slower decisions that are also less likely to go to extremes."
 SYRL_council_power_desc:0 "The People's Assembly finally gets the power to review the budget, to question ministers and to hold a vote of confidence in the prime minister. For the first time, ministers must answer deputies' questions on live television. The assembly is no longer a rubber stamp, though it is far from a Western parliament; it is feeling out a place between the two."
 SYRL_depoliticize_army_desc:0 "The army has been the Ba'ath's party members, the family's bodyguard and the regime's last insurance. The President orders that serving officers may not hold party posts, the Republican Guard be placed under the Ministry of Defense, and promotions depend on examinations and battle records. For the first time, officers must write their own answer to \"who defends this country\"."
 SYRL_end_dynasty_desc:0 "\"Family politics\" is the hardest subject for the Ba'ath to speak about. The President decrees that his relatives may not hold senior posts in the army, the security services or state enterprises, and current holders have two years to hand over. It is a purge aimed at his own people and the guarantee of the whole line: if even the family will not be touched, \"back to the roots\" is just a slogan."
 SYRL_euphrates_basin_desc:0 "Since the Tabqa Dam was completed, the Euphrates basin has never been developed systematically. A new basin authority coordinates water, irrigation, power stations and resettlement, linking the grain and cotton areas of Raqqa, Deir ez-Zor and Hasakah. It is the biggest civilian project in eastern Syria and the first step towards narrowing the east-west gap."
 SYRL_five_year_plan_desc:0 "The Planning Commission presents a new five-year plan whose targets are not steel output but jobs, grain, power and water, and export processing zones. On the rural cooperatives line the emphasis is machinery, storage and processing; on the state industry line it is petrochemicals, textiles and defence support. Every province gets its own targets, and its own responsibility."
 SYRL_fork_eco_in:0 "State industry is back on its feet."
 SYRL_fork_eco_pe:0 "Rural cooperatives have taken root."
 SYRL_fork_for_ar:0 "The door to Arab unity is open."
 SYRL_fork_for_na:0 "Non-alignment is now the grain of Syrian diplomacy."
 SYRL_fork_none:0 ""
 SYRL_fork_pol_pl:0 "The party remains the largest, but must now win its majority at the polls."
 SYRL_fork_pol_pr:0 "There is still one party, but one that is willing to be questioned by its own members."
 SYRL_free_unions_desc:0 "Trade unions and peasant federations change from \"party transmission belts\" into the members' own organizations: officials are elected by members, collective bargaining is legal, and strikes have a legal procedure. State-firm managers learn to sit down with union representatives instead of calling the security services."
 SYRL_housing_idea:0 "Public Housing"
 SYRL_housing_idea_desc:0 "Rents are capped at a quarter of household income."
 SYRL_internal_democracy_desc:0 "This line believes the party need not be balanced by other parties but corrected by democracy within itself. Secretaries at every level are elected by members with more candidates than posts, the Central Committee publishes its budget, and criticism and self-criticism return as institutions. It is the \"one-party reform\" line: there is one party, but it must be willing to be questioned by its own members."
 SYRL_iraq_reconcile_desc:0 "The Syrian and Iraqi Ba'ath split in 1966 and have denounced each other for decades, one calling the other \"traitors\" and the other calling it \"tyrants\". This time Damascus sends a delegation first: party disagreements are left to the party, and the border, water and pipelines between the two countries should no longer be political hostages."
 SYRL_kurdish_citizenship_desc:0 "The special 1962 census in Hasakah stripped hundreds of thousands of Kurds of citizenship; they had no identity cards, could not attend university, buy property or travel abroad. Now the government announces that their citizenship is restored and that Kurdish becomes one of the languages of instruction. Ankara, across the border, is very unhappy."
 SYRL_land_reform_desc:0 "The 1958 land reform gave hundreds of thousands of peasants land for the first time, but later contracts and privileges gradually concentrated it again. This time the government uses cooperatives to transfer idle land from large landowners to the landless, guaranteeing irrigation and seed. Industrialization waits a step while the countryside is secured: this is the \"rural cooperatives\" line."
 SYRL_left_ceasefire_desc:0 "The civil war goes on, but the President decides to extend a hand first: an unconditional ceasefire, humanitarian corridors under international monitoring, and amnesty for all rebel fighters who have not committed grave crimes. The plan unsettles both the opposition and hardliners inside the regime, but gives people outside the battlefield a visible way out."
 SYRL_makhlouf_trial_desc:0 "Damascus's biggest companies, in telecoms, duty-free shops and oil services, are registered in the names of the President's cousins. Prosecutors are told to open the books: tax evasion, monopolies, land seizures. The trial is held in a courthouse beside the palace, its gallery full of reporters. The public cheers, while others make telephone calls late at night."
 SYRL_media_reform_desc:0 "National media reform creates an independent media regulatory commission, and the board of the state broadcaster is elected by parliament. Private radio and online outlets obtain legal licences on one condition: responsibility for libel. Information no longer flows from the palace to the public but between the two."
 SYRL_merit_cadres_desc:0 "The party schools reopen and cadre selection no longer depends on background but on exams, results and public assessment. A group of engineers, economists and young officers is promoted to provincial posts. Veteran members complain that \"the rules have changed\"; the young see party membership for the first time as a real ladder."
 SYRL_minorities_council_desc:0 "The \"Council for Religious and Ethnic Equality\" is composed of representatives of Sunnis, Alawites, Christians, Druze, Ismailis, Kurds and Armenians, and every law that concerns minority groups must pass it first. For the first time in Syria the word \"minority\" does not mean \"ward\"."
 SYRL_national_charter_desc:0 "The \"National Charter\" is written by a drafting committee produced by the national dialogue, and no sect or party may amend it alone. It sets out citizens' basic rights, the state's basic institutions and the basic limits of power. The text is long, but the line that moves people most is in the preamble: \"Syria belongs to all who live in it.\""
 SYRL_national_dialogue_desc:0 "The President convenes a \"national dialogue\" in the Assembly building and invites figures from inside and outside the party: writers under house arrest, lawyers back from exile, mosque imams, church bishops, Kurdish and Druze representatives. The hall is loud, but nobody walks out, which is already the best result in more than ten years."
 SYRL_nationalize_banks_desc:0 "Banking and insurance come under state control, with dedicated agricultural, housing and small-business banks. Private bankers no longer decide who gets credit; the state decides to whom money is lent. Capital-flight alarms ring for a few months, but deposits then return because people find state-bank interest rates more stable."
 SYRL_new_republic_desc:0 "The President reads the new national program to the Assembly: the Ba'ath belongs to the people, not to any one family. A national leadership council, term limits, an independent army, a questionable parliament, a civil state with equal sects: for the first time in fifty years the Ba'ath does not need fear to prove its legitimacy. A new page in Syrian history is opening, provided nobody tears it out."
 SYRL_nonaligned_desc:0 "Damascus took sides in the Cold War and paid for it afterwards. The new principle is simple: join no military bloc, sign no exclusive agreement with any great power, and open the door to every country willing to do business. Non-alignment is not an excuse for neutrality but a way for Syria to keep the maximum bargaining space among the great powers."
 SYRL_nonaligned_idea:0 "Non-Aligned Diplomacy"
 SYRL_nonaligned_idea_desc:0 "The door is open to every country willing to do business."
 SYRL_npf_pluralism_desc:0 "The National Progressive Front has long been the Ba'ath's foil. Now the Front's Communists, Nasserists and Socialist Unionists receive independent charters, newspapers and nomination rights, and the Ba'ath no longer has a fixed quota of parliamentary seats. This is the \"multi-party competition\" line: the Ba'ath remains the biggest party, but must learn to win a majority at the polls."
 SYRL_oil_idea:0 "Public Ownership of Resources"
 SYRL_oil_idea_desc:0 "Oil, gas and water belong to all the people."
 SYRL_oil_water_desc:0 "Oil, natural gas and the water rights of cross-border rivers are declared the property of the whole people; any foreign extraction contract needs parliamentary approval, and a third of revenues go into a national regional balance fund. Gulf states and Western oil companies are not pleased, but at home there is cheering."
 SYRL_palestine_cause_desc:0 "The Ba'ath's first word is \"unity\", and the greatest wound in that unity is Palestine. The party puts the Palestinian question back at the centre of diplomacy: not for war, but so that refugees gain legal status and the factions of the liberation movement can sit at the same table in Damascus."
 SYRL_party_democracy_idea:0 "Intra-Party Democracy"
 SYRL_party_democracy_idea_desc:0 "The party checks itself: contested elections, a public budget, criticism and self-criticism."
 SYRL_pension_system_desc:0 "A universal pension covers farmers, the self-employed and housewives who previously had no security. The fund is financed jointly by the state, employers and individuals, managed by an independent board, and may not be diverted to other uses. The first pensioners to draw payments press their palms together at the window; they had never expected it in their lives."
 SYRL_people_army_desc:0 "The \"people's army\" is more than a slogan: a new conscription law shortens service and raises pay, veterans get priority for education and housing, and officer promotions are handled by an independent review board. The army is no longer a family's private force nor a party instrument but the state's army."
 SYRL_people_army_idea:0 "People's Army"
 SYRL_people_army_idea_desc:0 "Shorter service, higher pay, priority for veterans."
 SYRL_press_dialogue_desc:0 "State newspapers may print criticism of policy, television stations may invite opposition scholars, and banned books return to Damascus bookshops. The censorship office is not abolished, but the \"red lines\" drop from hundreds to a few. Society discovers for the first time that open debate does not make the state collapse."
 SYRL_press_idea:0 "Open Debate"
 SYRL_press_idea_desc:0 "Criticizing policy is no longer a crime."
 SYRL_price_commission_desc:0 "The Price Commission publishes monthly guide prices for staple foods and fuel, and market inspectors may raid hoarding and profiteering. Inflation is held in check at the cost of some shortages. The chairman says, \"Better that people queue for bread than watch bread they cannot afford.\""
 SYRL_price_idea:0 "Price Commission"
 SYRL_price_idea_desc:0 "Better to queue for bread than to watch bread you cannot afford."
 SYRL_progressive_tax_desc:0 "A progressive tax system replaces the old \"tax by acquaintance\": the higher the income and the larger the assets, the higher the rate, and tax evaders' names are published in the papers. Merchant associations protest for a while, but for the first time the state has a stable source of revenue independent of oil income."
 SYRL_public_housing_desc:0 "The slums on the edges of Damascus and Aleppo are being demolished and rebuilt. The new public-housing estates come with schools, clinics, buses and markets, and rents are capped at a quarter of household income. The state contractors must bid openly, and the construction workers receive the first flats."
 SYRL_public_sector_desc:0 "State factories are the backbone of Syrian industry, but decades of inefficiency and smuggling have left them shaky. A new law on state enterprises makes managers accountable for results, lets profits be retained for modernization, and gives losing firms a deadline to be fixed or restructured. The state must stop being merely the \"boss\" and become a competent industrialist: the \"state industry\" line."
 SYRL_rebuild_people_desc:0 "Post-war reconstruction is no longer monopolized by presidential-palace contractors but coordinated by \"people's reconstruction committees\": each district elects resident representatives who decide whether to rebuild the school or the hospital first. Reconstruction is slower than expected, but behind every new building someone has put their signature."
 SYRL_retire_old_guard_desc:0 "The elders left over from Hafez's era, the vice president, the defense minister and the chief of staff, have been in office for almost thirty years. The President arranges dignified retirements: honorary titles, state medals, a villa facing Mount Qasioun. Some are grateful; others understand what it means. Inside and outside the party, people ask: after the elders, who decides?"
 SYRL_return_roots_desc:0 "In his first months in office the young President reads the party archives one file at a time: the 1947 founding program, the March 1963 revolution, the \"neo-Ba'ath\" of 1966. \"Unity, freedom, socialism\" went from a revolutionary slogan to wall decoration to a fig leaf for family power. He decides to go back to the beginning and make the party an organization with ideas and discipline that belongs to no family. Those who profit from the status quo will not miss it."
 SYRL_rural_electrification_desc:0 "The last few thousand villages without power are connected, and wells and drip irrigation cover the arid east. Where the poles go up, schools and clinics follow. The peasants say, \"We used to depend on the sky; now we depend on the government.\" The President takes the remark as both the harshest criticism and the greatest incentive."
 SYRL_secular_edu_idea:0 "Secular Compulsory Education"
 SYRL_secular_edu_idea_desc:0 "Students who know how to ask questions."
 SYRL_secular_education_desc:0 "A curriculum reform separates religion classes from civics, textbooks add content on Syria's plural history, and new polytechnic and teacher-training colleges open across the country. At the opening ceremony the President says, \"We want to raise students who know how to ask questions.\" Some clerics see this as weakening faith, and the education minister has to begin negotiating with them."
 SYRL_self_reliance_desc:0 "The \"self-reliance programme\" is not autarky but ensures that in four fields, food, medicine, energy and basic industry, Syria could survive on its own in the worst case. The state gives tax and credit preferences to strategic industries and requires key equipment to meet a domestic-content ratio."
 SYRL_solidarity_desc:0 "Emerging states in Africa and Latin America have supported Syrian proposals several times at the UN General Assembly, and Damascus opens university scholarships and medical aid to them. It is a diplomatic reciprocity: when the weak combine, their voice is no longer a minority voice."
 SYRL_south_idea:0 "South-South Cooperation"
 SYRL_south_idea_desc:0 "Trade among developing countries remains open."
 SYRL_south_south_desc:0 "Syrian trade delegations fly to India, Brazil, South Africa and Indonesia and sign cooperation agreements on pharmaceuticals, agricultural machinery and textiles. \"South-South cooperation\" is not ideology but pragmatism: when developed markets are closed by barriers, trade among developing countries is still open."
 SYRL_tax_idea:0 "Progressive Taxation"
 SYRL_tax_idea_desc:0 "The higher the income and the larger the assets, the higher the rate."
 SYRL_term_limits_desc:0 "A constitutional amendment sets the presidential term at seven years, renewable once only. The clause is a single line, yet it changes the grain of Syrian politics: it tells the country and the world that this is no longer a \"president for life\" state. It goes to the People's Assembly and a national referendum, and the opponents are quieter than expected, and more dangerous."
 SYRL_total_defense_desc:0 "The total defence doctrine stresses that a small state cannot win with one large army but through national organization, reserve mobilization, civil defence and a fortified terrain. The Ministry of Defense issues a new reserve law, and every county has its own defence plan. The budget does not increase, but every dollar is spent more precisely."
 SYRL_total_defense_idea:0 "Total Defence"
 SYRL_total_defense_idea_desc:0 "Reserves, civil defence and fortified terrain."
 SYRL_welfare_state_desc:0 "Free healthcare extends from provincial capitals to every township, compulsory schooling is lengthened to nine years, and university tuition is abolished. The fiscal strain is real: the money comes from state enterprise profits and a new progressive tax. But for a society just emerging from fear, \"what has the state done for me\" wins more hearts than \"what does the state demand of me\"."
 SYRL_women_equality_desc:0 "The family law is amended: adult women may sign contracts and travel without a guardian's consent, divorce and custody rules move closer to equality, and sentence reductions for so-called \"honour crimes\" are banned. Conservative clergy object strongly, but women teachers, doctors and engineers in the workforce support the step."
 SYRL_women_idea:0 "Women's Equality"
 SYRL_women_idea_desc:0 "More women in the workforce and in school."
 SYRL_workers_coops_desc:0 "Worker representatives enter factory management committees, and peasant cooperatives get their own bank accounts and purchasing rights. Party cadres are at first unused to \"being questioned by workers\", but when output rises and absenteeism falls, the grumbling quiets. For the first time, \"socialism\" has a concrete meaning on the shop floor."
