l_english:
 HKG_roc_new_era: "A New Era for the SAR"
 HKG_roc_new_era_desc: "Twenty years after the Union Jack came down, the Five-Star Red Flag has come down too. The Blue Sky and White Sun flag rises at Tamar, and Hong Kong becomes a special administrative region of the Republic of China. The free port, the common law and the capitalist way of life remain unchanged."
 HKG_roc_kmt_branch: "Kuomintang Hong Kong General Branch"
 HKG_roc_kmt_branch_desc: "The veterans of Rennie's Mill and their descendants have finally lived to see this day. The Kuomintang Hong Kong General Branch becomes the SAR's governing party."
 HKG_roc_basic_law_revision: "Revise the Basic Law"
 HKG_roc_basic_law_revision_desc: "Replace the old constitutional basis with the Constitution of the Republic of China and revise the Basic Law of the Hong Kong SAR."
 HKG_roc_executive_led: "Executive-Led Government"
 HKG_roc_executive_led_desc: "The Chief Executive is appointed by the President and answers to Nanjing, and the executive leads government."
 HKG_roc_universal_suffrage: "Dual Universal Suffrage"
 HKG_roc_universal_suffrage_desc: "The Chief Executive and every seat in the Legislative Council are chosen by Hong Kong's citizens by universal suffrage: the Republic of China's promise to Hong Kong."
 HKG_roc_icac: "A New Chapter for the ICAC"
 HKG_roc_icac_desc: "The Independent Commission Against Corruption gains wider powers to investigate the cronyism left by the old regime."
 HKG_roc_legco: "The Hong Kong Legislature"
 HKG_roc_legco_desc: "The reorganized Legislative Council becomes Hong Kong's parliament and builds ties with the Legislative Yuan in Nanjing."
 HKG_roc_finance_hub: "International Financial Center"
 HKG_roc_finance_hub_desc: "Central is still Asia's Wall Street, and now it is the financing window for the whole Republic of China."
 HKG_roc_free_port: "Free Port"
 HKG_roc_free_port_desc: "Keep Hong Kong's tariff-free status, and let it remain a separate customs territory in the WTO."
 HKG_roc_keep_peg: "Keep the Dollar Peg"
 HKG_roc_keep_peg_desc: "The Hong Kong dollar stays pegged to the US dollar. Market confidence is Hong Kong's lifeline."
 HKG_roc_ntd_peg: "Peg to the National Currency"
 HKG_roc_ntd_peg_desc: "The Hong Kong dollar is re-pegged to the Republic of China's national currency, so Hong Kong's money serves national construction more closely."
 HKG_roc_greater_bay: "Guangdong-Hong Kong Economic Zone"
 HKG_roc_greater_bay_desc: "Open up both banks of the Shenzhen River, reconnecting Hong Kong's capital with Guangdong's factories."
 HKG_roc_tech_park: "Science Park"
 HKG_roc_tech_park_desc: "Build science parks in Sha Tin and Tseung Kwan O to attract tech talent from the mainland, Taiwan and Hong Kong."
 HKG_roc_shipping: "International Shipping Center"
 HKG_roc_shipping_desc: "The Kwai Chung container terminals are expanded, and Hong Kong becomes the world's busiest port again."
 HKG_roc_public_housing: "Public Housing Program"
 HKG_roc_public_housing_desc: "‘Home Ownership for All’: build public housing on a large scale and cut the waiting times."
 HKG_roc_healthcare: "Health Care Reform"
 HKG_roc_healthcare_desc: "Expand the public hospitals and link them with Nanjing's National Health Insurance."
 HKG_roc_education: "Education and Chinese Culture"
 HKG_roc_education_desc: "Traditional characters, Chinese culture and the Three Principles of the People come into the classroom. Hong Kong is a showcase of Chinese culture."
 HKG_roc_police: "Law, Order and the Police"
 HKG_roc_police_desc: "Restore the traditions the Royal Hong Kong Police left behind and crack down on the triads."
 HKG_roc_garrison: "SAR Garrison"
 HKG_roc_garrison_desc: "The National Army's Hong Kong garrison moves into Shek Kong and Stonecutters Island."
 HKG_roc_talent_exchange: "Talent Exchange"
 HKG_roc_talent_exchange_desc: "Hong Kong's lawyers, accountants and engineers head north, and mainland students come south to study."
 HKG_roc_return_motherland: "Return to the Motherland"
 HKG_roc_return_motherland_desc: "The SAR's historic mission is complete. Hong Kong gives up its special status and formally merges into the Republic of China proper (Hong Kong will no longer exist as a separate country)."
 HKG_roc_hk_people_rule: "Hong Kong People Ruling Hong Kong"
 HKG_roc_hk_people_rule_desc: "Hong Kong is governed by Hong Kong people, and its high autonomy is permanent."
 HKG_roc_pearl: "Pearl of the Orient"
 HKG_roc_pearl_desc: "However the world changes, Hong Kong will always be the Pearl of the Orient."
 HKG_roc_kmt_branch_idea: "Kuomintang Hong Kong General Branch"
 HKG_roc_kmt_branch_idea_desc: "The Kuomintang puts down roots in Hong Kong again."
 HKG_roc_exec_led_idea: "Executive-Led Government"
 HKG_roc_exec_led_idea_desc: "The Chief Executive answers to Nanjing, and government is efficient."
 HKG_roc_suffrage_idea: "Dual Universal Suffrage"
 HKG_roc_suffrage_idea_desc: "Hong Kong's citizens elect the Chief Executive and the legislature, one person, one vote."
 HKG_roc_icac_idea: "Independent Commission Against Corruption"
 HKG_roc_icac_idea_desc: "Hong Kong remains one of the cleanest cities in Asia."
 HKG_roc_finance_hub_idea: "International Financial Center"
 HKG_roc_finance_hub_idea_desc: "Money from Central flows to the whole Republic of China."
 HKG_roc_free_port_idea: "Free Port"
 HKG_roc_free_port_idea_desc: "A tariff-free port."
 HKG_roc_tech_idea: "Science Park"
 HKG_roc_tech_idea_desc: "Tech talent from the mainland, Taiwan and Hong Kong gathers in Hong Kong."
 HKG_roc_housing_idea: "Home Ownership for All"
 HKG_roc_housing_idea_desc: "Waiting times for public housing are much shorter."
 HKG_roc_selfrule_idea: "Hong Kong People Ruling Hong Kong"
 HKG_roc_selfrule_idea_desc: "A high degree of autonomy, forever."
