l_english:
 HKG_roc_new_era: "A New Era for the SAR"
 HKG_roc_new_era_desc: "Twenty years after the Union Jack came down, the Five-Star Red Flag has come down too. The Blue Sky and White Sun flag rises at Tamar, and Hong Kong becomes a special administrative region of the Republic of China. The free port, the common law and the capitalist way of life remain unchanged."
 HKG_roc_kmt_branch: "Kuomintang Hong Kong General Branch"
 HKG_roc_kmt_branch_desc: "The veterans of Rennie's Mill and their descendants have finally lived to see this day. The Kuomintang Hong Kong General Branch, forced to keep a low profile after 1997, puts up its sign again, and the Blue Sky, White Sun flag once raised in the New Territories every Double Tenth now flies openly in Central. It becomes the SAR's governing party."
 HKG_roc_basic_law_revision: "Revise the Basic Law"
 HKG_roc_basic_law_revision_desc: "Replace the old constitutional basis with the Constitution of the Republic of China and revise the Basic Law of the Hong Kong SAR. ‘People's Republic of China’ is replaced clause by clause, but the chapters on the common law, the independent judiciary and the capitalist system stay untouched: Nanjing assures Hong Kong that only the name of the state changes, not its way of life."
 HKG_roc_executive_led: "Executive-Led Government"
 HKG_roc_executive_led_desc: "The Chief Executive is appointed by the President and answers to Nanjing, the executive leads policy, and the Legislative Council only reviews and oversees. Supporters call it the efficient tradition handed down from the colonial governors; critics say that with a new flag, Hong Kong people still cannot choose their own leader."
 HKG_roc_universal_suffrage: "Dual Universal Suffrage"
 HKG_roc_universal_suffrage_desc: "The Chief Executive and every seat in the Legislative Council will be chosen by Hong Kong's citizens in universal elections: this is the Republic of China's promise to Hong Kong. In the streets of the 2014 Umbrella Movement, this ballot was exactly what people demanded; now Nanjing delivers the promise Beijing never would, and support for the pro-democracy camp rises at once."
 HKG_roc_icac: "A New Chapter for the ICAC"
 HKG_roc_icac_desc: "The ICAC's powers are expanded to investigate the favors handed out under the old order: privileged contracts for mainland state firms, land grants to pro-Beijing figures, and appointments made after the handover. Over forty years ago the ICAC won public trust with the promise that Hong Kong would no longer tolerate corruption; now it must prove itself again."
 HKG_roc_legco: "The Hong Kong Legislature"
 HKG_roc_legco_desc: "The reorganized Legislative Council becomes Hong Kong's real parliament: functional constituencies are phased out and members may freely introduce bills. It sets up a standing link with the Legislative Yuan in Nanjing, and Hong Kong legislators get their first chance to sit in on the national parliament and learn how to hold a government to account."
 HKG_roc_finance_hub: "International Financial Center"
 HKG_roc_finance_hub_desc: "Central is still Asia's Wall Street, and now it is the financing window for the whole Republic of China. The restored mainland has everything left to rebuild, and the reform of state firms, infrastructure and reconstruction bonds all need money; the Hong Kong stock exchange is the best place to raise it. International banks keep their Asian headquarters in Hong Kong."
 HKG_roc_free_port: "Free Port"
 HKG_roc_free_port_desc: "Keep its zero-tariff free-port status, with Hong Kong continuing to take part in the WTO as a separate customs territory. The free flow of money, goods and information has been the foundation of Hong Kong for more than a century. Nanjing understands that a Hong Kong locked behind the national tariff wall would no longer be Hong Kong."
 HKG_roc_keep_peg: "Keep the Dollar Peg"
 HKG_roc_keep_peg_desc: "The Hong Kong dollar stays pegged to the US dollar, because market confidence is Hong Kong's lifeline. Since 1983 the peg has survived the Asian financial crisis and the global financial crisis, and the Monetary Authority's reserves can fend off any attack. With the change of regime, leaving the exchange rate alone is the best reassurance the markets can get."
 HKG_roc_ntd_peg: "Peg to the National Currency"
 HKG_roc_ntd_peg_desc: "The Hong Kong dollar is re-pegged to the national currency of the Republic of China, so that Hong Kong's capital serves national reconstruction more closely. It is a risk: the national currency's credibility is still being built, and the markets fear the Hong Kong dollar will be dragged down with it. But Nanjing needs Hong Kong's reserves and liquidity to support the rebuilding of the mainland, and the price may be worth paying."
 HKG_roc_greater_bay: "Guangdong-Hong Kong Economic Zone"
 HKG_roc_greater_bay_desc: "Open up both banks of the Shenzhen River and link Hong Kong's capital with Guangdong's factories once again. The Lo Wu and Lok Ma Chau crossings switch to fast clearance, cross-border trains run more often, and Hong Kong businessmen place their orders in Dongguan and Shenzhen again. The old ‘shop in front, factory behind’ model comes back to life under the new system."
 HKG_roc_tech_park: "Science Park"
 HKG_roc_tech_park_desc: "Build science parks in Sha Tin and Tseung Kwan O to draw technical talent from Hong Kong, Taiwan and the mainland. Labs at HKU, HKUST and CUHK supply the research, manufacturers in Hsinchu and Shenzhen supply the production, and Hong Kong capital supplies the money. Nanjing hopes Hong Kong can be a source of innovation as well as a financial center."
 HKG_roc_shipping: "International Shipping Center"
 HKG_roc_shipping_desc: "The Kwai Chung container terminals are expanded with new berths and automated cranes, as Hong Kong bids to become the world's busiest port again. With the factories of the Pearl River Delta back at work after the Restoration, demand for mainland goods to be re-exported through Hong Kong soars, and Victoria Harbour is crowded with ships once more."
 HKG_roc_public_housing: "Public Housing Program"
 HKG_roc_public_housing_desc: "‘A home for everyone’: build public housing on a large scale and cut waiting times that often run five or six years. Subdivided flats and cage homes are Hong Kong's ugliest scars and a source of public anger. The government opens up land in the New Territories and draws on Taiwan's public housing and Singapore's HDB flats to give young people hope of owning a home again."
 HKG_roc_healthcare: "Health Care Reform"
 HKG_roc_healthcare_desc: "Public hospitals are expanded, emergency waiting times cut sharply, and the system is linked to Nanjing's National Health Insurance. Holders of Hong Kong identity cards are covered when they see a doctor on the mainland or in Taiwan, and specialists from private hospitals are encouraged to work part-time in the public system."
 HKG_roc_education: "Education and Chinese Culture"
 HKG_roc_education_desc: "Traditional characters, Chinese culture and the Three Principles of the People enter the classroom, and Hong Kong becomes the showcase of Chinese culture. The new civics textbooks tell how Sun Yat-sen studied in Hong Kong and how the 1911 Revolution was planned here, and also teach the common law and free speech. Parents accept this far more readily than Beijing's ‘national education’."
 HKG_roc_police: "Law, Order and the Police"
 HKG_roc_police_desc: "Restore the traditions the force inherited from the Royal Hong Kong Police: professionalism, neutrality and policing by law, while rebuilding relations with the public that hit rock bottom after 2019. The force sets up an independent complaints body, and its organized crime unit works with Taiwan's Criminal Investigation Bureau against cross-border triads and smuggling rings."
 HKG_roc_garrison: "SAR Garrison"
 HKG_roc_garrison_desc: "The National Army's Hong Kong garrison moves into Shek Kong and Stonecutters Island, taking over the barracks the PLA left behind. The garrison is small and more symbolic than military: it shows Hong Kong residents and foreign investors that Nanjing, not any faction in the streets, is responsible for the SAR's security."
 HKG_roc_talent_exchange: "Talent Exchange"
 HKG_roc_talent_exchange_desc: "Hong Kong's lawyers, accountants and engineers head north to help build the rule of law and reform enterprises on the mainland, while mainland students come south to study at HKU and HKUST. Once the agreement on mutual recognition of professional qualifications is signed, talent truly flows freely between the two for the first time."
 HKG_roc_return_motherland: "Return to the Motherland"
 HKG_roc_return_motherland_desc: "The SAR's historic mission is complete. Hong Kong gives up its special status and formally merges into the Republic of China proper (Hong Kong will no longer exist as a separate country)."
 HKG_roc_hk_people_rule: "Hong Kong People Ruling Hong Kong"
 HKG_roc_hk_people_rule_desc: "Hong Kong governed by Hong Kong people, with a high degree of autonomy, forever. The promise Beijing made in 1997 was hollow long before its fifty years were up; Nanjing writes these words into the Additional Articles of the Constitution with no expiry date. It is a promise to Hong Kong, and also a model for the mainland provinces to see."
 HKG_roc_pearl: "Pearl of the Orient"
 HKG_roc_pearl_desc: "However the world changes, Hong Kong will always be the Pearl of the Orient. Through colonial rule, the handover, unrest and the Restoration, this city has proved its resilience time and again. The lights of Victoria Harbour shine again, the crowds return to the Peak, and Hong Kong people can finally say with confidence that this is their home."
 HKG_roc_kmt_branch_idea: "Kuomintang Hong Kong General Branch"
 HKG_roc_kmt_branch_idea_desc: "The Kuomintang takes root in Hong Kong again. The veterans of Rennie's Mill, the indigenous villagers of the New Territories and the business community of Central form the base of the Kuomintang Hong Kong General Branch; the branch coordinates relations between the SAR government and Nanjing so Hong Kong's voice reaches the center directly."
 HKG_roc_exec_led_idea: "Executive-Led Government"
 HKG_roc_exec_led_idea_desc: "The Chief Executive answers to Nanjing, and government is efficient. Executive-led government continues the tradition of the colonial era, letting policies move quickly without stalling in the Legislative Council; but critics warn that efficiency is no substitute for democratic accountability."
 HKG_roc_suffrage_idea: "Dual Universal Suffrage"
 HKG_roc_suffrage_idea_desc: "Hong Kong's citizens elect the Chief Executive and the legislature on one person, one vote. With universal suffrage in place, the political landscape is transformed, and public opinion directly decides who governs for the first time; the government must answer to the voters, and decisions slow down as a result."
 HKG_roc_icac_idea: "Independent Commission Against Corruption"
 HKG_roc_icac_idea_desc: "Hong Kong remains one of the cleanest cities in Asia. The ICAC stands independent of the government and can investigate any official or businessman; case after case is prosecuted, and public trust in government gradually recovers."
 HKG_roc_finance_hub_idea: "International Financial Center"
 HKG_roc_finance_hub_idea_desc: "Money from Central flows to the whole Republic of China. The stock exchange raises huge sums for the reform of mainland state firms and for infrastructure, and international banks keep their Asian headquarters in Hong Kong; the city is the financial bridge between China and the world."
 HKG_roc_free_port_idea: "Free Port"
 HKG_roc_free_port_idea_desc: "A tariff-free port. Goods, money and information move freely, and Hong Kong takes part in the WTO as a separate customs territory; traders from every country choose Hong Kong as their gateway to the Chinese market, and its trading partners think all the better of it."
 HKG_roc_tech_idea: "Science Park"
 HKG_roc_tech_idea_desc: "Technical talent from Hong Kong, Taiwan and the mainland gathers in Hong Kong. In the science parks of Sha Tin and Tseung Kwan O, research teams from HKU and HKUST work with companies from Hsinchu and Shenzhen; Hong Kong is no longer just a financial center but a base for innovation and R&D in Asia."
 HKG_roc_housing_idea: "Home Ownership for All"
 HKG_roc_housing_idea_desc: "Waiting times for public housing fall sharply. New towns in the New Territories and a large-scale public housing program gradually consign subdivided flats and cage homes to history; young families finally have homes to settle in, and the birth rate begins to recover."
 HKG_roc_selfrule_idea: "Hong Kong People Ruling Hong Kong"
 HKG_roc_selfrule_idea_desc: "A high degree of autonomy, forever. The Additional Articles of the Constitution guarantee Hong Kong's common law, independent judiciary and way of life with no fifty-year limit; Hong Kong people regain their confidence in the future, the emigration wave stops and those who left begin to return."
