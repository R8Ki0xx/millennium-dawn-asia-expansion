l_english:
 TAI_silicon_island: "Silicon Island Plan"
 TAI_silicon_island_desc: "The competition of the new century is a competition of technology. With semiconductors, information and communications at its core, make Taiwan an irreplaceable link in the global tech supply chain."
 TAI_hsinchu_expansion: "Expand the Hsinchu Science Park"
 TAI_hsinchu_expansion_desc: "The Hsinchu Science Park is the cradle of Taiwan's high-tech industry. Founded in 1980 at the urging of K. T. Li and Shu Shien-siu, it now hosts hundreds of companies including TSMC and MediaTek; expand the park, add the Southern and Central Taiwan Science Parks, and draw engineers and PhDs back from abroad with generous incentives."
 TAI_ten_new_constructions: "Ten New Major Construction Projects"
 TAI_ten_new_constructions_desc: "Following the Ten Major Construction Projects of the 1970s, launch a new round of public works: ports, metro lines, sewage treatment and rural roads. Chiang Ching-kuo said back then, ‘If we don't do it today, we will regret it tomorrow’; now Taiwan's infrastructure is aging, and new investment will lay the foundations for the next stage of development."
 TAI_sacred_mountain: "The Sacred Mountain That Protects the Nation"
 TAI_sacred_mountain_desc: "Foundry chipmaking has become Taiwan's sturdiest shield. TSMC makes over ninety percent of the world's most advanced chips and is called the ‘sacred mountain that protects the nation’: any military move against Taiwan would bring the world economy to a halt. The government backs advanced process research to the hilt so this mountain always stands taller than the rest."
 TAI_broadband_island: "e-Taiwan"
 TAI_broadband_island_desc: "Build an island-wide broadband network and make Taiwan the most connected society in Asia. The ‘e-Taiwan’ program brings fiber to every township and free Wi-Fi to public spaces; Taiwan's internet penetration and speeds rise to the top of the world, and e-commerce and digital services flourish."
 TAI_panel_industry: "The Two Panel Tigers"
 TAI_panel_industry_desc: "AU Optronics and Chimei make Taiwan a global center of LCD panels, and the ‘Two Trillion, Twin Stars’ program puts panels alongside semiconductors as the nation's star industries. Panel plants in Tainan and Taichung run day and night and Taiwanese displays take forty percent of the world market, but Korean and mainland competition is closing in."
 TAI_foundry_alliance: "The Two Foundry Giants"
 TAI_foundry_alliance_desc: "TSMC and UMC stand side by side, controlling more than half the world's foundry capacity. Morris Chang pioneered the ‘pure-play foundry’ business model when he founded TSMC, with Robert Tsao's UMC close behind; the two grew together through competition and made Taiwan the manufacturing base the world's chip designers depend on most."
 TAI_e_government: "E-Government"
 TAI_e_government_desc: "Household registration, land records and taxes all go online, and government efficiency rises sharply. People can request household records, pay taxes and check land registrations from home, and filing a tax return takes minutes instead of hours; Taiwan's e-government ranks near the top of international comparisons."
 TAI_pc_kingdom: "Kingdom of Contract Manufacturing"
 TAI_pc_kingdom_desc: "Foxconn, Quanta, Compal... half the world's computers and phones are made by Taiwanese companies. They build more than ninety percent of the world's laptops, and Apple's iPhones are assembled by Foxconn in Zhengzhou and Shenzhen; as a ‘kingdom of contract manufacturing’, Taiwan becomes an indispensable link in the global electronics supply chain."
 TAI_ic_design: "IC Design Industry"
 TAI_ic_design_desc: "IC design firms such as MediaTek rise, and Taiwan no longer just manufactures chips but designs them too. MediaTek's phone chips spread affordable smartphones around the world, while Realtek, Novatek and Phison each excel in their fields; Taiwan's IC design industry is second only to America's."
 TAI_mobile_taiwan: "Mobile Taiwan"
 TAI_mobile_taiwan_desc: "The age of wireless broadband and smartphones arrives, with HTC leading the world. In 2008 HTC launched the world's first Android phone and was for a time one of the most valuable phone brands; the ‘Mobile Taiwan’ program covers the whole island with WiMAX and 4G networks."
 TAI_biotech: "Biotech Takes Off"
 TAI_biotech_desc: "Use the experience of semiconductor success to nurture biotech and medical devices. The Nangang Biotech Park and the Hsinchu Biomedical Science Park open, and Taiwan's medical device exports and new drug research gradually become internationally competitive; the government hopes biotech will be the next ‘sacred mountain’ after semiconductors."
 TAI_digital_content: "Digital Content Industry"
 TAI_digital_content_desc: "Games, animation and digital entertainment are the new economy of the young generation. Taiwanese game studios created classics such as Chinese Paladin and Xuan-Yuan Sword and led Asia in running online games; the government sets up digital content parks to nurture the next generation of creators."
 TAI_silicon_shield: "Silicon Shield"
 TAI_silicon_shield_desc: "The whole world depends on Taiwan's chips, and that is our best defense. From Apple and Nvidia to America's defense contractors, all rely on TSMC's advanced processes; any blockade of or attack on Taiwan would paralyze the global economy. This ‘silicon shield’ protects Taiwan better than any missile."
 TAI_high_speed_rail: "Taiwan High Speed Rail"
 TAI_high_speed_rail_desc: "Taipei to Kaohsiung in ninety minutes. Taiwan High Speed Rail, built under a BOT contract with Japanese Shinkansen technology, opened in 2007; it links the cities of the western corridor into a single day-trip region, and Tainan, Chiayi and Taichung all become commuter towns for Taipei."
 TAI_fourth_nuclear_plant: "Finish the Fourth Nuclear Plant"
 TAI_fourth_nuclear_plant_desc: "Energy independence is a matter of national security, and we decide to complete the Lungmen nuclear plant. The Chen Shui-bian government's attempt to halt the Fourth Nuclear Plant in 2000 set off a political storm; Taiwan imports more than ninety percent of its energy, and under a blockade its coal and gas stocks would last only weeks. Anti-nuclear groups take to the streets, but the government is determined to finish it."
 TAI_mrt_networks: "Metro Networks"
 TAI_mrt_networks_desc: "Metro networks in Taipei, Kaohsiung, Taichung and Taoyuan all go into construction. The Taipei MRT, open since 1996, has become the city's backbone, and the Kaohsiung MRT opened in 2008; the Taoyuan Airport MRT and the Taichung MRT follow, and all of Taiwan's major metropolitan areas get rail transit of their own."
 TAI_port_expansion: "Kaohsiung Free Trade Port"
 TAI_port_expansion_desc: "Set up a free trade port zone to put Kaohsiung back among the world's leading ports. Kaohsiung was once the world's third-largest container port before being overtaken by Shanghai, Shenzhen and Busan; the free trade zone lets goods be processed and transshipped duty-free inside the port, and the expanded Intercontinental Container Terminal can berth the largest container ships."
 TAI_petrochemical: "Expand the Sixth Naphtha Cracker"
 TAI_petrochemical_desc: "The Sixth Naphtha Cracker at Mailiao, built by Wang Yung-ching's Formosa Plastics Group, is one of Asia's largest petrochemical complexes. Expanded, it supplies most of Taiwan's ethylene and petrochemical feedstock and supports the downstream plastics and textile industries; but air pollution and protests by fishermen accompany every expansion."
 TAI_renewables: "Renewable Energy"
 TAI_renewables_desc: "Offshore wind and solar prepare for the energy transition. The Taiwan Strait has some of the best wind in the world, and the wind farms off Changhua attract international players such as Denmark's Ørsted; rooftop solar and fish-farm solar projects spread quickly across the south, and Taiwan begins to diversify its energy."
 TAI_second_financial_reform: "Second Financial Reform"
 TAI_second_financial_reform_desc: "Consolidate Taiwan's too many, too small domestic banks into financial holding groups able to compete regionally. Taiwan has nearly fifty domestic banks, and ‘overbanking’ has led to cutthroat competition and piles of bad loans; the second financial reform aims to halve their number through mergers, though suspicions of favoritism cause a public uproar."
 TAI_tourism_doubling: "Doubling Tourist Arrivals"
 TAI_tourism_doubling_desc: "Welcome more tourists and make the night markets, hot springs and Jade Mountain world-class attractions. The tourism doubling plan aims to double visitor arrivals in five years: the Shilin night market, the Beitou hot springs, Taroko Gorge and the sunrise at Alishan draw visitors from Japan, Korea and Southeast Asia."
 TAI_three_links: "The Three Links"
 TAI_three_links_desc: "Direct mail, trade and transport. Since 1949 people and goods had to travel between the two sides via Hong Kong or another third place, and a Taiwanese businessman's round trip took a whole day; with the three links, a direct flight takes just over an hour. Taipei hopes economic ties will draw the mainland toward change and plant the seeds of freedom on the other side."
 TAI_go_south_policy: "Go South Policy"
 TAI_go_south_policy_desc: "Reduce dependence on the mainland market and steer capital and industry toward Southeast Asia. Lee Teng-hui launched the ‘Go South’ policy in the 1990s, with ‘no haste, be patient’ limiting investment on the mainland; Taiwanese companies build factories in Vietnam, Thailand and Indonesia, so Taiwan's economy does not have all its eggs in one basket."
 TAI_quality_agriculture: "High-Value Agriculture"
 TAI_quality_agriculture_desc: "High-value fruit, tea and orchids take Taiwanese agriculture to the world. Alishan high-mountain tea, Pingtung wax apples and Tainan's moth orchids are in demand on international markets; quality agriculture means Taiwan's small farmers need not compete head-on with bulk imports after joining the WTO."
 TAI_cross_strait_ecfa: "Cross-Strait Economic Cooperation Framework Agreement"
 TAI_cross_strait_ecfa_desc: "The Economic Cooperation Framework Agreement lowers tariffs and opens services, giving Taiwan a head start in the mainland market. Signed in 2010, ECFA's early harvest list gives petrochemicals, machinery and farm produce zero tariffs; supporters call it Taiwan's economic lifeline, while opponents fear Beijing will use the economy to push unification."
 TAI_asean_fta: "Trade Agreements with Singapore and New Zealand"
 TAI_asean_fta_desc: "Sign economic partnership agreements with Singapore, New Zealand and others to break out of marginalization in regional integration. Under Beijing's pressure Taiwan was long shut out of East Asia's free trade networks; the agreements signed with New Zealand and Singapore in 2013 are an important step in breaking its economic isolation."
 TAI_health_insurance_reform: "Sustainable Health Insurance Reform"
 TAI_health_insurance_reform_desc: "Second-generation reform puts National Health Insurance on a sustainable footing. NHI has been popular since its launch, but it loses money year after year; the reform adds a supplementary premium on dividends, interest and rental income so higher earners pay a little more, saving the institution Taiwanese are proudest of."
 TAI_asia_pacific_hub: "Asia-Pacific Regional Operations Center"
 TAI_asia_pacific_hub_desc: "Make Taiwan the Asia-Pacific headquarters, financial and logistics hub for multinational companies. The Asia-Pacific Regional Operations Center plan of the 1990s foundered on cross-Strait relations; now Taiwan's sound rule of law, talented workforce and location draw multinationals to set up regional headquarters in Taipei."
 TAI_second_economic_miracle: "Second Economic Miracle"
 TAI_second_economic_miracle_desc: "From export processing to a technology island, Taiwan has created an economic miracle once again. The 1960s boom, when ‘Taiwan's money came up to your ankles’, rested on textiles and export processing; today it rests on chips, electronics and innovation. Per capita GDP overtakes Japan and Korea, and Taiwan becomes one of Asia's richest societies."
 TAI_new_millennium_roc: "The Republic of China in the New Millennium"
 TAI_new_millennium_roc_desc: "The year 2000, the 89th year of the Republic. Half a century ago, the Nationalist Government moved to Taiwan; half a century later, the 22 million people of Taiwan, Penghu, Kinmen and Matsu stand on the threshold of a new century. Where will the Republic of China go?"
 TAI_cross_strait_crossroads: "Crossroads in the Strait"
 TAI_cross_strait_crossroads_desc: "What ‘one China’ means, unification, independence or the status quo: every politician has to answer the question. The change of ruling party in 2000 brought Taiwan's national identity question into the open, and the blue and green camps give completely different answers on cross-Strait relations. Taiwan stands at a crossroads of history."
 TAI_judicial_reform: "Judicial Reform"
 TAI_judicial_reform_desc: "Push for judicial independence and transparent trials to rebuild public trust in the courts. ‘Dinosaur judges’ and judicial influence peddling had sent the courts' credibility to rock bottom; judicial reform introduces evaluation of judges, open trials and lay participation in trials, and prosecutes judicial officers in league with gangsters."
 TAI_constitutional_orthodoxy: "ROC Constitutional Orthodoxy"
 TAI_constitutional_orthodoxy_desc: "The existing national territory defined in the Constitution of the Republic of China has never changed. Taiwan is the base for national revival, not the final destination of the Republic of China. The Pan-Blue camp unites and vows to restore the constitutional orthodoxy of the Republic of China over all of China."
 TAI_taiwan_first: "Taiwan First"
 TAI_taiwan_first_desc: "Whatever the name of the state, the people of this land are its masters. The pan-green camp puts Taiwan first, upholding the status quo and defending democracy: Taiwan's future should be decided by its twenty-three million people together. This line wins ever more support among the young generation."
 TAI_legislative_reform: "Legislative Reform"
 TAI_legislative_reform_desc: "The Legislative Yuan is inefficient and chaotic: legislators come to blows on the floor and bills languish in committee for years. Parliamentary reform has become a consensus across party lines, and Lin Yi-hsiung's campaign to halve the legislature gathers signatures from huge numbers of citizens."
 TAI_legislative_halving: "Halve the Legislature"
 TAI_legislative_halving_desc: "Seats in the Legislative Yuan are cut from 225 to 113, with a switch to single-member districts and two votes per voter. Halving the seats makes each legislator's mandate and responsibility clearer, while single-member districts make life hard for small parties, and Taiwan's party system gradually moves toward two-party politics."
 TAI_seventh_amendment: "The Seventh Constitutional Amendment"
 TAI_seventh_amendment_desc: "The Seventh Amendment of 2005 abolishes the National Assembly and establishes ratification of constitutional amendments by popular referendum: any future amendment must be approved by more than half of all eligible voters. The National Assembly passes into history, though its place in the Republic's constitutional order remains a matter of dispute."
 TAI_sunshine_laws: "Sunshine Laws"
 TAI_sunshine_laws_desc: "Asset declarations for public officials, a political donations act and a lobbying act let politics operate in the sunlight. The old collusion of money, power and organized crime made elections a game of money; the new laws require every political donation to be disclosed and lobbyists to register, with criminal penalties for violators."
 TAI_mature_democracy: "Deepening Democracy"
 TAI_mature_democracy_desc: "Changes of ruling party have become routine, and democracy has taken deep root in Taiwan. From the first direct presidential election in 1996 and the first change of ruling party in 2000 to the second in 2008, Taiwan has proved that a Chinese society can be a democracy; it is one of the great success stories of Asian democratization."
 TAI_three_principles_revival: "Revival of the Three Principles"
 TAI_three_principles_revival_desc: "Nationalism, democracy and the people's livelihood. The Father of the Nation's teachings are the banner under which we show our mainland compatriots another way: in Taiwan, the Three Principles became reality through democratic elections, land reform and an economic miracle, and our compatriots across the Strait should know that the Chinese people can choose differently."
 TAI_lien_soong_alliance: "Lien-Soong Cooperation"
 TAI_lien_soong_alliance_desc: "The Kuomintang and the People First Party put the past behind them, and the pan-blue camp unites. In the 2000 presidential election Lien Chan and James Soong ran separately, letting Chen Shui-bian win with less than forty percent of the vote; four years later the two run together on one ticket, and the pan-blue camp is finally united again."
 TAI_purge_black_gold: "Purge Black Gold Politics"
 TAI_purge_black_gold_desc: "Local factions and organized crime are deeply entangled: councilors with gang backgrounds fill local assemblies, and bid-rigging and vote-buying are rampant. Without scraping the poison from the bone, there is no talking about revival; an anti-gang campaign sends a slew of gangster councilors to prison, and the Kuomintang must cut its ties of interest with the local factions too."
 TAI_kmt_party_reform: "Kuomintang Party Reform"
 TAI_kmt_party_reform_desc: "Younger, more local, more modern: the Kuomintang must remake itself. After its defeat in 2000 the party takes its lessons to heart: the chairman is now directly elected by the members, the average age of the Central Standing Committee falls sharply, and young Taiwan-born members rise to leadership; the century-old party must learn to compete in a democracy."
 TAI_strengthen_unification_council: "Strengthen the National Unification Council"
 TAI_strengthen_unification_council_desc: "Restart the long-frozen National Unification Council to coordinate policy research and psychological operations toward the mainland. Founded in 1990, the council was ‘ceased to function’ by the Chen Shui-bian government in 2006; revived, it studies the conditions for unification and also runs broadcasts, online outreach and exchanges aimed at the mainland."
 TAI_five_yuan_reform: "Strengthen the Five Yuan System"
 TAI_five_yuan_reform_desc: "Restore the checks and balances of the five-power constitution and make government work better. The Examination and Control Yuan were long criticized as sinecures, and conflict between the Legislative and Executive Yuan left the government spinning its wheels; after reform each Yuan does its proper job, the Control Yuan resumes impeaching corrupt officials and the Examination Yuan secures a professional, neutral civil service."
 TAI_party_assets_trust: "Party Assets in Trust"
 TAI_party_assets_trust_desc: "Put the Kuomintang's party assets in trust and shed the stigma of being ‘the world's richest party’. During the authoritarian era the party amassed tens of billions in assets, including TV stations, newspapers and large property holdings; once in trust, the income no longer funds election campaigns, and the Kuomintang can finally compete with other parties on a fair basis."
 TAI_chinese_culture_renaissance: "Chinese Cultural Renaissance Movement"
 TAI_chinese_culture_renaissance_desc: "Taiwan has preserved traditional characters and traditional culture and is the true guardian of Chinese civilization. In 1966, as the mainland was engulfed by the catastrophe of the Cultural Revolution, Taiwan launched the Chinese Cultural Renaissance Movement; today the treasures of the National Palace Museum, traditional characters and traditional festivals are Taiwan's calling cards for Chinese culture to the world."
 TAI_national_security_law: "National Security Legislation"
 TAI_national_security_law_desc: "Amend the National Security Act and pass an Anti-Infiltration Act to guard against CCP united front infiltration. The CCP works on Taiwan through temples, village chiefs, retired generals and online influencers, and disinformation spreads widely on social media; the new laws ban political activity carried out on the instructions of, or with funding from, hostile foreign forces."
 TAI_guidelines_for_unification: "Guidelines for National Unification"
 TAI_guidelines_for_unification_desc: "Aim for a democratic, free and equitably prosperous China and complete unification in stages. The 1991 Guidelines for National Unification set out short-, medium- and long-term phases; now the Kuomintang government reaffirms the guidelines and adds one line: if the other side refuses to democratize, the Republic of China reserves all options."
 TAI_status_quo: "Maintain the Status Quo"
 TAI_status_quo_desc: "No unification, no independence, no use of force. Walking the tightrope between two great powers is this island's most practical way to survive. Polls show most Taiwanese want neither unification nor to risk war by declaring independence; the status quo is not the absence of a position but the position that best reflects public opinion."
 TAI_transitional_justice: "Transitional Justice"
 TAI_transitional_justice_desc: "Face the wounds of the White Terror and the February 28 Incident, open the archives and overturn wrongful convictions. The incident of 1947 and nearly forty years of martial law that followed saw tens of thousands killed or imprisoned; the Transitional Justice Commission opens the political archives and quashes unjust convictions, and the victims' families finally get an accounting."
 TAI_referendum_act: "Referendum Act"
 TAI_referendum_act_desc: "Let the people decide major public questions directly. With the Referendum Act of 2003, Taiwanese could for the first time express their views directly on issues such as nuclear power, same-sex marriage and cross-Strait agreements; Beijing warns that it is ‘pursuing independence by referendum’, and Washington also voices concern."
 TAI_porcupine_strategy: "Porcupine Strategy"
 TAI_porcupine_strategy_desc: "We do not aim to win an invasion war, only to make the invader pay a price it cannot bear. The Ministry of National Defense turns to asymmetric warfare: mobile anti-ship missiles, swarms of drones and man-portable air defenses replace large warships that are expensive and easy to destroy. Taiwan must be like a porcupine that no predator can swallow."
 TAI_values_diplomacy: "Values Diplomacy"
 TAI_values_diplomacy_desc: "Deepen relations with like-minded countries on the shared values of democracy, human rights and free markets. With its formal allies dwindling, Taiwan turns to cultivating substantive ties with the US, Japan and Europe; delegations from the European Parliament, members of the US Congress and Japanese politicians visit Taiwan one after another."
 TAI_civil_society: "Civil Society"
 TAI_civil_society_desc: "Social movements, NGOs and independent media are the firmest foundation of Taiwan's democracy. From the Wild Lily student movement and the Sunflower Movement to the environmental and labor movements, Taiwan's civil society has proved its vitality again and again; Tzu Chi, the Red Cross and countless volunteer groups reach the scene of every disaster before the government does."
 TAI_whole_society_defense: "Whole-of-Society Defense Resilience"
 TAI_whole_society_defense_desc: "Civil defense, health care, communications and energy must be ready for war in time of peace. The war in Ukraine made Taiwanese realize that the resilience of the whole population matters as much as the army: civilian defense training, wartime hospital mobilization, satellite communications and energy reserves are all built into a whole-of-society defense resilience system."
 TAI_indigenous_rights: "Indigenous Self-Government"
 TAI_indigenous_rights_desc: "Guarantee the land and cultural rights of indigenous peoples under the Indigenous Peoples Basic Law. Taiwan has sixteen officially recognized indigenous peoples, the island's earliest inhabitants; the government recognizes their traditional territories, promotes indigenous language education, and the president formally apologizes to the indigenous peoples on behalf of the government."
 TAI_formosa_resilience: "Resilient Taiwan"
 TAI_formosa_resilience_desc: "Let Taiwan stand firm in any storm. The threats of earthquakes, typhoons, epidemics and war have taught this island to survive crises: the rebuilding after the 921 earthquake and the fight against SARS and COVID-19 all proved the resilience of Taiwanese society. Formosa: beautiful, and strong."
 TAI_national_glory_plan: "Revive Project National Glory"
 TAI_national_glory_plan_desc: "In 1961, Chiang Kai-shek secretly set up the ‘National Glory Office’ to plan the counterattack on the mainland. Forty years later, the dusty plan is spread out on a desk in the Presidential Office again."
 TAI_mainland_work_conference: "Mainland Work Conference"
 TAI_mainland_work_conference_desc: "Combine the National Security Bureau, the Mainland Affairs Council, the Ministry of National Defense and the Kuomintang's mainland affairs department for political, psychological and intelligence work on the mainland. The agencies used to go their own way without sharing information; the mainland work conference, chaired by the President in person, reviews the situation across the Strait every month and coordinates every covert operation on the mainland."
 TAI_intelligence_war: "Intelligence War"
 TAI_intelligence_war_desc: "The Military Intelligence Bureau and the National Security Bureau rebuild their networks on the mainland to track the other side's military and political moves. From the 1950s on, the National Army's mainland networks were broken up again and again, and many agents were killed or captured; now a new generation enters the mainland as businesspeople, scholars and tourists and weaves the web anew."
 TAI_amphibious_corps: "Amphibious Landing Corps"
 TAI_amphibious_corps_desc: "To cross the Taiwan Strait you need a corps able to land in the face of the enemy. The 130-kilometer-wide strait was once a natural moat against the PLA, and now it is a barrier the National Army itself must cross; the amphibious corps gets new landing ships, hovercraft and amphibious assault vehicles and drills again and again on the beaches of Penghu and Pingtung."
 TAI_secure_us_acquiescence: "Win American Acquiescence"
 TAI_secure_us_acquiescence_desc: "Without Washington's nod, retaking the mainland is just talk. In the 1950s the Eisenhower administration used the Mutual Defense Treaty to ‘leash’ Chiang Kai-shek and forbid any unauthorized counterattack; now Taipei sends a secret envoy to Washington to probe America's bottom line: will it tacitly allow it, or at least not stand in the way?"
 TAI_war_economy: "Wartime Economic System"
 TAI_war_economy_desc: "The defense budget doubles and civilian factories switch to war production. Taiwan's electronics industry supplies guidance systems for missiles, textile mills sew uniforms for the army and shipyards build landing ships day and night; the economics ministry sets up a war production mobilization office to ensure that, once war begins, Taiwan can sustain months of fighting on its own."
 TAI_mainland_democracy_support: "Support the Mainland Democracy Movement"
 TAI_mainland_democracy_support_desc: "The blood of 1989 was not shed in vain. Fund the democracy activists in exile and sow the seeds of freedom back on the mainland. Wang Dan, Wu'er Kaixi and a group of rights lawyers open offices in Taipei and broadcast to the mainland online and by satellite TV; young people across the Strait start climbing over the firewall to read the history they are forbidden to know."
 TAI_overseas_mobilization: "Rally the Overseas Chinese"
 TAI_overseas_mobilization_desc: "From San Francisco to Kuala Lumpur, call on the overseas Chinese to give money and effort to the great cause of the Republic of China's revival. In the 1911 Revolution the overseas Chinese were the Father of the Nation's most important backers, ‘the mother of the revolution’; now the Overseas Community Affairs Council holds meetings at Chinese associations around the world to raise funds and volunteers."
 TAI_special_forces_raids: "Special Operations Behind Enemy Lines"
 TAI_special_forces_raids_desc: "Sea Dragon frogmen and special forces will infiltrate the mainland coast to sabotage transport and command centers. In the 1950s and 60s the National Army raided the mainland coast many times, the Dongshan Island battle being the largest; the new special operations are far more covert, targeting radar stations, communications hubs and missile sites."
 TAI_kinmen_matsu_bastion: "Kinmen and Matsu Forward Bases"
 TAI_kinmen_matsu_bastion_desc: "Kinmen and Matsu lie only a few kilometers from the mainland, springboards for a counteroffensive. In the Second Taiwan Strait Crisis of 1958, Kinmen's garrison stood firm under nearly half a million shells in forty-four days; now ports, airfields and tunnels are rebuilt, turning the two outposts back into bridgeheads for the counterattack."
 TAI_air_sea_superiority: "Air and Sea Superiority"
 TAI_air_sea_superiority_desc: "Any landing depends on winning control of the air and sea over the Strait. The PLA's air force and navy far outnumber the National Army's, but Taiwan has better training, more advanced early warning and American equipment; the National Army must destroy the coastal airfields and radars across the Strait in the first days of war, or the landing fleet will not get anywhere."
 TAI_strategic_stockpile: "Strategic Stockpiles"
 TAI_strategic_stockpile_desc: "Stockpile enough fuel, ammunition and food for six months of fighting. Taiwan imports most of its energy and much of its food, and if the sea lanes were cut it could be in serious trouble within weeks; new underground fuel depots and granaries dispersed in tunnels in the Central Mountain Range ensure supplies will not run out in wartime."
 TAI_peaceful_unification_talks: "Cross-Strait Peaceful Unification Talks"
 TAI_peaceful_unification_talks_desc: "If the other side has taken the road to democracy, or its regime is tottering, unification need not cost blood. Offer Beijing a plan for peaceful unification under the Constitution of the Republic of China."
 TAI_ignite_mainland_uprising: "Ignite a Mainland Uprising"
 TAI_ignite_mainland_uprising_desc: "When the people's patience has run out, a single spark is enough. Incite soldiers and civilians in the southeastern provinces to rise up and found a ‘Provisional Mainland Government of the Republic of China’. The National Army will support them first as volunteers, and reorganize and send in troops once the situation is clear."
 TAI_return_to_mainland: "Counterattack on the Mainland"
 TAI_return_to_mainland_desc: "‘Recover the mainland, rescue our compatriots.’ A vow more than half a century old is to be honored today. The President reads a message to the nation's soldiers and citizens in front of the Presidential Palace, and the armed forces mass at Zuoying, Keelung and Kinmen; from Chiang Kai-shek's Project National Glory to this day, the dream of generations of the National Army is finally to become reality."
 TAI_strait_blockade: "Blockade the Strait"
 TAI_strait_blockade_desc: "Blockade the mainland's southeastern ports with submarines and mines. With Xiamen, Fuzhou and Ningbo blockaded, the economy of the southeast coast will grind to a halt; the National Army's submarines are few, but together with minelayers and shore-based missiles they are enough to keep merchant ships across the Strait in port."
 TAI_general_mobilization: "General Mobilization"
 TAI_general_mobilization_desc: "Issue the mobilization order and call all reservists back to their units. Taiwan has more than two million reservists, scattered across every trade in peacetime; once the order is given they report to their units within seventy-two hours to draw weapons and equipment. The whole of society goes onto a war footing, with schools closed and factories converted."
 TAI_psychological_offensive: "Psychological Offensive"
 TAI_psychological_offensive_desc: "Leaflet balloons, loudspeaker broadcasts and online psychological warfare break the will of soldiers and civilians across the Strait. Kuang Hua Radio resumes round-the-clock broadcasts to the mainland, and the great loudspeakers on Kinmen call across to Xiamen again; online, images of June Fourth, the fortunes of top CCP leaders and the appeal ‘Brothers of the National Army, come home’ spread far and wide."
 TAI_southeast_landings: "Landings on the Southeast Coast"
 TAI_southeast_landings_desc: "The coasts of Fujian, Zhejiang and Guangdong are the battlefields the National Army knows best. The three services work together to establish beachheads: marines land at Meizhou Bay and Pingtan, airborne troops seize Jinjiang airport, and follow-on forces pour across the sea. Everything depends on the first seventy-two hours."
 TAI_pla_uprising: "Defections on the Front Line"
 TAI_pla_uprising_desc: "The grandfathers of many PLA soldiers served in the National Army. Call out to them: ‘Brothers of the National Army, come home!’ In 1949 entire National Army units went over to the Communists on the mainland; now history runs the other way, PLA units in Fujian and Zhejiang start making contact with the National Army, and some lay down their arms by whole regiments and battalions."
 TAI_airborne_assault: "Airborne Assault"
 TAI_airborne_assault_desc: "Airborne special forces seize airfields and key crossroads behind enemy lines. Helicopters carry special forces deep into the enemy's rear to take bridges, tunnels and airfields before the PLA can react; these footholds let the National Army's main body advance quickly and cut off the enemy's reinforcements."
 TAI_liberate_fujian: "Liberate Fujian"
 TAI_liberate_fujian_desc: "The National Army lands at the mouth of the Min River, and the Blue Sky, White Sun and a Wholly Red Earth flag rises over Fuzhou. Fujian lies just across the water from Taiwan, and most Taiwanese have ancestors from southern Fujian and speak the same dialect; as the National Army marches into Fuzhou, many old people recognize the flag they saw as children."
 TAI_liberate_shanghai: "Liberate Shanghai"
 TAI_liberate_shanghai_desc: "The greatest metropolis of the Far East returns to the embrace of the Republic of China. In May 1949 Tang Enbo's troops withdrew from Shanghai, and the city bade farewell to the Blue Sky, White Sun flag; more than seventy years later, the flag flies again over the Customs House on the Bund, and the ships on the Huangpu sound their horns in salute."
 TAI_liberate_guangdong: "Liberate Guangdong"
 TAI_liberate_guangdong_desc: "Guangzhou, the birthplace of the National Revolution, is liberated once more. The Huanghuagang Uprising of 1911, the founding of the Whampoa Academy in 1924 and the launch of the Northern Expedition in 1926 all took place here; returning to Guangzhou, the National Army's first act is to lay flowers at the tomb of the Seventy-Two Martyrs of Huanghuagang."
 TAI_retake_nanjing: "Liberate Nanjing"
 TAI_retake_nanjing_desc: "The Blue Sky, White Sun and a Wholly Red Earth flag flies again before the Sun Yat-sen Mausoleum. The capital is liberated! In April 1949 the PLA stormed the Presidential Palace and tore down the flag; more than seventy years later a National Army honor guard raises it again at the palace gate, and people watching on television in Taiwan and abroad weep."
 TAI_liberate_wuhan: "Liberate Wuhan"
 TAI_liberate_wuhan_desc: "Wuhan, the thoroughfare of nine provinces, falls to the National Army, and the whole Yangtze is open to navigation. The shots of the Wuchang Uprising overthrew the empire here, and the Battle of Wuhan in the War of Resistance cost the Japanese dearly; holding Wuhan gives the National Army the transport artery of central China and cuts the PLA in two, north and south."
 TAI_northern_expedition: "Northern Expedition"
 TAI_northern_expedition_desc: "Carrying on the late President Chiang's unfinished mission, the National Army launches a second Northern Expedition! In 1926 the National Revolutionary Army set out from Guangzhou and unified the country within two years; now the new expedition sets out from Nanjing northward along the Tianjin–Pukou railway, its objective Beiping. It is the second Northern Expedition in the Kuomintang's history."
 TAI_liberate_southwest: "Liberate the Southwest"
 TAI_liberate_southwest_desc: "Sichuan, Chongqing and the Yunnan–Guizhou plateau are liberated one after another, and the wartime capital returns to the Nationalist government. In December 1949 the government left Chengdu for Taipei, its last stop on the mainland; now the National Army returns to the Southwest, and crowds of well-wishers fill the square before Chongqing's monument to victory in the War of Resistance."
 TAI_liberate_beiping: "Liberate Beiping"
 TAI_liberate_beiping_desc: "The National Army marches into Beiping, and the flag of the Republic of China hangs again on the Forbidden City and Tiananmen. For more than seventy years the gate bore another man's portrait; now it is taken down and replaced by the Father of the Nation, Sun Yat-sen. Beiping: the city will take back its Republican name as well."
 TAI_mainland_restored: "Restore China"
 TAI_mainland_restored_desc: "From Nanjing to Beiping, the constitutional orthodoxy of the Republic of China has finally returned to the land where it was born. But 1.3 billion compatriots, half a century of separation and a completely different society are waiting for the new government.\n\n§YOnce completed, the focus tree switches to the new post-Restoration tree.§!"
 TAI_armed_forces_modernization: "Modernize the National Army"
 TAI_armed_forces_modernization_desc: "After the streamlining program, the National Army needs more than job cuts: it needs a force that can win a modern war. The streamlining of the 1990s cut the forces from over four hundred thousand to just over three hundred thousand, but many units' equipment and training remained stuck in the Cold War; modernization must cover doctrine, equipment and personnel across the board."
 TAI_army_reform: "Streamline the Army"
 TAI_army_reform_desc: "Cut surplus personnel and layers of command and concentrate resources on the fighting units. The army's logistics and administrative units were bloated, and many officers had never led troops; the streamlined army is built around combined arms brigades, its chain of command cut from five levels to three, and the share of combat troops rises sharply."
 TAI_navy_modernization: "Modernize the Navy"
 TAI_navy_modernization_desc: "The aging Yang-class destroyers must retire, and the navy needs a new generation of capital ships. The Yangs are Second World War American destroyers that have served for more than half a century; the navy rebuilds its surface fleet around the Cheng Kung and Kang Ding frigates and the Kidd-class destroyers it is about to buy."
 TAI_air_force_modernization: "Modernize the Air Force"
 TAI_air_force_modernization_desc: "Mirages, F-16s and Ching-kuos: integrating three types of third-generation fighters. In the 1990s Taiwan bought both French Mirage 2000s and American F-16s, and with its own Ching-kuo the air force has over three hundred third-generation jets; but the three types have different logistics and training, and making them work together is the air force's biggest challenge."
 TAI_han_kuang_exercise: "Han Kuang Exercise"
 TAI_han_kuang_exercise_desc: "Live troops, live fire and no script: a test of the forces' real fighting power. The Han Kuang exercise has been held every year since 1984 and was often criticized as ‘theater’; the reformed exercise is assessed with American observers and simulates a surprise PLA attack, exposing the units' weaknesses under real pressure."
 TAI_conscription_reform: "Military Service Reform"
 TAI_conscription_reform_desc: "Shorten service, strengthen training and expand the reserve mobilization system. Young men complain that conscription is ‘a waste of life’, with barracks full of sweeping and sentry chores; the new system focuses on combat training, and reservists return every year for refresher call-ups to keep their skills sharp."
 TAI_marine_corps_expansion: "Expand the Marine Corps"
 TAI_marine_corps_expansion_desc: "The marines are the only part of the National Army capable of amphibious assault. Expanding them serves both defense and the future: living by the motto ‘always faithful’, the marines garrison Penghu and Pratas Island and drill amphibious landings on the beaches of Pingtung. One day they will lead the counteroffensive."
 TAI_armor_modernization: "Re-Equip the Armor"
 TAI_armor_modernization_desc: "Replace the old M48 tanks and M113 carriers with M1A2s and Clouded Leopard eight-wheelers. The army's M48s and M113s are Vietnam-era equipment and long past their best; the M1A2Ts sold by the US and the domestic Clouded Leopards take the National Army's armor several generations forward in firepower and protection."
 TAI_army_aviation: "Army Aviation Brigades"
 TAI_army_aviation_desc: "Apache and Black Hawk helicopters give the army three-dimensional mobility. The Army Aviation and Special Forces Command acquires thirty AH-64E Apaches and dozens of UH-60M Black Hawks; the attack helicopters can hunt enemy landing craft over the beaches, while the Black Hawks move troops quickly."
 TAI_whampoa_spirit: "Whampoa Spirit"
 TAI_whampoa_spirit_desc: "Fraternity, love, sincerity, truth. The motto of the Military Academy is the soul of the National Army, unchanged for a century. Founded on Changzhou Island in Guangzhou in 1924, Whampoa trained the generals of the Northern Expedition and the War of Resistance; after moving to Taiwan the academy carries on the tradition at Fengshan, and every graduating class takes its oath before the school gate."
 TAI_special_forces: "Special Forces"
 TAI_special_forces_desc: "Airborne special forces, Sea Dragon frogmen and the Military Police Night Hawks: the sharpest blades in the National Army. The Airborne Special Service Company can parachute from thirty thousand feet to infiltrate the enemy's rear, the frogmen specialize in underwater demolition and amphibious reconnaissance, and the Night Hawks handle counterterrorism in the capital; few in number, they are the National Army's elite."
 TAI_mobile_defense_doctrine: "Mobile Defense Doctrine"
 TAI_mobile_defense_doctrine_desc: "Win at the shoreline, defend in depth and destroy the enemy at the water's edge with mobile strikes. The National Army's defense concept has three phases, ‘force preservation, decisive battle in the littoral, annihilation on the beaches’: first preserve strength, then destroy the landing force at sea and on the beaches, so that no invader can gain a foothold on Taiwan."
 TAI_hsiung_feng_missiles: "Hsiung Feng Missiles"
 TAI_hsiung_feng_missiles_desc: "The Hsiung Feng anti-ship and land-attack cruise missiles are the sword that deters any crossing. The Hsiung Feng III was one of the world's first supersonic anti-ship missiles and is called a ‘carrier killer’; the Hsiung Feng IIE land-attack cruise missile can strike airfields and ports across the Strait, leaving the PLA's staging areas nowhere to hide."
 TAI_kidd_destroyers: "Kidd-Class Destroyers"
 TAI_kidd_destroyers_desc: "Buy four Kidd-class destroyers from the US, greatly improving air defense. The Kidds were originally built for the Shah of Iran and taken over by the US Navy after the Iranian Revolution; they join the Republic of China Navy in 2005 as the Keelung class, becoming the largest warships in the fleet with the strongest air defense."
 TAI_indigenous_submarine: "Indigenous Submarine Program"
 TAI_indigenous_submarine_desc: "If we cannot buy them, we will build them ourselves. The keel of the Hai Kun will be laid in Kaohsiung. Taiwan has only two usable attack submarines, plus two Second World War relics; under Beijing's pressure the US, the Netherlands and Germany all refused to sell submarines, and Taiwan resolves to build eight diesel-electric boats at home."
 TAI_stealth_corvettes: "Tuo Chiang-Class Corvettes"
 TAI_stealth_corvettes_desc: "Fast, stealthy and heavily armed ‘carrier killers’. The Tuo Chiang class are catamaran corvettes capable of over forty knots, armed with Hsiung Feng II and III missiles; dozens of them dispersed across the Taiwan Strait can make any approaching enemy fleet pay a terrible price."
 TAI_coast_guard_administration: "Coast Guard Administration"
 TAI_coast_guard_administration_desc: "Unify the coast guard forces to protect the waters of the Taiwan Strait and the South China Sea. Founded in 2000, the Coast Guard Administration merges the maritime forces of customs, the police and the military to fight smuggling, drive off foreign fishing boats and conduct rescues; it is also responsible for defending Pratas and Taiping Islands."
 TAI_sea_control_doctrine: "Sea Control Operations"
 TAI_sea_control_doctrine_desc: "Build a layered sea control system from submarines, missile boats and shore-based missiles. Facing the PLA Navy's numbers, the National Army does not seek a decisive fleet battle but lays trap after trap in the Strait: submarines ambush in open water, fast boats strike close in, and shore-based missiles hold the last line."
 TAI_idf_upgrade: "Upgrade the Ching-kuo IDF"
 TAI_idf_upgrade_desc: "Fit the F-CK-1 with new avionics and missiles and start work on the next domestic fighter. The Ching-kuo is the fighter Taiwan built with American help, in service since the 1990s; the upgraded Hsiung Ying version carries Tien Chien II missiles and a new radar, and AIDC begins developing the next advanced trainer and fighter."
 TAI_f16_upgrade: "F-16V Upgrade"
 TAI_f16_upgrade_desc: "Fit more than 140 F-16s with AESA radars, upgrading them to the F-16V Viper. The new radar can track dozens of targets at once and detect the PLA's stealth fighters; Taiwan's F-16 fleet becomes one of the most advanced in Asia."
 TAI_tien_kung_air_defense: "Sky Bow Air Defense Network"
 TAI_tien_kung_air_defense_desc: "Build a multi-layered air defense network covering the whole island around the Sky Bow III. The Sky Bow is a long-range air defense missile developed by NCSIST, complementing the American Patriot; air defense sites are dispersed across the mountains and cities, and any attacking aircraft or ballistic missile will face layer upon layer of interception."
 TAI_air_base_hardening: "Harden the Air Bases"
 TAI_air_base_hardening_desc: "Dispersal shelters, rapid runway repair and Chiashan Air Base let the air force fight on after the first strike. Chiashan in Hualien is built inside a mountain and can hold two hundred aircraft; runway repair teams at every base can fix bombed runways within hours, ensuring the air force can still take off after a missile attack."
 TAI_drone_program: "Drone Program"
 TAI_drone_program_desc: "NCSIST's Teng Yun drone and all kinds of small drones are new weapons of asymmetric warfare. With a complete electronics and manufacturing supply chain, Taiwan can mass-produce drones cheaply; in a war across the Strait, thousands of drones could launch saturation attacks on a landing fleet."
 TAI_air_superiority_doctrine: "Air Superiority Operations"
 TAI_air_superiority_doctrine_desc: "Control of the air over the Strait decides everything. Without it the navy cannot leave port, the army cannot maneuver, and neither landing nor repelling a landing is possible; the National Army's air force coordinates early warning, air defense and fighters to make sure it does not lose the skies over the Strait."
 TAI_long_range_strike: "Long-Range Precision Strike"
 TAI_long_range_strike_desc: "The Hsiung Sheng and Yun Feng missiles can strike deep targets across the Strait. The Yun Feng is a supersonic medium-range missile developed by NCSIST with enough range to reach Beijing, and the Hsiung Sheng a land-attack cruise missile. These weapons give Taiwan the ability to ‘fight the decisive battle offshore’ for the first time, and the command centers across the Strait are no longer safe."
 TAI_joint_operations: "Joint Operations"
 TAI_joint_operations_desc: "Break down service parochialism and build a joint operations command. The army, navy and air force used to go their own way, and in exercises their radios could not even talk to each other; the new joint operations command directs all three services and links every ship, aircraft and missile site by datalink."
 TAI_iron_bastion: "An Impregnable Fortress"
 TAI_iron_bastion_desc: "Layer upon layer of defenses from Kinmen and Matsu to Penghu and Taiwan itself. Kinmen's tunnels, Penghu's coastal batteries and the beach fortifications of Taiwan form a defense in depth; every possible landing beach is laid with obstacles, mines and firing positions, and every step an invader takes will cost him."
 TAI_defense_autonomy: "Defense Self-Reliance"
 TAI_defense_autonomy_desc: "Key weapons cannot depend on others, and the defense industry must stand on its own feet. American arms sales are often delayed for political reasons, with deliveries dragging on for years; the defense autonomy policy centers on NCSIST, AIDC and CSBC so that missiles, fighters and submarines can all be designed and built in Taiwan."
 TAI_cyber_command: "Information, Communications and Electronic Force"
 TAI_cyber_command_desc: "Set up the Information, Communications and Electronic Force Command to defend against and counter cyberattacks from across the Strait. Taiwan suffers millions of cyberattacks a day, targeting government agencies, banks and the power grid; the command defends critical infrastructure and, when necessary, strikes back in cyberspace."
 TAI_csist_expansion: "Expand NCSIST"
 TAI_csist_expansion_desc: "The National Chung-Shan Institute of Science and Technology is the heart of defense technology. Expand it and give it more research money: NCSIST developed the Sky Bow, Hsiung Feng and Sky Sword missiles and the Ching-kuo's engine and is the cornerstone of Taiwan's defense autonomy; its new institutes focus on drones, missiles and artificial intelligence."
 TAI_pragmatic_diplomacy: "Pragmatic Diplomacy"
 TAI_pragmatic_diplomacy_desc: "As long as the Republic of China can be seen by the world, names and forms can be flexible. From ‘Chinese Taipei’ to ‘the Separate Customs Territory of Taiwan, Penghu, Kinmen and Matsu’, Taiwan takes part in international organizations under many names; it has few formal allies, but more than a hundred representative offices around the world, and its substantive relations have never been broken."
 TAI_us_arms_sales: "US Arms Sales"
 TAI_us_arms_sales_desc: "Under the Taiwan Relations Act, press the US to sell more advanced defensive weapons. F-16s, Patriot missiles, Apache helicopters and Harpoon missiles are all key equipment Taiwan has bought from America; every sale goes through congressional review, and every one draws furious protests from Beijing."
 TAI_japan_partnership: "Taiwan-Japan Partnership"
 TAI_japan_partnership_desc: "Japan is one of Taiwan's most important neighbors, with great scope for cooperation in trade, technology and security. Goodwill between the two peoples has long been among the highest in the world, and Taiwan donated more than twenty billion yen after the 2011 earthquake; Japanese semiconductor materials and equipment are indispensable partners of Taiwan's chip industry."
 TAI_secure_allies: "Secure Our Allies"
 TAI_secure_allies_desc: "The allies in Central America, the Caribbean and the Pacific are the pillars of the Republic of China's international standing. Beijing lures away one ally after another with aid and investment, and every break in relations is a heavy blow to Taiwan's diplomacy; the foreign ministry shores up the remaining dozen or so with medical missions, agricultural teams and scholarships."
 TAI_taiwan_relations_act: "Taiwan Relations Act"
 TAI_taiwan_relations_act_desc: "The US Congress is Taiwan's staunchest friend. After the break in relations in 1979, Congress passed the Taiwan Relations Act, promising Taiwan defensive arms and declaring any attempt to decide Taiwan's future by non-peaceful means a threat to peace in the western Pacific; for more than forty years Congress has backed Taiwan on a bipartisan basis."
 TAI_us_trade_talks: "Taiwan-US Trade and Investment Framework"
 TAI_us_trade_talks_desc: "Push for a US–Taiwan trade agreement and expand technology and investment cooperation. The US is Taiwan's second-largest trading partner, and TSMC's plant in Arizona and the reshaping of semiconductor supply chains bind the two economies ever closer; the Trade and Investment Framework Agreement is a first step toward a free trade agreement."
 TAI_japan_tech: "Taiwan-Japan Technology Cooperation"
 TAI_japan_tech_desc: "Semiconductor materials, equipment and precision machinery: the industries of Taiwan and Japan are highly complementary. TSMC builds a plant in Kumamoto, while Japan's Tokyo Electron and Shin-Etsu supply the equipment and silicon wafers Taiwan's fabs need; mutual trust in the supply chain is the best insurance against geopolitical risk."
 TAI_central_america_aid: "Central American Aid Program"
 TAI_central_america_aid_desc: "Medical missions, agricultural teams and scholarships strengthen the friendship with the Central American allies. Taiwan's mobile medical teams hold free clinics in the mountains of Guatemala and Honduras, agricultural teams teach local farmers to grow rice and vegetables, and thousands of Central American students study in Taipei on Taiwanese scholarships."
 TAI_pacific_allies: "Pacific Allies"
 TAI_pacific_allies_desc: "The Marshall Islands, Tuvalu, Nauru, Palau and the Solomon Islands: Taiwan's partners in the South Pacific. These island nations have few people but each has a vote in the UN General Assembly; Taiwan gives them aid for health care, fisheries and climate change, and Palau's president has said openly that ‘Taiwan is our most reliable friend’."
 TAI_us_military_exchange: "Taiwan-US Military Exchanges"
 TAI_us_military_exchange_desc: "Officer exchanges, joint training and intelligence sharing. The US military advisory group left in 1979, but military exchanges between the two never really stopped: Taiwanese officers study at American military colleges, F-16 pilots train in Arizona, and American observers appear at the Han Kuang exercises."
 TAI_overseas_chinese_affairs: "Overseas Chinese Affairs"
 TAI_overseas_chinese_affairs_desc: "The overseas Chinese are ‘the mother of the revolution’. Strengthen their attachment to the Republic of China: the Overseas Community Affairs Council runs cultural and education centers around the world, with Chinese schools and cultural events; many old émigrés still keep the Blue Sky, White Sun flag and portraits of the Father of the Nation, and their children come to Taiwan for university."
 TAI_europe_relations: "Taiwan-Europe Relations"
 TAI_europe_relations_desc: "Build friendly ties with the European Parliament and national parliaments. European countries recognize Beijing, but members of the European Parliament and national legislatures look kindly on Taiwan's democracy; Lithuania allows a ‘Taiwanese Representative Office’, the president of the Czech Senate leads a delegation to Taipei, and Taiwan–Europe relations keep warming on the basis of shared values."
 TAI_africa_allies: "African Allies"
 TAI_africa_allies_desc: "Strengthen ties with Eswatini and the other African allies. More than a dozen African countries once recognized the Republic of China, and now only Eswatini remains; Taiwan gives its partners aid for health care, agriculture and vocational training, and Eswatini's king has visited Taiwan many times, calling it ‘a true friend’."
 TAI_wto_accession: "Join the WTO"
 TAI_wto_accession_desc: "Join the World Trade Organization as ‘the Separate Customs Territory of Taiwan, Penghu, Kinmen and Matsu’. Taiwan applied to join the GATT in 1990, and after twelve years of negotiation joined the WTO in 2002, right after the mainland; it is one of the few international organizations in which Taiwan takes part as an equal member."
 TAI_international_space: "Expand International Space"
 TAI_international_space_desc: "Take part in the World Health Assembly, the International Civil Aviation Organization and other bodies as an observer or under special names. During the SARS epidemic Taiwan paid a bitter price for being shut out of the WHO; the foreign ministry, together with its allies and like-minded countries, knocks on the doors of international organizations year after year."
 TAI_who_bid: "Participate in the WHO"
 TAI_who_bid_desc: "Disease knows no borders. Seek to attend the World Health Assembly as an observer. When SARS broke out in 2003, WHO experts could not get into Taiwan for weeks; from 2009 to 2016 Taiwan attended the WHA as ‘Chinese Taipei’. Taiwan's performance against COVID-19 wins it the support of more countries."
 TAI_de_facto_alliance: "De Facto Alliance"
 TAI_de_facto_alliance_desc: "No treaty in name, but an alliance in fact. America's ‘strategic ambiguity’ leaves Beijing unsure whether US forces would intervene in a Taiwan Strait conflict; arms sales, military exchanges and intelligence sharing have already made the US–Taiwan relationship a de facto alliance."
 TAI_global_partner: "Global Partner"
 TAI_global_partner_desc: "The Republic of China is a responsible member of the international community. Donating masks during the pandemic, sending rescue teams to disasters, giving aid for development: ‘Taiwan can help’ is no longer just a slogan. It has few formal allies, but Taiwan has won the world's respect through its deeds."
 TAI_new_republic_era: "A New Era for the Republic"
 TAI_new_republic_era_desc: "The flag of the Republic of China flies over all of China again. More than seventy years ago the Nationalist government withdrew from this land; now the Blue Sky, White Sun and a Wholly Red Earth flag is raised once more over Nanjing, Beiping and Guangzhou. Everything must be rebuilt from the beginning, and 1.4 billion compatriots are waiting to see whether this government can do better than the last."
 TAI_return_capital_nanjing: "Make Nanjing the Capital"
 TAI_return_capital_nanjing_desc: "The National Government makes Nanjing its capital! The President is sworn in before the Sun Yat-sen Mausoleum as a salute is fired from Purple Mountain. Nanjing was the capital chosen by the Father of the Nation and the place where the flag came down over the Presidential Palace in 1949; returning here tells the nation that the constitutional order of the Republic of China was never broken. The capital stays in Nanjing by default. Mutually exclusive with ‘Move the Capital to Beiping’."
 TAI_military_government_period: "Period of Military Government"
 TAI_military_government_period_desc: "Under the Founding Father's Fundamentals of National Reconstruction, nation-building has three stages: military government, political tutelage and constitutional government. In the first days of the Restoration, restoring order and clearing out the remnants come first."
 TAI_social_stabilization: "Stabilize Livelihoods"
 TAI_social_stabilization_desc: "Food, wages, pensions: first let ordinary people get on with their lives. At a change of regime, the greatest danger is empty grain shops, unpaid wages and retirees left without their pensions. The government draws on foreign reserves and Taiwan's grain stocks to keep supplies flowing everywhere, and promises that existing pensions will be paid as usual."
 TAI_frontier_policy: "Frontier Policy"
 TAI_frontier_policy_desc: "Mongolia, Tibet and Xinjiang are autonomous regions protected by the Constitution of the Republic of China. The new government needs a frontier policy that upholds unity while respecting every people."
 TAI_restore_provinces: "Rebuild the Provincial Governments"
 TAI_restore_provinces_desc: "Restore the provincial governments and appoint provincial chairmen. The CCP-era provincial party secretaries and governors are either replaced or kept on, and the new chairmen are mostly cadres sent from Taiwan and enlightened local figures. The provincial machinery must start working quickly, or the provinces will fall into a vacuum."
 TAI_east_china_admin: "East China Administrative Region"
 TAI_east_china_admin_desc: "Jiangsu, Zhejiang, Shanghai, Shandong, Fujian, Anhui and Jiangxi: the richest heartland of the Republic of China and the Nationalist government's old base. Shanghai's finance, southern Jiangsu's manufacturing and Zhejiang's private enterprise will power the rebuilding of the whole country; Taiwanese businesses have operated here for thirty years, and the networks and industries are already in place."
 TAI_south_china_admin: "South China Administrative Region"
 TAI_south_china_admin_desc: "Guangdong, Guangxi and Hainan, the gateway to Southeast Asia. Guangzhou was the birthplace of the National Revolution, where the Whampoa Military Academy and Sun Yat-sen University were founded; the Pearl River Delta's world factory sits across the water from Hong Kong and Macau, and overseas Chinese capital from Southeast Asia flows back through here first."
 TAI_central_china_admin: "Central China Administrative Region"
 TAI_central_china_admin_desc: "Henan, Hubei and Hunan are China's granary and transport hub: the Beijing–Guangzhou railway meets the Yangtze at Wuhan, and the saying goes that when Hunan and Hubei have a good harvest, the whole country has enough. The first shot of the 1911 Revolution was fired at Wuchang, and the stability of central China holds the country together north, south, east and west."
 TAI_north_china_admin: "North China Administrative Region"
 TAI_north_china_admin_desc: "Beiping, Tianjin, Hebei, Shanxi, Chahar and Suiyuan, with the provinces of Hebei, Chahar and Suiyuan re-established. North China is where the CCP ruled longest and was most deeply rooted, and the region with the most complex security situation after the Restoration; Beiping's universities, Tianjin's port and Shanxi's coal mines all demand the new government's greatest effort."
 TAI_northeast_admin: "Northeast Administrative Region"
 TAI_northeast_admin_desc: "Restore the nine provinces of the Northeast and revive the old industrial base. Liaoning, Andong, Liaobei, Jilin, Songjiang, Hejiang, Heilongjiang, Nenjiang and Xing'an were the nine provinces drawn up by the Nationalist government after victory over Japan. Mass layoffs and population flight from the old industrial base are among the toughest economic problems after the Restoration."
 TAI_northwest_admin: "Northwest Administrative Region"
 TAI_northwest_admin_desc: "Shaanxi, Gansu, Ningxia, Qinghai and Xinjiang, the starting point of the Silk Road. The ancient capital of Xi'an, Lanzhou's petrochemicals, Qinghai's salt lakes and Xinjiang's oil and gas are all national treasures; but the land is vast, the population thin and ethnically diverse, and governance must balance development with stability on the frontier."
 TAI_southwest_admin: "Southwest Administrative Region"
 TAI_southwest_admin_desc: "Sichuan, Chongqing, Yunnan, Guizhou and Xikang, the great rear area of the War of Resistance. Chongqing was the wartime capital of the Nationalist government, and the National Southwestern Associated University carried on teaching in Kunming; now this land of mountains and rivers must move beyond the legacy of the Third Front and become a corridor to Southeast and South Asia."
 TAI_county_reorganization: "County Reorganization"
 TAI_county_reorganization_desc: "Abolish prefecture-level cities and restore a two-tier province–county system to cut layers of administration. The CCP's system of cities administering counties let prefectural cities siphon off resources while county towns withered; restoring the county as the basic unit of local self-government is a precondition for the Father of the Nation's vision of local autonomy."
 TAI_hainan_province: "Hainan Province"
 TAI_hainan_province_desc: "Make Hainan Island a province of its own and develop it into an international free trade island. Hainan is much like Taiwan: a tropical island with the potential to be an open gateway. The new government brings in Taiwan's export processing zone experience to make Sanya and Haikou financial, tourism and logistics centers facing Southeast Asia, and bases the navy at Yulin."
 TAI_balanced_powers: "Balance of Central and Local Power"
 TAI_balanced_powers_desc: "A balance of powers between the center and the localities: matters national in nature belong to the central government, matters that should be adapted to local conditions belong to the localities, leaning toward neither centralization nor decentralization. It is the spirit of Chapter X of the Constitution of the Republic of China and an institutional safeguard against both regional separatism and central despotism."
 TAI_martial_order: "Restore Order"
 TAI_martial_order_desc: "Military police and police take over public order everywhere, disarm the militias and local armed groups, and collect weapons and ammunition scattered among the population. In the early days of the Restoration many cities saw looting and revenge lynchings, and restoring order is the new government's first step to finding its footing."
 TAI_purge_remnants: "Clear Out the Remnants"
 TAI_purge_remnants_desc: "Diehards who refuse to accept the new government must be eliminated: units resisting by force, underground groups plotting uprisings and intelligence services refusing to hand over their files. But every sweep can create new hatred, and the National Army must keep the scope of its operations as narrow as possible."
 TAI_ccp_question: "The CCP Question"
 TAI_ccp_question_desc: "What is to become of ninety million CCP members? It is the greatest dilemma facing the new government. Among them are corrupt officials and enforcers, but also ordinary teachers, workers and grassroots cadres; punishing them all would plunge the country into civil war, while forgiving them all would betray the victims of every past campaign. The new government must choose."
 TAI_national_reconciliation: "National Reconciliation"
 TAI_national_reconciliation_desc: "‘Meet with a smile and let old grudges vanish.’ Ordinary party members and grassroots cadres will not be prosecuted, trading forgiveness for the unity of 1.4 billion people. Following South Africa's Truth and Reconciliation Commission, perpetrators tell the truth in exchange for amnesty; anyone willing to swear loyalty to the constitution will not be held back by their past."
 TAI_mainland_transitional_justice: "Reckoning and Transitional Justice"
 TAI_mainland_transitional_justice_desc: "The victims of every political campaign deserve an accounting: the Anti-Rightist Campaign, the Great Famine, the Cultural Revolution and June Fourth. Prosecute those responsible for grave human rights abuses according to law, open the archives, rehabilitate the wrongly condemned and dismantle the CCP's organizational system. Justice is decades late, but it must not be absent."
 TAI_party_asset_settlement: "Settle the CCP's Assets"
 TAI_party_asset_settlement_desc: "The vast party assets, party-run businesses and ‘slush funds’ are taken into the treasury and used for local reconstruction and resettlement. From party schools and newspaper buildings to the property and accounts of party committees at every level, the CCP's assets run into the trillions; the experience Taiwan gained dealing with the Kuomintang's own party assets is now applied on a much larger scale."
 TAI_political_amnesty: "Pardon Political Prisoners"
 TAI_political_amnesty_desc: "Release all political prisoners jailed for their speech, faith or association: rights lawyers, underground church pastors, Falun Gong practitioners, intellectuals from Xinjiang and Tibet. When the prison gates open, many have spent more than a decade inside; their testimony will become the most important material for transitional justice."
 TAI_political_tutelage_period: "Period of Political Tutelage"
 TAI_political_tutelage_period_desc: "The government trains the people to exercise the four powers of election, recall, initiative and referendum, introducing local self-government county by county. It is the second of the three stages laid down in the Father of the Nation's Fundamentals of National Reconstruction; Taiwan took forty years to complete tutelage, and the mainland hopes to move faster."
 TAI_four_rights_training: "Training in the Four Rights"
 TAI_four_rights_training_desc: "Open citizenship classes in every county to teach the people how to use the four powers of election, recall, initiative and referendum. Mainlanders who have never cast a real ballot must learn how to judge candidates, oversee officials and bring citizens' initiatives; many of the volunteer teachers are university students from Taiwan."
 TAI_local_self_government: "County Self-Government"
 TAI_local_self_government_desc: "Once the people of a county have completed their training in the four powers, they may elect their county officials to run the county's affairs. The first self-governing counties appear in Jiangsu, Zhejiang and Guangdong, with magistrates directly elected by the voters; among the winners are Taiwanese businessmen, teachers and even former CCP grassroots cadres."
 TAI_control_yuan_anticorruption: "The Control Yuan Fights Corruption"
 TAI_control_yuan_anticorruption_desc: "The Control Yuan and the Independent Commission Against Corruption join forces to punish corruption in the takeover. The plunder that passed for ‘takeover’ after victory in 1945 cost the Nationalist government the mainland's trust; this time any official who enriches himself in the takeover will be impeached and prosecuted, and history's mistake must not be repeated."
 TAI_national_assembly: "Convene the National Assembly"
 TAI_national_assembly_desc: "Delegates from every province gather in Nanjing to revise the Additional Articles of the Constitution and prepare for the constitutional period. The last time the National Assembly met on the mainland was 1948; now the delegates must work out how to apply a constitution written for 450 million people to the 1.4 billion of today."
 TAI_provincial_assemblies: "Provincial Assembly Elections"
 TAI_provincial_assemblies_desc: "Provincial assemblies are directly elected by the people, and for the first time provincial assemblymen can question the provincial chairmen and scrutinize provincial budgets. Campaigns everywhere are lively, and many candidates borrow Taiwan's election culture: sound trucks, rallies and street canvassing."
 TAI_constitutional_period: "Period of Constitutional Government"
 TAI_constitutional_period_desc: "Once more than half the provinces have achieved full self-government, the constitutional period begins. The Constitution of the Republic of China takes full effect, and the transitional measures of military rule and tutelage are abolished one by one; it is the last of the Father of the Nation's three stages of national reconstruction, and the moment generations have dreamed of for more than seventy years."
 TAI_first_national_election: "The First National Election"
 TAI_first_national_election_desc: "For the first time, 1.4 billion voters choose the nation's leaders with their ballots. From the forests of Heilongjiang to the fishing villages of Hainan, long lines form outside the polling stations; international observers call it the largest democratic election in human history. Whatever the result, the Chinese people have proved that democracy is not a Western monopoly."
 TAI_five_yuan_nationwide: "The Five Yuan Nationwide"
 TAI_five_yuan_nationwide_desc: "The Executive, Legislative, Judicial, Examination and Control Yuan are working normally across the country. The five-power constitution the Father of the Nation designed by combining the Western separation of powers with China's traditional examination and censorate systems is finally fully implemented in the land where it was born; provincial branches of the Examination Yuan hold the first national civil service examinations."
 TAI_world_for_all: "The World Belongs to All"
 TAI_world_for_all_desc: "‘When the Great Way prevails, the world belongs to all.’ A Republic of China of the people, by the people and for the people has finally been realized across all of China. These words are carved in stone at the Sun Yat-sen Mausoleum, and for a hundred years countless people fought and died for them; today they are no longer just a slogan."
 TAI_party_politics: "Party Politics"
 TAI_party_politics_desc: "With the National Assembly elections over, the parties begin to organize, compete and cooperate nationwide. The Republic of China enters a true age of party politics."
 TAI_kmt_government: "The Kuomintang Governs"
 TAI_kmt_government_desc: "The century-old party has won the first national election. On the prestige of the Restoration, its complete organization and its experience governing Taiwan, the Kuomintang wins a majority among mainland voters; it will govern all of China by the Three Principles of the People, and must prove it is no longer the corrupt party-state of old."
 TAI_kmt_party_state_separation: "Separate Party and State"
 TAI_kmt_party_state_separation_desc: "Party assets go to the state and party posts are separated from public office: the Kuomintang is no longer the ‘party-state’. Party branches in the army, police and schools are abolished, and party membership is no longer a qualification for office; the Kuomintang must compete fairly in elections as an ordinary democratic party."
 TAI_kmt_fiscal_prudence: "Sound Finances"
 TAI_kmt_fiscal_prudence_desc: "Live within our means and never let inflation repeat the tragedy of 1949. The failure of the gold yuan reform in 1948, with prices rising several times a day, brought down the Nationalist government's rule on the mainland; today's finance minister keeps that year's price table on his office wall as a reminder to himself and his colleagues."
 TAI_kmt_strong_defense: "Defense First"
 TAI_kmt_strong_defense_desc: "National unification was hard won and must be guarded by a strong defense. Russia to the north, Japan to the east and the South China Sea disputes are all testing this newborn democratic China; the Kuomintang government raises the defense budget and expands arms factories and naval bases on the mainland."
 TAI_kmt_one_family: "One Family Across the Strait"
 TAI_kmt_one_family_desc: "Compatriots in Taiwan and on the mainland are one family, and healing half a century of separation is the ruling party's first priority. Marriage, trade, study and migration across the Strait are fully opened, Taiwanese can vote on the mainland and mainlanders can settle in Taiwan without red tape, and the line between ‘locals’ and ‘outsiders’ slowly fades."
 TAI_kmt_pro_business: "Pro-Business Policy"
 TAI_kmt_pro_business_desc: "Cut taxes, deregulate and attract investment, and let private capital develop freely. The CCP-era restrictions on private enterprise are scrapped one by one, and Taiwanese, Hong Kong and overseas Chinese businesses all step up their investment; the Kuomintang government believes economic freedom is the foundation of political freedom."
 TAI_kmt_four_social_bonds: "Propriety, Righteousness, Integrity and Shame"
 TAI_kmt_four_social_bonds_desc: "Restore traditional ethics and rebuild society's moral order. Propriety, righteousness, integrity and shame are the four bonds of the nation; the Cultural Revolution destroyed tradition and the market economy eroded trust. The Kuomintang government brings traditional culture back into the schools, restores Confucian temples and ancestral halls across the country, and promotes a modern version of the New Life Movement."
 TAI_kmt_greater_china_economy: "Greater China Economic Sphere"
 TAI_kmt_greater_china_economy_desc: "Integrate the capital of Taiwan, Hong Kong, the mainland and the Chinese of Southeast Asia into the world's largest economic sphere. The Chinese business networks of Singapore, Malaysia and Indonesia once bankrolled the 1911 Revolution, and now they bring their money and connections back to the motherland; from Taipei and Hong Kong to Kuala Lumpur, a Chinese economic sphere spanning the South China Sea is taking shape."
 TAI_kmt_era: "A Century-Old Party Reborn"
 TAI_kmt_era_desc: "From the Revive China Society and the Tongmenghui to the unification of China, the Kuomintang has come more than a hundred years: it led the 1911 Revolution and the Northern Expedition, bore the eight-year War of Resistance, lost the mainland and reinvented itself in Taiwan. Now it governs all of China again as a democratic party, and the century-old institution is born anew."
 TAI_dp_government: "The China Democratic Party Governs"
 TAI_dp_government_desc: "The China Democracy Party, crushed on the mainland in 1998, has now won the national election. Founders such as Wang Youcai and Xu Wenli were given heavy sentences and driven into exile, but their successors have won the voters' trust. The liberal era has arrived."
 TAI_dp_bill_of_rights: "Bill of Rights"
 TAI_dp_bill_of_rights_desc: "Freedom of speech, assembly, association, religion and movement is written into law and guaranteed by the courts, and no government body may restrict citizens' basic rights in the name of ‘maintaining stability’. The national security laws and the crime of ‘picking quarrels and provoking trouble’ are abolished, and people can sue the government for violating their rights for the first time."
 TAI_dp_free_market: "Free Market"
 TAI_dp_free_market_desc: "Abolish price controls and administrative approvals and let the market allocate resources. In the CCP era, opening a company took a hundred official stamps; the Democracy Party government replaces approval with simple registration, leaves the prices of credit, land and energy to the market, and limits the state to regulation and fair competition."
 TAI_dp_provincial_autonomy: "Federation of Self-Governing Provinces"
 TAI_dp_provincial_autonomy_desc: "Expand the provinces' legislative and fiscal autonomy and move toward a decentralized democratic China. The ‘federalist provinces’ movement of the 1920s called for each province to write its own constitution and then join a federation; the Democracy Party believes that only decentralization can make a country of 1.4 billion truly democratic."
 TAI_dp_judicial_independence: "Judicial Independence"
 TAI_dp_judicial_independence_desc: "Life tenure for judges, constitutional review and trial by jury. The party's political-legal committees are abolished, and the courts take orders from no party; juries are introduced first for serious criminal cases, ordinary citizens take part in trials for the first time, and public trust in the courts begins to recover."
 TAI_dp_open_society: "Open Society"
 TAI_dp_open_society_desc: "Let foreign media, scholars and investors come and go freely, abolishing visa restrictions and screening of foreign investment. Overseas universities open mainland campuses and foreign journalists report freely; openness brings new ideas and capital, and also shocks and unease."
 TAI_dp_antitrust: "Antitrust Law"
 TAI_dp_antitrust_desc: "Break up monopolistic state firms and conglomerates to guarantee fair competition. PetroChina, China Mobile and the big state banks are split up and restructured, and the platform monopolies of private internet giants come under review too; the Democracy Party believes the market's enemies are not only the planned economy but monopoly capital as well."
 TAI_dp_join_free_world: "Join the Free World"
 TAI_dp_join_free_world_desc: "Join the economic and security architecture of the Western democracies: apply to the OECD and the CPTPP, and set up security dialogues with the US, Japan and Australia. Thirty years after the Cold War, China stands with the Western world as a liberal democracy for the first time, and the geopolitics of the whole world is rewritten."
 TAI_dp_liberal_china: "Free China"
 TAI_dp_liberal_china_desc: "The ideals of Lei Chen and Yin Haiguang have finally been realized across all of China. In the 1950s their magazine Free China called for an opposition party and free speech, and Lei Chen spent ten years in prison for it; more than sixty years later, the free, democratic China under the rule of law they dreamed of is no longer just words on paper."
 TAI_sd_government: "The Social Democrats Govern"
 TAI_sd_government_desc: "The China Social Democratic Party, made up of reformist former CCP members, union leaders and intellectuals, has won the election. Heir to the ideals of Zhao Ziyang's reformers of the 1980s, it stands for a market economy combined with social justice; among laid-off workers and migrant laborers its support far outstrips that of any other party."
 TAI_sd_free_unions: "Independent Unions"
 TAI_sd_free_unions_desc: "Workers can finally form unions that truly belong to them. In the CCP era the All-China Federation of Trade Unions was a mere appendage of the party and strikers were often arrested; now workers at Foxconn and BYD elect their own union representatives, and for the first time wages and hours are settled through collective bargaining between labor and management."
 TAI_sd_welfare_state: "Welfare State"
 TAI_sd_welfare_state_desc: "Build a cradle-to-grave social safety net on the Nordic model: unemployment insurance, health insurance, child allowances and housing subsidies. The Social Democrats believe the Father of the Nation's Principle of People's Livelihood was always a form of socialism; the price is higher taxes and a heavier fiscal burden."
 TAI_sd_people_dividend: "A People's Dividend from State Assets"
 TAI_sd_people_dividend_desc: "The profits of state enterprises are paid out to every citizen as a dividend. The idea draws on Alaska's Permanent Fund and Norway's sovereign wealth fund: state enterprises always belonged to the whole people, their profits were once carved up by the powerful, and now they must truly return to the people."
 TAI_sd_free_education: "Free Education"
 TAI_sd_free_education_desc: "Education is free from kindergarten to university, with board and meal subsidies for rural students. Education was once one of the ‘three mountains’ weighing on ordinary families, and many rural children who passed the university exams could not afford the fees; the Social Democrats see equal education as the starting point of social mobility."
 TAI_sd_national_pension: "National Pension"
 TAI_sd_national_pension_desc: "Every citizen, in town or country, is provided for in old age. Retired urban civil servants used to receive dozens of times what farmers got, and many rural elderly received only one or two hundred yuan a month; a unified national pension gives every old person enough to live with dignity."
 TAI_sd_progressive_tax: "Progressive Taxation"
 TAI_sd_progressive_tax_desc: "The rich pay more tax and wealth is redistributed. China's Gini coefficient has long been very high, with the top one percent holding a third of the wealth; the Social Democrats introduce property, inheritance and capital gains taxes to pay for the welfare state."
 TAI_sd_green_growth: "Green Development"
 TAI_sd_green_growth_desc: "Clean up the smog and restore the rivers so China can see blue skies again. Coal plants and steel mills in North China are gradually closed or upgraded, polluters on the Yangtze and the Yellow River are ordered to clean up, and wind, solar and electric vehicles become new engines of growth; environmental protection is no longer the enemy of development."
 TAI_sd_social_china: "A Socially Just China"
 TAI_sd_social_china_desc: "The Principle of People's Livelihood and social democracy have found a common answer here. The Father of the Nation said the Principle of Livelihood was socialism, also called communism, which is to say the ideal of the Great Harmony; a hundred years later, a China with both market efficiency and social security proves the road can be traveled."
 TAI_grand_coalition: "Grand Coalition Government"
 TAI_grand_coalition_desc: "No party has won a majority. The Kuomintang, the Democracy Party, the Social Democrats and Taiwan's parties each hold a share of parliament, and none can form a government alone. For the sake of national stability the major parties form a grand coalition, setting aside the grudges of the campaign for now."
 TAI_gc_coalition_agreement: "Coalition Agreement"
 TAI_gc_coalition_agreement_desc: "The parties sign a coalition agreement setting out the greatest common denominator of their programs. Running to two hundred pages, it lists every point of consensus on the economy, foreign affairs and social policy, as well as the mechanism for resolving disagreements; Germany's coalition agreements serve as the negotiators' model."
 TAI_gc_cabinet_sharing: "Sharing the Cabinet"
 TAI_gc_cabinet_sharing_desc: "Cabinet ministries are shared out in proportion to the vote: the Kuomintang takes defense and foreign affairs, the Democracy Party finance and economics, the Social Democrats labor and welfare. With ministers from different parties, cabinet meetings never stop arguing, but every party shares responsibility for governing."
 TAI_gc_constitutional_court: "Constitutional Court"
 TAI_gc_constitutional_court_desc: "Set up a constitutional court as the final arbiter of political disputes. Quarrels within the coalition, disputes between the center and the provinces and contested election results all go to the grand justices to decide according to the constitution; every party promises to obey its rulings unconditionally, the cornerstone that keeps the coalition together."
 TAI_gc_national_unity: "National Unity"
 TAI_gc_national_unity_desc: "On the great questions, government and opposition stand together: defense, foreign affairs and sovereignty are decided jointly by a national security council of party leaders and kept out of election campaigns. Abroad China speaks with one voice; at home the parties can still argue fiercely about everything else."
 TAI_gc_pragmatic_reform: "Pragmatic Reform"
 TAI_gc_pragmatic_reform_desc: "Not left or right, only what works. The coalition sets aside ideological battles and decides policy by pilots and data: a reform is tried in a few provinces first, then rolled out nationwide once its results are assessed. Deng Xiaoping's method of ‘crossing the river by feeling the stones’ finds a new use under democracy."
 TAI_gc_consensus_democracy: "Consensus Democracy"
 TAI_gc_consensus_democracy_desc: "Set up cross-party consultation in parliament: before major bills go to a vote, they must be reviewed by a consultation committee of all the parties. The consensus democracy of Switzerland and the Netherlands is brought in, and while politics moves more slowly, the laws passed are less contested and last longer."
 TAI_gc_steady_progress: "Progress Through Stability"
 TAI_gc_steady_progress_desc: "Stability and development go hand in hand. The coalition neither pursues radical reform nor lets problems pile up: the budget stays balanced, the economy grows steadily and social reform proceeds step by step. Critics say it lacks vision; supporters say that after a century of upheaval, what China needs most is calm."
 TAI_gc_grand_compromise: "Historic Grand Reconciliation"
 TAI_gc_grand_compromise_desc: "Blue and green, Taiwan and the mainland, left and right have found common ground under one roof. Parties that once came to blows in the Legislative Yuan now serve in the same cabinet; peoples who once faced each other across the Strait now live under the same constitution. It is a historic grand reconciliation."
 TAI_democratic_consolidation: "Democratic Consolidation"
 TAI_democratic_consolidation_desc: "Whichever party governs, the constitution and the electoral system have taken deep root across China. Political scientists say democracy is truly consolidated when the losing side accepts the result and waits for its next chance; China has crossed that threshold, and democracy has become ‘the only game in town’."
 TAI_peaceful_transfer: "A Peaceful Transfer of Power"
 TAI_peaceful_transfer_desc: "After the second national election, the ruling party hands power peacefully to the opposition. The outgoing president shakes his successor's hand in front of the Presidential Palace and hands over the seals of state; for a country where for five thousand years changes of power usually ended in war, this moment means more than words can say. It is the mark of a mature democracy."
 TAI_education_reform: "Education Reform"
 TAI_education_reform_desc: "Abolish political study and ideological morality classes and restore general education and civics. History textbooks are rewritten, and the Great Leap Forward, the Cultural Revolution and June Fourth appear truthfully in them for the first time; students learn about the constitution, human rights and civic duty instead of memorizing a leader's quotations."
 TAI_press_freedom: "Freedom of the Press"
 TAI_press_freedom_desc: "Lift the ban on new newspapers and abolish press censorship, dissolving the Propaganda Department and the Cyberspace Administration. When Taiwan lifted its newspaper ban in 1988, the number of papers jumped overnight from thirty-one to hundreds; now countless new publications appear on mainland newsstands, and journalists can report the truth uncensored for the first time."
 TAI_religious_freedom: "Religious Freedom"
 TAI_religious_freedom_desc: "Buddhist temples, Taoist shrines, churches and mosques should all be free to open. Crosses torn down are raised again, underground churches come above ground, and closed mosques and monasteries welcome worshippers once more; the religious affairs bureau no longer interferes in the appointments or doctrines of religious groups, and state and religion each keep to their own sphere."
 TAI_traditional_characters: "Traditional and Simplified Side by Side"
 TAI_traditional_characters_desc: "Restore the teaching of traditional characters while keeping simplified characters in general use. Schools teach both scripts, official documents use traditional characters, and everyday writing is unrestricted; ‘read traditional, write simplified’ reconnects the written language on both sides of the Strait and lets the young generation read the classics and their ancestors' letters."
 TAI_dismantle_firewall: "Tear Down the Great Firewall"
 TAI_dismantle_firewall_desc: "The internet has no walls anymore. The servers of the Great Firewall are switched off, and Google, Wikipedia and YouTube can be freely accessed on the mainland for the first time; hundreds of millions of internet users pour into an online world they have never seen, and a flood of information washes away decades of isolation."
 TAI_civil_society_mainland: "Civil Society Revives"
 TAI_civil_society_mainland_desc: "Trade unions, chambers of commerce, religious groups and NGOs reappear on the mainland. Environmental groups monitor factory pollution, bar associations give legal aid to the vulnerable, and hometown and alumni associations come back to life; a society organized by its own citizens is the most solid soil for democracy."
 TAI_cultural_renaissance: "Chinese Cultural Renaissance"
 TAI_cultural_renaissance_desc: "Restore the monuments, temples and traditional festivals destroyed in the Cultural Revolution. The Temple of Confucius at Qufu and ancestral halls and city god temples across the country are repaired, the customs of Qingming, Duanwu and the Mid-Autumn Festival are honored again, and treasures of the Palace Museum and the National Palace Museum in Taipei are exhibited together in Nanjing and Beiping for the first time."
 TAI_abolish_hukou: "Abolish Household Registration"
 TAI_abolish_hukou_desc: "The two-tier urban–rural household registration system discriminates against peasants and must be abolished. More than two hundred million migrant workers have labored in the cities for decades, yet their children cannot go to school there and their medical bills are not covered; once hukou is abolished, every citizen enjoys the same freedom of movement and public services, and urbanization enters a new wave."
 TAI_national_identity: "Chinese National Identity"
 TAI_national_identity_desc: "Whether from Taiwan or the mainland, we are all citizens of the Republic of China. More than seventy years of separation have left people on both sides speaking the same language but holding different memories; the new government hopes to build a national identity defined by shared values rather than origin, on the common foundation of the constitution and democracy."
 TAI_tibet_autonomy: "Tibetan Autonomy"
 TAI_tibet_autonomy_desc: "On the basis of Article 120 of the Constitution, ‘The self-government system of Tibet shall be guaranteed’, grant Tibet a high degree of autonomy. The Central Tibetan Administration, in exile in India for more than sixty years, opens talks with Nanjing, monasteries regain control of their own affairs, and Tibetan-language education returns to the schools; the possibility of the Dalai Lama's return is seriously discussed for the first time."
 TAI_xinjiang_question: "The Xinjiang Question"
 TAI_xinjiang_question_desc: "Uyghurs, Kazakhs and Han Chinese all live on this land. The new government will abolish the re-education camps, release the hundreds of thousands held there and introduce local self-government; but years of repression have left deep scars, and both separatism and the anxiety of Han settlers will test Nanjing's wisdom."
 TAI_inner_mongolia_leagues: "Inner Mongolian Leagues and Banners"
 TAI_inner_mongolia_leagues_desc: "Restore the autonomy of the Mongol leagues and banners and re-establish the provinces of Chahar, Suiyuan and Rehe. The league and banner system of the early Republic respected the traditions of Mongol princes and herders; Mongolian-language education, sharply cut in 2020, is restored, and herders on the grassland are no longer forced to settle."
 TAI_hk_macau_return: "Hong Kong and Macau Return"
 TAI_hk_macau_return_desc: "Hong Kong and Macau belonged to the People's Republic of China under ‘one country, two systems’, but that one country is gone. Invite them to return to the Republic of China, with their high autonomy guaranteed."
 TAI_five_races_republic: "Five Races Under One Union"
 TAI_five_races_republic_desc: "Han, Manchu, Mongol, Hui and Tibetan: a republic of five races. The Republic of China is the shared state of all its peoples: the five-colored flag of 1912 symbolized the equal union of five great nations, and the idea is now extended to more than fifty. Ethnic minorities have reserved seats in parliament, and their languages, religions and customs are protected by the constitution."
 TAI_economic_reconstruction: "Economic Reconstruction"
 TAI_economic_reconstruction_desc: "Taiwan's capital and experience combined with the mainland's scale and potential. In the early days of the Restoration the stock market crashed, capital fled, local government debts blew up and many factories stopped work amid the change of regime; the new government's first task is to get factories running, banks lending and shops open again."
 TAI_cross_strait_integration: "Cross-Strait Economic Integration"
 TAI_cross_strait_integration_desc: "This will be the largest economic integration of the twenty-first century: two economies merge into one, with tariffs, currency and regulation fully unified. Taiwan's semiconductors, precision machinery and services will combine with the mainland's manufacturing capacity and enormous market; the economics ministry studies the lessons of German reunification over and over."
 TAI_new_fabi: "Currency Reform"
 TAI_new_fabi_desc: "Having the New Taiwan dollar and the renminbi circulate side by side causes chaos. A new central bank is set up to issue a single national currency at fixed conversion rates, named the fabi to carry on the Republic's monetary tradition. Setting the rate is extremely sensitive: too high and mainland savers lose out, too low and Taiwan's wealth is diluted."
 TAI_land_to_the_tiller: "Land to the Tiller"
 TAI_land_to_the_tiller_desc: "Taiwan's rent reduction and land-to-the-tiller reforms were the starting point of its postwar economic miracle. With titles registered to every household and rents cut, hundreds of millions of farmers will for the first time hold full property rights to their land, able to sell it, mortgage it and pass it on; local governments can no longer seize and sell land at will."
 TAI_taishang_return: "Taiwanese Business Comes Home"
 TAI_taishang_return_desc: "Taiwanese businesspeople who spent years building their fortunes on the mainland are now the main force in rebuilding it. Taiwanese factories in Kunshan, Dongguan and Xiamen expand, and the heads of Taiwanese business associations become economic advisers to local governments; they know the mainland's ways and understand world markets, and are the best bridge for cross-Strait integration."
 TAI_soe_question: "The Future of the State Enterprises"
 TAI_soe_question_desc: "More than a hundred thousand state enterprises support over a hundred million people and drag down the whole economy. They monopolize energy, telecoms, finance and transport, yet are generally inefficient and deep in debt; privatization would raise efficiency but put tens of millions out of work, while keeping things as they are would bankrupt the treasury. The new government must decide."
 TAI_soe_privatization: "Privatize the State Enterprises"
 TAI_soe_privatization_desc: "Auctions, stock listings and strategic investors push state enterprises in competitive sectors fully onto the market. Taiwan's experience privatizing China Steel and Chunghwa Telecom is copied on a vast scale, and the treasury takes in huge sums; but preventing the well connected from buying state assets on the cheap is the key to whether the reform succeeds."
 TAI_regulate_capital: "Regulate Capital"
 TAI_regulate_capital_desc: "‘Private individuals must not control the people's livelihood.’ This is what the Father of the Nation meant by regulating capital. Key industries stay in state hands to prevent private monopoly and foreign control; state enterprises must open their books to parliament and submit to audit, no longer the private property of officials and the powerful."
 TAI_sell_state_banks: "Privatize the State Banks"
 TAI_sell_state_banks_desc: "The big four state banks, ICBC, China Construction Bank, the Agricultural Bank and Bank of China, are publicly listed, breaking the financial monopoly. They used to lend to state firms and local governments on the party's orders, piling up mountains of bad debt; once listed they must answer to shareholders and lend on risk rather than connections."
 TAI_private_enterprise_law: "Private Enterprise Protection Act"
 TAI_private_enterprise_law_desc: "Protect private property and fair competition: the private economy is the mainstay of the national economy. Under the CCP, private entrepreneurs constantly feared being squeezed out by the state, arrested or expropriated; the new law states that private property is inviolable and that any taking must be compensated by law, so entrepreneurs can finally plan for the long term."
 TAI_strategic_state_industry: "State Ownership of Strategic Industries"
 TAI_strategic_state_industry_desc: "Steel, energy, telecoms and arms production stay state-run as the bottom line of national security. These industries bear on defense and people's livelihoods and cannot be handed to private capital chasing short-term profit; but state ownership is not monopoly, and they must compete with private firms in the market under professional managers."
 TAI_yangtze_tech_corridor: "Yangtze Delta–Hsinchu Tech Corridor"
 TAI_yangtze_tech_corridor_desc: "Link Hsinchu's fabs with the electronics supply chains of Shanghai, Suzhou and Wuxi into a world-class technology corridor. TSMC expands advanced nodes in Nanjing and Shanghai, and SMIC is folded into a single industrial system; from design and fabrication to packaging and testing, a complete semiconductor ecosystem takes root at the mouth of the Yangtze."
 TAI_pearl_river_manufacturing: "Pearl River Delta Manufacturing"
 TAI_pearl_river_manufacturing_desc: "Half the world's electronics are assembled here: Shenzhen's Huaqiangbei, Foxconn in Dongguan and the battery plants of Huizhou are the heart of the global supply chain. After the change of regime, orders briefly moved to Vietnam and India; the new government wins back foreign brands' trust with the rule of law and openness."
 TAI_bohai_industry: "Bohai Rim Industrial Belt"
 TAI_bohai_industry_desc: "The heavy industrial base of Beiping, Tianjin, Hebei and the Liaodong Peninsula: Tianjin's chemicals and shipbuilding, Tangshan's steel and Dalian's heavy machinery. This area was the heartland of the CCP's planned economy, with severe overcapacity and pollution; the restructured Bohai industrial belt will move into high-end equipment and new materials."
 TAI_world_factory: "Factory of the World"
 TAI_world_factory_desc: "Unified China is the world's largest manufacturing nation, producing more than the US, Japan and Germany combined. Taiwan's technology, the mainland's scale and the trust that democracy brings come together, and ‘Made in China’ no longer means cheap and counterfeit, but quality and innovation."
 TAI_national_tech_program: "National Science and Technology Program"
 TAI_national_tech_program_desc: "Integrate the universities and research institutes of both sides of the Strait and invest heavily in basic science. Academia Sinica and the Chinese Academy of Sciences merge into a new national academy, and Tsinghua and Peking universities set up joint labs with National Taiwan University and National Cheng Kung University; the new government pledges to raise R&D spending above three percent of GDP."
 TAI_space_program: "ROC Space Program"
 TAI_space_program_desc: "Take over the Jiuquan, Xichang and Wenchang launch centers and merge Taiwan's space agency with the China Aerospace Science and Technology Corporation. Taiwan's FORMOSAT satellites are combined with the mainland's Long March rockets, and the Republic of China becomes a space power overnight; human spaceflight and the space station program continue under the Blue Sky, White Sun flag."
 TAI_digital_china: "Digital China"
 TAI_digital_china_desc: "Cloud computing, artificial intelligence and 5G networks form the foundation of a digital China. With the firewall gone, mainland internet companies join the world, and Taiwan's chip design combined with the mainland's vast data lets China keep pace with the US in AI, under the rule of law and with privacy protection."
 TAI_moon_mission: "Moon Program"
 TAI_moon_mission_desc: "Plant the Blue Sky, White Sun and a Wholly Red Earth flag on the Moon. The engineers of the Chang'e program carry on their work, only with a different flag on the spacecraft; when a Republic of China astronaut steps onto the lunar surface, the streets of Taipei and Beiping cheer together and children on both sides of the Strait look up at the sky."
 TAI_central_bank_unification: "Unify the Central Banks"
 TAI_central_bank_unification_desc: "The Central Bank of the Republic of China and the People's Bank of China merge into a single central bank headquartered on the Shanghai Bund. By law the new bank is independent of the Executive Yuan, with price stability as its first goal, and it no longer prints money for the expansion of local governments and state firms."
 TAI_capital_market_merger: "Merge the Stock Markets"
 TAI_capital_market_merger_desc: "The Taipei, Shanghai and Shenzhen stock exchanges are merged into a single market, with listing rules, disclosure and trading brought fully into line with international standards. The unified exchange ranks among the world's three largest by market value, and mainland retail investors invest for the first time in a market free of administrative meddling."
 TAI_tax_reform: "Unified Tax System"
 TAI_tax_reform_desc: "Unify the tax systems of both sides, simplify taxes and broaden the base. The CCP-era system relied on indirect taxes and land sales, and local governments lived by selling land; the new system rests on income and business taxes and redraws revenue sharing between the center and the provinces, so local governments no longer have to live off demolitions."
 TAI_foreign_investment: "Attract Foreign Investment"
 TAI_foreign_investment_desc: "A unified, democratic China under the rule of law is the best market in the eyes of foreign investors. Foreign firms no longer need joint ventures with state companies or forced technology transfer, and their intellectual property is protected by independent courts; Apple, Tesla and the European carmakers all announce bigger investments in China."
 TAI_local_debt_cleanup: "Clean Up Local Debt"
 TAI_local_debt_cleanup_desc: "The enormous debts of local government financing vehicles must be settled: estimated at over sixty trillion yuan, they are bearing witness in the ‘ghost towns’ and unfinished buildings of many cities. The central government takes on part of the debt, restructures or writes off the rest, and passes a law banning local governments from hidden borrowing."
 TAI_strong_currency: "Strong National Currency"
 TAI_strong_currency_desc: "The national currency becomes one of Asia's most important reserve currencies. With a fully open capital account, an independent central bank and courts that protect creditors, the currency of unified China wins the trust of international markets for the first time, and Southeast Asian central banks begin adding it to their reserves."
 TAI_industrial_plan: "The International Development of China"
 TAI_industrial_plan_desc: "The hundred thousand miles of railway, three great ports and the taming of the Yangtze that Sun Yat-sen envisioned in his International Development of China can finally be carried out a century later. The Father of the Nation foresaw the Three Gorges Dam and the Great Eastern Port as early as 1919, and the new government takes his blueprint as its guide for an unprecedented building program."
 TAI_national_rail_network: "National Rail Network"
 TAI_national_rail_network_desc: "A national high-speed rail grid of eight north–south and eight east–west lines spans the country, Taiwan's high-speed rail standards are unified with the mainland's, and plans for a direct Taipei–Beiping train via a Strait tunnel are under study. The railways bind Taiwan and every province tightly together, and people and goods have never moved so freely."
 TAI_great_eastern_port: "The Great Eastern Port"
 TAI_great_eastern_port_desc: "Shanghai, Ningbo, Guangzhou and Tianjin: a world-class cluster of ports. The Father of the Nation called for three great ports in the north, east and south, and today the Yangshan deep-water port and Ningbo–Zhoushan are already the world's busiest, with Kaohsiung and Keelung brought into a single national port system."
 TAI_three_gorges: "The Three Gorges and the Yangtze"
 TAI_three_gorges_desc: "Improve navigation on the Yangtze and complete the Three Gorges water project. The dam brought power and shipping, but also displaced people, silt and geological hazards; the new government sets up an independent review commission to balance power generation with ecology, and dredges the channels of the middle and lower Yangtze."
 TAI_south_north_water: "South-North Water Transfer"
 TAI_south_north_water_desc: "Let the waters of the Yangtze nourish the North China Plain. The eastern and central routes of the South–North Water Transfer carry water from the Han and the Yangtze to Beiping and Tianjin, while the western route has stalled over ecological concerns; the new government publishes the project data and hears the people along the route before deciding whether to go on."
 TAI_national_ten_constructions: "Ten Major National Construction Projects"
 TAI_national_ten_constructions_desc: "The Ten Major Construction Projects once made Taiwan take off: the Sun Yat-sen Freeway, Taoyuan Airport, China Steel and the nuclear plants laid the foundations of its economic miracle. Now the idea is scaled up to all of China, with ten national projects for the new century started at once to lay the groundwork for the next thirty years of growth."
 TAI_develop_northwest: "Develop the Great Northwest"
 TAI_develop_northwest_desc: "Build the northwestern railway system and develop the Hexi Corridor and Xinjiang. The Father of the Nation planned a northwestern railway network linking Lanzhou, Dihua and Kashgar; now these lines will reach Central Asia and Europe, carrying the coast's prosperity inland and letting the peoples of the frontier share in development."
 TAI_revitalize_northeast: "Revitalize the Northeast"
 TAI_revitalize_northeast_desc: "The rebirth of the old industrial base. The Northeast was once the cradle of the People's Republic's industry; now its people are leaving and its state firms are withering. The new government attacks the problem on three fronts, state firm reform, opening to Russia, Japan and Korea, and modernizing agriculture, to bring Shenyang, Changchun and Harbin back to life."
 TAI_west_east_gas: "West-East Gas Pipeline"
 TAI_west_east_gas_desc: "Natural gas from the Tarim Basin flows through more than four thousand kilometers of pipeline to the Yangtze and Pearl River deltas. The West–East Gas Pipeline lets eastern cities burn less coal and earns Xinjiang resource revenue; the new government requires that a share of the pipeline income stay in the producing region for local schools and hospitals."
 TAI_nuclear_power_expansion: "Nuclear Power Expansion"
 TAI_nuclear_power_expansion_desc: "A chain of coastal nuclear plants powers the world's factory. Taiwan shut its nuclear plants under pressure from the anti-nuclear movement, while the mainland built reactors at astonishing speed; the unified government balances nuclear safety with energy demand, adopts the latest third-generation reactors and sets up an independent nuclear safety regulator."
 TAI_rural_revival: "Rural Revival"
 TAI_rural_revival_desc: "Set up a new Joint Commission on Rural Reconstruction, modeled on the old one. Founded in Nanjing in 1948, the JCRR went on to drive land reform and agricultural modernization in Taiwan, where the ideas of Chiang Monlin and James Yen produced a rural miracle; now the new commission will bring that experience back to the mainland."
 TAI_farmers_associations: "Farmers' Associations"
 TAI_farmers_associations_desc: "Spread Taiwan's farmers' association system nationwide, combining supply and marketing, credit and extension services. The associations buy seed and fertilizer for farmers, sell their produce and give them low-interest loans and technical advice, and are Taiwanese farmers' most important organization; mainland farmers have a body that truly serves them for the first time."
 TAI_labor_standards: "Labor Standards Act"
 TAI_labor_standards_desc: "An eight-hour day, a minimum wage and occupational safety protect the rights of hundreds of millions of workers. The ‘996’ schedule and unpaid overtime become illegal, and those responsible for mine disasters and workplace accidents face criminal charges; labor inspectors walk into factories and building sites, and it is no longer just for show."
 TAI_irrigation: "Water Conservancy"
 TAI_irrigation_desc: "Repair the nation's irrigation canals and reservoirs. Tens of thousands of reservoirs hastily built in the Great Leap Forward have aged, and many are now dangerous; the new government spends heavily on reinforcing dams and dredging canals, and promotes Taiwan's water-saving irrigation so the groundwater of North China stops falling."
 TAI_mechanized_farming: "Farm Mechanization"
 TAI_mechanized_farming_desc: "Replace human labor with machines and free up rural labor. Once land is titled, farmers can freely lease and combine their plots, and large farms and cooperatives begin buying tractors and combines; hundreds of millions of rural young people can leave the fields for factories and schools in the cities."
 TAI_labor_insurance: "Labor Insurance"
 TAI_labor_insurance_desc: "All workers are brought into labor insurance, with benefits for workplace injury, old age and unemployment. Taiwan's labor insurance, started in 1950, is the cornerstone of its social security; now two hundred million migrant workers enjoy the same protection as urban employees for the first time, and an injury at work no longer means destitution for a whole family."
 TAI_food_security: "Food Security"
 TAI_food_security_desc: "The rice bowls of 1.4 billion people must be held in our own hands. China imports over a hundred million tons of soybeans and grain a year, and food security is the foundation of national security; the new government protects the 1.8 billion mu red line for farmland, builds national grain reserves and signs long-term supply deals with Brazil and Russia."
 TAI_national_health_insurance: "National Health Insurance"
 TAI_national_health_insurance_desc: "Extend Taiwan's National Health Insurance to all of China so that everyone can afford to see a doctor. Taiwan's system is world-famous for low premiums and very high satisfaction; on the mainland, ‘hard and expensive to see a doctor’ pushed countless families back into poverty. A single-payer system lets 1.4 billion people get treatment with the same health card."
 TAI_new_urbanization: "New Urbanization"
 TAI_new_urbanization_desc: "Hundreds of millions of farmers are moving to the cities, which must prepare homes, schools and jobs for them. With hukou abolished, a second wave of urbanization sweeps the country; the new government plans urbanization centered on small and medium cities to avoid the overgrowth of the megacities, so that county towns can also keep their young people."
 TAI_public_housing: "National Housing"
 TAI_public_housing_desc: "Build ten million units of public housing so every family has a home. Mainland housing prices once put homes beyond young people's reach, and the term ‘mortgage slave’ summed up a generation's hardship; the public housing is sold at cost or rented cheaply, with priority for newlyweds, migrant workers and low-income families."
 TAI_common_prosperity: "A Society of Shared Prosperity"
 TAI_common_prosperity_desc: "The ideal of the Principle of People's Livelihood: equalize land rights and regulate capital so that everyone prospers. The Father of the Nation proposed taxing land at its declared value and returning unearned increases to the public to prevent speculation, and regulating capital to prevent extremes of wealth and poverty; a century later, a society of shared prosperity is no longer an empty slogan but a reality the data can confirm."
 TAI_national_reconstruction: "The Fundamentals of National Reconstruction"
 TAI_national_reconstruction_desc: "Psychological, material and social reconstruction: the Father of the Nation's Plans for National Reconstruction have finally been fully realized in a unified China. The modern China described in his Doctrine of Sun Wen, International Development of China and Primer of Democracy has, through the Northern Expedition, the War of Resistance, civil war and division, finally become reality a hundred years later."
 TAI_national_army_reborn: "The National Army Reborn"
 TAI_national_army_reborn_desc: "More than two million PLA troops and two hundred thousand of the National Army will be merged into a new National Revolutionary Army. Two armies that faced each other in arms for over seventy years must now wear the same uniform and swear loyalty to the constitution under the same flag; it is harder than any battle."
 TAI_reorganize_pla: "Reorganize the PLA"
 TAI_reorganize_pla_desc: "Keep the units intact, screen the officers and change the designations: the PLA is reorganized into the National Army. The political commissar system is abolished and the party committees become constitutional education teams; most soldiers come from the countryside and care about whether their pay keeps coming and whether they will be resettled after discharge, and the new government must give them satisfying answers."
 TAI_defense_ministry_reform: "Reorganize the Ministry of Defense"
 TAI_defense_ministry_reform_desc: "The Central Military Commission is merged into the Ministry of National Defense: the army belongs to the nation and is led by civilians. The armed forces owe loyalty to no party but to the constitution and the state; the defense minister is a civilian answerable to the Legislative Yuan, and senior military appointments need parliamentary approval. This is the basic principle of civil–military relations in a democracy."
 TAI_navy_unification: "Merge the Navies"
 TAI_navy_unification_desc: "The PLA Navy and the Republic of China Navy are merged, and the fleet leaps to become one of the three largest in the world. Aircraft carriers and Type 055 destroyers sail under the same ensign as the Kidd and Cheng Kung classes; the naval academies at Zuoying and Qingdao merge, and officers from both sides of the Strait can finally serve on the same ship."
 TAI_air_force_unification: "Merge the Air Forces"
 TAI_air_force_unification_desc: "The air forces of both sides are merged under a single command and training system. J-20s, F-16Vs and Ching-kuo fighters serve in the same order of battle, and pilots must learn each other's tactics and terminology; the Air Force Academy at Gangshan and the Aviation University in Changchun set up exchanges, and the next generation of pilots will no longer be divided."
 TAI_screen_officers: "Screen the Officers"
 TAI_screen_officers_desc: "Those loyal to the constitution stay; those who refuse are discharged. Every officer of field grade and above is screened: did he take part in the June Fourth crackdown, is he implicated in corruption, will he swear loyalty to the Constitution of the Republic of China? Thousands of generals and senior officers are eased out, but most junior and mid-ranking officers choose to stay."
 TAI_redesignate_units: "Redesignate the Units"
 TAI_redesignate_units_desc: "Group armies are renamed corps and the National Army's glorious designations are restored: the 74th Corps, the New 1st Army, the New 6th Army... Designations that fought and bled in the War of Resistance reappear in the order of battle. Many veterans' descendants now serve in these units, and history is reconnected through them."
 TAI_whampoa_reopened: "Rebuild the Whampoa Academy"
 TAI_whampoa_reopened_desc: "The Military Academy returns to Changzhou Island in Guangzhou. In 1924 the Father of the Nation founded the Whampoa Military Academy here with Soviet advisers, with Chiang Kai-shek as commandant and Zhou Enlai heading its political department; a century later, the academy at Fengshan rebuilds a campus on the original site, and its motto ‘Fraternity, Love, Sincerity, Truth’ begins a new chapter."
 TAI_theater_commands: "Five Theater Commands"
 TAI_theater_commands_desc: "Five theater commands, Eastern, Southern, Western, Northern and Central, replace the old military regions, separating administration from operations: the Ministry of Defense builds the forces and the General Staff runs operations. Each theater draws up plans for its own threats: Japan, the South China Sea, India, Russia and guerrillas in the interior."
 TAI_professional_army: "Professional Army"
 TAI_professional_army_desc: "Move from conscription to a mainly volunteer force and build an elite professional army. Taiwan completed its own transition to volunteers in the 2010s, and the lessons are in plain view; the new army is smaller, better trained and better paid, and its soldiers sign a professional contract rather than being forced to serve."
 TAI_military_academies: "Military Academy System"
 TAI_military_academies_desc: "A national network of the army, naval and air force academies, the National Defense University and the branch schools. Taiwan's military academies are merged and reorganized with the mainland's National University of Defense Technology and service colleges under a single curriculum and system; tomorrow's generals will study the constitution, military history and modern warfare in the same schools."
 TAI_armored_corps: "Armored Corps"
 TAI_armored_corps_desc: "Form armored corps around a new domestically built main battle tank. Thousands of captured Type 99 and Type 96 tanks train alongside Taiwan's M1A2Ts, and the new corps get digital command systems for deep mobile operations across the North China Plain and the Manchurian steppe."
 TAI_mechanized_infantry: "Mechanized Infantry"
 TAI_mechanized_infantry_desc: "Every infantry division is mechanized or motorized, with infantry fighting vehicles and wheeled armored carriers replacing trucks and feet. On a mainland this vast, mobility is combat power: only a force that can advance hundreds of kilometers in a day can meet any crisis from the Northeast to the Southwest."
 TAI_artillery_corps: "Artillery and Rocket Artillery"
 TAI_artillery_corps_desc: "Long-range rocket launchers and self-propelled guns provide overwhelming firepower. PHL-03 and Thunderbolt-2000 rocket systems and PLZ-05 and M109 howitzers are organized into a single artillery arm, and with drone reconnaissance they can strike positions dozens of kilometers away within minutes of finding a target."
 TAI_army_aviation_mainland: "Army Aviation"
 TAI_army_aviation_mainland_desc: "Every corps gets an army aviation brigade, with Apaches, Black Hawks, Z-10s and Z-20s in the same order of battle. Helicopters let the army move troops quickly across mountains and rivers, an indispensable capability on the plateaus of the Southwest and in the deserts of the Northwest."
 TAI_special_operations_command: "Special Operations Command"
 TAI_special_operations_command_desc: "Combine the special forces of both sides into a single special operations command. Taiwan's frogmen and airborne special service company are merged with the mainland theaters' special operations brigades to handle counterterrorism, deep reconnaissance and hostage rescue; they are the most elite and most secretive soldiers in the National Army."
 TAI_demobilization: "Demobilization and Resettlement"
 TAI_demobilization_desc: "Cut surplus personnel and resettle the demobilized properly. Hundreds of thousands of soldiers will take off their uniforms, and they need jobs, homes and dignity, or they could become a source of unrest; the new government sets up a veterans affairs council offering training, business loans and priority hiring, and many are placed in the police, fire services and state enterprises."
 TAI_combined_arms: "Combined Arms Warfare"
 TAI_combined_arms_desc: "Combined arms battalions and brigades: the basic units of modern land warfare. Infantry, armor, artillery, engineers and air defense fight together within a single battalion, and the battalion commander can call in fire and air support directly; the National Army leaves the old division-based structure behind and becomes a truly modern army."
 TAI_strategic_rocket_force: "Take Over the Strategic Rocket Force"
 TAI_strategic_rocket_force_desc: "The missile bases and command system of the former Rocket Force must be held firmly by the central government. Thousands of ballistic missiles and hundreds of nuclear warheads are scattered in caves and bases across the country, and a single one slipping out of control would be the world's nightmare; the US and Russia both send experts to watch the handover closely."
 TAI_nuclear_question: "The Nuclear Question"
 TAI_nuclear_question_desc: "The Republic of China has never had nuclear weapons, until today. In the 1970s Taiwan secretly developed nuclear weapons and was forced to give them up under American pressure; now Nanjing has taken over hundreds of warheads overnight. Keeping them makes it the fifth recognized nuclear power; giving them up would win the respect of the whole world."
 TAI_keep_deterrent: "Keep the Nuclear Deterrent"
 TAI_keep_deterrent_desc: "Nuclear weapons are the final guarantee of a unified China's security. Russia to the north, India to the south and North Korea to the east all have them, and giving up deterrence would mean tying our own hands; Nanjing declares a no-first-use policy, but Washington, Tokyo and New Delhi remain deeply worried."
 TAI_denuclearize: "Nuclear-Free Declaration"
 TAI_denuclearize_desc: "The Republic of China announces it will destroy all its nuclear weapons, the first great power ever to give them up voluntarily. South Africa and Ukraine did so before, but neither was a great power; IAEA inspectors move into Jiuquan and Lop Nur, and front pages around the world carry the same headline."
 TAI_cyber_space_force: "Cyberspace Force"
 TAI_cyber_space_force_desc: "Cyberspace is the fifth battlefield. The former Strategic Support Force's cyber units are merged with Taiwan's Information, Communications and Electronic Force Command into a cyberspace force; it defends the nation's power grid, finance and communications, and detects and counters cyberattacks from abroad."
 TAI_aerospace_force: "Aerospace Force"
 TAI_aerospace_force_desc: "Satellites, anti-satellite weapons and space reconnaissance. The BeiDou navigation system and reconnaissance satellite constellations are the National Army's eyes and ears; the aerospace force protects these satellites and, if necessary, blinds the enemy's. Space will be the next arena of great-power rivalry."
 TAI_fleet_reorganization: "Reorganize the Fleets"
 TAI_fleet_reorganization_desc: "The North Sea, East Sea and South Sea fleets, plus the Taiwan fleet, are reorganized into four fleets based at Qingdao, Zhoushan, Zhanjiang and Zuoying. The Taiwan fleet, which knows the western Pacific and the Bashi Channel, will lead blue-water operations, and the fleets' commands rotate between officers from both sides."
 TAI_naval_shipyards: "Jiangnan Shipbuilding"
 TAI_naval_shipyards_desc: "The Jiangnan and Dalian shipyards are the foundation of naval expansion: the Liaoning was refitted at Dalian and the Fujian launched at Jiangnan. Taiwan's CSBC and Jong Shyn shipyards join the naval shipbuilding program too, giving the navy the greatest shipbuilding capacity in the world."
 TAI_blue_water_navy: "Blue-Water Navy"
 TAI_blue_water_navy_desc: "The Republic of China Navy can finally head for the deep blue. For more than seventy years its only mission was to hold the Taiwan Strait; now it must protect sea lanes stretching across the Indian Ocean, the Persian Gulf and the South Pacific, and the Blue Sky, White Sun ensign can be seen in Djibouti, Gwadar and the Gulf of Aden."
 TAI_submarine_force: "Submarine Force"
 TAI_submarine_force_desc: "Nuclear attack submarines and ballistic missile submarines. Taiwan's indigenous Hai Kun boats and the captured Type 093 and 094 nuclear submarines form a single submarine force; in the deep waters of the western Pacific, submarines are the stealthiest and deadliest weapons."
 TAI_carrier_program: "Carrier Program"
 TAI_carrier_program_desc: "The Liaoning is only the beginning. After the Shandong and the Fujian, the keel of a new nuclear-powered carrier is already laid in the Jiangnan yard; the Republic of China Navy plans six carriers, putting naval aviation over every ocean."
 TAI_destroyer_squadrons: "Destroyer Squadrons"
 TAI_destroyer_squadrons_desc: "A new generation of air defense destroyers enters service in numbers: large destroyers developed from the Type 055, armed with Taiwan's own Sea Sword II air defense missiles and Hsiung Feng anti-ship missiles. They are the carrier groups' shield and the backbone of the fleet at sea."
 TAI_marine_corps_mainland: "Expand the Marine Corps"
 TAI_marine_corps_mainland_desc: "Two marine divisions grow to six, with the ability to deploy worldwide. The Republic of China Marine Corps' tradition of ‘always faithful’ is combined with the mainland marine brigades' amphibious experience, and with amphibious assault ships the marines can land on any coastline."
 TAI_carrier_strike_group: "Carrier Strike Groups"
 TAI_carrier_strike_group_desc: "Blue-water battle groups built around carriers patrol three oceans. Each group has a carrier, four destroyers, two frigates, a nuclear submarine and supply ships; the Republic of China becomes the second country after the US able to deploy several carrier strike groups around the world at once."
 TAI_air_academy: "Air Force Academy"
 TAI_air_academy_desc: "The Air Force Academy at Gangshan merges with the flight academy at Changchun to unify pilot training. Gangshan's instructors are known for American-style training methods, while Changchun has a complete fighter training base; the new generation of pilots rotates between the two and learns the strengths of each."
 TAI_stealth_fighters: "Stealth Fighters"
 TAI_stealth_fighters_desc: "Fifth-generation stealth fighters go into mass production. The J-20 and J-35 lines in Chengdu and Shenyang run at full speed, with Taiwan's AIDC upgrading the avionics and radar; within ten years the Republic of China Air Force will have more stealth fighters than anyone but the US."
 TAI_air_defense_network: "National Air Defense Network"
 TAI_air_defense_network_desc: "A nationwide network of radars and air defense missiles. Taiwan's Sky Bow and the mainland's HQ systems are integrated into a single command network, and from the South China Sea to Heilongjiang, any aircraft or missile entering Republic of China airspace will be detected and intercepted within minutes."
 TAI_strategic_bombers: "Strategic Bombers"
 TAI_strategic_bombers_desc: "Long-range strategic bombers with intercontinental strike capability. The era of the H-6 is ending, and the new H-20 stealth bomber makes its first flight in Xi'an; it gives the Republic of China Air Force trans-Pacific strike capability for the first time and makes neighboring countries recalculate the balance of power."
 TAI_air_superiority_mainland: "Air Supremacy"
 TAI_air_superiority_mainland_desc: "The Republic of China Air Force rules the skies of East Asia. Stealth fighters, AWACS and tankers form a complete air combat system, and pilots log flying hours to NATO standards; from the Sea of Japan to the Strait of Malacca, no other air force can match it."
 TAI_uav_program: "Drone Force"
 TAI_uav_program_desc: "Armed reconnaissance drones and drone swarms. The Wing Loong and Rainbow drones are already exported around the world, and Taiwan's Teng Yun joins the fleet; new swarm technology lets hundreds of small drones fight together, and the National Army studies the lessons of the war in Ukraine closely."
 TAI_defense_industry_mainland: "Consolidate the Defense Industry"
 TAI_defense_industry_mainland_desc: "The aviation, ordnance and shipbuilding conglomerates are reorganized into a national defense industry group, together with Taiwan's National Chung-Shan Institute of Science and Technology and AIDC. The defense industry is no longer a collection of independent fiefdoms but must submit to parliamentary budget scrutiny and audit."
 TAI_world_class_military: "World-Class National Army"
 TAI_world_class_military_desc: "A modern, professional, national National Revolutionary Army. It owes loyalty to no party or person, only to the Constitution of the Republic of China and the whole people; its equipment and training rank with the best in the world, and its mission is to defend the nation, not to suppress the people."
 TAI_new_china_diplomacy: "New China Diplomacy"
 TAI_new_china_diplomacy_desc: "How will the unified Republic of China get along with the world? It inherits the People's Republic's UN seat, nuclear arsenal and enormous economy, and also all its entanglements with the US, Japan, Russia and India. The new foreign ministry must decide what kind of great power this country will be."
 TAI_rejoin_united_nations: "Return to the United Nations"
 TAI_rejoin_united_nations_desc: "In 1971 the UN General Assembly passed Resolution 2758 and the Republic of China withdrew from the United Nations. Now only one government represents all of China: the Blue Sky, White Sun flag is raised again at UN headquarters in New York, and the Republic of China's representative takes the permanent seat on the Security Council once more."
 TAI_great_power_diplomacy: "Great Power Diplomacy"
 TAI_great_power_diplomacy_desc: "A unified, democratic China will be a pole of decisive weight in the international order. It holds a fifth of the world's population and an economy as large as America's; Washington, Moscow, Tokyo and Brussels are all reassessing how to deal with this new great power."
 TAI_inherent_territory: "The Existing National Territory"
 TAI_inherent_territory_desc: "Article 4 of the Constitution of the Republic of China: ‘The territory of the Republic of China according to its existing national boundaries shall not be altered except by resolution of the National Assembly.’ Outer Mongolia, Outer Manchuria, Tannu Uriankhai and the South China Sea islands all fall within its scope; choosing between constitutional orthodoxy and reality is the new government's dilemma."
 TAI_security_council_power: "Great Power Responsibility on the Security Council"
 TAI_security_council_power_desc: "As a permanent member, the Republic of China must take on greater responsibility in world affairs: it must take positions on Syria, North Korea, Ukraine and the South China Sea, and its veto will shape war and peace around the world. For the first time Nanjing must think with the outlook of a global power."
 TAI_global_recognition: "Universal Diplomatic Relations"
 TAI_global_recognition_desc: "Establish full diplomatic relations with every country in the world. For more than half a century the Republic of China's diplomatic allies shrank at times to barely a dozen, and its diplomats worked abroad under the name of ‘Taipei Economic and Cultural Offices’; now ambassadors from more than 190 countries present their credentials in Nanjing, and diplomatic isolation is over for good."
 TAI_un_peacekeeping: "Peacekeepers"
 TAI_un_peacekeeping_desc: "Send peacekeepers around the world: South Sudan, Mali, Lebanon and the Congo. Blue-helmet missions give the National Army experience of operations abroad and show the world a responsible China; the peacekeepers' medical teams and engineer companies earn a good name wherever they go."
 TAI_reward_old_allies: "Repay Our Old Allies"
 TAI_reward_old_allies_desc: "The allies that stood with the Republic of China in its hardest times deserve our reward: Paraguay, Guatemala, Eswatini, Palau, Tuvalu and others kept their ties with Taipei despite Beijing's pressure. Nanjing gives them aid, loans and scholarships, proving that a friend in need is a friend indeed."
 TAI_trade_superpower: "Trading Power"
 TAI_trade_superpower_desc: "Unified China is the world's largest trading nation, accounting for a sixth of world trade, with Taiwan's high-tech exports and the mainland's manufactured exports combined into one. As a founding member of the GATT that became the WTO, the Republic of China champions a more open and fairer multilateral trading system."
 TAI_shape_world_order: "Shaper of the International Order"
 TAI_shape_world_order_desc: "From a taker of rules to a maker of rules. In the UN, the WTO, the IMF and the climate talks, the Republic of China's voice carries great weight; it does not seek hegemony, but wants an international order that better represents the interests of Asia and the developing world."
 TAI_america_policy: "America Policy"
 TAI_america_policy_desc: "America is the Republic of China's oldest ally: from the Flying Tigers of the war and the 1954 Mutual Defense Treaty to the Taiwan Relations Act, Washington has always stood behind Taipei. But a unified China could also be America's greatest rival in the world. Nanjing must decide how close to stand to Washington."
 TAI_russia_policy: "Russia Policy"
 TAI_russia_policy_desc: "Our northern neighbor is both an energy partner and the occupier of our inherent territory. Russian oil and gas matter greatly to China's economy, and a border of more than four thousand kilometers needs peace; but Outer Manchuria and Tannu Uriankhai remain a wound in the Constitution of the Republic of China and in national memory."
 TAI_japan_policy: "Japan Policy"
 TAI_japan_policy_desc: "The scars of history are entwined with present interests. Memories of the eight-year War of Resistance, the Nanjing Massacre and the Diaoyutai dispute sit alongside the fact that Japan is a leading trade partner and a key source of technology and investment; the deep popular friendship between Taiwan and Japan might become a bridge to reconciliation."
 TAI_sino_american_alliance: "Sino-American Alliance"
 TAI_sino_american_alliance_desc: "Two great democracies join hands to keep the peace in the Pacific. In 1979 the US broke relations with the Republic of China and ended the Mutual Defense Treaty; more than forty years later the two sign a new alliance, and the Seventh Fleet can call at Shanghai and Kaohsiung. It is the biggest geopolitical shift since the end of the Cold War."
 TAI_independent_diplomacy: "Independent Foreign Policy"
 TAI_independent_diplomacy_desc: "China's affairs will be decided by the Chinese themselves. A unified Republic of China no longer needs any great power's protection, and it will keep its balance between the US, Russia, Europe and the developing world; friendly with Washington but not allied, an independence in the manner of de Gaulle."
 TAI_sino_russian_friendship: "Sino-Russian Good Neighbors"
 TAI_sino_russian_friendship_desc: "Set the disputes aside and develop Siberia's energy together. The Sino-Russian border was fully demarcated in 2008, and reopening the territorial question would only bring war; Nanjing chooses pragmatism and signs a new good-neighbor treaty with Moscow in exchange for stable energy supplies and peace on the northern frontier."
 TAI_outer_manchuria_question: "The Outer Manchuria Question"
 TAI_outer_manchuria_question_desc: "The more than a million square kilometers lost under the Treaty of Aigun and the Convention of Peking have never been recognized by the Republic of China. Republican-era maps showed Vladivostok, Khabarovsk and Sakhalin inside the national borders, and parliament passes by an overwhelming majority a resolution reaffirming the claim to Outer Manchuria."
 TAI_sino_japanese_reconciliation: "Sino-Japanese Reconciliation"
 TAI_sino_japanese_reconciliation_desc: "Following the example of Germany and France, China and Japan move toward historical reconciliation: joint history textbooks, a youth exchange fund, and a Japanese prime minister laying flowers at the Nanjing Massacre memorial. The questions shelved when relations were established in 1972 finally find a real resolution between two democracies."
 TAI_defend_diaoyutai: "Defend the Diaoyutai"
 TAI_defend_diaoyutai_desc: "The Diaoyutai Islands are part of Toucheng Township in Yilan County, Republic of China. The Defend Diaoyutai movement of the 1970s brought countless overseas students into the streets; now a unified China has the ability and the resolve to take the islands back. Tokyo warns that this would trigger the US–Japan Security Treaty."
 TAI_pacific_security_pact: "Pacific Security Treaty"
 TAI_pacific_security_pact_desc: "China, the US, Japan, South Korea, Australia and the Philippines join to keep the peace in the western Pacific in a NATO-like collective security organization. The Cold War's SEATO is long gone, and now a stronger Pacific alliance takes shape, with China turned from the target of containment into one of its pillars."
 TAI_lead_asia: "Leader of Asia"
 TAI_lead_asia_desc: "Asia's affairs should be led by Asians. In his 1924 ‘Greater Asianism’ speech in Kobe, Sun Yat-sen hoped the nations of Asia would deal with one another by the kingly way rather than by force; a century later, a unified Republic of China becomes Asia's leader through economic and cultural influence, not arms."
 TAI_siberian_energy: "Siberian Energy Cooperation"
 TAI_siberian_energy_desc: "The Sino-Russian oil and gas pipelines are complete: the eastern route runs from Siberia to the Yangtze Delta, and the Far East crude line supplies Daqing and Tianjin. A stable overland energy supply means China no longer has to fear a blockade of the Malacca Strait, and Russia gains its biggest buyer outside Europe."
 TAI_reclaim_outer_manchuria: "Recover Outer Manchuria"
 TAI_reclaim_outer_manchuria_desc: "The blood debt of the Sixty-Four Villages East of the River, the old name of Vladivostok: it is time to reclaim them. In 1900 Tsarist troops massacred thousands of Chinese residents on the banks of the Amur; the diplomatic road has reached its end, the National Army's armor masses on the border, and war with a nuclear power is a hair's breadth away."
 TAI_east_asian_community: "East Asian Community"
 TAI_east_asian_community_desc: "A China–Japan–Korea free trade area and an East Asian Community: following the European Community's path from economic integration to political cooperation. The three economies together are larger than the EU and their supply chains are already tightly linked; after historical reconciliation, East Asia has the political foundation for a community for the first time."
 TAI_korean_peninsula: "The Sino-North Korean Treaty"
 TAI_korean_peninsula_desc: "The Sino-North Korean Treaty of Friendship, Cooperation and Mutual Assistance signed by Beijing and Pyongyang in 1961 is a diplomatic legacy of the CCP. Pyongyang has long taken Chinese economic aid for granted.\nThe government of the Republic of China must decide: compromise with Pyongyang, break with Pyongyang, or stand with Seoul."
 TAI_nko_compromise: "Compromise with Pyongyang"
 TAI_nko_compromise_desc: "‘If the lips are gone, the teeth will feel the cold’ holds for the Republic of China too. If North Korea collapses, millions of refugees will pour across the Yalu and the reconstruction of the Northeast will be ruined. A stable northern neighbor we can negotiate with is better than a collapsing source of refugees. We are willing to sit down with Pyongyang, as long as it stops aiming nuclear weapons at Nanjing."
 TAI_nko_break: "Break with Pyongyang"
 TAI_nko_break_desc: "The Kim regime was the CCP's ally, not the Republic of China's. For more than half a century Pyongyang survived on Beijing's grain and oil, and the regime that fed it has now fallen. What Beijing could do, Nanjing can do too, only in the opposite direction: we will withdraw every form of tolerance from the Kim family and look instead for those in the People's Army who want change."
 TAI_rok_alliance: "Sino-Korean Alliance"
 TAI_rok_alliance_desc: "The Republic of Korea is an old friend of the Republic of China: the Korean Provisional Government found shelter with the Nationalist government in Shanghai and Chongqing, and the two countries kept relations until 1992. Now that Nanjing is back on the mainland, the two democracies will renew their friendship and work together to end the division of the peninsula."
 TAI_new_sino_korean_treaty: "A New Sino-North Korean Treaty"
 TAI_new_sino_korean_treaty_desc: "The 1961 Sino-North Korean Treaty of Friendship is a legacy of the CCP, and its clause on automatic military intervention makes Nanjing deeply uneasy. The new treaty replaces the military alliance with non-aggression, and free aid with normal trade: the Republic of China will no longer pay for Pyongyang's adventures, but it will not try to overthrow it either."
 TAI_yalu_economic_belt: "Yalu River Economic Belt"
 TAI_yalu_economic_belt_desc: "Trade between Dandong and Sinuiju has turned from smuggling into business. We open border markets and build crossing facilities along the Yalu, letting North Korean minerals and labor enter the markets of the Northeast legally and bringing the border towns of Liaoning back to life."
 TAI_nko_reform_opening: "Promote Reform and Opening in North Korea"
 TAI_nko_reform_opening_desc: "Guide Pyongyang onto the path of reform with the Republic of China's own experience: rent reduction and land to the tiller to feed the farmers, export processing zones to bring orders to the factories, and gradual political opening so the regime does not collapse overnight. The road Taiwan traveled is one North Korea can travel too."
 TAI_korea_peace_regime: "A Peace Regime for the Peninsula"
 TAI_korea_peace_regime_desc: "Replace the 1953 armistice with a peace treaty. Nanjing, Seoul, Pyongyang, Washington and Tokyo jointly guarantee peace on the peninsula: the Demilitarized Zone is gradually dismantled, separated families can be reunited, and North Korea's nuclear program is opened to international inspection. Seventy years of war can finally be brought to an end."
 TAI_nko_infiltration: "Infiltrate the Korean People's Army"
 TAI_nko_infiltration_desc: "Not every general in the Korean People's Army is devoted to the Kim family. Memories of the famine years and purge after purge have left many officers quietly planning a way out. Our contacts will knock on their doors with dollars, promises and guarantees of safety."
 TAI_nko_defector_network: "Defector Network"
 TAI_nko_defector_network_desc: "Tens of thousands of defectors cross the border through the Northeast. The CCP used to send them back; now National Army intelligence officers wait for them in Yanbian and Dandong. They know North Korea's streets, barracks and personal networks, which makes them the best source of intelligence and the backbone of a future government."
 TAI_nko_pro_china_faction: "Back a Pro-China Faction"
 TAI_nko_pro_china_faction_desc: "Kim Jong-nam has lived in Macau for years and still has supporters among Pyongyang's elders and the military. He likes Disneyland and has openly criticized hereditary succession, so he would be an easier leader to deal with than his brother. Our job is to send him back where he belongs at the right moment."
 TAI_pyongyang_coup: "Coup in Pyongyang"
 TAI_pyongyang_coup_desc: "The time has come. Troops loyal to us will surround the Kumsusan Palace of the Sun and the Workers' Party headquarters, cut Pyongyang's broadcasts and communications, proclaim a new government and ask the Republic of China for protection. Success or failure will be decided in a single night, and those who fail will get no second chance."
 TAI_nko_reconstruction: "Rebuild North Korea"
 TAI_nko_reconstruction_desc: "Food, power and roads: whatever the new government needs, the Republic of China can provide. The first grain ships have already entered the port of Nampo, and Taipower engineers are repairing a grid that has gone unmaintained for decades. As long as people have enough to eat and lights at night, the new government can find its footing."
 TAI_rok_joint_command: "Sino-Korean Combined Command"
 TAI_rok_joint_command_desc: "The two general staffs set up a joint office in Seoul, with a single operational plan and communications system, commanding all allied forces on the peninsula. National Army officers begin learning Korean, and Korean officers walk into the Army Command and Staff College in Nanjing for the first time."
 TAI_rok_intel_sharing: "Sino-Korean Intelligence Sharing"
 TAI_rok_intel_sharing_desc: "The mainland intelligence network the National Army took over is linked with the northern network the South Korean NIS has built up over many years. Listening posts on the northeastern border, defector testimony and South Korean satellite images all end up on the same desk, and Pyongyang will have nowhere left to hide."
 TAI_roc_forces_korea: "ROC Forces in Korea"
 TAI_roc_forces_korea_desc: "The National Army of the Republic of China is stationed in the Republic of Korea, guarding the 38th parallel alongside the ROK Armed Forces. Seventy years ago the Chinese People's Volunteers came south across this line; now troops under the Blue Sky, White Sun flag stand on the other side of the peninsula. It is both a promise to an ally and a warning to Pyongyang."
 TAI_korea_northern_campaign: "The Allies March North"
 TAI_korea_northern_campaign_desc: "The Sino-Korean allied forces cross the 38th parallel. In the winter of 1950 the UN forces were driven back at Chosin and the Chongchon by the CCP's human waves; this time there are no reinforcements waiting across the Yalu, and no one will push us back. The unification of the peninsula is within reach."
 TAI_korea_reunified: "Korea Is Unified"
 TAI_korea_reunified_desc: "Pyongyang has been liberated, and the Korean Peninsula is reunited under the flag of the Republic of Korea. The National Army of the Republic of China will remain to protect the newly unified Korea."
 TAI_asean_partnership: "China-ASEAN Partnership"
 TAI_asean_partnership_desc: "The ancestral home of the overseas Chinese builds prosperity together with Southeast Asia. More than thirty million ethnic Chinese live in Southeast Asia, most with roots in Fujian and Guangdong; the Republic of China replaces confrontation with negotiation in the South China Sea, signs a code of conduct with ASEAN and develops the sea's resources jointly."
 TAI_europe_partnership: "Sino-European Partnership"
 TAI_europe_partnership_desc: "Comprehensive cooperation with Europe on trade, technology and climate. A democratic China spares Europe the dilemma between values and interests: the EU signs a comprehensive strategic partnership with Nanjing, the Galileo and BeiDou navigation systems are made compatible, and the two economies jointly push the world toward carbon neutrality."
 TAI_africa_development: "Aid to Africa"
 TAI_africa_development_desc: "Medical teams, agricultural missions and infrastructure: developing together with Africa. Taiwan's agricultural missions once taught rice farming across Africa and were called ‘green ambassadors’ by local people; the new aid comes without debt traps, guided by transparent contracts and local employment."
 TAI_world_power: "World Power"
 TAI_world_power_desc: "The Republic of China: a unified, democratic and prosperous world power. Out of the humiliation of the Opium Wars, the division of the warlord era, the blood of the War of Resistance and the separation of the civil war, the Chinese people have finally built a country they can be proud of and the world respects. The Father of the Nation's dying wish to ‘revitalize China’ is fulfilled."
 TAI_outer_mongolia_question: "The Outer Mongolia Question"
 TAI_outer_mongolia_question_desc: "The 1946 independence referendum in Outer Mongolia was held under Soviet occupation; the Republic of China briefly recognized it, but withdrew recognition when it abrogated the Sino-Soviet Treaty of Friendship in 1953. Offer Ulaanbaatar a peaceful plan for return: a high degree of autonomy, economic aid and guarantees for Mongol culture."
 TAI_south_china_sea_policy: "South China Sea Policy"
 TAI_south_china_sea_policy_desc: "The South China Sea islands have been Chinese territory since ancient times, and the garrison on Taiping Island has guarded them for more than half a century. In 1946 the ROC Navy's Taiping and Chung Yeh took over the Spratly and Paracel Islands; after unification, the artificial islands the mainland built in the Spratlys come under Republic of China jurisdiction together with Taiping."
 TAI_southwest_borders: "The Southwest Borders"
 TAI_southwest_borders_desc: "South Tibet, the Triangle of northern Burma and the Pamirs: border problems left by the British colonialists. The Republic of China never signed any treaty recognizing these borders, and after the 1962 Sino-Indian War South Tibet remained in Indian hands; the new government must weigh constitutional claims against relations with India."
 TAI_reclaim_outer_mongolia: "Recover Outer Mongolia"
 TAI_reclaim_outer_mongolia_desc: "The peaceful offer has been rejected, so force is the only option left. Ulaanbaatar turns down the autonomy plan, with the Mongolian People's Party and the Democratic Party for once united; National Army troops set out from Zhangjiakou and Baotou across the Gobi. It will be a war the whole world watches with alarm."
 TAI_tannu_uriankhai: "Tannu Uriankhai"
 TAI_tannu_uriankhai_desc: "Tannu Uriankhai, under the Qing military governor of Uliastai, became the ‘Tuvan People's Republic’ with Soviet backing in 1921 and was annexed by the USSR in 1944. Republic of China maps have always drawn it inside the national borders; we have not forgotten this land."
 TAI_eleven_dash_line: "The Eleven-Dash Line"
 TAI_eleven_dash_line_desc: "The eleven-dash line drawn by the Republic of China's Ministry of the Interior in 1947 is the basis of our claims in the South China Sea. The CCP later turned it into the nine-dash line, deleting two dashes in the Gulf of Tonkin; now Nanjing restores the original eleven dashes and reasserts sovereignty over the Spratly, Paracel and Macclesfield Islands."
 TAI_south_tibet: "The South Tibet Question"
 TAI_south_tibet_desc: "The McMahon Line was drawn privately between British and Tibetan representatives at the Simla Conference of 1914 and has never been recognized by any Chinese government. Tawang in South Tibet is the birthplace of the Sixth Dalai Lama; India calls the region Arunachal Pradesh and keeps strong forces there."
 TAI_kachin_and_pamir: "The Kachin Triangle and the Pamirs"
 TAI_kachin_and_pamir_desc: "The Triangle on the undemarcated Yunnan–Burma border, and the Pamir Plateau carved up between Britain and Russia in the late Qing. Republican maps marked both as undetermined frontiers; the CCP gave up these claims in border treaties with Burma and Afghanistan in the 1960s, treaties the Republic of China never recognized."
 TAI_begonia_leaf: "The Begonia Leaf"
 TAI_begonia_leaf_desc: "From the Pamirs to the Ussuri, from the northern deserts to the Spratlys, the begonia-leaf map has been the motherland in the hearts of generations of Chinese. Children growing up in Taiwan saw this begonia leaf in their textbooks; now it is no longer just a map but territory the Republic of China actually governs."
