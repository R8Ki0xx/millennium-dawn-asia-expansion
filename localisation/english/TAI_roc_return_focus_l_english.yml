l_english:
 TAI_silicon_island: "Silicon Island Plan"
 TAI_silicon_island_desc: "The competition of the new century is a competition of technology. With semiconductors, information and communications at its core, make Taiwan an irreplaceable link in the global tech supply chain."
 TAI_hsinchu_expansion: "Expand the Hsinchu Science Park"
 TAI_hsinchu_expansion_desc: "The Hsinchu Science Park is the cradle of Taiwan's high-tech industry. Expand it, add the Southern and Central Taiwan Science Parks, and draw talent home from abroad."
 TAI_ten_new_constructions: "Ten New Major Construction Projects"
 TAI_ten_new_constructions_desc: "Following the Ten Major Construction Projects of the 1970s, launch a new round of public works: ports, metros, sewage treatment and roads for remote areas."
 TAI_sacred_mountain: "The Sacred Mountain That Protects the Nation"
 TAI_sacred_mountain_desc: "Chip foundries have become Taiwan's strongest shield. Give full support to research on advanced processes."
 TAI_broadband_island: "e-Taiwan"
 TAI_broadband_island_desc: "Build an island-wide broadband network and make Taiwan the most connected society in Asia."
 TAI_panel_industry: "The Two Panel Tigers"
 TAI_panel_industry_desc: "AU Optronics and Chimei make Taiwan a world center of LCD panels."
 TAI_foundry_alliance: "The Two Foundry Giants"
 TAI_foundry_alliance_desc: "TSMC and UMC stand side by side, holding more than half the world's foundry capacity."
 TAI_e_government: "E-Government"
 TAI_e_government_desc: "Household registration, land administration and taxes all go online, greatly improving government efficiency."
 TAI_pc_kingdom: "Kingdom of Contract Manufacturing"
 TAI_pc_kingdom_desc: "Foxconn, Quanta, Compal... half the world's computers and phones are made by Taiwanese firms."
 TAI_ic_design: "IC Design Industry"
 TAI_ic_design_desc: "Chip design firms such as MediaTek are rising. Taiwan no longer only manufactures chips; it designs them too."
 TAI_mobile_taiwan: "Mobile Taiwan"
 TAI_mobile_taiwan_desc: "The age of wireless broadband and smartphones has arrived, and HTC leads the world."
 TAI_biotech: "Biotech Takes Off"
 TAI_biotech_desc: "Use the lessons of semiconductor success to grow the biotech and medical device industries."
 TAI_digital_content: "Digital Content Industry"
 TAI_digital_content_desc: "Games, animation and digital entertainment are the new economy of the young generation."
 TAI_silicon_shield: "Silicon Shield"
 TAI_silicon_shield_desc: "The whole world depends on Taiwan's chips. That is our best defense."
 TAI_high_speed_rail: "Taiwan High Speed Rail"
 TAI_high_speed_rail_desc: "Taipei to Kaohsiung in ninety minutes. High-speed rail will reshape the western corridor."
 TAI_fourth_nuclear_plant: "Finish the Fourth Nuclear Plant"
 TAI_fourth_nuclear_plant_desc: "Energy independence is a matter of national security. We have decided to complete the Lungmen Nuclear Power Plant."
 TAI_mrt_networks: "Metro Networks"
 TAI_mrt_networks_desc: "Construction begins across the metro networks of Taipei, Kaohsiung, Taichung and Taoyuan."
 TAI_port_expansion: "Kaohsiung Free Trade Port"
 TAI_port_expansion_desc: "Set up a free trade port zone to put the port of Kaohsiung back among the world's leaders."
 TAI_petrochemical: "Expand the Sixth Naphtha Cracker"
 TAI_petrochemical_desc: "The Sixth Naphtha Cracker at Mailiao is one of the largest petrochemical complexes in Asia."
 TAI_renewables: "Renewable Energy"
 TAI_renewables_desc: "Offshore wind and solar power prepare us for the energy transition."
 TAI_second_financial_reform: "Second Financial Reform"
 TAI_second_financial_reform_desc: "Merge our too many, too small local banks into financial holding groups that can compete in the region."
 TAI_tourism_doubling: "Doubling Tourist Arrivals"
 TAI_tourism_doubling_desc: "Open the door to more tourists and make the night markets, hot springs and Jade Mountain world-class attractions."
 TAI_three_links: "The Three Links"
 TAI_three_links_desc: "Direct post, trade and transport. Use economic ties to drive change on the mainland."
 TAI_go_south_policy: "Go South Policy"
 TAI_go_south_policy_desc: "Reduce dependence on the mainland market and steer capital and industry toward Southeast Asia."
 TAI_quality_agriculture: "High-Value Agriculture"
 TAI_quality_agriculture_desc: "High-value fruit, tea and orchids take Taiwanese farming to the world."
 TAI_cross_strait_ecfa: "Cross-Strait Economic Cooperation Framework Agreement"
 TAI_cross_strait_ecfa_desc: "Cut tariffs and open up services, giving Taiwan the first move in the mainland market."
 TAI_asean_fta: "Trade Agreements with Singapore and New Zealand"
 TAI_asean_fta_desc: "Sign economic partnership agreements with Singapore, New Zealand and others to break out of our marginalization in regional integration."
 TAI_health_insurance_reform: "Sustainable Health Insurance Reform"
 TAI_health_insurance_reform_desc: "The second-generation reform puts National Health Insurance on a sustainable footing."
 TAI_asia_pacific_hub: "Asia-Pacific Regional Operations Center"
 TAI_asia_pacific_hub_desc: "Make Taiwan the Asia-Pacific headquarters, financial center and logistics hub for multinational companies."
 TAI_second_economic_miracle: "Second Economic Miracle"
 TAI_second_economic_miracle_desc: "From export processing to Silicon Island, Taiwan has worked another economic miracle."
 TAI_new_millennium_roc: "The Republic of China in the New Millennium"
 TAI_new_millennium_roc_desc: "The year 2000, the 89th year of the Republic. Half a century ago, the Nationalist Government moved to Taiwan; half a century later, the 22 million people of Taiwan, Penghu, Kinmen and Matsu stand on the threshold of a new century. Where will the Republic of China go?"
 TAI_cross_strait_crossroads: "Crossroads in the Strait"
 TAI_cross_strait_crossroads_desc: "What ‘One China’ means, unification or independence, maintaining the status quo: every politician must answer this question."
 TAI_judicial_reform: "Judicial Reform"
 TAI_judicial_reform_desc: "Push for judicial independence and transparent trials to rebuild the people's trust in the courts."
 TAI_constitutional_orthodoxy: "ROC Constitutional Orthodoxy"
 TAI_constitutional_orthodoxy_desc: "The existing national territory defined in the Constitution of the Republic of China has never changed. Taiwan is the base for national revival, not the final destination of the Republic of China. The Pan-Blue camp unites and vows to restore the constitutional orthodoxy of the Republic of China over all of China."
 TAI_taiwan_first: "Taiwan First"
 TAI_taiwan_first_desc: "Whatever the country's name, the people of this land are its masters. The Pan-Green camp puts Taiwan first, maintains the status quo and guards democracy."
 TAI_legislative_reform: "Legislative Reform"
 TAI_legislative_reform_desc: "The Legislative Yuan is inefficient and chaotic. Reforming it is now the consensus of government and opposition alike."
 TAI_legislative_halving: "Halve the Legislature"
 TAI_legislative_halving_desc: "Cut the Legislative Yuan from 225 seats to 113 and adopt single-member districts with two votes."
 TAI_seventh_amendment: "The Seventh Constitutional Amendment"
 TAI_seventh_amendment_desc: "Abolish the National Assembly and establish citizen referendums for constitutional amendments."
 TAI_sunshine_laws: "Sunshine Laws"
 TAI_sunshine_laws_desc: "Asset declarations for public officials, a Political Donations Act and a Lobbying Act let politics work in the sunlight."
 TAI_mature_democracy: "Deepening Democracy"
 TAI_mature_democracy_desc: "Changes of government have become normal, and democracy has put down deep roots in Taiwan."
 TAI_three_principles_revival: "Revival of the Three Principles"
 TAI_three_principles_revival_desc: "Nationalism, democracy, the people's livelihood. The Founding Father's teachings are the banner that shows our compatriots on the mainland another way."
 TAI_lien_soong_alliance: "Lien-Soong Cooperation"
 TAI_lien_soong_alliance_desc: "The Kuomintang and the People First Party bury their differences, and the Pan-Blue camp becomes one."
 TAI_purge_black_gold: "Purge Black Gold Politics"
 TAI_purge_black_gold_desc: "Local factions and organized crime are deeply entangled. Without cutting out the rot, we have no right to talk of national revival."
 TAI_kmt_party_reform: "Kuomintang Party Reform"
 TAI_kmt_party_reform_desc: "Younger, more local and more modern: the Kuomintang must remake itself."
 TAI_strengthen_unification_council: "Strengthen the National Unification Council"
 TAI_strengthen_unification_council_desc: "Revive the long-dormant National Unification Council to coordinate mainland policy research and psychological warfare."
 TAI_five_yuan_reform: "Strengthen the Five Yuan System"
 TAI_five_yuan_reform_desc: "Restore the checks and balances of the Five-Power Constitution and improve government efficiency."
 TAI_party_assets_trust: "Party Assets in Trust"
 TAI_party_assets_trust_desc: "Place the Kuomintang's assets in trust to shed the stigma of being ‘the richest party in the world’."
 TAI_chinese_culture_renaissance: "Chinese Cultural Renaissance Movement"
 TAI_chinese_culture_renaissance_desc: "Taiwan has preserved traditional characters and traditional culture; it is the true guardian of Chinese culture."
 TAI_national_security_law: "National Security Legislation"
 TAI_national_security_law_desc: "Revise the National Security Act and pass an Anti-Infiltration Act to guard against CCP United Front infiltration."
 TAI_guidelines_for_unification: "Guidelines for National Unification"
 TAI_guidelines_for_unification_desc: "Complete unification in stages, with a democratic, free and equitably prosperous China as the goal. If the other side refuses, the Republic of China reserves all options."
 TAI_status_quo: "Maintain the Status Quo"
 TAI_status_quo_desc: "No unification, no independence, no use of force. Walking a tightrope between two great powers is this island's most practical way to survive."
 TAI_transitional_justice: "Transitional Justice"
 TAI_transitional_justice_desc: "Face the historical wounds of the White Terror and the 228 Incident: open the archives and overturn wrongful convictions."
 TAI_referendum_act: "Referendum Act"
 TAI_referendum_act_desc: "Let the people decide major public questions directly."
 TAI_porcupine_strategy: "Porcupine Strategy"
 TAI_porcupine_strategy_desc: "We do not need to win a war against an invasion; we only need to make the invader pay a price it cannot bear."
 TAI_values_diplomacy: "Values Diplomacy"
 TAI_values_diplomacy_desc: "Deepen ties with like-minded nations through the shared values of democracy, human rights and free markets."
 TAI_civil_society: "Civil Society"
 TAI_civil_society_desc: "Social movements, NGOs and an independent press are the firmest foundation of Taiwan's democracy."
 TAI_whole_society_defense: "Whole-of-Society Defense Resilience"
 TAI_whole_society_defense_desc: "Civil defense, health care, communications and energy must be prepared for war in peacetime."
 TAI_indigenous_rights: "Indigenous Self-Government"
 TAI_indigenous_rights_desc: "Protect the land and cultural rights of indigenous peoples through the Indigenous Peoples Basic Law."
 TAI_formosa_resilience: "Resilient Taiwan"
 TAI_formosa_resilience_desc: "Keep Taiwan standing through any storm."
 TAI_national_glory_plan: "Revive Project National Glory"
 TAI_national_glory_plan_desc: "In 1961, Chiang Kai-shek secretly set up the ‘National Glory Office’ to plan the counterattack on the mainland. Forty years later, the dusty plan is spread out on a desk in the Presidential Office again."
 TAI_mainland_work_conference: "Mainland Work Conference"
 TAI_mainland_work_conference_desc: "Combine the strength of the National Security Bureau, the Mainland Affairs Council, the Ministry of National Defense and the Kuomintang's Mainland Affairs Department for political, psychological and intelligence work on the mainland."
 TAI_intelligence_war: "Intelligence War"
 TAI_intelligence_war_desc: "The Military Intelligence Bureau and the National Security Bureau rebuild their networks on the mainland to track military and political developments across the Strait."
 TAI_amphibious_corps: "Amphibious Landing Corps"
 TAI_amphibious_corps_desc: "To cross the Taiwan Strait, we need a corps that can land under fire."
 TAI_secure_us_acquiescence: "Win American Acquiescence"
 TAI_secure_us_acquiescence_desc: "Without Washington's nod, a counterattack on the mainland is empty talk. Send a secret envoy to America to test where the Americans draw the line."
 TAI_war_economy: "Wartime Economic System"
 TAI_war_economy_desc: "The defense budget doubles, and civilian factories switch to military production."
 TAI_mainland_democracy_support: "Support the Mainland Democracy Movement"
 TAI_mainland_democracy_support_desc: "The blood of 1989 was not shed in vain. Fund the exiled democracy activists and sow the seeds of freedom back on the mainland."
 TAI_overseas_mobilization: "Rally the Overseas Chinese"
 TAI_overseas_mobilization_desc: "From San Francisco to Kuala Lumpur, call on overseas Chinese to give money and effort to the great cause of reviving the Republic of China."
 TAI_special_forces_raids: "Special Operations Behind Enemy Lines"
 TAI_special_forces_raids_desc: "Sea Dragon frogmen and special forces will infiltrate the mainland coast to sabotage transport and command centers."
 TAI_kinmen_matsu_bastion: "Kinmen and Matsu Forward Bases"
 TAI_kinmen_matsu_bastion_desc: "Kinmen and Matsu lie only a few kilometers from the mainland, springboards for the counterattack. Rebuild their harbors, airfields and tunnels."
 TAI_air_sea_superiority: "Air and Sea Superiority"
 TAI_air_sea_superiority_desc: "Any landing first requires control of the air and sea over the Strait."
 TAI_strategic_stockpile: "Strategic Stockpiles"
 TAI_strategic_stockpile_desc: "Stockpile enough fuel, ammunition and food for six months of fighting."
 TAI_peaceful_unification_talks: "Cross-Strait Peaceful Unification Talks"
 TAI_peaceful_unification_talks_desc: "If the other side has taken the road to democracy, or its regime is tottering, unification need not cost blood. Offer Beijing a plan for peaceful unification under the Constitution of the Republic of China."
 TAI_ignite_mainland_uprising: "Ignite a Mainland Uprising"
 TAI_ignite_mainland_uprising_desc: "When the people's patience has run out, a single spark is enough. Incite soldiers and civilians in the southeastern provinces to rise up and found a ‘Provisional Mainland Government of the Republic of China’. The National Army will support them first as volunteers, and reorganize and send in troops once the situation is clear."
 TAI_return_to_mainland: "Counterattack on the Mainland"
 TAI_return_to_mainland_desc: "‘Recover the mainland and free our compatriots.’ A vow more than half a century old will be kept today."
 TAI_strait_blockade: "Blockade the Strait"
 TAI_strait_blockade_desc: "Blockade the ports of the southeast coast across the Strait with submarines and mines."
 TAI_general_mobilization: "General Mobilization"
 TAI_general_mobilization_desc: "Issue the mobilization order. All reservists rejoin their units."
 TAI_psychological_offensive: "Psychological Offensive"
 TAI_psychological_offensive_desc: "Leaflet balloons, loudspeaker broadcasts and online psychological warfare to break the fighting spirit of soldiers and civilians across the Strait."
 TAI_southeast_landings: "Landings on the Southeast Coast"
 TAI_southeast_landings_desc: "The coasts of Fujian, Zhejiang and Guangdong are the battlefield the National Army knows best. With all three services working together, establish a beachhead."
 TAI_pla_uprising: "Defections on the Front Line"
 TAI_pla_uprising_desc: "Many PLA officers and soldiers had grandfathers in the National Army. Call out to them: ‘Brothers, come home!’"
 TAI_airborne_assault: "Airborne Assault"
 TAI_airborne_assault_desc: "Airborne special forces seize airfields and key transport hubs behind enemy lines."
 TAI_liberate_fujian: "Liberate Fujian"
 TAI_liberate_fujian_desc: "The National Army lands at the mouth of the Min River, and the Blue Sky, White Sun and Wholly Red Earth flag rises over Fuzhou."
 TAI_liberate_shanghai: "Liberate Shanghai"
 TAI_liberate_shanghai_desc: "The greatest metropolis of the Far East is back in the arms of the Republic of China."
 TAI_liberate_guangdong: "Liberate Guangdong"
 TAI_liberate_guangdong_desc: "Guangzhou, birthplace of the National Revolution, is liberated once more."
 TAI_retake_nanjing: "Liberate Nanjing"
 TAI_retake_nanjing_desc: "Before the Sun Yat-sen Mausoleum, the Blue Sky, White Sun and Wholly Red Earth flag flies again. The capital is liberated!"
 TAI_liberate_wuhan: "Liberate Wuhan"
 TAI_liberate_wuhan_desc: "Wuhan, the crossroads of nine provinces, falls to the National Army, and the whole length of the Yangtze is open."
 TAI_northern_expedition: "Northern Expedition"
 TAI_northern_expedition_desc: "Carrying on the unfinished mission of the late President Chiang, the National Army marches north once again!"
 TAI_liberate_southwest: "Liberate the Southwest"
 TAI_liberate_southwest_desc: "Sichuan, Chongqing and the Yunnan-Guizhou Plateau are liberated one after another, and the wartime capital returns to the Nationalist Government."
 TAI_liberate_beiping: "Liberate Beiping"
 TAI_liberate_beiping_desc: "The National Army marches into Beiping, and the flag of the Republic of China hangs once more over the Forbidden City and the Gate of Heavenly Peace."
 TAI_mainland_restored: "Restore China"
 TAI_mainland_restored_desc: "From Nanjing to Beiping, the constitutional orthodoxy of the Republic of China has finally returned to the land where it was born. But 1.3 billion compatriots, half a century of separation and a completely different society are waiting for the new government.\n\n§YOnce completed, the focus tree switches to the new post-Restoration tree.§!"
 TAI_armed_forces_modernization: "Modernize the National Army"
 TAI_armed_forces_modernization_desc: "After the Streamlining Program, the National Army needs more than cuts: it needs a force that can win a modern war."
 TAI_army_reform: "Streamline the Army"
 TAI_army_reform_desc: "Cut surplus personnel and layers of command, and concentrate resources in the combat units."
 TAI_navy_modernization: "Modernize the Navy"
 TAI_navy_modernization_desc: "The aging Yang-class destroyers must retire. The navy needs a new generation of capital ships."
 TAI_air_force_modernization: "Modernize the Air Force"
 TAI_air_force_modernization_desc: "Mirages, F-16s and Ching-kuo IDFs: integrating three generations of fighters."
 TAI_han_kuang_exercise: "Han Kuang Exercise"
 TAI_han_kuang_exercise_desc: "Real troops, live fire and no fixed script, testing the true fighting strength of all three services."
 TAI_conscription_reform: "Military Service Reform"
 TAI_conscription_reform_desc: "Shorten service, strengthen training and expand the reserve mobilization system."
 TAI_marine_corps_expansion: "Expand the Marine Corps"
 TAI_marine_corps_expansion_desc: "The Marine Corps is the National Army's only force capable of amphibious assault. Expanding it serves both the defense of our land and the future."
 TAI_armor_modernization: "Re-Equip the Armor"
 TAI_armor_modernization_desc: "Replace the aging M48s and M113s with M1A2s and eight-wheeled Clouded Leopard armored vehicles."
 TAI_army_aviation: "Army Aviation Brigades"
 TAI_army_aviation_desc: "Apache and Black Hawk helicopters give the army mobility in three dimensions."
 TAI_whampoa_spirit: "Whampoa Spirit"
 TAI_whampoa_spirit_desc: "Fraternity, affection, sincerity and devotion. The motto of the Military Academy has been the soul of the National Army for a century."
 TAI_special_forces: "Special Forces"
 TAI_special_forces_desc: "Airborne special forces, Sea Dragon frogmen and the military police Night Hawks: the National Army's sharpest blades."
 TAI_mobile_defense_doctrine: "Mobile Defense Doctrine"
 TAI_mobile_defense_doctrine_desc: "Win on the beaches and defend in depth, destroying the enemy at the water's edge with mobile strikes."
 TAI_hsiung_feng_missiles: "Hsiung Feng Missiles"
 TAI_hsiung_feng_missiles_desc: "The Hsiung Feng anti-ship and land-attack cruise missiles are the sharp sword that deters any crossing of the Strait."
 TAI_kidd_destroyers: "Kidd-Class Destroyers"
 TAI_kidd_destroyers_desc: "Buy four Kidd-class destroyers from the United States, greatly improving our air defense."
 TAI_indigenous_submarine: "Indigenous Submarine Program"
 TAI_indigenous_submarine_desc: "If no one will sell us submarines, we will build our own. The keel of the Hai Kun will be laid in Kaohsiung."
 TAI_stealth_corvettes: "Tuo Chiang-Class Corvettes"
 TAI_stealth_corvettes_desc: "Fast, stealthy and heavily armed ‘carrier killers’."
 TAI_coast_guard_administration: "Coast Guard Administration"
 TAI_coast_guard_administration_desc: "Unify our maritime patrol forces to guard the waters of the Taiwan Strait and the South China Sea."
 TAI_sea_control_doctrine: "Sea Control Operations"
 TAI_sea_control_doctrine_desc: "Build a layered sea control system of submarines, missile boats and shore-based missiles."
 TAI_idf_upgrade: "Upgrade the Ching-kuo IDF"
 TAI_idf_upgrade_desc: "Give the F-CK-1 new avionics and missiles, and start developing the next domestic fighter."
 TAI_f16_upgrade: "F-16V Upgrade"
 TAI_f16_upgrade_desc: "Fit more than 140 F-16s with AESA radar."
 TAI_tien_kung_air_defense: "Sky Bow Air Defense Network"
 TAI_tien_kung_air_defense_desc: "Build an island-wide layered air defense network around the Sky Bow III."
 TAI_air_base_hardening: "Harden the Air Bases"
 TAI_air_base_hardening_desc: "Dispersal shelters, rapid runway repair and the Chiashan base let the air force keep fighting after a first strike."
 TAI_drone_program: "Drone Program"
 TAI_drone_program_desc: "NCSIST's Teng Yun drones and a range of small drones are new tools for asymmetric warfare."
 TAI_air_superiority_doctrine: "Air Superiority Operations"
 TAI_air_superiority_doctrine_desc: "Control of the air over the Strait decides everything."
 TAI_long_range_strike: "Long-Range Precision Strike"
 TAI_long_range_strike_desc: "The Hsiung Sheng and Yun Feng missiles can strike deep targets across the Strait."
 TAI_joint_operations: "Joint Operations"
 TAI_joint_operations_desc: "Break down service parochialism and build a joint operations command."
 TAI_iron_bastion: "An Impregnable Fortress"
 TAI_iron_bastion_desc: "Layer upon layer of defenses, from Kinmen and Matsu to Taiwan and Penghu."
 TAI_defense_autonomy: "Defense Self-Reliance"
 TAI_defense_autonomy_desc: "Key weapons cannot depend on others; the defense industry must stand on its own feet."
 TAI_cyber_command: "Information, Communications and Electronic Force"
 TAI_cyber_command_desc: "Set up an Information, Communications and Electronic Force Command to defend against and counter cyber attacks from across the Strait."
 TAI_csist_expansion: "Expand NCSIST"
 TAI_csist_expansion_desc: "The National Chung-Shan Institute of Science and Technology is the core of defense technology. Expand it and give it more research money."
 TAI_pragmatic_diplomacy: "Pragmatic Diplomacy"
 TAI_pragmatic_diplomacy_desc: "So long as the world can see the Republic of China, names and formats can bend."
 TAI_us_arms_sales: "US Arms Sales"
 TAI_us_arms_sales_desc: "Under the Taiwan Relations Act, press the United States to sell us more advanced defensive weapons."
 TAI_japan_partnership: "Taiwan-Japan Partnership"
 TAI_japan_partnership_desc: "Japan is one of Taiwan's most important neighbors, with great promise for cooperation in trade, technology and security."
 TAI_secure_allies: "Secure Our Allies"
 TAI_secure_allies_desc: "Our allies in Central America, the Caribbean and the Pacific are the pillars of the Republic of China's international standing."
 TAI_taiwan_relations_act: "Taiwan Relations Act"
 TAI_taiwan_relations_act_desc: "The US Congress is Taiwan's staunchest friend."
 TAI_us_trade_talks: "Taiwan-US Trade and Investment Framework"
 TAI_us_trade_talks_desc: "Push for a Taiwan-US trade agreement and expand cooperation on technology and investment."
 TAI_japan_tech: "Taiwan-Japan Technology Cooperation"
 TAI_japan_tech_desc: "In semiconductor materials, equipment and precision machinery, Taiwanese and Japanese industry complement each other closely."
 TAI_central_america_aid: "Central American Aid Program"
 TAI_central_america_aid_desc: "Medical missions, agricultural teams and scholarships strengthen our friendship with our Central American allies."
 TAI_pacific_allies: "Pacific Allies"
 TAI_pacific_allies_desc: "The Marshall Islands, Tuvalu, Nauru, Palau and the Solomon Islands: our partners in the South Pacific."
 TAI_us_military_exchange: "Taiwan-US Military Exchanges"
 TAI_us_military_exchange_desc: "Officer visits, joint training and intelligence sharing."
 TAI_overseas_chinese_affairs: "Overseas Chinese Affairs"
 TAI_overseas_chinese_affairs_desc: "The overseas Chinese were ‘the mother of the revolution’. Strengthen their loyalty to the Republic of China."
 TAI_europe_relations: "Taiwan-Europe Relations"
 TAI_europe_relations_desc: "Build friendly ties with the European Parliament and national parliaments."
 TAI_africa_allies: "African Allies"
 TAI_africa_allies_desc: "Strengthen our relations with African allies such as Eswatini."
 TAI_wto_accession: "Join the WTO"
 TAI_wto_accession_desc: "Join the World Trade Organization as the ‘Separate Customs Territory of Taiwan, Penghu, Kinmen and Matsu’."
 TAI_international_space: "Expand International Space"
 TAI_international_space_desc: "Take part in the World Health Assembly, the International Civil Aviation Organization and other bodies as an observer or under special names."
 TAI_who_bid: "Participate in the WHO"
 TAI_who_bid_desc: "Disease knows no borders. Seek to attend the World Health Assembly as an observer."
 TAI_de_facto_alliance: "De Facto Alliance"
 TAI_de_facto_alliance_desc: "An alliance in all but name, with no treaty to show for it."
 TAI_global_partner: "Global Partner"
 TAI_global_partner_desc: "The Republic of China is a responsible member of the international community."
 TAI_new_republic_era: "A New Era for the Republic"
 TAI_new_republic_era_desc: "The flag of the Republic of China flies over all of China once more. Everything needs rebuilding; everything starts again."
 TAI_return_capital_nanjing: "Make Nanjing the Capital"
 TAI_return_capital_nanjing_desc: "The Nationalist Government makes Nanjing its capital! Before the Sun Yat-sen Mausoleum, the President takes the oath of office. The capital is set in Nanjing by default. Mutually exclusive with ‘Move the Capital to Beiping’."
 TAI_military_government_period: "Period of Military Government"
 TAI_military_government_period_desc: "Under the Founding Father's Fundamentals of National Reconstruction, nation-building has three stages: military government, political tutelage and constitutional government. In the first days of the Restoration, restoring order and clearing out the remnants come first."
 TAI_social_stabilization: "Stabilize Livelihoods"
 TAI_social_stabilization_desc: "Food, wages, pensions: first, let ordinary people get by."
 TAI_frontier_policy: "Frontier Policy"
 TAI_frontier_policy_desc: "Mongolia, Tibet and Xinjiang are autonomous regions protected by the Constitution of the Republic of China. The new government needs a frontier policy that upholds unity while respecting every people."
 TAI_restore_provinces: "Rebuild the Provincial Governments"
 TAI_restore_provinces_desc: "Restore the provincial governments and appoint provincial chairmen."
 TAI_east_china_admin: "East China Administrative Region"
 TAI_east_china_admin_desc: "Jiangsu, Zhejiang, Shanghai, Shandong, Fujian, Anhui and Jiangxi: the richest heartland of the Republic of China."
 TAI_south_china_admin: "South China Administrative Region"
 TAI_south_china_admin_desc: "Guangdong, Guangxi and Hainan: the gateway to the South Seas."
 TAI_central_china_admin: "Central China Administrative Region"
 TAI_central_china_admin_desc: "Henan, Hubei and Hunan are China's granary and transport hub."
 TAI_north_china_admin: "North China Administrative Region"
 TAI_north_china_admin_desc: "Beiping, Tianjin, Hebei, Shanxi, Chahar and Suiyuan: re-establish the provinces of Hebei, Chahar and Suiyuan."
 TAI_northeast_admin: "Northeast Administrative Region"
 TAI_northeast_admin_desc: "Restore the nine provinces of the Northeast and revive the old industrial base."
 TAI_northwest_admin: "Northwest Administrative Region"
 TAI_northwest_admin_desc: "Shaanxi, Gansu, Ningxia, Qinghai and Xinjiang: where the Silk Road begins."
 TAI_southwest_admin: "Southwest Administrative Region"
 TAI_southwest_admin_desc: "Sichuan, Chongqing, Yunnan, Guizhou and Xikang: the great rear area of the War of Resistance."
 TAI_county_reorganization: "County Reorganization"
 TAI_county_reorganization_desc: "Abolish the prefecture-level cities and restore a two-tier system of provinces and counties, cutting layers of administration."
 TAI_hainan_province: "Hainan Province"
 TAI_hainan_province_desc: "Make Hainan Island a province of its own and develop it as an international free trade island."
 TAI_balanced_powers: "Balance of Central and Local Power"
 TAI_balanced_powers_desc: "Powers are shared between center and localities: matters that require national uniformity go to the center, and matters that vary by place go to the localities."
 TAI_martial_order: "Restore Order"
 TAI_martial_order_desc: "Military police and police take over public security everywhere, and the militias are disarmed."
 TAI_purge_remnants: "Clear Out the Remnants"
 TAI_purge_remnants_desc: "The diehards who refuse to accept the new government must be removed."
 TAI_ccp_question: "The CCP Question"
 TAI_ccp_question_desc: "What becomes of ninety million CCP members? This is the greatest problem facing the new government."
 TAI_national_reconciliation: "National Reconciliation"
 TAI_national_reconciliation_desc: "‘Old grudges vanish with a smile when we meet again.’ Do not pursue ordinary party members and grassroots cadres; trade forgiveness for the unity of 1.3 billion people."
 TAI_mainland_transitional_justice: "Reckoning and Transitional Justice"
 TAI_mainland_transitional_justice_desc: "The victims of past political campaigns deserve an answer. Hold those responsible for grave human rights abuses to account under the law, and dismantle the CCP's organization."
 TAI_party_asset_settlement: "Settle the CCP's Assets"
 TAI_party_asset_settlement_desc: "The party's vast assets, party-run enterprises and ‘slush funds’ go to the treasury, to be used for local reconstruction and resettlement."
 TAI_political_amnesty: "Pardon Political Prisoners"
 TAI_political_amnesty_desc: "Release everyone imprisoned for their speech, beliefs or associations."
 TAI_political_tutelage_period: "Period of Political Tutelage"
 TAI_political_tutelage_period_desc: "The government trains the people to exercise the four rights of election, recall, initiative and referendum, rolling out local self-government county by county."
 TAI_four_rights_training: "Training in the Four Rights"
 TAI_four_rights_training_desc: "Run civic training classes in every county to teach the people how to exercise the four rights of election, recall, initiative and referendum."
 TAI_local_self_government: "County Self-Government"
 TAI_local_self_government_desc: "Once the people of a county have completed training in the four rights, they may elect their county officials to run the county's affairs."
 TAI_control_yuan_anticorruption: "The Control Yuan Fights Corruption"
 TAI_control_yuan_anticorruption_desc: "The Control Yuan and the Independent Commission Against Corruption join forces to punish graft during the takeover."
 TAI_national_assembly: "Convene the National Assembly"
 TAI_national_assembly_desc: "Delegates from every province gather in Nanjing to revise the Additional Articles of the Constitution and prepare for constitutional government."
 TAI_provincial_assemblies: "Provincial Assembly Elections"
 TAI_provincial_assemblies_desc: "Provincial assemblies are elected directly by the people."
 TAI_constitutional_period: "Period of Constitutional Government"
 TAI_constitutional_period_desc: "Once more than half the provinces have achieved full self-government, the period of constitutional government begins. The Constitution of the Republic of China takes full effect."
 TAI_first_national_election: "The First National Election"
 TAI_first_national_election_desc: "For the first time, 1.3 billion voters choose the nation's leaders with their ballots."
 TAI_five_yuan_nationwide: "The Five Yuan Nationwide"
 TAI_five_yuan_nationwide_desc: "The Executive, Legislative, Judicial, Examination and Control Yuan are working normally across the country."
 TAI_world_for_all: "The World Belongs to All"
 TAI_world_for_all_desc: "‘When the Great Way prevails, the world belongs to all.’ A Republic of China of the people, by the people and for the people has at last been realized across all of China."
 TAI_party_politics: "Party Politics"
 TAI_party_politics_desc: "With the National Assembly elections over, the parties begin to organize, compete and cooperate nationwide. The Republic of China enters a true age of party politics."
 TAI_kmt_government: "The Kuomintang Governs"
 TAI_kmt_government_desc: "The century-old party has won the first national election. The Kuomintang will govern all of China by the Three Principles of the People."
 TAI_kmt_party_state_separation: "Separate Party and State"
 TAI_kmt_party_state_separation_desc: "Party assets go to the public, and party posts are separated from public office. The Kuomintang is no longer a ‘party-state’."
 TAI_kmt_fiscal_prudence: "Sound Finances"
 TAI_kmt_fiscal_prudence_desc: "Live within our means, and never let inflation repeat the tragedy of 1949."
 TAI_kmt_strong_defense: "Defense First"
 TAI_kmt_strong_defense_desc: "National unity was hard won and must be guarded by a strong defense."
 TAI_kmt_one_family: "One Family Across the Strait"
 TAI_kmt_one_family_desc: "Compatriots in Taiwan and on the mainland are one family. Healing half a century of separation is the ruling party's first task."
 TAI_kmt_pro_business: "Pro-Business Policy"
 TAI_kmt_pro_business_desc: "Cut taxes, cut red tape and attract investment, letting private capital grow freely."
 TAI_kmt_four_social_bonds: "Propriety, Righteousness, Integrity and Shame"
 TAI_kmt_four_social_bonds_desc: "Restore traditional ethics and rebuild society's moral order."
 TAI_kmt_greater_china_economy: "Greater China Economic Sphere"
 TAI_kmt_greater_china_economy_desc: "Bring together the capital of the mainland, Taiwan, Hong Kong and the Chinese of Southeast Asia to build the largest economic sphere in the world."
 TAI_kmt_era: "A Century-Old Party Reborn"
 TAI_kmt_era_desc: "From the Tongmenghui to a unified China, the Kuomintang has come a journey of more than a hundred years."
 TAI_dp_government: "The China Democratic Party Governs"
 TAI_dp_government_desc: "The China Democratic Party, crushed on the mainland in 1998, has now won the national election. The age of the liberals has arrived."
 TAI_dp_bill_of_rights: "Bill of Rights"
 TAI_dp_bill_of_rights_desc: "Freedom of speech, assembly, association, religion and movement, all written into law and protected by the courts."
 TAI_dp_free_market: "Free Market"
 TAI_dp_free_market_desc: "Abolish price controls and administrative approvals, and let the market allocate resources."
 TAI_dp_provincial_autonomy: "Federation of Self-Governing Provinces"
 TAI_dp_provincial_autonomy_desc: "Widen the provinces' legislative and fiscal autonomy, moving toward a decentralized, democratic China."
 TAI_dp_judicial_independence: "Judicial Independence"
 TAI_dp_judicial_independence_desc: "Life tenure for judges, constitutional review and trial by jury."
 TAI_dp_open_society: "Open Society"
 TAI_dp_open_society_desc: "Let foreign journalists, scholars and investors come and go freely."
 TAI_dp_antitrust: "Antitrust Law"
 TAI_dp_antitrust_desc: "Break up monopolistic state enterprises and conglomerates to guarantee fair competition."
 TAI_dp_join_free_world: "Join the Free World"
 TAI_dp_join_free_world_desc: "Join the economic and security systems of the Western democracies."
 TAI_dp_liberal_china: "Free China"
 TAI_dp_liberal_china_desc: "The ideals of Lei Chen and Yin Hai-kuang have at last come true across all of China."
 TAI_sd_government: "The Social Democrats Govern"
 TAI_sd_government_desc: "The Chinese Social Democratic Party, made up of reform-minded former CCP members, union leaders and intellectuals, has won the election."
 TAI_sd_free_unions: "Independent Unions"
 TAI_sd_free_unions_desc: "At last, workers can organize unions that truly belong to them."
 TAI_sd_welfare_state: "Welfare State"
 TAI_sd_welfare_state_desc: "Following the Nordic model, build a social safety net from the cradle to the grave."
 TAI_sd_people_dividend: "A People's Dividend from State Assets"
 TAI_sd_people_dividend_desc: "The profits of state enterprises are paid out to every citizen as a dividend."
 TAI_sd_free_education: "Free Education"
 TAI_sd_free_education_desc: "Free from kindergarten to university."
 TAI_sd_national_pension: "National Pension"
 TAI_sd_national_pension_desc: "Every citizen, in town or country, is provided for in old age."
 TAI_sd_progressive_tax: "Progressive Taxation"
 TAI_sd_progressive_tax_desc: "The rich pay more tax, and wealth is redistributed."
 TAI_sd_green_growth: "Green Development"
 TAI_sd_green_growth_desc: "Clean up the smog and restore the rivers, so China sees blue skies again."
 TAI_sd_social_china: "A Socially Just China"
 TAI_sd_social_china_desc: "Here the Principle of Livelihood and social democracy find a common answer."
 TAI_grand_coalition: "Grand Coalition Government"
 TAI_grand_coalition_desc: "No party has won a majority. For the sake of national stability, the major parties form a grand coalition."
 TAI_gc_coalition_agreement: "Coalition Agreement"
 TAI_gc_coalition_agreement_desc: "The parties sign a coalition agreement setting out the common ground of their program."
 TAI_gc_cabinet_sharing: "Sharing the Cabinet"
 TAI_gc_cabinet_sharing_desc: "Ministries are shared out in proportion to each party's vote."
 TAI_gc_constitutional_court: "Constitutional Court"
 TAI_gc_constitutional_court_desc: "Set up a Constitutional Court as the final arbiter of political disputes."
 TAI_gc_national_unity: "National Unity"
 TAI_gc_national_unity_desc: "On the big questions, government and opposition stand united."
 TAI_gc_pragmatic_reform: "Pragmatic Reform"
 TAI_gc_pragmatic_reform_desc: "Left or right doesn't matter, only whether it works."
 TAI_gc_consensus_democracy: "Consensus Democracy"
 TAI_gc_consensus_democracy_desc: "Set up cross-party consultation in parliament."
 TAI_gc_steady_progress: "Progress Through Stability"
 TAI_gc_steady_progress_desc: "Stability and development go hand in hand."
 TAI_gc_grand_compromise: "Historic Grand Reconciliation"
 TAI_gc_grand_compromise_desc: "Blue and green, Taiwan and the mainland, left and right have found consensus under one roof."
 TAI_democratic_consolidation: "Democratic Consolidation"
 TAI_democratic_consolidation_desc: "Whichever party governs, the constitution and the electoral system have put down deep roots across all of China."
 TAI_peaceful_transfer: "A Peaceful Transfer of Power"
 TAI_peaceful_transfer_desc: "After the second national election, government and opposition hand over power peacefully. It is the mark of a mature democracy."
 TAI_education_reform: "Education Reform"
 TAI_education_reform_desc: "Abolish political indoctrination classes and restore general and civic education."
 TAI_press_freedom: "Freedom of the Press"
 TAI_press_freedom_desc: "Lift the ban on new newspapers and abolish press censorship."
 TAI_religious_freedom: "Religious Freedom"
 TAI_religious_freedom_desc: "Buddhist and Taoist temples, churches and mosques should all be free to open their doors."
 TAI_traditional_characters: "Traditional and Simplified Side by Side"
 TAI_traditional_characters_desc: "Bring back teaching of traditional characters, while simplified characters stay in common use."
 TAI_dismantle_firewall: "Tear Down the Great Firewall"
 TAI_dismantle_firewall_desc: "No more walls on the internet."
 TAI_civil_society_mainland: "Civil Society Revives"
 TAI_civil_society_mainland_desc: "Unions, chambers of commerce, religious groups and NGOs reappear on the mainland."
 TAI_cultural_renaissance: "Chinese Cultural Renaissance"
 TAI_cultural_renaissance_desc: "Restore the historic sites, temples and traditional festivals destroyed in the Cultural Revolution."
 TAI_abolish_hukou: "Abolish Household Registration"
 TAI_abolish_hukou_desc: "The two-tier urban-rural household registration system discriminates against farmers and must be abolished."
 TAI_national_identity: "Chinese National Identity"
 TAI_national_identity_desc: "Whether from Taiwan or the mainland, we are all citizens of the Republic of China."
 TAI_tibet_autonomy: "Tibetan Autonomy"
 TAI_tibet_autonomy_desc: "Based on Article 120 of the Constitution, ‘the self-government system of Tibet shall be guaranteed’, grant Tibet a high degree of autonomy."
 TAI_xinjiang_question: "The Xinjiang Question"
 TAI_xinjiang_question_desc: "Uyghurs, Kazakhs and Han live together in this land. The new government will close the re-education camps and introduce local self-government."
 TAI_inner_mongolia_leagues: "Inner Mongolian Leagues and Banners"
 TAI_inner_mongolia_leagues_desc: "Restore Mongol self-government by leagues and banners, and re-establish Chahar, Suiyuan and Rehe."
 TAI_hk_macau_return: "Hong Kong and Macau Return"
 TAI_hk_macau_return_desc: "Hong Kong and Macau belonged to the People's Republic of China under ‘one country, two systems’, but that one country is gone. Invite them to return to the Republic of China, with their high autonomy guaranteed."
 TAI_five_races_republic: "Five Races Under One Union"
 TAI_five_races_republic_desc: "Han, Manchu, Mongol, Hui and Tibetan: five races under one union. The Republic of China belongs to all its peoples."
 TAI_economic_reconstruction: "Economic Reconstruction"
 TAI_economic_reconstruction_desc: "Taiwan's capital and experience, combined with the mainland's scale and potential. The new government's first task is to restore economic order."
 TAI_cross_strait_integration: "Cross-Strait Economic Integration"
 TAI_cross_strait_integration_desc: "This will be the greatest economic integration of the twenty-first century."
 TAI_new_fabi: "Currency Reform"
 TAI_new_fabi_desc: "The New Taiwan dollar and the renminbi circulating side by side cause confusion. Set up a new central bank to issue a single national currency at a fixed rate."
 TAI_land_to_the_tiller: "Land to the Tiller"
 TAI_land_to_the_tiller_desc: "Taiwan's land reform was the starting point of its postwar economic miracle. With titles registered to each household and rents cut, hundreds of millions of farmers will own their own land."
 TAI_taishang_return: "Taiwanese Business Comes Home"
 TAI_taishang_return_desc: "Taiwanese businessmen who have worked on the mainland for years are now the backbone of rebuilding the homeland."
 TAI_soe_question: "The Future of the State Enterprises"
 TAI_soe_question_desc: "Over a hundred thousand state enterprises support hundreds of millions of people, and drag down the whole economy."
 TAI_soe_privatization: "Privatize the State Enterprises"
 TAI_soe_privatization_desc: "Auctions, stock listings and strategic investors."
 TAI_regulate_capital: "Regulate Capital"
 TAI_regulate_capital_desc: "‘No private interest may control the livelihood of the people.’ Key industries remain in state hands."
 TAI_sell_state_banks: "Privatize the State Banks"
 TAI_sell_state_banks_desc: "The four big state banks go public, breaking the financial monopoly."
 TAI_private_enterprise_law: "Private Enterprise Protection Act"
 TAI_private_enterprise_law_desc: "Protect private property and fair competition; the private economy is the mainstay of the national economy."
 TAI_strategic_state_industry: "State Ownership of Strategic Industries"
 TAI_strategic_state_industry_desc: "Steel, energy, telecoms and the defense industry stay state-owned."
 TAI_yangtze_tech_corridor: "Yangtze Delta–Hsinchu Tech Corridor"
 TAI_yangtze_tech_corridor_desc: "Link Hsinchu's wafer fabs with the electronics supply chains of Shanghai and Suzhou into a world-class technology corridor."
 TAI_pearl_river_manufacturing: "Pearl River Delta Manufacturing"
 TAI_pearl_river_manufacturing_desc: "Half the world's electronics are assembled here."
 TAI_bohai_industry: "Bohai Rim Industrial Belt"
 TAI_bohai_industry_desc: "The heavy industrial base of Beijing, Tianjin, Hebei and the Liaodong Peninsula."
 TAI_world_factory: "Factory of the World"
 TAI_world_factory_desc: "A unified China is the largest manufacturing nation on earth."
 TAI_national_tech_program: "National Science and Technology Program"
 TAI_national_tech_program_desc: "Bring together universities and research institutes from both sides of the Strait and invest heavily in basic science."
 TAI_space_program: "ROC Space Program"
 TAI_space_program_desc: "Take over the Jiuquan and Xichang launch centers, and merge the National Space Organization with the aerospace corporation."
 TAI_digital_china: "Digital China"
 TAI_digital_china_desc: "The cloud, artificial intelligence and 5G networks."
 TAI_moon_mission: "Moon Program"
 TAI_moon_mission_desc: "Plant the Blue Sky, White Sun and Wholly Red Earth flag on the Moon."
 TAI_central_bank_unification: "Unify the Central Banks"
 TAI_central_bank_unification_desc: "Merge the Central Bank with the People's Bank."
 TAI_capital_market_merger: "Merge the Stock Markets"
 TAI_capital_market_merger_desc: "The Taipei, Shanghai and Shenzhen stock exchanges are merged into a single market."
 TAI_tax_reform: "Unified Tax System"
 TAI_tax_reform_desc: "Unify the tax systems of both sides of the Strait, simplifying taxes and broadening the base."
 TAI_foreign_investment: "Attract Foreign Investment"
 TAI_foreign_investment_desc: "A unified, democratic China under the rule of law is the best market in the eyes of foreign investors."
 TAI_local_debt_cleanup: "Clean Up Local Debt"
 TAI_local_debt_cleanup_desc: "The colossal debts of local government financing vehicles must be settled."
 TAI_strong_currency: "Strong National Currency"
 TAI_strong_currency_desc: "The national currency becomes one of Asia's most important reserve currencies."
 TAI_industrial_plan: "The International Development of China"
 TAI_industrial_plan_desc: "The hundred thousand miles of railway, three great ports and taming of the Yangtze that Sun Yat-sen envisioned in The International Development of China can finally be carried out a century later."
 TAI_national_rail_network: "National Rail Network"
 TAI_national_rail_network_desc: "A high-speed grid of four north-south and four east-west lines spans the nation."
 TAI_great_eastern_port: "The Great Eastern Port"
 TAI_great_eastern_port_desc: "Shanghai, Ningbo, Guangzhou and Tianjin: a world-class cluster of ports."
 TAI_three_gorges: "The Three Gorges and the Yangtze"
 TAI_three_gorges_desc: "Improve the Yangtze shipping channel and complete the Three Gorges water project."
 TAI_south_north_water: "South-North Water Transfer"
 TAI_south_north_water_desc: "Bring the waters of the Yangtze to the North China Plain."
 TAI_national_ten_constructions: "Ten Major National Construction Projects"
 TAI_national_ten_constructions_desc: "The Ten Major Construction Projects once made Taiwan take off. Now they will be scaled up to all of China."
 TAI_develop_northwest: "Develop the Great Northwest"
 TAI_develop_northwest_desc: "Build a northwestern railway system and develop the Hexi Corridor and Xinjiang."
 TAI_revitalize_northeast: "Revitalize the Northeast"
 TAI_revitalize_northeast_desc: "The rebirth of the old industrial base."
 TAI_west_east_gas: "West-East Gas Pipeline"
 TAI_west_east_gas_desc: "Gas from the Tarim Basin flows to the Yangtze Delta."
 TAI_nuclear_power_expansion: "Nuclear Power Expansion"
 TAI_nuclear_power_expansion_desc: "A chain of coastal nuclear plants powers the factory of the world."
 TAI_rural_revival: "Rural Revival"
 TAI_rural_revival_desc: "Modeled on the old Joint Commission on Rural Reconstruction, set up a new commission for rural revival."
 TAI_farmers_associations: "Farmers' Associations"
 TAI_farmers_associations_desc: "Spread Taiwan's system of farmers' associations nationwide: marketing, credit and extension services in one."
 TAI_labor_standards: "Labor Standards Act"
 TAI_labor_standards_desc: "The eight-hour day, a basic wage and workplace safety protect the rights of hundreds of millions of workers."
 TAI_irrigation: "Water Conservancy"
 TAI_irrigation_desc: "Repair the nation's irrigation canals and reservoirs."
 TAI_mechanized_farming: "Farm Mechanization"
 TAI_mechanized_farming_desc: "Replace manual labor with machinery, freeing up rural workers."
 TAI_labor_insurance: "Labor Insurance"
 TAI_labor_insurance_desc: "All workers are covered by labor insurance, with benefits for workplace injury, old age and unemployment."
 TAI_food_security: "Food Security"
 TAI_food_security_desc: "The rice bowl of 1.3 billion people must be held in our own hands."
 TAI_national_health_insurance: "National Health Insurance"
 TAI_national_health_insurance_desc: "Extend Taiwan's National Health Insurance to all of China, so everyone can afford a doctor."
 TAI_new_urbanization: "New Urbanization"
 TAI_new_urbanization_desc: "Hundreds of millions of farmers are moving to the cities, which must prepare housing, schools and jobs for them."
 TAI_public_housing: "National Housing"
 TAI_public_housing_desc: "Build ten million national housing units so every family has a home."
 TAI_common_prosperity: "A Society of Shared Prosperity"
 TAI_common_prosperity_desc: "The ideal of the Principle of Livelihood: equalize land rights and regulate capital, so that everyone prospers."
 TAI_national_reconstruction: "The Fundamentals of National Reconstruction"
 TAI_national_reconstruction_desc: "Psychological, material and social reconstruction: the Founding Father's plan for national reconstruction is at last fully realized in a unified China."
 TAI_national_army_reborn: "The National Army Reborn"
 TAI_national_army_reborn_desc: "Over two million PLA soldiers and two hundred thousand National Army troops will be merged into a new National Revolutionary Army."
 TAI_reorganize_pla: "Reorganize the PLA"
 TAI_reorganize_pla_desc: "Keep the units, screen the officers and change the designations, reorganizing the PLA into the National Army."
 TAI_defense_ministry_reform: "Reorganize the Ministry of Defense"
 TAI_defense_ministry_reform_desc: "Merge the Central Military Commission into the Ministry of National Defense: an army of the nation, under civilian control."
 TAI_navy_unification: "Merge the Navies"
 TAI_navy_unification_desc: "The PLA Navy and the Republic of China Navy are merged, and the fleet leaps into the world's top three."
 TAI_air_force_unification: "Merge the Air Forces"
 TAI_air_force_unification_desc: "The air forces of both sides are merged under a single command and training system."
 TAI_screen_officers: "Screen the Officers"
 TAI_screen_officers_desc: "Those loyal to the constitution stay; those who refuse are discharged."
 TAI_redesignate_units: "Redesignate the Units"
 TAI_redesignate_units_desc: "Group armies become corps again, restoring the National Army's honored unit names."
 TAI_whampoa_reopened: "Rebuild the Whampoa Academy"
 TAI_whampoa_reopened_desc: "The Military Academy returns to Changzhou Island in Guangzhou. A century of Whampoa begins a new chapter."
 TAI_theater_commands: "Five Theater Commands"
 TAI_theater_commands_desc: "Replace the old military regions with five theater commands: Eastern, Southern, Western, Northern and Central."
 TAI_professional_army: "Professional Army"
 TAI_professional_army_desc: "Shift from conscription to mainly volunteer service and build an elite professional army."
 TAI_military_academies: "Military Academy System"
 TAI_military_academies_desc: "A national network of army, naval and air force academies, the National Defense University and the branch schools."
 TAI_armored_corps: "Armored Corps"
 TAI_armored_corps_desc: "Form armored corps around a new domestic main battle tank."
 TAI_mechanized_infantry: "Mechanized Infantry"
 TAI_mechanized_infantry_desc: "Every infantry division is mechanized or motorized."
 TAI_artillery_corps: "Artillery and Rocket Artillery"
 TAI_artillery_corps_desc: "Long-range rocket artillery and self-propelled guns provide overwhelming firepower."
 TAI_army_aviation_mainland: "Army Aviation"
 TAI_army_aviation_mainland_desc: "Every corps gets an army aviation brigade."
 TAI_special_operations_command: "Special Operations Command"
 TAI_special_operations_command_desc: "Bring the special forces of both sides together under a single special operations command."
 TAI_demobilization: "Demobilization and Resettlement"
 TAI_demobilization_desc: "Cut surplus personnel and resettle the demobilized properly."
 TAI_combined_arms: "Combined Arms Warfare"
 TAI_combined_arms_desc: "Combined arms battalions and brigades: the basic units of modern land warfare."
 TAI_strategic_rocket_force: "Take Over the Strategic Rocket Force"
 TAI_strategic_rocket_force_desc: "The former Rocket Force's missile sites and command system must be firmly in the central government's hands."
 TAI_nuclear_question: "The Nuclear Question"
 TAI_nuclear_question_desc: "The Republic of China has never had nuclear weapons, until today. What should be done with the hundreds of warheads we have taken over?"
 TAI_keep_deterrent: "Keep the Nuclear Deterrent"
 TAI_keep_deterrent_desc: "Nuclear weapons are the final guarantee of a unified China's security."
 TAI_denuclearize: "Nuclear-Free Declaration"
 TAI_denuclearize_desc: "The Republic of China announces it will destroy all its nuclear weapons, becoming the first great power in the world to give them up of its own accord."
 TAI_cyber_space_force: "Cyberspace Force"
 TAI_cyber_space_force_desc: "Cyberspace is the fifth battlefield."
 TAI_aerospace_force: "Aerospace Force"
 TAI_aerospace_force_desc: "Satellites, anti-satellite weapons and space reconnaissance."
 TAI_fleet_reorganization: "Reorganize the Fleets"
 TAI_fleet_reorganization_desc: "The North Sea, East Sea and South Sea Fleets, plus the Taiwan fleet, are reorganized into four fleets."
 TAI_naval_shipyards: "Jiangnan Shipbuilding"
 TAI_naval_shipyards_desc: "The Jiangnan and Dalian shipyards are the foundation of naval expansion."
 TAI_blue_water_navy: "Blue-Water Navy"
 TAI_blue_water_navy_desc: "At last the Republic of China Navy can head for the deep blue."
 TAI_submarine_force: "Submarine Force"
 TAI_submarine_force_desc: "Nuclear attack submarines and ballistic missile submarines."
 TAI_carrier_program: "Carrier Program"
 TAI_carrier_program_desc: "The Liaoning is only the beginning."
 TAI_destroyer_squadrons: "Destroyer Squadrons"
 TAI_destroyer_squadrons_desc: "A new generation of air defense destroyers enters service in numbers."
 TAI_marine_corps_mainland: "Expand the Marine Corps"
 TAI_marine_corps_mainland_desc: "Two marine divisions grow to six, capable of deploying anywhere in the world."
 TAI_carrier_strike_group: "Carrier Strike Groups"
 TAI_carrier_strike_group_desc: "Blue-water battle groups built around carriers patrol the three great oceans."
 TAI_air_academy: "Air Force Academy"
 TAI_air_academy_desc: "The Air Force Academy at Gangshan merges with the Changchun Flight College."
 TAI_stealth_fighters: "Stealth Fighters"
 TAI_stealth_fighters_desc: "Fifth-generation stealth fighters enter mass production."
 TAI_air_defense_network: "National Air Defense Network"
 TAI_air_defense_network_desc: "A nationwide network of radars and air defense missiles."
 TAI_strategic_bombers: "Strategic Bombers"
 TAI_strategic_bombers_desc: "Long-range strategic bombers with intercontinental strike capability."
 TAI_air_superiority_mainland: "Air Supremacy"
 TAI_air_superiority_mainland_desc: "The skies over East Asia belong to the Republic of China Air Force."
 TAI_uav_program: "Drone Force"
 TAI_uav_program_desc: "Reconnaissance-strike drones and drone swarms."
 TAI_defense_industry_mainland: "Consolidate the Defense Industry"
 TAI_defense_industry_mainland_desc: "The aviation, ordnance and shipbuilding groups are reorganized into a national defense industry group."
 TAI_world_class_military: "World-Class National Army"
 TAI_world_class_military_desc: "A modern, professional National Revolutionary Army that belongs to the nation."
 TAI_new_china_diplomacy: "New China Diplomacy"
 TAI_new_china_diplomacy_desc: "How will a unified Republic of China get along with the world?"
 TAI_rejoin_united_nations: "Return to the United Nations"
 TAI_rejoin_united_nations_desc: "In 1971, the Republic of China left the United Nations. Now only one government represents all of China."
 TAI_great_power_diplomacy: "Great Power Diplomacy"
 TAI_great_power_diplomacy_desc: "A unified, democratic China will be a pole of real weight in the international order."
 TAI_inherent_territory: "The Existing National Territory"
 TAI_inherent_territory_desc: "Article 4 of the Constitution of the Republic of China: ‘The territory of the Republic of China according to its existing national boundaries shall not be altered except by resolution of the National Assembly.’"
 TAI_security_council_power: "Great Power Responsibility on the Security Council"
 TAI_security_council_power_desc: "As a permanent member, the Republic of China will take on greater responsibility in world affairs."
 TAI_global_recognition: "Universal Diplomatic Relations"
 TAI_global_recognition_desc: "Establish full diplomatic relations with every country in the world."
 TAI_un_peacekeeping: "Peacekeepers"
 TAI_un_peacekeeping_desc: "Send peacekeeping forces around the world."
 TAI_reward_old_allies: "Repay Our Old Allies"
 TAI_reward_old_allies_desc: "The allies who stood by the Republic of China in its hardest times deserve our gratitude."
 TAI_trade_superpower: "Trading Power"
 TAI_trade_superpower_desc: "A unified China is the largest trading nation in the world."
 TAI_shape_world_order: "Shaper of the International Order"
 TAI_shape_world_order_desc: "From taking the rules to making them."
 TAI_america_policy: "America Policy"
 TAI_america_policy_desc: "America is the Republic of China's oldest ally, and may become a unified China's greatest competitor."
 TAI_russia_policy: "Russia Policy"
 TAI_russia_policy_desc: "Our northern neighbor is an energy partner, and also holds our historic territory."
 TAI_japan_policy: "Japan Policy"
 TAI_japan_policy_desc: "The scars of history and present-day interests are tangled together."
 TAI_sino_american_alliance: "Sino-American Alliance"
 TAI_sino_american_alliance_desc: "Two great democracies join hands to keep the peace in the Pacific."
 TAI_independent_diplomacy: "Independent Foreign Policy"
 TAI_independent_diplomacy_desc: "Chinese affairs are for the Chinese to decide."
 TAI_sino_russian_friendship: "Sino-Russian Good Neighbors"
 TAI_sino_russian_friendship_desc: "Set the disputes aside and develop Siberia's energy together."
 TAI_outer_manchuria_question: "The Outer Manchuria Question"
 TAI_outer_manchuria_question_desc: "The Republic of China has never recognized the loss of the 1.5 million square kilometers taken by the Treaty of Aigun and the Convention of Peking."
 TAI_sino_japanese_reconciliation: "Sino-Japanese Reconciliation"
 TAI_sino_japanese_reconciliation_desc: "Following the example of Germany and France, China and Japan move toward historical reconciliation."
 TAI_defend_diaoyutai: "Defend the Diaoyutai"
 TAI_defend_diaoyutai_desc: "The Diaoyutai Islands are part of Toucheng Township, Yilan County, Republic of China."
 TAI_pacific_security_pact: "Pacific Security Treaty"
 TAI_pacific_security_pact_desc: "China, America, Japan, South Korea and Australia keep the peace in the Western Pacific together."
 TAI_lead_asia: "Leader of Asia"
 TAI_lead_asia_desc: "Asian affairs should be led by Asians."
 TAI_siberian_energy: "Siberian Energy Cooperation"
 TAI_siberian_energy_desc: "The Sino-Russian oil and gas pipelines are open along their whole length."
 TAI_reclaim_outer_manchuria: "Recover Outer Manchuria"
 TAI_reclaim_outer_manchuria_desc: "The blood debt of the Sixty-Four Villages East of the River, the old name of Vladivostok: it is time to take them back."
 TAI_east_asian_community: "East Asian Community"
 TAI_east_asian_community_desc: "A China-Japan-Korea free trade area and an East Asian Community."
 TAI_korean_peninsula: "The Sino-North Korean Treaty"
 TAI_korean_peninsula_desc: "The Sino-North Korean Treaty of Friendship, Cooperation and Mutual Assistance signed by Beijing and Pyongyang in 1961 is a diplomatic legacy of the CCP. Pyongyang has long taken Chinese economic aid for granted.\nThe government of the Republic of China must decide: compromise with Pyongyang, break with Pyongyang, or stand with Seoul."
 TAI_nko_compromise: "Compromise with Pyongyang"
 TAI_nko_compromise_desc: "‘If the lips are gone, the teeth will feel the cold’ holds for the Republic of China too. A stable northern neighbor is better than a collapsing source of refugees."
 TAI_nko_break: "Break with Pyongyang"
 TAI_nko_break_desc: "The Kim regime was the CCP's ally, not the Republic of China's. What Beijing could do, Nanjing can do too, only in the opposite direction."
 TAI_rok_alliance: "Sino-Korean Alliance"
 TAI_rok_alliance_desc: "The Republic of Korea is an old friend of the Republic of China. Two democracies will work together to end the division of the peninsula."
 TAI_new_sino_korean_treaty: "A New Sino-North Korean Treaty"
 TAI_new_sino_korean_treaty_desc: "Replace the military alliance with non-aggression, and free aid with normal trade."
 TAI_yalu_economic_belt: "Yalu River Economic Belt"
 TAI_yalu_economic_belt_desc: "Trade between Dandong and Sinuiju has turned from smuggling into business."
 TAI_nko_reform_opening: "Promote Reform and Opening in North Korea"
 TAI_nko_reform_opening_desc: "Guide Pyongyang onto the path of reform with the Republic of China's own experience: land reform, export processing zones and gradual political opening."
 TAI_korea_peace_regime: "A Peace Regime for the Peninsula"
 TAI_korea_peace_regime_desc: "Replace the 1953 armistice with a peace treaty. Nanjing, Seoul, Pyongyang, Washington and Tokyo will jointly guarantee peace on the peninsula."
 TAI_nko_infiltration: "Infiltrate the Korean People's Army"
 TAI_nko_infiltration_desc: "Not every general in the Korean People's Army is devoted to the Kim family."
 TAI_nko_defector_network: "Defector Network"
 TAI_nko_defector_network_desc: "Tens of thousands of defectors cross the border through the Northeast. They are the best source of intelligence, and the backbone of a future government."
 TAI_nko_pro_china_faction: "Back a Pro-China Faction"
 TAI_nko_pro_china_faction_desc: "Kim Jong-nam has lived in Macau for years and still has supporters in Pyongyang. He would be an easier leader to deal with than his brother."
 TAI_pyongyang_coup: "Coup in Pyongyang"
 TAI_pyongyang_coup_desc: "The time has come. Troops loyal to us will surround the Kumsusan Palace of the Sun, proclaim a new government and ask the Republic of China for protection."
 TAI_nko_reconstruction: "Rebuild North Korea"
 TAI_nko_reconstruction_desc: "Food, power and roads: whatever the new government needs, the Republic of China can provide."
 TAI_rok_joint_command: "Sino-Korean Combined Command"
 TAI_rok_joint_command_desc: "The two general staffs work side by side, commanding all allied forces on the peninsula."
 TAI_rok_intel_sharing: "Sino-Korean Intelligence Sharing"
 TAI_rok_intel_sharing_desc: "The National Army's mainland intelligence network is linked with the South Korean NIS's northern network."
 TAI_roc_forces_korea: "ROC Forces in Korea"
 TAI_roc_forces_korea_desc: "The National Army of the Republic of China is stationed in the Republic of Korea, guarding the 38th parallel alongside the ROK Armed Forces."
 TAI_korea_northern_campaign: "The Allies March North"
 TAI_korea_northern_campaign_desc: "The Sino-Korean allied forces cross the 38th parallel. This time, no one will push us back."
 TAI_korea_reunified: "Korea Is Unified"
 TAI_korea_reunified_desc: "Pyongyang has been liberated, and the Korean Peninsula is reunited under the flag of the Republic of Korea. The National Army of the Republic of China will remain to protect the newly unified Korea."
 TAI_asean_partnership: "China-ASEAN Partnership"
 TAI_asean_partnership_desc: "Build prosperity with the nations of Southeast Asia, ancestral home of so many overseas Chinese."
 TAI_europe_partnership: "Sino-European Partnership"
 TAI_europe_partnership_desc: "Cooperate with Europe across the board on trade, technology and climate."
 TAI_africa_development: "Aid to Africa"
 TAI_africa_development_desc: "Medical teams, farming teams and infrastructure: developing together with Africa."
 TAI_world_power: "World Power"
 TAI_world_power_desc: "The Republic of China: a unified, democratic and prosperous world power."
 TAI_outer_mongolia_question: "The Outer Mongolia Question"
 TAI_outer_mongolia_question_desc: "The Republic of China never truly recognized the 1946 referendum on Outer Mongolian independence. Offer Ulaanbaatar a peaceful plan for its return."
 TAI_south_china_sea_policy: "South China Sea Policy"
 TAI_south_china_sea_policy_desc: "The South China Sea islands have been Chinese since ancient times, and the garrison on Taiping Island has guarded them for more than half a century."
 TAI_southwest_borders: "The Southwest Borders"
 TAI_southwest_borders_desc: "South Tibet, the Kachin Triangle and the Pamirs: border problems left behind by British colonialism."
 TAI_reclaim_outer_mongolia: "Recover Outer Mongolia"
 TAI_reclaim_outer_mongolia_desc: "Our peaceful offer has been rejected. Force is the only answer left."
 TAI_tannu_uriankhai: "Tannu Uriankhai"
 TAI_tannu_uriankhai_desc: "Tannu Uriankhai, once under the Qing General of Uliastai, was annexed by the Soviet Union in 1944. We have not forgotten this land."
 TAI_eleven_dash_line: "The Eleven-Dash Line"
 TAI_eleven_dash_line_desc: "The eleven-dash line drawn by the Republic of China in 1947 is the basis of our claims in the South China Sea."
 TAI_south_tibet: "The South Tibet Question"
 TAI_south_tibet_desc: "No Chinese government has ever recognized the McMahon Line."
 TAI_kachin_and_pamir: "The Kachin Triangle and the Pamirs"
 TAI_kachin_and_pamir_desc: "The Kachin Triangle on the undefined Yunnan-Burma border, and the Pamir Plateau carved up by Britain and Russia at the end of the Qing."
 TAI_begonia_leaf: "The Begonia Leaf"
 TAI_begonia_leaf_desc: "From the Pamirs to the Ussuri, from the northern steppe to the Spratlys: the map shaped like a begonia leaf has been the motherland in the hearts of generations of Chinese."
