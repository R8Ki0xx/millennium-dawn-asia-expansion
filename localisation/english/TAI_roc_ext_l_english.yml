l_english:
 TAI_x_g1:0 "A Permanent Electoral Commission"
 TAI_x_g1_desc:0 "After the first national election the stop-gap election bodies become a statutory commission with its own budget: voter registration, districting and the counting of ballots now have fixed people and fixed procedures."
 TAI_x_g2a:0 "Political Donations and Open Campaign Finance"
 TAI_x_g2a_desc:0 "Donations by firms and individuals to parties and candidates are capped and published line by line online. The first big donor exposed turns out to be an old friend."
 TAI_x_g2b:0 "Asset Declarations for Public Officials"
 TAI_x_g2b_desc:0 "Ministers, judges and legislators declare their assets every year, to be checked by an independent body. On the day the first forms were published no newsroom went home."
 TAI_x_g2c:0 "Party Subsidies and Internal Democracy"
 TAI_x_g2c_desc:0 "Parties receive public funds in proportion to their vote, on condition that candidates are chosen by member ballot. Several old parties discover that even the chairmanship now depends on a vote."
 TAI_x_g3a:0 "An Independent Districting Commission"
 TAI_x_g3a_desc:0 "Districts are no longer drawn by the ruling party but by a commission of scholars, judges and citizens, openly, according to population and geography."
 TAI_x_g3b:0 "The Integrity Agency"
 TAI_x_g3b_desc:0 "An anti-corruption body that answers directly to parliament and can investigate and prosecute. In its first three years it handles more cases than the previous thirty years put together."
 TAI_x_g3c:0 "Youth Participation and Student Parliaments"
 TAI_x_g3c_desc:0 "The voting age drops to eighteen, universities set up student parliaments, and young people may take paid leave to run for office. The first legislators in their twenties lower the chamber’s average age by ten years at a stroke."
 TAI_x_g4:0 "The Electoral Court and Open Counting"
 TAI_x_g4_desc:0 "Disputes over election results are settled by a dedicated court within thirty days, and ballot images and tally sheets are published. For the first time a losing candidate says in a concession speech: “I trust this result.”"
 TAI_x_g5a:0 "The Cabinet May Dissolve Parliament"
 TAI_x_g5a_desc:0 "When the cabinet loses parliament’s confidence it may ask for dissolution and a fresh election, giving deadlocks an exit that leads back to the voters. As soon as this is done the parties demand a new general election."
 TAI_x_g5b:0 "Fixed Terms and Constitutional Guarantees"
 TAI_x_g5b_desc:0 "The terms of parliament and government are written into the constitution and cannot be shortened short of an amendment. The rhythm of politics is set by the calendar rather than by the negotiating table."
 TAI_x_g6:0 "A Comprehensive Revision of Local Autonomy"
 TAI_x_g6_desc:0 "The powers and revenue sources of provinces, cities and counties are redrawn. For the first time mayors face the capital not as petitioners but as negotiators."
 TAI_x_g7:0 "A Regular National Affairs Conference"
 TAI_x_g7_desc:0 "A conference held every two years brings together the parties, provinces, unions, firms and civic groups, becoming a second channel between one election and the next."
 TAI_x_s1:0 "Census and Statistical Modernization"
 TAI_x_s1_desc:0 "A country’s problems must first be measurable. The statistics bureau resamples and redefines unemployment and poverty; the numbers look worse, but policy finally has something to stand on."
 TAI_x_s2a:0 "Farewell to Birth Limits"
 TAI_x_s2a_desc:0 "Birth restrictions that lasted for decades are formally abolished. Many children who had never been written into the household registers are finally recorded."
 TAI_x_s2b:0 "Universal Long-Term Care"
 TAI_x_s2b_desc:0 "Care for the disabled and the very old joins public insurance, shared among communities, hospitals and families. Many people no longer have to choose between work and caring for their parents."
 TAI_x_s2c:0 "Rental Market Reform and Housing Allowances"
 TAI_x_s2c_desc:0 "Leases follow a standard contract, landlords cannot raise rents at will, and low-income households receive rent support. Shared beds in the cities begin to get cheaper for the first time."
 TAI_x_s3a:0 "Birth Allowances and Public Childcare"
 TAI_x_s3a_desc:0 "Every newborn comes with an allowance and community nurseries charge by income. In young couples’ ledgers a child is no longer the biggest deficit."
 TAI_x_s3b:0 "The Silver Economy and Flexible Retirement"
 TAI_x_s3b_desc:0 "Retirement becomes flexible: those who keep working earn more and those who need rest may leave early. The elderly become a consumer market worth taking seriously."
 TAI_x_s3c:0 "The Youth First-Home Program"
 TAI_x_s3c_desc:0 "Low-interest loans and shared equity let first-time buyers under thirty buy a home with half the usual down payment. A new crop of tower cranes goes up on the building sites."
 TAI_x_s4:0 "A Family-Friendly Society"
 TAI_x_s4_desc:0 "Childcare, long-term care, housing and retirement dovetail, so that a family has institutions to lean on from a child’s birth to a grandparent’s last years."
 TAI_x_s5a:0 "The Food and Drug Safety Agency"
 TAI_x_s5a_desc:0 "One independent agency handles approval, sampling and recalls of food and drugs, with fines tied to company turnover. A few big brands read the inspection reports all the way through for the first time."
 TAI_x_s5b:0 "Tax Relief for the Middle Class"
 TAI_x_s5b_desc:0 "Costs of dependants, education and medical care become deductible and the progressive brackets are redrawn. The middle class feels, for the first time, that the state is on its side."
 TAI_x_s6:0 "Disaster Prevention and Emergency Management"
 TAI_x_s6_desc:0 "Disaster prevention, weather services and local fire brigades merge into one emergency system, and every community has shelters and drill days. When the next typhoon comes, people know where to go."
 TAI_x_s7:0 "Lifelong Learning for All"
 TAI_x_s7_desc:0 "Every citizen has a lifelong learning account to pay for further study, retraining and a second specialty. A forty-year-old worker going back to a classroom is no longer news."
 TAI_x_m1:0 "The Two Defense Acts and Civilian Control"
 TAI_x_m1_desc:0 "The National Defense Organization Act and the Ministry Act spell it out: the minister is a civilian, command and administration are separated, and the army answers to parliament rather than to any individual."
 TAI_x_m2a:0 "Reform of the Service System"
 TAI_x_m2a_desc:0 "Terms, categories and pay are reviewed from top to bottom, and the rules of recruitment are no longer a bare order but a system that consults citizens."
 TAI_x_m2b:0 "Military Prosecution and Military Law Reform"
 TAI_x_m2b_desc:0 "Trials of soldiers for ordinary crimes move to the civilian courts and military prosecutors handle only wartime and purely military cases. Barracks finally have a complaints box."
 TAI_x_m2c:0 "The Ministry of Veterans Affairs"
 TAI_x_m2c_desc:0 "Medical care, jobs, housing and pensions for veterans are handled by one ministry. Old soldiers no longer queue from window to window."
 TAI_x_m3a:0 "A Volunteer-Based Force"
 TAI_x_m3a_desc:0 "The core is voluntary service, backed by short compulsory terms and a solid reserve. The army gets smaller, but everyone knows why they are standing there."
 TAI_x_m3b:0 "Independent Military Justice"
 TAI_x_m3b_desc:0 "Military judges are appointed through the judicial system for life and free of commanders’ interference. Several old cases are reopened, and the generals’ faces are mixed."
 TAI_x_m3c:0 "Veterans’ Hospitals and Re-Employment"
 TAI_x_m3c_desc:0 "Veterans’ hospitals are upgraded, and ex-soldiers get priority in vocational training and bonus points in the civil service exam. Leaving the army no longer means starting over."
 TAI_x_m4:0 "Transparent Defense Budgets"
 TAI_x_m4_desc:0 "The defense budget is reported to parliament item by item each year, and the classified portion is reviewed by a subcommittee. The customs of procurement must, for the first time, be explained."
 TAI_x_m5a:0 "The National Defense Academy of Sciences"
 TAI_x_m5a_desc:0 "R&D scattered across the services and institutes is merged into one defense academy that is open to the outside to a limited degree. Researchers no longer need to hold nominal posts in three units."
 TAI_x_m5b:0 "The National Intelligence Integration Center"
 TAI_x_m5b_desc:0 "The files of the separate intelligence services flow into one center under the supervision of a parliamentary intelligence committee. The old habit of hoarding information from one another is finally broken."
 TAI_x_m6:0 "A Whole-of-Society Mobilization System"
 TAI_x_m6_desc:0 "Mobilization is no longer only the military’s business: transport, medical care, communications and private firms rehearse by plan, and a national joint exercise is held every year."
 TAI_x_m7:0 "The Joint Operations Command"
 TAI_x_m7_desc:0 "Land, sea and air forces together with logistics, intelligence and cyber units join a single command structure, with one joint commander directing them in wartime. Barriers between the services give way to a common operations map."
 TAI_x_c1:0 "Rebuilding the Academia Sinica"
 TAI_x_c1_desc:0 "The Academia Sinica now works in Nanjing and Taipei at once, and the first academicians’ assembly is held jointly by scholars from both sides. Basic research finally has a place worthy of the name “national team”."
 TAI_x_c2a:0 "A Network of National Laboratories"
 TAI_x_c2a_desc:0 "Large instruments scattered across universities and institutes are merged into a network open to the whole country; the booking system is full in its first week."
 TAI_x_c2b:0 "The Basic Science Fund"
 TAI_x_c2b_desc:0 "A long-term fund that asks about curiosity rather than results. A third of the applications it supports in the first year are on topics the reviewers cannot follow."
 TAI_x_c2c:0 "Industry-Academia Research Parks"
 TAI_x_c2c_desc:0 "Universities, institutes and companies share parks, with standard contracts for patent ownership and revenue sharing. Professors start attending meetings with articles of incorporation in hand."
 TAI_x_c3a:0 "Quantum Science and New Materials"
 TAI_x_c3a_desc:0 "Quantum communication, superconductors and graphene join the national priorities; the laboratory walls carry timetables, not slogans."
 TAI_x_c3b:0 "The National AI Strategy"
 TAI_x_c3b_desc:0 "Research on language, vision and decision systems is served by a national computing platform. The ethics committee argues for three hours at its first meeting."
 TAI_x_c3c:0 "The Biotech and Pharmaceutical Corridor"
 TAI_x_c3c_desc:0 "A biotech and pharmaceutical corridor takes shape from Nanjing to Hsinchu: vaccines, genetic testing and precision medicine each get their own testing ground."
 TAI_x_c4:0 "An Innovation Nation"
 TAI_x_c4_desc:0 "For the first time R&D exceeds three percent of national income, and the number of patents is no longer counted as an achievement but examined as a cost."
 TAI_x_c5:0 "World-Class Research Universities"
 TAI_x_c5_desc:0 "Ten universities receive long-term dedicated funding and academic autonomy, and hiring and promotion are decided by peer review rather than administrators. A few familiar names finally appear on the international rankings."
 TAI_x_u1:0 "The Ministry of Culture and the Basic Culture Act"
 TAI_x_u1_desc:0 "Cultural affairs get a ministry and a basic law of their own: guaranteeing creative freedom as well as the diversity of heritage and languages."
 TAI_x_u2a:0 "Reviving Chinese-Language Film and Television"
 TAI_x_u2a_desc:0 "Co-productions between both shores become the norm and censorship gives way to a rating system. For the first time a Chinese-language film sells tickets around the world without subsidies."
 TAI_x_u2b:0 "The Public Broadcasting Group"
 TAI_x_u2b_desc:0 "Public television and radio belong to no party or ministry, and directors are nominated jointly by all parties in parliament. The evening news carries, for the first time, a full segment criticizing the ruling party."
 TAI_x_u3a:0 "Digital Preservation of Rare Books and Relics"
 TAI_x_u3a_desc:0 "The collections of both Palace Museums, gazetteers and archives are digitized and opened to the world free of charge. A Japanese scholar reads online a manuscript she has been looking for over twenty years."
 TAI_x_u3b:0 "Literature and Publishing Grants"
 TAI_x_u3b_desc:0 "Grants that ignore sales protect small bookshops and independent presses. Bookshops in the cities begin to keep their lights on until midnight."
 TAI_x_u4:0 "Cultural Diplomacy and the Sinophone World"
 TAI_x_u4_desc:0 "The Analects of Confucius and the novels of Jin Yong sit on shelves around the world. Chinese is no longer only a language but a community of imagination."
 TAI_x_d1:0 "Policy toward the Korean Peninsula"
 TAI_x_d1_desc:0 "The peninsula’s stability bears on the northeast’s security: policy is no longer only “boycott” or “neglect” but a layered mix of engagement, deterrence and cooperation."
 TAI_x_d2a:0 "Engagement and Food Aid with the North"
 TAI_x_d2a_desc:0 "Grain and medicine are traded for a quiet border and a channel for dialogue. Every package of aid is stamped with its destination and quantity."
 TAI_x_d2b:0 "The China–Korea Free Trade Agreement"
 TAI_x_d2b_desc:0 "Tariffs, investment rules and service-sector access are greatly eased. Cars from Seoul and electronics from Nanjing at last share a container."
 TAI_x_d3a:0 "A Denuclearization Initiative for the Peninsula"
 TAI_x_d3a_desc:0 "A staged, verifiable and mutually guaranteed path to denuclearization is proposed, with the UN and the countries concerned invited to take part. The negotiating table has, for the first time, one more chair."
 TAI_x_d3b:0 "Youth and Cultural Exchange"
 TAI_x_d3b_desc:0 "Mutual credit recognition, exchange students and jointly produced TV shows turn a generation into acquaintances. The most popular foreign-language electives shift from English to Korean and Chinese."
 TAI_x_d4:0 "A Northeast Asia Peace Mechanism"
 TAI_x_d4_desc:0 "China, Japan, Korea and other parties set up a standing security dialogue and crisis hotline, plus joint disaster and sea-rescue mechanisms. It never solves a big problem, but it keeps many small ones from growing."
 TAI_x_o1:0 "Partnership with Oceania"
 TAI_x_o1_desc:0 "Australia, New Zealand and the Pacific islands are the porch to the South Pacific. The foreign ministry sets up a department of its own for this direction for the first time."
 TAI_x_o2a:0 "Free Trade with Australia and New Zealand"
 TAI_x_o2a_desc:0 "Tariffs on minerals, farm goods and educational services are phased to zero. A five-year contract now binds Australian iron ore to the steelworks of Nanjing."
 TAI_x_o2b:0 "Pacific Submarine Cables and Fisheries Cooperation"
 TAI_x_o2b_desc:0 "New undersea cables link the islands and fisheries agreements introduce joint resource management and observers. Island fishermen get a cold chain of their own for the first time."
 TAI_x_o3:0 "The Pacific Islands Forum"
 TAI_x_o3_desc:0 "Formal participation in the Pacific Islands Forum dialogue makes the country a partner on regional climate, ocean and development issues. Among the island delegations there are now diplomats who speak Chinese."
 TAI_x_elec_commission:0 "Permanent Electoral Commission"
 TAI_x_elec_commission_desc:0 "Elections are run by an institution with a fixed budget, and the parties quarrel less about procedure."
 TAI_x_integrity_agency:0 "Integrity Agency"
 TAI_x_integrity_agency_desc:0 "Where anyone might be investigated, the rules are clear."
 TAI_x_clean_elections:0 "Open and Transparent Elections"
 TAI_x_clean_elections_desc:0 "Ballots and tallies are public, so even losers accept the result."
 TAI_x_dissolution:0 "Power of Dissolution"
 TAI_x_dissolution_desc:0 "A deadlock can go back to the voters, though governments are more often caught in the rhythm of campaigns."
 TAI_x_fixed_terms:0 "Fixed Terms"
 TAI_x_fixed_terms_desc:0 "Terms are guaranteed by the constitution and the rhythm of politics becomes predictable."
 TAI_x_consultative:0 "National Affairs Conference"
 TAI_x_consultative_desc:0 "Between elections there is one more channel at which all sides sit down and talk."
 TAI_x_pop_policy_shift:0 "A Shift in Population Policy"
 TAI_x_pop_policy_shift_desc:0 "Society begins to encourage births instead of limiting them."
 TAI_x_long_term_care:0 "Long-Term Care"
 TAI_x_long_term_care_desc:0 "The cost of care is shared by all of society, and takes up some civilian production."
 TAI_x_family_friendly:0 "A Family-Friendly Society"
 TAI_x_family_friendly_desc:0 "From birth to old age, people have institutions to rely on."
 TAI_x_disaster_ready:0 "A Disaster-Ready Society"
 TAI_x_disaster_ready_desc:0 "Reconstruction after disasters is faster, and people trust the government more."
 TAI_x_lifelong:0 "Lifelong Learning"
 TAI_x_lifelong_desc:0 "The workforce keeps renewing its skills and the pain of transition is milder."
 TAI_x_civ_control:0 "Civilian Control of the Military"
 TAI_x_civ_control_desc:0 "The army answers to parliament and a coup is no longer an option."
 TAI_x_volunteer_army:0 "A Volunteer-Based Army"
 TAI_x_volunteer_army_desc:0 "Soldiers train longer and are more professional, but fewer in number than before."
 TAI_x_def_budget:0 "A Transparent Defense Budget"
 TAI_x_def_budget_desc:0 "Procurement now has reasons, and waste is smaller."
 TAI_x_intel_center:0 "Integrated Intelligence"
 TAI_x_intel_center_desc:0 "The intelligence services no longer go their own ways."
 TAI_x_total_defense:0 "Whole-of-Society Defense"
 TAI_x_total_defense_desc:0 "Every part of society knows what to do in wartime."
 TAI_x_joint_command:0 "Joint Command"
 TAI_x_joint_command_desc:0 "All services share one operations map."
 TAI_x_academia:0 "The New Academia Sinica"
 TAI_x_academia_desc:0 "Basic research has a stable home."
 TAI_x_biotech:0 "The Biotech Corridor"
 TAI_x_biotech_desc:0 "Vaccines, genetic testing and precision medicine grow in one corridor."
 TAI_x_innovation_nation:0 "An Innovation Nation"
 TAI_x_innovation_nation_desc:0 "Innovation becomes the first driver of growth."
 TAI_x_film:0 "Chinese-Language Cinema"
 TAI_x_film_desc:0 "Films and series become part of soft power."
 TAI_x_soft_power:0 "The Sinophone World"
 TAI_x_soft_power_desc:0 "Culture makes others willing to listen first."
 TAI_x_ne_asia_peace:0 "Northeast Asia Peace Mechanism"
 TAI_x_ne_asia_peace_desc:0 "Standing dialogue cuts down on misjudgment."
