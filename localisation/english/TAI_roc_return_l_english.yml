 TAI_dbf_cure_hearts: "Comfort the People"
 TAI_dbf_cure_hearts_desc: "The Executive Yuan sends goodwill missions to every province, handing out relief payments and repairing schools and hospitals.\n\n§YHearts Not Yet Won§! currently at severity §R[?TAI_dbf_hearts_sev|0]§!/100, recovering §G[?TAI_dbf_hearts_rate|1]§! per month."
