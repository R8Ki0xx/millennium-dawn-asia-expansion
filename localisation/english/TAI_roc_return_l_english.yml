 roc_return.81.t: "中共暴动"
 roc_return.81.d: "东北与华北多地同时爆发武装暴动。中共残余势力宣布“中华人民共和国并未灭亡”，号召全国人民推翻国民政府。沈阳、长春与哈尔滨相继失守。"
 roc_return.81.a: "戡乱救国！"
 roc_return.82.t: "第三次国共内战爆发"
 roc_return.82.d: "中国东北爆发大规模武装暴动，中共残余势力宣布重建中华人民共和国政府。国民政府宣布全国进入戡乱时期。这场跨越了一个世纪的内战，第三次爆发了。"
 roc_return.82.a: "中国人的内战，仍未结束。"
 roc_return.83.t: "东北起义"
 roc_return.83.d: "在东北的工业城市与山区，成千上万的工人、下岗职工与前解放军官兵响应党中央的号召，拿起了武器。"
 roc_return.83.a: "革命尚未成功，同志仍须努力！"
 roc_return.85.t: "人民共和国的胜利"
 roc_return.85.d: "国民政府已经投降。天安门城楼上，五星红旗再次升起。\n\n国民党残部退往台湾。中华人民共和国，又回来了。"
 roc_return.85.a: "中国人民从此站起来了！"
 roc_return.86.t: "中华人民共和国重建"
 roc_return.86.d: "中国共产党在第三次国共内战中取得胜利，重建了中华人民共和国。国民政府再次退守台湾。"
 roc_return.86.a: "历史又转回了原点。"
 roc_return.87.t: "国府再次迁台"
 roc_return.87.d: "大陆又一次失守了。国民政府与国军残部撤回台湾。在台北，总统发表讲话：“我们还会回来的。”"
 roc_return.87.a: "反攻大陆，永不放弃。"
 roc_return.88.t: "戡乱成功"
 roc_return.88.d: "国军彻底击败了中共残余武装。东北与华北重新回到中华民国的控制之下。"
 roc_return.88.a: "中华民国万岁！"

