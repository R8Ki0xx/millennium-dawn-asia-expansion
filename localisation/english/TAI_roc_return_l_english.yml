 roc_return.111.b: "与在野党政治协商（让步通过）。"
 roc_return.111.c: "撤回议案。"
 roc_return.112.t: "议案：教育经费保障条例"
 roc_return.112.d: "宪法规定教育经费不得低于预算总额的百分之十五。大陆各省的学校急需重建。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
 roc_return.112.a: "依多数通过。"
 roc_return.112.b: "与在野党政治协商（让步通过）。"
 roc_return.112.c: "撤回议案。"
