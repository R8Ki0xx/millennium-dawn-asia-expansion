 TAI_gov.6.t: "Nominate the President of the Judicial Yuan"
 TAI_gov.6.d: "The current President of the Judicial Yuan is §Y[TAI_gov_judicial_name]§!. Under the constitution the President may nominate a successor, to be appointed with the consent of the Control Yuan or the Legislative Yuan. The President of the Judicial Yuan also chairs the Council of Grand Justices and oversees constitutional interpretation and judicial reform, so the choice affects public confidence in judicial independence."
 TAI_gov.6.keep: "Keep the current President of the Judicial Yuan."
