 roc_return.114.d: "临时条款冻结了宪法的诸多条文。废止它，意味着宪政全面恢复，但也会束缚政府对残余势力的手脚。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
