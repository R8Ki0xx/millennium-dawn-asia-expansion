 TAI_semiconductor_fund_idea: "National Semiconductor Fund"
 TAI_semiconductor_fund_idea_desc: "The national semiconductor fund makes long-term investments in fabs, equipment and materials. With patient capital it backs projects that take more than a decade to pay off, letting domestic equipment and materials makers grow step by step; China's chip industry is no longer at anyone's mercy."
 TAI_internet_economy_idea: "Internet Economy"
 TAI_internet_economy_idea_desc: "A freely competing internet industry becomes a new engine of growth. E-commerce, mobile payments and cloud services change everyone's life, and new startups spring up everywhere; the digital economy speeds up both construction and research."
 TAI_digital_fabi_idea: "Digital National Currency"
 TAI_digital_fabi_idea_desc: "The digital national currency makes taxes and payments more transparent and efficient. Electronic payment cuts tax evasion and the costs of handling cash, and the central bank can conduct monetary policy more precisely; meanwhile strict privacy protection lets people use it with confidence."
 TAI_financial_center_idea: "China Stock Exchange"
 TAI_financial_center_idea_desc: "The merged Shanghai and Taipei stock exchange is Asia's largest capital market. Companies raise money and investors trade shares here, and a thriving capital market brings the nation rich tax revenue and economic stability."
 TAI_energy_independence_idea: "Energy Independence"
 TAI_energy_independence_idea_desc: "Domestic nuclear power and diverse energy sources keep industry running. Nuclear, wind, solar and imported energy back each other up, so factories can keep producing even if oil prices soar or sea lanes are blocked; reliable power keeps industrial efficiency rising."
 TAI_rare_earth_idea: "Rare Earth Strategy"
 TAI_rare_earth_idea_desc: "Control the rare earths and you control the lifeblood of high technology. The consolidated industry manages mining with production caps and environmental standards, making output more stable; the rare earth magnets needed for electric cars, wind turbines and fighters can all be made at home."
 TAI_auto_industry_idea: "Automotive Industry"
 TAI_auto_industry_idea_desc: "The rise of private carmakers drives the whole manufacturing sector. Suppliers of steel, glass, electronics and batteries across the auto supply chain expand with them, and industrial zones are built faster; affordable domestic cars also make daily life easier."
 TAI_grain_security_idea: "Food Security"
 TAI_grain_security_idea_desc: "The national seed bank and high-yield rice mean 1.4 billion people need never go hungry. With ample grain reserves and its own breeding technology, China no longer fears swings in world grain prices or foreign embargoes; a well-fed people is the firmest foundation of national stability."
 TAI_economic_zones_idea: "Second-Generation Special Economic Zones"
 TAI_economic_zones_idea_desc: "The inland special economic zones repeat the coast's success. Industrial zones in Chengdu, Chongqing, Xi'an and Zhengzhou attract foreign investment and industries moving in from the coast, and inland cities are built as fast as coastal ones; trading partners see the potential of China's interior too."
 TAI_space_power_idea: "Space Power"
 TAI_space_power_idea_desc: "The Republic of China's space station orbits the Earth. Astronauts carry out scientific experiments in space, and satellites serve communications, navigation and weather forecasting; achievements in space drive cutting-edge research and fill the public with national pride."
 TAI_new_army_idea: "The New National Army"
 TAI_new_army_idea_desc: "The re-equipped National Army is one of the most powerful armies in Asia. Standardized domestic equipment, digital command systems and professional soldiers greatly improve the army's organization, attack and defense."
 TAI_two_ocean_navy_idea: "Two-Ocean Navy"
 TAI_two_ocean_navy_idea_desc: "The Republic of China Navy is active in both the Pacific and Indian Oceans. The blue-water fleet's reach extends to the Persian Gulf and the Horn of Africa, and both its firepower and the shipyards' capacity reach world-class levels."
 TAI_air_power_idea: "Theater Air Forces"
 TAI_air_power_idea_desc: "Each theater's air headquarters directs all the aviation in its area. Fighters, AWACS and drones work from the same operational picture, the efficiency of air superiority and ground support missions rises sharply, and pilots gain experience quickly mission after mission."
 TAI_tibet_autonomy_idea: "Tibetan Autonomy"
 TAI_tibet_autonomy_idea_desc: "The Dalai Lama has returned to Lhasa, and Tibet enjoys a high degree of autonomy under the Constitution of the Republic of China. Monasteries run their own affairs, Tibetan-language education is restored and Tibetan religion and culture are respected; Tibet is no longer a focus of international criticism of China."
 TAI_plateau_fund_idea: "Plateau Development Fund"
 TAI_plateau_fund_idea_desc: "A dedicated fund drives development on the Tibetan Plateau. Roads, railways and airports reach every corner of the plateau, and schools and hospitals are built in the herding areas; transport and infrastructure on the plateau are built much faster."
 TAI_xinjiang_harmony_idea: "Bilingual Education in Xinjiang"
 TAI_xinjiang_harmony_idea_desc: "With Uyghur and the national language given equal weight, Xinjiang's peoples live in harmony. Bilingual education lets Uyghur children keep their own language and culture while finding work in the national market; the barriers between peoples gradually melt away."
 TAI_greater_bay_idea: "Greater Bay Area"
 TAI_greater_bay_idea_desc: "Hong Kong, Macau and nine Guangdong cities form a world-class bay area economy. Hong Kong's finance, Shenzhen's technology and Guangzhou's manufacturing complement each other, and the area's economy rivals the Tokyo and New York bay areas, bringing in rich tax revenue."
 TAI_five_races_unity_idea: "Shared Prosperity of the Five Races"
 TAI_five_races_unity_idea_desc: "All peoples share prosperity under the Republic of China. The frontier economies have caught up with the interior, minority rights are guaranteed, and every people's identification with the nation is more united than ever; it is the fullest realization of the ideal of the Republic of Five Races."
 landmark_nanjing_presidential_palace: "Nanjing Presidential Palace"
 landmark_nanjing_presidential_palace_desc: "The Nanjing Presidential Palace was once the office of the Viceroy of Liangjiang and the palace of the Heavenly King of the Taiping. In 1912, Sun Yat-sen was sworn in here as Provisional President. It later housed the Nationalist Government and the Office of the President of the Republic of China."
 landmark_nanjing_presidential_palace_plural: "Nanjing Presidential Palace"
 landmark_nanjing_presidential_palace_prc: "Nanjing Presidential Palace"
 landmark_nanjing_presidential_palace_prc_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_prc_plural: "Nanjing Presidential Palace"
 landmark_nanjing_presidential_palace_gen: "Nanjing Presidential Palace"
 landmark_nanjing_presidential_palace_gen_desc: "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_gen_plural: "Nanjing Presidential Palace"
 roc_return.140.t: "The Flag Rises Again over the Presidential Palace"
 roc_return.140.d: "After more than fifty years, the Blue Sky, White Sun and Wholly Red Earth flag rises again over the gate of No. 292 Changjiang Road, Nanjing. After the honor guard's salute, the President of the Republic of China walks into the palace and, in the very hall where Sun Yat-sen took office as Provisional President, reads out a proclamation: ‘The Republic of China has returned.’"
 roc_return.140.a: "Give us back our land."
 roc_return.140.b: "A new page in Chinese history."
 TAI_tsmc_nanjing: "TSMC Nanjing Fab"
 TAI_tsmc_nanjing_desc: "TSMC opens a 12-inch fab in Pukou, Nanjing, and the semiconductor industry formally ‘goes west’. Taiwan's government used to strictly limit investment in advanced processes on the mainland, keeping the ‘sacred mountain that protects the nation’ on the island; after unification the restriction is gone, and TSMC begins expanding on the mainland on a large scale."
 TAI_smic_tsmc_merger: "SMIC Merges into TSMC"
 TAI_smic_tsmc_merger_desc: "SMIC is taken over and reorganized by TSMC, uniting the foundry industries of both sides. SMIC's founder Richard Chang was a Taiwan-born engineer, and the two companies fought years of trade secret lawsuits; now their engineers work in the same clean rooms, and technology and talent flow freely between them."
 TAI_zhangjiang_hsinchu: "Zhangjiang–Hsinchu Twin Hubs"
 TAI_zhangjiang_hsinchu_desc: "Shanghai's Zhangjiang and the Hsinchu Science Park become twin hubs, with talent and capital moving freely between them. Hsinchu has a complete ecosystem of fabrication and chip design, Zhangjiang a huge market and engineering workforce; with hourly direct flights between them, an engineer can attend a meeting in Hsinchu in the morning and be at work in Zhangjiang by afternoon."
 TAI_semiconductor_fund: "National Semiconductor Fund"
 TAI_semiconductor_fund_desc: "A national semiconductor fund backed by both the treasury and private investors makes long-term investments in fabrication, equipment and materials. The CCP-era ‘Big Fund’ saw several top executives fall in corruption scandals; the new fund is run by professional managers under parliamentary oversight, and investment goes by technology, not connections."
 TAI_mainland_ic_design: "IC Design Industry"
 TAI_mainland_ic_design_desc: "Support fabless chip design companies across the board, from phone processors to server chips. Design teams from MediaTek, Realtek and HiSilicon exchange know-how, and mainland universities train tens of thousands of chip engineers a year; China's IC design industry becomes second only to America's."
 TAI_advanced_nodes: "Advanced Process Nodes"
 TAI_advanced_nodes_desc: "Seven nanometers, five, three... the next stop on Moore's Law will be defined by Chinese engineers. TSMC's advanced process technology combines with the mainland's vast capacity, and development of 2-nanometer and angstrom-class nodes proceeds in Hsinchu and Nanjing at once; the world's most advanced chips all come from Chinese fabs."
 TAI_domestic_lithography: "Lithography Independence"
 TAI_domestic_lithography_desc: "Combine the strength of the academies and the Industrial Technology Research Institute to break the monopoly on extreme ultraviolet lithography. The Dutch company ASML is the only maker of EUV machines in the world and once refused to sell them to China under American export controls; although the ban is lifted for unified China, it is determined to master this most critical technology itself."
 TAI_memory_independence: "Memory Chip Independence"
 TAI_memory_independence_desc: "Memory chips are made entirely at home, and China is no longer at anyone's mercy. With YMTC's 3D NAND and CXMT's DRAM plus the technology of Taiwan's Nanya and Winbond, China's memory capacity is enough to challenge the duopoly of Samsung and SK Hynix."
 TAI_shenzhou: "Crewed Spaceflight"
 TAI_shenzhou_desc: "Republic of China astronauts go into space aboard a domestically built spacecraft. For the first time a Shenzhou crew includes an astronaut from Taiwan; looking down at the Earth from orbit, she says: from up here, the Strait is just a thin blue line."
 TAI_space_station: "Space Station"
 TAI_space_station_desc: "Establish the Republic of China's own space station in low Earth orbit. The Tiangong station keeps operating under a new flag and opens to the world: scientists from Europe, Japan and developing countries can all carry out experiments on board, and it will become humanity's main outpost in orbit after the International Space Station retires."
 TAI_beidou: "BeiDou Satellite Navigation"
 TAI_beidou_desc: "Build an independent satellite navigation system for military and civilian use. BeiDou has more than thirty satellites and accuracy comparable to GPS; in wartime it frees the National Army from dependence on American navigation, and in peacetime it serves billions of phones and cars."
 TAI_commercial_launch: "Commercial Launches"
 TAI_commercial_launch_desc: "Open the field to private rocket companies to win global satellite launch business at low prices. Private firms such as LandSpace, iSpace and Taiwan's TiSpace develop reusable rockets and the cost of commercial launches falls sharply; China becomes SpaceX's main competitor."
 TAI_mars_probe: "Mars Exploration"
 TAI_mars_probe_desc: "A probe travels fifty million kilometers and lands on Utopia Planitia on Mars. The rover drives across the red soil collecting samples and sends home the first Martian panorama taken by a Republic of China probe; the next goal is sample return, and after that, a crewed landing."
 TAI_telecom_restructuring: "Telecom Restructuring"
 TAI_telecom_restructuring_desc: "Reorganize China Telecom, China Mobile, China Unicom and Chunghwa Telecom into three competing carriers. The old state telecom monopolies kept prices high, and the new competition sharply lowers the cost of mobile and broadband while noticeably improving service."
 TAI_mobile_networks: "From 3G to 5G"
 TAI_mobile_networks_desc: "Generation after generation of mobile networks connects even remote mountain villages to the world. From 3G and 4G to 5G, base stations cover the Tibetan Plateau and the South China Sea islands; children in the mountains of Guizhou take online classes on tablets, and herders in Xinjiang sell mutton by phone."
 TAI_internet_giants: "The Big Three of the Internet"
 TAI_internet_giants_desc: "With the Great Firewall gone, mainland internet companies rise quickly in free competition. Alibaba, Tencent and ByteDance are freed from political censorship, but must also face Google and Facebook head-on; the winners are the products that truly serve their users."
 TAI_online_games: "Online Games Industry"
 TAI_online_games_desc: "From internet cafés to smartphones, online games become the young generation's entertainment and an export industry. The CCP-era game licensing and play-time limits for minors are abolished, and Taiwanese game companies team up with mainland studios to create hits that take the world by storm."
 TAI_mobile_payment: "Mobile Payments"
 TAI_mobile_payment_desc: "QR code payments spread across town and country, and cash all but disappears from daily life. Even market stalls and temple donation boxes display QR codes; the new government passes laws protecting the privacy of payment data and forbids the authorities from accessing personal transaction records without a court order."
 TAI_ecommerce: "E-Commerce"
 TAI_ecommerce_desc: "Online shopping and logistics networks link the whole country, and small shops can sell their goods all over the world. Farmers in ‘Taobao villages’ sell local specialties to Europe and America, and Taiwanese creative boutiques open online stores on the mainland; couriers become the most familiar sight in the cities, delivering parcels almost anywhere within a day."
 TAI_digital_fabi: "Digital National Currency"
 TAI_digital_fabi_desc: "The central bank issues a digital national currency to circulate alongside the traditional fabi. Unlike the CCP-era digital yuan, it is designed around privacy, and the central bank cannot track small transactions; it lowers the cost of payments and makes the national currency more competitive in cross-border trade."
 TAI_big_four_ipo: "Big Four Bank Listings"
 TAI_big_four_ipo_desc: "The big four state banks, ICBC, the Agricultural Bank, Bank of China and China Construction Bank, complete their conversion to joint-stock companies and list simultaneously in Shanghai and Taipei. The money raised goes to writing off bad loans and rebuilding capital, and foreign strategic investors bring modern risk management; the big four turn from policy tools into real commercial banks."
 TAI_exchange_merger: "Shanghai-Taipei Exchange Merger"
 TAI_exchange_merger_desc: "The Shanghai Stock Exchange and the Taiwan Stock Exchange merge into the China Stock Exchange, headquartered in Lujiazui. The combined exchange ranks among the world's three largest, with TSMC and Alibaba listed on the same market; Shanghai becomes Asia's financial center again, as it was in the 1930s."
 TAI_sovereign_fund: "China Investment Corporation"
 TAI_sovereign_fund_desc: "Set up a sovereign wealth fund from the foreign reserves to invest in energy, minerals and technology abroad. The China Investment Corporation absorbs the CIC and Taiwan's National Stabilization Fund and manages over a trillion dollars in assets; following Norway's fund, it publishes its portfolio and makes no politically motivated acquisitions."
 TAI_shadow_banking: "Rein In Shadow Banking"
 TAI_shadow_banking_desc: "Clean up local financing vehicles and wealth management products to defuse systemic financial risk. In the CCP era shadow banking once exceeded sixty trillion yuan, and the collapse of Evergrande and Country Garden set off chain reactions; the new government gradually disarms this time bomb with deposit insurance, bankruptcy restructuring and strict regulation."
 TAI_star_market: "STAR Market"
 TAI_star_market_desc: "Open a dedicated board for high-tech companies so founders can raise money more easily. The STAR Market uses a registration system with no requirement for years of profits, so chip, biotech and AI firms can list while still in the R&D stage; Taiwanese venture capitalists also head to the mainland to find the next unicorn."
 TAI_fabi_internationalization: "Internationalizing the National Currency"
 TAI_fabi_internationalization_desc: "The national currency becomes an international reserve currency alongside the dollar, the euro and the yen. The IMF reweights its SDR basket, with the national currency ranking behind only the dollar and the euro; international trade in crude oil, iron ore and soybeans begins to be priced in it, and Chinese companies are freed from exchange-rate worries."
 TAI_west_east_gas_2: "Second West-East Gas Pipeline"
 TAI_west_east_gas_2_desc: "A second east–west gas pipeline carries gas from Xinjiang and Central Asia to the Pearl River Delta and Hong Kong. Nearly nine thousand kilometers long, it crosses more than a dozen provinces; factories and power plants in the delta switch to gas, and the air in South China noticeably improves."
 TAI_oil_majors_abroad: "The Oil Majors Go Global"
 TAI_oil_majors_abroad_desc: "PetroChina, Sinopec and CNOOC go out into the world and buy oil fields abroad. In the CCP era their foreign investments were often politically driven and lost fortunes in Venezuela and Sudan; now the three oil majors choose projects on commercial grounds and compete with the Western oil giants on equal terms."
 TAI_baosteel_ipo: "Baosteel Goes Public"
 TAI_baosteel_ipo_desc: "Baosteel completes its privatization and becomes a world-class steelmaker. Built with the help of Japan's Nippon Steel, it was a symbol of reform and opening; now it forms a strategic alliance with Taiwan's China Steel to compete with Japanese and Korean mills in high-end automotive and shipbuilding steel."
 TAI_steel_consolidation: "Steel Consolidation"
 TAI_steel_consolidation_desc: "Close down small mills and consolidate the industry into a few internationally competitive steel groups. China produces more than half the world's crude steel, but hundreds of small mills suffer from overcapacity and heavy pollution; after consolidation the industry's margins recover and the skies over Hebei turn blue again."
 TAI_domestic_nuclear: "Domestic Nuclear Power"
 TAI_domestic_nuclear_desc: "Combine Taiwan's experience from the Fourth Nuclear Plant with mainland technology to design a domestic third-generation reactor. The Fourth Nuclear Plant was mothballed for years over political controversy, leaving a group of highly experienced engineers; working with the Hualong One design team, they produce a domestic reactor with higher safety standards."
 TAI_renewable_bases: "Wind and Solar Bases"
 TAI_renewable_bases_desc: "Build huge solar and offshore wind bases in the Gobi and along the southeast coast. Solar farms in Gansu and Inner Mongolia stretch to the horizon, and the Taiwan Strait's offshore wind farms sit in some of the best wind waters in the world; ultra-high-voltage lines carry green power from the west to the cities of the east."
 TAI_rare_earth_strategy: "Rare Earth Strategy"
 TAI_rare_earth_strategy_desc: "Consolidate the rare earth industries of Baotou and southern Jiangxi to control a key raw material of high technology. China produces over seventy percent of the world's rare earths, and past overmining and smuggling cost the resource and the environment dearly; the new government turns the resource advantage into strategic leverage through production caps, environmental standards and export management."
 TAI_changchun_auto: "Changchun Motor City"
 TAI_changchun_auto_desc: "Expand FAW's Changchun base and make the Northeast a center of China's auto industry again. First Automobile Works built its first Jiefang truck in 1956, and its Hongqi limousines once carried the country's leaders; now FAW must step out from under the state's umbrella and compete with the joint-venture brands in the market."
 TAI_private_automakers: "Rise of the Private Carmakers"
 TAI_private_automakers_desc: "Geely, BYD, Great Wall... private carmakers rise to the top through market competition. Geely bought Volvo and BYD has become the world's largest maker of electric vehicles; without the privileges of state firms and local protectionism, private carmakers get a level playing field."
 TAI_yulon_faw: "Yulon-FAW Partnership"
 TAI_yulon_faw_desc: "Taiwan's Yulon Motor forms a joint venture with FAW, combining Taiwanese design with mainland capacity. Yulon's founder Yen Ching-ling dreamed of building ‘our own national car’, but the Luxgen brand was always held back by Taiwan's small market; the partnership with FAW gives the dream the scale it needs, and the lines can also switch to military vehicles."
 TAI_overseas_acquisition: "Overseas Acquisitions"
 TAI_overseas_acquisition_desc: "Chinese carmakers buy long-established European brands to gain technology and names. After Volvo and Lotus, more struggling European manufacturers become targets for Chinese buyers; a democratic China means European governments no longer block the deals on national security grounds."
 TAI_new_energy_vehicles: "New Energy Vehicles"
 TAI_new_energy_vehicles_desc: "Electric vehicles and batteries become the new national strategic industry. CATL and BYD batteries supply the whole world, and Taiwan's motors and automotive chips fill in the last piece of the puzzle; China accounts for sixty percent of global new energy vehicle sales, and petrol cars gradually leave the city streets."
 TAI_auto_exports: "Car Exports"
 TAI_auto_exports_desc: "China becomes the world's largest car exporter, shipping millions of vehicles a year to Europe, Southeast Asia, the Middle East and Latin America. The roll-on roll-off terminals at Shanghai and Guangzhou are packed with new cars awaiting export, and ‘Chinese car’ is no longer a byword for cheap."
 TAI_abolish_agri_tax: "Abolish the Agricultural Tax"
 TAI_abolish_agri_tax_desc: "The ‘imperial grain tax’ that lasted two thousand years passes into history. Farmers no longer pay agricultural tax or the many local levies, and local governments are funded instead through fiscal transfers; it lifts a burden from hundreds of millions of farmers and is a key step in winning over the countryside for the new government."
 TAI_hybrid_rice: "Super Hybrid Rice"
 TAI_hybrid_rice_desc: "Spread high-yield super hybrid rice, with yields passing a thousand kilograms per mu. Yuan Longping's hybrid rice let China feed a fifth of the world's population; the new government keeps backing his research team and spreads new drought- and salt-tolerant varieties to Southeast Asia and Africa."
 TAI_grain_for_green: "Grain for Green"
 TAI_grain_for_green_desc: "Return steep farmland to forest and grassland to stop soil erosion. After the great Yangtze flood of 1998 the CCP began the Grain for Green program; the new government continues it and pays ecological compensation so farmers are willing to take part. The slopes of the Loess Plateau turn green again, and the Yellow River carries less silt every year."
 TAI_distant_fishing: "Distant-Water Fishing"
 TAI_distant_fishing_desc: "Build up the distant-water fishing fleet to draw a ‘blue granary’ from the Pacific and Indian Oceans. Taiwan's distant-water fleet has long ranked among the world's largest, with tuna boats from Kaohsiung's Qianzhen port across three oceans; now the mainland and Taiwan fleets are integrated, with strict quotas and oversight in answer to international criticism of overfishing."
 TAI_seed_security: "Seed Security"
 TAI_seed_security_desc: "Build a national seed bank and master the core technologies of plant breeding. China depends heavily on imported corn, soybean and vegetable seed, and multinational seed companies control key varieties; the national seed bank holds over a million germplasm samples, and Taiwan's experience in seed improvement is used to breed new varieties."
 TAI_water_security: "National Water Security"
 TAI_water_security_desc: "Tame the Yellow River and the Huai, build reservoirs and irrigation networks, and secure water for the north. Overpumping of groundwater beneath the North China Plain has created the world's largest groundwater depression, and Beiping and Tianjin have less water per person than Israel; water-saving farming, wastewater reuse and inter-basin transfers attack the problem together."
 TAI_rise_of_central_china: "Rise of Central China"
 TAI_rise_of_central_china_desc: "The six provinces of Hubei, Hunan, Henan, Jiangxi, Anhui and Shanxi develop together. Caught between the prosperous coast and the subsidized west, the central region was long described as ‘sinking’; with transport hubs, industrial relocation and returning talent, the new government makes it the next growth pole."
 TAI_pudong_finance: "Pudong Financial Center"
 TAI_pudong_finance_desc: "Make Pudong in Shanghai an international financial center alongside Hong Kong and Tokyo. International banks, asset managers and insurers set up Asian headquarters in the skyscrapers of Lujiazui; free movement of capital and an independent judiciary finally give Shanghai the institutional software of a global financial center."
 TAI_ne_russia_corridor: "Northeast-Russia Corridor"
 TAI_ne_russia_corridor_desc: "With Harbin as the hub, open railways and roads into the Russian Far East. Harbin was once the hub of the Chinese Eastern Railway and was called the ‘Paris of the East’; now new cross-border railways and road bridges link the Northeast with Vladivostok and Khabarovsk, and timber, grain and energy flow across the border without pause."
 TAI_prd_electronics: "Pearl River Delta Electronics"
 TAI_prd_electronics_desc: "Dongguan and Shenzhen become the world's production base for electronics, with Foxconn, Huawei and DJI factories making phones, computers and drones for the whole world. Taiwanese businesses have operated in Dongguan for more than thirty years, and now their experience combines with mainland engineers to take the Pearl River Delta from contract manufacturing to innovation."
 TAI_second_gen_sez: "Second-Generation Special Economic Zones"
 TAI_second_gen_sez_desc: "Set up a new generation of special economic zones inland to repeat the coast's success. Chengdu, Chongqing, Xi'an and Zhengzhou become new zones with the same tax breaks and policy freedom Shenzhen once had; inland wages are half those on the coast, and factories move west in large numbers along the Yangtze and the Longhai line."
 TAI_new_mbt: "New Main Battle Tank"
 TAI_new_mbt_desc: "Combine the Type 99's chassis with the M1A2's fire control to develop the National Army's next main battle tank. Taiwan's M1A2T and the mainland's 99A were designed to fight each other; now the two design teams sit in the same room and take the best of each, and the new tank is named Chung Cheng in honor of the National Army's tradition."
 TAI_wheeled_family: "Wheeled Armor Family"
 TAI_wheeled_family_desc: "The CM-32 Clouded Leopard and the Type 08 merge into a single family of eight-wheeled armored vehicles. Each design has its own strengths, and the merged family includes infantry fighting vehicles, command vehicles, ambulances and self-propelled mortars; a common chassis greatly simplifies logistics."
 TAI_attack_helicopters: "Attack Helicopters"
 TAI_attack_helicopters_desc: "Form army aviation attack helicopter brigades with Apaches and Z-10s. Taiwan's AH-64E Apaches and the mainland's Z-10s serve together, and their pilots learn each other's tactics; an attack helicopter brigade can reach a battlefield hundreds of kilometers away within hours, the army's sharpest fist."
 TAI_tactical_drones: "Tactical Drones"
 TAI_tactical_drones_desc: "Every battalion gets reconnaissance and attack drones. The Ukrainian battlefield proved that cheap drones can destroy expensive tanks; the National Army gives every infantry battalion first-person-view attack drones and reconnaissance drones, and Taiwan's civilian drone industry is brought into the defense supply chain."
 TAI_rifle_merger: "A Unified Service Rifle"
 TAI_rifle_merger_desc: "Draw on the experience of the T91 and the QBZ-95 to develop a single standard rifle for the National Army. The two rifles have completely different calibers and layouts, and the soldiers are used to different handling; the new rifle uses a NATO-standard caliber and a conventional stock, and the first batch goes to elite units in the five theater commands."
 TAI_soldier_systems: "Soldier Systems"
 TAI_soldier_systems_desc: "Night vision, communications and body armor are replaced across the board. Every infantryman gets a digital radio, thermal night sights and new body armor, and squad leaders can see the whole company's positions on a tablet; on the modern battlefield, the soldier himself is a node in the network."
 TAI_atgm: "Anti-Tank Missiles"
 TAI_atgm_desc: "Merge the two technical lines of the Red Arrow and the Javelin. The American Javelins Taiwan bought use fire-and-forget top attack, and the mainland's HJ-12 has similar capabilities; the two teams develop a new anti-tank missile together, giving the infantry the means to fight any armored force."
 TAI_sp_artillery: "Self-Propelled Artillery"
 TAI_sp_artillery_desc: "Develop a new self-propelled howitzer based on the PLZ-05, with a range over fifty kilometers, able to fire several rounds within a minute and quickly shift position. Taiwan's M109A6 units are merged with the mainland's self-propelled artillery, and the guns will play a decisive role on future battlefields."
 TAI_thunderbolt_mlrs: "Thunderbolt Rocket Artillery"
 TAI_thunderbolt_mlrs_desc: "The Thunderbolt-2000 and the PHL-03 merge to form long-range rocket artillery brigades. The Thunderbolt-2000 is Taiwan's own multiple rocket system and the PHL-03 the mainland's long-range launcher; the merged system reaches three hundred kilometers and can destroy deep targets with precision-guided rockets."
 TAI_air_defense_merger: "Sky Bow and HQ Unified"
 TAI_air_defense_merger_desc: "The Sky Bow and HQ air defense missile families are integrated into a single homeland air defense network. Taiwan's Sky Bow III and the mainland's HQ-9 were once each other's adversaries; now their radars and command systems are linked into a multi-layered defense from short to long range and from low to high altitude."
 TAI_new_national_army: "The New National Army"
 TAI_new_national_army_desc: "The army completes its re-equipment, and a modern, networked new National Army takes shape. Tanks, armored vehicles, artillery and personal equipment all follow single domestic standards; units merged from both sides finish training on the new equipment, and the soldiers can no longer tell which side each of them came from."
 TAI_kidd_054a: "Kidd and 054A Combined"
 TAI_kidd_054a_desc: "Mass-produce a new frigate drawing on the Kidd class's combat experience and the Type 054A's production lines. The Taiwanese navy's Kidd-class destroyers have deep air defense experience, and the 054A is a mature product of the mainland's shipyards; the new frigate combines the best of both and fills out the blue-water fleet in numbers."
 TAI_varyag_refit: "Refit the Varyag"
 TAI_varyag_refit_desc: "Refit the Varyag, moored at Dalian, as the Republic of China's first aircraft carrier. This unfinished Soviet carrier was bought in 1998 under the pretext of becoming a floating casino and took years of work to become the Liaoning; now it returns to service under the Blue Sky, White Sun flag as the training ship for naval aviation."
 TAI_domestic_carrier: "Domestic Carrier"
 TAI_domestic_carrier_desc: "The Jiangnan shipyard begins building the first domestically built aircraft carrier. Jiangnan is one of China's oldest shipyards, founded in Shanghai by Li Hongzhang in 1865; a hundred and sixty years later it will build the Republic of China's first domestic carrier and lay the foundation for the navy's move into blue water."
 TAI_emals: "Electromagnetic Catapults"
 TAI_emals_desc: "The new generation of carriers uses electromagnetic catapults, so aircraft can take off fully loaded. Compared with a ski-jump deck, electromagnetic catapults let fighters carry more fuel and weapons and can launch early warning aircraft too; only the US and China have mastered the technology."
 TAI_submarine_merger: "Unified Submarine Program"
 TAI_submarine_merger_desc: "The design teams behind the Hai Kun and the Type 039 merge to develop conventional submarines together. Taiwan's indigenous submarine program overcame great difficulties to finish its first boat, while dozens of 039s are already in service; after the merger, a new air-independent submarine will be built in numbers at lower cost."
 TAI_nuclear_submarines: "Nuclear Submarines"
 TAI_nuclear_submarines_desc: "Build new nuclear attack submarines and ballistic missile submarines. The Type 095 attack boats and Type 096 missile boats are far quieter and can patrol undetected in the western Pacific and Indian Ocean for long periods; nuclear submarines are the jewel in the navy's crown and a pillar of national deterrence."
 TAI_amphibious_assault_ship: "Amphibious Assault Ships"
 TAI_amphibious_assault_ship_desc: "Build flat-deck amphibious assault ships carrying helicopters and marines. The Type 075 can carry nearly thirty helicopters and a marine battalion for long-range deployment and humanitarian relief; in South Pacific cyclones and earthquakes, they will be the first help to arrive."
 TAI_two_ocean_navy: "Two-Ocean Navy"
 TAI_two_ocean_navy_desc: "A Pacific fleet and an Indian Ocean fleet: the Republic of China Navy goes into the deep blue. The Pacific fleet is based at Zhoushan and Zuoying, the Indian Ocean fleet at Sanya, with supply stations in Djibouti and Gwadar; for the first time the Chinese navy keeps a permanent presence in two oceans at once."
 TAI_idf_j10_merger: "IDF and J-10 Combined"
 TAI_idf_j10_merger_desc: "The design teams behind the Ching-kuo and the J-10 merge to develop a new domestic fighter. The Ching-kuo was a light fighter Taiwan developed with American help, and the J-10 the pride of the Chengdu Aircraft Corporation; the new fighter the two teams develop together combines the strengths of both with more advanced avionics."
 TAI_stealth_phase2: "Stealth Fighter Phase II"
 TAI_stealth_phase2_desc: "Develop a carrier-capable stealth fighter based on the J-20. Carriers with electromagnetic catapults need a new generation of carrier-based stealth fighters, and J-35 and J-20 technology is integrated into the new design; naval aviation will have fighting power comparable to America's F-35C."
 TAI_awacs: "Airborne Early Warning"
 TAI_awacs_desc: "KJ-2000s and E-2Ks form an airborne early warning network. Taiwan's E-2K Hawkeyes and the mainland's KJ-series aircraft are merged, and a common datalink lets any AWACS direct every fighter; in modern air combat, the side that sees farther usually wins."
 TAI_transport_tanker: "Transports and Tankers"
 TAI_transport_tanker_desc: "The Y-20 enters production, giving the air force strategic airlift and aerial refueling for the first time. A Y-20 fleet can fly an armored battalion to Xinjiang or Tibet in a day, and the tanker version extends fighters' combat radius beyond the second island chain; Taiwan's air force once had only C-130s, and the difference in reach is now beyond comparison."
 TAI_domestic_engines: "Domestic Jet Engines"
 TAI_domestic_engines_desc: "Break through the turbofan bottleneck so our fighters no longer suffer from a ‘weak heart’. Aero engines are the jewel in industry's crown; mainland fighters long depended on Russian engines, and the domestic WS-10 and WS-15 took years to become reliable; Taiwan's precision machining skills close the final gap."
 TAI_long_range_drones: "Long-Range Strike Drones"
 TAI_long_range_drones_desc: "Wing Loong and Teng Yun drones form a long-range reconnaissance and strike fleet. The Teng Yun is a medium-altitude long-endurance drone developed by Taiwan's NCSIST, while the Wing Loong has been exported across the Middle East and Africa; together they can patrol over the South China Sea and the Indian Ocean for more than thirty hours at a stretch."
 TAI_precision_munitions: "Precision Missiles"
 TAI_precision_munitions_desc: "Integrate the Changjian cruise missiles with the Hsiung Feng family to strike targets a thousand kilometers away. The Hsiung Feng IIE is Taiwan's own land-attack cruise missile and the CJ-10 the mainland's mainstay; combined with BeiDou navigation, the integrated munitions are accurate to within a few meters."
 TAI_theater_air_command: "Theater Air Forces"
 TAI_theater_air_command_desc: "Each theater command gets an air headquarters to direct all aviation in its area. The air force, naval aviation and army aviation used to operate separately; now the theater air commands control every fighter, AWACS and drone, and joint operations become far more efficient."
 TAI_bomber_upgrade: "Strategic Bomber Upgrade"
 TAI_bomber_upgrade_desc: "The H-20 stealth strategic bomber makes its first flight. This flying-wing bomber has a range over eight thousand kilometers and can carry nuclear and precision conventional weapons; it makes the Republic of China the second country after the US to field a stealth strategic bomber, and shifts the strategic balance across the Pacific."
 TAI_dalai_lama_return: "The Dalai Lama Returns to Tibet"
 TAI_dalai_lama_return_desc: "Invite the Dalai Lama, in exile for more than sixty years, back to Lhasa. He fled the Potala Palace for India in 1959 and never returned to Tibet; when the aged religious leader sets foot in Lhasa again, hundreds of thousands of Tibetans kneel by the roadside to greet him. The question of reincarnation and the framework of autonomy are what the two sides must discuss next."
 TAI_tibet_real_autonomy: "A Framework for Real Autonomy"
 TAI_tibet_real_autonomy_desc: "Grant Tibet a high degree of autonomy under the Constitution of the Republic of China. It is the ‘Middle Way’ the Dalai Lama advocated for years: not independence, but genuine autonomy. The Tibetan autonomous government is responsible for education, religion, culture and environmental protection, while defense and foreign affairs stay with the central government."
 TAI_qinghai_tibet_railway: "Qinghai-Tibet Railway"
 TAI_qinghai_tibet_railway_desc: "The world's highest railway runs to Lhasa, crossing the Tanggula Pass at more than five thousand meters. The railway was once criticized as a tool for Sinicization and resource extraction; the new government requires that jobs along the line go first to Tibetans and that tourism revenue be returned to local communities."
 TAI_buddhist_heritage: "Buddhist Heritage Protection"
 TAI_buddhist_heritage_desc: "Restore the monasteries damaged in the Cultural Revolution and protect the heritage of Tibetan Buddhism. Ganden, Samye and Sera were badly damaged, with countless scriptures and statues destroyed; the new government funds their restoration and restores the monasteries' traditions of choosing their own monks and recognizing their own reincarnate lamas."
 TAI_plateau_fund: "Plateau Development Fund"
 TAI_plateau_fund_desc: "Set up a dedicated fund to develop transport, education and tourism on the Tibetan Plateau. Herders' children on the plateau walk for days to reach school, and many villages have no doctor; the fund builds a school and a clinic in every township and replaces destructive mining with ecotourism."
 TAI_himalayan_gateway: "Himalayan Gateway"
 TAI_himalayan_gateway_desc: "Make Lhasa the gateway for trade routes to Nepal and South Asia. The Kyirong and Zhangmu crossings reopen, and a planned China–Nepal railway will run from Shigatse to Kathmandu; Tibet is no longer a closed frontier but a bridge between China and South Asia."
 TAI_xinjiang_autonomy_law: "Xinjiang Autonomy Statute"
 TAI_xinjiang_autonomy_law_desc: "Enact a Xinjiang autonomy statute guaranteeing the languages, religions and cultures of all its peoples. Uyghurs, Kazakhs and Hui hold seats in the regional assembly in proportion to their population, and local leaders are elected; it is a fundamental correction of decades of repressive rule."
 TAI_religious_freedom_xj: "Guarantee Religious Freedom"
 TAI_religious_freedom_xj_desc: "Close the re-education camps, release the detainees and restore normal religious life in the mosques. Mosque domes that were torn down are raised again, and civil servants and students are no longer forbidden to fast during Ramadan; the UN human rights commissioner is invited to investigate in Xinjiang, and Turkey and the Muslim world warm noticeably toward Nanjing."
 TAI_kashgar_sez: "Kashgar Special Economic Zone"
 TAI_kashgar_sez_desc: "Make Kashgar a special economic zone facing Central and South Asia. Kashgar was a key town on the old Silk Road, and its old city lanes keep a thousand years of character; the new zone links to Pakistan and Kyrgyzstan through the Khunjerab and Torugart crossings, so Uyghurs in southern Xinjiang can find work at home."
 TAI_bilingual_education: "Bilingual Education"
 TAI_bilingual_education_desc: "Introduce bilingual education that gives equal weight to Uyghur and the national language. The old ‘bilingual education’ in practice phased out Uyghur instruction, and many children in boarding schools were forbidden to speak their mother tongue; the new policy lets students learn literature, history and religious culture in their own language while also learning the national language."
 TAI_tarim_oil: "Tarim Oil Fields"
 TAI_tarim_oil_desc: "Develop the oil and gas of the Tarim Basin. Beneath the Taklamakan Desert lies one of China's largest oil and gas reserves, but the proceeds used to flow mostly east and to state firms; the new government requires half of the resource tax to stay in Xinjiang for local schools, hospitals and infrastructure."
 TAI_central_asia_gateway: "Gateway to Central Asia"
 TAI_central_asia_gateway_desc: "Xinjiang is no longer a remote frontier but China's gateway to Central Asia and Europe. Urumqi becomes a hub of the Eurasian land bridge and freight through the Khorgos crossing doubles every year; for the first time the region's peoples truly share in the nation's development through openness and prosperity."
 TAI_mongolian_education: "Mongolian-Language Education"
 TAI_mongolian_education_desc: "Restore Mongolian-language schools and Mongol culture, respecting the traditions of the leagues and banners. In 2020 Inner Mongolia replaced Mongolian with the national language in teaching, sparking mass protests; the new government restores Mongolian-medium instruction, Mongolian newspapers and broadcasts reopen, and the Naadam festival becomes a national celebration."
 TAI_steppe_economy: "Steppe Economy"
 TAI_steppe_economy_desc: "Revive the steppe economy with herding, dairy and tourism. The old ‘ecological migration’ drove herders into towns while overmining turned the grassland into desert; the new policy lets herders return to the steppe, run dairy and specialty livestock through cooperatives and develop grassland ecotourism."
 TAI_rare_earth_coal: "Rare Earths and Coal"
 TAI_rare_earth_coal_desc: "Develop the coal of Ordos and the rare earths of Bayan Obo. Bayan Obo is the world's largest rare earth deposit, and Ordos grew rich on coal and then became famous for its ghost town; the new government makes mining companies responsible for ecological restoration and shares part of the resource income with local Mongol herders."
 TAI_mongol_federation: "A Mongol Federation"
 TAI_mongol_federation_desc: "Inner and Outer Mongolia belong to the same Mongol nation. The Republic of China offers to share a future with Mongolia in the form of a federation: Mongolia keeps its own parliament, army and international standing while joining the Republic of China in defense and economic federation. Ulaanbaatar is half-skeptical, but the economic temptation is hard to resist."
 TAI_greater_bay_area: "Greater Bay Area"
 TAI_greater_bay_area_desc: "Hong Kong, Macau and nine Guangdong cities form the Greater Bay Area, with over eighty million people and an economy the size of South Korea's. Within the framework of one country, two systems, people, money and goods move ever more easily among them; Hong Kong's finance, Macau's tourism and Shenzhen's technology form a world-class urban cluster."
 TAI_hzm_bridge: "Hong Kong-Zhuhai-Macau Bridge"
 TAI_hzm_bridge_desc: "A fifty-five-kilometer sea crossing links Hong Kong, Zhuhai and Macau, the longest bridge-and-tunnel sea crossing in the world. Once it opens, the drive from Hong Kong to Zhuhai falls from four hours to forty minutes; the new government relaxes the vehicle quotas so the bridge can truly connect the three cities."
 TAI_macau_diversification: "Diversifying Macau"
 TAI_macau_diversification_desc: "Help Macau end its dependence on gambling and develop conventions, tourism and finance. Gaming provides eighty percent of Macau's government revenue, and when the casinos closed during the pandemic its economy briefly collapsed; the new government sets up a cooperation zone on Hengqin to give Macau's traditional medicine, convention and specialty finance industries room to grow."
 TAI_lusophone_gateway: "Gateway to the Lusophone World"
 TAI_lusophone_gateway_desc: "Use Macau as a platform to expand trade with Brazil, Portugal, Angola and the other Lusophone countries. Macau has over four hundred years of Portuguese colonial history and keeps Portuguese legal and cultural traditions; the Forum for Economic and Trade Co-operation is based in Macau, giving Chinese companies a springboard into a Portuguese-speaking market of more than two hundred million people."
 TAI_five_races_prosperity: "Shared Prosperity of the Five Races"
 TAI_five_races_prosperity_desc: "Han, Manchu, Mongol, Hui, Tibetan and all peoples share prosperity under the Republic of China. Per capita income in the frontier regions catches up with the national average for the first time, minority languages and cultures are protected and religious freedom is guaranteed; the ideal of the Republic of Five Races has turned from a flag into reality."
 ### v3.11 光复后的政党与候选人
 ROC.Western_Autocracy: "£TAI_conservatism (HFH) Kuomintang Huang Fu-hsing Branch"
 ROC.Western_Autocracy_desc: "Western Autocracy - Kuomintang Huang Fu-hsing Branch\n\nA special Kuomintang branch made up of veterans and the children of military villages. Disciplined and hard-line, it wants a strong government to secure the gains of the Restoration and stands firmly with the United States."
 ROC.Western_Autocracy_icon: "£TAI_conservatism"
 ROC.conservatism: "£TAI_conservatism (KMT) Kuomintang"
 ROC.conservatism_desc: "Conservatism - Kuomintang\n\nThe century-old party founded by Sun Yat-sen. Having led the government back to the mainland, the Kuomintang is the largest party in the country. It stands for the Three Principles of the People, the Five-Power Constitution and a steady market economy."
 ROC.conservatism_icon: "£TAI_conservatism"
 ROC.liberalism: "£CHI_liberal (CDP) China Democratic Party"
 ROC.liberalism_desc: "Liberal Democracy - China Democratic Party\n\nFounded in 1998 by mainland democracy activists such as Wang Youcai, Qin Yongmin and Xu Wenli, it was quickly banned by the CCP, and its leaders were jailed or driven into exile. After the Restoration, the China Democratic Party can finally organize openly on the mainland. Campaigning for multi-party constitutional democracy, free elections and human rights, it has become the largest liberal party among mainland voters."
 ROC.liberalism_icon: "£CHI_liberal"
 ROC.socialism: "£CHI_left_wing_radical (RCCK) Revolutionary Committee of the Kuomintang (KMT Left)"
 ROC.socialism_desc: "Social Democracy - Revolutionary Committee of the Kuomintang (KMT Left)\n\nIt grew out of the Kuomintang's left wing: the tradition of Liao Zhongkai, Soong Ching-ling and the ‘Three Great Policies’. After the Restoration, the RCCK has shed its past as a CCP satellite and calls itself the ‘Kuomintang Left’. Holding to the Principle of Livelihood, it calls for land reform, labor protection and support for workers and peasants, and has deep roots among the mainland's workers and farmers."
 ROC.socialism_icon: "£CHI_left_wing_radical"
 ROC.communist_state: "£CHI_communism (CPC) Communist Party of China"
 ROC.communist_state_desc: "Communism - Communist Party of China\n\nThe Communist Party of China, out of power. Under the constitutional order it exists as a legal opposition party, but it is always suspected of keeping ties with the armed remnants in the north."
 ROC.communist_state_icon: "£CHI_communism"
 ROC.anarchist_communism: "£TAI_anarchist_communism (CPWDP) Chinese Peasants' and Workers' Democratic Party"
 ROC.anarchist_communism_desc: "Left-Wing Socialism - Chinese Peasants' and Workers' Democratic Party\n\nIts forerunner was the ‘Third Party’ founded by Deng Yanda in 1930. Championing the interests of peasants and workers, it called for a ‘common people's revolution’ and land reform. After the Restoration, the party has shed its role as a United Front satellite and is growing again among the mainland's medical workers and state factory workers. It is the most left-wing legal party in parliament."
 ROC.anarchist_communism_icon: "£TAI_anarchist_communism"
 ROC.Conservative: "£TAI_Conservative (NP) New Party"
 ROC.Conservative_desc: "Emerging Conservatism - New Party\n\nA pro-unification party that split from the Kuomintang. Campaigning against corruption and for Chinese nationalism, it carries real weight among urban intellectuals."
 ROC.Conservative_icon: "£TAI_Conservative"
 ROC.Autocracy: "£CHI_pro_emerging_autocrat (CDL) China Democratic League"
 ROC.Autocracy_desc: "Emerging Autocracy - China Democratic League\n\nAn intellectuals' party founded during the war against Japan. Independent again after the Restoration, it calls for a ‘meritocracy’ led by elites and experts."
 ROC.Autocracy_icon: "£CHI_pro_emerging_autocrat"
 ROC.Neutral_Autocracy: "£TAI_conservatism (SPA) Grand Alliance for the Three Principles"
 ROC.Neutral_Autocracy_desc: "Non-Aligned Autocracy - Grand Alliance for the Three Principles\n\nA group of nostalgists for the party-state who want to bring back the tutelage-era principle of ‘ruling the country through the party’."
 ROC.Neutral_Autocracy_icon: "£TAI_conservatism"
 ROC.Neutral_conservatism: "£TAI_Neutral_conservatism (PFP) People First Party"
 ROC.Neutral_conservatism_desc: "Non-Aligned Conservatism - People First Party\n\nThe party founded by James Soong. Campaigning on ‘putting people first’ and local development, it has solid support at the grassroots and among mainlander families."
 ROC.Neutral_conservatism_icon: "£TAI_Neutral_conservatism"
 ROC.oligarchism: "£generic_oligarchism_small (CNDCA) China National Democratic Construction Association"
 ROC.oligarchism_desc: "Oligarchism - China National Democratic Construction Association\n\nA political group of coastal capitalists and Taiwanese businessmen. It calls for open markets, lower taxes and an industrial policy that favors big business."
 ROC.oligarchism_icon: "£generic_oligarchism_small"
 ROC.Neutral_Libertarian: "£CHI_neutral_social_democrat (CAPD) China Association for Promoting Democracy"
 ROC.Neutral_Libertarian_desc: "Intellectual Liberalism - China Association for Promoting Democracy\n\nFounded in Shanghai in 1945 by educators and writers such as Ma Xulun and Zhou Jianren, its members are mostly teachers, scholars and publishers. After the Restoration, it is no longer a ‘flower vase party’. Campaigning for freedom in education, academic independence and cultural openness, it has broad support among mainland intellectuals."
 ROC.Neutral_Libertarian_icon: "£CHI_neutral_social_democrat"
 ROC.Neutral_green: "£TAI_Neutral_green (CGP) China Green Party"
 ROC.Neutral_green_desc: "Green Politics - China Green Party\n\nA party grown out of mainland environmental groups and civil society organizations such as Friends of Nature. It focuses on water, air pollution and the ecological cost of megaprojects like the Three Gorges. The pollution brought by rapid industrialization after the Restoration has made it grow fast."
 ROC.Neutral_green_icon: "£TAI_Neutral_green"
 ROC.neutral_Social: "£CHI_social_democrat (CSDP) Chinese Social Democratic Party"
 ROC.neutral_Social_desc: "Non-Aligned Social Democracy - Chinese Social Democratic Party\n\nA social democratic party of exiled democracy activists and mainland intellectuals that calls for a Nordic-style welfare state."
 ROC.neutral_Social_icon: "£CHI_social_democrat"
 ROC.Neutral_Communism: "£CHI_neutral_communism (MCPC) Maoist Communist Party of China"
 ROC.Neutral_Communism_desc: "Maoism - Maoist Communist Party of China\n\nAn underground Maoist organization that rejects the constitutional order and has close ties to the armed remnants in the north."
 ROC.Neutral_Communism_icon: "£CHI_neutral_communism"
 ROC.Nat_Populism: "£TAI_Nat_Populism (YCP) Young China Party"
 ROC.Nat_Populism_desc: "National Populism - Young China Party\n\nThe old ‘Nationalist Faction’ party founded in 1923. After the Restoration, it has staged a comeback with the slogans ‘the nation above all, the people above all’ and anti-establishment populism, drawing in large numbers of voters disillusioned with the established parties."
 ROC.Nat_Populism_icon: "£TAI_Nat_Populism"
 ROC.Nat_Fascism: "£TAI_Nat_Fascism (NBS) Chinese Renaissance Society"
 ROC.Nat_Fascism_desc: "Fascism - Chinese Renaissance Society\n\nA far-right group modeled on the Renaissance Society (the Blue Shirts) of the 1930s. It preaches a leader's dictatorship, a militarized society and the complete purge of the remnants."
 ROC.Nat_Fascism_icon: "£TAI_Nat_Fascism"
 ROC.Nat_Autocracy: "£TAI_Nat_Autocracy (ROCAF) Republic of China Armed Forces"
 ROC.Nat_Autocracy_desc: "Military Autocracy - Republic of China Armed Forces\n\nA faction of National Army generals unhappy with civilian government. They want the military to run the country until the ‘suppression of the rebellion’ is complete."
 ROC.Nat_Autocracy_icon: "£TAI_Nat_Autocracy"
 ROC.Monarchist: "£CHI_monarchism (Aisin-Gioro) House of Aisin-Gioro"
 ROC.Monarchist_desc: "Monarchism - House of Aisin-Gioro\n\nDescendants of the Qing imperial clan and a handful of constitutional monarchists, who want to restore a ‘Chinese Empire’ with a figurehead emperor as the symbol of the nation."
 ROC.Monarchist_icon: "£CHI_monarchism"
