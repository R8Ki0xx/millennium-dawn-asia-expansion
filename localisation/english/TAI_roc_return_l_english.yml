 TAI_dbf_hearts_reduce_tt: "Severity of the national spirit §YHearts Not Yet Won§! §G−33§! (removed at 0)"
 TAI_dbf_cure_pla_remnants: "Reorganize Former PLA Personnel"
 TAI_dbf_cure_pla_remnants_desc: "Set up a ‘National Army Reorganization Commission’ to screen, reorganize and demobilize former PLA officers and soldiers, cutting off the remnants' supply of recruits.\n\n§YPLA Remnants§! currently at severity §R[?TAI_dbf_pla_remnants_sev|0]§!/100, recovering §G[?TAI_dbf_pla_remnants_rate|1]§! per month."
 TAI_dbf_cure_pla_remnants_tt: "Severity of the national spirit §YPLA Remnants§! §G−15§!, costs §Y2§! billion"
 TAI_dbf_pla_remnants_desc: "Current severity: §R[?TAI_dbf_pla_remnants_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_pla_remnants_rate|1]§! per month (base 0.5; +0.5 each if not at war and if war support is above 40%).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
 TAI_dbf_pla_remnants_reduce_tt: "Severity of the national spirit §YPLA Remnants§! §G−33§! (removed at 0)"
 TAI_dbf_cure_transition: "Price Stabilization Plan"
 TAI_dbf_cure_transition_desc: "The central bank tightens money while the Executive Yuan holds down grain prices and rents, steadying prices through the transition.\n\n§YPains of Economic Transition§! currently at severity §R[?TAI_dbf_transition_sev|0]§!/100, recovering §G[?TAI_dbf_transition_rate|1]§! per month."
 TAI_dbf_cure_transition_tt: "Severity of the national spirit §YPains of Economic Transition§! §G−15§!, costs §Y4§! billion"
 TAI_dbf_transition_desc: "Current severity: §R[?TAI_dbf_transition_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_transition_rate|1]§! per month (base 0.5; +0.5 each if stability is above 60% and if not at war).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
 TAI_dbf_transition_reduce_tt: "Severity of the national spirit §YPains of Economic Transition§! §G−33§! (removed at 0)"
 TAI_dbf_cure_warlordism: "Centralization"
 TAI_dbf_cure_warlordism_desc: "Use subsidies and reassignments to take back the provinces' control of finances and troops, weakening the local power brokers.\n\n§YRegional Separatism§! currently at severity §R[?TAI_dbf_warlordism_sev|0]§!/100, recovering §G[?TAI_dbf_warlordism_rate|1]§! per month."
 TAI_dbf_cure_warlordism_tt: "Severity of the national spirit §YRegional Separatism§! §G−15§!"
 TAI_dbf_warlordism_desc: "Current severity: §R[?TAI_dbf_warlordism_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_warlordism_rate|1]§! per month (base 0.5; +0.5 each if stability is above 60% and if the ruling coalition has a majority in the Legislative Yuan).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
 TAI_dbf_warlordism_reduce_tt: "Severity of the national spirit §YRegional Separatism§! §G−33§! (removed at 0)"
 TAI_dbf_cure_carpetbag: "Clean Up the Takeover"
 TAI_dbf_cure_carpetbag_desc: "Set up a ‘Takeover Audit Commission’ to prosecute embezzlement and seizures by takeover officials and return stolen public and private property.\n\n§YTakeover Corruption§! currently at severity §R[?TAI_dbf_carpetbag_sev|0]§!/100, recovering §G[?TAI_dbf_carpetbag_rate|1]§! per month."
 TAI_dbf_cure_carpetbag_tt: "Severity of the national spirit §YTakeover Corruption§! §G−15§!"
 TAI_dbf_carpetbag_desc: "Current severity: §R[?TAI_dbf_carpetbag_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_carpetbag_rate|1]§! per month (base 0.5; +0.5 each if stability is above 60% and if the ruling coalition has a majority in the Legislative Yuan).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
 TAI_dbf_carpetbag_reduce_tt: "Severity of the national spirit §YTakeover Corruption§! §G−33§! (removed at 0)"
 TAI_dbf_category: "Putting the Country in Order"
 TAI_dbf_category_desc: "The many ills left over from the early days of the Restoration take time and good government to undo. Each national spirit's severity falls naturally every month, faster under conditions such as high stability or a majority in the Legislative Yuan. We can also spend political power and money to tackle them directly.\n\n§LOnly the ones still present are shown:§!\n - §YBlack Gold Politics§!: [?TAI_dbf_black_gold_sev|0]/100\n - §YDiplomatic Isolation§!: [?TAI_dbf_isolation_sev|0]/100\n - §YPains of the Switch to Volunteers§!: [?TAI_dbf_conscription_sev|0]/100\n - §YCross-Strait Military Imbalance§!: [?TAI_dbf_imbalance_sev|0]/100\n - §YHearts Not Yet Won§!: [?TAI_dbf_hearts_sev|0]/100\n - §YPLA Remnants§!: [?TAI_dbf_pla_remnants_sev|0]/100\n - §YPains of Economic Transition§!: [?TAI_dbf_transition_sev|0]/100\n - §YRegional Separatism§!: [?TAI_dbf_warlordism_sev|0]/100\n - §YTakeover Corruption§!: [?TAI_dbf_carpetbag_sev|0]/100"
 TAI_dbf_mission_pla: "Clear Out the PLA Remnants in Three Years"
 TAI_dbf_mission_pla_desc: "The Ministry of National Defense has promised to finish reorganizing and clearing out the former PLA within three years. If it fails, public confidence in the government will suffer."
 TAI_dbf_mission_black_gold: "Clean Up Black Gold in Two Years"
 TAI_dbf_mission_black_gold_desc: "The Premier promises the Legislative Yuan that ‘black gold will be out of politics within two years’. Prosecutors and investigators go on the offensive against vote buying, bid-rigging and gangster legislators; if the promise is kept on time, the government's prestige will rise considerably."
 roc_md.6.t: "The Hainan Island Collision"
 roc_md.6.d: "On 1 April 2001, a US Navy EP-3 reconnaissance plane collided over the South China Sea with a National Army fighter sent to identify it. The American plane made an emergency landing at Lingshui airfield on Hainan Island, and our pilot bailed out and was rescued. Washington demands the immediate return of the crew and the aircraft; nationalists at home argue that even an ally cannot do as it pleases in China's airspace."
 roc_md.6.a: "Friendship among allies: send the crew home at once."
 roc_md.6.b: "Sovereignty comes first: demand an American apology."
 roc_md.1.t: "Atypical Pneumonia"
 roc_md.1.d: "An atypical pneumonia of unknown cause spreads through Guangdong and, carried by the Spring Festival travel rush, reaches Beiping, Hong Kong and Taipei. Doctors and nurses fall ill one after another, and people rush to buy masks and herbal remedies. The Department of Health must decide how to respond to this sudden epidemic: openness and transparency, or suppressing the news to avoid panic."
 roc_md.1.a: "Be open about the outbreak and work with the WHO."
 roc_md.1.b: "Suppress the news to avoid panic."
 roc_md.2.t: "The Wenchuan Earthquake"
 roc_md.2.d: "A magnitude 8.0 earthquake strikes Wenchuan in Sichuan, killing tens of thousands of our compatriots; many schools collapse, burying thousands of students in the rubble. The National Army and volunteers from across the country rush to the disaster zone through the night, and Taiwan's Tzu Chi and Red Cross send rescue teams. It is the new government's first major test of disaster relief."
 roc_md.2.a: "The National Army throws everything into the relief effort!"
 roc_md.2.b: "Let the local government lead the relief effort."
 roc_md.3.t: "The Beijing Olympics"
 roc_md.3.d: "The 2008 Olympics, awarded in the CCP era, are now in the hands of the Republic of China government. The Bird's Nest and the Water Cube are nearly finished, and the IOC has doubts about whether the new government can stage the Games on time. It is the restored China's first chance to face the world with a new face: a grand opening ceremony, or a modest Games?"
 roc_md.3.a: "Let the world see the new China!"
 roc_md.3.b: "Keep it simple."
 roc_md.51.t: "National Census"
 roc_md.51.d: "The Directorate-General of Budget, Accounting and Statistics completes the first national census since the Restoration: the Republic of China has more than 1.4 billion people, nearly half still living in the countryside, and over a tenth of them aged sixty-five or more. The figures lay bare the stark realities of the urban–rural gap, an aging population and a skewed sex ratio, and government policy must start from them."
 roc_md.51.a: "Let the numbers guide our policy."
 roc_return.171.a: "A grand military parade!"
 roc_return.171.b: "A modest celebration. Save the money for people's needs."
 roc_return.171.t: "Double Tenth National Day"
 roc_return.171.d: "On the first Double Tenth Day since the Restoration, flags line Zhongshan East Road in Nanjing and people from all over pour into the capital to watch. The Ministry of National Defense proposes a grand parade to show off the reorganized National Army and its new equipment; some legislators argue that with the mainland provinces still impoverished, such extravagance is unwise and the money should go to people's needs."
 roc_return.172.a: "‘The revolution is not yet complete; comrades, keep up the fight.’"
 roc_return.172.t: "Visiting the Sun Yat-sen Mausoleum"
 roc_return.172.d: "The President leads the heads of the Five Yuan up Purple Mountain, climbing the 392 steps to lay flowers before the Father of the Nation. In his eulogy he tells Dr. Sun that his dying wish for a unified China has been fulfilled, and that the Three Principles of the People have taken root across China. Outside the mausoleum tens of thousands stand in silence, many with tears in their eyes."
 roc_return.173.a: "Keep the capital in Nanjing, true to the constitution."
 roc_return.173.b: "Move the capital back to Beijing and build up the north."
 roc_return.173.t: "The Capital Question"
 roc_return.173.d: "Nanjing is the constitutional capital, while Beijing was the imperial capital for six hundred years and is the political center of the north. The Legislative Yuan quarrels endlessly over the question: southern deputies want to return to the constitution's starting point, while northern deputies argue that only a capital in Beijing can hold North China and the Northeast together. The debate in the media has raged for months without resolution."
 roc_return.174.a: "Return the treasures to their rightful home in the north."
 roc_return.174.b: "Two Palace Museums, each keeping its own collection."
 roc_return.174.t: "Returning the Palace Museum Treasures"
 roc_return.174.d: "Should the Palace Museum treasures that crossed the sea with the Nationalist government in 1948 be returned to the Forbidden City in Beijing? More than six hundred thousand objects have been kept at Waishuangxi in Taipei for over seventy years, and the National Palace Museum has become a world-class institution. Scholars in Taipei and the heritage world in Beijing each hold their ground, and people on both sides argue endlessly online."
 roc_return.175.a: "Land to the tiller: privatize the land."
 roc_return.175.b: "Keep collective ownership and issue only contract certificates."
 roc_return.175.t: "Confirming Land Rights"
 roc_return.175.d: "Under the CCP, rural land was nominally owned by the ‘collective’, farmers held only contract rights, and local cadres often seized and sold land in the name of development. The Ministry of the Interior proposes a land titling plan that formally registers ownership in the farmers' names. It would be the largest land reform since Taiwan's land-to-the-tiller program."
 roc_return.176.a: "Privatize fast and let the market decide."
 roc_return.176.b: "Reform gradually and look after the workers first."
 roc_return.176.t: "The Privatization Wave"
 roc_return.176.d: "Tens of thousands of state enterprises await restructuring. Conglomerates and Taiwanese investors are eager to snap up the best assets cheaply, while workers fear for their jobs, and laid-off workers are already sitting in at factory gates in the Northeast. Memories of the layoffs of the 1990s reforms are still fresh, and the government must choose between efficiency and fairness."
 roc_return.177.a: "Set up a veterans' commission to resettle them properly."
 roc_return.177.b: "Pay severance and be done with it."
 roc_return.177.t: "Resettling Demobilized Soldiers"
 roc_return.177.d: "Millions of former PLA soldiers await resettlement; most come from the countryside and have no skills beyond soldiering. If they find no way forward, they will swell the ranks of the remnants in the mountains or even turn to banditry. Taiwan's experience resettling veterans after 1949 teaches that veterans' prospects bear on the stability of all of society."
 roc_return.178.a: "Restore traditional characters."
 roc_return.178.b: "Use both: read traditional, write simplified."
 roc_return.178.t: "The Script Debate"
 roc_return.178.d: "The Ministry of Education is considering bringing back traditional characters in mainland schools. Supporters say it restores the roots of Chinese culture and lets mainland children read the classics and their ancestors' letters; opponents say it would make over a billion people ‘illiterate’ overnight and force printing, publishing and computer systems to be overhauled."
 roc_return.179.a: "Full freedom of the press."
 roc_return.179.b: "Open up gradually, keeping publishing licenses for now."
 roc_return.179.t: "The Press Ban Is Lifted"
 roc_return.179.d: "The Government Information Office announces that newspaper and magazine registration is open in every mainland province. Overnight hundreds of new papers appear on the streets, from serious political journals to gossip tabloids, and queues form at the newsstands. Press freedom brings vitality, and also rumor and confusion, and the government must decide how fast to open up."
 roc_return.180.a: "Rehabilitate June Fourth; the government formally apologizes."
 roc_return.180.b: "Leave it for now, to avoid tearing society apart."
 roc_return.180.t: "Rehabilitating June Fourth"
 roc_return.180.d: "The Tiananmen Mothers petition the Presidential Office once again, demanding that the government rehabilitate those killed in 1989, reveal the truth and hold those responsible to account. Ding Zilin and others have campaigned for over thirty years, and many mothers did not live to see this day. With the Zhongnanhai archives open, the truth of that night may come to light for the first time."
 roc_return.181.a: "Keep it as a historic site, open to visitors."
 roc_return.181.b: "Demolish it and rebury the body in Shaoshan, Hunan."
 roc_return.181.t: "The Fate of the Mao Mausoleum"
 roc_return.181.d: "What is to become of the Chairman Mao Memorial Hall in Tiananmen Square? Communist Party supporters vow to protect it, and thousands still queue every day to view the body; many families of victims of the Great Leap Forward and the Cultural Revolution demand its demolition, calling it an insult to the dead. Whatever the government decides will provoke a strong reaction from one side or the other."
 roc_return.182.a: "Honor the constitution and allow religious freedom."
 roc_return.182.b: "Open up within limits; religious groups must register."
 roc_return.182.t: "Religious Freedom"
 roc_return.182.d: "Underground Catholic churches, Protestant house churches and the faithful of Tibetan Buddhism and Islam are all waiting for the government to honor the freedom of religion the constitution guarantees. For decades their churches were demolished and their clergy arrested; now the Vatican, too, says it is willing to establish formal diplomatic relations with Nanjing."
 roc_return.183.a: "Reopen Whampoa!"
 roc_return.183.t: "Reopening the Whampoa Military Academy"
 roc_return.183.d: "The Ministry of National Defense proposes restoring the Military Academy on its original Whampoa site on Changzhou Island in Guangzhou, bringing its motto ‘Fraternity, Love, Sincerity, Truth’ back to where it began. The gate, the headquarters building and Sun Yat-sen's former residence on the site are well preserved, and the staff and cadets of the academy at Fengshan look forward to reopening where it all started a century ago."
 roc_return.184.a: "Encourage Taiwanese firms to go west."
 roc_return.184.b: "Set limits to protect Taiwan's industry."
 roc_return.184.t: "Taiwanese Business Goes West"
 roc_return.184.d: "After the Restoration, Taiwanese entrepreneurs flock to the mainland to build factories, drawn by its market, land and labor. The Taiwan Provincial Assembly worries about the hollowing out of industry, and young Taiwanese begin looking for jobs in Shanghai and Shenzhen; the mainland provinces welcome them with open arms and compete to offer incentives."
 TAI_us_friendship: "Friendship among Allies"
 HKG_ROC.conservatism: "£TAI_conservatism Kuomintang Hong Kong General Branch"
 EA_labor_market_modifier_desc: "Much of the rural population, the hidden underemployed and migrants held back by household registration never really enter the urban labor market. This modifier applies only to mainland China and Taiwan and recalibrates itself weekly from the unemployment rate: above §Y30%§! unemployment, part of the surplus labor is taken out of the count (aiming for about 28%); below §Y22%§!, it is gradually returned. At the same time, the population absorbed by subsistence farming rises in proportion, so farm output is unaffected.\nCurrent labor force adjustment: §Y[?EA_hidden_labor_var|%1]§!"
 TAI_sov_new_neighbours: "New Sino-Russian Neighborliness"
 TAI_sov_new_neighbours_desc: "The new Chinese government declares that it inherits every obligation of the Sino-Russian Treaty of Good-Neighborliness and Friendly Cooperation. Nanjing and Moscow both know that each is the other's longest neighbor, and neither can move away."
 TAI_sov_border_demarcation: "Final Border Demarcation"
 TAI_sov_border_demarcation_desc: "The government of the Republic of China recognizes the border drawn by the 2004 Supplementary Agreement and formally gives up its claim to Outer Manchuria, in exchange for Russian concessions on Bolshoy Ussuriysky Island and navigation on the border rivers."
 TAI_sov_siberian_pipeline: "Siberian Oil and Gas Pipelines"
 TAI_sov_siberian_pipeline_desc: "The Power of Siberia pipeline extends south to Daqing, pouring Russian oil and gas into the industrial base of the Northeast. For Nanjing it is insurance against the risks of seaborne oil routes; for Moscow it is the most reliable buyer outside Europe."
 TAI_sov_yuan_ruble: "Yuan-Ruble Settlement"
 TAI_sov_yuan_ruble_desc: "The two central banks sign a currency swap agreement, and bilateral trade is settled directly in the new fabi and rubles, bypassing the dollar. Washington is not pleased, but timber traders on the border, the energy companies and the trading houses of Harbin all save a great deal on exchange costs."
 TAI_sov_far_east_development: "Far East Development Cooperation"
 TAI_sov_far_east_development_desc: "Capital and labor from the Northeast, land and resources from the Russian Far East: the two countries build cross-border economic cooperation zones together. The bridge between Heihe and Blagoveshchensk finally opens, the warehouses of Suifenhe fill with timber and soybeans, and border towns that had been quiet for years come back to life."
 TAI_sov_joint_exercises: "Joint Exercises"
 TAI_sov_joint_exercises_desc: "The National Army and the Russian Army hold a joint exercise code-named ‘Peace Mission’ on the grasslands of Inner Mongolia. No one in the Cold War could have imagined it."
 TAI_sov_northern_sea_route: "Northern Sea Route"
 TAI_sov_northern_sea_route_desc: "China and Russia develop the Northern Sea Route together, cutting the voyage from Shanghai to Rotterdam by a third and avoiding the chokepoints of Malacca and Suez. The state shipping company orders its first ice-class freighters, and the navy begins studying polar navigation."
 TAI_sov_space_cooperation: "Space Cooperation"
 TAI_sov_space_cooperation_desc: "The two countries build a lunar research station together and jointly develop a heavy-lift rocket. Russia has half a century of human spaceflight experience, and we have money and an electronics industry: cooperation between Baikonur and Jiuquan means neither country has to face American dominance in space alone."
 TAI_sov_strategic_partnership: "Comprehensive Strategic Partnership"
 TAI_sov_strategic_partnership_desc: "‘Sino-Russian relations are at their best in history.’ Now those words come from a Kuomintang president. The Father of the Nation once allied with Soviet Russia, and his successors later turned against it; this time Nanjing chooses pragmatism and becomes a full strategic partner of its northern neighbor, without compromising its sovereignty."
 TAI_sov_aigun_revisited: "Revisit the Treaty of Aigun"
 TAI_sov_aigun_revisited_desc: "The Republic of China never recognized the territory ceded under the Treaty of Aigun and the Convention of Peking, and in Nanjing's eyes the good-neighbor treaty the CCP signed in 2001 has no force. The Legislative Yuan has passed, by an overwhelming majority, a resolution calling for the Sino-Russian border to be reviewed. Moscow's response has been icy."
 TAI_sov_outer_manchuria_claim: "Claim Outer Manchuria"
 TAI_sov_outer_manchuria_claim_desc: "Vladivostok was once Haishenwai, Khabarovsk and Blagoveshchensk were once Chinese land, and the massacre of the Sixty-Four Villages East of the River is still in the textbooks. The begonia leaf in our textbooks must get back the corner that was bitten off: the government formally declares Outer Manchuria an inherent territory of the Republic of China."
 TAI_sov_tannu_uriankhai: "Claim Tannu Uriankhai"
 TAI_sov_tannu_uriankhai_desc: "Tannu Uriankhai was annexed by the Soviet Union in 1944, which the government of the Republic of China never recognized, and it has always been drawn inside the borders on Republican maps. Nanjing now restates that position: the status of Tuva must be reopened at the negotiating table between the two countries."
 TAI_sov_northern_buildup: "Northern Frontier Buildup"
 TAI_sov_northern_buildup_desc: "The National Army sets up new military districts in Heilongjiang and Jilin, builds military roads to the border and moves a number of arms factories to Harbin and Changchun. Winter on the northern frontier lasts half the year, so the troops must learn to fight at thirty below and the logistics must hold out through the whole season."
 TAI_sov_recover_lost_lands: "Recover the Lost Lands"
 TAI_sov_recover_lost_lands_desc: "A hundred and fifty years of humiliation will be settled by our generation. Diplomacy has run its course, and Moscow will not negotiate. The National Army's armored forces have massed on the border and are only waiting for Nanjing's order. It is a huge gamble, and if it pays off, the begonia leaf will be whole again."
 TAI_sov_partner: "New Sino-Russian Neighborliness"
 TAI_sov_strategic: "Comprehensive Strategic Cooperation"
 TAI_sov_revanchism: "Territorial Claims of the Republic of China"
 TAI_joint_sov_root_tt: "After the Restoration: the Republic of China has completed the focus ‘New China Diplomacy’ and is not at war with Russia"
 TAI_joint_roc_or_sov_tt: "Started by the Republic of China or Russia (completed by both together)"
 TAI_sov_space_tt: "Sino-Russian Space Cooperation"
 TAI_fr_xj_fund: "Southern Xinjiang Development Fund"
 TAI_fr_xj_fund_desc: "Set up development zones in Kashgar and Hotan and build waterworks and roads, so the farmers of southern Xinjiang share in the economic growth after the Restoration.\n\n§YXinjiang§! integration progress: §G[?TAI_fr_xj|0]§!/100 (this decision §G+6§!)"
 TAI_fr_xj_talks: "Uyghur Autonomy Consultative Conference"
 TAI_fr_xj_talks_desc: "Invite Uyghur religious leaders, intellectuals and exile groups home to negotiate a Xinjiang Autonomy Act.\n\n§YXinjiang§! integration progress: §G[?TAI_fr_xj|0]§!/100 (this decision §G+8§!)"
 TAI_fr_xj_corps: "Reform the Production and Construction Corps"
 TAI_fr_xj_corps_desc: "Demilitarize the Xinjiang Production and Construction Corps and turn it into local state enterprises, gradually returning Corps land to local farmers and herders.\n\n§YXinjiang§! integration progress: §G[?TAI_fr_xj|0]§!/100 (this decision §G+5§!)"
 TAI_fr_tb_dialogue: "Dialogue with the Dalai Lama"
 TAI_fr_tb_dialogue_desc: "The Presidential Office sends an envoy to Dharamsala to discuss the conditions for the Dalai Lama's return to Lhasa and the concrete arrangements for ‘a high degree of autonomy’.\n\n§YTibet§! integration progress: §G[?TAI_fr_tb|0]§!/100 (this decision §G+10§!)"
 TAI_fr_tb_religion: "Religious Freedom in Tibetan Areas"
 TAI_fr_tb_religion_desc: "Abolish the CCP-era ‘patriotic education’ in monasteries and the caps on the number of monks and nuns, and restore the monasteries' self-management.\n\n§YTibet§! integration progress: §G[?TAI_fr_tb|0]§!/100 (this decision §G+6§!)"
 TAI_fr_tb_railway: "Qinghai-Tibet Development"
 TAI_fr_tb_railway_desc: "Extend the Qinghai-Tibet Railway and the Sichuan-Tibet Highway, while setting up an ecological protection fund for Tibetan areas.\n\n§YTibet§! integration progress: §G[?TAI_fr_tb|0]§!/100 (this decision §G+5§!)"
 TAI_fr_im_league: "Restore the League and Banner System"
 TAI_fr_im_league_desc: "Keep the provinces and counties, but restore Mongol self-government through leagues and banners, with each banner electing a jasag to sit in the local assemblies.\n\n§YInner Mongolia§! integration progress: §G[?TAI_fr_im|0]§!/100 (this decision §G+8§!)"
 TAI_fr_im_grassland: "Grassland Ecological Compensation"
 TAI_fr_im_grassland_desc: "Pay compensation to herders who return grazing land to grass, halting the desertification of the steppe.\n\n§YInner Mongolia§! integration progress: §G[?TAI_fr_im|0]§!/100 (this decision §G+6§!)"
 TAI_fr_im_hulunbuir: "Develop Hulunbuir"
 TAI_fr_im_hulunbuir_desc: "Develop the border crossings and mines of Manzhouli and Hulunbuir to bring jobs to young Mongols.\n\n§YInner Mongolia§! integration progress: §G[?TAI_fr_im|0]§!/100 (this decision §G+5§!)"
 TAI_fr_xj_add_tt: "§YXinjiang§! integration progress §G+[?fr_d|0]§! (currently [?TAI_fr_xj|0]/100)"
 TAI_fr_tb_add_tt: "§YTibet§! integration progress §G+[?fr_d|0]§! (currently [?TAI_fr_tb|0]/100)"
 TAI_fr_im_add_tt: "§YInner Mongolia§! integration progress §G+[?fr_d|0]§! (currently [?TAI_fr_im|0]/100)"
 roc_return.161.t: "Xinjiang Integrated"
 roc_return.161.d: "A year after the Xinjiang Autonomy Act took effect, the regional assembly of Uyghur, Kazakh and Han delegates is working smoothly, the mosques have reopened and the re-education camps are all closed. The bazaars of Kashgar are bustling again, and both sides of the Tianshan finally enjoy a long-absent calm."
 roc_return.161.a: "Five races under one union; the world belongs to all."
 roc_return.164.t: "Unrest in Southern Xinjiang"
 roc_return.164.d: "A dispute over repairs to a mosque in Kashgar turns into street clashes; an angry crowd chants slogans demanding ‘real autonomy’ and storms a local police station. The wounds of the CCP era have not healed, and many Uyghurs are wary of any government from Beijing or Nanjing. The government must respond with care."
 roc_return.164.a: "Send in the police to restore order."
 roc_return.164.b: "Send a negotiating delegation to Kashgar."
 roc_return.162.t: "Reconciliation on the Roof of the World"
 roc_return.162.d: "The Dalai Lama presides over his first ceremony in the Potala Palace since his return, and hundreds of thousands of Tibetans come from far and wide to pay homage. The arrangements for Tibet's high degree of autonomy are in place: monasteries run their own affairs, Tibetan-language education is restored and exiles are coming home. The land of snows becomes an inseparable and willing part of the Republic of China."
 roc_return.162.a: "Five races under one union; the world belongs to all."
 roc_return.165.t: "Protests in Lhasa"
 roc_return.165.d: "Hundreds of monks sit in before the Jokhang Temple, demanding that the government honor its promises to the Dalai Lama: speed up the autonomy talks and free the monks and nuns still detained. Tourists and police ring the square, and monasteries across the Tibetan areas are watching Nanjing's response closely. Handled badly, the tragedy of 2008 could repeat itself."
 roc_return.165.a: "Disperse them lawfully and keep order."
 roc_return.165.b: "Meet the petitioners and promise faster negotiations."
 roc_return.163.t: "A New Life for the Steppe"
 roc_return.163.d: "The autonomy of the leagues and banners works alongside the province and county system, desertification from overgrazing and mining is gradually checked, and the grassland begins to recover. Mongolian-language schools reopen, and cheers for the horse races and wrestling ring out at the Naadam festival; Mongol and Han compatriots in Inner Mongolia build up this vast northern frontier together."
 roc_return.163.a: "Five races under one union; the world belongs to all."
 roc_return.166.t: "Protests on the Steppe"
 roc_return.166.d: "A herder is run over and killed while trying to stop a mining truck from crossing his grazing land, and the video spreads fast online. Mongol students in Xilingol take to the streets, demanding that those responsible be punished and that the mines polluting the grassland be closed. A similar incident in 2011 set off mass protests, and the government must decide how to respond."
 roc_return.166.a: "Impose martial law and punish the troublemakers severely."
 roc_return.166.b: "Halt work, investigate and compensate the herders."
 TAI_frontier_category: "Five Races Under One Union · Frontier Integration"
 TAI_frontier_category_desc: "‘Five Races Under One Union’ is a founding principle of the Republic of China. Deep grievances built up in Xinjiang, Tibet and Inner Mongolia under the CCP, and we must win over their peoples with autonomy, development and religious freedom.\n\nIntegration progress by region:\n - §YXinjiang§!: §G[?TAI_fr_xj|0]§!/100\n - §YTibet§!: §G[?TAI_fr_tb|0]§!/100\n - §YInner Mongolia§!: §G[?TAI_fr_im|0]§!/100\n\n§LThe lower the progress, the higher the local garrison needs, resistance and factory losses. While stability is above 50%, progress rises by 0.3 each month; integration is complete at 100.§!"
 TAI_frontier_xj_modifier: "Xinjiang: Integration Incomplete"
 TAI_frontier_xj_modifier_desc: "Integration of Xinjiang is not yet complete: Uyghurs and Kazakhs remain wary of the new government, affecting garrison requirements, resistance and compliance. Integration can be advanced through the ‘Five Races Under One Union · Frontier Integration’ decisions and related focuses and events; once complete, this modifier disappears."
 TAI_frontier_tb_modifier: "Tibet: Integration Incomplete"
 TAI_frontier_tb_modifier_desc: "Integration of Tibet is not yet complete: Tibetans are waiting for the promise of autonomy to be kept, and the monasteries and people are still watching the new government, affecting garrison requirements, resistance and compliance. Integration can be advanced through the ‘Five Races Under One Union · Frontier Integration’ decisions and related focuses and events; once complete, this modifier disappears."
 TAI_frontier_im_modifier: "Inner Mongolia: Integration Incomplete"
 TAI_frontier_im_modifier_desc: "Integration of Inner Mongolia is not yet complete: the grassland's ecology and the Mongols' cultural rights remain sensitive issues, affecting garrison requirements, resistance and compliance. Integration can be advanced through the ‘Five Races Under One Union · Frontier Integration’ decisions and related focuses and events; once complete, this modifier disappears."
 ### v3.20 韩国、菲律宾与越南的国策
 TAI_ext_kor_nuclear_alarm: "Concern over Korean Nuclear Arms"
 TAI_ext_kor_roc_ties: "Korea-ROC Friendship"
 TAI_ext_kor_thaad: "Anger over THAAD Deployment"
 TAI_ext_kor_umbrella: "Nuclear Sharing Ally"
 KORX_demographic_policy: "Population Policy"
 KORX_demographic_policy_desc: "The Population Policy Committee has coordinated birth subsidies, public childcare and housing supply, and the fall in the birth rate has started to slow."
 KORX_independent_deterrent_idea: "Independent Nuclear Deterrent"
 KORX_independent_deterrent_idea_desc: "South Korea has left the Non-Proliferation Treaty to build its own nuclear deterrent. National morale is high, but the international pressure is immense."
 KORX_nuclear_sharing_idea: "Nuclear Sharing"
 KORX_nuclear_sharing_idea_desc: "The United States has deployed tactical nuclear weapons in South Korea, the two allies plan nuclear operations together, and their joint defense is closer than ever."
 KORX_k_defense_idea: "K-Defense Export System"
 KORX_k_defense_idea_desc: "From the K9 self-propelled howitzer to the FA-50 light fighter, South Korea's defense exports have built a steady stream of orders and a supply chain. Economies of scale in the defense industry make the national army's equipment cheaper and faster to deliver, and export earnings drive research and tax revenue."
 KORX_new_republic_idea: "The Seventh Republic"
 KORX_new_republic_idea_desc: "The new constitution sets new rules for checks and balances and presidential terms, and the political system enters a new stage. The ‘imperial presidency’ is history, and the National Assembly and local governments hold more power; politics is more stable and government more effective."
 KORX_green_shipbuilding_idea: "Green Shipbuilding"
 KORX_green_shipbuilding_idea_desc: "Orders for LNG carriers, ammonia-powered ships and smart vessels fill Korean shipyards' books for years to come. The docks of Geoje and Ulsan run at full speed, and high-value ships bring the country substantial foreign exchange and tax revenue."
 KORX_hallyu_idea: "A Nation Built on the Korean Wave"
 KORX_hallyu_idea_desc: "Korean Wave content and tourism have become new engines of growth, and soft power brings in trade and tourist income."
 KORX_tb_latency: "Nuclear Fuel Cycle Technology"
 KORX_tb_peaceful: "Civilian Nuclear Technology"
 KORX_tb_hyunmoo: "Hyunmoo Missile Technology"
 KORX_tb_kamd: "Air Defense Missile Technology"
