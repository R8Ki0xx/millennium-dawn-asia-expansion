 TAI_five_yuan_modifier: "Five Yuan Policy"
 TAI_five_yuan_modifier_desc: "The heads of the Executive, Legislative, Judicial, Examination and Control Yuan together determine how well the government works: political power, stability, research speed and construction speed all change with the combination of heads. The heads can be replaced through the ‘Government of the ROC · The Five Yuan’ decisions."
 TAI_gov_vote_pass_tt: "The ruling coalition has a majority in the Legislative Yuan, so the confirmation vote §Gwill pass§!."
 TAI_gov_vote_risky_tt: "The ruling coalition §Rlacks a majority§! in the Legislative Yuan, so the confirmation vote has a §R45%§! chance of failing."
 TAI_gov.1.t: "Nominate the Premier"
 TAI_gov.1.d: "The current Premier is §Y[TAI_gov_premier_name]§! ([TAI_gov_premier_party]). Under the constitution, the Premier is nominated by the President and appointed with the consent of the Legislative Yuan. The Presidential Office is weighing a new head of cabinet: each candidate represents a different political line and will bring different policy priorities. Under a minority government the nominee must also win enough support among legislators, or risk being voted down."
 TAI_gov.1.keep: "Keep the current Premier."
 TAI_gov.2.t: "The Legislative Yuan Rejects the Premier"
 TAI_gov.2.d: "The Legislative Yuan has narrowly rejected the President's nominee for Premier. The opposition holds a press conference outside the chamber, calling it ‘a victory for the will of the people’; the ruling party accuses it of opposing for opposition's sake and leaving the government paralyzed. The Presidential Office must decide whether to put forward someone the opposition can accept, or dissolve the Legislative Yuan and take the question to the voters."
 TAI_gov.2.a: "Nominate someone else."
 TAI_gov.2.b: "Dissolve the Legislative Yuan and appeal to the people!"
 TAI_gov.3.t: "Legislative Elections"
 TAI_gov.3.d: "The results of the election for the [?TAI_ly_term|0]th Legislative Yuan are in: Kuomintang [?TAI_ly_kmt|0] seats, China Democracy Party [?TAI_ly_dp|0], Revolutionary Committee [?TAI_ly_sd|0], People First Party [?TAI_ly_pfp|0], Communist Party of China [?TAI_ly_cpc|0], independents and others [?TAI_ly_other|0]. The governing coalition holds [?TAI_ly_gov|0] seats in all. There is cheering in some party headquarters and tears in others, and the new parliament will set the course of government for the next few years."
 TAI_gov.3.a: "The new Legislative Yuan takes office."
 TAI_gov.4.t: "No-Confidence Motion"
 TAI_gov.4.d: "The opposition has tabled a motion of no confidence in Premier §Y[TAI_gov_premier_name]§! in the Legislative Yuan, and it has passed by a majority. Bringing down a cabinet is rare in the history of the constitution; the stock market falls at once and the media run special programs through the night. Under the constitution, the Premier must resign with his cabinet, or ask the President to dissolve the Legislative Yuan and let the voters have the final word."
 TAI_gov.4.a: "The Premier and the cabinet resign."
 TAI_gov.4.b: "Ask the President to dissolve the Legislative Yuan and hold new elections."
 TAI_gov_nominate_premier: "Nominate the Premier"
 TAI_gov_nominate_premier_desc: "The President nominates a new Premier, subject to the consent of the Legislative Yuan. The Premier heads the government and forms the cabinet; under a minority government, the nominee often has to be negotiated with the opposition to get through."
 TAI_gov_dissolve_ly: "Dissolve the Legislative Yuan"
 TAI_gov_dissolve_ly_desc: "Under a minority government, the Premier may ask the President to dissolve the Legislative Yuan and call early elections. It is the last resort for breaking a deadlock: if the voters back the government, the new parliament will let it govern smoothly; if it loses, its position will only get harder."
 TAI_gov_lobby_legislators: "Lobby Legislators"
 TAI_gov_lobby_legislators_desc: "Party whips and ministers without portfolio call on independent and opposition legislators one by one, trading local project funds and committee seats for their support."
 TAI_gov_lobby_legislators_tt: "The ruling party gains §G+2 to 6§! seats in the Legislative Yuan (independents first, then defectors from the largest opposition party)"
 TAI_gov_political_deal: "Political Deal"
 TAI_gov_political_deal_desc: "Strike a backroom deal with an opposition faction: ministerial posts, special budgets and district boundaries in exchange for a bloc of legislators switching to the ruling party."
 TAI_gov_political_deal_tt: "The ruling party gains §G+6 to 12§! seats in the Legislative Yuan (independents first, then defectors from the largest opposition party)"
