 roc_return.81.t: "CCP Uprising"
 roc_return.81.d: "Armed uprisings break out simultaneously across the Northeast and North China. The CCP remnants declare that ‘the People's Republic of China has not perished’ and call on the whole nation to overthrow the Nationalist government. Laid-off workers, former PLA soldiers and underground party members seize police stations and arsenals, and Shenyang, Changchun and Harbin fall one after another. The third Chinese civil war has begun."
 roc_return.81.a: "Suppress the rebellion and save the nation!"
 roc_return.82.t: "The Third Chinese Civil War Breaks Out"
 roc_return.82.d: "A large-scale armed uprising has broken out in China's Northeast, and the CCP remnants have announced the restoration of the government of the People's Republic of China. The Nationalist Government has declared a nationwide period of suppressing the rebellion. A civil war spanning a century has broken out for the third time."
 roc_return.82.a: "China's civil war is still not over."
 roc_return.83.t: "Uprising in the Northeast"
 roc_return.83.d: "In the industrial cities and mountains of the Northeast, tens of thousands of workers, laid-off employees and former PLA soldiers answer the Central Committee's call and take up arms. The steelworks of Anshan switch to making guns, and guerrilla camps reappear in the forests of Changbai Mountain; once again the Northeast becomes a base for revolution."
 roc_return.83.a: "The revolution is not yet complete; comrades, keep up the fight!"
 roc_return.85.t: "Victory for the People's Republic"
 roc_return.85.d: "The Nationalist government has surrendered. The five-star red flag rises once more over the Gate of Heavenly Peace, and Chang'an Avenue fills with marching crowds and PLA tanks.\n\nThe Kuomintang remnants withdraw to Taiwan, and the Taiwan Strait is once again the line between the two sides. The People's Republic of China is back; history seems to have come full circle."
 roc_return.85.a: "The Chinese people have stood up!"
 roc_return.86.t: "The People's Republic of China Is Restored"
 roc_return.86.d: "The Communist Party of China has won the third Chinese civil war and re-established the People's Republic of China. The Nationalist government has again retreated to Taiwan, and the two sides of the Strait are divided once more. Governments everywhere are reassessing their China policies, and many who supported the Nationalist government during the Restoration have been forced into exile."
 roc_return.86.a: "History has come back to where it started."
 roc_return.87.t: "The Government Retreats to Taiwan Again"
 roc_return.87.d: "The mainland has been lost once again. The Nationalist government and the remnants of the National Army withdraw to Taiwan, and the docks of Keelung and Kaohsiung are crowded with retreating soldiers and refugees, just as in 1949. In Taipei the President declares: ‘We will return.’ But this time, how many still believe it?"
 roc_return.87.a: "Counterattack on the mainland. We will never give up."
 roc_return.88.t: "The Rebellion Is Crushed"
 roc_return.88.d: "The National Army has completely defeated the armed CCP remnants, and the last guerrillas surrender in the forests of Changbai Mountain and the Greater Khingan. The Northeast and North China return to Republic of China control, the railways run again and the factories reopen. The period of suppressing the rebellion is finally over, and the nation can concentrate on reconstruction and constitutional government."
 roc_return.88.a: "Long live the Republic of China!"

 ### v3.5 assembly
 TAI_national_assembly_modifier: "National Assembly"
 TAI_national_assembly_modifier_desc: "How much the National Assembly supports the government."
 TAI_dec_na_session: "Convene a Regular Session of the National Assembly"
 TAI_dec_na_session_desc: "The government presents its annual policy report to the National Assembly."
 TAI_dec_na_lobby: "Court Local Delegates"
 TAI_dec_na_lobby_desc: "Trade local projects and appointments for the support of independent delegates. The National Assembly has many independent local delegates who care about their hometowns' roads, schools and jobs; the ruling party wins their votes on key questions with these promises."
 TAI_dec_amend_direct_election: "Amendment: Direct Presidential Elections"
 TAI_dec_amend_direct_election_desc: "The President and Vice President are to be elected directly by the whole people. The constitutional amendment of 1994 led to Taiwan's first direct presidential election in 1996; now the reform is extended to all of China, letting 1.4 billion citizens choose their head of state with their own hands."
 TAI_dec_amend_local_autonomy: "Amendment: Local Self-Government"
 TAI_dec_amend_local_autonomy_desc: "Write provincial and county self-government into the constitution and use institutions to defuse regional separatism. Governors and county heads are elected by the people, provincial assemblies have legislative power, and local affairs are decided locally; with a legitimate stage, local strongmen no longer need to resist the center by force."
 TAI_dec_amend_five_yuan: "Amendment: Five Yuan Reform"
 TAI_dec_amend_five_yuan_desc: "Clarify the powers of the Five Yuan and sharpen the division of labor between the Executive and Legislative Yuan. The old system was criticized as a confused ‘dual executive’ with five tangled powers, and whom the Premier answered to was often disputed; after amendment each Yuan does its own job, and government runs more smoothly."
 TAI_dec_amend_virtualize: "Amendment: Suspend the National Assembly"
 TAI_dec_amend_virtualize_desc: "Turn the National Assembly into an ad hoc body and hand the power to amend the constitution back to the people by referendum. The Assembly meets only for major questions such as constitutional amendments or changes of territory and otherwise stands down; politics becomes leaner, and the people hold the final say on amending the constitution directly."
 TAI_na_support_50_tt: "The ruling coalition has at least §Y50%§! support in the National Assembly"
 TAI_na_support_66_tt: "The ruling coalition has at least §Y66.7%§! support in the National Assembly (the threshold for amendments)"
 TAI_na_session_pass_tt: "§GThe policy report is approved§!"
 TAI_na_session_fail_tt: "§RThe National Assembly rejects the policy report§!"
 TAI_na_bonus_tt: "Ruling coalition seats"
 TAI_na_virtualize_tt: "The National Assembly's influence on the government is §Yhalved§!"
 TAI_na_reelect_tt: "§YNational Assembly delegates§! are re-elected according to current party support"
 TAI_na_recall_a_tt: "The ruling party steps down, and the §Ylargest party in the National Assembly§! forms the cabinet"
 TAI_na_recall_b_tt: "The National Assembly is dissolved, and delegates are §Yre-elected§! according to current party support"
 TAI_amend_direct_election_idea: "Direct Presidential Elections"
 TAI_amend_direct_election_idea_desc: "The President is elected directly by the whole people. Direct election gives the President the strongest possible mandate, and politicians must face the voters directly; the spirit of democracy takes root across the nation, and the government's policies carry greater legitimacy."
 TAI_amend_five_yuan_idea: "Five Yuan Reform"
 TAI_amend_five_yuan_idea_desc: "The powers of the Five Yuan are clearly defined and they work smoothly. Constitutional amendment clarifies the relationship between the Executive and Legislative Yuan, and the Examination and Control Yuan are slimmed down and strengthened; government no longer spins its wheels over quarrels among the Five Yuan."
 roc_return.90.t: "Recall Crisis"
 roc_return.90.d: "For three straight months the National Assembly has refused to back the government, and budgets, bills and appointments are all stuck on the floor. The opposition parties jointly table a recall motion, protesters gather in front of the Presidential Palace, and the media call it the worst constitutional crisis since the Restoration. The government must choose between rallying its caucus to defeat the motion, resigning with the cabinet, or dissolving the Assembly."
 roc_return.90.a: "The cabinet resigns. The largest party in the Assembly forms a new one."
 roc_return.90.b: "Dissolve the National Assembly and appeal to the people."
 ### v3.8 开局界面与 AI 行为
 TAI_MILLENNIUM_DAWN_DESC: "Founded in 1912, the Republic of China was the first democratic republic in Asia. After losing the Chinese Civil War in 1949, the Nationalist Government moved to Taiwan and carried on its constitutional orthodoxy in Taiwan, Penghu, Kinmen and Matsu. Over half a century, Taiwan produced a celebrated economic miracle and a democratic transition, joining the ‘Four Asian Tigers’, and its semiconductor industry leads the world.\n\nThe 2000 presidential election is close at hand, and the Kuomintang's long rule faces a serious challenge. Missiles across the Strait are still aimed at Taiwan, and Washington's commitment blows hot and cold. At the crossroads of a new millennium, will the Republic of China guard Taiwan and keep the status quo, or take up again the unfinished mission to restore China?"
 TAI_AI_BEHAVIOR: "@TAI Republic of China (Taiwan)"
 RULE_OPTION_TAI_HISTORICAL: "Historical: Maintain the Status Quo"
 RULE_OPTION_TAI_HISTORICAL_DESC: "The Republic of China follows the historical path: Taiwan first, the status quo, and deeper cross-Strait trade. It will §Rnever§! counterattack the mainland."
 RULE_OPTION_TAI_RETURN: "Restoration by Force"
 RULE_OPTION_TAI_RETURN_DESC: "The Republic of China upholds its constitutional orthodoxy, restarts Project National Glory and will §Ycounterattack the mainland§! when the time is right."
 RULE_OPTION_TAI_PEACEFUL: "Peaceful Unification"
 RULE_OPTION_TAI_PEACEFUL_DESC: "The Republic of China upholds its constitutional orthodoxy but aims for §Ycross-Strait peaceful unification talks§! and will not start a war itself."
 RULE_OPTION_TAI_NO_PATH_DESC: "The AI chooses its focuses freely. If §Y‘AI uses historical focuses’§! was ticked at game start, the Republic of China takes the historical path (maintain the status quo)."
 ### v3.9 阵营与港澳
 TAI_ROC_ALLIANCE: "Asia-Pacific Democratic Alliance"
 TAI_nato_exists_tt: "A NATO faction exists (a faction led by a NATO member)"
 TAI_join_nato_tt: "§YJoin the North Atlantic Treaty Organization§!: gain the ‘NATO Member’ spirit, join the NATO faction and the NATO technology sharing group, and improve mutual opinion with every member."
 TAI_asia_pacific_nato_tt: "Invite §YJapan, South Korea and the Philippines§! to join NATO."
 TAI_invite_neighbors_tt: "Invite §YSouth Korea, Singapore, the Philippines, Mongolia and Vietnam§! to join the Asia-Pacific Democratic Alliance (those not already in another faction)."
 TAI_hkg_tree_tt: "Hong Kong will load the §Y‘Hong Kong Special Administrative Region of the Republic of China’§! focus tree and be governed by the Kuomintang Hong Kong General Branch."
 TAI_joint_root_tt: "The restored Republic of China has completed ‘New China Diplomacy’, and the Republic of China and North Korea are not at war"
 TAI_joint_roc_or_nko_tt: "Started by the Republic of China or North Korea (the restored Republic of China)"
 TAI_joint_roc_only_tt: "Only the Republic of China can start this focus"
 TAI_hk_macau_category: "The Hong Kong and Macau Question"
 TAI_hk_macau_category_desc: "Under the CCP, Hong Kong and Macau were run under ‘one country, two systems’. Now that the mainland is restored, we will decide the future of these two pearls of the Orient: keep their high autonomy, integrate them gradually, or take them back outright."
 TAI_dec_hkg_sovereignty: "Assert Sovereignty over Hong Kong"
 TAI_dec_mac_sovereignty: "Assert Sovereignty over Macau"
 TAI_dec_hkg_autonomy: "Hong Kong: Keep High Autonomy"
 TAI_dec_mac_autonomy: "Macau: Keep High Autonomy"
 TAI_dec_hkg_integrate: "Hong Kong: Gradual Integration"
 TAI_dec_mac_integrate: "Macau: Gradual Integration"
 TAI_dec_hkg_reclaim: "Hong Kong: Take It Back Outright"
 TAI_dec_mac_reclaim: "Macau: Take It Back Outright"
 TAI_dec_hkg_sovereignty_desc: "Demand that Hong Kong recognize the Republic of China as its sovereign and become a special administrative region of the Republic of China."
 TAI_dec_mac_sovereignty_desc: "Demand that Macau recognize the Republic of China as its sovereign and become a special administrative region of the Republic of China."
 TAI_dec_hkg_autonomy_desc: "Keep Hong Kong's free port, common law and separate customs territory, with the Kuomintang Hong Kong General Branch in charge."
 TAI_dec_mac_autonomy_desc: "Keep Macau's gaming industry and free economy, and let Macau continue with a high degree of autonomy. Its gaming taxes and tourism income will keep flowing into the treasury, and Macau's residents will look kindly on the new government; it is a choice where both sides win."
 TAI_dec_hkg_integrate_desc: "Spend a year unifying the legal, monetary and administrative systems. After that, Hong Kong merges into the Republic of China proper."
 TAI_dec_mac_integrate_desc: "Spend a year unifying the legal, monetary and administrative systems. After that, Macau merges into the Republic of China proper."
 TAI_dec_hkg_reclaim_desc: "Revoke Hong Kong's SAR status at once and take it back directly. It would settle the Hong Kong question once and for all, but it would break the promise made to Hong Kong people; Britain and America will surely protest strongly, and international capital may flee the city."
 TAI_dec_mac_reclaim_desc: "Revoke Macau's SAR status at once and take it back directly. Macau is far smaller than Hong Kong, and reabsorbing it meets less resistance; but Britain and America will surely protest strongly, and Portugal will express its regret."
 TAI_nato_standards_idea: "NATO Standardization"
 TAI_nato_standards_idea_desc: "The National Army has fully adopted NATO standards. With ammunition calibers, communications protocols and doctrine unified with its allies, training time falls and the units' organization and experience build up more efficiently; the National Army can fight side by side with its allies at any time."
 TAI_alliance_leader_idea: "Leader of the Alliance"
 TAI_alliance_leader_idea_desc: "The Republic of China leads the Asia-Pacific Democratic Alliance. As its leader, Nanjing has the loudest voice in regional affairs, and trade preferences among the members benefit China's economy greatly."
 TAI_asian_order_idea: "A New Asian Order"
 TAI_asian_order_idea_desc: "A new Asian order centered on Nanjing has taken shape. The nations of Asia cooperate closely on security, the economy and technology, and the region's peace and prosperity are institutionally guaranteed; China's political prestige and research strength reach new heights."
 TAI_hkg_sar_dividend_idea: "Hong Kong SAR Dividend"
 TAI_hkg_sar_dividend_idea_desc: "Hong Kong's finance and trade bring the nation rich returns. Its capital markets raise money for building the mainland, its entrepôt trade sells Chinese goods all over the world, and the SAR's prosperity raises the government's prestige."
 TAI_mac_sar_dividend_idea: "Macau SAR Dividend"
 TAI_mac_sar_dividend_idea_desc: "Macau's gaming taxes fill the treasury. Macau's annual gaming revenue exceeds that of Las Vegas, and the taxes and surpluses the SAR government hands over give the central government a steady income and raise its prestige."
 TAI_hkg_roc_sar_idea: "Hong Kong SAR of the Republic of China"
 TAI_hkg_roc_sar_idea_desc: "Hong Kong enjoys a high degree of autonomy under the Kuomintang Hong Kong General Branch. The common law, the free port and an independent judiciary are preserved, and residents gradually come to trust the new government; stability in the SAR lets the central government concentrate on the mainland."
 TAI_mac_roc_sar_idea: "Macau SAR of the Republic of China"
 TAI_mac_roc_sar_idea_desc: "Macau enjoys a high degree of autonomy. Its gaming industry and free economy are preserved, and Portuguese legal tradition and Chinese culture coexist harmoniously in the small city; the SAR's stability and prosperity bring Macau substantial tax revenue."
 TAI_sar_integration_idea: "Integration Pains"
 TAI_sar_integration_idea_desc: "Integrating the legal, currency and administrative systems causes social unrest. After direct reabsorption the common law is abolished, the Hong Kong dollar merges with the national currency and the civil service is reorganized, and many residents and companies fear for the future; capital flight and emigration return."
 TAI_sar_crackdown: "Forced Takeover of the SARs"
 roc_return.95.t: "An Invitation from the Asia-Pacific Democratic Alliance"
 roc_return.95.d: "The government of the Republic of China formally invites us to join the Asia-Pacific Democratic Alliance led by Nanjing. Nanjing promises collective defense, trade preferences and technology cooperation, and guarantees respect for each member's sovereignty and internal affairs. Joining would bring security and prosperity, but it would also tie us to this rising power and cost us some diplomatic room to maneuver."
 roc_return.95.a: "We are willing to join."
 roc_return.95.b: "We will remain neutral."
 roc_return.96.t: "Joining NATO Together"
 roc_return.96.d: "The Republic of China, already a NATO member, invites us to join the North Atlantic Treaty Organization with it and build collective defense in the Asia-Pacific. Article 5's protection would extend to the western Pacific, but joining also means taking on the obligations of collective defense; Moscow and others express strong displeasure."
 roc_return.96.a: "Join NATO."
 roc_return.96.b: "Not for now."
 roc_return.97.t: "Nanjing's Demand"
 roc_return.97.d: "The government of the Republic of China demands that [Root.GetName] recognize it as sovereign and become a special administrative region of the Republic of China, promising to preserve the existing social system and way of life: our laws, currency and free economy would remain, with a high degree of autonomy and no time limit. Accepting would avoid conflict; refusing could bring a hard response from Nanjing."
 roc_return.97.a: "Accept the sovereignty of the Republic of China."
 roc_return.97.b: "Refuse."
 roc_return.98.t: "[From.GetName] Rejects Our Demand"
 roc_return.98.d: "[From.GetName] refuses to recognize the sovereignty of the Republic of China and insists on keeping its present status. Its politicians declare they do not want to pass from one regime's rule to another's. We can set the matter aside for now and wait for a better moment, or resort to force, though the international reaction would be severe."
 roc_return.98.a: "Set it aside for now."
 roc_return.98.b: "Even if it means war."
 HKG_ROC.conservatism_desc: "Conservatism - Kuomintang Hong Kong General Branch\n\nThe Kuomintang's organization in Hong Kong, led directly from Nanjing after the Restoration. It stands for ‘One Country, Two Systems, and the Three Principles of the People’, and sees its duty as preserving Hong Kong's prosperity, stability and free economy."
 TAI_bloc_question: "Choosing a Bloc"
 TAI_bloc_question_desc: "The restored Republic of China is now a great power that carries real weight. Do we stand with the Western democracies and join the North Atlantic Treaty Organization, or lead an Asian bloc of our own from Nanjing?"
 TAI_west_alignment: "Walk with the West"
 TAI_west_alignment_desc: "Liberal democracy is the founding principle of the Republic of China. We will stand with the US, Europe and Japan to defend the rules-based international order. The anti-communist ally of the Cold War returns to the Western camp as a great democracy, the biggest realignment of the twenty-first century."
 TAI_nato_partnership: "NATO Partnership"
 TAI_nato_partnership_desc: "Before formally joining, take part in NATO's technology and intelligence cooperation as a Major Non-NATO Ally. Japan, South Korea and Australia all hold this status; National Army officers begin attending NATO exercises and staff courses, and the military's equipment begins moving toward NATO standards."
 TAI_nato_standards: "NATO Standardization"
 TAI_nato_standards_desc: "Reorganize the forces to NATO standards and unify ammunition calibers and communication protocols so the National Army can fight seamlessly alongside its allies. Russian-pattern and domestic equipment inherited from the PLA is gradually retired, and 5.56 and 7.62 mm NATO rounds replace the old calibers; it is a costly but unavoidable transformation."
 TAI_join_nato: "Join NATO"
 TAI_join_nato_desc: "The Republic of China becomes a full member of the North Atlantic Treaty Organization. From now on, Nanjing shares the duty of collective defense with Washington, London and Paris."
 TAI_asia_pacific_nato: "An Asia-Pacific NATO"
 TAI_asia_pacific_nato_desc: "NATO's collective defense should not stop at the Atlantic. The Republic of China will invite Japan, South Korea and the Philippines to join with it, extending Article 5 to the western Pacific; it is the strongest deterrent to Russia and North Korea, and gives Washington its most powerful partner in Asia."
 TAI_asian_concert: "The Concert of Asia"
 TAI_asian_concert_desc: "Asia's affairs should be decided by Asians. The Republic of China will rally its neighbors, South Korea, Mongolia, Vietnam and Southeast Asia, through economic and diplomatic influence. It is not a revival of the tributary system but an Asian version of the nineteenth-century Concert of Europe, with large and small states consulting on regional affairs as equals."
 TAI_found_alliance: "Found the Asia-Pacific Democratic Alliance"
 TAI_found_alliance_desc: "Found an alliance centered on Nanjing to safeguard peace, democracy and prosperity in the Asia-Pacific. Its headquarters are in Nanjing, and members pledge collective defense, democratic government and free trade; it neither depends on America nor opposes it, but is Asia's own security architecture."
 TAI_invite_neighbors: "Invite Our Neighbors"
 TAI_invite_neighbors_desc: "Send formal invitations to South Korea, Singapore, the Philippines, Mongolia and Vietnam. Each has its own concerns: Seoul worries about its alliance with the US, Hanoi about old grudges, Ulaanbaatar about being swallowed up. Foreign ministers shuttle between capitals to dispel the doubts one by one."
 TAI_alliance_army: "Allied Forces"
 TAI_alliance_army_desc: "Alliance members hold regular joint exercises and build a unified command system and intelligence-sharing network. Annual drills in the South China Sea, the Yellow Sea and the East China Sea familiarize each nation's forces with the others' equipment and tactics; the combined forces headquarters is in Nanjing, with command rotating among the members."
 TAI_asian_order: "A New Asian Order"
 TAI_asian_order_desc: "The Asia-Pacific Democratic Alliance has become a world pole alongside NATO and the SCO. From Seoul to Jakarta its members account for a third of the world economy; for the first time Asia has its own collective security organization and no longer needs the protection of any outside power."
 ### v3.10 国民大会与派系平衡
 TAI_roc_faction_balance: "Factional Balance"
 TAI_roc_old_guard: "The Taiwan Old Guard"
 TAI_roc_newcomers: "Mainland Newcomers"
 TAI_roc_old_guard_desc: "The Kuomintang veterans, generals and technocrats who came with the government from Taiwan. They hold the key posts in the party, the army and the economy."
 TAI_roc_newcomers_desc: "Local figures from the mainland, defecting generals and newly joined intellectuals brought in after the Restoration. They know the provinces well but keep Nanjing at arm's length."
 TAI_roc_bop_shared_rule: "Shared Rule of the Factions"
 TAI_roc_bop_old_guard_rule: "The Old Guard Governs"
 TAI_roc_bop_taipei_clique: "The Taipei Clique Monopolizes Power"
 TAI_roc_bop_mainland_rise: "Rise of the Mainlanders"
 TAI_roc_bop_local_strongmen: "Local Factions Grow Strong"
 TAI_roc_bop_category: "Factional Balance"
 TAI_roc_bop_category_desc: "The balance of power between the Taiwan old guard and the mainland newcomers shapes how the government rules and how far the provinces obey."
 TAI_dec_bop_promote_old_guard: "Promote the Taiwan Old Guard"
 TAI_dec_bop_promote_old_guard_desc: "Give important posts to veteran cadres who have served the government for years. These old hands from Taiwan are loyal, reliable and know how government works, but newcomers from the mainland will feel shut out of power; the old guard grows stronger as a result."
 TAI_dec_bop_recruit_mainlanders: "Recruit Mainland Notables"
 TAI_dec_bop_recruit_mainlanders_desc: "Bring respected figures from the mainland provinces into the cabinet and the party: university presidents, business leaders, local notables and enlightened former CCP officials. They help mainlanders identify with the new government and weaken the guerrillas' appeal."
 TAI_dec_bop_mediation: "Factional Mediation Conference"
 TAI_dec_bop_mediation_desc: "Summon the senior figures of both factions to the Presidential Palace to settle appointments and the division of resources. If the conflict between the Taiwan old guard and the mainland newcomers is not handled in time, it will turn into open factional warfare; the President steps in personally to get both sides to give ground."
 roc_return.120.t: "The Taipei Clique Monopolizes Power"
 roc_return.120.d: "Nearly all the top posts in the party, government and army are held by old hands from Taiwan, mainland figures grumble bitterly, and jibes about ‘the new takeover officials’ spread fast. A list circulates online showing how few ministers and provincial chairmen come from the mainland. Mainland-born legislators pound the table in parliament, demanding that the government share power."
 roc_return.120.a: "Stability above all."
 roc_return.120.b: "Mainlanders must share in power."
 roc_return.121.t: "Local Factions Grow Strong"
 roc_return.121.d: "Local strongmen in the provinces, relied on by the center, appoint their own officials and keep tax revenue for themselves, and some even raise their own armed forces. Nanjing's orders stop at the provincial borders, and the warlord era seems to be repeating itself. The center must decide whether to tolerate it for now in exchange for stability, or send its own loyal men to take things in hand."
 roc_return.121.a: "Tolerate it for now."
 roc_return.121.b: "Send the old guard to sort it out."
 TAI_na_session_mission_desc: "The National Assembly holds a regular session once a year. When the countdown ends, the session opens automatically: it hears the policy report and debates bills. Delegates are re-elected after the sixth regular session of each term."
 TAI_dec_na_extraordinary: "Convene an Extraordinary Session"
 TAI_dec_na_extraordinary_desc: "Call an extraordinary session of the National Assembly early to debate the policy report and bills at once (this year's regular session countdown restarts)."
 TAI_na_extraordinary_tt: "Hold a National Assembly session immediately: a vote on the policy report and debate on two bills. The regular session countdown restarts."
 TAI_dec_na_campaign: "All-Out Campaign"
 TAI_dec_na_campaign_desc: "With National Assembly elections approaching, the ruling party throws everything into the campaign: the party chair tours every province, the branches mobilize their grassroots organizations and ads fill the media. The election will decide whether the ruling party keeps its majority in the National Assembly."
 TAI_dec_na_ally_kmt: "Form a Ruling Coalition with the KMT"
 TAI_dec_na_ally_kmt_desc: "The Kuomintang caucus joins the governing coalition and demands political stability. The Kuomintang holds a substantial number of seats in the National Assembly, and its entry makes the coalition sure of winning key votes; in return, it demands a fair share of cabinet posts and appointments."
 TAI_dec_na_ally_pfp: "Form a Ruling Coalition with the PFP"
 TAI_dec_na_ally_pfp_desc: "The People First Party caucus joins the governing coalition. Founded by James Soong, the PFP has a solid local base in some provinces; it holds few seats, but it is often the decisive minority in key votes."
 TAI_dec_na_break_alliances: "Dissolve the Ruling Coalition"
 TAI_dec_na_break_alliances_desc: "End cooperation with the other caucuses and let the ruling party govern alone. It frees the government from its allies' constraints, but means losing a reliable majority in key National Assembly votes, and politics will be unsettled for a while."
 TAI_na_largest_party_tt: "The §Yparty with the most seats§! in the National Assembly forms the new government."
 TAI_na_mark_none: ""
 TAI_na_president_direct: "Presidential election: §Ydirect election by all citizens§! (constitution amended)"
 TAI_na_president_indirect: "Presidential election: §Yelected by the National Assembly§! (at the first regular session of each term)"
 TAI_na_session_pass: "§GPassed§!"
 TAI_na_session_fail: "§RRejected§!"
 TAI_na_gui_title: "The [?TAI_na_term|0]th National Assembly of the Republic of China"
 TAI_na_gui_session: "Regular Session [?TAI_na_session|0] · Governing: [ROOT.GetRulingParty]"
 TAI_na_gui_countdown: "Next session in §Y[?TAI_na_days_left|0]§! days    Election in §Y[?TAI_na_sessions_left|0]§! sessions"
 TAI_na_gui_kmt_pct: "[?TAI_na_kmt_pct|0]%"
 TAI_na_gui_dp_pct: "[?TAI_na_dp_pct|0]%"
 TAI_na_gui_sd_pct: "[?TAI_na_sd_pct|0]%"
 TAI_na_gui_pfp_pct: "[?TAI_na_pfp_pct|0]%"
 TAI_na_gui_other_pct: "[?TAI_na_other_pct|0]%"
 TAI_na_gui_gov_pct: "§G[?TAI_na_support_pct|0]%§!"
 TAI_na_gui_president: "[TAI_na_president_mode]"
 TAI_na_gui_recall_warning: "§RWarning: the ruling coalition holds less than a third of the seats, and the opposition is preparing a recall motion!§!"
 roc_return.100.t: "The National Assembly Opens Its Regular Session"
 roc_return.100.d: "Session [?TAI_na_session|0] of the [?TAI_na_term|0]th National Assembly opens in the National Assembly Hall in Nanjing. The President delivers his report on the work of government, reviewing the past year and answering the delegates' questions, while opposition delegates hold up protest placards on the floor.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). Result of the vote on the report: [TAI_na_session_result]."
 roc_return.100.a: "The policy report is approved."
 roc_return.100.b: "The policy report is rejected."
 roc_return.101.t: "National Assembly Elections"
 roc_return.101.a: "The new National Assembly will soon convene."
 roc_return.102.t: "The National Assembly Elects the President"
 roc_return.102.d: "Under the constitution the President is elected by the National Assembly. The new Assembly convenes to vote for the next President of the Republic of China. Supporters of each candidate gather outside, while inside delegates are still negotiating and canvassing to the last minute; this vote will set the nation's course for the next six years. The governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%)."
 roc_return.102.a: "The ruling party's candidate is re-elected."
 roc_return.102.b: "The joint opposition candidate is elected."
 roc_return.90.c: "Rally the caucus and vote down the recall."
 roc_return.110.t: "Bill: The Annual General Budget"
 roc_return.110.d: "The Executive Yuan submits the central government's budget for the new year to the National Assembly. With everything to rebuild after the Restoration, every yuan touches someone's interests: defense, education, welfare and mainland reconstruction all compete for limited funds, and local delegates demand more construction money for their home districts.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.110.a: "Pass it by majority vote."
 roc_return.110.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.110.c: "Withdraw the bill."
 roc_return.111.t: "Bill: Special Defense Budget"
 roc_return.111.d: "The Ministry of National Defense requests a supplementary special budget for reorganizing and re-equipping the armed forces: integrating former PLA units, buying new equipment and improving pay. The opposition says defense spending is too high and crowds out civilian needs, while the defense minister insists from the podium that the defense of a unified China can have no gaps.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.111.a: "Pass it by majority vote."
 roc_return.111.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.111.c: "Withdraw the bill."
 roc_return.112.t: "Bill: Education Funding Guarantee Act"
 roc_return.112.d: "Article 164 of the Constitution requires that education receive no less than fifteen percent of the central budget. Schools across the mainland provinces urgently need rebuilding, rural teachers' pay has long been in arrears and new textbooks must be printed; educators sit in outside the Assembly, demanding that the government honor the constitution's promise.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.112.a: "Pass it by majority vote."
 roc_return.112.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.112.c: "Withdraw the bill."
 roc_return.113.t: "Bill: General Principles of Local Self-Government"
 roc_return.113.d: "The General Act on Local Self-Government gives provinces and counties autonomous powers while bringing local strongmen within the law: governors and county heads are elected and local finances get statutory sources of revenue. Supporters call it the cure for separatism; opponents fear it will make the local barons even stronger.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.113.a: "Pass it by majority vote."
 roc_return.113.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.113.c: "Withdraw the bill."
 roc_return.114.t: "Bill: Abolish the Temporary Provisions"
 roc_return.114.d: "The Temporary Provisions Effective During the Period of Communist Rebellion were passed in 1948, froze many articles of the constitution and remained in force in Taiwan until 1991. Abolishing them means fully restoring constitutional government and curbing the President's emergency powers, but it would also tie the government's hands against the remaining insurgents.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.114.a: "Pass it by majority vote."
 roc_return.114.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.114.c: "Withdraw the bill."
 roc_return.115.t: "Bill: Special Act on Mainland Reconstruction"
 roc_return.115.d: "A special act to coordinate infrastructure, state firm reform and currency conversion across the mainland provinces, with a dedicated reconstruction fund and an oversight committee. It is the largest piece of legislation since the Restoration, involving trillions in funds; the opposition demands tighter oversight so the corruption of the old takeover officials is not repeated.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.115.a: "Pass it by majority vote."
 roc_return.115.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.115.c: "Withdraw the bill."
 roc_return.116.t: "Bill: Frontier Peoples' Autonomy Act"
 roc_return.116.d: "In the spirit of the Republic of Five Races, guarantee the frontier peoples' rights of self-government, religion and culture: the autonomous governments of Tibet, Xinjiang and Inner Mongolia get control over education, language and religious affairs. Tibetan, Uyghur and Mongol delegates speak in the Assembly, the first time they have spoken for their peoples in the national parliament.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.116.a: "Pass it by majority vote."
 roc_return.116.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.116.c: "Withdraw the bill."
 roc_return.117.t: "Bill: Judicial Reform Act"
 roc_return.117.d: "Clean up the corruption and case backlog of the takeover period and build an independent judiciary: special courts to try takeover scandals, more judges and prosecutors to clear the backlog, and reformed rules for appointing and evaluating judges. Representatives of the legal profession say there can be no true constitutional government without independent courts.\n\nThe governing coalition holds [?TAI_na_gov|0] seats ([?TAI_na_support_pct|0]%). A majority is needed to pass it."
 roc_return.117.a: "Pass it by majority vote."
 roc_return.117.b: "Negotiate with the opposition (pass it with concessions)."
 roc_return.117.c: "Withdraw the bill."
 TAI_hk_macau_focus_tt: "The Hong Kong and Macau decisions opened at the Restoration; this focus gives extra political power and stability."
 ### v3.13 国民大会版式与外交扩充
 TAI_national_assembly_category: "National Assembly"
 TAI_na_session_mission: "Regular Session [?TAI_na_session_next|0] of the [?TAI_na_term|0]th National Assembly of the Republic of China"
 TAI_na_gui_gov: "Ruling coalition [?TAI_na_gov|0]/3000 seats [?TAI_na_support_pct|0]%"
 TAI_na_mark_ruling: " §G(Ruling)§!"
 TAI_na_mark_ally: " §Y(Allied)§!"
 TAI_sun_yatsen_institute_idea: "Sun Yat-sen Institutes"
 TAI_sun_yatsen_institute_idea_desc: "Sun Yat-sen Institutes around the world promote the Chinese language and culture. Known for their open academic atmosphere and teaching of traditional characters, they attract students and scholars from every country; the Republic of China's soft power grows steadily around the world."
 TAI_un_reform_idea: "UN Reform"
 TAI_un_reform_idea_desc: "The Republic of China's influence in the UN grows by the day. Nanjing leads the plan for Security Council reform, greatly increasing the representation of Asia and the developing world; on every major international issue, countries want to hear the Republic of China's view."
 TAI_space_partner_idea: "Space Partner"
 TAI_space_partner_idea_desc: "Space and cutting-edge technology programs in partnership with the United States. Republic of China scientists take part in the International Space Station and the lunar program and share data and technology with American institutions; space cooperation drives progress in materials, electronics and computing."
 TAI_trans_pacific_idea: "Trans-Pacific Partner"
 TAI_trans_pacific_idea_desc: "A high-standard Pacific Rim free trade area. Lower tariffs and common rules make it easier for Chinese goods to reach markets in the Americas and Oceania; trading partners' goodwill rises, and inflows of foreign investment speed up industrial construction."
 TAI_g8_member_idea: "Member of the G9"
 TAI_g8_member_idea_desc: "The Republic of China is a member of the club of the world's leading industrial nations. At G9 summits, Nanjing sits with Washington, Tokyo and Berlin to steer the world economy; its higher international standing gives the government more confidence, and its trading partners trust China more."
 TAI_energy_security_idea: "Energy Security"
 TAI_energy_security_idea_desc: "Diverse energy import routes keep industry running. Pipelines from Central Asia, oil and gas from Siberia and tankers from the Middle East mean China no longer depends on a single source; even if one route is blockaded, the factories will not stop."
 TAI_cjk_fta_idea: "China-Japan-Korea Free Trade Area"
 TAI_cjk_fta_idea_desc: "A free trade area of East Asia's three great economies. The supply chains of China, Japan and Korea are deeply integrated, with parts for semiconductors, cars and machinery moving freely among them; East Asian economic cooperation enters a new stage."
 TAI_south_south_idea: "South-South Cooperation"
 TAI_south_south_idea_desc: "The Republic of China leads the developing world. The South–South fund provides aid and loans to developing countries in Africa, Latin America and South Asia and wins the friendship of the Third World; China's moral standing in the world grows ever stronger."
 TAI_global_chinese_network_idea: "Global Chinese Business Network"
 TAI_global_chinese_network_idea_desc: "Chinese chambers of commerce around the world bring the nation money and connections. From Singapore and Kuala Lumpur to San Francisco and Vancouver, the Chinese business network brings overseas capital and market opportunities back to the motherland; companies backed by overseas Chinese become an important source of tax revenue."
 TAI_maritime_china_idea: "Maritime China"
 TAI_maritime_china_idea_desc: "China's future lies at sea. Ports, shipping and shipbuilding become strategic national industries, and China's merchant fleet and shipbuilding capacity lead the world; the navy's speed and mobility rise sharply thanks to the growth of the shipyards."
 TAI_blue_water_idea: "Blue-Water Diplomacy"
 TAI_blue_water_idea_desc: "Carrier groups are the Republic of China's most powerful diplomatic calling card. The fleet visits ports around the world, sailors gain experience on voyage after voyage, and the shipyards expand their capacity to keep the fleet at sea."
 TAI_south_asia_partner_idea: "South Asian Partner"
 TAI_south_asia_partner_idea_desc: "Free trade with the countries of South Asia. Bangladeshi garments, Pakistani cotton yarn and Sri Lankan tea enter the Chinese market, while Chinese machinery and electronics sell in large volumes across South Asia; trade between the two grows ever closer."
 TAI_study_abroad_idea: "Returning Graduates"
 TAI_study_abroad_idea_desc: "Students returning from study abroad throw themselves into building the nation. Young people trained at top Western universities bring back advanced knowledge and management experience and take key posts in universities, companies and government; the return of talent lifts both research and governance."
 TAI_olympic_glory_idea: "Olympic Glory"
 TAI_olympic_glory_idea_desc: "The Nanjing Olympics show the world a new China. At the opening ceremony the Blue Sky, White Sun and a Wholly Red Earth flag rises beneath Purple Mountain, and Republic of China athletes win gold after gold on home ground; national pride and unity are greater than ever."
 TAI_diplo_partner: "Diplomatic Partner"
 TAI_diplo_rival: "Diplomatic Friction"
 roc_return.130.t: "Nanjing Wins the Olympic Bid"
 roc_return.130.d: "The IOC president announces that the host city of the Summer Olympic Games will be Nanjing, Republic of China! Celebration erupts beneath Purple Mountain, and the crowds at Xinjiekou party all night. It is the first time the Republic of China will host the Olympics; at this moment many recall how Liu Changchun went alone to Los Angeles to compete in 1932."
 roc_return.130.a: "Let the world witness China's rebirth!"
 roc_return.131.t: "The Group of Nine"
 roc_return.131.d: "The G8 summit agrees unanimously to invite the Republic of China to join, and the G8 becomes the G9. In the summit's family photo the President of the Republic of China stands in the center; it is the first time China sits as an equal with the major Western industrial nations as a democracy."
 roc_return.131.a: "China is back at the center of the world stage."
 roc_return.132.t: "Sino-Indian Border Talks"
 roc_return.132.d: "Chinese and Indian representatives open border talks in New Delhi. India offers to settle on the basis of the McMahon Line, in return for a Chinese pledge not to use force over South Tibet, plus open border trade and pilgrimage routes. Nationalists at home fiercely oppose giving up South Tibet, but peace with India may be worth more than a few mountains."
 roc_return.132.a: "Sign the border agreement."
 roc_return.132.b: "The talks collapse."
 roc_return.133.t: "The Shanghai World Expo Opens"
 roc_return.133.d: "Along both banks of the Huangpu, the pavilions of more than two hundred countries and international organizations vie for attention. The China Pavilion's ‘Crown of the East’ towers over the site, with the Taiwan Pavilion standing beside those of the mainland provinces. Seventy million visits are expected over six months, and the world sees a unified China here for the first time."
 roc_return.133.a: "Better city, better life."
 TAI_host_apec: "Host the APEC Summit"
 TAI_host_apec_desc: "Host the APEC leaders' summit in Shanghai and show the world the new China after the Restoration. Twenty-one leaders pose for the family photo in Chinese-style jackets, and the Bund stays lit all night; it is the first time the Republic of China attends APEC as a fully sovereign state, where Taiwan once could only send a ‘leader's representative’."
 TAI_olympic_bid: "Bid for the Olympics"
 TAI_olympic_bid_desc: "Nanjing bids for the Summer Olympics so the whole world can witness the Republic of China's rebirth. In 1932 Liu Changchun went alone to the Los Angeles Olympics for the Republic of China, and for decades Taiwan's athletes could only compete as ‘Chinese Taipei’. Now the Blue Sky, White Sun flag will be raised at a home Games."
 TAI_world_expo: "Shanghai World Expo"
 TAI_world_expo_desc: "‘Better City, Better Life’: the Shanghai World Expo will draw seventy million visits. Pavilions on both banks of the Huangpu display the technology and culture of a unified China; the Taiwan pavilion stands beside those of the mainland provinces, and visitors can tour all of China in a single day."
 TAI_sun_yatsen_institutes: "Sun Yat-sen Institutes"
 TAI_sun_yatsen_institutes_desc: "Set up ‘Sun Yat-sen Institutes’ around the world to teach Chinese, Chinese culture and the Three Principles of the People, replacing the controversial Confucius Institutes. They teach both traditional and simplified characters, hire independent scholars and are free of government political vetting; they will introduce the world to a free Chinese culture."
 TAI_overseas_chinese_return: "Bring the Overseas Chinese Home"
 TAI_overseas_chinese_return_desc: "Call on fifty million overseas Chinese to come home to invest, settle and help rebuild. In the 1911 Revolution the overseas Chinese were ‘the mother of the revolution’, giving money and effort; now the Overseas Community Affairs Council offers dual citizenship, investment incentives and talent programs, and engineers from Silicon Valley and financiers from London return in numbers."
 TAI_study_abroad: "Study Abroad Program"
 TAI_study_abroad_desc: "Send mainland youths on state scholarships to top universities in Europe and America to serve the country on their return. The Boxer Indemnity scholars of the late Qing produced the generation of Hu Shih, Chu Coching and Chao Yuen Ren; the new program sends tens of thousands of students a year, training the lawyers, economists and scientists a democratic China needs."
 TAI_global_media: "International Media"
 TAI_global_media_desc: "Launch a global Chinese- and English-language television network so the world can hear Nanjing's voice. It is not a government mouthpiece but a public broadcaster modeled on the BBC and run by an independent board; viewers around the world see for the first time a Chinese channel that can criticize its own government."
 TAI_un_reform: "UN Reform"
 TAI_un_reform_desc: "Push for Security Council reform and seek to lead the allocation of Asia's permanent seats. Japan and India both want permanent seats, which the CCP repeatedly blocked; now Nanjing trades support for reform for the leading role, making the UN more representative of the twenty-first-century world."
 TAI_mutual_defense_treaty: "Sino-American Mutual Defense Treaty"
 TAI_mutual_defense_treaty_desc: "Upgrade the Taiwan Relations Act into a formal Sino-American Mutual Defense Treaty. The 1954 treaty was ended unilaterally by the Carter administration in 1979, leaving Taiwan to rely on vague promises; the new treaty explicitly commits each side to aid the other if attacked, and the US Senate ratifies it by an overwhelming majority."
 TAI_us_military_advisors: "US Military Advisory Group"
 TAI_us_military_advisors_desc: "A US military advisory group returns to China to help reorganize and train the National Army. From 1951 to 1979 the MAAG helped modernize the National Army in Taiwan; now the group is ten times larger, based in Nanjing, Beiping and Guangzhou, helping reorganize former PLA units and introduce NATO-style training and logistics."
 TAI_space_cooperation: "Space and Technology Cooperation"
 TAI_space_cooperation_desc: "Cooperate with NASA and join the International Space Station and the Artemis lunar program. Congress once barred NASA from working with China under the Wolf Amendment; with the CCP gone the ban is repealed, and Republic of China astronauts head for the Moon with American, Japanese and European colleagues."
 TAI_join_g8: "Join the G8"
 TAI_join_g8_desc: "The G8 becomes the G9, and the Republic of China joins the club of the world's leading industrial nations. It is the first time China sits as an equal with the Western powers as a democracy to discuss the world's economic and security affairs; the summit host declares that a G8 without China can no longer speak for the world."
 TAI_eu_investment_agreement: "Sino-European Investment Agreement"
 TAI_eu_investment_agreement_desc: "Sign a comprehensive investment agreement with the European Union, and European capital pours into China. The 2020 EU–China investment agreement was frozen by the European Parliament over human rights; now the obstacles are gone, and German carmakers, French aerospace and Nordic green energy companies set up plants in China."
 TAI_lift_arms_embargo: "Lift the EU Arms Embargo"
 TAI_lift_arms_embargo_desc: "The arms embargo imposed on the CCP in 1989 should be lifted now that the CCP is gone. After June Fourth the EU barred arms sales to China for more than thirty years; now French Rafale fighters, German submarine technology and Italian helicopters are all open to the Republic of China."
 TAI_trans_pacific: "Trans-Pacific Partnership"
 TAI_trans_pacific_desc: "Form a high-standard free trade area with the Pacific Rim nations: the Republic of China formally joins the CPTPP and urges the US to return. High standards on labor, the environment and intellectual property, once a bar the CCP could not clear, are now an advantage for a democratic China."
 TAI_central_asia_five: "The Central Asian Five"
 TAI_central_asia_five_desc: "Build comprehensive partnerships with Kazakhstan, Kyrgyzstan, Tajikistan, Uzbekistan and Turkmenistan. The five Central Asian states lie on the old Silk Road and in Russia's traditional sphere of influence; Nanjing wins their trust with investment, markets and respect for their sovereignty."
 TAI_energy_pipelines: "Central Asian Energy Pipelines"
 TAI_energy_pipelines_desc: "Lay oil and gas pipelines from the Caspian to Shanghai. Turkmen gas and Kazakh oil flow through the Central Asian pipelines straight to the eastern coast, an energy artery that avoids the maritime chokepoints and reduces Central Asia's dependence on Russian pipelines."
 TAI_xinjiang_border_treaty: "Northwest Border Treaty"
 TAI_xinjiang_border_treaty_desc: "Settle the northwestern border with the Central Asian neighbors once and for all in exchange for joint action against separatist movements. The new government recognizes the border treaties signed in the CCP era in return for the neighbors no longer sheltering cross-border militants; border crossings reopen and cross-border trade regains its old bustle."
 TAI_mongolia_corridor: "China-Mongolia Economic Corridor"
 TAI_mongolia_corridor_desc: "Link the Mongolian Plateau with railways and mining development. The line from Erenhot to Ulaanbaatar is converted to standard gauge, and coal from Tavan Tolgoi and copper from Oyu Tolgoi move south on new railways; Mongolia's economy depends ever more on its southern neighbor."
 TAI_arctic_route: "Arctic Shipping Route"
 TAI_arctic_route_desc: "Develop the Arctic sea route with Russia and open a new sea road to Europe. As Arctic ice melts, the Northern Sea Route's navigation season grows longer every year; the voyage from Shanghai to Hamburg can be cut by nearly ten thousand kilometers, and the state shipping line orders its first ice-class freighters."
 TAI_eurasian_bridge: "Eurasian Land Bridge"
 TAI_eurasian_bridge_desc: "The great railway artery from Lianyungang to Rotterdam is complete. Dozens of China–Europe freight trains leave every day loaded with electronics, auto parts and clothing, reaching Europe in a little over ten days; this new Silk Road puts inland cities on the front line of world trade too."
 TAI_war_reparations: "History and War Reparations"
 TAI_war_reparations_desc: "In the 1952 Treaty of Taipei the Republic of China gave up war reparations from Japan in exchange for Japanese diplomatic recognition, and in 1972 the CCP did the same. Tens of millions were killed or wounded in the war and countless properties destroyed, yet victims and their families were never compensated; this history must now be faced again."
 TAI_cjk_fta: "China-Japan-Korea Free Trade Area"
 TAI_cjk_fta_desc: "East Asia's three great economies join hands in the world's third-largest free trade area. Negotiations on a China–Japan–Korea FTA began in 2012 and dragged on for over a decade over political differences; once the historical issues are addressed, the three reach a package deal on tariffs for semiconductors, cars and farm goods."
 TAI_ryukyu_question: "The Ryukyu Question"
 TAI_ryukyu_question_desc: "Ryukyu's status was never decided with China's consent. The Ryukyu Kingdom was a tributary of the Ming and Qing until Japan annexed it as Okinawa Prefecture in 1879; when the US handed administration of Ryukyu to Japan in 1972, the Republic of China objected. Now Nanjing raises the Ryukyu question internationally, to Tokyo's fury."
 TAI_east_china_sea_gas: "Joint East China Sea Gas Development"
 TAI_east_china_sea_gas_desc: "Develop oil and gas fields jointly with Japan on both sides of the median line in the East China Sea. The dispute over the Chunxiao field strained relations for years, and the 2008 joint development consensus was never implemented; after Sino-Japanese reconciliation the two countries' oil companies form a joint venture, and the East China Sea turns from a sea of disputes into a sea of cooperation."
 TAI_korea_relations: "Sino-Korean Relations"
 TAI_korea_relations_desc: "Rebuild the traditional friendship with the Republic of Korea and work together for peace on the peninsula. In 1992 South Korea broke relations with the Republic of China and lowered its flag at the embassy in Taipei, still a painful memory for many older diplomats; now the two exchange ambassadors again in Nanjing and Seoul, and economic, cultural and security cooperation resumes in full."
 TAI_ne_asia_security: "Northeast Asian Security Dialogue"
 TAI_ne_asia_security_desc: "Bring together China, Japan, South Korea, the US and Russia to create a permanent Northeast Asian security mechanism. The old Six-Party Talks broke down over North Korea's nuclear program; now Nanjing relaunches multilateral dialogue as host, with North Korea's nuclear weapons, the Ryukyu and Diaoyutai disputes and the Arctic route all on the table."
 TAI_africa_infrastructure: "African Infrastructure"
 TAI_africa_infrastructure_desc: "Build railways, ports and power grids for African partners. The CCP-era Belt and Road left a good deal of debt and controversy in Africa, so the new government adopts transparent tenders, local hiring and sustainable loan terms; operation of the Mombasa–Nairobi and Addis Ababa–Djibouti railways is renegotiated too."
 TAI_latin_america_allies: "Latin American Allies"
 TAI_latin_america_allies_desc: "Strengthen traditional ties in Central and South America and expand trade with Brazil, Argentina and Mexico. Paraguay, Guatemala, Belize and others were Taipei's most loyal friends; now their relations with the Republic of China are no longer checkbook diplomacy but equal partnerships."
 TAI_middle_east_energy: "Middle East Energy Diplomacy"
 TAI_middle_east_energy_desc: "Sign long-term oil supply agreements with Saudi Arabia and the Gulf states. Half of China's crude imports come from the Middle East, and the security of the Strait of Hormuz affects the whole economy; the Republic of China keeps its balance between Saudi Arabia and Iran and takes no sides."
 TAI_pacific_islands: "Pacific Island Nations"
 TAI_pacific_islands_desc: "These island nations were Taiwan's most loyal diplomatic allies, and must be repaid after the Restoration. Palau, the Marshall Islands and Tuvalu kept relations with Taipei despite Beijing's money offensive, while the Solomon Islands and Kiribati switched to Beijing in 2019; now the Republic of China gives the whole Pacific region aid for climate adaptation and fisheries."
 TAI_caribbean: "Caribbean Cooperation"
 TAI_caribbean_desc: "Work with the Caribbean nations and extend an olive branch to Cuba. Saint Kitts and Nevis, Saint Lucia and Saint Vincent were Taipei's Caribbean allies; Havana was an old friend of the CCP, and Nanjing hopes economic aid and medical cooperation will set Cuba on the road to reform and opening."
 TAI_south_south_fund: "South-South Cooperation Fund"
 TAI_south_south_fund_desc: "Set up a ten-billion-dollar South–South cooperation fund to help developing countries. Run by the International Cooperation and Development Fund, it focuses on agriculture, health, education and climate adaptation and is independently audited; the Republic of China wants to show that a democracy's aid is more trustworthy than an autocracy's loans."
 TAI_global_chinese_chamber: "Global Chinese Business Network"
 TAI_global_chinese_chamber_desc: "Link the Chinese chambers of commerce of Southeast Asia, North America and Europe into a global Chinese business network. The World Chinese Entrepreneurs Convention meets every two years and draws tens of thousands of business owners; the new network, with Nanjing as its hub, turns the capital, technology and connections of the overseas Chinese into support for the motherland's development."
 TAI_taiping_island: "Expand Taiping Island"
 TAI_taiping_island_desc: "Expand the airfield and port on Taiping Island in the Spratlys and make it a forward base in the South China Sea. Taiping is the largest natural island in the Spratlys, with fresh water and vegetation, and the ROC Navy has been stationed there since 1956; the new runway can handle fighters and the harbor can berth destroyers."
 TAI_spratly_garrison: "Spratly Garrison"
 TAI_spratly_garrison_desc: "Marines are stationed on the main features of the Spratlys: Taiping, Mischief, Fiery Cross and Subi Reefs. The bases the CCP built by land reclamation in the 2010s now form a defensive network in the South China Sea together with Taiping, and tours for the island garrisons are cut from six months to three."
 TAI_maritime_silk_road: "Maritime China"
 TAI_maritime_silk_road_desc: "China's future lies at sea. Ports, shipping and shipbuilding link East Asia, South Asia, Africa and Europe. After Zheng He's seven voyages, China turned its back on the sea for centuries; now the Republic of China's merchant fleet is the largest in the world, and the age of maritime China has truly arrived."
 TAI_scs_joint_development: "Joint Development of the South China Sea"
 TAI_scs_joint_development_desc: "‘Sovereignty is ours, shelve the disputes, develop together’: develop the resources of the South China Sea jointly with the ASEAN nations. Ma Ying-jeou's South China Sea Peace Initiative of 2015 is revived, setting up joint development zones with Vietnam, the Philippines and Malaysia to share the proceeds of fishing, oil and gas and marine research."
 TAI_scs_hardline: "Hard Line in the South China Sea"
 TAI_scs_hardline_desc: "Every inch of sea inside the eleven-dash line is Chinese territory. The Republic of China declares an air defense identification zone over the South China Sea, the coast guard drives off Vietnamese and Philippine fishing boats, and the fleet patrols around Second Thomas Shoal and Scarborough Shoal; the neighbors protest fiercely, the US expresses concern and tension in the South China Sea rises again."
 TAI_far_seas_escort: "Far-Seas Escort"
 TAI_far_seas_escort_desc: "Send a squadron to escort shipping in the Gulf of Aden and protect Chinese merchant ships. Somali pirates once hijacked several Chinese freighters, and Taiwanese fishing boats were held for years; now Republic of China Navy escort groups are permanently stationed in the Gulf of Aden, with a support base in Djibouti."
 TAI_malacca_security: "Malacca Security"
 TAI_malacca_security_desc: "Work with Singapore, Malaysia and Indonesia to keep shipping in the Strait of Malacca safe. Eighty percent of China's oil imports pass through this narrow strait, and the ‘Malacca dilemma’ has long haunted defense planners; cooperation with the coastal states secures the route better than any military deployment."
 TAI_blue_water_diplomacy: "Blue-Water Diplomacy"
 TAI_blue_water_diplomacy_desc: "Show national strength with friendly visits by carrier groups, making the navy a tool of diplomacy. Carrier groups call at Sydney, Mumbai, Cape Town and Rio de Janeiro, and receptions and open days on board draw hundreds of thousands of local people; the navy's image is the nation's image."
 TAI_south_asia_policy: "South Asia Policy"
 TAI_south_asia_policy_desc: "On the other side of the Himalayas lies one of the most populous regions on earth: India, Pakistan, Bangladesh and Sri Lanka have nearly two billion people between them. Relations between China and India will decide Asia's future, and Nanjing must find a balance between the border dispute and economic cooperation."
 TAI_india_border_talks: "Sino-Indian Border Talks"
 TAI_india_border_talks_desc: "Negotiate on the basis of the McMahon Line in exchange for lasting peace with India. It means giving up the claim to South Tibet, which nationalists at home will fiercely oppose; but reconciliation with India would let China put its resources where they matter more, and let two ancient civilizations lead Asia together."
 TAI_india_confrontation: "Sino-Indian Confrontation"
 TAI_india_confrontation_desc: "The Republic never recognized the McMahon Line, and South Tibet is Chinese territory. In the 2020 Galwan Valley clash, soldiers on both sides fought with clubs and stones; now the National Army reinforces Tibet and builds border roads, and New Delhi moves up its mountain strike corps. In the Himalayas, two great powers face off once more."
 TAI_pakistan_friendship: "Sino-Pakistani Friendship"
 TAI_pakistan_friendship_desc: "Continue the friendship with Pakistan that is ‘higher than the mountains and deeper than the sea’. Pakistan was the CCP's closest ally, and Islamabad was wary of Nanjing at first; the Republic of China promises to continue the China–Pakistan Economic Corridor and military cooperation, carrying the friendship across the change of regime."
 TAI_bangladesh_ports: "Bangladeshi Ports"
 TAI_bangladesh_ports_desc: "Help build the port of Chittagong and open an outlet to the sea for the southwestern provinces. Yunnan and Sichuan are far from the coast, and their goods must travel thousands of kilometers overland to reach a port; a corridor through Myanmar and Bangladesh lets the Southwest's products go straight into the Bay of Bengal and the Indian Ocean."
 TAI_himalayan_states: "Nepal and Bhutan"
 TAI_himalayan_states_desc: "Build friendly relations with the Himalayan states to stabilize the Tibetan border. Nepal is squeezed between China and India, Bhutan still has no diplomatic relations with China, and the Doklam standoff strained relations among all three; the Republic of China wins the friendship of these small mountain countries by respecting their sovereignty and offering economic aid."
 TAI_sri_lanka: "Sri Lankan Port"
 TAI_sri_lanka_desc: "Build a deep-water port at Hambantota to secure the Indian Ocean sea lanes. CCP-era loans pushed Sri Lanka into a debt crisis and forced it to lease the port to China for ninety-nine years; the new government renegotiates the lease and forgives part of the debt, making Hambantota a model of mutual benefit rather than exploitation."
 TAI_south_asia_fta: "South Asian Free Trade Area"
 TAI_south_asia_fta_desc: "Set up a free trade area with the South Asian nations and open a market of nearly two billion people. South Asia is one of the world's fastest-growing regions, yet one of the least integrated; the Republic of China's investment and markets give the South Asian nations a shared motive for development for the first time."
