 VIEX_doi_moi_2_idea: "革新开放 2.0"
 VIEX_doi_moi_2_idea_desc: "以市场化改革、国企重组与更开放的投资环境为核心的第二轮革新。"
 VIEX_party_discipline_idea: "整党整风"
 VIEX_party_discipline_idea_desc: "党内整顿与思想教育让纪律重新收紧，社会的开放度却随之下降。"
 VIEX_multiparty_idea: "多党民主"
 VIEX_multiparty_idea_desc: "独立候选人、独立媒体与多党竞争带来更多活力，也带来更多争吵。"
 VIEX_red_junta_idea: "军人治国"
 VIEX_red_junta_idea_desc: "人民军接管了国家，纪律与效率取代了辩论。"
 VIEX_blazing_furnace_idea: "熔炉反腐"
 VIEX_blazing_furnace_idea_desc: "「没有禁区、没有例外」的反腐风暴，一批高官落马，官场风气大变。"
 VIEX_fdi_hub_idea: "全球制造业枢纽"
 VIEX_fdi_hub_idea_desc: "三星、英特尔与一大批外资工厂让越南成为全球供应链的重要一环。"
 VIEX_mekong_granary_idea: "湄公河粮仓"
 VIEX_mekong_granary_idea_desc: "稻米、水产与热带作物构成稳定的农业出口，也是农村稳定的基础。"
 VIEX_digital_vietnam_idea: "数字越南"
 VIEX_digital_vietnam_idea_desc: "本土科技企业与庞大的年轻互联网用户群，推动数字经济快速增长。"
 VIEX_north_south_artery_idea: "南北大动脉"
 VIEX_north_south_artery_idea_desc: "高速公路、高铁与深水港把南北两大经济中心紧密连接。"
 VIEX_total_defense_idea: "全民国防"
 VIEX_total_defense_idea_desc: "「四不」国防政策下的全民国防体系：常备军、预备役与民兵相互配合。"
 VIEX_maritime_militia_idea: "海上民兵"
 VIEX_maritime_militia_idea_desc: "渔民与海岸警卫队的联合体系，既护渔又巡海，是南海维权的前线力量。"
 VIEX_bamboo_diplomacy_idea: "竹子外交"
 VIEX_bamboo_diplomacy_idea_desc: "「根深、干硬、枝柔」——与所有大国都保持友好，也不依附任何一方。"
 VIEX_asian_tiger_idea: "亚洲新虎"
 VIEX_asian_tiger_idea_desc: "越南成为东南亚增长最快的经济体之一。"
 VIEX_climate_resilience_idea: "气候韧性"
 VIEX_climate_resilience_idea_desc: "面对海平面上升与湄公河三角洲盐碱化，越南建立了全国性的气候适应体系。"
