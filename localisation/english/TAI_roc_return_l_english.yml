 TAI_integrate_ccp_reformers: "Integrate the CCP Reformers"
 TAI_integrate_ccp_reformers_desc: "After the CCP fell from power, many of its more open-minded officials did not follow the remnants into retreat. Wang Yang of Guangdong and Chen Liangyu of Shanghai are willing to join the Kuomintang, and former CCP General Secretary Hu Jintao has accepted an invitation from the RCCK. Bringing them in would steady the mainland bureaucracy and divide the CCP remnants."
 ### v3.16 支持度修复与渗透决议
 TAI_dec_underground_network: "Build an Underground Network"
 TAI_dec_underground_network_desc: "Set up independent underground cells in every province and city, making contact with workers, students and grassroots cadres unhappy with the CCP, and wait for the right moment."
 TAI_dec_subvert_garrisons: "Subvert Local Garrisons"
 TAI_dec_subvert_garrisons_desc: "Use ties of old comrades, home towns and Whampoa alumni to turn mid-ranking officers in local PLA garrisons and the Armed Police."
 TAI_unrest_50_tt: "Mainland Unrest is at least §Y50§!"
 TAI_unrest_60_tt: "Mainland Unrest is at least §Y60§!"
 TAI_mainland_work_category_desc: "Political, psychological and intelligence work carried out on the mainland by the National Security Bureau, the Mainland Affairs Council and the Kuomintang's Mainland Affairs Department. Each action needs a cooldown before it can be repeated (it is hidden while cooling down).\n\nCurrent §YMainland Unrest§!: §Y[?TAI_mainland_unrest|0]§!/100\n - 50 or more: we can §RCounterattack on the Mainland§!, and ‘Build an Underground Network’ opens\n - 60 or more: ‘Subvert Local Garrisons’ opens\n - 70 or more: we can propose §GPeaceful Unification§!\n - 80 or more: we can §RIgnite a Mainland Uprising§!\n§LWhile CCP stability is above 70%, unrest falls by 1 each month.§!"
 ### v3.19 十八项完善
 TAI_roc_nsb_name: "National Security Bureau"
 roc_return.160.t: "The Government of the Republic of China Sets Things in Order"
 roc_return.160.d: "The Executive Yuan has announced a series of measures. Apart from the Maoist underground and the far-right Renaissance Society, every party may register legally. The Communist Party of China returns as a legal opposition party with about thirty-five percent of the vote. The central bank declares the renminbi legal tender. The Ministry of National Defense has taken over the mainland's nuclear arsenal and keeps the existing nuclear weapons policy. ‘The legacy of 1949’ has passed into history with the Restoration."
 roc_return.160.a: "Under the constitution, everyone in their place."
 TAI_na_gui_cpc: "Communist Party of China  [?TAI_na_cpc|0] seats  [?TAI_na_cpc_pct|0]%[TAI_na_mark_cpc]"
 TAI_na_gui_cpc_pct: "[?TAI_na_cpc_pct|0]%"
 TAI_na_lobby_delegates: "Court Assembly Delegates"
 TAI_na_lobby_delegates_desc: "The Kuomintang's Central Organization Department steps in, courting independent and opposition delegates with local party posts and project funds. Besides the elections at the end of each term, seats in the National Assembly also shift monthly with party support and defections."
 TAI_na_lobby_delegates_tt: "The ruling party gains §G+60 to 150§! seats in the National Assembly (independents first, then defectors from the largest opposition party)"
 TAI_dbf_cure_black_gold: "Anti-Gang and Anti-Corruption Drive"
 TAI_dbf_cure_black_gold_desc: "The Investigation Bureau and prosecutors jointly pursue collusion between factions, gangs and conglomerates, indicting a slate of local councilors and council speakers.\n\n§YBlack Gold Politics§! currently at severity §R[?TAI_dbf_black_gold_sev|0]§!/100, recovering §G[?TAI_dbf_black_gold_rate|1]§! per month."
 TAI_dbf_cure_black_gold_tt: "Severity of the national spirit §YBlack Gold Politics§! §G−15§!"
 TAI_dbf_black_gold_desc: "Current severity: §R[?TAI_dbf_black_gold_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_black_gold_rate|1]§! per month (base 0.5; +0.5 each if stability is above 60% and if the ruling coalition has a majority in the Legislative Yuan).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
 TAI_dbf_black_gold_reduce_tt: "Severity of the national spirit §YBlack Gold Politics§! §G−33§! (removed at 0)"
 TAI_dbf_cure_isolation: "State Visits Abroad"
 TAI_dbf_cure_isolation_desc: "The President leads delegations to allies and major powers, signing a series of bilateral agreements to rebuild the Republic of China's international space.\n\n§YDiplomatic Isolation§! currently at severity §R[?TAI_dbf_isolation_sev|0]§!/100, recovering §G[?TAI_dbf_isolation_rate|1]§! per month."
 TAI_dbf_cure_isolation_tt: "Severity of the national spirit §YDiplomatic Isolation§! §G−15§!, costs §Y2§! billion"
 TAI_dbf_isolation_desc: "Current severity: §R[?TAI_dbf_isolation_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_isolation_rate|1]§! per month (base 0.5; +0.5 each for a permanent UN Security Council seat and for being in a faction).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
 TAI_dbf_isolation_reduce_tt: "Severity of the national spirit §YDiplomatic Isolation§! §G−33§! (removed at 0)"
 TAI_dbf_cure_conscription: "Volunteer Pay Raise"
 TAI_dbf_cure_conscription_desc: "Raise pay and veterans' benefits for volunteers to bring units up to strength.\n\n§YPains of the Switch to Volunteers§! currently at severity §R[?TAI_dbf_conscription_sev|0]§!/100, recovering §G[?TAI_dbf_conscription_rate|1]§! per month."
 TAI_dbf_cure_conscription_tt: "Severity of the national spirit §YPains of the Switch to Volunteers§! §G−15§!, costs §Y3§! billion"
 TAI_dbf_conscription_desc: "Current severity: §R[?TAI_dbf_conscription_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_conscription_rate|1]§! per month (base 0.5; +0.5 if war support is above 50%).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
