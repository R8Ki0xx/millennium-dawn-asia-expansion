 ### 提示
 TAI_mainland_unrest: "Mainland Unrest"
 TAI_mainland_unrest_tt: "Mainland Unrest: $RIGHT|+=0$"
 TAI_unrest_mechanic_tt: "Enables §YMainland Unrest§! (0-100). It rises every month while the mainland is politically unstable, in civil war, or at war with a major power.\nAt §Y50§! or more we can §RCounterattack on the Mainland§!; at §Y70§! or more we can propose §GPeaceful Unification§!; at §Y80§! or more we can §RIgnite a Mainland Uprising§!."
 TAI_unlock_mainland_work_decisions_tt: "Unlocks the decision category §YMainland Recovery Work§!."
 TAI_us_answer_tt: "Washington will decide whether to §Ytacitly approve§! our plans."
 TAI_unlock_us_intervention_tt: "Once at war with China, we can use a decision to §YRequest US Intervention§!."
 TAI_peace_talks_condition_tt: "Any of the following:\n - §YChina§! is already a democracy\n - §YChina§! has less than 30% stability\n - Mainland Unrest has reached 70"
 TAI_peace_talks_tt: "§YBeijing§! will decide whether to accept peaceful unification under the constitution of the Republic of China. If it accepts, §YChina§! will be merged into the Republic of China."
 TAI_peace_accept_tt: "§YChina§! will be annexed in full by the §YRepublic of China§!."
 TAI_uprising_condition_tt: "Mainland Unrest has reached §Y80§!"
 TAI_return_window_tt: "The time to strike has come (any of the following):\n - Mainland Unrest has reached §Y50§!\n - §YChina§! has less than 35% stability\n - §YChina§! is in a civil war\n - §YChina§! is at war with another major power"
 TAI_defectors_tt: "§G3§! PLA divisions will defect on the front line and join the National Army. Further defections can be won through decisions."
 TAI_defectors_small_tt: "§G2§! PLA divisions will defect on the front line and join the National Army."
 TAI_hk_macau_tt: "§YHong Kong§! and §YMacau§! will decide whether to return to the Republic of China."
 TAI_mongolia_tt: "§YMongolia§! will decide whether to accept a plan to return to the Republic of China. If it refuses, §RRecover Outer Mongolia§! is unlocked."
 TAI_un_condition_tt: "§YChina§! no longer exists, or controls fewer than 6 provinces"
 TAI_mongolia_refused_tt: "Unlocks the focus §RRecover Outer Mongolia§!."

 ### 决议
 TAI_mainland_work_category: "Mainland Recovery Work"
 TAI_dec_voice_of_free_china: "Voice of Free China"
 TAI_dec_voice_of_free_china_desc: "Broadcast news and democratic ideas to the mainland by shortwave radio and satellite television. The Voice of Free China and Kuang Hua Radio broadcast to the mainland during the Cold War; now they break through the Great Firewall by satellite TV and live streaming, carrying news the mainland's official media will not report."
 TAI_dec_infiltrate_cadres: "Infiltrate Local Cadres"
 TAI_dec_infiltrate_cadres_desc: "Buy over and turn local officials unhappy with the status quo, planting nails inside the system. Sidelined cadres, relatives of punished officials and local power holders resentful of the center are all approached by intelligence officers; at the critical moment they may switch sides."
 TAI_dec_fund_dissidents: "Fund Exiled Democracy Groups"
 TAI_dec_fund_dissidents_desc: "Fund democracy activists and organizations in exile. From New York and Los Angeles to Berlin, the exiled democracy groups have long been short of money and divided among themselves; Taipei's funding lets them publish, organize events and stay in touch with rights activists on the mainland."
 TAI_dec_cyber_psyops: "Online Psychological Warfare"
 TAI_dec_cyber_psyops_desc: "Break through the Great Firewall and spread information the authorities dislike on the mainland internet. Officials' corruption, deleted news and true history circulate among mainland netizens through circumvention tools and anonymous accounts; the censors cannot keep up with how fast information spreads."
 TAI_dec_letter_to_compatriots: "Message to Compatriots on the Mainland"
 TAI_dec_letter_to_compatriots_desc: "Broadcast to soldiers and civilians on the mainland: the National Army comes to rescue our compatriots, not to take revenge. The message promises that soldiers who lay down their arms will be treated well, ordinary party members and grassroots cadres will not be prosecuted and people's property will be protected. Many stop fighting to the death for the CCP."
 TAI_dec_pla_defection: "Incite PLA Defections"
 TAI_dec_pla_defection_desc: "Win more PLA units over to the front lines through loudspeaker appeals and secret contacts. Defecting units keep their structure and designations, and their officers and men keep their ranks and pay; every unit that comes over shakes the morale across the lines a little more."
 TAI_dec_request_us_intervention: "Request US Intervention"
 TAI_dec_request_us_intervention_desc: "Washington has tacitly approved our actions. Now it is time to ask them to keep their promise."

 ### 国家精神
 TAI_silicon_island_idea: "Silicon Island"
 TAI_silicon_island_idea_desc: "An economic development strategy built around semiconductors and information technology. The science parks of Hsinchu, Taichung and Tainan form a ‘silicon corridor’ down the west of the island, and the government nurtures high-tech industry with tax incentives and training; Taiwan is turning from an island of contract manufacturing into an island of technology."
 TAI_silicon_shield_idea: "Silicon Shield"
 TAI_silicon_shield_idea_desc: "The whole world depends on Taiwan's chips, and that is the best defense. TSMC holds over ninety percent of the world's most advanced manufacturing, and the US, Japan and Europe all regard stability in the Strait as their own interest; any military move against Taiwan would cost the global economy an unbearable price."
 TAI_ten_new_constructions_idea: "Ten New Major Construction Projects"
 TAI_ten_new_constructions_idea_desc: "A new round of major public works is under way across the island: high-speed rail, metro lines, ports and sewers are all being built at once. The projects boost building materials and construction and lay the groundwork for the next decade of development; work sites across the island run day and night."
 TAI_financial_reform_idea: "Second Financial Reform"
 TAI_financial_reform_idea_desc: "The merged financial holding groups are more competitive across the region. Cathay, Fubon, CTBC and the other groups grow larger and begin opening branches in Southeast Asia and on the mainland; banks' bad loan ratios fall, and tax revenue and financial stability both improve."
 TAI_three_links_idea: "The Three Links"
 TAI_three_links_idea_desc: "Direct mail, trade and transport bind the two economies ever closer. Hundreds of direct flights a week cross the Strait, and travel by Taiwanese businesspeople and mainland tourists soars; Taiwan's industries can use the mainland's market and capacity, but their economic dependence on the mainland deepens too."
 TAI_go_south_idea: "Go South Policy"
 TAI_go_south_idea_desc: "Taiwanese capital and industry are spreading across Southeast Asia. Taiwanese businesses are found in Vietnam's electronics plants, Indonesia's textile mills and Thailand's auto parts factories; the southbound policy means Taiwan's economy no longer depends on a single market, and its ties with Southeast Asia grow closer."
 TAI_roc_orthodoxy: "ROC Constitutional Orthodoxy"
 TAI_roc_orthodoxy_desc: "Taiwan is the base for the Republic of China's revival, not its final destination. The Constitution of the Republic of China still applies to all of China, and the legitimacy of the National Assembly and the Legislative Yuan traces back to the elections of 1947; every government policy rests on the premise that the mainland will one day be recovered."
 TAI_roc_orthodoxy_2: "Guidelines for National Unification"
 TAI_roc_orthodoxy_2_desc: "A unified China that is democratic, free and equitably prosperous is the Republic of China's unchanging national policy. The Guidelines for National Unification once again become the government's highest guiding principle: exchanges and reciprocity in the short term, mutual trust and cooperation in the medium term, and negotiated unification in the long term. If the other side refuses to democratize, the Republic of China reserves all options."
 TAI_taiwan_identity: "Taiwanese Identity"
 TAI_taiwan_identity_desc: "The people of this land are the masters of the nation. Polls show the share identifying as ‘Taiwanese’ rising year after year, especially among the young; this identity binds society together and makes Taiwanese more willing to fight for their democracy and way of life."
 TAI_porcupine_idea: "Porcupine Strategy"
 TAI_porcupine_idea_desc: "Make any invader pay a price he cannot bear. The National Army builds a defensive web the enemy cannot easily get its teeth into, from mobile missiles, drones, mines and man-portable weapons in great numbers; when fighting on Taiwan itself, every city and every hilltop is a fortress."
 TAI_formosa_resilience_idea: "Resilient Taiwan"
 TAI_formosa_resilience_idea_desc: "Civil society and civil defense keep Taiwan standing through any storm. Community disaster groups, hospital contingency plans, companies' backup systems and civilian defense training form a safety net covering the whole of society; whether earthquake, epidemic or war, Taiwan is ready."
 TAI_pragmatic_diplomacy_idea: "Pragmatic Diplomacy"
 TAI_pragmatic_diplomacy_idea_desc: "Names and forms can be flexible; what matters is being seen. Diplomats build substantive relations in countries without formal ties under the banners of trade, culture and humanitarian aid; Taiwan's international visibility and goodwill accumulate step by step through this pragmatic diplomacy."
 TAI_international_space_idea: "International Space"
 TAI_international_space_idea_desc: "The Republic of China takes part in international organizations and affairs in every possible form: as an observer, under a special name or as a trade entity. Its diplomats seek a voice at every opportunity, and goodwill and trade with other countries grow accordingly."
 TAI_han_kuang_idea: "Han Kuang Spirit"
 TAI_han_kuang_idea_desc: "Exercises with live troops, live fire and no script forge real fighting power. Every year's Han Kuang exposes problems and fixes them, and the units' organization and combat experience improve steadily with each test."
 TAI_reserve_mobilization_idea: "Reserve Mobilization System"
 TAI_reserve_mobilization_idea_desc: "A nation in arms, with reservists ready to rejoin their units at any time. A well-run refresher training system keeps more than two million reservists' basic skills sharp, and once mobilization is ordered they can be back with their units within three days."
 TAI_whampoa_spirit_idea: "Whampoa Spirit"
 TAI_whampoa_spirit_idea_desc: "Fraternity, love, sincerity, truth. Whampoa's motto has been handed down through the generations, and from the Northern Expedition and the War of Resistance to the defense of the Strait, National Army officers have lived by these words; it shapes the army's morale and the character of its leaders."
 TAI_joint_operations_idea: "Joint Operations"
 TAI_joint_operations_idea_desc: "The army, navy and air force fight together under a single command. The joint operations center links the services by datalink, the army's attacks are covered by the navy and air force, and the scale and efficiency of amphibious landings rise sharply."
 TAI_counteroffensive_preparation: "Counteroffensive Preparations"
 TAI_counteroffensive_preparation_desc: "The Project National Glory office is working day and night on plans for the counteroffensive. Set up by Chiang Kai-shek in 1961, the office once drew up dozens of plans to retake the mainland; now they are dug out and updated, and the time the landing forces need to prepare is cut sharply."
 TAI_counteroffensive: "Counterattack on the Mainland"
 TAI_counteroffensive_desc: "Recover the mainland, rescue our compatriots! The bugle of the counteroffensive has sounded, the armed forces are in high spirits and the whole nation stands united behind the war. Amphibious assault is what the National Army knows best, and every beachhead will be taken."
 TAI_landing_operations: "Southeast Landing Operations"
 TAI_landing_operations_desc: "All three services throw their full weight behind the landings on the coasts of Fujian, Zhejiang and Guangdong. Landing ships shuttle across the Strait day and night, the air force covers the beaches, and follow-on troops and supplies pour ashore without pause; it is the largest amphibious operation in the National Army's history."
 TAI_us_backing: "US Tacit Approval"
 TAI_us_backing_desc: "Washington turns a blind eye to our plans and helps behind the scenes with satellite intelligence, technical support and diplomatic cover. America will not intervene openly, but it will not stand with Beijing either."
 TAI_mainland_integration_1: "Mainland Integration: Everything to Rebuild"
 TAI_mainland_integration_1_desc: "1.3 billion people, a completely different social system and half a century of separation. The new government's authority has not yet reached the grassroots."
 TAI_mainland_integration_2: "Mainland Integration: Gradual Recovery"
 TAI_mainland_integration_2_desc: "The provincial governments have been rebuilt, but local resistance remains: some cadres drag their feet, the underground CCP is still active, and garrisons are needed everywhere to keep order. Integration is slow, and the government's efficiency and authority suffer for it."
 TAI_mainland_integration_3: "Mainland Integration: The Outcome Is Settled"
 TAI_mainland_integration_3_desc: "Integration is nearly complete, with only scattered resistance left. The provincial administrations are running normally and people have gradually accepted the new government; what resistance remains comes mostly from remote mountains and a few diehards."
 TAI_military_government: "Period of Military Government"
 TAI_military_government_desc: "Restoring order and clearing out remnants by military force is the first step of national reconstruction. The Father of the Nation designed three stages, military rule, tutelage and constitutional government; martial law under military rule breaks resistance quickly, but stifles political life."
 TAI_political_tutelage: "Period of Political Tutelage"
 TAI_political_tutelage_desc: "The government trains the people in the four powers and introduces local self-government county by county. Civic training and county elections under tutelage gradually familiarize people with how democracy works; society is stable, and local development begins to speed up."
 TAI_constitutional_government: "Period of Constitutional Government"
 TAI_constitutional_government_desc: "The Constitution of the Republic of China is in force throughout China, and sovereignty rests with the people. The National Assembly, the Five Yuan and local self-government all function fully, and the people choose their government by ballot; constitutional stability brings political vitality, flourishing research and deeper democracy."
 TAI_army_reorganization: "Reorganizing the PLA"
 TAI_army_reorganization_desc: "Millions of former PLA soldiers are being reorganized into the National Army. Redesignation, officer screening and political education go on at once, and the units' organization is in disarray for a while; but most of these men are trained, and once reorganized they will be a vast pool of manpower for the National Army."
 TAI_national_reconciliation_idea: "National Reconciliation"
 TAI_national_reconciliation_idea_desc: "Meet with a smile and let old grudges vanish. By not prosecuting ordinary party members and grassroots cadres, the government lets most people drop their guard and accept the new order; the resistance loses its popular base, and order returns quickly everywhere."
 TAI_mainland_justice_idea: "Transitional Justice"
 TAI_mainland_justice_idea_desc: "The wounds of history must be faced and responsibility pursued. Transitional justice trials and the opening of the archives give the victims an accounting and greatly weaken communism's appeal; but the families of those punished and the old cadres resent the new government."
 TAI_whampoa_reborn: "A Century of Whampoa"
 TAI_whampoa_reborn_desc: "The Whampoa Military Academy returns to Changzhou Island and carries on a century of tradition. A new generation of officers trains here in tactics, military history and the constitution; Whampoa's tradition combined with modern military education produces one class of fine commanders after another."
 TAI_economic_integration_idea: "Cross-Strait Economic Integration"
 TAI_economic_integration_idea_desc: "Taiwan's capital and technology combined with the mainland's market and labor. Integrating the two economies speeds up factory construction and productivity together, and supply chains are reorganized across the Strait; the Chinese economy enters a new round of rapid growth."
 TAI_land_reform_idea: "Land to the Tiller"
 TAI_land_reform_idea_desc: "Hundreds of millions of farmers own their own land, and the countryside absorbs a great deal of labor. With secure title, farmers are willing to invest in improving their fields, and agricultural productivity rises sharply; stability in the countryside is the foundation of the whole nation's stability."
 TAI_privatization_idea: "Privatizing State Enterprises"
 TAI_privatization_idea_desc: "State enterprises are being privatized on a massive scale. Market discipline quickly raises their efficiency and profits, and the treasury's tax take grows with them; but millions of state employees face layoffs, and unease is building in society."
 TAI_regulated_capital_idea: "Regulation of Capital"
 TAI_regulated_capital_idea_desc: "Private individuals must not control the people's livelihood. Key industries remain in state hands while private enterprise develops freely elsewhere; this mixed economy keeps society stable and steadily raises the nation's industrial capacity."
 TAI_national_reconstruction_idea: "The Fundamentals of National Reconstruction"
 TAI_national_reconstruction_idea_desc: "Psychological, material and social reconstruction proceed on every front. The Father of the Nation's Plans for National Reconstruction become the blueprint for national development, with industry, research and social welfare advancing together; a modern China is taking shape fast."
 TAI_begonia_restored: "The Begonia Leaf"
 TAI_begonia_restored_desc: "The begonia-leaf map is finally whole again. From the Pamirs to the Ussuri, from the northern deserts to the Spratlys, the lost lands have returned one by one; the whole nation is swept up in national pride, and the government's prestige reaches its peak."
 TAI_world_for_all_idea: "The World Belongs to All"
 TAI_world_for_all_idea_desc: "When the Great Way prevails, the world belongs to all. A Republic of China of the people, by the people and for the people has been realized across China: clean government, a thriving economy and a stable society, and the nations of the world look on this newborn democratic great power with genuine admiration."

 ### 外交好感
 TAI_cross_strait_thaw: "Cross-Strait Thaw"
 TAI_southbound_partner: "Southbound Partner"
 TAI_shared_values: "Shared Values"
 TAI_arms_customer: "Arms Customer"
 TAI_allied_aid: "Aid from Allies"
 TAI_overseas_chinese_ties: "Overseas Chinese Ties"
 TAI_new_china_respect: "A Unified China"

 ### 事件
 roc_return.1.t: "Pan-Blue Coalition Forms a Cabinet"
 roc_return.1.d: "The Kuomintang, the People First Party and the New Party form a majority coalition in the Legislative Yuan and, after a series of political struggles, win the right to form the cabinet. The pan-blue camp lost the presidency through its split in 2000, and now it is united again. The new administration vows to restore the Republic of China's constitutional orthodoxy and push for national unification, and cross-Strait relations are set for change."
 roc_return.1.a: "Long live the Republic of China!"
 roc_return.2.t: "A Secret Envoy from Taipei"
 roc_return.2.d: "A secret envoy from the Republic of China has brought an astonishing request: Taipei is considering ‘recovering the mainland’ when the time is right, and hopes Washington will at least look the other way, and ideally lend support behind the scenes.\n\nBacking the plan could drag us into direct conflict with Beijing. Refusing could push Taipei into a desperate gamble, or make it give up entirely."
 roc_return.2.a: "We will... turn a blind eye."
 roc_return.2.b: "Absolutely not. Keep the status quo."
 roc_return.3.t: "Washington's Tacit Approval"
 roc_return.3.d: "The secret envoy brings good news back from Washington: the Americans will not say so publicly, but they will not stop us, and are willing to help with intelligence and logistics. State Department officials say privately that if the mainland falls into turmoil, America would welcome a democratic China. With Washington's tacit consent, retaking the mainland is no longer just talk."
 roc_return.3.a: "With America behind us, we can stand tall."
 roc_return.4.t: "Washington Objects"
 roc_return.4.d: "The Americans make clear that they oppose any military action that changes the status quo in the Strait and warn Taipei not to act rashly: if the National Army starts a war, America will provide no help and may even suspend arms sales. Washington's opposition casts a shadow over the counteroffensive plans, but it also convinces some that we can only rely on ourselves."
 roc_return.4.a: "We can only rely on ourselves."
 roc_return.5.t: "Taipei's Unification Proposal"
 roc_return.5.d: "The government of the Republic of China has formally presented us with a unification plan: under the constitution of the Republic of China, the two sides would merge into one democratic China, the current government would hand over power peacefully, and ordinary party members and officials would be guaranteed against reprisals.\n\nIn the past, such a proposal would have been laughed off. But times have changed."
 roc_return.5.a: "For the future of China, we accept."
 roc_return.5.b: "Absurd! Taiwan is an inseparable part of China."
 roc_return.6.t: "Beijing Accepts Unification!"
 roc_return.6.d: "News that stuns the world: Beijing has accepted our unification plan! Beset at home and abroad, the CCP Central Committee decides to hand over power peacefully in exchange for its members' safety and a legal political status. The transfer of power will be completed within months, and the Blue Sky, White Sun and a Wholly Red Earth flag will soon rise over Tiananmen."
 roc_return.6.a: "Long live the Republic of China! Long live China!"
 roc_return.7.t: "Beijing Rejects Unification"
 roc_return.7.d: "Beijing flatly rejects our unification plan and repeats in its statement that it ‘will never renounce the use of force’. The Eastern Theater Command immediately holds live-fire exercises in the Taiwan Strait, with missiles landing off Taiwan's coast. The door to peace is closed for now, and cross-Strait relations are back at daggers drawn."
 roc_return.7.a: "Then it will be settled by arms."
 roc_return.9.t: "The National Army Liberates Nanjing"
 roc_return.9.d: "The National Army of the Republic of China entered Nanjing today. Before the Sun Yat-sen Mausoleum, officers and men saluted the tomb of the Father of the Nation, and the Blue Sky, White Sun and a Wholly Red Earth flag flies once more over the old Republican capital. Hundreds of thousands gathered in front of the Presidential Palace, many of the old weeping; more than seventy years have passed since the Nationalist government left Nanjing in April 1949."
 roc_return.9.a: "History comes full circle."
 roc_return.10.t: "Unification Proposal from the Republic of China"
 roc_return.10.d: "The government in Nanjing sends us a note stating that the Republic of China has never recognized the 1946 referendum on Outer Mongolia's independence, and proposing that Mongolia return to the Republic of China as a highly autonomous region, keeping its parliament, language and culture and receiving substantial economic aid. The streets of Ulaanbaatar buzz with debate, and the nation's future hangs on this decision."
 roc_return.10.a: "We accept."
 roc_return.10.b: "Mongolia is an independent country!"
 roc_return.11.t: "Ulaanbaatar Refuses to Return"
 roc_return.11.d: "The Mongolian government rejects our proposal and puts the country on a war footing. The State Great Khural unanimously reaffirms that Mongolia is an independent sovereign state, and tens of thousands in Ulaanbaatar's square wave the national flag and chant ‘independence’. The peaceful road has come to an end, and only force remains."
 roc_return.11.a: "They will regret this."
 roc_return.12.t: "Outer Mongolia Returns"
 roc_return.12.d: "The Mongolian government accepts our proposal, and Outer Mongolia will return to the Republic of China as an autonomous region. In front of the parliament building in Ulaanbaatar, the Mongolian flag and the Blue Sky, White Sun and a Wholly Red Earth flag are raised side by side; for the first time since 1921, the northern steppe is again part of the Republic of China, and the biggest missing piece of the begonia leaf is restored."
 roc_return.12.a: "The northern steppe is ours once more."
 roc_return.13.t: "Return to the Republic of China?"
 roc_return.13.d: "The People's Republic of China is no more, and the Republic of China government in Nanjing invites us to return to the Republic of China and keep a high degree of autonomy under the new constitution. Our laws, currency and way of life will be guaranteed, permanently. The people must decide whether to accept this promise or go their own way."
 roc_return.13.a: "We accept."
 roc_return.13.b: "We will choose our own path."
 roc_return.14.t: "The Republic of China Restores China"
 roc_return.14.d: "From Nanjing to Beiping, the flag of the Republic of China at last flies over the whole of mainland China. For more than half a century, many saw this as an impossible dream. Yet 1.3 billion people, a completely different social system and a long separation now await the new government."
 roc_return.14.a: "A new era begins."
 roc_return.15.t: "The Republic of China Returns to the UN"
 roc_return.15.d: "The UN General Assembly today passed a resolution recognizing the government of the Republic of China as the sole legitimate representative of China at the United Nations. After decades, the Republic of China takes back its permanent seat on the Security Council. As the Blue Sky, White Sun and a Wholly Red Earth flag was raised at UN headquarters in New York, many diplomats rose to applaud; the humiliation of the 1971 withdrawal is finally history."
 roc_return.15.a: "History turns a new page."
 roc_return.16.t: "The Begonia Leaf"
 roc_return.16.d: "With the return of Outer Mongolia and the frontier regions, the ‘existing national boundaries’ laid down in the Constitution of the Republic of China have been restored in fact. The begonia-leaf map reappears on the map of the world. Map publishers everywhere rush to redraw their maps, and generations who grew up in Taiwan finally find that the map in their textbooks was no fantasy."
 roc_return.16.a: "The land is united."
 roc_return.17.t: "Taipei Requests US Intervention"
 roc_return.17.d: "The Republic of China is at war with the People's Republic of China, and Taipei formally asks us to honor our tacit promise and join the war directly. Hawks in Congress demand support for a democratic ally, while the Pentagon warns of the risks of war with a nuclear power; the President must choose between America's credibility and the lives of American soldiers."
 roc_return.17.a: "America stands with its allies."
 roc_return.17.b: "We will not fight Taipei's war."
 roc_return.18.t: "America Enters the War!"
 roc_return.18.d: "Washington declares war on Beijing, the Seventh Fleet sails into the Taiwan Strait, and aircraft on Guam and Okinawa go to the highest alert. It is the first time since 1950 that American forces have fought Chinese forces head-on; with America in the war, the National Army's counteroffensive will have powerful naval and air support, and victory is in sight."
 roc_return.18.a: "Victory is in sight!"
 roc_return.19.t: "America Declines to Intervene"
 roc_return.19.d: "The Americans say they can keep providing intelligence and supplies, but will not send troops. The White House spokesman says America supports Taiwan's self-defense but will not drag American soldiers into a civil war between Chinese. The National Army loses its most powerful outside help, but at least American weapons and intelligence will keep coming."
 roc_return.19.a: "Understandable."
 roc_return.20.t: "Hong Kong and Macau Return"
 roc_return.20.d: "[From.GetName] has accepted our invitation and formally returned to the Republic of China. The SAR flag rises beside the Blue Sky, White Sun and a Wholly Red Earth flag, and people celebrate in the streets. The promise of a high degree of autonomy will be written into the constitution with no time limit; it is the best answer to ‘one country, two systems’."
 roc_return.20.a: "Welcome home."
 roc_return.21.t: "[From.GetName] Refuses to Return"
 roc_return.21.d: "[From.GetName] has rejected our invitation and insists on going its own way. Its politicians declare they do not want to pass from one regime's rule to another's, and the international community urges both sides to settle their differences through dialogue. Nanjing must decide whether to respect their choice or resolve the matter some other way."
 roc_return.21.a: "We respect their choice."
 roc_return.21.b: "That is not theirs to decide."

 ### v2/v3
 TAI_economic_miracle_idea: "Second Economic Miracle"
 TAI_economic_miracle_idea_desc: "Taiwan's economy takes off once again. The success of the tech industry lifts factory capacity and research capability together, and exports set record after record; for the second time since the 1960s, Taiwan is a miracle of the world economy."
 TAI_mature_democracy_idea: "Deepening Democracy"
 TAI_mature_democracy_idea_desc: "Democracy has taken deep root in Taiwan. Changes of ruling party are routine, election results are respected by all, and civil society is lively; a mature democracy lends the government's policies greater legitimacy and makes society more stable."
 TAI_pan_blue_unity_idea: "Pan-Blue Unity"
 TAI_pan_blue_unity_idea_desc: "The Kuomintang and the People First Party work hand in hand. Lien Chan and James Soong put the past behind them, and the pan-blue camp nominates and acts as one in the Legislative Yuan and local elections; a united camp gives the government more confidence in governing."
 TAI_culture_renaissance_idea: "Chinese Cultural Renaissance"
 TAI_culture_renaissance_idea_desc: "Taiwan is the guardian of Chinese culture. Traditional characters, the treasures of the National Palace Museum and traditional festivals make Taiwan the home of authentic Chinese culture in the eyes of Chinese at home and abroad; this cultural confidence also binds society together."
 TAI_war_economy_idea: "Wartime Economic System"
 TAI_war_economy_idea_desc: "Civilian industry is fully mobilized for defense. Electronics plants make missile guidance systems, textile mills sew uniforms and car plants convert military vehicles; arms production rises sharply, but consumer goods are in shorter supply as a result."
 TAI_mobilization_idea: "General Mobilization"
 TAI_mobilization_idea_desc: "All reservists return to their units. More than two million reservists rejoin the forces, doubling the National Army's strength within days; the whole of society goes onto a war footing and morale is high, but so many workers leave the factories that productivity suffers."
 TAI_northern_expedition_idea: "Northern Expedition"
 TAI_northern_expedition_idea_desc: "The National Army marches north once more! In 1926 the Northern Expedition swept through the Yangtze valley at astonishing speed; today's expedition carries on that tradition, driving forward fast with armor and air power, its sights set on Beiping."
 TAI_mobile_defense_idea: "Mobile Defense"
 TAI_mobile_defense_idea_desc: "Win at the shoreline, defend in depth. The National Army guards the coast with mobile forces and counterattacks in the first moments of an enemy landing; even if a beach is lost, the defenses in depth make the enemy pay for every step."
 TAI_defense_autonomy_idea: "Defense Self-Reliance"
 TAI_defense_autonomy_idea_desc: "Key weapons are developed and produced at home. The defense industry no longer depends on foreign parts and licenses, and arms factories' efficiency and output rise steadily; even under a foreign embargo, the National Army's supplies will not be cut off."
 TAI_wto_member_idea: "WTO Member"
 TAI_wto_member_idea_desc: "A member of the WTO as the Separate Customs Territory of Taiwan, Penghu, Kinmen and Matsu. Taiwanese goods enter world markets at lower tariffs and trade with other countries grows busier; imported consumer goods also make life easier for ordinary people."
 TAI_de_facto_alliance_idea: "De Facto Alliance"
 TAI_de_facto_alliance_idea_desc: "No treaty in name, but an alliance in fact. American technology transfer, military training and intelligence sharing steadily raise the National Army's research and fighting power; the public believes Taiwan will not stand alone in a crisis."
 TAI_balanced_powers_idea: "Balance of Central and Local Power"
 TAI_balanced_powers_idea_desc: "A balance of powers between the center and the provinces. National matters belong to the center and matters suited to local conditions to the provinces, giving each province room to govern; local initiative is unleashed, while the risk of separatism is held in check by the system."
 TAI_five_yuan_idea: "Five Yuan System"
 TAI_five_yuan_idea_desc: "Five separate powers checking one another. The Executive, Legislative, Judicial, Examination and Control Yuan each do their job: the Examination Yuan ensures a professional civil service, and the Control Yuan impeaches officials who fail in their duty; this unique constitutional design makes government cleaner and more efficient."
 TAI_open_society_idea: "Open Society"
 TAI_open_society_idea_desc: "Freedom of speech and of the press. With the newspaper ban lifted and censorship abolished, ideas of every kind compete freely in the media and online; an open society spurs innovation and research, but the sudden clamor of voices also unsettles society for a while."
 TAI_cultural_renaissance_idea: "Chinese Cultural Renaissance"
 TAI_cultural_renaissance_idea_desc: "Monuments, temples and traditional festivals are reviving. Restored Confucian temples and ancestral halls become the heart of their communities again, and the customs of Qingming, Duanwu and Mid-Autumn return to daily life; the cultural revival restores a lost sense of identity and makes society more settled."
 TAI_free_movement_idea: "Freedom of Movement"
 TAI_free_movement_idea_desc: "Farmers are free to move to the cities to work and live. With hukou abolished, migrant workers' children can go to school and see doctors in the cities, and urban construction and population grow fast; a greater sense of fairness makes the whole country more stable."
 TAI_national_identity_idea: "Chinese National Identity"
 TAI_national_identity_idea_desc: "We are all citizens of the Republic of China. Whether from Taiwan or the mainland and whatever their ethnicity, a common constitution and democratic system bind everyone together; voices of resistance to the new government grow ever fewer, and national cohesion keeps strengthening."
 TAI_five_races_idea: "Five Races Under One Union"
 TAI_five_races_idea_desc: "The Republic of China is the shared state of all its peoples. The languages, religions and cultures of the minorities are protected by the constitution, and every people has its own representatives in parliament; resistance on the frontiers gradually dies down, and acceptance of the new government keeps growing."
 TAI_world_factory_idea: "Factory of the World"
 TAI_world_factory_idea_desc: "The world's largest manufacturing nation. Unified China has the most complete supply chain in the world, from chips and cars to ships; factory capacity and efficiency reach unprecedented heights, and ‘Made in China’ sells all over the world."
 TAI_tax_reform_idea: "Unified Tax System"
 TAI_tax_reform_idea_desc: "The tax systems of both sides are unified and the tax base broadened. The new system rests mainly on income and business taxes, simplifies a tangle of levies and cracks down on evasion; the treasury's revenue grows steadily, and local governments no longer have to live off land sales."
 TAI_strong_currency_idea: "Strong National Currency"
 TAI_strong_currency_idea_desc: "The national currency is one of Asia's most important reserve currencies. Its stable value gives international investors and trading partners full confidence, imports become cheaper, and the government's tax revenue rises with the booming economy."
 TAI_infrastructure_boom_idea: "The International Development of China"
 TAI_infrastructure_boom_idea_desc: "A nationwide infrastructure boom. The railways, ports and water projects of the Father of the Nation's International Development of China break ground one by one, and work sites across the country run day and night; better transport and energy networks lay solid foundations for an economic takeoff."
 TAI_social_security_idea: "National Health and Labor Insurance"
 TAI_social_security_idea_desc: "Everyone can afford a doctor and everyone is provided for in old age. National health insurance and labor insurance cover the whole country, and health care and retirement are no longer mountains on ordinary families' backs; people feel more secure, and the population grows steadily."
 TAI_theater_command_idea: "Five Theater Commands"
 TAI_theater_command_idea_desc: "The theaters fight, the services build. The five theater commands handle operational command while each service builds and trains its forces; the new system speeds up operational planning and tightens the organization of the units."
 TAI_professional_army_idea: "Professional National Army"
 TAI_professional_army_idea_desc: "An elite professional army. Volunteer service lets soldiers treat the military as a career, and long-serving NCOs build up deep experience; training time for recruits falls, while the units' organization and combat experience rise steadily."
 TAI_combined_arms_idea: "Combined Arms Warfare"
 TAI_combined_arms_idea_desc: "Combined arms battalions and brigades. Infantry, armor, artillery and engineers fight together within one battalion, and the battalion commander can call for fire support directly; the National Army can bring the full power of combined arms to bear in both attack and defense."
 TAI_nuclear_deterrent_idea: "Nuclear Deterrent"
 TAI_nuclear_deterrent_idea_desc: "The final guarantee of a unified China's security. The retained nuclear arsenal follows a no-first-use policy and is reserved for retaliation; it keeps any potential enemy from acting rashly, and the public has full confidence in the nation's defense."
 TAI_nuclear_free_idea: "Nuclear-Free China"
 TAI_nuclear_free_idea_desc: "The first great power ever to give up nuclear weapons voluntarily. IAEA inspectors confirm that every warhead has been destroyed; the decision wins the respect of the whole world, and other nations' goodwill toward the Republic of China grows by the day."
 TAI_air_dominance_idea: "Air Supremacy over East Asia"
 TAI_air_dominance_idea_desc: "The Republic of China Air Force rules the skies of East Asia. Stealth fighters, AWACS and tankers form a complete air combat system, and its pilots' training and experience are the best in Asia; any rival who contests air superiority will pay dearly."
 TAI_world_class_military_idea: "World-Class National Army"
 TAI_world_class_military_idea_desc: "A modern, professional, national National Revolutionary Army. The army's organization, the navy's blue-water reach and the air force's technology all rank with the world's best; loyal to the constitution and defending the nation, it is unified China's firmest backstop."
 TAI_trade_superpower_idea: "Trading Power"
 TAI_trade_superpower_idea_desc: "The world's largest trading nation. China accounts for a sixth of world trade, and every country wants to do business with this enormous market; trading partners' goodwill smooths diplomacy, and foreign investment speeds up industrial construction."
 TAI_sino_american_alliance_idea: "Sino-American Alliance"
 TAI_sino_american_alliance_idea_desc: "Two great democracies join hands to keep the peace in the Pacific. American technology transfer, joint exercises and intelligence sharing steadily raise the National Army's research and fighting power; the public believes that with America as an ally, a unified China will never stand alone in the world."
 TAI_independent_diplomacy_idea: "Independence and Self-Reliance"
 TAI_independent_diplomacy_idea_desc: "China's affairs are decided by the Chinese. Allied to no one and dependent on no great power, the Republic of China keeps its own judgment in world affairs; this independent stance wins popular support at home and gives the government more confidence."
 TAI_asia_leader_idea: "Leader of Asia"
 TAI_asia_leader_idea_desc: "Asia's affairs are led by Asians. The Republic of China rallies the nations of Asia with economic, cultural and diplomatic influence and takes the lead in regional organizations; its neighbors' goodwill and trade grow by the day."
 TAI_world_power_idea: "World Power"
 TAI_world_power_idea_desc: "A unified, democratic and prosperous world power. The Republic of China carries great weight in the UN, the economy and technology, and at home its politics are stable and its people united; the whole world acknowledges that China has returned to the center of the world stage."
 TAI_kmt_government_idea: "Kuomintang Government"
 TAI_kmt_government_idea_desc: "The Kuomintang governs. On the prestige of the Restoration and its complete organization, the century-old party carries out its Three Principles program nationwide; government is stable and decisive, and public confidence in defense and unification rises with it."
 TAI_kmt_era_idea: "Governing by the Three Principles"
 TAI_kmt_era_idea_desc: "The Kuomintang's century-old ideal is finally realized across China. National independence, popular rights and a prosperous livelihood: the Three Principles are no longer slogans in a textbook but the working program for governing a nation of 1.4 billion people."
 TAI_dp_government_idea: "China Democratic Party Government"
 TAI_dp_government_idea_desc: "The liberals govern. The China Democracy Party government champions human rights, the rule of law and an open society, and academic and expressive freedom unleashes society's creativity; democratic values take deep root across the nation."
 TAI_dp_free_market_idea: "Free Market"
 TAI_dp_free_market_idea_desc: "Prices and resources are set by the market. With controls and approvals abolished, companies quickly become more efficient and the private economy thrives; consumer goods are more plentiful and prices more reasonable."
 TAI_dp_antitrust_idea: "Antitrust"
 TAI_dp_antitrust_idea_desc: "A market order of fair competition. With monopolistic state firms and conglomerates broken up, small and medium businesses get a chance to compete with the giants and the market is more dynamic; consumers and workers both gain from the competition."
 TAI_liberal_china_idea: "Free China"
 TAI_liberal_china_idea_desc: "A free, democratic China under the rule of law. The China Lei Chen and Yin Haiguang dreamed of has finally come true: free speech, independent courts and open markets, with the world's liberal democracies seeing China as a like-minded partner."
 TAI_sd_government_idea: "Social Democratic Government"
 TAI_sd_government_idea_desc: "The social democrats govern. The China Social Democratic Party seeks a balance between the market economy and social justice, and unions, workers and farmers are the government's staunchest supporters; society is calmer, and policy has a broader popular base."
 TAI_sd_welfare_idea: "Welfare State"
 TAI_sd_welfare_idea_desc: "A cradle-to-grave social safety net. Childcare, education, health care, unemployment and old age are all guaranteed by the state, and young couples are more willing to have children; but the enormous welfare bill weighs ever more heavily on the public finances."
 TAI_social_china_idea: "A Socially Just China"
 TAI_social_china_idea_desc: "The Principle of People's Livelihood joined with social democracy. The gap between rich and poor narrows markedly and every citizen shares in the fruits of growth; society is stable, the population grows, and China becomes a country both prosperous and fair."
 TAI_coalition_government_idea: "Grand Coalition Government"
 TAI_coalition_government_idea_desc: "The major parties govern together. No single party can act alone, and major decisions require negotiation among all of them; politics is more stable as a result, but decision-making slows down and the government's ability to act is limited."
 TAI_grand_compromise_idea: "Historic Grand Reconciliation"
 TAI_grand_compromise_idea_desc: "A consensus of blue and green, Taiwan and the mainland, left and right. Historic reconciliation ends the parties' mutual hostility, and debate in parliament is rational and practical; the whole nation is more united than ever, and the government's program enjoys broad support."
 TAI_nko_reform_idea: "North Korean Reform and Opening"
 TAI_nko_reform_idea_desc: "With the Republic of China's help, North Korea begins a gradual reform and opening. Farmers may grow crops on private plots and sell grain at market, and factories in the export processing zones start taking orders; the regime in Pyongyang gradually steadies itself through reform."
 TAI_korea_peace_idea: "Peace on the Peninsula"
 TAI_korea_peace_idea_desc: "Peace on the Korean Peninsula is guaranteed by the Republic of China. The armistice is replaced by a peace treaty and the DMZ is gradually dismantled; peace on the peninsula makes Northeast Asian trade more prosperous and greatly raises Nanjing's international standing."
 TAI_nko_transition_idea: "Transitional Government"
 TAI_nko_transition_idea_desc: "After the coup, the new government is still consolidating power. Remnants of the Kim family's faction and troops loyal to the old regime are still active in secret, and the situation in Pyongyang remains tense; the new government's authority and capacity to govern have yet to be established."
 TAI_nko_rebuild_idea: "Rebuilding North Korea"
 TAI_nko_rebuild_idea_desc: "Aid from the Republic of China is rebuilding North Korea's food supply, power and roads. Grain ships and engineering teams keep arriving, and factories and hydropower stations come back to life; the shadow of famine lifts and the population begins to grow again."
 TAI_roc_forces_korea_idea: "ROC Forces in Korea"
 TAI_roc_forces_korea_idea_desc: "The National Army of the Republic of China is stationed on the Korean Peninsula. The forces in Korea train and patrol alongside the ROK Armed Forces and gain valuable experience on the 38th parallel; they are also the most direct symbol of the alliance between the two countries."
 TAI_roc_forces_in_korea_idea: "ROC Forces in Korea"
 TAI_roc_forces_in_korea_idea_desc: "The National Army of the Republic of China guards the 38th parallel alongside the ROK Armed Forces. The garrison strengthens the peninsula's defenses, and any attack from the north would face the armies of both countries at once; the commitment also makes people at home proud of their nation's standing in the world."
 TAI_nuclear_concern: "Chinese Nuclear Threat"
 TAI_nuclear_free_respect: "Nuclear-Free China"
