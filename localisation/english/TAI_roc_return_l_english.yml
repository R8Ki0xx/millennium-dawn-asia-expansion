 TAI_red_insurgency_1_desc: "The CCP underground is still lying low here."
 TAI_insurgency_category: "CCP Remnants"
 TAI_insurgency_category_desc: "After the fall of Beijing, the CCP remnants withdrew into the mountains and industrial cities of the Northeast and North China to wage guerrilla war.\n\nCurrent §YCCP Remnants§!: §R[?TAI_ccp_insurgency|0]§!/100\nSevere zones: §R[?TAI_ins_severe|0]§!  Active: §Y[?TAI_ins_active|0]§!  Dormant: [?TAI_ins_latent|0]\n\nIf the remnants reach 75 or more with at least 2 severe zones, the CCP will launch an §Rarmed uprising§!, starting the Third Chinese Civil War."
 TAI_dec_ccp_uprising_mission: "A CCP Uprising Is Imminent"
 TAI_dec_ccp_uprising_mission_desc: "Intelligence shows the CCP remnants massing in the Northeast and North China, preparing an armed uprising. Bring the remnants below 60 to defuse the crisis."
 TAI_dec_suppression: "Suppression Campaign"
 TAI_dec_suppression_desc: "Send in the National Army and military police to sweep the CCP guerrillas in the area. Sweeps can quickly weaken the guerrillas, but military operations may also harm civilians and stir up resentment, driving more people to join them."
 TAI_dec_pacification: "Pacification and Development"
 TAI_dec_pacification_desc: "Win local hearts and minds with road building, relief and jobs programs. The guerrillas are rooted in popular discontent, and the new government undermines their base with real construction and relief; this road is slower than a sweep, but its effects last longer."
 TAI_dec_counterintelligence: "Counterintelligence Sweep"
 TAI_dec_counterintelligence_desc: "The National Security Bureau breaks up the underground CCP organization. Through wiretaps, informants and captured documents it roots out underground party cells hidden in government offices, factories and schools one by one, dealing a heavy blow to the guerrillas' intelligence and supply networks."
