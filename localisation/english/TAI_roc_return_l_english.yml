 roc_return.100.d: "第 [?TAI_na_term|0] 届国民大会第 [?TAI_na_session|0] 次常会在南京国民大会堂开幕。总统向大会提出施政报告。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。施政报告的表决结果：[TAI_na_session_result]。"
