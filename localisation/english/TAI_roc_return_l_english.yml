 TAI_return_window_tt: "反攻时机成熟（满足以下任一条件）：\n - 大陆局势动荡度达到§Y50§!\n - §Y中国§!稳定度低于35%\n - §Y中国§!陷入内战\n - §Y中国§!正与另一个大国交战"
 TAI_defectors_tt: "§G3§!个师的解放军部队将阵前起义，加入国军。之后可以通过决议继续策反。"
 TAI_defectors_small_tt: "§G2§!个师的解放军部队将阵前起义，加入国军。"
