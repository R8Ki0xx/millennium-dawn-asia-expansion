 ROC_CHI.socialism_icon: "£CHI_social_democrat"
 ROC_CHI.socialism_desc: "（社会民主主义） - 中国社会民主党\n\n光复之后，大陆的独立工会、知识分子与部分中共改革派共同组建了中国社会民主党。该党继承孙中山“民生主义”的理想，主张福利国家、劳工权益与节制资本。"
 PRC_rump_leader: "Xi Jinping"
 PRC_rump_leader_desc: "After the fall of Beijing, Xi Jinping led the remnants of the CCP Central Committee inland as Chairman of the Central Military Commission."
 roc_return.30.t: "首届全国大选"
 roc_return.30.d: "全国各地的投票所前排起了长龙。这是中国历史上第一次由全体国民以普选方式选出国家领导人与国会。\n\n开票结果出炉——"
 roc_return.30.a: "中国国民党胜选！"
 roc_return.30.b: "中国民主党胜选！"
 roc_return.30.c: "中国社会民主党胜选！"
 roc_return.30.e: "没有政党过半，组成大联合政府。"
 roc_return.31.t: "政权和平交接"
 roc_return.31.d: "第二次全国大选结束后，败选的执政党在总统府前与胜选者握手，完成了和平的政权交接。在这片土地上，这样的场景前所未见。"
 roc_return.31.a: "这就是民主。"
 roc_return.40.t: "青天白日满地红"
 roc_return.40.d: "南京、上海、广州、北京……从城市到乡村，青天白日满地红旗出现在每一座政府机关前。有人在街头痛哭，有人默默观望，有人仍然心怀疑虑。\n\n中华民国的法统，在离开大陆半个多世纪之后，回到了它诞生的土地。"
 roc_return.40.a: "中华民国万岁！"
 roc_return.40.b: "先安定人心，再谈庆祝。"
 roc_return.41.t: "解放军残部拒绝投降"
 roc_return.41.d: "在西南与西北的山区，部分解放军部队拒绝接受新政府的整编命令，据险顽抗。"
 roc_return.41.a: "武力清剿。"
 roc_return.41.b: "招抚为上，许以优待。"
 roc_return.42.t: "抢购潮与通货膨胀"
 roc_return.42.d: "对新货币的不信任，引发了各大城市的抢购潮。物价一日数变，民怨沸腾。"
 roc_return.42.a: "动用国库平抑物价。"
 roc_return.42.b: "让市场自行调整。"
 roc_return.43.t: "中南海的交接"
 roc_return.43.d: "中南海的大门打开了。新政府的接收人员在这里清点档案、文物与机要文件。许多尘封数十年的秘密，即将公诸于世。"
 roc_return.43.a: "公开档案，还原历史。"
 roc_return.43.b: "暂时封存，以免激化矛盾。"
 roc_return.44.t: "十三亿人的期待"
 roc_return.44.d: "大陆同胞对新政府怀有极高的期待：更好的生活、更多的自由、更公正的社会。新政府能否满足这些期待，将决定民国的未来。"
 roc_return.44.a: "加大民生投入。"
 roc_return.44.b: "循序渐进，量力而行。"
 roc_return.46.t: "戒严令"
 roc_return.46.d: "为恢复秩序，新政府在全国实施戒严。宪兵与警察接管各地治安，夜间实施宵禁。"
 roc_return.46.a: "这只是暂时的。"
 roc_return.47.t: "训政开始"
 roc_return.47.d: "军政时期结束，训政时期开始。政府在各县开办公民训练班，教导人民行使四权。"
 roc_return.47.a: "向宪政迈进。"
 roc_return.48.t: "中华民国宪法全面施行"
 roc_return.48.d: "1947 年制定的中华民国宪法，终于在全中国范围内全面施行。"
 roc_return.48.a: "主权在民。"
 roc_return.49.t: "北京陷落"
 roc_return.49.d: "北京已经陷落，国民党军占领了大半个中国。中共中央残余成员撤往内陆，宣布继续抵抗。"
 roc_return.49.a: "革命尚未成功……"
 roc_return.50.t: "反攻令下达"
 roc_return.50.d: "总统在总统府发表全国广播：“国军将士们，反攻大陆的时刻到了！”\n\n金门、马祖与澎湖的炮兵阵地同时开火，登陆船团驶出了高雄与基隆港。"
 roc_return.50.a: "光复大陆，解救同胞！"
 roc_return.51.t: "台海战争爆发"
 roc_return.51.d: "中华民国今日对中华人民共和国宣战，宣布“反攻大陆”。台湾海峡上空炮火连天，全球股市应声大跌。各国政府纷纷呼吁双方克制。"
 roc_return.51.a: "这是第二次国共内战吗？"
 roc_return.52.t: "国民党军来犯"
 roc_return.52.d: "台湾当局悍然对我宣战！国民党军的飞机与舰艇正向东南沿海逼近。"
 roc_return.52.a: "全民皆兵，打退来犯之敌！"
 roc_return.52.b: "稳住内部，避免恐慌。"
 roc_return.53.t: "滩头阵地"
 roc_return.53.d: "国军在东南沿海成功建立滩头阵地。后续部队与物资源源不断地登陆。"
 roc_return.53.a: "向内陆推进！"
 roc_return.55.t: "北伐誓师"
 roc_return.55.d: "国军在南京举行北伐誓师大会。将士们在中山陵前宣誓：不光复北平，誓不还师。"
 roc_return.55.a: "北伐！"
 roc_return.56.t: "国军光复北平"
 roc_return.56.d: "国军今日进入北平。天安门城楼上，青天白日满地红旗迎风飘扬。中华民国已经控制了中国大陆的绝大部分地区。"
 roc_return.56.a: "历史翻开了新的一页。"
 roc_return.60.t: "东南各省爆发起义"
 roc_return.60.d: "福建、浙江、广东、江西等省爆发大规模起义，起义者宣布成立“中华民国大陆临时政府”，并呼吁台湾出兵支援。"
 roc_return.60.a: "坚决镇压叛乱！"
 roc_return.60.b: "先稳住局势，再图后计。"
 roc_return.61.t: "中国内战爆发"
 roc_return.61.d: "中国东南沿海爆发大规模起义，起义政府宣布效忠中华民国。台湾海峡对岸的国民政府随即宣布出兵。这场中断了半个多世纪的内战，再度爆发了。"
 roc_return.61.a: "历史在重演。"
 roc_return.70.t: "平壤政变"
 roc_return.70.d: "凌晨四时，忠于新政府的朝鲜人民军部队包围了锦绣山太阳宫与劳动党中央大楼。中午，朝鲜中央电视台宣布：原领导人“因健康原因”辞去一切职务，新政府请求中华民国提供“必要的保护与援助”。\n\n朝鲜，从此是我们的了。"
 roc_return.70.a: "唇齿相依，这一次由我们来定义。"
 roc_return.71.t: "平壤政变"
 roc_return.71.d: "朝鲜中央电视台今日宣布，朝鲜最高领导人已辞去一切职务。新成立的过渡政府随即与中华民国签署了保护条约。分析人士普遍认为，南京的情报部门是这场政变的幕后推手。"
 roc_return.71.a: "金氏王朝就这样结束了？"
 roc_return.72.t: "中华民国提议新条约"
 roc_return.72.d: "南京提出以一份新的互不侵犯条约，取代 1961 年的《中朝友好合作互助条约》。新条约不再包含军事同盟条款，中国的无偿援助也将改为正常贸易。"
 roc_return.72.a: "接受新条约。"
 roc_return.72.b: "拒绝，我们不需要南京的施舍。"
 roc_return.73.t: "平壤签约"
 roc_return.73.d: "朝鲜接受了新的互不侵犯条约。鸭绿江两岸，从今以后只有贸易，没有同盟。"
 roc_return.73.a: "一个稳定的邻居。"
 roc_return.74.t: "中韩联军越过三八线"
 roc_return.74.d: "中华民国与大韩民国联合宣布对朝鲜开战。中韩联军从三八线与鸭绿江两个方向同时推进。七十年前的朝鲜战争中，中国军队站在三八线的另一边。"
 roc_return.74.a: "历史又转了一个弯。"
 roc_return.75.t: "朝鲜半岛统一"
 roc_return.75.d: "平壤解放，朝鲜半岛在大韩民国的旗帜下重新统一。中华民国国军将继续驻守半岛，保障新生的统一韩国。"
 roc_return.75.a: "分裂了七十年的民族，终于团圆。"
 roc_return.76.t: "中华民国国军进驻"
 roc_return.76.d: "第一批中华民国国军部队抵达汉城，与韩国国军共同守卫三八线。这是 1950 年以来，第一支由中国派来“保卫”韩国的部队。"
 roc_return.76.a: "欢迎盟友。"
 roc_return.62.t: "大陆陷入内战"
 roc_return.62.d: "中国大陆爆发内战，中共政权陷入分裂。这是国民政府数十年来等待的机会——还是一个危险的陷阱？"
 roc_return.62.a: "国军即刻渡海干预！"
 roc_return.62.b: "静观其变。"

