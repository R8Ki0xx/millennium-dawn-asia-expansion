 TAI_gov.8.t: "Nominate the President of the Control Yuan"
 TAI_gov.8.d: "The current President of the Control Yuan is §Y[TAI_gov_control_name]§!. Under the constitution the President may nominate a successor, to be appointed with the consent of the Control Yuan or the Legislative Yuan. The Control Yuan holds the powers of impeachment, censure and audit and is the gatekeeper of clean government, and its head's resolve decides how hard corruption is fought."
 TAI_gov.8.keep: "Keep the current President of the Control Yuan."
 TAI_gov_nominate_legis: "Nominate the President of the Legislative Yuan"
 TAI_gov_nominate_legis_desc: "Replace the President of the Legislative Yuan. The speaker presides over debate and mediates between government and opposition, a key figure in how parliament works; different choices bring different policy bonuses and affect the ruling party's influence in parliament."
 TAI_gov_nominate_judicial: "Nominate the President of the Judicial Yuan"
 TAI_gov_nominate_judicial_desc: "Replace the President of the Judicial Yuan. The President of the Judicial Yuan also chairs the Council of Grand Justices and is responsible for constitutional interpretation and judicial administration; the choice affects the image of judicial independence, and different choices bring different policy bonuses."
 TAI_gov_nominate_exam: "Nominate the President of the Examination Yuan"
 TAI_gov_nominate_exam_desc: "Replace the President of the Examination Yuan. The Examination Yuan runs the selection, appointment and training of civil servants, a distinctive branch of the five-power constitution; different choices bring different policy bonuses and affect the professionalism and efficiency of the civil service."
 TAI_gov_nominate_control: "Nominate the President of the Control Yuan"
 TAI_gov_nominate_control_desc: "Replace the President of the Control Yuan. The Control Yuan holds the powers of impeachment, censure and audit and is the gatekeeper of clean government; different choices bring different policy bonuses and determine how hard corruption is fought."
 TAI_five_yuan_category: "Government of the ROC · The Five Yuan"
 TAI_five_yuan_category_desc: "§LUnder the Five-Power Constitution, the government of the Republic of China is divided into five branches: the Executive, Legislative, Judicial, Examination and Control Yuan. The Premier requires the consent of the Legislative Yuan; without a majority there, the government is a minority government. The President may not also serve as Premier.§!"
 TAI_gov_gui_president: "Ruling party §Y[ROOT.GetRulingParty]§! · Legislative Yuan, term [?TAI_ly_term|0]"
 TAI_gov_gui_pres_name: "§Y[ROOT.GetLeader]§!"
 TAI_gov.9.t: "The President Cannot Also Be Premier"
 TAI_gov.9.d: "Under the constitution, the President may not also serve as Premier. The new President, §Y[ROOT.GetLeader]§!, was previously Premier and must step down from that post; §Y[TAI_gov_premier_name]§! takes over the Executive Yuan for now to keep the cabinet running. The Presidential Office may nominate a new Premier, or keep the current arrangement for a smooth transition."
 TAI_gov.9.a: "Nominate someone else as Premier."
 TAI_gov.9.b: "Keep the current choice."
