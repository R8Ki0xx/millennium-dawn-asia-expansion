 TAI_dec_han_kuang_drill: "Annual Han Kuang Exercise"
 TAI_dec_han_kuang_drill_desc: "A joint live-forces exercise of all three services to test the defense plans. The annual Han Kuang simulates a full-scale PLA attack, and the National Army finds problems and corrects its plans in the exercise, improving the units' combat experience and the cross-Strait military balance."
 TAI_dec_us_arms_package: "US Arms Purchase"
 TAI_dec_us_arms_package_desc: "Buy a package of new weapons from the US: fighter parts, air defense missiles and precision munitions. Every sale goes through review by the US Congress and delivery often takes years; but they effectively narrow the military gap across the Strait."
 TAI_dec_call_reservists: "Call Up Reservists"
 TAI_dec_call_reservists_desc: "Call up reservists for training to bring the units up to strength. Reservists leave their jobs and return to camp for two weeks of training; the units' numbers and readiness are replenished, though people's work and lives are disrupted to some extent."
 TAI_dec_anti_vote_buying: "Crack Down on Vote Buying"
 TAI_dec_anti_vote_buying_desc: "Prosecutors and investigators launch a full crackdown on vote buying and gangster involvement in elections. The Investigation Bureau and district prosecutors cast a wide net before the vote and punish every case heavily; the room for black gold politics shrinks, though the backlash from local factions briefly unsettles politics."
 TAI_dec_mop_up_remnants: "Mop Up the PLA Remnants"
 TAI_dec_mop_up_remnants_desc: "Launch operations against PLA remnants who refuse to be reorganized. These units hole up in remote mountains and border areas, looting supplies and attacking convoys; the sweeps give the troops combat experience, but prolonged fighting wears down the public's patience for war."
 TAI_dec_relief_program: "Distribute Relief Supplies"
 TAI_dec_relief_program_desc: "Distribute food, medicine and relief payments in the restored areas to win hearts and minds. War and the change of regime have left many families in hardship, and timely relief lets people feel the new government's goodwill; the cost is considerable, but public trust is worth more than anything."
 TAI_dec_purge_carpetbaggers: "Purge Corrupt Takeover Officials"
 TAI_dec_purge_carpetbaggers_desc: "Investigate corruption and embezzlement in the takeover severely as a warning to others. In 1945 officials grabbing ‘gold, houses, cars, women and positions’ cost the Nationalist government the mainland's trust; this time the Control Yuan and the Investigation Bureau work together, and every corrupt takeover official is dismissed, prosecuted and tried in public."
 TAI_dec_local_autonomy_pilot: "Local Self-Government Pilot"
 TAI_dec_local_autonomy_pilot_desc: "Pilot elected county and city heads in some provinces, using self-government to defuse separatism. If local strongmen can gain legitimacy through elections, they need not resist the center by force; but elections may also entrench them further, and some unrest is unavoidable in the short term."
 TAI_dec_price_stabilization: "Stabilize Prices"
 TAI_dec_price_stabilization_desc: "Use foreign reserves and strategic stocks to stabilize prices. Currency reform and the economic transition send prices swinging wildly, with grain and fuel prices changing several times a day; the government sells off reserves and cracks down on hoarding to avoid repeating the gold yuan disaster of 1948."
 TAI_dec_joint_exercise: "Grand Joint Exercise"
 TAI_dec_joint_exercise_desc: "Hold a great joint exercise of all three services on the North China Plain and in the East China Sea. Units from Taiwan and the mainland fight together in the same exercise for the first time, and the General Staff tests the new command system; it is also a chance to show neighboring countries the strength of the unified National Army."
 TAI_military_readiness_category: "National Army Readiness"
 TAI_military_readiness_category_desc: "Prepare the forces for war and fix the National Army's structural weaknesses. In the Taiwan era the National Army faces a cross-Strait military imbalance, the switch to volunteers and the infiltration of black gold politics; these decisions improve readiness step by step through exercises, arms purchases, reserve call-ups and crackdowns on vote buying."
 TAI_reconstruction_category: "Governing the Restored Areas"
 TAI_reconstruction_category_desc: "After the Restoration the mainland has everything to rebuild: mopping up remnants, calming the people and cleaning up officialdom. The government must deal at once with PLA remnants, soaring prices, corruption in the takeover and regional separatism, and any one of these could shake the foundations of the new regime."
 Juche: "Juche"
 Juche_desc: "Juche: the official ideology of the Workers' Party of Korea, a hereditary communist system centered on the leader."

