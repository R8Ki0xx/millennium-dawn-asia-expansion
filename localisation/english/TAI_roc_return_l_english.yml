 TAI_gov.3.d: "第 [?TAI_ly_term|0] 届立法委员选举结果揭晓：中国国民党 [?TAI_ly_kmt|0] 席、中国民主党 [?TAI_ly_dp|0] 席、民革 [?TAI_ly_sd|0] 席、亲民党 [?TAI_ly_pfp|0] 席、中国共产党 [?TAI_ly_cpc|0] 席、无党籍及其他 [?TAI_ly_other|0] 席。执政联盟共 [?TAI_ly_gov|0] 席。"
