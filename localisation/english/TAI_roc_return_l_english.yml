 ROC_CHI.socialism: "£CHI_social_democrat (CSDP) - Chinese Social Democratic Party"
 ROC_CHI.socialism_icon: "£CHI_social_democrat"
 ROC_CHI.socialism_desc: "(Social Democracy) - Chinese Social Democratic Party\n\nAfter the Restoration, independent trade unions, intellectuals and some CCP reformers on the mainland came together to found the Chinese Social Democratic Party. Heir to Sun Yat-sen's ideal of the Principle of Livelihood, it calls for a welfare state, workers' rights and the regulation of capital."
 PRC_rump_leader: "Xi Jinping"
 PRC_rump_leader_desc: "After the fall of Beijing, Xi Jinping led the remnants of the CCP Central Committee inland as Chairman of the Central Military Commission."
 roc_return.30.t: "The First National Election"
 roc_return.30.d: "Long lines form outside polling stations across the country, from the forests of Heilongjiang to the fishing villages of Hainan, as hundreds of millions of voters hold a ballot for the first time. It is the first time in Chinese history that the whole people choose the nation's leaders and parliament by universal suffrage, and international observers call it the largest democratic election in human history.\n\nThe results are in:"
 roc_return.30.a: "The Kuomintang wins!"
 roc_return.30.b: "The China Democratic Party wins!"
 roc_return.30.c: "The Chinese Social Democratic Party wins!"
 roc_return.30.e: "No party has a majority. A grand coalition government is formed."
 roc_return.31.t: "A Peaceful Transfer of Power"
 roc_return.31.d: "After the second national election, the defeated ruling party shakes hands with the winners in front of the Presidential Palace and hands over the seals of state, completing a peaceful transfer of power. On a land where for five thousand years changes of power usually ended in war, such a scene has never been seen; political scientists say Chinese democracy is now truly consolidated."
 roc_return.31.a: "This is democracy."
 roc_return.40.t: "Blue Sky, White Sun, and a Wholly Red Earth"
 roc_return.40.d: "Nanjing, Shanghai, Guangzhou, Beijing... from the cities to the villages, the Blue Sky, White Sun and Wholly Red Earth flag now flies in front of every government office. Some weep in the streets, some watch in silence, and some still harbor doubts.\n\nMore than half a century after it left the mainland, the constitutional orthodoxy of the Republic of China has returned to the land where it was born."
 roc_return.40.a: "Long live the Republic of China!"
 roc_return.40.b: "Calm the people first; celebrate later."
 roc_return.41.t: "PLA Holdouts Refuse to Surrender"
 roc_return.41.d: "In the mountains of the Southwest and Northwest, some PLA units refuse the new government's orders to reorganize and hold out in rugged terrain. Their commanders are mostly diehard CCP members, some afraid of retribution, others still believing the revolution will triumph; they control several county towns and key roads and are a serious threat to the new government."
 roc_return.41.a: "Clear them out by force."
 roc_return.41.b: "Win them over with generous terms."
 roc_return.42.t: "Panic Buying and Inflation"
 roc_return.42.d: "Distrust of the new currency sets off panic buying in every major city. Supermarket shelves are stripped bare, people queue to withdraw their savings, and the black-market dollar rate changes several times a day; prices soar and anger boils over. The lesson of the gold yuan in 1948 is still vivid, and the government must restore confidence fast."
 roc_return.42.a: "Use the treasury to stabilize prices."
 roc_return.42.b: "Let the market adjust on its own."
 roc_return.43.t: "The Handover of Zhongnanhai"
 roc_return.43.d: "The gates of Zhongnanhai swing open. The new government's takeover teams inventory the archives, relics and classified papers inside: the decision records of every political campaign, the orders of the night of June Fourth, the asset lists of top leaders. Secrets sealed for decades are about to come to light; how these archives are handled will affect national reconciliation and stability."
 roc_return.43.a: "Open the archives and set the record straight."
 roc_return.43.b: "Seal them for now, to avoid inflaming tensions."
 roc_return.44.t: "The Hopes of 1.3 Billion"
 roc_return.44.d: "Our mainland compatriots have very high expectations of the new government: a better life, more freedom, a fairer society. Laid-off workers want their jobs back, farmers want land of their own, and young people want homes they can afford. Whether the new government can meet these hopes will decide the Republic's future; the higher the hopes, the greater the risk of disappointment."
 roc_return.44.a: "Spend more on people's livelihoods."
 roc_return.44.b: "Step by step, within our means."
 roc_return.46.t: "Martial Law"
 roc_return.46.d: "To restore order, the new government imposes martial law nationwide. Military police and police take over public order everywhere, a nighttime curfew is enforced and all gatherings and marches are banned. For those who lived through Taiwan's thirty-eight years of martial law, the scene is familiar; the government promises it is only a temporary measure of the period of military rule, to be lifted once order is restored."
 roc_return.46.a: "This is only temporary."
 roc_return.47.t: "Political Tutelage Begins"
 roc_return.47.d: "The period of military rule ends and the period of political tutelage begins. Martial law is lifted, the military police return to barracks, and the government opens citizenship classes in every county to teach the people the four powers of election, recall, initiative and referendum. The first counties to complete the training will hold elections for county magistrate, and China's road to democracy formally begins."
 roc_return.47.a: "Onward to constitutional government."
 roc_return.48.t: "The ROC Constitution Takes Full Effect"
 roc_return.48.d: "The Constitution of the Republic of China, adopted in 1947, finally takes full effect throughout China. Drafted by Carsun Chang and passed by the National Assembly in Nanjing, it was frozen by the Temporary Provisions for more than forty years in Taiwan; now every article is in force on the mainland, and 1.4 billion citizens truly become masters of their country for the first time."
 roc_return.48.a: "Sovereignty rests with the people."
 roc_return.49.t: "The Fall of Beijing"
 roc_return.49.d: "Beijing has fallen, and Kuomintang troops occupy most of China. The surviving members of the CCP Central Committee withdraw inland and to the Northeast with their archives and some of their forces, declaring that resistance will continue from a new capital. The party's newspapers are printed underground, calling on every member and soldier of the people's army to ‘fight to the end’. The revolution has not yet succeeded..."
 roc_return.49.a: "The revolution is not yet complete..."
 roc_return.50.t: "The Order to Counterattack"
 roc_return.50.d: "The President addresses the nation from the Presidential Palace: ‘Soldiers of the National Army, the time to retake the mainland has come!’ A slogan repeated for more than seventy years has finally become an order.\n\nThe batteries on Kinmen, Matsu and Penghu open fire at once, the landing flotillas sail out of Kaohsiung and Keelung, and air force jets roar across the Strait. Smoke fills the sky over the Taiwan Strait."
 roc_return.50.a: "Recover the mainland, free our compatriots!"
 roc_return.51.t: "War Breaks Out in the Taiwan Strait"
 roc_return.51.d: "The Republic of China today declared war on the People's Republic of China, announcing a ‘counteroffensive to retake the mainland’. Gunfire fills the sky over the Taiwan Strait and warships ply the waters between Kinmen and Xiamen; stock markets around the world plunge, with TSMC shares falling twenty percent in a day. Governments everywhere urge restraint, and the UN Security Council holds an emergency session."
 roc_return.51.a: "Is this a second Chinese Civil War?"
 roc_return.52.t: "The Kuomintang Army Attacks"
 roc_return.52.d: "The Taiwan authorities have brazenly declared war on us! Kuomintang aircraft and warships are closing on the southeast coast, and the guns on Kinmen are firing on Xiamen. The Central Military Commission puts the Eastern Theater Command on full alert, and the militias of Fujian and Zhejiang are urgently mobilized. It is the first all-out war across the Strait since 1958."
 roc_return.52.a: "Every citizen a soldier. Drive back the invaders!"
 roc_return.52.b: "Keep order at home and avoid panic."
 roc_return.53.t: "Beachhead"
 roc_return.53.d: "The National Army establishes beachheads on the southeast coast. After heavy losses the marines take the beaches and ports, and follow-on troops and supplies come ashore in a steady stream. Local people watch from the roadside, some quietly offering tea; the beachhead is secure, and the next step is to push inland."
 roc_return.53.a: "Push inland!"
 roc_return.55.t: "Oath of the Northern Expedition"
 roc_return.55.d: "The National Army holds a rally in Nanjing to launch the Northern Expedition. Beneath Purple Mountain tens of thousands of soldiers stand in formation as the President presents the colors. Before the Sun Yat-sen Mausoleum they swear not to return until Beiping is liberated. More than ninety years ago the National Revolutionary Army swore the same oath in Guangzhou; today history plays out again in Nanjing."
 roc_return.55.a: "Northern Expedition!"
 roc_return.56.t: "The National Army Liberates Beiping"
 roc_return.56.d: "The National Army entered Beiping today. Over the Gate of Heavenly Peace the Blue Sky, White Sun and a Wholly Red Earth flag flies in the wind, and the portrait at its center has been replaced by one of the Father of the Nation, Sun Yat-sen. Crowds line Chang'an Avenue, some cheering, some silent. The Republic of China now controls the great majority of the mainland, and the outcome of the war is no longer in doubt."
 roc_return.56.a: "History turns a new page."
 roc_return.60.t: "Uprisings in the Southeastern Provinces"
 roc_return.60.d: "Large-scale uprisings break out in Fujian, Zhejiang, Guangdong, Jiangxi and other provinces: workers strike, students march and some garrisons change sides. In Fuzhou the rebels proclaim the ‘Provisional Mainland Government of the Republic of China’, raise the Blue Sky, White Sun and a Wholly Red Earth flag and call on Taiwan to send troops. Beijing must decide how to respond."
 roc_return.60.a: "Crush the rebellion!"
 roc_return.60.b: "Stabilize the situation first, then decide."
 roc_return.61.t: "Civil War Breaks Out in China"
 roc_return.61.d: "Large-scale uprisings have broken out along China's southeast coast, and the rebel government has declared its loyalty to the Republic of China. The Nationalist Government across the Taiwan Strait immediately announced that it is sending troops. A civil war interrupted for more than half a century has broken out again."
 roc_return.61.a: "History repeats itself."
 roc_return.70.t: "Coup in Pyongyang"
 roc_return.70.d: "At four in the morning, Korean People's Army units loyal to the new government surrounded the Kumsusan Palace of the Sun and the Workers' Party headquarters. At noon, Korean Central Television announced that the former leader had resigned from all posts ‘for health reasons’, and that the new government asks the Republic of China for ‘necessary protection and assistance’.\n\nNorth Korea is ours now."
 roc_return.70.a: "As close as lips and teeth, and this time we set the terms."
 roc_return.71.t: "Coup in Pyongyang"
 roc_return.71.d: "Korean Central Television announced today that North Korea's supreme leader has resigned from all posts. The newly formed transitional government immediately signed a protection treaty with the Republic of China. Analysts widely believe Nanjing's intelligence services were behind the coup."
 roc_return.71.a: "Is this really the end of the Kim dynasty?"
 roc_return.72.t: "The Republic of China Proposes a New Treaty"
 roc_return.72.d: "Nanjing proposes a new non-aggression treaty to replace the 1961 Sino-North Korean Treaty of Friendship. The new treaty has no military alliance clause, and China's free aid will become normal trade. Pyongyang's leadership realizes that Beijing's protective umbrella is gone, and must decide whether to accept this realistic arrangement."
 roc_return.72.a: "Accept the new treaty."
 roc_return.72.b: "Refuse. We do not need Nanjing's charity."
 roc_return.73.t: "Pyongyang Signs"
 roc_return.73.d: "North Korea accepts the new non-aggression treaty, and the two sides' representatives sign it in Dandong. From now on there is only trade across the Yalu, not alliance; trucks crowd the Sino-Korean Friendship Bridge, and factories in Sinuiju start taking orders. A stable neighbor is good for both countries."
 roc_return.73.a: "A stable neighbor."
 roc_return.74.t: "Sino-Korean Forces Cross the 38th Parallel"
 roc_return.74.d: "The Republic of China and the Republic of Korea have jointly declared war on North Korea. Their combined forces are advancing from the 38th parallel and the Yalu River at the same time. Seventy years ago, in the Korean War, Chinese troops stood on the other side of the 38th parallel."
 roc_return.74.a: "History takes another turn."
 roc_return.75.t: "Korea Is Unified"
 roc_return.75.d: "Pyongyang is liberated, and the Korean Peninsula is reunited under the flag of the Republic of Korea. Families separated for seventy years are reunited at Panmunjom, and the barbed wire of the DMZ is torn down section by section. The National Army of the Republic of China will stay on the peninsula to protect the newborn unified Korea; the shape of Northeast Asia has changed for good."
 roc_return.75.a: "A nation divided for seventy years is whole again."
 roc_return.76.t: "ROC Forces Arrive"
 roc_return.76.d: "The first Republic of China troops arrive in Seoul to guard the 38th parallel alongside the ROK Armed Forces. It is the first force China has sent to ‘defend’ South Korea since 1950; seventy years ago Chinese volunteers came south from the north, and now troops under the Blue Sky, White Sun flag stand on the other side. Seoul's residents wave both nations' flags in the streets to welcome them."
 roc_return.76.a: "Welcome, allies."
 roc_return.62.t: "The Mainland Falls into Civil War"
 roc_return.62.d: "Civil war has broken out on the mainland and the CCP regime is splitting apart: rebel provinces declare independence and some military regions refuse the center's orders. Is this the chance the Nationalist government has waited decades for, or a dangerous trap? Rushing in could rally the mainland behind the CCP's banner; standing still could waste the opportunity."
 roc_return.62.a: "The National Army crosses the Strait at once!"
 roc_return.62.b: "Wait and see."

