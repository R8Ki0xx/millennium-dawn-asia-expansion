 ### v3.8 开局界面与 AI 行为
 TAI_MILLENNIUM_DAWN_DESC: "Founded in 1912, the Republic of China was the first democratic republic in Asia. After losing the Chinese Civil War in 1949, the Nationalist Government moved to Taiwan and carried on its constitutional orthodoxy in Taiwan, Penghu, Kinmen and Matsu. Over half a century, Taiwan produced a celebrated economic miracle and a democratic transition, joining the ‘Four Asian Tigers’, and its semiconductor industry leads the world.\n\nThe 2000 presidential election is close at hand, and the Kuomintang's long rule faces a serious challenge. Missiles across the Strait are still aimed at Taiwan, and Washington's commitment blows hot and cold. At the crossroads of a new millennium, will the Republic of China guard Taiwan and keep the status quo, or take up again the unfinished mission to restore China?"
 TAI_AI_BEHAVIOR: "@TAI Republic of China (Taiwan)"
 RULE_OPTION_TAI_HISTORICAL: "Historical: Maintain the Status Quo"
 RULE_OPTION_TAI_HISTORICAL_DESC: "The Republic of China follows the historical path: Taiwan first, the status quo, and deeper cross-Strait trade. It will §Rnever§! counterattack the mainland."
 RULE_OPTION_TAI_RETURN: "Restoration by Force"
 RULE_OPTION_TAI_RETURN_DESC: "The Republic of China upholds its constitutional orthodoxy, restarts Project National Glory and will §Ycounterattack the mainland§! when the time is right."
 RULE_OPTION_TAI_PEACEFUL: "Peaceful Unification"
 RULE_OPTION_TAI_PEACEFUL_DESC: "The Republic of China upholds its constitutional orthodoxy but aims for §Ycross-Strait peaceful unification talks§! and will not start a war itself."
 RULE_OPTION_TAI_NO_PATH_DESC: "The AI chooses its focuses freely. If §Y‘AI uses historical focuses’§! was ticked at game start, the Republic of China takes the historical path (maintain the status quo)."
