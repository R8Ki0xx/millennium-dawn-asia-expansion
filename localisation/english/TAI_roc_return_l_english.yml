 KORX_tb_fa50: "Fighter Export Technology"
 KORX_tb_apr: "Nuclear Power Plant Technology"
 KORX_tb_smr: "Small Modular Reactor Technology"
 KORX_tb_battery: "Battery and EV Technology"
 KORX_tb_bio: "Biopharmaceutical Technology"
 KORX_tb_wind: "New Energy Technology"
 KORX_tb_space: "Space Launch Technology"
 KORX_tb_semi_alliance: "Semiconductor and Display Technology"
 roc_asia.1.a: "The referendum passes, and the new constitution takes effect."
 roc_asia.1.b: "The referendum passed by a narrow margin, but the opposition camp refuses to accept it."
 roc_asia.1.t: "Result of the Constitutional Referendum"
 roc_asia.1.d: "The constitutional amendment is put to a national referendum, with turnout above sixty percent. Giant screens in Gwanghwamun Square show the count live, with supporters and opponents gathered on either side of the square. Whatever the result, it is a landmark day in South Korea's constitutional history: for the first time since 1987, the people have rewritten the nation's fundamental law with their own hands."
 TAI_ext_phi_us_ally: "Strengthened US-Philippine Alliance"
 TAI_ext_phi_china_pivot: "Philippine Friendliness Toward China"
 TAI_ext_phi_us_cool: "Philippine Estrangement"
 PHIP_clean_government_idea: "Clean Government"
 PHIP_clean_government_idea_desc: "‘Where there is no corruption, there is no poverty.’ Transparency and accountability in the executive improve: government procurement goes to open tender, officials' assets are scrutinized, and investigations of scandals no longer depend on political affiliation."
 PHIP_strongman_idea: "Strongman Rule"
 PHIP_strongman_idea_desc: "A strong president pushes public order and infrastructure with an iron fist, and critics accuse him of eroding democratic institutions. Crime falls, projects speed up and approval ratings stay high; but extrajudicial killings and pressure on the media draw fierce international criticism."
 PHIP_coalition_idea: "Grand Coalition"
 PHIP_coalition_idea_desc: "The traditional political clans and business reach an understanding, and politics is unusually calm. Bills pass Congress smoothly through bargaining among the factions and the government faces much less resistance; but the pace of reform slows as a result."
 PHIP_social_democracy_idea: "The Progressive Coalition's Social Contract"
 PHIP_social_democracy_idea_desc: "Land reform, workers' rights and universal health care form the core of the new government's program. Farmers get land, workers get unions and the poor can afford to see a doctor; social discontent falls noticeably and everyday goods are more plentiful."
 PHIP_national_consensus_idea: "A New National Consensus"
 PHIP_national_consensus_idea_desc: "The parties have agreed on the basic rules of politics, and the country has finally emerged from decades of political turmoil."
 PHIP_npa_low_tt: "The strength of the New People's Army has fallen below §Y30§!"
 roc_asia.20.a: "Keep pushing reform."
 roc_asia.20.t: "A Reforming Term"
 roc_asia.20.d: "The reformers' first term comes to an end, and voters are well satisfied with clean government: a former president has gone to prison for corruption, procurement is open and transparent, and the economy keeps growing. But many promises remain unkept, the anti-dynasty bill is stalled in Congress, and rural poverty has not noticeably improved. Reform must go on."
 roc_asia.21.a: "History will be the judge."
 roc_asia.21.t: "The End of the Strongman Era"
 roc_asia.21.d: "The strongman president leaves Malacañang at the end of his term, and his successor promises ‘continuity’. Manila's streets are indeed safer and the big infrastructure projects have been completed one after another; but the families of those killed in the drug war are still waiting for justice, and the ICC investigation remains unresolved. History will judge his record."
 roc_asia.22.a: "Stability above all."
 roc_asia.22.t: "A Smooth Term"
 roc_asia.22.d: "The coalition government's first term ends calmly, and the traditional clans' positions are largely unchanged: Manila's great families, Cebu's merchants and Mindanao's local bosses each keep their place. The economy grows steadily and foreign investors feel reassured by Philippine politics; but critics say the price of this stability is stagnant reform."
 roc_asia.23.a: "Let reform go deeper."
 roc_asia.23.t: "The Progressive Coalition's First Term"
 roc_asia.23.d: "The progressive alliance has passed the main laws of its term: agrarian reform, workers' rights and universal health care. Critics say reform was too slow and too costly; supporters say the country has changed direction. The next election will decide whether the Philippine left can hold its place at the center of power."
 roc_asia.24.a: "Open a new chapter of nation-building."
 roc_asia.24.t: "The Political Line Concludes"
 roc_asia.24.d: "The Philippine political landscape has finally settled: the parties agree on the basic rules, the shadow of insurgency is fading and transfers of power have become routine. The nation's attention turns to longer-term questions of the economy, the military and foreign policy; a generation later, the promise of the EDSA revolution has finally found a footing."
 TAI_ext_vie_us_partner: "Vietnam-US Comprehensive Partnership"
 TAI_ext_vie_china_coop: "Vietnam-China Comprehensive Strategic Cooperation"
 TAI_ext_vie_russia: "Traditional Vietnam-Russia Friendship"
 TAI_ext_vie_india: "Vietnam-India Strategic Cooperation"
 TAI_ext_vie_japan: "Vietnam-Japan Extensive Strategic Partnership"
 TAI_ext_vie_korea: "Vietnam-Korea Economic Ties"
 TAI_ext_vie_scs_tension: "Militarization of South China Sea Reefs"
 TAI_ext_vie_roc: "Pragmatic Vietnam-ROC Relations"
 VIEX_doi_moi_2_idea: "Đổi Mới 2.0"
 VIEX_doi_moi_2_idea_desc: "A second round of renovation centered on market reform, state enterprise restructuring and a more open investment climate. The private economy gets more room, foreign investment pours in, and tax revenue and research capacity rise together; Vietnam's economy enters a new round of rapid growth."
 VIEX_party_discipline_idea: "Party Rectification"
 VIEX_party_discipline_idea_desc: "Party rectification and ideological education tighten discipline again, but society becomes less open. Cadres are cautious and keep in line, and politics is stable; but entrepreneurs and foreign investors worry about excessive control, and the economy loses some of its vigor."
 VIEX_multiparty_idea: "Multi-Party Democracy"
 VIEX_multiparty_idea_desc: "Independent candidates, independent media and multiparty competition bring more vitality, and more quarrels. Western countries praise Vietnam's democratic transition, and trade and investment grow; but the new democratic politics is still learning how to handle disagreement."
 VIEX_red_junta_idea: "Military Rule"
 VIEX_red_junta_idea_desc: "The People's Army has taken over the state, and discipline and efficiency replace debate. Military rule keeps society orderly and greatly strengthens national mobilization; but Western countries keep their distance from the junta, and trade suffers."
 VIEX_blazing_furnace_idea: "The Blazing Furnace"
 VIEX_blazing_furnace_idea_desc: "The anti-corruption storm with ‘no forbidden zones and no exceptions’ brings down a string of senior officials and transforms the culture of officialdom. Less corruption raises the government's prestige, but officials afraid of being investigated dare not sign off on anything, and approvals for many projects are delayed."
 VIEX_fdi_hub_idea: "Global Manufacturing Hub"
 VIEX_fdi_hub_idea_desc: "Samsung, Intel and a host of foreign factories make Vietnam a key link in global supply chains. Industrial zones are built faster every year, foreign investment brings technology and jobs, and Vietnamese-made goods sell around the world."
 VIEX_mekong_granary_idea: "Mekong Granary"
 VIEX_mekong_granary_idea_desc: "Rice, seafood and tropical crops make up steady farm exports and underpin stability in the countryside. Farmers' incomes in the Mekong Delta grow steadily, and agricultural exports bring the country substantial foreign exchange and tax revenue."
 VIEX_digital_vietnam_idea: "Digital Vietnam"
 VIEX_digital_vietnam_idea_desc: "Homegrown tech companies and a huge base of young internet users drive rapid growth in the digital economy. Viettel, FPT and a new generation of startups make their mark in AI, cloud and e-commerce, and research and tax revenue grow together."
 VIEX_north_south_artery_idea: "North-South Artery"
 VIEX_north_south_artery_idea_desc: "Highways, high-speed rail and deep-water ports tie the two great economic centers of north and south tightly together. Logistics costs fall sharply, cities and industrial zones along the route grow quickly, and infrastructure is built ever faster as experience accumulates."
 VIEX_total_defense_idea: "All-People National Defense"
 VIEX_total_defense_idea_desc: "An all-people national defense system under the ‘four no's’ defense policy, with the standing army, reserves and militia working together. Vietnam can mobilize large forces at short notice, and the units' organization and morale stay high."
 VIEX_maritime_militia_idea: "Maritime Militia"
 VIEX_maritime_militia_idea_desc: "A combined system of fishermen and the coast guard that both protects fishing and patrols the sea, the front-line force for defending Vietnam's rights in the South China Sea. Thousands of fishing boats with satellite communications work with the coast guard and navy, greatly raising Vietnam's presence at sea."
 VIEX_bamboo_diplomacy_idea: "Bamboo Diplomacy"
 VIEX_bamboo_diplomacy_idea_desc: "‘Deep roots, a sturdy trunk, flexible branches’: friendly with every great power and dependent on none. Vietnam is a partner of the US, China, Russia, Japan and India at once, gaining from all sides, with trade and investment flowing in without pause."
 VIEX_asian_tiger_idea: "A New Asian Tiger"
 VIEX_asian_tiger_idea_desc: "Vietnam becomes one of the fastest-growing economies in Southeast Asia. Manufacturing, services and the digital economy all flourish, incomes rise quickly, and both government revenue and social stability reach new heights."
 VIEX_climate_resilience_idea: "Climate Resilience"
 VIEX_climate_resilience_idea_desc: "Facing rising seas and salinization in the Mekong Delta, Vietnam has built a nationwide climate adaptation system."
