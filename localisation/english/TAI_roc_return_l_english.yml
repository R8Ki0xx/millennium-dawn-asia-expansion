 roc_asia.1.a: "公投通过，新宪法生效。"
 roc_asia.1.b: "公投虽以微弱差距通过，反对阵营仍不服气。"
 roc_asia.1.t: "修宪公投结果"
 roc_asia.1.d: "修宪案交付全民公投，投票率超过六成。无论结果如何，这都是韩国宪政史上具有里程碑意义的一天。"
 TAI_ext_phi_us_ally: "美菲同盟的巩固"
 TAI_ext_phi_china_pivot: "菲律宾的对华友好"
 TAI_ext_phi_us_cool: "菲律宾的疏离"
 PHIP_clean_government_idea: "廉洁政府"
 PHIP_clean_government_idea_desc: "「没有贪腐，就没有贫穷。」行政部门的透明度与问责制度得到改善。"
 PHIP_strongman_idea: "强人治国"
 PHIP_strongman_idea_desc: "强势的总统以铁腕推进治安与基建，反对者批评其侵蚀了民主制度。"
 PHIP_coalition_idea: "朝野大联合"
 PHIP_coalition_idea_desc: "传统政治家族与商界达成默契，政局出现罕见的平稳。"
 PHIP_social_democracy_idea: "进步联盟的社会契约"
 PHIP_social_democracy_idea_desc: "土地改革、劳工权利与普惠医疗，构成新政府的施政核心。"
 PHIP_national_consensus_idea: "新的国家共识"
 PHIP_national_consensus_idea_desc: "各政党就基本政治规则达成共识，国家终于走出了持续数十年的政治动荡。"
 PHIP_npa_low_tt: "新人民军的强度已降到 §Y30§! 以下"
 roc_asia.20.a: "继续推动改革。"
 roc_asia.20.t: "改革的任期"
 roc_asia.20.d: "改革派的第一个任期结束，选民对廉洁政府的满意度很高，但仍有许多承诺没有兑现。"
 roc_asia.21.a: "历史自有公论。"
 roc_asia.21.t: "强人时代的谢幕"
 roc_asia.21.d: "强人总统在任期届满后离开了总统府，他的继任者承诺「延续政策」。"
 roc_asia.22.a: "稳定压倒一切。"
 roc_asia.22.t: "平稳的任期"
 roc_asia.22.d: "联合政府的第一个任期平稳结束，传统家族的格局基本未变。"
 roc_asia.23.a: "让改革继续深入。"
 roc_asia.23.t: "进步联盟的第一个任期"
 roc_asia.23.d: "进步联盟完成了任期内的主要立法。批评者说改革太慢，支持者说已经改变了方向。"
 roc_asia.24.a: "开启国家建设的新篇章。"
 roc_asia.24.t: "政治线落幕"
 roc_asia.24.d: "菲律宾的政治格局终于稳定下来。国家的注意力，转向经济、军事与外交这些更长远的议题。"
 TAI_ext_vie_us_partner: "越美全面伙伴关系"
