 TAI_five_yuan_category: "Government of the ROC · The Five Yuan"
 TAI_five_yuan_category_desc: "§LUnder the Five-Power Constitution, the government of the Republic of China is divided into five branches: the Executive, Legislative, Judicial, Examination and Control Yuan. The Premier requires the consent of the Legislative Yuan; without a majority there, the government is a minority government. The President may not also serve as Premier.§!"
