 roc_asia.40.a: "Let reform go deeper."
 roc_asia.40.b: "Slow down to contain the risks."
 roc_asia.40.t: "Party Congress: Đổi Mới 2.0"
 roc_asia.40.d: "The party congress adopts the program for a second round of renovation. A batch of state firms is equitized, a batch of private companies is brought into the heart of national strategy, and barriers to foreign investment fall further. Delegates argue fiercely in the hall: reformers want to go faster, conservatives fear losing control of the economy. The final decision will shape Vietnam's course for the next decade."
 roc_asia.41.a: "Discipline is the guarantee of victory."
 roc_asia.41.b: "Don't let discipline smother vitality."
 roc_asia.41.t: "The Party's Leadership Strengthened Across the Board"
 roc_asia.41.d: "Party rectification reaches its climax. Party membership and the number of branches hit record highs, every company and school has a party organization, and social order is more stable than ever. But young people are tired of endless political study, and foreign companies complain that party cells interfere in their business. The party must find a balance between discipline and vitality."
 roc_asia.42.a: "Respect the result of the election."
 roc_asia.42.b: "Worry about political fragmentation."
 roc_asia.42.t: "Vietnam's First Multi-Party Election"
 roc_asia.42.d: "Candidates from several parties and independents stand in the election, and turnout reaches eighty percent. The streets of Saigon and Hanoi are covered with every kind of campaign poster, and televised debates draw tens of millions of viewers. For the first time the National Assembly has a real opposition, and Vietnamese democracy takes its first step."
 roc_asia.43.a: "Order above all."
 roc_asia.43.b: "Return power to the people step by step."
 roc_asia.43.t: "The First Year of Military Rule"
 roc_asia.43.d: "The military administration committee announces ‘great achievements’: public order has improved, projects have been completed and corrupt officials sent before military courts. But international criticism grows ever sharper, Western countries freeze some aid and foreign investors hold back. The generals must decide whether to keep ruling with an iron fist or gradually return power to civilians."
 roc_asia.44.a: "This is the work of generations."
 roc_asia.44.t: "A New Asian Tiger"
 roc_asia.44.d: "An IMF report says Vietnam has become one of the fastest-growing economies in the world, with per capita income entering the upper-middle-income bracket. Skyscraper after skyscraper rises on the skyline of Ho Chi Minh City; little more than thirty years ago, the country was still under the shadow of famine and war."
 roc_asia.45.a: "Hold our ground. No retreat."
 roc_asia.45.b: "Seek de-escalation through ASEAN."
 roc_asia.45.t: "Standoff in the Spratlys"
 roc_asia.45.d: "After Vietnam deploys missiles and radar on its Spratly reefs, China Coast Guard and Vietnamese coast guard ships face off in the disputed waters, with both sides' fishing boats drawn in. Satellite photos show dozens of vessels gathered in the area, and world opinion is watching closely. Hanoi must decide whether to hold its ground or seek de-escalation through ASEAN."
 roc_asia.46.a: "Release emergency drought funds."
 roc_asia.46.b: "Switch to salt-tolerant crops and aquaculture."
 roc_asia.46.t: "Salinization of the Delta"
 roc_asia.46.d: "An unprecedented drought sends salt water hundreds of kilometers up the Mekong Delta, devastating rice fields and wiping out the harvests of hundreds of thousands of households. Water held back by upstream dams and rising seas make the disaster worse. The government launches an emergency plan, but the long-term answer lies in changing the delta's farming."
 KORX_security_review: "Defense White Paper: A Full Security Review"
 KORX_security_review_desc: "North Korea's nuclear crises and missile tests come ever more often, while the US–China rivalry leaves Seoul caught between two great powers. The National Security Council decides on a full review of South Korea's security strategy, and the new defense white paper will answer one basic question: who can South Korea really rely on?"
 KORX_nuclear_debate: "The Nuclear Debate"
 KORX_nuclear_debate_desc: "‘Should we have nuclear weapons of our own?’ has become the focus of national debate. Polls show a majority in favor, and both the United States and China are watching closely."
 KORX_missile_forces: "Missile Strategic Command"
 KORX_missile_forces_desc: "Merge the missile units scattered across the services into a single strategic command, with unified planning for the development and deployment of the Hyunmoo series. The range and payload limits of the US–ROK missile guidelines have been lifted, and South Korea can finally develop long-range strike capabilities as it sees fit."
 KORX_nuclear_sharing: "Nuclear Sharing"
 KORX_nuclear_sharing_desc: "Follow NATO's nuclear sharing model: American tactical nuclear weapons are redeployed to South Korea, the two countries jointly plan and exercise nuclear operations, and ROK Air Force jets are certified to deliver nuclear bombs. Without breaching the NPT, South Korea has a say in the use of nuclear weapons for the first time."
 KORX_independent_deterrent: "Independent Nuclear Deterrent"
 KORX_independent_deterrent_desc: "Nuclear weapons are the ultimate guarantee of national security. Polls show more than seventy percent of the public in favor, and the National Assembly finally passes a resolution authorizing the government to start an independent nuclear weapons program. The program the US halted in the Park Chung-hee era is revived, at the cost of international sanctions and a shaken alliance."
 KORX_nonnuclear_pledge: "Non-Nuclear Pledge"
 KORX_nonnuclear_pledge_desc: "The government reaffirms the 1991 Joint Declaration on the Denuclearization of the Korean Peninsula and seeks security guarantees from the international community as a non-nuclear state. Seoul believes that holding the moral high ground will win more support from Washington and the world than owning nuclear weapons."
 KORX_nuclear_latency: "Reprocessing and Nuclear Latency"
 KORX_nuclear_latency_desc: "Renegotiate the US–ROK nuclear cooperation agreement to win the right to reprocess and enrich nuclear fuel, putting ‘nuclear latency’ in South Korea's hands. Japan has long had this right; South Korea wants to be able to cross the threshold within months if it ever has to."
 KORX_npt_exit: "Withdraw from the NPT"
 KORX_npt_exit_desc: "Under Article X of the treaty, South Korea formally notifies the UN Security Council that its supreme interests are threatened and that it will leave the Non-Proliferation Treaty in three months."
 KORX_peaceful_atom: "Peaceful Use of Nuclear Energy"
 KORX_peaceful_atom_desc: "As a party to the NPT, develop civilian nuclear power and domestic fuel production without crossing any red lines. South Korea's own APR-1400 reactor has been exported to the UAE, and KEPCO is bidding for new projects in Europe and the Middle East: nuclear power is another of South Korea's export calling cards."
 KORX_hyunmoo: "Hyunmoo Ballistic Missiles"
 KORX_hyunmoo_desc: "From Hyunmoo-2 to Hyunmoo-5, range and warhead weight keep growing: the ‘monster missile’, with a warhead weighing several tons, can penetrate bunkers dozens of meters underground and takes conventional deterrence against North Korea to a new level. Pyongyang's underground command posts are within range of South Korean conventional weapons for the first time."
 KORX_kamd: "Korean Air and Missile Defense (KAMD)"
 KORX_kamd_desc: "Build a multi-layered air defense network of L-SAM, Cheongung-II and Patriot to protect the capital region from North Korean missiles and artillery. Seoul is only fifty kilometers from the DMZ, and the North's long-range guns and rocket launchers could turn it into a ‘sea of fire’ at any moment; the network is a shield for twenty-five million people."
 KORX_thaad_deploy: "Accept THAAD"
 KORX_thaad_deploy_desc: "The US THAAD system is fully deployed at Seongju. Chinese economic retaliation follows swiftly: Lotte Mart is forced out of the mainland, Korean pop stars are banned and Chinese tour groups dwindle. But THAAD's radar and interceptors greatly improve air defense for the capital region and US bases."
 KORX_thaad_refuse: "Refuse THAAD: The Three Nos"
 KORX_thaad_refuse_desc: "‘No joining the US missile defense system, no THAAD deployment, no US-Korea-Japan military alliance.’ That way our economic ties with China will not suffer."
 KORX_us_forces_deal: "USFK Cost-Sharing Agreement"
 KORX_us_forces_deal_desc: "Renegotiate the Special Measures Agreement with Washington. The Americans demand that South Korea sharply increase its share of the cost of US forces, even threatening to withdraw them; Seoul insists the alliance is not a business deal. The amount becomes the political focal point of the alliance and tests the patience of both countries' leaders."
 KORX_deterrence_final: "Korea's Three-Axis System"
 KORX_deterrence_final_desc: "Kill Chain, Korean Air and Missile Defense and Korea Massive Punishment and Retaliation together form South Korea's own deterrence system: destroy missiles preemptively, intercept whatever gets through, then strike Pyongyang's leadership with devastating retaliation. South Korea is no longer just a protectorate under the American umbrella."
 KORX_demographic_commission: "Committee on the Population Crisis"
 KORX_demographic_commission_desc: "The total fertility rate has fallen below 1.0, the lowest in the world; schools are closing, the countryside is emptying, and maternity wards shut one after another. The committee on low fertility and an aging society is upgraded, with the President personally chairing it to coordinate the ministries. The survival of the Republic of Korea is at stake."
 KORX_birth_incentives: "Birth Grants and Childcare Allowances"
 KORX_birth_incentives_desc: "A one-off grant for every newborn, child allowances extended until the child turns eight, and priority in housing and school admission for large families: having children becomes an undertaking the state supports. Critics say handing out money alone will not solve the underlying problem."
 KORX_housing_supply: "Housing Supply in the Capital Region"
 KORX_housing_supply_desc: "The average Seoul apartment now costs twenty times an ordinary young person's annual income, and sky-high prices are the main reason young people do not marry or have children. The government announces more housing supply in the capital region, eases redevelopment restrictions, and offers newlyweds low-interest loans and public rental housing."
 KORX_pension_reform: "National Pension Reform"
 KORX_pension_reform_desc: "The National Pension fund is projected to run dry by the middle of the century, and young people paying in now might receive nothing when they retire. The government puts forward a reform plan with options to pay more and receive less, or claim later, setting off a fierce argument between generations, with groups of elderly and young people facing off outside the National Assembly."
 KORX_childcare_system: "Public Childcare System"
 KORX_childcare_system_desc: "Build a nationwide network of public childcare centers and after-school care so working parents need not worry. Places in public nurseries used to mean waiting for years, while private ones were expensive and hard to trust; now every neighborhood has a state-certified center where children are looked after until eight in the evening."
 KORX_work_hours: "Shorter Hours and Flexible Work"
 KORX_work_hours_desc: "Cap the working week at 52 hours and promote flexible work and parental leave for both parents. South Korea's working hours have long been among the highest in the OECD, and a workplace culture of after-hours drinking with the boss puts young people off. The chaebol strongly oppose it, saying it will hurt competitiveness."
 KORX_jeonse_reform: "Jeonse Reform"
 KORX_jeonse_reform_desc: "The traditional jeonse system, renting with a huge up-front deposit, leaves both tenants and landlords exposed to great risk. The government introduces new tenancy protections."
 KORX_new_towns: "New Towns"
 KORX_new_towns_desc: "Develop a third generation of new towns on the edge of the capital region, served by the GTX express rail and industrial parks, to ease Seoul's population pressure. The commute from the new towns to Gangnam falls to half an hour, and young families finally have a chance to afford a home of their own."
 KORX_pension_raise: "Raise Contributions and the Pension Age"
 KORX_pension_raise_desc: "Raise contributions and delay the pension age in exchange for the fund's long-term stability. It is bad news for young and old alike: the young must pay more for longer, and those near retirement must wait several more years. Conservatives call it responsible reform; progressives say it shifts the burden onto ordinary people."
 KORX_basic_pension: "Universal Basic Pension"
 KORX_basic_pension_desc: "Pay a basic pension to all elderly citizens to relieve old-age poverty. South Korea's elderly poverty rate is the highest in the OECD, and many old people who gave their lives to the factories and their children during industrialization now survive by collecting cardboard. This money lets them at least live with dignity."
 KORX_immigration_policy: "Multicultural Society and Foreign Worker Visas"
 KORX_immigration_policy_desc: "Loosen E-9 work visas and permanent residency and promote ‘multicultural’ integration policies to fill the labor shortage. Rural fishing boats, factories and nursing homes already depend on workers from Vietnam, the Philippines and Nepal; now the government gives them a chance to stay and become real neighbors."
 KORX_regional_balance: "Balanced Regional Development and Sejong"
 KORX_regional_balance_desc: "Move more central government agencies to Sejong and build up regional hubs such as Busan and Gwangju, breaking the grip of the ‘Republic of Seoul’. Half the population and nearly all big company headquarters are packed into the capital region, while regional cities wither as people leave."
 KORX_elderly_care: "Long-Term Care Insurance"
 KORX_elderly_care_desc: "Expand long-term care insurance for the elderly and train more caregivers to prepare for a ‘super-aged society’. By 2025 one in five South Koreans is over sixty-five; demand for home care, day care and nursing homes multiplies, and caregiving becomes a new source of jobs."
 KORX_demographic_final: "A New Social Contract"
 KORX_demographic_final_desc: "Housing, childcare, pensions and work: a whole set of interlocking institutions gives the young generation reason to believe in the future again. The fall in births finally slows and wedding halls start taking bookings again. No one knows if the trend can be reversed, but the Republic of Korea has at least found a direction for its survival."
 KORX_constitutional_convention: "Constitutional Advisory Committee"
 KORX_constitutional_convention_desc: "The constitution drawn up after the democracy movement of 1987 has been in force for more than thirty years, and the single five-year presidential term leaves every government a ‘lame duck’ in its final years. The National Assembly sets up a constitutional advisory committee of both parties and civil society to discuss changes to the power structure, local autonomy and basic rights."
 KORX_four_year_two_terms: "Two Four-Year Terms"
 KORX_four_year_two_terms_desc: "Allow the president two four-year terms, with presidential and parliamentary elections held together, so that those in power answer to the voters. A president who wants re-election must deliver results in the first term, instead of sinking into a cronyism scandal in the final year."
 KORX_parliamentary_system: "Parliamentary Cabinet System"
 KORX_parliamentary_system_desc: "The president becomes a symbolic head of state and the majority party in the National Assembly forms the cabinet, ending the era of the ‘imperial presidency’. From Syngman Rhee to Park Geun-hye, the tragedy of power concentrated in the Blue House has repeated itself; a parliamentary system spreads power between the assembly and the cabinet and forces the parties to learn to cooperate."
 KORX_prosecution_reform: "Prosecution Reform"
 KORX_prosecution_reform_desc: "Strip the Prosecution Service of most of its investigative powers and set up an independent serious crimes agency and a corruption investigation office for senior officials: checks and balances begin with the prosecutors. South Korean prosecutors can both investigate and indict, have long been seen as a tool of political struggle, and have humbled former presidents and chaebol chairmen alike."
 KORX_nis_civilian_control: "Civilian Control of the NIS"
 KORX_nis_civilian_control_desc: "The National Intelligence Service's domestic political departments are abolished, and intelligence officers are barred from meddling in elections and politics. From the KCIA to the Agency for National Security Planning, this body once kidnapped Kim Dae-jung and manipulated online opinion in the 2012 election; now it must focus on foreign and North Korean intelligence, overseen by the National Assembly's intelligence committee."
 KORX_local_autonomy: "Deepening Local Autonomy"
 KORX_local_autonomy_desc: "Expand the fiscal and legislative powers of local governments and roll out Jeju-style ‘special autonomy’, so that local councils become a real part of the power structure. Local taxes take a bigger share, provincial governors can set their own industrial and education policies, and local elections are no longer just a barometer of national politics."
 KORX_electoral_reform: "Electoral Reform"
 KORX_electoral_reform_desc: "Introduce mixed-member proportional representation so that small parties such as the Justice Party can enter the National Assembly in line with their vote share, breaking the two big parties' monopoly. But the big parties quickly find a loophole: setting up ‘satellite parties’ to swallow the proportional seats. Real reform will need tighter laws."
 KORX_impeachment_rules: "Impeachment and the Constitutional Court"
 KORX_impeachment_rules_desc: "Clarify the procedure for impeaching a president and the powers of the Constitutional Court, so that a political crisis does not become a constitutional one. The impeachments of Roh Moo-hyun and Park Geun-hye plunged the country into months of confrontation and candlelight vigils; the new provisions set deadlines, standards of proof and the scope of the acting presidency, so the next crisis has rules to follow."
 KORX_constitutional_referendum: "Constitutional Referendum"
 KORX_constitutional_referendum_desc: "The National Assembly passes the constitutional amendment by a two-thirds majority and puts it to a national referendum. It is the first constitutional referendum since 1987, with television debates, street campaigning and online battles everywhere, and turnout among young voters hits a record. The result will decide what the Republic of Korea looks like for the next thirty years."
 KORX_new_republic: "The Seventh Republic"
 KORX_new_republic_desc: "The amendment passes with a majority in favor. The new constitution takes effect, and the Republic of Korea enters the Seventh Republic. In Gwanghwamun Square, people who once held candles demanding a president's resignation now celebrate with copies of the new constitution. Power has been put in a cage, at least on paper."
 KORX_industrial_strategy: "K-Industry Strategy"
 KORX_industrial_strategy_desc: "After semiconductors and cars, defense, nuclear power, batteries, biotech and culture become the next generation of export industries. The industry ministry draws up a ten-year roadmap, using tax breaks, policy finance and training to help these industries compete head-on with China, Japan and the US in world markets."
 KORX_defense_exports: "K-Defense Exports"
 KORX_defense_exports_desc: "The government sets up a defense export support group, with the presidential office, the defense ministry and the industry ministry working together to negotiate abroad as one and offer packages of financing and technology transfer, turning the defense industry into a leading export sector. Korean weapons are delivered quickly at reasonable prices, filling exactly the gap left by Europe's stretched arms industry."
 KORX_k9_k2_export: "K9 and K2 Exports"
 KORX_k9_k2_export_desc: "Poland, Turkey, Australia and Middle Eastern countries place orders one after another, and the K9 self-propelled howitzer and K2 main battle tank become star products. Poland orders more than a thousand in one go and sets up an assembly line at home; the factories in Changwon run three shifts at full tilt, and shares in Hanwha and Hyundai Rotem keep climbing."
 KORX_fa50_kf21_export: "FA-50 and KF-21 Exports"
 KORX_fa50_kf21_export_desc: "The FA-50 light fighter is a big success in Southeast Asia and Eastern Europe, bought by the Philippines, Malaysia and Poland, while the KF-21 Boramae, developed with Indonesia, moves into the 4.5-generation fighter market. Korea Aerospace Industries in Sacheon is becoming one of Asia's most important fighter manufacturers."
 KORX_defense_complex: "Korean Defense Export System"
 KORX_defense_complex_desc: "Integrate the export system for land, sea, air and missile systems and set up a defense export finance agency to offer buyers long-term low-interest loans. Korean arms makers no longer bid alone but as a ‘national team’, able to sell everything from submarines and frigates to air defense missiles as a package."
 KORX_apr1400_export: "APR1400 Nuclear Exports"
 KORX_apr1400_export_desc: "Starting from the Barakah plant in the UAE, market Korean nuclear power plants to Eastern Europe and the Middle East. Barakah's four units were built on time and on budget, almost a miracle in the nuclear industry, and the Czech Republic, Poland and Saudi Arabia are all considering buying the APR1400."
 KORX_smr_program: "Small Modular Reactors (SMR)"
 KORX_smr_program_desc: "Small modular reactors are compact, cheap and safe, the next stage for nuclear power. Combining KAERI's SMART reactor with Doosan's manufacturing capacity, the goal is to mass-produce modular reactors in the 2030s the way Korea builds ships, and export them to developing countries with weak power grids."
 KORX_battery_alliance: "Batteries and New Energy"
 KORX_battery_alliance_desc: "The three big battery makers, LG Energy Solution, SK On and Samsung SDI, win orders around the world and build gigafactories across America and Europe, and an electric vehicle supply chain takes shape in Korea. The government subsidizes research on battery materials and recycling to keep Korea ahead of its Chinese battery rivals."
 KORX_ev_ecosystem: "EV Ecosystem"
 KORX_ev_ecosystem_desc: "Hyundai and Kia's EV platforms, together with a nationwide fast-charging network and battery recycling, form a complete electric vehicle ecosystem. The plants in Ulsan are converted into dedicated EV lines, and Korean-brand EVs win car-of-the-year awards again and again in Europe and America."
 KORX_bio_cluster: "Biopharmaceutical Cluster"
 KORX_bio_cluster_desc: "Build a biopharmaceutical cluster in Songdo, Incheon, where Samsung Biologics and Celltrion become world-class makers of biosimilars. Songdo's biologics capacity is among the largest in the world, multinational drug companies send their contract manufacturing here, and talent from universities and research institutes follows."
 KORX_bio_export: "Vaccine and Drug Exports"
 KORX_bio_export_desc: "Push South Korea into the middle of the global pharmaceutical supply chain with contract vaccine production and drug exports. During the COVID-19 pandemic Korean firms manufactured hundreds of millions of vaccine doses for the world, and ‘K-quarantine’ became a national brand; now the government wants to turn that experience into a lasting export industry."
 KORX_lng_shipbuilding: "LNG Carriers and Green Shipbuilding"
 KORX_lng_shipbuilding_desc: "Korean shipyards win eighty percent of the world's LNG carrier orders while leading the development of green ships powered by ammonia and hydrogen. The docks of Geoje and Ulsan are booked for years ahead, and HD Hyundai Heavy Industries, Samsung Heavy Industries and Hanwha Ocean leave their Chinese rivals behind in high-value ships."
 KORX_offshore_wind: "Offshore Wind and Hydrogen"
 KORX_offshore_wind_desc: "Build offshore wind farms off Sinan County in South Jeolla and make hydrogen the focus of future energy. South Korea has almost no fossil fuels and once imported over ninety percent of its energy; wind power and green hydrogen are both a way to cut carbon and a path to energy independence."
 KORX_hallyu_strategy: "A Nation Built on the Korean Wave"
 KORX_hallyu_strategy_desc: "From K-pop and dramas to film, the ‘Korean Wave’ becomes national strategy, and the government sets up a content industry promotion agency. BTS tops the Billboard charts and Squid Game becomes Netflix's most-watched series ever; for the first time South Korea's cultural influence outweighs the size of its economy."
 KORX_kcontent_fund: "K-Content Fund and Global Platforms"
 KORX_kcontent_fund_desc: "Public and private money together back content exports and global distribution platforms to nurture the next Parasite. The fund focuses on small production companies and new fields such as webtoons and games, and sets up Korean Wave centers in Southeast Asia and Latin America, turning a passing craze into a lasting industry."
 KORX_new_space: "Space Industry"
 KORX_new_space_desc: "With the Nuri launch vehicle and the KPS positioning system at the core, private space companies begin entering the launch market. South Korea is the seventh country able to put a one-ton satellite into orbit on its own, and after the creation of the Korea AeroSpace Administration, private firms such as Hanwha Aerospace take over rocket building and launch services."
 KORX_industry_final: "K-Industry in Full Bloom"
 KORX_industry_final_desc: "Defense, nuclear power, batteries, shipbuilding and culture: a whole set of mutually supporting export industries becomes South Korea's new national calling card. The economy no longer depends only on Samsung chips and Hyundai cars, and even when the chip cycle turns down, other industries can hold up exports. South Korea has gone from a ‘fast follower’ to a front-runner."
 KORX_roc_representation: "Exchange Representative Offices with the ROC"
 KORX_roc_representation_desc: "The restored Republic of China and South Korea share a special history: the Provisional Government of the Republic of Korea spent twenty-seven years in exile in China. The two countries open representative offices in each other's capitals."
 KORX_roc_provisional_gov: "Commemorating the Korean Provisional Government"
 KORX_roc_provisional_gov_desc: "From 1919 to 1945 the Korean Provisional Government spent its years of exile in Shanghai and Chongqing, sheltered and funded by Chiang Kai-shek's Nationalist government. The government of the Republic of China agrees to restore the old site on Madang Road and open a memorial hall, and the two countries' historical memories are joined again here."
 KORX_roc_maritime_security: "Maritime Security Cooperation"
 KORX_roc_maritime_security_desc: "South Korea and the Republic of China set up a hotline on freedom of navigation and search and rescue in the Yellow Sea, the East China Sea and the Taiwan Strait. The two navies and coast guards hold regular joint search and rescue drills and share intelligence on fishing incursions and smuggling, and fishing disputes in the Yellow Sea fall sharply as a result."
 KORX_roc_dprk_consult: "Consultations on North Korea Policy"
 KORX_roc_dprk_consult_desc: "Seoul and Nanjing hold regular consultations on peace on the Korean Peninsula, denuclearization and North Korea's future. Beijing used to be Pyongyang's protector; now Nanjing's attitude decides how long North Korea can hold out, and the two countries' foreign ministers and intelligence chiefs meet every quarter to compare their assessments of Pyongyang."
 KORX_roc_fta: "Korea-ROC Free Trade Agreement"
 KORX_roc_fta_desc: "Scrap most tariffs between the two countries and jointly write supply chain rules, which matter especially for semiconductors, batteries and rare earths. The restored mainland is a huge market that Korean companies race to enter, and the Republic of China's rare earths and raw materials free Korea's high-tech industries from dependence on a single source."
 KORX_roc_tech_alliance: "Semiconductor and Display Technology Alliance"
 KORX_roc_tech_alliance_desc: "Korea's memory chips and display panels complement the Republic of China's foundries and optoelectronics in the supply chain. Samsung and TSMC used to be rivals, but now they find room to cooperate on advanced packaging and domestic production of equipment, and together the two countries keep East Asia's chip industry from being at anyone else's mercy."
 PHIP_post_edsa: "The Post-EDSA Era"
 PHIP_post_edsa_desc: "The People Power Revolution of 1986 toppled Marcos, and EDSA II drove out Estrada in 2001. Philippine politics seems to swing forever between the street and the palace, and the new government must choose a path."
 PHIP_a_straight_path: "The Straight Path"
 PHIP_a_straight_path_desc: "‘You are my boss’: Benigno Aquino III campaigns under the banner of anti-corruption and the rule of law and puts the Liberal Party in power. He is the son of the democracy icons Ninoy and Cory Aquino, and the ‘Straight Path’, Daang Matuwid, is his promise to the voters."
 PHIP_a_clean_gov: "Clean Government"
 PHIP_a_clean_gov_desc: "Under the ‘Straight Path’ program, prosecute corruption, open up government procurement and hold negligent officials to account. Former president Arroyo is arrested for electoral fraud, and Chief Justice Corona is impeached and removed for hiding his assets; the Philippines climbs markedly in Transparency International's index."
 PHIP_a_oslo_talks: "Oslo Peace Talks"
 PHIP_a_oslo_talks_desc: "With Norwegian mediation, open peace talks with the National Democratic Front in Oslo, trading land reform and a socioeconomic agenda for a ceasefire. The New People's Army has fought a guerrilla war in the mountains of Luzon and Mindanao since 1969, one of the longest-running communist insurgencies in Asia."
 PHIP_a_anti_dynasty: "Anti-Political Dynasty Law"
 PHIP_a_anti_dynasty_desc: "Push through an Anti-Political Dynasty Law barring close relatives from holding office at the same time, to break the grip of a few families on politics. More than seventy percent of Filipino legislators come from political clans, and a father as governor, son as congressman and wife as mayor is the norm; the 1987 constitution called for such a law, but it has been delayed for thirty years."
 PHIP_a_bangsamoro: "Bangsamoro Basic Law"
 PHIP_a_bangsamoro_desc: "Pass the Bangsamoro Basic Law and set up a Muslim Mindanao autonomous region with broad self-government. The peace agreement with the Moro Islamic Liberation Front ends decades of separatist war in southern Mindanao, and former guerrillas become legislators and civil servants."
 PHIP_a_us_alliance: "Reaffirm the US Alliance · The Hague Arbitration"
 PHIP_a_us_alliance_desc: "In 2013 file the South China Sea arbitration case under UNCLOS while signing the Enhanced Defense Cooperation Agreement with the US, reaffirming the 1951 Mutual Defense Treaty. In 2016 the tribunal in The Hague rules that the ‘nine-dash line’ has no legal basis, a major legal victory for the Philippines."
 PHIP_a_end_insurgency: "Final Peace Agreement with the Communists"
 PHIP_a_end_insurgency_desc: "The two sides sign a comprehensive peace agreement, the New People's Army disarms and the Communist Party enters legal politics. Decades of insurgency come to an end: farmers in the guerrilla zones receive land, former fighters get vocational training, and villages in the mountains of Luzon no longer have to survive between two armies."
 PHIP_a_final: "Consolidating Liberal Democracy"
 PHIP_a_final_desc: "Constitutional government, the rule of law and elections gradually stabilize, and the reformers' first term ends with a smooth transfer of power. The Philippine economy grows more than six percent a year over these six years and is called ‘Asia's new tiger’; the democratic promise of the EDSA revolution finally has some substance."
 PHIP_b_strongman: "Rise of the Strongman"
 PHIP_b_strongman_desc: "‘Change is coming.’ An iron-fisted mayor from Mindanao wins the election on promises of a war on drugs and law and order, and the Philippines enters the age of the strongman."
 PHIP_b_drug_war: "War on Drugs"
 PHIP_b_drug_war_desc: "The police launch a zero-tolerance sweep against drug crime, thousands of suspects are shot dead while ‘resisting arrest’, and huge numbers of drug users turn themselves in. Street safety does improve and approval ratings stay high, but human rights groups and the International Criminal Court allege widespread extrajudicial killings."
 PHIP_b_crush_npa: "Crush the New People's Army"
 PHIP_b_crush_npa_desc: "End the peace talks and send the army and police on large-scale sweeps of New People's Army guerrilla zones, setting up a national task force to end the local communist armed conflict. Activists, lawyers and journalists suspected of communist sympathies are ‘red-tagged’, and some of them are assassinated."
 PHIP_b_federalism: "Federal Charter Change"
 PHIP_b_federalism_desc: "Amend the constitution to create a federal system, giving Mindanao and the other regions more autonomy and breaking Manila's monopoly on money and power. Critics point out that the draft also extends presidential powers, and that federalism might only make local strongmen stronger."
 PHIP_b_build_build_build: "Build, Build, Build"
 PHIP_b_build_build_build_desc: "The unprecedented ‘Build, Build, Build’ program of highways, railways, airports and bridges, with investment above five percent of GDP. The Metro Manila Subway, New Clark City and the North–South Commuter Railway break ground, the country's backward infrastructure is transformed, though many projects are delayed by funding problems."
 PHIP_b_terror_designation: "Designate the Communists as Terrorists"
 PHIP_b_terror_designation_desc: "Congress passes the Anti-Terrorism Act and designates the Communist Party and the New People's Army as terrorist organizations, stripping the insurgency of all legitimacy and freezing its funds and support networks. The NPA shrinks sharply and many guerrillas surrender; but human rights groups fear the definition of ‘terrorist’ is so broad it could be used to silence dissent."
 PHIP_b_independent_foreign: "Independent Foreign Policy"
 PHIP_b_independent_foreign_desc: "‘No longer America's little brown brother’: patch up relations with Beijing and shelve the arbitration ruling in exchange for over twenty billion dollars in promised trade and investment. The president announces a ‘separation’ from the US and at one point demands the withdrawal of American troops; but most of the promised investment never materializes, and the China Coast Guard does not ease up in the South China Sea."
 PHIP_b_final: "The Strongman's Legacy"
 PHIP_b_final_desc: "Whatever its merits and faults, the strongman era ends within the term the constitution allows. He leaves office with one of the highest approval ratings of any president, but the legacy of the drug war, the ICC investigation and the reshuffling of political clans will shape Philippine politics for a long time."
 PHIP_c_coalition: "Grand Coalition"
 PHIP_c_coalition_desc: "Traditional political clans, business and the Catholic Church reach an understanding and form a cross-party ruling coalition with ‘stability’ as its highest goal. Manila's great families and Mindanao's local bosses each get what they want, and every bill passed is the product of bargaining; reform is slow, but no one is left out."
 PHIP_c_economy_first: "Economy First"
 PHIP_c_economy_first_desc: "Economy first, political reform later: cut corporate taxes, improve the investment climate and expand infrastructure. The businessmen of Makati welcome it, and the special economic zones and export processing zones keep growing; the left complains that the fruits of growth are still concentrated in a few families' hands."
 PHIP_c_peace_dev_teams: "Peace and Development Teams"
 PHIP_c_peace_dev_teams_desc: "The army and local governments form joint teams to bring roads, schools and clinics into the insurgent areas and undermine the rebels' popular base. In the mountain villages of Samar and Negros, government officials arrive with money rather than guns for the first time, and the New People's Army finds recruiting ever harder."
 PHIP_c_bpo_remittances: "Outsourcing and Remittances"
 PHIP_c_bpo_remittances_desc: "Make business process outsourcing and the remittances of overseas workers the two engines of national growth, and protect the rights of overseas workers. More than a million Filipinos work night shifts in the call centers of Manila and Cebu, ten million workers abroad send home over thirty billion dollars a year, and the government sets up labor protection offices across the Middle East."
 PHIP_c_amnesty: "Amnesty and Reintegration"
 PHIP_c_amnesty_desc: "Offer rebels who lay down their arms an amnesty, land and vocational training, and absorb some into local militias. Former fighters of the New People's Army and the Moro groups receive ID cards, bank accounts and small plots of land; some go on to join the CAFGU militia guarding their own villages."
 PHIP_c_end_insurgency: "The End of the Insurgency"
 PHIP_c_end_insurgency_desc: "Rebels surrender one after another across the country, and the army declares that the Communist Party's armed struggle is coming to an end: the New People's Army's guerrilla fronts have shrunk from dozens to a handful. The party's founder, Sison, in exile in the Netherlands, is old, and the revolutionary generation is fading away."
 PHIP_c_balanced_diplomacy: "Balanced Diplomacy"
 PHIP_c_balanced_diplomacy_desc: "Walk the tightrope between China and the US: America keeps its military cooperation and rotational bases, China gets infrastructure and investment opportunities, and the South China Sea dispute is shelved under ‘joint development’. Manila hopes to offend neither, but the standoffs at Scarborough Shoal and Second Thomas Shoal could force it to choose a side at any moment."
 PHIP_c_final: "Stability and Prosperity"
 PHIP_c_final_desc: "The coalition government's term passes smoothly, the economy grows, and the opposition's criticism stays inside Congress. The balance among the political clans holds and foreign investors praise the Philippines' stability; but reformers sigh that nothing really changed in these six years."
 PHIP_d_people_power: "The Progressive Coalition"
 PHIP_d_people_power_desc: "A progressive alliance built around the social democrats wins the election with the support of workers, farmers and students. It is the first time the Philippines is governed by a force outside the traditional political clans, and the EDSA slogan ‘People Power’ turns into votes for the first time."
 PHIP_d_land_reform: "Comprehensive Land Reform"
 PHIP_d_land_reform_desc: "The great landlords' land is redistributed to their tenants. The 1988 agrarian reform law left too many loopholes, and big estates such as Hacienda Luisita were never divided; the new reform uses compulsory purchase with fair compensation to tackle one of the root causes of the insurgency head-on."
 PHIP_d_legalize_left: "Legalize the National Democratic Front"
 PHIP_d_legalize_left_desc: "Repeal the Anti-Subversion Law and allow left-wing parties and groups to operate legally, bringing class struggle into parliamentary politics. National Democratic Front cadres come out from underground and enter Congress through the party-list system; they must make a final choice between the ballot and the gun."
 PHIP_d_labour_rights: "Labor Rights Act"
 PHIP_d_labour_rights_desc: "Promise a uniform national minimum wage, regular status for contract workers and the right to organize, ending the practice of five-month contracts and improving the lives of millions of workers. The conglomerates fiercely oppose it, warning it will drive away foreign investors; but support for the unions reaches an all-time high."
 PHIP_d_universal_health: "Universal Health Care"
 PHIP_d_universal_health_desc: "Build universal health insurance and a network of primary care clinics, with a health station and a nurse in every barangay. The Philippines trains more nurses than any other country but cannot keep them; the new system raises the pay of public health workers in the hope that they will stay at home."
 PHIP_d_ceasefire: "Comprehensive Ceasefire"
 PHIP_d_ceasefire_desc: "The government and the Communist Party sign an indefinite ceasefire, and the New People's Army gradually turns into legal political groups and farmers' cooperatives. Guerrillas come down from the mountains to vote for the first time, and one of Asia's longest insurgencies ends after half a century through negotiation rather than annihilation."
 PHIP_d_non_aligned: "Non-Alignment and the Bases Question"
 PHIP_d_non_aligned_desc: "Review the Visiting Forces Agreement, handle relations with China and the US through diversified diplomacy, and seek ASEAN's support. The memory of 1991, when the Senate refused to extend the lease on the American bases, is revived, and the progressive alliance argues that the Philippines must not become a front line in great-power rivalry."
 PHIP_d_final: "The Social Democratic Experiment"
 PHIP_d_final_desc: "The progressive alliance's first term comes to an end, and the Philippine left has moved from the streets to the center of power. Land reform, labor rights and universal health care have changed millions of lives, but the budget deficit and the pressure of departing foreign investment make the next election wide open."
 PHIP_new_consensus: "A New National Consensus"
 PHIP_new_consensus_desc: "The parties agree on the basic rules of politics: election results must be respected, the army must stay neutral, and armed rebellion is no longer a political option. Here the Philippine political line comes to a close; what follows is the long work of nation-building."
 VIEX_p_root: "Vietnam's Political Future"
 VIEX_p_root_desc: "Thirty years of Đổi Mới have made Vietnam one of the fastest-growing countries in Asia, but it also faces corruption, inefficient state enterprises and pressure to democratize. The Party must decide where Vietnam goes next."
 VIEX_dm_start: "Đổi Mới 2.0"
 VIEX_dm_start_desc: "After the 1986 renovation, the Party announces deeper market reforms: a ‘socialist-oriented market economy’ with more market and a clearer socialism."
 VIEX_dm_term_limit: "Inner-Party Democracy and Term Limits"
 VIEX_dm_term_limit_desc: "The general secretary's tenure and age are limited, with the rule of ‘two terms, age sixty-five’ written into the party charter, and collective leadership within the party is strengthened. The precedent of Nguyễn Phú Trọng's three terms will not be repeated, and the Central Committee gains a bigger say over who is chosen."
 VIEX_dm_furnace: "The Blazing Furnace"
 VIEX_dm_furnace_desc: "‘In the fight against corruption there are no forbidden zones and no exceptions.’ Once the ‘blazing furnace’ is lit, a whole series of people from Politburo members and ministers to state firm executives are brought to court, and the Vietnam Airlines, Vạn Thịnh Phát and COVID test kit cases reach the top. But some worry the campaign has become a tool in power struggles."
 VIEX_dm_state_core: "The State Advances: Stronger State Enterprises"
 VIEX_dm_state_core_desc: "Concentrate resources and merge the state enterprises into a few internationally competitive ‘national champions’: PetroVietnam, EVN, the state banks and Viettel will each dominate their fields. Party conservatives call it the backbone of socialism, while private entrepreneurs fear being squeezed out of the market."
 VIEX_dm_private_core: "The Private Sector Advances: A Key Driving Force"
 VIEX_dm_private_core_desc: "The private economy is formally recognized as ‘an important driving force of the national economy’, with easier market entry, protected property rights and simpler approvals. Private groups such as Vingroup, Masan and FPT have already proved themselves, and the new resolution gives thousands of small businesses hope of growing too."
 VIEX_dm_civil_space: "Social Organizations and Civil Society"
 VIEX_dm_civil_space_desc: "Allow environmental, charitable and professional associations to register and operate: the first step toward a ‘socialist rule-of-law state’. Young people in Hanoi and Saigon organize tree planting, disaster relief and animal protection groups, and the government treats them as partners rather than potential threats for the first time."
 VIEX_dm_final: "Socialist-Oriented Market Economy"
 VIEX_dm_final_desc: "The second stage of Đổi Mới takes shape: neither capitalism nor a planned economy, but Vietnam's own ‘third way’. The party keeps its leading role, the market allocates resources, and civic organizations operate within the law; Vietnam is becoming Southeast Asia's fastest-growing and most confident economy."
 VIEX_hl_start: "Party Rectification"
 VIEX_hl_start_desc: "‘The political ideology, ethics and lifestyle of some party cadres have degenerated’: the Central Committee launches a new rectification campaign. Party organizations at every level hold criticism and self-criticism sessions, ‘self-evolution’ and ‘self-transformation’ are declared the greatest dangers, and cadres judged ideologically wavering are moved out of their posts."
 VIEX_hl_ideology: "Ideological Education"
 VIEX_hl_ideology_desc: "Restore teaching of Marxism-Leninism and Hồ Chí Minh Thought in schools, government offices and the media. University students must take more hours of political study, cadres must pass theory exams before promotion, and television shows revolutionary history dramas in prime time. The party wants the young generation to remember that independence and unification were paid for in blood."
 VIEX_hl_party_media: "Party Control of Media and the Internet"
 VIEX_hl_party_media_desc: "Bring the internet and social media under party management and crack down on ‘reactionary speech’. The 2018 cybersecurity law requires foreign platforms to store data in Vietnam and remove offending content, and ‘Force 47’ wages an online opinion war against dissidents. Critical voices on Facebook grow ever fewer."
 VIEX_hl_police: "Strengthen the Public Security Forces"
 VIEX_hl_police_desc: "Expand the public security forces and set up dedicated cybersecurity and counterintelligence departments, with the minister of public security at the core of the Politburo. Vietnam's police have always been trusted by the party more than the army, and now their budget, staff and power grow further, making them the regime's most important pillar."
 VIEX_hl_state_plan: "Restore Central Planning"
 VIEX_hl_state_plan_desc: "Bring back five-year plans and administrative directives in key industries and limit the room for private capital. The state once again decides the allocation of energy, telecoms, banking and land, and the expansion of real estate and private conglomerates is braked. Conservatives say it is necessary to prevent oligarchy."
 VIEX_hl_final: "The Party's Leadership Strengthened Across the Board"
 VIEX_hl_final_desc: "‘The party leads everything’ becomes the basic principle across the country. Society is orderly, protests and criticism almost vanish, and foreign investors welcome the political stability; but young people's entrepreneurial drive and the media's vitality visibly cool, and society loses the energy it once had."
 VIEX_dem_start: "Multi-Party Transition"
 VIEX_dem_start_desc: "The general secretary announces that the party is willing to negotiate a peaceful political transition with other political forces and let the voters decide the nation's future. It is the first time since Eastern Europe in 1989 that a communist party in Asia has voluntarily given up one-party rule. The overseas Vietnamese community rejoices, while Beijing is deeply uneasy."
 VIEX_dem_association: "Freedom of Association and Publishing"
 VIEX_dem_association_desc: "Abolish restrictions on association and publishing, and allow independent newspapers and civilian political parties to register. Uncensored newspapers appear on Saigon's newsstands for the first time and exiled writers can come home to publish; but the sudden freedom also plunges society into fierce argument and shakes stability."
 VIEX_dem_independent_candidates: "Allow Independent Candidates"
 VIEX_dem_independent_candidates_desc: "Amend the electoral law to allow non-party members to stand as independent candidates for the National Assembly and local councils without prior vetting by the Fatherland Front. Lawyers, businesspeople and online celebrities rush to register, and for the first time Vietnam's elections have real suspense."
 VIEX_dem_judiciary: "Judicial Independence"
 VIEX_dem_judiciary_desc: "The courts no longer report to the party's internal affairs committee, judges' appointment and promotion are independent of the executive, and tenure for life replaces five-year terms. Courts used to consult the party committee before every verdict; now judges answer only to the law."
 VIEX_dem_electoral_law: "Multi-Party Election Law"
 VIEX_dem_electoral_law_desc: "A new electoral law is passed: multiparty competition, secret ballots, international observers, and fresh elections to the National Assembly. Districts are redrawn, campaign finances must be disclosed, and every party gets equal time on state television. The Communist Party of Vietnam will face other parties at the ballot box for the first time."
 VIEX_dem_final: "The First Multi-Party Election"
 VIEX_dem_final_desc: "Vietnam's first multiparty election in its history, with turnout above ninety percent and long lines outside the polling stations. Whoever wins, it is a turning point in the nation's politics: after independence, unification and Đổi Mới, the Vietnamese have for the first time chosen for themselves who governs them."
 VIEX_mj_start: "The Role of the Army"
 VIEX_mj_start_desc: "The People's Army is the party's army and a symbol of national independence: it defeated France and America and held off China's invasion in 1979. At a moment when the party is split and in crisis, the army steps forward and takes supreme power in the name of ‘defending the fatherland and the people’."
 VIEX_mj_security_council: "National Defense and Security Council"
 VIEX_mj_security_council_desc: "Set up a National Defense and Security Council above the government, chaired by the military leadership with the prime minister and ministers attending. The council decides defense, foreign policy and major economic matters, and the government merely carries them out; Vietnam goes from the party leading the army to the army leading the state."
 VIEX_mj_army_business: "Army Enterprises"
 VIEX_mj_army_business_desc: "Put army-run enterprises such as Viettel, the Military Bank and Saigon Newport at the heart of national industrial policy. Viettel is already Vietnam's largest telecom company, with operations in a dozen countries across Asia, Africa and Latin America, and army business profits become an important source of funds for the military and its generals."
 VIEX_mj_order: "Keeping Order"
 VIEX_mj_order_desc: "Keep order through military administration committees, restrict gatherings, and make curfews and patrols part of daily life. Street protests are quickly dispersed and online critics are summoned for questioning; the cities are calm again, but people start looking around before they speak."
 VIEX_mj_rebuild: "An Army-Led Economy"
 VIEX_mj_rebuild_desc: "Army enterprises and state firms jointly lead construction, pushing airports, ports and highways forward with military efficiency and sharply shorter schedules. Efficiency rises, and so does corruption: no one dares audit the generals' accounts."
 VIEX_mj_final: "A Nation of Army and People"
 VIEX_mj_final_desc: "The state and the army have become one: generals serve as provincial party secretaries and chairmen of state enterprises, and army businesses control telecoms, construction and the ports. Some call it stability, others call it military rule. Vietnam has taken a road similar to Myanmar's and Thailand's."
 VIEX_e_root: "The Next Step of Đổi Mới"
 VIEX_e_root_desc: "Thirty years of renovation have lifted Vietnam from one of the poorest countries to a middle-income one. What comes next? Manufacturing, energy, infrastructure and the digital economy."
 VIEX_e_agri: "Modernizing Mekong Delta Agriculture"
 VIEX_e_agri_desc: "Promote better seeds, mechanization and irrigation to make the Mekong Delta a reliable granary. The delta grows more than half the nation's rice, but rising seas and upstream dams make saltwater intrusion ever worse; new water works and salt-tolerant varieties are the key to saving this land."
 VIEX_e_rice: "Rice Exports and Branding"
 VIEX_e_rice_desc: "Build a Vietnamese rice brand around premium varieties such as ST25 and capture the high end of the market. ST25 was once named the ‘world's best rice’, and Vietnam is no longer content to be the cheapest rice exporter; it wants ‘Vietnamese rice’ to be a household name on supermarket shelves, like Thai jasmine rice."
 VIEX_e_cash_crops: "Coffee, Rubber and Pepper"
 VIEX_e_cash_crops_desc: "Coffee, rubber and pepper from the Central Highlands are Vietnam's traditional exports: it is the world's second-largest coffee producer and largest pepper exporter. These crops used to be exported mostly as raw materials; processing, roasting and branding can add a great deal of value and let farmers earn more."
 VIEX_e_aquaculture: "Aquaculture and Processing"
 VIEX_e_aquaculture_desc: "The pangasius and shrimp farming and processing industry has built a complete export chain in the delta, from fingerlings and feed to frozen processing. Vietnamese pangasius fillets are in supermarkets around the world and its shrimp exports rank near the top; but American anti-dumping duties hang over the industry like a sword."
 VIEX_e_fdi: "Foreign-Invested Manufacturing"
 VIEX_e_fdi_desc: "Use cheap labor, free trade agreements and political stability to draw foreign manufacturers to move their factories to Vietnam. The ‘China plus one’ trend sends suppliers to Apple, Samsung, Foxconn and Nike south, and industrial parks go up one after another in the north and the south."
 VIEX_e_samsung: "Samsung and Korean Capital"
 VIEX_e_samsung_desc: "Samsung's phone plants in Bắc Ninh and Thái Nguyên make Vietnam one of the world's biggest phone exporters: half of all Galaxy phones are assembled here. Samsung alone accounts for nearly a fifth of Vietnam's exports, and Korean capital has become Vietnam's largest source of foreign investment."
 VIEX_e_intel: "Intel and Chip Packaging"
 VIEX_e_intel_desc: "Intel's assembly and test plant in the Saigon Hi-Tech Park, one of Intel's largest such sites in the world, is Vietnam's first step into the semiconductor supply chain. The government immediately launches a chip talent program aiming to train fifty thousand engineers within ten years."
 VIEX_e_textiles: "Textiles, Garments and the CPTPP"
 VIEX_e_textiles_desc: "After joining the CPTPP and the EU–Vietnam free trade agreement, Vietnamese textiles and footwear enter the major markets tariff-free. Millions of workers sew products for Nike, Adidas and Uniqlo in the garment factories of Bình Dương and Đồng Nai, and the unions begin pushing for higher pay and shorter hours."
 VIEX_e_electronics: "Electronics Cluster"
 VIEX_e_electronics_desc: "Suppliers for phones, computers and home appliances gradually form complete industrial clusters in Vietnam: circuit boards, batteries, casings and camera modules can all be sourced locally. Vietnamese firms move from assembly into component manufacturing, and ‘Made in Vietnam’ no longer just means cheap labor."
 VIEX_e_energy: "Energy and Resources"
 VIEX_e_energy_desc: "Electricity demand grows ten percent a year, and the northern blackouts of summer 2023 halted factories and alarmed foreign investors. Vietnam must develop traditional and new energy at the same time: coal for base load, hydro, wind and solar to supplement it, and a transmission grid to carry the south's surplus solar power north."
 VIEX_e_petrovietnam: "PetroVietnam"
 VIEX_e_petrovietnam_desc: "With PetroVietnam at its core, develop the continental shelf in the South China Sea and the Bạch Hổ field run jointly with Russia. Vietsovpetro has been producing here since the 1980s, oil revenue once made up thirty percent of the state budget, and it gives Vietnam a concrete stake in the South China Sea dispute."
 VIEX_e_offshore: "Offshore Oil and Gas"
 VIEX_e_offshore_desc: "Drill for oil and gas on the offshore shelf while showing restraint toward neighbors' claims. In 2014 China's Haiyang Shiyou 981 rig entered Paracel waters and set off anti-China protests across Vietnam; now Hanoi chooses to work quietly inside its own exclusive economic zone and avoid direct confrontation."
 VIEX_e_hydro_coal: "Hydro and Coal Power"
 VIEX_e_hydro_coal_desc: "Large hydropower dams such as Hòa Bình and Sơn La and the coal plants of Quảng Ninh supply cheap electricity for rapid industrialization. But there is an environmental price: reservoirs have flooded ethnic minority villages, and air quality in the northern cities gets worse every year."
 VIEX_e_renewable: "Wind and Solar"
 VIEX_e_renewable_desc: "Solar and wind in Ninh Thuận and Bạc Liêu become some of the fastest-growing renewables in the world: in just two years Vietnam's solar capacity jumped from almost nothing to the largest in Southeast Asia. The grid cannot keep up, many plants are forced to curtail output, and upgrading the transmission network becomes urgent."
 VIEX_e_nuclear_ninhthuan: "Restart Ninh Thuan Nuclear"
 VIEX_e_nuclear_ninhthuan_desc: "The Ninh Thuận nuclear project, shelved in 2016 over funding and safety concerns, is revived, with Russia and Japan competing to build it. Vietnam needs stable low-carbon power and cannot avoid nuclear; but the shadow of Fukushima and the huge investment make the National Assembly debate unusually fierce."
 VIEX_e_shipbuilding: "Shipbuilding and Marine Industry"
 VIEX_e_shipbuilding_desc: "Develop shipbuilding, offshore engineering and port machinery centered on Hải Phòng and Quảng Ninh. The Vinashin group nearly went bankrupt in 2010, but now restarts with partners such as Damen of the Netherlands and Hyundai of Korea, and begins building patrol vessels for the navy and coast guard."
 VIEX_e_infra: "North-South Artery"
 VIEX_e_infra_desc: "A highway and railway running the length of the country to link the two great centers of Hanoi and Ho Chi Minh City. Vietnam is long and narrow, over 1,600 kilometers from north to south, and still relies on a single-track meter-gauge railway built under French rule; the north–south artery is the biggest infrastructure project since reunification."
 VIEX_e_highway: "North-South Expressway"
 VIEX_e_highway_desc: "Built and opened section by section, with the goal of a continuous north–south expressway. From Lạng Sơn to Cà Mau, more than two thousand kilometers are built by dozens of contractors at once, and each section that opens brings a wave of investment to the industrial parks and towns along it."
 VIEX_e_hsr: "North-South High-Speed Rail"
 VIEX_e_hsr_desc: "The north–south high-speed railway, planned on the model of Japan's Shinkansen, is designed for 350 km/h and would take just over five hours from Hanoi to Ho Chi Minh City. But its cost of more than sixty billion dollars is close to a year's state revenue, money and technology remain challenges, and Japanese loans are the key."
 VIEX_e_metro: "Hanoi and Ho Chi Minh City Metros"
 VIEX_e_metro_desc: "Metro lines open one after another in the two big cities to ease congestion: Hanoi's Cát Linh–Hà Đông line built by China and Ho Chi Minh City's Bến Thành–Suối Tiên line built with Japanese aid, both years behind schedule. Millions of motorbike riders finally have another way to get around."
 VIEX_e_ports: "Deep-Water Ports and Logistics"
 VIEX_e_ports_desc: "Lạch Huyện port in Hải Phòng and Cái Mép port in Bà Rịa–Vũng Tàu can handle the world's largest container ships, so Vietnamese goods no longer need to be transshipped through Singapore and Hong Kong, making Vietnam one of Southeast Asia's shipping hubs. Logistics parks and bonded zones spring up around the ports."
 VIEX_e_digital: "Digital Economy"
 VIEX_e_digital_desc: "5G, cloud computing and e-commerce make the digital economy a new pillar of the national economy. Vietnam has a hundred million people with an average age in their early thirties, nearly all with smartphones; orders on Shopee and Tiki double every year, and the government sets a goal of the digital economy reaching thirty percent of GDP by 2030."
 VIEX_e_viettel_fpt: "Viettel and FPT"
 VIEX_e_viettel_fpt_desc: "The army-run Viettel and the private FPT are the two calling cards of Vietnam's tech industry. Viettel developed its own 5G equipment, one of the few companies in a developing country able to do so; FPT's software outsourcing reaches Japan and the US and has trained tens of thousands of Vietnamese engineers."
 VIEX_e_vinfast: "VinFast and Electric Vehicles"
 VIEX_e_vinfast_desc: "VinFast, Vingroup's homegrown brand, enters the global electric car market, building a plant in North Carolina and listing on Nasdaq. Outsiders argue over its quality and continuing losses, but for the first time Vietnamese people see their own car brand on American roads."
 VIEX_e_tourism: "Tourism"
 VIEX_e_tourism_desc: "Hạ Long Bay, Đà Nẵng and the old town of Hội An draw tens of millions of visitors, and tourism becomes a pillar of the service sector. Korean and Chinese tourists crowd Đà Nẵng's beaches, Western backpackers linger in Hanoi's Old Quarter and on the Mekong, and the government eases visas and promotes new resorts such as Phú Quốc."
 VIEX_e_banking: "Banking Reform and Bad Loans"
 VIEX_e_banking_desc: "Strip bad loans from the state banks, bring in foreign strategic investors and implement the Basel accords. The 2012 banking crisis exposed cross-ownership and related-party lending, and the Vietnam Asset Management Company took on a mass of bad assets; only a reformed banking system can support the next round of growth."
 VIEX_e_soe_reform: "Equitizing State Enterprises"
 VIEX_e_soe_reform_desc: "Push forward the equitization and listing of state enterprises and reduce the state's shareholdings. Stakes in state firms such as Vinamilk and Sabeco are sold to foreign investors, bringing the treasury a large sum; but conservatives in the party worry that the family silver is being sold off piece by piece."
 VIEX_e_cptpp: "CPTPP and the EU-Vietnam FTA"
 VIEX_e_cptpp_desc: "Vietnam is one of the few developing countries to have signed high-standard free trade agreements with nearly every major economy: the CPTPP, the EU–Vietnam agreement and RCEP open markets on both sides of the Pacific and in Europe at once. The price is accepting strict provisions on labor, the environment and intellectual property."
 VIEX_e_final: "A New Asian Tiger"
 VIEX_e_final_desc: "Manufacturing, energy, infrastructure and the digital economy: four pillars that place Vietnam among Asia's new tigers. From a poor country with an income of under a hundred dollars a head in 1986 to a middle-income country today, Vietnam has covered the distance in less than forty years. The next goal is to become a high-income country by the centenary of its founding in 2045."
 VIEX_m_root: "Modernizing the People's Army"
 VIEX_m_root_desc: "‘No alliances, no siding with one against another, no foreign bases, no use of force.’ Under Vietnam's ‘Four Nos’ defense policy, the People's Army is turning from a vast infantry force into a lean, modern military."
 VIEX_m_slim_army: "A Leaner Army"
 VIEX_m_slim_army_desc: "Shrink the standing army, raise the quality of the officer corps and put the money saved into new equipment. The People's Army still numbers nearly half a million, and many units' equipment dates from the 1980s; after streamlining, the army must move from manpower-intensive to technology-intensive."
 VIEX_m_conscription: "Military Service Law Reform"
 VIEX_m_conscription_desc: "Amend the military service law to shorten service, raise the share of volunteers and improve their pay. Young people in the cities try every way to avoid conscription, while rural youths see enlistment as a way up; the new law makes service fairer and gives veterans vocational training and priority in jobs."
 VIEX_m_reserve: "Reserve Mobilization"
 VIEX_m_reserve_desc: "Build a nationwide reserve system and hold regular mobilization exercises. Under the tradition of ‘all-people national defense’, every commune has its militia and every factory its self-defense unit; if war breaks out, Vietnam can mobilize millions within days."
 VIEX_m_border_defense: "Northern Border and Mountain Defense"
 VIEX_m_border_defense_desc: "Build fortifications and mountain warfare training bases in the northern highlands. The border war of 1979 and the decade of fighting at Lão Sơn and Vị Xuyên that followed taught Vietnam the weight of its northern frontier; the mountains of Lạng Sơn, Cao Bằng and Hà Giang are the nation's first line of defense."
 VIEX_m_navy: "Naval Modernization"
 VIEX_m_navy_desc: "The navy shifts from coastal patrol to limited blue-water defense, built around submarines, frigates and anti-ship missiles. The bitter lesson of the 1988 Johnson South Reef skirmish taught Vietnam that without a proper navy it cannot hold its islands in the Spratlys."
 VIEX_m_kilo: "Kilo-Class Submarines (Hanoi Class)"
 VIEX_m_kilo_desc: "The six Kilo-class submarines bought from Russia, named after Hanoi, Ho Chi Minh City, Hải Phòng and other cities, form the core of the Vietnam People's Navy's deterrent. These quiet boats carry Club anti-ship and land-attack cruise missiles, making any fleet that tries to blockade Vietnam's coast think twice."
 VIEX_m_frigates: "Frigates and Missile Boats"
 VIEX_m_frigates_desc: "Acquire Russian Gepard-class frigates and domestic missile boats to extend coastal defense. The Gepards are built in batches in Russian yards, while domestic TT400 patrol boats are launched at the Ba Son shipyard, and the navy's surface fleet gradually takes shape."
 VIEX_m_antiship: "Coastal Anti-Ship Missiles"
 VIEX_m_antiship_desc: "BrahMos and domestic anti-ship missiles give Vietnam the ability to deny any invading fleet at its doorstep. Mobile launchers on the coast can cover hundreds of kilometers of sea, and from the Gulf of Tonkin to the Spratlys, Vietnam's coast becomes an invisible wall of missiles."
 VIEX_m_marines: "Marines and Island Garrisons"
 VIEX_m_marines_desc: "Expand the naval infantry, garrison the Spratly reefs and strengthen their supply and air defense. Vietnam holds more features in the Spratlys than anyone else, and the troops stationed there live year-round with typhoons and water shortages; new piers, rainwater collection and air defense positions let them hold out longer and with more confidence."
 VIEX_m_militia: "Maritime Militia and Coast Guard"
 VIEX_m_militia_desc: "A maritime defense line of fishermen, coast guard and navy is the front line in defending Vietnam's rights in the South China Sea. The government gives offshore fishing boats fuel subsidies and satellite communications, and the fishermen also serve as a maritime militia; in standoffs with the China Coast Guard, they are often the first in harm's way."
 VIEX_m_air: "Air Force and Air Defense"
 VIEX_m_air_desc: "The modernized air force is built around Su-30 fighters and S-300 air defense missiles, gradually retiring MiG-21s that have served for half a century. Vietnam's air force once fought the Americans in the Vietnam War; now it must face a northern neighbor with fifth-generation fighters."
 VIEX_m_su30: "Su-30MK2"
 VIEX_m_su30_desc: "The Su-30MK2 multirole fighters bought from Russia are the mainstay of the Vietnamese air force, with enough range to cover the Spratly Islands. A fleet of more than thirty Su-30s is one of the strongest air forces in Southeast Asia, and its pilots regularly train on long-range patrols over the South China Sea."
 VIEX_m_s300: "S-300 Air Defense"
 VIEX_m_s300_desc: "Long-range S-300 air defense missiles bought from Russia guard Hanoi and Ho Chi Minh City. Vietnam's air defense troops have a proud history: the ‘Điện Biên Phủ in the air’ of 1972 shot down many B-52s, and this system carries on that tradition."
 VIEX_m_airbase: "Hardened Airbases"
 VIEX_m_airbase_desc: "Upgrade military airfields with hardened shelters and backup runways to improve the air force's survivability. Aircraft parked in the open would be helpless against an enemy's first missile strike; dispersal and underground hangars ensure the air force can still take off once war begins."
 VIEX_m_cyber: "Cyber Forces"
 VIEX_m_cyber_desc: "Joint Command 86 for cyber warfare is responsible for defending the nation's networks and information environment, and for offensive operations abroad. The ‘OceanLotus’ hacking group identified by foreign security firms is believed to be linked to the Vietnamese government; cyberspace has become the fourth battlefield after land, sea and air."
 VIEX_m_military_industry: "Viettel Defense Industry"
 VIEX_m_military_industry_desc: "With Viettel at its core, develop domestic radars, communications equipment and drones. Viettel's high-tech industries corporation can already produce maritime surveillance radar, electronic warfare equipment and medium-range drones, and Vietnam's defense industry is shedding its total dependence on Russian parts."
 VIEX_m_final: "An All-People Defense System"
 VIEX_m_final_desc: "The standing army, reserves, militia and coast guard form a single whole, Vietnam's own defense system. Its defense white paper holds to the ‘four no's’: no alliances, no siding with one country against another, no foreign military bases, and no use or threat of force in international relations."
 VIEX_d_root: "Bamboo Diplomacy"
 VIEX_d_root_desc: "‘Strong roots, a sturdy trunk and flexible branches’: friendly with every great power, dependent on none. Vietnamese diplomacy must find its own place between China, America, Russia, Japan and India."
 VIEX_d_china: "Relations with China"
 VIEX_d_china_desc: "China is both Vietnam's largest neighbor and its largest trading partner, and the two parties share a history of being ‘comrades and brothers’. But a thousand years of Chinese rule, the war of 1979 and the South China Sea dispute leave the Vietnamese ever wary of the north. How the South China Sea is handled sets the tone of relations."
 VIEX_d_china_coop: "Comprehensive Strategic Cooperative Partnership"
 VIEX_d_china_coop_desc: "Raise Vietnam–China relations to a ‘comprehensive strategic cooperative partnership’, strengthen trade and party-to-party ties, and shelve the South China Sea dispute through friendly consultation. The leaders visit each other often, trucks queue at the border crossings, and Vietnamese farm produce flows north to Chinese markets."
 VIEX_d_china_arb: "International Arbitration and Legal Struggle"
 VIEX_d_china_arb_desc: "Bring a case before an international tribunal under UNCLOS and defend Vietnam's maritime rights within the framework of international law. The 2016 ruling in the Philippines' case against China denied the legal force of the ‘nine-dash line’, and Vietnam decides to invoke that precedent and seize the initiative on the legal battlefield."
 VIEX_d_china_militarize: "Militarize the Reefs"
 VIEX_d_china_militarize_desc: "Fortify the Spratly reefs, expand artificial islands, deploy missiles and radar, and if necessary defend territorial sovereignty by force. Vietnam's reclaimed land in the Spratlys grows rapidly, second only to China's; Beijing sees it as provocation, and standoffs between the two navies grow ever more frequent."
 VIEX_d_scs_code: "South China Sea Code of Conduct Talks"
 VIEX_d_scs_code_desc: "Push ASEAN and China to agree a binding Code of Conduct in the South China Sea and bring the dispute within a framework of rules. Talks have dragged on for more than twenty years since the 2002 Declaration on the Conduct of Parties, and Vietnam hopes to use its turn as chair to push all sides to compromise on legal force and scope."
 VIEX_d_china_border: "Gulf of Tonkin Boundary and Border Trade"
 VIEX_d_china_border_desc: "The Gulf of Tonkin boundary agreement of 2000 and the land border demarcation completed in 2009 cleared the way for border trade and new crossings. The Hữu Nghị, Móng Cái and Lào Cai crossings operate day and night, and the border economic cooperation zones make people on both sides better off."
 VIEX_d_usa: "Relations with America"
 VIEX_d_usa_desc: "From diplomatic relations in 1995 and a ‘comprehensive partnership’ in 2013 to a ‘comprehensive strategic partnership’ in 2023, Vietnam–US relations improve year after year. The former enemy is now Vietnam's largest export market, and polls show a higher share of Vietnamese view America favorably than in some of America's own allies."
 VIEX_d_usa_partner: "Comprehensive Partnership"
 VIEX_d_usa_partner_desc: "Upgrade Vietnam–US relations to a comprehensive partnership and expand cooperation on trade, education and the legacies of war: the US helps clean up Agent Orange contamination and unexploded ordnance, and Vietnam helps search for the remains of missing Americans. Fulbright University opens in Ho Chi Minh City, and Vietnamese students become one of the largest groups studying in the US."
 VIEX_d_arms_embargo: "Lift the Arms Embargo"
 VIEX_d_arms_embargo_desc: "In 2016 the US lifts its embargo on lethal arms sales to Vietnam, opening the door to military cooperation. The Vietnamese coast guard receives retired American Hamilton-class cutters, and a US aircraft carrier calls at Đà Nẵng, the first since the end of the Vietnam War."
 VIEX_d_cam_ranh: "Cam Ranh Bay Cooperation"
 VIEX_d_cam_ranh_desc: "Allow foreign warships to visit Cam Ranh Bay under the ‘three no's’ principle, but without any military bases. This superb natural harbor, once a base for the US and then the Soviet navy, now offers repair and supply services to all countries, letting Vietnam balance the great powers and earn foreign currency."
 VIEX_d_russia: "Relations with Russia"
 VIEX_d_russia_desc: "Russia is Vietnam's most important arms supplier, providing over eighty percent of the military's equipment from the Soviet and Russian eras, and the two are traditional friends; many Vietnamese leaders studied in Moscow. Since the war in Ukraine, Hanoi has carefully navigated between Western pressure and old ties to Moscow."
 VIEX_d_rus_arms: "Russian Arms"
 VIEX_d_rus_arms_desc: "Keep buying Russian submarines, fighters and air defense systems to maintain the continuity of the equipment inventory. Switching wholesale to Western equipment would be too costly, with training, logistics and ammunition all starting from scratch; but sanctions on Russia make parts deliveries ever harder, and Vietnam starts looking for alternative sources."
 VIEX_d_rus_energy: "Vietnam-Russia Oil and Gas Cooperation"
 VIEX_d_rus_energy_desc: "The joint venture Vietsovpetro continues exploration offshore and in Siberia: Vietnamese firms join in developing Russian Arctic oil and gas fields, and Russian firms stay in Vietnam's South China Sea blocks. Energy cooperation gives Moscow a stake of its own in the South China Sea question."
 VIEX_d_india: "Relations with India"
 VIEX_d_india_desc: "India's ‘Act East’ policy fits neatly with Vietnam's own look westward. Both countries fought China within a generation of each other and share similar wariness of their northern neighbor; New Delhi sees Vietnam as a foothold into the South China Sea, and Hanoi sees India as a key weight in balancing the great powers."
 VIEX_d_india_navy: "Indian Naval Cooperation"
 VIEX_d_india_navy_desc: "India provides Vietnam with naval training, defense credit lines and BrahMos missiles, and helps train its submarine crews and Su-30 pilots. India's state oil company also explores in Vietnam's South China Sea blocks, and the two countries' military cooperation displeases Beijing greatly."
 VIEX_d_japan: "Relations with Japan: Extensive Strategic Partnership"
 VIEX_d_japan_desc: "Japan is Vietnam's largest source of official development aid and its biggest lender for infrastructure: the Nhật Tân Bridge, the Tân Sơn Nhất terminal and the Ho Chi Minh City metro were all funded by Japanese aid. Relations are upgraded to a comprehensive strategic partnership, and Japan also supplies patrol boats to the Vietnamese coast guard."
 VIEX_d_korea: "Relations with South Korea"
 VIEX_d_korea_desc: "South Korea is one of Vietnam's largest sources of foreign investment, hundreds of thousands of Vietnamese live and work in Korea, and Korean–Vietnamese families are increasingly common. Park Hang-seo's coaching of Vietnam's national football team has raised goodwill between the two peoples to unprecedented heights."
 VIEX_d_laos_cambodia: "Special Relations with Laos and Cambodia"
 VIEX_d_laos_cambodia_desc: "Vietnam forged deep bonds with Laos and Cambodia in the revolutions against France and America, and in 1979 the Vietnamese army overthrew the Khmer Rouge; the three keep a special relationship. But Chinese investment is pouring into Vientiane and Phnom Penh, and Vietnam must work hard to keep its influence in Indochina."
 VIEX_d_asean: "ASEAN Centrality"
 VIEX_d_asean_desc: "Make ASEAN the cornerstone of foreign policy, promoting regional cooperation, free trade and a South China Sea code of conduct. When Vietnam joined ASEAN in 1995 it was a poor country just emerging from isolation; today it is one of the bloc's most active members, pushing ASEAN to speak with a united voice on the South China Sea."
 VIEX_d_mekong: "Mekong Cooperation and Water"
 VIEX_d_mekong_desc: "Set up a water management mechanism with the other Mekong countries to limit the effect of upstream dams on the delta. Dozens of dams built upstream by China and Laos hold back sediment and water, the delta's land is sinking and seawater keeps pushing inland; Vietnam needs a binding basin agreement."
 VIEX_d_roc: "Pragmatic Relations with the ROC"
 VIEX_d_roc_desc: "The restored Republic of China holds Taiping Island in the South China Sea and has long historical ties to Southeast Asia. Vietnam is willing to develop trade and people-to-people ties with it pragmatically."
 VIEX_d_roc_trade: "Taiwanese Business and Investment"
 VIEX_d_roc_trade_desc: "Build on Taiwanese investment in Vietnam and expand cooperation in high-end manufacturing. Taiwan was one of Vietnam's earliest sources of foreign investment, and Taiwanese factories fill the industrial parks of Đồng Nai and Bình Dương; now suppliers to Foxconn, Pegatron and TSMC are moving south, and Taiwanese businesses are the main force of Vietnam's ‘China plus one’ strategy."
 VIEX_d_final: "Comprehensive Diversification"
 VIEX_d_final_desc: "Friendly with every great power, at peace with every neighbor, with a voice in every regional body: this is the fruit of bamboo diplomacy, with firm roots and flexible branches that bend with the wind but do not break. Vietnam becomes a ‘comprehensive strategic partner’ of the US, China, Russia, Japan, India and South Korea at once, moving deftly among the great powers."
 VIEX_s_root: "Livelihoods and Social Development"
 VIEX_s_root_desc: "Beyond economic growth, education, health, the environment and social fairness will decide whether Vietnam truly becomes a modern country. Rapid growth has made the cities rich quickly, but inequality, air pollution and the gap between town and country have widened with it; Vietnam must complete its social transformation before it grows old before it grows rich."
 VIEX_s_education: "Education Reform"
 VIEX_s_education_desc: "Reform university entrance exams and strengthen vocational training and English teaching to produce the talent manufacturing and the digital economy need. Vietnamese students score near the top in PISA, but university education is badly out of step with what employers need; the new reforms link schools directly with factories and tech companies."
 VIEX_s_health: "Universal Health Insurance"
 VIEX_s_health_desc: "Expand health insurance coverage and build a network of district and provincial hospitals. Big hospitals such as Bạch Mai in Hanoi and Chợ Rẫy in Ho Chi Minh City are so overcrowded that two or three patients often share a bed; tiered care and stronger local hospitals mean rural patients no longer have to travel far to the city for treatment."
 VIEX_s_climate: "Climate Adaptation and the Mekong Delta"
 VIEX_s_climate_desc: "Rising seas and salinization threaten the delta's rice fields: by the end of the century a third of the delta's land could be under seawater. The government launches the Mekong Delta adaptation plan, no longer simply fighting the water but switching some rice fields to rotating shrimp and rice, working with nature instead of against it."
 VIEX_s_urban: "Urbanization and Housing"
 VIEX_s_urban_desc: "Hundreds of thousands of people move from the countryside to the cities every year, and housing in Hanoi and Ho Chi Minh City costs dozens of times an ordinary worker's annual income. The government launches a program of a million social housing units and satellite towns to give factory workers and young families affordable homes."
 VIEX_s_minorities: "National Unity and the Central Highlands"
 VIEX_s_minorities_desc: "Respect the languages and cultures of all fifty-four ethnic groups, and improve infrastructure and education in the Central Highlands and the northern mountains. The highland minority protests of 2001 and 2004 exposed grievances over seized land and restricted religion; the new policies bring roads, schools and bilingual education to mountain villages."
 VIEX_s_demography: "Aging and Population Policy"
 VIEX_s_demography_desc: "Vietnam's birth rate has fallen below replacement level and the population is aging faster than expected: Vietnam has gone from a ‘young country’ to an ‘aging society’ in just twenty years, something that took France over a century. The government scraps the long-standing two-child limit and starts discussing pension reform."
 VIEX_s_youth: "Youth and Startups"
 VIEX_s_youth_desc: "Launch a ‘startup nation’ program offering young people startup funds and incubators. Vietnamese unicorns such as VNG, MoMo and Sky Mavis have shown what young people can do, and the government hopes to make Ho Chi Minh City Southeast Asia's Silicon Valley and draw overseas Vietnamese home to start businesses."
 VIEX_s_final: "A Vietnam of Shared Prosperity"
 VIEX_s_final_desc: "To become a high-income country by 2045, the centenary of independence, is the party's solemn pledge. Prosperity must belong not only to the cities and the coast but also to the farmers of the Mekong and the minorities of the Central Highlands. Only a Vietnam that prospers together can truly fulfill Hồ Chí Minh's ideal of ‘a rich people and a strong country’."
 ### v3.21 反攻提速、志愿军、两岸内战与政治线改版
 TAI_kmt_defense_tech: "Indigenous Defense R&D"
 TAI_kmt_science_park_tech: "Science Parks"
 TAI_dp_startup_tech: "Startup Nation"
 TAI_dp_regional_university_tech: "Regional University System"
 TAI_sd_university_tech: "Expanding Public Universities"
 TAI_sd_circular_tech: "Circular Economy"
 TAI_escalate_intervention: "Escalate: Reorganize the Volunteer Armies"
 TAI_escalate_intervention_desc: "The name ‘volunteers’ can no longer hide the sound of our guns across the Strait. Taipei decides to drop the pretense: recall the volunteers, reorganize the mainland rebel armies and formally declare war on Beijing."
 TAI_escalate_condition_tt: "The uprising has been going on for more than §Y60§! days"
 TAI_armed_intervention_tt: "§RThe National Army fights China directly as an ally of the rebel armies§! (without annexing them)."
 TAI_escalate_tt: "§YRecall the volunteers, declare war on China and annex the rebel armies§!."
 TAI_uprising_tt: "A §Rdemocratic uprising§! will break out in the southeastern coastal provinces of §YChina§!. The rebel government stays independent, and we intervene at first as §Yvolunteers§!; only when the situation escalates do we reorganize the rebel armies and formally declare war."
 TAI_volunteer_target_tt: "The mainland rebel army is an ongoing democratic uprising"
 roc_return.8.t: "Uprising on the Mainland!"
 roc_return.8.d: "After years of our groundwork, soldiers and civilians in the southeastern coastal provinces have finally risen up, proclaiming a ‘Provisional Mainland Government of the Republic of China’ and asking Taipei for support.\n\nIf the National Army openly crosses the Strait now, it amounts to declaring war on Beijing. The General Staff recommends sending troops and weapons as ‘volunteers’ first, and deciding whether to escalate once the situation is clearer."
 roc_return.8.a: "Organize volunteers and arm the rebels"
 roc_return.8.b: "Send arms only, no troops for now"
 roc_return.8.c: "Send in the army: armed intervention in the name of the National Army"
 roc_return.190.a: "Escalate: reorganize the rebels and formally declare war"
 roc_return.190.b: "Keep supporting them as volunteers"
 roc_return.190.t: "Escalate the Intervention?"
 roc_return.190.d: "The uprising has gone on for some time and the war on the mainland is deadlocked. Can the rebels hold out against Beijing's counterattacks, and how much longer can the ‘volunteer’ pretense last? The world has long seen through Taipei's involvement, and the Americans say privately they do not want the war to widen. It is time to choose: escalate, or keep supporting the rebels under the name of volunteers."
 roc_return.191.a: "Let this defeat be the spark for the next time"
 roc_return.191.t: "The Rebel Armies Collapse"
 roc_return.191.d: "Beijing's forces have crushed the uprisings in the southeastern provinces, and the rebel leaders have been captured or fled abroad. The volunteers' names are on the wanted lists, but we have not lost the whole war: word comes that popular anger on the mainland runs deeper than before the uprising, and the spark for next time has already been laid."
 roc_return.192.a: "Gladly accept and unify the nation"
 roc_return.192.b: "Keep two governments side by side"
 roc_return.192.t: "The Rebels Have Seized Power"
 roc_return.192.d: "The ‘Provisional Mainland Government of the Republic of China’ has defeated Beijing's garrison and controls most of the country, with the remnants of the CCP Central Committee retreating to the Northeast. The provisional government sends envoys: it is willing to accept Taipei's leadership and unify the nation. More than seventy years of division may finally end; though some argue for keeping two governments side by side."
 TAI_dec_more_volunteers: "Send More Volunteers"
 TAI_dec_more_volunteers_desc: "Send another group of officers and men to join the mainland rebels under the name of ‘volunteers’. These veterans and reservists cross the Strait secretly via Kinmen and by sea, bringing the rebels combat experience and equipment."
 TAI_dec_armed_intervention: "Armed Intervention"
 TAI_dec_armed_intervention_desc: "No more calling ourselves ‘volunteers’: the National Army goes into battle directly as an ally of the rebels, but does not yet reorganize or annex them."
 TAI_dec_arm_rebels: "Arm the Rebels"
 TAI_dec_arm_rebels_desc: "Ship rifles, artillery, and anti-tank and anti-aircraft weapons from our depots to the mainland rebel armies."
 TAI_relocate_capital_beijing: "Move the Capital to Beiping"
 TAI_relocate_capital_beijing_desc: "Beiping was the capital of the Yuan, Ming and Qing, and is the political and military center of North China. Moving the capital there from Nanjing brings it closer to the northern defenses and the resources of the Northeast. Mutually exclusive with ‘Make Nanjing the Capital’; we can still move back to Nanjing later through a decision."
 TAI_beijing_capital_idea: "Capital at Beiping"
 TAI_beijing_capital_idea_desc: "The Nationalist Government has moved the capital to Beiping. Administration and mobilization in the north are more efficient, while the southern local factions complain of being left out."
 TAI_dec_move_capital_nanjing: "Move the Capital Back to Nanjing"
 TAI_dec_move_capital_nanjing_desc: "Move the capital back to Nanjing. Nanjing is the capital the Father of the Nation chose, home to the Sun Yat-sen Mausoleum, the Presidential Palace and the old seats of the Five Yuan; returning there symbolizes the continuity of the Republic of China's constitutional order and brings the government closer to the economic heart of the Yangtze Delta."
 TAI_gov_kmt_tt: "The §YKuomintang§! has governed before, or is in a governing coalition now"
 TAI_gov_dp_tt: "The §YChina Democratic Party§! has governed before, or is in a governing coalition now"
 TAI_gov_sd_tt: "The §YChinese Social Democratic Party§! has governed before, or is in a governing coalition now"
 TAI_kmt_mainland_branches: "Rebuild the Mainland Party Branches"
 TAI_kmt_mainland_branches_desc: "Rebuild Kuomintang branches in every province, recruiting local notables and retired officers so the party reaches back down to counties and townships. After 1949 the Kuomintang had no organization on the mainland at all; now its branches put up their signs everywhere, and many former CCP grassroots cadres apply to join."
 TAI_kmt_youth_corps: "Youth Corps and Student Groups"
 TAI_kmt_youth_corps_desc: "Revive the Three Principles of the People Youth Corps, recruit student members in the universities and train a new generation of cadres. Founded in 1938, the corps was once the Kuomintang's youth wing; the new corps runs summer camps, volunteer programs and policy debates in the hope of winning mainland youth to the Three Principles."
 TAI_kmt_cadre_academy: "Revolutionary Practice Institute"
 TAI_kmt_cadre_academy_desc: "Restore the party's cadre training institute and teach the Plans for National Reconstruction to every new member. The Institute of Revolutionary Practice on Yangmingshan was once the cradle of Kuomintang cadres; now it opens a branch in Nanjing with courses on the Three Principles, constitutional democracy and local government, and many of its students are newly joined mainland cadres."
 TAI_kmt_factional_balance: "Factional Balance"
 TAI_kmt_factional_balance_desc: "The old guard who came to Taiwan, the localist faction and the new mainland members must be kept in balance, and no single faction may monopolize party posts. Seats on the Central Standing Committee are shared among the three factions in proportion, and the party chair is directly elected by the members; the Kuomintang must prove it can hold different voices from both sides of the Strait."
 TAI_kmt_garrison_reform: "Garrison Reorganization"
 TAI_kmt_garrison_reform_desc: "Unify garrison designations and command, realigning the National Army's provincial defense zones with the Ministry of Defense's order of battle. In the early Restoration, garrison designations and chains of command were chaotic, with some units answering to local authorities and others directly to the center; after reorganization every unit knows its zone and its superiors."
 TAI_kmt_border_fortress: "Frontier Fortresses"
 TAI_kmt_border_fortress_desc: "Build permanent fortifications and military airfields on the northeastern, northwestern and southwestern frontiers to guard the nation's gates. Russia to the north, Central Asia to the west and India to the south are all potential threats; the Kuomintang government believes unification was too hard won to let defense slacken in any way."
 TAI_kmt_unification_forum: "Cross-Strait Forum"
 TAI_kmt_unification_forum_desc: "Invite scholars, business leaders and local officials from both sides to meet regularly, so that ‘one China’ is no longer just a slogan. The KMT–CCP forum was once a platform for cross-Strait exchange; now it meets in a new form, with representatives of Taiwan and the mainland provinces discussing the integration of education, health care and industry. Unification is not just politics but everyday life."
 TAI_kmt_defense_self_reliance: "Defense Self-Reliance"
 TAI_kmt_defense_self_reliance_desc: "A full range of indigenously developed weapons gradually replaces imports, and the arms industry is no longer at anyone's mercy. Taiwan's NCSIST developed the Sky Bow, Hsiung Feng and Ching-kuo under American restrictions; now the defense industries of both sides are one, able to design and build everything from tanks to fighters."
 TAI_kmt_central_bank_independence: "Central Bank Independence"
 TAI_kmt_central_bank_independence_desc: "The central bank is freed from political interference, and a stable currency becomes the government's first credential. Taiwan's central bank is famous for its independence and prudence, and its governor Perng Fai-nan was rated an ‘A’ central banker year after year; the Kuomintang government brings this tradition to the mainland and makes the national currency one people can trust."
 TAI_kmt_industrial_parks: "Industrial Parks"
 TAI_kmt_industrial_parks_desc: "Plan new industrial parks on the coast and inland at the same time to draw Taiwanese and foreign investment. Taiwan's export processing zones once powered its economic takeoff, and now they are copied across the mainland: one-stop approvals, tax breaks and ready infrastructure inside the parks attract electronics, machinery and textile firms."
 TAI_kmt_science_parks: "Science Parks"
 TAI_kmt_science_parks_desc: "Copy Hsinchu's experience on the mainland: science parks, talent and venture capital together. The Hsinchu Science Park, founded at the urging of K. T. Li and Sun Yun-suan, created Taiwan's semiconductor miracle; now Nanjing, Wuhan and Chengdu have science parks of their own, working closely with local universities."
 TAI_kmt_export_drive: "Export Drive"
 TAI_kmt_export_drive_desc: "Drive growth through exports and relabel ‘Made in China’ as ‘Made in the Republic of China’. Taiwan created its economic miracle with an export-oriented strategy in the 1960s; now a unified China follows the same thinking, upgrading quality, brands and technology across the board to win back the trust of world markets."
 TAI_dp_bar_association: "Bar Associations"
 TAI_dp_bar_association_desc: "Allow lawyers to form their own bar associations, so defending a client is no longer dangerous. In the ‘709 crackdown’ of 2015 hundreds of rights lawyers were detained and disbarred; the new government restores their licenses, and independent bar associations take over self-regulation and discipline from the justice ministry."
 TAI_dp_petition_office: "Grievance Hotline"
 TAI_dp_petition_office_desc: "Every county gets a complaints office with a direct line to the central government, so wrongs no longer have to be righted by ‘stopping an official's sedan chair’. In the CCP era petitioners were intercepted and locked in ‘black jails’; the new hotline is handled directly by the Control Yuan, and every complaint gets a case number, a reply and a deadline."
 TAI_dp_victims_compensation: "Compensation for Victims"
 TAI_dp_victims_compensation_desc: "Compensate the victims of past political campaigns and their families so the wounds of history can be treated. Taiwan set up compensation funds for the victims of the February 28 Incident and the White Terror; now the practice is extended to the mainland, and those labeled Rightists, victims of the Cultural Revolution, families of those killed on June Fourth and people whose homes were forcibly demolished can all apply."
 TAI_dp_ombudsman: "National Human Rights Commission"
 TAI_dp_ombudsman_desc: "Set up an independent National Human Rights Commission answerable to parliament rather than the government. It can investigate abuses by any government body, make surprise visits to prisons and detention centers and report to parliament on human rights every year; it is China's first truly independent human rights institution."
 TAI_dp_sme_support: "Support for Small Business"
 TAI_dp_sme_support_desc: "Cut taxes for small businesses and lower the barriers to finance so private energy becomes the main force of the economy. Small and medium enterprises provide over half of China's tax revenue and eighty percent of its jobs, yet long struggled to get bank loans; the Democracy Party government sets up a credit guarantee fund for them and simplifies starting a business and filing taxes."
 TAI_dp_stock_exchange: "Securities Market"
 TAI_dp_stock_exchange_desc: "Build a securities market that operates by law with full disclosure, giving private capital an outlet. The CCP-era A-share market was called a ‘policy market’, full of booms, busts and insider trading; the new securities law punishes accounting fraud severely and protects small investors."
 TAI_dp_free_trade_zones: "Free Trade Ports"
 TAI_dp_free_trade_zones_desc: "Open several free trade ports on the coast with the most liberal customs and tax regimes. Hainan, Xiamen and Tianjin become new free ports, with duty-free goods, free movement of capital and visa-free entry for foreigners; the Democracy Party hopes to build China's global trade gateways on the model of Hong Kong and Singapore."
 TAI_dp_startup_nation: "Startup Nation"
 TAI_dp_startup_nation_desc: "The government steps back, and founders, universities and angel investors drive the new economy together. The experience of Israel and Silicon Valley is brought in: the state only funds basic research and keeps regulation light, leaving the rest to the market. Entrepreneurs in Zhongguancun, Shenzhen and Hsinchu begin taking on the old big companies."
 TAI_dp_governors_election: "Directly Elected Governors"
 TAI_dp_governors_election_desc: "Provincial governors are elected directly by the people of each province, and relations between the center and the provinces no longer rest on appointments. Taiwan held its first direct gubernatorial election in 1994, won by James Soong; now more than thirty mainland provinces elect their governors at once, and candidates must face the voters instead of pleasing the center."
 TAI_dp_fiscal_federalism: "Fiscal Federalism"
 TAI_dp_fiscal_federalism_desc: "Tax revenue is divided between the center and the provinces by law, and the provinces have purses of their own. The 1994 tax-sharing reform gave the center most of the revenue and left local governments living off land sales; the new fiscal federalism sets out each level's revenues and spending duties in the constitution, and provincial assemblies decide their own budgets."
 TAI_dp_regional_universities: "Regional Universities"
 TAI_dp_regional_universities_desc: "Every province builds a first-rate regional university so talent no longer crowds into Beijing and Shanghai. The old elite universities were concentrated in a few cities, and students from the center and west found it doubly hard to get in; on the model of the University of California system, the new government builds high-quality state-style universities in every province."
 TAI_dp_regional_charters: "Provincial Charters"
 TAI_dp_regional_charters_desc: "Each province may draw up its own charter, provided it does not violate the basic principles of the national constitution. In the 1920s Hunan wrote China's first provincial constitution, before the Northern Expedition cut short the dream of a federation of provinces; a century later the provinces have charters of their own again, with Guangdong, Sichuan and Zhejiang the first to finish."
 TAI_sd_minimum_wage: "Minimum Wage"
 TAI_sd_minimum_wage_desc: "Introduce a national minimum wage so workers on the coast and inland all have a floor. Minimum wages used to be set locally, and inland rates were often half those on the coast; the Social Democratic government sets a single national floor, adjusted every year in line with prices and productivity."
 TAI_sd_collective_bargaining: "Collective Bargaining"
 TAI_sd_collective_bargaining_desc: "Unions may bargain with employers on behalf of workers, and the right to strike is protected by law. The CCP's constitution removed the freedom to strike in 1982; the Social Democratic government writes it back into law and sets up labor dispute arbitration so that negotiation replaces confrontation."
 TAI_sd_unemployment_insurance: "Unemployment Insurance"
 TAI_sd_unemployment_insurance_desc: "Build a nationwide unemployment insurance and retraining system. State firm reform and industrial upgrading put tens of millions of workers at risk of losing their jobs, and laid-off workers used to receive only a meager allowance; the new system guarantees the unemployed a basic income for a year and offers free retraining."
 TAI_sd_worker_representatives: "Co-Determination"
 TAI_sd_worker_representatives_desc: "Big companies must have worker representatives on their boards, and decisions are no longer the boss's alone. Germany's codetermination is brought in: in companies with more than two thousand employees, half the supervisory board is elected by the staff. Plant closures, layoffs and relocations must first be negotiated with the worker representatives."
 TAI_sd_rural_clinics: "Rural Clinics"
 TAI_sd_rural_clinics_desc: "Every township gets a public clinic, and doctors are sent to the remotest villages. The barefoot doctors of the CCP era are long gone, and rural medical care is badly lacking; the Social Democratic government draws young doctors to the countryside with good pay and student loan forgiveness, and equips every clinic for telemedicine."
 TAI_sd_public_universities: "Expanding Public Universities"
 TAI_sd_public_universities_desc: "Expand public university admissions, with the state paying most of the tuition. The Social Democrats believe higher education is a public good, not a privilege of wealthy families; hundreds of thousands of new places a year go first to students from the countryside and the interior, with grants covering living costs."
 TAI_sd_vocational_schools: "Vocational Schools"
 TAI_sd_vocational_schools_desc: "Every industrial zone gets a vocational school whose graduates go straight into local companies. The German and Swiss apprenticeship model is brought in: students spend half their time in school and half in the factory, and graduate with a trade already mastered. Skilled workers are no longer seen as ‘those who couldn't get into university’."
 TAI_sd_health_for_all: "Health Care for All"
 TAI_sd_health_for_all_desc: "Seeing a doctor is no longer a gamble: universal health insurance covers everyone, and serious illness no longer ruins a family. Many rural families used to fall back into poverty through illness, with one operation consuming a lifetime's savings; the Social Democratic government caps out-of-pocket costs for major illness and sharply raises reimbursement at local hospitals."
 TAI_sd_carbon_pricing: "Carbon Pricing"
 TAI_sd_carbon_pricing_desc: "Put a price on carbon emissions and use the proceeds to support low-income households. A national emissions trading market covers high-emission sectors such as power, steel and cement, and carbon revenue is returned to every citizen as a ‘climate dividend’; the Social Democrats want to prove that environmental protection and social justice can go together."
 TAI_sd_renewables_grid: "Renewable Grid"
 TAI_sd_renewables_grid_desc: "Build cross-provincial ultra-high-voltage lines to carry wind and solar power from the west to the east. The western deserts and grasslands have abundant sun and wind, while the eastern cities need enormous amounts of power; UHV lines thousands of kilometers long carry green electricity to the Yangtze and Pearl River deltas."
 TAI_sd_urban_greening: "Urban Greening"
 TAI_sd_urban_greening_desc: "Cities add parks and greenways, and air and water quality become measures of officials' performance. Local officials used to be judged on GDP alone; now PM2.5 levels, river water quality and green space per person are all on the scorecard, and Beiping's smog days fall by half within five years."
 TAI_sd_circular_economy: "Circular Economy"
 TAI_sd_circular_economy_desc: "One factory's waste becomes another factory's raw material, and ‘reduce, reuse, recycle’ becomes national policy. Taiwan's waste sorting and recycling rates rank among the highest in the world, and the system is extended to the mainland; companies in industrial parks use one another's waste heat, wastewater and scrap, cutting pollution and costs together."
 TAI_gc_roundtable: "Round Table"
 TAI_gc_roundtable_desc: "The party leaders sit around one table and talk through major issues before any bill is tabled. Poland's Round Table of 1989 brought a peaceful transfer of power between Solidarity and the Communists; the coalition follows the model with a monthly round table of party leaders that settles disputes before they reach the floor of parliament."
 TAI_gc_constitution_convention: "Constitutional Convention"
 TAI_gc_constitution_convention_desc: "Convene representatives of the parties and civil society to review how the constitution has worked on the mainland. The Constitution of the Republic of China was drafted in 1946, and many articles need adjusting for today; the convention discusses whether to keep the National Assembly, the powers of the Five Yuan and the scope of local self-government."
 TAI_gc_citizens_assembly: "Citizens' Assembly"
 TAI_gc_citizens_assembly_desc: "Select citizens at random to advise on legislation, so politics is no longer only for politicians. Ireland's Citizens' Assembly used deliberative democracy to settle divisive issues such as abortion and same-sex marriage; the coalition picks a hundred citizens of different backgrounds to make recommendations on raising the retirement age, family policy and the energy transition."
 TAI_gc_referendum_law: "Referendum Act"
 TAI_gc_referendum_law_desc: "Major questions can be decided by referendum, with thresholds and procedures written into law. Taiwan's referendum act went through many revisions and was once mocked as a ‘birdcage referendum’ for its high thresholds; the new law sets reasonable thresholds for signatures and turnout, preventing abuse without making referendums meaningless."
 TAI_gc_cross_party_cabinet: "Cross-Party Cabinet"
 TAI_gc_cross_party_cabinet_desc: "Ministers are nominated by the parties in proportion to their seats, and the cabinet truly becomes the nation's cabinet. The premier comes from the largest party, while the vice premier and ministers are shared out in proportion; every policy must be discussed by ministers from all the parties, and cabinet meetings become the nation's most important forum for consensus."
 TAI_gc_shadow_ministers: "Shadow Cabinet"
 TAI_gc_shadow_ministers_desc: "The opposition may form a shadow cabinet to scrutinize every ministry. The British shadow cabinet system is brought in: parties outside the coalition name a spokesperson for each ministry, who questions the corresponding minister in parliament and puts forward alternative policies."
 TAI_gc_unity_budget: "National Unity Budget"
 TAI_gc_unity_budget_desc: "The budget is drawn up jointly by all the parties, and no party can use it as a bargaining chip anymore. Budget reviews in the Legislative Yuan used to become battlegrounds of partisan struggle, with freezes, cuts and boycotts common; the national budget is now prepared jointly by the coalition parties, and parliament only reviews the details of implementation."
 TAI_gc_opposition_rights: "Rights of the Opposition"
 TAI_gc_opposition_rights_desc: "The opposition enjoys full rights of questioning, investigation and initiative, and the rules of procedure no longer favor the governing parties. Parliament sets up opposition-led committees of inquiry that can subpoena officials and demand government documents, and the opposition gets guaranteed time for its own bills, so minority voices are no longer drowned out by the majority."
 TAI_gc_truth_commission: "Truth Commission"
 TAI_gc_truth_commission_desc: "Set up a truth commission to investigate a century of historical injustices, establishing the facts without pursuing individuals. From the 1927 purge, the February 28 Incident and the White Terror to the Anti-Rightist Campaign, the Cultural Revolution and June Fourth, both the Kuomintang and the Communists have pasts to face; the commission's report examines both parties' historical responsibility for the first time."
 TAI_gc_joint_textbooks: "Jointly Written Textbooks"
 TAI_gc_joint_textbooks_desc: "Historians from both sides write textbooks together so the next generation reads the same history. Taiwanese and mainland textbooks tell the stories of the War of Resistance, the civil war and the years after 1949 in completely different ways, and the same battle has different heroes on each side; the joint textbooks present multiple perspectives and teach students to judge for themselves."
 TAI_gc_memorials: "Memorials and Cemeteries"
 TAI_gc_memorials_desc: "Build a shared memorial for the dead of the civil war, whichever side they fought on. Spain's Valley of the Fallen was disputed for decades, while the dead of the American Civil War were finally laid to rest in the same ground; the millions who died in the Chinese Civil War, whichever uniform they wore, were all Chinese."
 TAI_gc_forgive_and_remember: "Forgive and Remember"
 TAI_gc_forgive_and_remember_desc: "‘Forgive but do not forget’ is written into the national curriculum. Every year on the Day of Reconciliation the party leaders lay flowers together at the memorial; the young generation learns the pain of history without carrying the previous generation's hatred. China can finally face its past and move on."
 TAI_cpc_government: "The Communist Party in Government"
 TAI_cpc_government_desc: "The Communist Party of China, now a legal opposition party, finds its place in the new political landscape: no longer a revolutionary party but a participating one. It still has many supporters among laid-off workers, retired cadres and the old industrial Northeast, wins a considerable number of seats in the first national election and joins the governing coalition."
 TAI_cpc_party_congress: "Hold a Party Congress"
 TAI_cpc_party_congress_desc: "The Communist Party of China, now a legal opposition, holds a national congress and elects a new Central Committee. It is the first congress held without the premise that ‘the party leads everything’: delegates debate openly and elections are contested, many old leaders lose, and young reformers come to the fore."
 TAI_cpc_legal_status: "Legal Status"
 TAI_cpc_legal_status_desc: "The constitutional court confirms the Communist Party's freedom of association and defines the legal status of its assets, newspapers and party schools. The court rules that as long as it renounces violent revolution and one-party rule, the Communist Party enjoys the same rights as any other. The former communist parties of Eastern Europe all traveled a similar road."
 TAI_cpc_reform_wing: "Rise of the Reformers"
 TAI_cpc_reform_wing_desc: "Reformers within the party argue for accepting parliamentary politics and taking the road of social democracy or democratic socialism. They look to Zhao Ziyang and Hu Yaobang as their mentors and want to cooperate with the Nationalist government and give up class struggle; conservatives accuse them of betraying the revolution. The struggle over the party's line comes out into the open."
 TAI_cpc_workers_unions: "Unions and Farmers' Associations"
 TAI_cpc_workers_unions_desc: "The Communist Party puts its strength into unions, farmers' associations and workers' congresses and lets organization do the talking. In the wave of state firm reform, its grassroots organizations fight for compensation and new jobs for laid-off workers, and in the countryside for farmers' land rights; the party returns to its original mass base."
 TAI_cpc_patriots: "The Patriotic Turn"
 TAI_cpc_patriots_desc: "The party's propaganda turns to patriotism and national rejuvenation, standing with the Nationalist government on national causes. On the Diaoyutai, the South China Sea and Outer Manchuria, the Communists take an even harder line than the Kuomintang; it wins them the support of nationalist voters and stiffens the government's hand in dealing with other countries."
 TAI_cpc_market_socialism: "Market Socialism"
 TAI_cpc_market_socialism_desc: "Accept the role of the market while keeping public ownership in the key industries that bear on the people's livelihood. The reformers' economic program is called ‘market socialism’: energy, railways and banking stay state-run while the rest is left to the market; it is in fact not far from the Father of the Nation's idea of regulating capital."
 TAI_cpc_new_democracy: "New Democracy"
 TAI_cpc_new_democracy_desc: "Revive ‘New Democracy’: many forms of economy side by side and many parties sharing in government. The coalition government and multiparty cooperation Mao Zedong promised in On New Democracy in 1940 were replaced by one-party rule after 1949; now the Communist Party declares its return to that promise and accepts multiparty democracy."
 TAI_cpc_era: "The Red Flag and the Blue Sky"
 TAI_cpc_era_desc: "The red flag and the Blue Sky, White Sun and a Wholly Red Earth fly side by side under the same sky: the Communist Party of China has completed its transformation under a multiparty system. A century ago the Kuomintang and the Communists cooperated twice and fought two civil wars; now they debate in the same parliament and compete for votes under the same constitution."
 TAI_cpc_cadre_discipline: "Cadre Discipline"
 TAI_cpc_cadre_discipline_desc: "Bind cadres with party discipline and strictly forbid corruption, privilege and feudal behavior. Corruption was a major reason the CCP lost the people's trust while in power; in opposition, the party learns its painful lesson, requires every member to declare their assets and expels anyone involved in corruption."
 TAI_cpc_party_school: "Party School Reform"
 TAI_cpc_party_school_desc: "The party school no longer teaches only dogma, adding courses in economics, law and public administration. The Central Party School invites liberal economists and Taiwanese law professors to teach, and its students read Hayek and Rawls for the first time; it means to train cadres who understand democratic politics, not bureaucrats who can only recite documents."
 TAI_cpc_anticorruption: "The Anti-Corruption Tradition"
 TAI_cpc_anticorruption_desc: "Revive the anti-corruption tradition of the Yan'an years and make integrity the party's calling card. In Yan'an the Communists won hearts through hard work and plain living, and in the Huang Kegong case Mao approved the execution of a veteran Red Army officer; the opposition party wants to recover that spirit and compete with the Kuomintang on a clean image."
 TAI_cpc_inner_democracy: "Inner-Party Democracy"
 TAI_cpc_inner_democracy_desc: "Party leaders at every level are elected by the members, and the party no longer speaks with a single voice. For the first time there is more than one candidate for general secretary, and the factions campaign openly and publish platforms; members discover that democracy within the party is livelier than they ever imagined."
 TAI_cpc_land_reform_memory: "Old Revolutionary Areas and Land Reform"
 TAI_cpc_land_reform_memory_desc: "Keep promoting the fair use of land in the old revolutionary base areas and protect peasants' basic rights. The old bases of Jinggangshan, Yan'an and the Dabie Mountains are where the Communist Party was born, and their peasants still feel attached to it; the party promotes farmers' cooperation and land leasing there and works to stop the land being swallowed up by capital."
 TAI_cpc_trade_union_law: "Trade Union Act"
 TAI_cpc_trade_union_law_desc: "Push for revision of the Trade Union Law so that workers have organizations that truly represent them. Under CCP rule the unions were mere mouthpieces of the party; now, in opposition, the Communists are the keenest champions of independent unions, and the revised law guarantees workers' right to organize freely and elect their own union leaders."
 TAI_cpc_village_cooperatives: "Village Cooperatives"
 TAI_cpc_village_cooperatives_desc: "Develop cooperatives that farmers join voluntarily so small households can share economies of scale. Unlike the people's communes, the new cooperatives are entirely voluntary, and farmers can leave at any time; they buy supplies and sell produce together and run processing plants and rural tourism, giving small farmers bargaining power in the market."
 TAI_cpc_social_safety: "Basic Social Security"
 TAI_cpc_social_safety_desc: "Let the national treasury provide the floor: pensions, health care and housing, everyone should have the most basic security. The Communists push bills for a universal basic income and public housing in parliament, forming an issue alliance with the Social Democrats; they want to prove the socialist ideal still has life in it under democracy."
 TAI_cpc_peaceful_rise: "Peaceful Rise"
 TAI_cpc_peaceful_rise_desc: "The Communist Party calls for national rejuvenation by peaceful means and opposes any foreign interference in China's internal affairs. In foreign policy it criticizes the Kuomintang government as too pro-American and argues for an independent, non-aligned diplomacy, which wins it a following among some voters."
 TAI_cpc_overseas_ties: "Ties with the Overseas Left"
 TAI_cpc_overseas_ties_desc: "Keep in touch with left-wing parties, trade unions and intellectuals around the world to open channels for international cooperation. The communist parties of Vietnam and Cuba and Europe's socialist and left parties all keep up relations with the Communist Party of China; these ties give the opposition party a place on the world stage."
 TAI_cpc_one_china_consensus: "The One China Consensus"
 TAI_cpc_one_china_consensus_desc: "On ‘one China’ the Kuomintang and the Communists do not disagree: China must be a united China. Whether through the 1992 Consensus or seventy years of standoff, both parties insisted there is only one China; now that consensus is the basis for their cooperation in parliament, and any separatist proposal meets the opposition of both."
 TAI_cpc_national_rejuvenation: "National Rejuvenation"
 TAI_cpc_national_rejuvenation_desc: "Make national strength and rejuvenation the common goal of every party. Sun Yat-sen called for ‘revitalizing China’, and the CCP also took ‘national rejuvenation’ as its slogan; in a unified, democratic China the goal belongs to no single party but to the whole nation."
 TAI_gov_cpc_tt: "The §YCommunist Party of China§! has governed before, or is in a governing coalition now"
 TAI_cpc_government_idea: "The Communist Party in Government"
 TAI_cpc_government_idea_desc: "The legal Communist Party of China has become a major force in parliament, and the voices of workers' and farmers' organizations and intellectuals are easier to hear."
 TAI_cpc_era_idea: "The Red Flag and the Blue Sky"
 TAI_cpc_era_idea_desc: "The Communist Party has become a party of government in a multi-party system, and the Nationalist Government and the Communists share a common language on national unity and rejuvenation."
 TAI_party_alternation_idea: "Alternation in Power"
 TAI_party_alternation_idea_desc: "Handovers of power between parties have become routine, and every party competes and cooperates within the constitution. Losers accept the result and wait for their next chance, and the rules of democracy are deeply ingrained; politics is stable and the government's legitimacy beyond question."
 TAI_two_party_lines_tt: "At least §Ytwo§! party lines have completed their final focus (Kuomintang, Democratic Party, Social Democrats, Grand Coalition, Communist Party)"
 CSW_cross_strait_war: "Cross-Strait Civil War"
 CSW_cross_strait_war_desc: "Civil war has broken out on the mainland, the rebel provinces have broken away from Beijing, and both sides of the Strait have been drawn in. For the CCP it is the gravest crisis of its rule since 1949; for the Kuomintang it is the best chance in seventy years. Both need an answer to this war."
 CSW_ccp_martial_law: "Martial Law and Stability"
 CSW_ccp_martial_law_desc: "Impose martial law in the affected provinces: armed police move into the major cities, and curfews, internet shutdowns and checkpoints go up at once. The first task is to keep order in Beijing, Shanghai and Guangzhou and contain the unrest locally, so that one province's uprising does not become a national collapse."
 CSW_ccp_mobilize_pla: "Mobilize the PLA"
 CSW_ccp_mobilize_pla_desc: "The theater commands go on full alert, reserves are mobilized, and the army starts to repair a command structure thrown into disorder by the civil war. Some units have defected in the field, leaving the Central Military Commission doubtful of the loyalty of front-line units, and political commissars are sent to the front in large numbers."
 CSW_ccp_purge_traitors: "Purge the Traitors"
 CSW_ccp_purge_traitors_desc: "Hunt down those who passed information to the rebels and Taiwan, and purge the disloyal from the party and the army. Party discipline inspectors and state security work the cases together, and hundreds of cadres are taken away overnight. Fear buys obedience, but it also drives more people to the other side."
 CSW_ccp_blockade_rebels: "Blockade the Rebels"
 CSW_ccp_blockade_rebels_desc: "Cut the rebels' supply lines and grain shipments: the railways stop, Yangtze shipping is blockaded, and the banks freeze accounts in the rebel provinces. We will make their regime collapse economically first and show the people in their cities that following the rebels only means going hungry."
 CSW_ccp_seek_russia: "Seek Help from Russia and North Korea"
 CSW_ccp_seek_russia_desc: "Ask Russia and North Korea for political and material support, meaning fuel, ammunition and satellite intelligence, in exchange for their backing in the UN Security Council and in world opinion. The price will be border concessions and energy contracts later, but for now keeping the regime alive comes first."
 CSW_ccp_strait_deterrence: "Strait Deterrence"
 CSW_ccp_strait_deterrence_desc: "The Eastern Theater Command holds large-scale exercises in the Taiwan Strait, with missiles landing off Keelung and Kaohsiung, sending Taipei a clear warning: if the National Army dares to land on the mainland, Taiwan itself will pay first. It is psychological warfare, betting that Taipei will not dare take that step."
 CSW_ccp_total_war: "Total War"
 CSW_ccp_total_war_desc: "The whole country moves to a wartime footing: factories run flat out for the front, grain is rationed, civilian transport gives way to military traffic, and everything serves to put down the rebellion. It is the most complete mobilization since the Korean War, and the economy will pay a heavy price."
 CSW_ccp_restore_order: "Put Down the Rebellion"
 CSW_ccp_restore_order_desc: "The uprising has been crushed and the rebel provinces are back under central control. Once again, the party and the state have survived the test. State media announce a ‘decisive victory in quelling the riots’, but the ruined cities, the refugees who fled abroad and the international sanctions all remind people what the victory cost."
 CSW_tai_volunteer_corps: "Form a Volunteer Corps"
 CSW_tai_volunteer_corps_desc: "Build a ‘Republic of China Volunteer Corps’ around veterans and reservists, sent to fight on the mainland as volunteers. The name is a deliberate echo of 1950: back then the CCP entered Korea under the name of volunteers, and today we return to the mainland the same way."
 CSW_tai_arm_rebels: "Arms Support"
 CSW_tai_arm_rebels_desc: "Ship weapons, ammunition and artillery from our stocks to the mainland rebels by sea and through third countries. The M60s and 155mm howitzers the army was about to retire are still precious equipment in rebel hands. The shipments have to be discreet, but everyone knows where the goods come from."
 CSW_tai_armed_intervention: "Armed Intervention"
 CSW_tai_armed_intervention_desc: "No more calling ourselves volunteers: the National Army goes into battle directly as an ally of the rebels, with the navy and air force covering them. But we do not yet reorganize the rebel armies or annex their government, to avoid giving the world grounds to call it aggression and to avoid an early showdown with local powers."
 CSW_tai_recognize: "Recognize the Provisional Government"
 CSW_tai_recognize_desc: "Formally recognize the ‘Provisional Mainland Government of the Republic of China’ and send advisers to help it build an administration: household registration, taxation, police and courts. A local government that actually works proves better than any propaganda that the Three Principles of the People can take root on the mainland."
 CSW_tai_intel_ops: "Intelligence Infiltration"
 CSW_tai_intel_ops_desc: "The Military Intelligence Bureau activates its whole network on the mainland: subversion, sabotage and intelligence gathering all at once. Contacts who have lain dormant for years are woken up, and CCP railway schedules, unit designations and cadre rosters start flowing to Taipei."
 CSW_tai_us_backing: "Win American Acquiescence"
 CSW_tai_us_backing_desc: "Explain to Washington that this is a democratic uprising, not a war started by Taiwan, and that Taipei needs its acquiescence, not its intervention. In the meeting rooms of the American Institute in Taiwan, our envoy promises again and again not to drag American forces in, asking only that the Seventh Fleet not stand in the middle of the Strait."
 CSW_tai_psychological_war: "Psychological Warfare Broadcasts"
 CSW_tai_psychological_war_desc: "Step up radio and online propaganda aimed at the mainland to break the enemy's morale and public support. Kuang Hua Radio resumes round-the-clock broadcasts to the mainland, circumvention software and surrender guides spread online, and leaflet balloons cross the Strait once more. Every PLA soldier must know that laying down his arms means a way out."
 CSW_tai_logistics_bridge: "A Bridge Across the Sea"
 CSW_tai_logistics_bridge_desc: "Organize merchant ships and navy transports into a sea supply line from Kaohsiung to Fujian. Evergreen and Yang Ming freighters are temporarily requisitioned, Kinmen and Matsu become transit points, and ammunition, medicine and food cross the Strait under cover of darkness every night."
 CSW_tai_join_the_war: "Unified Command"
 CSW_tai_join_the_war_desc: "Taipei and the mainland rebels set up a unified wartime headquarters, and the National Army fights side by side with the rebel armies. Whampoa graduates and former PLA officers sit at the same planning table; old grudges no longer matter, only reaching the Yangtze before winter."
 CSW_intl_lobby: "International Lobbying"
 CSW_intl_lobby_desc: "Every side is fighting for world opinion: who is defending unity, and who is splitting the country? Beijing accuses Taipei of instigating rebellion, while Taipei portrays the war as an uprising of the mainland people for their freedom. Embassies, the international media and the corridors of the UN all become another front."
 CSW_humanitarian_corridor: "Humanitarian Corridors"
 CSW_humanitarian_corridor_desc: "Open humanitarian corridors for civilians in the war zones and let the Red Cross into the stricken cities. Millions of refugees are trapped in the fighting, and disease and hunger are deadlier than the shelling. Whoever wins in the end, no one wants to be remembered for slaughtering their own countrymen."
 CSW_ceasefire_talks: "Ceasefire Talks"
 CSW_ceasefire_talks_desc: "With a third country mediating, representatives of both sides sit down in Singapore to discuss a ceasefire. The Koo–Wang talks were held here thirty years ago, when the subject was document authentication and registered mail; now it is prisoner exchanges and ceasefire lines."
 CSW_new_order: "A New Postwar Order"
 CSW_new_order_desc: "The war is over. What kind of country will start again? Whoever wins, rebuilding order comes next: counting the dead, resettling refugees, restoring transport and production, and deciding what to do with those who once backed the wrong side. Peace is harder to manage than war."
 CSW_total_war_idea: "Total War"
 CSW_total_war_idea_desc: "The whole country moves to a wartime footing: factories run flat out, grain is rationed, and everything serves to put down the rebellion. Total mobilization greatly increases manpower and war support, but consumer goods are scarce, prices soar and discontent is building."
 CSW_ccp_request_aid: "CCP Request for Aid"
 CSW_tai_lobby_us: "Taipei's Lobbying"
 ROC_order_blue_sky_white_sun: "Order of the Blue Sky and White Sun"
 ROC_order_blue_sky_white_sun_desc: "The highest military decoration of the Republic of China, awarded to officers who distinguish themselves in defending the nation and defeating its enemies."
 ROC_order_precious_tripod: "Order of the Precious Tripod"
 ROC_order_precious_tripod_desc: "Named after the precious tripod, a symbol of the state, it is awarded to servicemen who make special contributions to national defense."
 ROC_order_cloud_and_banner: "Order of the Cloud and Banner"
 ROC_order_cloud_and_banner_desc: "Awarded to officers and soldiers of the army, navy and air force for merit in battle and outstanding command."
 ROC_medal_loyalty_and_valor: "Medal of Loyalty and Valor"
 ROC_medal_loyalty_and_valor_desc: "Awarded to officers and soldiers who fight with loyalty and courage, heedless of their own safety."
 ROC_order_independence_freedom: "Order of Independence and Freedom"
 ROC_order_independence_freedom_desc: "Awarded to officers and soldiers who defend the nation's independence under the banner of democracy and freedom."
 ROC_order_liberation: "Order of Liberation"
 ROC_order_liberation_desc: "Awarded to officers and soldiers who earn distinction in the war of liberation and the recovery of the national territory."
 ### v3.22 叙利亚内战与各方扩展
 SYRX_siege_strategy_idea: "Siege and Starvation"
 SYRX_siege_strategy_idea_desc: "Siege, starvation and bombardment force rebel-held areas to surrender. The regime keeps the cities, at a humanitarian and diplomatic cost."
 SYRX_reconciliation_idea: "Local Reconciliation"
 SYRX_reconciliation_idea_desc: "Local ceasefires and evacuation deals send fighters and their families to Idlib in exchange for calm in the cities and suburbs."
 SYRX_ndf_idea: "National Defense Forces and Militias"
 SYRX_ndf_idea_desc: "The National Defense Forces (NDF) bring local pro-government militias under a single command, securing both manpower and loyalty."
 SYRX_axis_idea: "Axis of Resistance"
 SYRX_axis_idea_desc: "Iran's Revolutionary Guards, Hezbollah and Shia militias enter Syria and become the regime's shock troops on the battlefield."
 SYRX_russia_idea: "Russian Aerospace Forces"
 SYRX_russia_idea_desc: "Russian forces at Hmeimim air base and the port of Tartus provide air strikes, reconnaissance and diplomatic cover for the ground forces."
 SYRX_chem_deal_idea: "Destroying the Chemical Weapons"
 SYRX_chem_deal_idea_desc: "The regime joins the Chemical Weapons Convention and, with Russian mediation, hands over its chemical stockpile in exchange for diplomatic breathing room. The US calls off its planned air strikes, and Damascus gains time to recover."
 SYRX_war_economy_idea: "War Economy"
 SYRX_war_economy_idea_desc: "Food, fuel and foreign currency all serve the war: rationing, the black market and warlords' interests exist side by side. Arms factories and repair shops run day and night, but consumer goods are desperately short and ordinary families struggle to survive amid inflation."
 SYRF_council_idea: "National Council"
 SYRF_council_idea_desc: "The exiled opposition forms a National Council in Istanbul to represent it abroad. The council seeks international recognition and aid for the opposition and gives foreign governments a body they can talk to."
 SYRF_local_councils_idea: "Local Revolutionary Councils"
 SYRF_local_councils_idea_desc: "Local councils in the liberated areas take over schools, bakeries and courts, the seeds of a new order. Councils chosen by residents let people take part in local affairs for the first time, and order and public support in the liberated areas grow firmer as a result."
 SYRF_turkey_idea: "Turkish Protection"
 SYRF_turkey_idea_desc: "Turkey provides rear bases, refugee camps and military training, and the opposition depends ever more on Ankara."
 SYRF_sna_idea: "Syrian National Army"
 SYRF_sna_idea_desc: "The Turkish-backed coalition has been reorganized into the Syrian National Army, the regular force of the liberated north."
 SYRN_salvation_gov_idea: "Salvation Government"
 SYRN_salvation_gov_idea_desc: "Idlib's Salvation Government has set up ministries, courts, police and a tax office, becoming a de facto state."
 SYRN_command_idea: "Unified Command"
 SYRN_command_idea_desc: "The factions are folded into a single operational command, and elite assault units become the main force on the battlefield. Unified command makes offensives better coordinated, and the units' organization and striking power rise sharply."
 SYRN_crossings_idea: "Border Crossings"
 SYRN_crossings_idea_desc: "Transit fees and trade at the Bab al-Hawa crossing make Idlib's finances steadier than those of many states."
 SYR_ext_fsa_aid: "Support for the Syrian Opposition"
 SYR_ext_assad_crimes: "Atrocities of the Syrian Regime"
 SYR_ext_russia_ally: "Russo-Syrian Military Alliance"
 SYR_ext_iran_ally: "Irano-Syrian ‘Axis of Resistance’"
 SYR_ext_turkey_ally: "Turkey Backs the Opposition"
 SYR_ext_isis_hate: "Hatred of the ‘Islamic State’"
 SYRX_tb_armor: "Rebuilding Armored Vehicles"
 SYRF_tb_atgm: "Anti-Tank Missiles"
 SYRX_tb_aa: "Restoring Air Defenses"
 SYRL_baath_ideals_idea: "The Founding Ideals of the Ba'ath"
 SYRL_baath_ideals_idea_desc: "Unity, freedom, socialism: the three slogans of the party's founding in 1947, hollowed out by decades of family rule. Now the President means to recover them."
 SYRL_no_dynasty_idea: "Ending Family Rule"
 SYRL_no_dynasty_idea_desc: "Relatives no longer hold key posts: assets must be declared, contracts must be tendered, and the army and intelligence services belong to the state, not to any one family name."
 SYRL_merit_idea: "Cadre Evaluation"
 SYRL_merit_idea_desc: "Promotion depends on examinations, performance and public review, not family or connections. A new generation of cadres is professional and clean, government efficiency and the quality of decisions improve markedly, and research institutions attract more talent."
 SYRL_land_idea: "New Land Reform"
 SYRL_land_idea_desc: "Lease idle state land to landless farmers and set up agricultural cooperatives, winning the countryside back to the Ba'ath."
 SYRL_plan_idea: "Planning and the Public Sector"
 SYRL_plan_idea_desc: "The State Planning Commission is revived and energy, cement, fertilizer and textiles return to state hands. State factories put reconstruction and people's needs first, industrial capacity steadily recovers and prices become more stable."
 SYRL_coop_idea: "Cooperatives and Worker Participation"
 SYRL_coop_idea_desc: "Worker representatives join company management boards, and farmers' cooperatives sell grain directly to the state. Producers share in decisions and profits for the first time, labor conflict falls and everyday goods are produced in greater supply."
 SYRL_welfare_idea: "Universal Health Care and Education"
 SYRL_welfare_idea_desc: "Free hospitals and universities are among the most precious legacies of the Baath Party. The health and education systems rebuilt after the war are open to everyone again, public sentiment gradually settles, and the universities once more train a generation of scientists and engineers."
 SYRL_npf_idea: "A Real National Progressive Front"
 SYRL_npf_idea_desc: "The Communists, the Arab Socialist Union, the Socialist Unionists and the Ba'ath deliberate at the same table, instead of the Ba'ath deciding alone."
 SYRL_union_idea: "Independent Unions and Peasants' Federation"
 SYRL_union_idea_desc: "Unions and the peasants' union are no longer mere mouthpieces, and wages and purchase prices can be settled by negotiation. Workers earn more and grumble less, society is more stable, and the production of everyday goods is more secure."
 SYRL_civil_idea: "A Civic State"
 SYRL_civil_idea_desc: "The constitution states that all are equal before the law, regardless of sect or ethnicity. Alawites, Sunnis, Christians and Kurds are all Syrian citizens."
 SYR_ext_left_baath: "Ba'athist Arab Solidarity"
 SYRB_security_state_idea: "Security State"
 SYRB_security_state_idea_desc: "The intelligence services are more powerful than ever: stability comes before everything, and opponents and reformers alike are on the lists."
 SYRB_social_market_idea: "Social Market Economy"
 SYRB_social_market_idea_desc: "The Ba'ath's Tenth Regional Congress in 2005 adopted the ‘social market economy’: banks, insurance and universities opened to private capital, and the state no longer runs everything."
 SYRB_tb_medical: "Medical and Research Investment"
 roc_asia.70.a: "Confiscate it and put it out to open tender"
 roc_asia.70.b: "Leave some of it, in exchange for silence"
 roc_asia.70.t: "The Tycoons' Assets"
 roc_asia.70.d: "Prosecutors open the books of the family's companies: telecom licenses, oil revenue shares, duty-free shops and real estate, billions of dollars hidden in offshore companies and in the names of cronies. The president orders everything confiscated, the proceeds paid to the treasury and the contracts put out to open tender. The relatives leave the capital in fury, and some vow to ‘make the president pay’."
 roc_asia.71.a: "Adopt the reform program"
 roc_asia.71.b: "Keep some of the old rules"
 roc_asia.71.t: "The Ba'ath Party's Eleventh Congress"
 roc_asia.71.d: "The debate in the hall goes on late into the night: the old guard wants to keep the party's ‘leading role’, young delegates demand direct elections for local branches, and someone reads aloud from Aflaq's founding manifesto. Finally the president takes the podium: ‘The party belongs to the people, not to any one man.’ Applause breaks out, and the reform program passes by a majority."
 roc_asia.72.a: "Adopt the conference's proposals"
 roc_asia.72.b: "Adopt only some of them"
 roc_asia.72.t: "National Dialogue Conference"
 roc_asia.72.d: "In the conference hall in Damascus sit Baath delegates, communists, Nasserists, Christian bishops, Sunni scholars and Kurds. It is the first time in half a century that Syrians of different persuasions sit in the same room and talk as equals. The meeting argues for three days, and also reaches some consensus: a ceasefire, an amnesty and a new constitution."
 roc_asia.73.a: "Adopted"
 roc_asia.73.t: "The New Ba'athist Republic"
 roc_asia.73.d: "The president walks into parliament and reads the new national charter to the assembled deputies. Article one: ‘The state belongs to all Syrian citizens.’ Article two: ‘No one's relatives may inherit public office.’ The deputies rise to applaud, and some weep: after more than a decade of war, Syria has finally found a new road."
 roc_asia.60.a: "Accept the disarmament deal"
 roc_asia.60.b: "Deny all accusations"
 roc_asia.60.t: "Gas in Eastern Ghouta"
 roc_asia.60.d: "Before dawn, residents of Eastern Ghouta are suffocated by poison gas; more than a thousand die, many of them children asleep in their beds. Footage circulating online shocks the world. Washington says the ‘red line’ has been crossed, and American warships take up position in the Mediterranean. Moscow proposes a compromise: the regime gives up its chemical weapons in exchange for the strikes being called off."
 roc_asia.61.a: "Welcome the Russians"
 roc_asia.61.b: "Stay cautious"
 roc_asia.61.t: "Russian Jets Arrive at Hmeimim"
 roc_asia.61.d: "At dawn the first Su-24s and Su-34s land at Hmeimim air base in Latakia. Moscow announces that, at the request of Syria's legitimate government, the Russian Aerospace Forces will carry out air strikes on terrorist organizations. It is Russia's first large-scale military operation outside the former Soviet Union since the end of the Cold War."
 roc_asia.62.a: "Sign the memorandum"
 roc_asia.62.t: "The Astana De-Escalation Zones"
 roc_asia.62.d: "Representatives of Russia, Iran and Turkey sign a memorandum on de-escalation zones in Astana: the front lines are frozen where they stand, air strikes are suspended and humanitarian corridors opened. Idlib, northern Homs, Eastern Ghouta and the south become four de-escalation zones. It gives Syria a breathing space, but no one knows how long it will last."
 roc_asia.63.a: "Continue the transformation"
 roc_asia.63.b: "Stay hard-line"
 roc_asia.63.t: "The Transformation of HTS"
 roc_asia.63.d: "Al-Julani appears on camera in a suit for an interview with a Western journalist: HTS is a Syrian armed force, not an outpost of global jihad, and cares only about the future of the Syrian people. New political posters appear in the streets of Idlib, and the outside world, suspicious and watchful, waits for it to prove itself by its actions."
 roc_asia.64.a: "Fight side by side"
 roc_asia.64.b: "Keep an independent command"
 roc_asia.64.t: "Turkish Troops Cross the Border"
 roc_asia.64.d: "Turkish tanks cross the border and drive south from Jarablus, the Free Syrian Army's flag flying beside the Turkish flag. The operation aims to clear out the Islamic State, and to stop the Kurdish forces from linking up. In this ‘Euphrates Shield’, who is really in charge? The opposition's relationship with Ankara will never be the same."
 roc_asia.69.a: "Good news"
 roc_asia.69.t: "Chemical Stockpile Eliminated"
 roc_asia.69.d: "OPCW inspectors report that Syria's declared chemical weapons stockpile has been completely destroyed, the last agents neutralized aboard an American ship in the Mediterranean. The Western military threat is lifted for now, but human rights groups suspect the regime is still hiding undeclared stocks."
 SYRB_iran_pact_idea: "Strategic Pact with Iran"
 SYRB_iran_pact_idea_desc: "A defense cooperation agreement, visa-free travel and joint industrial projects: Iran has become Damascus's most important ally, and a new rift with the Gulf states."
 SYRB_turkey_idea: "Syrian-Turkish Honeymoon"
 SYRB_turkey_idea_desc: "Visa-free travel, a free trade area and joint cabinet meetings: Syrian-Turkish border trade has multiplied in a few short years."
 SYRB_drought_idea: "Drought and Rural Crisis"
 SYRB_drought_idea_desc: "The drought of 2006 to 2010 has ruined farming in the northeast, and hundreds of thousands of farmers have flooded into Daraa and the suburbs of Damascus."
 SYRL_pension_idea: "Universal Pensions and Social Insurance"
 SYRL_pension_idea_desc: "A unified pension covering farmers and the self-employed is the welfare promise the Ba'athist left values most."
 SYRL_self_reliance_idea: "Self-Reliance Program"
 SYRL_self_reliance_idea_desc: "Replace imports with domestic steel, cement, textiles and fertilizer: the heavier the sanctions, the more we must do for ourselves. Self-reliance gradually restores industrial capacity and draws the people together through hard times."
 SYRL_media_idea: "Public Media and Oversight"
 SYRL_media_idea_desc: "Public broadcasting becomes an independent body overseen by parliament, and private newspapers receive licenses. Scrutiny by the press keeps officials from abusing their power, the public trusts the government more and society becomes more stable."
 SYRB_tb_edu: "Higher Education and Startups"
 roc_asia.74.a: "Accept reality"
 roc_asia.74.b: "Stress our special relationship with Lebanon"
 roc_asia.74.t: "The Last Army Truck"
 roc_asia.74.d: "In April 2005 the last Syrian army vehicles drive through the Masnaa crossing. Twenty-nine years of military presence come to an end, Lebanon's streets erupt in celebration, and Martyrs' Square is packed with flag-waving crowds. Damascus state television calls it ‘a redeployment between brothers’. From now on, the regime's influence in Lebanon will be maintained through Hezbollah."
 roc_asia.75.a: "Admit the problems and announce reforms"
 roc_asia.75.b: "Crack down hard"
 roc_asia.75.t: "Slogans on a Phone"
 roc_asia.75.d: "A street vendor in Tunisia sets himself on fire, and Egypt's Mubarak falls within eighteen days. Children in Daraa scrawl on their school wall, ‘It's your turn, Doctor’, and are taken away and tortured by intelligence officers. Protests spread from Daraa across the country. The presidential palace says it is all a conspiracy hatched by foreign powers."
 SYRL_tb_edu: "Compulsory Education"
 roc_asia.76.a: "Adopt the charter"
 roc_asia.76.t: "Drafting the Charter"
 roc_asia.76.d: "On the last day of the National Dialogue Conference, the delegates vote on the new national charter article by article. When Article One passes, there is a burst of applause; when Article Thirty-Seven, on presidential terms, passes, the hall stays silent for a long time."
 ISIX_caliphate_idea: "The Caliphate"
 ISIX_caliphate_idea_desc: "Al-Baghdadi climbed into the pulpit of the Great Mosque of Mosul and proclaimed the caliphate: every Muslim in the world, he declared, owes it allegiance."
 ISIX_hisbah_idea: "Religious Police"
 ISIX_hisbah_idea_desc: "Hisbah patrols enforce sharia in every neighborhood: dress, prayer, tobacco and alcohol. Residents seethe in silence."
 ISIX_oil_idea: "Oil Smuggling"
 ISIX_oil_idea_desc: "Tanker convoys leave the oil fields of Deir ez-Zor and flow through smuggling networks on the Turkish border into the black market."
 ISIX_media_idea: "Propaganda Machine"
 ISIX_media_idea_desc: "Dabiq magazine, high-definition execution videos and social media have turned an organization into a global symbol of fear."
 ISIX_foreign_fighters_idea: "Foreign Fighters"
 ISIX_foreign_fighters_idea_desc: "Tens of thousands of foreigners from Europe, Central Asia and North Africa pour in across the Turkish border, swelling the ranks. But they do not share the locals' language or culture and clashes are frequent; countries respond by tightening border controls and counter-radicalization work."
 ISIX_tunnels_idea: "Tunnels and Defense in Depth"
 ISIX_tunnels_idea_desc: "Tunnels, snipers, suicide vehicles and mines turn every city into a fortress. The defenders can keep feeding in fighters during street battles, the attackers pay dearly for every street, and the trapped civilians suffer most of all."
 ISIX_underground_idea: "Going Underground"
 ISIX_underground_idea_desc: "Having lost its territory, the group turns to guerrilla and terrorist activity, waiting for its next chance. It can no longer mount large offensives, but its scattered cells are harder to wipe out completely, and counterterrorism operations must go on for years."
 ROJX_democratic_confederalism_idea: "Democratic Confederalism"
 ROJX_democratic_confederalism_idea_desc: "Gender equality, local councils and multi-ethnic self-rule: Rojava's social contract is testing a new kind of politics in the middle of war."
 ROJX_women_idea: "Co-Chairs and Women's Units"
 ROJX_women_idea_desc: "Every institution has a male and a female co-chair, and the Women's Protection Units have become a symbol on the battlefield."
 ROJX_ypg_idea: "People's Protection Units"
 ROJX_ypg_idea_desc: "The fighters of the YPG and YPJ have grown into a disciplined force through the battles of Kobani, Raqqa and Deir ez-Zor."
 ROJX_coalition_idea: "Coalition Air Support"
 ROJX_coalition_idea_desc: "The US-led coalition provides air strikes, reconnaissance and special forces advisers for the ground offensive. Coalition air power gives the region's forces a decisive edge in attack, but dependence on Washington also limits the administration's political freedom of action."
 ROJX_oil_idea: "The Eastern Oil Fields"
 ROJX_oil_idea_desc: "The autonomous administration controls the eastern oil fields and hydropower stations, its most important source of revenue. Oil and electricity income pays the fighters and civil servants and lets the region hold out under embargo and blockade."
 ROJX_camps_idea: "Prison and Displacement Camps"
 ROJX_camps_idea_desc: "Tens of thousands of Islamic State family members and prisoners are held in the camps, and the Autonomous Administration bears the security and humanitarian burden without international help."
 ROJX_turkey_pressure_idea: "Turkish Pressure"
 ROJX_turkey_pressure_idea_desc: "Ankara regards the region as an extension of a terrorist organization, and the shelling and cross-border raids never stop. The constant threat unsettles the population, but it also gives the region's forces deep experience in defensive fighting."
 SYR_ext_isis_war: "Hostility toward the ‘Islamic State’"
 SYR_ext_ypg_aid: "Support for the Syrian Democratic Forces"
 SYR_ext_tur_pkk: "Turkish Hostility toward the PKK"
 ISIX_tb_captured: "Captured Heavy Weapons"
 ISIX_tb_drone: "Drones and Booby Traps"
 roc_asia.65.a: "Proclaim the caliphate"
 roc_asia.65.t: "A Caliph in Mosul"
 roc_asia.65.d: "Al-Baghdadi mounts the pulpit of the Great Mosque of al-Nuri in Mosul and proclaims a so-called ‘caliphate’, demanding the allegiance of Muslims everywhere. It is the first time anyone has claimed the title of caliph since the Ottoman caliphate was abolished in 1924. Islamic scholars and religious institutions around the world condemn the declaration almost unanimously."
 roc_asia.66.a: "This is the turning point"
 roc_asia.66.t: "Spring in Kobani"
 roc_asia.66.d: "After more than four months of fighting, Kobani's defenders, backed by coalition air strikes and reinforcements from the Iraqi Kurdish Peshmerga, finally drive the Islamic State out of the town. Most of it lies in ruins, but the defenders raise their flag over them. It is the Islamic State's first defeat in a major battle, and its myth begins to crack."
 roc_asia.67.a: "Defend the remaining areas"
 roc_asia.67.t: "The Fall of Afrin"
 roc_asia.67.d: "Turkish troops and the Syrian National Army storm into the city of Afrin. After two months of resistance the defenders are forced to withdraw, hundreds of thousands of residents flee, and statues and symbols of Kurdish culture are torn down. The Kurds accuse the world of indifference: they fought the Islamic State for everyone, and now their allies have abandoned them."
 roc_asia.68.a: "Wait for the right moment"
 roc_asia.68.t: "Into the Shadows"
 roc_asia.68.d: "The last stronghold falls. Thousands of fighters scatter into the deserts and towns along the Syria–Iraq border, taking their weapons and their hatred with them. The so-called ‘caliphate’ has vanished from the map, but its remnants wait in the shadows, and the world's counterterrorism forces know this war is far from over."
 SYRX_crisis_cell: "Crisis Cell"
 SYRX_crisis_cell_desc: "The ‘rebellion’ has spread from Daraa to the whole country. The Presidential Palace sets up a crisis cell: the heads of defense, intelligence and the interior meet every day to coordinate repression and pacification."
 SYRX_defend_damascus: "Defend Damascus"
 SYRX_defend_damascus_desc: "The opposition has taken Douma and Eastern Ghouta on the edge of the capital, mortar shells land in the presidential palace grounds, and the 2012 bombing killed the defense minister and the president's brother-in-law. Whatever happens, Damascus must hold: if the capital falls, the regime is finished."
 SYRX_fourth_division: "The Fourth Armored Division and the Republican Guard"
 SYRX_fourth_division_desc: "Maher al-Assad's 4th Armored Division and the Republican Guard are the regime's most reliable fist, commanded almost entirely by loyal Alawite officers and deployed on Mount Qasioun and the heights around the capital. Other units may defect, but these two must never fail."
 SYRX_checkpoints: "Checkpoint Network"
 SYRX_checkpoints_desc: "Every intersection in Damascus has a checkpoint and informers, IDs, phones and bags are searched, and opposition infiltration is kept to a minimum. The four intelligence agencies each go their own way, but when it comes to keeping order in the capital they are frighteningly efficient."
 SYRX_siege_tactic: "Siege Tactics"
 SYRX_siege_tactic_desc: "Besiege, starve and bomb until the people in rebel-held areas have no other choice. The method was repeated in Homs, Eastern Ghouta and Aleppo, ending each time in a ‘reconciliation agreement’ and evacuation on green buses. It won the regime back large areas, and also brought accusations of war crimes."
 SYRX_reconciliation: "Local Reconciliation Deals"
 SYRX_reconciliation_desc: "Strike ‘reconciliation’ deals with the rebels: fighters and their families leave for Idlib with light weapons, and the towns return to the government. It is the cheaper way to retake ground."
 SYRX_reform_army: "Reorganize the Army"
 SYRX_reform_army_desc: "Defections, casualties and desertion have shrunk the Syrian Arab Army by half, and many brigades exist only on paper. It must be reorganized, units merged and the command restructured, concentrating the units that are still reliable into mobile strike forces."
 SYRX_ndf: "National Defense Forces (NDF)"
 SYRX_ndf_desc: "Merge the pro-government militias around the country, the shabiha, the popular committees and the Baath Brigades, into the National Defense Forces, paid and armed directly by the regime and trained by Iranian advisers. The NDF solves the manpower shortage, but local commanders use it to enrich themselves and act on their own, sowing the seeds of postwar warlordism."
 SYRX_tiger_forces: "Tiger Forces"
 SYRX_tiger_forces_desc: "The Tiger Forces, drawn from the elite of the intelligence services, take their orders from Colonel Suheil al-Hassan of Air Force Intelligence: wherever it is hardest, that is where they go. With direct Russian support and the best equipment, the unit spearheads assaults again and again in Aleppo, Hama and Palmyra."
 SYRX_airpower: "Air Power and Barrel Bombs"
 SYRX_airpower_desc: "The air force is the regime's greatest advantage over the rebels. Helicopters and jets fly day and night, and the barrel bombs they drop are crude but deadly, sparing neither markets, hospitals nor bakeries. They also bring the fiercest international condemnation and sanctions."
 SYRX_conscription: "Emergency Conscription"
 SYRX_conscription_desc: "Military service is extended, the reserves are fully mobilized, and soldiers at checkpoints drag men of military age off to the army at any moment. Those men either enlist or flee: hundreds of thousands of young people escape to Lebanon, Turkey and Europe, part of the biggest refugee wave of the war."
 SYRX_armor_rebuild: "Rebuilding the Armor"
 SYRX_armor_rebuild_desc: "Obtain T-72s, T-90s and spare parts from Russia and Iran to repair the battered armored divisions. Russian advisers move into repair depots across the country and teach Syrian troops how to maintain and use the new equipment, and the shattered armored units can finally mount proper offensives again."
 SYRX_foreign_backers: "Win Over Allies"
 SYRX_foreign_backers_desc: "An isolated regime needs friends: Iran wants the ‘Axis of Resistance’ linking it to Hezbollah in Lebanon, and Russia wants its Mediterranean base at Tartus and its great-power status. Their interests are not identical, but neither can let Damascus fall."
 SYRX_iran_axis: "Iran and Hezbollah"
 SYRX_iran_axis_desc: "The Quds Force of Iran's Revolutionary Guards and Lebanese Hezbollah fighters enter Syria, and Shia militias from Iraq and Afghanistan come to join the fight. Qasem Soleimani directs operations in person, and victories at Qusayr and in the Qalamoun mountains give the regime breathing room."
 SYRX_russia_intervention: "Russian Aerospace Forces Intervene"
 SYRX_russia_intervention_desc: "In September 2015 the Russian Aerospace Forces deploy to Hmeimim air base in Latakia, Su-24s and Su-34s begin intensive bombing of opposition positions, and the Caspian Flotilla even fires cruise missiles. The regime's decline is reversed within weeks."
 SYRX_joint_command: "Joint Operations Command"
 SYRX_joint_command_desc: "Officers from Damascus, Tehran and Moscow work in the same operations room: the Russians handle air power and intelligence, the Iranians the militias and the Syrians the ground advance. The three often disagree on tactics, yet manage to push the front from one city to the next."
 SYRX_chemical_line: "Chemical Weapons and the ‘Red Line’"
 SYRX_chemical_line_desc: "In August 2013 sarin gas in Eastern Ghouta kills hundreds in their sleep and causes an international outcry. Washington says this is a red line. US warships are in position in the Mediterranean, and the regime faces a choice it cannot avoid: give up its chemical weapons, or face air strikes."
 SYRX_chem_deal: "Destroy the Chemical Weapons"
 SYRX_chem_deal_desc: "Through Moscow's mediation, the regime agrees to join the Chemical Weapons Convention and hand its stockpile to the international community for destruction. The strikes are called off, and the regime gains breathing room."
 SYRX_chem_deny: "Deny and Hit Back"
 SYRX_chem_deny_desc: "The regime denies all accusations and blames the opposition for staging the attack. Western sanctions and condemnation follow, and its allies pay a higher diplomatic price."
 SYRX_new_constitution: "The 2012 Constitution"
 SYRX_new_constitution_desc: "The 2012 constitutional revision removes Article 8's clause making the Baath Party ‘the leader of state and society’, and provides for multiparty elections and presidential term limits. The regime presents it as an answer to the Arab Spring's demands for reform; the opposition says only the cover has changed, and power remains in the same family's hands."
 SYRX_reconciliation_ministry: "Ministry of National Reconciliation and Amnesty"
 SYRX_reconciliation_ministry_desc: "A Ministry of National Reconciliation is set up and an amnesty decreed, promising that those who lay down their arms can go home. In some towns local reconciliation really does stop the fighting; but critics say the amnesty never covers the real opposition, and many who return disappear at the checkpoints."
 SYRX_presidential_election: "The 2014 Presidential Election"
 SYRX_presidential_election_desc: "In June 2014 a presidential election is held amid the fighting, with voting only in government-held areas, and the regime announces that ‘the people have chosen Assad again’ with nearly ninety percent of the vote. The opposition and the West refuse to recognize it, calling it a ‘bloody farce’, but the regime now has a legal cloak for staying in power."
 SYRX_astana_process: "The Astana Process and De-Escalation Zones"
 SYRX_astana_process_desc: "Under Russian, Iranian and Turkish sponsorship, Syria is divided into four ‘de-escalation zones’. The fighting dies down for now, and the front lines freeze in new places."
 SYRX_aleppo_reconquest: "Retake Aleppo"
 SYRX_aleppo_reconquest_desc: "After four years of division and months of siege, eastern Aleppo returns to government hands at the end of 2016, and the last fighters and civilians are evacuated to Idlib on green buses. Syria's largest city is reunited, and it is the turning point of the civil war."
 SYRX_palmyra_desert: "The Desert Campaign and Palmyra"
 SYRX_palmyra_desert_desc: "Drive the Islamic State out of Palmyra and the central desert and open the road to the Euphrates. The ancient city's temples have been blown up and the archaeologist Khaled al-Asaad beheaded; retaking Palmyra has strategic value and is also a propaganda victory."
 SYRX_idlib_question: "The Idlib Question"
 SYRX_idlib_question_desc: "Hundreds of thousands of people and every kind of armed group have been squeezed into Idlib. An offensive means a vast humanitarian disaster; no offensive means the enclave lives on."
 SYRX_euphrates_front: "East of the Euphrates"
 SYRX_euphrates_front_desc: "Whoever holds Deir ez-Zor and the eastern oil fields controls postwar Syria's finances: the regime, the Kurds and the US military all have their eyes on the region. The Deir ez-Zor garrison, besieged by the Islamic State for three years, is finally relieved, but most of the oil fields east of the Euphrates are already in the hands of the US-backed Syrian Democratic Forces."
 SYRX_war_economy: "War Economy"
 SYRX_war_economy_desc: "Customs duties, rationing and the black market exist side by side: the regime has redistributed the nation's wealth through the war. Checkpoints charge tolls, businessmen close to the regime monopolize fuel and wheat imports, and the 4th Division controls the smuggling routes. The war has made a new class rich and plunged ordinary people into poverty."
 SYRX_whole_syria: "A United Syria"
 SYRX_whole_syria_desc: "The regime declares that every inch of the national territory must return to Damascus's control. The rebels in Idlib, the Kurdish autonomous region in the northeast and the Turkish-occupied zones in the north all fall within these words. But without Russian and Iranian support, it can only remain a slogan."
 SYRF_council: "Syrian National Council"
 SYRF_council_desc: "In the autumn of 2011 the exiled opposition forms the Syrian National Council in Istanbul and declares that it represents ‘the Syrian people’. The council includes the Muslim Brotherhood, secular intellectuals and Kurdish representatives, but most of them have not set foot in Syria for years and have few ties to the protesters in the streets."
 SYRF_national_coalition: "National Coalition"
 SYRF_national_coalition_desc: "In November 2012 the National Council and other factions merge in Doha into the National Coalition for Syrian Revolutionary and Opposition Forces, recognized by dozens of countries including the US, the EU and the Gulf states as the legitimate representative of the Syrian people. The Arab League even gives it Syria's seat for a time."
 SYRF_geneva: "Geneva Talks"
 SYRF_geneva_desc: "The UN-hosted talks in Geneva: the regime and the opposition sit at the same table, and neither will give an inch. The opposition demands Assad's departure as a precondition, while the regime will only talk about ‘fighting terrorism’. After several rounds, the only achievement is that both sides turned up."
 SYRF_interim_government: "Interim Government"
 SYRF_interim_government_desc: "The interim government appointed by the Coalition starts administering the liberated areas: police, hospitals, courts and schools. Most of its ministers work out of Gaziantep and its money depends on foreign donors, but in parts of rural Aleppo and Idlib people receive documents not issued by the Baath Party for the first time."
 SYRF_friends_of_syria: "Friends of the Syrian People"
 SYRF_friends_of_syria_desc: "Western and Gulf states form the ‘Friends of the Syrian People’ and promise political and material support. At meetings in Tunis, Istanbul and Paris, delegates from a hundred countries issue statements and pledge aid; but what actually reaches the front is often far less than the figures announced in the conference halls."
 SYRF_military_council: "Supreme Military Council"
 SYRF_military_council_desc: "Defected officers and armed groups from across the country are brought together in the Supreme Military Council under General Salim Idris. The council tries to bring hundreds of independent battalions and brigades under one command and to be the sole channel for foreign military aid, but local commanders do not always obey."
 SYRF_defections: "Army Defections"
 SYRF_defections_desc: "Soldiers and officers defect in large numbers, bringing their weapons to the Free Syrian Army. Ever since Colonel Riad al-Asaad announced its founding, every video of a defector holding up his ID card to the camera has shaken the morale of the regime's army and given the opposition trained recruits."
 SYRF_local_councils: "Local Revolutionary Councils"
 SYRF_local_councils_desc: "Local councils in the liberated areas take over the bakeries, water, electricity and schools. Made up of lawyers, teachers and engineers, these councils are the first local governments in decades that Syrians have truly chosen themselves, and one of the revolution's most precious legacies."
 SYRF_brigades: "Brigade Structure"
 SYRF_brigades_desc: "Scattered battalions and small armed groups are merged into brigades by region, and at last there is a fairly complete command structure. Brigade headquarters allocate ammunition, evacuate the wounded and rotate units, battalions no longer fight only for their own villages, and the FSA can organize operations across regions for the first time."
 SYRF_foreign_support: "Foreign Aid"
 SYRF_foreign_support_desc: "Without foreign aid the Free Syrian Army cannot last more than a few months. The question is whom to take it from, and what it will cost. Turkey wants a hard line on the Kurds, the Gulf states want ideological influence, and the US wants no weapons reaching the extremists. Every kind of aid comes with strings attached."
 SYRF_turkey_haven: "Turkish Sanctuary"
 SYRF_turkey_haven_desc: "Turkey opens its border and sets up refugee camps and training bases, becoming the opposition's most important rear area. Hatay and Gaziantep become the opposition's headquarters, hospitals and supply depots, and millions of refugees cross over to safety; the price is that Ankara gains a decisive say over the opposition's political direction."
 SYRF_gulf_money: "Gulf Money"
 SYRF_gulf_money_desc: "Money flows in from Qatar, Saudi Arabia and Kuwait, and with it the ideologies of the various factions. Different donors back different groups, well-funded brigades keep growing, while secular units are often forced to disband or join others for lack of money."
 SYRF_train_equip: "US Train and Equip"
 SYRF_train_equip_desc: "The CIA's Timber Sycamore program gives vetted brigades TOW anti-tank missiles and training, on condition that none reach the extremists. On the plains of Hama and Idlib the TOWs destroy large numbers of regime tanks, earning the nickname ‘Assad's tank killer’."
 SYRF_extremist_question: "The Extremist Challenge"
 SYRF_extremist_question_desc: "Money and weapons flow more and more to Salafist groups, and the Nusra Front performs far better at the front than the FSA. Join them, fight them, or look the other way? The choice will decide whether the West keeps supporting the revolution, and what the revolution finally becomes."
 SYRF_ally_nusra: "Fight Alongside Nusra"
 SYRF_ally_nusra_desc: "At the front the Nusra Front is the best fighting force, and its assault units often break through where the FSA stalls. Fighting alongside it means accepting its ways too: religious courts and black flags appear in the liberated areas, and Western aid is frozen in response."
 SYRF_isolate_extremists: "Break with the Extremists"
 SYRF_isolate_extremists_desc: "Declare a clean break with al-Qaeda and the ‘Islamic State’ in exchange for continued Western aid. Some battalions have to leave towns shared with Nusra, and front-line strength falls as a result; but the opposition keeps the world's recognition as the ‘moderate opposition’."
 SYRF_euphrates_shield: "‘Euphrates Shield’"
 SYRF_euphrates_shield_desc: "In August 2016 Turkish troops cross the border together with the Free Syrian Army, setting out from Jarablus to clear the Islamic State from the north and stop the Kurdish forces from linking up. The operation retakes Dabiq and al-Bab and gives the opposition a stable area in the north under Turkish protection."
 SYRF_national_army: "Syrian National Army"
 SYRF_national_army_desc: "The various Turkish-backed armed groups are reorganized into the Syrian National Army, forming a single command system in the north under the nominal authority of the interim government's defense ministry. Its pay and equipment come from Ankara, but its discipline is uneven, and looting and factional clashes are frequently reported."
 SYRF_liberated_aleppo_damascus: "Storm Damascus"
 SYRF_liberated_aleppo_damascus_desc: "The Free Syrian Army launches offensives on the northern and southern fronts at once, aiming for the capital. The northern force drives south along the M5 highway, the Southern Front pushes north from Daraa, and sleeper units around the capital prepare to rise from within. It is the revolution's boldest move, and everything rides on it."
 SYRF_transition_plan: "Transitional Governance Plan"
 SYRF_transition_plan_desc: "Draft a transitional charter: a transitional council takes power, the army and security services are reorganized, and elections are held within two years. To avoid repeating Iraq's de-Baathification mistakes, the charter allows ordinary civil servants and officers not implicated in crimes to stay in their posts."
 SYRF_free_syria_victory: "A Free Syria"
 SYRF_free_syria_victory_desc: "The regime has fallen. The Free Syrian Army and the National Coalition enter Damascus, crowds wave the three-star flag in front of the Umayyad Mosque, and the building of a new country begins. But the war has left half a million dead, millions of refugees and a devastated land, and rebuilding will be harder than the revolution."
 SYRN_emergence: "The Victory Front"
 SYRN_emergence_desc: "In early 2012 the Nusra Front issues its first statement and begins attacking regime soldiers and police inside Syria. Founded by cadres sent from the Islamic State of Iraq, it quickly stands out among the armed groups for its strict discipline and devastating suicide attacks. The United States soon designates it a terrorist organization."
 SYRN_build_ranks: "Elites and Shock Troops"
 SYRN_build_ranks_desc: "Build an elite force capable of assaults and positional warfare around foreign fighters and veterans of the war in Iraq. Recruits must pass both religious instruction and military training, and the organization is tight and secretive, in sharp contrast to the loosely organized FSA."
 SYRN_inghimasi: "Assault and Breakthrough"
 SYRN_inghimasi_desc: "Assault units drive armored suicide vehicles into enemy positions to open a breach, with infantry close behind. In the offensives in Idlib and Aleppo this tactic repeatedly breaks through the regime's lines. The losses are enormous, and so are the gains, and civilians pay a heavy price as well."
 SYRN_wage_war: "War of Attrition"
 SYRN_wage_war_desc: "Keep ambushing the regime army's supply lines in the countryside and mountains, wearing the enemy down through constant attrition. The roads through the Latakia mountains and northern Hama become a nightmare for regime convoys, and government forces have to tie up large numbers of troops on escort and guard duty."
 SYRN_sharia_courts: "Sharia Courts"
 SYRN_sharia_courts_desc: "Set up sharia courts in held territory to handle civil and criminal cases. Swift trials and cheap justice win acceptance from some residents."
 SYRN_dawa_offices: "Da'wa Offices"
 SYRN_dawa_offices_desc: "The dawa offices run soup kitchens, schools and hospitals, and also handle recruitment. In war-ravaged towns, the group that hands out bread and gas cylinders on time wins hearts and minds, and these activities turn the armed group into a local authority that provides services."
 SYRN_qaeda_oath: "Pledge Allegiance to al-Qaeda"
 SYRN_qaeda_oath_desc: "In April 2013 al-Baghdadi in Iraq announces that Nusra is merged into the ‘Islamic State of Iraq and al-Sham’. Nusra's leader al-Julani refuses and instead pledges allegiance to al-Qaeda's leader al-Zawahiri. The jihadist camp splits, and the two sides are soon at war."
 SYRN_break_qaeda: "Break with al-Qaeda"
 SYRN_break_qaeda_desc: "In July 2016 al-Julani shows his face on camera for the first time, announcing a break with al-Qaeda and a new name, Jabhat Fatah al-Sham, to win broader support. Critics see only a change of name, but the decision paves the way for its later dealings with Turkey and other factions."
 SYRN_absorb_factions: "Absorb Other Factions"
 SYRN_absorb_factions_desc: "Through force and negotiation, bring Idlib's other armed groups under its banner one by one: those who refuse are disarmed, those who cooperate are absorbed. The FSA's Hazzm Movement and Syrian Revolutionaries Front collapse one after another under its attacks, and power in Idlib becomes ever more concentrated."
 SYRN_fight_isis: "Fight the ‘Islamic State’"
 SYRN_fight_isis_desc: "The conflict with the Islamic State escalates from mutual accusations into all-out war, with the two fighting over Raqqa, Deir ez-Zor and northern Aleppo again and again. Nusra becomes one of the forces resisting the Islamic State, and Western intelligence agencies begin reassessing the threat it poses."
 SYRN_hts_formation: "Hay'at Tahrir al-Sham (HTS)"
 SYRN_hts_formation_desc: "In early 2017 Jabhat Fatah al-Sham joins several factions, including the Nour al-Din al-Zenki Movement, to form Hayat Tahrir al-Sham. It becomes the strongest armed force in Idlib and the de facto ruler of northwestern Syria, though the international community still classifies it as a terrorist organization."
 SYRN_take_idlib: "Take Control of Idlib"
 SYRN_take_idlib_desc: "After the Army of Conquest takes Idlib city in 2015, the province gradually falls into HTS hands. It gathers opposition fighters evacuated from all over the country and millions of displaced civilians, and will become HTS's center of rule and the last opposition stronghold of the Syrian civil war."
 SYRN_salvation_government: "Salvation Government"
 SYRN_salvation_government_desc: "Set up the Salvation Government, with ministries, courts, police and a tax office, as the de facto authority in Idlib. It issues identity cards and license plates and runs schools and bakeries, using a technocratic face to soften its armed origins and trying to prove it can govern."
 SYRN_border_crossings: "Border Crossings"
 SYRN_border_crossings_desc: "Control the Bab al-Hawa crossing on the Turkish–Syrian border and tax the goods and fuel passing through, earning millions of dollars a month. UN humanitarian aid also enters Idlib here; the crossing is the lifeline of the whole region and HTS's most important source of money."
 SYRN_turkey_pragmatism: "An Understanding with Turkey"
 SYRN_turkey_pragmatism_desc: "Under the Astana agreements Turkey has observation posts in Idlib, and HTS and Ankara keep a delicate understanding: Turkey needs it to keep order and stop a refugee wave, and it needs Turkey to hold off Russian and regime offensives. Neither side wants to admit the relationship openly."
 SYRN_moderate_image: "A ‘Moderate’ Image"
 SYRN_moderate_image_desc: "Drop the radical slogans and court the West and the neighbors, presenting itself as an armed force of the Syrian people rather than part of global jihad. Al-Julani swaps his fatigues for a suit to give interviews to Western media, foreign fighters are sidelined, and the religious police are reined in."
 SYRN_battle_for_damascus: "March on Damascus"
 SYRN_battle_for_damascus_desc: "HTS takes its riskiest step: an offensive south from Idlib to fight for power at the center. The regime's army is long exhausted, and Russia and Iran have their own troubles; if Aleppo and Hama can be taken within days, the road to Damascus could suddenly open."
 SYRN_syria_for_syrians: "Syria for the Syrians"
 SYRN_syria_for_syrians_desc: "HTS announces the dissolution of its banner and its transformation into a national political force, proposing a ‘new Syria’ for all sects and peoples. The world watches with suspicion and caution: can a former jihadist group really become the government of a country?"
 SYRX_sanctions: "The Caesar Act and Economic Collapse"
 SYRX_sanctions_desc: "The 2020 Caesar Act has cut off reconstruction money. The pound has collapsed overnight, and people queue for bread and petrol. The regime's enemies are no longer only on the battlefield."
 SYRX_captagon: "Captagon and the Gray Economy"
 SYRX_captagon_desc: "Syria has become one of the world's biggest producers of amphetamines, and the export income feeds half the regime. Its neighbors have started calling it a ‘narco-state’."
 SYRX_arab_league_return: "Return to the Arab League"
 SYRX_arab_league_return_desc: "In 2023 Syria returns to its seat in the Arab League after twelve years. After the Turkey–Syria earthquake, Gulf aid and diplomatic contacts follow one after another; Riyadh and Abu Dhabi bet that isolation is useless and a deal is better, trading reconstruction money for limits on Iranian influence and drug smuggling."
 SYRX_israeli_strikes: "Israeli Air Strikes and Air Defense"
 SYRX_israeli_strikes_desc: "Israeli jets repeatedly strike around Damascus, Homs and the Iranian weapons supply lines, aiming to stop Hezbollah from obtaining precision missiles. The regime's aging air defenses can barely cope, the Russian-supplied S-300 does not change the picture, and Syrian airspace is almost open to all comers."
 SYRX_reconstruction_plan: "Reconstruction Blueprint"
 SYRX_reconstruction_plan_desc: "Bombed-out districts, burned fields and factories without power: reconstruction needs ten times the money the regime has. Whoever pays gets the contracts."
 SYRX_refugee_return: "Refugee Return Program"
 SYRX_refugee_return_desc: "Six million Syrians have fled abroad and another six million are displaced inside the country. The regime calls on them to come home, promising amnesty and reconstruction; but people remember why they left: conscription, checkpoints, confiscated homes and missing relatives. Far fewer return than the propaganda claims."
 SYRF_southern_front: "Southern Front"
 SYRF_southern_front_desc: "The rebels of Daraa and Quneitra keep in contact with the Jordanian and American Military Operations Center in Amman and present a relatively moderate, secular face. Daraa was the birthplace of the 2011 protests, and the Southern Front was for a time the most organized and most Western-trusted force in the opposition."
 SYRF_sdf_talks: "Talks with the Kurdish Forces"
 SYRF_sdf_talks_desc: "The Kurds of northern Syria hold weapons and oil fields, and have American air support. Join them, fight them, or keep a distance? Turkey regards the YPG as a terrorist organization, and many opposition factions distrust Kurdish demands for autonomy, but without them the map of the north is incomplete."
 SYRN_sochi: "The Sochi Agreement and Observation Posts"
 SYRN_sochi_desc: "In 2018, Russia and Turkey agreed to draw a buffer zone, with Turkish observation posts inside Idlib. HTS survives squeezed between two great powers."
 SYRN_delisting: "Shed the ‘Terrorist’ Label"
 SYRN_delisting_desc: "HTS sends envoys to lobby the West: we care only about Syria and have never attacked abroad. To get the label removed, it must first prove it is not an al-Qaeda branch: crack down on al-Qaeda remnants in its territory, hand over foreign extremists and guarantee the safety of religious minorities."
 SYRB_consolidate: "Consolidating Power"
 SYRB_consolidate_desc: "Three years after succeeding his father, the President finally has power in his own hands: the old guard has left the stage, and the family and the army stand behind him. Now he must decide what to do with it."
 SYRB_security_state: "Security State"
 SYRB_security_state_desc: "The Damascus Spring is over: the political salons of 2001 are closed and the intellectuals and deputies who signed open letters are taken away. The young president's arrival had raised hopes of reform, but the intelligence services say stability matters more than freedom, and the Baath old guard agree."
 SYRB_open_economy: "Economic Opening"
 SYRB_open_economy_desc: "The president is a London-trained ophthalmologist and head of the Syrian Computer Society. He believes that if the economy opens up and the internet and mobile phones come in, politics will follow. Young technocrats are promoted into the cabinet, and Damascus gets its first private banks and internet cafés."
 SYRB_baath_benefits: "Ba'ath Privileges"
 SYRB_baath_benefits_desc: "Party members' children get first pick of schools, housing and jobs: the Baath Party is the state, and the state is the Baath Party. Millions of members across the country get jobs and benefits through the party's network, and joining is less a matter of belief than a necessity of life."
 SYRB_personal_cult: "Personality Cult"
 SYRB_personal_cult_desc: "Portraits of the new president appear in the streets: from the father in dark glasses to the son in a suit, the propaganda department builds a new image of the ‘young hope’ and ‘modernizing leader’. The same smiling face is on schools, government buildings and the back windows of taxis."
 SYRB_old_guard_balance: "Balancing the Old Guard"
 SYRB_old_guard_balance_desc: "The old guard left by his father, Khaddam, Shihabi and Zuabi, still hold key posts in intelligence and the army. Either win them over or gradually replace them: the president clears out the old guard in the name of anti-corruption and retirement, while placing his own confidants and relatives in the key departments."
 SYRB_cosmetic_reforms: "Cosmetic Reforms"
 SYRB_cosmetic_reforms_desc: "The 2005 Baath Party congress adopts a program of ‘renewal and modernization’: a new party charter, new slogans and a promise to allow new parties, while the power structure stays the same. Foreign journalists are allowed to visit and Western diplomats write cautiously optimistic cables, but nothing really changes."
 SYRB_mb_talks: "An Understanding with the Muslim Brotherhood"
 SYRB_mb_talks_desc: "After the Hama massacre of 1982, the Muslim Brotherhood was treated as enemy number one and membership was punishable by death. Now the regime is willing to let the exiled older generation come home in exchange for giving up politics and keeping quiet. It is a fragile reconciliation, and neither side trusts the other."
 SYRB_social_market: "Social Market Economy"
 SYRB_social_market_desc: "Open up private banking, insurance and universities, cut tariffs and open the door to foreign investment. Officials say it is now the capitalists' turn to be the ‘new class’. Malls and hotels go up in Damascus, but the biggest winners are the likes of the president's cousin Rami Makhlouf, while farmers in the countryside and the east sink into poverty amid drought."
 SYRB_anticorruption: "Anti-Corruption Campaign"
 SYRB_anticorruption_desc: "The president announces on television that he will clean up corruption: several ministers step down, a batch of customs and tax officials are prosecuted, and the newspapers report on it at length. But not one of his relatives is on the list, and the merchants of Damascus understand perfectly: the campaign targets other people's corruption."
 SYRB_free_media: "Private Media and the Internet"
 SYRB_free_media_desc: "The first private newspapers, satellite channels and internet cafés appear, and the satirical weekly al-Domari is passed eagerly around Damascus for a time. Censorship has not disappeared, only become subtler: you may criticize bureaucracy but not the president's family, discuss economic reform but not political reform."
 SYRB_electoral_reform: "Electoral Reform"
 SYRB_electoral_reform_desc: "Parliamentary elections bring in more independent candidates, and local councils gain more power, including control over part of their budgets. The Baath Party still guarantees its majority through the National Progressive Front, but for the first time voters have a real choice between several candidates."
 SYRB_medical_investments: "Investment in Medicine and Research"
 SYRB_medical_investments_desc: "New hospitals, drug factories and university labs are among the achievements this ophthalmologist-turned-president most likes to boast about. Syrian generic drugs once met ninety percent of domestic demand and were exported across the Arab world, and Damascus University's medical school begins attracting scholars from abroad again."
 SYRB_before_the_storm: "The Eve of the Storm"
 SYRB_before_the_storm_desc: "By 2010, Syria has private banks, mobile phones and satellite TV, and also drought, unemployment and the first protest slogans. The streets of neighboring countries are already on fire."
 SYRL_return_roots: "Back to the Roots of the Ba'ath"
 SYRL_return_roots_desc: "After taking power, the young President finds that he has inherited not just a country but a whole web of power revolving around his family. ‘Unity, freedom, socialism’: are those three words just a slogan on the wall?"
 SYRL_end_dynasty: "End Family Rule"
 SYRL_end_dynasty_desc: "‘The state is nobody's family property.’ The president announces that relatives may not serve as ministers or as heads of the army and intelligence, and that a surname will no longer be a qualification for promotion. It is the original vision of the Baath founders Michel Aflaq and Salah al-Din al-Bitar, and the most direct rejection of forty years of family rule."
 SYRL_makhlouf_trial: "Settle Accounts with the Family Tycoons"
 SYRL_makhlouf_trial_desc: "Investigate the telecom, oil and duty-free monopolies controlled by relatives such as Rami Makhlouf, confiscate their illegal gains and put the contracts out to open tender. Makhlouf was once estimated to control sixty percent of the Syrian economy; his fall fills the treasury and gives countless small traders their first chance to compete."
 SYRL_retire_old_guard: "Retirement for the Old Guard"
 SYRL_retire_old_guard_desc: "Ask Khaddam, Shihabi and the older generation in the army and the party to retire with dignity, making way for younger cadres with professional backgrounds. The old guard keep honorary titles and privileges but no longer meddle in appointments or intelligence; it is gentler than a purge and makes fewer enemies."
 SYRL_merit_cadres: "Appointment on Merit"
 SYRL_merit_cadres_desc: "Set up a national cadre academy and replace ‘connections’ and wasta with open examinations, performance reviews and asset declarations. Young people in Aleppo, Homs and Deir ez-Zor feel for the first time that they can enter state service on merit, even without knowing anyone important."
 SYRL_collective_leadership: "National Leadership Council"
 SYRL_collective_leadership_desc: "Set up a national leadership council of party, army and government representatives, so that major decisions are no longer made by one man. The council meets weekly and decides on war, budgets and appointments by majority vote; the president is still first among them, but no longer the only one."
 SYRL_term_limits: "Presidential Term Limits"
 SYRL_term_limits_desc: "The constitution states that a president may serve no more than two seven-year terms and must hand over power at the end. Almost no republic in the Middle East has honored such a rule: from Cairo to Damascus, presidents for life and sons succeeding fathers are the norm. Syria intends to be the first."
 SYRL_depoliticize_army: "Take the Family out of the Army"
 SYRL_depoliticize_army_desc: "The Republican Guard and the 4th Armored Division are placed under the unified command of the Ministry of Defense, and officer appointments are made by an independent personnel board without regard to sect or home region. The share of Alawite officers gradually falls, and the army begins to truly belong to all Syrians."
 SYRL_arab_socialism: "The Revival of Arab Socialism"
 SYRL_arab_socialism_desc: "Write the socialist promise back into economic policy: land, factories and banks are to serve the many, not enrich the few. For twenty years the slogan ‘Unity, Freedom, Socialism’ has been an empty shell, and now the left wants to bring the third word back."
 SYRL_land_reform: "New Land Reform"
 SYRL_land_reform_desc: "Lease abandoned state land to landless farmers and set up agricultural cooperatives to bring the countryside back. The great drought of 2006 to 2010 drove a million farmers to the edges of the cities, one of the root causes of the uprising; the new land reform offers seeds, loans and irrigation to bring them back to the fields."
 SYRL_public_sector: "Revive the Public Sector"
 SYRL_public_sector_desc: "Revive the State Planning Commission and bring energy, cement, fertilizer and textiles back under state control. These factories were sold cheaply to the well connected in the ‘social market economy’ era; now they reopen as state enterprises, putting postwar reconstruction and people's needs first."
 SYRL_five_year_plan: "A New Five-Year Plan"
 SYRL_five_year_plan_desc: "Draw up a new five-year plan with public participation: food, electricity and housing come first. The people's councils of each province submit local needs, and the Planning Commission combines them into a national program; it is Syria's first economic plan drawn up from the bottom up."
 SYRL_euphrates_basin: "Developing the Euphrates Basin"
 SYRL_euphrates_basin_desc: "The Tabqa Dam was the biggest project of the Baath era, and Lake Assad supplies power and irrigation to the whole north. A new round of irrigation, hydropower and agro-processing projects will spread along the valley, and war-torn Raqqa and Deir ez-Zor will be reconnected with the river as their link."
 SYRL_workers_coops: "Cooperatives and Worker Participation"
 SYRL_workers_coops_desc: "Worker representatives join company management boards and help decide wages, shifts and profit sharing; farmers' cooperatives sell grain directly to the state, cutting out the chain of middlemen. It is the left's new interpretation of socialism: not a bureaucrats' state, but a producers' state."
 SYRL_welfare_state: "Universal Health Care and Education"
 SYRL_welfare_state_desc: "Free hospitals and universities are among the Ba'ath's most precious legacies. They must be repaired, and brought to the most remote villages."
 SYRL_baath_congress: "Ba'ath Party Congress"
 SYRL_baath_congress_desc: "Hold a party congress with genuinely open debate: the party program, the Regional Command and the secretariat are all re-elected. Delegates argue openly in the hall, some defending family rule and others demanding a reckoning with twenty years of mistakes, with television broadcasting it all live."
 SYRL_npf_pluralism: "A Real National Progressive Front"
 SYRL_npf_pluralism_desc: "Let the other parties in the National Progressive Front, the Communists, the Arab Socialist Union and the Socialist Unionists, have their own programs, newspapers and seats."
 SYRL_internal_democracy: "Inner-Party Democracy"
 SYRL_internal_democracy_desc: "Secretaries of local party branches are elected directly by the members instead of being appointed from above. Many secretaries who rose through connections lose their seats, replaced by teachers, doctors and union officials well regarded in their communities. The Baath Party begins relearning how to win hearts."
 SYRL_council_power: "Real Power for the People's Council"
 SYRL_council_power_desc: "Powers over the budget, legislation and questioning return to the People's Assembly: deputies can question ministers and even table motions of no confidence. The cabinet must answer to the assembly, and for the first time ministers have to face deputies' sharp questions about blackouts, prices and corruption on camera."
 SYRL_free_unions: "Independent Unions and Peasants' Federation"
 SYRL_free_unions_desc: "Trade unions and the peasants' union may elect their own leaders and negotiate their own wages and purchase prices, no longer mouthpieces of the Baath Party. Textile workers in Aleppo and refinery workers in Homs win pay rises through collective bargaining for the first time."
 SYRL_press_dialogue: "Public Scrutiny"
 SYRL_press_dialogue_desc: "Newspapers may criticize ministers and television may broadcast parliamentary debates live. Memories of the 2001 Damascus Spring are revived; some of the intellectuals jailed back then become columnists after their release, others are elected to parliament. The limits of speech are pushed outward step by step."
 SYRL_civil_state: "A Civic State"
 SYRL_civil_state_desc: "The constitution states that all are equal before the law, regardless of sect or ethnicity. Alawites, Sunnis, Christians and Kurds are all Syrian citizens."
 SYRL_palestine_cause: "The Palestinian Cause"
 SYRL_palestine_cause_desc: "Reaffirm the Baath position on Palestine: no recognition of Israel's occupation of the Golan and Palestinian land, support for the refugees' return, and no deals. Rebuilding the Yarmouk refugee camp is made a priority, as the left hopes to win back the Arab world's moral support."
 SYRL_arab_unity: "Unity: Arab Solidarity"
 SYRL_arab_unity_desc: "The Baath Party's first slogan was ‘Unity’. Revive the ideas of an Arab common market, joint defense and free movement of people: from the short-lived United Arab Republic of 1958 to today, Arab unity has always been a beautiful dream, but Damascus is willing to try again."
 SYRL_nonaligned: "Non-Alignment and Diverse Diplomacy"
 SYRL_nonaligned_desc: "Keep ties with Moscow, Beijing, Tehran, Ankara and Europe at the same time, attached to no single bloc. The Baath left remembers Nasser and Tito's Non-Aligned Movement: to survive among great powers, a small country must never hand its fate to any one protector."
 SYRL_iraq_reconcile: "Heal the Rift with the Iraqi Ba'ath"
 SYRL_iraq_reconcile_desc: "After the Baath split of 1966, the two Baath parties in Damascus and Baghdad attacked each other for decades, and Syria even sided with the US in the Gulf War. Now Saddam is long gone, and the remnants of the Iraqi Baath and the Syrian left have a common language. It is time to sit down and talk."
 SYRL_national_dialogue: "National Dialogue"
 SYRL_national_dialogue_desc: "Invite representatives of every party, religion and region to discuss the nation's future in the same hall: Kurds, Druze, Christians and Sunni tribal elders all have seats. No one is excluded, but no one can monopolize the conversation either."
 SYRL_people_army: "A People's Army"
 SYRL_people_army_desc: "Build an army loyal to the constitution rather than to any individual, based on conscription and total defense. Young men from every sect and province serve in proportion, officers are promoted on their academy records and battlefield performance, and the political commissars' job becomes constitutional education."
 SYRL_left_ceasefire: "The Left's Ceasefire Plan"
 SYRL_left_ceasefire_desc: "Offer the secular and leftist factions of the opposition a ceasefire and power-sharing plan: autonomous councils, elections and an amnesty, on condition that they lay down their arms. Many of the young people who took to the streets in 2011 never wanted an Islamic state, only a republic free of corruption and tyranny."
 SYRL_rebuild_people: "People's Reconstruction Committees"
 SYRL_rebuild_people_desc: "Set up reconstruction committees elected by residents for each destroyed neighborhood, handing over both the money and the decisions. Residents of old Homs and eastern Aleppo decide for themselves whether to fix the schools or the water pipes first, and contractors must open their books to the committees."
 SYRL_new_republic: "The New Ba'athist Republic"
 SYRL_new_republic_desc: "The President reads the new national program to parliament: the Ba'ath belongs to the people, not to any family. Unity, freedom, socialism: this time, for real."
 SYRB_iraq_war: "The Iraq War and the Refugee Wave"
 SYRB_iraq_war_desc: "In 2003, US forces invaded our neighbor. Damascus opposed the war but took in over a million Iraqi refugees, while insurgents moved in and out of Iraq through Syria."
 SYRB_lebanon_exit: "Withdraw from Lebanon"
 SYRB_lebanon_exit_desc: "In February 2005 former prime minister Hariri is assassinated in Beirut, and suspicion points straight at Damascus. The million-strong rallies of the Cedar Revolution make the demand for Syrian withdrawal deafening, and under international pressure the twenty-nine-year military presence is withdrawn within weeks."
 SYRB_hezbollah_war: "The 2006 War and Hezbollah"
 SYRB_hezbollah_war_desc: "After the Israel-Lebanon war, Syria gives Hezbollah both weapons and diplomatic backing. The Axis of Resistance enjoys unprecedented prestige on the Arab street."
 SYRB_kibar: "The al-Kibar Incident"
 SYRB_kibar_desc: "In 2007, Israeli jets destroyed a mysterious facility near Deir ez-Zor. Syria refused to respond, and refused an IAEA investigation."
 SYRB_iran_pact: "Strategic Pact with Iran"
 SYRB_iran_pact_desc: "Defense cooperation, joint industry and visa-free travel. Iran is not only an ally but a major financial backer of the Syrian economy: Tehran provides soft loans and crude oil, assembles cars and builds power plants in Syria. The alliance began during the Iran–Iraq War in 1980 and is now stronger than ever."
 SYRB_turkey_honeymoon: "Syrian-Turkish Honeymoon"
 SYRB_turkey_honeymoon_desc: "Ankara and Damascus abolish visas and hold joint cabinet meetings, and border trade and tourism boom for a time. In 1998 the two countries were on the brink of war over the PKK's leader; now Erdoğan and the president go on holiday with their families, and Aleppo is full of Turkish tourists."
 SYRB_med_union: "Union for the Mediterranean and the EU Association Agreement"
 SYRB_med_union_desc: "Paris, Brussels and Damascus reopen talks: can Syria sign an EU association agreement? The President is received with great ceremony at the Élysée."
 SYRB_russia_arms: "Arms from Russia"
 SYRB_russia_arms_desc: "The president visits Moscow, and Russia writes off nearly ten billion dollars of Soviet-era arms debt and sells back air defense missiles and anti-tank weapons. In exchange, the Russian navy's supply station at Tartus is kept and expanded, Russia's only foothold in the Mediterranean."
 SYRB_intel_overhaul: "Restructuring Intelligence"
 SYRB_intel_overhaul_desc: "The intelligence services are folded into a system centered on the Presidential Palace: Air Force Intelligence, Military Intelligence and Political Security each watch the others."
 SYRB_loyal_army: "A System of Army Loyalty"
 SYRB_loyal_army_desc: "Officers of the Republican Guard and the 4th Armored Division come mostly from the same sect and the same families; the first criterion for promotion is loyalty, and competence only second. The system protects the regime from coups, but when real war comes it exposes the army's poor training and corruption."
 SYRB_net_control: "Internet Controls"
 SYRB_net_control_desc: "Internet cafés must register users, bloggers must use their real names, and social networks are blocked. From 2007, Facebook and YouTube become ‘contraband’ in Syria, and young people can only reach them through proxy servers. The Syrian Electronic Army monitors and attacks critics online, and the intelligence services reach into every computer."
 SYRB_sectarian_balance: "Sectarian Balance"
 SYRB_sectarian_balance_desc: "Alawites, Sunnis, Christians and Druze: the regime's stability depends on convincing every community that without the regime it would be worse off. Sunni merchants get business, minorities get protection, Alawites get military posts. The balance looks solid, but once broken it turns into sectarian war."
 SYRB_private_banks: "Private Banks and the Stock Exchange"
 SYRB_private_banks_desc: "From 2004 the first private banks open, and in 2009 the Damascus Securities Exchange is founded, with the wealthy queuing to open accounts. Lebanese and Gulf banks set up branches in Syria, and a financial sector monopolized by state banks for forty years finally sees competition."
 SYRB_private_universities: "Private Universities and Research"
 SYRB_private_universities_desc: "Private universities, technical colleges and startup incubators spring up on the outskirts of Damascus, and young people start writing their CVs in English, dreaming of jobs in Dubai or Berlin. Middle-class children no longer have to squeeze into crowded public universities, though only a few families can afford the fees."
 SYRB_telecom: "Private Mobile Operators"
 SYRB_telecom_desc: "Two private operators get licenses: Syriatel and MTN. Mobile phones quickly replace landlines and become the regime's new gold mine: Syriatel belongs to the president's cousin Rami Makhlouf, and part of the profit from every call flows into the family's pockets."
 SYRB_old_city_tourism: "Old City Restoration and Tourism"
 SYRB_old_city_tourism_desc: "Old Damascus, the Citadel of Aleppo and the ruins of Palmyra draw millions of European and Gulf tourists, and tourism once makes up twelve percent of GDP. Old courtyard houses are turned into boutique hotels and tour groups crowd in front of the Umayyad Mosque; those were Syria's best years."
 SYRB_drought: "Drought and Rural Crisis"
 SYRB_drought_desc: "Four straight years of drought have turned the northeast's fields to dust, and farmers are flooding into the slums on the edge of the cities. The official farm statistics still look good."
 SYRB_youth_unemployment: "Youth Unemployment and Urbanization"
 SYRB_youth_unemployment_desc: "Half of all Syrians are under 25, and university graduates scroll the news in cafes. The first slogans calling for reform are being forwarded from phone to phone."
 SYRL_women_equality: "Women's Equality and Family Law Reform"
 SYRL_women_equality_desc: "Abolish the reduced sentences for ‘honor crimes’, raise the legal age of marriage, and give women equal rights in inheritance and guardianship. Some religious figures fiercely oppose it, but countless women held their families together alone during the war, and their position can never go back to what it was."
 SYRL_secular_education: "Secular Compulsory Education"
 SYRL_secular_education_desc: "A single national twelve-year compulsory education system with standard textbooks, separating religious instruction from civics. During the war each zone of control wrote its own textbooks, and children learned histories of mutual hatred; a common education is the first step toward making the next generation citizens of the same country again."
 SYRL_minorities_council: "Council for Religious and Ethnic Equality"
 SYRL_minorities_council_desc: "A council of Sunni, Alawite, Christian, Druze, Ismaili, Kurdish, Armenian and Assyrian representatives reviews every law touching on sect or ethnicity."
 SYRL_kurdish_citizenship: "Citizenship for the Kurds"
 SYRL_kurdish_citizenship_desc: "The 1962 census left hundreds of thousands of Kurds ‘stateless’. The new nationality law restores their citizenship and recognizes teaching and publishing in Kurdish."
 SYRL_nationalize_banks: "Nationalize Banks and Insurance"
 SYRL_nationalize_banks_desc: "Bring private banks and insurers back into state ownership, with the Planning Commission directing credit first to agriculture, reconstruction and small businesses. Private depositors' savings are guaranteed by the state, but foreign banks pull out and the pressure of capital flight follows."
 SYRL_price_commission: "Price Commission"
 SYRL_price_commission_desc: "Prices of staple foods, fuel and medicine are set by a price commission, and merchants may not raise them on their own on pain of losing their licenses. During the war bread and gas prices rose more than tenfold and black marketeers made fortunes; the price commission is the left's first promise kept to ordinary families."
 SYRL_public_housing: "Public Housing Program"
 SYRL_public_housing_desc: "Build mainly rental public housing on the outskirts of the big cities, with priority for young couples and migrant workers. The war destroyed a third of the nation's homes, and millions live in tents, unfinished buildings or with relatives; public housing gives them somewhere to settle."
 SYRL_rural_electrification: "Rural Electrification and Irrigation"
 SYRL_rural_electrification_desc: "Bring electricity and irrigation canals to the very last village, so farmers no longer depend on expensive diesel pumps. Substations and canals destroyed in the war are repaired one by one, solar water pumps spread across the fields of Hasakah and Daraa, and nights in the countryside are lit again."
 SYRL_progressive_tax: "Progressive Taxation"
 SYRL_progressive_tax_desc: "Big companies and high earners pay higher tax rates, the fortunes of war profiteers are audited, and the tax-free allowances of farmers and small shopkeepers are raised sharply. Syria's tax burden used to fall mainly on wage earners; now the left wants the rich to contribute more to reconstruction."
 SYRL_pension_system: "Universal Pensions"
 SYRL_pension_system_desc: "A single pension and social insurance system covering farmers, the self-employed and housewives, no longer limited to civil servants and state employees. The war took the breadwinners of many families and left many elderly people alone; a universal pension means they no longer have to live on charity."
 SYRL_oil_water: "Public Ownership of Oil and Water"
 SYRL_oil_water_desc: "Oil, gas, water and mineral revenues belong to the whole people, thirty percent of the income goes to rural and education funds, and the accounts are opened to the People's Assembly every year. Where the oil money went used to be a state secret; now the left wants every Syrian to be able to see it."
 SYRL_national_charter: "National Charter"
 SYRL_national_charter_desc: "A new charter drafted by the National Dialogue Conference: the state belongs to all citizens, power comes from elections, the army obeys the constitution, and no president may serve more than two terms."
 SYRL_media_reform: "National Media Reform"
 SYRL_media_reform_desc: "Public broadcasting becomes an independent body overseen by parliament instead of being run by the information ministry; private newspapers and radio stations can apply for licenses under open, transparent criteria. In the war years every side's television spread hatred, and the new media law expressly bans incitement of sectarian hostility."
 SYRL_total_defense: "All-People Defense Doctrine"
 SYRL_total_defense_desc: "Replace a confrontational arms race with total mobilization and mountain defense: militia, reserves and the defense industry under a single command. Syria can never outmatch its neighbors in aircraft or tanks, but a national army able to resist on every hilltop and in every street is enough to deter any invader."
 SYRL_south_south: "South-South Cooperation"
 SYRL_south_south_desc: "Sign cooperation agreements on energy, agriculture and health with Venezuela, Cuba, China and India: Cuba sends doctors, India provides drugs and generic manufacturing technology, and China builds power plants. These countries attach no conditions on human rights or regime change, exactly the partners a sanctioned Syria needs most."
 SYRL_solidarity: "Solidarity with Africa and Latin America"
 SYRL_solidarity_desc: "Stand with African and Latin American countries in the UN and the Non-Aligned Movement. Syria's delegates back South Africa's case against Israel and the resolutions to end the embargo on Cuba, and in return gain a few more sympathetic votes when it counts and renewed friendship with the Third World."
 SYRL_self_reliance: "Self-Reliance Program"
 SYRL_self_reliance_desc: "The response to tightening sanctions: replace imports with domestic steel, cement, textiles and fertilizer, rebuilding the old state factories of Homs and Hama. The products are rough and the plants inefficient, but when foreign ships stop calling, Syrians can at least make what they need themselves."
 ISIX_declaration: "Proclaim the Caliphate"
 ISIX_declaration_desc: "In June 2014, the ‘Islamic State of Iraq and al-Sham’ renamed itself the ‘Islamic State’ and hailed al-Baghdadi as caliph. The border was ‘bulldozed’, and a state spanning two countries appeared on the map."
 ISIX_bayah: "The Oath of Allegiance"
 ISIX_bayah_desc: "Local armed groups, tribes and foreign branches swear allegiance, some willingly and some under duress, and the caliph's name appears on banners from West Africa to Khorasan. Tribes that refuse are massacred, as the Shaitat were in 2014; allegiance is not a choice of faith but the price of survival."
 ISIX_diwans: "The Diwans"
 ISIX_diwans_desc: "Set up ministries, or diwans, for finance, justice, education, war and intelligence, and administrative districts divided into ‘provinces’, absorbing many former Iraqi Baathist officials. The group tries to prove it is a ‘state’ rather than just an armed group, but its rule rests on fear."
 ISIX_hisbah: "Religious Police"
 ISIX_hisbah_desc: "Hisbah patrols and sharia courts are the two pillars of rule in the occupied territories: smoking, listening to music or dressing the wrong way is punished with flogging, and public executions are held in the squares. Residents of the occupied areas live under constant surveillance and fear."
 ISIX_zakat: "Zakat and Jizya"
 ISIX_zakat_desc: "Muslims are forced to pay zakat, Christians and other minorities must pay the jizya tax or be expelled, and merchants pay ‘protection money’, giving the group a predatory tax system. Mosul's Christians are forced within days to leave the homes their community had lived in for nearly two thousand years."
 ISIX_schools: "The Caliph's Schools"
 ISIX_schools_desc: "School curricula are replaced with religious indoctrination and military training, math textbooks count bullets and bombs, and children called ‘cubs of the caliphate’ are trained as child soldiers. It is the darkest chapter of the occupation, and an entire generation's childhood is destroyed."
 ISIX_media: "Propaganda Machine"
 ISIX_media_desc: "Dabiq magazine, the Amaq news agency and thousands of social media accounts turn battlefield footage into worldwide fear and lure young people abroad to join online. The major tech platforms later carry out mass takedowns of these accounts, and intelligence agencies make online propaganda a top target."
 ISIX_military_council: "Military Council"
 ISIX_military_council_desc: "Former Iraqi officers and Baathists form a military council that holds real command. When the US disbanded the Iraqi army in 2003, hundreds of thousands of trained soldiers lost their jobs; some met extremists in the Camp Bucca prison and eventually became the group's military backbone."
 ISIX_blitz: "Lightning Advance"
 ISIX_blitz_desc: "Hundreds of pickup trucks carry fighters out of the desert toward the cities. Corruption and low morale in the Iraqi army mean many units collapse before the enemy even arrives, leaving behind masses of American-made equipment. The lightning advance shocks the world and makes every country realize how serious the threat is."
 ISIX_inghimasi: "Shock Troops and Car Bombs"
 ISIX_inghimasi_desc: "Armored suicide vehicles blast a breach, assault squads rush in, and the main force follows. The tactic causes enormous casualties in Mosul and Ramadi, and Iraqi and Kurdish forces have to counter it one by one with bulldozers, anti-tank missiles and air support."
 ISIX_heavy_weapons: "Captured Heavy Weapons"
 ISIX_heavy_weapons_desc: "Tanks, artillery and air defense weapons captured from the barracks of Mosul and Syrian arsenals, including large numbers of American Humvees and M1 tanks. The captured equipment briefly gives the group firepower close to a regular army, but without maintenance or spare parts it is soon ground down by coalition air strikes."
 ISIX_mosul: "Take Mosul"
 ISIX_mosul_desc: "In June 2014 a few hundred fighters take Iraq's second-largest city, and an Iraqi army of thirty thousand offers almost no resistance. A few weeks later al-Baghdadi proclaims a ‘caliphate’ from the al-Nuri Mosque. Mosul's million residents will spend three years under occupation."
 ISIX_raqqa: "Raqqa as Capital"
 ISIX_raqqa_desc: "Raqqa becomes the group's ‘capital’: administration, propaganda and the training of foreign recruits are all concentrated here. Paradise Square becomes a site of public executions that residents call ‘Hell Square’. Raqqa thereby becomes the coalition's top target."
 ISIX_kobani: "The Siege of Kobani"
 ISIX_kobani_desc: "In the autumn of 2014 thousands of fighters besiege the Kurdish border town of Kobani, and television cameras on the Turkish border broadcast the battle to the world. Backed by coalition air strikes, the Kurdish YPG hold out for months, and the group suffers its first decisive defeat."
 ISIX_drones_ied: "Drones and IEDs"
 ISIX_drones_ied_desc: "Commercial drones drop grenades, and ruins are littered with booby traps and improvised explosive devices. In the battle of Mosul these cheap tactics make every step costly for the attackers; after the war deminers spend years making it safe for residents to return home."
 ISIX_tunnels: "Tunnels and Defense in Depth"
 ISIX_tunnels_desc: "Turn every city into a fortress: tunnels, snipers, mines and human shields. Civilians are forbidden to leave and become hostages against air strikes. The street fighting in Mosul's old city and Raqqa lasts for months, the cities are almost leveled, and civilians pay the heaviest price."
 ISIX_oil_smuggling: "Oil Smuggling"
 ISIX_oil_smuggling_desc: "The oil fields of Deir ez-Zor produce tens of thousands of barrels a day, refined in crude workshops and smuggled to Turkey and Iraq, at one point bringing in millions of dollars a day. The coalition then launches Operation Tidal Wave II, bombing the oil fields and tanker trucks to cut off the group's money."
 ISIX_antiquities: "Antiquities and Kidnapping"
 ISIX_antiquities_desc: "Antiquities from Palmyra and Nimrud are looted and smuggled to the black market, and what cannot be moved is blown up; foreign hostages become a source of ransom and victims in propaganda. UNESCO calls it ‘cultural cleansing’, and countries tighten controls on the trade in Middle Eastern antiquities."
 ISIX_dams_grain: "Dams and Granaries"
 ISIX_dams_grain_desc: "The Tabqa Dam on the Euphrates supplies power, and the surrounding plains supply grain. Control the water and you control the people: the group once threatened to cut off water downstream. The neglected dam at one point came close to failing, endangering millions of lives downstream."
 ISIX_war_chest: "War Chest"
 ISIX_war_chest_desc: "Income from oil, taxes, extortion and plunder adds up to a considerable war chest, used to pay salaries, buy weapons and buy off tribes. But the money rests on plundering the occupied territories, and as territory is lost and the coalition attacks its financial networks, the funds quickly dry up."
 ISIX_foreign_fighters: "Foreign Fighters"
 ISIX_foreign_fighters_desc: "Tens of thousands of volunteers from Europe, Central Asia and North Africa: the caliphate's most loyal shock troops, and the hardest to manage."
 ISIX_wilayat: "Overseas ‘Provinces’"
 ISIX_wilayat_desc: "Boko Haram in Nigeria and armed groups in Egypt's Sinai, Libya and Afghanistan declare themselves ‘provinces’ of the group. The so-called global expansion is really existing local extremist groups adopting a new banner, borrowing its name to recruit and raise money."
 ISIX_terror_attacks: "Attacks Abroad"
 ISIX_terror_attacks_desc: "Paris, Brussels, Istanbul: terrorist attacks take hundreds of innocent lives and extend the war across the world. After the massacre at the Bataclan in Paris in 2015, France declares a state of emergency and the international coalition resolves to destroy the group completely."
 ISIX_lone_wolves: "Lone Wolves and Online Jihad"
 ISIX_lone_wolves_desc: "Incite distant sympathizers online to carry out attacks in their own cities: the truck in Nice, the Christmas market in Berlin. Countries respond by stepping up online monitoring and counter-radicalization programs, and communities, schools and families become the first line of defense against radicalization."
 ISIX_sinai_libya: "Sinai and Libya"
 ISIX_sinai_libya_desc: "The group sets up new strongholds in Egypt's Sinai and in Sirte, Libya. In 2015 a Russian airliner is bombed over Sinai, killing more than two hundred; Sirte is retaken in 2016 by Libyan government forces with American air support."
 ISIX_khorasan: "Khorasan Province"
 ISIX_khorasan_desc: "Reach into Afghanistan and Central Asia: the ‘Khorasan Province’ establishes itself in Nangarhar in eastern Afghanistan, fights the Taliban, and carries out bloody attacks such as those at Kabul airport and a Moscow concert hall. It becomes the group's most dangerous branch outside the Middle East."
 ISIX_coalition_war: "War with the Coalition"
 ISIX_coalition_war_desc: "A coalition of more than eighty countries begins air strikes while the Iraqi army, the Kurdish Peshmerga and the Syrian Democratic Forces advance on the ground: supply lines are cut and territory lost piece by piece. The group faces its greatest test, and its so-called ‘state’ begins to collapse rapidly."
 ISIX_last_stand: "The Last Stronghold"
 ISIX_last_stand_desc: "Surrounded in the last few villages of the Euphrates valley, the remaining fighters choose to fight to the end. In March 2019 Baghuz falls to the Syrian Democratic Forces, the so-called ‘caliphate’ is wiped out territorially, and tens of thousands of family members are held in the al-Hol camp."
 ISIX_underground: "Go Underground"
 ISIX_underground_desc: "Announce the abandonment of territory and split into hundreds of small cells, moving into a phase of guerrilla and terrorist attacks. They hide in the deserts and mountains on the Iraqi–Syrian border, ambushing checkpoints and assassinating local officials, and counterterrorism forces must keep hunting them for years."
 ISIX_embers: "Embers of the Caliphate"
 ISIX_embers_desc: "The remaining fighters survive, waiting for the next upheaval and the next failed state. Children indoctrinated with hatred in al-Hol and thousands of members held in prisons are all potential dangers. How to deal with these embers is a problem the international community has yet to solve."
 ROJX_autonomy: "Democratic Autonomy"
 ROJX_autonomy_desc: "In 2012, Syrian government forces withdrew from the Kurdish areas of the north. The Kurds declared democratic autonomy: a ‘third way’ that belongs neither to the regime nor to the opposition."
 ROJX_social_contract: "Charter of the Social Contract"
 ROJX_social_contract_desc: "In 2014 the Rojava Social Contract is drawn up: three autonomous cantons, multi-ethnic self-rule, gender equality and elected councils. Inspired by Abdullah Öcalan's idea of ‘democratic confederalism’, the charter attempts to build a new kind of society in the Middle East that is neither a nation-state nor a religious regime."
 ROJX_cantons: "The Three Cantons"
 ROJX_cantons_desc: "Jazira, Kobani and Afrin each set up their own administrations, separated from one another by territory held by the Islamic State and the opposition, and can only stay in touch by phone. Each canton has its own council, courts and security forces, and supplies come only through smuggling and illicit crossings from the Turkish border."
 ROJX_councils: "People's Councils"
 ROJX_councils_desc: "People's councils from the street and village up to the district level become the grassroots government of the autonomous region. Residents discuss water, power, bread and schools in their neighborhood communes, and major decisions go through layer after layer of consultation. The system of direct democracy is not efficient, but it gives many people their first taste of public life."
 ROJX_women_cochair: "The Co-Chair System"
 ROJX_women_cochair_desc: "Every institution, from village councils to the autonomous government, has male and female co-chairs; the Women's Protection Units are a symbol on the battlefield and show the world a different Kurdistan. In a region where women were long excluded from public life, it is a quiet revolution."
 ROJX_ecology: "Social Ecology"
 ROJX_ecology_desc: "Promote cooperatives, renewable energy and ecological farming in an attempt to build a society different from the war economy. The wheat fields and olive groves of Hasakah are run by cooperatives, and women's cooperatives make bread and clothing; but under embargo and war, the distance between ideal and reality remains great."
 ROJX_multi_ethnic: "Multi-Ethnic Self-Rule"
 ROJX_multi_ethnic_desc: "Arabs, Assyrians, Turkmen and Circassians have their own places in the councils and the army, and Arabic, Kurdish and Syriac are all official languages. As the region expands to Raqqa and Deir ez-Zor, Arabs become the majority, and multi-ethnic self-rule is no longer a slogan but a necessity for survival."
 ROJX_ypg_ypj: "People's Protection Units"
 ROJX_ypg_ypj_desc: "The People's Protection Units (YPG) and the Women's Protection Units (YPJ) are the autonomous region's only armed forces. When government troops withdrew from the north in 2012 they took over the Kurdish towns; poorly equipped but disciplined and highly motivated, they later became the most effective ground force against the Islamic State."
 ROJX_asayish: "Security Forces (Asayish)"
 ROJX_asayish_desc: "The internal security forces, the Asayish, handle policing, counterterrorism and intelligence, guarding the towns against Islamic State sleeper cells. But human rights groups also accuse them of suppressing dissent and detaining members of rival parties such as the Kurdish National Council."
 ROJX_ypj_swords: "Women's Protection Units"
 ROJX_ypj_swords_desc: "Images of these women fighters appear on magazine covers around the world and strike fear into the extremists, who are said to believe that dying at a woman's hand bars them from paradise. In the battles of Kobani and Raqqa, YPJ commanders and snipers fight at the very front, and many never come back."
 ROJX_kobani: "The Defense of Kobani"
 ROJX_kobani_desc: "In the autumn of 2014 the Islamic State besieges Kobani and takes most of the town. The defenders hold out through the winter thanks to American airdropped weapons, reinforcements from the Iraqi Kurdish Peshmerga and the eyes of the world. The victory at Kobani changes the course of the war."
 ROJX_sdf: "Syrian Democratic Forces (SDF)"
 ROJX_sdf_desc: "In 2015 the Syrian Democratic Forces are formed around the YPG, together with the Shammar tribe's al-Sanadid Forces, Assyrians and Christian militias. The new name makes it easier for the US to support them and for Arabs to join, but Turkey is not fooled."
 ROJX_tal_abyad: "Tal Abyad and Manbij"
 ROJX_tal_abyad_desc: "Take Tal Abyad and Manbij, linking the northern border crossings with the towns west of the Euphrates and cutting the Islamic State's route to the Turkish border. But crossing the Euphrates also crosses the red line Ankara has drawn."
 ROJX_raqqa_campaign: "The Raqqa Campaign"
 ROJX_raqqa_campaign_desc: "Operation Wrath of Euphrates: with coalition air strikes and special forces in support, the SDF takes the Islamic State's ‘capital’ Raqqa after four months of street fighting. Eighty percent of the city is destroyed, but the execution ground in Paradise Square is finally torn down and Raqqa's residents begin coming home."
 ROJX_deir_ezzor: "The Eastern Campaign"
 ROJX_deir_ezzor_desc: "Down the Euphrates as far as Deir ez-Zor and Baghuz: the autonomous region takes control of Syria's largest oil fields, including al-Omar and the Conoco gas field. Oil revenue keeps the autonomous administration running, but it also makes Damascus, Moscow and Tehran covet the land."
 ROJX_us_coalition: "The International Coalition"
 ROJX_us_coalition_desc: "US special forces and coalition air power become the SDF's most important allies, with thousands of American advisers stationed in Hasakah and Kobani. It guarantees the region's survival, but also burdens it with diplomatic friction with Turkey: Ankara sees the YPG as the Syrian branch of the PKK."
 ROJX_russia_channel: "A Channel to Moscow"
 ROJX_russia_channel_desc: "Russia sets up liaison posts in northern Syria and mediates between Turkey and the autonomous region. The region tries to keep room to maneuver between the US and Russia: Washington could withdraw at any moment, and then only Moscow and Damascus might be able to stop a Turkish invasion."
 ROJX_damascus_talks: "Talks with Damascus"
 ROJX_damascus_talks_desc: "The autonomous region and the regime negotiate again and again over local security, oil revenues and autonomy, but never reach agreement. Damascus demands that the SDF merge into the Syrian army and hand over the oil fields, while the region insists on keeping its own forces and institutions; at the Russian base at Hmeimim, round after round of talks ends in failure."
 ROJX_kurdish_ties: "Relations with Iraqi Kurdistan"
 ROJX_kurdish_ties_desc: "Barzani's Kurdistan Regional Government and Rojava are both brothers and rivals, divided over border crossings, parties and armed forces. Erbil is close to Ankara and often closes the Faysh Khabur crossing, while Rojava is closer to Barzani's rivals in the Talabani camp."
 ROJX_turkey_threat: "The Turkish Threat"
 ROJX_turkey_threat_desc: "Ankara sees the autonomous region as an extension of the PKK. Border shelling, drone strikes and cross-border operations keep the region under constant threat: Turkish Bayraktar drones hunt the region's commanders, and the border wall grows higher every day. The region must always be ready for the next invasion."
 ROJX_olive_branch: "The Defense of Afrin"
 ROJX_olive_branch_desc: "In early 2018 the Turkish army and the Syrian National Army launch Operation Olive Branch against Afrin. The US does not intervene and Russia opens the airspace, and after two months the defenders are forced to withdraw and more than a hundred thousand residents are displaced. The region loses a canton but saves the rest."
 ROJX_peace_spring: "Peace Spring"
 ROJX_peace_spring_desc: "After the US withdrawal in 2019, the Turkish offensive pushed along the border. The Kurds had no choice but to ask Damascus for help and let government troops into the border towns."
 ROJX_oil_fields: "The Eastern Oil Fields"
 ROJX_oil_fields_desc: "Revenue from the eastern oil fields and farm taxes is the autonomous administration's largest source of income. The oil goes to crude refineries or is sold through traders to Damascus and Iraqi Kurdistan; the money pays tens of thousands of fighters and civil servants and lets the administration survive under embargo."
 ROJX_wheat: "Wheat and Cotton"
 ROJX_wheat_desc: "Jazira is Syria's breadbasket, and the plains around Hasakah and Qamishli grow most of the country's wheat and cotton. Protect agriculture and you protect people's livelihoods; but Turkey's upstream damming of the Euphrates and the Khabur means drought and water shortages threaten the land."
 ROJX_reconstruction: "Rebuilding Raqqa"
 ROJX_reconstruction_desc: "Clear mines and bodies from the ruins, rebuild hospitals, schools and the water supply, and rebuild the city with the help of its people. The Raqqa Civil Council is made up of local Arab tribal elders and technicians, international aid is pitifully small, and most of the work has to be done by the residents themselves."
 ROJX_camps: "Prison and Displacement Camps"
 ROJX_camps_desc: "Tens of thousands of Islamic State family members and prisoners are held in al-Hol and prisons across the region, more than half of them children. The administration asks other countries to take back their citizens, but almost none will; extremism inside the camps and prison breaks are a time bomb hanging over the whole region."
 ROJX_federal_syria: "A Federal Syria"
 ROJX_federal_syria_desc: "Propose ‘decentralized federalism’: Syria should be a federation of self-governing regions rather than a centralized state run from Damascus. The plan answers Kurdish demands while also trying to win the support of the Druze, the Arab tribes and the opposition."
 ROJX_integration: "Back to Syria"
 ROJX_integration_desc: "Reach an autonomy agreement with Damascus: the region keeps its forces and administration but recognizes Syrian sovereignty, and the Syrian flag flies again over government buildings in Qamishli. It is a realistic choice: without Damascus the region cannot stand up to Turkey, and without autonomy the Kurds will not lay down their arms."
 ROJX_independence: "The Dream of Kurdistan"
 ROJX_independence_desc: "Declare independence: a Kurdish nation-state spanning Syria, Iraq, Turkey and Iran has been the dream of generations. The Treaty of Sèvres in 1920 promised the Kurds self-determination, only to be overturned three years later. This time the Kurds will no longer wait for the great powers' favor, but none of the four neighbors will stand by."
 SYR_dec_pc_woo_baath: "Win Over Independents (to the Ba'ath Bloc)"
 SYR_dec_pc_woo_baath_desc: "The Presidential Palace and the intelligence services step in to persuade 6 independent deputies to join the Ba'ath bloc: businessmen, tribal sheikhs (shuyukh) and local notables, none of whom wants to be the regime's enemy."
 SYR_dec_pc_woo_npf: "Win Over Independents (to the NPF)"
 SYR_dec_pc_woo_npf_desc: "Persuade 4 independent deputies to join the allied parties of the National Progressive Front, the most obedient ‘flower vases’ in the regime's parliament."
 SYR_dec_pc_lift_emergency: "Repeal the Emergency Law"
 SYR_dec_pc_lift_emergency_desc: "The emergency law in force since 1963 has been the legal foundation of the regime's rule. In April 2011, under the pressure of mass protests, the President signed a decree repealing it."
 SYR_dec_pc_party_law: "Enact the Political Parties Law"
 SYR_dec_pc_party_law_desc: "In August 2011, the People's Council passed a Political Parties Law: new parties may be formed within the law, but organizations based on religion, tribe or region are banned."
 SYR_dec_pc_constitution: "The 2012 Constitution"
 SYR_dec_pc_constitution_desc: "Article 8 of the constitution, which made the Ba'ath the leading party of state and society, is abolished. The presidential term is seven years, renewable once, and a multi-party system is established. The referendum is held in February 2012. Amendments require a two-thirds majority of the People's Council."
 SYR_dec_pc_counter_terror: "The Counterterrorism Law"
 SYR_dec_pc_counter_terror_desc: "In 2012, parliament passed a Counterterrorism Law and set up special courts, bringing the prosecution and trial of the opposition under a counterterrorism framework. The regime gained more power, and drew sharper international condemnation."
 SYR_dec_pc_law10: "Law No. 10 (Property Law)"
 SYR_dec_pc_law10_desc: "Law No. 10 of 2018 allows reconstruction zones to be designated; owners must submit proof of title within a deadline or the land reverts to the state. Critics say it strips millions of displaced people of the right to return home."
 SYR_dec_pc_dissolve: "Dissolve the People's Council and Call Early Elections"
 SYR_dec_pc_dissolve_desc: "The constitution allows the President to dissolve parliament. When new faces are needed, or a reshuffled parliament, the Presidential Palace does just that."
 SYR_dec_pc_eid_amnesty: "Eid Amnesty"
 SYR_dec_pc_eid_amnesty_desc: "Issuing an amnesty on religious holidays is a Syrian tradition: some prisoners are released and sentences reduced, sending parliament and society a signal of easing."
 SYR_people_council_category: "People's Council"
 SYR_people_council_modifier: "People's Council"
 SYR_people_council_modifier_desc: "The Syrian People's Council's effect on political power and stability: favorable when support in parliament is above half, discounted under the regime as a ‘rubber stamp’."
 SYR_people_council_category_desc: "§LThe Syrian People's Council has 250 seats and serves four-year terms. The constitution gives it the power to legislate, approve the budget and treaties, and consent to presidential decrees; the President can dissolve it.§!"
