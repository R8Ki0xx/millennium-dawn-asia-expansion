 TAI_integrate_ccp_reformers_tt: "§YWang Yang§! and §YChen Liangyu§! join the §YKuomintang§!, and §YHu Jintao§! joins the §YRCCK§!:\nthey become leadership candidates for their parties and are added to the list of candidates for Premier of the Five Yuan."
 roc_return.150.t: "The Return of the CCP Reformers"
 roc_return.150.d: "Nanjing, the Presidential Office. Three former senior CCP officials shake hands with the President of the Republic of China in front of the press. Wang Yang and Chen Liangyu announce that they are joining the Kuomintang, while Hu Jintao accepts the RCCK's invitation to sit on its Central Standing Committee.\n\n‘This is not surrender,’ Wang Yang tells reporters. ‘This is putting China on the right track.’ The radio stations of the CCP remnants denounce them as ‘traitors’."
 roc_return.150.a: "The world belongs to all. Peaceful unification."
