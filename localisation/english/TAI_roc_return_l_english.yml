 TAI_gov.7.t: "Nominate the President of the Examination Yuan"
 TAI_gov.7.d: "The current President of the Examination Yuan is §Y[TAI_gov_exam_name]§!. Under the constitution the President may nominate a successor, to be appointed with the consent of the Control Yuan or the Legislative Yuan. The Examination Yuan oversees the recruitment and appointment of civil servants, a distinctive branch of the five-power constitution, and its head's philosophy will shape the whole civil service."
 TAI_gov.7.keep: "Keep the current President of the Examination Yuan."
 TAI_gov.8.o_hou_yu_ih: "Hou Yu-ih (Kuomintang): stability +4%"
