 TAI_integrate_ccp_reformers: "整合中共改革派"
 TAI_integrate_ccp_reformers_desc: "中共下台之后，党内不少开明派官员并未随残余势力退走。广东的汪洋、上海的陈良宇愿意加入中国国民党，前中共中央总书记胡锦涛则接受民革的邀请。吸纳他们，既能安定大陆的官僚体系，也能分化中共残余。"
