 TAI_dbf_cure_carpetbag_desc: "Set up a ‘Takeover Audit Commission’ to prosecute embezzlement and seizures by takeover officials and return stolen public and private property.\n\n§YTakeover Corruption§! currently at severity §R[?TAI_dbf_carpetbag_sev|0]§!/100, recovering §G[?TAI_dbf_carpetbag_rate|1]§! per month."
 TAI_dbf_cure_carpetbag_tt: "Severity of the national spirit §YTakeover Corruption§! §G−15§!"
 TAI_dbf_carpetbag_desc: "Current severity: §R[?TAI_dbf_carpetbag_sev|0]§!/100 (its effects scale smoothly with severity and vanish at 0)\nRecovers §G[?TAI_dbf_carpetbag_rate|1]§! per month (base 0.5; +0.5 each if stability is above 60% and if the ruling coalition has a majority in the Legislative Yuan).\nIt can also be weakened by focuses, events and the ‘Putting the Country in Order’ decisions."
 TAI_dbf_carpetbag_reduce_tt: "Severity of the national spirit §YTakeover Corruption§! §G−33§! (removed at 0)"
 TAI_dbf_category: "Putting the Country in Order"
 TAI_dbf_category_desc: "The many ills left over from the early days of the Restoration (or of the new state) take time and good government to undo. Each national spirit's severity falls naturally every month, faster under conditions such as high stability or a majority in the Legislative Yuan. We can also spend political power and money to tackle them directly.\n\n§LOnly the ones still present are shown:§!\n - §YBlack Gold Politics§!: [?TAI_dbf_black_gold_sev|0]/100\n - §YDiplomatic Isolation§!: [?TAI_dbf_isolation_sev|0]/100\n - §YPains of the Switch to Volunteers§!: [?TAI_dbf_conscription_sev|0]/100\n - §YCross-Strait Military Imbalance§!: [?TAI_dbf_imbalance_sev|0]/100\n - §YHearts Not Yet Won§!: [?TAI_dbf_hearts_sev|0]/100\n - §YPLA Remnants§!: [?TAI_dbf_pla_remnants_sev|0]/100\n - §YPains of Economic Transition§!: [?TAI_dbf_transition_sev|0]/100\n - §YRegional Separatism§!: [?TAI_dbf_warlordism_sev|0]/100\n - §YTakeover Corruption§!: [?TAI_dbf_carpetbag_sev|0]/100"
 TAI_dbf_mission_pla: "Clear Out the PLA Remnants in Three Years"
 TAI_dbf_mission_pla_desc: "The Ministry of National Defense has promised to finish reorganizing and clearing out the former PLA within three years. If it fails, public confidence in the government will suffer."
 TAI_dbf_mission_black_gold: "Clean Up Black Gold in Two Years"
 TAI_dbf_mission_black_gold_desc: "The Premier has promised the Legislative Yuan to ‘drive black gold out of politics within two years’."
 roc_md.6.t: "The Hainan Island Collision"
 roc_md.6.d: "On 1 April 2001, a US Navy EP-3 reconnaissance plane collided over the South China Sea with a National Army fighter sent to identify it. The American plane made an emergency landing at Lingshui airfield on Hainan Island, and our pilot bailed out and was rescued. Washington demands the immediate return of the crew and the aircraft; nationalists at home argue that even an ally cannot do as it pleases in China's airspace."
 roc_md.6.a: "Friendship among allies: send the crew home at once."
 roc_md.6.b: "Sovereignty comes first: demand an American apology."
 roc_md.1.t: "Atypical Pneumonia"
 roc_md.1.d: "An atypical pneumonia of unknown cause is spreading in Guangdong and has reached the major cities with the Spring Festival travel crowds. The Department of Health of the Executive Yuan must decide how to respond to this sudden epidemic."
 roc_md.1.a: "Be open about the outbreak and work with the WHO."
 roc_md.1.b: "Suppress the news to avoid panic."
 roc_md.2.t: "The Wenchuan Earthquake"
 roc_md.2.d: "A magnitude 8.0 earthquake has struck Wenchuan in Sichuan, killing tens of thousands of our compatriots. The National Army and volunteers from across the country rushed to the disaster area overnight, and Taiwan's Tzu Chi and Red Cross have sent rescue teams."
 roc_md.2.a: "The National Army throws everything into the relief effort!"
 roc_md.2.b: "Let the local government lead the relief effort."
 roc_md.3.t: "The Beijing Olympics"
 roc_md.3.d: "The right to host the 2008 Olympics, won in the CCP era, has passed to the government of the Republic of China. It is the first time the restored China faces the world with a new face."
 roc_md.3.a: "Let the world see the new China!"
 roc_md.3.b: "Keep it simple."
 roc_md.51.t: "National Census"
 roc_md.51.d: "The Directorate-General of Budget, Accounting and Statistics has completed the first national census since the Restoration: the Republic of China has more than 1.3 billion people, nearly half of whom still live in the countryside."
 roc_md.51.a: "Let the numbers guide our policy."
 roc_return.171.a: "A grand military parade!"
 roc_return.171.b: "A modest celebration. Save the money for people's needs."
 roc_return.171.t: "Double Tenth National Day"
 roc_return.171.d: "On the first Double Tenth since the Restoration, flags fly all along Zhongshan East Road in Nanjing. The Ministry of National Defense proposes a grand military parade to show off the National Army, while some legislators argue that extravagance is out of place when people are struggling."
 roc_return.172.a: "‘The revolution is not yet complete; comrades, keep up the fight.’"
 roc_return.172.t: "Visiting the Sun Yat-sen Mausoleum"
 roc_return.172.d: "The President leads the heads of the Five Yuan up Purple Mountain to lay flowers before the Founding Father's tomb, reporting to him that his last wish, the unification of China, has finally come true."
 roc_return.173.a: "Keep the capital in Nanjing, true to the constitution."
 roc_return.173.b: "Move the capital back to Beijing and build up the north."
 roc_return.173.t: "The Capital Question"
 roc_return.173.d: "Nanjing is the capital under the constitution, while Beijing was an imperial capital for six hundred years and is the political center of the north. The Legislative Yuan is locked in a bitter fight over where the capital should be."
 roc_return.174.a: "Return the treasures to their rightful home in the north."
 roc_return.174.b: "Two Palace Museums, each keeping its own collection."
 roc_return.174.t: "Returning the Palace Museum Treasures"
 roc_return.174.d: "Should the Palace Museum treasures that crossed the Strait with the Nationalist Government in 1948 go back to the Forbidden City in Beijing? Scholars in Taipei and the heritage world in Beijing each have their say."
 roc_return.175.a: "Land to the tiller: privatize the land."
 roc_return.175.b: "Keep collective ownership and issue only contract certificates."
 roc_return.175.t: "Confirming Land Rights"
 roc_return.175.d: "In the CCP era, rural land was nominally owned by ‘the collective’. The Ministry of the Interior proposes a land rights plan that would formally register ownership in the farmers' own names."
 roc_return.176.a: "Privatize fast and let the market decide."
 roc_return.176.b: "Reform gradually and look after the workers first."
 roc_return.176.t: "The Privatization Wave"
 roc_return.176.d: "Tens of thousands of state enterprises are waiting to be restructured. Conglomerates and Taiwanese businessmen are eager to move in, while workers fear for their jobs."
 roc_return.177.a: "Set up a veterans' commission to resettle them properly."
 roc_return.177.b: "Pay severance and be done with it."
 roc_return.177.t: "Resettling Demobilized Soldiers"
 roc_return.177.d: "Millions of former PLA officers and soldiers are waiting to be resettled. If they find no way forward, they will become recruits for the holdouts in the mountains."
 roc_return.178.a: "Restore traditional characters."
 roc_return.178.b: "Use both: read traditional, write simplified."
 roc_return.178.t: "The Script Debate"
 roc_return.178.d: "The Ministry of Education is considering bringing back traditional characters in mainland schools. Supporters say this restores Chinese culture; opponents say it would make over a billion people ‘illiterate’ overnight."
 roc_return.179.a: "Full freedom of the press."
 roc_return.179.b: "Open up gradually, keeping publishing licenses for now."
 roc_return.179.t: "The Press Ban Is Lifted"
 roc_return.179.d: "The Government Information Office announces that newspaper registration is open in every mainland province. Overnight, hundreds of new papers appear on the streets."
 roc_return.180.a: "Rehabilitate June Fourth; the government formally apologizes."
 roc_return.180.b: "Leave it for now, to avoid tearing society apart."
 roc_return.180.t: "Rehabilitating June Fourth"
 roc_return.180.d: "The Tiananmen Mothers have once again petitioned the Presidential Office, asking the government to rehabilitate the victims of 1989, publish the truth and hold those responsible to account."
 roc_return.181.a: "Keep it as a historic site, open to visitors."
 roc_return.181.b: "Demolish it and rebury the body in Shaoshan, Hunan."
 roc_return.181.t: "The Fate of the Mao Mausoleum"
 roc_return.181.d: "What should become of Chairman Mao's Memorial Hall on Tiananmen Square? Supporters of the Communist Party of China vow to protect it, while many victims' families demand its demolition."
 roc_return.182.a: "Honor the constitution and allow religious freedom."
 roc_return.182.b: "Open up within limits; religious groups must register."
 roc_return.182.t: "Religious Freedom"
 roc_return.182.d: "Underground Catholic churches, Protestant house churches, and Tibetan Buddhist and Muslim believers are all waiting for the government to deliver the freedom of belief the constitution guarantees."
 roc_return.183.a: "Reopen Whampoa!"
 roc_return.183.t: "Reopening the Whampoa Military Academy"
 roc_return.183.d: "The Ministry of National Defense proposes reopening the Army Officer School on its original Whampoa site on Changzhou Island in Guangzhou, bringing the motto ‘Fraternity, Affection, Sincerity, Devotion’ back to where it began."
 roc_return.184.a: "Encourage Taiwanese firms to go west."
 roc_return.184.b: "Set limits to protect Taiwan's industry."
 roc_return.184.t: "Taiwanese Business Goes West"
 roc_return.184.d: "After the Restoration, Taiwanese entrepreneurs are rushing to build factories on the mainland. The Taiwan Provincial Assembly fears that Taiwan's industry will be hollowed out, while the mainland provinces welcome them with open arms."
 TAI_us_friendship: "Friendship among Allies"
 HKG_ROC.conservatism: "£TAI_conservatism Kuomintang Hong Kong General Branch"
 EA_labor_market_modifier_desc: "Much of the rural population, the hidden underemployed and migrants held back by household registration never really enter the urban labor market. This modifier applies only to mainland China and Taiwan and recalibrates itself weekly from the unemployment rate: above §Y30%§! unemployment, part of the surplus labor is taken out of the count (aiming for about 28%); below §Y22%§!, it is gradually returned. At the same time, the population absorbed by subsistence farming rises in proportion, so farm output is unaffected.\nCurrent labor force adjustment: §Y[?EA_hidden_labor_var|%1]§!"
 TAI_sov_new_neighbours: "New Sino-Russian Neighborliness"
 TAI_sov_new_neighbours_desc: "The new Chinese government declares that it inherits every obligation of the Sino-Russian Treaty of Good-Neighborliness and Friendly Cooperation. Nanjing and Moscow both know that each is the other's longest neighbor, and neither can move away."
 TAI_sov_border_demarcation: "Final Border Demarcation"
 TAI_sov_border_demarcation_desc: "The government of the Republic of China recognizes the border drawn by the 2004 Supplementary Agreement and formally gives up its claim to Outer Manchuria, in exchange for Russian concessions on Bolshoy Ussuriysky Island and navigation on the border rivers."
 TAI_sov_siberian_pipeline: "Siberian Oil and Gas Pipelines"
 TAI_sov_siberian_pipeline_desc: "The Power of Siberia pipeline extends south to Daqing, pouring Russian oil and gas into the industrial base of the Northeast."
 TAI_sov_yuan_ruble: "Yuan-Ruble Settlement"
 TAI_sov_yuan_ruble_desc: "The two central banks sign a currency swap agreement, and bilateral trade is settled directly in yuan and rubles, bypassing the dollar."
 TAI_sov_far_east_development: "Far East Development Cooperation"
 TAI_sov_far_east_development_desc: "Capital and labor from the Northeast, land and resources from the Russian Far East: the two countries build cross-border economic cooperation zones together."
 TAI_sov_joint_exercises: "Joint Exercises"
 TAI_sov_joint_exercises_desc: "The National Army and the Russian Army hold a joint exercise code-named ‘Peace Mission’ on the grasslands of Inner Mongolia. No one in the Cold War could have imagined it."
 TAI_sov_northern_sea_route: "Northern Sea Route"
 TAI_sov_northern_sea_route_desc: "China and Russia develop the Northern Sea Route together, cutting the voyage from Shanghai to Rotterdam by a third."
 TAI_sov_space_cooperation: "Space Cooperation"
 TAI_sov_space_cooperation_desc: "The two countries build a lunar research station together and jointly develop a heavy-lift rocket."
 TAI_sov_strategic_partnership: "Comprehensive Strategic Partnership"
 TAI_sov_strategic_partnership_desc: "‘Sino-Russian relations are at their best in history.’ Now those words come from a Kuomintang president."
 TAI_sov_aigun_revisited: "Revisit the Treaty of Aigun"
 TAI_sov_aigun_revisited_desc: "The Republic of China never recognized the territory ceded under the Treaty of Aigun and the Convention of Peking. The Legislative Yuan has passed a resolution calling for the Sino-Russian border to be reviewed."
 TAI_sov_outer_manchuria_claim: "Claim Outer Manchuria"
 TAI_sov_outer_manchuria_claim_desc: "Vladivostok was once Haishenwai, and Khabarovsk and Blagoveshchensk were once Chinese land. The begonia leaf in our textbooks must get back the corner that was bitten off."
 TAI_sov_tannu_uriankhai: "Claim Tannu Uriankhai"
 TAI_sov_tannu_uriankhai_desc: "Tannu Uriankhai was annexed by the Soviet Union in 1944, which the government of the Republic of China never recognized."
 TAI_sov_northern_buildup: "Northern Frontier Buildup"
 TAI_sov_northern_buildup_desc: "The National Army sets up new military districts in Heilongjiang and Jilin and builds military roads to the border."
 TAI_sov_recover_lost_lands: "Recover the Lost Lands"
 TAI_sov_recover_lost_lands_desc: "A hundred and fifty years of humiliation will be settled by our generation."
 TAI_sov_partner: "New Sino-Russian Neighborliness"
 TAI_sov_strategic: "Comprehensive Strategic Cooperation"
 TAI_sov_revanchism: "Territorial Claims of the Republic of China"
 TAI_joint_sov_root_tt: "After the Restoration: the Republic of China has completed the focus ‘New China Diplomacy’ and is not at war with Russia"
 TAI_joint_roc_or_sov_tt: "Started by the Republic of China or Russia (completed by both together)"
 TAI_sov_space_tt: "Sino-Russian Space Cooperation"
 TAI_fr_xj_fund: "Southern Xinjiang Development Fund"
 TAI_fr_xj_fund_desc: "Set up development zones in Kashgar and Hotan and build waterworks and roads, so the farmers of southern Xinjiang share in the economic growth after the Restoration.\n\n§YXinjiang§! integration progress: §G[?TAI_fr_xj|0]§!/100 (this decision §G+6§!)"
 TAI_fr_xj_talks: "Uyghur Autonomy Consultative Conference"
 TAI_fr_xj_talks_desc: "Invite Uyghur religious leaders, intellectuals and exile groups home to negotiate a Xinjiang Autonomy Act.\n\n§YXinjiang§! integration progress: §G[?TAI_fr_xj|0]§!/100 (this decision §G+8§!)"
 TAI_fr_xj_corps: "Reform the Production and Construction Corps"
 TAI_fr_xj_corps_desc: "Demilitarize the Xinjiang Production and Construction Corps and turn it into local state enterprises, gradually returning Corps land to local farmers and herders.\n\n§YXinjiang§! integration progress: §G[?TAI_fr_xj|0]§!/100 (this decision §G+5§!)"
 TAI_fr_tb_dialogue: "Dialogue with the Dalai Lama"
 TAI_fr_tb_dialogue_desc: "The Presidential Office sends an envoy to Dharamsala to discuss the conditions for the Dalai Lama's return to Lhasa and the concrete arrangements for ‘a high degree of autonomy’.\n\n§YTibet§! integration progress: §G[?TAI_fr_tb|0]§!/100 (this decision §G+10§!)"
 TAI_fr_tb_religion: "Religious Freedom in Tibetan Areas"
 TAI_fr_tb_religion_desc: "Abolish the CCP-era ‘patriotic education’ in monasteries and the caps on the number of monks and nuns, and restore the monasteries' self-management.\n\n§YTibet§! integration progress: §G[?TAI_fr_tb|0]§!/100 (this decision §G+6§!)"
 TAI_fr_tb_railway: "Qinghai-Tibet Development"
 TAI_fr_tb_railway_desc: "Extend the Qinghai-Tibet Railway and the Sichuan-Tibet Highway, while setting up an ecological protection fund for Tibetan areas.\n\n§YTibet§! integration progress: §G[?TAI_fr_tb|0]§!/100 (this decision §G+5§!)"
 TAI_fr_im_league: "Restore the League and Banner System"
 TAI_fr_im_league_desc: "Keep the provinces and counties, but restore Mongol self-government through leagues and banners, with each banner electing a jasag to sit in the local assemblies.\n\n§YInner Mongolia§! integration progress: §G[?TAI_fr_im|0]§!/100 (this decision §G+8§!)"
 TAI_fr_im_grassland: "Grassland Ecological Compensation"
 TAI_fr_im_grassland_desc: "Pay compensation to herders who return grazing land to grass, halting the desertification of the steppe.\n\n§YInner Mongolia§! integration progress: §G[?TAI_fr_im|0]§!/100 (this decision §G+6§!)"
 TAI_fr_im_hulunbuir: "Develop Hulunbuir"
 TAI_fr_im_hulunbuir_desc: "Develop the border crossings and mines of Manzhouli and Hulunbuir to bring jobs to young Mongols.\n\n§YInner Mongolia§! integration progress: §G[?TAI_fr_im|0]§!/100 (this decision §G+5§!)"
 TAI_fr_xj_add_tt: "§YXinjiang§! integration progress §G+[?fr_d|0]§! (currently [?TAI_fr_xj|0]/100)"
 TAI_fr_tb_add_tt: "§YTibet§! integration progress §G+[?fr_d|0]§! (currently [?TAI_fr_tb|0]/100)"
 TAI_fr_im_add_tt: "§YInner Mongolia§! integration progress §G+[?fr_d|0]§! (currently [?TAI_fr_im|0]/100)"
 roc_return.161.t: "Xinjiang Integrated"
 roc_return.161.d: "A year after the Xinjiang Autonomy Act took effect, the regional assembly of Uyghur, Kazakh and Han representatives is working smoothly. North and south of the Tian Shan, a long-absent calm has finally arrived."
 roc_return.161.a: "Five races under one union; the world belongs to all."
 roc_return.164.t: "Unrest in Southern Xinjiang"
 roc_return.164.d: "A dispute over mosque repairs in Kashgar has turned into street clashes, with angry crowds chanting slogans demanding ‘real autonomy’. The wounds of the CCP era have not yet healed."
 roc_return.164.a: "Send in the police to restore order."
 roc_return.164.b: "Send a negotiating delegation to Kashgar."
 roc_return.162.t: "Reconciliation on the Roof of the World"
 roc_return.162.d: "The Dalai Lama has presided over his first ceremony at the Potala Palace since his return. The arrangements for Tibet's high autonomy are in place, and the snowy plateau is an inseparable part of the Republic of China."
 roc_return.162.a: "Five races under one union; the world belongs to all."
 roc_return.165.t: "Protests in Lhasa"
 roc_return.165.d: "Hundreds of monks are holding a sit-in in front of the Jokhang Temple, demanding that the government keep its promises to the Dalai Lama. Monasteries across the Tibetan areas are watching Nanjing's response closely."
 roc_return.165.a: "Disperse them lawfully and keep order."
 roc_return.165.b: "Meet the petitioners and promise faster negotiations."
 roc_return.163.t: "A New Life for the Steppe"
 roc_return.163.d: "League-and-banner self-government works side by side with the provinces and counties, and the grasslands are slowly recovering. Mongol and Han compatriots in Inner Mongolia are building this vast northern frontier together."
 roc_return.163.a: "Five races under one union; the world belongs to all."
 roc_return.166.t: "Protests on the Steppe"
 roc_return.166.d: "A herder was killed trying to stop mining trucks from driving over his pasture, and Mongol students in Xilingol have taken to the streets."
 roc_return.166.a: "Impose martial law and punish the troublemakers severely."
 roc_return.166.b: "Halt work, investigate and compensate the herders."
 TAI_frontier_category: "Five Races Under One Union · Frontier Integration"
 TAI_frontier_category_desc: "‘Five Races Under One Union’ is a founding principle of the Republic of China. Deep grievances built up in Xinjiang, Tibet and Inner Mongolia under the CCP, and we must win over their peoples with autonomy, development and religious freedom.\n\nIntegration progress by region:\n - §YXinjiang§!: §G[?TAI_fr_xj|0]§!/100\n - §YTibet§!: §G[?TAI_fr_tb|0]§!/100\n - §YInner Mongolia§!: §G[?TAI_fr_im|0]§!/100\n\n§LThe lower the progress, the higher the local garrison needs, resistance and factory losses. While stability is above 50%, progress rises by 0.3 each month; integration is complete at 100.§!"
 TAI_frontier_xj_modifier: "Xinjiang: Integration Incomplete"
 TAI_frontier_tb_modifier: "Tibet: Integration Incomplete"
 TAI_frontier_im_modifier: "Inner Mongolia: Integration Incomplete"
 ### v3.20 韩国、菲律宾与越南的国策
 TAI_ext_kor_nuclear_alarm: "Concern over Korean Nuclear Arms"
 TAI_ext_kor_roc_ties: "Korea-ROC Friendship"
 TAI_ext_kor_thaad: "Anger over THAAD Deployment"
 TAI_ext_kor_umbrella: "Nuclear Sharing Ally"
 KORX_demographic_policy: "Population Policy"
 KORX_demographic_policy_desc: "The Population Policy Committee has coordinated birth subsidies, public childcare and housing supply, and the fall in the birth rate has started to slow."
 KORX_independent_deterrent_idea: "Independent Nuclear Deterrent"
 KORX_independent_deterrent_idea_desc: "South Korea has left the Non-Proliferation Treaty to build its own nuclear deterrent. National morale is high, but the international pressure is immense."
 KORX_nuclear_sharing_idea: "Nuclear Sharing"
 KORX_nuclear_sharing_idea_desc: "The United States has deployed tactical nuclear weapons in South Korea, the two allies plan nuclear operations together, and their joint defense is closer than ever."
 KORX_k_defense_idea: "K-Defense Export System"
 KORX_k_defense_idea_desc: "From the K9 self-propelled howitzer to the FA-50 light fighter, Korean defense exports now have a steady order book and supply chain."
 KORX_new_republic_idea: "The Seventh Republic"
 KORX_new_republic_idea_desc: "A new constitution sets new rules for checks and balances and presidential terms. The political system enters a new stage."
 KORX_green_shipbuilding_idea: "Green Shipbuilding"
 KORX_green_shipbuilding_idea_desc: "Orders for LNG carriers, ammonia-powered ships and smart ships have filled Korean shipyards for years to come."
 KORX_hallyu_idea: "A Nation Built on the Korean Wave"
 KORX_hallyu_idea_desc: "Korean Wave content and tourism have become new engines of growth, and soft power brings in trade and tourist income."
 KORX_tb_latency: "Nuclear Fuel Cycle Technology"
 KORX_tb_peaceful: "Civilian Nuclear Technology"
 KORX_tb_hyunmoo: "Hyunmoo Missile Technology"
 KORX_tb_kamd: "Air Defense Missile Technology"
 KORX_tb_k9k2: "Army Export Equipment Technology"
 KORX_tb_fa50: "Fighter Export Technology"
 KORX_tb_apr: "Nuclear Power Plant Technology"
 KORX_tb_smr: "Small Modular Reactor Technology"
 KORX_tb_battery: "Battery and EV Technology"
 KORX_tb_bio: "Biopharmaceutical Technology"
 KORX_tb_wind: "New Energy Technology"
 KORX_tb_space: "Space Launch Technology"
 KORX_tb_semi_alliance: "Semiconductor and Display Technology"
 roc_asia.1.a: "The referendum passes, and the new constitution takes effect."
 roc_asia.1.b: "The referendum passed by a narrow margin, but the opposition camp refuses to accept it."
 roc_asia.1.t: "Result of the Constitutional Referendum"
 roc_asia.1.d: "The constitutional amendment was put to a national referendum, with turnout above sixty percent. Whatever the result, this is a landmark day in South Korea's constitutional history."
 TAI_ext_phi_us_ally: "Strengthened US-Philippine Alliance"
 TAI_ext_phi_china_pivot: "Philippine Friendliness Toward China"
 TAI_ext_phi_us_cool: "Philippine Estrangement"
 PHIP_clean_government_idea: "Clean Government"
 PHIP_clean_government_idea_desc: "‘No corruption, no poverty.’ Transparency and accountability in government have improved."
 PHIP_strongman_idea: "Strongman Rule"
 PHIP_strongman_idea_desc: "A forceful president pushes law and order and infrastructure with an iron hand. Critics say he is eroding democratic institutions."
 PHIP_coalition_idea: "Grand Coalition"
 PHIP_coalition_idea_desc: "The traditional political dynasties and big business have reached an understanding, and politics is unusually calm."
 PHIP_social_democracy_idea: "The Progressive Coalition's Social Contract"
 PHIP_social_democracy_idea_desc: "Land reform, workers' rights and universal health care are at the heart of the new government's agenda."
 PHIP_national_consensus_idea: "A New National Consensus"
 PHIP_national_consensus_idea_desc: "The parties have agreed on the basic rules of politics, and the country has finally emerged from decades of political turmoil."
 PHIP_npa_low_tt: "The strength of the New People's Army has fallen below §Y30§!"
 roc_asia.20.a: "Keep pushing reform."
 roc_asia.20.t: "A Reforming Term"
 roc_asia.20.d: "The reformers' first term is over. Voters are very satisfied with clean government, but many promises remain unkept."
 roc_asia.21.a: "History will be the judge."
 roc_asia.21.t: "The End of the Strongman Era"
 roc_asia.21.d: "The strongman president has left Malacañang at the end of his term. His successor promises ‘continuity of policy’."
 roc_asia.22.a: "Stability above all."
 roc_asia.22.t: "A Smooth Term"
 roc_asia.22.d: "The coalition government's first term has ended smoothly, with the old family dynasties largely unchanged."
 roc_asia.23.a: "Let reform go deeper."
 roc_asia.23.t: "The Progressive Coalition's First Term"
 roc_asia.23.d: "The Progressive Coalition has passed its main legislation for the term. Critics say reform is too slow; supporters say the direction has changed."
 roc_asia.24.a: "Open a new chapter of nation-building."
 roc_asia.24.t: "The Political Line Concludes"
 roc_asia.24.d: "Philippine politics has finally settled down. The nation turns its attention to the longer-term questions of the economy, the military and diplomacy."
 TAI_ext_vie_us_partner: "Vietnam-US Comprehensive Partnership"
 TAI_ext_vie_china_coop: "Vietnam-China Comprehensive Strategic Cooperation"
 TAI_ext_vie_russia: "Traditional Vietnam-Russia Friendship"
 TAI_ext_vie_india: "Vietnam-India Strategic Cooperation"
 TAI_ext_vie_japan: "Vietnam-Japan Extensive Strategic Partnership"
 TAI_ext_vie_korea: "Vietnam-Korea Economic Ties"
 TAI_ext_vie_scs_tension: "Militarization of South China Sea Reefs"
 TAI_ext_vie_roc: "Pragmatic Vietnam-ROC Relations"
 VIEX_doi_moi_2_idea: "Đổi Mới 2.0"
 VIEX_doi_moi_2_idea_desc: "A second round of renovation built on market reform, restructuring of state enterprises and a more open investment climate."
 VIEX_party_discipline_idea: "Party Rectification"
 VIEX_party_discipline_idea_desc: "Internal rectification and ideological education have tightened discipline again, but society has become less open."
 VIEX_multiparty_idea: "Multi-Party Democracy"
 VIEX_multiparty_idea_desc: "Independent candidates, independent media and multi-party competition bring more energy, and more quarrels."
 VIEX_red_junta_idea: "Military Rule"
 VIEX_red_junta_idea_desc: "The People's Army has taken over the country, and discipline and efficiency have replaced debate."
 VIEX_blazing_furnace_idea: "The Blazing Furnace"
 VIEX_blazing_furnace_idea_desc: "An anti-corruption storm with ‘no forbidden zones and no exceptions’ has brought down a slate of senior officials and changed the culture of officialdom."
 VIEX_fdi_hub_idea: "Global Manufacturing Hub"
 VIEX_fdi_hub_idea_desc: "Samsung, Intel and a host of other foreign-owned factories have made Vietnam a key link in global supply chains."
 VIEX_mekong_granary_idea: "Mekong Granary"
 VIEX_mekong_granary_idea_desc: "Rice, seafood and tropical crops provide steady farm exports and underpin stability in the countryside."
 VIEX_digital_vietnam_idea: "Digital Vietnam"
 VIEX_digital_vietnam_idea_desc: "Homegrown tech firms and a huge young population online are driving fast growth in the digital economy."
 VIEX_north_south_artery_idea: "North-South Artery"
 VIEX_north_south_artery_idea_desc: "Expressways, high-speed rail and deep-water ports tie the two great economic centers of north and south closely together."
 VIEX_total_defense_idea: "All-People National Defense"
 VIEX_total_defense_idea_desc: "An all-people defense system under the ‘Four Nos’ policy, in which the standing army, reserves and militia work together."
 VIEX_maritime_militia_idea: "Maritime Militia"
 VIEX_maritime_militia_idea_desc: "A joint system of fishermen and the coast guard that protects fishing and patrols the sea, on the front line of defending our rights in the South China Sea."
 VIEX_bamboo_diplomacy_idea: "Bamboo Diplomacy"
 VIEX_bamboo_diplomacy_idea_desc: "‘Strong roots, a sturdy trunk and flexible branches’: friendly with every great power, dependent on none."
 VIEX_asian_tiger_idea: "A New Asian Tiger"
 VIEX_asian_tiger_idea_desc: "Vietnam has become one of the fastest-growing economies in Southeast Asia."
 VIEX_climate_resilience_idea: "Climate Resilience"
 VIEX_climate_resilience_idea_desc: "Facing rising seas and salinization in the Mekong Delta, Vietnam has built a nationwide climate adaptation system."
 VIEX_tb_semi: "Semiconductor Packaging and Testing Technology"
 VIEX_tb_electronics: "Electronics Manufacturing Technology"
 VIEX_tb_renewable: "New Energy Technology"
 VIEX_tb_nuclear: "Nuclear Power Plant Technology"
 VIEX_tb_internet: "Digital Economy Technology"
 VIEX_tb_5g: "Telecom and Software Technology"
 VIEX_tb_mountain: "Mountain Infantry Technology"
 VIEX_tb_kilo: "Submarine Technology"
 VIEX_tb_frigate: "Frigate Technology"
 VIEX_tb_asm: "Anti-Ship Missile Technology"
 VIEX_tb_su30: "Fighter Technology"
 VIEX_tb_s300: "Air Defense System Technology"
 VIEX_tb_cyber: "Cyber Warfare Technology"
 VIEX_tb_us_arms: "US-Made Equipment Technology"
 VIEX_tb_ru_arms: "Russian-Made Equipment Technology"
 VIEX_tb_water: "Water Management Technology"
 VIEX_tb_edu: "Education and Skills Training"
 VIEX_tb_startup: "Startup and Innovation Technology"
 roc_asia.40.a: "Let reform go deeper."
 roc_asia.40.b: "Slow down to contain the risks."
 roc_asia.40.t: "Party Congress: Đổi Mới 2.0"
 roc_asia.40.d: "The Party Congress has adopted the program for a second round of renovation. A batch of state enterprises has been turned into joint-stock companies, and a group of private firms has moved to the heart of national strategy."
 roc_asia.41.a: "Discipline is the guarantee of victory."
 roc_asia.41.b: "Don't let discipline smother vitality."
 roc_asia.41.t: "The Party's Leadership Strengthened Across the Board"
 roc_asia.41.d: "Party rectification has reached its peak. Party membership and the number of party branches are at record highs, and social order has never been more stable."
 roc_asia.42.a: "Respect the result of the election."
 roc_asia.42.b: "Worry about political fragmentation."
 roc_asia.42.t: "Vietnam's First Multi-Party Election"
 roc_asia.42.d: "Candidates from several parties and independents stood for election, and turnout reached eighty percent. For the first time, the National Assembly has a real opposition."
 roc_asia.43.a: "Order above all."
 roc_asia.43.b: "Return power to the people step by step."
 roc_asia.43.t: "The First Year of Military Rule"
 roc_asia.43.d: "The military administration claims ‘major achievements’: public order has improved and projects are finished, but international criticism is growing sharper."
 roc_asia.44.a: "This is the work of generations."
 roc_asia.44.t: "A New Asian Tiger"
 roc_asia.44.d: "An International Monetary Fund report says Vietnam has become one of the fastest-growing economies in the world, and its income per person has entered the high-income bracket."
 roc_asia.45.a: "Hold our ground. No retreat."
 roc_asia.45.b: "Seek de-escalation through ASEAN."
 roc_asia.45.t: "Standoff in the Spratlys"
 roc_asia.45.d: "After Vietnam deployed missiles and radar on reefs in the Spratlys, Chinese and Vietnamese coast guard ships have squared off in disputed waters, drawing intense international attention."
 roc_asia.46.a: "Release emergency drought funds."
 roc_asia.46.b: "Switch to salt-tolerant crops and aquaculture."
 roc_asia.46.t: "Salinization of the Delta"
 roc_asia.46.d: "An unprecedented drought has let salt water push hundreds of kilometers up the Mekong Delta, badly damaging the rice paddies. The government has launched an emergency plan."
 KORX_security_review: "Defense White Paper: A Full Security Review"
 KORX_security_review_desc: "Nuclear crises, missile threats and US-China strategic rivalry: the National Security Council has decided to review South Korea's security strategy from top to bottom."
 KORX_nuclear_debate: "The Nuclear Debate"
 KORX_nuclear_debate_desc: "‘Should we have nuclear weapons of our own?’ has become the focus of national debate. Polls show a majority in favor, and both the United States and China are watching closely."
 KORX_missile_forces: "Missile Strategic Command"
 KORX_missile_forces_desc: "Merge the missile units scattered across the services into one strategic command that plans the development and deployment of the Hyunmoo missiles."
 KORX_nuclear_sharing: "Nuclear Sharing"
 KORX_nuclear_sharing_desc: "Follow NATO's nuclear sharing model: US tactical nuclear weapons are based in South Korea, and the two allies plan and rehearse nuclear operations together."
 KORX_independent_deterrent: "Independent Nuclear Deterrent"
 KORX_independent_deterrent_desc: "Nuclear weapons are the ultimate guarantee of national security. The National Assembly passes a resolution authorizing the government to start its own nuclear weapons program."
 KORX_nonnuclear_pledge: "Non-Nuclear Pledge"
 KORX_nonnuclear_pledge_desc: "The government reaffirms the Joint Declaration on the Denuclearization of the Korean Peninsula and seeks international security guarantees as a non-nuclear state."
 KORX_nuclear_latency: "Reprocessing and Nuclear Latency"
 KORX_nuclear_latency_desc: "Renegotiate the Korea-US nuclear cooperation agreement to win the right to reprocess and enrich nuclear fuel, keeping ‘nuclear latency’ in our own hands."
 KORX_npt_exit: "Withdraw from the NPT"
 KORX_npt_exit_desc: "Under Article X of the treaty, South Korea formally notifies the UN Security Council that its supreme interests are threatened and that it will leave the Non-Proliferation Treaty in three months."
 KORX_peaceful_atom: "Peaceful Use of Nuclear Energy"
 KORX_peaceful_atom_desc: "As a party to the NPT, develop civilian nuclear power and domestic nuclear fuel without crossing any red lines."
 KORX_hyunmoo: "Hyunmoo Ballistic Missiles"
 KORX_hyunmoo_desc: "From the Hyunmoo-2 to the Hyunmoo-5, range and warhead weight keep growing. The arrival of the ‘monster missile’ takes conventional deterrence against North Korea to a new level."
 KORX_kamd: "Korean Air and Missile Defense (KAMD)"
 KORX_kamd_desc: "Build a layered air defense network of L-SAM, Cheongung-II and Patriot to protect the capital region from North Korean missiles and artillery."
 KORX_thaad_deploy: "Accept THAAD"
 KORX_thaad_deploy_desc: "The US THAAD system is now deployed in Seongju. Chinese economic retaliation follows quickly, but air defense of the capital region is greatly improved."
 KORX_thaad_refuse: "Refuse THAAD: The Three Nos"
 KORX_thaad_refuse_desc: "‘No joining the US missile defense system, no THAAD deployment, no US-Korea-Japan military alliance.’ That way our economic ties with China will not suffer."
 KORX_us_forces_deal: "USFK Cost-Sharing Agreement"
 KORX_us_forces_deal_desc: "Renegotiate the Special Measures Agreement with Washington. How much we pay has become a political flashpoint in the alliance."
 KORX_deterrence_final: "Korea's Three-Axis System"
 KORX_deterrence_final_desc: "‘Kill Chain, Korean Air and Missile Defense, and Massive Punishment and Retaliation’ together form South Korea's own deterrence system."
 KORX_demographic_commission: "Committee on the Population Crisis"
 KORX_demographic_commission_desc: "The total fertility rate has fallen below 1.0. Schools are closing and villages are emptying. The President personally chairs the committee to coordinate the ministries' response."
 KORX_birth_incentives: "Birth Grants and Childcare Allowances"
 KORX_birth_incentives_desc: "Pay a one-time grant for every newborn and raise childcare allowances, making ‘having children’ a cause the nation supports."
 KORX_housing_supply: "Housing Supply in the Capital Region"
 KORX_housing_supply_desc: "Sky-high house prices in Seoul are the main reason young people do not marry or have children. The government announces more housing supply in the capital region."
 KORX_pension_reform: "National Pension Reform"
 KORX_pension_reform_desc: "The pension fund is projected to run dry by the middle of the century. The government's reform plan has set off a fierce argument between the generations."
 KORX_childcare_system: "Public Childcare System"
 KORX_childcare_system_desc: "Build a nationwide network of public childcare centers and after-school care, so working parents have nothing to worry about."
 KORX_work_hours: "Shorter Hours and Flexible Work"
 KORX_work_hours_desc: "Cap the working week at 52 hours and promote flexible work and parental leave. The chaebol groups are strongly opposed."
 KORX_jeonse_reform: "Jeonse Reform"
 KORX_jeonse_reform_desc: "The traditional jeonse system, renting with a huge up-front deposit, leaves both tenants and landlords exposed to great risk. The government introduces new tenancy protections."
 KORX_new_towns: "New Towns"
 KORX_new_towns_desc: "Build new towns on the edge of the capital region, with subway lines and industrial parks, to ease the population pressure on Seoul."
 KORX_pension_raise: "Raise Contributions and the Pension Age"
 KORX_pension_raise_desc: "Raise contribution rates and push back the pension age to keep the fund stable over the long run. It is bad news for both young and old."
 KORX_basic_pension: "Universal Basic Pension"
 KORX_basic_pension_desc: "Pay a basic pension to every elderly person to ease poverty in old age, the highest in the OECD."
 KORX_immigration_policy: "Multicultural Society and Foreign Worker Visas"
 KORX_immigration_policy_desc: "Loosen E-9 foreign worker visas and permanent residency and promote ‘multicultural’ integration policies to fill the labor gap."
 KORX_regional_balance: "Balanced Regional Development and Sejong"
 KORX_regional_balance_desc: "Move more central government agencies to Sejong and support regional hubs such as Busan and Gwangju, breaking up the ‘Republic of Seoul’."
 KORX_elderly_care: "Long-Term Care Insurance"
 KORX_elderly_care_desc: "Expand long-term care insurance for the elderly and train more care workers for the coming ‘super-aged society’."
 KORX_demographic_final: "A New Social Contract"
 KORX_demographic_final_desc: "Housing, childcare, pensions and work: a whole set of linked institutions that lets the young generation believe in the future again."
 KORX_constitutional_convention: "Constitutional Advisory Committee"
 KORX_constitutional_convention_desc: "The 1987 Constitution has been in force for more than thirty years. The National Assembly sets up a constitutional advisory committee of ruling and opposition parties and civil society."
 KORX_four_year_two_terms: "Two Four-Year Terms"
 KORX_four_year_two_terms_desc: "Allow the president to serve two four-year terms, with elections held together with parliamentary elections, so those in power answer to the voters."
 KORX_parliamentary_system: "Parliamentary Cabinet System"
 KORX_parliamentary_system_desc: "The president becomes a symbolic head of state and the majority party in parliament forms the cabinet, ending the era of the ‘imperial presidency’."
 KORX_prosecution_reform: "Prosecution Reform"
 KORX_prosecution_reform_desc: "Strip the prosecution service of its investigative powers and set up an independent agency for serious crimes. Checks and balances start with the prosecutors."
 KORX_nis_civilian_control: "Civilian Control of the NIS"
 KORX_nis_civilian_control_desc: "The National Intelligence Service's domestic political bureau is abolished outright, and intelligence officers may not meddle in elections or politics."
 KORX_local_autonomy: "Deepening Local Autonomy"
 KORX_local_autonomy_desc: "Expand the fiscal and legislative powers of local governments and introduce ‘special self-governing’ status, making local councils a real part of the system of power."
 KORX_electoral_reform: "Electoral Reform"
 KORX_electoral_reform_desc: "Introduce mixed-member proportional representation so smaller parties can enter parliament, breaking the two-party monopoly."
 KORX_impeachment_rules: "Impeachment and the Constitutional Court"
 KORX_impeachment_rules_desc: "Clarify the procedure for impeaching a president and the powers of the Constitutional Court, so political crises do not turn into constitutional ones."
 KORX_constitutional_referendum: "Constitutional Referendum"
 KORX_constitutional_referendum_desc: "The National Assembly passes the amendment by a two-thirds majority and puts it to a national referendum."
 KORX_new_republic: "The Seventh Republic"
 KORX_new_republic_desc: "The amendment passes with majority support. The new constitution takes effect, and the Republic of Korea enters its Seventh Republic."
 KORX_industrial_strategy: "K-Industry Strategy"
 KORX_industrial_strategy_desc: "After semiconductors and cars, defense, nuclear power, batteries, biotech and culture become the next generation of export industries."
 KORX_defense_exports: "K-Defense Exports"
 KORX_defense_exports_desc: "The government sets up a defense export support group to negotiate abroad with one voice, turning the defense industry into a leading exporter."
 KORX_k9_k2_export: "K9 and K2 Exports"
 KORX_k9_k2_export_desc: "Poland, Turkey, Australia and Middle Eastern countries place orders one after another, and the K9 self-propelled howitzer and K2 main battle tank become star products."
 KORX_fa50_kf21_export: "FA-50 and KF-21 Exports"
 KORX_fa50_kf21_export_desc: "The FA-50 light fighter is a hit in Southeast Asia and Eastern Europe, while the KF-21 breaks into the 4.5-generation fighter market."
 KORX_defense_complex: "Korean Defense Export System"
 KORX_defense_complex_desc: "Integrate land, sea, air and missile exports into one system and set up a defense export financing agency."
 KORX_apr1400_export: "APR1400 Nuclear Exports"
 KORX_apr1400_export_desc: "Starting with the Barakah plant in the UAE, market Korean nuclear power plants to Eastern Europe and the Middle East."
 KORX_smr_program: "Small Modular Reactors (SMR)"
 KORX_smr_program_desc: "Small modular reactors are compact, cheap and safe: the next stop for nuclear power."
 KORX_battery_alliance: "Batteries and New Energy"
 KORX_battery_alliance_desc: "LG Energy Solution, SK On and Samsung SDI join forces to win orders worldwide, and an electric vehicle supply chain takes shape in Korea."
 KORX_ev_ecosystem: "EV Ecosystem"
 KORX_ev_ecosystem_desc: "Hyundai and Kia's EV platforms, plus charging networks and battery recycling, form a complete electric vehicle ecosystem."
 KORX_bio_cluster: "Biopharmaceutical Cluster"
 KORX_bio_cluster_desc: "Build a biopharmaceutical cluster in Songdo, Incheon, where Samsung Biologics and Celltrion become world-class biosimilar makers."
 KORX_bio_export: "Vaccine and Drug Exports"
 KORX_bio_export_desc: "Contract vaccine manufacturing and drug exports push South Korea into the middle of the global pharmaceutical supply chain."
 KORX_lng_shipbuilding: "LNG Carriers and Green Shipbuilding"
 KORX_lng_shipbuilding_desc: "Korean shipyards win eighty percent of the world's LNG carrier orders while leading the development of green ships powered by ammonia and hydrogen."
 KORX_offshore_wind: "Offshore Wind and Hydrogen"
 KORX_offshore_wind_desc: "Build offshore wind farms off the southwest coast and make hydrogen the centerpiece of future energy."
 KORX_hallyu_strategy: "A Nation Built on the Korean Wave"
 KORX_hallyu_strategy_desc: "From K-pop and TV dramas to film, the ‘Korean Wave’ becomes national strategy, and the government sets up a content industry promotion agency."
 KORX_kcontent_fund: "K-Content Fund and Global Platforms"
 KORX_kcontent_fund_desc: "Public and private money backs content going abroad and global distribution platforms, to nurture the next Parasite."
 KORX_new_space: "Space Industry"
 KORX_new_space_desc: "Built around the Nuri launch vehicle and the KPS positioning system, private space companies begin to enter the launch market."
 KORX_industry_final: "K-Industry in Full Bloom"
 KORX_industry_final_desc: "Defense, nuclear power, batteries, shipbuilding and culture: a whole set of mutually supporting export industries has become South Korea's new calling card."
 KORX_roc_representation: "Exchange Representative Offices with the ROC"
 KORX_roc_representation_desc: "The restored Republic of China and South Korea share a special history: the Provisional Government of the Republic of Korea spent twenty-seven years in exile in China. The two countries open representative offices in each other's capitals."
 KORX_roc_provisional_gov: "Commemorating the Korean Provisional Government"
 KORX_roc_provisional_gov_desc: "The Provisional Government of the Republic of Korea spent its years of exile in Shanghai and Chongqing. The government of the Republic of China agrees to open memorial halls on the original sites."
 KORX_roc_maritime_security: "Maritime Security Cooperation"
 KORX_roc_maritime_security_desc: "South Korea and the Republic of China set up a hotline on freedom of navigation and search and rescue in the Yellow Sea, the East China Sea and the Taiwan Strait."
 KORX_roc_dprk_consult: "Consultations on North Korea Policy"
 KORX_roc_dprk_consult_desc: "Seoul and Nanjing hold regular consultations on peace and denuclearization on the Korean Peninsula and on North Korea's future."
 KORX_roc_fta: "Korea-ROC Free Trade Agreement"
 KORX_roc_fta_desc: "Remove almost all tariffs between the two countries and write shared supply chain rules, especially for semiconductors, batteries and rare earths."
 KORX_roc_tech_alliance: "Semiconductor and Display Technology Alliance"
 KORX_roc_tech_alliance_desc: "Korea's memory chips and panels and the Republic of China's foundries and optoelectronics complement each other in the supply chain."
 PHIP_post_edsa: "The Post-EDSA Era"
 PHIP_post_edsa_desc: "The People Power Revolution of 1986 toppled Marcos, and EDSA II drove out Estrada in 2001. Philippine politics seems to swing forever between the street and the palace, and the new government must choose a path."
 PHIP_a_straight_path: "The Straight Path"
 PHIP_a_straight_path_desc: "‘You are my boss.’ A political movement under the banner of fighting corruption and upholding the rule of law has carried the Liberal Party into power."
 PHIP_a_clean_gov: "Clean Government"
 PHIP_a_clean_gov_desc: "Following the ‘Straight Path’ program, prosecute corruption hard, open up government procurement and hold negligent officials to account."
 PHIP_a_oslo_talks: "Oslo Peace Talks"
 PHIP_a_oslo_talks_desc: "Open peace talks with the National Democratic Front in Oslo, trading land reform and a socio-economic agenda for a ceasefire."
 PHIP_a_anti_dynasty: "Anti-Political Dynasty Law"
 PHIP_a_anti_dynasty_desc: "Push through an Anti-Political Dynasty Law that bars close relatives from holding office at the same time, breaking a few families' grip on politics."
 PHIP_a_bangsamoro: "Bangsamoro Basic Law"
 PHIP_a_bangsamoro_desc: "Pass the Bangsamoro Basic Law to create a Muslim Mindanao autonomous region with wider self-rule."
 PHIP_a_us_alliance: "Reaffirm the US Alliance · The Hague Arbitration"
 PHIP_a_us_alliance_desc: "Bring a South China Sea arbitration case under the UN Convention on the Law of the Sea, while reaffirming the Mutual Defense Treaty with the United States."
 PHIP_a_end_insurgency: "Final Peace Agreement with the Communists"
 PHIP_a_end_insurgency_desc: "The two sides sign a Comprehensive Peace Agreement. The New People's Army disarms and the Communist Party enters legal politics. Decades of insurgency come to an end."
 PHIP_a_final: "Consolidating Liberal Democracy"
 PHIP_a_final_desc: "Constitutional government, the rule of law and elections are gradually stabilizing, and the reformers' first term ends with a smooth handover of power."
 PHIP_b_strongman: "Rise of the Strongman"
 PHIP_b_strongman_desc: "‘Change is coming.’ An iron-fisted mayor from Mindanao wins the election on promises of a war on drugs and law and order, and the Philippines enters the age of the strongman."
 PHIP_b_drug_war: "War on Drugs"
 PHIP_b_drug_war_desc: "Police launch zero-tolerance sweeps against drug crime. Public order improves sharply, but human rights groups accuse the authorities of mass extrajudicial killings."
 PHIP_b_crush_npa: "Crush the New People's Army"
 PHIP_b_crush_npa_desc: "Halt the peace talks and send the regular army and police on large-scale sweeps of the New People's Army's guerrilla zones."
 PHIP_b_federalism: "Federal Charter Change"
 PHIP_b_federalism_desc: "Amend the constitution to create a federal system, giving Mindanao more autonomy while extending the president's powers."
 PHIP_b_build_build_build: "Build, Build, Build"
 PHIP_b_build_build_build_desc: "An unprecedented infrastructure program of highways, railways, airports and bridges transforms the country's backward infrastructure."
 PHIP_b_terror_designation: "Designate the Communists as Terrorists"
 PHIP_b_terror_designation_desc: "Congress passes a resolution designating the Communist Party and the New People's Army as terrorist organizations, stripping the insurgency of all legitimacy."
 PHIP_b_independent_foreign: "Independent Foreign Policy"
 PHIP_b_independent_foreign_desc: "‘No longer America's little brother.’ Ease relations with Beijing and shelve the arbitration ruling in exchange for trade and investment."
 PHIP_b_final: "The Strongman's Legacy"
 PHIP_b_final_desc: "Whatever its merits and faults, the strongman era ends within the term the constitution allows, and the political dynasties are reshuffled."
 PHIP_c_coalition: "Grand Coalition"
 PHIP_c_coalition_desc: "The traditional political dynasties, big business and the Church reach an understanding and form a cross-party governing coalition, with ‘stability’ as its highest goal."
 PHIP_c_economy_first: "Economy First"
 PHIP_c_economy_first_desc: "Grow the economy first and talk about political reform later: cut corporate taxes, improve the investment climate and expand infrastructure."
 PHIP_c_peace_dev_teams: "Peace and Development Teams"
 PHIP_c_peace_dev_teams_desc: "The army and local governments form joint teams that bring roads, schools and clinics to insurgent areas, eroding the rebels' popular base."
 PHIP_c_bpo_remittances: "Outsourcing and Remittances"
 PHIP_c_bpo_remittances_desc: "Make business process outsourcing and overseas workers' remittances the two engines of national growth, and protect the rights of overseas workers."
 PHIP_c_amnesty: "Amnesty and Reintegration"
 PHIP_c_amnesty_desc: "Offer amnesty, land and job training to rebels who lay down their arms, and bring some of them into local militias."
 PHIP_c_end_insurgency: "The End of the Insurgency"
 PHIP_c_end_insurgency_desc: "Rebels surrender one group after another, and the military declares that the Communists' armed struggle is drawing to a close."
 PHIP_c_balanced_diplomacy: "Balanced Diplomacy"
 PHIP_c_balanced_diplomacy_desc: "Walk a tightrope between China and America: the US keeps its military cooperation, China gets investment opportunities, and the South China Sea is shelved through ‘joint development’."
 PHIP_c_final: "Stability and Prosperity"
 PHIP_c_final_desc: "The coalition's term passes smoothly, the economy grows, and the opposition's criticism stays inside Congress."
 PHIP_d_people_power: "The Progressive Coalition"
 PHIP_d_people_power_desc: "A progressive coalition built around the social democrats wins the election with the backing of workers, farmers and students."
 PHIP_d_land_reform: "Comprehensive Land Reform"
 PHIP_d_land_reform_desc: "The great landlords' estates are redistributed to tenant farmers. The land question, one of the roots of the insurgency, is finally tackled head-on."
 PHIP_d_legalize_left: "Legalize the National Democratic Front"
 PHIP_d_legalize_left_desc: "Repeal the Anti-Subversion Law and allow left-wing parties and groups to operate legally, bringing class struggle into parliamentary politics."
 PHIP_d_labour_rights: "Labor Rights Act"
 PHIP_d_labour_rights_desc: "Guarantee a minimum wage, regular status for contract workers and the right to unionize, improving the lives of millions of workers."
 PHIP_d_universal_health: "Universal Health Care"
 PHIP_d_universal_health_desc: "Set up universal health insurance and a network of grassroots health stations."
 PHIP_d_ceasefire: "Comprehensive Ceasefire"
 PHIP_d_ceasefire_desc: "The government and the Communists sign an indefinite ceasefire, and the New People's Army gradually turns into legal political groups and farmers' cooperatives."
 PHIP_d_non_aligned: "Non-Alignment and the Bases Question"
 PHIP_d_non_aligned_desc: "Review the Visiting Forces Agreement, handle relations with China and America from a position of diplomatic diversity, and seek ASEAN's support."
 PHIP_d_final: "The Social Democratic Experiment"
 PHIP_d_final_desc: "The Progressive Coalition's first term is over, and the Philippine left has moved from the streets to the center of power."
 PHIP_new_consensus: "A New National Consensus"
 PHIP_new_consensus_desc: "The parties have agreed on the basic rules of politics. Here the Philippine political line ends; what follows is the long work of nation-building."
 VIEX_p_root: "Vietnam's Political Future"
 VIEX_p_root_desc: "Thirty years of Đổi Mới have made Vietnam one of the fastest-growing countries in Asia, but it also faces corruption, inefficient state enterprises and pressure to democratize. The Party must decide where Vietnam goes next."
 VIEX_dm_start: "Đổi Mới 2.0"
 VIEX_dm_start_desc: "After the 1986 renovation, the Party announces deeper market reforms: a ‘socialist-oriented market economy’ with more market and a clearer socialism."
 VIEX_dm_term_limit: "Inner-Party Democracy and Term Limits"
 VIEX_dm_term_limit_desc: "The General Secretary's term and age are limited, and collective leadership within the Party is strengthened."
 VIEX_dm_furnace: "The Blazing Furnace"
 VIEX_dm_furnace_desc: "‘The fight against corruption has no forbidden zones and no exceptions.’ From officials to state enterprise executives, a slate of people end up in court."
 VIEX_dm_state_core: "The State Advances: Stronger State Enterprises"
 VIEX_dm_state_core_desc: "Concentrate our strength and merge the state enterprises into a few internationally competitive ‘national champions’."
 VIEX_dm_private_core: "The Private Sector Advances: A Key Driving Force"
 VIEX_dm_private_core_desc: "The private economy is formally recognized as ‘an important driving force of the national economy’, with easier market entry and protected property rights."
 VIEX_dm_civil_space: "Social Organizations and Civil Society"
 VIEX_dm_civil_space_desc: "Allow environmental, charitable and trade associations to register and operate: the first step toward a ‘socialist rule-of-law state’."
 VIEX_dm_final: "Socialist-Oriented Market Economy"
 VIEX_dm_final_desc: "The second stage of renovation takes shape: neither capitalism nor a planned economy, but Vietnam's own ‘third way’."
 VIEX_hl_start: "Party Rectification"
 VIEX_hl_start_desc: "‘The political ideology, morality and lifestyle of some cadres and party members have degenerated.’ The Central Committee launches a new rectification campaign."
 VIEX_hl_ideology: "Ideological Education"
 VIEX_hl_ideology_desc: "Restore education in Marxism-Leninism and Ho Chi Minh Thought in schools, government offices and the media."
 VIEX_hl_party_media: "Party Control of Media and the Internet"
 VIEX_hl_party_media_desc: "Bring the internet and social media under Party management and crack down on ‘reactionary speech’."
 VIEX_hl_police: "Strengthen the Public Security Forces"
 VIEX_hl_police_desc: "Expand the public security forces and set up dedicated cybersecurity and counterintelligence departments."
 VIEX_hl_state_plan: "Restore Central Planning"
 VIEX_hl_state_plan_desc: "Bring back five-year plans and administrative orders in key industries, narrowing the room for private capital."
 VIEX_hl_final: "The Party's Leadership Strengthened Across the Board"
 VIEX_hl_final_desc: "‘The Party leads everything’ becomes the basic principle of the whole nation. There is order, but society has lost its old vitality."
 VIEX_dem_start: "Multi-Party Transition"
 VIEX_dem_start_desc: "The General Secretary announces that the Party is willing to negotiate a peaceful political transition with other political forces and let the voters decide the country's future."
 VIEX_dem_association: "Freedom of Association and Publishing"
 VIEX_dem_association_desc: "Lift the restrictions on association and publishing, allowing independent newspapers and civilian parties to register."
 VIEX_dem_independent_candidates: "Allow Independent Candidates"
 VIEX_dem_independent_candidates_desc: "Amend the election law to let non-Party members run as independents for the National Assembly and local councils."
 VIEX_dem_judiciary: "Judicial Independence"
 VIEX_dem_judiciary_desc: "The courts no longer report to the Party's legal affairs committees, and judges are appointed and promoted independently of the executive."
 VIEX_dem_electoral_law: "Multi-Party Election Law"
 VIEX_dem_electoral_law_desc: "Pass a new election law with multi-party competition, secret ballots and international observers, and hold new elections to the National Assembly."
 VIEX_dem_final: "The First Multi-Party Election"
 VIEX_dem_final_desc: "The first multi-party election in Vietnam's history. Whoever wins, it is a turning point in the nation's politics."
 VIEX_mj_start: "The Role of the Army"
 VIEX_mj_start_desc: "The People's Army is the Party's army and a symbol of national independence. In a moment of crisis, the army has stepped forward."
 VIEX_mj_security_council: "National Defense and Security Council"
 VIEX_mj_security_council_desc: "Set up a National Defense and Security Council above the government, chaired by military leaders."
 VIEX_mj_army_business: "Army Enterprises"
 VIEX_mj_army_business_desc: "Put army-run businesses such as Viettel and the Military Bank at the heart of national industrial policy."
 VIEX_mj_order: "Keeping Order"
 VIEX_mj_order_desc: "Keep order through military administration, restricting gatherings and making curfews and patrols part of daily life."
 VIEX_mj_rebuild: "An Army-Led Economy"
 VIEX_mj_rebuild_desc: "Army enterprises and state enterprises lead construction together. Efficiency rises, and so does corruption."
 VIEX_mj_final: "A Nation of Army and People"
 VIEX_mj_final_desc: "State and army have become one. Some call it stability; others call it martial law."
 VIEX_e_root: "The Next Step of Đổi Mới"
 VIEX_e_root_desc: "Thirty years of renovation have lifted Vietnam from one of the poorest countries to a middle-income one. What comes next? Manufacturing, energy, infrastructure and the digital economy."
 VIEX_e_agri: "Modernizing Mekong Delta Agriculture"
 VIEX_e_agri_desc: "Spread better seeds, mechanization and irrigation to turn the delta into a reliable granary."
 VIEX_e_rice: "Rice Exports and Branding"
 VIEX_e_rice_desc: "Build a Vietnamese rice brand on premium varieties such as ST25 and win the high-end market."
 VIEX_e_cash_crops: "Coffee, Rubber and Pepper"
 VIEX_e_cash_crops_desc: "Coffee, rubber and pepper from the Central Highlands are Vietnam's traditional exports, and better processing can add a great deal of value."
 VIEX_e_aquaculture: "Aquaculture and Processing"
 VIEX_e_aquaculture_desc: "Pangasius and shrimp farming and processing have built a complete export industry in the delta."
 VIEX_e_fdi: "Foreign-Invested Manufacturing"
 VIEX_e_fdi_desc: "Use cheap labor, free trade agreements and a stable political climate to draw foreign manufacturers to move their factories to Vietnam."
 VIEX_e_samsung: "Samsung and Korean Capital"
 VIEX_e_samsung_desc: "Samsung's phone factories in Bac Ninh and Thai Nguyen have made Vietnam one of the world's largest phone exporters."
 VIEX_e_intel: "Intel and Chip Packaging"
 VIEX_e_intel_desc: "Intel's assembly and test plant in Ho Chi Minh City is Vietnam's first step into the semiconductor supply chain."
 VIEX_e_textiles: "Textiles, Garments and the CPTPP"
 VIEX_e_textiles_desc: "After joining the CPTPP and the EU-Vietnam free trade agreement, Vietnamese textiles and footwear enter major markets tariff-free."
 VIEX_e_electronics: "Electronics Cluster"
 VIEX_e_electronics_desc: "Suppliers for phones, computers and home appliances are gradually forming a complete industrial cluster in Vietnam."
 VIEX_e_energy: "Energy and Resources"
 VIEX_e_energy_desc: "With power demand growing ten percent a year, Vietnam must develop both traditional and new energy at once."
 VIEX_e_petrovietnam: "PetroVietnam"
 VIEX_e_petrovietnam_desc: "With PetroVietnam at the core, develop the South China Sea continental shelf and the White Tiger field, a Vietnamese-Russian joint venture."
 VIEX_e_offshore: "Offshore Oil and Gas"
 VIEX_e_offshore_desc: "Drill for oil and gas on the near-shore continental shelf while showing restraint toward neighbors' claims."
 VIEX_e_hydro_coal: "Hydro and Coal Power"
 VIEX_e_hydro_coal_desc: "Large hydropower dams and coal plants provide cheap electricity, but at an environmental cost."
 VIEX_e_renewable: "Wind and Solar"
 VIEX_e_renewable_desc: "Solar and wind in Ninh Thuan and Bac Lieu have become some of the fastest-growing renewable energy in the world."
 VIEX_e_nuclear_ninhthuan: "Restart Ninh Thuan Nuclear"
 VIEX_e_nuclear_ninhthuan_desc: "The shelved Ninh Thuan nuclear power project is restarted, with Russia and Japan competing to build it."
 VIEX_e_shipbuilding: "Shipbuilding and Marine Industry"
 VIEX_e_shipbuilding_desc: "Develop shipbuilding, offshore engineering and port machinery centered on Hai Phong and Quang Ninh."
 VIEX_e_infra: "North-South Artery"
 VIEX_e_infra_desc: "A highway and railway running the length of the country will tie the two great centers of Hanoi and Ho Chi Minh City together."
 VIEX_e_highway: "North-South Expressway"
 VIEX_e_highway_desc: "Built and opened section by section, until the whole route is complete."
 VIEX_e_hsr: "North-South High-Speed Rail"
 VIEX_e_hsr_desc: "A high-speed line planned on the model of Japan's Shinkansen. Money and technology are still the challenges."
 VIEX_e_metro: "Hanoi and Ho Chi Minh City Metros"
 VIEX_e_metro_desc: "Metro lines open one after another in both cities, easing traffic congestion."
 VIEX_e_ports: "Deep-Water Ports and Logistics"
 VIEX_e_ports_desc: "Lach Huyen in Hai Phong and Cai Mep in Ba Ria-Vung Tau make Vietnam one of Southeast Asia's shipping hubs."
 VIEX_e_digital: "Digital Economy"
 VIEX_e_digital_desc: "5G, cloud computing and e-commerce make the digital economy a new pillar of the national economy."
 VIEX_e_viettel_fpt: "Viettel and FPT"
 VIEX_e_viettel_fpt_desc: "The army-run Viettel and the private FPT are the two calling cards of Vietnam's tech industry."
 VIEX_e_vinfast: "VinFast and Electric Vehicles"
 VIEX_e_vinfast_desc: "The homegrown brand VinFast breaks into the global EV market and builds a factory in North Carolina."
 VIEX_e_tourism: "Tourism"
 VIEX_e_tourism_desc: "Ha Long Bay, Da Nang and the old town of Hoi An draw millions of visitors, and tourism becomes a pillar of the service sector."
 VIEX_e_banking: "Banking Reform and Bad Loans"
 VIEX_e_banking_desc: "Strip bad loans out of the state banks, bring in foreign strategic investors and adopt the Basel accords."
 VIEX_e_soe_reform: "Equitizing State Enterprises"
 VIEX_e_soe_reform_desc: "Push state enterprises to issue shares and go public, reducing the state's stake."
 VIEX_e_cptpp: "CPTPP and the EU-Vietnam FTA"
 VIEX_e_cptpp_desc: "Vietnam is one of the few developing countries with high-standard free trade agreements covering partners such as Europe, Japan and the Pacific Rim."
 VIEX_e_final: "A New Asian Tiger"
 VIEX_e_final_desc: "Manufacturing, energy, infrastructure and the digital economy: four pillars that put Vietnam among the new Asian tigers."
 VIEX_m_root: "Modernizing the People's Army"
 VIEX_m_root_desc: "‘No alliances, no siding with one against another, no foreign bases, no use of force.’ Under Vietnam's ‘Four Nos’ defense policy, the People's Army is turning from a vast infantry force into a lean, modern military."
 VIEX_m_slim_army: "A Leaner Army"
 VIEX_m_slim_army_desc: "Cut the size of the standing army, raise the quality of the officer corps and put the savings into new equipment."
 VIEX_m_conscription: "Military Service Law Reform"
 VIEX_m_conscription_desc: "Revise the military service law to shorten service and increase the share and pay of volunteers."
 VIEX_m_reserve: "Reserve Mobilization"
 VIEX_m_reserve_desc: "Build a nationwide reserve system and hold regular mobilization exercises."
 VIEX_m_border_defense: "Northern Border and Mountain Defense"
 VIEX_m_border_defense_desc: "Build fortifications and mountain warfare training bases in the northern highlands."
 VIEX_m_navy: "Naval Modernization"
 VIEX_m_navy_desc: "The navy shifts from coastal patrol to limited offshore defense, built around submarines, frigates and anti-ship missiles."
 VIEX_m_kilo: "Kilo-Class Submarines (Hanoi Class)"
 VIEX_m_kilo_desc: "Six Kilo-class submarines bought from Russia form the core of the Vietnamese navy's deterrent."
 VIEX_m_frigates: "Frigates and Missile Boats"
 VIEX_m_frigates_desc: "Acquire Russian Gepard-class frigates and domestically built missile boats to expand coastal defense."
 VIEX_m_antiship: "Coastal Anti-Ship Missiles"
 VIEX_m_antiship_desc: "BrahMos and domestic anti-ship missiles give Vietnam the power to deny any invading fleet at its doorstep."
 VIEX_m_marines: "Marines and Island Garrisons"
 VIEX_m_marines_desc: "Expand the naval infantry, garrison the Spratly reefs, and strengthen resupply and air defense on the islands."
 VIEX_m_militia: "Maritime Militia and Coast Guard"
 VIEX_m_militia_desc: "A sea line of fishermen, coast guard and navy forms the front line of defending our rights in the South China Sea."
 VIEX_m_air: "Air Force and Air Defense"
 VIEX_m_air_desc: "A modern air force built around Su-30 fighters and S-300 surface-to-air missiles."
 VIEX_m_su30: "Su-30MK2"
 VIEX_m_su30_desc: "Multirole fighters acquired from Russia, the backbone of the Vietnamese air force."
 VIEX_m_s300: "S-300 Air Defense"
 VIEX_m_s300_desc: "Long-range air defense missiles acquired from Russia, guarding Hanoi and Ho Chi Minh City."
 VIEX_m_airbase: "Hardened Airbases"
 VIEX_m_airbase_desc: "Rebuild military airfields with shelters and new runways to help the air force survive on the battlefield."
 VIEX_m_cyber: "Cyber Forces"
 VIEX_m_cyber_desc: "Cyber Command 86 is responsible for defending the national network and the information environment."
 VIEX_m_military_industry: "Viettel Defense Industry"
 VIEX_m_military_industry_desc: "With Viettel at the core, develop domestic radar, communications equipment and drones."
 VIEX_m_final: "An All-People Defense System"
 VIEX_m_final_desc: "Standing army, reserves, militia and coast guard together form Vietnam's own defense system."
 VIEX_d_root: "Bamboo Diplomacy"
 VIEX_d_root_desc: "‘Strong roots, a sturdy trunk and flexible branches’: friendly with every great power, dependent on none. Vietnamese diplomacy must find its own place between China, America, Russia, Japan and India."
 VIEX_d_china: "Relations with China"
 VIEX_d_china_desc: "China is both our biggest neighbor and our biggest trading partner. How we handle the South China Sea sets the tone of the relationship."
 VIEX_d_china_coop: "Comprehensive Strategic Cooperative Partnership"
 VIEX_d_china_coop_desc: "Raise Vietnam-China relations to a ‘comprehensive strategic cooperative partnership’, strengthen trade and party-to-party ties, and set aside the South China Sea dispute through friendly consultation."
 VIEX_d_china_arb: "International Arbitration and Legal Struggle"
 VIEX_d_china_arb_desc: "Bring a case before international arbitration under the UN Convention on the Law of the Sea and defend our maritime rights within international law."
 VIEX_d_china_militarize: "Militarize the Reefs"
 VIEX_d_china_militarize_desc: "Fortify our Spratly reefs, deploy missiles and radar, and defend our territorial sovereignty by force if necessary."
 VIEX_d_scs_code: "South China Sea Code of Conduct Talks"
 VIEX_d_scs_code_desc: "Push ASEAN and China to agree a binding Code of Conduct for the South China Sea, bringing the disputes inside a framework of rules."
 VIEX_d_china_border: "Gulf of Tonkin Boundary and Border Trade"
 VIEX_d_china_border_desc: "The Gulf of Tonkin boundary agreement and the demarcation of the land border clear the way for border trade and new crossings."
 VIEX_d_usa: "Relations with America"
 VIEX_d_usa_desc: "From diplomatic relations in 1995 to a ‘comprehensive partnership’ in 2013 and a ‘comprehensive strategic partnership’ in 2023, Vietnam-US relations improve every year."
 VIEX_d_usa_partner: "Comprehensive Partnership"
 VIEX_d_usa_partner_desc: "Raise Vietnam-US relations to a comprehensive partnership, expanding cooperation on trade, education and war legacies."
 VIEX_d_arms_embargo: "Lift the Arms Embargo"
 VIEX_d_arms_embargo_desc: "The United States lifts its embargo on lethal arms sales to Vietnam, opening the door to military cooperation."
 VIEX_d_cam_ranh: "Cam Ranh Bay Cooperation"
 VIEX_d_cam_ranh_desc: "Allow foreign warships to visit Cam Ranh Bay in line with our ‘Four Nos’, but never set up a military base."
 VIEX_d_russia: "Relations with Russia"
 VIEX_d_russia_desc: "Russia is Vietnam's most important arms supplier and a traditional friend."
 VIEX_d_rus_arms: "Russian Arms"
 VIEX_d_rus_arms_desc: "Keep buying Russian submarines, fighters and air defense systems to keep our equipment consistent."
 VIEX_d_rus_energy: "Vietnam-Russia Oil and Gas Cooperation"
 VIEX_d_rus_energy_desc: "The Vietnamese-Russian joint venture Vietsovpetro keeps exploring together in Siberia and offshore."
 VIEX_d_india: "Relations with India"
 VIEX_d_india_desc: "India's ‘Act East’ policy fits neatly with Vietnam's own look to the west."
 VIEX_d_india_navy: "Indian Naval Cooperation"
 VIEX_d_india_navy_desc: "India provides Vietnam with naval training, credit lines and BrahMos missiles."
 VIEX_d_japan: "Relations with Japan: Extensive Strategic Partnership"
 VIEX_d_japan_desc: "Japan is Vietnam's biggest source of official development aid and its largest lender for infrastructure."
 VIEX_d_korea: "Relations with South Korea"
 VIEX_d_korea_desc: "South Korea is one of Vietnam's biggest sources of foreign investment, and hundreds of thousands of Vietnamese live and work there."
 VIEX_d_laos_cambodia: "Special Relations with Laos and Cambodia"
 VIEX_d_laos_cambodia_desc: "Vietnam, Laos and Cambodia forged deep bonds through shared history and revolution, and the three keep a special relationship."
 VIEX_d_asean: "ASEAN Centrality"
 VIEX_d_asean_desc: "Make ASEAN the cornerstone of our diplomacy, promoting regional cooperation, free trade and a South China Sea code of conduct."
 VIEX_d_mekong: "Mekong Cooperation and Water"
 VIEX_d_mekong_desc: "Set up water management arrangements with the Mekong countries to limit the impact of upstream dams on the delta."
 VIEX_d_roc: "Pragmatic Relations with the ROC"
 VIEX_d_roc_desc: "The restored Republic of China holds Taiping Island in the South China Sea and has long historical ties to Southeast Asia. Vietnam is willing to develop trade and people-to-people ties with it pragmatically."
 VIEX_d_roc_trade: "Taiwanese Business and Investment"
 VIEX_d_roc_trade_desc: "Keep Taiwanese investment in Vietnam going and expand high-end manufacturing cooperation between the two countries."
 VIEX_d_final: "Comprehensive Diversification"
 VIEX_d_final_desc: "Friends with every great power, at peace with every neighbor, and a voice in every regional body: the fruits of bamboo diplomacy."
 VIEX_s_root: "Livelihoods and Social Development"
 VIEX_s_root_desc: "Beyond economic growth, education, health care, the environment and social fairness will decide whether Vietnam truly becomes a modern country."
 VIEX_s_education: "Education Reform"
 VIEX_s_education_desc: "Reform the university entrance exam and strengthen vocational and English teaching to train the talent that manufacturing and the digital economy need."
 VIEX_s_health: "Universal Health Insurance"
 VIEX_s_health_desc: "Widen health insurance coverage and build a network of district and provincial hospitals."
 VIEX_s_climate: "Climate Adaptation and the Mekong Delta"
 VIEX_s_climate_desc: "Rising seas and salinization threaten the delta's rice paddies, and the government launches a ‘Delta Adaptation Plan’."
 VIEX_s_urban: "Urbanization and Housing"
 VIEX_s_urban_desc: "Hundreds of thousands of people move from the countryside to the cities every year, and the government launches social housing and satellite city programs."
 VIEX_s_minorities: "National Unity and the Central Highlands"
 VIEX_s_minorities_desc: "Respect the languages and cultures of all 54 ethnic groups and improve infrastructure and education in the Central Highlands and the northern mountains."
 VIEX_s_demography: "Aging and Population Policy"
 VIEX_s_demography_desc: "Vietnam's birth rate is falling and the population is aging faster than expected, so the government lifts the two-child limit."
 VIEX_s_youth: "Youth and Startups"
 VIEX_s_youth_desc: "Launch a ‘Startup Nation’ program offering young people startup funds and incubators."
 VIEX_s_final: "A Vietnam of Shared Prosperity"
 VIEX_s_final_desc: "Becoming a high-income country by 2045, the centenary of Vietnam's independence, is the Party's solemn promise."
 ### v3.21 反攻提速、志愿军、两岸内战与政治线改版
 TAI_kmt_defense_tech: "Indigenous Defense R&D"
 TAI_kmt_science_park_tech: "Science Parks"
 TAI_dp_startup_tech: "Startup Nation"
 TAI_dp_regional_university_tech: "Regional University System"
 TAI_sd_university_tech: "Expanding Public Universities"
 TAI_sd_circular_tech: "Circular Economy"
 TAI_escalate_intervention: "Escalate: Reorganize the Volunteer Armies"
 TAI_escalate_intervention_desc: "The name ‘volunteers’ can no longer hide the sound of our guns across the Strait. Taipei decides to drop the pretense: recall the volunteers, reorganize the mainland rebel armies and formally declare war on Beijing."
 TAI_escalate_condition_tt: "The uprising has been going on for more than §Y60§! days"
 TAI_armed_intervention_tt: "§RThe National Army fights China directly as an ally of the rebel armies§! (without annexing them)."
 TAI_escalate_tt: "§YRecall the volunteers, declare war on China and annex the rebel armies§!."
 TAI_uprising_tt: "A §Rdemocratic uprising§! will break out in the southeastern coastal provinces of §YChina§!. The rebel government stays independent, and we intervene at first as §Yvolunteers§!; only when the situation escalates do we reorganize the rebel armies and formally declare war."
 TAI_volunteer_target_tt: "The mainland rebel army is an ongoing democratic uprising"
 roc_return.8.t: "Uprising on the Mainland!"
 roc_return.8.d: "After years of our groundwork, soldiers and civilians in the southeastern coastal provinces have finally risen up, proclaiming a ‘Provisional Mainland Government of the Republic of China’ and asking Taipei for support.\n\nIf the National Army openly crosses the Strait now, it amounts to declaring war on Beijing. The General Staff recommends sending troops and weapons as ‘volunteers’ first, and deciding whether to escalate once the situation is clearer."
 roc_return.8.a: "Organize volunteers and arm the rebels"
 roc_return.8.b: "Send arms only, no troops for now"
 roc_return.8.c: "Send in the army: armed intervention in the name of the National Army"
 roc_return.190.a: "Escalate: reorganize the rebels and formally declare war"
 roc_return.190.b: "Keep supporting them as volunteers"
 roc_return.190.t: "Escalate the Intervention?"
 roc_return.190.d: "The uprising has been going on for some time. Can the rebels hold out against Beijing's counterattack, and how long can we keep up the pretense of ‘volunteers’?"
 roc_return.191.a: "Let this defeat be the spark for the next time"
 roc_return.191.t: "The Rebel Armies Collapse"
 roc_return.191.d: "Beijing's troops have crushed the uprisings in the southeastern provinces. The volunteers' names are on the wanted lists, but we have not lost the whole war: reports say resentment on the mainland runs even deeper than before the uprising."
 roc_return.192.a: "Gladly accept and unify the nation"
 roc_return.192.b: "Keep two governments side by side"
 roc_return.192.t: "The Rebels Have Seized Power"
 roc_return.192.d: "The ‘Provisional Mainland Government of the Republic of China’ has defeated Beijing's forces and controls most of the country. Its envoys have arrived: it is willing to accept Taipei's leadership and unify the nation."
 TAI_dec_more_volunteers: "Send More Volunteers"
 TAI_dec_more_volunteers_desc: "Send another group of officers and soldiers as ‘volunteers’ to join the mainland rebel armies."
 TAI_dec_armed_intervention: "Armed Intervention"
 TAI_dec_armed_intervention_desc: "No more calling ourselves ‘volunteers’: the National Army goes into battle directly as an ally of the rebels, but does not yet reorganize or annex them."
 TAI_dec_arm_rebels: "Arm the Rebels"
 TAI_dec_arm_rebels_desc: "Ship rifles, artillery, and anti-tank and anti-aircraft weapons from our depots to the mainland rebel armies."
 TAI_relocate_capital_beijing: "Move the Capital to Beiping"
 TAI_relocate_capital_beijing_desc: "Beiping was the capital of the Yuan, Ming and Qing, and is the political and military center of North China. Moving the capital there from Nanjing brings it closer to the northern defenses and the resources of the Northeast. Mutually exclusive with ‘Make Nanjing the Capital’; we can still move back to Nanjing later through a decision."
 TAI_beijing_capital_idea: "Capital at Beiping"
 TAI_beijing_capital_idea_desc: "The Nationalist Government has moved the capital to Beiping. Administration and mobilization in the north are more efficient, while the southern local factions complain of being left out."
 TAI_dec_move_capital_nanjing: "Move the Capital Back to Nanjing"
 TAI_dec_move_capital_nanjing_desc: "Move the capital back to Nanjing."
 TAI_gov_kmt_tt: "The §YKuomintang§! has governed before, or is in a governing coalition now"
 TAI_gov_dp_tt: "The §YChina Democratic Party§! has governed before, or is in a governing coalition now"
 TAI_gov_sd_tt: "The §YChinese Social Democratic Party§! has governed before, or is in a governing coalition now"
 TAI_kmt_mainland_branches: "Rebuild the Mainland Party Branches"
 TAI_kmt_mainland_branches_desc: "Rebuild Kuomintang branches in every province, bringing in local gentry and retired officers so the party reaches down to the counties and townships again."
 TAI_kmt_youth_corps: "Youth Corps and Student Groups"
 TAI_kmt_youth_corps_desc: "Rebuild the Three Principles of the People Youth Corps and recruit student members at the universities to train a new generation of cadres."
 TAI_kmt_cadre_academy: "Revolutionary Practice Institute"
 TAI_kmt_cadre_academy_desc: "Restore the party's cadre training institute and teach ‘The Fundamentals of National Reconstruction’ to every new member."
 TAI_kmt_factional_balance: "Factional Balance"
 TAI_kmt_factional_balance_desc: "Balance must be kept between the old members who came from Taiwan, the Taiwanese locals and the new members from the mainland; no faction may monopolize party appointments."
 TAI_kmt_garrison_reform: "Garrison Reorganization"
 TAI_kmt_garrison_reform_desc: "Unify garrison designations and chains of command, realigning the National Army's defense zones in the mainland provinces with the Ministry of National Defense's order of battle."
 TAI_kmt_border_fortress: "Frontier Fortresses"
 TAI_kmt_border_fortress_desc: "Build permanent fortifications and military airfields on the frontiers of the Northeast, Northwest and Southwest to hold the nation's gates."
 TAI_kmt_unification_forum: "Cross-Strait Forum"
 TAI_kmt_unification_forum_desc: "Bring scholars, entrepreneurs and local officials from both sides of the Strait together regularly, so ‘One China’ is more than a slogan."
 TAI_kmt_defense_self_reliance: "Defense Self-Reliance"
 TAI_kmt_defense_self_reliance_desc: "A whole set of homegrown weapon systems gradually replaces imports, and the defense industry is no longer at others' mercy."
 TAI_kmt_central_bank_independence: "Central Bank Independence"
 TAI_kmt_central_bank_independence_desc: "The central bank is freed from political interference, and a stable currency becomes the government's first credential."
 TAI_kmt_industrial_parks: "Industrial Parks"
 TAI_kmt_industrial_parks_desc: "Plan new industrial parks on the coast and in the interior at once, bringing in Taiwanese and foreign investment."
 TAI_kmt_science_parks: "Science Parks"
 TAI_kmt_science_parks_desc: "Copy Hsinchu's success on the mainland: science parks, talent and venture capital, all together."
 TAI_kmt_export_drive: "Export Drive"
 TAI_kmt_export_drive_desc: "Let exports drive growth, and swap the ‘Made in China’ label for a new ‘Made in the Republic of China’."
 TAI_dp_bar_association: "Bar Associations"
 TAI_dp_bar_association_desc: "Let lawyers form their own bar associations, so defending the accused is no longer dangerous."
 TAI_dp_petition_office: "Grievance Hotline"
 TAI_dp_petition_office_desc: "Every county gets a grievance office with a direct line to the central government, so victims of injustice no longer have to throw themselves in front of officials' cars to be heard."
 TAI_dp_victims_compensation: "Compensation for Victims"
 TAI_dp_victims_compensation_desc: "Compensate the victims of past political campaigns and their families, so the wounds of history can be dealt with."
 TAI_dp_ombudsman: "National Human Rights Commission"
 TAI_dp_ombudsman_desc: "Set up an independent National Human Rights Commission that answers to parliament, not to the government."
 TAI_dp_sme_support: "Support for Small Business"
 TAI_dp_sme_support_desc: "Cut taxes and lower borrowing barriers for small and micro firms, so private enterprise becomes the main force of the economy."
 TAI_dp_stock_exchange: "Securities Market"
 TAI_dp_stock_exchange_desc: "Build a securities market that runs by law and discloses information openly, giving private capital somewhere to go."
 TAI_dp_free_trade_zones: "Free Trade Ports"
 TAI_dp_free_trade_zones_desc: "Open several free trade ports on the coast with the loosest customs and tax rules."
 TAI_dp_startup_nation: "Startup Nation"
 TAI_dp_startup_nation_desc: "The government steps back, and entrepreneurs, universities and angel investors drive the new economy together."
 TAI_dp_governors_election: "Directly Elected Governors"
 TAI_dp_governors_election_desc: "Provincial governors are elected directly by the people of each province, and relations between center and provinces no longer depend on appointments."
 TAI_dp_fiscal_federalism: "Fiscal Federalism"
 TAI_dp_fiscal_federalism_desc: "Tax revenue is divided between the center and the provinces by law, giving the provinces purses of their own."
 TAI_dp_regional_universities: "Regional Universities"
 TAI_dp_regional_universities_desc: "Each province runs a first-class university of its own, so talent no longer all crowds into Beijing and Shanghai."
 TAI_dp_regional_charters: "Provincial Charters"
 TAI_dp_regional_charters_desc: "Each province may draw up its own charter, so long as it respects the basic principles of the national constitution."
 TAI_sd_minimum_wage: "Minimum Wage"
 TAI_sd_minimum_wage_desc: "A national minimum wage gives workers on the coast and in the interior the same floor."
 TAI_sd_collective_bargaining: "Collective Bargaining"
 TAI_sd_collective_bargaining_desc: "Unions may bargain with employers on behalf of workers, and the right to strike is protected by law."
 TAI_sd_unemployment_insurance: "Unemployment Insurance"
 TAI_sd_unemployment_insurance_desc: "Build a nationwide system of unemployment insurance and retraining."
 TAI_sd_worker_representatives: "Co-Determination"
 TAI_sd_worker_representatives_desc: "Large companies must have worker representatives on their boards, so decisions are no longer the boss's alone."
 TAI_sd_rural_clinics: "Rural Clinics"
 TAI_sd_rural_clinics_desc: "Every township gets a public clinic, and doctors are sent to the most remote villages."
 TAI_sd_public_universities: "Expanding Public Universities"
 TAI_sd_public_universities_desc: "Expand admissions at public universities, with the state paying most of the tuition."
 TAI_sd_vocational_schools: "Vocational Schools"
 TAI_sd_vocational_schools_desc: "Every industrial zone gets a vocational school, and its graduates go straight into the factories."
 TAI_sd_health_for_all: "Health Care for All"
 TAI_sd_health_for_all_desc: "Seeing a doctor is no longer a gamble: national health insurance covers everyone."
 TAI_sd_carbon_pricing: "Carbon Pricing"
 TAI_sd_carbon_pricing_desc: "Put a price on carbon emissions and use the revenue to support low-income households."
 TAI_sd_renewables_grid: "Renewable Grid"
 TAI_sd_renewables_grid_desc: "Build new inter-provincial ultra-high-voltage lines to carry wind and solar power from the west to the east."
 TAI_sd_urban_greening: "Urban Greening"
 TAI_sd_urban_greening_desc: "Add parks and greenways to the cities, and make air and water quality part of officials' performance reviews."
 TAI_sd_circular_economy: "Circular Economy"
 TAI_sd_circular_economy_desc: "One factory's waste becomes another's raw material. ‘Reduce, reuse, recycle’ becomes national policy."
 TAI_gc_roundtable: "Round Table"
 TAI_gc_roundtable_desc: "The party leaders sit around one table and talk through every major issue before any bill is put forward."
 TAI_gc_constitution_convention: "Constitutional Convention"
 TAI_gc_constitution_convention_desc: "Convene representatives of the parties and civil society to review how the constitution has worked on the mainland."
 TAI_gc_citizens_assembly: "Citizens' Assembly"
 TAI_gc_citizens_assembly_desc: "Randomly selected citizens advise on legislation, so politics is no longer only for politicians."
 TAI_gc_referendum_law: "Referendum Act"
 TAI_gc_referendum_law_desc: "Major questions are decided by referendum, with the thresholds and procedures written into law."
 TAI_gc_cross_party_cabinet: "Cross-Party Cabinet"
 TAI_gc_cross_party_cabinet_desc: "Ministers are nominated by each party in proportion to its seats, making the cabinet truly the nation's cabinet."
 TAI_gc_shadow_ministers: "Shadow Cabinet"
 TAI_gc_shadow_ministers_desc: "The opposition may also form a shadow cabinet to scrutinize every ministry."
 TAI_gc_unity_budget: "National Unity Budget"
 TAI_gc_unity_budget_desc: "The budget is drawn up by all the parties together, so no party can use it as a bargaining chip."
 TAI_gc_opposition_rights: "Rights of the Opposition"
 TAI_gc_opposition_rights_desc: "The opposition enjoys full rights of interpellation, investigation and initiative, and the rules of procedure no longer favor the ruling party."
 TAI_gc_truth_commission: "Truth Commission"
 TAI_gc_truth_commission_desc: "Set up a truth commission to investigate a century of historical injustices, not to punish individuals but to establish the facts."
 TAI_gc_joint_textbooks: "Jointly Written Textbooks"
 TAI_gc_joint_textbooks_desc: "Historians from both sides of the Strait write textbooks together, so the next generation reads the same history."
 TAI_gc_memorials: "Memorials and Cemeteries"
 TAI_gc_memorials_desc: "Build shared memorials for the dead of the civil war, whichever side they fought on."
 TAI_gc_forgive_and_remember: "Forgive and Remember"
 TAI_gc_forgive_and_remember_desc: "‘Forgive, but do not forget’ is written into the national curriculum."
 TAI_cpc_government: "The Communist Party in Government"
 TAI_cpc_government_desc: "Now a legal opposition party, the Communist Party of China finds its place in the new political landscape: no longer a revolutionary party, but a party of government."
 TAI_cpc_party_congress: "Hold a Party Congress"
 TAI_cpc_party_congress_desc: "The legal Communist Party of China holds a National Congress and elects a new Central Committee."
 TAI_cpc_legal_status: "Legal Status"
 TAI_cpc_legal_status_desc: "The Constitutional Court confirms the Communist Party's freedom of association and defines the legal status of its assets, newspapers and party schools."
 TAI_cpc_reform_wing: "Rise of the Reformers"
 TAI_cpc_reform_wing_desc: "Reformers inside the party argue for accepting parliamentary politics and taking the road of social democracy or democratic socialism."
 TAI_cpc_workers_unions: "Unions and Farmers' Associations"
 TAI_cpc_workers_unions_desc: "The Communist Party puts its strength into unions, farmers' associations and workers' congresses, letting organization do the talking."
 TAI_cpc_patriots: "The Patriotic Turn"
 TAI_cpc_patriots_desc: "Party propaganda turns to patriotism and national rejuvenation, standing with the Nationalist Government on the great cause of the nation."
 TAI_cpc_market_socialism: "Market Socialism"
 TAI_cpc_market_socialism_desc: "Accept the role of the market while keeping public ownership in the key industries that matter to the people's livelihood."
 TAI_cpc_new_democracy: "New Democracy"
 TAI_cpc_new_democracy_desc: "Bring back ‘New Democracy’: many forms of ownership side by side, and many parties sharing in government."
 TAI_cpc_era: "The Red Flag and the Blue Sky"
 TAI_cpc_era_desc: "The Red Flag and the Blue Sky, White Sun and Wholly Red Earth fly side by side under the same sky: the Communist Party of China has completed its transformation under a multi-party system."
 TAI_cpc_cadre_discipline: "Cadre Discipline"
 TAI_cpc_cadre_discipline_desc: "Hold cadres to party discipline, strictly forbidding graft, privilege and feudal habits."
 TAI_cpc_party_school: "Party School Reform"
 TAI_cpc_party_school_desc: "The party schools no longer teach only dogma; they now offer courses in economics, law and public administration."
 TAI_cpc_anticorruption: "The Anti-Corruption Tradition"
 TAI_cpc_anticorruption_desc: "Revive the anti-corruption tradition of the Yan'an years and make honesty the party's calling card."
 TAI_cpc_inner_democracy: "Inner-Party Democracy"
 TAI_cpc_inner_democracy_desc: "Party leaders at every level are elected by the members, and the party no longer speaks with only one voice."
 TAI_cpc_land_reform_memory: "Old Revolutionary Areas and Land Reform"
 TAI_cpc_land_reform_memory_desc: "Keep pushing for sensible land use in the old revolutionary base areas and protect farmers' basic rights."
 TAI_cpc_trade_union_law: "Trade Union Act"
 TAI_cpc_trade_union_law_desc: "Push to revise the Trade Union Act so workers have organizations that truly represent them."
 TAI_cpc_village_cooperatives: "Village Cooperatives"
 TAI_cpc_village_cooperatives_desc: "Develop cooperatives that farmers join of their own free will, so smallholders can share in economies of scale."
 TAI_cpc_social_safety: "Basic Social Security"
 TAI_cpc_social_safety_desc: "Let the state budget provide a floor: pensions, health care and housing, the most basic security everyone deserves."
 TAI_cpc_peaceful_rise: "Peaceful Rise"
 TAI_cpc_peaceful_rise_desc: "The Communist Party calls for national rejuvenation by peaceful means and opposes any foreign interference in China's internal affairs."
 TAI_cpc_overseas_ties: "Ties with the Overseas Left"
 TAI_cpc_overseas_ties_desc: "Keep in touch with left-wing parties, unions and intellectuals abroad, opening channels for international cooperation."
 TAI_cpc_one_china_consensus: "The One China Consensus"
 TAI_cpc_one_china_consensus_desc: "On ‘One China’, the Kuomintang and the Communists do not disagree: China must be one, unified China."
 TAI_cpc_national_rejuvenation: "National Rejuvenation"
 TAI_cpc_national_rejuvenation_desc: "Make a strong nation and a rejuvenated people the common goal of every party."
 TAI_gov_cpc_tt: "The §YCommunist Party of China§! has governed before, or is in a governing coalition now"
 TAI_cpc_government_idea: "The Communist Party in Government"
 TAI_cpc_government_idea_desc: "The legal Communist Party of China has become a major force in parliament, and the voices of workers' and farmers' organizations and intellectuals are easier to hear."
 TAI_cpc_era_idea: "The Red Flag and the Blue Sky"
 TAI_cpc_era_idea_desc: "The Communist Party has become a party of government in a multi-party system, and the Nationalist Government and the Communists share a common language on national unity and rejuvenation."
 TAI_party_alternation_idea: "Alternation in Power"
 TAI_party_alternation_idea_desc: "Handing over power between parties has become normal, and every party competes and cooperates within the constitution."
 TAI_two_party_lines_tt: "At least §Ytwo§! party lines have completed their final focus (Kuomintang, Democratic Party, Social Democrats, Grand Coalition, Communist Party)"
 CSW_cross_strait_war: "Cross-Strait Civil War"
 CSW_cross_strait_war_desc: "Civil war has broken out on the mainland, drawing in both sides of the Strait. The Kuomintang and the Communists both need an answer to this war."
 CSW_ccp_martial_law: "Martial Law and Stability"
 CSW_ccp_martial_law_desc: "Impose martial law in the affected provinces, keep order in the major cities, and contain the unrest locally."
 CSW_ccp_mobilize_pla: "Mobilize the PLA"
 CSW_ccp_mobilize_pla_desc: "The military regions go on a war footing, reserves are mobilized, and the army starts to repair a command structure thrown into disorder by the civil war."
 CSW_ccp_purge_traitors: "Purge the Traitors"
 CSW_ccp_purge_traitors_desc: "Hunt down those who passed information to the rebels and Taiwan, and purge the disloyal from the party and the army."
 CSW_ccp_blockade_rebels: "Blockade the Rebels"
 CSW_ccp_blockade_rebels_desc: "Cut the rebels' supply lines and grain shipments so their regime collapses economically first."
 CSW_ccp_seek_russia: "Seek Help from Russia and North Korea"
 CSW_ccp_seek_russia_desc: "Ask Russia and North Korea for political and material support in exchange for their backing on the world stage."
 CSW_ccp_strait_deterrence: "Strait Deterrence"
 CSW_ccp_strait_deterrence_desc: "The Eastern Theater Command holds large-scale exercises in the Taiwan Strait and fires missiles, sending Taipei a clear warning."
 CSW_ccp_total_war: "Total War"
 CSW_ccp_total_war_desc: "The whole country moves to a wartime footing: factories run flat out, grain is rationed, and everything serves to put down the rebellion."
 CSW_ccp_restore_order: "Put Down the Rebellion"
 CSW_ccp_restore_order_desc: "The uprising has been crushed and the rebel provinces are back under central control. Once again, the party and the state have survived the test."
 CSW_tai_volunteer_corps: "Form a Volunteer Corps"
 CSW_tai_volunteer_corps_desc: "Build a ‘Republic of China Volunteer Corps’ around veterans and reservists, sent to fight on the mainland as volunteers."
 CSW_tai_arm_rebels: "Arms Support"
 CSW_tai_arm_rebels_desc: "Ship weapons, ammunition and artillery from our stocks to the mainland rebels by sea and through third countries."
 CSW_tai_armed_intervention: "Armed Intervention"
 CSW_tai_armed_intervention_desc: "No more calling ourselves volunteers: the National Army goes into battle directly as an ally of the rebels, but does not yet reorganize or annex them."
 CSW_tai_recognize: "Recognize the Provisional Government"
 CSW_tai_recognize_desc: "Formally recognize the ‘Provisional Mainland Government of the Republic of China’ and send advisers to help it build an administration."
 CSW_tai_intel_ops: "Intelligence Infiltration"
 CSW_tai_intel_ops_desc: "The Military Intelligence Bureau activates its whole network on the mainland: subversion, sabotage and intelligence gathering all at once."
 CSW_tai_us_backing: "Win American Acquiescence"
 CSW_tai_us_backing_desc: "Explain to Washington that this is a democratic uprising, and that Taipei needs its acquiescence, not its intervention."
 CSW_tai_psychological_war: "Psychological Warfare Broadcasts"
 CSW_tai_psychological_war_desc: "Step up radio and online propaganda aimed at the mainland to break the enemy's morale and public support."
 CSW_tai_logistics_bridge: "A Bridge Across the Sea"
 CSW_tai_logistics_bridge_desc: "Organize merchant ships and navy transports into a sea supply line from Kaohsiung to Fujian."
 CSW_tai_join_the_war: "Unified Command"
 CSW_tai_join_the_war_desc: "Taipei and the mainland rebels set up a unified wartime headquarters, and the National Army fights side by side with the rebel armies."
 CSW_intl_lobby: "International Lobbying"
 CSW_intl_lobby_desc: "Every side is fighting for world opinion: who is defending unity, and who is splitting the country?"
 CSW_humanitarian_corridor: "Humanitarian Corridors"
 CSW_humanitarian_corridor_desc: "Open humanitarian corridors for civilians in the war zones and let the Red Cross into the stricken cities."
 CSW_ceasefire_talks: "Ceasefire Talks"
 CSW_ceasefire_talks_desc: "With a third country mediating, representatives of both sides sit down to discuss a ceasefire."
 CSW_new_order: "A New Postwar Order"
 CSW_new_order_desc: "The war is over. What kind of country will start again? Whoever wins, rebuilding order comes next."
 CSW_total_war_idea: "Total War"
 CSW_total_war_idea_desc: "The whole country moves to a wartime footing: factories run flat out, grain is rationed, and everything serves to put down the rebellion."
 CSW_ccp_request_aid: "CCP Request for Aid"
 CSW_tai_lobby_us: "Taipei's Lobbying"
 ROC_order_blue_sky_white_sun: "Order of the Blue Sky and White Sun"
 ROC_order_blue_sky_white_sun_desc: "The highest military decoration of the Republic of China, awarded to officers who distinguish themselves in defending the nation and defeating its enemies."
 ROC_order_precious_tripod: "Order of the Precious Tripod"
 ROC_order_precious_tripod_desc: "Named after the precious tripod, a symbol of the state, it is awarded to servicemen who make special contributions to national defense."
 ROC_order_cloud_and_banner: "Order of the Cloud and Banner"
 ROC_order_cloud_and_banner_desc: "Awarded to officers and soldiers of the army, navy and air force for merit in battle and outstanding command."
 ROC_medal_loyalty_and_valor: "Medal of Loyalty and Valor"
 ROC_medal_loyalty_and_valor_desc: "Awarded to officers and soldiers who fight with loyalty and courage, heedless of their own safety."
 ROC_order_independence_freedom: "Order of Independence and Freedom"
 ROC_order_independence_freedom_desc: "Awarded to officers and soldiers who defend the nation's independence under the banner of democracy and freedom."
 ROC_order_liberation: "Order of Liberation"
 ROC_order_liberation_desc: "Awarded to officers and soldiers who earn distinction in the war of liberation and the recovery of the national territory."
 ### v3.22 叙利亚内战与各方扩展
 SYRX_siege_strategy_idea: "Siege and Starvation"
 SYRX_siege_strategy_idea_desc: "Siege, starvation and bombardment force rebel-held areas to surrender. The regime keeps the cities, at a humanitarian and diplomatic cost."
 SYRX_reconciliation_idea: "Local Reconciliation"
 SYRX_reconciliation_idea_desc: "Local ceasefires and evacuation deals send fighters and their families to Idlib in exchange for calm in the cities and suburbs."
 SYRX_ndf_idea: "National Defense Forces and Militias"
 SYRX_ndf_idea_desc: "The National Defense Forces (NDF) bring local pro-government militias under a single command, securing both manpower and loyalty."
 SYRX_axis_idea: "Axis of Resistance"
 SYRX_axis_idea_desc: "Iran's Revolutionary Guards, Hezbollah and Shia militias enter Syria and become the regime's shock troops on the battlefield."
 SYRX_russia_idea: "Russian Aerospace Forces"
 SYRX_russia_idea_desc: "Russian forces at Hmeimim air base and the port of Tartus provide air strikes, reconnaissance and diplomatic cover for the ground forces."
 SYRX_chem_deal_idea: "Destroying the Chemical Weapons"
 SYRX_chem_deal_idea_desc: "The regime has joined the Chemical Weapons Convention, buying itself a diplomatic buffer with Russia and the international community."
 SYRX_war_economy_idea: "War Economy"
 SYRX_war_economy_idea_desc: "Food, fuel and foreign currency all serve the war: rationing, black markets and warlord interests exist side by side."
 SYRF_council_idea: "National Council"
 SYRF_council_idea_desc: "The exiled opposition forms a National Council in Istanbul as its political representation abroad."
 SYRF_local_councils_idea: "Local Revolutionary Councils"
 SYRF_local_councils_idea_desc: "Local councils in the liberated areas have taken over schools, bakeries and courts, the seeds of a new order."
 SYRF_turkey_idea: "Turkish Protection"
 SYRF_turkey_idea_desc: "Turkey provides rear bases, refugee camps and military training, and the opposition depends ever more on Ankara."
 SYRF_sna_idea: "Syrian National Army"
 SYRF_sna_idea_desc: "The Turkish-backed coalition has been reorganized into the Syrian National Army, the regular force of the liberated north."
 SYRN_salvation_gov_idea: "Salvation Government"
 SYRN_salvation_gov_idea_desc: "Idlib's Salvation Government has set up ministries, courts, police and a tax office, becoming a de facto state."
 SYRN_command_idea: "Unified Command"
 SYRN_command_idea_desc: "The factions have been merged into a single operations command, and elite assault units are the main force on the battlefield."
 SYRN_crossings_idea: "Border Crossings"
 SYRN_crossings_idea_desc: "Transit fees and trade at the Bab al-Hawa crossing make Idlib's finances steadier than those of many states."
 SYR_ext_fsa_aid: "Support for the Syrian Opposition"
 SYR_ext_assad_crimes: "Atrocities of the Syrian Regime"
 SYR_ext_russia_ally: "Russo-Syrian Military Alliance"
 SYR_ext_iran_ally: "Irano-Syrian ‘Axis of Resistance’"
 SYR_ext_turkey_ally: "Turkey Backs the Opposition"
 SYR_ext_isis_hate: "Hatred of the ‘Islamic State’"
 SYRX_tb_armor: "Rebuilding Armored Vehicles"
 SYRF_tb_atgm: "Anti-Tank Missiles"
 SYRX_tb_aa: "Restoring Air Defenses"
 SYRL_baath_ideals_idea: "The Founding Ideals of the Ba'ath"
 SYRL_baath_ideals_idea_desc: "Unity, freedom, socialism: the three slogans of the party's founding in 1947, hollowed out by decades of family rule. Now the President means to recover them."
 SYRL_no_dynasty_idea: "Ending Family Rule"
 SYRL_no_dynasty_idea_desc: "Relatives no longer hold key posts: assets must be declared, contracts must be tendered, and the army and intelligence services belong to the state, not to any one family name."
 SYRL_merit_idea: "Cadre Evaluation"
 SYRL_merit_idea_desc: "Promotion depends on exams, performance and public assessment, not on birth or family ties."
 SYRL_land_idea: "New Land Reform"
 SYRL_land_idea_desc: "Lease idle state land to landless farmers and set up agricultural cooperatives, winning the countryside back to the Ba'ath."
 SYRL_plan_idea: "Planning and the Public Sector"
 SYRL_plan_idea_desc: "Restart the State Planning Commission and return energy, cement, fertilizer and textiles to the state."
 SYRL_coop_idea: "Cooperatives and Worker Participation"
 SYRL_coop_idea_desc: "Worker representatives sit on enterprise management committees, and farmers' cooperatives sell grain directly to the state."
 SYRL_welfare_idea: "Universal Health Care and Education"
 SYRL_welfare_idea_desc: "Free hospitals and universities are among the Ba'ath's most precious legacies."
 SYRL_npf_idea: "A Real National Progressive Front"
 SYRL_npf_idea_desc: "The Communists, the Arab Socialist Union, the Socialist Unionists and the Ba'ath deliberate at the same table, instead of the Ba'ath deciding alone."
 SYRL_union_idea: "Independent Unions and Peasants' Federation"
 SYRL_union_idea_desc: "The unions and the Peasants' Federation are no longer mere mouthpieces; wages and procurement prices can be negotiated."
 SYRL_civil_idea: "A Civic State"
 SYRL_civil_idea_desc: "The constitution states that all are equal before the law, regardless of sect or ethnicity. Alawites, Sunnis, Christians and Kurds are all Syrian citizens."
 SYR_ext_left_baath: "Ba'athist Arab Solidarity"
 SYRB_security_state_idea: "Security State"
 SYRB_security_state_idea_desc: "The intelligence services are more powerful than ever: stability comes before everything, and opponents and reformers alike are on the lists."
 SYRB_social_market_idea: "Social Market Economy"
 SYRB_social_market_idea_desc: "The Ba'ath's Tenth Regional Congress in 2005 adopted the ‘social market economy’: banks, insurance and universities opened to private capital, and the state no longer runs everything."
 SYRB_tb_medical: "Medical and Research Investment"
 roc_asia.70.a: "Confiscate it and put it out to open tender"
 roc_asia.70.b: "Leave some of it, in exchange for silence"
 roc_asia.70.t: "The Tycoons' Assets"
 roc_asia.70.d: "Prosecutors have opened the books of the family's companies: telecom licenses, oil revenue shares, duty-free shops. The President orders it all confiscated, the proceeds paid into the treasury, and the contracts put out to open tender. His relatives have left the capital in a rage."
 roc_asia.71.a: "Adopt the reform program"
 roc_asia.71.b: "Keep some of the old rules"
 roc_asia.71.t: "The Ba'ath Party's Eleventh Congress"
 roc_asia.71.d: "The hall argued late into the night: the old guard wanted to keep the party's ‘leading role’, while young delegates demanded direct elections for local branches. Finally the President took the podium: ‘The party belongs to the people, not to any one man.’ The applause began."
 roc_asia.72.a: "Adopt the conference's proposals"
 roc_asia.72.b: "Adopt only some of them"
 roc_asia.72.t: "National Dialogue Conference"
 roc_asia.72.d: "In a conference hall in Damascus sit Ba'athists, Communists, Nasserists, Christian bishops, Sunni scholars and Kurds. The conference argued for three days, and reached some consensus too."
 roc_asia.73.a: "Adopted"
 roc_asia.73.t: "The New Ba'athist Republic"
 roc_asia.73.d: "The President walks into parliament and reads the new national charter to the deputies. Article One: ‘The state belongs to all Syrian citizens.’ Article Two: ‘No one's relatives may inherit public office.’"
 roc_asia.60.a: "Accept the disarmament deal"
 roc_asia.60.b: "Deny all accusations"
 roc_asia.60.t: "Gas in Eastern Ghouta"
 roc_asia.60.d: "Before dawn, residents of Eastern Ghouta were choked to death by gas; more than a thousand died. Washington says a ‘red line’ has been crossed. Moscow offers a compromise: the regime hands over its chemical weapons and the strikes are called off."
 roc_asia.61.a: "Welcome the Russians"
 roc_asia.61.b: "Stay cautious"
 roc_asia.61.t: "Russian Jets Arrive at Hmeimim"
 roc_asia.61.d: "At dawn, the first Su-24 and Su-34 jets landed at Hmeimim. Moscow announced that, at the request of Syria's legitimate government, the Russian Aerospace Forces will carry out air strikes against terrorist organizations."
 roc_asia.62.a: "Sign the memorandum"
 roc_asia.62.t: "The Astana De-Escalation Zones"
 roc_asia.62.d: "Russia, Iran and Turkey sign a memorandum on de-escalation zones in Astana: the front lines are frozen where they are, air strikes are paused, and humanitarian corridors open."
 roc_asia.63.a: "Continue the transformation"
 roc_asia.63.b: "Stay hard-line"
 roc_asia.63.t: "The Transformation of HTS"
 roc_asia.63.d: "Al-Julani appears on camera in a suit: HTS is a Syrian armed movement, not an outpost of global jihad. New political posters are appearing on the streets of Idlib."
 roc_asia.64.a: "Fight side by side"
 roc_asia.64.b: "Keep an independent command"
 roc_asia.64.t: "Turkish Troops Cross the Border"
 roc_asia.64.d: "Turkish tanks have crossed the border, and the flags of the Free Syrian Army fly alongside Turkish flags. In this ‘Euphrates Shield’, who is really in charge?"
 roc_asia.69.a: "Good news"
 roc_asia.69.t: "Chemical Stockpile Eliminated"
 roc_asia.69.d: "International inspectors report that Syria's declared chemical weapons stockpile has been completely destroyed. The Western military threat has receded for now."
 SYRB_iran_pact_idea: "Strategic Pact with Iran"
 SYRB_iran_pact_idea_desc: "A defense cooperation agreement, visa-free travel and joint industrial projects: Iran has become Damascus's most important ally, and a new rift with the Gulf states."
 SYRB_turkey_idea: "Syrian-Turkish Honeymoon"
 SYRB_turkey_idea_desc: "Visa-free travel, a free trade area and joint cabinet meetings: Syrian-Turkish border trade has multiplied in a few short years."
 SYRB_drought_idea: "Drought and Rural Crisis"
 SYRB_drought_idea_desc: "The drought of 2006 to 2010 has ruined farming in the northeast, and hundreds of thousands of farmers have flooded into Daraa and the suburbs of Damascus."
 SYRL_pension_idea: "Universal Pensions and Social Insurance"
 SYRL_pension_idea_desc: "A unified pension covering farmers and the self-employed is the welfare promise the Ba'athist left values most."
 SYRL_self_reliance_idea: "Self-Reliance Program"
 SYRL_self_reliance_idea_desc: "Replace imports with our own steel, cement, textiles and fertilizer: the heavier the sanctions, the more we must do for ourselves."
 SYRL_media_idea: "Public Media and Oversight"
 SYRL_media_idea_desc: "Public broadcasting becomes an independent body overseen by parliament, and private newspapers receive publishing licenses."
 SYRB_tb_edu: "Higher Education and Startups"
 roc_asia.74.a: "Accept reality"
 roc_asia.74.b: "Stress our special relationship with Lebanon"
 roc_asia.74.t: "The Last Army Truck"
 roc_asia.74.d: "In April 2005, the last Syrian army vehicles crossed the border. The streets of Lebanon erupted in celebration, while state television in Damascus called it ‘a redeployment between brothers’."
 roc_asia.75.a: "Admit the problems and announce reforms"
 roc_asia.75.b: "Crack down hard"
 roc_asia.75.t: "Slogans on a Phone"
 roc_asia.75.d: "A street vendor in Tunisia set himself on fire. Children in Daraa wrote on a wall: ‘It's your turn, Doctor.’ The Presidential Palace says it is all a plot by foreign powers."
 SYRL_tb_edu: "Compulsory Education"
 roc_asia.76.a: "Adopt the charter"
 roc_asia.76.t: "Drafting the Charter"
 roc_asia.76.d: "On the last day of the National Dialogue Conference, the delegates vote on the new national charter article by article. When Article One passes, there is a burst of applause; when Article Thirty-Seven, on presidential terms, passes, the hall stays silent for a long time."
 ISIX_caliphate_idea: "The Caliphate"
 ISIX_caliphate_idea_desc: "Al-Baghdadi climbed into the pulpit of the Great Mosque of Mosul and proclaimed the caliphate: every Muslim in the world, he declared, owes it allegiance."
 ISIX_hisbah_idea: "Religious Police"
 ISIX_hisbah_idea_desc: "Hisbah patrols enforce sharia in every neighborhood: dress, prayer, tobacco and alcohol. Residents seethe in silence."
 ISIX_oil_idea: "Oil Smuggling"
 ISIX_oil_idea_desc: "Tanker convoys leave the oil fields of Deir ez-Zor and flow through smuggling networks on the Turkish border into the black market."
 ISIX_media_idea: "Propaganda Machine"
 ISIX_media_idea_desc: "Dabiq magazine, high-definition execution videos and social media have turned an organization into a global symbol of fear."
 ISIX_foreign_fighters_idea: "Foreign Fighters"
 ISIX_foreign_fighters_idea_desc: "Tens of thousands of volunteers from Europe, Central Asia and North Africa pour into the caliphate across the Turkish border."
 ISIX_tunnels_idea: "Tunnels and Defense in Depth"
 ISIX_tunnels_idea_desc: "Tunnels, snipers, car bombs and mines turn every city into a fortress."
 ISIX_underground_idea: "Going Underground"
 ISIX_underground_idea_desc: "Having lost its territory, the organization turns to guerrilla war and terror, and waits for its next chance."
 ROJX_democratic_confederalism_idea: "Democratic Confederalism"
 ROJX_democratic_confederalism_idea_desc: "Gender equality, local councils and multi-ethnic self-rule: Rojava's social contract is testing a new kind of politics in the middle of war."
 ROJX_women_idea: "Co-Chairs and Women's Units"
 ROJX_women_idea_desc: "Every institution has a male and a female co-chair, and the Women's Protection Units have become a symbol on the battlefield."
 ROJX_ypg_idea: "People's Protection Units"
 ROJX_ypg_idea_desc: "The fighters of the YPG and YPJ have grown into a disciplined force through the battles of Kobani, Raqqa and Deir ez-Zor."
 ROJX_coalition_idea: "Coalition Air Support"
 ROJX_coalition_idea_desc: "The US-led coalition provides air strikes, reconnaissance and special forces advisers for the ground offensives."
 ROJX_oil_idea: "The Eastern Oil Fields"
 ROJX_oil_idea_desc: "The Autonomous Administration controls the eastern oil fields and hydroelectric dams, its most important sources of revenue."
 ROJX_camps_idea: "Prison and Displacement Camps"
 ROJX_camps_idea_desc: "Tens of thousands of Islamic State family members and prisoners are held in the camps, and the Autonomous Administration bears the security and humanitarian burden without international help."
 ROJX_turkey_pressure_idea: "Turkish Pressure"
 ROJX_turkey_pressure_idea_desc: "Ankara sees the autonomous region as an extension of a terrorist organization, and the shelling and cross-border raids never stop."
 SYR_ext_isis_war: "Hostility toward the ‘Islamic State’"
 SYR_ext_ypg_aid: "Support for the Syrian Democratic Forces"
 SYR_ext_tur_pkk: "Turkish Hostility toward the PKK"
 ISIX_tb_captured: "Captured Heavy Weapons"
 ISIX_tb_drone: "Drones and Booby Traps"
 roc_asia.65.a: "Proclaim the caliphate"
 roc_asia.65.t: "A Caliph in Mosul"
 roc_asia.65.d: "Al-Baghdadi climbed into the pulpit of the Great Mosque of al-Nuri in Mosul and proclaimed the founding of the Islamic State, declaring that every Muslim in the world owes it allegiance. It is the first time anyone has claimed the title of caliph since 1924."
 roc_asia.66.a: "This is the turning point"
 roc_asia.66.t: "Spring in Kobani"
 roc_asia.66.d: "After four months of fighting, the defenders of Kobani have finally driven the Islamic State out of the city. It is the Islamic State's first defeat in a major battle, and its myth has begun to crack."
 roc_asia.67.a: "Defend the remaining areas"
 roc_asia.67.t: "The Fall of Afrin"
 roc_asia.67.d: "The Turkish army and the Syrian National Army have stormed Afrin. Hundreds of thousands of residents have fled their homes, and the Kurds accuse the world of indifference."
 roc_asia.68.a: "Wait for the right moment"
 roc_asia.68.t: "Into the Shadows"
 roc_asia.68.d: "The last stronghold has fallen. Thousands of fighters have melted into the desert and the towns, taking their weapons and their hatred with them."
 SYRX_crisis_cell: "Crisis Cell"
 SYRX_crisis_cell_desc: "The ‘rebellion’ has spread from Daraa to the whole country. The Presidential Palace sets up a crisis cell: the heads of defense, intelligence and the interior meet every day to coordinate repression and pacification."
 SYRX_defend_damascus: "Defend Damascus"
 SYRX_defend_damascus_desc: "The opposition has taken the outskirts of the capital, and shells are landing in the courtyard of the Presidential Palace. Whatever happens, Damascus must hold."
 SYRX_fourth_division: "The Fourth Armored Division and the Republican Guard"
 SYRX_fourth_division_desc: "Maher al-Assad's Fourth Armored Division and the Republican Guard are the regime's most reliable fist, deployed on the heights around the capital."
 SYRX_checkpoints: "Checkpoint Network"
 SYRX_checkpoints_desc: "Every crossroads in Damascus has a checkpoint and an informer, keeping opposition infiltration to a minimum."
 SYRX_siege_tactic: "Siege Tactics"
 SYRX_siege_tactic_desc: "Encircle, starve and bombard until the people in rebel-held areas have no choice left. The method is repeated in Homs, Eastern Ghouta and Aleppo."
 SYRX_reconciliation: "Local Reconciliation Deals"
 SYRX_reconciliation_desc: "Strike ‘reconciliation’ deals with the rebels: fighters and their families leave for Idlib with light weapons, and the towns return to the government. It is the cheaper way to retake ground."
 SYRX_reform_army: "Reorganize the Army"
 SYRX_reform_army_desc: "Defections, casualties and desertion have shrunk the Syrian Arab Army by half. It must be reorganized, with units merged and command restructured."
 SYRX_ndf: "National Defense Forces (NDF)"
 SYRX_ndf_desc: "Merge the pro-government militias across the country, the shabiha, the popular committees and the Ba'ath Brigades, into the National Defense Forces, paid and armed directly by the regime."
 SYRX_tiger_forces: "Tiger Forces"
 SYRX_tiger_forces_desc: "The ‘Tiger Forces’, built from intelligence elites, take their orders from Colonel Suheil al-Hassan of Air Force Intelligence: wherever the fight is hardest, they go."
 SYRX_airpower: "Air Power and Barrel Bombs"
 SYRX_airpower_desc: "The air force is the regime's greatest advantage over the rebels. Helicopters and jets fly day and night, drawing the fiercest international condemnation."
 SYRX_conscription: "Emergency Conscription"
 SYRX_conscription_desc: "Military service is extended and the reserves are fully mobilized. Men of fighting age either enlist or flee abroad."
 SYRX_armor_rebuild: "Rebuilding the Armor"
 SYRX_armor_rebuild_desc: "Obtain T-72s and spare parts from Russia and Iran to put the battered armored divisions back together."
 SYRX_foreign_backers: "Win Over Allies"
 SYRX_foreign_backers_desc: "An isolated regime needs friends: Iran wants its ‘Axis of Resistance’, and Russia wants its base on the Mediterranean."
 SYRX_iran_axis: "Iran and Hezbollah"
 SYRX_iran_axis_desc: "Iran's Revolutionary Guards and Lebanon's Hezbollah enter Syria, and Shia militias from Iraq and Afghanistan come to fight as well."
 SYRX_russia_intervention: "Russian Aerospace Forces Intervene"
 SYRX_russia_intervention_desc: "In September 2015, the Russian Aerospace Forces moved into Hmeimim. Within weeks, the regime's decline was reversed."
 SYRX_joint_command: "Joint Operations Command"
 SYRX_joint_command_desc: "Officers from Damascus, Tehran and Moscow work in the same operations room, pushing the front from one city to the next."
 SYRX_chemical_line: "Chemical Weapons and the ‘Red Line’"
 SYRX_chemical_line_desc: "The gas in Ghouta has caused an international outcry, and Washington says it is a red line. The regime faces a choice it cannot avoid."
 SYRX_chem_deal: "Destroy the Chemical Weapons"
 SYRX_chem_deal_desc: "Through Moscow's mediation, the regime agrees to join the Chemical Weapons Convention and hand its stockpile to the international community for destruction. The strikes are called off, and the regime gains breathing room."
 SYRX_chem_deny: "Deny and Hit Back"
 SYRX_chem_deny_desc: "The regime denies all accusations and blames the opposition for staging the attack. Western sanctions and condemnation follow, and its allies pay a higher diplomatic price."
 SYRX_new_constitution: "The 2012 Constitution"
 SYRX_new_constitution_desc: "The constitutional revision drops the article on the Ba'ath Party's leading role and provides for multi-party elections. The opposition says it is only a new cover on the same book."
 SYRX_reconciliation_ministry: "Ministry of National Reconciliation and Amnesty"
 SYRX_reconciliation_ministry_desc: "Set up a Ministry of National Reconciliation and issue amnesty decrees. Critics say the amnesties never seem to benefit the real opposition."
 SYRX_presidential_election: "The 2014 Presidential Election"
 SYRX_presidential_election_desc: "A presidential election held amid the war. The regime announces that ‘the people have chosen Assad again’; the opposition and the West refuse to recognize it."
 SYRX_astana_process: "The Astana Process and De-Escalation Zones"
 SYRX_astana_process_desc: "Under Russian, Iranian and Turkish sponsorship, Syria is divided into four ‘de-escalation zones’. The fighting dies down for now, and the front lines freeze in new places."
 SYRX_aleppo_reconquest: "Retake Aleppo"
 SYRX_aleppo_reconquest_desc: "After years of siege, eastern Aleppo returned to government hands at the end of 2016. It was the turning point of the civil war."
 SYRX_palmyra_desert: "The Desert Campaign and Palmyra"
 SYRX_palmyra_desert_desc: "Drive the Islamic State out of Palmyra and the central desert, opening the road to the Euphrates."
 SYRX_idlib_question: "The Idlib Question"
 SYRX_idlib_question_desc: "Hundreds of thousands of people and every kind of armed group have been squeezed into Idlib. An offensive means a vast humanitarian disaster; no offensive means the enclave lives on."
 SYRX_euphrates_front: "East of the Euphrates"
 SYRX_euphrates_front_desc: "Whoever holds Deir ez-Zor and the eastern oil fields decides postwar Syria's finances. The regime, the Kurds and the US military all have their eyes on the region."
 SYRX_war_economy: "War Economy"
 SYRX_war_economy_desc: "Customs duties, rationing and black markets intertwine: the regime has redistributed the nation's wealth through the war."
 SYRX_whole_syria: "A United Syria"
 SYRX_whole_syria_desc: "The regime proclaims that every inch of the country must return to the rule of Damascus."
 SYRF_council: "Syrian National Council"
 SYRF_council_desc: "In the autumn of 2011, the exiled opposition formed a National Council in Istanbul, declaring that it represents ‘the Syrian people’."
 SYRF_national_coalition: "National Coalition"
 SYRF_national_coalition_desc: "The National Council merges with other groups into the National Coalition for Syrian Revolutionary and Opposition Forces, recognized by dozens of countries."
 SYRF_geneva: "Geneva Talks"
 SYRF_geneva_desc: "UN-sponsored talks in Geneva: the regime and the opposition sit at the same table, and neither will give an inch."
 SYRF_interim_government: "Interim Government"
 SYRF_interim_government_desc: "The interim government appointed by the Coalition runs administration in the liberated areas: police, hospitals, courts and schools."
 SYRF_friends_of_syria: "Friends of the Syrian People"
 SYRF_friends_of_syria_desc: "Western and Gulf states form the ‘Friends of the Syrian People’ and promise political and material support."
 SYRF_military_council: "Supreme Military Council"
 SYRF_military_council_desc: "Defected officers and armed groups from across the country are brought together under a Supreme Military Council led by General Salim Idris."
 SYRF_defections: "Army Defections"
 SYRF_defections_desc: "Soldiers and officers defect in groups, bringing their weapons to the Free Syrian Army."
 SYRF_local_councils: "Local Revolutionary Councils"
 SYRF_local_councils_desc: "Local councils in the liberated areas have taken over bakeries, water, electricity and schools."
 SYRF_brigades: "Brigade Structure"
 SYRF_brigades_desc: "Merge scattered battalions and small bands into brigades by region, finally giving the rebels a reasonably complete command structure."
 SYRF_foreign_support: "Foreign Aid"
 SYRF_foreign_support_desc: "Without foreign aid, the Free Syrian Army would not last a few months. The question is whom to take it from, and at what price."
 SYRF_turkey_haven: "Turkish Sanctuary"
 SYRF_turkey_haven_desc: "Turkey opens its border and sets up refugee camps and training bases, becoming the opposition's most important rear area."
 SYRF_gulf_money: "Gulf Money"
 SYRF_gulf_money_desc: "Money flows in steadily from Qatar, Saudi Arabia and Kuwait, bringing each faction's ideology with it."
 SYRF_train_equip: "US Train and Equip"
 SYRF_train_equip_desc: "The CIA's Timber Sycamore program gives anti-tank missiles and training to vetted brigades, on condition that nothing ends up with the extremists."
 SYRF_extremist_question: "The Extremist Challenge"
 SYRF_extremist_question_desc: "More and more money and weapons are flowing to Salafist militias. Do we join them, fight them, or look the other way?"
 SYRF_ally_nusra: "Fight Alongside Nusra"
 SYRF_ally_nusra_desc: "On the front line, the Nusra Front is the best fighting force there is. Fighting together means accepting its ways too."
 SYRF_isolate_extremists: "Break with the Extremists"
 SYRF_isolate_extremists_desc: "Declare a clean break with al-Qaeda and the ‘Islamic State’ in exchange for continued Western aid, at the cost of fewer fighters at the front."
 SYRF_euphrates_shield: "‘Euphrates Shield’"
 SYRF_euphrates_shield_desc: "In 2016, the Turkish army and the Free Syrian Army crossed the border together to clear the Islamic State and Kurdish forces out of the north."
 SYRF_national_army: "Syrian National Army"
 SYRF_national_army_desc: "The Turkish-backed militias are reorganized into the Syrian National Army, giving the north a single chain of command."
 SYRF_liberated_aleppo_damascus: "Storm Damascus"
 SYRF_liberated_aleppo_damascus_desc: "The Free Syrian Army attacks on the northern and southern fronts at once, aiming for the capital. It is the revolution's boldest move."
 SYRF_transition_plan: "Transitional Governance Plan"
 SYRF_transition_plan_desc: "Draft a transitional charter: a transitional council takes power, the army and security services are restructured, and elections are held within two years."
 SYRF_free_syria_victory: "A Free Syria"
 SYRF_free_syria_victory_desc: "The regime has fallen. The Free Syrian Army and the National Coalition enter Damascus and begin building a new country."
 SYRN_emergence: "The Victory Front"
 SYRN_emergence_desc: "In early 2012, the ‘Support Front’ (al-Nusra) issued a statement and began attacking regime soldiers and police inside Syria."
 SYRN_build_ranks: "Elites and Shock Troops"
 SYRN_build_ranks_desc: "Build elite units around foreign fighters and veterans, capable of suicide assaults and positional warfare."
 SYRN_inghimasi: "Assault and Breakthrough"
 SYRN_inghimasi_desc: "Assault units open breaches with armored suicide vehicles, and the infantry follows close behind. The losses are huge, and so are the gains."
 SYRN_wage_war: "War of Attrition"
 SYRN_wage_war_desc: "Keep ambushing regime supply lines in the countryside and the mountains, wearing the enemy down with constant attrition."
 SYRN_sharia_courts: "Sharia Courts"
 SYRN_sharia_courts_desc: "Set up sharia courts in held territory to handle civil and criminal cases. Swift trials and cheap justice win acceptance from some residents."
 SYRN_dawa_offices: "Da'wa Offices"
 SYRN_dawa_offices_desc: "The da'wa offices run soup kitchens, schools and hospitals, and recruit new members too."
 SYRN_qaeda_oath: "Pledge Allegiance to al-Qaeda"
 SYRN_qaeda_oath_desc: "In April 2013, Nusra's leader al-Julani refused to merge into the Islamic State and instead swore allegiance to al-Qaeda's leader, al-Zawahiri."
 SYRN_break_qaeda: "Break with al-Qaeda"
 SYRN_break_qaeda_desc: "In July 2016, al-Julani announced a break with al-Qaeda and renamed the group Jabhat Fatah al-Sham, seeking wider support."
 SYRN_absorb_factions: "Absorb Other Factions"
 SYRN_absorb_factions_desc: "By force and by negotiation, bring the other armed groups in Idlib under our banner one by one."
 SYRN_fight_isis: "Fight the ‘Islamic State’"
 SYRN_fight_isis_desc: "The conflict with the Islamic State has escalated from insults to all-out war, and Nusra has become one of the forces resisting it."
 SYRN_hts_formation: "Hay'at Tahrir al-Sham (HTS)"
 SYRN_hts_formation_desc: "In early 2017, Jabhat Fatah al-Sham joined with several factions to form Hay'at Tahrir al-Sham."
 SYRN_take_idlib: "Take Control of Idlib"
 SYRN_take_idlib_desc: "From 2015 onward, Idlib province gradually fell into HTS hands. It will become the center of its rule."
 SYRN_salvation_government: "Salvation Government"
 SYRN_salvation_government_desc: "Set up a Salvation Government with ministries, courts, police and a tax office, the de facto government of Idlib."
 SYRN_border_crossings: "Border Crossings"
 SYRN_border_crossings_desc: "Control the Bab al-Hawa crossing and tax the goods passing through, bringing in millions of dollars a month."
 SYRN_turkey_pragmatism: "An Understanding with Turkey"
 SYRN_turkey_pragmatism_desc: "Turkey has observation posts in Idlib, and HTS and Ankara keep a delicate understanding."
 SYRN_moderate_image: "A ‘Moderate’ Image"
 SYRN_moderate_image_desc: "Drop the radical slogans, reach out to the West and the neighbors, and present ourselves as the armed force of the Syrian people rather than part of global jihad."
 SYRN_battle_for_damascus: "March on Damascus"
 SYRN_battle_for_damascus_desc: "HTS takes the riskiest step of all: an offensive south from Idlib to fight for power at the center."
 SYRN_syria_for_syrians: "Syria for the Syrians"
 SYRN_syria_for_syrians_desc: "HTS dissolves its banner and becomes a national political force, proposing to build a ‘new Syria’."
 SYRX_sanctions: "The Caesar Act and Economic Collapse"
 SYRX_sanctions_desc: "The 2020 Caesar Act has cut off reconstruction money. The pound has collapsed overnight, and people queue for bread and petrol. The regime's enemies are no longer only on the battlefield."
 SYRX_captagon: "Captagon and the Gray Economy"
 SYRX_captagon_desc: "Syria has become one of the world's biggest producers of amphetamines, and the export income feeds half the regime. Its neighbors have started calling it a ‘narco-state’."
 SYRX_arab_league_return: "Return to the Arab League"
 SYRX_arab_league_return_desc: "In 2023, Syria returned to its seat in the Arab League after twelve years. The Gulf states are betting that isolation doesn't work and a deal does."
 SYRX_israeli_strikes: "Israeli Air Strikes and Air Defense"
 SYRX_israeli_strikes_desc: "Israeli jets repeatedly strike around Damascus and along Iranian supply lines, and the regime's air defenses are stretched thin."
 SYRX_reconstruction_plan: "Reconstruction Blueprint"
 SYRX_reconstruction_plan_desc: "Bombed-out districts, burned fields and factories without power: reconstruction needs ten times the money the regime has. Whoever pays gets the contracts."
 SYRX_refugee_return: "Refugee Return Program"
 SYRX_refugee_return_desc: "Six million Syrians fled abroad. The regime calls on them to come home, but people remember why they left."
 SYRF_southern_front: "Southern Front"
 SYRF_southern_front_desc: "The rebel forces of Daraa and Quneitra keep in touch with Jordanian and American intelligence and present a relatively moderate, secular face."
 SYRF_sdf_talks: "Talks with the Kurdish Forces"
 SYRF_sdf_talks_desc: "The Kurds of northern Syria hold weapons and oil fields. Ally with them, fight them, or keep our distance?"
 SYRN_sochi: "The Sochi Agreement and Observation Posts"
 SYRN_sochi_desc: "In 2018, Russia and Turkey agreed to draw a buffer zone, with Turkish observation posts inside Idlib. HTS survives squeezed between two great powers."
 SYRN_delisting: "Shed the ‘Terrorist’ Label"
 SYRN_delisting_desc: "HTS sends envoys to lobby the West: we care only about Syria. To shed the label, it must first prove it is not an al-Qaeda branch."
 SYRB_consolidate: "Consolidating Power"
 SYRB_consolidate_desc: "Three years after succeeding his father, the President finally has power in his own hands: the old guard has left the stage, and the family and the army stand behind him. Now he must decide what to do with it."
 SYRB_security_state: "Security State"
 SYRB_security_state_desc: "The Damascus Spring is over: the salons are shut and the dissidents taken away. The intelligence services say stability matters more than freedom."
 SYRB_open_economy: "Economic Opening"
 SYRB_open_economy_desc: "The President is an eye doctor and head of the computer society. He believes that once the economy opens, politics will follow."
 SYRB_baath_benefits: "Ba'ath Privileges"
 SYRB_baath_benefits_desc: "Party members' children come first for school places, housing and jobs. The Ba'ath is the state, and the state is the Ba'ath."
 SYRB_personal_cult: "Personality Cult"
 SYRB_personal_cult_desc: "New portraits of the President appear on the streets: from doctor to ‘the young hope’, the propaganda department crafts him a new image."
 SYRB_old_guard_balance: "Balancing the Old Guard"
 SYRB_old_guard_balance_desc: "His father's old guard, Khaddam, Shihabi and Zuabi, still hold key posts in intelligence and the army. Either win them over, or replace them step by step."
 SYRB_cosmetic_reforms: "Cosmetic Reforms"
 SYRB_cosmetic_reforms_desc: "The Party Congress adopts a program of ‘development and modernization’: a new charter and new slogans, with the power structure unchanged."
 SYRB_mb_talks: "An Understanding with the Muslim Brotherhood"
 SYRB_mb_talks_desc: "Since 1982, the Brotherhood has been treated as enemy number one. Now the regime is willing to let its exiled elders come home in exchange for their silence."
 SYRB_social_market: "Social Market Economy"
 SYRB_social_market_desc: "Open the door to private banks, insurance and universities, cut tariffs and welcome foreign capital. Officials say it is the capitalists' turn to be the ‘new class’."
 SYRB_anticorruption: "Anti-Corruption Campaign"
 SYRB_anticorruption_desc: "The President announces a drive against corruption: several ministers fall, but not one of the relatives named is on the list."
 SYRB_free_media: "Private Media and the Internet"
 SYRB_free_media_desc: "The first private newspapers, satellite channels and internet cafes appear. Censorship has not gone away; it has just become subtler."
 SYRB_electoral_reform: "Electoral Reform"
 SYRB_electoral_reform_desc: "Parliamentary elections now allow independent candidates, and local councils gain more power."
 SYRB_medical_investments: "Investment in Medicine and Research"
 SYRB_medical_investments_desc: "New hospitals, pharmaceutical plants and university labs are among the achievements the President most likes to boast of."
 SYRB_before_the_storm: "The Eve of the Storm"
 SYRB_before_the_storm_desc: "By 2010, Syria has private banks, mobile phones and satellite TV, and also drought, unemployment and the first protest slogans. The streets of neighboring countries are already on fire."
 SYRL_return_roots: "Back to the Roots of the Ba'ath"
 SYRL_return_roots_desc: "After taking power, the young President finds that he has inherited not just a country but a whole web of power revolving around his family. ‘Unity, freedom, socialism’: are those three words just a slogan on the wall?"
 SYRL_end_dynasty: "End Family Rule"
 SYRL_end_dynasty_desc: "‘The state is no one's family property.’ The President announces that relatives may not serve as ministers or as heads of the army and intelligence services, and a family name is no longer a path to promotion."
 SYRL_makhlouf_trial: "Settle Accounts with the Family Tycoons"
 SYRL_makhlouf_trial_desc: "Go after the telecom, oil and duty-free monopolies held by relatives such as Rami Makhlouf, confiscate the illegal gains and put the contracts out to open tender."
 SYRL_retire_old_guard: "Retirement for the Old Guard"
 SYRL_retire_old_guard_desc: "Ask Khaddam, Shihabi and the old guard of the army and party to retire with dignity, making way for younger cadres with professional backgrounds."
 SYRL_merit_cadres: "Appointment on Merit"
 SYRL_merit_cadres_desc: "Set up a National Cadre Academy, replacing ‘connections’ with exams and evaluations."
 SYRL_collective_leadership: "National Leadership Council"
 SYRL_collective_leadership_desc: "Set up a National Leadership Council of party, army and government representatives, so major decisions are no longer made by one man."
 SYRL_term_limits: "Presidential Term Limits"
 SYRL_term_limits_desc: "The constitution states that no president may serve more than two terms. Almost no republic in the Middle East has ever honored such a rule."
 SYRL_depoliticize_army: "Take the Family out of the Army"
 SYRL_depoliticize_army_desc: "The Republican Guard and the Fourth Armored Division come under the unified command of the Ministry of Defense, and officer appointments are decided by an independent personnel committee."
 SYRL_arab_socialism: "The Revival of Arab Socialism"
 SYRL_arab_socialism_desc: "Write the promise of socialism back into economic policy: land, factories and banks are there to serve the many, not to enrich the few."
 SYRL_land_reform: "New Land Reform"
 SYRL_land_reform_desc: "Lease idle state land to landless farmers and set up agricultural cooperatives, winning the countryside back."
 SYRL_public_sector: "Revive the Public Sector"
 SYRL_public_sector_desc: "Restart the State Planning Commission and return energy, cement, fertilizer and textiles to the state."
 SYRL_five_year_plan: "A New Five-Year Plan"
 SYRL_five_year_plan_desc: "Draw up a new five-year plan with public participation, putting food, electricity and housing first."
 SYRL_euphrates_basin: "Developing the Euphrates Basin"
 SYRL_euphrates_basin_desc: "The Tabqa Dam was the greatest project of the Ba'athist era. A new round of irrigation, hydropower and agro-processing projects will unfold along the valley."
 SYRL_workers_coops: "Cooperatives and Worker Participation"
 SYRL_workers_coops_desc: "Worker representatives sit on enterprise management committees, and farmers' cooperatives sell grain directly to the state."
 SYRL_welfare_state: "Universal Health Care and Education"
 SYRL_welfare_state_desc: "Free hospitals and universities are among the Ba'ath's most precious legacies. They must be repaired, and brought to the most remote villages."
 SYRL_baath_congress: "Ba'ath Party Congress"
 SYRL_baath_congress_desc: "Hold a party congress with genuinely open debate: the program, the regional leadership and the secretariat are all elected anew."
 SYRL_npf_pluralism: "A Real National Progressive Front"
 SYRL_npf_pluralism_desc: "Let the other parties in the National Progressive Front, the Communists, the Arab Socialist Union and the Socialist Unionists, have their own programs, newspapers and seats."
 SYRL_internal_democracy: "Inner-Party Democracy"
 SYRL_internal_democracy_desc: "Local branch secretaries are elected directly by the members instead of being appointed from above."
 SYRL_council_power: "Real Power for the People's Council"
 SYRL_council_power_desc: "The budget, legislation and the right to question ministers return to the People's Council. The cabinet must answer to parliament."
 SYRL_free_unions: "Independent Unions and Peasants' Federation"
 SYRL_free_unions_desc: "The unions and the Peasants' Federation may elect their own leaders and negotiate wages and procurement prices themselves."
 SYRL_press_dialogue: "Public Scrutiny"
 SYRL_press_dialogue_desc: "Newspapers can criticize ministers, and television can broadcast parliamentary debates live. The memory of the Damascus Spring is revived."
 SYRL_civil_state: "A Civic State"
 SYRL_civil_state_desc: "The constitution states that all are equal before the law, regardless of sect or ethnicity. Alawites, Sunnis, Christians and Kurds are all Syrian citizens."
 SYRL_palestine_cause: "The Palestinian Cause"
 SYRL_palestine_cause_desc: "Reaffirm the Ba'ath's position on Palestine: no recognition of the Israeli occupation, support for the refugees' return, and no deals."
 SYRL_arab_unity: "Unity: Arab Solidarity"
 SYRL_arab_unity_desc: "The Ba'ath's first slogan was ‘unity’. Revive the idea of an Arab common market, joint defense and free movement of people."
 SYRL_nonaligned: "Non-Alignment and Diverse Diplomacy"
 SYRL_nonaligned_desc: "Keep ties with Moscow, Beijing, Tehran, Ankara and Europe at once, depending on no single bloc."
 SYRL_iraq_reconcile: "Heal the Rift with the Iraqi Ba'ath"
 SYRL_iraq_reconcile_desc: "After 1966, the two Ba'ath parties in Damascus and Baghdad spent decades attacking each other. It is time to sit down and talk."
 SYRL_national_dialogue: "National Dialogue"
 SYRL_national_dialogue_desc: "Invite representatives of every party, religion and region to discuss the nation's future in the same hall."
 SYRL_people_army: "A People's Army"
 SYRL_people_army_desc: "Build an army loyal to the constitution rather than to one man, based on conscription and all-people defense."
 SYRL_left_ceasefire: "The Left's Ceasefire Plan"
 SYRL_left_ceasefire_desc: "Offer the secular and left-wing parts of the opposition a ceasefire and a share of power: autonomous councils, elections and an amnesty, on condition that they lay down their arms."
 SYRL_rebuild_people: "People's Reconstruction Committees"
 SYRL_rebuild_people_desc: "Set up reconstruction committees elected by the residents of each destroyed neighborhood, and hand over both the money and the decisions."
 SYRL_new_republic: "The New Ba'athist Republic"
 SYRL_new_republic_desc: "The President reads the new national program to parliament: the Ba'ath belongs to the people, not to any family. Unity, freedom, socialism: this time, for real."
 SYRB_iraq_war: "The Iraq War and the Refugee Wave"
 SYRB_iraq_war_desc: "In 2003, US forces invaded our neighbor. Damascus opposed the war but took in over a million Iraqi refugees, while insurgents moved in and out of Iraq through Syria."
 SYRB_lebanon_exit: "Withdraw from Lebanon"
 SYRB_lebanon_exit_desc: "After Hariri's assassination in 2005, the street demands for a Syrian withdrawal became deafening. A twenty-nine-year military presence was pulled out within weeks."
 SYRB_hezbollah_war: "The 2006 War and Hezbollah"
 SYRB_hezbollah_war_desc: "After the Israel-Lebanon war, Syria gives Hezbollah both weapons and diplomatic backing. The Axis of Resistance enjoys unprecedented prestige on the Arab street."
 SYRB_kibar: "The al-Kibar Incident"
 SYRB_kibar_desc: "In 2007, Israeli jets destroyed a mysterious facility near Deir ez-Zor. Syria refused to respond, and refused an IAEA investigation."
 SYRB_iran_pact: "Strategic Pact with Iran"
 SYRB_iran_pact_desc: "Defense cooperation, joint industry and visa-free travel. Iran is not just an ally but a major backer of the Syrian economy."
 SYRB_turkey_honeymoon: "Syrian-Turkish Honeymoon"
 SYRB_turkey_honeymoon_desc: "Ankara and Damascus scrap visas and hold joint cabinet meetings, and border trade and tourism boom for a while."
 SYRB_med_union: "Union for the Mediterranean and the EU Association Agreement"
 SYRB_med_union_desc: "Paris, Brussels and Damascus reopen talks: can Syria sign an EU association agreement? The President is received with great ceremony at the Élysée."
 SYRB_russia_arms: "Arms from Russia"
 SYRB_russia_arms_desc: "The President visits Moscow, has twenty-year-old arms debts written off, and buys air defense missiles and anti-tank weapons."
 SYRB_intel_overhaul: "Restructuring Intelligence"
 SYRB_intel_overhaul_desc: "The intelligence services are folded into a system centered on the Presidential Palace: Air Force Intelligence, Military Intelligence and Political Security each watch the others."
 SYRB_loyal_army: "A System of Army Loyalty"
 SYRB_loyal_army_desc: "Officers of the Republican Guard and the Fourth Armored Division mostly come from the same sect and the same families; the first criterion for promotion is loyalty."
 SYRB_net_control: "Internet Controls"
 SYRB_net_control_desc: "Internet cafes must register, bloggers must use their real names, and social networks are blocked. From 2007, Facebook became ‘contraband’ in Syria."
 SYRB_sectarian_balance: "Sectarian Balance"
 SYRB_sectarian_balance_desc: "Alawites, Sunnis, Christians and Druze: the regime's stability depends on making every community believe it would be worse off without the regime."
 SYRB_private_banks: "Private Banks and the Stock Exchange"
 SYRB_private_banks_desc: "The first private banks opened in 2004, and the Damascus Securities Exchange followed in 2009. The wealthy queue up to open accounts."
 SYRB_private_universities: "Private Universities and Research"
 SYRB_private_universities_desc: "Private universities, technical institutes and startup incubators spring up on the outskirts of Damascus, and young people start writing their CVs in English."
 SYRB_telecom: "Private Mobile Operators"
 SYRB_telecom_desc: "Two private operators, Syriatel and MTN, receive licenses. Mobile phones quickly replace landlines and become the regime's new gold mine."
 SYRB_old_city_tourism: "Old City Restoration and Tourism"
 SYRB_old_city_tourism_desc: "The Old City of Damascus, the Citadel of Aleppo and the ruins of Palmyra: tourism brings in 12% of GDP."
 SYRB_drought: "Drought and Rural Crisis"
 SYRB_drought_desc: "Four straight years of drought have turned the northeast's fields to dust, and farmers are flooding into the slums on the edge of the cities. The official farm statistics still look good."
 SYRB_youth_unemployment: "Youth Unemployment and Urbanization"
 SYRB_youth_unemployment_desc: "Half of all Syrians are under 25, and university graduates scroll the news in cafes. The first slogans calling for reform are being forwarded from phone to phone."
 SYRL_women_equality: "Women's Equality and Family Law Reform"
 SYRL_women_equality_desc: "Abolish reduced sentences for ‘honor crimes’, raise the legal marriage age, and give women equal rights in inheritance and guardianship."
 SYRL_secular_education: "Secular Compulsory Education"
 SYRL_secular_education_desc: "Twelve years of compulsory education with a single national curriculum, keeping religious classes separate from civics."
 SYRL_minorities_council: "Council for Religious and Ethnic Equality"
 SYRL_minorities_council_desc: "A council of Sunni, Alawite, Christian, Druze, Ismaili, Kurdish, Armenian and Assyrian representatives reviews every law touching on sect or ethnicity."
 SYRL_kurdish_citizenship: "Citizenship for the Kurds"
 SYRL_kurdish_citizenship_desc: "The 1962 census left hundreds of thousands of Kurds ‘stateless’. The new nationality law restores their citizenship and recognizes teaching and publishing in Kurdish."
 SYRL_nationalize_banks: "Nationalize Banks and Insurance"
 SYRL_nationalize_banks_desc: "Return private banks and insurers to state ownership, with the direction of credit set by the State Planning Commission."
 SYRL_price_commission: "Price Commission"
 SYRL_price_commission_desc: "Prices of staple food, fuel and medicine are published by a price commission, and merchants may not raise them at will."
 SYRL_public_housing: "Public Housing Program"
 SYRL_public_housing_desc: "Build public housing, mostly for rent, on the edge of the big cities, with priority for young couples and migrant workers."
 SYRL_rural_electrification: "Rural Electrification and Irrigation"
 SYRL_rural_electrification_desc: "Bring power lines and irrigation canals to the very last village, so farmers no longer depend on diesel pumps to water their fields."
 SYRL_progressive_tax: "Progressive Taxation"
 SYRL_progressive_tax_desc: "Big business and high earners pay higher rates, while farmers and small traders get bigger tax-free allowances."
 SYRL_pension_system: "Universal Pensions"
 SYRL_pension_system_desc: "A unified pension and social insurance system covering farmers, the self-employed and housewives."
 SYRL_oil_water: "Public Ownership of Oil and Water"
 SYRL_oil_water_desc: "Oil, gas, water and mineral wealth belong to all the people, and thirty percent of the income goes into a fund for the countryside and education."
 SYRL_national_charter: "National Charter"
 SYRL_national_charter_desc: "A new charter drafted by the National Dialogue Conference: the state belongs to all citizens, power comes from elections, the army obeys the constitution, and no president may serve more than two terms."
 SYRL_media_reform: "National Media Reform"
 SYRL_media_reform_desc: "Public broadcasting becomes an independent body overseen by parliament, and private newspapers and radio stations can apply for licenses."
 SYRL_total_defense: "All-People Defense Doctrine"
 SYRL_total_defense_desc: "Replace a confrontational arms race with mass mobilization and mountain defense: militia, reserves and the defense industry under one command."
 SYRL_south_south: "South-South Cooperation"
 SYRL_south_south_desc: "Sign energy, agriculture and health care cooperation agreements with Venezuela, Cuba, China and India."
 SYRL_solidarity: "Solidarity with Africa and Latin America"
 SYRL_solidarity_desc: "Stand with African and Latin American nations at the United Nations and in the Non-Aligned Movement."
 SYRL_self_reliance: "Self-Reliance Program"
 SYRL_self_reliance_desc: "Our answer to tightening sanctions: replace imports with domestic steel, cement, textiles and fertilizer."
 ISIX_declaration: "Proclaim the Caliphate"
 ISIX_declaration_desc: "In June 2014, the ‘Islamic State of Iraq and al-Sham’ renamed itself the ‘Islamic State’ and hailed al-Baghdadi as caliph. The border was ‘bulldozed’, and a state spanning two countries appeared on the map."
 ISIX_bayah: "The Oath of Allegiance"
 ISIX_bayah_desc: "Militias, tribes and foreign branches pledge allegiance one after another, and the caliph's name appears on banners from West Africa to Khorasan."
 ISIX_diwans: "The Diwans"
 ISIX_diwans_desc: "Set up ministries (diwans) of finance, justice, education, war and intelligence, and administrative districts organized as ‘provinces’."
 ISIX_hisbah: "Religious Police"
 ISIX_hisbah_desc: "The hisbah patrols and the sharia courts are the two pillars of the caliphate's rule over occupied territory."
 ISIX_zakat: "Zakat and Jizya"
 ISIX_zakat_desc: "Muslims pay zakat, non-Muslims pay the jizya, and traders pay ‘protection money’: the caliphate has a tax system."
 ISIX_schools: "The Caliph's Schools"
 ISIX_schools_desc: "The curriculum is replaced with religious and military training, and the children are called ‘cubs of the caliphate’."
 ISIX_media: "Propaganda Machine"
 ISIX_media_desc: "Dabiq, the Amaq news agency and social media accounts turn battlefield footage into fear around the world."
 ISIX_military_council: "Military Council"
 ISIX_military_council_desc: "Former Iraqi officers and Ba'athists form a military council that holds real command."
 ISIX_blitz: "Lightning Advance"
 ISIX_blitz_desc: "Hundreds of pickups carrying infantry race out of the desert toward the cities. The defenders often break before they even arrive."
 ISIX_inghimasi: "Shock Troops and Car Bombs"
 ISIX_inghimasi_desc: "Armored car bombs blast open a breach, shock troops storm in, and the main force follows."
 ISIX_heavy_weapons: "Captured Heavy Weapons"
 ISIX_heavy_weapons_desc: "Tanks, artillery and air defense weapons captured from the barracks of Mosul and the arsenals of Syria."
 ISIX_mosul: "Take Mosul"
 ISIX_mosul_desc: "In June 2014, a few hundred fighters seized Iraq's second city, and an Iraqi army thirty thousand strong barely resisted."
 ISIX_raqqa: "Raqqa as Capital"
 ISIX_raqqa_desc: "Raqqa becomes the caliphate's ‘capital’: administration, propaganda and the training of foreign volunteers are all centered here."
 ISIX_kobani: "The Siege of Kobani"
 ISIX_kobani_desc: "Thousands of fighters besiege a small Kurdish border town, drawing the eyes of the whole world, and coalition air strikes with them."
 ISIX_drones_ied: "Drones and IEDs"
 ISIX_drones_ied_desc: "Commercial drones drop grenades, and the ruins are riddled with booby traps."
 ISIX_tunnels: "Tunnels and Defense in Depth"
 ISIX_tunnels_desc: "Turn every city into a fortress: tunnels, snipers, mines and human shields."
 ISIX_oil_smuggling: "Oil Smuggling"
 ISIX_oil_smuggling_desc: "The oil fields of Deir ez-Zor pump tens of thousands of barrels a day, shipped through smuggling networks to Turkey and Iraq."
 ISIX_antiquities: "Antiquities and Kidnapping"
 ISIX_antiquities_desc: "Relics from Palmyra and Nimrud flow onto the black market, and foreign hostages become a source of ransom."
 ISIX_dams_grain: "Dams and Granaries"
 ISIX_dams_grain_desc: "The Tabqa Dam supplies electricity, and the surrounding plains supply grain. Control the water, and you control the people."
 ISIX_war_chest: "War Chest"
 ISIX_war_chest_desc: "The income of every department is pooled into a sizable war chest: wages, weapons and payments to keep the tribes quiet."
 ISIX_foreign_fighters: "Foreign Fighters"
 ISIX_foreign_fighters_desc: "Tens of thousands of volunteers from Europe, Central Asia and North Africa: the caliphate's most loyal shock troops, and the hardest to manage."
 ISIX_wilayat: "Overseas ‘Provinces’"
 ISIX_wilayat_desc: "Militants in Nigeria, Sinai, Libya and Khorasan declare themselves provinces of the caliphate."
 ISIX_terror_attacks: "Attacks Abroad"
 ISIX_terror_attacks_desc: "Paris, Brussels, Istanbul: the attacks carry the caliphate's war around the world, and harden the coalition's resolve."
 ISIX_lone_wolves: "Lone Wolves and Online Jihad"
 ISIX_lone_wolves_desc: "Recruit distant supporters online and have them strike in the cities where they live."
 ISIX_sinai_libya: "Sinai and Libya"
 ISIX_sinai_libya_desc: "The caliphate sets up new strongholds in Egypt's Sinai and in Sirte, Libya."
 ISIX_khorasan: "Khorasan Province"
 ISIX_khorasan_desc: "Reach out toward Afghanistan and Central Asia."
 ISIX_coalition_war: "War with the Coalition"
 ISIX_coalition_war_desc: "A coalition of more than eighty countries begins its air campaign: supply lines are cut and territory is lost piece by piece. The caliphate faces its greatest test."
 ISIX_last_stand: "The Last Stronghold"
 ISIX_last_stand_desc: "Trapped in the last few villages of the Euphrates valley, the remaining fighters choose to fight to the end."
 ISIX_underground: "Go Underground"
 ISIX_underground_desc: "Announce the abandonment of territory and scatter into hundreds of small cells, entering a phase of guerrilla war and terror."
 ISIX_embers: "Embers of the Caliphate"
 ISIX_embers_desc: "The surviving fighters endure, waiting for the next upheaval and the next failed state."
 ROJX_autonomy: "Democratic Autonomy"
 ROJX_autonomy_desc: "In 2012, Syrian government forces withdrew from the Kurdish areas of the north. The Kurds declared democratic autonomy: a ‘third way’ that belongs neither to the regime nor to the opposition."
 ROJX_social_contract: "Charter of the Social Contract"
 ROJX_social_contract_desc: "Adopt the Rojava Social Contract: three autonomous cantons, multi-ethnic self-rule, gender equality and elected councils."
 ROJX_cantons: "The Three Cantons"
 ROJX_cantons_desc: "Jazira, Kobani and Afrin each have their own administration, separated by enemy-held ground and held together by telephone."
 ROJX_councils: "People's Councils"
 ROJX_councils_desc: "People's councils at street, village and district level become the grassroots government of the autonomous region."
 ROJX_women_cochair: "The Co-Chair System"
 ROJX_women_cochair_desc: "Every institution has a male and a female co-chair. The Women's Protection Units are a symbol on the battlefield and show the world another side of the Kurds."
 ROJX_ecology: "Social Ecology"
 ROJX_ecology_desc: "Promote cooperatives, renewable energy and ecological farming, trying to build a society different from the war economy."
 ROJX_multi_ethnic: "Multi-Ethnic Self-Rule"
 ROJX_multi_ethnic_desc: "Arabs, Assyrians, Turkmen and Circassians have their own places in the councils and the armed forces."
 ROJX_ypg_ypj: "People's Protection Units"
 ROJX_ypg_ypj_desc: "The People's Protection Units (YPG) and the Women's Protection Units (YPJ) are the autonomous region's only armed forces."
 ROJX_asayish: "Security Forces (Asayish)"
 ROJX_asayish_desc: "The internal security forces handle policing, counterterrorism and intelligence, and are accused of suppressing dissent."
 ROJX_ypj_swords: "Women's Protection Units"
 ROJX_ypj_swords_desc: "Images of these women fighters appear on magazine covers around the world, and strike fear into the extremists."
 ROJX_kobani: "The Defense of Kobani"
 ROJX_kobani_desc: "In the autumn of 2014, the Islamic State besieged Kobani. With weapons airdropped by the Americans and the eyes of the world on them, the defenders held out through the winter."
 ROJX_sdf: "Syrian Democratic Forces (SDF)"
 ROJX_sdf_desc: "With the YPG at its core, join with Arab tribal forces, Assyrians and Christian militias to form the Syrian Democratic Forces."
 ROJX_tal_abyad: "Tal Abyad and Manbij"
 ROJX_tal_abyad_desc: "Link the northern border crossings with the towns on the west bank of the Euphrates, cutting the Islamic State off from the outside world."
 ROJX_raqqa_campaign: "The Raqqa Campaign"
 ROJX_raqqa_campaign_desc: "Operation ‘Wrath of Euphrates’: backed by coalition air strikes and special forces, the SDF takes the caliphate's capital."
 ROJX_deir_ezzor: "The Eastern Campaign"
 ROJX_deir_ezzor_desc: "South along the Euphrates to Deir ez-Zor: the autonomous region takes control of Syria's largest oil fields."
 ROJX_us_coalition: "The International Coalition"
 ROJX_us_coalition_desc: "US special forces and coalition air power are the SDF's most important allies, and bring it diplomatic friction with Turkey."
 ROJX_russia_channel: "A Channel to Moscow"
 ROJX_russia_channel_desc: "Russia has set up liaison points in northern Syria, and the autonomous region tries to keep room to maneuver between America and Russia."
 ROJX_damascus_talks: "Talks with Damascus"
 ROJX_damascus_talks_desc: "The autonomous region and the regime negotiate again and again over local security, the oil fields and autonomy, but never reach agreement."
 ROJX_kurdish_ties: "Relations with Iraqi Kurdistan"
 ROJX_kurdish_ties_desc: "Barzani's Kurdistan Regional Government and Rojava are brothers and rivals at once: border crossings, parties and armed forces are all points of dispute."
 ROJX_turkey_threat: "The Turkish Threat"
 ROJX_turkey_threat_desc: "Ankara sees the autonomous region as an extension of the PKK. Border shelling, drone strikes and cross-border raids keep it under constant threat."
 ROJX_olive_branch: "The Defense of Afrin"
 ROJX_olive_branch_desc: "In early 2018, the Turkish army and the Syrian National Army attacked Afrin. The autonomous region lost one canton but kept the rest."
 ROJX_peace_spring: "Peace Spring"
 ROJX_peace_spring_desc: "After the US withdrawal in 2019, the Turkish offensive pushed along the border. The Kurds had no choice but to ask Damascus for help and let government troops into the border towns."
 ROJX_oil_fields: "The Eastern Oil Fields"
 ROJX_oil_fields_desc: "Oil revenue and farm taxes are the Autonomous Administration's largest sources of income."
 ROJX_wheat: "Wheat and Cotton"
 ROJX_wheat_desc: "Jazira is Syria's breadbasket. Protect the farms, and you protect the people's livelihood."
 ROJX_reconstruction: "Rebuilding Raqqa"
 ROJX_reconstruction_desc: "Clear mines from the rubble and rebuild hospitals, schools and the water supply, rebuilding the city with the help of its own people."
 ROJX_camps: "Prison and Displacement Camps"
 ROJX_camps_desc: "Tens of thousands of Islamic State family members and prisoners remain in the camps. The Autonomous Administration asks the world to take them back, but almost no country will."
 ROJX_federal_syria: "A Federal Syria"
 ROJX_federal_syria_desc: "Propose ‘decentralized federalism’: Syria should be a federation of self-governing regions."
 ROJX_integration: "Back to Syria"
 ROJX_integration_desc: "Reach an autonomy agreement with Damascus: the region keeps its forces and administration but recognizes Syrian sovereignty."
 ROJX_independence: "The Dream of Kurdistan"
 ROJX_independence_desc: "Declare independence: a Kurdish nation-state spanning Syria, Iraq, Turkey and Iran has been the dream of generations."
 SYR_dec_pc_woo_baath: "Win Over Independents (to the Ba'ath Bloc)"
 SYR_dec_pc_woo_baath_desc: "The Presidential Palace and the intelligence services step in to persuade 6 independent deputies to join the Ba'ath bloc: businessmen, tribal sheikhs (shuyukh) and local notables, none of whom wants to be the regime's enemy."
 SYR_dec_pc_woo_npf: "Win Over Independents (to the NPF)"
 SYR_dec_pc_woo_npf_desc: "Persuade 4 independent deputies to join the allied parties of the National Progressive Front, the most obedient ‘flower vases’ in the regime's parliament."
 SYR_dec_pc_lift_emergency: "Repeal the Emergency Law"
 SYR_dec_pc_lift_emergency_desc: "The emergency law in force since 1963 has been the legal foundation of the regime's rule. In April 2011, under the pressure of mass protests, the President signed a decree repealing it."
 SYR_dec_pc_party_law: "Enact the Political Parties Law"
 SYR_dec_pc_party_law_desc: "In August 2011, the People's Council passed a Political Parties Law: new parties may be formed within the law, but organizations based on religion, tribe or region are banned."
 SYR_dec_pc_constitution: "The 2012 Constitution"
 SYR_dec_pc_constitution_desc: "Article 8 of the constitution, which made the Ba'ath the leading party of state and society, is abolished. The presidential term is seven years, renewable once, and a multi-party system is established. The referendum is held in February 2012. Amendments require a two-thirds majority of the People's Council."
 SYR_dec_pc_counter_terror: "The Counterterrorism Law"
 SYR_dec_pc_counter_terror_desc: "In 2012, parliament passed a Counterterrorism Law and set up special courts, bringing the prosecution and trial of the opposition under a counterterrorism framework. The regime gained more power, and drew sharper international condemnation."
 SYR_dec_pc_law10: "Law No. 10 (Property Law)"
 SYR_dec_pc_law10_desc: "Law No. 10 of 2018 allows reconstruction zones to be designated; owners must submit proof of title within a deadline or the land reverts to the state. Critics say it strips millions of displaced people of the right to return home."
 SYR_dec_pc_dissolve: "Dissolve the People's Council and Call Early Elections"
 SYR_dec_pc_dissolve_desc: "The constitution allows the President to dissolve parliament. When new faces are needed, or a reshuffled parliament, the Presidential Palace does just that."
 SYR_dec_pc_eid_amnesty: "Eid Amnesty"
 SYR_dec_pc_eid_amnesty_desc: "Issuing an amnesty on religious holidays is a Syrian tradition: some prisoners are released and sentences reduced, sending parliament and society a signal of easing."
 SYR_people_council_category: "People's Council"
 SYR_people_council_modifier: "People's Council"
 SYR_people_council_modifier_desc: "The Syrian People's Council's effect on political power and stability: favorable when support in parliament is above half, discounted under the regime as a ‘rubber stamp’."
 SYR_people_council_category_desc: "§LThe Syrian People's Council has 250 seats and serves four-year terms. The constitution gives it the power to legislate, approve the budget and treaties, and consent to presidential decrees; the President can dissolve it.§!"
 SYR_pc_spk_1: "Abdul Qader Qaddura"
 SYR_pc_spk_2: "Mahmoud al-Abrash"
 SYR_pc_spk_3: "Jihad Laham"
 SYR_pc_spk_4: "Hadiya Khalaf Abbas"
 SYR_pc_spk_5: "Hammouda Sabbagh"
 SYR_pc_mode_regime: "Authoritarian System"
 SYR_pc_mode_open: "Competitive Elections"
 SYR_pc_sys_reserved: "Electoral system: two thirds of the seats reserved for the National Progressive Front (Majlis al-Shaab)"
 SYR_pc_sys_multi: "Electoral system: multi-party competition (2012 Constitution)"
 SYR_pc_mark_ruling: " §G(Ruling)§!"
 SYR_pc_mark_ally: " §Y(Allied)§!"
 SYR_pc_mark_none: ""
 SYR_pc_two_thirds_tt: "The ruling coalition holds more than two thirds of the seats in the People's Council"
 SYR_pc_majority_tt: "The ruling coalition holds a majority of the seats in the People's Council"
 SYR_pc_gui_header: "§YPeople's Council, term [?SYR_pc_term|0]§! · Speaker: [SYR_pc_speaker_name] · [SYR_pc_mode_text]"
 SYR_pc_gui_gov_count: "§G[?SYR_pc_gov|0]§! / 250 seats ([?SYR_pc_support_pct|0]%)"
 SYR_pc_gui_baath: "Arab Socialist Ba'ath Party  [?SYR_pc_baath|0] seats  [?SYR_pc_baath_pct|0]%[SYR_pc_mark_baath]"
 SYR_pc_gui_npf: "NPF allied parties  [?SYR_pc_npf|0] seats  [?SYR_pc_npf_pct|0]%[SYR_pc_mark_npf]"
