 TAI_gov.1.t: "Nominate the Premier"
 TAI_gov.1.d: "The current Premier is §Y[TAI_gov_premier_name]§! ([TAI_gov_premier_party]). Under the constitution, the Premier is nominated by the President and appointed with the consent of the Legislative Yuan. The Presidential Office is considering a new candidate."
 TAI_gov.1.keep: "Keep the current Premier."
 TAI_gov.2.t: "The Legislative Yuan Rejects the Premier"
 TAI_gov.2.d: "The Legislative Yuan has narrowly voted down the President's nominee for Premier. The opposition parties held a press conference outside the chamber, hailing it as ‘a victory for the will of the people’."
 TAI_gov.2.a: "Nominate someone else."
 TAI_gov.2.b: "Dissolve the Legislative Yuan and appeal to the people!"
 TAI_gov.3.t: "Legislative Elections"
 TAI_gov.3.d: "The results of the election for the [?TAI_ly_term|0]th Legislative Yuan are in: Kuomintang [?TAI_ly_kmt|0] seats, China Democratic Party [?TAI_ly_dp|0], RCCK [?TAI_ly_sd|0], People First Party [?TAI_ly_pfp|0], Communist Party of China [?TAI_ly_cpc|0], independents and others [?TAI_ly_other|0]. The ruling coalition holds [?TAI_ly_gov|0] seats in total."
 TAI_gov.3.a: "The new Legislative Yuan takes office."
 TAI_gov.4.t: "No-Confidence Motion"
 TAI_gov.4.d: "The opposition has moved a vote of no confidence in Premier §Y[TAI_gov_premier_name]§! in the Legislative Yuan, and it has passed by majority. Under the constitution, the Premier must resign with the cabinet, or ask the President to dissolve the Legislative Yuan."
 TAI_gov.4.a: "The Premier and the cabinet resign."
 TAI_gov.4.b: "Ask the President to dissolve the Legislative Yuan and hold new elections."
 TAI_gov_nominate_premier: "Nominate the Premier"
 TAI_gov_nominate_premier_desc: "The President nominates a new Premier, subject to the consent of the Legislative Yuan."
 TAI_gov_dissolve_ly: "Dissolve the Legislative Yuan"
 TAI_gov_dissolve_ly_desc: "Under a minority government, ask the President to dissolve the Legislative Yuan and call an early election."
 TAI_gov_lobby_legislators: "Lobby Legislators"
 TAI_gov_lobby_legislators_desc: "Party whips and ministers without portfolio call on independent and opposition legislators one by one, trading local project funds and committee seats for their support."
 TAI_gov_lobby_legislators_tt: "The ruling party gains §G+2 to 6§! seats in the Legislative Yuan (independents first, then defectors from the largest opposition party)"
