 roc_return.81.t: "CCP Uprising"
 roc_return.81.d: "Armed uprisings have broken out at once across the Northeast and North China. The CCP remnants proclaim that ‘the People's Republic of China has not perished’ and call on the whole nation to overthrow the Nationalist Government. Shenyang, Changchun and Harbin have fallen one after another."
 roc_return.81.a: "Suppress the rebellion and save the nation!"
 roc_return.82.t: "The Third Chinese Civil War Breaks Out"
 roc_return.82.d: "A large-scale armed uprising has broken out in China's Northeast, and the CCP remnants have announced the restoration of the government of the People's Republic of China. The Nationalist Government has declared a nationwide period of suppressing the rebellion. A civil war spanning a century has broken out for the third time."
 roc_return.82.a: "China's civil war is still not over."
 roc_return.83.t: "Uprising in the Northeast"
 roc_return.83.d: "In the industrial cities and mountains of the Northeast, tens of thousands of workers, laid-off employees and former PLA officers and soldiers have answered the Central Committee's call and taken up arms."
 roc_return.83.a: "The revolution is not yet complete; comrades, keep up the fight!"
 roc_return.85.t: "Victory for the People's Republic"
 roc_return.85.d: "The Nationalist Government has surrendered. The Five-Star Red Flag rises once again over the Gate of Heavenly Peace.\n\nThe remnants of the Kuomintang have fled to Taiwan. The People's Republic of China is back."
 roc_return.85.a: "The Chinese people have stood up!"
 roc_return.86.t: "The People's Republic of China Is Restored"
 roc_return.86.d: "The Chinese Communist Party has won the Third Chinese Civil War and restored the People's Republic of China. The Nationalist Government has retreated to Taiwan once more."
 roc_return.86.a: "History has come back to where it started."
 roc_return.87.t: "The Government Retreats to Taiwan Again"
 roc_return.87.d: "The mainland has been lost once again. The Nationalist Government and what remains of the National Army have withdrawn to Taiwan. In Taipei, the President declared: ‘We will be back.’"
 roc_return.87.a: "Counterattack on the mainland. We will never give up."
 roc_return.88.t: "The Rebellion Is Crushed"
 roc_return.88.d: "The National Army has utterly defeated the armed CCP remnants. The Northeast and North China are back under the control of the Republic of China."
 roc_return.88.a: "Long live the Republic of China!"

