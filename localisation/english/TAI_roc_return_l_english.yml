 SYR_pc_gui_quota: "[SYR_pc_quota_text]"
 SYR_pc_quota_on: "Worker-peasant quota: the constitution reserves at least half the seats for farmers and workers (currently §Y[?SYR_pc_wp|0]§! seats) · 15 provincial constituencies"
 SYR_pc_quota_gone: "Worker-peasant quota: abolished by the 2012 Constitution · 15 provincial constituencies"
 SYR_pc_gui_term_info: "Markers: §R1/3§! blocking line · §Y1/2§! majority · §G2/3§! amendment threshold"
 SYR_pc_gui_warning: "§RWarning: the ruling coalition holds less than a third of the seats. Parliament is no longer in your hands!§!"
 roc_asia.80.a: "The new parliament opens"
 roc_asia.80.t: "People's Council Elections"
 roc_asia.80.d: "The voters have gone to the polls: Ba'ath Party §Y[?SYR_pc_baath|0]§! seats, NPF allied parties §Y[?SYR_pc_npf|0]§!, independents §Y[?SYR_pc_ind|0]§!, secular opposition §Y[?SYR_pc_sec|0]§!, Islamist opposition §Y[?SYR_pc_isl|0]§!.\n\n[SYR_pc_system_text]"
 roc_asia.81.a: "This is the start of reform"
 roc_asia.81.t: "The State of Emergency Ends"
 roc_asia.81.d: "Forty-eight years of emergency law have been repealed. Crowds cheer in the streets, though some say the real emergency, the secret police and the checkpoints, has not gone away for a single day."
 roc_asia.82.a: "Await approval"
 roc_asia.82.t: "Birth of New Parties"
 roc_asia.82.d: "Once the Political Parties Law took effect, dozens of new parties applied. Some are stand-ins for ‘independents’, others are a real opposition. Whether they can stay inside the law depends on the regime."
 roc_asia.83.a: "Adopted"
 roc_asia.83.t: "Referendum on the New Constitution"
 roc_asia.83.d: "The constitutional referendum: official turnout of 57%, with 89% in favor. Article 8 is gone, and the Ba'ath is no longer the constitution's leading party; yet the powers of the President, the security services and the makeup of parliament have not changed at all."
 roc_asia.84.a: "Passed by vote"
 roc_asia.84.t: "A 34-Year-Old President"
 roc_asia.84.d: "Hours after Hafez al-Assad's death, the People's Council met in emergency session. The constitution set the minimum age for a president at 40; in under ten minutes the deputies changed it to 34, exactly Bashar al-Assad's age. Parliament then nominated him as the sole presidential candidate."
 roc_asia.85.a: "Confirm his second term"
 roc_asia.85.t: "The 2007 Presidential Referendum"
 roc_asia.85.d: "Parliament nominated Bashar al-Assad as the sole candidate, and the referendum returned 97.6% in favor. Posters in the streets read: ‘Bashar, the hope of Syria.’"
 roc_asia.86.a: "Announce the result"
 roc_asia.86.t: "The 2014 Presidential Election"
 roc_asia.86.d: "The first presidential election under the new constitution has three candidates, and the official result gives the winner 88.7%. No vote could be held in opposition-held areas; Western countries call it a farce."
 ### v3.29 叙利亚左翼规则
 SYRL_AI_BEHAVIOR: "Syria AI Path (Left Ba'ath)"
 RULE_OPTION_SYRL_LEFT_BAATH: "Left Ba'ath"
 RULE_OPTION_SYRL_LEFT_BAATH_DESC: "The Syrian AI takes Bashar's ‘Founding Ideals of the Ba'ath’ path: it rejects family rule and returns to the Ba'ath's original ideals (unity, freedom, socialism). Pair it with ‘Historical’ or ‘No Path’ in ‘Syria AI Behavior’, and do not select another path at the same time."
 RULE_OPTION_SYRL_NO_PATH: "Not Specified"
 RULE_OPTION_SYRL_NO_PATH_DESC: "No extra left-wing path is set; the Syrian AI follows the ‘Syria AI Behavior’ setting."
 ### v3.33 台湾时代政治线与巴基斯坦国策
 TAIP_ext_mainland_ties: "Cross-Strait Trade Ties"
 TAIP_ext_us_support: "Support for the Strait Status Quo"
 TAIP_ext_strait_tension: "Tension in the Strait"
 TAIP_ext_pfp_middle: "The PFP's Middle Path"
 TAIP_status_quo_idea: "The New Normal: Maintain the Status Quo"
 TAIP_status_quo_idea_desc: "No unification, no independence, no use of force: neither Taipei nor Beijing wants to upset the status quo, and the world is happy to see it so. This understanding rests on everyone's restraint."
 TAIP_three_links_idea: "The Three Links and Mainland Tourists"
 TAIP_three_links_idea_desc: "Direct flights, mainland tourists and mainland capital tie the two economies closer than ever, and make Taiwan dependent on the mainland market."
 TAIP_sunflower_idea: "Legacy of the Civic Movement"
 TAIP_sunflower_idea_desc: "Since the Sunflower Movement, civic groups, young people and new parties have become a force in Taiwanese politics that cannot be ignored."
 TAIP_mask_idea: "Mask Diplomacy and Epidemic Control"
 TAIP_mask_idea_desc: "During the pandemic, the ‘national mask team’, name-based rationing and ‘Taiwan Can Help’ became new calling cards of our diplomacy."
 TAIP_chip_idea: "The Sacred Mountain That Protects the Nation"
 TAIP_chip_idea_desc: "Our foundries make the great majority of the world's advanced chips: Taiwan's biggest economic bargaining chip, and its biggest risk."
 TAIP_energy_idea: "The Energy Transition Debate"
 TAIP_energy_idea_desc: "The tug of war between a ‘nuclear-free homeland’ and secure power supply turns every blackout into a political issue."
 roc_asia.90.a: "Welcome a new beginning"
 roc_asia.90.t: "‘No Unification, No Independence, No Use of Force’"
 roc_asia.90.d: "At the inauguration, the new President repeats that the status quo will not change unless the people of Taiwan agree. Taipei's stock market rises, and Beijing responds with a restrained welcome."
 roc_asia.91.a: "Listen to the voices in the street"
 roc_asia.91.b: "Stick to parliamentary procedure"
 roc_asia.91.t: "March in the Chamber"
 roc_asia.91.d: "Late at night, students pack the chamber of the Legislative Yuan and occupy the speaker's podium. The streets fill with supporters, and police clear the chamber before dawn. All night, television carries the chant ‘Do you hear us?’"
 roc_asia.92.a: "Take office"
 roc_asia.92.t: "The Third Transfer of Power"
 roc_asia.92.d: "On election night, cheers erupt at the opposition headquarters, and the ruling party's chair announces his resignation. In his speech, the new President says ‘maintain the status quo’ more than once."
 TAI_ext_pak_china: "Pakistan-China All-Weather Strategic Partnership"
 TAI_ext_pak_us: "Warming Pakistan-US Relations"
 TAI_ext_pak_india: "Kashmir and Indo-Pakistani Hostility"
 TAI_ext_pak_roc: "Pragmatic Pakistan-ROC Relations"
 TAI_ext_pak_imf: "IMF Austerity Conditions"
 TAI_ext_pak_gulf: "Gulf Money and Aid"
 TAI_ext_pak_militancy: "Terrorist Attacks on the Border"
 PAKX_hybrid_idea: "Hybrid Regime"
 PAKX_hybrid_idea_desc: "The civilian government stands in front, the army stands behind: elections go ahead as usual, and everyone knows who makes the big decisions."
 PAKX_democracy_idea: "Electoral Democracy"
 PAKX_democracy_idea_desc: "Multi-party competition, an independent press and the lawyers' movement make Pakistani politics full of conflict, and full of hope."
 PAKX_army_rule_idea: "Military Dominance"
 PAKX_army_rule_idea_desc: "The generals set the nation's course from behind the scenes: stability is their promise, and parliament's irrelevance the price."
 PAKX_deterrence_idea: "Credible Minimum Deterrence"
 PAKX_deterrence_idea_desc: "Nuclear weapons are the balancing point between Pakistan and India, and the nation's most expensive security guarantee."
 PAKX_navy_idea: "Chinese-Built Submarines"
 PAKX_navy_idea_desc: "Hangor-class submarines and new frigates give the Pakistani navy a deterrent on the high seas for the first time."
 PAKX_cpec_idea: "China-Pakistan Economic Corridor"
 PAKX_cpec_idea_desc: "Gwadar port, highways and energy projects link Xinjiang to the Arabian Sea, and load Pakistan with heavy debt."
 PAKX_imf_idea: "IMF Bailout Program"
 PAKX_imf_idea_desc: "Every bailout comes with austerity conditions: taxes, subsidies and the exchange rate all run on the International Monetary Fund's timetable."
 PAKX_textile_idea: "Kingdom of Cotton"
 PAKX_textile_idea_desc: "Cotton, textiles and garments are Pakistan's most important exports, and the livelihoods of millions of workers hang on the looms."
 PAKX_counterterror_idea: "The Price of Counterterrorism"
 PAKX_counterterror_idea_desc: "After every attack, military operations in the border regions and the human rights disputes that follow play out all over again."
 PAKX_flood_idea: "Rebuilding After the Floods"
 PAKX_flood_idea_desc: "The 2022 floods drove millions from their homes and made ‘climate resilience’ a national issue for the first time."
 PAKX_sco_idea: "Balancing in the SCO"
 PAKX_sco_idea_desc: "Working with China, Russia, Central Asia and Iran at once is an opportunity, and a tightrope between great powers."
 PAKX_roc_idea: "Pragmatic Taiwan-Pakistan Exchanges"
 PAKX_roc_idea_desc: "Without formal relations, Taipei and Islamabad weave a pragmatic web of trade, education and people-to-people ties."
 PAKX_digital_idea: "A Digital Economy for the Young"
 PAKX_digital_idea_desc: "Freelancers and IT outsourcing make the digital economy a new source of growth, and give young people choices for the first time."
 PAKX_tb_armor: "Armor Technology"
 PAKX_tb_it: "IT Outsourcing Technology"
 PAKX_tb_edu: "Education and Skills Training"
 roc_asia.100.a: "The civilians must keep face too."
 roc_asia.100.b: "Concentrate power in the generals' hands."
 roc_asia.100.t: "The Hybrid Regime Takes Shape"
 roc_asia.100.d: "The half the constitution never wrote down, the division of labor between civilians and the army, is renegotiated in every crisis and gradually hardens into custom."
 roc_asia.101.a: "Order above all."
 roc_asia.101.b: "Return power to civilians as soon as possible."
 roc_asia.101.t: "The Army Returns"
 roc_asia.101.d: "The generals have taken over the country in the name of ‘keeping order’. Curfews, press censorship and military courts are part of daily life."
 roc_asia.102.a: "Respect the vote."
 roc_asia.102.b: "Watch how the army reacts."
 roc_asia.102.t: "The First Full Transfer of Power"
 roc_asia.102.d: "The election is over, and the opposition has won a majority. Crowds cheer in the capital's streets; the barracks are silent."
 roc_asia.103.a: "Deterrence is peace."
 roc_asia.103.b: "Call for arms control."
 roc_asia.103.t: "The Nuclear Deterrent Is Complete"
 roc_asia.103.d: "After a successful missile test, the Ministry of Defense announces that ‘credible minimum deterrence’ has been achieved. India's response comes quickly."
 roc_asia.104.a: "Turn opportunity into prosperity."
 roc_asia.104.b: "Beware the debt trap."
 roc_asia.104.t: "The Corridor Economy Takes Shape"
 roc_asia.104.d: "The first large cargo ship docks at Gwadar, and the CPEC highway opens. Debt and opportunity are drawn on the same blueprint."
 roc_asia.105.a: "Give thanks for the friendship."
 roc_asia.105.b: "Balance all sides."
 roc_asia.105.t: "All-Weather Strategic Partners"
 roc_asia.105.d: "The leaders of Pakistan and China issue a joint statement announcing that their ‘all-weather strategic cooperative partnership’ has entered a new stage."
 roc_asia.106.a: "Mobilize international aid."
 roc_asia.106.b: "Rebuild with the nation's own strength."
 roc_asia.106.t: "The 2022 Floods"
 roc_asia.106.d: "Monsoon floods have submerged a third of the country. Millions are displaced, and international aid is on an unprecedented scale."
 roc_asia.107.a: "Put the plan into action."
 roc_asia.107.b: "See how it works first."
 roc_asia.107.t: "A Pakistan That Develops Together"
 roc_asia.107.d: "The nation's new plan puts education, health care and jobs first. The government promises that every child will go to school."
 TAIP_root: "The ‘Status Quo’ Party Line"
 TAIP_root_desc: "Without a counterattack, Taiwanese politics is a line with no end: every election and every transfer of power reinterprets ‘the status quo’."
 TAIP_e1: "2000: The First Transfer of Power"
 TAIP_e1_desc: "For the first time in fifty years, the opposition governs. For the first time, Taiwanese politics has more than one answer."
 TAIP_e1_dpp: "DPP Version: The New Middle Way"
 TAIP_e1_dpp_desc: "The governing DPP puts forward a ‘New Middle Way’ that aims to reassure Beijing while answering local expectations. The ‘Four Noes and One Without’ go into the inaugural address."
 TAIP_e1_kmt: "KMT Version: The Bridge in Opposition"
 TAIP_e1_kmt_desc: "Out of power, the Kuomintang sends Lien Chan to the mainland to restart party-to-party ties with Beijing. In opposition, the KMT has become a bridge across the Strait."
 TAIP_e1_pfp: "PFP Version (Fictional): The Third Force"
 TAIP_e1_pfp_desc: "Fictional: after the 2000 election, James Soong's People First Party becomes the decisive minority in parliament and joins a coalition government as a ‘third force’, seeking a third way between unification and independence."
 TAIP_e2: "2008: Power Changes Hands Again"
 TAIP_e2_desc: "The Kuomintang returns to power. ‘No unification, no independence, no use of force’ becomes the new government's slogan, and official cross-Strait dialogue resumes."
 TAIP_e2_dpp: "DPP Version: Opposition and the Streets"
 TAIP_e2_dpp_desc: "The opposition DPP attacks the closed-door review of the services trade agreement and backs the students who occupy the chamber. Protest inside the legislature becomes another face of Taiwanese politics."
 TAIP_e2_kmt: "KMT Version: The Three Links and ECFA"
 TAIP_e2_kmt_desc: "Direct flights, direct mail and direct trade are fully restored, and independent mainland tourists bring millions of visits a year. ECFA's early harvest list cuts tariffs on nearly a thousand products."
 TAIP_e2_pfp: "PFP Version (Fictional): The Lien-Soong Coalition"
 TAIP_e2_pfp_desc: "Fictional: the Kuomintang and the People First Party form a coalition government, turning the Lien-Soong electoral alliance into a governing one. The price of partnership is half the seats in the cabinet."
 TAIP_e3: "2016: The Third Transfer of Power"
 TAIP_e3_desc: "After the nine-in-one local elections, the DPP returns to power. The new government declares: maintain the status quo, neither provoke nor yield."
 TAIP_e3_dpp: "DPP Version: New Southbound and Pandemic Diplomacy"
 TAIP_e3_dpp_desc: "The New Southbound Policy steers trade and investment toward Southeast Asia, South Asia, Australia and New Zealand. The ‘national mask team’ and ‘Taiwan Can Help’ become new calling cards of our diplomacy."
 TAIP_e3_kmt: "KMT Version: The Fight over the 1992 Consensus"
 TAIP_e3_kmt_desc: "The new government refuses to accept the wording of the ‘1992 Consensus’, and Beijing suspends official cross-Strait contact. The opposition KMT calls for dialogue to resume and keeps pressing the point in the Legislative Yuan."
 TAIP_e3_pfp: "PFP Version (Fictional): The Third Way"
 TAIP_e3_pfp_desc: "Fictional: after the third transfer of power, the People First Party becomes the arbiter of parliament. Its ‘middle path’ forces both big parties to make concessions, and it sets the agenda."
 TAIP_e4: "2024: The New Normal"
 TAIP_e4_desc: "After three transfers of power, Taiwanese politics has settled into the rhythm of ‘maintaining the status quo’: not inaction, but making every choice with great care."
 TAIP_e4_dpp: "DPP Version: Chips and Defense"
 TAIP_e4_dpp_desc: "Our foundries make the great majority of the world's advanced chips. The government introduces tax incentives and talent measures, raises the defense budget year after year, and launches its own submarine."
 TAIP_e4_kmt: "KMT Version: Reviving Cross-Strait Trade"
 TAIP_e4_kmt_desc: "The opposition KMT pushes to restart cross-Strait trade talks. Opening of services and tourism resumes, but every step must pass review in the Legislative Yuan."
 TAIP_e4_pfp: "PFP Version (Fictional): An Energy Compromise"
 TAIP_e4_pfp_desc: "Fictional: the PFP-led parliament makes a compromise between a ‘nuclear-free homeland’ and secure power supply its cause, and writes an energy transition plan into the budget."
 TAIP_end: "‘The New Normal’"
 TAIP_end_desc: "More than twenty years and three transfers of power: Taiwanese politics has proved again and again that ‘maintaining the status quo’ is not inaction, but a series of careful choices made over and over."
 PAKX_p_root: "Pakistan's Political Future"
 PAKX_p_root_desc: "In more than seventy years of independence, Pakistani politics has swung between civilian governments, the army and religious parties. Elections keep coming, but who really decides remains the biggest question."
 PAKX_p_hyb: "Hybrid Regime"
 PAKX_p_hyb_desc: "The civilian government stands in front, the army stands behind. Elections go ahead as usual, but major foreign and security decisions always need the generals' opinion first."
 PAKX_p_pm: "Civilian Government"
 PAKX_p_pm_desc: "The Prime Minister is the nominal head of the executive. The seats in parliament are always being traded among a few big parties."
 PAKX_p_judiciary: "Supreme Court Rulings"
 PAKX_p_judiciary_desc: "Rulings by the courts and the Election Commission often decide who governs more than the ballots do."
 PAKX_p_sec_council: "National Security Committee"
 PAKX_p_sec_council_desc: "A coordinating body set up jointly by civilians and the military, taking security affairs out of parliamentary debate."
 PAKX_p_patronage: "Patronage and the Great Families"
 PAKX_p_patronage_desc: "An exchange between local dynasties and parties: votes, posts and construction contracts make up the daily business of politics."
 PAKX_p_clergy: "Religious Parties and the Vote"
 PAKX_p_clergy_desc: "The religious parties' power to mobilize cannot be ignored at election time, and both big parties must leave room for them."
 PAKX_p_hyb_final: "The Hybrid Regime Takes Shape"
 PAKX_p_hyb_final_desc: "The half the constitution never wrote down, the division of labor between civilians and the army, is renegotiated in every crisis and gradually hardens into custom."
 PAKX_p_dem: "Transition to Electoral Democracy"
 PAKX_p_dem_desc: "Party competition is ever more open, and the Election Commission announces that the next general election will be monitored by international observers."
 PAKX_p_media: "The Free Press and the Lawyers' Movement"
 PAKX_p_media_desc: "The struggles of the independent press and the legal profession make speech and the courts democracy's two lines of defense."
 PAKX_p_elections: "Reforming the Election Commission"
 PAKX_p_elections_desc: "The Election Commission works independently, counting is transparent from start to finish, and the voter rolls are regularly updated."
 PAKX_p_18th: "The Eighteenth Amendment: Provincial Autonomy"
 PAKX_p_18th_desc: "The provinces gain more fiscal and educational powers, and the division of powers between the center and the provinces is written into the constitution for the first time."
 PAKX_p_elections_2: "Polls and Disinformation"
 PAKX_p_elections_2_desc: "During the election, disinformation and polls on social media have become a new battleground between the parties."
 PAKX_p_civil_mil: "Civilian Control of the Military"
 PAKX_p_civil_mil_desc: "A civilian serves as defense minister, and senior military appointments must be reviewed by parliament. It is many people's dream, and the army's red line."
 PAKX_p_provinces: "Devolution to the Provinces"
 PAKX_p_provinces_desc: "Provincial budgets and police powers are gradually devolved, and central power comes to depend more on negotiation."
 PAKX_p_opposition: "The Opposition Takes to the Streets"
 PAKX_p_opposition_desc: "Street rallies organized by the opposition parties and the lawyers force the government to make concessions before the election."
 PAKX_p_dem_final: "The First Full Transfer of Power"
 PAKX_p_dem_final_desc: "The election is over, and the opposition has won a majority. Crowds cheer in the capital's streets; the barracks are silent."
 PAKX_p_army: "The Army Returns"
 PAKX_p_army_desc: "The generals have taken over the country in the name of ‘keeping order’. Parliament is suspended, articles of the constitution are put aside, and the army becomes the nation's final arbiter."
 PAKX_p_corps: "Corps Headquarters"
 PAKX_p_corps_desc: "The corps headquarters coordinate under one command, and the guardians of the constitution have become the commanders of the army."
 PAKX_p_ordinance: "Suspending the Constitution"
 PAKX_p_ordinance_desc: "Under the ‘state of emergency’, parts of the constitution are suspended. This time, people say, it is only temporary."
 PAKX_p_intel: "Intelligence Dominance"
 PAKX_p_intel_desc: "The intelligence services control domestic surveillance and the files on every politician, and each of their reports can decide a cabinet's fate."
 PAKX_p_judge_sub: "Reappointing the Judges"
 PAKX_p_judge_sub_desc: "High court judges are reappointed, and candidates loyal to the army replace a group of independent judges."
 PAKX_p_army_final: "Army and Nation as One"
 PAKX_p_army_final_desc: "State and army have become one. Some call it stability; others call it military rule. History will give its own answer."
 PAKX_m_root: "The Foundations of Defense"
 PAKX_m_root_desc: "The Indian threat, the Afghan border and counterterrorism at home keep the army forever the nation's first priority."
 PAKX_m_army: "Armoring the Army"
 PAKX_m_army_desc: "Modernizing the armored divisions and mechanized infantry gives the army mobility both on the border and on the plains."
 PAKX_m_nuke: "Credible Minimum Deterrence"
 PAKX_m_nuke_desc: "Nuclear weapons are the nation's final guarantee. The principle of ‘credible minimum deterrence’ decides the number of every missile."
 PAKX_m_navy: "Naval Submarine Program"
 PAKX_m_navy_desc: "The navy buys new submarines and frigates from China, greatly raising its presence in the Indian Ocean."
 PAKX_m_air: "JF-17 Thunder Squadrons"
 PAKX_m_air_desc: "The JF-17, developed with China, enters front-line service with the air force. Cheap and reliable, it is a star export."
 PAKX_m_isi: "The ISI"
 PAKX_m_isi_desc: "On Afghanistan and Kashmir, Pakistan's intelligence service carries far more weight than any other institution."
 PAKX_m_border: "The Afghan Border and Counterterrorism"
 PAKX_m_border_desc: "The tribal belt on both sides of the Durand Line is a sanctuary for militants. Every exchange of fire on the border forces the army to redeploy."
 PAKX_m_missile: "Short-Range Missiles"
 PAKX_m_missile_desc: "The Abdali short-range missiles keep India's forward units under constant threat."
 PAKX_m_sub: "Chinese-Built Submarines"
 PAKX_m_sub_desc: "The Hangor-class submarines are launched, giving the Pakistani navy a blue-water combat capability for the first time."
 PAKX_m_jf17: "Deploying the Thunder Squadrons"
 PAKX_m_jf17_desc: "JF-17 squadrons rotate through the air bases between Karachi and Lahore, forming a complete air defense network."
 PAKX_m_ct: "Counterterrorism Operations"
 PAKX_m_ct_desc: "In the mountains of the northwest, one sweep after another has cost the army dearly, and bought some security."
 PAKX_m_industry: "Defense Industry: Heavy Industries Taxila"
 PAKX_m_industry_desc: "Defense plants in Taxila and Kamra produce ammunition, armored vehicles and missile components."
 PAKX_m_coast: "Coastal Defense and Gwadar"
 PAKX_m_coast_desc: "The navy takes over the coastal defense of Gwadar, protecting Chinese investment and the shipping lanes."
 PAKX_m_airdef: "Air Defense and Early Warning"
 PAKX_m_airdef_desc: "An early warning network of radars and surface-to-air missiles covers the major cities and nuclear sites."
 PAKX_m_drone: "Drones and Electronic Warfare"
 PAKX_m_drone_desc: "Drones and electronic warfare gear reach the border forces. Operations become cheaper and less risky, and controversy follows."
 PAKX_m_drill: "National Defense Exercises"
 PAKX_m_drill_desc: "‘All-people defense’ exercises are held across the country, and for the first time reserves and militia train on the same battle map as the regular army."
 PAKX_m_alliance: "Joint Training with China"
 PAKX_m_alliance_desc: "The Shaheen joint exercises give the two militaries real practice working together on tactics and logistics."
 PAKX_m_naval_base: "Karachi Naval Base"
 PAKX_m_naval_base_desc: "The naval base at Karachi is expanded, with new docks that can repair large frigates and submarines."
 PAKX_m_cyber: "Cyber Warfare and Signals Intelligence"
 PAKX_m_cyber_desc: "The army's cyber warfare branch monitors communications on the border and at home, and counters Indian cyber attacks."
 PAKX_m_reserve: "Reserves and Conscription"
 PAKX_m_reserve_desc: "Reserve training cycles are lengthened, and recruitment is extended to more provinces."
 PAKX_m_final: "The Nuclear Deterrent Is Complete"
 PAKX_m_final_desc: "After a successful missile test, the Ministry of Defense announces that ‘credible minimum deterrence’ has been achieved. India's response comes quickly."
 PAKX_m_sat: "Satellites and Space"
 PAKX_m_sat_desc: "The army's remote sensing satellites and missile warning program get under way, and border reconnaissance no longer depends entirely on foreign intelligence."
 PAKX_m_coastguard: "Expanding the Coast Guard"
 PAKX_m_coastguard_desc: "The coast guard adds patrol boats and helicopters, and cases of smuggling and illegal fishing fall year by year."
 PAKX_e_root: "The Economy: Debt, Exports and the Corridor"
 PAKX_e_root_desc: "Pakistan's economy is held up by cotton textiles, remittances and foreign aid. A single debt crisis is enough to narrow the whole nation's choices."
 PAKX_e_imf: "Sign an IMF Bailout"
 PAKX_e_imf_desc: "The International Monetary Fund's bailout loan arrives, but every tranche comes with conditions on tax and subsidy reform."
 PAKX_e_self: "Self-Driven Reform and State Enterprise Consolidation"
 PAKX_e_self_desc: "Refusing the conditions of international aid, the government pushes its own consolidation of state enterprises and tax reform, at the price of higher interest rates."
 PAKX_e_tax: "Tax Reform"
 PAKX_e_tax_desc: "Extend sales and income tax to more industries; taxes that go uncollected remain the biggest problem."
 PAKX_e_debt: "Debt Restructuring Talks"
 PAKX_e_debt_desc: "Negotiate with Chinese, Gulf and Western creditors to push part of the debt further into the future."
 PAKX_e_power: "Energy Subsidies and Imported Gas"
 PAKX_e_power_desc: "The power companies lose money year after year, and the government keeps the lights on with subsidies and imported LNG. Every blackout is political news."
 PAKX_e_textile: "Textile and Garment Exports"
 PAKX_e_textile_desc: "Cotton textiles and garments are Pakistan's most important export industry, and the livelihoods of millions of workers hang on the looms."
 PAKX_e_telecom: "Telecoms and Mobile Networks"
 PAKX_e_telecom_desc: "Competition between private telecom companies has slashed the cost of mobile phones, and mobile networks now cover most of the countryside."
 PAKX_e_remit: "Remittances from Workers Abroad"
 PAKX_e_remit_desc: "Millions of Pakistanis working in the Gulf and the West send home remittances that make up a large share of foreign exchange earnings."
 PAKX_e_cpec: "Launching the China-Pakistan Economic Corridor"
 PAKX_e_cpec_desc: "The economic corridor from Kashgar to Gwadar is officially launched. Road, power and port projects break ground one after another; debt and opportunity are drawn on the same blueprint."
 PAKX_e_agri: "Cotton and Irrigation"
 PAKX_e_agri_desc: "Cotton yields are held back by water shortages and pests, and repairing the irrigation canals is the first step of farm reform."
 PAKX_e_mining: "Mining and Steel"
 PAKX_e_mining_desc: "The mineral wealth of Balochistan and Punjab needs more investment, while the steel mills never produce enough."
 PAKX_e_gwadar: "Expanding Gwadar Port"
 PAKX_e_gwadar_desc: "The Chinese-built deep-water port at Gwadar has been expanded. The first cargo ships dock, and plans for the port and its special economic zone begin to take shape."
 PAKX_e_motorway: "Motorways and Railways"
 PAKX_e_motorway_desc: "The motorway and rail network from Peshawar to Karachi is gradually linked up, halving freight times."
 PAKX_e_it: "IT Outsourcing and Young Talent"
 PAKX_e_it_desc: "Freelancers and IT outsourcing firms are growing fast in Karachi and Lahore, and the digital economy is a new choice for the young."
 PAKX_e_tourism: "Tourism in the North"
 PAKX_e_tourism_desc: "In Gilgit and the Swat Valley, tourism brings new income, but infrastructure still lags behind."
 PAKX_e_airport: "Airports and Logistics Hubs"
 PAKX_e_airport_desc: "The international airports of Islamabad and Karachi are expanded, alongside plans for cargo hubs and free trade zones."
 PAKX_e_banking: "Reforming the State Banks"
 PAKX_e_banking_desc: "Bad loans are gradually stripped out of the state banks, and a new regulator begins checking their capital adequacy."
 PAKX_e_stock: "Opening the Stock Market"
 PAKX_e_stock_desc: "The Pakistan Stock Exchange in Karachi opens to foreign investors, and the rules of the capital market come close to international standards for the first time."
 PAKX_e_final: "The Corridor Economy Takes Shape"
 PAKX_e_final_desc: "The first large cargo ship docks at Gwadar, and the CPEC highway opens. For the first time, Pakistan's economy has a clear backbone."
 PAKX_f_root: "The Great Game in South Asia"
 PAKX_f_root_desc: "Wedged between India and Afghanistan, Pakistan's diplomacy rests on a balancing act: keeping a certain distance from every great power."
 PAKX_f_china: "All-Weather Strategic Partner of China"
 PAKX_f_china_desc: "Sino-Pakistani friendship is enshrined as an ‘all-weather strategic cooperative partnership’. In diplomacy, China is our most reliable friend."
 PAKX_f_india: "Relations with India and Kashmir"
 PAKX_f_india_desc: "The dispute over sovereignty in Kashmir has never been settled. Every exchange of fire on the border leaves diplomacy between the two countries deadlocked."
 PAKX_f_us: "Repairing Relations with America"
 PAKX_f_us_desc: "After the withdrawal from Afghanistan, US-Pakistan relations went through a cold spell. New cooperation starts with counterterrorism and trade."
 PAKX_f_gulf: "Gulf Money and the Road to Hajj"
 PAKX_f_gulf_desc: "Investment and aid from the Gulf states are an important source of foreign exchange, and millions of pilgrims tie the two regions together."
 PAKX_f_cpec: "Diplomatic Cover for CPEC"
 PAKX_f_cpec_desc: "The Foreign Ministry works to win international support for the corridor's projects and handles security and public opinion along the route."
 PAKX_f_weapons: "Buying Chinese Arms"
 PAKX_f_weapons_desc: "Fighters, submarines and missiles bought from China are the Pakistani military's most important source of equipment."
 PAKX_f_sco: "Shanghai Cooperation Organisation"
 PAKX_f_sco_desc: "SCO summits give Pakistan a platform for dialogue with Central Asia, Russia and Iran."
 PAKX_f_china_final: "The All-Weather Partnership Takes Shape"
 PAKX_f_china_final_desc: "The leaders of Pakistan and China issue a joint statement announcing that their ‘all-weather strategic cooperative partnership’ has entered a new stage."
 PAKX_f_aid: "US Aid and Counterterrorism Cooperation"
 PAKX_f_aid_desc: "American aid and intelligence sharing keep counterterrorism operations going, but every package comes with human rights conditions."
 PAKX_f_drone: "Drone Strikes and Sovereignty"
 PAKX_f_drone_desc: "American drone strikes in the tribal areas have provoked fierce protests. The argument between sovereignty and security never stops."
 PAKX_f_afghan: "After the Afghan Withdrawal"
 PAKX_f_afghan_desc: "After NATO's withdrawal, Afghanistan is tense again. Pakistan's border is both an exit for refugees and a front line of security."
 PAKX_f_us_final: "Resetting US-Pakistan Relations"
 PAKX_f_us_final_desc: "The two countries reach new agreements on counterterrorism, trade and education. Washington and Islamabad have found a common road again."
 PAKX_f_kashmir: "Standoff in Kashmir"
 PAKX_f_kashmir_desc: "Shelling and patrols on both sides of the Line of Control mean every negotiation begins with the smell of gunpowder."
 PAKX_f_indus: "The Indus Waters Treaty"
 PAKX_f_indus_desc: "The Indus Waters Treaty is one of the few areas of cooperation between the two countries, but dams upstream worry the farmers downstream."
 PAKX_f_peace: "An Attempt at Peace with India"
 PAKX_f_peace_desc: "Diplomats from the two countries meet secretly in a third country. The negotiating table is set, but not every chair is filled."
 PAKX_f_gulf_money: "Gulf Money and Aid"
 PAKX_f_gulf_money_desc: "Investment and loans from Saudi Arabia and the UAE provide crucial funding for energy and infrastructure projects."
 PAKX_f_turkey_iran: "Turkey and Iran: A Third Way in the Islamic World"
 PAKX_f_turkey_iran_desc: "Trilateral cooperation with Turkey and Iran gives Pakistan a place in the Islamic world that depends on no single side."
 PAKX_f_saudi: "Energy Cooperation with Saudi Arabia"
 PAKX_f_saudi_desc: "Saudi crude supplies and Hajj arrangements are the most practical cooperation between the two countries. Every swing in energy prices shows up on Pakistani electricity bills."
 PAKX_f_roc: "Pragmatic Relations with the ROC"
 PAKX_f_roc_desc: "Without formal relations, Taipei and Islamabad have found pragmatic room in trade, education and people-to-people ties."
 PAKX_f_roc_trade: "Taiwan-Pakistan Trade and Investment"
 PAKX_f_roc_trade_desc: "Trade in textiles, medicines and farm produce brings more business chambers and academic exchanges between Taipei and Islamabad every year."
 PAKX_f_mediation: "Balancing Between the Great Powers"
 PAKX_f_mediation_desc: "Rivalry between China and America, the standoff between India and China: Pakistan has found a place in the middle and uses it to win more room to maneuver."
 PAKX_f_final: "Diplomacy in Every Direction"
 PAKX_f_final_desc: "Friendly with the great powers, at peace with the neighbors, and a voice in regional bodies: Pakistani diplomacy no longer has to choose a single answer."
 PAKX_i_root: "Livelihoods and Security: The Nation's Second Front"
 PAKX_i_root_desc: "Militants on the border, crime in the cities and poverty in the countryside will decide whether Pakistan can truly stabilize."
 PAKX_i_baloch: "Baloch Separatism"
 PAKX_i_baloch_desc: "The separatist movement in Balochistan never ends, and the security of the gas fields and the port is the government's greatest worry."
 PAKX_i_ttp: "The Pakistani Taliban and Khyber Pakhtunkhwa"
 PAKX_i_ttp_desc: "Militant groups in the northwest keep attacking, targeting schools, markets and mosques. The government's response is both military and political."
 PAKX_i_madrasa: "Madrasas and Extremism"
 PAKX_i_madrasa_desc: "Thousands of madrasas give food and shelter to children from poor families, and have also become breeding grounds for extremism. Calls for reform are growing louder."
 PAKX_i_counter: "Counterterrorism and Intelligence Cooperation"
 PAKX_i_counter_desc: "Cooperation between the intelligence services and the police is slowly improving, and inter-provincial tracking and information sharing begin to work."
 PAKX_i_nap: "National Action Plan"
 PAKX_i_nap_desc: "A National Action Plan covering counterterrorism, religious reform and refugee resettlement is written into the government's annual budget."
 PAKX_i_police: "Police Reform"
 PAKX_i_police_desc: "Reform of local police training and pay means ordinary people are willing to ask the police for help in the street for the first time."
 PAKX_i_security_final: "Security in the Cities and on the Border"
 PAKX_i_security_final_desc: "Surveillance in the cities and fences on the border bring back some sense of security, but human rights groups are sharply critical."
 PAKX_i_refugees: "Resettling Afghan Refugees"
 PAKX_i_refugees_desc: "Millions of Afghan refugees have lived in Pakistan for decades. The government keeps wavering between resettlement and repatriation."
 PAKX_i_edu: "Education and Girls' Schooling"
 PAKX_i_edu_desc: "‘Every child must go to school’: girls' enrollment has become a yardstick of national progress."
 PAKX_i_health: "Universal Health Insurance"
 PAKX_i_health_desc: "Public hospital coverage and insurance reimbursement rise year by year, but drug shortages and the loss of medical staff remain serious."
 PAKX_i_flood: "The 2022 Floods and Reconstruction"
 PAKX_i_flood_desc: "Monsoon floods submerged a third of the country. International aid is on an unprecedented scale, and the first step of reconstruction is rebuilding the river embankments."
 PAKX_i_urban: "Urbanization and Karachi"
 PAKX_i_urban_desc: "Hundreds of thousands of people move from the countryside to Karachi every year. Pressure on housing and water keeps pushing the city's edge outward."
 PAKX_i_media: "Media and Free Speech"
 PAKX_i_media_desc: "News media censor themselves on politics and security, so many truths can only circulate on social media."
 PAKX_i_climate: "Climate Adaptation and Melting Glaciers"
 PAKX_i_climate_desc: "Melting glaciers in the north and an unstable monsoon make water planning a hard problem."
 PAKX_i_youth: "Youth and Jobs"
 PAKX_i_youth_desc: "Millions of young people are entering the labor market, but jobs cannot keep pace with population growth."
 PAKX_i_census: "Census and Fertility"
 PAKX_i_census_desc: "A new census shows that the birth rate is falling. The government begins to discuss family policy and long-term pension arrangements."
 PAKX_i_water2: "Karachi's Water Supply"
 PAKX_i_water2_desc: "Karachi has long relied on groundwater and distant pipelines. A new water plant means the city has water for more than twelve hours a day for the first time."
 PAKX_i_ngo: "Charities and NGOs"
 PAKX_i_ngo_desc: "Charities and NGOs serve disaster areas and poor communities, and the government begins letting them operate within a legal framework."
 PAKX_i_social_final: "A Pakistan That Develops Together"
 PAKX_i_social_final_desc: "The nation's new plan puts education, health care and jobs first. The government promises that every child will go to school and every family will be able to see a doctor."
 PAKX_i_final: "Internal Reconciliation"
 PAKX_i_final_desc: "Security and livelihoods are no longer two separate matters. For the first time, Pakistan's domestic affairs have a clear common thread."
