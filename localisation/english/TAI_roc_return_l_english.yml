 PRC_northeast_base_idea: "Northeast Base Area"
 PRC_northeast_base_idea_desc: "A revolutionary base between the White Mountains and the Black River. The Northeast's heavy industry and resources back the revolutionary war, and factories turn out guns and ammunition day and night; the masses in the base area are tightly organized and the regime is secure."
