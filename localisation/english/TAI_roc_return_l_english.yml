 TAI_gov.9.t: "The President Cannot Also Be Premier"
 TAI_gov.9.d: "Under the constitution, the President may not also serve as Premier. The new President, §Y[ROOT.GetLeader]§!, was previously Premier and must step down from that post; the Executive Yuan is taken over for now by §Y[TAI_gov_premier_name]§!. The Presidential Office may nominate someone else as Premier."
 TAI_gov.9.a: "Nominate someone else as Premier."
 TAI_gov.9.b: "Keep the current choice."
