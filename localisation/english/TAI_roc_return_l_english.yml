 TAI_gov.4.d: "在野党在立法院提出对行政院长§Y[TAI_gov_premier_name]§!的不信任案，并以多数通过。依宪法，行政院长须总辞，或呈请总统解散立法院。"
 TAI_gov.4.a: "行政院长率内阁总辞。"
