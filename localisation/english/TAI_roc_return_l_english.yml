 TAI_dbf_cure_imbalance: "US Arms Purchase"
 TAI_dbf_cure_imbalance_desc: "Use a special budget to buy advanced equipment from the United States and ease the military imbalance.\n\n§YCross-Strait Military Imbalance§! currently at severity §R[?TAI_dbf_imbalance_sev|0]§!/100, recovering §G[?TAI_dbf_imbalance_rate|1]§! per month."
