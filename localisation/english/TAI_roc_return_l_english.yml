 ### 事件
 roc_return.1.t: "Pan-Blue Coalition Forms a Cabinet"
 roc_return.1.d: "The Kuomintang, the People First Party and the New Party have formed a majority coalition in the Legislative Yuan and, after a series of political struggles, won the right to form the cabinet. The new administration vows to restore the constitutional orthodoxy of the Republic of China and pursue national unification."
 roc_return.1.a: "Long live the Republic of China!"
 roc_return.2.t: "A Secret Envoy from Taipei"
 roc_return.2.d: "A secret envoy from the Republic of China has brought an astonishing request: Taipei is considering ‘recovering the mainland’ when the time is right, and hopes Washington will at least look the other way, and ideally lend support behind the scenes.\n\nBacking the plan could drag us into direct conflict with Beijing. Refusing could push Taipei into a desperate gamble, or make it give up entirely."
 roc_return.2.a: "We will... turn a blind eye."
 roc_return.2.b: "Absolutely not. Keep the status quo."
 roc_return.3.t: "Washington's Tacit Approval"
 roc_return.3.d: "Our envoy has returned from Washington with good news: the Americans will not say so in public, but they will not stop us, and they are willing to help with intelligence and logistics."
 roc_return.3.a: "With America behind us, we can stand tall."
 roc_return.4.t: "Washington Objects"
 roc_return.4.d: "The Americans have made clear that they oppose any military action that changes the status quo in the Taiwan Strait, and have warned Taipei not to act rashly."
 roc_return.4.a: "We can only rely on ourselves."
 roc_return.5.t: "Taipei's Unification Proposal"
 roc_return.5.d: "The government of the Republic of China has formally presented us with a unification plan: under the constitution of the Republic of China, the two sides would merge into one democratic China, the current government would hand over power peacefully, and ordinary party members and officials would be guaranteed against reprisals.\n\nIn the past, such a proposal would have been laughed off. But times have changed."
 roc_return.5.a: "For the future of China, we accept."
 roc_return.5.b: "Absurd! Taiwan is an inseparable part of China."
 roc_return.6.t: "Beijing Accepts Unification!"
 roc_return.6.d: "News that has stunned the world: Beijing has accepted our unification plan! The transfer of power will be completed over the coming months, and the Blue Sky, White Sun and Wholly Red Earth flag will soon be raised over the Gate of Heavenly Peace."
 roc_return.6.a: "Long live the Republic of China! Long live China!"
 roc_return.7.t: "Beijing Rejects Unification"
 roc_return.7.d: "Beijing has flatly rejected our unification plan, repeating in its statement that it ‘will never renounce the use of force’. The door to peace is closed for now."
 roc_return.7.a: "Then it will be settled by arms."
 roc_return.9.t: "The National Army Liberates Nanjing"
 roc_return.9.d: "The National Army of the Republic of China entered Nanjing today. Before the Sun Yat-sen Mausoleum, its officers and soldiers paid their respects at the tomb of the Founding Father, and the Blue Sky, White Sun and Wholly Red Earth flag flies once again over the old capital of the Republic."
 roc_return.9.a: "History comes full circle."
 roc_return.10.t: "Unification Proposal from the Republic of China"
 roc_return.10.d: "The Nanjing government has sent us a note pointing out that the Republic of China never recognized the 1946 referendum on Outer Mongolian independence, and proposing that Mongolia return to the Republic of China as a highly autonomous region."
 roc_return.10.a: "We accept."
 roc_return.10.b: "Mongolia is an independent country!"
 roc_return.11.t: "Ulaanbaatar Refuses to Return"
 roc_return.11.d: "The Mongolian government has rejected our proposal and put the country on a war footing."
 roc_return.11.a: "They will regret this."
 roc_return.12.t: "Outer Mongolia Returns"
 roc_return.12.d: "The Mongolian government has accepted our proposal. Outer Mongolia will return to the Republic of China as an autonomous region."
 roc_return.12.a: "The northern steppe is ours once more."
 roc_return.13.t: "Return to the Republic of China?"
 roc_return.13.d: "The People's Republic of China is no more. The government of the Republic of China in Nanjing invites us to return to the Republic of China and keep a high degree of autonomy under the new constitution."
 roc_return.13.a: "We accept."
 roc_return.13.b: "We will choose our own path."
 roc_return.14.t: "The Republic of China Restores China"
 roc_return.14.d: "From Nanjing to Beiping, the flag of the Republic of China at last flies over the whole of mainland China. For more than half a century, many saw this as an impossible dream. Yet 1.3 billion people, a completely different social system and a long separation now await the new government."
 roc_return.14.a: "A new era begins."
 roc_return.15.t: "The Republic of China Returns to the UN"
 roc_return.15.d: "The UN General Assembly today passed a resolution recognizing the government of the Republic of China as the sole legitimate representative of China at the United Nations. After decades away, the Republic of China takes back its permanent seat on the Security Council."
 roc_return.15.a: "History turns a new page."
 roc_return.16.t: "The Begonia Leaf"
 roc_return.16.d: "With the return of Outer Mongolia and the frontier regions, the ‘existing national territory’ defined in the Constitution of the Republic of China has been restored in fact. The map shaped like a begonia leaf appears on the world map once more."
 roc_return.16.a: "The land is united."
 roc_return.17.t: "Taipei Requests US Intervention"
 roc_return.17.d: "The Republic of China is at war with the People's Republic of China. Taipei has formally asked us to honor our tacit promise and send forces into the war directly."
 roc_return.17.a: "America stands with its allies."
 roc_return.17.b: "We will not fight Taipei's war."
 roc_return.18.t: "America Enters the War!"
 roc_return.18.d: "Washington has declared war on Beijing, and the US Seventh Fleet has sailed into the Taiwan Strait."
 roc_return.18.a: "Victory is in sight!"
 roc_return.19.t: "America Declines to Intervene"
 roc_return.19.d: "The Americans say they will keep providing intelligence and supplies, but will not send troops."
 roc_return.19.a: "Understandable."
 roc_return.20.t: "Hong Kong and Macau Return"
 roc_return.20.d: "[From.GetName] has accepted our invitation and formally returned to the Republic of China."
 roc_return.20.a: "Welcome home."
 roc_return.21.t: "[From.GetName] Refuses to Return"
 roc_return.21.d: "[From.GetName] has turned down our invitation and insists on going its own way."
 roc_return.21.a: "We respect their choice."
 roc_return.21.b: "That is not theirs to decide."

