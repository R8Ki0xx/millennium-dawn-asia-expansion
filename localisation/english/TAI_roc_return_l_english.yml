 TAI_gov.5.t: "Nominate the President of the Legislative Yuan"
 TAI_gov.5.d: "The current President of the Legislative Yuan is §Y[TAI_gov_legis_name]§!. Under the constitution the President may nominate a new speaker, to be appointed with the consent of the Control Yuan or the Legislative Yuan. The speaker presides over debate and mediates between government and opposition, so the nominee's political color will shape how parliament works and bring different policy bonuses."
 TAI_gov.5.keep: "Keep the current President of the Legislative Yuan."
