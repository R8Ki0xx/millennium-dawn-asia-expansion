 roc_asia.80.a: "The new parliament opens"
 roc_asia.80.t: "People's Council Elections"
 roc_asia.80.d: "Voters walk into the polling stations and cast their ballots in the first relatively open election since the war: Baath Party §Y[?SYR_pc_baath|0]§! seats, National Progressive Front allies §Y[?SYR_pc_npf|0]§!, independents §Y[?SYR_pc_ind|0]§!, secular opposition §Y[?SYR_pc_sec|0]§!, Islamist opposition §Y[?SYR_pc_isl|0]§!. The new People's Assembly will open in Damascus.\n\n[SYR_pc_system_text]"
 roc_asia.81.a: "This is the start of reform"
 roc_asia.81.t: "The State of Emergency Ends"
 roc_asia.81.d: "The emergency law in force for forty-eight years is formally repealed, and the government declares that citizens have the right to peaceful assembly. Crowds cheer in the streets, and someone holds up a sign reading ‘Freedom’ in a Damascus square; but others say the real state of emergency, the secret police, the checkpoints and the knock on the door at midnight, has not gone away for a single day."
 roc_asia.82.a: "Await approval"
 roc_asia.82.t: "Birth of New Parties"
 roc_asia.82.d: "Once the Political Parties Law takes effect, dozens of new parties apply to register. Some are ‘independent’ fronts sponsored by the security services; others are genuine opposition, formed by returning exiled intellectuals and local notables. Whether they can stay within the law depends on the regime's attitude, and on their own restraint."
 roc_asia.83.a: "Adopted"
 roc_asia.83.t: "Referendum on the New Constitution"
 roc_asia.83.d: "The constitutional referendum: official turnout of 57%, with 89% in favor. Article 8 is gone, and the Ba'ath is no longer the constitution's leading party; yet the powers of the President, the security services and the makeup of parliament have not changed at all."
 roc_asia.84.a: "Passed by vote"
 roc_asia.84.t: "A 34-Year-Old President"
 roc_asia.84.d: "Hours after Hafez al-Assad's death, the People's Council met in emergency session. The constitution set the minimum age for a president at 40; in under ten minutes the deputies changed it to 34, exactly Bashar al-Assad's age. Parliament then nominated him as the sole presidential candidate."
 roc_asia.85.a: "Confirm his second term"
 roc_asia.85.t: "The 2007 Presidential Referendum"
 roc_asia.85.d: "The People's Assembly nominates Bashar al-Assad as the sole candidate, and the referendum returns a 97.6 percent yes vote. The ballot offers only ‘yes’ and ‘no’, and many vote openly under the eyes of intelligence officers. Posters in the streets read: ‘Bashar, the hope of Syria’. No one is surprised by the result."
 roc_asia.86.a: "Announce the result"
 roc_asia.86.t: "The 2014 Presidential Election"
 roc_asia.86.d: "The first presidential election under the new constitution has three candidates, the first time in half a century anyone has stood against an Assad, and the official result gives him 88.7 percent. No voting takes place in opposition-held areas or the refugee camps; Western countries call it a farce, while the regime declares that the people have chosen again."
 ### v3.29 叙利亚左翼规则
 SYRL_AI_BEHAVIOR: "Syria AI Path (Left Ba'ath)"
 RULE_OPTION_SYRL_LEFT_BAATH: "Left Ba'ath"
 RULE_OPTION_SYRL_LEFT_BAATH_DESC: "The Syrian AI takes Bashar's ‘Founding Ideals of the Ba'ath’ path: it rejects family rule and returns to the Ba'ath's original ideals (unity, freedom, socialism). Pair it with ‘Historical’ or ‘No Path’ in ‘Syria AI Behavior’, and do not select another path at the same time."
 RULE_OPTION_SYRL_NO_PATH: "Not Specified"
 RULE_OPTION_SYRL_NO_PATH_DESC: "No extra left-wing path is set; the Syrian AI follows the ‘Syria AI Behavior’ setting."
 ### v3.33 台湾时代政治线与巴基斯坦国策
 TAIP_ext_mainland_ties: "Cross-Strait Trade Ties"
 TAIP_ext_us_support: "Support for the Strait Status Quo"
 TAIP_ext_strait_tension: "Tension in the Strait"
 TAIP_ext_pfp_middle: "The PFP's Middle Path"
 TAIP_status_quo_idea: "The New Normal: Maintain the Status Quo"
 TAIP_status_quo_idea_desc: "No unification, no independence, no use of force: neither Taipei nor Beijing wants to upset the status quo, and the world is happy to see it so. This understanding rests on everyone's restraint."
 TAIP_three_links_idea: "The Three Links and Mainland Tourists"
 TAIP_three_links_idea_desc: "Direct flights, mainland tourists and mainland capital tie the two economies closer than ever, and make Taiwan dependent on the mainland market."
 TAIP_sunflower_idea: "Legacy of the Civic Movement"
 TAIP_sunflower_idea_desc: "Since the Sunflower Movement, civic groups, young people and new parties have become a force in Taiwanese politics that cannot be ignored."
 TAIP_mask_idea: "Mask Diplomacy and Epidemic Control"
 TAIP_mask_idea_desc: "During the pandemic, the national mask production team, the name-based rationing system and ‘Taiwan can help’ become new calling cards for its diplomacy. Taiwan's outstanding epidemic control and mask donations to other countries win international praise and speed up research in medicine and biotech."
 TAIP_chip_idea: "The Sacred Mountain That Protects the Nation"
 TAIP_chip_idea_desc: "Our foundries make the great majority of the world's advanced chips: Taiwan's biggest economic bargaining chip, and its biggest risk."
 TAIP_energy_idea: "The Energy Transition Debate"
 TAIP_energy_idea_desc: "The tug-of-war between a ‘nuclear-free homeland’ and secure power supply makes every blackout a political issue. Nuclear plants are decommissioned one by one, the share of coal and gas rises, and rows over air pollution and power shortages keep the government busy; but the energy issue also makes every party mobilize its supporters harder."
 roc_asia.90.a: "Welcome a new beginning"
 roc_asia.90.t: "‘No Unification, No Independence, No Use of Force’"
 roc_asia.90.d: "At his inauguration the new President reaffirms ‘no unification, no independence, no use of force’: the status quo will not change without the consent of the people of Taiwan. He promises to resume cross-Strait talks, open direct flights and welcome mainland tourists. The Taipei stock market jumps, Beijing responds with restrained welcome, and cross-Strait relations enter a rare period of calm."
 roc_asia.91.a: "Listen to the voices in the street"
 roc_asia.91.b: "Stick to parliamentary procedure"
 roc_asia.91.t: "March in the Chamber"
 roc_asia.91.d: "Late at night the chamber of the Legislative Yuan fills with students protesting the closed-door review of the services trade agreement, and they occupy the speaker's podium. The streets fill with supporters, the Executive Yuan is briefly occupied too, and the police clear it by force before dawn. All night the television plays the chant ‘Do you hear the people sing?’, and the movement will change the course of Taiwanese politics."
 roc_asia.92.a: "Take office"
 roc_asia.92.t: "The Third Transfer of Power"
 roc_asia.92.d: "On election night cheers erupt at opposition headquarters, and the ruling party's chair resigns to take responsibility for the defeat. In her victory speech the new President mentions ‘maintaining the status quo’ more than once; she promises to respect the historical fact of the 1992 cross-Strait talks, but not to accept Beijing's political preconditions. Beijing's response is cool and cautious."
 TAI_ext_pak_china: "Pakistan-China All-Weather Strategic Partnership"
 TAI_ext_pak_us: "Warming Pakistan-US Relations"
 TAI_ext_pak_india: "Kashmir and Indo-Pakistani Hostility"
 TAI_ext_pak_roc: "Pragmatic Pakistan-ROC Relations"
 TAI_ext_pak_imf: "IMF Austerity Conditions"
 TAI_ext_pak_gulf: "Gulf Money and Aid"
 TAI_ext_pak_militancy: "Terrorist Attacks on the Border"
 PAKX_hybrid_idea: "Hybrid Regime"
 PAKX_hybrid_idea_desc: "The civilian government stands in front, the army stands behind: elections go ahead as usual, and everyone knows who makes the big decisions."
 PAKX_democracy_idea: "Electoral Democracy"
 PAKX_democracy_idea_desc: "Multi-party competition, an independent press and the lawyers' movement make Pakistani politics full of conflict, and full of hope."
 PAKX_army_rule_idea: "Military Dominance"
 PAKX_army_rule_idea_desc: "The generals decide the nation's course from behind the scenes: stability is their promise, and parliament's irrelevance the price. Pakistan under the army is orderly and well mobilized for defense; but Western countries keep their distance from military rule, and trade and aid suffer."
 PAKX_deterrence_idea: "Credible Minimum Deterrence"
 PAKX_deterrence_idea_desc: "Nuclear weapons are the balancing point between Pakistan and India, and the nation's most expensive security guarantee. Nuclear deterrence keeps New Delhi from launching all-out war, and the army's confidence and morale rise accordingly."
 PAKX_navy_idea: "Chinese-Built Submarines"
 PAKX_navy_idea_desc: "Hangor-class submarines and new frigates give the Pakistani navy a deterrent on the high seas for the first time."
 PAKX_cpec_idea: "China-Pakistan Economic Corridor"
 PAKX_cpec_idea_desc: "Gwadar port, highways and energy projects link Xinjiang to the Arabian Sea, and load Pakistan with heavy debt."
 PAKX_imf_idea: "IMF Bailout Program"
 PAKX_imf_idea_desc: "Every bailout comes with austerity conditions: taxes, subsidies and the exchange rate all run on the International Monetary Fund's timetable."
 PAKX_textile_idea: "Kingdom of Cotton"
 PAKX_textile_idea_desc: "Cotton, textiles and garments are Pakistan's most important exports, and the livelihoods of millions of workers hang on the looms."
 PAKX_counterterror_idea: "The Price of Counterterrorism"
 PAKX_counterterror_idea_desc: "After every attack, military operations in the border areas and the human rights disputes that follow play out all over again. The war on terror rallies the public behind the army, but civilian casualties and displacement from the sweeps deepen resentment in the tribal areas."
 PAKX_flood_idea: "Rebuilding After the Floods"
 PAKX_flood_idea_desc: "The floods of 2022 submerged a third of the country and drove millions from their homes, making ‘climate resilience’ a national issue for the first time. Reconstruction builds embankments and houses to higher standards, and society shows remarkable solidarity after the disaster."
 PAKX_sco_idea: "Balancing in the SCO"
 PAKX_sco_idea_desc: "Working with China, Russia, Central Asia and Iran at once is both an opportunity and a tightrope walk between great powers. The SCO opens Central Asian markets and energy routes to Pakistan, but also makes its balance between the US on one side and China and Russia on the other more delicate."
 PAKX_roc_idea: "Pragmatic Taiwan-Pakistan Exchanges"
 PAKX_roc_idea_desc: "Without formal relations, Taipei and Islamabad weave a pragmatic web of trade, education and people-to-people ties."
 PAKX_digital_idea: "A Digital Economy for the Young"
 PAKX_digital_idea_desc: "Freelancers and IT outsourcing make the digital economy a new source of growth, and give young people choices for the first time."
 PAKX_tb_armor: "Armor Technology"
 PAKX_tb_it: "IT Outsourcing Technology"
 PAKX_tb_edu: "Education and Skills Training"
 roc_asia.100.a: "The civilians must keep face too."
 roc_asia.100.b: "Concentrate power in the generals' hands."
 roc_asia.100.t: "The Hybrid Regime Takes Shape"
 roc_asia.100.d: "The half that is not written in the constitution: the division of labor between civilians and the army, renegotiated in every crisis, has gradually become custom. The prime minister handles the economy and daily life, the army chief controls security and foreign policy, and the two meet weekly in the National Security Committee. The arrangement is far from ideal, but it has spared the country yet another coup."
 roc_asia.101.a: "Order above all."
 roc_asia.101.b: "Return power to civilians as soon as possible."
 roc_asia.101.t: "The Army Returns"
 roc_asia.101.d: "The generals have taken over the country in the name of ‘maintaining order’. Curfews, press censorship and military courts become routine, and party leaders are placed under house arrest or go into exile. Shopkeepers say at least there are fewer blackouts and kidnappings; lawyers and journalists begin organizing protests in secret. The army must decide how long it will rule this time."
 roc_asia.102.a: "Respect the vote."
 roc_asia.102.b: "Watch how the army reacts."
 roc_asia.102.t: "The First Full Transfer of Power"
 roc_asia.102.d: "The election is over, the opposition has won a majority and the ruling party concedes. It is the first complete transfer of power between parties since Pakistan's founding: no coup, no court intervention and no president dissolving parliament. Crowds cheer in the streets of the capital, the barracks stay silent, and everyone watches to see how the generals will react."
 roc_asia.103.a: "Deterrence is peace."
 roc_asia.103.b: "Call for arms control."
 roc_asia.103.t: "The Nuclear Deterrent Is Complete"
 roc_asia.103.d: "After a successful test of a submarine-launched cruise missile, the Ministry of Defense announces that ‘credible minimum deterrence’ has been achieved: land-, air- and sea-based nuclear forces give Pakistan a complete second-strike capability. New Delhi's response comes quickly, with India announcing it will speed up its own missile programs, and the South Asian arms race moves up another notch."
 roc_asia.104.a: "Turn opportunity into prosperity."
 roc_asia.104.b: "Beware the debt trap."
 roc_asia.104.t: "The Corridor Economy Takes Shape"
 roc_asia.104.d: "The first large freighter berths at Gwadar, the corridor's highways open end to end, and new power plants ease years of blackouts. But the corridor's loans are not cheap, the Baloch complain they see none of the benefits, and Western think tanks warn of a ‘debt trap’. Debt and opportunity are drawn on the same blueprint."
 roc_asia.105.a: "Give thanks for the friendship."
 roc_asia.105.b: "Balance all sides."
 roc_asia.105.t: "All-Weather Strategic Partners"
 roc_asia.105.d: "The leaders of Pakistan and China issue a joint statement announcing a new stage in their all-weather strategic cooperative partnership: dozens of agreements are signed covering energy, infrastructure, defense and space. Pakistan's first astronaut will fly into space aboard a Chinese spacecraft, and the friendship is described as ‘ironclad’."
 roc_asia.106.a: "Mobilize international aid."
 roc_asia.106.b: "Rebuild with the nation's own strength."
 roc_asia.106.t: "The 2022 Floods"
 roc_asia.106.d: "Monsoon rains and glacial meltwater cause unprecedented floods that submerge a third of the country. Sindh becomes an inland sea, millions are displaced, farms, roads and schools are washed away, and the damage exceeds thirty billion dollars. International aid comes on an unprecedented scale, but rebuilding will take years."
 roc_asia.107.a: "Put the plan into action."
 roc_asia.107.b: "See how it works first."
 roc_asia.107.t: "A Pakistan That Develops Together"
 roc_asia.107.d: "The nation's new plan puts education, health care and jobs first, replacing budgets that used to center on defense and megaprojects. The government promises that every child will go to school, every village will have a clinic and every young person will have a chance to work. Whether the plan is carried out will decide Pakistan's future."
 TAIP_root: "The ‘Status Quo’ Party Line"
 TAIP_root_desc: "Without a counterattack, Taiwanese politics is a line with no end: every election and every transfer of power reinterprets ‘the status quo’."
 TAIP_e1: "2000: The First Transfer of Power"
 TAIP_e1_desc: "The opposition takes power for the first time in fifty years. On March 18, 2000 Chen Shui-bian is elected president with 39 percent of the vote, ending fifty-five years of Kuomintang rule in Taiwan; at the moment of the peaceful transfer of power, Taiwanese politics no longer has only one answer."
 TAIP_e1_dpp: "DPP Version: The New Middle Way"
 TAIP_e1_dpp_desc: "The governing DPP puts forward a ‘New Middle Way’ that aims to reassure Beijing while answering local expectations. The ‘Four Noes and One Without’ go into the inaugural address."
 TAIP_e1_kmt: "KMT Version: The Bridge in Opposition"
 TAIP_e1_kmt_desc: "After losing power, Lien Chan visits the mainland in 2005 and meets Hu Jintao, reviving party-to-party contacts between the Kuomintang and the Communists after sixty years. The Kuomintang in opposition becomes a bridge across the Strait; the green camp calls it ‘allying with the Communists against Taiwan’, the blue camp says it paves the way for cross-Strait peace."
 TAIP_e1_pfp: "PFP Version (Fictional): The Third Force"
 TAIP_e1_pfp_desc: "Fictional: after the 2000 election, James Soong's People First Party becomes the decisive minority in parliament and joins a coalition government as a ‘third force’, seeking a third way between unification and independence."
 TAIP_e2: "2008: Power Changes Hands Again"
 TAIP_e2_desc: "The Kuomintang returns to power. Ma Ying-jeou is elected president with 58 percent of the vote, ‘no unification, no independence, no use of force’ becomes the new government's slogan, and official dialogue across the Strait resumes: the SEF and ARATS restart talks, and direct flights, mainland tourists and ECFA follow one after another."
 TAIP_e2_dpp: "DPP Version: Opposition and the Streets"
 TAIP_e2_dpp_desc: "The opposition DPP attacks the closed-door review of the services trade agreement and backs the students who occupy the chamber. Protest inside the legislature becomes another face of Taiwanese politics."
 TAIP_e2_kmt: "KMT Version: The Three Links and ECFA"
 TAIP_e2_kmt_desc: "Direct flights, direct mail and direct trade are fully restored, and independent mainland tourists bring millions of visits a year. ECFA's early harvest list cuts tariffs on nearly a thousand products."
 TAIP_e2_pfp: "PFP Version (Fictional): The Lien-Soong Coalition"
 TAIP_e2_pfp_desc: "Fictional: the Kuomintang and the People First Party form a coalition government, turning the Lien-Soong electoral alliance into a governing one. The price of partnership is half the seats in the cabinet."
 TAIP_e3: "2016: The Third Transfer of Power"
 TAIP_e3_desc: "After the Sunflower Movement and the 2014 local elections, the DPP returns to power in 2016, Tsai Ing-wen becomes Taiwan's first woman president, and the DPP wins a majority in the Legislative Yuan for the first time. The new government declares it will maintain the status quo, neither provoking nor yielding."
 TAIP_e3_dpp: "DPP Version: New Southbound and Pandemic Diplomacy"
 TAIP_e3_dpp_desc: "The New Southbound Policy steers trade and investment toward Southeast Asia, South Asia, Australia and New Zealand. The ‘national mask team’ and ‘Taiwan Can Help’ become new calling cards of our diplomacy."
 TAIP_e3_kmt: "KMT Version: The Fight over the 1992 Consensus"
 TAIP_e3_kmt_desc: "The new government refuses to accept the wording of the ‘1992 Consensus’, and Beijing suspends official cross-Strait contact. The opposition KMT calls for dialogue to resume and keeps pressing the point in the Legislative Yuan."
 TAIP_e3_pfp: "PFP Version (Fictional): The Third Way"
 TAIP_e3_pfp_desc: "Fictional: after the third transfer of power, the People First Party becomes the arbiter of parliament. Its ‘middle path’ forces both big parties to make concessions, and it sets the agenda."
 TAIP_e4: "2024: The New Normal"
 TAIP_e4_desc: "After three changes of power, Taiwanese politics has grown used to the rhythm of the status quo: not inaction, but making every choice with care. In the 2024 election three parties compete, and voters weigh sovereignty, the economy and generational issues; democracy has become part of Taiwanese life."
 TAIP_e4_dpp: "DPP Version: Chips and Defense"
 TAIP_e4_dpp_desc: "Our foundries make the great majority of the world's advanced chips. The government introduces tax incentives and talent measures, raises the defense budget year after year, and launches its own submarine."
 TAIP_e4_kmt: "KMT Version: Reviving Cross-Strait Trade"
 TAIP_e4_kmt_desc: "The opposition KMT pushes to restart cross-Strait trade talks. Opening of services and tourism resumes, but every step must pass review in the Legislative Yuan."
 TAIP_e4_pfp: "PFP Version (Fictional): An Energy Compromise"
 TAIP_e4_pfp_desc: "Fictional: the PFP-led parliament makes a compromise between a ‘nuclear-free homeland’ and secure power supply its cause, and writes an energy transition plan into the budget."
 TAIP_end: "‘The New Normal’"
 TAIP_end_desc: "More than twenty years and three transfers of power: Taiwanese politics has proved again and again that ‘maintaining the status quo’ is not inaction, but a series of careful choices made over and over."
 PAKX_p_root: "Pakistan's Political Future"
 PAKX_p_root_desc: "In more than seventy years of independence, Pakistani politics has swung between civilian governments, the army and religious parties. Elections keep coming, but who really decides remains the biggest question."
 PAKX_p_hyb: "Hybrid Regime"
 PAKX_p_hyb_desc: "The civilian government is out front, and the army stands behind it. Elections are held and cabinets formed as usual, but major foreign and security decisions, above all on India, Afghanistan and nuclear weapons, always go to the generals in Rawalpindi first. Pakistanis call this being ‘on the same page’."
 PAKX_p_pm: "Civilian Government"
 PAKX_p_pm_desc: "The prime minister is nominally the head of government, but seats in parliament are always being traded among a few big parties: the Muslim League, the People's Party and Tehreek-e-Insaf. Every government walks a tightrope between coalition partners, the opposition and the army, and very few prime ministers have ever served a full five-year term."
 PAKX_p_judiciary: "Supreme Court Rulings"
 PAKX_p_judiciary_desc: "Rulings by the courts and the Election Commission often decide who governs more than votes do. The Supreme Court can disqualify a prime minister for ‘dishonesty’, or give its blessing to a military takeover. In this country the judges are both guardians of the constitution and political players."
 PAKX_p_sec_council: "National Security Committee"
 PAKX_p_sec_council_desc: "The National Security Committee, set up jointly by civilians and the military, takes security affairs out of parliamentary debate. The prime minister chairs it, with the service chiefs and the intelligence chief attending; nominally under civilian leadership, it in fact gives the generals a formal voice, and the army is quite pleased with it."
 PAKX_p_patronage: "Patronage and the Great Families"
 PAKX_p_patronage_desc: "Exchanges between local dynasties and the parties, of votes, posts and public works contracts, make up everyday politics. Punjabi landlords and Sindhi tribal elders control the votes of whole constituencies, and whoever builds their roads and hands out their jobs wins the seats. Small businessmen know that business goes better close to the ruling party."
 PAKX_p_clergy: "Religious Parties and the Vote"
 PAKX_p_clergy_desc: "The religious parties' ability to mobilize cannot be underestimated at election time: mosque networks, madrassas and street protests can paralyze the capital overnight. Both big parties have to make room for them, nobody dares touch issues such as the blasphemy laws, and society's room for tolerance keeps shrinking as a result."
 PAKX_p_hyb_final: "The Hybrid Regime Takes Shape"
 PAKX_p_hyb_final_desc: "The half that is not written in the constitution: the division of labor between civilians and the army is renegotiated in every crisis and has gradually become custom. Civilians run the economy and daily life, the army runs security and foreign policy, and neither side is fully satisfied, but both accept the unwritten contract. Pakistan has found a stability that is not very pretty."
 PAKX_p_dem: "Transition to Electoral Democracy"
 PAKX_p_dem_desc: "Competition between the parties is ever more open, and the Election Commission announces that the next general election will be monitored by international observers. A younger generation follows politics on their phones and social media; no longer content with candidates chosen by the army, they demand a truly free and fair election."
 PAKX_p_media: "The Free Press and the Lawyers' Movement"
 PAKX_p_media_desc: "The struggle of the independent media and the legal profession makes free speech and the courts the two lines of defense for democracy. The lawyers' movement of 2007 once forced Musharraf to back down; now journalists report the truth despite the risk of disappearance and prosecution, and the bar associations take to the streets again and again to defend the independence of the courts."
 PAKX_p_elections: "Reforming the Election Commission"
 PAKX_p_elections_desc: "The Election Commission operates independently, the count is transparent from start to finish, the voter rolls are updated regularly, and results from the electronic tallying system are announced on the spot. After every past election the losing side alleged fraud; this time the reformers hope the results themselves will be convincing enough."
 PAKX_p_18th: "The Eighteenth Amendment: Provincial Autonomy"
 PAKX_p_18th_desc: "The Eighteenth Amendment gives the provinces more power over finances and education, and for the first time the division of powers between the center and the provinces is written into the constitution. Punjab, Sindh, Khyber Pakhtunkhwa and Balochistan each control more of their budgets, and federal power is genuinely constrained as a result."
 PAKX_p_elections_2: "Polls and Disinformation"
 PAKX_p_elections_2_desc: "During the election campaign, disinformation and polls on social media become a new battlefield between the parties. Every party runs its own troll armies, and deepfake videos and fake polls spread like wildfire in WhatsApp groups. The Election Commission struggles to debunk them, and voters find it ever harder to tell what is true."
 PAKX_p_civil_mil: "Civilian Control of the Military"
 PAKX_p_civil_mil_desc: "A civilian serves as defense minister, and senior military appointments must be reviewed by parliament. It is many people's dream, and the army's red line."
 PAKX_p_provinces: "Devolution to the Provinces"
 PAKX_p_provinces_desc: "Budgets and police powers are gradually devolved to the provincial governments, and central power comes to depend more on negotiation. Before Islamabad can push any national policy, it must first sit down with the chief ministers of the four provinces. Efficiency may suffer, but resentment in the outlying provinces has eased a great deal."
 PAKX_p_opposition: "The Opposition Takes to the Streets"
 PAKX_p_opposition_desc: "Street rallies and ‘long marches’ organized by the opposition and the lawyers force the government to make concessions before the election. Hundreds of thousands walk from Lahore to Islamabad and sit in for weeks outside parliament. This kind of protest is an expression of democracy, but it also paralyzes the country time after time."
 PAKX_p_dem_final: "The First Full Transfer of Power"
 PAKX_p_dem_final_desc: "The election is over, the opposition has won a majority of seats, the ruling party concedes, and power changes hands peacefully. It is the first complete transfer of power between parties since Pakistan's founding, with no coup and no court intervention. Crowds cheer in the streets of the capital, while the barracks stay silent."
 PAKX_p_army: "The Army Returns"
 PAKX_p_army_desc: "The generals have taken over the country in the name of ‘maintaining order’. Television stations broadcast the army chief's address, parliament is suspended, the constitution set aside, and the army becomes the final arbiter of the nation. It is not the first time: Ayub Khan, Zia-ul-Haq and Musharraf all took the same road."
 PAKX_p_corps: "Corps Headquarters"
 PAKX_p_corps_desc: "The headquarters of the army corps coordinate everything, and the guardians of the constitution have become military commanders. The commanders of the nine corps form the de facto supreme authority, meeting monthly at headquarters in Rawalpindi to decide everything from counterterrorism operations to food prices."
 PAKX_p_ordinance: "Suspending the Constitution"
 PAKX_p_ordinance_desc: "Under the ‘state of emergency’, parts of the constitution are suspended, the government rules by presidential ordinance, and assembly and the press are restricted. This time, people say, it is only temporary. But in this country, ‘temporary’ often means several years."
 PAKX_p_intel: "Intelligence Dominance"
 PAKX_p_intel_desc: "Inter-Services Intelligence controls domestic surveillance and the files on politicians, and each of its reports can decide a cabinet's fate. Which politician is prosecuted, which TV channel is taken off the air and which journalist is ‘invited for a chat’ all depend on the intelligence services."
 PAKX_p_judge_sub: "Reappointing the Judges"
 PAKX_p_judge_sub_desc: "High court judges are required to take a new oath under the Provisional Constitutional Order; those who refuse are removed, and candidates loyal to the army replace a number of independent judges. The courts no longer challenge the government's legitimacy, but discontent in the legal profession quietly builds."
 PAKX_p_army_final: "Army and Nation as One"
 PAKX_p_army_final_desc: "The state and the army have become one: military foundations run banks, fertilizer plants and real estate, and retired generals head ministries and state enterprises. Some call it stability, others call it military rule. History will give its own answer."
 PAKX_m_root: "The Foundations of Defense"
 PAKX_m_root_desc: "The threat from India, the Afghan border and counterterrorism at home make the army the nation's first priority forever. Pakistan has fought four wars with India since independence, and shelling never stops along the Line of Control in Kashmir. Defense takes a large share of the budget, but no government dares cut it lightly."
 PAKX_m_army: "Armoring the Army"
 PAKX_m_army_desc: "Modernizing the armored divisions and mechanized infantry gives the army mobility both on the border and on the plains. Domestically built Al-Khalid main battle tanks enter service, and the armored formations on the Punjab plain are a direct answer to India's ‘Cold Start’ doctrine."
 PAKX_m_nuke: "Credible Minimum Deterrence"
 PAKX_m_nuke_desc: "Nuclear weapons are the nation's last guarantee. Since the 1998 tests in the Chagai Hills, the principle of ‘credible minimum deterrence’ has set the number of every missile: enough to keep New Delhi from acting rashly, but not so many as to bankrupt the state."
 PAKX_m_navy: "Naval Submarine Program"
 PAKX_m_navy_desc: "The navy buys new submarines and frigates from China and expands its two main bases at Karachi and Gwadar, greatly raising its presence in the Indian Ocean. Its goal is clear: keep the Arabian Sea lanes open in wartime and stop the Indian Navy from blockading Karachi."
 PAKX_m_air: "JF-17 Thunder Squadrons"
 PAKX_m_air_desc: "The JF-17 Thunder, developed jointly with China, enters frontline service with the air force and is assembled at the aeronautical complex in Kamra. Cheap and reliable, it is an export star, and it means the Pakistan Air Force no longer depends entirely on American F-16s and their spare parts."
 PAKX_m_isi: "The ISI"
 PAKX_m_isi_desc: "Inter-Services Intelligence has far more influence over Afghanistan and Kashmir than any other institution. It once trained the Afghan mujahideen and is accused of keeping ties with the Taliban. Foreign intelligence agencies cannot do without it, yet never fully trust it."
 PAKX_m_border: "The Afghan Border and Counterterrorism"
 PAKX_m_border_desc: "The tribal belt on both sides of the Durand Line is a sanctuary for militants. The Pakistani Taliban launch their attacks from here, and the situation in Afghanistan keeps the border in constant turmoil. Every clash on the border forces the army to redeploy, and counterterrorism costs stability and public goodwill."
 PAKX_m_missile: "Short-Range Missiles"
 PAKX_m_missile_desc: "The Abdali and Nasr short-range missiles keep India's frontline forces under constant threat. The Nasr, which can carry a tactical nuclear warhead, is aimed squarely at Indian armored thrusts and makes New Delhi's ‘Cold Start’ plans very costly."
 PAKX_m_sub: "Chinese-Built Submarines"
 PAKX_m_sub_desc: "The Hangor-class submarines, based on China's Type 039, are launched in Karachi, giving the Pakistan Navy a blue-water capability for the first time. With air-independent propulsion they can stay submerged for weeks and threaten Indian carrier groups in wartime."
 PAKX_m_jf17: "Deploying the Thunder Squadrons"
 PAKX_m_jf17_desc: "The Thunder squadrons rotate through the air bases between Karachi and Lahore, linked with airborne early warning aircraft and ground radar into a complete air defense network. The pilots have gained real combat experience in repeated standoffs with the Indian Air Force, and the air battle of 2019 left the force in high spirits."
 PAKX_m_ct: "Counterterrorism Operations"
 PAKX_m_ct_desc: "In the northwestern mountains, one clearing operation after another, such as Zarb-e-Azb and Radd-ul-Fasaad, has cost the army dearly but won some security. The militant strongholds in North Waziristan have been destroyed, but the fighters have scattered into small groups and may return at any time."
 PAKX_m_industry: "Defense Industry: Heavy Industries Taxila"
 PAKX_m_industry_desc: "The defense plants in Taxila and Kamra produce ammunition, armored vehicles and missile components. Heavy Industries Taxila started out assembling Chinese tanks and can now make most parts of the Al-Khalid tank itself, and has even begun exporting to the Middle East and Africa."
 PAKX_m_coast: "Coastal Defense and Gwadar"
 PAKX_m_coast_desc: "The navy takes over coastal defense at Gwadar, protecting Chinese investment and the shipping lanes in and out. Baloch separatists have repeatedly attacked the port and foreign engineers, and the arrival of marines and coastal missile units lets Beijing and Islamabad both breathe easier."
 PAKX_m_airdef: "Air Defense and Early Warning"
 PAKX_m_airdef_desc: "An early warning network of radars and air defense missiles now covers the country's major cities and nuclear facilities. Newly acquired long-range air defense systems are deployed around the capital, so that any ‘surgical strike’ will come at a price."
 PAKX_m_drone: "Drones and Electronic Warfare"
 PAKX_m_drone_desc: "Drones and electronic warfare equipment reach the border units, and the domestically built Shahpar drone can circle over the mountains for more than ten hours at a time. Operations are cheap and low-risk, but civilian casualties deepen resentment in the tribal areas, and controversy follows."
 PAKX_m_drill: "National Defense Exercises"
 PAKX_m_drill_desc: "‘Total defense’ exercises are held across the country, and reservists and militia train on the same operational map as the regular army for the first time. Indian offensives are simulated on the Punjab plain, in the Sindh desert and in the northern mountains, and the provincial governments rehearse wartime distribution of supplies."
 PAKX_m_alliance: "Joint Training with China"
 PAKX_m_alliance_desc: "The Shaheen joint air exercises and joint army counterterrorism training give the two militaries real practice together in tactics and logistics. Chinese military advisers are permanently stationed in Pakistan, and the two countries' equipment is ever more compatible. New Delhi watches all this with great alarm."
 PAKX_m_naval_base: "Karachi Naval Base"
 PAKX_m_naval_base_desc: "The naval base at Karachi is expanded, and the new docks can repair large frigates and submarines. The shipyard begins building its own patrol vessels, so the navy's logistics no longer depend entirely on foreign yards, and damaged ships can be repaired on the spot in wartime."
 PAKX_m_cyber: "Cyber Warfare and Signals Intelligence"
 PAKX_m_cyber_desc: "The army's cyber warfare unit monitors communications on the border and at home, and also fends off Indian cyberattacks. The two countries' hackers never stop clashing online, and defaced government websites and infiltrated power grids have become routine."
 PAKX_m_reserve: "Reserves and Conscription"
 PAKX_m_reserve_desc: "Reserve training cycles are lengthened and recruitment is extended to more provinces. In the past most of the army's soldiers came from Punjab; now young men from Sindh and Balochistan are actively recruited too, as the army hopes to become a truly national institution."
 PAKX_m_final: "The Nuclear Deterrent Is Complete"
 PAKX_m_final_desc: "After a successful missile test, the Ministry of Defense announces that ‘credible minimum deterrence’ has been achieved: land-, air- and sea-based nuclear forces form a complete triad. Pakistan finally has a second-strike capability. India's response comes quickly."
 PAKX_m_sat: "Satellites and Space"
 PAKX_m_sat_desc: "The army's remote sensing satellites and missile warning program get under way, and border reconnaissance no longer depends entirely on foreign intelligence."
 PAKX_m_coastguard: "Expanding the Coast Guard"
 PAKX_m_coastguard_desc: "The coast guard gets more patrol boats and helicopters, and cases of smuggling and illegal fishing fall year by year. Along the long coastline from Karachi to Gwadar, drug, fuel and people smuggling were once a source of income for local strongmen; now their business is getting ever harder."
 PAKX_e_root: "The Economy: Debt, Exports and the Corridor"
 PAKX_e_root_desc: "Pakistan's economy is held up by cotton textiles, remittances and foreign aid. Foreign reserves often cover only a few months of imports, the rupee keeps falling, and a single debt crisis is enough to narrow the whole country's choices. The first task of every new government is to find money."
 PAKX_e_imf: "Sign an IMF Bailout"
 PAKX_e_imf_desc: "The IMF's bailout loan arrives, Pakistan's twenty-somethingth such program. But every tranche comes with conditions on tax and subsidy reform: higher electricity prices and the end of fuel subsidies, followed by protests in the streets."
 PAKX_e_self: "Self-Driven Reform and State Enterprise Consolidation"
 PAKX_e_self_desc: "Rejecting the conditions of international aid, the government pushes its own reforms of state firms and taxes, merging and restructuring the loss-making national airline, steel mill and power companies. This road preserves policy independence, but the price is higher interest rates and tighter credit."
 PAKX_e_tax: "Tax Reform"
 PAKX_e_tax_desc: "Value-added and income tax are extended to more sectors, and farm income and retailers are brought into the tax net for the first time. Fewer than two percent of over two hundred million people file income tax returns, and uncollected taxes remain the biggest problem."
 PAKX_e_debt: "Debt Restructuring Talks"
 PAKX_e_debt_desc: "Negotiations with Chinese, Gulf and Western creditors push part of the debt out to longer maturities. Saudi deposits are rolled over, Chinese loans refinanced and Paris Club debt partly forgiven, so the country avoids default for now, but the interest burden is still heavy."
 PAKX_e_power: "Energy Subsidies and Imported Gas"
 PAKX_e_power_desc: "The power companies have lost money for years, the ‘circular debt’ keeps growing, and the government keeps the lights on with subsidies and imported LNG. Summer load-shedding often lasts more than ten hours, and every blackout is political news. New power plants and transmission lines are being rushed into construction."
 PAKX_e_textile: "Textile and Garment Exports"
 PAKX_e_textile_desc: "Cotton textiles and garments are Pakistan's most important export industry, making up more than half of total exports. Faisalabad is called the ‘Manchester of Pakistan’, millions of workers' livelihoods depend on its looms, and EU tariff preferences are their most important guarantee of a market."
 PAKX_e_telecom: "Telecoms and Mobile Networks"
 PAKX_e_telecom_desc: "Competition among private telecom companies has driven mobile phone costs down sharply, and mobile networks now cover most of the countryside. Farmers in remote villages check market prices and receive remittances on their phones, and mobile payments bring people who never had a bank account into the financial system."
 PAKX_e_remit: "Remittances from Workers Abroad"
 PAKX_e_remit_desc: "Millions of Pakistanis working in the Gulf and the West send home around thirty billion dollars a year, a large share of foreign exchange earnings. Construction workers in Dubai and taxi drivers in London prop up consumption and foreign reserves back home with their sweat."
 PAKX_e_cpec: "Launching the China-Pakistan Economic Corridor"
 PAKX_e_cpec_desc: "The economic corridor from Kashgar to Gwadar is officially launched. Road, power and port projects break ground one after another; debt and opportunity are drawn on the same blueprint."
 PAKX_e_agri: "Cotton and Irrigation"
 PAKX_e_agri_desc: "Cotton yields are limited by water shortages and pests, so repairing the irrigation canals is the first step of agricultural reform. The Indus basin has one of the largest contiguous irrigation systems in the world, but the canals the British left behind have decayed, and seepage and salinity are eating away at good farmland."
 PAKX_e_mining: "Mining and Steel"
 PAKX_e_mining_desc: "The mineral resources of Balochistan and Punjab need more investment: the copper and gold of Reko Diq and the lignite of Thar are world-class deposits. Yet the state steel mill in Karachi has been idle and losing money for years, and its capacity falls far short of construction demand."
 PAKX_e_gwadar: "Expanding Gwadar Port"
 PAKX_e_gwadar_desc: "The Chinese-built deep-water port at Gwadar is expanded, the first freighters berth, and plans for the port and its special economic zone begin to take shape. This former fishing village is meant to become western China's gateway to the Arabian Sea, but local Baloch residents complain they cannot even get fresh water."
 PAKX_e_motorway: "Motorways and Railways"
 PAKX_e_motorway_desc: "The motorway and railway network from Peshawar to Karachi is gradually completed, cutting freight times in half. The upgrade of Main Line 1 under the corridor program modernizes the old colonial-era railway for the first time."
 PAKX_e_it: "IT Outsourcing and Young Talent"
 PAKX_e_it_desc: "Freelancers and IT outsourcing firms are growing fast in Karachi and Lahore, and the digital economy has become a new option for young people. Pakistan has one of the largest freelance workforces in the world, writing code for companies in Silicon Valley and London and earning as much foreign exchange as the textile mills."
 PAKX_e_tourism: "Tourism in the North"
 PAKX_e_tourism_desc: "In Gilgit and the Swat Valley, the snow peaks of the Karakoram and old Silk Road towns draw tourists from home and abroad, bringing new income. But roads, hotels and security still lag behind, and the shadow the Taliban once cast over Swat has not fully lifted."
 PAKX_e_airport: "Airports and Logistics Hubs"
 PAKX_e_airport_desc: "The international airports at Islamabad and Karachi are expanded, along with plans for cargo hubs and free trade zones. The government wants to make Pakistan a logistics center linking Central Asia, the Middle East and South Asia, sending Afghan and Central Asian goods to the sea through Pakistan."
 PAKX_e_banking: "Reforming the State Banks"
 PAKX_e_banking_desc: "Bad loans are gradually stripped out of the state banks, and a new regulator begins checking their capital adequacy. These banks used to be ATMs for politicians, lending to the well connected and leaving the treasury to cover the bad debts; now the State Bank requires them to operate on commercial terms."
 PAKX_e_stock: "Opening the Stock Market"
 PAKX_e_stock_desc: "The Pakistan Stock Exchange opens to foreign investors, and capital market rules come close to international standards for the first time. After the merger of the Karachi, Lahore and Islamabad exchanges, trading volumes rise steadily, and some shares in state enterprises begin to be sold on the market."
 PAKX_e_final: "The Corridor Economy Takes Shape"
 PAKX_e_final_desc: "The first large cargo ship docks at Gwadar, and the CPEC highway opens. For the first time, Pakistan's economy has a clear backbone."
 PAKX_f_root: "The Great Game in South Asia"
 PAKX_f_root_desc: "Wedged between India, Afghanistan, Iran and China, Pakistan's diplomacy relies on the balancing act of ‘keeping some distance from every great power’. In the Cold War it was an American ally and also the go-between for Sino-American rapprochement; now it must keep walking the tightrope between Beijing, Washington and Riyadh."
 PAKX_f_china: "All-Weather Strategic Partner of China"
 PAKX_f_china_desc: "The friendship between the two countries is described as ‘higher than the mountains, deeper than the oceans and sweeter than honey’, and it is enshrined as an ‘all-weather strategic cooperative partnership’. From the Karakoram Highway to nuclear power plants, China has always been the most reliable friend, and it never leaves Pakistan isolated diplomatically."
 PAKX_f_india: "Relations with India and Kashmir"
 PAKX_f_india_desc: "The sovereignty dispute over Kashmir has never been resolved, and the two countries have fought three wars over it since Partition in 1947. The Mumbai attacks, the Pulwama suicide bombing and the air strikes that followed: every clash on the border plunges their diplomacy into deadlock."
 PAKX_f_us: "Repairing Relations with America"
 PAKX_f_us_desc: "After the withdrawal from Afghanistan, US–Pakistan relations went through a cold spell: Washington accused Islamabad of playing both sides, and Islamabad complained of being used and then discarded. New cooperation starts with counterterrorism and trade, as each side tests how much trust is left."
 PAKX_f_gulf: "Gulf Money and the Road to Hajj"
 PAKX_f_gulf_desc: "Investment and aid from the Gulf states are an important source of Pakistan's foreign exchange, and Pakistani soldiers have long trained Saudi forces and guarded the holy places. The millions of pilgrims who travel to Mecca each year and the workers in the Gulf are also an unbreakable link between the two."
 PAKX_f_cpec: "Diplomatic Cover for CPEC"
 PAKX_f_cpec_desc: "The foreign ministry works to win international support for the projects of the China–Pakistan Economic Corridor and to handle the security and public opinion problems along its route. India objects to the corridor crossing Gilgit-Baltistan, the West questions its debt risks, and Baloch militants target Chinese engineers."
 PAKX_f_weapons: "Buying Chinese Arms"
 PAKX_f_weapons_desc: "Fighters, submarines and missiles bought from China are the Pakistani military's most important source of equipment. American arms sales come and go and often carry the risk of sanctions, while Chinese equipment is cheap, delivered quickly and comes with no political strings, so it is the natural first choice."
 PAKX_f_sco: "Shanghai Cooperation Organisation"
 PAKX_f_sco_desc: "The Shanghai Cooperation Organisation, which Pakistan formally joined in 2017, gives it a platform for dialogue with Central Asia, Russia and Iran. Here the leaders of Pakistan and India have to share a room, and now and then exchange a few words in the corridors."
 PAKX_f_china_final: "The All-Weather Partnership Takes Shape"
 PAKX_f_china_final_desc: "The leaders of Pakistan and China issue a joint statement announcing a new stage in their all-weather strategic cooperative partnership: the second phase of the corridor, a jointly developed new fighter and a bilateral currency swap are all signed at once. Pakistan's balance between the great powers has clearly tilted east."
 PAKX_f_aid: "US Aid and Counterterrorism Cooperation"
 PAKX_f_aid_desc: "American aid and intelligence sharing keep the counterterrorism campaign going, but every dollar comes with conditions on human rights and on cracking down on terrorist groups. Each year when Congress reviews the aid it asks: how could bin Laden live for years next to the military academy in Abbottabad?"
 PAKX_f_drone: "Drone Strikes and Sovereignty"
 PAKX_f_drone_desc: "American drone strikes in the tribal areas provoke fierce protests. Every strike might kill terrorists, or it might kill civilians at a wedding. Parliament passes resolutions condemning the violation of sovereignty, while the intelligence services privately keep supplying targets. The argument between sovereignty and security never ends."
 PAKX_f_afghan: "After the Afghan Withdrawal"
 PAKX_f_afghan_desc: "After NATO's withdrawal, the situation in Afghanistan grows tense again. The Taliban are back in power, and Pakistan once thought this would bring a friendly western neighbor; instead, attacks by the Pakistani Taliban keep increasing. The border is both an exit for refugees and a security front line."
 PAKX_f_us_final: "Resetting US-Pakistan Relations"
 PAKX_f_us_final_desc: "The two countries reach new agreements on counterterrorism, trade and education: the US opens more textile quotas, the Fulbright program expands, and military exchanges resume. Washington and Islamabad have found a common road once again."
 PAKX_f_kashmir: "Standoff in Kashmir"
 PAKX_f_kashmir_desc: "Shelling and patrols on both sides of the Line of Control mean every negotiation starts with the smell of gunpowder. After India revoked the special status of Jammu and Kashmir in 2019, relations fell to freezing point, and villagers on the border once again took shelter in bunkers."
 PAKX_f_indus: "The Indus Waters Treaty"
 PAKX_f_indus_desc: "The Indus Waters Treaty, signed in 1960, has survived three wars and is one of the few areas of cooperation between the two countries. But the dams India is building upstream worry farmers downstream: if New Delhi ever decides to hold back the water, the fields of Punjab will dry up."
 PAKX_f_peace: "An Attempt at Peace with India"
 PAKX_f_peace_desc: "Diplomats from the two countries meet secretly in a third country, and the agenda stretches from trade and visas all the way to the future of Kashmir. Hardliners on both sides apply pressure at home, and any concession could be denounced as treason. The negotiating table is set, but the chairs are not yet filled."
 PAKX_f_gulf_money: "Gulf Money and Aid"
 PAKX_f_gulf_money_desc: "Investment and loans from Saudi Arabia and the UAE provide crucial funding for energy and infrastructure projects. Riyadh's deferred oil payments and Abu Dhabi's central bank deposits come to the rescue whenever reserves run dry, and the price is that Pakistan can hardly stay out of the Gulf's quarrels."
 PAKX_f_turkey_iran: "Turkey and Iran: A Third Way in the Islamic World"
 PAKX_f_turkey_iran_desc: "Trilateral cooperation with Turkey and Iran gives Pakistan a position in the Muslim world that depends on no single side. Ankara supplies warships and drones, Tehran supplies gas and border trade, and Islamabad hopes it will not have to choose between Saudi Arabia and Iran."
 PAKX_f_saudi: "Energy Cooperation with Saudi Arabia"
 PAKX_f_saudi_desc: "Saudi crude supplies and Hajj arrangements are the most practical cooperation between the two countries. Every swing in energy prices shows up on Pakistani electricity bills."
 PAKX_f_roc: "Pragmatic Relations with the ROC"
 PAKX_f_roc_desc: "Taipei and Islamabad, without formal diplomatic ties, have found practical room for trade, education and people-to-people exchanges. Taiwanese textile machinery and semiconductor components reach Pakistani factories, and Pakistani students begin to appear in graduate schools in Hsinchu and Tainan."
 PAKX_f_roc_trade: "Taiwan-Pakistan Trade and Investment"
 PAKX_f_roc_trade_desc: "Trade in textiles, pharmaceuticals and farm produce grows year by year: Taiwanese textile machinery and synthetic fibers go to Faisalabad, and Pakistani mangoes, surgical instruments and cotton yarn go to Kaohsiung. Chambers of commerce, academic exchanges and direct flights between Taipei and Islamabad increase every year."
 PAKX_f_mediation: "Balancing Between the Great Powers"
 PAKX_f_mediation_desc: "Rivalry between China and America, the standoff between India and China: Pakistan has found a place in the middle and uses it to win more room to maneuver."
 PAKX_f_final: "Diplomacy in Every Direction"
 PAKX_f_final_desc: "Friendly with the great powers, at peace with its neighbors and with a voice in regional bodies: Pakistan's diplomacy no longer has to choose a single answer. Beijing, Washington, Riyadh and Ankara all see Islamabad as a partner they can work with, and a country once called ‘the most dangerous in the world’ has won respect it has long lacked."
 PAKX_i_root: "Livelihoods and Security: The Nation's Second Front"
 PAKX_i_root_desc: "Armed militants on the border, crime in the cities and poverty in the countryside will decide whether Pakistan can truly become stable. For most Pakistanis, more pressing than Kashmir are the blackouts, prices, their children's schools and whether they can get home safely at night. This is the nation's second front."
 PAKX_i_baloch: "Baloch Separatism"
 PAKX_i_baloch_desc: "Balochistan is the largest, least populated and poorest province, and its separatist movement has never died down. Gas from the Sui field supplies the whole country, yet local people cannot use it; the port of Gwadar is booming, yet local fishermen are shut out. The security of the gas fields and the port is the government's greatest worry."
 PAKX_i_ttp: "The Pakistani Taliban and Khyber Pakhtunkhwa"
 PAKX_i_ttp_desc: "Militant groups in the northwest keep attacking, targeting schools, markets and mosques. The government's response is both military and political."
 PAKX_i_madrasa: "Madrasas and Extremism"
 PAKX_i_madrasa_desc: "Thousands of madrasas give food and shelter to children from poor families, and have also become breeding grounds for extremism. Calls for reform are growing louder."
 PAKX_i_counter: "Counterterrorism and Intelligence Cooperation"
 PAKX_i_counter_desc: "Cooperation between the intelligence agencies and the police gradually improves, and the old habit of each working alone without sharing begins to change. Cross-provincial tracking and information sharing get under way, the National Counter Terrorism Authority builds a single suspect database, and leads from Peshawar to Karachi can be connected within hours for the first time."
 PAKX_i_nap: "National Action Plan"
 PAKX_i_nap_desc: "After the massacre at the Army Public School in Peshawar in 2014, a National Action Plan covering counterterrorism, madrassa registration, hate speech and refugee resettlement is adopted and written into the government's annual budget. The army, the civilian government and the provinces agree on internal security for the first time."
 PAKX_i_police: "Police Reform"
 PAKX_i_police_desc: "Reforms of training and pay for the local police mean ordinary people are willing to turn to an officer in the street for the first time. Police stations used to be bywords for corruption and torture, with station chiefs picked by local politicians; now police boards handle appointments, and women officers and community police posts appear in the neighborhoods."
 PAKX_i_security_final: "Security in the Cities and on the Border"
 PAKX_i_security_final_desc: "The ‘Safe City’ surveillance networks in Karachi and Lahore, together with more than two thousand kilometers of fencing on the Afghan border, bring back a sense of security, and bombings and kidnappings fall noticeably. But mass surveillance and cases of enforced disappearance draw sharp criticism from human rights groups."
 PAKX_i_refugees: "Resettling Afghan Refugees"
 PAKX_i_refugees_desc: "Millions of Afghan refugees have lived in Pakistan for decades, and their children were born and raised in Peshawar without ever seeing Afghanistan. The government keeps wavering between resettlement and repatriation: giving them status costs more than the budget can bear, while forcing them back brings international condemnation."
 PAKX_i_edu: "Education and Girls' Schooling"
 PAKX_i_edu_desc: "‘Every child in school’: more than twenty million children are still out of school, most of them girls. The shooting of Malala in Swat shocked the world, and girls' enrollment has become a yardstick of national progress. The government builds new girls' schools in the countryside and pays stipends to families who enroll their daughters."
 PAKX_i_health: "Universal Health Insurance"
 PAKX_i_health_desc: "The Sehat Card program lets poor families be treated in public and private hospitals for free, and public hospital coverage and insurance reimbursement rise year by year. But drug shortages and the loss of medical staff are still serious: many doctors and nurses leave for the Gulf and Britain as soon as they graduate."
 PAKX_i_flood: "The 2022 Floods and Reconstruction"
 PAKX_i_flood_desc: "Monsoon floods submerged a third of the country. International aid is on an unprecedented scale, and the first step of reconstruction is rebuilding the river embankments."
 PAKX_i_urban: "Urbanization and Karachi"
 PAKX_i_urban_desc: "Hundreds of thousands of people move from the countryside to Karachi every year, and the city now has more than twenty million inhabitants. Housing and water shortages push its outskirts and informal settlements ever outward, and residents of the katchi abadis have neither land titles nor running water. The government begins planning new industrial zones and housing projects."
 PAKX_i_media: "Media and Free Speech"
 PAKX_i_media_desc: "Self-censorship by the news media on political and security issues means many truths can only circulate on social media. Channels being taken off air and journalists being followed are open secrets in the industry. The government announces looser media controls, but the army's ‘red lines’ remain, and no one knows exactly where they are drawn."
 PAKX_i_climate: "Climate Adaptation and Melting Glaciers"
 PAKX_i_climate_desc: "Melting glaciers in the north and an erratic monsoon make water planning a hard problem. Pakistan produces less than one percent of global greenhouse emissions, yet it is one of the countries hit hardest by climate change: glacial lake outburst floods on one side, heat waves and drought in Sindh on the other."
 PAKX_i_youth: "Youth and Jobs"
 PAKX_i_youth_desc: "More than sixty percent of Pakistanis are under thirty, and millions of young people enter the labor market every year, but jobs cannot keep pace with population growth. The government launches youth business loans and vocational training programs, hoping to turn the ‘demographic dividend’ into growth rather than anger in the streets."
 PAKX_i_census: "Census and Fertility"
 PAKX_i_census_desc: "The new census shows the population has passed 240 million, but the birth rate is falling and urban families are having fewer children. The provinces quarrel endlessly over the results because seats and revenue sharing depend on them. The government begins discussing long-term family policy and pensions."
 PAKX_i_water2: "Karachi's Water Supply"
 PAKX_i_water2_desc: "Karachi has long relied on groundwater and distant pipelines. A new water plant means the city has water for more than twelve hours a day for the first time."
 PAKX_i_ngo: "Charities and NGOs"
 PAKX_i_ngo_desc: "The ambulances and free kitchens of the Edhi Foundation reach every disaster zone before the government does. Charities and NGOs serve disaster areas and poor communities, and the government, once deeply suspicious of foreign-funded groups, now lets them register and operate within a legal framework."
 PAKX_i_social_final: "A Pakistan That Develops Together"
 PAKX_i_social_final_desc: "The nation's new plan puts education, health care and jobs first. The government promises that every child will go to school and every family will be able to see a doctor."
 PAKX_i_final: "Internal Reconciliation"
 PAKX_i_final_desc: "Security and people's livelihoods are no longer two separate matters. Schools, hospitals and jobs leave extremist groups without recruits, and police and courts give ordinary people reason to trust the state. For the first time Pakistan's domestic policy has a visible guiding thread, and the state begins to truly reconcile with its own people."
