 roc_return.110.t: "议案：年度总预算案"
 roc_return.110.d: "行政院向国民大会提出新年度的中央政府总预算。光复后百废待举，每一笔钱都牵动各方利益。\n\n执政联盟掌握 [?TAI_na_gov|0] 席（[?TAI_na_support_pct|0]%）。过半数才能依多数通过。"
