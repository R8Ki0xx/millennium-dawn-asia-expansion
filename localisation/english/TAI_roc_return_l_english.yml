 ### 提示
 TAI_mainland_unrest: "大陆局势动荡度"
 TAI_mainland_unrest_tt: "大陆局势动荡度: $RIGHT|+=0$"
 TAI_unrest_mechanic_tt: "开启§Y大陆局势动荡度§!（0-100）。大陆政局不稳、陷入内战或与大国交战时，动荡度会逐月上升。\n动荡度 ≥ §Y50§! 时可以§R反攻大陆§!，≥ §Y70§! 时可提出§G和平统一§!，≥ §Y80§! 时可以§R点燃大陆起义§!。"
