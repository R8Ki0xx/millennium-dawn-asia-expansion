 TAI_global_chinese_network_idea_desc: "Chinese chambers of commerce around the world bring the nation capital and connections."
 TAI_maritime_china_idea: "Maritime China"
 TAI_maritime_china_idea_desc: "China's future lies at sea."
 TAI_blue_water_idea: "Blue-Water Diplomacy"
 TAI_blue_water_idea_desc: "Carrier groups are the Republic of China's most powerful calling card."
 TAI_south_asia_partner_idea: "South Asian Partner"
 TAI_south_asia_partner_idea_desc: "Free trade with the nations of South Asia."
 TAI_study_abroad_idea: "Returning Graduates"
 TAI_study_abroad_idea_desc: "Students who studied abroad come home to help build the nation."
 TAI_olympic_glory_idea: "Olympic Glory"
 TAI_olympic_glory_idea_desc: "The Nanjing Olympics have shown the world a new China."
 TAI_diplo_partner: "Diplomatic Partner"
 TAI_diplo_rival: "Diplomatic Friction"
 roc_return.130.t: "Nanjing Wins the Olympic Bid"
 roc_return.130.d: "The President of the International Olympic Committee has announced the host city of the Games of the XXIX Olympiad: Nanjing, Republic of China! The city at the foot of Purple Mountain erupts in celebration."
 roc_return.130.a: "Let the world witness China's rebirth!"
 roc_return.131.t: "The Group of Nine"
 roc_return.131.d: "The G8 leaders' summit has unanimously agreed to invite the Republic of China to join. From now on, the G8 is the G9."
 roc_return.131.a: "China is back at the center of the world stage."
 roc_return.132.t: "Sino-Indian Border Talks"
 roc_return.132.d: "Chinese and Indian representatives have opened border talks in New Delhi. India is willing to settle on the basis of the McMahon Line in exchange for a Chinese promise not to use force over South Tibet."
 roc_return.132.a: "Sign the border agreement."
 roc_return.132.b: "The talks collapse."
 roc_return.133.t: "The Shanghai World Expo Opens"
 roc_return.133.d: "On both banks of the Huangpu River, pavilions from more than two hundred countries and international organizations compete for attention. Seventy million visits are expected over six months."
 roc_return.133.a: "Better city, better life."
 TAI_host_apec: "Host the APEC Summit"
 TAI_host_apec_desc: "Host the APEC leaders' summit in Shanghai and show the world the new China after the Restoration."
 TAI_olympic_bid: "Bid for the Olympics"
 TAI_olympic_bid_desc: "Nanjing bids for the Summer Olympics, so that the whole world can witness the rebirth of the Republic of China."
 TAI_world_expo: "Shanghai World Expo"
 TAI_world_expo_desc: "‘Better City, Better Life’: the Shanghai World Expo will draw seventy million visits."
 TAI_sun_yatsen_institutes: "Sun Yat-sen Institutes"
 TAI_sun_yatsen_institutes_desc: "Open ‘Sun Yat-sen Institutes’ around the world to promote the Chinese language, Chinese culture and the Three Principles of the People."
 TAI_overseas_chinese_return: "Bring the Overseas Chinese Home"
 TAI_overseas_chinese_return_desc: "Call on fifty million overseas Chinese to come back to invest, settle and help rebuild."
 TAI_study_abroad: "Study Abroad Program"
 TAI_study_abroad_desc: "Send young mainlanders on state scholarships to top universities in Europe and America, to return and serve when they graduate."
 TAI_global_media: "International Media"
 TAI_global_media_desc: "Launch global Chinese and English television networks so the world can hear Nanjing's voice."
 TAI_un_reform: "UN Reform"
 TAI_un_reform_desc: "Push for Security Council reform, with the Republic of China leading how Asia's permanent seats are allotted."
 TAI_mutual_defense_treaty: "Sino-American Mutual Defense Treaty"
 TAI_mutual_defense_treaty_desc: "Upgrade the Taiwan Relations Act into a formal Sino-American mutual defense treaty."
 TAI_us_military_advisors: "US Military Advisory Group"
 TAI_us_military_advisors_desc: "A US military advisory group returns to China to help reorganize and train the National Army."
 TAI_space_cooperation: "Space and Technology Cooperation"
 TAI_space_cooperation_desc: "Work with NASA and take part in the International Space Station program."
 TAI_join_g8: "Join the G8"
 TAI_join_g8_desc: "The G8 expands into the G9, and the Republic of China joins the club of the world's leading industrial nations."
 TAI_eu_investment_agreement: "Sino-European Investment Agreement"
 TAI_eu_investment_agreement_desc: "Sign a comprehensive investment agreement with the European Union, opening China to a wave of European capital."
 TAI_lift_arms_embargo: "Lift the EU Arms Embargo"
 TAI_lift_arms_embargo_desc: "The 1989 arms embargo aimed at the CCP should end now that the CCP is gone."
 TAI_trans_pacific: "Trans-Pacific Partnership"
 TAI_trans_pacific_desc: "Form a high-standard free trade area with the nations of the Pacific Rim."
 TAI_central_asia_five: "The Central Asian Five"
 TAI_central_asia_five_desc: "Build comprehensive partnerships with Kazakhstan, Kyrgyzstan, Tajikistan, Uzbekistan and Turkmenistan."
 TAI_energy_pipelines: "Central Asian Energy Pipelines"
 TAI_energy_pipelines_desc: "Lay oil and gas pipelines from the Caspian Sea to Shanghai."
 TAI_xinjiang_border_treaty: "Northwest Border Treaty"
 TAI_xinjiang_border_treaty_desc: "Settle the northwest border with our Central Asian neighbors once and for all, in exchange for a joint fight against frontier separatist movements."
 TAI_mongolia_corridor: "China-Mongolia Economic Corridor"
 TAI_mongolia_corridor_desc: "Link the Mongolian Plateau with railways and mining development."
 TAI_arctic_route: "Arctic Shipping Route"
 TAI_arctic_route_desc: "Develop the Arctic Ocean route together with Russia, opening a new sea road to Europe."
 TAI_eurasian_bridge: "Eurasian Land Bridge"
 TAI_eurasian_bridge_desc: "The great railway artery from Lianyungang to Rotterdam is open along its whole length."
 TAI_war_reparations: "History and War Reparations"
 TAI_war_reparations_desc: "The war reparations from Japan that were given up in exchange for diplomatic recognition must now be faced again."
 TAI_cjk_fta: "China-Japan-Korea Free Trade Area"
 TAI_cjk_fta_desc: "East Asia's three great economies join hands to build the world's third-largest free trade area."
 TAI_ryukyu_question: "The Ryukyu Question"
 TAI_ryukyu_question_desc: "The status of the Ryukyus was decided without China's consent. The Republic of China will raise the Ryukyu question again on the international stage."
 TAI_east_china_sea_gas: "Joint East China Sea Gas Development"
 TAI_east_china_sea_gas_desc: "Develop oil and gas fields on both sides of the East China Sea median line together with Japan."
 TAI_korea_relations: "Sino-Korean Relations"
 TAI_korea_relations_desc: "Rebuild our traditional friendship with the Republic of Korea and work together for peace on the peninsula."
 TAI_ne_asia_security: "Northeast Asian Security Dialogue"
 TAI_ne_asia_security_desc: "Bring together China, Japan, South Korea, the United States and Russia to set up a standing security mechanism for Northeast Asia."
 TAI_africa_infrastructure: "African Infrastructure"
 TAI_africa_infrastructure_desc: "Build railways, ports and power grids for our African allies."
 TAI_latin_america_allies: "Latin American Allies"
 TAI_latin_america_allies_desc: "Strengthen our traditional ties with Central and South America, and expand trade with Brazil, Argentina and Mexico."
 TAI_middle_east_energy: "Middle East Energy Diplomacy"
 TAI_middle_east_energy_desc: "Sign long-term oil supply agreements with Saudi Arabia and the Gulf states."
 TAI_pacific_islands: "Pacific Island Nations"
 TAI_pacific_islands_desc: "These island nations were once Taiwan's most loyal diplomatic allies. After the Restoration, it is time to repay them."
 TAI_caribbean: "Caribbean Cooperation"
 TAI_caribbean_desc: "Work with the Caribbean nations, while extending an olive branch to Cuba."
 TAI_south_south_fund: "South-South Cooperation Fund"
 TAI_south_south_fund_desc: "Set up a ten-billion-dollar South-South Cooperation Fund to aid developing nations."
 TAI_global_chinese_chamber: "Global Chinese Business Network"
 TAI_global_chinese_chamber_desc: "Link the Chinese chambers of commerce in Southeast Asia, North America and Europe into a global Chinese business network."
 TAI_taiping_island: "Expand Taiping Island"
 TAI_taiping_island_desc: "Expand the airfield and harbor on Taiping Island in the Spratlys, making it our forward base in the South China Sea."
 TAI_spratly_garrison: "Spratly Garrison"
 TAI_spratly_garrison_desc: "Marines are stationed on the main islands and reefs of the Spratly Islands."
 TAI_maritime_silk_road: "Maritime China"
 TAI_maritime_silk_road_desc: "China's future lies at sea. Ports, shipping and shipbuilding will link East Asia with South Asia, Africa and Europe."
 TAI_scs_joint_development: "Joint Development of the South China Sea"
 TAI_scs_joint_development_desc: "‘Sovereignty is ours; shelve the disputes and develop together.’ Develop the resources of the South China Sea together with the ASEAN nations."
 TAI_scs_hardline: "Hard Line in the South China Sea"
 TAI_scs_hardline_desc: "Every inch of sea within the eleven-dash line is Chinese territory."
 TAI_far_seas_escort: "Far-Seas Escort"
 TAI_far_seas_escort_desc: "Send a fleet to the Gulf of Aden to escort and protect Chinese merchant ships."
 TAI_malacca_security: "Malacca Security"
 TAI_malacca_security_desc: "Work with Singapore, Malaysia and Indonesia to keep shipping in the Strait of Malacca safe."
 TAI_blue_water_diplomacy: "Blue-Water Diplomacy"
 TAI_blue_water_diplomacy_desc: "Show our strength with goodwill visits by carrier groups, turning the navy into a sharp tool of diplomacy."
 TAI_south_asia_policy: "South Asia Policy"
 TAI_south_asia_policy_desc: "On the other side of the Himalayas lies one of the most populous regions on earth."
 TAI_india_border_talks: "Sino-Indian Border Talks"
 TAI_india_border_talks_desc: "Negotiate on the basis of the McMahon Line in exchange for lasting peace with India."
 TAI_india_confrontation: "Sino-Indian Confrontation"
 TAI_india_confrontation_desc: "The Republic never recognized the McMahon Line. South Tibet is Chinese territory."
 TAI_pakistan_friendship: "Sino-Pakistani Friendship"
 TAI_pakistan_friendship_desc: "Carry on our friendship with Pakistan, ‘higher than the mountains and deeper than the sea’."
 TAI_bangladesh_ports: "Bangladeshi Ports"
 TAI_bangladesh_ports_desc: "Help build the port of Chittagong, giving the southwestern provinces an outlet to the sea."
 TAI_himalayan_states: "Nepal and Bhutan"
 TAI_himalayan_states_desc: "Build friendly relations with the Himalayan kingdoms to stabilize the Tibetan border."
 TAI_sri_lanka: "Sri Lankan Port"
 TAI_sri_lanka_desc: "Build a deep-water port at Hambantota to secure the Indian Ocean sea lanes."
 TAI_south_asia_fta: "South Asian Free Trade Area"
 TAI_south_asia_fta_desc: "Build a free trade area with the South Asian nations, opening a market of 1.5 billion people."
