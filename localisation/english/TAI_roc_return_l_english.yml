 roc_return.96.b: "暂不考虑。"
 roc_return.97.t: "南京的要求"
 roc_return.97.d: "中华民国政府要求[Root.GetName]承认其为宗主国，成为中华民国的特别行政区，并承诺维持现有的社会制度与生活方式。"
