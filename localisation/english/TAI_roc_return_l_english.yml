 roc_return.98.b: "不惜一战。"
 HKG_ROC.conservatism_desc: "保守主义 - 中国国民党香港总支部\n\n光复后由南京直接领导的国民党在港组织，主张「一国两制、三民主义」，以维护香港的繁荣稳定与自由经济为己任。"
 TAI_bloc_question: "阵营抉择"
 TAI_bloc_question_desc: "光复后的中华民国已是举足轻重的大国。我们是与西方民主国家并肩、加入北大西洋公约组织，还是由南京领导一个属于亚洲的阵营？"
 TAI_west_alignment: "与西方同行"
 TAI_west_alignment_desc: "自由民主是中华民国的立国之本。我们将与美国、欧洲和日本站在同一阵线。"
 TAI_nato_partnership: "北约伙伴关系"
 TAI_nato_partnership_desc: "在正式入约之前，先以「主要非北约盟友」身份参与北约的科技与情报合作。"
 TAI_nato_standards: "北约标准化"
 TAI_nato_standards_desc: "按照北约标准重编部队、统一弹药口径与通信协定，国军将能与盟军无缝协同作战。"
 TAI_join_nato: "和北约同行"
 TAI_join_nato_desc: "中华民国正式成为北大西洋公约组织的一员。从此，南京与华盛顿、伦敦、巴黎共同承担集体防卫的义务。"
 TAI_asia_pacific_nato: "亚太北约"
 TAI_asia_pacific_nato_desc: "北约的集体防卫不应止步于大西洋。中华民国将邀请日本、韩国与菲律宾一同加入。"
 TAI_asian_concert: "亚洲协和"
 TAI_asian_concert_desc: "亚洲的事务应由亚洲人自己决定。中华民国将以经济与外交影响力团结周边国家。"
 TAI_found_alliance: "创建亚太民主同盟"
 TAI_found_alliance_desc: "以南京为核心，成立一个保障亚太地区和平、民主与繁荣的同盟。"
 TAI_invite_neighbors: "邀请邻国入盟"
 TAI_invite_neighbors_desc: "向韩国、新加坡、菲律宾、蒙古与越南发出正式邀请。"
 TAI_alliance_army: "同盟联军"
 TAI_alliance_army_desc: "同盟成员定期举行联合演习，建立统一的指挥体系。"
