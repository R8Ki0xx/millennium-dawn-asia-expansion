 ### 提示
 TAI_mainland_unrest: "Mainland Unrest"
 TAI_mainland_unrest_tt: "Mainland Unrest: $RIGHT|+=0$"
 TAI_unrest_mechanic_tt: "Enables §YMainland Unrest§! (0-100). It rises every month while the mainland is politically unstable, in civil war, or at war with a major power.\nAt §Y50§! or more we can §RCounterattack on the Mainland§!; at §Y70§! or more we can propose §GPeaceful Unification§!; at §Y80§! or more we can §RIgnite a Mainland Uprising§!."
 TAI_unlock_mainland_work_decisions_tt: "Unlocks the decision category §YMainland Recovery Work§!."
 TAI_us_answer_tt: "Washington will decide whether to §Ytacitly approve§! our plans."
 TAI_unlock_us_intervention_tt: "Once at war with China, we can use a decision to §YRequest US Intervention§!."
 TAI_peace_talks_condition_tt: "Any of the following:\n - §YChina§! is already a democracy\n - §YChina§! has less than 30% stability\n - Mainland Unrest has reached 70"
 TAI_peace_talks_tt: "§YBeijing§! will decide whether to accept peaceful unification under the constitution of the Republic of China. If it accepts, §YChina§! will be merged into the Republic of China."
 TAI_peace_accept_tt: "§YChina§! will be annexed in full by the §YRepublic of China§!."
 TAI_uprising_condition_tt: "Mainland Unrest has reached §Y80§!"
 TAI_return_window_tt: "The time to strike has come (any of the following):\n - Mainland Unrest has reached §Y50§!\n - §YChina§! has less than 35% stability\n - §YChina§! is in a civil war\n - §YChina§! is at war with another major power"
 TAI_defectors_tt: "§G3§! PLA divisions will defect on the front line and join the National Army. Further defections can be won through decisions."
 TAI_defectors_small_tt: "§G2§! PLA divisions will defect on the front line and join the National Army."
 TAI_hk_macau_tt: "§YHong Kong§! and §YMacau§! will decide whether to return to the Republic of China."
 TAI_mongolia_tt: "§YMongolia§! will decide whether to accept a plan to return to the Republic of China. If it refuses, §RRecover Outer Mongolia§! is unlocked."
