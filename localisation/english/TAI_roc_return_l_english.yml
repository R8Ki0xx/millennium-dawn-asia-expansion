 TAI_gov_ly_status_tt: "If the ruling coalition holds a majority in the Legislative Yuan, it has §Gmajority support§!.\nWithout a majority it is a §Rminority government§!: political power -10%, stability -3%; Premier nominations have a 45% chance of being voted down, and each month there is a small chance of a no-confidence motion.\nA minority government can use the decision ‘Dissolve the Legislative Yuan’ to call an early election."
