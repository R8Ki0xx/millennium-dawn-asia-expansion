 roc_asia.40.a: "让改革继续深入。"
 roc_asia.40.b: "放慢步伐，防止风险。"
 roc_asia.40.t: "党代会：革新开放 2.0"
 roc_asia.40.d: "党代会通过了第二轮革新的纲领。一批国企被股份化，一批民营企业走进了国家战略的核心。"
 roc_asia.41.a: "纪律是胜利的保证。"
 roc_asia.41.b: "不要让纪律抑制了活力。"
 roc_asia.41.t: "党的领导全面加强"
 roc_asia.41.d: "整党整风达到高潮。党员人数与党支部数量创下新高，社会秩序前所未有地稳定。"
 roc_asia.42.a: "尊重选举的结果。"
 roc_asia.42.b: "担忧政局的碎片化。"
 roc_asia.42.t: "越南的首次多党选举"
 roc_asia.42.d: "来自多个政党与独立人士的候选人参加了选举，投票率高达八成。国会第一次拥有了真正的反对派。"
 roc_asia.43.a: "秩序压倒一切。"
 roc_asia.43.b: "逐步还政于民。"
 roc_asia.43.t: "军人治国的第一年"
 roc_asia.43.d: "军管会宣布取得「重大成就」：治安改善，工程完工，但国际社会的批评也日益尖锐。"
 roc_asia.44.a: "这是几代人努力的结果。"
 roc_asia.44.t: "亚洲新虎"
 roc_asia.44.d: "国际货币基金组织的报告称：越南已成为全球增长最快的经济体之一，人均收入进入高收入行列。"
 roc_asia.45.a: "坚守阵地，不退让。"
 roc_asia.45.b: "通过东盟寻求降温。"
 roc_asia.45.t: "南沙对峙"
 roc_asia.45.d: "越南在南沙岛礁部署导弹与雷达后，中国海警船与越南海警船在争议水域对峙，国际舆论高度关注。"
 roc_asia.46.a: "投入抗旱应急资金。"
 roc_asia.46.b: "转向耐盐作物与水产养殖。"
 roc_asia.46.t: "三角洲的盐碱化"
 roc_asia.46.d: "一场史无前例的干旱让咸水倒灌湄公河三角洲数百公里，稻田受灾严重。政府紧急启动应急计划。"
 KORX_security_review: "国防白皮书 · 安保总检讨"
 KORX_security_review_desc: "核危机、导弹威胁与美中战略竞争——国家安全会议决定对韩国的安保战略做一次总检讨。"
 KORX_nuclear_debate: "核武论战"
 KORX_nuclear_debate_desc: "「要不要拥有自己的核武器」成为全国辩论的焦点。民调显示过半民众支持核武装，美国与中国都在密切关注。"
 KORX_missile_forces: "导弹战略司令部"
 KORX_missile_forces_desc: "把分散在各军种的导弹部队整合为统一的战略司令部，统一规划玄武系列导弹的发展与部署。"
 KORX_nuclear_sharing: "核共享"
 KORX_nuclear_sharing_desc: "效仿北约的核共享安排：美国战术核武器部署在韩国，韩美联合规划与演练核作战。"
 KORX_independent_deterrent: "自主核威慑"
 KORX_independent_deterrent_desc: "核武器是国家安全的最终保证。国会通过决议，授权政府启动自主的核武器开发计划。"
 KORX_nonnuclear_pledge: "无核承诺"
 KORX_nonnuclear_pledge_desc: "政府重申《朝鲜半岛无核化共同宣言》，并以无核国家的身份寻求国际社会的安全保证。"
 KORX_nuclear_latency: "后处理与核潜伏能力"
 KORX_nuclear_latency_desc: "谈判修改《韩美原子能协定》，取得核燃料后处理与浓缩的权利，把「核潜伏能力」握在手中。"
 KORX_npt_exit: "宣布退出 NPT"
 KORX_npt_exit_desc: "依据条约第十条，韩国正式通知联合国安理会：国家最高利益已受到威胁，将在三个月后退出《不扩散核武器条约》。"
 KORX_peaceful_atom: "和平利用核能"
 KORX_peaceful_atom_desc: "以 NPT 缔约国的身份，发展民用核电与核燃料国产化，不碰红线。"
 KORX_hyunmoo: "玄武弹道导弹系列"
 KORX_hyunmoo_desc: "玄武-2 到玄武-5，射程与弹头重量不断提高——「怪物导弹」的出现让对朝鲜的常规威慑上了一个台阶。"
 KORX_kamd: "韩国型防空导弹网（KAMD）"
 KORX_kamd_desc: "以 L-SAM、天弓-2 与爱国者构成多层防空网，保卫首都圈免受朝鲜导弹与火炮攻击。"
 KORX_thaad_deploy: "接受萨德部署"
 KORX_thaad_deploy_desc: "美军萨德系统在星州部署完毕。中国的经济报复接踵而至，但首都圈的防空能力大大提高。"
 KORX_thaad_refuse: "拒绝萨德 · 三不"
 KORX_thaad_refuse_desc: "「不加入美国的导弹防御体系、不部署萨德、不结成韩美日军事同盟。」——这样与中国的经济往来不会受损。"
 KORX_us_forces_deal: "驻韩美军分担金协定"
 KORX_us_forces_deal_desc: "与华盛顿重新谈判「特别措施协定」。分担金的金额，成为同盟中的政治焦点。"
 KORX_deterrence_final: "韩国型三轴体系"
 KORX_deterrence_final_desc: "「杀伤链、韩国型防空与导弹防御、大量惩罚报复」三位一体，构成韩国自己的威慑体系。"
 KORX_demographic_commission: "人口危机对策委员会"
 KORX_demographic_commission_desc: "总和生育率跌破 1.0，学校关门、乡村空心化。总统亲自担任委员长，协调各部会的对策。"
 KORX_birth_incentives: "生育补贴与育儿津贴"
 KORX_birth_incentives_desc: "每个新生儿发放一次性补贴并提高育儿津贴，把「生孩子」变成国家支持的事业。"
 KORX_housing_supply: "首都圈住宅供给"
 KORX_housing_supply_desc: "首尔房价高企，是年轻人不婚不育的主因。政府宣布扩大首都圈的住宅供给。"
 KORX_pension_reform: "国民年金改革"
 KORX_pension_reform_desc: "年金基金预计在本世纪中叶枯竭。政府抛出改革方案，引发了世代之间的激烈争论。"
 KORX_childcare_system: "公立托育体系"
 KORX_childcare_system_desc: "建立覆盖全国的公立托育中心与课后照护，让上班的父母没有后顾之忧。"
 KORX_work_hours: "缩短工时与弹性工作"
 KORX_work_hours_desc: "把每周最长工时压缩到 52 小时以内，并推广弹性工作与育儿假。财阀团体强烈反对。"
 KORX_jeonse_reform: "全税房制度改革"
 KORX_jeonse_reform_desc: "以「全税」预付高额保证金租房的传统制度，让租客与房东都承担了巨大风险。政府推出新的租赁保障。"
 KORX_new_towns: "新城开发"
 KORX_new_towns_desc: "在首都圈外围开发新城，配套地铁与产业园区，疏解首尔的人口压力。"
 KORX_pension_raise: "提高缴费率与领取年龄"
 KORX_pension_raise_desc: "提高缴费率、延后领取年龄，换取年金基金的长期稳定——但这对年轻与老年两代人都不是好消息。"
 KORX_basic_pension: "基础年金全面发放"
 KORX_basic_pension_desc: "向全体老年人发放基础年金，缓解老年贫困——老年贫困率居经合组织之首。"
 KORX_immigration_policy: "多文化社会与外劳签证"
 KORX_immigration_policy_desc: "放宽 E-9 外劳签证与永久居留，推动「多文化」融合政策，补足劳动力缺口。"
 KORX_regional_balance: "地方均衡发展与世宗"
 KORX_regional_balance_desc: "把更多中央机关迁往世宗，扶植釜山、光州等地方核心城市，打破「首尔共和国」的局面。"
 KORX_elderly_care: "长期护理保险"
 KORX_elderly_care_desc: "扩充老年长期护理保险，培训护理人员，应对「超高龄社会」的到来。"
 KORX_demographic_final: "新的社会契约"
 KORX_demographic_final_desc: "住房、育儿、养老与劳动——一整套相互衔接的制度，让年轻一代重新相信未来。"
 KORX_constitutional_convention: "修宪咨询委员会"
 KORX_constitutional_convention_desc: "1987 年宪法已经运行三十多年。国会设立由朝野与民间共同组成的修宪咨询委员会。"
 KORX_four_year_two_terms: "四年连任制"
 KORX_four_year_two_terms_desc: "改为总统可以连任一次、每届四年，并与国会选举同时举行，让执政者对选民负责。"
 KORX_parliamentary_system: "议会内阁制"
 KORX_parliamentary_system_desc: "总统退居象征性的国家元首，由国会多数党组阁，结束「帝王式总统」的时代。"
 KORX_prosecution_reform: "检察厅改革"
 KORX_prosecution_reform_desc: "剥夺检察厅的侦查权，设立独立的重大犯罪调查机关——权力的制衡，从检察开始。"
 KORX_nis_civilian_control: "国家情报院文官统制"
 KORX_nis_civilian_control_desc: "国情院的国内政治部门被彻底撤销，情报官员不得介入选举与政治。"
 KORX_local_autonomy: "地方自治深化"
 KORX_local_autonomy_desc: "扩大地方政府的财政与立法权，推行「特别自治」，让地方议会真正成为权力的一环。"
 KORX_electoral_reform: "选举制度改革"
 KORX_electoral_reform_desc: "推动联立型比例代表制，让小党也能进入国会，打破两党垄断。"
 KORX_impeachment_rules: "弹劾与宪法裁判所"
 KORX_impeachment_rules_desc: "明确总统弹劾的程序与宪法裁判所的权限，避免政治危机演变为宪政危机。"
 KORX_constitutional_referendum: "修宪公投"
 KORX_constitutional_referendum_desc: "国会以三分之二多数通过修宪案，交付全体国民公投。"
 KORX_new_republic: "第七共和国"
 KORX_new_republic_desc: "修宪案以多数赞成通过。新宪法生效，大韩民国迈入第七共和国。"
 KORX_industrial_strategy: "K 产业战略"
 KORX_industrial_strategy_desc: "继半导体与汽车之后，国防、核能、电池、生物与文化成为下一代的出口产业。"
 KORX_defense_exports: "K-国防出口"
 KORX_defense_exports_desc: "政府成立「防卫产业出口支援团」，统一对外洽谈，把国防工业变成国家的出口主力。"
 KORX_k9_k2_export: "K9 与 K2 出口"
 KORX_k9_k2_export_desc: "波兰、土耳其、澳大利亚与中东国家陆续下单，K9 自走炮与 K2 主战坦克成为明星产品。"
 KORX_fa50_kf21_export: "FA-50 与 KF-21 出口"
 KORX_fa50_kf21_export_desc: "轻型战机 FA-50 在东南亚与东欧大受欢迎，KF-21 则向第 4.5 代战斗机市场进军。"
 KORX_defense_complex: "韩国国防出口体系"
 KORX_defense_complex_desc: "整合陆、海、空与导弹的出口体系，并设立国防出口融资机构。"
 KORX_apr1400_export: "APR1400 核电出口"
 KORX_apr1400_export_desc: "以阿联酋巴拉卡核电站为起点，向东欧与中东推销韩国的核电站。"
 KORX_smr_program: "小型模块堆（SMR）"
 KORX_smr_program_desc: "小型模块堆体积小、成本低、安全性高，是核能的下一站。"
 KORX_battery_alliance: "电池与新能源"
 KORX_battery_alliance_desc: "LG 新能源、SK On 与三星 SDI 三大电池厂联手拿下全球订单，电动车产业链在韩国成型。"
 KORX_ev_ecosystem: "电动车生态系"
 KORX_ev_ecosystem_desc: "现代与起亚的电动车平台，加上充电网与电池回收，构成完整的电动车生态系。"
 KORX_bio_cluster: "生物医药集群"
 KORX_bio_cluster_desc: "在仁川松岛打造生物医药集群，三星生物制剂、Celltrion 成为世界级的生物仿制药企业。"
 KORX_bio_export: "疫苗与药品出口"
 KORX_bio_export_desc: "以疫苗代工与药品出口，把韩国推向全球医药供应链的中游。"
 KORX_lng_shipbuilding: "LNG 船与绿色造船"
 KORX_lng_shipbuilding_desc: "韩国船厂拿下全球八成的 LNG 运输船订单，同时领先研发氨与氢动力的绿色船舶。"
 KORX_offshore_wind: "海上风电与氢能"
 KORX_offshore_wind_desc: "在西南海岸建设海上风电基地，并以氢能为重点布局未来能源。"
 KORX_hallyu_strategy: "韩流立国"
 KORX_hallyu_strategy_desc: "从 K-pop、电视剧到电影，「韩流」成为国家战略，政府设立内容产业振兴院。"
 KORX_kcontent_fund: "K-内容基金与全球平台"
 KORX_kcontent_fund_desc: "政府与民间共同出资，支持内容出海与全球发行平台，培育下一个《寄生虫》。"
 KORX_new_space: "太空产业"
 KORX_new_space_desc: "以 NURI 运载火箭与 KPS 定位系统为核心，民间太空企业开始进入发射市场。"
 KORX_industry_final: "K-产业全面开花"
 KORX_industry_final_desc: "国防、核能、电池、造船与文化——一整套相互支撑的出口产业，成为韩国新的国家名片。"
 KORX_roc_representation: "与中华民国互设代表处"
 KORX_roc_representation_desc: "光复后的中华民国与韩国有着特殊的历史渊源——大韩民国临时政府曾在中国流亡二十七年。两国互设代表处。"
 KORX_roc_provisional_gov: "大韩民国临时政府纪念"
 KORX_roc_provisional_gov_desc: "在上海与重庆，大韩民国临时政府度过了流亡的岁月。中华民国政府同意在原址设立纪念馆。"
 KORX_roc_maritime_security: "海上安保合作"
 KORX_roc_maritime_security_desc: "韩国与中华民国就黄海、东海与台湾海峡的航行自由与搜救合作建立热线。"
 KORX_roc_dprk_consult: "对朝鲜政策磋商"
 KORX_roc_dprk_consult_desc: "首尔与南京就朝鲜半岛的和平、无核化与朝鲜的未来定期举行磋商。"
 KORX_roc_fta: "韩国—中华民国自由贸易协定"
 KORX_roc_fta_desc: "取消两国之间的绝大多数关税，并共同制定供应链规则，对半导体、电池与稀土尤其重要。"
 KORX_roc_tech_alliance: "半导体与显示器技术同盟"
 KORX_roc_tech_alliance_desc: "韩国的存储芯片与面板、中华民国的晶圆代工与光电，在供应链上互补。"
 PHIP_post_edsa: "后 EDSA 时代"
 PHIP_post_edsa_desc: "1986 年的人民力量革命推翻了马科斯，2001 年的 EDSA 二世又赶走了埃斯特拉达。菲律宾的政治似乎永远在街头与宫廷之间摇摆——新的政府必须选择一条路。"
 PHIP_a_straight_path: "改革之路"
 PHIP_a_straight_path_desc: "「你是我的老板」——一场以反贪腐与法治为旗帜的政治运动，把自由党推上了执政的位置。"
 PHIP_a_clean_gov: "廉洁政府"
 PHIP_a_clean_gov_desc: "依照「正道」纲领，严办贪腐，公开政府采购，并对失职官员追究责任。"
 PHIP_a_oslo_talks: "奥斯陆和平谈判"
 PHIP_a_oslo_talks_desc: "与民族民主阵线在奥斯陆展开和平谈判，以土地改革与社会经济议程换取停火。"
 PHIP_a_anti_dynasty: "反政治王朝法"
 PHIP_a_anti_dynasty_desc: "推动《反政治王朝法》，禁止近亲同时担任公职，打破少数家族垄断政治的局面。"
 PHIP_a_bangsamoro: "邦萨摩洛基本法"
 PHIP_a_bangsamoro_desc: "通过《邦萨摩洛基本法》，建立拥有较大自治权的穆斯林棉兰老自治区。"
 PHIP_a_us_alliance: "重申美菲同盟 · 海牙仲裁"
 PHIP_a_us_alliance_desc: "依据《联合国海洋法公约》提起南海仲裁案，同时与美国重新确认共同防御条约。"
 PHIP_a_end_insurgency: "与共产党签署最终和约"
 PHIP_a_end_insurgency_desc: "双方签署《全面和平协议》，新人民军解除武装，共产党进入合法政治。数十年的叛乱就此结束。"
 PHIP_a_final: "自由民主的巩固"
 PHIP_a_final_desc: "宪政、法治与选举逐步稳定，改革派的第一个任期以平稳的政权交接告终。"
 PHIP_b_strongman: "强人崛起"
 PHIP_b_strongman_desc: "「改变就要来了。」一位来自棉兰老的铁腕市长以禁毒与治安的承诺赢得大选，菲律宾迎来了强人时代。"
 PHIP_b_drug_war: "禁毒战争"
 PHIP_b_drug_war_desc: "警察对毒品犯罪展开零容忍的扫荡，治安大幅改善，人权团体却指控大量法外处决。"
 PHIP_b_crush_npa: "围剿新人民军"
 PHIP_b_crush_npa_desc: "停止和谈，调动正规军与警察对新人民军的游击区展开大规模清剿。"
 PHIP_b_federalism: "联邦制修宪"
 PHIP_b_federalism_desc: "修宪改为联邦制，赋予棉兰老更大的自治权，同时延长总统的执政权限。"
 PHIP_b_build_build_build: "建、建、建"
 PHIP_b_build_build_build_desc: "史无前例的基建计划：高速公路、铁路、机场与桥梁，让落后的基础设施焕然一新。"
 PHIP_b_terror_designation: "宣布共产党为恐怖组织"
 PHIP_b_terror_designation_desc: "议会通过决议，宣布共产党与新人民军为恐怖组织，叛乱的合法性被彻底剥夺。"
 PHIP_b_independent_foreign: "独立外交政策"
 PHIP_b_independent_foreign_desc: "「不再做美国的小兄弟」——与北京缓和关系，搁置仲裁案，换取贸易与投资。"
 PHIP_b_final: "强人的遗产"
 PHIP_b_final_desc: "无论功过，强人时代在宪法允许的任期内结束。政治家族的格局被重新洗牌。"
 PHIP_c_coalition: "朝野大联合"
 PHIP_c_coalition_desc: "传统政治家族、商界与教会达成默契，组成跨党派的执政联盟，以「稳定」为最高目标。"
 PHIP_c_economy_first: "经济发展优先"
 PHIP_c_economy_first_desc: "先发展经济，再谈政治改革：降低企业税负，改善投资环境，扩大基础设施。"
 PHIP_c_peace_dev_teams: "和平与发展工作队"
 PHIP_c_peace_dev_teams_desc: "军队与地方政府联合组建工作队，把道路、学校与诊所送到叛乱区，瓦解叛军的民众基础。"
 PHIP_c_bpo_remittances: "外包产业与侨汇"
 PHIP_c_bpo_remittances_desc: "以业务流程外包与海外劳工的侨汇作为国家增长的两大引擎，保护海外劳工权益。"
 PHIP_c_amnesty: "大赦与招安"
 PHIP_c_amnesty_desc: "对愿意放下武器的叛军给予大赦、土地与职业培训，并吸收部分人员加入地方民兵。"
 PHIP_c_end_insurgency: "叛乱的终结"
 PHIP_c_end_insurgency_desc: "各地叛军陆续投降，军方宣布共产党的武装斗争已经走向尾声。"
 PHIP_c_balanced_diplomacy: "平衡外交"
 PHIP_c_balanced_diplomacy_desc: "在中美之间走钢丝：美国保留军事合作，中国获得投资机会，南海问题以「共同开发」搁置。"
 PHIP_c_final: "稳定与繁荣"
 PHIP_c_final_desc: "联合政府任期平稳，经济增长，在野党的批评声只停留在国会里。"
 PHIP_d_people_power: "进步联盟"
 PHIP_d_people_power_desc: "以社会民主派为核心的进步联盟，在工人、农民与青年学生的支持下赢得选举。"
 PHIP_d_land_reform: "全面土地改革"
 PHIP_d_land_reform_desc: "大地主的土地被重新分配给佃农。土地问题——叛乱的根源之一，终于被正面处理。"
 PHIP_d_legalize_left: "民族民主阵线合法化"
 PHIP_d_legalize_left_desc: "废除《反颠覆法》，允许左翼政党与团体合法活动，把阶级斗争引入议会政治。"
 PHIP_d_labour_rights: "劳工权利法"
 PHIP_d_labour_rights_desc: "承诺最低工资、合同工转正与工会组织权，改善数百万工人的处境。"
 PHIP_d_universal_health: "全民医保"
 PHIP_d_universal_health_desc: "建立全民健康保险与基层卫生所网络。"
 PHIP_d_ceasefire: "全面停火协议"
 PHIP_d_ceasefire_desc: "政府与共产党签署无限期停火协议，新人民军逐步转型为合法的政治团体与农民合作社。"
 PHIP_d_non_aligned: "不结盟与基地问题"
 PHIP_d_non_aligned_desc: "重新检讨《访问部队协定》，以外交多元化的立场处理中美关系，争取东盟的支持。"
 PHIP_d_final: "社会民主的试验"
 PHIP_d_final_desc: "进步联盟的第一个任期结束，菲律宾的左翼从街头走到了权力的中心。"
 PHIP_new_consensus: "新的国家共识"
 PHIP_new_consensus_desc: "各政党就基本的政治规则达成共识。菲律宾的政治线至此落幕——接下来，是漫长的国家建设。"
 VIEX_p_root: "越南的政治前途"
 VIEX_p_root_desc: "革新开放三十年，越南是亚洲增长最快的国家之一，却也面对腐败、国企低效与民主化压力。党必须决定：越南向何处去。"
 VIEX_dm_start: "革新开放 2.0"
 VIEX_dm_start_desc: "继 1986 年的「革新」之后，党宣布推动更深层的市场化改革：「社会主义定向的市场经济」，要有更多的市场，也要有更清晰的社会主义。"
 VIEX_dm_term_limit: "党内民主与任期限制"
 VIEX_dm_term_limit_desc: "总书记的任期与年龄受到限制，党内集体领导制度得到加强。"
 VIEX_dm_furnace: "熔炉反腐"
 VIEX_dm_furnace_desc: "「反腐败没有禁区、没有例外」——从官员到国企高管，一批人被送进了法庭。"
 VIEX_dm_state_core: "国进：国企做强做优"
 VIEX_dm_state_core_desc: "集中力量，把国企整合成少数几家有国际竞争力的「国家队」。"
 VIEX_dm_private_core: "民进：民营经济是重要动力"
 VIEX_dm_private_core_desc: "民营经济被正式承认为「国民经济的重要动力」，放宽准入、保护产权。"
 VIEX_dm_civil_space: "社会组织与公民社会"
 VIEX_dm_civil_space_desc: "允许环保、慈善与行业社团的注册与运作——「社会主义法治国家」的第一步。"
 VIEX_dm_final: "社会主义定向的市场经济"
 VIEX_dm_final_desc: "革新的第二阶段成型：既不是资本主义，也不是计划经济，而是越南的「第三条道路」。"
 VIEX_hl_start: "整党整风"
 VIEX_hl_start_desc: "「一些党员干部的政治思想、道德、生活作风蜕化变质」——党中央发动新一轮的整党运动。"
 VIEX_hl_ideology: "思想教育"
 VIEX_hl_ideology_desc: "在学校、机关与媒体中恢复马列主义与胡志明思想的教育。"
 VIEX_hl_party_media: "党管媒体与网络"
 VIEX_hl_party_media_desc: "把互联网与社交媒体纳入党的管理，打击「反动言论」。"
 VIEX_hl_police: "强化公安力量"
 VIEX_hl_police_desc: "扩充公安部队，设立专门的网络安全与反间谍部门。"
 VIEX_hl_state_plan: "重启中央计划"
 VIEX_hl_state_plan_desc: "在关键行业恢复五年计划与行政指令，限制私人资本的活动空间。"
 VIEX_hl_final: "党的领导全面加强"
 VIEX_hl_final_desc: "「党领导一切」成为全国上下的基本原则。秩序井然，社会却不再有往日的活力。"
 VIEX_dem_start: "多党转型"
 VIEX_dem_start_desc: "总书记宣布：党愿意与其他政治力量通过谈判实现和平的政治转型，让选民决定国家的未来。"
 VIEX_dem_association: "放宽结社与出版"
 VIEX_dem_association_desc: "废除对结社与出版的限制，允许独立报刊与民间政党注册。"
 VIEX_dem_independent_candidates: "允许独立候选人"
 VIEX_dem_independent_candidates_desc: "修改选举法，允许非党员作为独立候选人参选国会与地方议会。"
 VIEX_dem_judiciary: "司法独立"
 VIEX_dem_judiciary_desc: "法院不再向党的政法委员会汇报，法官的任命与晋升独立于行政部门。"
 VIEX_dem_electoral_law: "多党选举法"
 VIEX_dem_electoral_law_desc: "通过新的选举法：多党竞争、秘密投票、国际观察员，国会进行改选。"
 VIEX_dem_final: "首次多党选举"
 VIEX_dem_final_desc: "越南历史上第一次多党选举。无论谁赢，这都是国家政治的转折点。"
 VIEX_mj_start: "军队的角色"
 VIEX_mj_start_desc: "人民军是党的军队，也是民族独立的象征。在危机时刻，军队站了出来。"
 VIEX_mj_security_council: "国防与安全委员会"
 VIEX_mj_security_council_desc: "设立凌驾于政府之上的国防安全委员会，由军方领袖主持。"
 VIEX_mj_army_business: "军队企业"
 VIEX_mj_army_business_desc: "把 Viettel、军队银行等军办企业纳入国家产业政策的核心。"
 VIEX_mj_order: "维持秩序"
 VIEX_mj_order_desc: "以军管会的方式维持秩序，限制集会，宵禁与巡逻成为日常。"
 VIEX_mj_rebuild: "军队主导的经济"
 VIEX_mj_rebuild_desc: "军队企业与国企联手主导建设，效率提高，腐败也随之增加。"
 VIEX_mj_final: "军民融合的国家"
 VIEX_mj_final_desc: "国家与军队融为一体。有人称之为稳定，有人称之为军管。"
 VIEX_e_root: "革新开放的下一步"
 VIEX_e_root_desc: "三十年革新让越南从最贫穷的国家之一，成长为中等收入国家。下一步要靠什么？答案是：制造、能源、基础设施与数字经济。"
 VIEX_e_agri: "湄公河三角洲农业现代化"
 VIEX_e_agri_desc: "推广良种、机械化与灌溉，把三角洲变成稳定的粮仓。"
 VIEX_e_rice: "稻米出口与品牌"
 VIEX_e_rice_desc: "以 ST25 等优质品种打造越南大米品牌，抢占高端市场。"
 VIEX_e_cash_crops: "咖啡、橡胶与胡椒"
 VIEX_e_cash_crops_desc: "西原的咖啡、橡胶与胡椒是越南的传统出口产品，加工升级能大幅提高附加值。"
 VIEX_e_aquaculture: "水产养殖与加工"
 VIEX_e_aquaculture_desc: "巴沙鱼与虾的养殖加工产业，在三角洲形成了完整的出口产业链。"
 VIEX_e_fdi: "外资制造业"
 VIEX_e_fdi_desc: "用低成本劳动力、自贸协定与稳定的政局吸引外国制造商把工厂搬到越南。"
 VIEX_e_samsung: "三星与韩国资本"
 VIEX_e_samsung_desc: "三星在北宁与太原的手机工厂，让越南成为全球最大的手机出口国之一。"
 VIEX_e_intel: "英特尔与半导体封测"
 VIEX_e_intel_desc: "英特尔在胡志明市的封装测试厂，是越南进入半导体产业链的第一步。"
 VIEX_e_textiles: "纺织成衣与 CPTPP"
 VIEX_e_textiles_desc: "加入 CPTPP 与欧越自贸协定后，越南的纺织品与鞋类以零关税进入主要市场。"
 VIEX_e_electronics: "电子产业集群"
 VIEX_e_electronics_desc: "手机、电脑与家电的配套供应商逐渐在越南形成完整的产业集群。"
 VIEX_e_energy: "能源与资源"
 VIEX_e_energy_desc: "电力需求年增长十个百分点，越南必须同时发展传统能源与新能源。"
 VIEX_e_petrovietnam: "越南油气集团"
 VIEX_e_petrovietnam_desc: "以越南油气集团为核心，开发南海大陆架与越俄合资的白虎油田。"
 VIEX_e_offshore: "近海油气"
 VIEX_e_offshore_desc: "在近海大陆架钻探油气，同时与周边国家的权利主张保持克制。"
 VIEX_e_hydro_coal: "水电与煤电"
 VIEX_e_hydro_coal_desc: "大型水电站与燃煤电厂提供廉价电力，但也带来环境代价。"
 VIEX_e_renewable: "风电与太阳能"
 VIEX_e_renewable_desc: "宁顺与薄辽的光伏与风电成为全球增长最快的新能源之一。"
 VIEX_e_nuclear_ninhthuan: "宁顺核电重启"
 VIEX_e_nuclear_ninhthuan_desc: "当年被搁置的宁顺核电项目重新启动，由俄罗斯与日本竞争承建。"
 VIEX_e_shipbuilding: "造船与海洋工业"
 VIEX_e_shipbuilding_desc: "以海防与广宁为中心，发展船舶制造、海洋工程与港口机械。"
 VIEX_e_infra: "南北大动脉"
 VIEX_e_infra_desc: "一条纵贯南北的高速公路与铁路，把河内与胡志明市两大中心连成一体。"
 VIEX_e_highway: "南北高速公路"
 VIEX_e_highway_desc: "分段建设、分段通车，终点是全线贯通。"
 VIEX_e_hsr: "南北高铁"
 VIEX_e_hsr_desc: "以日本新干线技术为蓝本规划的高铁，资金与技术仍是挑战。"
 VIEX_e_metro: "河内与胡志明市地铁"
 VIEX_e_metro_desc: "两大城市的地铁线路陆续开通，缓解交通拥堵。"
 VIEX_e_ports: "深水港与物流"
 VIEX_e_ports_desc: "海防的拉赫雄港与巴地头顿的盖梅港，让越南成为东南亚的海运枢纽之一。"
 VIEX_e_digital: "数字经济"
 VIEX_e_digital_desc: "5G、云计算与电子商务，让数字经济成为国民经济的新支柱。"
 VIEX_e_viettel_fpt: "Viettel 与 FPT"
 VIEX_e_viettel_fpt_desc: "军办的 Viettel 与民营的 FPT，是越南科技产业的两张名片。"
 VIEX_e_vinfast: "VinFast 与电动车"
 VIEX_e_vinfast_desc: "本土品牌 VinFast 进军全球电动车市场，在北卡罗来纳设厂。"
 VIEX_e_tourism: "旅游业"
 VIEX_e_tourism_desc: "下龙湾、岘港与会安古城吸引着千百万游客，旅游业成为服务业的支柱。"
 VIEX_e_banking: "银行改革与坏账处理"
 VIEX_e_banking_desc: "剥离国有银行的坏账，引入外资战略投资者，推行巴塞尔协议。"
 VIEX_e_soe_reform: "国企股份化"
 VIEX_e_soe_reform_desc: "推动国有企业的股份化与上市，减少国家持股比例。"
 VIEX_e_cptpp: "CPTPP 与欧越自贸协定"
 VIEX_e_cptpp_desc: "越南是少数同时与美、欧、日以外的经济体签订高标准自贸协定的发展中国家。"
 VIEX_e_final: "亚洲新虎"
 VIEX_e_final_desc: "制造、能源、基础设施与数字经济——四根支柱让越南跻身亚洲新虎之列。"
 VIEX_m_root: "人民军的现代化"
 VIEX_m_root_desc: "「不结盟、不依附、不对抗、不使用武力」——越南的「四不」国防政策下，人民军正在从庞大的步兵军队，转型为精干的现代化军队。"
 VIEX_m_slim_army: "精兵简政"
 VIEX_m_slim_army_desc: "压缩常备军规模，提高军官素质，把节省的经费投入装备更新。"
 VIEX_m_conscription: "兵役法修订"
 VIEX_m_conscription_desc: "修订兵役法，缩短服役期，提高志愿兵的比例与待遇。"
 VIEX_m_reserve: "预备役动员"
 VIEX_m_reserve_desc: "建立覆盖全国的预备役体系，并定期举行动员演习。"
 VIEX_m_border_defense: "北部边境与山地防御"
 VIEX_m_border_defense_desc: "在北部山区修筑防御工事与山地作战训练基地。"
 VIEX_m_navy: "海军现代化"
 VIEX_m_navy_desc: "海军从近海警戒转向有限的远海防御，核心是潜艇、护卫舰与反舰导弹。"
 VIEX_m_kilo: "基洛级潜艇（河内级）"
 VIEX_m_kilo_desc: "从俄罗斯购买的六艘基洛级潜艇，构成越南海军的核心威慑。"
 VIEX_m_frigates: "护卫舰与导弹艇"
 VIEX_m_frigates_desc: "引进俄制猎豹级护卫舰与国产导弹艇，扩大近海防御能力。"
 VIEX_m_antiship: "岸基反舰导弹"
 VIEX_m_antiship_desc: "布拉莫斯与国产反舰导弹，让越南有能力在家门口拒止任何入侵舰队。"
 VIEX_m_marines: "海军陆战队与岛礁驻防"
 VIEX_m_marines_desc: "扩编海军陆战队，在南沙岛礁驻军，并加强岛礁的补给与防空。"
 VIEX_m_militia: "海上民兵与海警"
 VIEX_m_militia_desc: "渔民、海警与海军组成的海上防线，是南海维权的前线。"
 VIEX_m_air: "空军与防空"
 VIEX_m_air_desc: "现代化的空军以苏-30 战斗机与 S-300 防空导弹为核心。"
 VIEX_m_su30: "苏-30MK2"
 VIEX_m_su30_desc: "从俄罗斯引进的多用途战斗机，是越南空军的主力。"
 VIEX_m_s300: "S-300 防空系统"
 VIEX_m_s300_desc: "从俄罗斯引进的远程防空导弹，守卫河内与胡志明市。"
 VIEX_m_airbase: "机场与防空洞化"
 VIEX_m_airbase_desc: "改造军用机场，修建掩体与跑道，提高空军的战场生存能力。"
 VIEX_m_cyber: "网络部队"
 VIEX_m_cyber_desc: "第 86 网络战联合司令部，负责保卫国家网络与舆论环境。"
 VIEX_m_military_industry: "Viettel 军工"
 VIEX_m_military_industry_desc: "以 Viettel 为核心，开发国产雷达、通信设备与无人机。"
 VIEX_m_final: "全民国防的体系"
 VIEX_m_final_desc: "常备军、预备役、民兵与海警四位一体，形成了越南自己的防御体系。"
 VIEX_d_root: "竹子外交"
 VIEX_d_root_desc: "「根深、干硬、枝柔」——与所有大国保持友好，也不依附任何一方。越南的外交要在中、美、俄、日、印之间找到自己的位置。"
 VIEX_d_china: "对华关系"
 VIEX_d_china_desc: "中国既是最大的邻国，也是最大的贸易伙伴。如何处理南海问题，决定了两国关系的基调。"
 VIEX_d_china_coop: "全面战略合作伙伴"
 VIEX_d_china_coop_desc: "把越中关系提升到「全面战略合作伙伴」，加强经贸与党际往来，以友好协商搁置南海争议。"
 VIEX_d_china_arb: "国际仲裁与法律斗争"
 VIEX_d_china_arb_desc: "以《联合国海洋法公约》为依据，向国际仲裁机构提起诉讼，在国际法的框架内维护海洋权益。"
 VIEX_d_china_militarize: "岛礁军事化"
 VIEX_d_china_militarize_desc: "加固南沙岛礁，部署导弹与雷达，必要时以武力维护领土主权。"
 VIEX_d_scs_code: "《南海行为准则》谈判"
 VIEX_d_scs_code_desc: "推动东盟与中国达成有约束力的《南海行为准则》，把争端纳入规则的框架。"
 VIEX_d_china_border: "北部湾划界与边境贸易"
 VIEX_d_china_border_desc: "北部湾划界协定与陆地边界的勘定，为边境贸易与口岸建设扫清了障碍。"
 VIEX_d_usa: "对美关系"
 VIEX_d_usa_desc: "从 1995 年建交、2013 年「全面伙伴关系」到 2023 年「全面战略伙伴关系」，越美关系一年好过一年。"
 VIEX_d_usa_partner: "全面伙伴关系"
 VIEX_d_usa_partner_desc: "把越美关系提升为全面伙伴关系，扩大贸易、教育与战争遗留问题合作。"
 VIEX_d_arms_embargo: "解除武器禁运"
 VIEX_d_arms_embargo_desc: "美国解除对越南的杀伤性武器禁运，打开了两国军事合作的大门。"
 VIEX_d_cam_ranh: "金兰湾合作"
 VIEX_d_cam_ranh_desc: "允许外国军舰按照「三不」原则访问金兰湾——但不建立任何军事基地。"
 VIEX_d_russia: "对俄关系"
 VIEX_d_russia_desc: "俄罗斯是越南最重要的军火供应国，也是传统的友谊伙伴。"
 VIEX_d_rus_arms: "俄制军火"
 VIEX_d_rus_arms_desc: "继续采购俄制潜艇、战机与防空系统，保持装备体系的延续。"
 VIEX_d_rus_energy: "越俄油气合作"
 VIEX_d_rus_energy_desc: "越俄油气合资公司「越俄石油」在西伯利亚与近海继续合作勘探。"
 VIEX_d_india: "对印关系"
 VIEX_d_india_desc: "印度的「东向行动」政策与越南的「向西」不谋而合。"
 VIEX_d_india_navy: "印度海军合作"
 VIEX_d_india_navy_desc: "印度向越南提供海军训练、信贷与布拉莫斯导弹。"
 VIEX_d_japan: "对日关系：深度战略伙伴"
 VIEX_d_japan_desc: "日本是越南最大的官方发展援助来源，也是基础设施建设的最大贷款国。"
 VIEX_d_korea: "对韩关系"
 VIEX_d_korea_desc: "韩国是越南最大的外国投资来源之一，数十万越南人在韩国生活与工作。"
 VIEX_d_laos_cambodia: "老挝与柬埔寨的特殊关系"
 VIEX_d_laos_cambodia_desc: "越南与老挝、柬埔寨在历史与革命中结下深厚情谊，三国保持着特殊的关系。"
 VIEX_d_asean: "东盟中心地位"
 VIEX_d_asean_desc: "以东盟为外交的基石，推动区域合作、自由贸易与南海行为准则。"
 VIEX_d_mekong: "湄公河合作与水资源"
 VIEX_d_mekong_desc: "与湄公河沿岸国家建立水资源管理机制，限制上游大坝对三角洲的影响。"
 VIEX_d_roc: "与中华民国的务实关系"
 VIEX_d_roc_desc: "光复后的中华民国在南海拥有太平岛，对东南亚也有历史渊源。越南愿以务实的方式发展经贸与民间往来。"
 VIEX_d_roc_trade: "台商与投资"
 VIEX_d_roc_trade_desc: "延续台商在越南的投资，扩大对两国间的高端制造业合作。"
 VIEX_d_final: "全方位多样化"
 VIEX_d_final_desc: "与所有大国友好、与所有邻国相处、在所有区域机构中发声——竹子外交的成果。"
 VIEX_s_root: "民生与社会发展"
 VIEX_s_root_desc: "经济增长之外，教育、医疗、环境与社会公平，决定着越南能不能真正成为一个现代国家。"
 VIEX_s_education: "教育改革"
 VIEX_s_education_desc: "改革大学入学考试，加强职业教育与英语教学，培养制造业与数字经济所需的人才。"
 VIEX_s_health: "全民医保"
 VIEX_s_health_desc: "扩大医疗保险的覆盖率，建设县级与省级医院网络。"
 VIEX_s_climate: "气候适应与湄公河三角洲"
 VIEX_s_climate_desc: "海平面上升与盐碱化威胁着三角洲的稻田，政府启动了「三角洲适应计划」。"
 VIEX_s_urban: "城镇化与住房"
 VIEX_s_urban_desc: "每年数十万人口从农村涌入城市，政府推出社会住房与卫星城计划。"
 VIEX_s_minorities: "民族团结与西原"
 VIEX_s_minorities_desc: "尊重 54 个民族的语言与文化，改善西原与北部山区的基础设施与教育。"
 VIEX_s_demography: "人口老龄化与生育政策"
 VIEX_s_demography_desc: "越南的生育率下降，老龄化的速度比预期更快，政府取消了「两孩」限制。"
 VIEX_s_youth: "青年与创业"
 VIEX_s_youth_desc: "推出「创业国家」计划，为青年人提供创业基金与孵化器。"
 VIEX_s_final: "共同富裕的越南"
 VIEX_s_final_desc: "到 2045 年——越南独立百年之际——建成高收入国家，是党的庄严承诺。"
 ### v3.21 反攻提速、志愿军、两岸内战与政治线改版
 TAI_kmt_defense_tech: "国防自主研发"
 TAI_kmt_science_park_tech: "科学园区"
 TAI_dp_startup_tech: "创业型国家"
 TAI_dp_regional_university_tech: "地方大学体系"
 TAI_sd_university_tech: "公立大学扩招"
 TAI_sd_circular_tech: "循环经济"
 TAI_escalate_intervention: "形势升级·整编义军"
 TAI_escalate_intervention_desc: "志愿军的名义已经遮不住台海对岸的炮声。台北决定撕下伪装：召回志愿军，整编大陆起义军，正式向北京宣战。"
 TAI_escalate_condition_tt: "起义已爆发 §Y60§! 天以上"
 TAI_armed_intervention_tt: "§R国军以起义军盟友的身份直接对中国作战§!（不吞并起义军）。"
 TAI_escalate_tt: "§Y召回志愿军，向中国宣战，并吞并起义军§!。"
 TAI_uprising_tt: "§Y中国§!东南沿海各省将爆发§R民主起义§!。起义政府保持独立，我们先以§Y志愿军§!的名义介入；形势升级后才会整编起义军、正式宣战。"
 TAI_volunteer_target_tt: "大陆起义军是正在进行的民主起义"
 roc_return.8.t: "大陆起义爆发！"
 roc_return.8.d: "在我们多年的经营之下，东南沿海各省的军民终于揭竿而起，宣布成立“中华民国大陆临时政府”，并请求台北接应。\n\n国军此时若公开渡海，等于向北京宣战。参谋本部建议：先以“志愿军”的名义派出官兵和武器，待局势明朗再决定是否升级。"
 roc_return.8.a: "组织志愿军，并军援义军"
 roc_return.8.b: "只提供军援，暂不派兵"
 roc_return.8.c: "直接出兵：以国军名义武力干预"
 roc_return.190.a: "升级介入：整编义军，正式宣战"
 roc_return.190.b: "继续以志愿军的名义支援"
 roc_return.190.t: "是否升级介入？"
 roc_return.190.d: "起义已经持续了一段时间。义军在北京的反扑下能否撑住，志愿军的名义还能装多久？"
 roc_return.191.a: "让这场失败成为下一次的火种"
 roc_return.191.t: "起义军溃败"
 roc_return.191.d: "北京的部队扑灭了东南各省的起义。志愿军的名字被写进了通缉名单，但我们并没有输掉整场战争：消息传来，大陆民间的怨气比起义前更深。"
 roc_return.192.a: "欣然接受，统一国家"
 roc_return.192.b: "保持两个政府并立"
 roc_return.192.t: "起义军夺取了政权"
 roc_return.192.d: "“中华民国大陆临时政府”击败了北京的守军，控制了全国大部分地区。他们派来使者：愿意接受台北的领导，实现国家的统一。"
 TAI_dec_more_volunteers: "增派志愿军"
 TAI_dec_more_volunteers_desc: "以「志愿军」名义再派出一批官兵，加入大陆起义军的行列。"
 TAI_dec_armed_intervention: "武力干预"
 TAI_dec_armed_intervention_desc: "不再以「志愿军」自居：国军以起义军盟友的身份直接投入战斗，但暂不整编义军，也不吞并。"
 TAI_dec_arm_rebels: "军援义军"
 TAI_dec_arm_rebels_desc: "把库房里的步枪、火炮和反坦克、防空武器运往大陆起义军手里。"
 TAI_relocate_capital_beijing: "迁都北平"
 TAI_relocate_capital_beijing_desc: "北平是元明清三朝故都，华北的政治与军事重心。把首都从南京迁到北平，更靠近北方的防线与东北的资源。"
 TAI_beijing_capital_idea: "建都北平"
 TAI_beijing_capital_idea_desc: "国民政府迁都北平，北方的行政与动员效率提高，南方的地方派系则抱怨被冷落。"
 TAI_dec_move_capital_nanjing: "迁回南京"
 TAI_dec_move_capital_nanjing_desc: "把首都迁回南京。"
 TAI_gov_kmt_tt: "§Y中国国民党§!曾经执政，或正在联合执政"
 TAI_gov_dp_tt: "§Y中国民主党§!曾经执政，或正在联合执政"
 TAI_gov_sd_tt: "§Y中国社会民主党§!曾经执政，或正在联合执政"
 TAI_kmt_mainland_branches: "大陆党部重建"
 TAI_kmt_mainland_branches_desc: "在各省重建国民党党部，吸纳地方士绅与退役军官，让党的触角重新伸进县乡。"
 TAI_kmt_youth_corps: "青年团与学生组织"
 TAI_kmt_youth_corps_desc: "重建三民主义青年团，在大专院校里发展学生党员，培养新一代干部。"
 TAI_kmt_cadre_academy: "革命实践研究院"
 TAI_kmt_cadre_academy_desc: "恢复党务干部的训练机构，把「建国方略」讲给每一位新党员。"
 TAI_kmt_factional_balance: "派系平衡"
 TAI_kmt_factional_balance_desc: "来台老党员、本土派与大陆新党员之间要讲平衡，党的人事不能让某一派独占。"
 TAI_kmt_garrison_reform: "驻军整编"
 TAI_kmt_garrison_reform_desc: "统一驻军番号与指挥系统，国军在大陆各省的防区与国防部的序列重新对齐。"
 TAI_kmt_border_fortress: "边疆要塞"
 TAI_kmt_border_fortress_desc: "在东北、西北与西南边疆修建永久工事与军用机场，守住国门。"
 TAI_kmt_unification_forum: "两岸论坛"
 TAI_kmt_unification_forum_desc: "邀请两岸的学者、企业家与地方官员定期会面，让「一个中国」不再停留在口号上。"
 TAI_kmt_defense_self_reliance: "国防自主"
 TAI_kmt_defense_self_reliance_desc: "一整套自主研发的武器系统逐步取代进口，军工产业不再受制于人。"
 TAI_kmt_central_bank_independence: "央行独立"
 TAI_kmt_central_bank_independence_desc: "中央银行摆脱政治干预，币值稳定成为政府的第一信用。"
 TAI_kmt_industrial_parks: "工业园区"
 TAI_kmt_industrial_parks_desc: "沿海与内陆同时规划新的工业园区，引进台商与外资。"
 TAI_kmt_science_parks: "科学园区"
 TAI_kmt_science_parks_desc: "把新竹的经验复制到大陆：科学园区、人才与风险投资一起来。"
 TAI_kmt_export_drive: "出口导向"
 TAI_kmt_export_drive_desc: "以出口带动增长，让「中国制造」换上「中华民国制造」的新标签。"
 TAI_dp_bar_association: "律师公会"
 TAI_dp_bar_association_desc: "允许律师自行组织公会，为被告辩护不再是危险的事。"
 TAI_dp_petition_office: "申诉专线"
 TAI_dp_petition_office_desc: "每个县设立直通中央的申诉窗口，冤案不必再靠「拦轿告状」。"
 TAI_dp_victims_compensation: "受害者补偿"
 TAI_dp_victims_compensation_desc: "对历次政治运动的受害者及其家属给予补偿，让历史的伤口得到处理。"
 TAI_dp_ombudsman: "国家人权委员会"
 TAI_dp_ombudsman_desc: "成立独立运作的国家人权委员会，向国会而不是向政府负责。"
 TAI_dp_sme_support: "中小企业扶持"
 TAI_dp_sme_support_desc: "给小微企业减税、降低融资门槛，让民间活力成为经济的主力。"
 TAI_dp_stock_exchange: "证券市场"
 TAI_dp_stock_exchange_desc: "建立一个依法运作、信息公开的证券市场，让民间资本找到出口。"
 TAI_dp_free_trade_zones: "自由贸易港"
 TAI_dp_free_trade_zones_desc: "在沿海开设数座自由贸易港，实行最宽松的通关与税收制度。"
 TAI_dp_startup_nation: "创业型国家"
 TAI_dp_startup_nation_desc: "政府退到幕后，由创业者、大学与天使投资人合作推动新经济。"
 TAI_dp_governors_election: "省长直选"
 TAI_dp_governors_election_desc: "省长由省民直接选举，中央与地方的关系不再靠任命。"
 TAI_dp_fiscal_federalism: "财政联邦制"
 TAI_dp_fiscal_federalism_desc: "税收在中央与省之间按法律分配，地方有了自己的钱袋。"
 TAI_dp_regional_universities: "地方大学"
 TAI_dp_regional_universities_desc: "每个省办一所一流的地方大学，让人才不再都往北京上海挤。"
 TAI_dp_regional_charters: "省宪章"
 TAI_dp_regional_charters_desc: "各省可以制定自己的宪章，只要不违反中央宪法的基本原则。"
 TAI_sd_minimum_wage: "最低工资"
 TAI_sd_minimum_wage_desc: "全国实行最低工资，让沿海与内陆的劳动者都有一条底线。"
 TAI_sd_collective_bargaining: "集体谈判"
 TAI_sd_collective_bargaining_desc: "工会可以代表劳动者与雇主谈判，罢工权受到法律保护。"
 TAI_sd_unemployment_insurance: "失业保险"
 TAI_sd_unemployment_insurance_desc: "建立覆盖全国的失业保险与再培训体系。"
 TAI_sd_worker_representatives: "劳资共决"
 TAI_sd_worker_representatives_desc: "大企业的董事会里必须有劳工代表，决策不再只由老板说了算。"
 TAI_sd_rural_clinics: "乡村诊所"
 TAI_sd_rural_clinics_desc: "每个乡镇设一座公立诊所，把医生派到最偏远的村子。"
 TAI_sd_public_universities: "公立大学扩招"
 TAI_sd_public_universities_desc: "扩大公立大学的招生，学费由国家负担大部分。"
 TAI_sd_vocational_schools: "职业学校"
 TAI_sd_vocational_schools_desc: "每个工业区配一所职业学校，毕业生直接被企业接收。"
 TAI_sd_health_for_all: "全民医疗"
 TAI_sd_health_for_all_desc: "看病不再是一场赌博：全民医疗保险覆盖所有人。"
 TAI_sd_carbon_pricing: "碳定价"
 TAI_sd_carbon_pricing_desc: "对碳排放定价，用收入补贴低收入家庭。"
 TAI_sd_renewables_grid: "可再生电网"
 TAI_sd_renewables_grid_desc: "新建跨省特高压电网，把西部的风电和光电送到东部。"
 TAI_sd_urban_greening: "城市绿化"
 TAI_sd_urban_greening_desc: "城市里增加公园与绿道，空气和水质成为官员考核的指标。"
 TAI_sd_circular_economy: "循环经济"
 TAI_sd_circular_economy_desc: "工厂的废料成为另一家工厂的原料，「减量、再用、回收」成为国策。"
 TAI_gc_roundtable: "圆桌会议"
 TAI_gc_roundtable_desc: "各党领袖围坐一桌，重大议题先谈再提案。"
 TAI_gc_constitution_convention: "制宪会议"
 TAI_gc_constitution_convention_desc: "召集各党与社会团体代表，检讨宪法在大陆实施的得失。"
 TAI_gc_citizens_assembly: "公民议会"
 TAI_gc_citizens_assembly_desc: "随机抽选公民参与立法咨询，让政治不再只有政客。"
 TAI_gc_referendum_law: "公民投票法"
 TAI_gc_referendum_law_desc: "重大议题经由公民投票决定，门槛与程序写进法律。"
 TAI_gc_cross_party_cabinet: "跨党派内阁"
 TAI_gc_cross_party_cabinet_desc: "各部会首长由各党按席次推荐，内阁真正成为国家的内阁。"
 TAI_gc_shadow_ministers: "影子内阁"
 TAI_gc_shadow_ministers_desc: "在野党也可以组成影子内阁，对每一个部会进行监督。"
 TAI_gc_unity_budget: "国是预算"
 TAI_gc_unity_budget_desc: "预算案由各党共同编制，政党不能再拿预算当筹码。"
 TAI_gc_opposition_rights: "在野党权利"
 TAI_gc_opposition_rights_desc: "在野党享有质询、调查与提案的完整权利，议事规则不再向执政党倾斜。"
 TAI_gc_truth_commission: "真相委员会"
 TAI_gc_truth_commission_desc: "成立真相委员会，调查近百年的历史冤案，不追究个人，但还原事实。"
 TAI_gc_joint_textbooks: "两岸共编教材"
 TAI_gc_joint_textbooks_desc: "两岸历史学者共同编写教科书，让下一代读同一部历史。"
 TAI_gc_memorials: "纪念馆与公墓"
 TAI_gc_memorials_desc: "为内战中的阵亡者建立共同的纪念馆，不论属于哪一方。"
 TAI_gc_forgive_and_remember: "宽恕与记忆"
 TAI_gc_forgive_and_remember_desc: "「宽恕但不忘记」写进国家的教育大纲。"
 TAI_cpc_government: "中国共产党参政"
 TAI_cpc_government_desc: "合法在野的中国共产党，在新的政治格局里找到自己的位置：不再是革命党，而是参政党。"
 TAI_cpc_party_congress: "召开党代会"
 TAI_cpc_party_congress_desc: "合法在野的中国共产党召开全国代表大会，选举新的中央委员会。"
 TAI_cpc_legal_status: "合法地位"
 TAI_cpc_legal_status_desc: "宪法法院确认共产党享有结社自由，党产、党报与党校的法律地位得到界定。"
 TAI_cpc_reform_wing: "改革派崛起"
 TAI_cpc_reform_wing_desc: "党内的改革派主张接受议会政治，走社会民主主义或民主社会主义道路。"
 TAI_cpc_workers_unions: "工会与农协"
 TAI_cpc_workers_unions_desc: "共产党把力量放在工会、农协与职工代表大会里，用组织说话。"
 TAI_cpc_patriots: "爱国主义转向"
 TAI_cpc_patriots_desc: "党的宣传转向爱国主义与民族复兴，与国民政府在民族大义上并肩。"
 TAI_cpc_market_socialism: "市场社会主义"
 TAI_cpc_market_socialism_desc: "承认市场的作用，把公有制放在关系国计民生的关键行业里。"
 TAI_cpc_new_democracy: "新民主主义"
 TAI_cpc_new_democracy_desc: "重提「新民主主义」：多种经济成分并存，多个政党共同参政。"
 TAI_cpc_era: "红旗与青天白日"
 TAI_cpc_era_desc: "红旗与青天白日满地红，在同一片天空下并肩飘扬：中国共产党在多党制下完成了自己的转型。"
 TAI_cpc_cadre_discipline: "干部纪律"
 TAI_cpc_cadre_discipline_desc: "以党的纪律约束干部，严禁贪污、特权与封建作风。"
 TAI_cpc_party_school: "党校改革"
 TAI_cpc_party_school_desc: "党校不再只讲教条，开设经济学、法学与公共管理课程。"
 TAI_cpc_anticorruption: "反腐传统"
 TAI_cpc_anticorruption_desc: "发扬延安时期的反腐传统，让清廉成为党的名片。"
 TAI_cpc_inner_democracy: "党内民主"
 TAI_cpc_inner_democracy_desc: "党的各级领导人由党员投票选举，党内不再只有一种声音。"
 TAI_cpc_land_reform_memory: "老区与土地改革"
 TAI_cpc_land_reform_memory_desc: "在革命老区继续推进土地的合理使用，保障农民的基本权利。"
 TAI_cpc_trade_union_law: "工会法"
 TAI_cpc_trade_union_law_desc: "推动《工会法》修订，让劳动者有真正代表自己的组织。"
 TAI_cpc_village_cooperatives: "乡村合作社"
 TAI_cpc_village_cooperatives_desc: "发展农民自愿结合的合作社，让小农户能够共享规模经济。"
 TAI_cpc_social_safety: "基本社会保障"
 TAI_cpc_social_safety_desc: "以国家财政托底：养老、医疗、住房，每个人都应该得到最基本的保障。"
 TAI_cpc_peaceful_rise: "和平崛起主张"
 TAI_cpc_peaceful_rise_desc: "共产党主张以和平方式实现民族复兴，反对任何外来势力干涉中国内政。"
 TAI_cpc_overseas_ties: "海外左翼联系"
 TAI_cpc_overseas_ties_desc: "与各国左翼政党、工会和知识分子保持联系，为国际合作打开渠道。"
 TAI_cpc_one_china_consensus: "一个中国共识"
 TAI_cpc_one_china_consensus_desc: "在「一个中国」这一点上，国共两党并无分歧：中国必须是统一的中国。"
 TAI_cpc_national_rejuvenation: "民族复兴"
 TAI_cpc_national_rejuvenation_desc: "把国家富强、民族复兴当成各党共同的奋斗目标。"
 TAI_gov_cpc_tt: "§Y中国共产党§!曾经执政，或正在联合执政"
 TAI_cpc_government_idea: "共产党参政"
 TAI_cpc_government_idea_desc: "合法的中国共产党成为国会中的重要力量，工农组织与知识界的声音更容易被听见。"
 TAI_cpc_era_idea: "红旗与青天白日"
 TAI_cpc_era_idea_desc: "共产党完成了向多党制下的参政党的转型，国民政府与共产党在国家统一与民族复兴上拥有共同的语言。"
 TAI_party_alternation_idea: "政党轮替"
 TAI_party_alternation_idea_desc: "执政党交接已经成为政治常态，各党都在宪法的框架内竞争与合作。"
 TAI_two_party_lines_tt: "至少有§Y两条§!政党线已经完成最后的国策（国民党、民主党、社民党、大联合政府、共产党）"
 CSW_cross_strait_war: "两岸内战"
 CSW_cross_strait_war_desc: "大陆爆发内战，海峡两岸都被卷了进来。国共两党都需要给这场战争一个答案。"
 CSW_ccp_martial_law: "戒严与维稳"
 CSW_ccp_martial_law_desc: "在受影响的各省实施戒严，稳住大中城市的秩序，把动乱限制在局部。"
 CSW_ccp_mobilize_pla: "动员解放军"
 CSW_ccp_mobilize_pla_desc: "各大军区进入战备，预备役部队动员，军队开始整顿被内战打乱的指挥体系。"
 CSW_ccp_purge_traitors: "清洗叛徒"
 CSW_ccp_purge_traitors_desc: "追查为起义军与台湾通风报信的人，清洗党内与军中的「二心」之人。"
 CSW_ccp_blockade_rebels: "封锁起义军"
 CSW_ccp_blockade_rebels_desc: "切断起义军的补给线与粮食运输，让他们的政权在经济上先垮掉。"
 CSW_ccp_seek_russia: "求援于俄朝"
 CSW_ccp_seek_russia_desc: "向俄罗斯与朝鲜请求政治与物资支持，换取在国际上的声援。"
 CSW_ccp_strait_deterrence: "海峡威慑"
 CSW_ccp_strait_deterrence_desc: "东部战区在台湾海峡举行大规模演习，发射导弹，向台北发出明确的警告。"
 CSW_ccp_total_war: "总体战"
 CSW_ccp_total_war_desc: "全国转入战时体制：工厂开足马力，粮食凭证配给，一切为了平定内乱。"
 CSW_ccp_restore_order: "平定内乱"
 CSW_ccp_restore_order_desc: "起义被平定，叛乱的省份重回中央控制：党和国家又一次挺过了考验。"
 CSW_tai_volunteer_corps: "组建志愿军团"
 CSW_tai_volunteer_corps_desc: "以退役军人和预备役为班底，组建「中华民国志愿军团」，以志愿者名义赴大陆参战。"
 CSW_tai_arm_rebels: "军火支援"
 CSW_tai_arm_rebels_desc: "把库存的武器、弹药与火炮经海路与第三国运往大陆起义军。"
 CSW_tai_armed_intervention: "武力干预"
 CSW_tai_armed_intervention_desc: "不再以志愿军自居：国军以起义军盟友的身份直接投入战斗，但暂不整编义军，也不吞并。"
 CSW_tai_recognize: "承认临时政府"
 CSW_tai_recognize_desc: "正式承认「中华民国大陆临时政府」，并派顾问协助其建立行政体系。"
 CSW_tai_intel_ops: "情报渗透"
 CSW_tai_intel_ops_desc: "军情局在大陆的网络全面启动：策反、破坏与情报收集一起进行。"
 CSW_tai_us_backing: "争取美国默许"
 CSW_tai_us_backing_desc: "向华盛顿说明：这是一场民主起义，台北需要的是默许，不是介入。"
 CSW_tai_psychological_war: "心战广播"
 CSW_tai_psychological_war_desc: "加大对大陆的广播与网络宣传，瓦解对方的军心与民心。"
 CSW_tai_logistics_bridge: "海上桥梁"
 CSW_tai_logistics_bridge_desc: "组织民间商船与海军运输舰，建立一条从高雄到福建的海上补给线。"
 CSW_tai_join_the_war: "统一指挥"
 CSW_tai_join_the_war_desc: "台北与大陆起义军建立统一的战时指挥部，国军与义军并肩作战。"
 CSW_intl_lobby: "国际游说"
 CSW_intl_lobby_desc: "各方都在争夺国际舆论：谁在维护统一，谁在制造分裂。"
 CSW_humanitarian_corridor: "人道走廊"
 CSW_humanitarian_corridor_desc: "为战区的平民开辟人道走廊，让红十字会进入受灾的城市。"
 CSW_ceasefire_talks: "停火谈判"
 CSW_ceasefire_talks_desc: "在第三国斡旋下，两岸代表坐下来谈停火的可能。"
 CSW_new_order: "战后新秩序"
 CSW_new_order_desc: "战争结束了，国家将以怎样的面貌重新开始？无论谁获胜，重建秩序都是下一件事。"
 CSW_total_war_idea: "总体战"
 CSW_total_war_idea_desc: "全国转入战时体制：工厂开足马力，粮食凭证配给，一切为了平定内乱。"
 CSW_ccp_request_aid: "中共求援"
 CSW_tai_lobby_us: "台北游说"
 ROC_order_blue_sky_white_sun: "青天白日勋章"
 ROC_order_blue_sky_white_sun_desc: "中华民国最高军事勋章，颁授给在保卫国家、克敌制胜中建立殊勋的军官。"
 ROC_order_precious_tripod: "宝鼎勋章"
 ROC_order_precious_tripod_desc: "以国之重器「宝鼎」为名，颁授给对国防建设有特殊贡献的三军将士。"
 ROC_order_cloud_and_banner: "云麾勋章"
 ROC_order_cloud_and_banner_desc: "颁授给作战有功、指挥卓越的陆海空军官兵。"
 ROC_medal_loyalty_and_valor: "忠勇勋章"
 ROC_medal_loyalty_and_valor_desc: "颁授给作战忠勇、奋不顾身的官兵。"
 ROC_order_independence_freedom: "独立自由勋章"
 ROC_order_independence_freedom_desc: "颁授给在民主与自由的旗帜下，守卫国家独立的官兵。"
 ROC_order_liberation: "解放勋章"
 ROC_order_liberation_desc: "颁授给在解放战争与光复国土中立下战功的官兵。"
 ### v3.22 叙利亚内战与各方扩展
 SYRX_siege_strategy_idea: "围城与饥饿"
 SYRX_siege_strategy_idea_desc: "以围困、断粮与轰炸迫使叛军控制区投降，政权保住了城市，却付出了人道与外交上的代价。"
 SYRX_reconciliation_idea: "地方和解"
 SYRX_reconciliation_idea_desc: "通过地方停火与撤离协议，把战斗人员与家属送往伊德利卜，换取城区与郊区的平静。"
 SYRX_ndf_idea: "国防军与民兵体系"
 SYRX_ndf_idea_desc: "国防军（NDF）把各地的亲政府民兵整合进统一的指挥系统，兵源与忠诚由此得到保障。"
 SYRX_axis_idea: "抵抗轴心"
 SYRX_axis_idea_desc: "伊朗革命卫队、真主党与什叶派民兵进入叙利亚，成为政权战场上的突击力量。"
 SYRX_russia_idea: "俄罗斯空天军"
 SYRX_russia_idea_desc: "赫梅明基地与塔尔图斯港的俄军为地面部队提供空中打击、侦察与外交保护。"
 SYRX_chem_deal_idea: "销毁化学武器"
 SYRX_chem_deal_idea_desc: "政权加入《禁止化学武器公约》，换回了俄罗斯与国际社会的外交缓冲。"
 SYRX_war_economy_idea: "战争经济"
 SYRX_war_economy_idea_desc: "粮食、燃料与外汇全部服务于战争：配给制、黑市与军阀利益并存。"
 SYRF_council_idea: "全国委员会"
 SYRF_council_idea_desc: "流亡的反对派在伊斯坦布尔组成全国委员会，作为对外的政治代表。"
 SYRF_local_councils_idea: "地方革命委员会"
 SYRF_local_councils_idea_desc: "解放区里的地方委员会接手了学校、面包房与法庭，成为新秩序的雏形。"
 SYRF_turkey_idea: "土耳其的庇护"
 SYRF_turkey_idea_desc: "土耳其提供后方基地、难民营与军事训练，反对派对安卡拉的依赖也越来越深。"
 SYRF_sna_idea: "叙利亚国民军"
 SYRF_sna_idea_desc: "土耳其扶植下的联军整编为叙利亚国民军，成为北部解放区的正规武装。"
 SYRN_salvation_gov_idea: "救国政府"
 SYRN_salvation_gov_idea_desc: "伊德利卜的救国政府设立了各部、法院、警察与税务，成为一个事实上的政权。"
 SYRN_command_idea: "统一指挥"
 SYRN_command_idea_desc: "各派系被整编进统一的作战指挥，精锐突击部队成为战场上的主力。"
 SYRN_crossings_idea: "边境口岸"
 SYRN_crossings_idea_desc: "巴布哈瓦口岸的过境税与贸易收入，让伊德利卜的财政比许多国家更稳固。"
 SYR_ext_fsa_aid: "支持叙利亚反对派"
 SYR_ext_assad_crimes: "叙利亚政权的暴行"
 SYR_ext_russia_ally: "俄叙军事同盟"
 SYR_ext_iran_ally: "伊叙「抵抗轴心」"
 SYR_ext_turkey_ally: "土耳其支持反对派"
 SYR_ext_isis_hate: "对「伊斯兰国」的憎恶"
 SYRX_tb_armor: "装甲车辆重建"
 SYRF_tb_atgm: "反坦克导弹"
 SYRX_tb_aa: "防空系统修复"
 SYRL_baath_ideals_idea: "复兴党初心"
 SYRL_baath_ideals_idea_desc: "统一、自由、社会主义——1947 年建党时的三句口号，被几十年的家族政治掏空。现在，总统要把它们找回来。"
 SYRL_no_dynasty_idea: "去家族化"
 SYRL_no_dynasty_idea_desc: "亲属不再担任要职：财产要申报，合同要招标，军队与情报机构归国家，而不归任何一个姓氏。"
 SYRL_merit_idea: "干部考核"
 SYRL_merit_idea_desc: "提拔靠考试、业绩与群众评议，而不是出身与亲属关系。"
 SYRL_land_idea: "新土地改革"
 SYRL_land_idea_desc: "把荒废的国有土地租给无地农民，成立农业合作社，重新把农村拉回复兴党这一边。"
 SYRL_plan_idea: "计划与公共部门"
 SYRL_plan_idea_desc: "重新启动国家计划委员会，把能源、水泥、化肥与纺织重新交回国家。"
 SYRL_coop_idea: "合作社与职工参与"
 SYRL_coop_idea_desc: "工人代表进入企业管理委员会，农民合作社直接把粮食卖给国家。"
 SYRL_welfare_idea: "全民医疗与教育"
 SYRL_welfare_idea_desc: "免费的医院与大学是复兴党留下的最宝贵遗产之一。"
 SYRL_npf_idea: "真正的民族进步阵线"
 SYRL_npf_idea_desc: "共产党、阿拉伯社会主义联盟、统一社会党与复兴党在同一张桌子上协商，而不是由复兴党一家决定。"
 SYRL_union_idea: "独立工会与农民联合会"
 SYRL_union_idea_desc: "工会与农民联合会不再只是传声筒，工资与收购价可以通过谈判决定。"
 SYRL_civil_idea: "公民国家"
 SYRL_civil_idea_desc: "宪法写明：人人在法律面前平等，不分教派与族裔。阿拉维、逊尼、基督徒与库尔德人，都是叙利亚公民。"
 SYR_ext_left_baath: "复兴党的阿拉伯团结"
 SYRB_security_state_idea: "安全国家"
 SYRB_security_state_idea_desc: "情报机构的权力比任何时候都大：稳定被摆在了一切之前，反对者与改革者都在名单上。"
 SYRB_social_market_idea: "社会市场经济"
 SYRB_social_market_idea_desc: "2005 年复兴党十大确立「社会市场经济」：银行、保险与大学向私人资本开放，国家不再包办一切。"
 SYRB_tb_medical: "医药与科研投资"
 roc_asia.70.a: "没收并公开招标"
 roc_asia.70.b: "留一部分，换取沉默"
 roc_asia.70.t: "财阀的资产"
 roc_asia.70.d: "检察官打开了家族名下公司的账本：电信牌照、石油分成、免税店。总统下令：全部没收，收入交国库，合同公开招标。亲属们愤怒地离开了首都。"
 roc_asia.71.a: "通过改革纲领"
 roc_asia.71.b: "保留部分旧规矩"
 roc_asia.71.t: "复兴党第十一次代表大会"
 roc_asia.71.d: "会场里争论到深夜：老一辈要保持「领导地位」，年轻代表要求地方党部直选。最后，总统走上讲台：「党是人民的，不是某个人的。」掌声响起。"
 roc_asia.72.a: "采纳会议建议"
 roc_asia.72.b: "只采纳一部分"
 roc_asia.72.t: "全国对话大会"
 roc_asia.72.d: "大马士革的会议大厅里，坐着复兴党代表、共产党、纳赛尔主义者、基督徒主教、逊尼学者与库尔德人。会议吵了三天，也达成了一些共识。"
 roc_asia.73.a: "通过"
 roc_asia.73.t: "新复兴共和国"
 roc_asia.73.d: "总统走进议会，向全体代表宣读新的国家纲领。第一条写着：「国家属于全体叙利亚公民」。第二条写着：「任何人的亲属都不得继承公职」。"
 roc_asia.60.a: "接受销毁协议"
 roc_asia.60.b: "否认一切指控"
 roc_asia.60.t: "东古塔的毒气"
 roc_asia.60.d: "凌晨，东古塔的居民被毒气窒息而死，上千人丧生。华盛顿说，这已经越过了「红线」。莫斯科提出了折中方案：政权交出化学武器，换取打击的取消。"
 roc_asia.61.a: "欢迎俄罗斯的到来"
 roc_asia.61.b: "保持审慎"
 roc_asia.61.t: "俄罗斯战机抵达赫梅明"
 roc_asia.61.d: "清晨，第一批苏-24 与苏-34 战机降落在赫梅明。莫斯科宣布：应叙利亚合法政府的请求，俄罗斯空天军将对恐怖组织实施空袭。"
 roc_asia.62.a: "签署备忘录"
 roc_asia.62.t: "阿斯塔纳的降级区"
 roc_asia.62.d: "俄、伊、土三国代表在阿斯塔纳签署降级区备忘录：前线冻结在目前的位置，空袭暂停，人道通道开放。"
 roc_asia.63.a: "继续转型"
 roc_asia.63.b: "保持强硬"
 roc_asia.63.t: "解放组织的转型"
 roc_asia.63.d: "al-Julani穿着西装出现在电视镜头前：解放组织是叙利亚的武装，不是国际圣战的前哨。伊德利卜的街头出现了新的政治海报。"
 roc_asia.64.a: "并肩作战"
 roc_asia.64.b: "保持独立指挥"
 roc_asia.64.t: "土耳其军队越境"
 roc_asia.64.d: "土耳其坦克越过边境，自由叙利亚军的旗帜与土耳其国旗并排飘扬。在这场「幼发拉底之盾」里，谁是主角？"
 roc_asia.69.a: "好消息"
 roc_asia.69.t: "化学武器库存清空"
 roc_asia.69.d: "国际检察人员报告：叙利亚境内申报的化学武器库存已全部销毁。西方的军事威胁暂时消除了。"
 SYRB_iran_pact_idea: "与伊朗的战略协议"
 SYRB_iran_pact_idea_desc: "防务合作协议、互免签证与联合工业项目：伊朗成为大马士革最重要的盟友，也带来了与海湾国家的新隔阂。"
 SYRB_turkey_idea: "叙土蜜月"
 SYRB_turkey_idea_desc: "免签、自贸区与联合内阁会议：叙利亚与土耳其的边境贸易在几年内翻了几番。"
 SYRB_drought_idea: "干旱与农村危机"
 SYRB_drought_idea_desc: "2006 年至 2010 年的干旱毁掉了东北部的农业，数十万农民涌向德拉与大马士革的郊区。"
 SYRL_pension_idea: "全民养老金与社会保险"
 SYRL_pension_idea_desc: "覆盖农民与个体劳动者的统一养老金，是复兴党左翼最看重的福利承诺。"
 SYRL_self_reliance_idea: "自力更生计划"
 SYRL_self_reliance_idea_desc: "用国内的钢铁、水泥、纺织与化肥替代进口：制裁越重，越要自己动手。"
 SYRL_media_idea: "公共媒体与舆论监督"
 SYRL_media_idea_desc: "公共广播改成由议会监督的独立机构，私营报纸也获得出版许可。"
 SYRB_tb_edu: "高等教育与创业"
 roc_asia.74.a: "接受现实"
 roc_asia.74.b: "强调与黎巴嫩的特殊关系"
 roc_asia.74.t: "最后一辆军车"
 roc_asia.74.d: "2005 年 4 月，最后一批叙军车辆驶过边境。黎巴嫩街头欢呼雀跃，大马士革的官方电视台说：这是「兄弟之间的重新部署」。"
 roc_asia.75.a: "承认问题，推出改革"
 roc_asia.75.b: "严厉处置"
 roc_asia.75.t: "手机里的标语"
 roc_asia.75.d: "突尼斯的小贩点燃了自己。德拉的孩子们在墙上涂写：「轮到你了，医生」。总统府说，这一切都是外国势力策划的阴谋。"
 SYRL_tb_edu: "义务教育"
 roc_asia.76.a: "通过宪章"
 roc_asia.76.t: "起草宪章"
 roc_asia.76.d: "全国对话大会的最后一天，代表们逐条表决新的国家宪章。第一条通过时，会场里响起了一阵掌声；第三十七条（总统任期）通过时，会场里安静了很久。"
 ISIX_caliphate_idea: "哈里发国"
 ISIX_caliphate_idea_desc: "al-Baghdadi登上摩苏尔大清真寺的讲坛，宣布哈里发国成立：全世界的穆斯林都有义务效忠。"
 ISIX_hisbah_idea: "宗教警察"
 ISIX_hisbah_idea_desc: "希斯巴巡逻队在每个街区执行沙里亚法：服饰、礼拜、烟酒。居民敢怒不敢言。"
 ISIX_oil_idea: "走私石油"
 ISIX_oil_idea_desc: "油罐车队从迪尔祖尔的油田出发，经土耳其边境的走私网络流向地下市场。"
 ISIX_media_idea: "宣传机器"
 ISIX_media_idea_desc: "《达比克》杂志、高清处决视频与社交媒体，把一个组织变成了全球的恐惧符号。"
 ISIX_foreign_fighters_idea: "外籍战斗人员"
 ISIX_foreign_fighters_idea_desc: "数万名来自欧洲、中亚与北非的志愿者，通过土耳其边境涌入哈里发国。"
 ISIX_tunnels_idea: "地道与纵深防御"
 ISIX_tunnels_idea_desc: "地道、狙击手、自杀车与地雷，把每一座城市变成一座堡垒。"
 ISIX_underground_idea: "转入地下"
 ISIX_underground_idea_desc: "失去领土之后，组织转为游击与恐怖，等待下一个机会。"
 ROJX_democratic_confederalism_idea: "民主联邦主义"
 ROJX_democratic_confederalism_idea_desc: "性别平等、地方议会与多民族共治：罗贾瓦的社会契约在战火中试验着一种新的政治。"
 ROJX_women_idea: "共同主席制与女性武装"
 ROJX_women_idea_desc: "每个机构都有一位男性与一位女性共同主席，女子保卫部队成为战场上的象征。"
 ROJX_ypg_idea: "人民保卫部队"
 ROJX_ypg_idea_desc: "YPG 与 YPJ 的战士在科巴尼、拉卡与迪尔祖尔的战斗中成长为一支纪律严明的武装。"
 ROJX_coalition_idea: "国际联军的空中支援"
 ROJX_coalition_idea_desc: "美国领导的联军为地面攻势提供空袭、侦察与特种部队顾问。"
 ROJX_oil_idea: "东部油田"
 ROJX_oil_idea_desc: "自治政府控制了东部的油田与水电站，成为财政最重要的来源。"
 ROJX_camps_idea: "战俘营与难民营"
 ROJX_camps_idea_desc: "数万名伊斯兰国家属与战俘关押在营地里，自治政府承担着没有国际援助的安全与人道责任。"
 ROJX_turkey_pressure_idea: "土耳其的压力"
 ROJX_turkey_pressure_idea_desc: "安卡拉视自治区为恐怖组织的延伸，边境的炮击与越境行动从未停止。"
 SYR_ext_isis_war: "对「伊斯兰国」的敌意"
 SYR_ext_ypg_aid: "支持叙利亚民主力量"
 SYR_ext_tur_pkk: "土耳其对 PKK 的敌意"
 ISIX_tb_captured: "缴获的重武器"
 ISIX_tb_drone: "无人机与诡雷"
 roc_asia.65.a: "宣布哈里发国"
 roc_asia.65.t: "哈里发降临摩苏尔"
 roc_asia.65.d: "al-Baghdadi登上摩苏尔努尔大清真寺的讲坛。他宣布：伊斯兰国成立，全世界的穆斯林都有义务效忠。这是自 1924 年以来第一次有人自称哈里发。"
 roc_asia.66.a: "这是转折点"
 roc_asia.66.t: "科巴尼的春天"
 roc_asia.66.d: "战斗持续了四个月，科巴尼的守军终于将伊斯兰国逐出了这座城市。伊斯兰国第一次在一场大规模的战斗中失败，它的神话开始动摇。"
 roc_asia.67.a: "保卫剩余的地区"
 roc_asia.67.t: "阿夫林的陷落"
 roc_asia.67.d: "土耳其军队与叙利亚国民军攻入阿夫林市。数十万居民逃离家园，库尔德人指责世界无动于衷。"
 roc_asia.68.a: "等待时机"
 roc_asia.68.t: "隐入地下"
 roc_asia.68.d: "最后的据点陷落。数千名战斗人员散入沙漠与城镇，他们带走了武器与仇恨。"
 SYRX_crisis_cell: "危机管理小组"
 SYRX_crisis_cell_desc: "「叛乱」从德拉蔓延到全国。总统府设立危机管理小组：国防、情报与内政部门首脑每天开会，统一协调镇压与平息。"
 SYRX_defend_damascus: "保卫大马士革"
 SYRX_defend_damascus_desc: "反对派占领了首都外围，炮火落进了总统府的院子。无论如何，大马士革都必须守住。"
 SYRX_fourth_division: "第四装甲师与共和国卫队"
 SYRX_fourth_division_desc: "Maher al-Assad 的第四装甲师与共和国卫队是政权最可靠的拳头，部署在首都周围的制高点上。"
 SYRX_checkpoints: "检查站网络"
 SYRX_checkpoints_desc: "大马士革的每一个路口都设有检查站与情报员，反对派的渗透被压缩到最低限度。"
 SYRX_siege_tactic: "围城战术"
 SYRX_siege_tactic_desc: "围困、断粮、轰炸，直到叛军控制区的居民别无选择。这套办法在霍姆斯、东古塔与阿勒颇一再重复。"
 SYRX_reconciliation: "地方和解协议"
 SYRX_reconciliation_desc: "与叛军达成「和解」：武装人员及家属携带轻武器撤往伊德利卜，城区交还政府。这是代价较小的收复方式。"
 SYRX_reform_army: "整编军队"
 SYRX_reform_army_desc: "叛逃、伤亡与逃兵让叙利亚阿拉伯军萎缩了一半。必须重新整编、合并番号、改组指挥。"
 SYRX_ndf: "国防军（NDF）"
 SYRX_ndf_desc: "把各地的亲政府民兵——沙比哈、人民委员会、复兴营——整合成国防军，由政权直接发饷发枪。"
 SYRX_tiger_forces: "老虎部队"
 SYRX_tiger_forces_desc: "由情报部队的精锐组成的「老虎部队」，从空军情报局的 Suheil al-Hassan 上校手中接过任务：哪里最难，就去哪里。"
 SYRX_airpower: "空军与桶装炸弹"
 SYRX_airpower_desc: "空军是政权对叛军最大的优势。直升机与战机日夜出动，也引来了国际社会最猛烈的谴责。"
 SYRX_conscription: "紧急征召"
 SYRX_conscription_desc: "兵役期限延长，预备役全面动员。适龄男子要么入伍，要么外逃。"
 SYRX_armor_rebuild: "装甲兵重建"
 SYRX_armor_rebuild_desc: "从俄罗斯与伊朗取得 T-72 与零配件，把受损的装甲师重新修好。"
 SYRX_foreign_backers: "争取盟友"
 SYRX_foreign_backers_desc: "孤立无援的政权需要朋友：伊朗要的是「抵抗轴心」，俄罗斯要的是地中海的基地。"
 SYRX_iran_axis: "伊朗与真主党"
 SYRX_iran_axis_desc: "伊朗革命卫队与黎巴嫩真主党的人员进入叙利亚，伊拉克与阿富汗的什叶派民兵也赶来参战。"
 SYRX_russia_intervention: "俄罗斯空天军介入"
 SYRX_russia_intervention_desc: "2015 年 9 月，俄罗斯空天军进驻赫梅明。政权的颓势在几周内被扭转。"
 SYRX_joint_command: "联合作战指挥部"
 SYRX_joint_command_desc: "大马士革、德黑兰与莫斯科的军官在同一间作战室里工作，把战线从一个城市推向下一个城市。"
 SYRX_chemical_line: "化学武器与「红线」"
 SYRX_chemical_line_desc: "古塔的毒气让国际舆论哗然，华盛顿说：这是红线。政权面临一个难以回避的抉择。"
 SYRX_chem_deal: "销毁化学武器"
 SYRX_chem_deal_desc: "在莫斯科的斡旋下，政权同意加入《禁止化学武器公约》，把库存交给国际社会销毁。打击被取消，政权换来了喘息。"
 SYRX_chem_deny: "否认与反击"
 SYRX_chem_deny_desc: "政权否认一切指控，指责反对派自导自演。西方的制裁与谴责接踵而至，也让盟友付出了更多外交代价。"
 SYRX_new_constitution: "2012 年新宪法"
 SYRX_new_constitution_desc: "宪法修订取消了复兴党的领导地位条款，并规定了多党选举。反对派说这只是换了封面。"
 SYRX_reconciliation_ministry: "民族和解部与大赦"
 SYRX_reconciliation_ministry_desc: "设立民族和解部，颁布大赦令。批评者说，大赦令的受益者从来不包括真正的反对派。"
 SYRX_presidential_election: "2014 年总统选举"
 SYRX_presidential_election_desc: "战火中举行的总统选举，政权宣布「人民再次选择了 Assad」。反对派与西方拒绝承认。"
 SYRX_astana_process: "阿斯塔纳进程与降级区"
 SYRX_astana_process_desc: "在俄罗斯、伊朗与土耳其的主持下，叙利亚被划分为四个「降级区」：战火暂时平息，战线冻结在新的位置。"
 SYRX_aleppo_reconquest: "收复阿勒颇"
 SYRX_aleppo_reconquest_desc: "经过数年围城，阿勒颇东区在 2016 年底回到政府手中。这是内战的转折点。"
 SYRX_palmyra_desert: "沙漠战役与帕尔米拉"
 SYRX_palmyra_desert_desc: "把伊斯兰国从帕尔米拉与中部沙漠中驱逐出去，打通通往幼发拉底河的道路。"
 SYRX_idlib_question: "伊德利卜问题"
 SYRX_idlib_question_desc: "数十万人与各路武装被挤进伊德利卜。进攻意味着巨大的人道灾难，不进攻则让这块飞地长期存在。"
 SYRX_euphrates_front: "幼发拉底河东岸"
 SYRX_euphrates_front_desc: "迪尔祖尔与东部油田在谁手中，决定了战后叙利亚的财政：政权、库尔德人与美军都盯着这一带。"
 SYRX_war_economy: "战争经济"
 SYRX_war_economy_desc: "关税、配给与黑市交错并存：政权在战争中重新分配了国家的财富。"
 SYRX_whole_syria: "统一的叙利亚"
 SYRX_whole_syria_desc: "政权宣称：国土上的每一寸，都要重新回到大马士革的管辖之下。"
 SYRF_council: "叙利亚全国委员会"
 SYRF_council_desc: "2011 年秋，流亡反对派在伊斯坦布尔组成全国委员会，宣布代表「叙利亚人民」。"
 SYRF_national_coalition: "全国联盟"
 SYRF_national_coalition_desc: "全国委员会与其他派别合并为「叙利亚革命与反对派全国联盟」，得到数十国的承认。"
 SYRF_geneva: "日内瓦谈判"
 SYRF_geneva_desc: "联合国主持的日内瓦会谈：政权与反对派坐在同一张桌子前，谁也不肯让步。"
 SYRF_interim_government: "临时政府"
 SYRF_interim_government_desc: "联盟任命的临时政府在解放区开展行政：警察、医院、法院与学校。"
 SYRF_friends_of_syria: "叙利亚人民之友"
 SYRF_friends_of_syria_desc: "西方与海湾国家组成「叙利亚人民之友」，承诺提供政治与物资支持。"
 SYRF_military_council: "最高军事委员会"
 SYRF_military_council_desc: "各地叛变军官与武装团体合编为最高军事委员会，由 Salim Idris 将军统领。"
 SYRF_defections: "军队倒戈"
 SYRF_defections_desc: "士兵与军官成批叛逃，带着武器加入自由叙利亚军。"
 SYRF_local_councils: "地方革命委员会"
 SYRF_local_councils_desc: "解放区里的地方委员会接手了面包房、水电与学校。"
 SYRF_brigades: "旅级编制"
 SYRF_brigades_desc: "把零散的营与小股武装按地域合编为旅，终于有了相对完整的指挥结构。"
 SYRF_foreign_support: "外国援助"
 SYRF_foreign_support_desc: "没有外国援助，自由叙利亚军撑不了几个月。问题在于：从谁那里接受，又得付出什么。"
 SYRF_turkey_haven: "土耳其庇护"
 SYRF_turkey_haven_desc: "土耳其开放边境、设立难民营与训练基地，成为反对派最重要的后方。"
 SYRF_gulf_money: "海湾资金"
 SYRF_gulf_money_desc: "卡塔尔、沙特与科威特的资金源源不断，同时也把各个派系的意识形态带了进来。"
 SYRF_train_equip: "美国训练与装备"
 SYRF_train_equip_desc: "中情局的「木材梧桐」计划为选定的旅提供反坦克导弹与训练，条件是不能落入极端派手中。"
 SYRF_extremist_question: "极端派的挑战"
 SYRF_extremist_question_desc: "资金与武器越来越多地流入萨拉菲派武装。是联合、是对抗，还是装作没看见？"
 SYRF_ally_nusra: "与努斯拉并肩作战"
 SYRF_ally_nusra_desc: "在前线上，努斯拉阵线是最能打的部队。联合作战，意味着也接受它的方式。"
 SYRF_isolate_extremists: "与极端派划清界限"
 SYRF_isolate_extremists_desc: "宣布与基地组织与「伊斯兰国」划清界限，换取西方的持续援助。代价是前线兵力的下降。"
 SYRF_euphrates_shield: "「幼发拉底之盾」"
 SYRF_euphrates_shield_desc: "2016 年，土耳其军队与自由叙利亚军一道越过边境，肃清北部的伊斯兰国与库尔德武装。"
 SYRF_national_army: "叙利亚国民军"
 SYRF_national_army_desc: "土耳其支持的各路武装整编为叙利亚国民军，在北部地区形成统一的指挥系统。"
 SYRF_liberated_aleppo_damascus: "攻入大马士革"
 SYRF_liberated_aleppo_damascus_desc: "自由叙利亚军从北线南线同时发动攻势，目标是首都。这是革命最大胆的一步。"
 SYRF_transition_plan: "过渡治理方案"
 SYRF_transition_plan_desc: "起草过渡期宪章：由过渡委员会接管权力，军队与安全机构改组，选举在两年内举行。"
 SYRF_free_syria_victory: "自由的叙利亚"
 SYRF_free_syria_victory_desc: "政权倒下了。自由叙利亚军与全国联盟走进大马士革，开始建设一个新的国家。"
 SYRN_emergence: "胜利阵线"
 SYRN_emergence_desc: "2012 年初，「支援阵线」（努斯拉）发表声明，在叙利亚境内对政权军警发动袭击。"
 SYRN_build_ranks: "精锐与突击队"
 SYRN_build_ranks_desc: "以外籍战斗人员与老兵为班底，建立能够执行自杀式突击与阵地战的精锐部队。"
 SYRN_inghimasi: "突击与攻坚"
 SYRN_inghimasi_desc: "攻坚部队开着装甲自杀车打开缺口，步兵紧随其后。伤亡极大，战果也极大。"
 SYRN_wage_war: "消耗战"
 SYRN_wage_war_desc: "在乡村与山区不断伏击政权军队的补给线，用持续的消耗拖垮对手。"
 SYRN_sharia_courts: "沙里亚法庭"
 SYRN_sharia_courts_desc: "在占领区设立沙里亚法庭，处理民事与刑事案件。迅速的审判与廉价的公道，让一部分居民接受了它。"
 SYRN_dawa_offices: "宣教办公室"
 SYRN_dawa_offices_desc: "宣教办公室负责施粥、办学、办医院，也负责招募新人。"
 SYRN_qaeda_oath: "向基地组织效忠"
 SYRN_qaeda_oath_desc: "2013 年 4 月，努斯拉领导人 al-Julani 拒绝并入伊斯兰国，转而向基地组织领导人 al-Zawahiri 宣誓效忠。"
 SYRN_break_qaeda: "与基地组织切割"
 SYRN_break_qaeda_desc: "2016 年 7 月，al-Julani 宣布与基地组织切断关系，更名为「沙姆征服阵线」，以争取更广泛的支持。"
 SYRN_absorb_factions: "吞并其他派系"
 SYRN_absorb_factions_desc: "用武力与谈判，把伊德利卜的其他武装一个个并进自己旗下。"
 SYRN_fight_isis: "对抗「伊斯兰国」"
 SYRN_fight_isis_desc: "与伊斯兰国的冲突从辱骂升级为全面战争，努斯拉成为抵抗它的力量之一。"
 SYRN_hts_formation: "沙姆解放组织（HTS）"
 SYRN_hts_formation_desc: "2017 年初，沙姆征服阵线联合数个派系，成立「沙姆解放组织」。"
 SYRN_take_idlib: "控制伊德利卜"
 SYRN_take_idlib_desc: "2015 年起，伊德利卜省逐步落入解放组织手中。这里将成为它的统治中心。"
 SYRN_salvation_government: "救国政府"
 SYRN_salvation_government_desc: "设立救国政府，下设各部、法院、警察与税务，成为伊德利卜的事实政权。"
 SYRN_border_crossings: "边境口岸"
 SYRN_border_crossings_desc: "控制巴布哈瓦口岸，向过往货物征税，换取每月数百万美元的财政收入。"
 SYRN_turkey_pragmatism: "与土耳其的默契"
 SYRN_turkey_pragmatism_desc: "土耳其在伊德利卜设有观察点，解放组织与安卡拉之间保持着微妙的默契。"
 SYRN_moderate_image: "「温和」形象"
 SYRN_moderate_image_desc: "放下激进口号，向西方与邻国示好，自称是叙利亚人民的武装，而非国际圣战的一部分。"
 SYRN_battle_for_damascus: "南下大马士革"
 SYRN_battle_for_damascus_desc: "解放组织选择最冒险的一步：自伊德利卜向南发动攻势，争夺中央的权力。"
 SYRN_syria_for_syrians: "叙利亚人的叙利亚"
 SYRN_syria_for_syrians_desc: "解放组织解散旗号，转型为全国性的政治力量，提出建立一个「新叙利亚」。"
 SYRX_sanctions: "凯撒法案与经济崩溃"
 SYRX_sanctions_desc: "2020 年的《凯撒法案》切断了重建资金，里拉一夜之间贬值，面包与汽油要排队才能买到。政权的敌人不再只在战场上。"
 SYRX_captagon: "卡塔贡与灰色经济"
 SYRX_captagon_desc: "叙利亚成了全世界最大的兴奋剂生产国之一，出口收入养活了半个政权。邻国开始称它为「毒品国家」。"
 SYRX_arab_league_return: "重返阿拉伯联盟"
 SYRX_arab_league_return_desc: "2023 年，叙利亚时隔十二年回到阿盟的座位上。海湾国家押注：孤立没有用，不如做交易。"
 SYRX_israeli_strikes: "以色列空袭与防空"
 SYRX_israeli_strikes_desc: "以色列战机反复空袭大马士革周边与伊朗运输线，政权的防空系统疲于应付。"
 SYRX_reconstruction_plan: "重建蓝图"
 SYRX_reconstruction_plan_desc: "被炸毁的城区、被烧毁的田地、断电的工厂：重建需要的钱比政权拥有的多十倍。谁愿意出钱，谁就能拿到合同。"
 SYRX_refugee_return: "难民回国计划"
 SYRX_refugee_return_desc: "六百万叙利亚人逃往国外。政权号召他们回家，但人们记得离开的原因。"
 SYRF_southern_front: "南方阵线"
 SYRF_southern_front_desc: "德拉与库奈特拉的叛乱武装与约旦、美国的情报部门保持着联络，以相对温和的世俗面貌示人。"
 SYRF_sdf_talks: "与库尔德武装的谈判"
 SYRF_sdf_talks_desc: "叙利亚北部的库尔德人手握武装与油田。联合、对抗，还是保持距离？"
 SYRN_sochi: "索契协议与观察点"
 SYRN_sochi_desc: "2018 年，俄罗斯与土耳其达成协议：划定缓冲区，土军在伊德利卜设立观察点。解放组织夹在两大国之间求生存。"
 SYRN_delisting: "摘掉「恐怖组织」标签"
 SYRN_delisting_desc: "解放组织派人游说西方：我们只关心叙利亚。要摘掉标签，首先得证明自己不是基地组织的分支。"
 SYRB_consolidate: "权力的巩固"
 SYRB_consolidate_desc: "继位三年之后，总统终于把权力握在了自己手里：老一辈已经退场，家族与军队站在他身后。现在，他要决定用这份权力做什么。"
 SYRB_security_state: "安全国家"
 SYRB_security_state_desc: "大马士革之春结束了：沙龙被关闭，异议人士被带走。情报部门说，稳定比自由更重要。"
 SYRB_open_economy: "经济开放"
 SYRB_open_economy_desc: "总统是眼科医生，也是互联网协会的会长。他相信：只要经济开放，政治自然会跟上。"
 SYRB_baath_benefits: "复兴党的福利"
 SYRB_baath_benefits_desc: "党员子女优先入学、优先分房、优先就业——复兴党是国家，国家就是复兴党。"
 SYRB_personal_cult: "个人崇拜"
 SYRB_personal_cult_desc: "街头出现了新总统的画像：从医生到「年轻的希望」，宣传部门为他塑造新的形象。"
 SYRB_old_guard_balance: "与元老平衡"
 SYRB_old_guard_balance_desc: "父亲留下的元老——Khaddam、Shihabi、Zuabi——仍握着情报与军队的关键位置。要么拉拢，要么逐步替换。"
 SYRB_cosmetic_reforms: "表面的改革"
 SYRB_cosmetic_reforms_desc: "党代会通过了一份「更新与现代化」纲领：新的党章、新的口号，权力结构保持原样。"
 SYRB_mb_talks: "与穆斯林兄弟会的默契"
 SYRB_mb_talks_desc: "1982 年之后，兄弟会被当作头号敌人。现在，政权愿意让流亡的老一辈回国，换取沉默。"
 SYRB_social_market: "社会市场经济"
 SYRB_social_market_desc: "放开私人银行、保险与大学，下调关税，向外资打开大门。官员们说：现在轮到资本家当「新阶级」了。"
 SYRB_anticorruption: "反腐运动"
 SYRB_anticorruption_desc: "总统宣布要整顿腐败：几位部长下台，但被点名的亲属一个都不在名单上。"
 SYRB_free_media: "私营媒体与互联网"
 SYRB_free_media_desc: "第一批私营报纸、卫星电视与网吧出现了。审查并没有消失，只是变得更微妙。"
 SYRB_electoral_reform: "选举改革"
 SYRB_electoral_reform_desc: "议会选举引入了独立候选人，地方理事会也有了更多的权力。"
 SYRB_medical_investments: "医疗与科研投资"
 SYRB_medical_investments_desc: "新的医院、药厂与大学实验室，是总统最愿意夸耀的成就之一。"
 SYRB_before_the_storm: "风暴前夜"
 SYRB_before_the_storm_desc: "2010 年，叙利亚有了私人银行、手机与卫星电视，也有了干旱、失业与第一批抗议的标语。邻国的街头已经点燃了火。"
 SYRL_return_roots: "回到复兴党的初心"
 SYRL_return_roots_desc: "继位之后，年轻的总统发现：他继承的不只是一个国家，还有一整套围着家族转的权力网。「统一、自由、社会主义」——这三个词，难道只是挂在墙上的口号？"
 SYRL_end_dynasty: "终结家族政治"
 SYRL_end_dynasty_desc: "「国家不是谁的家产。」总统宣布：亲属不得担任部长、军队与情报首脑，姓氏不再是升迁的条件。"
 SYRL_makhlouf_trial: "清算家族财阀"
 SYRL_makhlouf_trial_desc: "追查 Rami Makhlouf 等亲属掌控的电信、石油与免税店垄断，没收非法所得，把合同拿出来公开招标。"
 SYRL_retire_old_guard: "元老退休制"
 SYRL_retire_old_guard_desc: "请 Khaddam、Shihabi 与军队、党内的老一辈体面退休，让位给更年轻、也更有专业背景的干部。"
 SYRL_merit_cadres: "任人唯贤"
 SYRL_merit_cadres_desc: "设立国家干部学院，用考试与考核取代「关系」。"
 SYRL_collective_leadership: "国家领导委员会"
 SYRL_collective_leadership_desc: "成立由党、军队与政府代表共同组成的国家领导委员会，重大决策不再由一个人说了算。"
 SYRL_term_limits: "总统任期限制"
 SYRL_term_limits_desc: "宪法规定：总统连任不得超过两届。这条规定，在中东的共和国里几乎没人兑现过。"
 SYRL_depoliticize_army: "军队去家族化"
 SYRL_depoliticize_army_desc: "共和国卫队与第四装甲师并入国防部统一指挥，军官任命交由独立的人事委员会决定。"
 SYRL_arab_socialism: "阿拉伯社会主义的复兴"
 SYRL_arab_socialism_desc: "把社会主义的承诺重新写进经济政策：土地、工厂与银行，是为多数人服务，而不是为少数人致富。"
 SYRL_land_reform: "新土地改革"
 SYRL_land_reform_desc: "把荒废的国有土地租给无地农民，成立农业合作社，重新把农村拉回来。"
 SYRL_public_sector: "重振公共部门"
 SYRL_public_sector_desc: "重新启动国家计划委员会，让能源、水泥、化肥、纺织回到国家手中。"
 SYRL_five_year_plan: "新五年计划"
 SYRL_five_year_plan_desc: "在民众的参与下，制定新一期五年计划：优先保证粮食、电力与居民住宅。"
 SYRL_euphrates_basin: "幼发拉底河流域开发"
 SYRL_euphrates_basin_desc: "塔布卡水坝是复兴党时代最大的工程。新一轮灌溉、水电与农业加工项目将沿着河谷展开。"
 SYRL_workers_coops: "合作社与职工参与"
 SYRL_workers_coops_desc: "工人代表进入企业管理委员会，农民合作社直接把粮食卖给国家。"
 SYRL_welfare_state: "全民医疗与教育"
 SYRL_welfare_state_desc: "免费的医院与大学，是复兴党留下的最宝贵的遗产之一。要把它们修好，也要把它们送到最偏远的村庄。"
 SYRL_baath_congress: "复兴党代表大会"
 SYRL_baath_congress_desc: "召开一次真正开放辩论的党代会：党的纲领、地区领导机构与书记处全部重新选举。"
 SYRL_npf_pluralism: "真正的民族进步阵线"
 SYRL_npf_pluralism_desc: "让民族进步阵线中的其他党派——共产党、阿拉伯社会主义联盟、统一社会党——拥有自己的纲领、报刊与议席。"
 SYRL_internal_democracy: "党内民主"
 SYRL_internal_democracy_desc: "地方党部的书记由党员直接投票选举，不再由上级任命。"
 SYRL_council_power: "人民议会的实权"
 SYRL_council_power_desc: "预算、立法与质询权回到人民议会手中，议员有权质询部长。内阁需要向议会负责。"
 SYRL_free_unions: "独立工会与农民联合会"
 SYRL_free_unions_desc: "工会与农民联合会可以自行选举领导、自行谈判工资与收购价。"
 SYRL_press_dialogue: "舆论监督"
 SYRL_press_dialogue_desc: "报纸可以批评部长，电视可以直播议会辩论。大马士革之春的记忆被重新翻出来。"
 SYRL_civil_state: "公民国家"
 SYRL_civil_state_desc: "宪法写明：人人在法律面前平等，不分教派与族裔。阿拉维、逊尼、基督徒与库尔德人，都是叙利亚公民。"
 SYRL_palestine_cause: "巴勒斯坦事业"
 SYRL_palestine_cause_desc: "在巴勒斯坦问题上重申复兴党的立场：不承认以色列的占领，支持难民回归，不做交易。"
 SYRL_arab_unity: "统一：阿拉伯团结"
 SYRL_arab_unity_desc: "复兴党的第一个口号是「统一」。重提阿拉伯共同市场、联合防务与人员自由流动的设想。"
 SYRL_nonaligned: "不结盟与多元外交"
 SYRL_nonaligned_desc: "同时与莫斯科、北京、德黑兰、安卡拉与欧洲保持往来，不依附任何一个阵营。"
 SYRL_iraq_reconcile: "弥合与伊拉克复兴党的裂痕"
 SYRL_iraq_reconcile_desc: "1966 年之后，大马士革与巴格达的两个复兴党互相攻击了几十年。是时候坐下来谈了。"
 SYRL_national_dialogue: "全国对话"
 SYRL_national_dialogue_desc: "邀请各党派、各宗教与各地方的代表，在同一间大厅里讨论国家的未来。"
 SYRL_people_army: "人民军队"
 SYRL_people_army_desc: "以义务兵役与全民防御为基础，建立一支忠于宪法而不是忠于个人的军队。"
 SYRL_left_ceasefire: "左翼停火方案"
 SYRL_left_ceasefire_desc: "向反对派中的世俗派与左翼提出停火与权力分享方案：自治议会、选举与大赦，条件是放下武器。"
 SYRL_rebuild_people: "人民重建委员会"
 SYRL_rebuild_people_desc: "用被毁的社区为单位，成立由居民选出的重建委员会，把钱和决定权一起交出去。"
 SYRL_new_republic: "新复兴共和国"
 SYRL_new_republic_desc: "总统在议会宣读新的国家纲领：复兴党属于人民，而不属于哪一个家族。统一、自由、社会主义——这一次，要真的做。"
 SYRB_iraq_war: "伊拉克战争与难民潮"
 SYRB_iraq_war_desc: "2003 年美军入侵邻国。大马士革反对战争，却也接纳了上百万伊拉克难民；边境的另一边，叛乱分子借道叙利亚进出。"
 SYRB_lebanon_exit: "撤出黎巴嫩"
 SYRB_lebanon_exit_desc: "2005 年哈里里遇刺，街头要求叙军撤出的呼声震耳欲聋。二十九年的驻军在几周内全部撤回。"
 SYRB_hezbollah_war: "2006 年战争与真主党"
 SYRB_hezbollah_war_desc: "以黎冲突之后，叙利亚把武器与外交支持都给了真主党。抵抗轴心在阿拉伯街头得到了从未有过的声望。"
 SYRB_kibar: "阿尔-基巴尔事件"
 SYRB_kibar_desc: "2007 年，以色列战机炸毁了代尔祖尔的一处神秘设施。叙利亚拒绝回应，也拒绝国际原子能机构的调查。"
 SYRB_iran_pact: "与伊朗的战略协议"
 SYRB_iran_pact_desc: "防务合作、联合工业与互免签证。伊朗不只是盟友，更是叙利亚经济的重要出资人。"
 SYRB_turkey_honeymoon: "叙土蜜月"
 SYRB_turkey_honeymoon_desc: "安卡拉与大马士革取消签证、联合召开内阁会议，边境的贸易与旅游一时红火。"
 SYRB_med_union: "地中海联盟与欧盟联系协议"
 SYRB_med_union_desc: "巴黎、布鲁塞尔与大马士革重新开始谈判：叙利亚能否加入欧盟的联系国协议？总统在爱丽舍宫受到隆重接待。"
 SYRB_russia_arms: "与俄罗斯的军购"
 SYRB_russia_arms_desc: "总统访问莫斯科，勾销了二十年前的军购债务，也买回了防空导弹与反坦克武器。"
 SYRB_intel_overhaul: "情报机构重组"
 SYRB_intel_overhaul_desc: "各个情报机构被整合进以总统府为中心的体系：空军情报局、军事情报局、政治安全局各自监视对方。"
 SYRB_loyal_army: "军队忠诚体系"
 SYRB_loyal_army_desc: "共和国卫队与第四装甲师的军官多出自同一教派与同一家族；晋升的第一条标准是忠诚。"
 SYRB_net_control: "互联网管制"
 SYRB_net_control_desc: "网吧要登记、博客要实名、社交网站要封锁。2007 年起，Facebook 在叙利亚成了「违禁品」。"
 SYRB_sectarian_balance: "教派平衡"
 SYRB_sectarian_balance_desc: "阿拉维、逊尼、基督徒与德鲁兹：政权的稳定有赖于让每个社群都相信，没有政权，自己会更糟。"
 SYRB_private_banks: "私营银行与证券交易所"
 SYRB_private_banks_desc: "2004 年起，第一批私营银行开张；2009 年大马士革证券交易所成立。有钱人排着队开户。"
 SYRB_private_universities: "私立大学与科研"
 SYRB_private_universities_desc: "私立大学、技术学院与创业孵化器在大马士革郊外相继出现，年轻人开始用英语写简历。"
 SYRB_telecom: "私营移动运营商"
 SYRB_telecom_desc: "两家私营运营商拿到牌照：Syriatel 与 MTN。手机很快取代了固定电话，也成了政权的新金矿。"
 SYRB_old_city_tourism: "老城区修复与旅游业"
 SYRB_old_city_tourism_desc: "大马士革老城、阿勒颇古堡与帕尔米拉遗址——旅游收入占国内生产总值的 12%。"
 SYRB_drought: "干旱与农村危机"
 SYRB_drought_desc: "连续四年的干旱让东北的农田变成沙尘，农民涌向城市边缘的棚户区。官方的农业数字却依旧漂亮。"
 SYRB_youth_unemployment: "青年失业与城镇化"
 SYRB_youth_unemployment_desc: "一半的叙利亚人不满 25 岁；大学毕业生在咖啡馆里刷新闻。第一批要求改革的标语，开始在手机里转发。"
 SYRL_women_equality: "妇女平等与家庭法改革"
 SYRL_women_equality_desc: "废除「荣誉犯罪」的减刑条款，提高法定结婚年龄，女性在继承与监护权上享有同等的权利。"
 SYRL_secular_education: "世俗义务教育"
 SYRL_secular_education_desc: "全国统一的十二年义务教育与统一教材，把宗教课与公民课分开。"
 SYRL_minorities_council: "宗教与族裔平等委员会"
 SYRL_minorities_council_desc: "由逊尼、阿拉维、基督徒、德鲁兹、伊斯玛仪、库尔德、亚美尼亚与亚述人代表共同组成的委员会，审议所有涉及教派与族群的法律。"
 SYRL_kurdish_citizenship: "库尔德人入籍"
 SYRL_kurdish_citizenship_desc: "1962 年的人口普查让数十万库尔德人成了「无国籍者」。新的国籍法恢复了他们的公民权，也承认库尔德语的教学与出版。"
 SYRL_nationalize_banks: "银行与保险国有化"
 SYRL_nationalize_banks_desc: "把私营银行与保险公司重新收归国有，信贷的方向由国家计划委员会决定。"
 SYRL_price_commission: "物价委员会"
 SYRL_price_commission_desc: "主食、燃料与药品的价格由物价委员会公布，商人不能擅自涨价。"
 SYRL_public_housing: "公共住房计划"
 SYRL_public_housing_desc: "在大城市郊外兴建以出租为主的公共住房，年轻夫妻与外来务工者优先。"
 SYRL_rural_electrification: "农村电气化与水利"
 SYRL_rural_electrification_desc: "把电力与灌溉渠送到最后一个村庄，农民不用再靠柴油泵浇地。"
 SYRL_progressive_tax: "累进税制"
 SYRL_progressive_tax_desc: "大企业与高收入者按更高的税率缴税，农民与小商户免税额提高。"
 SYRL_pension_system: "全民养老金"
 SYRL_pension_system_desc: "统一的养老金与社会保险覆盖农民、个体户与家庭主妇。"
 SYRL_oil_water: "石油与水资源国有"
 SYRL_oil_water_desc: "石油、天然气、水资源与矿产收入归全民所有，收入的三成用于农村与教育基金。"
 SYRL_national_charter: "国家宪章"
 SYRL_national_charter_desc: "由全国对话大会起草的新宪章：国家属于全体公民、政权来自选举、军队服从宪法、总统不得连任超过两届。"
 SYRL_media_reform: "全国媒体改革"
 SYRL_media_reform_desc: "公共广播成为独立机构，由议会监督；私营报纸与电台可以申请牌照。"
 SYRL_total_defense: "全民防御学说"
 SYRL_total_defense_desc: "以全民动员与山地防御取代对抗性的军备竞赛：民兵、预备役与国防工业统一指挥。"
 SYRL_south_south: "南南合作"
 SYRL_south_south_desc: "与委内瑞拉、古巴、中国与印度建立能源、农业与医疗的合作协议。"
 SYRL_solidarity: "非洲与拉美团结"
 SYRL_solidarity_desc: "在联合国与不结盟运动中与非洲及拉美国家同进同退。"
 SYRL_self_reliance: "自力更生计划"
 SYRL_self_reliance_desc: "制裁加重时的回应：用国产钢铁、水泥、纺织与化肥替代进口。"
 ISIX_declaration: "宣布哈里发国"
 ISIX_declaration_desc: "2014 年 6 月，「伊拉克与沙姆伊斯兰国」改称「伊斯兰国」，al-Baghdadi 被拥立为哈里发。边界被「推平」，一个横跨两国的国家出现在地图上。"
 ISIX_bayah: "效忠宣誓"
 ISIX_bayah_desc: "各地武装、部落与外国分支纷纷宣誓效忠，哈里发的名字出现在从西非到呼罗珊的旗帜上。"
 ISIX_diwans: "各部（迪万）"
 ISIX_diwans_desc: "设立财政、司法、教育、战争与情报各部，以及按「省」划分的行政区。"
 ISIX_hisbah: "宗教警察"
 ISIX_hisbah_desc: "希斯巴巡逻队与沙里亚法庭，是哈里发国统治占领区的两根支柱。"
 ISIX_zakat: "天课与人头税"
 ISIX_zakat_desc: "穆斯林缴天课，异教徒缴人头税，商贩缴「保护费」，哈里发国有了一个税务系统。"
 ISIX_schools: "哈里发的学校"
 ISIX_schools_desc: "课程改为宗教与军事训练，孩子被称为「哈里发的幼狮」。"
 ISIX_media: "宣传机器"
 ISIX_media_desc: "《达比克》、艾阿马克通讯社与社交媒体账号，把战场上的影像变成全世界的恐惧。"
 ISIX_military_council: "军事委员会"
 ISIX_military_council_desc: "前伊拉克军官与复兴党人组成军事委员会，掌握实际指挥权。"
 ISIX_blitz: "闪击推进"
 ISIX_blitz_desc: "数百辆皮卡载着步兵，从沙漠中扑向城市。守军常常在抵达之前就已经溃散。"
 ISIX_inghimasi: "突击队与自杀车"
 ISIX_inghimasi_desc: "装甲自杀车炸开缺口，突击队冲入，再由大部队跟进。"
 ISIX_heavy_weapons: "缴获的重武器"
 ISIX_heavy_weapons_desc: "从摩苏尔的军营与叙利亚的军械库中缴获的坦克、火炮与防空武器。"
 ISIX_mosul: "攻陷摩苏尔"
 ISIX_mosul_desc: "2014 年 6 月，数百名武装人员攻陷伊拉克第二大城市，三万人的伊拉克军队几乎没有抵抗。"
 ISIX_raqqa: "以拉卡为首都"
 ISIX_raqqa_desc: "拉卡成为哈里发国的「首都」：行政、宣传与外籍志愿者训练都集中于此。"
 ISIX_kobani: "科巴尼围城"
 ISIX_kobani_desc: "数千名战斗人员围攻库尔德人的边境小城，卷入了整个世界的目光，也引来了联军的空袭。"
 ISIX_drones_ied: "无人机与简易爆炸装置"
 ISIX_drones_ied_desc: "商用无人机投下手榴弹，一片废墟里布满了诡雷。"
 ISIX_tunnels: "地道与纵深防御"
 ISIX_tunnels_desc: "把每一座城市变成要塞：地道、狙击手、地雷与人体盾牌。"
 ISIX_oil_smuggling: "石油走私"
 ISIX_oil_smuggling_desc: "迪尔祖尔的油田日产数万桶原油，经走私网络运往土耳其与伊拉克。"
 ISIX_antiquities: "文物与绑架"
 ISIX_antiquities_desc: "帕尔米拉与尼姆鲁德的文物流入黑市；外国人质成为赎金的来源。"
 ISIX_dams_grain: "大坝与粮仓"
 ISIX_dams_grain_desc: "塔布盖大坝提供电力，周围的平原提供粮食。控制水，就控制了人。"
 ISIX_war_chest: "战争基金"
 ISIX_war_chest_desc: "各部门的收入汇集成一笔可观的战争基金：发工资、买武器、安抚部落。"
 ISIX_foreign_fighters: "外籍战斗人员"
 ISIX_foreign_fighters_desc: "数万名志愿者来自欧洲、中亚与北非：他们是哈里发国最忠诚的突击力量，也是最难管理的一群人。"
 ISIX_wilayat: "海外「省份」"
 ISIX_wilayat_desc: "尼日利亚、西奈、利比亚与呼罗珊的武装宣布成为哈里发国的省份。"
 ISIX_terror_attacks: "境外袭击"
 ISIX_terror_attacks_desc: "巴黎、布鲁塞尔、伊斯坦布尔：袭击把哈里发国的战争延伸到了世界各地，也让联军下定决心。"
 ISIX_lone_wolves: "独狼与网络圣战"
 ISIX_lone_wolves_desc: "通过网络招募远方的支持者，让他们在自己所在的城市发动袭击。"
 ISIX_sinai_libya: "西奈与利比亚"
 ISIX_sinai_libya_desc: "在埃及西奈与利比亚的苏尔特，哈里发国设立了新的据点。"
 ISIX_khorasan: "呼罗珊省"
 ISIX_khorasan_desc: "把触角伸向阿富汗与中亚。"
 ISIX_coalition_war: "与国际联军的战争"
 ISIX_coalition_war_desc: "八十多国组成的联军开始空袭：补给线被切断，领土一块块丢失。哈里发国要面对它最大的考验。"
 ISIX_last_stand: "最后的据点"
 ISIX_last_stand_desc: "被围在幼发拉底河谷的最后几个村镇里，剩下的战士选择战斗到底。"
 ISIX_underground: "转入地下"
 ISIX_underground_desc: "宣布放弃领土，分散为数百个小组，转入游击与恐怖的阶段。"
 ISIX_embers: "哈里发的余烬"
 ISIX_embers_desc: "残余的武装保存下来：他们等待着下一个动荡，下一个失败的国家。"
 ROJX_autonomy: "民主自治"
 ROJX_autonomy_desc: "2012 年，叙利亚政府军从北部库尔德地区撤出。库尔德人宣布民主自治：一场既不属于政权、也不属于反对派的「第三条道路」。"
 ROJX_social_contract: "社会契约宪章"
 ROJX_social_contract_desc: "制定《罗贾瓦社会契约》：三个自治区、多民族共治、性别平等、民选议会。"
 ROJX_cantons: "三个自治区"
 ROJX_cantons_desc: "杰兹拉、科巴尼与阿夫林三个区各设行政机构，彼此之间隔着敌占区，只能靠电话维系。"
 ROJX_councils: "人民议会"
 ROJX_councils_desc: "从街道、村庄到区级的人民议会，成为自治区的基层政权。"
 ROJX_women_cochair: "共同主席制"
 ROJX_women_cochair_desc: "任何机构都设男女共同主席，女子保卫部队是战场上的象征，也让世界看到另一个库尔德。"
 ROJX_ecology: "社会生态"
 ROJX_ecology_desc: "推广合作社、可再生能源与生态农业，试图建设一个与战争经济不同的社会。"
 ROJX_multi_ethnic: "多民族共治"
 ROJX_multi_ethnic_desc: "阿拉伯人、亚述人、土库曼人与切尔克斯人在议会与军队里拥有自己的位置。"
 ROJX_ypg_ypj: "人民保卫部队"
 ROJX_ypg_ypj_desc: "人民保卫部队（YPG）与女子保卫部队（YPJ）是自治区唯一的武装力量。"
 ROJX_asayish: "安全部队（阿萨伊什）"
 ROJX_asayish_desc: "内部安全部队负责治安、反恐与情报，也被指控压制异见。"
 ROJX_ypj_swords: "女子保卫部队"
 ROJX_ypj_swords_desc: "这些女战士的形象出现在全世界的杂志封面上，也让极端分子闻风丧胆。"
 ROJX_kobani: "科巴尼保卫战"
 ROJX_kobani_desc: "2014 年秋天，伊斯兰国围攻科巴尼。守军靠着美国空投的武器与世界的目光，硬是撑过了冬天。"
 ROJX_sdf: "叙利亚民主力量（SDF）"
 ROJX_sdf_desc: "以 YPG 为核心，联合阿拉伯部落武装、亚述人与基督教民兵，成立叙利亚民主力量。"
 ROJX_tal_abyad: "提勒阿卜耶德与曼比季"
 ROJX_tal_abyad_desc: "把北方的边境口岸与幼发拉底河西岸的城镇连在一起，切断了伊斯兰国与外界的通道。"
 ROJX_raqqa_campaign: "拉卡战役"
 ROJX_raqqa_campaign_desc: "「愤怒的幼发拉底」行动：在联军空袭与特种部队支援下，SDF 夺取了哈里发国的首都。"
 ROJX_deir_ezzor: "东部战役"
 ROJX_deir_ezzor_desc: "沿着幼发拉底河向南，直至迪尔祖尔：自治区控制了叙利亚最大的油田。"
 ROJX_us_coalition: "国际联军"
 ROJX_us_coalition_desc: "美军特种部队与联军空中力量成为 SDF 最重要的盟友，也让它承担了与土耳其的外交摩擦。"
 ROJX_russia_channel: "与莫斯科的沟通"
 ROJX_russia_channel_desc: "俄罗斯在叙利亚北部设立了联络点，自治区试图在美国与俄罗斯之间保留回旋的空间。"
 ROJX_damascus_talks: "与大马士革谈判"
 ROJX_damascus_talks_desc: "自治区与政权在地方安全、油田分配与自治权利上反复谈判，却始终无法达成一致。"
 ROJX_kurdish_ties: "与伊拉克库尔德的关系"
 ROJX_kurdish_ties_desc: "Barzani 的库尔德斯坦地区政府与罗贾瓦之间既是兄弟也是对手：关口、政党与武装，样样都有分歧。"
 ROJX_turkey_threat: "土耳其的威胁"
 ROJX_turkey_threat_desc: "安卡拉把自治区视为 PKK 的延伸。边境炮击、无人机袭击与越境行动让这里长期处于威胁之下。"
 ROJX_olive_branch: "阿夫林保卫战"
 ROJX_olive_branch_desc: "2018 年初，土耳其军队与叙利亚国民军进攻阿夫林。自治区损失了一个区，却保住了其余的部分。"
 ROJX_peace_spring: "和平之泉"
 ROJX_peace_spring_desc: "2019 年美军撤出之后，土耳其的攻势沿边境推进。库尔德人只能向大马士革求援，让政府军进入边境城镇。"
 ROJX_oil_fields: "东部油田"
 ROJX_oil_fields_desc: "油田的收入与农业税，是自治政府最大的收入。"
 ROJX_wheat: "小麦与棉花"
 ROJX_wheat_desc: "杰兹拉是叙利亚的粮仓。保住农业，就保住了自治区的民生。"
 ROJX_reconstruction: "拉卡重建"
 ROJX_reconstruction_desc: "从废墟里清理地雷、重建医院、学校与供水，在拉卡人的帮助下重建这座城市。"
 ROJX_camps: "战俘营与难民营"
 ROJX_camps_desc: "数万名伊斯兰国家属与战俘滞留营地。自治政府要求国际社会接收，但几乎没有国家愿意。"
 ROJX_federal_syria: "联邦制的叙利亚"
 ROJX_federal_syria_desc: "提出「去中心化的联邦制」：叙利亚应当是由各地区自治共同组成的联邦。"
 ROJX_integration: "回到叙利亚"
 ROJX_integration_desc: "与大马士革达成自治协议：自治区保留武装与行政，但承认叙利亚的主权。"
 ROJX_independence: "库尔德斯坦的梦"
 ROJX_independence_desc: "宣布独立：一个跨越叙利亚、伊拉克、土耳其与伊朗的库尔德民族国家，是几代人的理想。"
 SYR_dec_pc_woo_baath: "拉拢独立议员（入复兴党团）"
 SYR_dec_pc_woo_baath_desc: "总统府与情报系统出面，说服 6 名独立议员加入复兴党团：商人、部落首领（shuyukh）与地方头面人物，没有人愿意与政权为敌。"
 SYR_dec_pc_woo_npf: "拉拢独立议员（入国进阵）"
 SYR_dec_pc_woo_npf_desc: "劝说 4 名独立议员加入国民进步阵线的盟党——它们是政权议会里最听话的「花瓶」。"
 SYR_dec_pc_lift_emergency: "废止紧急状态法"
 SYR_dec_pc_lift_emergency_desc: "自 1963 年起实行的紧急状态法，一直是政权维持统治的法律基础。2011 年 4 月，在大规模抗议的压力下，总统签署法令予以废止。"
 SYR_dec_pc_party_law: "颁布《政党法》"
 SYR_dec_pc_party_law_desc: "2011 年 8 月，人民议会通过《政党法》：允许在法律框架内组建新的政党，但禁止基于宗教、部族与地域的组织。"
 SYR_dec_pc_constitution: "2012 年新宪法"
 SYR_dec_pc_constitution_desc: "宪法第 8 条——复兴党是国家与社会的领导党——被取消，总统任期七年、可连任一次，并规定多党制。公投在 2012 年 2 月举行。修宪需要人民议会三分之二多数同意。"
 SYR_dec_pc_counter_terror: "《反恐法》"
 SYR_dec_pc_counter_terror_desc: "2012 年议会通过《反恐法》与相关的特别法庭，把对反对派的起诉和审判纳入反恐的框架。政权获得了更大的权力，也招来更强烈的国际谴责。"
 SYR_dec_pc_law10: "第 10 号法（房地产法）"
 SYR_dec_pc_law10_desc: "2018 年的第 10 号法授权设立重建区，业主必须在限期内提交产权证明，否则土地收归国有。批评者说，它让数百万流离失所的人失去了回家的权利。"
 SYR_dec_pc_dissolve: "解散人民议会，提前大选"
 SYR_dec_pc_dissolve_desc: "宪法授权总统解散议会。在需要新面孔、或者需要一个重新洗牌的议会时，总统府会这样做。"
 SYR_dec_pc_eid_amnesty: "开斋节 / 宰牲节大赦"
 SYR_dec_pc_eid_amnesty_desc: "总统在宗教节日颁布大赦令是叙利亚的传统：释放一部分囚犯，减免刑期，也给议会与社会一个缓和的信号。"
 SYR_people_council_category: "人民议会"
 SYR_people_council_modifier: "人民议会"
 SYR_people_council_modifier_desc: "叙利亚人民议会对政治点数与稳定度的修正：议会支持度高于一半时有利，政权体制下按「橡皮图章」打折。"
 SYR_people_council_category_desc: "§L叙利亚人民议会共 250 席，每届四年。宪法规定议会立法、批准预算与条约，并可对总统的法令表示同意；总统可以解散议会。§!"
 SYR_pc_spk_1: "Abdul Qader Qaddura"
 SYR_pc_spk_2: "Mahmoud al-Abrash"
 SYR_pc_spk_3: "Jihad Laham"
 SYR_pc_spk_4: "Hadiya Khalaf Abbas"
 SYR_pc_spk_5: "Hammouda Sabbagh"
 SYR_pc_mode_regime: "威权体制"
 SYR_pc_mode_open: "竞争性选举"
 SYR_pc_sys_reserved: "选举制度：国民进步阵线保留三分之二席位（Majlis al-Shaab）"
 SYR_pc_sys_multi: "选举制度：多党竞争（2012 年宪法）"
 SYR_pc_mark_ruling: " §G（执政）§!"
 SYR_pc_mark_ally: " §Y（结盟）§!"
 SYR_pc_mark_none: ""
 SYR_pc_two_thirds_tt: "执政联盟拥有人民议会三分之二以上席位"
 SYR_pc_majority_tt: "执政联盟拥有人民议会过半数席位"
 SYR_pc_gui_header: "§Y第 [?SYR_pc_term|0] 届人民议会§! · 议长：[SYR_pc_speaker_name] · [SYR_pc_mode_text]"
 SYR_pc_gui_gov_count: "§G[?SYR_pc_gov|0]§! / 250 席（[?SYR_pc_support_pct|0]%）"
 SYR_pc_gui_baath: "阿拉伯复兴社会党  [?SYR_pc_baath|0] 席  [?SYR_pc_baath_pct|0]%[SYR_pc_mark_baath]"
 SYR_pc_gui_npf: "国民进步阵线盟党  [?SYR_pc_npf|0] 席  [?SYR_pc_npf_pct|0]%[SYR_pc_mark_npf]"
 SYR_pc_gui_ind: "独立人士  [?SYR_pc_ind|0] 席  [?SYR_pc_ind_pct|0]%"
 SYR_pc_gui_sec: "世俗与自由派反对派  [?SYR_pc_sec|0] 席  [?SYR_pc_sec_pct|0]%"
 SYR_pc_gui_isl: "伊斯兰主义反对派  [?SYR_pc_isl|0] 席  [?SYR_pc_isl_pct|0]%"
 SYR_pc_gui_countdown: "距下次选举还有 §Y[?SYR_pc_months_left|0]§! 个月（每届四年）"
 SYR_pc_gui_system: "[SYR_pc_system_text]"
 SYR_pc_gui_quota: "[SYR_pc_quota_text]"
 SYR_pc_quota_on: "农工配额：宪法规定农民与工人至少占一半席位（现有 §Y[?SYR_pc_wp|0]§! 席）· 15 个省级选区"
 SYR_pc_quota_gone: "农工配额：2012 年新宪法已废除 · 15 个省级选区"
 SYR_pc_gui_term_info: "刻度灯：§R1/3§! 阻挡线 · §Y1/2§! 过半数 · §G2/3§! 修宪门槛"
 SYR_pc_gui_warning: "§R警告：执政联盟席次不足三分之一，议会已经不在你的掌握之中！§!"
 roc_asia.80.a: "议会新一届开幕"
 roc_asia.80.t: "人民议会选举"
 roc_asia.80.d: "选民走进投票站：复兴党 §Y[?SYR_pc_baath|0]§! 席，国民进步阵线盟党 §Y[?SYR_pc_npf|0]§! 席，独立人士 §Y[?SYR_pc_ind|0]§! 席，世俗反对派 §Y[?SYR_pc_sec|0]§! 席，伊斯兰主义反对派 §Y[?SYR_pc_isl|0]§! 席。\n\n[SYR_pc_system_text]"
 roc_asia.81.a: "这是改革的开始"
 roc_asia.81.t: "紧急状态结束"
 roc_asia.81.d: "四十八年的紧急状态法被废止。街头的人群欢呼雀跃，也有人说，真正的紧急状态——特务与检查站——一天都没有离开。"
 roc_asia.82.a: "等待审批"
 roc_asia.82.t: "新政党的诞生"
 roc_asia.82.d: "《政党法》生效后，数十个新的政党提出了申请。其中一部分是「独立」的替身，另一些是真正的反对派——它们能否留在法律框架内，取决于政权的态度。"
 roc_asia.83.a: "通过"
 roc_asia.83.t: "新宪法公投"
 roc_asia.83.d: "宪法公投：官方说投票率为 57%，赞成者占 89%。第 8 条被删除，复兴党不再是宪法规定的领导党；然而总统的权力、安全机构的权力与议会的构成，一点没有改变。"
 roc_asia.84.a: "投票通过"
 roc_asia.84.t: "34 岁的总统"
 roc_asia.84.d: "Hafez al-Assad 去世后数小时，人民议会召开紧急会议：宪法规定总统年龄不得低于 40 岁，议员们不到十分钟就把它改成了 34 岁——恰好是 Bashar al-Assad 的年龄。随后议会提名他为唯一的总统候选人。"
 roc_asia.85.a: "确认连任"
 roc_asia.85.t: "2007 年总统公投"
 roc_asia.85.d: "议会提名 Bashar al-Assad 为唯一候选人，公投中的赞成率为 97.6%。街头张贴的海报上写着：「Bashar，叙利亚的希望」。"
 roc_asia.86.a: "宣布结果"
 roc_asia.86.t: "2014 年总统选举"
 roc_asia.86.d: "新宪法下的第一次总统选举有三名候选人，官方公布的得票率为 88.7%。在反对派控制区，选举无法进行；西方国家称之为一场闹剧。"
 ### v3.29 叙利亚左翼规则
 SYRL_AI_BEHAVIOR: "叙利亚 AI 路线（左翼复兴党）"
 RULE_OPTION_SYRL_LEFT_BAATH: "左翼复兴党"
 RULE_OPTION_SYRL_LEFT_BAATH_DESC: "叙利亚 AI 走巴沙尔的「复兴党初心」路线：拒绝家族政治，回到复兴党最初的理想（统一、自由、社会主义）。需要与「叙利亚 AI 行为」选「史实」或「无路线」搭配，不要同时选其他路线。"
 RULE_OPTION_SYRL_NO_PATH: "不指定"
 RULE_OPTION_SYRL_NO_PATH_DESC: "不额外指定左翼路线，叙利亚 AI 按「叙利亚 AI 行为」的设置行动。"
 ### v3.33 台湾时代政治线与巴基斯坦国策
 TAIP_ext_mainland_ties: "两岸经贸往来"
 TAIP_ext_us_support: "台海现状的支持"
 TAIP_ext_strait_tension: "台海紧张"
 TAIP_ext_pfp_middle: "亲民党的中间路线"
 TAIP_status_quo_idea: "新的常态：维持现状"
 TAIP_status_quo_idea_desc: "不统、不独、不武：台北与北京都不愿打破现状，国际社会也乐见其成。这一份默契靠的是各方的克制。"
 TAIP_three_links_idea: "三通与陆客"
 TAIP_three_links_idea_desc: "直航、陆客与陆资让两岸的经济联系比任何时候都紧密，也让台湾对大陆市场有了依赖。"
 TAIP_sunflower_idea: "公民运动的遗产"
 TAIP_sunflower_idea_desc: "太阳花运动之后，公民团体、青年与新政党成为台湾政治里不可忽视的力量。"
 TAIP_mask_idea: "口罩外交与防疫体制"
 TAIP_mask_idea_desc: "疫情期间，口罩国家队、实名制与「台湾可以帮忙」成为外交的新名片。"
 TAIP_chip_idea: "护国神山"
 TAIP_chip_idea_desc: "晶圆代工占全球先进制程的绝大部分：这是台湾最大的经济筹码，也是最大的风险。"
 TAIP_energy_idea: "能源转型之争"
 TAIP_energy_idea_desc: "「非核家园」与供电安全之间的拉扯，让每一次跳电都成为政治议题。"
 roc_asia.90.a: "欢迎新的开始"
 roc_asia.90.t: "「不统不独不武」"
 roc_asia.90.d: "就职典礼上，新总统重申：只要台湾人民认可，就不会改变现状。台北的股市应声上涨，北京的反应则是克制地欢迎。"
 roc_asia.91.a: "倾听街头的声音"
 roc_asia.91.b: "坚持议事程序"
 roc_asia.91.t: "三月的议场"
 roc_asia.91.d: "深夜，立法院的议场里挤满了学生，他们占领了主席台。街头挤满了声援的民众，警方在凌晨清场。电视上整夜都是「你听见了吗」的口号。"
 roc_asia.92.a: "就职"
 roc_asia.92.t: "第三次轮替"
 roc_asia.92.d: "开票之夜，在野党总部爆出欢呼，执政党主席宣布辞职。新总统在演讲中提到「维持现状」四个字，不止一次。"
 TAI_ext_pak_china: "巴中全天候战略伙伴"
 TAI_ext_pak_us: "巴美关系回暖"
 TAI_ext_pak_india: "克什米尔与巴印敌对"
 TAI_ext_pak_roc: "巴基斯坦与中华民国的务实关系"
 TAI_ext_pak_imf: "IMF 的紧缩条件"
 TAI_ext_pak_gulf: "海湾的资金与援助"
 TAI_ext_pak_militancy: "边境的恐怖袭击"
 PAKX_hybrid_idea: "混合政体"
 PAKX_hybrid_idea_desc: "文官政府在台前，军方在幕后：选举照常举行，而国家的重大决定由谁做，人人心里有数。"
 PAKX_democracy_idea: "选举民主"
 PAKX_democracy_idea_desc: "多党竞争、独立媒体与律师界的抗争，让巴基斯坦的政治充满冲突，也充满希望。"
 PAKX_army_rule_idea: "军方主导"
 PAKX_army_rule_idea_desc: "将军们在幕后决定国家的方向：稳定是他们的承诺，代价是议会的失效。"
 PAKX_deterrence_idea: "最低限度可信威慑"
 PAKX_deterrence_idea_desc: "核武器是巴基斯坦与印度之间的平衡点，也是国家最昂贵的安全保障。"
 PAKX_navy_idea: "中国造的潜艇"
 PAKX_navy_idea_desc: "「海龙」级潜艇与新的护卫舰，让巴基斯坦海军第一次具备了远海的威慑力。"
 PAKX_cpec_idea: "中巴经济走廊"
 PAKX_cpec_idea_desc: "瓜达尔港、高速公路与能源项目连接着新疆与阿拉伯海，也让巴基斯坦背上了沉重的债务。"
 PAKX_imf_idea: "IMF 的救助方案"
 PAKX_imf_idea_desc: "每一次援助都附带着紧缩条件：税收、补贴与汇率，都要按照国际货币基金组织的时间表行事。"
 PAKX_textile_idea: "棉纺王国"
 PAKX_textile_idea_desc: "棉花、纺织与服装是巴基斯坦最重要的出口，几百万工人的生计系于一台台织机。"
 PAKX_counterterror_idea: "反恐的代价"
 PAKX_counterterror_idea_desc: "每一次袭击之后，边境地区的军事行动与人权争议都会重新上演。"
 PAKX_flood_idea: "洪水之后的重建"
 PAKX_flood_idea_desc: "2022 年的洪水让数百万人离开家园，也让「气候韧性」第一次成为国家议题。"
 PAKX_sco_idea: "上合组织的平衡"
 PAKX_sco_idea_desc: "同时与中俄、中亚和伊朗合作，既是机会，也是在大国之间走钢丝。"
 PAKX_roc_idea: "务实的台巴交流"
 PAKX_roc_idea_desc: "没有正式邦交的台北与伊斯兰堡，靠贸易、教育与民间往来，编织着一张务实的网。"
 PAKX_digital_idea: "年轻人的数字经济"
 PAKX_digital_idea_desc: "自由职业者与 IT 外包让数字经济成为新的增长点，也让年轻人第一次有了选择。"
 PAKX_tb_armor: "装甲技术"
 PAKX_tb_it: "IT 外包技术"
 PAKX_tb_edu: "教育与技能培训"
 roc_asia.100.a: "文官的面子也要留着。"
 roc_asia.100.b: "把权力集中在将军手里。"
 roc_asia.100.t: "混合政体的定型"
 roc_asia.100.d: "宪法里没有写的那一半：文官与军方的分工，在每一次危机中都被重新谈判，也逐渐成了惯例。"
 roc_asia.101.a: "秩序压倒一切。"
 roc_asia.101.b: "尽快还政于民。"
 roc_asia.101.t: "军方的回归"
 roc_asia.101.d: "将军们以「维持秩序」的名义接管了国家。宵禁、新闻审查与军事法庭成为日常。"
 roc_asia.102.a: "尊重选票。"
 roc_asia.102.b: "观察军方的态度。"
 roc_asia.102.t: "首次完整的政党轮替"
 roc_asia.102.d: "选举结束，在野党赢得了多数席位。首都街头的人群在欢呼，军营里一片沉默。"
 roc_asia.103.a: "威慑就是和平。"
 roc_asia.103.b: "呼吁军备控制。"
 roc_asia.103.t: "核威慑的完成"
 roc_asia.103.d: "在一次成功的导弹试射之后，国防部宣布「最低限度可信威慑」已经建立。印度的回应很快传来。"
 roc_asia.104.a: "把机遇变成繁荣。"
 roc_asia.104.b: "警惕债务的陷阱。"
 roc_asia.104.t: "走廊经济的成型"
 roc_asia.104.d: "瓜达尔港的第一艘大型货轮靠泊，中巴经济走廊的高速公路通车。债务与机遇，在同一张图纸上。"
 roc_asia.105.a: "感谢友谊。"
 roc_asia.105.b: "平衡各方。"
 roc_asia.105.t: "全天候战略伙伴"
 roc_asia.105.d: "巴中两国领导人发表联合声明，宣布「全天候战略合作伙伴关系」进入新阶段。"
 roc_asia.106.a: "动员国际援助。"
 roc_asia.106.b: "以国家力量重建。"
 roc_asia.106.t: "2022 年的洪水"
 roc_asia.106.d: "季风带来的洪水淹没了全国三分之一的土地。数百万人流离失所，国际援助的规模前所未有。"
 roc_asia.107.a: "让规划落地。"
 roc_asia.107.b: "先看看效果。"
 roc_asia.107.t: "共同发展的巴基斯坦"
 roc_asia.107.d: "国家的新规划把教育、医疗与就业放在了首位。政府承诺：每一个孩子都能上学。"
 TAIP_root: "「维持现状」的政党线"
 TAIP_root_desc: "不反攻之后，台湾的政治就是一条没有终点的线：每一次选举、每一次轮替，都是对「现状」的重新解释。"
 TAIP_e1: "2000 年：第一次政党轮替"
 TAIP_e1_desc: "五十年来第一次由在野党执政。台湾的政治第一次不再只有一种答案。"
 TAIP_e1_dpp: "民进党版：新中间路线"
 TAIP_e1_dpp_desc: "执政的民进党提出「新中间路线」，既要安抚北京，也要回应本土的期待。「四不一没有」写进了就职演说。"
 TAIP_e1_kmt: "国民党版：在野的桥"
 TAIP_e1_kmt_desc: "国民党失去执政后，连战访问大陆，与北京重启党际往来。在野的国民党，成了两岸之间的一座桥。"
 TAIP_e1_pfp: "亲民党版（架空）：第三势力"
 TAIP_e1_pfp_desc: "架空：2000 年大选后，宋楚瑜领导的亲民党成为国会的关键少数，以「第三势力」组成联合政府，主张在统独之间寻找第三条路。"
 TAIP_e2: "2008 年：再次轮替"
 TAIP_e2_desc: "国民党重返执政。「不统、不独、不武」成为新政府的口号，两岸的官方对话重新开始。"
 TAIP_e2_dpp: "民进党版：在野与街头"
 TAIP_e2_dpp_desc: "在野的民进党反对《服贸协议》的黑箱审议，支持学生占领议场。议场里的抗争，成了台湾政治的另一种样子。"
 TAIP_e2_kmt: "国民党版：大三通与 ECFA"
 TAIP_e2_kmt_desc: "直航、直邮与直接通商全面恢复，陆客自由行带来了每年数百万人次的游客。ECFA 的早收清单让近千项产品降低关税。"
 TAIP_e2_pfp: "亲民党版（架空）：连宋联合"
 TAIP_e2_pfp_desc: "架空：国民党与亲民党组成联合政府，「连宋」从选举联盟变成了执政联盟。党际合作的代价是内阁里的一半席位。"
 TAIP_e3: "2016 年：第三次轮替"
 TAIP_e3_desc: "九合一选举之后，民进党再次执政。新政府宣布：维持现状，不挑衅，也不屈服。"
 TAIP_e3_dpp: "民进党版：新南向与防疫外交"
 TAIP_e3_dpp_desc: "新南向政策把贸易与投资引向东南亚、南亚与澳纽。口罩国家队与「台湾可以帮忙」，成了外交的新名片。"
 TAIP_e3_kmt: "国民党版：九二共识之争"
 TAIP_e3_kmt_desc: "新政府拒绝接受「九二共识」的表述，北京中止了两岸官方沟通。在野的国民党主张恢复对话，不断在立法院表态。"
 TAIP_e3_pfp: "亲民党版（架空）：第三条路"
 TAIP_e3_pfp_desc: "架空：亲民党在第三次轮替后成为国会的仲裁者。「中间路线」让两大党都要向它让步，议程由它来定义。"
 TAIP_e4: "2024 年：新常态"
 TAIP_e4_desc: "三次轮替之后，台湾的政治习惯了「维持现状」的节奏：不是不作为，而是每一次选择都要小心地做。"
 TAIP_e4_dpp: "民进党版：芯片与国防"
 TAIP_e4_dpp_desc: "晶圆代工占全球先进制程的绝大部分。政府出台税收优惠与人才措施，国防预算逐年提高，自制潜艇下水。"
 TAIP_e4_kmt: "国民党版：两岸经贸的恢复"
 TAIP_e4_kmt_desc: "在野的国民党争取恢复两岸经贸谈判，服务业开放与观光的节奏重新打开，但每一步都要经过立法院的审查。"
 TAIP_e4_pfp: "亲民党版（架空）：能源折中"
 TAIP_e4_pfp_desc: "架空：亲民党主导的国会以「非核家园」与供电安全之间的折中为议题，把能源转型的方案写进了预算。"
 TAIP_end: "「新常态」"
 TAIP_end_desc: "二十多年，三次政党轮替：台湾的政治一再证明，「维持现状」不是不作为，而是需要不断地、小心地做出选择。"
 PAKX_p_root: "巴基斯坦的政治前途"
 PAKX_p_root_desc: "独立七十多年，巴基斯坦的政治在文官政府、军方与宗教政党之间摇摆。选举不断，但谁真正做决定，始终是最大的问号。"
 PAKX_p_hyb: "混合政体"
 PAKX_p_hyb_desc: "文官政府在台前，军方在幕后。选举照常举行，但重大的外交与安全决定，总要先问将军们的意见。"
 PAKX_p_pm: "文官政府的执政"
 PAKX_p_pm_desc: "总理是名义上的最高行政长官。议会的席位分布，总是在几个大党之间做交易。"
 PAKX_p_judiciary: "最高法院的裁决"
 PAKX_p_judiciary_desc: "法院与选举委员会的裁决，常常比选票更能决定谁能执政。"
 PAKX_p_sec_council: "国家安全委员会"
 PAKX_p_sec_council_desc: "文官与军方共同设立的协调机构，把安全事务从议会的辩论中拿走。"
 PAKX_p_patronage: "政治恩庇与大家族"
 PAKX_p_patronage_desc: "地方大家族与政党之间的交换：选票、职位与工程合同，构成了政治的日常。"
 PAKX_p_clergy: "宗教政党与选票"
 PAKX_p_clergy_desc: "宗教政党的动员能力在选举中不容小觑，两大党都要为它留出一块地方。"
 PAKX_p_hyb_final: "混合政体的定型"
 PAKX_p_hyb_final_desc: "宪法里没有写的那一半：文官与军方的分工，在每一次危机中都被重新谈判，也逐渐成了惯例。"
 PAKX_p_dem: "选举民主的转型"
 PAKX_p_dem_desc: "政党之间的竞争越来越公开，选举委员会宣布：下一次大选将接受国际观察员的监督。"
 PAKX_p_media: "独立媒体与律师的抗争"
 PAKX_p_media_desc: "独立媒体与律师界的抗争，让「言论」与「司法」成为民主的两道防线。"
 PAKX_p_elections: "选举委员会的改革"
 PAKX_p_elections_desc: "选举委员会独立运作，选票计数全程透明，选民名册定期更新。"
 PAKX_p_18th: "第十八条修正案：省的自治"
 PAKX_p_18th_desc: "地方省份获得更多的财政与教育权力，中央与省的权限第一次写进了宪法的条文。"
 PAKX_p_elections_2: "大选的民调与虚假信息"
 PAKX_p_elections_2_desc: "大选期间，社交媒体上的虚假信息与民调，成了政党之间新的战场。"
 PAKX_p_civil_mil: "文官控制军队"
 PAKX_p_civil_mil_desc: "国防部长由文官担任，军方的人事任命必须经过议会的审议。这是许多人的梦想，也是军方的底线。"
 PAKX_p_provinces: "省级政府与中央的分权"
 PAKX_p_provinces_desc: "省政府的预算与警察权被逐步下放，中央的权力因此变得更依赖于协商。"
 PAKX_p_opposition: "反对派的街头运动"
 PAKX_p_opposition_desc: "在野党与律师界组织的街头集会，让政府不得不在选举前作出让步。"
 PAKX_p_dem_final: "首次完整的政党轮替"
 PAKX_p_dem_final_desc: "选举结束，在野党赢得了多数席位。首都街头的人群在欢呼，军营里一片沉默。"
 PAKX_p_army: "军方的回归"
 PAKX_p_army_desc: "将军们以「维持秩序」的名义接管了国家。议会暂停，宪法条文被搁置，军方成了国家的最终裁判。"
 PAKX_p_corps: "军团指挥部"
 PAKX_p_corps_desc: "各军团的指挥部统一调度，宪法的守护者成了军队的指挥官。"
 PAKX_p_ordinance: "宪法条款的临时搁置"
 PAKX_p_ordinance_desc: "「紧急状态」之下，宪法中的部分条款被暂停执行。这一次，人们说，只是暂时的。"
 PAKX_p_intel: "情报机构的主导"
 PAKX_p_intel_desc: "情报机构掌握了国内的监控与政治人物的档案，它的每一份报告都能左右内阁的命运。"
 PAKX_p_judge_sub: "法官的重新任命"
 PAKX_p_judge_sub_desc: "高等法院的法官被重新任命，忠于军方的人选取代了一批独立的法官。"
 PAKX_p_army_final: "军方与国家融为一体"
 PAKX_p_army_final_desc: "国家与军队融为一体。有人称之为稳定，也有人称之为军管。历史会给出自己的答案。"
 PAKX_m_root: "国防的根本"
 PAKX_m_root_desc: "印度的威胁、阿富汗的边境与国内的反恐，让军队永远是国家的第一要务。"
 PAKX_m_army: "陆军的装甲化"
 PAKX_m_army_desc: "装甲师与机械化步兵的现代化，让陆军在边境与平原上都有了机动的能力。"
 PAKX_m_nuke: "最低限度可信威慑"
 PAKX_m_nuke_desc: "核武器是国家最后的保障。「最低限度可信威慑」的原则，决定了每一枚导弹的数量。"
 PAKX_m_navy: "海军的潜艇计划"
 PAKX_m_navy_desc: "海军向中国采购新的潜艇与护卫舰，印度洋上的存在感因此大增。"
 PAKX_m_air: "JF-17 雷电机群"
 PAKX_m_air_desc: "与中国合作研制的 JF-17 战机进入了空军的主力序列，成本低、可靠性高，是出口的明星。"
 PAKX_m_isi: "情报机构 ISI"
 PAKX_m_isi_desc: "巴基斯坦的情报机构在阿富汗与克什米尔的问题上，有着远超其他机构的影响力。"
 PAKX_m_border: "阿富汗边境与反恐"
 PAKX_m_border_desc: "杜兰线两侧的部落地带，是武装分子的庇护所。边境的每一次交火，都要求军队重新部署。"
 PAKX_m_missile: "短程导弹"
 PAKX_m_missile_desc: "「阿卜杜勒」系列的短程导弹让印度的前线部队始终处于威胁之下。"
 PAKX_m_sub: "中国造的潜艇"
 PAKX_m_sub_desc: "「海龙」级潜艇下水，巴基斯坦海军第一次拥有了远海作战的能力。"
 PAKX_m_jf17: "雷电机群的部署"
 PAKX_m_jf17_desc: "雷电机群在卡拉奇与拉合尔之间的空军基地轮流驻防，形成了一张完整的防空网。"
 PAKX_m_ct: "反恐作战"
 PAKX_m_ct_desc: "在西北部的山区，一场又一场的清剿行动让军队付出了沉重的代价，也收获了一些安全。"
 PAKX_m_industry: "国防工业：巴基斯坦重工"
 PAKX_m_industry_desc: "军工企业在塔克西拉与卡姆拉的工厂，生产弹药、装甲车辆与导弹的部件。"
 PAKX_m_coast: "海岸防务与瓜达尔"
 PAKX_m_coast_desc: "瓜达尔港的海岸防务由海军接手，保护着中国的投资与进出口航线。"
 PAKX_m_airdef: "防空与预警网络"
 PAKX_m_airdef_desc: "雷达与防空导弹组成的预警网络，覆盖了全国的重要城市与核设施。"
 PAKX_m_drone: "无人机与电子战"
 PAKX_m_drone_desc: "无人机与电子战装备进入了边境部队，行动的成本低、风险小，争议也随之而来。"
 PAKX_m_drill: "全国防御演习"
 PAKX_m_drill_desc: "「全民防御」的演习在全国各地举行，预备役与民兵第一次与正规军在同一张作战图上训练。"
 PAKX_m_alliance: "与中国的联合训练"
 PAKX_m_alliance_desc: "「雄鹰」联合演习让两国军队在战术与后勤上有了实际的磨合。"
 PAKX_m_naval_base: "卡拉奇的海军基地"
 PAKX_m_naval_base_desc: "卡拉奇港的海军基地扩建，新的船坞可以维修大型的护卫舰与潜艇。"
 PAKX_m_cyber: "网络战与电子情报"
 PAKX_m_cyber_desc: "军方的网络战部门负责监控边境与国内的通信，也负责对抗印度的网络攻击。"
 PAKX_m_reserve: "预备役与征兵制度"
 PAKX_m_reserve_desc: "预备役的训练周期延长，征兵的覆盖范围扩大到了更多的省份。"
 PAKX_m_final: "核威慑的完成"
 PAKX_m_final_desc: "在一次成功的导弹试射之后，国防部宣布「最低限度可信威慑」已经建立。印度的回应很快传来。"
 PAKX_m_sat: "卫星与太空计划"
 PAKX_m_sat_desc: "军方的遥感卫星与导弹预警计划启动，边境的侦察与监视能力第一次不再完全依赖外国的情报。"
 PAKX_m_coastguard: "海岸警卫队的扩充"
 PAKX_m_coastguard_desc: "海岸警卫队的巡逻船与直升机增加，走私与非法捕鱼的案件逐年减少。"
 PAKX_e_root: "经济：债务、出口与走廊"
 PAKX_e_root_desc: "巴基斯坦的经济靠棉纺、侨汇与外援撑着。一场债务危机，就足以让整个国家的选择变得狭窄。"
 PAKX_e_imf: "与 IMF 签订救助协议"
 PAKX_e_imf_desc: "国际货币基金组织的救助贷款到账，但每一笔款项都附带着税收与补贴的改革条件。"
 PAKX_e_self: "自主改革与国企整合"
 PAKX_e_self_desc: "拒绝接受国际援助条件，政府自行推动国企整合与税收改革，但付出的代价是更高的利率。"
 PAKX_e_tax: "税收改革"
 PAKX_e_tax_desc: "把增值税与所得税的覆盖面扩大到更多的行业，收不上来的税款仍是最大的问题。"
 PAKX_e_debt: "债务重组谈判"
 PAKX_e_debt_desc: "与中国、海湾与西方的债权人谈判，把部分债务延长到了更远的期限。"
 PAKX_e_power: "能源补贴与进口天然气"
 PAKX_e_power_desc: "电力公司长年亏损，政府靠补贴与进口液化天然气维持供电。每一次停电都是政治的新闻。"
 PAKX_e_textile: "纺织与服装出口"
 PAKX_e_textile_desc: "棉纺与服装是巴基斯坦最重要的出口产业，几百万工人的生计系于一台台织机。"
 PAKX_e_telecom: "电信与移动网络"
 PAKX_e_telecom_desc: "私营电信公司的竞争让手机的费用大幅降低，移动网络覆盖了大部分的农村。"
 PAKX_e_remit: "海外劳工汇款"
 PAKX_e_remit_desc: "数百万在海湾与西方工作的巴基斯坦人，每年寄回的侨汇占了外汇收入的很大一部分。"
 PAKX_e_cpec: "中巴经济走廊的启动"
 PAKX_e_cpec_desc: "从喀什到瓜达尔的经济走廊正式启动。道路、电力与港口项目纷纷开工，债务与机遇，在同一张图纸上。"
 PAKX_e_agri: "棉花与灌溉"
 PAKX_e_agri_desc: "棉花产量受到水资源与病虫害的制约，灌溉渠道的修缮成了农业改革的第一步。"
 PAKX_e_mining: "矿产与钢铁"
 PAKX_e_mining_desc: "俾路支与旁遮普的矿产资源需要更多的投资，钢铁厂的产能却常年不足。"
 PAKX_e_gwadar: "瓜达尔港的扩建"
 PAKX_e_gwadar_desc: "中国援建的瓜达尔深水港扩建完成，第一批货轮靠泊，港口与经济特区的规划开始落地。"
 PAKX_e_motorway: "高速公路与铁路"
 PAKX_e_motorway_desc: "白沙瓦到卡拉奇的高速公路与铁路网逐步连通，货运的时间缩短了一半。"
 PAKX_e_it: "IT 外包与年轻人才"
 PAKX_e_it_desc: "自由职业者与 IT 外包公司在卡拉奇与拉合尔快速增长，数字经济成为年轻人的新选择。"
 PAKX_e_tourism: "北部旅游与观光"
 PAKX_e_tourism_desc: "在吉尔吉特与斯瓦特山谷，旅游业带来了新的收入，但基础设施的建设仍然滞后。"
 PAKX_e_airport: "机场与物流枢纽"
 PAKX_e_airport_desc: "伊斯兰堡与卡拉奇的国际机场扩建，货运枢纽与自由贸易区的规划同时推进。"
 PAKX_e_banking: "国有银行的改革"
 PAKX_e_banking_desc: "国有银行的不良贷款被逐步剥离，新的监管机构开始检查银行的资本充足率。"
 PAKX_e_stock: "证券市场的开放"
 PAKX_e_stock_desc: "卡拉奇证券交易所向外国投资者开放，资本市场的规则第一次接近国际标准。"
 PAKX_e_final: "走廊经济的成型"
 PAKX_e_final_desc: "瓜达尔港的第一艘大型货轮靠泊，中巴经济走廊的高速公路通车。巴基斯坦的经济，第一次有了一条清楚的主轴。"
 PAKX_f_root: "南亚的大国博弈"
 PAKX_f_root_desc: "夹在印度与阿富汗之间，巴基斯坦的外交靠的是「与所有大国都保持一定距离」的平衡术。"
 PAKX_f_china: "对华全天候战略伙伴"
 PAKX_f_china_desc: "中巴的友谊被写进了「全天候战略合作伙伴」的表述。在外交上，中国是最可靠的朋友。"
 PAKX_f_india: "对印关系与克什米尔"
 PAKX_f_india_desc: "克什米尔的主权争端从未解决。每一次边境的交火，都让两国的外交陷入僵局。"
 PAKX_f_us: "对美关系的修复"
 PAKX_f_us_desc: "阿富汗撤军之后，美巴关系经历了一段冷淡期。新的合作从反恐与经贸开始。"
 PAKX_f_gulf: "海湾的资金与朝觐之路"
 PAKX_f_gulf_desc: "海湾国家的投资与援助，是巴基斯坦外汇的重要来源。数百万的朝觐者，也是两地的纽带。"
 PAKX_f_cpec: "中巴经济走廊的外交保障"
 PAKX_f_cpec_desc: "外交部门负责为走廊的项目争取国际支持，并处理沿线地区的安全与舆论问题。"
 PAKX_f_weapons: "中国武器装备的采购"
 PAKX_f_weapons_desc: "从中国购买的战机、潜艇与导弹，是巴基斯坦军队最重要的装备来源。"
 PAKX_f_sco: "上海合作组织"
 PAKX_f_sco_desc: "上合组织的成员国会议为巴基斯坦提供了与中亚、俄罗斯和伊朗对话的平台。"
 PAKX_f_china_final: "全天候伙伴的成型"
 PAKX_f_china_final_desc: "巴中两国领导人发表联合声明，宣布「全天候战略合作伙伴关系」进入新阶段。"
 PAKX_f_aid: "美国援助与反恐合作"
 PAKX_f_aid_desc: "美国的援助与情报分享，让反恐行动得以延续，但每一笔援助都附带着人权的条件。"
 PAKX_f_drone: "无人机打击与主权"
 PAKX_f_drone_desc: "美国的无人机打击行动在部落地区引发了强烈的抗议。主权与安全的争论，从未停止。"
 PAKX_f_afghan: "阿富汗撤军之后"
 PAKX_f_afghan_desc: "北约撤军之后，阿富汗的局势再度紧张。巴基斯坦的边境既是难民的出口，也是安全的前线。"
 PAKX_f_us_final: "美巴关系的重新定位"
 PAKX_f_us_final_desc: "两国在反恐、经贸与教育方面达成了新的协议。华盛顿与伊斯兰堡，又找到了一条共同的路。"
 PAKX_f_kashmir: "克什米尔的对峙"
 PAKX_f_kashmir_desc: "实际控制线两侧的炮击与巡逻，让每一次谈判都在火药味中开始。"
 PAKX_f_indus: "印度河水条约"
 PAKX_f_indus_desc: "印度河水条约的执行是两国之间少数的合作之一，但上游的大坝工程让下游的农民忧心忡忡。"
 PAKX_f_peace: "对印和谈的尝试"
 PAKX_f_peace_desc: "两国的外交官在第三国秘密会面。谈判的桌子摆好了，但椅子还没有坐满。"
 PAKX_f_gulf_money: "海湾的资金与援助"
 PAKX_f_gulf_money_desc: "沙特与阿联酋的投资与贷款，为能源与基础设施项目提供了关键的资金。"
 PAKX_f_turkey_iran: "土耳其与伊朗：伊斯兰世界的第三条路"
 PAKX_f_turkey_iran_desc: "与土耳其、伊朗的三边合作，让巴基斯坦在伊斯兰世界里找到了一个不依附任何一方的位置。"
 PAKX_f_saudi: "沙特的能源合作"
 PAKX_f_saudi_desc: "沙特的原油供应与朝觐安排，是两国之间最实际的合作。能源价格的每一次波动，都会传到巴基斯坦的电费账单上。"
 PAKX_f_roc: "与中华民国的务实关系"
 PAKX_f_roc_desc: "没有正式邦交的台北与伊斯兰堡，在贸易、教育与民间往来上找到了务实的空间。"
 PAKX_f_roc_trade: "台巴的贸易与投资"
 PAKX_f_roc_trade_desc: "纺织、医药与农产品的贸易，让台北与伊斯兰堡之间的商会与学术交流逐年增加。"
 PAKX_f_mediation: "大国之间的平衡"
 PAKX_f_mediation_desc: "中美之间的竞争，印度与中国之间的对峙：巴基斯坦找到了一个可以居中的位置，并靠它换取了更多的回旋余地。"
 PAKX_f_final: "全方位的外交"
 PAKX_f_final_desc: "与大国友好、与邻国相处、在区域机构中发声：巴基斯坦的外交，终于不必在一个答案之间做选择。"
 PAKX_i_root: "民生与安全：国家的第二战场"
 PAKX_i_root_desc: "边境的武装、城市的犯罪与农村的贫困，决定着巴基斯坦能不能真正地稳定下来。"
 PAKX_i_baloch: "俾路支的分离运动"
 PAKX_i_baloch_desc: "俾路支省的分离运动长年不断，天然气田与港口的安全，是政府最担心的问题。"
 PAKX_i_ttp: "巴基斯坦塔利班与开伯尔-普什图"
 PAKX_i_ttp_desc: "西北部的武装组织不断发动袭击，学校、市场与清真寺都成了目标。政府的回应既是军事的，也是政治的。"
 PAKX_i_madrasa: "宗教学校与极端主义"
 PAKX_i_madrasa_desc: "数以千计的宗教学校为贫困家庭的孩子提供食宿，也成了极端思想的温床。改革的呼声越来越高。"
 PAKX_i_counter: "反恐与情报合作"
 PAKX_i_counter_desc: "情报机构与警察之间的合作逐步改善，跨省的追踪与信息共享开始运作。"
 PAKX_i_nap: "国家行动计划"
 PAKX_i_nap_desc: "一份涵盖反恐、宗教改革与难民安置的国家行动计划，被写进了政府的年度预算。"
 PAKX_i_police: "警察改革"
 PAKX_i_police_desc: "地方警察的培训与薪资改革，让普通人第一次愿意在街头向警察求助。"
 PAKX_i_security_final: "城市与边境的安全"
 PAKX_i_security_final_desc: "城市的监控与边境的围栏让安全感有所回升，但人权团体提出了尖锐的批评。"
 PAKX_i_refugees: "阿富汗难民的安置"
 PAKX_i_refugees_desc: "数百万阿富汗难民在巴基斯坦生活了几十年。安置与遣返之间，政府一直在摇摆。"
 PAKX_i_edu: "教育与女童入学"
 PAKX_i_edu_desc: "「每一个孩子都要上学」：女童的入学率成了衡量国家进步的一把尺子。"
 PAKX_i_health: "全民医保"
 PAKX_i_health_desc: "公立医院的覆盖率与医保的报销比例逐年提高，但药品短缺与医护人员的流失依旧严重。"
 PAKX_i_flood: "2022 年的洪灾与重建"
 PAKX_i_flood_desc: "季风洪水淹没了全国三分之一的土地。国际援助的规模前所未有，重建的第一步是把河堤重新修好。"
 PAKX_i_urban: "城市化与卡拉奇"
 PAKX_i_urban_desc: "每年数十万人口从农村涌入卡拉奇。住房与供水的压力，让城市的边缘区不断扩张。"
 PAKX_i_media: "媒体与言论自由"
 PAKX_i_media_desc: "新闻媒体在政治与安全议题上的自我审查，让许多真相只能在社交媒体上流传。"
 PAKX_i_climate: "气候适应与冰川融化"
 PAKX_i_climate_desc: "北部冰川的融化与季风的不稳定，让水资源的规划成了一道难题。"
 PAKX_i_youth: "青年与就业"
 PAKX_i_youth_desc: "数以百万计的年轻人进入劳动力市场，就业机会却赶不上人口增长的速度。"
 PAKX_i_census: "人口普查与生育率"
 PAKX_i_census_desc: "新一轮人口普查显示，生育率正在下降。政府开始讨论家庭政策与养老金的长期安排。"
 PAKX_i_water2: "卡拉奇的供水"
 PAKX_i_water2_desc: "卡拉奇的供水长期依赖地下水与远程输水管道。新的水厂项目让供水的时间第一次超过了每天十二小时。"
 PAKX_i_ngo: "慈善与非政府组织"
 PAKX_i_ngo_desc: "慈善团体与非政府组织在灾区与贫困社区开展服务，政府开始让它们在法律框架内运作。"
 PAKX_i_social_final: "共同发展的巴基斯坦"
 PAKX_i_social_final_desc: "国家的新规划把教育、医疗与就业放在了首位。政府承诺：每一个孩子都能上学，每一个家庭都能看病。"
 PAKX_i_final: "国家的内部和解"
 PAKX_i_final_desc: "安全与民生，不再是两件分开的事。巴基斯坦的内政，第一次有了一条看得见的主线。"
