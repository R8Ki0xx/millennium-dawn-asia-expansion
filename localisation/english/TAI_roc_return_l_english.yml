 ### v3.11 光复后的政党与候选人
 ROC.Western_Autocracy: "£TAI_conservatism (HFH) 中国国民党黄复兴党部"
 ROC.Western_Autocracy_desc: "亲西方威权 - 中国国民党黄复兴党部\n\n国民党内由退伍军人与眷村子弟组成的特种党部，纪律严明、立场强硬，主张以强有力的政府巩固光复成果，并坚定站在美国一边。"
 ROC.Western_Autocracy_icon: "£TAI_conservatism"
 ROC.conservatism: "£TAI_conservatism (KMT) 中国国民党"
 ROC.conservatism_desc: "保守主义 - 中国国民党\n\n孙中山创立的百年老党。带领政府光复大陆后，国民党是全国第一大党，主张三民主义、五权宪法与稳健的市场经济。"
 ROC.conservatism_icon: "£TAI_conservatism"
 ROC.liberalism: "£CHI_liberal (CDP) 中国民主党"
 ROC.liberalism_desc: "自由民主主义 - 中国民主党\n\n1998年由王有才、秦永敏、徐文立等大陆民运人士创立，旋即遭中共取缔，骨干或入狱、或流亡海外。光复之后，中国民主党终于在大陆公开活动，以多党竞争的宪政民主、自由选举与人权保障为号召，成为大陆选民中最大的自由派政党。"
 ROC.liberalism_icon: "£CHI_liberal"
 ROC.socialism: "£CHI_left_wing_radical (RCCK) 中国国民党革命委员会（国民党左派）"
 ROC.socialism_desc: "社会民主主义 - 中国国民党革命委员会（国民党左派）\n\n源自国民党内的左翼——廖仲恺、宋庆龄与「三大政策」的传统。光复后，民革摆脱了过去依附中共的历史，以「国民党左派」自居：坚持三民主义中的民生主义，主张土地改革、劳工保障与扶助农工，在大陆的工人与农民中拥有深厚基础。"
 ROC.socialism_icon: "£CHI_left_wing_radical"
 ROC.communist_state: "£CHI_communism (CPC) 中国共产党"
 ROC.communist_state_desc: "共产主义 - 中国共产党\n\n失去政权的中国共产党。在宪政体制下，它以合法在野党的身份存在，但始终被怀疑与北方的残余势力藕断丝连。"
 ROC.communist_state_icon: "£CHI_communism"
 ROC.anarchist_communism: "£TAI_anarchist_communism (CPWDP) 中国农工民主党"
 ROC.anarchist_communism_desc: "左翼社会主义 - 中国农工民主党\n\n前身是邓演达1930年创立的「中华革命党」（第三党），以农民与工人的利益为号召，主张「平民革命」与土地改革。光复后，农工党摆脱了统战附庸的身份，在大陆的医卫界与国企工人中重新发展，是国会里最左翼的合法政党。"
 ROC.anarchist_communism_icon: "£TAI_anarchist_communism"
 ROC.Conservative: "£TAI_Conservative (NP) 新党"
 ROC.Conservative_desc: "新兴保守主义 - 新党\n\n从国民党分裂出来的统派政党，以反贪腐与中华民族主义为号召，在都市知识分子中颇有影响。"
 ROC.Conservative_icon: "£TAI_Conservative"
 ROC.Autocracy: "£CHI_pro_emerging_autocrat (CDL) 中国民主同盟"
 ROC.Autocracy_desc: "新兴威权 - 中国民主同盟\n\n抗战时期成立的知识分子政党，光复后重新独立运作，主张由精英与专家主导的「贤能政治」。"
 ROC.Autocracy_icon: "£CHI_pro_emerging_autocrat"
 ROC.Neutral_Autocracy: "£TAI_conservatism (SPA) 三民主义大同盟"
 ROC.Neutral_Autocracy_desc: "不结盟威权 - 三民主义大同盟\n\n党国体制的怀旧者组成的团体，主张恢复训政时期的「以党治国」。"
 ROC.Neutral_Autocracy_icon: "£TAI_conservatism"
 ROC.Neutral_conservatism: "£TAI_Neutral_conservatism (PFP) 亲民党"
 ROC.Neutral_conservatism_desc: "不结盟保守主义 - 亲民党\n\n宋楚瑜创立的政党，以「亲民」与地方建设为号召，在基层与外省族群中拥有稳固支持。"
 ROC.Neutral_conservatism_icon: "£TAI_Neutral_conservatism"
 ROC.oligarchism: "£generic_oligarchism_small (CNDCA) 中华民国工商建国会"
 ROC.oligarchism_desc: "寡头主义 - 中华民国工商建国会\n\n由沿海资本家与台商组成的政治团体，主张开放市场、减税与有利于大企业的产业政策。"
 ROC.oligarchism_icon: "£generic_oligarchism_small"
 ROC.Neutral_Libertarian: "£CHI_neutral_social_democrat (CAPD) 中国民主促进会"
 ROC.Neutral_Libertarian_desc: "知识分子自由派 - 中国民主促进会\n\n1945年由马叙伦、周建人等文教界人士在上海创立，成员多为教师、学者与出版人。光复后，民进不再是「花瓶党」，以教育自由、学术独立与文化开放为号召，在大陆的知识分子中拥有广泛支持。"
 ROC.Neutral_Libertarian_icon: "£CHI_neutral_social_democrat"
 ROC.Neutral_green: "£TAI_Neutral_green (CGP) 中国绿党"
 ROC.Neutral_green_desc: "绿色政治 - 中国绿党\n\n由大陆的环保组织与「自然之友」等民间团体发展而来的政党，关注水源、空气污染与三峡等大型工程的生态代价。光复后快速工业化带来的污染，让中国绿党迅速壮大。"
 ROC.Neutral_green_icon: "£TAI_Neutral_green"
 ROC.neutral_Social: "£CHI_social_democrat (CSDP) 中国社会民主党"
 ROC.neutral_Social_desc: "不结盟社会民主主义 - 中国社会民主党\n\n由海外民运人士与大陆知识分子组成的社会民主党，主张北欧式的福利国家。"
 ROC.neutral_Social_icon: "£CHI_social_democrat"
 ROC.Neutral_Communism: "£CHI_neutral_communism (MCPC) 中国毛泽东主义共产党"
 ROC.Neutral_Communism_desc: "毛主义 - 中国毛泽东主义共产党\n\n不承认宪政体制的毛派地下组织，与北方的武装残余势力关系密切。"
 ROC.Neutral_Communism_icon: "£CHI_neutral_communism"
 ROC.Nat_Populism: "£TAI_Nat_Populism (YCP) 中国青年党"
 ROC.Nat_Populism_desc: "民族民粹主义 - 中国青年党\n\n创立于1923年的「国家主义派」老党。光复后，青年党以「国家至上、民族至上」与反建制的民粹口号东山再起，吸引了大批对既有政党失望的选民。"
