l_english:
 roc_v335.1.t:0 "The Hsinchu Water Dispute"
 roc_v335.1.d:0 "One fab after another opens in the Hsinchu Science Park, and its demand for water and power doubles. In last year’s dry season farmers were forced to leave paddies fallow while the park’s water trucks kept rolling in and out. Farm association delegates and manufacturers face off outside the Ministry of Economic Affairs, legislators demand that livelihoods come before industry, and the park association warns that a single day of lost production would send orders overseas. The government must draw a line between farming and technology."
 roc_v335.1.a:0 "Guarantee the park’s water supply and compensate farmers for fallowing."
 roc_v335.1.b:0 "Protect farm irrigation first and require the park to build its own water-recycling plants."
 roc_v335.2.t:0 "The Cross-Strait Economic Framework"
 roc_v335.2.d:0 "Across the table, delegates from both sides of the Strait haggle over the tariff-reduction list. Export-oriented electronics and machinery makers want the deal signed as fast as possible, while traditional farming, fishing and small businesses fear being swamped by cheap goods. The opposition stages a filibuster in the Legislative Yuan, and marchers against the services pact appear in the streets. The government can sign on schedule, or split the agreement into items for line-by-line review in exchange for broader public consensus."
 roc_v335.2.a:0 "Sign on schedule and let the exporters benefit first."
 roc_v335.2.b:0 "Split it into line-by-line review and postpone signing."
 roc_v335.3.t:0 "The Last Gate for Unit Four"
 roc_v335.3.d:0 "The Longmen nuclear plant has been under construction for more than two decades, with the budget raised again and again and several engineering teams replaced. Anti-nuclear groups hold a sit-in outside the site, while Taipower says that halting now would turn hundreds of billions already spent into sunk costs and bring summer power cuts. The President wavers between public opinion and energy security: finish the safety checks and start commercial operation, or mothball the plant and turn to gas and renewables?"
 roc_v335.3.a:0 "Pass the safety inspections and go commercial to secure the power supply."
 roc_v335.3.b:0 "Mothball Unit Four and accelerate gas and renewables."
 roc_v335.4.t:0 "The Petrochemical Smokestacks"
 roc_v335.4.d:0 "Smokestacks at the petrochemical complex run day and night, and fishermen nearby say the oysters from the coastal waters can no longer be sold. Producers stress that petrochemical feedstocks are the upstream of electronics, textiles and plastics, and any cut in output would hit the whole downstream supply chain. Environmental groups demand immediate emission caps and public monitoring data, while the county government fears that if the plants move away, tax revenue and jobs will go with them."
 roc_v335.4.a:0 "Impose emission caps and require desulfurization equipment."
 roc_v335.4.b:0 "Keep output up and placate the locals with compensation payments."
 roc_v335.5.t:0 "The Second Wave of Financial Reform"
 roc_v335.5.d:0 "The bad loans of the state-owned banks have not yet been cleared, while private financial holding companies are eager to expand through mergers. The financial supervisory authority tables a new consolidation plan: weak small banks will be folded into large holding companies, and a ceiling will be set on deposit insurance. The big holding companies welcome the policy, but local credit cooperatives warn that being absorbed means grassroots financial services will vanish and farming and fishing villages will find loans harder to get."
 roc_v335.5.a:0 "Push the mergers and build a large, stable financial system."
 roc_v335.5.b:0 "Keep the credit cooperatives and set up a transition support fund."
 roc_v335.6.t:0 "The High-Speed Rail Funding Gap"
 roc_v335.6.d:0 "The high-speed railway is open, but ridership falls short of forecasts, the privately financed consortium loses tens of billions a year, and the bank syndicate begins demanding repayment. The consortium asks the government to extend its concession and inject funds, while the opposition denounces it as yet another case of collusion between officials and business. Letting the company collapse would throw transport and development along the whole western corridor into chaos."
 roc_v335.6.a:0 "Buy a majority stake and have the government take over operations."
 roc_v335.6.b:0 "Extend the concession and require fares to stay unchanged."
 roc_v335.7.t:0 "Conscription Versus Volunteers"
 roc_v335.7.d:0 "The Ministry of National Defense proposes shortening the conscription term and shifting to a mostly volunteer system. Young people welcome the shorter term, but the General Staff worries that recruit quality will become uneven and wartime reserve mobilization weaker. Veteran officers argue for longer training and stronger reserve forces, while scholars warn that if volunteer pay and housing are not generous enough, even fewer will sign up."
 roc_v335.7.a:0 "Raise volunteer pay and shift gradually toward an all-volunteer force."
 roc_v335.7.b:0 "Keep conscription and strengthen reserve mobilization training."
 roc_v335.8.t:0 "Flaws Exposed at Han Kuang"
 roc_v335.8.d:0 "At the annual Han Kuang exercise debrief, observers list a string of problems: the reserves assemble slowly, civilian vehicles cannot be requisitioned in time, and communications fail completely under simulated electromagnetic jamming. The ministry wants to handle it quietly, but an opposition legislator releases one of the reports in the Legislative Yuan and the media put it on the front page. The military must decide between a public review and an internal one."
 roc_v335.8.a:0 "Review it publicly and set up a task force to investigate."
 roc_v335.8.b:0 "Handle it internally to avoid shaking morale."
 roc_v335.9.t:0 "The Submarine Budget"
 roc_v335.9.d:0 "The indigenous submarine program enters its second phase, and the shipbuilder’s budget request comes in nearly thirty percent above the original estimate. In the Legislative Yuan one camp wants to pass it in full as a symbol of rebuilding naval deterrence, while the other demands sea trials first and funding afterward. Navy engineers privately say that if the delay continues, key technicians will be poached by foreign firms."
 roc_v335.9.a:0 "Pass the full budget and keep the work from stalling."
 roc_v335.9.b:0 "Release funds in stages and finish sea trials first."
 roc_v335.10.t:0 "The Special Arms Procurement Budget"
 roc_v335.10.d:0 "Washington agrees to sell upgrade parts but demands payment within a set period. The executive submits a special budget bill, yet the opposition keeps shelving it in the Legislative Yuan, questioning whether the price is fair. The American Institute in Taiwan hints privately that further delay may push back the next arms sale, while the air force warns that the readiness rate of the aging fighters has fallen to a dangerous level."
 roc_v335.10.a:0 "Pay first from the reserve fund and submit for review afterward."
 roc_v335.10.b:0 "Negotiate with the opposition and pass it with oversight clauses."
 roc_v335.11.t:0 "The Civilian Drone Makers"
 roc_v335.11.d:0 "A group of engineers from the Hsinchu park has assembled hundreds of small drones on their own and demonstrates a surveillance performance that startles the military during a drill. Should the defense ministry bring private makers into the supply chain? Supporters see a cheap shortcut to asymmetric advantage, while procurement officers worry about inconsistent standards and weak cybersecurity, with disastrous consequences if the system is infiltrated."
 roc_v335.11.a:0 "Open the door to private makers and set common standards and vetting."
 roc_v335.11.b:0 "Keep state institutes in charge, with private firms supplying components only."
 roc_v335.12.t:0 "The Marine Training Accident"
 roc_v335.12.d:0 "A serious accident occurs during intense amphibious training and several marines are injured. Families stand outside the defense ministry holding photographs and demanding an explanation, and the press asks whether training intensity has gone beyond safe limits. The Marine commander insists that high standards are what keeps soldiers alive, while legislators call for independent oversight."
 roc_v335.12.a:0 "Bring in independent oversight and revise training rules."
 roc_v335.12.b:0 "Keep training intensity and improve medical care and insurance."
 roc_v335.13.t:0 "A New Demand from an Ally"
 roc_v335.13.d:0 "The new president of a Central American ally visits Taipei and asks Taiwan to increase its aid: build a port, provide agricultural loans and fund the social housing promised during the campaign. Some at home call it a necessary cost of diplomacy, others call it throwing money away, since the ally could turn to the mainland at any moment."
 roc_v335.13.a:0 "Agree to more aid in exchange for clear diplomatic commitments."
 roc_v335.13.b:0 "Keep existing aid and offer technical cooperation only."
 roc_v335.14.t:0 "At the Doors of the World Health Assembly"
 roc_v335.14.d:0 "This year the World Health Assembly again does not invite a Taiwanese delegation inside. The foreign ministry’s medical team holds a press conference outside the venue with its epidemic-prevention data and receives private replies from health officials of several countries. The advisers suggest two paths: continue pressing for observer status in the name of health cooperation, or build ties through private medical aid and avoid a head-on clash."
 roc_v335.14.a:0 "Keep pressing for observer status and rally friendly states to speak."
 roc_v335.14.b:0 "Build ties through medical aid and avoid a confrontation."
 roc_v335.15.t:0 "Washington’s Bill"
 roc_v335.15.d:0 "A representative of the US Department of Defense tells our side privately that if Taiwan wants to keep buying advanced equipment, it must raise the share of its budget for defense and disclose its procurement plans earlier. Senior officers see this as the key to long-term cooperation, while the finance ministry warns that rising defense spending year after year will squeeze welfare and education."
 roc_v335.15.a:0 "Raise the defense share of the budget in exchange for priority supply."
 roc_v335.15.b:0 "Hold the budget and fill the gap with indigenous development."
 roc_v335.16.t:0 "The Fisheries Talks"
 roc_v335.16.d:0 "Taiwan and Japan open a new round of talks on operating rules in the surrounding waters. Fishermen want a wider area, the foreign ministry fears that a hard line would affect cooperation on security issues, and the Japanese negotiators face pressure of their own from local fishing groups. The result will become an important template for future Taiwan–Japan relations."
 roc_v335.16.a:0 "Concede some fishing grounds in exchange for security cooperation commitments."
 roc_v335.16.b:0 "Stand up for the fishermen’s interests and postpone signing."
 roc_v335.17.t:0 "The Quarrel over State Enterprise Reform"
 roc_v335.17.d:0 "The large state enterprises taken over are overstaffed and equipped with aging machinery, yet they support millions of workers. As soon as the reform plan appears, worker delegates gather at factory gates fearing that reform means layoffs, while financial officials argue that only private capital and modern management can keep the firms alive. The ministries each say their own piece, and the Presidential Office must set the pace of reform."
 roc_v335.17.a:0 "Reform quickly, bringing in private capital and professional managers."
 roc_v335.17.b:0 "Reform in stages with unemployment relief and retraining alongside."
 roc_v335.18.t:0 "The Conversion Rate of the New Currency"
 roc_v335.18.d:0 "The new currency is about to be issued, but the conversion rate between old and new notes has become the biggest controversy. A generous rate would make cash holders feel better off but could push prices up, while a harsh rate would restrain inflation but leave savers feeling robbed of their assets. Economists at the central bank and the heads of local banks argue late into the night."
 roc_v335.18.a:0 "Convert at a generous rate to win public goodwill."
 roc_v335.18.b:0 "Convert at a tighter rate to put price stability first."
 roc_v335.19.t:0 "The Old Industrial Northeast"
 roc_v335.19.d:0 "Shenyang’s heavy machinery plants, Anshan’s steel base and Daqing’s oilfields were once the pride of the nation, but now their equipment is aging and young people keep heading south. The provincial government tables a revival plan: either carry out large-scale technical renovation of the old enterprises, or bring in foreign capital and new industries and convert the old plants into industrial parks. The workers are just as divided."
 roc_v335.19.a:0 "Modernize the old enterprises on a large scale and keep the heavy industry."
 roc_v335.19.b:0 "Bring in foreign capital and convert the sites into new industrial parks."
 roc_v335.20.t:0 "Water and Roads in the West"
 roc_v335.20.d:0 "The northwest development plan runs into reality: to build a railway the water supply in the desert must be solved first, and to lay a water pipeline there must already be roads to carry the materials. The engineers on the planning team suggest building roads and small reservoirs first to give the region a foundation before investing in a major railway, but local officials are eager to see a showpiece project as soon as possible."
 roc_v335.20.a:0 "Build roads and reservoirs first to lay a foundation."
 roc_v335.20.b:0 "Launch the trunk railway directly and push development along it."
 roc_v335.21.t:0 "The Last Plot of Land Reform"
 roc_v335.21.d:0 "The land-to-the-tiller policy proceeds smoothly in most provinces, but in several densely populated ones there are still many disputes between landlords and tenants. Local officials find that unclear land registration and undefined ownership of irrigation works have made the plots some farmers received into a burden. Old people in the villages say the direction of the reform is right, but someone has to finish the details."
 roc_v335.21.a:0 "Send land survey teams to confirm the cadastre village by village."
 roc_v335.21.b:0 "Set up arbitration committees with local gentry helping to mediate."
 roc_v335.22.t:0 "Taiwanese Businessmen Return"
 roc_v335.22.d:0 "The Taiwanese businessmen who once built factories on the mainland return in large numbers, bringing capital and technology and also grievances against the old system. A group of Dongguan electronics factory owners say that if the government guarantees property rights and tax treatment they are willing to move their whole supply chain deeper inland, though local firms fear losing orders."
 roc_v335.22.a:0 "Grant tax incentives and welcome Taiwanese firms to lead inland industry."
 roc_v335.22.b:0 "Treat all firms alike and grant no special treatment."
 roc_v335.23.t:0 "The Independence of the Central Bank"
 roc_v335.23.d:0 "In the process of unifying monetary policy the central bank demands greater autonomy so that politics does not interfere with interest rates and note issuance. The finance ministry worries this would limit the government’s flexibility in a recession, and legislators likewise think the governor should not be answerable to no one."
 roc_v335.23.a:0 "Guarantee central bank independence with terms shielded from politics."
 roc_v335.23.b:0 "Have the central bank report to the Executive Yuan, preserving political oversight."
 roc_v335.24.t:0 "The Disappearance of the Hukou System"
 roc_v335.24.d:0 "After the household registration restrictions are lifted, millions of migrant workers flood into the big coastal cities. Schools and hospitals fill up at once, and city governments complain of insufficient funds, while the old and the children in the villages wait for remittances. Experts at the interior ministry say mobility itself is not the problem; the question is whether public services can keep pace."
 roc_v335.24.a:0 "Increase subsidies for urban public services to absorb the new residents."
 roc_v335.24.b:0 "Encourage return-home entrepreneurship and steer migration elsewhere."
 roc_v335.25.t:0 "The West–East Gas Pipeline"
 roc_v335.25.d:0 "Pipeline crews dig all the way from the Gobi to the eastern coast, and villages along the route receive natural gas for the first time. The project finishes ahead of schedule and leaves a budget surplus. The eastern cities want gas at a lower price, while the western provinces argue that part of the proceeds should stay local. The energy authorities must decide how to share this dividend."
 roc_v335.25.a:0 "Favor the east and cut gas prices for industry."
 roc_v335.25.b:0 "Leave part of the proceeds in the west and set up a regional development fund."
 roc_v335.26.t:0 "The Local Debt Reckoning"
 roc_v335.26.d:0 "An audit report reveals that the debts of financing platforms in several provinces and cities have far exceeded their capacity to repay, and many of the projects were vanity projects built for the sake of officials’ records. The finance ministry offers a clean-up plan: either the center takes over part of the debt in exchange for supervision of local budgets, or the localities handle it themselves and, if necessary, let the financing platforms go bankrupt."
 roc_v335.26.a:0 "Have the center take on part of the debt in exchange for supervision of local budgets."
 roc_v335.26.b:0 "Let the localities handle it, with insolvency if necessary."
 roc_v335.27.t:0 "Screening the Officer Corps"
 roc_v335.27.d:0 "The screening committee faces hundreds of thousands of officer files: generals from the old PLA, some with combat records and some tied to the old party-army political training. If the screening is too strict it will frighten the whole army, and if too lax there is a worry that loyalists of the old system will stay entrenched in key posts."
 roc_v335.27.a:0 "Screen strictly and re-appoint key commanders."
 roc_v335.27.b:0 "Screen leniently and put the preservation of fighting strength first."
 roc_v335.28.t:0 "The Reopening of Whampoa"
 roc_v335.28.d:0 "The Whampoa Military Academy reopens in Guangzhou, with officers from Taiwan and young men who served in the old PLA among its first class. The first problem for the board is the curriculum: use the traditional prewar Whampoa materials, or build around modern joint operations? Old alumni weep at the ceremony, while the young instructors want reform."
 roc_v335.28.a:0 "Keep the Whampoa tradition and strengthen spiritual education and discipline."
 roc_v335.28.b:0 "Center the curriculum on joint operations and update it entirely."
 roc_v335.29.t:0 "Where Demobilized Soldiers Go"
 roc_v335.29.d:0 "After the army is reorganized, hundreds of thousands of soldiers need to be demobilized. Some return to farm at home, but many more cannot find work in the cities. Veterans gather outside city halls demanding resettlement and pensions. The army ministry’s figures show that if they remain unemployed for long, public order will be seriously affected."
 roc_v335.29.a:0 "Set up a veterans’ resettlement fund and vocational training camps."
 roc_v335.29.b:0 "Enroll part of the demobilized in land-reclamation and construction units."
 roc_v335.30.t:0 "Choosing the Theater Commanders"
 roc_v335.30.d:0 "The establishment of the new theaters is settled, but who will command each of them is hotly disputed. Generals from Taiwan see it as the fruit of the takeover, while generals from the old army demand that the majority be reflected. The President hesitates between two lists, because either would leave the other side feeling excluded."
 roc_v335.30.a:0 "Appoint generals from Taiwan to ensure a loyal chain of command."
 roc_v335.30.b:0 "Make mixed appointments, pairing generals from both sides in each theater."
 roc_v335.31.t:0 "Integrating the Navies"
 roc_v335.31.d:0 "The Taiwanese navy and the old PLA navy are equipped very differently, one with Western-style ships and the other with a mix of Soviet-lineage and domestic designs. Naval ministry engineers point out that spare parts and training materials must be unified, but unifying means giving up one side’s system."
 roc_v335.31.a:0 "Unify on domestic standards and phase out the old ships."
 roc_v335.31.b:0 "Keep both systems in parallel with each fleet maintaining its own."
 roc_v335.32.t:0 "Inventory of the Nuclear Arsenal"
 roc_v335.32.d:0 "During the inventory of the strategic weapons taken over, the technical team submits a worrying report: maintenance records for some warheads are incomplete and custodial personnel have been leaving. Senior officers argue for preserving deterrence, while the international community hopes the new government will show good faith on non-proliferation."
 roc_v335.32.a:0 "Declare that a limited nuclear deterrent will be kept."
 roc_v335.32.b:0 "Accept international inspection and reduce the arsenal step by step."
 roc_v335.33.t:0 "Consolidating the Air Bases"
 roc_v335.33.d:0 "During air force unification it turns out the two layouts overlap badly: there are too many airfields along the coast and almost no backup runways inland. The air force ministry proposes closing and building at the same time, and local governments, fearing a slump once the bases leave, lobby hard."
 roc_v335.33.a:0 "Close coastal bases and build inland backup airfields."
 roc_v335.33.b:0 "Keep the bases and convert them to joint military–civil airfields."
 roc_v335.34.t:0 "Remodeling the Defense Industry"
 roc_v335.34.d:0 "Some of the defense plants taken over are technically advanced and others quite backward, and all carry heavy unpaid debts. The defense industry ministry offers two plans: keep the state system and concentrate resources on key problems, or open participation to private firms and award orders by competitive bidding."
 roc_v335.34.a:0 "Keep the state system and concentrate resources on key problems."
 roc_v335.34.b:0 "Open the field to private bidding and introduce market competition."
 roc_v335.35.t:0 "Balancing the Party Factions"
 roc_v335.35.d:0 "The factions within the Kuomintang argue fiercely over who will run the party: the Taiwan-born localists, the mainland veterans and the local vote-brokers each demand more seats on the Central Standing Committee. The chairman wants unity but finds that every compromise leaves one faction feeling sacrificed."
 roc_v335.35.a:0 "Allocate seats by faction proportion to stabilize the party."
 roc_v335.35.b:0 "Reorganize the Standing Committee on the basis of ability and evaluation."
 roc_v335.36.t:0 "Resetting Party–Army Relations"
 roc_v335.36.d:0 "Reformers want the army to be truly nationalized and no longer under party command, while old party members in the army hold that the Kuomintang created it and should not be severed from it. Before every party congress, army delegates become targets for courting by all sides."
 roc_v335.36.a:0 "Nationalize the army and withdraw it from party activity."
 roc_v335.36.b:0 "Keep party branches in the army, limited to political education."
 roc_v335.37.t:0 "The First Gubernatorial Elections"
 roc_v335.37.d:0 "The direct election of governors that the Democratic Party has fought for years is finally about to take place. Candidates emerge in every province: local magnates, academics and former party comrades. The central government worries that in some provinces strong regional powers may arise to challenge central authority."
 roc_v335.37.a:0 "Open the elections fully and let each province decide for itself."
 roc_v335.37.b:0 "Impose eligibility screening to prevent regional powers from growing too strong."
 roc_v335.38.t:0 "Dividing the Federal Fiscal Pie"
 roc_v335.38.d:0 "Fiscal federalism requires a clear division of tax sources between center and provinces. The rich coastal provinces want to keep most of their taxes, while the inland provinces demand more subsidies. The Democratic Party itself is divided: some want more kept for the localities, others fear the center will lose the capacity to balance."
 roc_v335.38.a:0 "Leave more with the localities and keep a central transfer payment mechanism."
 roc_v335.38.b:0 "Keep the main tax sources at the center and subsidize by population."
 roc_v335.39.t:0 "The First Minimum Wage Level"
 roc_v335.39.d:0 "The Social Democrats’ minimum wage bill sets off heated debate in the legislature. Unions want it as high as possible, while small business owners say that if wages jump they can only cut staff or relocate. Labor ministry statisticians also admit that living costs differ enormously from province to province."
 roc_v335.39.a:0 "Set a relatively high national standard."
 roc_v335.39.b:0 "Set standards by province through local labor–management bargaining."
 roc_v335.40.t:0 "The Price of Carbon"
 roc_v335.40.d:0 "The government announces the first stage of carbon pricing, and heavy industry and power producers issue stern warnings that rising costs will make their products uncompetitive. Environmental groups point out that if the price is set too low it will achieve nothing. The finance ministry leans toward using the revenue to subsidize low-income households."
 roc_v335.40.a:0 "Start with a higher carbon price and use the revenue to subsidize low-income households."
 roc_v335.40.b:0 "Start with a lower carbon price and give industry a grace period."
 roc_v335.41.t:0 "The Cross-Party Cabinet List"
 roc_v335.41.d:0 "Cabinet negotiations reach their final hour. The Kuomintang wants to keep finance and defense, the Democratic Party wants interior and justice, and the Social Democrats insist on labor and education. The three parties’ delegates talk late into the night in a small parliamentary meeting room, each knowing that once the list is published it can never be taken back."
 roc_v335.41.a:0 "Divide posts in proportion to seats and form a stable coalition government."
 roc_v335.41.b:0 "Have the President name several non-partisan professionals to the cabinet."
 roc_v335.42.t:0 "The Truth Commission"
 roc_v335.42.d:0 "Hearings of the truth commission follow one another as relatives of victims, retired officers and old party cadres take turns to testify before the cameras. Every story reopens an old wound and forces society to face the past. Some demand accountability, others say forgiveness is the only way forward."
 roc_v335.42.a:0 "Publish all hearing records and pursue accountability case by case."
 roc_v335.42.b:0 "Adopt a reconciliation model in exchange for testimony and apologies."
 roc_v335.43.t:0 "Qualifying as a Legal Party"
 roc_v335.43.d:0 "After the Communist Party formally obtains legal status, it faces registration with the electoral commission for the first time. Some demand that the phrase dictatorship of the proletariat be dropped from the party charter, while conservatives in the party fear it would lose its soul. The commission is also divided, since once approved, other parties will demand the same treatment."
 roc_v335.43.a:0 "Amend the charter in exchange for national party status."
 roc_v335.43.b:0 "Keep the original charter and register only as a regional party."
 roc_v335.44.t:0 "The Market Socialism Experiment"
 roc_v335.44.d:0 "In provinces governed by the Communist Party a pilot of market socialism begins: state firms and cooperatives compete side by side, and workers hold part of the equity. Some praise it as a middle road, others say it pleases neither side. Finance ministry figures show productivity rising in the pilot provinces, though disparities are widening too."
 roc_v335.44.a:0 "Widen the pilot and extend it to more provinces."
 roc_v335.44.b:0 "Keep it small and keep observing."
 roc_v335.45.t:0 "The Last Kilometers of the Border"
 roc_v335.45.d:0 "The Sino-Russian border demarcation team reaches an impasse over several islands in the Heilong River. Only one more line is needed on the map, but behind every line are fishermen, border guards and riverside villages. Moscow’s delegates hint that if we yield on these islands, border economic cooperation can be greatly expanded."
 roc_v335.45.a:0 "Accept a compromise and gain border cooperation."
 roc_v335.45.b:0 "Hold to our original claims and make no concessions."
 roc_v335.46.t:0 "The Price of the Siberian Pipeline"
 roc_v335.46.d:0 "The price negotiations for the pipeline have dragged on for a whole winter. The Russian side demands pricing at international rates, while we want a long-term discount. Both admit they need each other, but neither wants to concede first. Our energy ministry negotiator holds an alternative offer from Central Asia that can be played as a bargaining chip at any time."
 roc_v335.46.a:0 "Accept the higher price in exchange for long-term stable supply."
 roc_v335.46.b:0 "Show the Central Asian alternative to force the price down."
 roc_v335.47.t:0 "The First Fleet on the Northern Route"
 roc_v335.47.d:0 "The first merchant fleet fully loaded with cargo enters the Northern Sea Route, and shipping companies say it cuts the voyage by almost a third compared with the Suez Canal. The Russian side wants to collect icebreaker and transit fees, while our shipowners seek priority passage. Environmental groups worry that the Arctic ecosystem is fragile and should not be over-developed for shipping."
 roc_v335.47.a:0 "Pay the transit fee in exchange for priority use."
 roc_v335.47.b:0 "Co-invest with Russia in an icebreaker fleet and share the cost."
 roc_v335.48.t:0 "The Defectors’ Secret Route"
 roc_v335.48.d:0 "Our intelligence officers have set up a defector route on the north bank of the Yalu. It is both a source of intelligence and a humanitarian route, but if Pyongyang discovers it a diplomatic storm will follow. The head of military intelligence urges expansion, while the National Security Council wants a pause to avoid harming trust between Beijing and Seoul."
 roc_v335.48.a:0 "Expand the route and gain more intelligence from inside Pyongyang."
 roc_v335.48.b:0 "Suspend operations and wait for a better moment."
 roc_v335.49.t:0 "The Language of the Joint Command"
 roc_v335.49.d:0 "The first problem the Sino-Korean joint command meets is not tactics but language and standards: should staff documents be in Chinese or Korean, should English serve as the common tongue, and who sets the rank equivalences, communication channels and logistics standards? Officers of both countries spend a whole afternoon arguing over a single term."
 roc_v335.49.a:0 "Use English as the common language and adopt NATO standards."
 roc_v335.49.b:0 "Use bilingual documents with Chinese standards as the main ones."
 roc_v335.50.t:0 "The Yalu Economic Belt"
 roc_v335.50.d:0 "Development zones on both banks of the Yalu begin to open factories, and trucks from Dandong cross the new bridge one after another. Korean officials want foreign capital confined to the special zones, while our businessmen demand freedom to hire labor and to build warehouses inside Korea. The negotiators on both sides know that the success or failure of this economic belt will shape the border for the next ten years."
 roc_v335.50.a:0 "Accept the zone restrictions in exchange for a stable investment climate."
 roc_v335.50.b:0 "Insist on free hiring and warehousing and slow the development."
 TAI_v335_fab_water_plan:0 "Water for the Science Park"
 TAI_v335_fab_water_plan_desc:0 "The government gives the science park priority for water and power, so fab expansion and research are spared by dry spells; the cost is tighter farm irrigation and growing local resentment."
 TAI_v335_ecfa_dividend:0 "The Framework Agreement Dividend"
 TAI_v335_ecfa_dividend_desc:0 "After the agreement is signed, exporters’ orders rise noticeably and factories run fuller; but traditional industries and smallholders remain uneasy and the protests in the streets have not fully subsided."
 TAI_v335_energy_transition:0 "The Energy Transition"
 TAI_v335_energy_transition_desc:0 "With Unit Four mothballed, the government speeds up gas terminals and renewable energy. Electricity prices rise in the short term, but public trust in energy policy partly recovers."
 TAI_v335_volunteer_force:0 "The New Volunteer System"
 TAI_v335_volunteer_force_desc:0 "With higher pay and housing benefits the proportion of volunteer soldiers rises, training times shorten and quality becomes steadier; defense spending increases accordingly."
 TAI_v335_drone_swarm:0 "The Drone Swarm"
 TAI_v335_drone_swarm_desc:0 "With private drone makers in the supply chain the military obtains large numbers of cheap reconnaissance and strike platforms, and units become more tactically flexible."
 TAI_v335_homegrown_arms:0 "Self-Reliant Defense"
 TAI_v335_homegrown_arms_desc:0 "By replacing part of the imports with indigenous development, defense research institutes and private firms work more closely and the production lines gradually form a system of their own."
 TAI_v335_soe_dividend:0 "The SOE Reform Dividend"
 TAI_v335_soe_dividend_desc:0 "After rapid reform the once bloated state enterprises bring in private capital and professional managers and efficiency rises noticeably, though the pain of layoffs and restructuring continues."
 TAI_v335_northeast_revival:0 "Northeast Revival"
 TAI_v335_northeast_revival_desc:0 "Large-scale technical renovation brings the old industrial base’s plants and equipment back to life, workers see hope again, and the southward flow of people begins to ebb."
 TAI_v335_taishang_dividend:0 "Return of Taiwanese Business"
 TAI_v335_taishang_dividend_desc:0 "The returning Taiwanese firms bring capital, technology and supply chains, quickening the upgrade of inland electronics and machinery, while local firms must face fiercer competition."
 TAI_v335_veteran_integration:0 "Integration of the Old Ranks"
 TAI_v335_veteran_integration_desc:0 "Officers and men of the old army are gradually absorbed into the new system, veterans become instructors of recruits, and divisions within the army begin to dissolve."
 TAI_v335_pipeline_dividend:0 "The Pipeline Dividend"
 TAI_v335_pipeline_dividend_desc:0 "Stable gas supply and shipping-lane cooperation lower industrial energy costs and benefit the factories and ports along the routes, while making us more dependent on that supply line."
 TAI_v335_labor_pact:0 "The New Labor Compact"
 TAI_v335_labor_pact_desc:0 "A national minimum wage gives workers more security and strikes decline, but companies’ labor costs rise."
 TAI_v335_coalition_honeymoon:0 "The Coalition Honeymoon"
 TAI_v335_coalition_honeymoon_desc:0 "The three-party cabinet has only just formed, every ministry is willing to cooperate, and policy moves forward with unusual ease; but everyone knows the mood will not last long."
