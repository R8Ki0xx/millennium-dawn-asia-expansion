l_english:
 PRC_after_beijing: "After the Fall of Beijing"
 PRC_after_beijing_desc: "Zhongnanhai has changed hands and the Blue Sky, White Sun flag flies over Tiananmen. But the party is still here, the army is still here, and tens of millions of party members are still here. As long as the masses of the Northeast and North China remain, we have not lost. In 1927 and 1934 the party came close to destruction, and both times it came through."
 PRC_rebuild_central_committee: "Rebuild the Central Committee"
 PRC_rebuild_central_committee_desc: "Hold a plenary session in the new capital and rebuild the leadership core of the Central Committee. Surviving members and provincial party secretaries come from all directions; some are arrested on the way and some defect to the other side, and those who attend know this meeting matters as much as the Zunyi Conference did."
 PRC_rectification: "Rectification Campaign"
 PRC_rectification_desc: "Purge the waverers and unify the whole party's thinking. After Beijing fell, many members burned their party cards and found jobs in the new government; the rectification campaign requires everyone to account for how they behaved in the crisis. The lessons of Yan'an still hold today."
 PRC_united_front: "United Front"
 PRC_united_front_desc: "Unite with everyone who can be united: workers, peasants, laid-off employees and local power holders unhappy with the new Kuomintang government. The reform of state firms after the Restoration has cost millions of workers their iron rice bowls, and land registration has left some farmers afraid of losing their land; all of them are targets of the united front."
 PRC_underground_party: "The Underground Party"
 PRC_underground_party_desc: "Rebuild the underground party in the areas under Kuomintang rule, mobilize the masses and infiltrate the army and government. One-to-one contacts, secret relay stations and passwords, the things once read about in Red Crag, are everyday life for party members again. Every infiltrated factory and barracks is a spark for a future uprising."
 PRC_peoples_democratic_dictatorship: "People's Democratic Dictatorship"
 PRC_peoples_democratic_dictatorship_desc: "The people's democratic dictatorship, led by the working class and based on the alliance of workers and peasants, is the state system of New China. In the base areas people's congresses meet again, and land and factories return to collective hands. The party must prove to the masses that it represents ordinary people better than the government in Nanjing."
 PRC_reorganize_remnants: "Reorganize the Remnant Forces"
 PRC_reorganize_remnants_desc: "Reorganize the retreating troops into new field armies. Remnants of the Northern and Central Theater Commands, armed police and militia are mixed together, units renumbered and commissars reappointed. Equipment and supplies are badly short, but these troops are the party's last capital."
 PRC_northeast_resistance: "Spirit of the Northeast Resistance"
 PRC_northeast_resistance_desc: "Between the White Mountains and the Black River, the tradition of Yang Jingyu and Zhao Shangzhi has never died. The Northeast Anti-Japanese United Army fought the Japanese for fourteen years in ice and snow; now the forests of Changbai Mountain and the Lesser Khingan once again shelter the party's guerrillas."
 PRC_peoples_war: "People's War"
 PRC_peoples_war_desc: "The army and the people are the foundation of victory. Drown the enemy in the vast ocean of people's war: every village a fortress, every peasant a sentry. The National Army has American equipment and air superiority, but it cannot occupy every hilltop and every village."
 PRC_guerrilla_tactics: "Guerrilla Tactics"
 PRC_guerrilla_tactics_desc: "When the enemy advances, we retreat; when he halts, we harass; when he tires, we strike; when he retreats, we pursue. The sixteen-character formula on which the party's army was built is put to use once more: avoid the National Army's armor and air strikes and hit its supply lines, checkpoints and the restoration-area governments in its rear."
 PRC_base_areas: "Build Base Areas"
 PRC_base_areas_desc: "Build solid revolutionary base areas on the industrial base of the Northeast. The steel of Anshan, the oil of Daqing and the machine works of Harbin were once the eldest sons of the Republic's industry; now they must supply guns and ammunition for the revolutionary war."
 PRC_third_civil_war: "The Third Chinese Civil War"
 PRC_third_civil_war_desc: "The time has come. The CCP Central Committee calls on the whole nation to rise up and overthrow the reactionary Kuomintang government: underground parties everywhere launch uprisings at once, factories strike, railways are paralyzed and guerrillas attack county towns. The Third Chinese Civil War has begun."
 PRC_march_south: "March Inside the Pass"
 PRC_march_south_desc: "Lead the army through the passes and liberate North China. Over seventy years ago the Northeast Field Army marched south from here, and the Pingjin campaign decided China's fate; now history seems about to repeat itself. The troops beyond Shanhaiguan stand ready, their objectives Beiping and Tianjin."
 PRC_liberate_nanjing: "Liberate Nanjing"
 PRC_liberate_nanjing_desc: "‘A storm sweeps over Zhongshan, a million brave troops cross the Great River.’ In April 1949 the PLA crossed the Yangtze and took the Presidential Palace in Nanjing; more than seventy years later, the party's army means to reach the Yangtze once more and drive the Kuomintang government out of its capital."
 PRC_seek_moscow_aid: "Seek Aid from Moscow"
 PRC_seek_moscow_aid_desc: "Ask the Kremlin for weapons and money. Moscow's attitude is ambiguous: it is happy to see a divided China, but unwilling to offend Nanjing and Washington for a regime that may fail. Aid will come, but at the price of concessions on borders, energy and ports."
 PRC_nko_comrades: "Korean Comrades"
 PRC_nko_comrades_desc: "The Korean comrades across the Yalu once fought shoulder to shoulder with us. Seventy years ago the Volunteers went into Korea; now it is Pyongyang's turn to repay the debt by letting our troops rest on Korean soil and opening a supply route through Sinuiju. The Kim regime also knows it cannot last long without a Communist China."
 PRC_international_communism: "International Communist Movement"
 PRC_international_communism_desc: "Comrades of Cuba, Vietnam, Laos and the whole world, support the Chinese revolution! But these countries are no longer the revolutionary brothers of the 1960s: Hanoi does big business with Nanjing, and Havana has troubles of its own. The international communist movement can offer more words of support than guns."
 PRC_new_china: "New China"
 PRC_new_china_desc: "The People's Republic of China has not perished. When the red flag flies over the Gate of Heavenly Peace again, New China will be born a second time. For the party members and fighters holding out in the base areas, it is their one belief and the goal for which they will give everything."
