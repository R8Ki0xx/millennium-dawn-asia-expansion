l_english:
 PRC_after_beijing: "After the Fall of Beijing"
 PRC_after_beijing_desc: "Zhongnanhai has changed hands, but the party is still here and the army is still here. So long as the masses of the Northeast and North China are with us, we have not lost."
 PRC_rebuild_central_committee: "Rebuild the Central Committee"
 PRC_rebuild_central_committee_desc: "Hold a plenary session in the new capital and rebuild the leadership core of the Central Committee."
 PRC_rectification: "Rectification Campaign"
 PRC_rectification_desc: "Purge the waverers and unite the whole party's thinking. The lessons of Yan'an still hold today."
 PRC_united_front: "United Front"
 PRC_united_front_desc: "Unite every force that can be united: workers, peasants, laid-off employees and local power brokers unhappy with the new Kuomintang government."
 PRC_underground_party: "The Underground Party"
 PRC_underground_party_desc: "Rebuild the underground party in Nationalist-held areas, mobilize the masses and infiltrate the army and the government."
 PRC_peoples_democratic_dictatorship: "People's Democratic Dictatorship"
 PRC_peoples_democratic_dictatorship_desc: "The people's democratic dictatorship, led by the working class and based on the alliance of workers and peasants, is the form of state of New China."
 PRC_reorganize_remnants: "Reorganize the Remnant Forces"
 PRC_reorganize_remnants_desc: "Reorganize the retreating units into new field armies."
 PRC_northeast_resistance: "Spirit of the Northeast Resistance"
 PRC_northeast_resistance_desc: "Among the white mountains and black waters, the tradition of Yang Jingyu and Zhao Shangzhi has never died."
 PRC_peoples_war: "People's War"
 PRC_peoples_war_desc: "The army and the people are the foundation of victory. Drown the enemy in the vast ocean of people's war."
 PRC_guerrilla_tactics: "Guerrilla Tactics"
 PRC_guerrilla_tactics_desc: "The enemy advances, we retreat; the enemy camps, we harass; the enemy tires, we attack; the enemy retreats, we pursue."
 PRC_base_areas: "Build Base Areas"
 PRC_base_areas_desc: "Build solid revolutionary base areas on the industrial heartland of the Northeast."
 PRC_third_civil_war: "The Third Chinese Civil War"
 PRC_third_civil_war_desc: "The time has come. The Central Committee calls on the people of the whole country to rise up and overthrow the reactionary Kuomintang government."
 PRC_march_south: "March Inside the Pass"
 PRC_march_south_desc: "Lead the armies through the passes and liberate North China."
 PRC_liberate_nanjing: "Liberate Nanjing"
 PRC_liberate_nanjing_desc: "A storm sweeps over Zhongshan, and a million-strong army crosses the Great River."
 PRC_seek_moscow_aid: "Seek Aid from Moscow"
 PRC_seek_moscow_aid_desc: "Ask the Kremlin for weapons and money."
 PRC_nko_comrades: "Korean Comrades"
 PRC_nko_comrades_desc: "Our Korean comrades across the Yalu once fought shoulder to shoulder with us."
 PRC_international_communism: "International Communist Movement"
 PRC_international_communism_desc: "Comrades of Cuba, Vietnam, Laos and the whole world, support the Chinese revolution!"
 PRC_new_china: "New China"
 PRC_new_china_desc: "The People's Republic of China has not perished. When the red flag flies over the Gate of Heavenly Peace again, New China will be born a second time."
