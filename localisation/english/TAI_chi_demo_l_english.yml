l_english:
 CHI_demo_reform_root:0 "Reopening Political Reform"
 CHI_demo_reform_root_desc:0 "Since Deng’s southern tour, reform has centered on the economy. As growth slows and social tensions build, people inside and outside the party ask whether the political system must change, and how far."
 CHI_demo_a1:0 "Central Political Reform Group"
 CHI_demo_a1_desc:0 "Led by a Standing Committee member, the group studies plans to separate party and government. Reformers argue the party should not directly run every ministry."
 CHI_demo_a2:0 "Competitive People’s Congress Elections"
 CHI_demo_a2_desc:0 "Grassroots People’s Congress elections move to competitive slates, with more candidates than seats. The first results show many people what a ballot can be worth."
 CHI_demo_a3:0 "Allow Independent Party Campaigns"
 CHI_demo_a3_desc:0 "Democratic parties may nominate candidates independently, and inter-party competition moves from behind the scenes into the open. Conservatives warn that this is a road with no way back."
 CHI_demo_a4:0 "Constitutional Amendment for a Multi-Party System"
 CHI_demo_a4_desc:0 "The draft rewrites “leadership of the Communist Party” as “governing according to law” and allows several parties to exist legally. The debate in the National People’s Congress lasts an entire session."
 CHI_demo_a5:0 "The First National Election"
 CHI_demo_a5_desc:0 "A national election is finally to be held. Party candidate lists are published, and ballots will be counted in every province at once."
 CHI_demo_b1:0 "Rights Movement and Independent Unions"
 CHI_demo_b1_desc:0 "Urban workers and retired teachers organize to demand back pay and the right to collective bargaining."
 CHI_demo_b2:0 "Local Self-Government Pilots"
 CHI_demo_b2_desc:0 "Several provinces pilot village and community self-government. Elected residents’ and village committees begin to hold real power."
 CHI_demo_b3:0 "Nationwide Protests"
 CHI_demo_b3_desc:0 "Local protests merge into a nationwide movement. The crowds present a list: elections, press freedom and an independent judiciary."
 CHI_demo_b4:0 "Round Table Talks"
 CHI_demo_b4_desc:0 "Government and representatives of many sectors sit at the same table to discuss a timetable for reform."
 CHI_demo_b5:0 "The First Transitional Election"
 CHI_demo_b5_desc:0 "A transitional constitution, debated for months, is adopted, and the country holds its first transitional election."
 CHI_demo_c1:0 "Cross-Strait Democratic Dialogue"
 CHI_demo_c1_desc:0 "Scholars, legislators and civic groups from both sides of the Strait meet in Hong Kong and Xiamen to discuss a political framework both sides can accept."
 CHI_demo_c2:0 "The “Good Governance” Proposal"
 CHI_demo_c2_desc:0 "The proposal holds that unification should not mean one side absorbing the other, but a system in which both share sovereignty and voting rights. Taiwan’s reaction is mixed."
 CHI_demo_c3:0 "Joint Constitutional Commission"
 CHI_demo_c3_desc:0 "Both sides send equal numbers of delegates to draft a federal constitution together."
 CHI_demo_c4:0 "Referendum"
 CHI_demo_c4_desc:0 "The draft federal constitution goes to referendums on both sides at the same time. Support and opposition are fierce in both societies."
 CHI_demo_c5:0 "The First Federal Election"
 CHI_demo_c5_desc:0 "After the referendum passes, the federation holds its first national election."
 chi_demo.1.t:0 "The Completion of Political Reform"
 chi_demo.1.d:0 "The first full cycle of reform is complete. Constitutional provisions, the electoral law and the party law are in force. The nation now needs a real election."
 chi_demo.1.a:0 "Prepare the first election"
 chi_demo.2.t:0 "Nationwide Protests"
 chi_demo.2.d:0 "Protesters have sat in the squares of many cities for two weeks. The security services ask whether to clear them. Moderates urge that we first meet their representatives."
 chi_demo.2.a:0 "Clear the squares by law and restore order. This closes the door on round-table talks."
 chi_demo.2.b:0 "Send representatives and begin talks."
 chi_demo.3.t:0 "The Referendum Result"
 chi_demo.3.d:0 "Referendums on both sides are counted together. The results fill the front pages of newspapers on both sides, and each camp argues about whether this is a genuine mandate."
 chi_demo.3.a:0 "The referendum passes and the federal constitution takes effect."
 chi_demo.3.b:0 "The referendum fails and we return to the negotiating table."
 chi_demo.4.t:0 "Backlash Inside the Party"
 chi_demo.4.d:0 "As soon as independent campaigns are announced, conservatives in the party hold a closed-door meeting. They demand a pause in reform and ask who approved this path."
 chi_demo.4.a:0 "Concede, and keep the clause on party leadership."
 chi_demo.4.b:0 "Strike back hard and push a purge inside the party."
 chi_demo.5.t:0 "The Vote on the Constitutional Amendment"
 chi_demo.5.d:0 "In the National People’s Congress the amendment goes to its final vote. Conservative delegates jointly demand a delay, while reformers lobby swing votes one by one in the corridors. An elderly delegate says it is the longest session he has ever sat through."
 chi_demo.5.a:0 "Hold the vote as scheduled and pass it by a narrow margin."
 chi_demo.5.b:0 "Postpone the vote in exchange for conservative support."
 chi_demo.6.t:0 "Taipei’s Response"
 chi_demo.6.d:0 "When the “good governance” proposal reaches Taipei, the Legislative Yuan erupts at once. Some call it the most sincere offer in thirty years, others suspect that “good governance” is annexation by another name. The Presidential Office says it will study the proposal carefully."
 chi_demo.6.a:0 "Welcome it publicly and invite their delegation to Beijing."
 chi_demo.6.b:0 "Stay restrained and let civil channels make contact first."
 chi_demo.7.t:0 "Terms of the Round Table"
 chi_demo.7.d:0 "On the eve of the round table every delegation hands in its conditions. Independent unions demand legal registration and the right to strike, student groups demand the release of detained comrades, and inside the government people argue over which topics may be put on the table."
 chi_demo.7.a:0 "Accept legal status for the independent unions."
 chi_demo.7.b:0 "Discuss only the election timetable and defer the rest."
 chi_demo.8.t:0 "A Federation Proposal from Beijing"
 chi_demo.8.d:0 "The federal constitution has taken effect on the mainland, and Beijing formally invites Taipei: Taiwan may join the Chinese Federation as an equal constituent unit, keeping its own elections, command structure and social system, with guaranteed seats in the federal parliament.

For the first time in more than seventy years, both sides regard the other’s offer as more than a tactic."
 chi_demo.8.a:0 "Accept: Taiwan joins the Chinese Federation."
 chi_demo.8.b:0 "Decline and keep the present status."
 chi_demo.9.t:0 "The Reform Group’s Report"
 chi_demo.9.d:0 "The reform group submits its first report: separating the party’s decision-making from the government’s execution requires amending more than twenty regulations at once. It is blunt, and it names several ministries."
 chi_demo.9.a:0 "Publish a summary and seek public support."
 chi_demo.9.b:0 "Circulate it inside the party first."
 chi_demo.10.t:0 "Results of the Competitive Elections"
 chi_demo.10.d:0 "The first competitive elections surprise everyone: in several counties the party-endorsed candidates lose. Some call it the first echo of public opinion, others demand a recount."
 chi_demo.10.a:0 "Recognize the results and let the losers step aside."
 chi_demo.10.b:0 "Order a recount."
 chi_demo.11.t:0 "A Wave of Strikes"
 chi_demo.11.d:0 "After the independent unions are founded, workers at several large state firms strike together, demanding back pay. A banner at a factory gate reads: ‘We do not want to topple anyone, only the wages we are owed.’"
 chi_demo.11.a:0 "Agree to back pay and open negotiations."
 chi_demo.11.b:0 "Refuse to negotiate and order a return to work."
 chi_demo.12.t:0 "Results of the Self-Government Pilots"
 chi_demo.12.d:0 "The first self-government pilots report back: elected community committees handle waste and school repairs more efficiently than before, but a few villages have been captured by local clans. The verdict is mixed."
 chi_demo.12.a:0 "Widen the pilots."
 chi_demo.12.b:0 "Wait another year."
 chi_demo.13.t:0 "The First Round of Dialogue"
 chi_demo.13.d:0 "The first round of cross-strait democratic dialogue ends in Hong Kong. Neither side has agreed to anything, but neither has walked out. Afterward a delegate from Taipei tells reporters: ‘At least we now know what the other side is thinking.’"
 chi_demo.13.a:0 "Publish the minutes."
 chi_demo.13.b:0 "Keep them confidential to ease outside pressure."
 chi_demo.14.t:0 "Deadlock in the Constitutional Commission"
 chi_demo.14.d:0 "The joint commission is stuck on the sovereignty clause: Beijing’s side argues for ‘federal sovereignty’, Taipei’s for ‘sovereignty of the constituent units’. In the meeting room the interpreters have gone three days without a wording both can accept."
 chi_demo.14.a:0 "Yield on the sovereignty clause in exchange for progress."
 chi_demo.14.b:0 "Hold our position."
 CHI_demo_transition_idea:0 "Pains of Transition"
 CHI_demo_transition_idea_desc:0 "In the first cycle of reform old order and new rules run side by side. Frictions appear in implementation, and local capacity varies widely."
 CHI_demo_crackdown_idea:0 "The Silence After the Square"
 CHI_demo_crackdown_idea_desc:0 "After the square was cleared the streets fell quiet, but the silence carries resentment. The door to round-table talks is closed for now."
 CHI_demo_backlash_idea:0 "Party Purge"
 CHI_demo_backlash_idea_desc:0 "The purge leaves many cadres anxious. Efficiency rises, but everyone feels insecure, and reform loses a number of supporters."
 VEL_CHI_AI_DEMO:0 "@CHI Chinese democratization path (AI)"
 RULE_OPTION_VEL_DEMO_NEVER:0 "Never"
 RULE_OPTION_VEL_DEMO_NEVER_DESC:0 "China (AI) will not start the democratization path by itself. Players may still choose it."
 RULE_OPTION_VEL_DEMO_LOW:0 "Occasionally"
 RULE_OPTION_VEL_DEMO_LOW_DESC:0 "China (AI) has some chance of starting political reform and picks one of the three paths at random."
 RULE_OPTION_VEL_DEMO_HIGH:0 "Eagerly"
 RULE_OPTION_VEL_DEMO_HIGH_DESC:0 "China (AI) will prioritize political reform and picks one of the three paths at random."
