l_english:
 TAI_n_k0:0 "Institutionalizing Cross-Strait Policy"
 TAI_n_k0_desc:0 "“No unification, no independence, no use of force” cannot remain a slogan. For the first time the National Security Council, the Mainland Affairs Council and the foreign and defense bodies sit in one decision process: every cross-strait policy needs a plan, an owner and a way back."
 TAI_n_k1a:0 "A Hotline and Crisis Communication Channel"
 TAI_n_k1a_desc:0 "A line between the militaries and coast guards that bypasses the media, so any sea or air incident has someone answering the phone within the hour. The number is printed on a laminated card in every duty officer’s pocket."
 TAI_n_k1b:0 "Screening of Mainland Capital and Outbound Investment"
 TAI_n_k1b_desc:0 "A cross-ministry panel reviews mainland acquisitions and outbound investment in key industries case by case. The criteria are public, so applicants finally know why they were turned down."
 TAI_n_k1c:0 "Anti-Infiltration Law and Defense against Cognitive Warfare"
 TAI_n_k1c_desc:0 "Foreign efforts to sway elections and opinion through money, media and social platforms are written into law. In the first cases brought to court, some defendants believed to the end they had merely been “doing business”."
 TAI_n_k2a:0 "The Mini Three Links and People-to-People Exchange"
 TAI_n_k2a_desc:0 "Ferries, water and tourism at Kinmen and Matsu let ordinary people meet at the narrowest crossing. The shops here take both new Taiwan dollars and renminbi."
 TAI_n_k2b:0 "Diversifying Cross-Strait Trade Risk"
 TAI_n_k2b_desc:0 "Dependence on a single market is listed as a security risk: firms are subsidized to move part of their orders and lines to Southeast Asia, India and Mexico. This is not decoupling, only declining to keep all the eggs in one basket."
 TAI_n_k2c:0 "Modernizing National Security Law"
 TAI_n_k2c_desc:0 "The official secrets act, economic espionage rules and the protection of critical infrastructure are revised together. The legislature’s review drags on for twelve months, but the quarrel yields a line that every side is willing to acknowledge."
 TAI_n_k3:0 "The National Security Strategy Report"
 TAI_n_k3_desc:0 "For the first time the executive presents the legislature with a quadrennial national security strategy: threat assessment, priorities and budget. The parties’ questions finally revolve around the same document."
 TAI_n_k4l:0 "Dialogue First: Restarting Negotiations"
 TAI_n_k4l_desc:0 "Without political preconditions the other side is invited back to technical negotiations: fisheries, food safety, tourism and judicial assistance, one item at a time. Each agreement signed loosens the mood over the strait a little more."
 TAI_n_k4r:0 "Deterrence First: Raising the Cost of Conflict"
 TAI_n_k4r_desc:0 "The government declares that any use of force will carry an unbearable price. Defense budgets, civil defense and outreach are upgraded together, and in the other side’s assessment the words “quick victory” acquire a question mark."
 TAI_n_k5:0 "Responding to Gray-Zone Pressure along the Median Line"
 TAI_n_k5_desc:0 "The coast guard, air force and intelligence units set up joint monitoring and keep evidence and footage of every crossing and every unidentified vessel. Gray-zone coercion is logged item by item and becomes a fact the international community can see."
 TAI_n_k6:0 "Oversight of Cross-Strait Agreements and Civic Consensus"
 TAI_n_k6_desc:0 "Any political agreement across the strait must pass a double test: a special legislative majority and a referendum. Blue and green agree for the first time that major decisions cannot be made by a small group in a meeting room."
 TAI_n_f0:0 "The Asymmetric Warfare Framework"
 TAI_n_f0_desc:0 "The quadrennial defense review settles it: do not compete on numbers, compete on the price the adversary must pay. Small, dispersed, cheap and easily resupplied systems take the place of the “big platforms” the services were fighting over."
 TAI_n_f1a:0 "Mass Production of Coastal Anti-Ship Missiles"
 TAI_n_f1a_desc:0 "Mobile launchers, hidden shelters and firing positions that can move quickly along highways make one missile as threatening as a whole fleet. The production line, for the first time, runs three shifts."
 TAI_n_f1b:0 "The National Drone Team"
 TAI_n_f1b_desc:0 "Dozens of small and medium firms form an alliance to mass-produce reconnaissance, loitering-munition and maritime drones. Beyond the market leader, a supply chain that can be trusted is built."
 TAI_n_f1c:0 "The All-Out Defense Mobilization Agency"
 TAI_n_f1c_desc:0 "Reserve mobilization, civil defense and disaster response are merged into one agency. Once the call goes out, how many people are needed where and which roads can be used are all on one shared map."
 TAI_n_f2a:0 "Air Defense and Counter-Drone Networks"
 TAI_n_f2a_desc:0 "A high-altitude screen of Sky Bow and Patriot, plus a low-altitude one of shoulder-fired missiles and jammers. The sky above the cities is divided into layers, each with its own guard."
 TAI_n_f2b:0 "A Defense Technology Chain Made at Home"
 TAI_n_f2b_desc:0 "Critical components move from foreign suppliers to dual sourcing at home and among friends. Every part that “cannot be allowed to stop” is listed on a list that is never finished being updated."
 TAI_n_f2c:0 "Reorganizing the Reserve Forces"
 TAI_n_f2c_desc:0 "The reserve is no longer a unit that exists only in a roster but is organized by region, task and equipment and trains every year. When the call comes, a reservist knows which camp to report to."
 TAI_n_f3:0 "Force Preservation and Hardening of Critical Facilities"
 TAI_n_f3_desc:0 "Airfields, ports, command posts and power and telecom hubs are hardened, dispersed and backed up. What matters is not how hard the first day’s blow lands but whether things still run on the tenth."
 TAI_n_f4l:0 "Reorganizing the Defense of the Outlying Islands"
 TAI_n_f4l_desc:0 "Garrisons on Kinmen, Matsu, Penghu, Pratas and Taiping are tasked with delay and attrition, and supply depots, tunnels and harbors are renovated. The islands become the first line, and the one most in need of being seen."
 TAI_n_f4r:0 "Defense in Depth on the Main Island"
 TAI_n_f4r_desc:0 "Forces and equipment are concentrated on the main island’s beaches, airfields and cities, trading depth and mobility for time. Every township’s defense plan has first been war-gamed on the sand table."
 TAI_n_f5:0 "A Statutory Defense Budget"
 TAI_n_f5_desc:0 "A legal floor is set for defense spending as a share of GDP, together with an open procurement mechanism supervised by the legislature. The budget figure is no longer a yearly political trade."
 TAI_n_f6:0 "The Joint Defense Operations Command"
 TAI_n_f6_desc:0 "Land, sea, air, reserve, coast guard and civil defense take orders under one command system. Exercises for the first time run on “one map, one voice”, and every commander knows who is on their left and right."
 TAI_n_m0:0 "The Constitutional Reform Commission"
 TAI_n_m0_desc:0 "The articles of the constitution are a compromise from twenty years ago. A commission of cross-party and citizen representatives starts reviewing them clause by clause: the relation of president and legislature, the electoral system, the rank of rights."
 TAI_n_m1a:0 "Marriage Equality"
 TAI_n_m1a_desc:0 "After the Grand Justices declare the civil code unconstitutional, the legislature passes a special law and same-sex couples can register marriages. On the first day the household registration offices are crowded with people holding flowers."
 TAI_n_m1b:0 "Pension Reform"
 TAI_n_m1b_desc:0 "The separate pension schemes for military, civil servants, teachers, laborers and citizens are consolidated and replacement rates and contribution periods recalculated. No one is pleased, but the countdown to the funds’ bankruptcy is finally stretched."
 TAI_n_m1c:0 "Lay Participation and Transparent Courts"
 TAI_n_m1c_desc:0 "Serious criminal cases are tried jointly by judges and citizens, and verdicts are written in plain language and published online. Many people read, for the first time, a verdict they can understand."
 TAI_n_m2a:0 "Responding to Low Fertility and Public Childcare"
 TAI_n_m2a_desc:0 "Birth allowances, parental leave and public childcare places are all increased. The birth curve does not rebound at once, but on young couples’ ledgers raising a child is for the first time not a deficit."
 TAI_n_m2b:0 "A Long-Term Care System"
 TAI_n_m2b_desc:0 "Community day care, home services and institutional beds are woven into one network. National health insurance is Taiwan’s pride; long-term care is the second half of the chapter, not yet fully written."
 TAI_n_m2c:0 "Housing Justice"
 TAI_n_m2c_desc:0 "Social housing, rent subsidies and a hoarding tax are launched together. Young people in Taipei finally have an option other than “moving to New Taipei”."
 TAI_n_m3:0 "Ethnic Plurality and Language Equality"
 TAI_n_m3_desc:0 "Mandarin, Hokkien, Hakka, indigenous languages and the languages of new immigrants are all written into the National Languages Development Act. Announcements on buses go from three languages to five."
 TAI_n_m4l:0 "A Bilingual Nation and Twelve-Year Education"
 TAI_n_m4l_desc:0 "Primary and secondary schools offer English-immersion classes and universities teach in English. Students who study abroad are no longer a few, and those who return bring a world of perspective."
 TAI_n_m4r:0 "Digital Governance and the Ministry of Digital Affairs"
 TAI_n_m4r_desc:0 "ID, tax filing, health insurance and election notices are all handled from one entry point. Civic tech communities and the government maintain an open-source platform together."
 TAI_n_m5:0 "Regional Revitalization and Balanced Development"
 TAI_n_m5_desc:0 "The center and localities share tax revenue, and remote schools, clinics and small firms get steady support. The east coast and the outlying islands are, for the first time, not “places that are helped” but “places with plans of their own”."
 TAI_n_m6:0 "A Mature and Plural Democracy"
 TAI_n_m6_desc:0 "Elections are won and lost, policies are argued over, and minority rights are written into every law. Taiwan’s democracy is no longer merely a system but something that happens every day."
 TAI_n_e0:0 "The Economic Security Strategy"
 TAI_n_e0_desc:0 "Semiconductors, energy, food and critical minerals are placed on one economic security list. For the first time the government and firms sit down and write on a whiteboard what “cannot be allowed to stop”."
 TAI_n_e1a:0 "Supply-Chain Realignment and Friend-Shoring"
 TAI_n_e1a_desc:0 "Taiwanese firms move part of their lines to Vietnam, India and Mexico while core R&D and advanced processes stay on the island. The map of supply chains is redrawn."
 TAI_n_e1b:0 "Energy Security and Structural Transition"
 TAI_n_e1b_desc:0 "LNG terminals, offshore wind and solar expand together, while nuclear power’s future is left to civic debate and referendum. The power-supply numbers are discussed in public every month."
 TAI_n_e1c:0 "Water Resources and Industrial Land"
 TAI_n_e1c_desc:0 "Water-recycling plants, desalination and linked reservoirs are written into long-term budgets. When science parks assess new sites, the first question is no longer the tax rate but water."
 TAI_n_e2a:0 "The U.S.–Taiwan Initiative on 21st-Century Trade"
 TAI_n_e2a_desc:0 "Taipei and Washington conclude a first batch of agreements on trade facilitation, anti-corruption, small business and digital trade. A document between two partners who cannot formally recognize one another."
 TAI_n_e2b:0 "Applying to Join the Trans-Pacific Partnership"
 TAI_n_e2b_desc:0 "Taiwan files its accession application and reviews domestic regulations clause by clause against the high standard. Every member’s reply is covered by the media as a small diplomatic opinion poll."
 TAI_n_e2c:0 "The Taiwan–Japan Economic Partnership"
 TAI_n_e2c_desc:0 "Taiwan and Japan deepen cooperation in semiconductor equipment, tourism and disaster response, and firms from both sides form research and investment alliances. Donations and rescue after disasters are the most direct friendship between the two peoples."
 TAI_n_e3:0 "National Protection of Advanced Process Nodes"
 TAI_n_e3_desc:0 "The most advanced process technology is listed as a national core key technology, with review thresholds on exports and overseas fabs. The “mountain that guards the nation” now has a formal moat."
 TAI_n_e4l:0 "The Five-Plus-Two Innovative Industries"
 TAI_n_e4l_desc:0 "An Asian Silicon Valley, biomedicine, green energy, smart machinery and defense-aerospace, plus new agriculture and the circular economy, become the focus industries. Policy no longer chases the hottest topic but is built around the country’s own strengths."
 TAI_n_e4r:0 "Startup Funds and Small Business"
 TAI_n_e4r_desc:0 "The National Development Fund and venture capital jointly invest in seed rounds, so that every idea worth trying gets one chance. The startup meetups spill from one café into three."
 TAI_n_e5:0 "Regional R&D and Industrial Clusters"
 TAI_n_e5_desc:0 "Research institutes and firms in Hsinchu, Tainan, Kaohsiung and Taichung form clusters with a clear division of labor. A city need not learn everything, but each should do one thing better than anyone."
 TAI_n_e6:0 "A Resilient Economy"
 TAI_n_e6_desc:0 "Whether earthquake, typhoon, epidemic or blockade, the economy has a backup plan. The island no longer lives on one or two exports but on a whole network that repairs itself."
 TAI_n_i0:0 "The International Participation Framework"
 TAI_n_i0_desc:0 "Diplomacy is no longer the single task of “holding on to allies” but a whole with goals, budgets and a division of labor. The foreign ministry, trade offices and civic groups are put into one annual plan."
 TAI_n_i1a:0 "Europe–Taiwan Relations"
 TAI_n_i1a_desc:0 "The European Parliament passes pro-Taiwan resolutions, and delegations from the Czech Republic, Lithuania and Germany visit in turn. Europe’s image of Taiwan turns from a faraway place name into a concrete semiconductor factory."
 TAI_n_i1b:0 "Taiwan–Japan Maritime and Security Dialogue"
 TAI_n_i1b_desc:0 "Dialogue on coast guards, fisheries and disaster relief is institutionalized. The two countries’ fishing boats work the same waters under a set of rules they both follow."
 TAI_n_i1c:0 "Institutionalizing Relations with the United States"
 TAI_n_i1c_desc:0 "Visits by legislators, executive officials and think tanks are fixed into an annual U.S.–Taiwan dialogue. The pro-Taiwan caucus in Congress ensures the Taiwan Relations Act is more than an old document."
 TAI_n_i2a:0 "Allies in Central America and the Caribbean"
 TAI_n_i2a_desc:0 "Agriculture, medical missions and scholarships turn a small country on the other side of the globe into a good friend in many neighbors’ eyes. Amid the ups and downs of the number of allies, Taiwan learns for the first time not to rely on money."
 TAI_n_i2b:0 "Pacific Island and Southeast Asian Partners"
 TAI_n_i2b_desc:0 "Education, health and industry cooperation under the New Southbound policy reaches the Pacific islands and every corner of Southeast Asia. Overseas-born students, migrant workers and new immigrants become the liveliest link in these relations."
 TAI_n_i2c:0 "Substantive Participation in International Organizations"
 TAI_n_i2c_desc:0 "Observer seats at the World Health Assembly, ICAO and INTERPOL are put back on the agenda. Even when kept out of the conference rooms, Taiwan’s experts trade business cards with their counterparts around the world in the corridors."
 TAI_n_i3:0 "Taiwan Can Help"
 TAI_n_i3_desc:0 "Masks, vaccines, medical teams and post-disaster reconstruction. “Taiwan can help, and Taiwan is helping” is no longer merely a slogan but a team that has visited thirty countries in a year."
 TAI_n_i4l:0 "Digital Diplomacy and People-to-People Exchange"
 TAI_n_i4l_desc:0 "On social platforms, overseas representative offices and civic groups tell the story of everyday Taiwan in many languages. Every “made in Taiwan” export report comes with a visible face."
 TAI_n_i4r:0 "Taking Part in the Alliance of Democracies"
 TAI_n_i4r_desc:0 "Taiwan is invited to democratic forums and dialogues and shares its experience in elections, civic tech and epidemic response. The qualification for the invitation is democracy itself."
 TAI_n_i5:0 "Soft Power and International Visibility"
 TAI_n_i5_desc:0 "Film, music, food and design let the world for the first time get to know Taiwan not from news but from daily life. Bubble tea and national sovereignty are discussed at the same table."
 TAI_n_i6:0 "A Network of Substantive Diplomacy"
 TAI_n_i6_desc:0 "Countries with and without formal ties are, in Taiwan’s eyes, different nodes on one net. The number of formal recognitions matters, but being genuinely needed is the final report card of diplomacy."
 TAI_n_b0:0 "A Program of Stability and Prosperity"
 TAI_n_b0_desc:0 "The Kuomintang is back in power on a ballot that said one word: stability. The new government’s white paper has three chapters — the economy, the strait, international space — each with a timetable and a responsible minister."
 TAI_n_b1a:0 "Domestic Demand and Exports Together"
 TAI_n_b1a_desc:0 "Vouchers, infrastructure and export rebates arrive at once. Shop signs light up overnight and factories’ order books fill up three months ahead again."
 TAI_n_b1b:0 "Normalizing Cross-Strait Exchange"
 TAI_n_b1b_desc:0 "Mainland tourists, students and direct flights expand step by step, and the two quasi-official bodies resume regular talks. Arrival halls get announcements in two accents for the first time."
 TAI_n_b1c:0 "Fiscal Discipline and Tax Reform"
 TAI_n_b1c_desc:0 "Public debt gets a ceiling, the tax base widens and rates come down. The finance minister’s mantra: “every dollar saved today is confidence tomorrow.”"
 TAI_n_b2a:0 "Small Business and Youth Entrepreneurship"
 TAI_n_b2a_desc:0 "Low-interest loans and a “first bucket of gold” scheme give entrepreneurs in their twenties their first funding. Coworking spaces open one after another beside the night markets."
 TAI_n_b2b:0 "Negotiating the Cross-Strait Economic Framework"
 TAI_n_b2b_desc:0 "Openings for services and goods are negotiated item by item, with safeguards for farm and fishery products. Every round is attended by legislators and industry representatives."
 TAI_n_b2c:0 "Public Debt and Pension Balance"
 TAI_n_b2c_desc:0 "The pension funds’ actuarial reports are published yearly and adjustments are set by a cross-party group. For the first time all parties have looked at the same numbers."
 TAI_n_b3:0 "Rejuvenating and Modernizing the KMT"
 TAI_n_b3_desc:0 "Candidate selection, budgets and party assets are opened up, and young members for the first time become heads of district branches. The old party school’s corridors, for the first time, carry social-media posters."
 TAI_n_b4l:0 "Exploring a Peace Accord"
 TAI_n_b4l_desc:0 "The government invites scholars and former officials from both sides to form an unofficial panel on military confidence-building and a peace framework. The conclusions are unclear, but the table has been set."
 TAI_n_b4r:0 "A Security Floor under Limited Exchange"
 TAI_n_b4r_desc:0 "Exchange may grow but critical infrastructure, sensitive technology and military secrets have clear red lines. After every round of talks the security council issues a two-page assessment."
 TAI_n_b5:0 "Taking Part in Regional Economic Integration"
 TAI_n_b5_desc:0 "Bilateral agreements and industrial cooperation work around Taiwan’s exclusion from the big regional pacts. The island’s name begins to appear on more and more signboards in Southeast Asian industrial parks."
 TAI_n_b6:0 "A Stable and Prosperous Taiwan"
 TAI_n_b6_desc:0 "Exports are strong, prices steady and unemployment falling. People on the street do not cheer; the morning after the election they simply go to work as usual. That is perhaps what stability looks like at its best."
 TAI_n_g0:0 "A Program of Transformation and Autonomy"
 TAI_n_g0_desc:0 "The DPP’s governing program is titled “transform the state, reconcile the society”: energy, justice, education, defense and diplomacy each get a roadmap."
 TAI_n_g1a:0 "Continuing Transitional Justice"
 TAI_n_g1a_desc:0 "The transitional justice commission publishes an inventory of improperly held party assets, and files in the archive are digitized page by page. Some call it a settling of scores, others the repayment of a debt."
 TAI_n_g1b:0 "Energy Transition and a Nuclear-Free Homeland"
 TAI_n_g1b_desc:0 "Offshore wind and solar expand greatly, nuclear plants shut down in sequence, and gas terminals race to finish before winter. The utility’s dispatch room must watch wind speed and temperature at the same time for the first time."
 TAI_n_g1c:0 "The Forward-Looking Infrastructure Program"
 TAI_n_g1c_desc:0 "Rail, water, digital and urban-rural projects are folded into a long-term special budget. For the first time the construction sites in the center and south outnumber those in the north."
 TAI_n_g2a:0 "Defense Self-Reliance and Domestic Submarines"
 TAI_n_g2a_desc:0 "Shipyards, research institutes and private firms build their own submarines and ships. On launch day the welding sparks in the dock move people more than fireworks would."
 TAI_n_g2b:0 "The New Southbound Policy"
 TAI_n_g2b_desc:0 "Trade, investment, talent and education all point toward Southeast Asia, South Asia and Oceania. Indonesian and Vietnamese become the hottest second languages at universities."
 TAI_n_g2c:0 "Expanding Labor Rights and Social Welfare"
 TAI_n_g2c_desc:0 "The minimum wage, labor inspections and childcare subsidies all rise together. Union representatives are invited for the first time to the cabinet’s budget meetings."
 TAI_n_g3:0 "Institutionalizing Civic Participation"
 TAI_n_g3_desc:0 "Participatory budgeting, citizen deliberation and online petition platforms give even a small neighborhood issue a chance to reach a ministry’s agenda. Civic-tech communities and officials write code in the same meeting room."
 TAI_n_g4l:0 "Raising the Symbols of Sovereignty"
 TAI_n_g4l_desc:0 "The name of the state, passports, external names and the wording of official documents are debated again, and some groups demand a clearer assertion of sovereignty. Parades on the street come with green flags and warnings from across the strait."
 TAI_n_g4r:0 "The Pragmatic “ROC (Taiwan)” Framework"
 TAI_n_g4r_desc:0 "Building on the existing constitutional order, the government stresses democracy, freedom and the status quo abroad. “We do not need to declare independence because we are already a sovereign state” becomes the most quoted sentence in national security papers."
 TAI_n_g5:0 "Deeper Participation in the Alliance of Democracies"
 TAI_n_g5_desc:0 "Taiwan co-hosts election observation, cybersecurity and supply-chain exercises with other democracies. The ticket to be invited is that the country takes voting seriously every four years."
 TAI_n_g6:0 "The Taiwan Consensus"
 TAI_n_g6_desc:0 "In polls support for “maintaining the status quo” and “defending democracy” reaches a new high. Blue or green, most people agree that this society’s future is for this society to decide."
 TAI_n_p0:0 "A Middle-Way Program of Government"
 TAI_n_p0_desc:0 "Neither big camp has a majority, and the third force becomes the key to forming a government. The “neither blue nor green, pragmatic reform” program is printed as a pocket book that goes into every minister’s coat."
 TAI_n_p1a:0 "A Cross-Party Cabinet"
 TAI_n_p1a_desc:0 "The list of ministers comes from four parties and three independents. Seating at cabinet meetings is decided by lot."
 TAI_n_p1b:0 "Parliamentary Procedure Reform"
 TAI_n_p1b_desc:0 "Committee proceedings are fully public and the rules of party negotiation are written into standing orders. Bills are no longer “stuck” overnight in some procedure."
 TAI_n_p1c:0 "Pragmatic Industry and Technology Policy"
 TAI_n_p1c_desc:0 "It does not bet on one industry but prepares the same tools for every promising one: funding, talent and regulatory sandboxes. The government’s job is to pave the road, not to drive the car."
 TAI_n_p2a:0 "A Party Negotiation Mechanism"
 TAI_n_p2a_desc:0 "Major bills are first negotiated among the caucuses and the minutes are public. In the legislature’s corridors, lawmakers from different parties can be seen eating lunchboxes together for the first time."
 TAI_n_p2b:0 "A Third Way on the Strait"
 TAI_n_p2b_desc:0 "Using three keywords — “constitution”, “status quo” and “public opinion” — it offers a cross-strait approach different from blue and green: no preset destination, but a pledge not to change the status quo unilaterally."
 TAI_n_p2c:0 "An Energy Compromise"
 TAI_n_p2c_desc:0 "There is no rush to close nuclear plants and none to build new ones; a ten-year timetable adjusts slowly between supply security and decarbonization. The compromise leaves both camps equally dissatisfied."
 TAI_n_p3:0 "Party Realignment and the Growth of the Third Force"
 TAI_n_p3_desc:0 "A pivotal bloc of seats gives a small party outsized influence and makes voters seriously consider the option of “not voting for either big party”."
 TAI_n_p4l:0 "Local Factions and Grassroots Governance"
 TAI_n_p4l_desc:0 "The networks of township heads, farmers’ associations and irrigation associations are put under transparent budgeting and oversight. Grassroots ties still matter, but they must go on the record."
 TAI_n_p4r:0 "Electoral Reform: Mixed-Member Proportional Representation"
 TAI_n_p4r_desc:0 "The gap between vote share and seat share narrows and small parties finally have a stable foothold. Election night counts have far less “winner-takes-all” drama."
 TAI_n_p5:0 "Pragmatic External Relations"
 TAI_n_p5_desc:0 "Relations with the U.S., Japan and Europe advance between professional departments while politicians’ visibility drops. Any high-schooler can read the text of each trade agreement on the legislature’s website."
 TAI_n_p6:0 "The Third Way’s Report Card"
 TAI_n_p6_desc:0 "Some call it “the government that most resembles a state”, others say it lacks a soul. Either way it proves that beyond the two big camps there is still a stable way to govern."
 TAI_n_z0:0 "Democracy’s Second Twenty Years"
 TAI_n_z0_desc:0 "After two decades of elections, party turnover is no longer a shock but a rhythm. The next question: how does democracy stay young?"
 TAI_n_z1a:0 "Reviewing the Electoral System Again"
 TAI_n_z1a_desc:0 "Voting age, districting and candidate eligibility are discussed item by item in a citizens’ assembly. Every amendment is first taken apart in front of a thousand citizens chosen by lot."
 TAI_n_z1b:0 "Finalizing the Constitutional Order"
 TAI_n_z1b_desc:0 "After years of amendment disputes the relation of president and legislature, the fate of the control and examination bodies and the rank of rights finally have a text every party will sign."
 TAI_n_z1c:0 "Generational Justice and the Social Contract"
 TAI_n_z1c_desc:0 "Housing, pensions, low fertility and working conditions are discussed in one “generational contract”. Young people are for the first time a party in the budget talks rather than a headline."
 TAI_n_strait_framework:0 "Institutionalized Cross-Strait Policy"
 TAI_n_strait_framework_desc:0 "Cross-strait policy follows procedure, with fewer personal swings."
 TAI_n_derisk:0 "Diversified Trade Risk"
 TAI_n_derisk_desc:0 "Exports reach more destinations, though some capacity goes into the transition."
 TAI_n_dialogue_first:0 "Dialogue First"
 TAI_n_dialogue_first_desc:0 "Talks and exchange calm the situation, though some find it not firm enough."
 TAI_n_deterrence_first:0 "Deterrence First"
 TAI_n_deterrence_first_desc:0 "Society understands the cost of conflict, and the army is more confident."
 TAI_n_greyzone:0 "Gray-Zone Response"
 TAI_n_greyzone_desc:0 "Every crossing is recorded, which makes every probe harder to pull off."
 TAI_n_strait_consensus:0 "Cross-Strait Consensus Mechanism"
 TAI_n_strait_consensus_desc:0 "Major decisions are tested by both legislature and citizens, and society feels more secure."
 TAI_n_asym_doctrine:0 "Asymmetric Warfare"
 TAI_n_asym_doctrine_desc:0 "Small, dispersed forces and equipment are harder to destroy with one blow."
 TAI_n_coastal_missiles:0 "Coastal Anti-Ship Missiles"
 TAI_n_coastal_missiles_desc:0 "A landing fleet pays a price before it reaches the beach."
 TAI_n_drone_team:0 "The National Drone Team"
 TAI_n_drone_team_desc:0 "Low-cost unmanned systems change the arithmetic of the battlefield."
 TAI_n_reserve_reform:0 "The Reserve Force"
 TAI_n_reserve_reform_desc:0 "Reservists know in peacetime where they go in war."
