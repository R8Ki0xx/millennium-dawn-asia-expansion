l_english:
 SYR2_air_defence_reform_idea:0 "Air Defence Forces Reorganised"
 SYR2_air_defence_reform_idea_desc:0 "Air defence is split off from the air force with its own radar net and chain of command. Radar stations are no longer a decoration for the capital."
 SYR2_al_qaeda1_idea:0 "Zawahiri in Person"
 SYR2_al_qaeda1_idea_desc:0 "The organisation's chief ideologue arrives in Syria in person. Young fighters treat him as a living legend, and Western satellites begin photographing every mountain road."
 SYR2_al_qaeda_idea:0 "The Al-Qaeda Network"
 SYR2_al_qaeda_idea_desc:0 "Veterans, money and clandestine supply lines flow into Syria from Afghanistan, Iraq and Yemen. They bring experience, and the hostility of the entire world."
 SYR2_arab_union_idea:0 "The Union Reborn"
 SYR2_arab_union_idea_desc:0 "The flag of the \"United Arab Republic\" rises again, with a single foreign policy, army and currency. Idealists weep with joy and bureaucrats begin to worry about the merged budget."
 SYR2_capital_defence_idea:0 "Defence of the Capital"
 SYR2_capital_defence_idea_desc:0 "A second ring of defences has taken shape around Damascus: fortified strongpoints, underground command posts and a mobile reserve tied to the Republican Guard."
 SYR2_cement_industry_idea:0 "Cement and Building Materials"
 SYR2_cement_industry_idea_desc:0 "New cement kilns and prefab plants mean rebuilding no longer waits on imports. Construction becomes the sector that employs the most people and pays off the fastest."
 SYR2_charity_idea:0 "Religious Charity"
 SYR2_charity_idea_desc:0 "Mosque foundations and charities are brought under one framework: soup kitchens, scholarships, orphanages and clinics give the movement flesh and blood in the neighbourhoods."
 SYR2_commercial_bank_idea:0 "Commercial Bank of Syria Reformed"
 SYR2_commercial_bank_idea_desc:0 "The state-owned Commercial Bank of Syria adopts commercial credit review and external audits. Bad debts come to light, but new loans finally reach firms that can repay them."
 SYR2_construction_reform_idea:0 "Construction Sector Reform"
 SYR2_construction_reform_idea_desc:0 "Unified building codes, transparent tendering and vetting of contractors squeeze out layers of sub-contracting. Both quality and speed of works improve."
 SYR2_defence_ministry_idea:0 "Ministry of Defence Reform"
 SYR2_defence_ministry_idea_desc:0 "The Ministry of Defence is no longer just a social club for generals: procurement, training and logistics each get a civilian deputy, and every budget line must be explained."
 SYR2_energy_ministry_idea:0 "A Unified Energy Ministry"
 SYR2_energy_ministry_idea_desc:0 "Electricity, oil and gas used to belong to four ministries that blamed each other. A single Energy Ministry has one budget and one accountable minister, and blackouts can finally be traced."
 SYR2_european_education_idea:0 "European Educational Assistance"
 SYR2_european_education_idea_desc:0 "Scholarships, joint degrees and teacher training come to Damascus from Paris, London and Berlin. This generation of students will know the outside world better than the last."
 SYR2_gas_company_idea:0 "The Syrian Gas Company"
 SYR2_gas_company_idea_desc:0 "A national gas company takes over the scattered fields and processing plants, buying and pricing as one. It finally has the weight to negotiate with foreign contractors."
 SYR2_golan_fortress_idea:0 "The Golan Fortress Belt"
 SYR2_golan_fortress_idea_desc:0 "From the foot of Mount Hermon to the Yarmouk valley, concrete bunkers, anti-tank ditches and lookouts form a continuous line. Holding it is a mission the Syrian army has never abandoned."
 SYR2_green_syria_idea:0 "The \"Green Syria\" Project"
 SYR2_green_syria_idea_desc:0 "From the Palmyra desert to the Euphrates valley, rows of solar panels rise. Energy independence is no longer just a slogan; it is a bargaining chip for exporting power to Europe."
 SYR2_guardians_idea:0 "Guardians of the Revolution"
 SYR2_guardians_idea_desc:0 "A volunteer guard sworn to the constitution holds the capital's key points against remnants of the old regime and would-be new strongmen."
 SYR2_gulf_capital_idea:0 "Gulf Capital"
 SYR2_gulf_capital_idea_desc:0 "Qatari and Emirati holding companies set up headquarters in Damascus, investing in hotels, logistics and property."
 SYR2_int_jihadists_idea:0 "International Jihadists"
 SYR2_int_jihadists_idea_desc:0 "Foreign fighters pour over the Turkish and Iraqi borders in batches. The front gains assault squads who do not speak Arabic, and the government gains a great many problems that nobody is responsible for."
 SYR2_islamic_bank_idea:0 "The First Islamic Bank"
 SYR2_islamic_bank_idea_desc:0 "A bank that charges no interest and shares profits attracts Gulf capital and devout savers who never wanted to put money in state banks."
 SYR2_islamic_democracy_idea:0 "Islamic Democracy"
 SYR2_islamic_democracy_idea_desc:0 "Ankara's example persuades people that a pious party can win a majority at the ballot box and sit at one table with merchants, generals and foreign investors."
 SYR2_israeli_intel_idea:0 "Liaison with the Mossad"
 SYR2_israeli_intel_idea_desc:0 "Counter-terror intelligence sharing seats the two countries' security services at one table for the first time. Some call it realism; others call it betrayal."
 SYR2_kurdish_appeasement_idea:0 "Kurdish Appeasement"
 SYR2_kurdish_appeasement_idea_desc:0 "Schools, clinics and microloans reach Kurdish villages in the northeast. The centre's aim is clear: welfare for quiet, winning hearts without giving up control."
 SYR2_maher_economy_idea:0 "The Elite's Business"
 SYR2_maher_economy_idea_desc:0 "State contracts go to a handful of families who do business over dinner in Damascus and trade loyalty for monopoly. The accounts look fine while resentment accumulates in the street."
 SYR2_minorities_legion_idea:0 "The Assyrian Legion"
 SYR2_minorities_legion_idea_desc:0 "Local forces made up largely of Christians and Assyrians handle border patrols and village defence, becoming the government's \"own people\" in the northeast."
 SYR2_mushriq_idea:0 "The Hunt for Heretics"
 SYR2_mushriq_idea_desc:0 "The religious police are ordered to track down everyone who will not repent. Minority sects in the cities pack their bags overnight, and the border camps receive a fresh wave of arrivals."
 SYR2_npf_police_idea:0 "The Apparatus of Repression"
 SYR2_npf_police_idea_desc:0 "Police, intelligence officers and party cadres are rewoven into a fine mesh. Even a corner-shop owner knows who is listening and who is taking notes."
 SYR2_nuclear_deterrent_idea:0 "The Syrian Deterrent"
 SYR2_nuclear_deterrent_idea_desc:0 "The success of the nuclear programme gives Damascus a card nobody at the table can ignore, and turns the eyes of every intelligence agency in the region towards it."
 SYR2_pal_camps_idea:0 "Palestinian Training Camps"
 SYR2_pal_camps_idea_desc:0 "Camps outside Damascus take in young men from every faction. Syrian officers gain combat experience from them, and a ledger that is hard to explain to the outside world."
 SYR2_pan_islamism_idea:0 "Pan-Islamism"
 SYR2_pan_islamism_idea_desc:0 "The borders drawn by colonial officials are not the will of God. Mosques and seminaries link into a network across states, carrying Syria's voice farther and keeping neighbouring intelligence services awake at night."
 SYR2_particle_liberal_idea:0 "A Partially Liberalised Economy"
 SYR2_particle_liberal_idea_desc:0 "Small and medium businesses regain their freedom while strategic sectors remain in state hands. It is not shock therapy but a slow medicine."
 SYR2_pipeline_idea:0 "Cross-Border Gas Pipeline"
 SYR2_pipeline_idea_desc:0 "The pipeline crosses more than desert; it crosses politics, and every valve has someone watching it. Income is steady, but whoever can turn off the valve holds Syria's purse."
 SYR2_purge_traitors_idea:0 "Purging the Traitors"
 SYR2_purge_traitors_idea_desc:0 "Knocks at night, vanished names, erased photographs. The new order deals with the \"unfaithful\" quietly."
 SYR2_quds_brigade_idea:0 "The Al-Quds Brigade"
 SYR2_quds_brigade_idea_desc:0 "A Syrian special brigade drawn from the sons of Palestinian refugees. Their attachment to their homeland is the best source of morale and the most dangerous political variable."
 SYR2_qutb_idea:0 "The Qutbist Vanguard"
 SYR2_qutb_idea_desc:0 "A small circle of believers treats \"modern ignorance\" as the enemy and itself as the vanguard of a new society. Their discipline and zeal are real; who they can live alongside is another matter."
 SYR2_righteous_jihad_idea:0 "The Righteous Jihad"
 SYR2_righteous_jihad_idea_desc:0 "Volunteers from afar are folded into the brigades and fight beside local men. Their conviction is the best morale there is, and their accents are a constant reminder that this war does not belong to Syria alone."
 SYR2_riot_police_idea:0 "Riot-Police Equipment"
 SYR2_riot_police_idea_desc:0 "Helmets, shields and tear gas make street policing more orderly, and repression more efficient."
 SYR2_saudi_friend_idea:0 "Friendship of Riyadh"
 SYR2_saudi_friend_idea_desc:0 "Saudi money, conservative political backing and petrodollar investment flow into Syria's accounts. In return Damascus chooses to have no opinion on many questions."
 SYR2_secular_syria_idea:0 "A Secular Syria"
 SYR2_secular_syria_idea_desc:0 "Religion is a matter of conscience and the state a matter of law. Scholars, writers and engineers are invited onto advisory boards to discuss what a state at arm's length from dogma should look like."
 SYR2_securities_exchange_idea:0 "The Damascus Securities Exchange"
 SYR2_securities_exchange_idea_desc:0 "After the opening bell, a few dozen firms list their shares in public for the first time. Volumes are small, but \"listing\" makes private owners feel, for once, that their property is more than a by-product of political connections."
 SYR2_shia_militias_idea:0 "Shia Militias"
 SYR2_shia_militias_idea_desc:0 "Volunteers from Iraq, Lebanon and Afghanistan fight on every Syrian front, paid and armed from Tehran."
 SYR2_special_forces_idea:0 "New Special Forces"
 SYR2_special_forces_idea_desc:0 "The best officers from the Republican Guard and the paratroopers are drawn into an independent special forces command in Homs, answering directly to the General Staff."
 SYR2_ssnp_economy_idea:0 "The National Economy"
 SYR2_ssnp_economy_idea_desc:0 "The nation before the individual: key factories, ports and oilfields are put under the national interest, with profits spent on defence and infrastructure rather than private pockets."
 SYR2_ssnp_idea:0 "The SSNP Returns"
 SYR2_ssnp_idea_desc:0 "The Syrian Social Nationalist Party, banned for decades, returns to the streets. Its whirlwind emblem appears in barracks, schools and ministries, the most loyal shock force of the regime."
 SYR2_ssnp_propaganda_idea:0 "The \"Syrian Lion\" Propaganda"
 SYR2_ssnp_propaganda_idea_desc:0 "The Turkish president calls his methods \"savagery\", and he accepts the title with pride: a lion does not care what sheep think. Television, posters and textbooks tell the story of the lion together."
 SYR2_state_feminism_idea:0 "State Feminism"
 SYR2_state_feminism_idea_desc:0 "Textbooks are rewritten and state media receive clear instructions: talent has no gender. Few believed this top-down campaign at first; later more and more girls entered university."
 SYR2_syrian_democracy_idea:0 "The New Syrian Democracy"
 SYR2_syrian_democracy_idea_desc:0 "Elections, newspapers and courts are polished one by one to show the world an \"Arab democracy such as has never existed\". The stage is bright; not all the lights backstage are on yet."
 SYR2_trader_support_idea:0 "Trust of the Merchants"
 SYR2_trader_support_idea_desc:0 "The bazaars of Damascus and Aleppo reopen with lower internal tariffs and secured markets. Merchants wait and watch before slowly moving their money back home."
 SYR2_uae_specialists1_idea:0 "Advanced Training Programmes"
 SYR2_uae_specialists1_idea_desc:0 "The training scheme becomes a joint officer academy, sending a batch of officers each year to the Gulf and Europe for further study."
 SYR2_uae_specialists_idea:0 "Emirati Specialists"
 SYR2_uae_specialists_idea_desc:0 "Former Western officers and engineers hired by the UAE teach modern military management at training bases outside Damascus."
 SYR_A_New_Idealogical_Image:0 "A New Ideological Image"
 SYR_A_New_Idealogical_Image_desc:0 "The world has seen only the sword; we will show it the pen. A new Syria where justice is Sharia and mercy is law. We open our schools, courts and markets to those who wish to understand."
 SYR_Affordable_Social_Care:0 "Affordable Social Care"
 SYR_Affordable_Social_Care_desc:0 "A woman in power means caring for the vulnerable. Bushra expands the network of social institutions, makes healthcare more accessible and introduces benefits for large families."
 SYR_Al_Nursa_Front:0 "The Nusra Front"
 SYR_Al_Nursa_Front_desc:0 "The Nusra Front is disciplined and formidable, the vanguard of the armed struggle. Its tactical skill and ideological fervour are the sharpest tools for toppling the old regime, and the hardest knife to take back later."
 SYR_Al_Qaeda_Dilemma:0 "The Al-Qaeda Dilemma"
 SYR_Al_Qaeda_Dilemma_desc:0 "The jihadists who fought beside us demand their place. Their methods are harsh and their loyalty absolute. To embrace them is to risk the world's condemnation; to reject them is to fracture the coalition. The choice will define us."
 SYR_Al_Qaeda_Network:0 "The Al-Qaeda Network"
 SYR_Al_Qaeda_Network_desc:0 "Tapping the global Al-Qaeda network brings veteran fighters, clandestine funding and decades of asymmetric-warfare experience across the Islamic world. The price is that everyone will see us as part of it."
 SYR_Alawi_Dominance:0 "Alawi Dominance"
 SYR_Alawi_Dominance_desc:0 "The Alawis must now dominate and lead the SSNP toward its new, reformed ideological position. Core posts are filled only by reliable hands."
 SYR_All_for_the_Nation:0 "All for the Nation"
 SYR_All_for_the_Nation_desc:0 "We must focus the economy not on our personal needs but on the needs of our people."
 SYR_Appease_the_Kurds:0 "Appease the Kurds"
 SYR_Appease_the_Kurds_desc:0 "Syria pursues a policy of appeasing the Kurdish population through social programmes, aiming to prevent conflict and integrate the Kurds into the state while preserving central control."
 SYR_Bring_SSNP:0 "Bring SSNP"
 SYR_Bring_SSNP_desc:0 "The SSNP is the most national and loyal political force in Syria and wants to make Syria truly great. Its political goals align fully with Maher's ambitions."
 SYR_Bring_more_International_Jihadists:0 "Bring in More International Jihadists"
 SYR_Bring_more_International_Jihadists_desc:0 "The caliphate is a force in the region, but it is not alone. Welcoming still more jihadists from across the world swells the ranks and spreads the cause."
 SYR_Call_to_Qatar:0 "Call to Qatar"
 SYR_Call_to_Qatar_desc:0 "Doha has the money and media reach to change the course of the conflict. A formal appeal brings investment and diplomatic legitimacy, along with a few uncomfortable conditions."
 SYR_Conservative_Femenism:0 "Conservative Feminism"
 SYR_Conservative_Femenism_desc:0 "Bushra proposes a Syrian path to women's emancipation: without breaking with tradition, without aggressive Western radicalism, but with real rights and opportunities. A woman can be the guardian of the hearth and a minister."
 SYR_Contraband_Imports:0 "Contraband Imports"
 SYR_Contraband_Imports_desc:0 "Maher will use personal connections to smuggle goods in and out of Syria to maintain strategic autonomy of the economy. It will upset the population, as the profits will be out of their hands."
 SYR_Cover_Up_the_Hama_Incident:0 "Cover Up the Hama Incident"
 SYR_Cover_Up_the_Hama_Incident_desc:0 "The Hama affair must be buried beneath official silence and disciplined storytelling. By controlling the narrative the regime shields itself from scandal and preserves the myth of order."
 SYR_Crackdown_of_Freedom:0 "Crackdown of Freedom"
 SYR_Crackdown_of_Freedom_desc:0 "We must show that any opposition and petty democratic movements have no say in this country any more. Syria will be strong and sovereign!"
 SYR_Crush_Gender_Prejudices:0 "Crush Gender Prejudices"
 SYR_Crush_Gender_Prejudices_desc:0 "In a society where a woman in power seemed impossible only yesterday, Bushra starts with the basics: education and propaganda. School curricula are rewritten and state media get clear instructions: talent has no gender."
 SYR_Distance_from_Salafits:0 "Distance from the Salafists"
 SYR_Distance_from_Salafits_desc:0 "Radical elements are effective in battle, but their extreme ideology risks alienating moderate citizens and potential partners. We must publicly separate our political aims from their sectarian agenda."
 SYR_Egyptian_Experience:0 "Egyptian Experience"
 SYR_Egyptian_Experience_desc:0 "Rifaat sees similarities between himself and the Egyptian leader: both are Western-style autocrats struggling for power in an unstable region. Studying the Egyptian regime's methods will steady his rule."
 SYR_Embrace_Secular_Thought:0 "Embrace Secular Thought"
 SYR_Embrace_Secular_Thought_desc:0 "Religion is a matter of conscience; the state is a matter of law. Bushra declares a course toward deeper secular principles, separating politics from dogma and inviting the intelligentsia to dialogue."
 SYR_Ensure_Saudi_Ties:0 "Ensure Saudi Ties"
 SYR_Ensure_Saudi_Ties_desc:0 "Riyadh is a source of money, influence and conservative backing that cannot be ignored. An understanding with Saudi Arabia could strengthen the regime and steady the economy."
 SYR_Ensure_Women_Representation:0 "Ensure Women's Representation"
 SYR_Ensure_Women_Representation_desc:0 "Words must be backed by deeds. A mandatory quota for women in parliament, the civil service and the courts is introduced. Bushra's voice now has a thousand reflections."
 SYR_Establish_Local_Electoral_Councils:0 "Establish Local Electoral Councils"
 SYR_Establish_Local_Electoral_Councils_desc:0 "A network of local electoral councils serves a dual purpose: it gives the population the appearance of democratic participation while strengthening state control through a networked system of governance."
 SYR_Establish_Militiry_Political_Autonomy:0 "Establish Military Political Autonomy"
 SYR_Establish_Militiry_Political_Autonomy_desc:0 "The armed forces gain political and financial autonomy and become an independent branch of power. The military may set national security strategy on its own and control a significant portion of state resources."
 SYR_Exclusive_British_Partnership_with_Syria:0 "Exclusive British Partnership with Syria"
 SYR_Exclusive_British_Partnership_with_Syria_desc:0 "Rifaat sends a delegation to London proposing an exclusive partnership: Syria offers Britain access to its ports, profitable investments and strategic cooperation across the Eastern Mediterranean."
 SYR_Form_Hayat_Tashir_al_Sharm:0 "Form Hayat Tahrir al-Sham"
 SYR_Form_Hayat_Tashir_al_Sharm_desc:0 "The banners of Hayat Tahrir al-Sham rise over Damascus. Seasoned revolutionaries take the reins, and fighters, scholars and survivors of Hama unite under a single flag."
 SYR_Implement_Hudud:0 "Implement Hudud"
 SYR_Implement_Hudud_desc:0 "Hudud is the system of penal law of an Islamic state. Implementing it nationwide aligns the law fully with the sharia, and the international community will reassess us accordingly."
 SYR_Integrate_Jihadists:0 "Integrate the Jihadists"
 SYR_Integrate_Jihadists_desc:0 "The warriors who came from distant lands to bleed for Syria will not be cast aside. We will bring them into the fold, not as guests but as brothers, and their zeal will become our strength."
 SYR_Intelligence_Links:0 "Intelligence Links"
 SYR_Intelligence_Links_desc:0 "As Hafez's daughter Bushra has known the value of information since childhood. She sets up personal channels with the Mukhabarat, turning the secret services from a tool of fear into a tool for overseeing reforms."
 SYR_Invite_Ayman_al_Zawahiri:0 "Invite Ayman al-Zawahiri"
 SYR_Invite_Ayman_al_Zawahiri_desc:0 "The organisation's chief ideologue is invited to Syria. His arrival is a banner and a target at once, and every operation from now on will be put on his account."
 SYR_Islamic_Demorcracy:0 "Turkish-Inspired Islamism"
 SYR_Islamic_Demorcracy_desc:0 "We will draw on the Islamist movements that rose in Turkey after the republic was founded. It makes our movement look more moderate and may attract conservative Turkish businessmen."
 SYR_Islamic_Umbrella:0 "The Islamic Umbrella"
 SYR_Islamic_Umbrella_desc:0 "Not everyone who fights for Islam agrees on the path: Salafists, traditionalists and Brothers each hold a piece of the truth. We will gather them under one umbrella, a front strong enough to rule."
 SYR_Judical_Fair_Reform:0 "Judicial Fair Reform"
 SYR_Judical_Fair_Reform_desc:0 "An independent judiciary is the foundation of progress. Bushra purges corrupt judges and appoints principled jurists who rule by law, not by telephone call."
 SYR_Listen_to_Sami_al_Oraydi:0 "Listen to Sami al-Oraydi"
 SYR_Listen_to_Sami_al_Oraydi_desc:0 "Al-Oraydi is a leading voice of caliphate ideology and permits no compromise. Following his guidance means every future negotiation must pass his scrutiny first."
 SYR_Nationalwide_Charity:0 "Nationwide Religious Charity"
 SYR_Nationalwide_Charity_desc:0 "Our movements have always been tied to charities and foundations. With a more prominent position we will institutionalise them to ease the economic burden."
 SYR_New_Cultural_Policy:0 "New Cultural Policy"
 SYR_New_Cultural_Policy_desc:0 "We must create a new culture in Syria by rooting out all Islamic influence and restoring the culture forgotten long ago."
 SYR_Oil_Concentrarion:0 "Oil Concentration"
 SYR_Oil_Concentrarion_desc:0 "We must concentrate on oil production and refining to secure energy independence. This may harm other sectors of the economy, but it is necessary for our future."
 SYR_Only_Path_in_Rabaniya:0 "The Only Path: Rabbaniyya"
 SYR_Only_Path_in_Rabaniya_desc:0 "The concept of Rabbaniyya holds that all authority flows from divine governance. On this path we reshape society so that every law and every act conforms to the sovereignty of the Creator."
 SYR_Our_Path_to_Caliphate:0 "Our Path to the Caliphate"
 SYR_Our_Path_to_Caliphate_desc:0 "The path to the caliphate is clear. We will follow the footsteps of the Prophet and his companions and carry the word of God to the whole world."
 SYR_PLA_support:0 "PLA Support"
 SYR_PLA_support_desc:0 "The Palestine Liberation Army is part of the Syrian army and a tool of Syrian influence in Palestinian politics. Orders to expand and re-equip it come from the defence ministry; the conditions are in another file."
 SYR_Pan_Islamists_Efforts:0 "Pan-Islamist Efforts"
 SYR_Pan_Islamists_Efforts_desc:0 "The borders imposed on us are artificial constructs. We will devote our efforts to unity of the whole Ummah, beyond national divides, forming one front against outside aggression."
 SYR_Pardon_All_Relatives:0 "Pardon All Relatives"
 SYR_Pardon_All_Relatives_desc:0 "Years of exile and family feuds come to an end. Rifaat extends a hand of reconciliation to every member of the Assad clan who was exiled or persecuted, and declares a general amnesty."
 SYR_Partical_Economic_Liberalization:0 "Partial Economic Liberalization"
 SYR_Partical_Economic_Liberalization_desc:0 "Bushra understands that the state cannot manage every shop. Small and medium businesses gain freedom while strategic sectors stay under state control. This is not shock therapy but treatment."
 SYR_Personal_Deals:0 "Personal Deals"
 SYR_Personal_Deals_desc:0 "Maher will focus on the needs of the elite and the oligarchy and will keep the country strong and prosperous as long as he is in power."
 SYR_Promote_the_Minorities:0 "Promote the Minorities"
 SYR_Promote_the_Minorities_desc:0 "The Alawis, Christians, Assyrians and Druzes have bled for this nation while the so-called majority whispered prayers for our downfall. Under Maher every loyal minority will be elevated."
 SYR_Radicalize_the_Ulema:0 "Radicalize the Ulema"
 SYR_Radicalize_the_Ulema_desc:0 "The ulema are the transmitters of caliphate ideology. Making them more radical carries the doctrine faster into every neighbourhood. It is expensive, and so are the consequences."
 SYR_Reestablish_Western_Ties:0 "Restoring Western Relations"
 SYR_Reestablish_Western_Ties_desc:0 "After years of isolation and conflict Syria needs to restore diplomatic and economic ties with the Western powers. Rifaat, a Western-style autocrat, understands the value of cooperation."
 SYR_Remain_Independent:0 "Remain Independent"
 SYR_Remain_Independent_desc:0 "Syria must not become a satellite of foreign powers. We will navigate the complex geopolitical landscape, balance competing interests, and keep our destiny in our own hands."
 SYR_Restore_Latakia_Network:0 "Restore Latakia Network"
 SYR_Restore_Latakia_Network_desc:0 "Latakia, Syria's principal seaport, becomes the centre of an ambitious plan: modernising port facilities, expanding storage complexes and rebuilding trading networks."
 SYR_Social_Militarism:0 "Social Militarism"
 SYR_Social_Militarism_desc:0 "Social militarism must now be Syria's governing ideological and economic strategy. The wall between the army and society is torn down and the barracks become the nation's classroom."
 SYR_State_Propoganda:0 "Syrian Savage"
 SYR_State_Propoganda_desc:0 "The Turkish president calls Maher's actions close to \"savagery\". Maher will carry the title proudly, for a savage lion does not care for the opinion of the sheep. It will be our new propaganda theme."
 SYR_Steps_to_Democratization:0 "Steps to Democratization"
 SYR_Steps_to_Democratization_desc:0 "Democratisation will be introduced carefully and in controlled steps that do not threaten the regime's core authority. The process is meant to show reform while keeping the state firmly in trusted hands."
 SYR_Stomp_Out_Islamists:0 "Stomp Out Islamists"
 SYR_Stomp_Out_Islamists_desc:0 "They hid behind minarets and called it faith; they smuggled weapons beneath prayer rugs and called it resistance. Maher will not negotiate with fanatics. He will root them out, mosque by mosque and village by village."
 SYR_Support_Opposition_in_Iraq:0 "Support Opposition in Iraq"
 SYR_Support_Opposition_in_Iraq_desc:0 "Through covert operations and money, Syria will strengthen opposition forces in Iraq, weakening the Iraqi government while expanding its own influence."
 SYR_Support_the_Traders:0 "Support the Traders"
 SYR_Support_the_Traders_desc:0 "The merchant classes of Damascus and Aleppo are the lifeblood of the economy. Give them security and lower internal tariffs, and the markets steady and the treasury gains a reliable flow."
 SYR_Syrian_Legacy:0 "Syrian Legacy"
 SYR_Syrian_Legacy_desc:0 "Syria's true identity lies not in the Arab conquests but in the ancient civilisations that once flourished here. We will forge a new Syrian nationalism rooted in the heritage of Assyria, Babylon and Mesopotamia."
 SYR_Syrian_Muslim_Brotherhood:0 "The Muslim Brotherhood"
 SYR_Syrian_Muslim_Brotherhood_desc:0 "The Islamist opposition coalition has won the vote. Veterans of long exile and the cadres of the underground network are finally entrusted with leading Syria toward a conservative Islamic republic."
 SYR_Syrian_Seculirization:0 "Secularization"
 SYR_Syrian_Seculirization_desc:0 "Secularisation of the state aims to separate religion from politics and public life. Secular education, Western values and a scientific approach become the regime's new ideology, marginalising religious institutions."
 SYR_Syrian_Trade_Hub_Project:0 "Syrian Trade Hub Project"
 SYR_Syrian_Trade_Hub_Project_desc:0 "Building a comprehensive trading centre turns Syria into a key commercial hub. Port development, modern logistics and commercial facilities let Syria dominate regional trade flows."
 SYR_Teachings_of_Qutb:0 "Teachings of Qutb"
 SYR_Teachings_of_Qutb_desc:0 "The writings of Sayyid Qutb are a wake-up call against modern jahiliyya. Embracing them means preparing a vanguard for total struggle against every man-made tyranny."
 SYR_Turkish_Normalization_Negotation:0 "Turkish Normalization Negotiation"
 SYR_Turkish_Normalization_Negotation_desc:0 "Old tensions with Ankara give way to cautious bargaining and practical compromise. Normalisation with Turkey could secure the border, reduce pressure and open the door to regional stability."
 SYR_al_douri_support:0 "Support for al-Douri's Faction"
 SYR_al_douri_support_desc:0 "Old Ba'athists from the other side of the border find shelter in Damascus. Syria pays them in money and weapons for their influence on Baghdad's politics."
 SYR_appease_the_west:0 "Appease the West"
 SYR_appease_the_west_desc:0 "To survive we must sometimes hide our intentions. We will convince the great powers that our stability is preferable to chaos; strategic concessions and moderate rhetoric are tools of consolidation, not weakness."
 SYR_approach_bahrain:0 "Approach Bahrain"
 SYR_approach_bahrain_desc:0 "Bahrain is the Gulf state most willing to do business with Syria. Bankers in its financial centre invite their Syrian counterparts to Manama."
 SYR_approach_pakistan:0 "Approach Pakistan"
 SYR_approach_pakistan_desc:0 "Islamabad and Damascus sign an agreement on officer training and counter-terror cooperation. Pakistan sees Syria as another door to the Arab world."
 SYR_approach_uae:0 "Approach the UAE"
 SYR_approach_uae_desc:0 "Abu Dhabi is willing to cooperate with Syria without political conditions. After a friendly visit the two sides open commercial offices in each other's capitals."
 SYR_army_bunker:0 "Strengthen the Capital"
 SYR_army_bunker_desc:0 "History tells Syria's rulers that whoever holds Damascus holds the state. The General Staff approves a layered defence plan around the capital."
 SYR_army_minobr:0 "Reform of the Ministry of Defense"
 SYR_army_minobr_desc:0 "Each service has been reformed; what remains is the Ministry of Defence itself. Procurement, training and logistics go under civilian deputies and the budget is reported to the presidency every quarter."
 SYR_army_pvo:0 "Reform Air Defense Forces"
 SYR_army_pvo_desc:0 "Air defence battalions used to be scattered across military districts with mixed equipment and no unified command. After the reform they are a separate service with its own research and procurement budget."
 SYR_army_special_forces:0 "Creation of Special Forces"
 SYR_army_special_forces_desc:0 "Conventional units excel at big battles and not at a night raid. The General Staff decides to gather the academy's best graduates into a directly controlled special forces unit."
 SYR_ask_israel:0 "Appeal to Israeli Expertise"
 SYR_ask_israel_desc:0 "It is the option nobody dares say aloud: Israel has the most mature nuclear and dual-use technology in the region. Secret contacts take place in a Geneva hotel, and both sides are especially careful about the word \"private\"."
 SYR_ask_kdpr:0 "Seek Korean Assistance"
 SYR_ask_kdpr_desc:0 "Pyongyang has always been willing to help any client with hard currency. A group of \"construction contractors\" and \"irrigation engineers\" lands in Damascus, and nobody wants to ask what exactly they will build."
 SYR_ask_pakistan:0 "Pakistani Nuclear Expertise"
 SYR_ask_pakistan_desc:0 "Scientists in Islamabad know what it is to build a weapon from nothing, and are generous towards brother nations of the Islamic world. A few retired engineers are invited to Homs as \"consultants\"."
 SYR_blockade_hezbollah:0 "Impose a Blockade against Hezbollah"
 SYR_blockade_hezbollah_desc:0 "Smuggling corridors on the Lebanese border are shut and Tehran's supplies can no longer cross Syria to Hezbollah. Merchants in the Bekaa complain that closing the border has cut normal trade too."
 SYR_boost_nuclear_research:0 "Advanced Nuclear Research"
 SYR_boost_nuclear_research_desc:0 "The national laboratory gets new centrifuge test rigs and stable electricity. The institute's head says they are getting closer to the line between \"what we can do\" and \"what we should not\"."
 SYR_bowels_desert:0 "Bowels of the Desert"
 SYR_bowels_desert_desc:0 "From Deir ez-Zor to Palmyra, the country's greatest wealth sleeps underground. Survey crews return to the desert with new seismic data, and the oil ministry prepares a contract template looser than any before."
 SYR_build_nuclear:0 "Syrian nuclear programme"
 SYR_build_nuclear_syr:0 "The Syrian Nuclear Deterrent"
 SYR_build_nuclear_syr_desc:0 "There is no turning back from this step. Once the news breaks, every neighbouring defence ministry will hold an emergency meeting and intelligence satellites will shift orbit. Syria gets the security guarantee it always wanted, and a pile of trouble it never imagined."
 SYR_build_pvos:0 "Integrated Air Defense Network"
 SYR_build_pvos_desc:0 "Nuclear facilities and institutes need protection. Air defence units build radar stations and anti-air sites around Homs and Damascus and share a data link with the army."
 SYR_business_with_uae:0 "Business with UAE"
 SYR_business_with_uae_desc:0 "Dubai's port and logistics companies add Syria to their new trade map. The two sides set up a joint chamber of commerce in Damascus."
 SYR_buy_military_hardware:0 "Buy Military Hardware"
 SYR_buy_military_hardware_desc:0 "Iranian defence firms offer artillery, missiles and drones at suspiciously low prices, on condition of long-term use of Iranian spare parts."
 SYR_cbs:0 "Commercial Bank of Syria"
 SYR_cbs_desc:0 "The Commercial Bank of Syria is the country's biggest bank and its biggest producer of bad loans. The reform makes it publish its balance sheet, brings in outside auditors and takes lending decisions out of the hands of politically appointed governors."
 SYR_cooperation_with_israel:0 "Cooperation with Israel"
 SYR_cooperation_with_israel_desc:0 "A bitter history does not vanish overnight, but necessity can force strange conversations. Through quiet channels and careful concessions, old enemies may yet become pragmatic partners."
 SYR_cooperation_with_yemen:0 "Cooperation with Yemen"
 SYR_cooperation_with_yemen_desc:0 "A Yemeni delegation visits Damascus and the two countries sign memoranda on exchanges of personnel, fishing and anti-piracy cooperation."
 SYR_covert_airforce_cooperation:0 "Covert Pilot Training in Egypt"
 SYR_covert_airforce_cooperation_desc:0 "Young Syrian pilots are sent to Egyptian air bases to learn to fly newer aircraft. The roster is locked in a safe and no press release mentions it."
 SYR_cultural_centers_initiative:0 "Cultural Centers Initiative"
 SYR_cultural_centers_initiative_desc:0 "Public libraries, theatres and youth centres go up in Aleppo, Homs and Latakia. It is a reminder to a whole generation that in the gaps between wars this country still has books to read and plays to see."
 SYR_direct_intervention:0 "Direct Intervention"
 SYR_direct_intervention_desc:0 "The opposition has decided it can no longer rely on speeches alone. Foreign boots, foreign planes and foreign guarantees may be the only way to keep the revolution alive until peace comes."
 SYR_disband_palest_militias:0 "Disband the Palestine Militias"
 SYR_disband_palest_militias_desc:0 "Armed factions in the camps are told to hand over their weapons in exchange for residency and reconstruction aid. Militia leaders refuse to attend the meeting and young men cover the walls in angry slogans."
 SYR_eastern_debt_negotiations:0 "Seek Eastern Financial Support"
 SYR_eastern_debt_negotiations_desc:0 "If Western terms are too harsh, Eastern capital is the alternative. Bankers in Moscow, Tehran, Beijing and the Gulf are all ready to lend with fewer political conditions; their conditions are just written on a different sheet of paper."
 SYR_empower_energy_ministry:0 "Empower the Energy Ministry"
 SYR_empower_energy_ministry_desc:0 "Concentrating generation, transmission, oil, gas and renewables in a single ministry has long been the technocrats' wish. The minister gets real power to coordinate across departments, and answers to the president directly for every blackout."
 SYR_establish_military_isr:0 "The Sword and the Olive Branch"
 SYR_establish_military_isr_desc:0 "Building on the joint border committee, the two armies set up a regular hotline and joint drills: confidence-building, and a way of keeping an eye on each other."
 SYR_european_education_support:0 "European Education Support"
 SYR_european_education_support_desc:0 "A modern Syria needs modern minds. By bringing in European educational assistance, scholarships and institutional guidance we can raise a generation that looks to the future rather than the ruins."
 SYR_expand_cement_industry:0 "Expand the Cement Industry"
 SYR_expand_cement_industry_desc:0 "The Adra and Tartus cement works are running flat out and still cannot meet reconstruction demand. New kiln lines, cleaner fuel and price oversight keep cement from becoming a profiteer's industry."
 SYR_federalization:0 "Federalization"
 SYR_federalization_desc:0 "Syria's future may depend on sharing power rather than hoarding it. A federal structure eases local tensions, strengthens regional responsibility and gives each community a stake in the republic."
 SYR_foreign_specialists:0 "Foreign Specialists"
 SYR_foreign_specialists_desc:0 "Foreign instructors and engineers hired by the UAE arrive in Syria. They appear on no official list, but every officer knows who is really teaching them."
 SYR_fortify_golan_heights:0 "Fortify Golan Heights"
 SYR_fortify_golan_heights_desc:0 "On land that cannot be retaken, the best course is to make the opponent pay too. Engineer corps are ordered to build a defence in depth on the Quneitra front: minefields, bunkers and anti-tank positions layered along the terrain."
 SYR_found_sgc:0 "Found the Syrian Gas Company"
 SYR_found_sgc_desc:0 "Gas has always been oil's afterthought, burned off in flare stacks. The new national gas company will collect associated gas and feed it to power stations and fertiliser plants."
 SYR_fund_shia_militias:0 "Fund the Shia Militias"
 SYR_fund_shia_militias_desc:0 "Tehran provides money, equipment and instructors; Syria provides bases and transit rights. Waves of volunteers from Iraq and Lebanon enter Syria and barracks fill with ever more accents."
 SYR_green_syria:0 "The \"Green Syria\" Project"
 SYR_green_syria_desc:0 "Solar, wind and efficiency works are written into the national development plan together. European energy firms are interested in exporting power northward, on condition that Syria's grid meets EU standards."
 SYR_guardians_of_revolution:0 "Guardians of the Revolution"
 SYR_guardians_of_revolution_desc:0 "Every revolution needs defenders who can guard it from old habits, old elites and old dictators. These guardians will stand watch over the new order until the republic is strong enough to defend itself."
 SYR_hat_tr_foreign_education:0 "Advanced Training Programs"
 SYR_hat_tr_foreign_education_desc:0 "Short courses with foreign specialists grow into long-term joint education: outstanding officers and engineers are sent to the Gulf and Europe and return as core staff."
 SYR_humanitarian_links_to_gaza:0 "Humanitarian Links to Gaza"
 SYR_humanitarian_links_to_gaza_desc:0 "Food, medicine and generators go to Gaza via Syria and Egypt. The name is humanitarian, the meaning political, and it is the most direct answer to the blockade."
 SYR_ideological_purity:0 "Ideological Purity"
 SYR_ideological_purity_desc:0 "We must keep our ideology pure. It attracts more followers and strengthens our position in the region. The price is that every compromise becomes harder."
 SYR_integrate_the_union:0 "Integrate the Union"
 SYR_integrate_the_union_desc:0 "The United Republic is no longer just a flag and a slogan: a unified parliament, army and currency advance on three fronts at once. A whole generation describes the day as \"coming home\"."
 SYR_intervene_in_yemen:0 "Intervene in Yemen"
 SYR_intervene_in_yemen_desc:0 "At the request of Gulf allies, Syria sends military advisers and a small task force to Yemen. It repays an ally and lets the army train on a real battlefield."
 SYR_invest_shair_gas_field:0 "Invest in Shair Gas Field"
 SYR_invest_shair_gas_field_desc:0 "The Shair gas field in the desert east of Homs is one of the country's main sources of natural gas. Funds are approved to expand the processing plant and pipeline; contractors must finish before the front shifts again."
 SYR_invite_egyptian_investors:0 "Invite Egyptian Investors"
 SYR_invite_egyptian_investors_desc:0 "Egyptian construction and food firms receive invitations with tax holidays and land-use concessions. The first merchants arrive in Damascus with samples and contracts."
 SYR_invite_mossad:0 "Invite Mossad"
 SYR_invite_mossad_desc:0 "Under a counter-terror banner, an Israeli intelligence liaison team quietly moves into Damascus. Its office is a few hundred metres from the presidential palace, a fact that alone can shift the regional balance."
 SYR_invite_scientists:0 "Foreign Scientists Initiative"
 SYR_invite_scientists_desc:0 "Generous pay, residency for the whole family and an undisturbed laboratory: a recruitment notice for nuclear physicists worldwide goes out quietly. Nobody asks too closely where the applicants come from."
 SYR_iran_riot_gear:0 "Iran Riot Gear"
 SYR_iran_riot_gear_desc:0 "Tehran has twenty years of experience in suppressing street protests and a full set of equipment. Shields, batons and loudspeaker trucks arrive in the Syrian interior ministry's warehouses."
 SYR_iran_syria_bank:0 "Iran-Syria Joint Bank"
 SYR_iran_syria_bank_desc:0 "Iran and Syria set up a joint bank in Damascus to provide settlement and credit for bilateral trade, in part to sidestep financial sanctions."
 SYR_iran_syria_pipeline:0 "Build a Syrian-Iranian Pipeline"
 SYR_iran_syria_pipeline_desc:0 "The pipeline from the South Pars field through central Iraq to the Mediterranean finally breaks ground. It is an energy corridor and the longest tie between Tehran and Damascus."
 SYR_iranian_investments:0 "Iranian Investments"
 SYR_iranian_investments_desc:0 "Iranian contractors take on Damascus power stations and a port expansion. One of the payment terms is a long-term crude and phosphate supply contract."
 SYR_iranian_specialists:0 "Iranian Specialists"
 SYR_iranian_specialists_desc:0 "Revolutionary Guard advisers and engineers move into Syrian barracks and factories. They bring experience, and their own chain of command."
 SYR_isis_negotiate:0 "Negotiate with ISIS"
 SYR_isis_negotiate_desc:0 "ISIS is a powerful force in the region, and we should negotiate to keep it on our side with terms that benefit both parties."
 SYR_issuing_jihad_orders:0 "Issuing Jihad Orders"
 SYR_issuing_jihad_orders_desc:0 "Jihad orders are issued to the troops so that every soldier understands he fights for the caliphate. Morale rises, and the state finds it harder to turn back."
 SYR_join_israeli_agreements:0 "Join the Abraham Accords"
 SYR_join_israeli_agreements_desc:0 "On a lawn in Washington, Syrian and Israeli representatives shake hands. It is the most surprising thaw in nearly half a century of Middle Eastern diplomatic ice."
 SYR_kings_highway:0 "Revive the King's Highway"
 SYR_kings_highway_desc:0 "The ancient King's Highway runs from Damascus to Aqaba across three thousand years of caravan history. A new road plan upgrades surfaces, bridges and border posts along it, making it southern Syria's trade corridor."
 SYR_kurds_agreement:0 "Kurds Agreement"
 SYR_kurds_agreement_desc:0 "The Kurdish question cannot be solved by force alone. A binding agreement that acknowledges their rights and aspirations may be the price of a stable and united Syria."
 SYR_little_hagia_sophia:0 "Little Hagia Sophia"
 SYR_little_hagia_sophia_desc:0 "Putting an old church that Turkey turned into a mosque on a UNESCO restoration list is a mild signal from Syria to the Orthodox world."
 SYR_liwa_al_quds:0 "Liwa al-Quds"
 SYR_liwa_al_quds_desc:0 "Palestinian youths from the Aleppo refugee camps are enlisted into the Syrian army and formed into a brigade named for \"Al-Quds\". Their mission is to defend Syria, and to wait for the day they can go home."
 SYR_military_coop_with_armenia:0 "Military Cooperation Pact with Armenia"
 SYR_military_coop_with_armenia_desc:0 "Yerevan and Damascus share concerns about a neighbour. Joint exercises, intelligence sharing and officer exchanges make their staffs familiar with each other's accents."
 SYR_mushriq_chase:0 "The Mushrik Hunt"
 SYR_mushriq_chase_desc:0 "The religious police are ordered to hunt everyone judged to be a mushrik. Minority sects flee the cities overnight, and the border camps fill with new faces."
 SYR_negotiate_golan_buy:0 "Negotiate Golan Buy"
 SYR_negotiate_golan_buy_desc:0 "The proposal nobody dares say aloud: trade money and security guarantees for land. Gulf and Western go-betweens shuttle between the two capitals with a draft of \"long lease, then return of sovereignty\"."
 SYR_negotiations_comission:0 "Negotiations Commission"
 SYR_negotiations_comission_desc:0 "Victory is not won on the battlefield alone. We set up a commission to speak to those who hesitate, offer terms to those who will lay down arms, and negotiate with the powers watching from afar."
 SYR_nuclear_program:0 "The Nuclear Program"
 SYR_nuclear_program_desc:0 "Beside the research reactor at Der Al-Hadjar, the Atomic Energy Commission quietly drafts a roadmap for expanding nuclear research. The official line is power generation; nobody can promise it will have only that purpose."
 SYR_overhaul_national_grid:0 "Overhaul the National Grid"
 SYR_overhaul_national_grid_desc:0 "Age and war have turned the national grid into a patchwork: substations lack parts, high-voltage lines hang on old steel cable, and Damascus loses power several times a day. The ministry draws up a full repair list: transformers first, trunk lines next, expansion last."
 SYR_palestinian_training_camps:0 "Palestinian Training Camps"
 SYR_palestinian_training_camps_desc:0 "Beside refugee camps in Syria, a few old barracks are converted into training camps. Palestinian youths, and Syrian volunteers too, learn guerrilla and urban warfare there."
 SYR_please_rojava:0 "Please Rojava"
 SYR_please_rojava_desc:0 "Damascus recognises Kurdish language and education rights in the northeast and lets local administrations keep part of the taxes, on condition that the flag stays the same."
 SYR_prepare_materials:0 "Uranium Mining and Milling"
 SYR_prepare_materials_desc:0 "Phosphate deposits in the desert carry traces of uranium. The metallurgy institute builds a small milling plant and sends samples to the laboratory; the data are not published."
 SYR_qatar_syria_pipeline:0 "Build the Qatar-Levant Pipeline"
 SYR_qatar_syria_pipeline_desc:0 "A gas pipeline from Qatar through Saudi Arabia and Jordan to Syria's Mediterranean coast has been written into drafts of regional cooperation again and again. Now the funding is finally in place."
 SYR_reform_construction_sector:0 "Reform the Construction Sector"
 SYR_reform_construction_sector_desc:0 "Construction is one of the most corrupt sectors in Syria: layered subcontracting, inflated quantities, shoddy work. The housing ministry publishes new building codes, tender rules and a blacklist."
 SYR_regional_alliance:0 "Regional Alliance"
 SYR_regional_alliance_desc:0 "The two homelands of the Ba'ath promise not to ally against each other and to form a common position on oil, water and borders."
 SYR_repression:0 "Create an Apparatus of Repression"
 SYR_repression_desc:0 "Police, intelligence and party cadres are rewoven into a fine mesh. Dissent on the street is hushed little by little while the Front's power becomes everywhere."
 SYR_restore_historical_sites:0 "Restore Historical Sites"
 SYR_restore_historical_sites_desc:0 "Palmyra, the old city of Damascus, the citadel of Aleppo, Krak des Chevaliers: half of this country's history is carved in stone. The antiquities service gets a dedicated budget and the help of international experts."
 SYR_restore_political_ties:0 "Restore Political Ties with Egypt"
 SYR_restore_political_ties_desc:0 "The flags rise again over the embassies between Cairo and Damascus. Two republics that once united sit once more at the same table."
 SYR_shiniest_democracy:0 "The Shiniest Democracy"
 SYR_shiniest_democracy_desc:0 "Reform is no longer a slogan but a performance, and Syria will put on its brightest possible face. Polish the institutions, publicise the victories, and show the region a democracy it has never seen."
 SYR_siib:0 "The First Islamic Bank"
 SYR_siib_desc:0 "The first bank operating under sharia law receives its licence, with Gulf investors among its shareholders. Its branches open in the old city of Damascus, giving devout merchants a place to save without compromising their faith."
 SYR_smuggle_oil_through_iraq:0 "Smuggling Iraqi Oil"
 SYR_smuggle_oil_through_iraq_desc:0 "Iraqi crude rides in tank trucks through a border post nobody inspects to the refinery at Baniyas. The business keeps no books, only understandings."
 SYR_stock_exchange:0 "Syria's Stock Exchange"
 SYR_stock_exchange_desc:0 "Preparations for the Damascus Securities Exchange have dragged on for years. This time the finance ministry has full listing rules, investor protections and a first list of companies."
 SYR_strategic_iran_supply:0 "Iranian Strategic Supplies"
 SYR_strategic_iran_supply_desc:0 "A supply line funded by Tehran by air and land brings a steady flow of ammunition, fuel and spare parts to Syria. The defence ministry's depots have a \"safety stock\" for the first time."
 SYR_streamline_energy_sector:0 "Streamline the Energy Sector"
 SYR_streamline_energy_sector_desc:0 "Subsidised tariffs leave energy companies in the red year after year and maintenance never gets funded. The new policy ties prices to costs, cuts redundant intermediaries and gives low-income households a power allowance."
 SYR_strongarm_minorities:0 "Strongarm Minorities"
 SYR_strongarm_minorities_desc:0 "The government raises local legions of mostly Assyrians and Christians to defend villages on the northeastern border, and to keep an eye on other armed groups."
 SYR_supply_pij:0 "Supply Palestinian Islamic Jihad"
 SYR_supply_pij_desc:0 "Damascus has long housed the offices of Islamic Jihad. Now the General Staff approves funds, ammunition and training places for it, which is enough to keep Western diplomats in meetings through the night."
 SYR_support_of_druzes:0 "Support of the Druzes"
 SYR_support_of_druzes_desc:0 "The Druze communities of the south have long lived between fear and loyalty. By guaranteeing their place in the new order we show that this Syria will not be built on the exclusion of minorities."
 SYR_support_sunnis:0 "Reaching Out to the Sunni World"
 SYR_support_sunnis_desc:0 "State media stops treating Sunni communities only as a \"problem\" and invites their scholars and merchants into government advisory bodies. Envoys from Saudi Arabia and Qatar sense the change in the wind."
 SYR_suppress_islamists:0 "Suppress Islamists"
 SYR_suppress_islamists_desc:0 "The opposition must decide where freedom ends and fanaticism begins. If the republic is to survive, extremists cannot be allowed to hijack the democratic project from within."
 SYR_suppress_kurds:0 "Suppress Kurds"
 SYR_suppress_kurds_desc:0 "The national security bureau outlaws Kurdish armed groups operating along the border, putting a border agreement with Turkey back on the table."
 SYR_suppress_traitors:0 "Suppress Traitors"
 SYR_suppress_traitors_desc:0 "Not everyone who walked among us was faithful. Spies, informants and those who traded the revolution for safety will be found."
 SYR_syria_isr_trade_pact:0 "Trade Pact with Israel"
 SYR_syria_isr_trade_pact_desc:0 "A freight route from Haifa to Latakia opens, with fruit, software and building materials re-exported via third countries. At first neither country's newspapers dared to carry the news."
 SYR_syrian_qatari_holding_company:0 "Syrian-Qatari Holding Company"
 SYR_syrian_qatari_holding_company_desc:0 "Doha's sovereign fund and Damascus entrepreneurs set up a holding company investing in hotels, telecoms and food processing."
 SYR_talk_to_gulf_states:0 "Talk to Gulf States"
 SYR_talk_to_gulf_states_desc:0 "The foreign minister tours the Gulf with a delegation, hoping to reconnect the trade lines, capital flows and cooperation agreements that were cut during the war years."
 SYR_to_sham_and_beyond:0 "To Sham and Beyond"
 SYR_to_sham_and_beyond_desc:0 "We will move our troops into Sham and beyond to carry our ideology to the world. From this moment no state will treat us as an ordinary neighbour."
 SYR_treasures_levantine_sea:0 "Treasures of the Levantine Sea"
 SYR_treasures_levantine_sea_desc:0 "Gas fields beneath the eastern Mediterranean make every diplomat in the region restless. Syria declares its exclusive economic zone and invites foreign energy companies to explore jointly, even as neighbours still quarrel over maritime borders."
 SYR_turkish_backing:0 "Turkish Defence"
 SYR_turkish_backing_desc:0 "Ankara sees our stability as vital to its own border security. Formalising ties brings modern equipment, logistical support and a powerful deterrent against our enemies."
 SYR_turkoman_militias:0 "Turkoman Militias"
 SYR_turkoman_militias_desc:0 "Turkoman villages in the north organise their own militias. Both Damascus and Ankara want them on their side; they themselves care about who can pay."
 SYR_uae_economic_cooperation:0 "Economic Cooperation with UAE"
 SYR_uae_economic_cooperation_desc:0 "The UAE's free-zone model is brought to the port of Latakia: tax exemption, one-stop approvals and residency permits for foreigners."
 SYR_uae_weapons:0 "Procurement Through the UAE"
 SYR_uae_weapons_desc:0 "Through Emirati re-export firms, Syria buys equipment and parts unavailable on the open market. Every order passes through intermediaries in three countries."
 SYR_us_support:0 "US Support"
 SYR_us_support_desc:0 "Washington will be asked to back the new civilian government with diplomatic recognition, political leverage and cautious influence. If the Americans invest in our future, Syria may yet become a partner."
 SYR_western_debt_negotiations:0 "Negotiate with Western Creditors"
 SYR_western_debt_negotiations_desc:0 "In meeting rooms in Paris and Brussels, a Syrian delegation brings a detailed repayment plan to talk restructuring: longer maturities and lower interest in exchange for commitments on market access and legal reform."
