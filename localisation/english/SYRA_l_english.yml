l_english:
 SYRA.1.a:0 "A fair race: equal airtime and funds for every party"
 SYRA.1.b:0 "Protect the Ba'ath edge: mobilize local branches and state media"
 SYRA.1.d:0 "The first election after the war is set for next month. Streets are hung with party posters: beside the Ba'ath's old slogans are the bright red and green posters of newly founded parties. The head of the electoral commission comes to the presidency to ask about the rules: should all parties start from the same line, or should the Ba'ath keep the \"natural advantage\" of its newspapers, television and local organization?"
 SYRA.1.t:0 "On the Eve of the Election"
 SYRA.3.a:0 "Read the warning in the votes: anti-corruption and term limits"
 SYRA.3.b:0 "Treat the win as a popular mandate: press ahead as planned"
 SYRA.3.d:0 "The count is over and the Ba'ath has won a clear parliamentary majority. Crowds flock to Damascus's central square to celebrate, but the party's secretary-general is far calmer in his internal speech: many votes were cast out of fear of war rather than love for the party."
 SYRA.3.t:0 "The Ba'ath Wins a Majority"
 SYRA.4.a:0 "A dignified handover: accept the result, the party goes into opposition"
 SYRA.4.b:0 "Bargain: hand over power if the army and intelligence keep a veto"
 SYRA.4.c:0 "Refuse: declare the election void and move the Republican Guard into the capital"
 SYRA.4.d:0 "The count is in: the Ba'ath has not kept its parliamentary majority and a new governing party has emerged. Late at night the lights stay on in the presidency. Army generals, the intelligence chiefs and party elders each ask to see the President; all of them want to know whether the Ba'ath will hand over power."
 SYRA.4.t:0 "The Ba'ath Loses"
 SYRA.5.a:0 "Continue"
 SYRA.5.d_bargain:0 "Power is handed over in a closed-door meeting late at night. The terms are not published, but every deputy knows that appointments to the defence ministry and the intelligence services require the old regime's consent. Democracy here comes with conditions."
 SYRA.5.d_peaceful:0 "On live television the President hands the keys of the presidential palace to the new prime minister. On camera two old rivals shake hands; in the squares some weep and some laugh. For the first time in almost sixty years, power in Syria has changed hands through the ballot."
 SYRA.5.t:0 "The Transfer of Power"
 SYRA.6.a:0 "Continue"
 SYRA.6.d_dem:0 "The democratic government's first year is bumpy: press freedom puts every scandal on the front page and debates in parliament drag on. But nobody has to fear a knock at the door at night anymore."
 SYRA.6.d_fas:0 "In the religious government's first year, mosque loudspeakers become the new government notice board. Secularist protests are dispersed by police, but Gulf aid arrives earlier than expected."
 SYRA.6.d_left:0 "The new left-wing government inherits the Ba'ath's state machinery and its debts. It promises to be cleaner and more open than its predecessor, but the voters' patience will not last long."
 SYRA.6.d_nat:0 "The nationalist government's first year is full of marches, parades and speeches about \"historical borders\". The army budget soars, and the neighbours' diplomats begin to phone each other often."
 SYRA.6.d_neu:0 "The coalition spends its first year in endless negotiations. Every bill needs the consent of three parties; progress is slow, but no faction feels left outside."
 SYRA.6.t:0 "The New Government's First Year"
 SYRA_TT_elections:0 "§YElections opened§!: start the election now, then every 4 years"
 SYRA_baath_renewal:0 "A Renewed Mandate"
 SYRA_baath_renewal_desc:0 "The voters have once again given the Ba'ath a majority. Old party hands call it \"the people's choice\", but younger cadres know better: it is a conditional mandate, with term limits, open books and zero tolerance for corruption. The party must deliver, or the next ballots will be less generous."
 SYRA_baath_renewal_idea:0 "A Renewed Mandate"
 SYRA_baath_renewal_idea_desc:0 "Voters give the Ba'ath a majority again, with conditions: term limits, open books and zero tolerance for corruption. The party must deliver."
 SYRA_baath_steps_down:0 "The Party Steps Aside"
 SYRA_baath_steps_down_desc:0 "The ballots have spoken. The Ba'ath hands over power within the constitutional framework: the Central Committee issues a statement accepting the result and instructs every party branch to cooperate in the transfer. The party will not vanish, but it must now learn to be an opposition, which for an organization that has governed for almost sixty years is harder than winning a war."
 SYRA_coalition_government:0 "A Coalition Government"
 SYRA_coalition_government_desc:0 "No party has an absolute majority. Technocrats, the moderate left and the secular centre agree on a joint programme: cabinet seats are shared in proportion to votes and the prime minister is chosen by a parliamentary majority. A coalition is not decisive, but at least no faction can own the state."
 SYRA_coalition_idea:0 "Coalition Government"
 SYRA_coalition_idea_desc:0 "Cabinet seats are shared in proportion to votes. No faction can own the state, and none can decide alone."
 SYRA_democratic_idea:0 "Democratic Transition"
 SYRA_democratic_idea_desc:0 "A new constitution, an independent judiciary and a free press set Syria on a long and uncertain road to democracy."
 SYRA_democratic_transition:0 "Democratic Transition"
 SYRA_democratic_transition_desc:0 "The new government is formed by democrats. Its first bills draft a new constitution, release political prisoners, reorganize the intelligence services and set up a \"truth and reconciliation commission\". The road is long: officials of the old order still hold many key posts, and expectations in the street are higher than any government can meet."
 SYRA_islamist_idea:0 "Religious Parties in Power"
 SYRA_islamist_idea_desc:0 "The mosque network becomes the government's most reliable grassroots organization, but allies of the secular state begin to drift away."
 SYRA_islamist_turn:0 "Religious Parties in Power"
 SYRA_islamist_turn_desc:0 "Religious parties become the largest bloc in parliament. The new government declares sharia the principal source of legislation and promises to \"bring the voice of the mosque into government\". Secularists and minorities are anxious, and Gulf money and Turkish attention both turn to the country."
 SYRA_nationalist_idea:0 "Nationalist Revival"
 SYRA_nationalist_idea_desc:0 "The banner of \"Greater Syria\" rises again and rebuilding the army becomes the first task of the state."
 SYRA_nationalist_turn:0 "The Nationalist Turn"
 SYRA_nationalist_turn_desc:0 "Syrian Social Nationalist and other nationalist forces win big. The new government raises the banner of \"Greater Syria\" and calls for rebuilding the army and revisiting borders with the neighbours. In the march outside parliament, the zawba'a emblem appears openly in front of the cameras for the first time."
 SYRA_old_guard_veto_idea:0 "Army and Intelligence Veto"
 SYRA_old_guard_veto_idea_desc:0 "The price of the Ba'ath handing over power: the army and intelligence services keep a veto on defence, foreign and security affairs. Every major decision of the new government must pass this gate first."
 SYRA_open_elections:0 "Open the Ballot Boxes"
 SYRA_open_elections_desc:0 "The war is over, and a Syria in ruins needs a new kind of legitimacy. The presidency announces that the elections required by the constitution will be held on time, with no prior vetting of parties and with international observers admitted. For a regime used to \"ninety-nine percent\", it is a real gamble: nobody can know in advance what the ballots will say."
 SYRL_TT_elections_allowed:0 "§YDemocratic elections allowed§!: the first election in one year, then every 4 years"
