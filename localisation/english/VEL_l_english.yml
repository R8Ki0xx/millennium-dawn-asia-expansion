 VEL_CHI.1.a:0 "Open the Election Center and start campaigning."
 VEL_CHI.1.d:0 "Election day is set for sixty days from now. The Central Election Commission has published the districts and seat allocation: populous provinces get more seats, and regions such as Tibet and Qinghai keep at least one each.\n\nCampaign headquarters open one after another. The Kuomintang stresses the economy and national unity, the Democratic Party local autonomy and transitional justice, the Social Democrats labor and welfare, and the Communist Party tries to rally support again in the old industrial Northeast and Hunan. Open the Election Center to see polls and the makeup of each province, and to hold rallies in a province of your choice."
 VEL_CHI.1.t:0 "The Legislative Yuan campaign begins"
 VEL_CHI.2.a:0 "Push the economy and market reform."
 VEL_CHI.2.b:0 "Push welfare and labor."
 VEL_CHI.2.c:0 "Push national unity and defense."
 VEL_CHI.2.d:0 "The campaign enters its hottest phase. In the televised debate the party leaders trade attacks over prices, cross-strait relations and local finances, and the moderator presses the government on how many promises it has kept in the past three years. Staffers believe that after tonight voters’ attention will settle, so it is time to decide which issue we push."
 VEL_CHI.2.t:0 "The campaign debate"
 VEL_CHI.3.a:0 "Wait for the count."
 VEL_CHI.3.d:0 "At dawn queues have formed outside polling stations across the country. From Harbin to Haikou, from Shanghai to Kashgar, voters step into the booths on the same day to choose a new Legislative Yuan.\n\nThe ballot boxes are sealed at dusk, and provincial results will be announced from east to west. Open the Election Center to watch the map fill in, province by province."
 VEL_CHI.3.t:0 "Election Day"
 VEL_CHI.5.a:0 "Accept the people’s verdict."
 VEL_CHI.5.d:0 "All provinces have finished counting. The new Legislative Yuan is seated as follows:\n\nKuomintang §Y[?VEL_CHI_ds_1|0]§! seats ([?VEL_CHI_pct_1|1]% of the vote)\nDemocratic Party §Y[?VEL_CHI_ds_2|0]§! seats ([?VEL_CHI_pct_2|1]%)\nSocial Democrats §Y[?VEL_CHI_ds_3|0]§! seats ([?VEL_CHI_pct_3|1]%)\nCommunist Party §Y[?VEL_CHI_ds_4|0]§! seats ([?VEL_CHI_pct_4|1]%)\nOthers §Y[?VEL_CHI_ds_5|0]§! seats ([?VEL_CHI_pct_5|1]%)\n\nUse the Election Center to look back at each province’s result."
