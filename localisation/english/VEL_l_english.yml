 VEL_USA.1.a:0 "Begin the election year."
 VEL_USA.1.d:0 "A new election year has begun. The parties’ national committees have published the primary calendar, state election officials start printing ballots, and political consultants in Washington spread last year’s polls across their desks and draw the lines between red, blue and swing states.\n\nOver the coming months each party will choose its nominee before the general campaign starts. The Election Center is open: you can view each state’s electorate and polls, and hold rallies in states of your choice during the campaign."
 VEL_USA.1.t:0 "The election year begins"
 VEL_USA.2.a:0 "Veteran senator (establishment): Thirty years in the Senate, he knows every line of the budget and is trusted by business and the military. Critics say he lacks fresh ideas."
 VEL_USA.2.b:0 "Populist businessman: A billionaire who has never held office, he talks about the border, tariffs and forgotten workers, and fills every rally."
 VEL_USA.2.c:0 "Moderate governor: A twice-reelected governor with balanced budgets and cross-party goodwill, though party conservatives dislike his social positions."
 VEL_USA.2.d:0 "The Republican primaries run through June. Three contenders fight for party voters on debate stages in every state: a veteran establishment senator, a sharp-edged populist businessman and a pragmatic moderate governor. Party elders privately lean toward one of them, but the final say lies with the convention.\n\nWho carries the banner will decide how voters see the party."
 VEL_USA.2.t:0 "The Republican primaries"
 VEL_USA.3.a:0 "Progressive senator: A champion of universal healthcare, a Green New Deal and free college, she is the favorite of the young and of unions, and her opponents call her radical."
 VEL_USA.3.b:0 "Centrist vice president: The sitting administration’s number two: steady, predictable, good at compromises between healthcare and budgets, well known but short on passion."
 VEL_USA.3.c:0 "Southern governor: A Democratic governor from a red state, devout and popular in Black churches and rural communities, but distrusted by progressives."
 VEL_USA.3.d:0 "The Democratic side is just as hard fought. A progressive senator surges among young voters and unions, the centrist vice president advances steadily on the resources of the sitting administration, and a governor from a red state builds support bit by bit in churches and rural communities.\n\nOn the eve of the convention all three argue over who is best placed to beat the other party."
 VEL_USA.3.t:0 "The Democratic primaries"
 VEL_USA.4.a:0 "Push the economy and taxes."
 VEL_USA.4.b:0 "Push healthcare and Social Security."
 VEL_USA.4.c:0 "Push immigration and the border."
 VEL_USA.4.d:0 "Push foreign policy and security."
 VEL_USA.4.t:0 "The presidential debate"
 VEL_USA.5.a:0 "Wait for the count."
 VEL_USA.5.d:0 "The first Tuesday in November. Polling places on the East Coast open at six in the morning, and the last voters on the West Coast finish after eight at night. On television a national map waits to be filled in with red and blue, state by state, with 270 electoral votes as the threshold for victory.\n\nOpen the Election Center and watch the votes come in, state by state."
 VEL_USA.5.t:0 "Election Day"
 VEL_USA.7.a:0 "Accept the people’s choice."
 VEL_USA.7.d:0 "All states have finished counting. The electoral vote:\n\nRepublican Party §Y[?VEL_USA_ds_1|0]§! votes ([?VEL_USA_pct_1|1]% of the popular vote)\nDemocratic Party §Y[?VEL_USA_ds_2|0]§! votes ([?VEL_USA_pct_2|1]%)\nThird parties and others §Y[?VEL_USA_ds_3|0]§! votes ([?VEL_USA_pct_3|1]%)\n\nThe winner will be sworn in in January."
 VEL_USA.7.t:0 "Presidential election results"
 VEL_USA.8.a:0 "Accept the voters’ verdict."
 VEL_USA.8.d:0 "Two years into the presidency the midterm elections arrive. Inflation, healthcare and the border leave voters in a complicated mood, and history is not encouraging: the president’s party usually loses seats at the midterms.\n\nWhen the votes are counted the balance of power in both chambers has shifted."
 VEL_USA.8.t:0 "The midterm elections"
