l_english:
 VEL_TAI.1.a:0 "Open the Election Center and start campaigning."
 VEL_TAI.1.d:0 "Election day is set for sixty days from now. The Central Election Commission has published the districts and seat allocation: New Taipei, Kaohsiung and Taipei get the most seats, while Penghu, Kinmen and Lienchiang keep one each.\n\nCampaign headquarters open one after another. The Kuomintang stresses the economy and cross-strait exchange, the DPP sovereignty and transitional justice, the People’s Party flies a “third way” banner, the People First Party works the grassroots in the center and south, and the Labor Party looks for a voice among unions and the young. Open the Election Center to see each county’s polls and electorate and to hold rallies in the counties you choose."
 VEL_TAI.1.t:0 "The Legislative Yuan campaign begins"
 VEL_TAI.2.a:0 "Push the economy and industry."
 VEL_TAI.2.b:0 "Push welfare and labor."
 VEL_TAI.2.c:0 "Push cross-strait ties and sovereignty."
 VEL_TAI.2.d:0 "Push transitional justice and identity."
 VEL_TAI.2.e:0 "Push integrity and political reform."
 VEL_TAI.2.t:0 "The campaign debate"
 VEL_TAI.3.a:0 "Wait for the count."
 VEL_TAI.3.d:0 "At dawn queues have formed outside polling stations across the island. From Keelung to Pingtung, from Hualien to Penghu, voters step into the booths on the same day to choose a new Legislative Yuan.\n\nThe ballot boxes are sealed at dusk, and county results will be announced from east to west. Open the Election Center to watch the map fill in, county by county."
 VEL_TAI.3.t:0 "Election Day"
 VEL_TAI.5.a:0 "Accept the people’s verdict."
 VEL_TAI.5.d:0 "All counties have finished counting. The new Legislative Yuan is seated as follows:\n\nKuomintang §Y[?VEL_TAI_ds_1|0]§! seats ([?VEL_TAI_pct_1|1]% of the vote)\nDemocratic Progressive Party §Y[?VEL_TAI_ds_2|0]§! seats ([?VEL_TAI_pct_2|1]%)\nPeople’s Party §Y[?VEL_TAI_ds_3|0]§! seats ([?VEL_TAI_pct_3|1]%)\nLabor Party §Y[?VEL_TAI_ds_4|0]§! seats ([?VEL_TAI_pct_4|1]%)\nPeople First Party §Y[?VEL_TAI_ds_5|0]§! seats ([?VEL_TAI_pct_5|1]%)\nRising parties §Y[?VEL_TAI_ds_x|0]§! seats ([?VEL_TAI_pct_x|1]%)\n\nThe party with the most votes and seats will see its leader become president and form the cabinet. Use the Election Center to look back at each county’s result."
